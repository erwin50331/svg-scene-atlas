<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>優勝美地隧道景觀的四季</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-99 優勝美地隧道景觀的四季｜紙雕立體光影 papercraft（剪紙層疊）
   地點：美國加州優勝美地國家公園・隧道景觀（Tunnel View）觀景台，
        站在瓦沃納隧道東口旁的石牆前往東看整座優勝美地谷：
        左邊是拔地而起約 900 公尺的酋長岩（El Capitan），東側邊緣有冬季才流的馬尾瀑布；
        中間遠方是半圓頂（Half Dome）與後面的雲歇峰；右邊是大教堂岩與新娘面紗瀑布（Bridalveil Fall），
        谷底是針葉林、草地與默塞德河；前景是石牆觀景台、步道、公路與隧道口。
   畫法：整幅畫由短筆觸堆疊，不描邊；紫色陰影、暖色受光筆觸、筆觸方向順著岩壁與地勢。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   --d-名稱 = 白天、--n-名稱 = 夜晚、--k-名稱 = 黃昏（--n／--k 可省略，省略時程式自動算出夜色與暮色）。
   會隨季節改變的顏色寫成 --sp-（春）、--su-（夏）、--au-（秋）、--wi-（冬）四個白天色。
   JS 依時間與季節混色，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（線色）兩個 class。
   沒有前綴的（例如 --sun）是固定色，不隨日夜改變。
   ========================================================= */
:root{
  color-scheme: light;
  /* —— 天空與雲 —— */
  --d-skyT:#4f8fd6; --k-skyT:#6a6aac; --n-skyT:#0b1230;
  --d-skyB:#c3def2; --k-skyB:#f7b48c; --n-skyB:#2a2f5c;
  --d-skyA:#78acdf; --k-skyA:#b48ab4; --n-skyA:#16204a;
  --d-skyD:#a6cdee; --k-skyD:#f2a48c; --n-skyD:#222a58;
  --d-skyC:#e4dcf2; --k-skyC:#ffd2a0; --n-skyC:#2c2a5c;
  --d-cloud:#fdfaf4; --k-cloud:#ffc8a6; --n-cloud:#3a4072;
  --d-cloudSh:#b8c4e0; --k-cloudSh:#c888a4; --n-cloudSh:#262c54;
  --d-rcloud:#9ba4b8; --k-rcloud:#9a8494; --n-rcloud:#2a2f48;
  --d-mist:#eef1f6; --k-mist:#f6cdbb; --n-mist:#3c4268;
  /* —— 遠山（雪線）、雲歇峰、半圓頂 —— */
  --d-far1:#93a3d6; --k-far1:#b08cb8; --n-far1:#1e2450;
  --d-far2:#bac5ea; --k-far2:#d2a2b8; --n-far2:#283060;
  --d-farSnow:#f6f8ff; --k-farSnow:#ffd8c8; --n-farSnow:#4c5484;
  --d-hd:#b4b2d6; --k-hd:#dfa0a8; --n-hd:#2b3058;
  --d-hdLt:#e8e0e0; --k-hdLt:#ffc49c; --n-hdLt:#3e4472;
  --d-hdSh:#8a8abc; --k-hdSh:#9a7aa8; --n-hdSh:#1c2048;
  /* —— 花崗岩（酋長岩、大教堂岩） —— */
  --d-gr:#c9c0b2; --k-gr:#dcb4a6; --n-gr:#393c5e;
  --d-grLt:#e6ddcc; --k-grLt:#f4cdb2; --n-grLt:#4c5074;
  --d-grWarm:#e0c29e; --k-grWarm:#f2b490; --n-grWarm:#3c3a5a;
  --d-grSh:#9a93b4; --k-grSh:#9a789c; --n-grSh:#252846;
  --d-grDk:#77708c; --k-grDk:#7a5a78; --n-grDk:#1c1e3a;
  /* —— 針葉林（四季常綠，夜色自動算） —— */
  --d-fo1:#33613f; --d-fo2:#4b7f4e; --d-fo3:#234838; --d-foLt:#86a866;
  --d-foFar:#5d7d74; --d-foFar2:#7f9c8c;
  /* —— 會隨季節變的植物與地面 —— */
  --sp-oak:#9ccd5c; --su-oak:#5c9846; --au-oak:#eaa43a; --wi-oak:#8c7c72;
  --sp-oak2:#cde27c; --su-oak2:#83b45a; --au-oak2:#da622e; --wi-oak2:#a89688;
  --sp-mead:#a9d26c; --su-mead:#d8c77a; --au-mead:#cc9c5a; --wi-mead:#eef2f7;
  --sp-mead2:#7fb85c; --su-mead2:#bca962; --au-mead2:#b27c48; --wi-mead2:#d6dfea;
  --sp-grd:#a29268; --su-grd:#b69e72; --au-grd:#a6895e; --wi-grd:#e8edf3;
  --sp-grd2:#83a05a; --su-grd2:#a7985e; --au-grd2:#94704a; --wi-grd2:#cdd7e3;
  --sp-dwLeaf:#8fc26a; --su-dwLeaf:#5d9a48; --au-dwLeaf:#c8443a; --wi-dwLeaf:#7c6c64;
  /* —— 河、瀑布、雪 —— */
  --d-riv:#7ea8c6; --k-riv:#d89a8c; --n-riv:#232c56;
  --d-rivHi:#eef6fa; --k-rivHi:#ffd8b0; --n-rivHi:#5a6494;
  --d-fall:#f6f9fd; --k-fall:#ffe4d0; --n-fall:#8c96bc;
  --d-fallSh:#c4d2e6; --n-fallSh:#4c5684;
  --d-snow:#f7f9fd; --k-snow:#ffe2d2; --n-snow:#8e97bc;
  /* —— 觀景台：石牆、步道、公路、隧道口 —— */
  --d-wall:#aaa194; --k-wall:#c89a86; --n-wall:#34344e;
  --d-wallLt:#d2c8b6; --k-wallLt:#f0b896; --n-wallLt:#45466a;
  --d-wallSh:#7c7488; --n-wallSh:#24243c;
  --d-walk:#bdb3a2; --k-walk:#d8ac92; --n-walk:#3a3a56;
  --d-walk2:#a69c8c; --n-walk2:#30304a;
  --d-road:#5c5d67; --n-road:#22222e;
  --d-road2:#72737e; --n-road2:#2a2a38;
  --d-roadLn:#ecd27a; --n-roadLn:#6a6040;
  --d-roadEdge:#e2ded2; --n-roadEdge:#4a4a5c;
  --d-tunDk:#22212a; --n-tunDk:#121018;
  --d-manz:#94402c; --d-manzLf:#6c8e5a;
  --d-bloom:#fbf8ef; --d-bark:#6e5040; --d-barkDk:#4a3428; --d-pine:#2c5236; --d-pine2:#447248;
  /* —— 人物 —— */
  --d-skin1:#f4d3b6; --d-skin2:#ddae88; --d-skin3:#b07e5c; --d-skin4:#7a5038;
  --d-hair1:#2b2428; --d-hair2:#6e4a2e; --d-hair3:#d8b26a; --d-hair4:#bdb5aa;
  --d-c1:#e0473c; --d-c2:#2f6fc2; --d-c3:#f4b43a; --d-c4:#3e9c6a; --d-c5:#8a5ac8;
  --d-c6:#f28aa8; --d-c7:#1f9ca2; --d-c8:#f6f2ea; --d-c9:#ea743a; --d-c10:#34405c;
  --d-p1:#3b4a6c; --d-p2:#6c5a48; --d-p3:#2a2c36; --d-p4:#8c917c;
  --d-ranger:#c2ae7e; --d-rangerP:#4e5e3c; --d-rangerHat:#8e6c44;
  --d-pack1:#d95a2e; --d-pack2:#3a7ab8;
  /* —— 車 —— */
  --d-car1:#cc4438; --d-car2:#ece9e0; --d-car3:#3a6fb2; --d-car4:#5c6e5c; --d-car5:#2c303a; --d-car6:#e8b43c;
  --d-glass:#a2c4da; --n-glass:#28344e;
  --d-tire:#1e1e24; --n-tire:#0e0e14;
  --d-bus:#2f7a8a; --d-busTop:#eee8d8;
  /* —— 動物 —— */
  --d-raven:#1e1e2a; --n-raven:#0c0c16;
  --d-jay:#2c62b4; --d-jayDk:#1c2442;
  --d-squirrel:#8c7a64; --d-squirrelLt:#d8cbb4;
  --d-deer:#977658; --d-deerLt:#ecdfc8; --d-deerDk:#3e3028;
  --d-hawk:#6c4428; --d-hawkLt:#e8d4b0; --d-hawkTail:#c0603a;
  --d-shadow:#1a20386b; --n-shadow:#00000088;

  /* —— 固定色：天體、燈光、特效 —— */
  --sun:#ffd47c; --sunCore:#fff4d2; --moon:#f6f0d8; --star:#fff8e2; --mw:#d8d2ff; --mw2:#ffe8d0;
  --alpen:#ff8a62; --fire:#ff5a1e; --fireHot:#ffc24a; --fireCore:#fff0b8;
  --lamp:#ffd88a; --head:#fff6c8; --tail:#ff3c2c; --phone:#cfe6ff;
  --rainbow1:#ff6b6b; --rainbow2:#ffc04a; --rainbow3:#fff07a; --rainbow4:#7ad88a; --rainbow5:#6ab0ff; --rainbow6:#a88aff;
  --rainc:#a9b8cf; --mshade:#4c5c94;
  --wx-cloud:#8e98a8; --wx-rain:#3e4c66; --wx-snow:#c8d2e4;
  --nightBase:#141a3e; --duskBase:#ff9a6a;

  /* —— 頁面介面 —— */
  --page-bg:#f5f3ee; --page-fg:#1e2a3e; --page-muted:#5f6878;
  --ui-surface:#ffffff; --ui-line:#d9dde4; --ui-accent:#d9622e; --ui-accent-2:#3a4ea8;
  --cine-shade:#000000; --cine-light:#fff3dc;
  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:14px;overflow:hidden;background:var(--skyB,#c3def2);line-height:0;box-shadow:0 2px 12px #0000001f}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:12px;padding:10px 14px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--page-fg);border-color:var(--page-fg);color:#fff;font-weight:700}
.panel button.big{border-color:var(--ui-accent);color:#fff;background:var(--ui-accent);font-weight:700}
.panel button.big.alt{border-color:var(--ui-accent-2);background:var(--ui-accent-2)}
.panel button.big.on{background:#f2b632;border-color:#f2b632;color:var(--page-fg)}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid var(--ui-accent);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable,#scene [role="button"]{cursor:pointer}
#scene .bubble rect{fill:#ffffff;stroke:#1e2a3e;stroke-width:1.6}
#scene .bubble text{fill:#1e2a3e;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .bubble .pop{animation:pop var(--dur,1.6s) ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){ #scene .bubble .pop{animation:none} }
/* 紙雕影子：同一份紙片的影子複本，隨太陽方向位移；k 越大代表紙片離背景越遠 */
#scene .shc,#scene .shc *{fill:var(--shadow)!important;stroke:var(--shadow)!important;pointer-events:none}
#scene .sh1{transform:translate(calc(var(--shx,-1.2)*1px),calc(var(--shy,2.4)*1px))}
#scene .sh2{transform:translate(calc(var(--shx,-1.2)*1.7px),calc(var(--shy,2.4)*1.7px))}
#scene .sh3{transform:translate(calc(var(--shx,-1.2)*2.6px),calc(var(--shy,2.4)*2.6px))}
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>
</head>
<body>
<main class="wrap">
  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：天空（筆觸、銀河、太陽月亮、雲）→ 遠景（雪山、雲歇峰、半圓頂）
       → 中景（酋長岩、大教堂岩、新娘面紗瀑布、谷底森林與默塞德河）
       → 近景（觀景台下的針葉林、騾鹿、黑橡樹、石牆、遊客、公路、車、隧道口、松枝）→ 天氣 → 表演氛圍
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="紙雕立體風格的優勝美地隧道景觀：左邊是高聳的酋長岩花崗岩壁，中間遠方是半圓頂，右邊是大教堂岩與新娘面紗瀑布，谷底是針葉林與默塞德河；前景是石牆觀景台上看風景、拍照的遊客，公路上的車從瓦沃納隧道開出來">
    <defs>
      <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--skyT)"/><stop offset="1" style="stop-color:var(--skyB)"/>
      </linearGradient>
      <radialGradient id="sunGlow"><stop offset=".2" style="stop-color:var(--sun);stop-opacity:.7"/><stop offset="1" style="stop-color:var(--sun);stop-opacity:0"/></radialGradient>
      <radialGradient id="moonGlow"><stop offset=".2" style="stop-color:var(--moon);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--moon);stop-opacity:0"/></radialGradient>
      <radialGradient id="lampG"><stop offset="0" style="stop-color:var(--head);stop-opacity:.95"/><stop offset="1" style="stop-color:var(--head);stop-opacity:0"/></radialGradient>
      <radialGradient id="fireG"><stop offset="0" style="stop-color:var(--fireHot);stop-opacity:.75"/><stop offset="1" style="stop-color:var(--fire);stop-opacity:0"/></radialGradient>
      <linearGradient id="beamG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--head);stop-opacity:.38"/><stop offset="1" style="stop-color:var(--head);stop-opacity:0"/></linearGradient>
      <!-- 高山餘暉：越高的岩壁越紅，岩腳漸漸淡掉 -->
      <linearGradient id="alpenG" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="0" y2="440"><stop offset="0" style="stop-color:var(--alpen);stop-opacity:1"/><stop offset=".55" style="stop-color:var(--alpen);stop-opacity:.55"/><stop offset="1" style="stop-color:var(--alpen);stop-opacity:0"/></linearGradient>
      <!-- 紙雕：會動的小物件用投影濾鏡；整張紙的纖維紋理 -->
      <filter id="pshS" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow id="pshSd" dx="-1.2" dy="2.4" stdDeviation="1" style="flood-color:#141a2c" flood-opacity=".38"/></filter>
      <filter id="paperTex" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9 .6" numOctaves="2" seed="7" result="n"/><feColorMatrix type="matrix" values="0 0 0 0 .35  0 0 0 0 .3  0 0 0 0 .22  0 0 0 -1.1 .62"/></filter>
      <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
      <clipPath id="frameClip"><rect x="0" y="0" width="1600" height="600"/></clipPath>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);
      }
      return _conn.call(this, dest, ...a);
    };
  }
  function stopAudio() {
    let longs = [], ctx = null;
    for (const s of srcs) {
      const c = s.context, now = c.currentTime, m = s.__ss; ctx = c;
      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }
    if (longs.length && ctx) {
      const g = outs.get(ctx), now = ctx.currentTime;
      if (g) {
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 1.1); g.gain.setValueAtTime(0, now + 1.2);
        g.gain.linearRampToValueAtTime(1, now + 1.9);
      }
      longs.forEach(s => { try { s.stop(now + 1.15); } catch (e) {} srcs.delete(s); });
    }
    srcs.clear();
  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');
    // 凍結色票：把目前的 CSS 變數抄到殘影上，底下換色不影響殘影
    const cs = getComputedStyle(svg);
    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }
      }
    }
    const par = svg.parentElement;
    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });
    added = [];
  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>
/* ---- 表演氛圍（取代寬銀幕黑邊）：k = 0~1，四周輕微暗角＋中央微亮 ---- */
let cineK = 0, cineW = 0;
function setCine(k, fx, fy) {
  cineK = k = Math.max(0, Math.min(1, k));
  if (k === cineW || (Math.abs(k - cineW) < .02 && k > 0 && k < 1)) return;
  cineW = k;
  const g = document.getElementById('cineFx'); if (!g) return;
  g.setAttribute('opacity', k.toFixed(3));
  if (fx != null) { const G = document.getElementById('cineLightG'); G.setAttribute('cx', (fx / 1600).toFixed(3)); G.setAttribute('cy', (fy / 600).toFixed(3)); }
}

/* =========================================================
   SC-99 優勝美地隧道景觀的四季｜程式區
   區塊：①工具、印象派筆觸、色票
         ②場景（天空與銀河、遠山與半圓頂、谷底、大教堂岩與瀑布、酋長岩、觀景台、公路、隧道口）

const RSLOPE = [[1186, 262], [1204, 258], [1252, 228], [1302, 196], [1362, 170], [1440, 150], [1520, 138], [1680, 126], [1680, 480], [1194, 480]];
const fall = { lines: [], flow: 1, sway: 0, gust: 0, rainbow: 0, rbBoost: 0 };
function drawCathedral() {
  const g = $('cathedral');
  const c = el('g', {}, g);
  hit(c, '大教堂岩：新娘面紗瀑布就在它旁邊');
  c.id = 'cathHit';
  const cTop = x => lineAt(CATH.slice(1, 18), x);
  // 岩塊：底色一層、左邊背光面一層、右邊受光面一層，再貼幾條垂直節理
  let s = `<path d="${poly(CATH)}" ${F('gr')}/>`;

  s += `<path d="${poly([[1100, 172], [1126, 172], [1150, 198], [1176, 252], [1192, 300], [1198, 470], [1146, 470], [1126, 340], [1110, 250]])}" ${F('grLt')}/>`;

  paper(c, s, 1);
  // 長滿樹的岩階（大教堂岩比酋長岩破碎，樹比較多）
  const ledges = [[990, 1062, 302], [1040, 1112, 250], [1100, 1150, 208], [980, 1100, 360], [1080, 1150, 320], [1140, 1180, 276]].map(([a, b, y]) => treeRow(a, b, x => y + Math.sin(x / 13) * 3, 8, 14, 3, 5, 6));

  c.snow = el('g', {}, c);
  P(c.snow, capPath(cTop, 972, 1186, 8) , 'f-snow');

  drawCathedral.c = c;
  // 右側森林坡：一排一排剪紙針葉樹由上往下疊，越下面越近、顏色越深；中間突出一塊斜塔岩
  const r = el('g', {}, g);
  const rTop = x => lineAt(RSLOPE.slice(0, 8), x);
  paper(r, `<path d="${poly(RSLOPE)}" ${F('fo2')}/>`, 1);
  const LT = [[1240, 262], [1254, 232], [1286, 212], [1304, 220], [1298, 252], [1276, 276], [1248, 280]];
  paper(r, `<path d="${poly(LT)}" ${F('gr')}/><path d="${poly([[1286, 212], [1304, 220], [1298, 252], [1276, 276], [1268, 250]])}" ${F('grSh')}/>`, 1);
  const rows = [[0, 'fo2', 16, 26], [34, 'foLt', 22, 34], [70, 'fo2', 26, 38], [112, 'fo1', 30, 44], [160, 'fo1', 34, 50], [212, 'fo3', 38, 54], [268, 'fo1', 40, 58], [320, 'fo3', 42, 60]];
  r.snow = el('g', {}, r);
  rows.forEach(([off, cls, h0, h1], i) => {
    const row = treeRow(1188 + (i ? 40 + i * 4 : 0), 1690, x => Math.min(486, rTop(x) + off + 6), h0, h1, h0 * .32, h0 * .42, h0 * .46);
    paper(r, `<path d="${row[0]}" ${F(cls)}/>`, 1);
    P(r.snow, row[1], 'f-snow');
  });
  r.appendChild(r.snow);
  drawCathedral.r = r;
  // 新娘面紗瀑布：白色紙條一層層疊成的水簾，從懸谷缺口落下，風吹時整條往旁邊飄
  const b = $('bridal');
  const fg = el('g', {}, b);
  hit(fg, '新娘面紗瀑布：落差約 188 公尺');
  fg.id = 'fallHit';
  el('rect', { x: 1170, y: 256, width: 46, height: 150, fill: 'transparent' }, fg);
  fall.g = el('g', {}, fg);
  paper(fall.g, `<path d="M1185 262 C1186 300 1184 350 1180 398 L1214 398 C1206 350 1196 300 1192 262Z" ${F('fallSh')}/><path d="M1187 262 C1188 300 1188 350 1186 398 L1208 398 C1202 350 1194 300 1190 262Z" ${F('fall')}/>`, 1);
  for (let i = 0; i < 7; i++) {
    const x0 = 1188 + (i - 3) * .7, x1 = 1196 + (i - 3) * 3;
    const l = P(fall.g, `M${f1(x0)} 262 C${f1(x0 + 2)} 300 ${f1(x1 - 3)} 350 ${f1(x1)} 396`, i % 2 ? 's-fallSh' : 's-fall', { 'stroke-width': f1(srand(1.6, 2.6)), 'stroke-linecap': 'round', 'stroke-dasharray': `${f1(srand(10, 22))} ${f1(srand(6, 12))}`, opacity: .9 });
    fall.lines.push({ el: l, sp: srand(70, 110), off: srand(0, 40) });
  }
  // 瀑布底的水霧：幾朵白色紙雲
  fall.mist = paper(fg, `<g transform="translate(1198 404)">${cloudHTML(80, 22, 'fall', 'fallSh')}</g>`, 2);
  // 午後的彩虹（春天水量大時最常見）：六條彩色紙條
  fall.rb = el('g', { opacity: 0, 'pointer-events': 'none' }, b);
  ['rainbow1', 'rainbow2', 'rainbow3', 'rainbow4', 'rainbow5', 'rainbow6'].forEach((k, i) => {
    const r0 = 48 - i * 3.4;
    P(fall.rb, `M${f1(1202 - r0)} 408 A${f1(r0)} ${f1(r0 * .9)} 0 0 1 ${f1(1202 + r0)} 408`, '', { style: `stroke:var(--${k});fill:none`, 'stroke-width': 3.4, opacity: .75 });
  });
}

/* ---------------- ② 場景：酋長岩（花崗岩巨壁、馬尾瀑布、攀岩者） ---------------- */
const ELCAP = [[-60, 480], [-60, 118], [30, 96], [90, 74], [160, 60], [230, 57], [290, 65], [340, 82], [385, 104], [420, 132], [448, 168], [468, 210], [486, 262], [502, 318], [520, 370], [548, 410], [600, 452], [600, 480]];
const capEdge = y => { const e = ELCAP.slice(8, 17); for (let i = 0; i < e.length - 1; i++) { const a = e[i], b = e[i + 1]; if (y >= a[1] && y <= b[1]) return a[0] + (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]); } return y < 104 ? 385 : 600; };
const capTop = x => lineAt(ELCAP.slice(1, 11), x);
const climbers = [];
const horse = { amt: 0, fire: 0 };
function drawElCap() {
  const g = $('elcap');

  s += `<path d="${poly(lit)}" ${F('grLt')}/>`;
  [[30, 22], [96, 30], [168, 18], [226, 26], [292, 20], [346, 16]].forEach(([x, w], i) => { s += `<path d="${strip(x, capTop(x) + 22, 440 - i * 6, w, 6)}" ${F(i % 2 ? 'grWarm' : 'gr')} opacity=".5"/>`; });
  [[62, 9], [128, 7], [196, 10], [258, 6], [318, 8], [372, 6], [12, 6], [150, 5]].forEach(([x, w], i) => { const y0 = capTop(x) + srand(18, 50); s += `<path d="${strip(x, y0, y0 + srand(90, 230), w, 4)}" ${F(i % 3 ? 'grSh' : 'grDk')} opacity=".38"/>`; });

  const base1 = treeRow(-60, 600, x => 438 + Math.sin(x / 40) * 6, 26, 44, 9, 13, 13);
  paper(c, `<path d="${topRow[0]}" ${F('fo3')}/><path d="${ledges.map(r => r[0]).join('')}" ${F('fo1')}/>`, 1);
  paper(c, `<path d="${base1[0]}" ${F('fo1')}/>`, 1);
  c.snow = el('g', {}, c);
  P(c.snow, capPath(capTop, -60, 430, 12), 'f-snow');
  P(c.snow, topRow[1] + ledges.map(r => r[1]).join('') + base1[1], 'f-snow');
  [[40, 160, 150], [180, 260, 228], [90, 200, 300], [260, 340, 360]].forEach(([a, b2, y]) => P(c.snow, capPath(x => y + Math.sin(x / 20) * 3, a, b2, 5), 'f-snow', { opacity: .9 }));

  // 馬尾瀑布：冬天到早春才有水，貼著酋長岩東側邊緣落下；火瀑時被夕陽照成火紅

/* ---------------- ④ 動畫：主步進 ---------------- */

    const L = LANES[lane];

    ws.forEach((w, i) => {
      let target = w.stop > 0 ? 0 : w.base * rainK;
      if (w.stop > 0) w.stop -= dt;
      const ahead = i > 0 ? ws[i - 1] : null;
      if (ahead) {

/* =========================================================

onAct($('portal'), () => {
  // 從隧道再開出一台車（車道上有空位才會出來）
  const c0 = cars.filter(c => c.lane === 0).sort((a, b) => b.x - a.x)[0];
  if (c0 && c0.x > 1560) c0.x = 1600;
  sfx(tunnelEcho);
  say(1500, 420, nextLine('tun', ['瓦沃納隧道：1933 年通車', '一開出隧道，整個山谷突然出現在眼前', '隧道長約 1.3 公里']), 2.2);
});
cars.forEach(c => onAct(c.g, () => {
  c.boost = 2;
  sfx(t => engine(t, c.bus ? .08 : .06));
  say(c.x, 500, c.bus ? nextLine('bus', ['遊覽車：載滿遊客來看隧道景觀', '下一站是谷底的遊客中心']) : nextLine('car', ['一開出隧道大家都想停車拍照', '車頂綁著獨木舟，要去默塞德河划船', '冬天這條路要帶雪鏈']), 1.8);
}));
onAct($('oak'), e => {
  if (e.target.closest && e.target.closest('[aria-label^="暗冠藍鴉"]')) return;
  oak.shake = 1.2; gust = 1;
  for (let i = 0; i < 8; i++) spawnLeaf(rand(1310, 1460), rand(320, 400), SW[3] > .5 ? 'snow' : SW[0] > .5 ? 'oak2' : 'oak');
  sfx(rustle);
  say(1390, 280, nextLine('oak', ['加州黑橡樹：秋天葉子變成金黃', '原住民會把橡實磨成粉來吃', '冬天葉子掉光，只剩灰褐色的枝條']), 2.2);
});
onAct(oak.jay, () => {
  oak.jhop = 1; oak.jx = oak.jx === 1336 ? 1420 : 1336; oak.jy = oak.jx === 1336 ? 380 : 352;
  sfx(jayCall);
  say(oak.jx, oak.jy - 40, nextLine('jay', ['暗冠藍鴉：頭上有黑色羽冠', '叫聲又尖又吵，常來討食物', '請不要餵牠喔']), 1.8);
});
onAct($('dogwood'), () => {
  for (let i = 0; i < 8; i++) spawnLeaf(rand(50, 180), rand(415, 450), SW[0] > .5 ? 'bloom' : 'dwLeaf');
  sfx(rustle);
  say(120, 380, nextLine('dw', ['太平洋山茱萸：春天開大大的白花', '秋天葉子變成紅色']), 2);
});
deers.forEach(d => onAct(d.el, () => { deers.forEach(x => x.alert = 3); sfx(snort); say(d.x, 410, nextLine('deer', ['騾鹿：耳朵大得像騾子', '傍晚常到草地吃草', '請保持距離，不要靠近']), 1.8); }));
wallLife.ravens.forEach(r => onAct(r.el, () => { if (r.fly > 0) return; r.fly = 3; sfx(t => { caw(t); flap(t + .1); }); say(r.home, 400, nextLine('raven', ['渡鴉：很聰明，會打開遊客的背包', '呱——呱——']), 1.6); }));
onAct(wallLife.sq.el, () => { const s = wallLife.sq; s.tx = clamp(s.x + rand(-260, 260), 60, 1380); s.up = .8; sfx(chirp); say(s.x, 420, '加州地松鼠：在石牆縫裡鑽來鑽去', 1.8); });
watchers.forEach(w => onAct(w.el, () => {
  if (w.kind === 'photo') { w.flash = .25; sfx(shutter); say(w.x, 410, nextLine('photo', ['等光線等了一個下午', '這個角度是經典的明信片構圖', '黃昏岩壁會變成粉橘色', '雪後放晴的時候最美']), 1.8); return; }
  if (w.kind === 'dad') { sfx(t => click(t, .04)); say(w.x, 360, nextLine('kid', ['爸爸，我看到瀑布了！', '那個岩壁上有人在爬！', '那顆是半圓頂嗎？']), 1.8); return; }
  sfx(t => click(t, .04));
  const lines = wx.rain > .5 ? (SW[3] > .5 ? ['下雪的山谷好安靜', '雪停了一定超美'] : ['下雨了，瀑布聲更大了', '雲在岩壁上飄來飄去']) : wx.mist > .5 ? ['雲霧散開的那一刻好神奇', '半圓頂快要露出來了'] : SW[2] > .5 ? ['秋天的橡樹好金黃', '瀑布水變少了'] : SW[1] > .5 ? ['好熱！但風景值得', '今天好多人在爬酋長岩'] : ['好壯觀！', '照片拍不出這種氣勢', '瀑布的聲音傳到這裡了'];
  say(w.x, 400, pick(lines), 1.8);
}));
onAct(watchers.ranger.el, () => { watchers.ranger.talk = 2.4; sfx(t => click(t, .04)); say(1160, 400, nextLine('ranger', ['請不要餵野生動物喔', '食物要收進防熊鐵箱', '冬天走這條路要帶雪鏈', '我們在瓦沃納隧道東口旁邊']), 2.2); });
// 步道上的遊客：停下來揮手說句話
['laneA', 'laneB'].forEach(id => $(id).addEventListener('click', e => {
  const p = svgPoint(e);
  let best = null, bd = 1e9;
  walkers.forEach(w => { const d = Math.abs(w.x + pxCur * 14 - p.x) + Math.abs(w.y - 28 * w.s - p.y) * .6; if (d < bd) { bd = d; best = w; } });
  if (!best || bd > 40) return;
  e.stopPropagation(); userGesture = true; ensureAudio();
  best.stop = 2.2;
  const lines = best.kid ? ['我想看熊！', '瀑布好高喔！'] : best.dog ? ['狗狗只能走鋪好的步道喔', '牠最愛聞松果'] : best.pack ? ['要從這裡走步道上靈感點', '背包裡有防熊罐'] : ['Hello！', '這就是隧道景觀！', '我們等一下去谷底'];
  sfx(steps);
  say(best.x + pxCur * 14, best.y - 76 * best.s, pick(lines), 1.8);
  if (reduced) renderStill();
}));

/* ---------------- ⑤ 互動：控制列 ---------------- */
function syncAuto() { $('btnAuto').setAttribute('aria-pressed', String(T.auto)); $('btnAuto').textContent = T.auto ? '自動播放中' : '自動播放'; }
function goTo(t) { if (reduced) { T.t = t; applyTime(true); renderStill(); } else T.target = t; }
const tap = fn => () => { userGesture = true; ensureAudio(); setTimeout(() => { fn(); if (reduced) settle(2); }, actx && actx.state !== 'running' ? 120 : 0); };
$('btnFire').addEventListener('click', tap(startFire));
$('btnStars').addEventListener('click', tap(startStars));
$('btnSeason').addEventListener('click', () => {
  userGesture = true; ensureAudio();
  if (show.on) { busy(); return; }
  setSeason((seasonI + 1) % 4);
  sfx(t => glock(t, hz([76, 79, 72, 84][seasonI]), .03));
  if (reduced) { applySeason(0); applyTime(true); applyWeather(0); renderStill(); }
});
$('btnWeather').addEventListener('click', () => {
  userGesture = true; ensureAudio();
  if (show.on) { busy(); return; }
  setWx((wxI + 1) % WX_LIST.length);
  if (reduced) { applySeason(0); applyWeather(0); renderStill(); }
});
$('btnSound').addEventListener('click', () => {
  soundOn = !soundOn; userGesture = true;
  $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  if (ensureAudio()) {
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.setValueAtTime(soundOn ? .5 : 0, actx.currentTime);
    if (!soundOn && musNode) { try { musNode.disconnect(); } catch (e) {} musNode = null; }
  }
});
$('btnDay').addEventListener('click', () => goTo(14 / 24));
$('btnNight').addEventListener('click', () => goTo(22 / 24));
$('btnAuto').addEventListener('click', () => { T.auto = !T.auto; T.target = null; syncAuto(); });
$('timeRange').addEventListener('input', e => {
  T.t = e.target.value / 1000; T.target = null; T.dragging = true; applyTime(true); T.dragging = false;
  if (reduced) renderStill();
});
mq.addEventListener?.('change', e => { reduced = e.matches; if (!reduced) { T.auto = true; syncAuto(); } start(); });

applySeason(10);
applyTime(true);
applyWeather(0);
syncAuto();
settle(.2);
start();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on,
  btn: { fire: 'btnFire', stars: 'btnStars' },
  save: () => ({ t: T.t, auto: T.auto, target: T.target, s: seasonI, w: wxI }),
  stop: () => { endShow(); horse.fire = 0; },
  restore: s => {
    setSeason(s.s); for (let k = 0; k < 4; k++) SW[k] = k === s.s ? 1 : 0; colorDirty = true;
    wxI = s.w; for (const k in wx) wx[k] = WX_LIST[s.w][0] === k ? 1 : 0;
    Object.assign(T, { t: s.t, auto: s.auto, target: s.target }); syncAuto();
    applyTime(true); renderStill();
  }
});
/* /ShowStop */
})();
</script>
</body>
</html>
