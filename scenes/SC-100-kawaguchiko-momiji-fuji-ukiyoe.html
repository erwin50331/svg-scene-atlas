<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>河口湖紅葉迴廊的逆富士</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-100 河口湖紅葉迴廊的逆富士｜浮世繪色塊
   地點：日本山梨縣・河口湖北岸的「紅葉迴廊」（もみじ回廊），每年十一月「富士河口湖紅葉祭」期間，
        沿湖小溪兩旁約 60 棵楓樹轉紅，傍晚開始夜間點燈；從北岸往南隔著湖看富士山（海拔 3,776 公尺）。
   畫面：左邊是天上山與上山的纜車，中間是頂著初雪的富士山，南岸溫泉旅館，湖面映出倒立的「逆富士」；
        湖上有遊覽船、天鵝船、釣魚小船與鴨子；北岸有出租小船的棧橋、架腳架的攝影師、湖畔步道，
        右邊是紅葉迴廊的楓樹、紅燈籠和紅葉祭的攤販（餺飥 ほうとう、甘酒、烤糰子），前景是芒草、小溪與長椅。
   畫法（浮世繪色塊）：普魯士藍的天空頂端暈色（一文字ぼかし）、橫向霞帶、粗墨線、平塗色塊、
        富士山身上的放射狀筋紋、湖面一道道小波紋、燈光倒影畫成直條紋、雨畫成細直斜線，整張疊一層和紙紋理。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   --d-名稱 = 白天、--n-名稱 = 夜晚、--k-名稱 = 晨昏、--l-名稱 = 夜間點燈時（只有楓樹有）。
   --n／--k 可省略，省略時程式自動算出夜色與暮色。JS 依時間內插，輸出成 --名稱，
   並自動產生 .f-名稱（填色）、.s-名稱（線色）兩個 class。沒有前綴的（例如 --ink）是固定色。
   ========================================================= */
:root{
  color-scheme: light;
  /* —— 天空、霞帶、雲 —— */
  --d-skyT:#1d4b8c; --k-skyT:#2c3b78; --n-skyT:#060d2a;
  --d-skyM:#86b5d4; --k-skyM:#c98a9a; --n-skyM:#13224f;
  --d-skyB:#f2e8cc; --k-skyB:#f7b97c; --n-skyB:#263565;
  --d-kasumi:#eeaa92; --k-kasumi:#f08866; --n-kasumi:#2f3166;
  --d-kasumi2:#f0d592; --k-kasumi2:#f5b55e; --n-kasumi2:#28305c;
  --d-cloud:#fbf5e6; --k-cloud:#f7cba8; --n-cloud:#2e3966;
  --d-cloudSh:#c9d2de; --k-cloudSh:#d09a9a; --n-cloudSh:#1f2850;
  --d-rcloud:#9aa1ae; --k-rcloud:#9a8c98; --n-rcloud:#262c44;
  --d-rcloudDk:#727a8a; --n-rcloudDk:#1a1e32;
  /* —— 富士山（藍色山體、初雪） —— */
  --d-fuji:#3c6ca6; --k-fuji:#5a5a98; --n-fuji:#16214a;
  --d-fujiDk:#1f3c78; --k-fujiDk:#34336e; --n-fujiDk:#0c1434;
  --d-fujiLt:#8aaccc; --k-fujiLt:#b48aa6; --n-fujiLt:#24325f;
  --d-snow:#fbf8f0; --k-snow:#ffd8c6; --n-snow:#a2aed0;
  --d-snowSh:#bccbe0; --k-snowSh:#d2a4b4; --n-snowSh:#5e6a96;
  /* —— 天上山、足和田山、南岸 —— */
  --d-hill:#335e4a; --n-hill:#0e1a26;
  --d-hill2:#5d8758; --n-hill2:#142430;
  --d-hillFar:#6f8f9e; --n-hillFar:#18243e;
  --d-autR:#c4462c; --d-autO:#df7d2e; --d-autY:#e2b443; --d-pineDk:#24473a;
  --d-bldg:#efe6d2; --d-bldg2:#d9cdb4; --d-roof:#5a4a44; --d-roof2:#3d4a5e;
  /* —— 湖 —— */
  --d-lakeT:#a8cbdc; --k-lakeT:#d8a49a; --n-lakeT:#1e2c5a;
  --d-lake:#4580ad; --k-lake:#4a5a8e; --n-lake:#0f1a3e;
  --d-lakeDk:#27527f; --k-lakeDk:#2e3a6a; --n-lakeDk:#0a1230;
  --d-lakeHi:#eef4f2; --k-lakeHi:#ffd8b8; --n-lakeHi:#3a4a7a;
  --d-wave:#1f4a78; --n-wave:#2a3c70;
  /* —— 北岸：石頭、步道、草、芒草、小溪 —— */
  --d-stone:#8f8c82; --d-stoneLt:#b9b5a8;
  --d-path:#ddc99e; --d-path2:#c5aa7a;
  --d-grass:#929d58; --d-grass2:#6f8046;
  --d-susuki:#eedcaa; --d-susukiSt:#b39a60;
  --d-stream:#4b88aa; --n-stream:#0e1a3a;
  /* —— 楓樹（--l- 是夜間點燈的顏色） —— */
  --d-mapleR:#cf3628; --l-mapleR:#ff5a36;
  --d-mapleO:#e8742c; --l-mapleO:#ff9a40;
  --d-mapleY:#eeb83c; --l-mapleY:#ffd662;
  --d-mapleD:#8e2024; --l-mapleD:#d23a2c;
  --d-trunk:#4a3226; --l-trunk:#7a4a30;
  /* —— 紅葉祭攤販、棧橋、船 —— */
  --d-wood:#a06c44; --d-woodDk:#6a4630;
  --d-tent:#f4efe2; --d-tentR:#cc2f2c; --d-noren:#24477c; --d-norenTx:#f8f2e4;
  --d-pot:#3a3a40; --d-dango:#f2e6c8; --d-sauce:#b8742e;
  --d-boatHull:#2c3e5c; --d-boatCab:#f2ece0; --d-boatRail:#c8382c; --d-boatWin:#5d8ab0;
  --d-row:#a8703e; --d-rowIn:#d8b88a; --d-swan:#fbf8f2; --d-beak:#ee8a2a;
  --d-rope:#d8c8a0; --d-gondola:#d8452e;
  /* —— 人物 —— */
  --d-skin1:#f3d4b6; --d-skin2:#e0b48e; --d-skin3:#b98462;
  --d-hair1:#1e1a1a; --d-hair2:#5a3a24; --d-hair3:#a8a29a;
  --d-c1:#c8322c; --d-c2:#24477c; --d-c3:#e2a93a; --d-c4:#3f7a5a; --d-c5:#7a4a8c;
  --d-c6:#e88aa0; --d-c7:#2f8c94; --d-c8:#f4eee0; --d-c9:#d8662e; --d-c10:#3a3a44;
  --d-p1:#2c3550; --d-p2:#6a5440; --d-p3:#24242c; --d-p4:#8a8f78;
  --d-kim1:#d9486a; --d-kim2:#3f6fb0; --d-kim3:#5f9a6a; --d-obi:#f2d27a; --d-kimDot:#fbf3e0;
  --d-umb1:#c8302a; --d-umb2:#e6eef2; --d-umb3:#2f3a52;
  /* —— 動物 —— */
  --d-duck:#8a7058; --d-duckHd:#2f7a4a; --d-duckF:#a08a6c;
  --d-heron:#a2a9b0; --d-heronDk:#4a4e58;
  --d-kite:#5e4434; --d-kiteLt:#a07c5c;
  --d-crow:#1c1a22; --d-cat:#f0e8da; --d-catP:#d08a44; --d-shiba:#d88a42;

  /* —— 固定色：墨線、天體、燈光、特效 —— */
  --ink:#231d1b;
  --sun:#e2432c; --sunHalo:#ffb07a; --moon:#f6efd2; --star:#fff6da;
  --lamp:#ffcf6a; --lampHot:#fff0b8; --chochin:#e03a2a; --spot:#ffd27a;
  --fujiPink:#ff8f9c; --rain:#c8d4e2; --fogc:#f4f0e6; --phone:#cfe6ff; --flash:#ffffff;
  --nightBase:#0e1636; --duskBase:#ff9566; --wxBase:#8a93a2;

  /* —— 頁面介面 —— */
  --page-bg:#f5f3ee; --page-fg:#1e2a3e; --page-muted:#5f6878;
  --ui-surface:#ffffff; --ui-line:#d9dde4; --ui-accent:#c8322c; --ui-accent-2:#24477c;
  --cine-shade:#000000; --cine-light:#fff3dc;
  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-sign:"Klee One","Yu Mincho","Hiragino Mincho ProN","Noto Serif JP","Noto Serif TC",serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:14px;overflow:hidden;background:var(--skyB,#f2e8cc);line-height:0;box-shadow:0 2px 12px #0000001f}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:12px;padding:10px 14px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--page-fg);border-color:var(--page-fg);color:#fff;font-weight:700}
.panel button.big{border-color:var(--ui-accent);color:#fff;background:var(--ui-accent);font-weight:700}
.panel button.big.alt{border-color:var(--ui-accent-2);background:var(--ui-accent-2)}
.panel button.big.on{background:#f2b632;border-color:#f2b632;color:var(--page-fg)}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid var(--ui-accent);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable,#scene [role="button"]{cursor:pointer}
#scene .ln{stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
#scene .ln2{stroke:var(--ink);stroke-width:2.3;stroke-linejoin:round;stroke-linecap:round}
#scene .lnT{stroke:var(--ink);stroke-width:.9;stroke-linejoin:round;stroke-linecap:round}
#scene .sign{font:700 11px var(--font-sign);fill:var(--norenTx);text-anchor:middle;dominant-baseline:central}
#scene .bubble rect{fill:#ffffff;stroke:#231d1b;stroke-width:1.6}
#scene .bubble text{fill:#231d1b;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .bubble .pop{animation:pop var(--dur,1.6s) ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){ #scene .bubble .pop{animation:none} }
</style>
</head>
<body>
<main class="wrap">
  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：天空（星、日月、霞帶、雲、老鷹）→ 遠景（天上山、富士山、足和田山、南岸旅館、纜車）
       → 湖（倒影、波紋、船、鴨子、霧）→ 北岸（石岸、棧橋、步道、楓樹、燈籠、攤販、攝影師、行人）
       → 前景（芒草、長椅、小溪、垂下的楓枝）→ 落葉 → 雨 → 和紙紋理 → 表演氛圍 → 對話泡泡
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="浮世繪風格的河口湖：中間是頂著初雪的藍色富士山，湖面映出倒立的富士，左邊是天上山與纜車；北岸是紅葉迴廊的楓樹、紅燈籠與紅葉祭的攤販，湖畔步道上有穿和服的遊客、健行的人、騎腳踏車的人，攝影師架著腳架拍富士山，湖上有遊覽船、天鵝船與鴨子">
    <defs>
      <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--skyT)"/><stop offset=".2" style="stop-color:var(--skyT)"/>
        <stop offset=".45" style="stop-color:var(--skyM)"/><stop offset=".9" style="stop-color:var(--skyB)"/>
      </linearGradient>
      <linearGradient id="fujiG" gradientUnits="userSpaceOnUse" x1="0" y1="80" x2="0" y2="336">
        <stop offset=".25" style="stop-color:var(--fujiDk)"/><stop offset=".7" style="stop-color:var(--fuji)"/><stop offset="1" style="stop-color:var(--fujiLt)"/>
      </linearGradient>
      <linearGradient id="hillG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--hill)"/><stop offset="1" style="stop-color:var(--hill2)"/>
      </linearGradient>
      <linearGradient id="lakeG" gradientUnits="userSpaceOnUse" x1="0" y1="334" x2="0" y2="460">
        <stop offset="0" style="stop-color:var(--lakeT)"/><stop offset=".35" style="stop-color:var(--lake)"/><stop offset="1" style="stop-color:var(--lakeDk)"/>
      </linearGradient>
      <radialGradient id="sunGlowG"><stop offset=".25" style="stop-color:var(--sunHalo);stop-opacity:.55"/><stop offset="1" style="stop-color:var(--sunHalo);stop-opacity:0"/></radialGradient>
      <radialGradient id="moonGlowG"><stop offset=".2" style="stop-color:var(--moon);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--moon);stop-opacity:0"/></radialGradient>
      <radialGradient id="lampG"><stop offset="0" style="stop-color:var(--lamp);stop-opacity:.8"/><stop offset="1" style="stop-color:var(--lamp);stop-opacity:0"/></radialGradient>
      <radialGradient id="litG"><stop offset="0" style="stop-color:var(--spot);stop-opacity:.42"/><stop offset="1" style="stop-color:var(--spot);stop-opacity:0"/></radialGradient>
      <linearGradient id="beamG" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--spot);stop-opacity:.5"/><stop offset="1" style="stop-color:var(--spot);stop-opacity:0"/></linearGradient>
      <radialGradient id="flashG"><stop offset="0" style="stop-color:var(--flash);stop-opacity:1"/><stop offset="1" style="stop-color:var(--flash);stop-opacity:0"/></radialGradient>
      <!-- 浮世繪的湖面小波紋（遠處小、近處大） -->
      <pattern id="wavePatF" width="46" height="12" patternUnits="userSpaceOnUse">
        <path d="M2 6q5 -4 10 0M25 11q5 -4 10 0" style="stroke:var(--wave)" fill="none" stroke-width="1"/>
      </pattern>
      <pattern id="wavePatN" width="74" height="20" patternUnits="userSpaceOnUse">
        <path d="M3 9q8 -6 16 0t16 0M40 18q8 -6 16 0" style="stroke:var(--wave)" fill="none" stroke-width="1.4"/>
      </pattern>
      <!-- 浮世繪的雨：細直斜線 -->
      <pattern id="rainPat" width="60" height="90" patternUnits="userSpaceOnUse">
        <path d="M8 0l-6 26M30 20l-7 30M52 4l-6 24M18 50l-7 32M44 58l-6 26M58 40l-5 22M4 70l-4 18" style="stroke:var(--rain)" stroke-width="1.1" stroke-linecap="round" opacity=".8"/>
      </pattern>
      <!-- 楓葉形狀（七裂掌狀葉，由 JS 產生路徑） -->
      <path id="leaf" d=""/>
      <clipPath id="frameClip"><rect x="0" y="0" width="1600" height="600"/></clipPath>
      <clipPath id="lakeClip"><rect x="-80" y="334" width="1760" height="126"/></clipPath>
      <clipPath id="streamClip"><path d="M860 560L1620 556V610H840Z"/></clipPath>
    </defs>

    <g clip-path="url(#frameClip)">
    <g id="world">
      <!-- ===== 場景：天空 ===== -->
      <rect id="skyHit" x="-60" y="-60" width="1720" height="720" fill="url(#skyG)"/>
      <g id="stars" pointer-events="none"></g>
      <g id="sun"></g>
      <g id="moon"></g>
      <g id="kasumiBack" pointer-events="none"></g>
      <g id="clouds" pointer-events="none"></g>
      <g id="kite"></g>

      <!-- ===== 場景：遠景與湖（同一層視差，倒影才對得齊） ===== -->
      <g id="parFar">
        <g id="farCore"></g>
        <g id="ropeway"></g>
        <g id="kasa" pointer-events="none" opacity="0"></g>
        <g id="fujiVeil" pointer-events="none" opacity="0"></g>
        <g id="kasumiFront" pointer-events="none"></g>
        <g id="lake"></g>
        <g id="refl" clip-path="url(#lakeClip)" pointer-events="none"><use href="#farCore" transform="matrix(1 0 0 -0.45 0 482.85)"/></g>
        <g id="townRefl" pointer-events="none"></g>
        <g id="waves" pointer-events="none" clip-path="url(#lakeClip)"></g>
        <g id="ripples" pointer-events="none"></g>
        <g id="boats"></g>
        <g id="ducks"></g>
        <g id="fogLake" pointer-events="none" opacity="0"></g>
      </g>

      <!-- ===== 場景：北岸（棧橋、步道、紅葉迴廊、攤販、人物） ===== -->
      <g id="parNear">
        <g id="shore"></g>
        <g id="ground"></g>
        <g id="trees"></g>
        <g id="lanterns"></g>
        <g id="stalls"></g>
        <g id="photogs"></g>
        <g id="customers"></g>
        <g id="laneA"></g>
        <g id="laneB"></g>
      </g>

      <!-- ===== 場景：前景（芒草、長椅、小溪、垂下的楓枝） ===== -->
      <g id="parFront">
        <g id="front"></g>
        <g id="branch"></g>
      </g>

      <!-- ===== 天氣與氛圍 ===== -->
      <g id="leaves" pointer-events="none"></g>
      <g id="rain" pointer-events="none" opacity="0"></g>
      <image id="washi" pointer-events="none" x="0" y="0" width="1600" height="600" preserveAspectRatio="none" opacity=".55"/>
    </g>
    <!-- 表演氛圍（取代寬銀幕黑邊）：四周輕微暗角＋中央微亮，緩緩淡入淡出 -->
    <g id="cineFx" opacity="0" pointer-events="none">
      <defs>
        <radialGradient id="cineShadeG" cx=".5" cy=".5" r=".72"><stop offset=".52" style="stop-color:var(--cine-shade);stop-opacity:0"/><stop offset="1" style="stop-color:var(--cine-shade);stop-opacity:.4"/></radialGradient>
        <radialGradient id="cineLightG" cx=".5" cy=".45" r=".5"><stop offset="0" style="stop-color:var(--cine-light);stop-opacity:.08"/><stop offset="1" style="stop-color:var(--cine-light);stop-opacity:0"/></radialGradient>
      </defs>
      <rect x="0" y="0" width="1600" height="600" fill="url(#cineShadeG)"/>
      <rect x="0" y="0" width="1600" height="600" fill="url(#cineLightG)"/>
    </g>
    <g id="bubbles" pointer-events="none"></g>
    </g>
  </svg>
  </figure>

  <!-- ===== 互動：控制列 ===== -->
  <div class="panel">
    <button id="btnLight" class="big" type="button">🍁 紅葉迴廊點燈</button>
    <button id="btnMirror" class="big alt" type="button">🗻 逆富士晨光</button>
    <button id="btnWeather" type="button">天氣：晴</button>
    <button id="btnTime" type="button">時段：白天</button>
    <button id="btnSound" type="button" aria-pressed="true">🔊 聲音：開</button>
    <button id="btnAuto" type="button" aria-pressed="true">自動播放</button>
    <label class="timebox" for="timeRange">
      <span>時間</span>
      <input id="timeRange" type="range" min="0" max="1000" value="458">
      <span class="clock" id="clock">11:00</span>
    </label>
  </div>
  <ul class="hint">
    <li><b>紅葉迴廊點燈</b>：天一黑，楓樹一棵棵亮起，紅葉像雪一樣落下。</li>
    <li><b>逆富士晨光</b>：晨霧散開、湖面靜下來，倒立的富士山染成粉紅。</li>

<script id="showstop">

   用法：放在場景主程式 <script> 之前；主程式最後呼叫

       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾

       after:   () => { ... },                  // （選用）最後再補的清理

           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，

    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);

  };

    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);

    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}

    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop

  const btns = [];

      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它

    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);

        const b = document.getElementById(id); if (!b) return;

            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }

      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();

}

/* 圓弧扇貝邊的團塊（楓樹樹冠、樹叢） */
function blob(cx, cy, rx, ry, n, jit = .12) {
  const pts = [];
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, k = 1 + srand(-jit, jit); pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]); }
  let d = `M${f1(pts[0][0])} ${f1(pts[0][1])}`;
  for (let i = 0; i < n; i++) {
    const a = pts[i], b = pts[(i + 1) % n];
    const ma = (i + .5) / n * Math.PI * 2, bulge = 1.16;
    d += `Q${f1(cx + Math.cos(ma) * rx * bulge)} ${f1(cy + Math.sin(ma) * ry * bulge)} ${f1(b[0])} ${f1(b[1])}`;
  }
  return d + 'Z';
}
/* 浮世繪雲：底平、上緣一連串圓弧 */
function cloudPath(w, h) {
  const n = Math.max(3, Math.round(w / 38)), bw = w / n;
  let d = 'M0 0';
  for (let i = 0; i < n; i++) d += `a${f1(bw / 2)} ${f1(h * (i === 0 || i === n - 1 ? .5 : srand(.7, 1)))} 0 0 1 ${f1(bw)} 0`;
  return d + 'Q' + f1(w / 2) + ' ' + f1(h * .22) + ' 0 0Z';
}
/* 霞帶：長條、兩端圓、上緣小波 */
function bandPath(w, h) {
  const r = h / 2;
  let d = `M${r} 0`;
  for (let xx = r; xx < w - r - 28; xx += 28) d += 'q7 -4 14 0t14 0';
  return d + `L${f1(w - r)} 0a${r} ${r} 0 0 1 0 ${h}H${r}a${r} ${r} 0 0 1 0 ${-h}Z`;
}

/* ---------------- ④ 動畫：日夜循環 ----------------

function updateHeron(dt) {
  const h = heron;
  h.t += dt;
  if (h.mode === 0) {
    h.peck = Math.max(0, h.peck - dt);
    if (Math.random() < dt * .08) h.peck = 1;
    const p = h.peck > 0 ? Math.sin((1 - h.peck) * Math.PI) : 0;
    h.neck.setAttribute('transform', `rotate(${f1(p * 50)} 4 -24)`);
    h.stand.setAttribute('transform', `scale(${h.dir} 1)`);
    h.stand.setAttribute('opacity', 1); h.fly.setAttribute('opacity', 0);
    h.g.setAttribute('transform', `translate(${f1(h.x)} ${h.y})`);
  } else {
    // 飛出去繞一圈再回來：去程往左、回程往右，身體朝向跟著飛行方向
    h.ft += dt; const k = h.ft / 6;
    const out = Math.sin(Math.PI * clamp(k, 0, 1));
    const goingOut = k < .5;
    h.x = h.hx - out * 380; const y = h.y - out * 120;
    h.stand.setAttribute('opacity', 0); h.fly.setAttribute('opacity', 1);
    const fl = Math.sin(clock * 9) * .3;
    h.fly.setAttribute('transform', `scale(${goingOut ? -1 : 1} ${f1(1 + fl)})`);
    h.g.setAttribute('transform', `translate(${f1(h.x)} ${f1(y)})`);
    if (k >= 1) { h.mode = 0; h.x = h.hx; h.dir = 1; }
  }
}

/* 步道行人：同一條道只往同一個方向走，前面有人就放慢、保持距離，不會穿模 */
function updateWalkers(dt) {
  [0, 1].forEach(li => {
    const L = LANES[li], dir = L.dir;
    const arr = walkers.filter(w => w.lane === li).sort((a, b) => (b.x - a.x) * dir);
    arr.forEach((w, i) => {
      w.stop = Math.max(0, w.stop - dt);
      let want = (show.on === 'light' && w.armUp ? .45 : 1) * w.v0 * (reduced ? 0 : 1) * (wx.rain > .5 ? 1.15 : 1);
      if (w.stop > 0) want = 0;
      // 跟前面的人保持距離
      const ahead = i > 0 ? arr[i - 1] : null;
      if (ahead && Math.abs(ahead.x - w.x) < 400) {
        const gap = (ahead.x - w.x) * dir - (ahead.w + w.w) * L.s - 6;
        if (gap < 30) want = Math.min(want, ahead.cur * clamp(gap / 30, 0, 1));
        if (gap < 0) want = 0;
      }
      w.cur += (want - w.cur) * Math.min(1, dt * 4);
      w.x += w.cur * dir * dt;
      // 走出畫面就從另一端回來（入口沒人才進場）
      if (w.x * dir > (dir > 0 ? 1700 : -100)) {
        const ent = dir > 0 ? -70 : 1670;
        const blocked = walkers.some(o => o !== w && o.lane === li && Math.abs(o.x - ent) < (o.w + w.w) * L.s + 20);
        if (!blocked) w.x = ent;
      }
      const s = L.s * w.h;
      w.ph += dt * w.cur * (w.bike ? .2 : w.o.kimono ? .5 : .32);
      if (w.bike) {
        w.wheels.forEach(sp => sp.setAttribute('transform', `rotate(${f1(w.ph * 57)})`));
        w.legs.forEach((l, k) => { const a = w.ph + k * Math.PI; const px2 = Math.cos(a) * 5, py2 = Math.sin(a) * 5; l.setAttribute('d', `M-6 -30L${f1(-2 + px2 * .5)} ${f1(-20 + py2 * .4)}L${f1(px2)} ${f1(-10 + py2)}`); });
      } else {
        const amp = w.cur > 1 ? (w.o.kimono ? 6 : 22) : 0;
        if (w.legF) { w.legF.setAttribute('transform', `rotate(${f1(Math.sin(w.ph) * amp)} 0 -27)`); w.legB.setAttribute('transform', `rotate(${f1(-Math.sin(w.ph) * amp)} 0 -27)`); }
        const armA = w.armUp ? w.armUp : (w.o.cane ? -18 + Math.sin(w.ph) * 8 : -Math.sin(w.ph) * amp * .7);
        w.armF.setAttribute('transform', `rotate(${f1(armA)} 0 -48)`);
        w.armB.setAttribute('transform', `rotate(${f1(Math.sin(w.ph) * amp * .7)} 0 -48)`);
        w.b.setAttribute('transform', `translate(0 ${f1(-Math.abs(Math.sin(w.ph)) * (amp ? 1.3 : 0))})`);
        if (w.dogLegs) w.dogLegs.forEach((l, k) => l.setAttribute('transform', `rotate(${f1(Math.sin(w.ph * 1.6 + k * 1.6) * (amp ? 24 : 0))} ${[-7, -4, 5, 8][k]} -8)`));
      }
      if (w.phEl) w.phEl.setAttribute('opacity', f1(w.armUp ? 1 : w.o.phone ? 1 : 0));
      w.g.setAttribute('transform', `translate(${f1(w.x)} ${L.y}) scale(${f1(s * dir)} ${f1(s)})`);
    });
  });
}

function say(x, y, text, dur = 1.6) {
  const g = el('g', { class: 'bubble' }, $('bubbles'));
  const inner = el('g', { class: 'pop', style: `--dur:${dur}s` }, g);
  const t = el('text', { x: 0, y: 0 }, inner);
  t.textContent = text;
  const w = Math.max(44, (t.getComputedTextLength() || text.length * 15) + 24);
  const r = el('rect', { x: f1(-w / 2), y: -15, width: f1(w), height: 30, rx: 15 });
  inner.insertBefore(r, t);
  x = clamp(x, w / 2 + 16, 1600 - w / 2 - 16); y = clamp(y, 30, 570);
  g.setAttribute('transform', `translate(${f1(x)} ${f1(y)})`);
  setTimeout(() => g.remove(), dur * 1000);
}

/* ---------------- 動畫主迴圈 ---------------- */
let last = 0, rafId = 0;
function loop(now) {
  const dt = clamp((now - last) / 1000, 0, .05); last = now;
  step(dt);
  rafId = requestAnimationFrame(loop);
}
function settle(sec) { for (let s = 0; s < sec; s += .05) step(.05); }
function renderStill() { step(.0001); }
function start() {
  cancelAnimationFrame(rafId);
  if (reduced) { T.auto = false; syncAuto(); applyTime(true); settle(1.5); }
  else { last = performance.now(); rafId = requestAnimationFrame(loop); }
}

  ripple(x, p.y, true); ripple(x, p.y, false);
  sfx(t => splash(t, .04));
  say(x, p.y - 30, nextLine('lake', ['河口湖：富士五湖裡最長的湖', '早上沒風的時候倒影最清楚', '湖裡可以釣黑鱸']), 1.8);
});
boats.forEach(b => onAct(b.g, () => {
  b.boost = 3;
  if (b.kind === 'cruise') { sfx(t => motor(t, .05, 1.6)); say(b.x, b.y - 60, nextLine('cruise', ['遊覽船繞湖一圈約 20 分鐘', '二樓甲板看富士山最清楚']), 2); }
  else { sfx(t => splash(t, .03)); say(b.x, b.y - 46, nextLine('swan', ['天鵝船：踩踏板前進', '我們要划到湖中央看富士山！']), 1.8); }
}));
onAct(fisher.g, () => {
  fisher.cast = 1.5; sfx(t => { noise(t, .3, 2400, .03, 'bandpass', 2, .02); splash(t + .7, .025); });
  say(fisher.x, fisher.y - 50, nextLine('fish', ['甩竿！', '釣到一條黑鱸！', '今天的魚很害羞']), 1.6);
});
onAct($('ducks'), () => {
  ducks.forEach((d, i) => { d.scat = 1.5; if (i % 2) d.dive = 1.4; });
  sfx(quack);
  say(ducks[2].x, 404, nextLine('duck', ['綠頭鴨：秋天從北方飛來過冬', '公鴨頭是綠色的，母鴨是褐色的', '倒立找水草吃']), 1.8);
});
onAct(heron.g, () => {
  if (heron.mode) return;
  heron.mode = 1; heron.ft = 0; sfx(flap);
  say(heron.x, 410, '蒼鷺：在岸邊一動也不動等魚', 1.8);
});
onAct($('pier'), () => { sfx(clack); moored.forEach(m => m.ph += 2); say(220, 390, nextLine('pier', ['出租小船：可以划到湖中央', '天鵝船也是在這裡租的']), 1.8); });
onAct(pierStaffR.g, () => { sfx(t => click(t, .04)); say(234, 380, nextLine('staff', ['要不要划船？一小時一千圓！', '救生衣要穿好喔']), 1.8); });
trees.forEach(tr => onAct(tr.g, () => {
  tr.shake = 1.4; gust = Math.max(gust, .8);
  for (let i = 0; i < 10; i++) spawnLeaf(tr.x + rand(-tr.rx, tr.rx) * .8, tr.cy + rand(-tr.ry, tr.ry) * .5);
  sfx(rustle);
  say(tr.x, tr.cy - tr.ry + 20, nextLine('maple', ['紅葉迴廊：約 60 棵楓樹排成紅色隧道', '十一月上旬到中旬最紅', '紅葉祭期間傍晚會點燈到晚上十點', '有些老楓樹超過百歲']), 2.2);
}));
onAct(branchG, () => { for (let i = 0; i < 8; i++) spawnLeaf(rand(1240, 1600), rand(40, 130)); sfx(rustle); });
stalls.forEach(s => onAct(s.g, () => {
  s.v.busy = 1.6;
  if (s.kind === 'pot') { sfx(sizzle); say(s.x, 370, nextLine('houtou', ['ほうとう：山梨的寬麵，跟南瓜一起燉味噌湯', '寒冷的秋夜吃一碗最暖', '來一碗嗎？熱騰騰的！'])); }
  else if (s.kind === 'cup') { sfx(t => { click(t, .04); noise(t + .1, .6, 900, .03, 'lowpass', .8, .1); }); say(s.x, 370, nextLine('ama', ['甘酒：米麴做的，不含酒精', '小朋友也可以喝喔'])); }
  else { sfx(sizzle); say(s.x, 370, nextLine('dango', ['烤糰子刷上甜醬油', '一串三顆，剛烤好的最好吃'])); }
}));
photogs.forEach(p => onAct(p.g, () => { p.fl = .25; sfx(shutter); say(p.x, p.y - 80, nextLine('photo', ['等了一早上，就等這一刻', '富士山＋紅葉＋倒影，三個都要拍到', '晴天的早上最容易拍到逆富士', '笠雲出現的時候最戲劇化']), 1.9); }));
customers.forEach(c => onAct(c.g, () => { sfx(t => click(t, .04)); say(c.x, c.y - 80, c.kid ? nextLine('kidc', ['我要三串糰子！', '甘酒好甜！']) : nextLine('cust', ['一碗ほうとう，謝謝！', '好香喔', '再買一串帶著走']), 1.6); }));
onAct(cat.g, () => { cat.up = 1.6; sfx(meow); say(1398, 440, nextLine('cat', ['喵～', '攤販的貓，每天都來這裡等吃的']), 1.6); });
crows.forEach(c => onAct(c.g, () => { if (c.fly > 0) return; c.fly = 3; sfx(t => { caw(t); flap(t + .1); }); say(c.hx, 370, '烏鴉：哇——哇——', 1.4); }));
onAct(bench, () => { sfx(t => click(t, .04)); say(470, 520, nextLine('bench', ['每年秋天我們都來這裡', '年輕時就在這張椅子上求婚的', '富士山今天特別清楚']), 2); });
susuki.forEach(S => onAct(S.g, () => { S.shake = 1.2; sfx(rustle); say(S.x, 470, nextLine('susuki', ['芒草：日本秋天的七草之一', '風一吹，穗子沙沙響']), 1.8); }));
onAct($('stream'), () => { sfx(t => splash(t, .03)); streamLeaves.forEach(L => L.v *= 1.8); setTimeout(() => streamLeaves.forEach(L => L.v /= 1.8), 2000); say(1200, 540, nextLine('stream', ['小溪流過紅葉迴廊，流進河口湖', '點燈的時候，楓葉倒映在溪水裡']), 2); });
// 步道上的行人：點了停下來說話、按鈴
['laneA', 'laneB'].forEach((id, li) => $(id).addEventListener('click', e => {
  const p = svgPoint(e);
  let best = null, bd = 1e9;
  walkers.forEach(w => { if (w.lane !== li) return; const d = Math.abs(w.x + pxCur * 12 - p.x); if (d < bd) { bd = d; best = w; } });
  if (!best || bd > 50) return;
  e.stopPropagation(); userGesture = true; ensureAudio();
  const L = LANES[li];
  if (best.bike) { sfx(bell); say(best.x, L.y - 76, nextLine('bike', ['叮鈴！借過一下～', '騎腳踏車繞湖一圈要兩個多小時']), 1.6); if (reduced) renderStill(); return; }
  best.stop = 2.2;
  sfx(t => click(t, .04));
  const lines = {
    '和服': ['穿租來的和服逛紅葉！', '跟富士山一起拍一張吧'], '健行': ['剛從天上山走下來', '下一站去大石公園'], '長輩': ['慢慢走，慢慢看', '楓葉一年比一年紅'],
    '爸爸': ['你看，那座就是富士山', '等一下去吃ほうとう'], '小孩': ['爸爸，富士山戴白帽子！', '我撿到一片好大的楓葉'], '情侶': ['等一下留下來看點燈吧', '這裡拍照好好看'],
    '遛狗': ['柴犬也來看紅葉', '牠最喜歡踩落葉'], '觀光客': ['第一次看到富士山！', '紅葉比照片還紅'], '拍照': ['手機也拍得到逆富士嗎？', '這張要當桌布']
  }[best.kind] || ['好美！'];
  const wet = wx.rain > .5 ? ['下雨了，富士山躲起來了', '雨中的紅葉更鮮豔'] : null;
  say(best.x, L.y - 80 * L.s * best.h, pick(wet || lines), 1.8);
  if (reduced) renderStill();
}));

/* ---------------- ⑤ 互動：控制列 ---------------- */
const TIME_SLOTS = [['清晨', 6.2], ['白天', 11], ['黃昏', 16.8], ['夜晚', 19.5]];
let slotI = 1;
function syncAuto() { $('btnAuto').setAttribute('aria-pressed', String(T.auto)); $('btnAuto').textContent = T.auto ? '自動播放中' : '自動播放'; }
function goTo(t) { if (reduced) { T.t = t; applyTime(true); renderStill(); } else T.target = t; }
const tap = fn => () => { userGesture = true; ensureAudio(); setTimeout(() => { fn(); if (reduced) settle(2); }, actx && actx.state !== 'running' ? 120 : 0); };
$('btnLight').addEventListener('click', tap(startLight));
$('btnMirror').addEventListener('click', tap(startMirror));
$('btnWeather').addEventListener('click', () => {
  userGesture = true; ensureAudio();
  if (show.on) { busy(); return; }
  setWx((wxI + 1) % WX_LIST.length);
  sfx(t => koto(t, hz([69, 72, 64, 67][wxI]), .035));
  if (wxI === 1) say(FX, 120, '富士山戴上笠雲了', 1.8);
  if (reduced) renderStill();
});
$('btnTime').addEventListener('click', () => {
  userGesture = true; ensureAudio();
  if (show.on) { busy(); return; }
  slotI = (slotI + 1) % TIME_SLOTS.length;
  $('btnTime').textContent = '時段：' + TIME_SLOTS[slotI][0];
  goTo(TIME_SLOTS[slotI][1] / 24);
});
$('btnSound').addEventListener('click', () => {
  soundOn = !soundOn; userGesture = true;
  $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  if (ensureAudio()) {
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.setValueAtTime(soundOn ? .5 : 0, actx.currentTime);
    if (!soundOn && musNode) { try { musNode.disconnect(); } catch (e) {} musNode = null; }
  }
});
$('btnAuto').addEventListener('click', () => { T.auto = !T.auto; T.target = null; syncAuto(); });
$('timeRange').addEventListener('input', e => {
  T.t = e.target.value / 1000; T.target = null; T.dragging = true; applyTime(true); T.dragging = false;
  if (reduced) renderStill();
});
mq.addEventListener?.('change', e => { reduced = e.matches; if (!reduced) { T.auto = true; syncAuto(); } start(); });

applyWeather(0);
applyTime(true);
syncAuto();
settle(.2);
start();

/* ---------------- 作者精選輪播 ----------------
   在網站精選區（pure 版、內嵌框）裡：先演一次「紅葉迴廊點燈」，之後停在點燈的夜晚，紅葉吹雪一直飄（紅葉特效開著）；
   音樂由網站的「聲音」按鈕透過 window.sceneMusic 開關，播放中每段曲子結束後會再接一次。 */
var pickAudio = false;
const inPicks = (() => { let top = true; try { top = window.top === window; } catch (e) { top = false; } return !!document.getElementById('pure-art') && !top; })();
if (inPicks) {
  T.auto = false; syncAuto();
  T.t = 16.2 / 24; setWx(0); applyTime(true);
  setTimeout(() => { startLight(true); blizzard = true; }, 600);
  let nextMus = 0;
  setInterval(() => {
    if (!pickAudio || !audioOK() || show.on) return;
    if (actx.currentTime >= nextMus) { nextMus = actx.currentTime + lightMusic(actx.currentTime + .1) + 1.5; duckSfx(21); }
  }, 1000);
  window.sceneMusic = {
    playing: false,
    start(c) {
      if (this.playing) return; this.playing = true; pickAudio = true; userGesture = true; soundOn = true;
      if (c && c !== actx) {
        actx = c;
        master = actx.createGain(); master.gain.value = .5;
        const comp = actx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3;
        master.connect(comp); comp.connect(actx.destination);
        sfxBus = actx.createGain(); sfxBus.connect(master);
        musBus = actx.createGain(); musBus.gain.value = .64; /* 音樂軌音量 ×0.64（2026-11-24 兩次各調降 20%） */ musBus.connect(master);
        amb = null;
      } else ensureAudio();
      const go = () => { if (show.on === 'light' && show.t < 3 && audioOK()) { nextMus = actx.currentTime + lightMusic(actx.currentTime + .05) + 1.5 - show.t; duckSfx(21); } else nextMus = 0; };
      if (actx.state === 'running') go(); else actx.resume().then(go).catch(() => {});
    },
    stop() { this.playing = false; pickAudio = false; if (musNode) { try { musNode.disconnect(); } catch (e) {} musNode = null; } },
    duck() {}
  };
}
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on || null,
  btn: { light: 'btnLight', mirror: 'btnMirror' },
  save: () => ({ t: T.t, auto: T.auto, wx: wxI }),
  stop: () => { endShow(); setCine(0); },
  restore: s => { if (wxI !== s.wx) setWx(s.wx); T.t = s.t; T.auto = s.auto; T.target = null; syncAuto(); applyTime(true); }
});
/* /ShowStop */
})();
</script>
