<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>維也納普拉特的雲霄飛車夜</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-91 維也納普拉特的雲霄飛車夜｜霓虹夜景（第一人稱：坐在飛車第一排）
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   ---------------------------------------------------------
   視角：你就坐在雲霄飛車第一排左邊的位子，眼前是往前延伸的軌道，
   畫面用簡單的 3D 透視投影即時計算：軌道、支柱、摩天輪、普拉特塔、
   遠方的維也納天際線，都會跟著飛車的位置、坡度與傾斜一起轉動。
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），部分另有 --k-名稱（晨昏）。
   JS 會依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）。
   地點是真實的維也納普拉特遊樂園區；雲霄飛車「DONAUBLITZ」、
   攤位與招牌名稱全部原創，沒有使用任何真實設施的品牌或商標。
   ========================================================= */
:root{
  color-scheme: dark;

  /* —— 天空與地面 —— */
  --d-sky-top:#4a95dc;  --k-sky-top:#3a3a86;  --n-sky-top:#040820;
  --d-sky-bot:#cfe6f6;  --k-sky-bot:#ff9a62;  --n-sky-bot:#1d1c44;
  --d-cloud:#ffffff;    --k-cloud:#ffc4a4;    --n-cloud:#22274a;
  --d-hill:#8fa6a0;     --k-hill:#7a6a8a;     --n-hill:#0c1028;     /* 維也納森林、卡倫山 */
  --d-city:#b4b6be;     --k-city:#8a7690;     --n-city:#0f1230;     /* 遠方市區 */
  --d-city-2:#9ea2ae;   --k-city-2:#76647e;   --n-city-2:#0b0d26;
  --d-river:#6fa8c8;    --k-river:#e0906a;    --n-river:#141a3e;    /* 多瑙河 */
  --d-ground:#7aa257;   --k-ground:#5a5a4a;   --n-ground:#0b1016;   /* 普拉特草地 */
  --d-ground-far:#a8bf8e; --k-ground-far:#8a7a6a; --n-ground-far:#161a30;
  --d-dot:#55803c;      --n-dot:#ffd27a;      /* 白天是草叢、夜裡是遊樂園的燈 */

  /* —— 地標 —— */
  --d-dom:#b9a78a;      --n-dom:#2c2636;      /* 史蒂芬大教堂 */
  --d-dom-roof:#3f7a6a; --n-dom-roof:#16242a;
  --d-dc:#7f9cb8;       --n-dc:#121a34;       /* 多瑙城高樓 */
  --d-donau:#e6e4dc;    --n-donau:#2a2a40;    /* 多瑙塔 */
  --d-rr:#a8322c;       --n-rr:#3a1420;       /* 摩天輪的紅色車廂 */
  --d-rr-steel:#5a5e66; --n-rr-steel:#262838; /* 摩天輪鋼架 */
  --d-pt:#d8dce4;       --n-pt:#2a2e46;       /* 普拉特塔 */
  --d-tree:#4f7f3a;     --n-tree:#0e1c18;     /* 七葉樹 */
  --d-tree-2:#3a6a2e;   --n-tree-2:#0a1412;
  --d-trunk:#6a4a34;    --n-trunk:#1a1416;

  /* —— 遊樂設施與攤位 —— */
  --d-booth:#f4ecdc;    --n-booth:#2c2638;
  --d-booth-2:#d8cbb2;  --n-booth-2:#1e1a2a;
  --d-board:#24324a;    --n-board:#0c0e1c;
  --d-awn-r:#d8403a;    --n-awn-r:#561c24;
  --d-awn-w:#fbf6ec;    --n-awn-w:#4a4456;
  --d-carou:#2f6a8a;    --n-carou:#162438;   /* 旋轉木馬（維也納人叫 Ringelspiel） */

  /* —— 雲霄飛車：軌道、支柱、月台、你坐的車廂 —— */
  --d-rail:#d23a2e;     --n-rail:#7a2430;
  --d-spine:#f0ece2;    --n-spine:#3a3c58;
  --d-tie:#4a4a56;      --n-tie:#14141e;
  --d-post:#e8e4da;     --n-post:#2c2e48;
  --d-plat:#c8c2b4;     --n-plat:#2a2838;
  --d-roof:#2f7a6a;     --n-roof:#10282a;
  --d-car:#d8302c;      --n-car:#8a2430;
  --d-car-dk:#9a1e1e;   --n-car-dk:#4a121c;
  --d-trim:#f2c14e;     --n-trim:#8a6a2a;
  --d-bar:#2a2a34;      --n-bar:#121218;
  --d-sleeve:#2f6ab8;   --n-sleeve:#1a2e5a;  /* 你穿的藍色外套 */
  --d-sleeve2:#e2574c;  --n-sleeve2:#5a2030; /* 隔壁乘客 */

  /* —— 人物 —— */
  --d-skin-1:#f4cfa8; --n-skin-1:#8e6e6a;
  --d-skin-2:#d9a37a; --n-skin-2:#7a5656;
  --d-skin-3:#a8724c; --n-skin-3:#5a3e3e;
  --d-skin-4:#6e4a33; --n-skin-4:#3a2830;
  --d-hair-1:#231a1c; --n-hair-1:#0e0a12;
  --d-hair-2:#6a4426; --n-hair-2:#2a1a1e;
  --d-hair-3:#e0b866; --n-hair-3:#6a5240;
  --d-cloth-1:#e2574c; --n-cloth-1:#6a2438;
  --d-cloth-2:#2f8fd6; --n-cloth-2:#1c3870;
  --d-cloth-3:#f2c14e; --n-cloth-3:#7a6030;
  --d-cloth-4:#3fae8c; --n-cloth-4:#1c5050;
  --d-cloth-5:#9b6bd6; --n-cloth-5:#4a3080;
  --d-cloth-6:#f08aa8; --n-cloth-6:#7a3a6a;
  --d-cloth-7:#f4f2ec; --n-cloth-7:#7a7894;
  --d-pants-1:#2c3a5c; --n-pants-1:#121a30;
  --d-pants-2:#4a4a52; --n-pants-2:#1a1a26;

  /* —— 不隨日夜變化：燈泡、霓虹 —— */
  --neon-red:#ff3b30; --neon-gold:#ffc83a; --neon-cyan:#3fd8ff; --neon-green:#4cf0a0; --neon-white:#fff6e0; --neon-pink:#ff7ac0;
  --bulb:#fff1b0; --win-on:#ffd98a; --sun:#fff2c4; --moon:#fff4dc; --star:#ffffff; --rain:#d6e0f4; --snow:#ffffff;
  --cine-shade:#000000; --cine-light:#fff1d6;

  /* —— 頁面介面 —— */
  --page-bg:#070b20; --page-fg:#f2eefc; --page-muted:#a3a2c4;
  --ui-surface:#111530; --ui-line:#2a2e58; --ui-accent:#ffc83a; --ui-hot:#ff3b30; --ui-hot2:#3fd8ff;
  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-sign:"Futura","Avenir Next","Century Gothic","Trebuchet MS",sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border:1px solid var(--ui-line);border-radius:10px;overflow:hidden;background:#040820;line-height:0}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:10px;padding:10px 14px}
.panel button{font:700 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1.5px solid var(--ui-line);
  border-radius:999px;padding:9px 15px;cursor:pointer;letter-spacing:.03em}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--page-bg)}
.panel button.big{border-color:var(--ui-hot);color:#fff;background:var(--ui-hot);box-shadow:0 0 12px #ff3b3088}
.panel button.big2{border-color:var(--ui-hot2);color:#06142a;background:var(--ui-hot2);box-shadow:0 0 12px #3fd8ff88}
.panel button.on{background:var(--ui-accent)!important;border-color:var(--ui-accent)!important;color:var(--page-bg)!important}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-hot2);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid var(--ui-hot2);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(220px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding:0;list-style:none;color:var(--page-muted);font-size:14px;line-height:1.8;display:flex;flex-wrap:wrap;gap:4px 22px}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .bubble path{fill:#101634;stroke:#ffc83a;stroke-width:1.6}
#scene .bubble text{fill:#fff8ea;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .sign{font-family:var(--font-sign);font-weight:800;text-anchor:middle;dominant-baseline:central}
@media (prefers-reduced-motion: reduce){ .panel button{transition:none} }
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 舞台
       world（整組會跟著飛車傾斜轉動）：天空 → 星星日月雲 → 遠山 → 市區天際線
         → 多瑙河 → 地面 → 地面燈點 → 物件（依遠近排序）→ 煙火 → 支柱 → 軌道 → 月台屋頂
       screen（固定在鏡頭上）：速度線、雨雪 → 你坐的車廂與雙手 → 對話泡泡 → 表演氛圍
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" role="img" aria-label="第一人稱坐在維也納普拉特的雲霄飛車第一排：眼前的軌道、百年摩天輪、普拉特塔與維也納夜景，移動滑鼠可以轉頭">
    <defs>
      <linearGradient id="skyGrad" gradientUnits="userSpaceOnUse" x1="0" y1="-400" x2="0" y2="300">
        <stop offset="0" style="stop-color:var(--sky-top)"/>
        <stop offset="1" style="stop-color:var(--sky-bot)"/>
      </linearGradient>
      <linearGradient id="groundGrad" gradientUnits="userSpaceOnUse" x1="0" y1="300" x2="0" y2="900">
        <stop offset="0" style="stop-color:var(--ground-far)"/>
        <stop offset=".35" style="stop-color:var(--ground)"/>
        <stop offset="1" style="stop-color:var(--ground)"/>
      </linearGradient>
      <radialGradient id="glowWarm">
        <stop offset="0" stop-color="#fff3c8" stop-opacity=".95"/>
        <stop offset=".35" stop-color="#ffcf7a" stop-opacity=".45"/>
        <stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="sunHalo">
        <stop offset="0" stop-color="#fff4d0" stop-opacity=".9"/>
        <stop offset="1" stop-color="#fff4d0" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="carShade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
        <stop offset=".35" stop-color="#ffffff" stop-opacity="0"/>
        <stop offset="1" stop-color="#000000" stop-opacity=".35"/>
      </linearGradient>
      <filter id="neon" x="-40%" y="-60%" width="180%" height="220%">
        <feGaussianBlur stdDeviation="2" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    </defs>

    <g id="world">
      <rect id="skyR" x="-1400" y="-3000" width="4400" height="6000" fill="url(#skyGrad)"/>
      <rect id="skyHit" x="-1400" y="-3000" width="4400" height="6000" fill="transparent"/>
      <path id="starsP" class="noHit" d="" stroke="var(--star)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <g id="sunG"></g>
      <g id="moonG"></g>
      <g id="cloudG" class="noHit"></g>
      <path id="hillP" class="noHit f-hill" d=""/>
      <path id="cityP" class="noHit f-city" d=""/>
      <path id="cityLights" class="noHit" d="" stroke="var(--win-on)" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0"/>
      <rect id="groundR" class="noHit" x="-900" y="300" width="3400" height="1600" fill="url(#groundGrad)"/>
      <path id="riverP" class="noHit f-river" d=""/>
      <path id="riverShine" class="noHit" d="" stroke="#ffffff" stroke-width="1" fill="none" opacity=".3"/>
      <path id="dot3" class="noHit" d="" style="stroke:var(--dot)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <path id="dot2" class="noHit" d="" style="stroke:var(--dot)" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path id="dot1" class="noHit" d="" style="stroke:var(--dot)" stroke-width="6" stroke-linecap="round" fill="none"/>
      <path id="platP" class="noHit f-plat" d=""/>
      <g id="bbG"></g>
      <g id="fwG" class="noHit"></g>
      <path id="postP" class="noHit f-post" d=""/>
      <path id="tieP" class="noHit f-tie" d=""/>
      <path id="spineP" class="noHit f-spine" d=""/>
      <path id="railP" class="noHit f-rail" d=""/>
      <path id="bulbOff" class="noHit" d="" stroke="#d9cfae" stroke-width="2" stroke-linecap="round" fill="none"/>
      <g id="bulbOn" class="noHit"></g>
      <path id="roofP" class="noHit f-roof" d=""/>
      <g id="airG" class="noHit"></g>
    </g>
    <g id="screenFx" class="noHit">
      <path id="speedP" d="" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0"/>
      <path id="wxP" d="" stroke="var(--rain)" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0"/>
      <rect id="flash" x="0" y="0" width="1600" height="600" fill="#fff6e0" opacity="0"/>
    </g>
    <g id="carG"></g>
    <g id="say" class="noHit"></g>
    <!-- 表演氛圍（不用寬銀幕黑邊）：表演時四周輕微變暗＋中央微微提亮，緩緩淡入淡出 -->
    <g id="cineFx" class="noHit" opacity="0" pointer-events="none">
      <defs>
        <radialGradient id="cineShadeG" cx=".5" cy=".5" r=".72"><stop offset=".52" style="stop-color:var(--cine-shade);stop-opacity:0"/><stop offset="1" style="stop-color:var(--cine-shade);stop-opacity:.4"/></radialGradient>
        <radialGradient id="cineLightG" cx=".5" cy=".45" r=".5"><stop offset="0" style="stop-color:var(--cine-light);stop-opacity:.08"/><stop offset="1" style="stop-color:var(--cine-light);stop-opacity:0"/></radialGradient>
      </defs>
      <rect x="0" y="0" width="1600" height="600" fill="url(#cineShadeG)"/>
      <rect id="cineLight" x="0" y="0" width="1600" height="600" fill="url(#cineLightG)"/>
    </g>
  </svg>
  </figure>

  <!-- =====================================================
       【互動】控制列（畫面中物件自己可以點的動作，這裡不再重複做按鈕）
       ===================================================== -->
  <div class="panel">
    <button id="btnRide" class="big" type="button">🎢 霓虹夜騎</button>
    <button id="btnNY" class="big2" type="button">🎆 跨年夜騎</button>
    <button id="btnWeather" type="button">天氣：晴</button>
    <button id="btnSound" type="button" aria-pressed="true">🔊 聲音：開</button>
    <button id="btnDay" type="button">☀ 白天</button>
    <button id="btnDusk" type="button">🌇 黃昏</button>
    <button id="btnNight" type="button">☾ 夜晚</button>
    <button id="btnAuto" type="button" aria-pressed="true">自動播放</button>
    <label class="timebox" for="timeRange">
      <span>時間</span>
      <input id="timeRange" type="range" min="0" max="1000" value="830">
      <span class="clock" id="clock">19:55</span>
    </label>
  </div>
  <ul class="hint">

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫

       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },

       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });

           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，

   ========================================================= */
(function () {
  'use strict';
  const W = window;

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */

  const zt = new Map();                  // id → { iv, keep }

  };

  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音

    const map = {};

    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}

      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);

  }

    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {

    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}

    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop

    zone = Math.max(0, zone - 1);

  }

  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);

            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);

      });

      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>
/* ---- 表演氛圍（取代寬銀幕黑邊）：k = 0~1，四周輕微暗角＋中央微亮 ---- */
let cineK = 0, cineW = 0;
function setCine(k, fx, fy) {
  cineK = k = Math.max(0, Math.min(1, k));
  if (k === cineW || (Math.abs(k - cineW) < .004 && k > 0 && k < 1)) return;
  cineW = k;
  const g = document.getElementById('cineFx'); if (!g) return;
  g.setAttribute('opacity', k.toFixed(3));
  if (fx != null) { const G = document.getElementById('cineLightG'); G.setAttribute('cx', (fx / 1600).toFixed(3)); G.setAttribute('cy', (fy / 600).toFixed(3)); }
}

/* =========================================================
   SC-91 維也納普拉特的雲霄飛車夜｜程式區
   區塊：①工具、色票、3D 投影
         ②場景（雲霄飛車軌道、天空、遠山與市區、多瑙河、地面、地標與攤位等「看板物件」）
         ③角色（你與隔壁乘客的手、月台與地面的人群、摩天輪車廂裡的人）
         ④動畫（主迴圈、日夜、天氣、飛車物理與鏡頭、燈泡、煙火、兩場秀）
         ⑤互動（點擊、滑鼠轉頭、聲音、控制列）
   ========================================================= */
(() => {
'use strict';

/* ---------------- ① 工具 ---------------- */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const root = document.documentElement;

const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const dayEls = [], litEls = [];

   投影：螢幕中心 (800, 300)，焦距 F 像素。 */
const F = 720, CX = 800, CY = 300, NEAR = .6;
const cam = { p: [0, 0, 0], f: [0, 0, 1], r: [1, 0, 0], u: [0, 1, 0], yaw: 0, pitch: 0, roll: 0, lookY: 0, lookP: 0 };

const scr = c => [CX + F * c[0] / c[2], CY - F * c[1] / c[2]];

function projDir(dx, dy, dz) {
  const zc = dx * cam.f[0] + dy * cam.f[1] + dz * cam.f[2]; if (zc < .05) return null;

// 多邊形：先換成鏡頭座標，裁掉鏡頭後方的部分再投影（月台屋頂、河面用）
function polyD(pts) {

    const a = cs[i], b = cs[(i + 1) % cs.length], ina = a[2] >= NEAR, inb = b[2] >= NEAR;

/* =========================================================

  [10, 4, 120, ''], [28, 13, 134, ''], [48, 20, 140, ''], [68, 17, 134, ''],
  [84, 8, 118, ''], [92, 4, 96, ''], [92, 13, 74, ''], [90, 15, 62, ''],
  [86, 5, 40, ''], [78, 3, 16, ''], [62, 9, -2, ''], [44, 12, -14, ''],
  [30, 6, -30, ''], [26, 4, -58, 'brake'], [20, 3, -88, 'brake'], [8, 2, -104, 'brake'], [-3, 2, -99, 'brake'], [-2, 2, -88, 'st']

const trk = { X: [], Y: [], Z: [], Fl: [], RX: [], RZ: [], L: 0 };
function buildTrack() {
  const n = TRK.length, g = i => TRK[(i + n) % n], raw = [];
  for (let i = 0; i < n; i++) {
    const p0 = g(i - 1), p1 = g(i), p2 = g(i + 1), p3 = g(i + 2);
    for (let k = 0; k < 30; k++) {
      const t = k / 30, t2 = t * t, t3 = t2 * t;
      const c = j => .5 * ((2 * p1[j]) + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3);
      raw.push([c(0), c(1), c(2), p1[3]]);

  for (let i = 1; i <= raw.length; i++) { const a = raw[i - 1], b = raw[i % raw.length]; cum.push(cum[i - 1] + Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2])); }

const CITY_R = 2200, HILL_R = 7000;
function ringPath(R, arr, step) {

/* =========================================================
   ② 看板物件（billboard）：在 3D 世界有一個位置，畫在「1 公尺 = 10 單位」的本地座標，
   每格依距離縮放；離得越遠越小、越淡（空氣透視）。依遠近排序決定前後。
   ========================================================= */
const BB = [];
function billboard(x, y, z, draw, o = {}) {
  const g = el('g', {}, $('bbG'));
  const inner = el('g', {}, g);
  const b = { x, y, z, g, inner, r: o.r || 30, name: o.name, normal: o.normal, zc: 0, vis: true, fog: o.fog ?? 1 };
  draw(inner, b);
  BB.push(b);
  return b;
}
let sortAcc = 0;
function updateBillboards(dt) {
  for (const b of BB) {
    const c = toCam(b.x, b.y, b.z);
    b.zc = c[2];
    let vis = c[2] > NEAR + .4;
    let sx = 0, sy = 0, k = 0;
    if (vis) { [sx, sy] = scr(c); k = F / c[2] / 10; const rad = b.r * 10 * k; if (sx + rad < -1000 || sx - rad > 2600 || sy - rad * 2.2 > 1500 || sy + rad < -1200) vis = false; }
    if (vis !== b.vis) { b.vis = vis; b.g.style.display = vis ? '' : 'none'; }
    if (!vis) continue;
    let fx = 1;
    if (b.normal) {   // 摩天輪這類平面物件：從側面看會變窄
      const vx = cam.p[0] - b.x, vz = cam.p[2] - b.z, h = Math.hypot(vx, vz) || 1;
      fx = Math.max(.22, Math.abs((vx * b.normal[0] + vz * b.normal[1]) / h));
    }
    b.sx = sx; b.sy = sy; b.k = k;
    b.g.setAttribute('transform', `translate(${f1(sx)} ${f1(sy)}) scale(${(k * fx).toFixed(4)} ${k.toFixed(4)})`);
    if (b.fog) { const o = (1 - clamp((b.zc - 300) / 3500, 0, .55) * (1 - night * .5)) * (1 - wx.snow * clamp(b.zc / 900, 0, .7)); const os = o.toFixed(2); if (os !== b.os) { b.os = os; b.g.setAttribute('opacity', os); } }
  }
  sortAcc += dt;
  if (sortAcc > .25) {
    sortAcc = 0;
    const order = BB.filter(b => b.vis).sort((a, b) => b.zc - a.zc);
    const G = $('bbG');
    let prev = null, changed = false;
    for (const b of order) { if (b.g.previousElementSibling !== prev && prev !== null) { changed = true; break; } prev = b.g; }
    if (changed || order.length && order[0].g !== G.firstElementChild) order.forEach(b => G.appendChild(b.g));
  }
}

  PT.h = c < 10 ? smooth(0, 10, c) : c < 28 ? 1 : c < 36 ? 1 - smooth(28, 36, c) : 0;
  PT.spin += ((c > 9 && c < 30 && !stormy() ? 1 : 0) - PT.spin) * Math.min(1, dt * .5);
  PT.rot = (PT.rot || 0) + PT.spin * dt * 1.6 * mv;
  if (!PT.b.vis) return;
  const y = -60 - PT.h * 1020, tilt = PT.spin * .8;
  PT.ring.setAttribute('transform', `translate(0 ${f1(y)})`);
  PT.crownBulbs.setAttribute('opacity', f1(lit));
  PT.seats.forEach(st => {
    const a = PT.rot + st.a, ca = Math.cos(a), sa = Math.sin(a);
    const rr = 60 + 70 * Math.sin(tilt), dy = 70 * Math.cos(tilt);
    st.ch.setAttribute('d', `M${f1(ca * 60)} ${f1(sa * 10)}L${f1(ca * rr)} ${f1(sa * 10 + dy - 6)}`);
    st.seat.setAttribute('transform', `translate(${f1(ca * rr)} ${f1(sa * 10 + dy)})`);
    st.s.setAttribute('opacity', sa < -.2 ? .55 : 1);
  });
  const bon = Math.floor(time / 1.2) % 2 === 0;
  PT.beacon.setAttribute('fill', bon ? '#ff3b30' : '#5a1a1a');
}

function stepCar(dt) {

  me.nb += ((thrill || me.nbT > 0 ? 1 : 0) - me.nb) * Math.min(1, dt * 5);
  const sh = Math.sin(time * 26) * clamp(train.v / 25, 0, 1) * 2.2 * (reduced ? 0 : 1);   // 高速時的震動
  const k = me.up, w = Math.sin(time * 7) * 10 * k;
  [[420, 610, 560, 548, 520, 300], [880, 610, 740, 548, 1000, 290]].forEach(([sx, sy, hx, hy, ux, uy], i) => {
    const x = lerp(hx, ux + (i ? w : -w), k), y = lerp(hy, uy, k) + sh;
    me.arms[i].setAttribute('d', `M${sx} ${sy}Q${f1(lerp(sx, x, .5) + (i ? 30 : -30) * (1 - k))} ${f1(lerp(sy, y, .6))} ${f1(x)} ${f1(y)}`);
    me.hands[i].setAttribute('transform', `translate(${f1(x)} ${f1(y)}) rotate(${f1((i ? 1 : -1) * (1 - k) * 70 + (i ? -12 : 12) * k)})`);

/* =========================================================
   ④ 時間與日夜
   ========================================================= */
const DAY_SEC = 150;
const T = { t: 19.9 / 24, auto: true, dragging: false };
let night = 0, dusk = 0, lit = 0, lastColor = -1, time = 0;
const S = { dim: 1, wave: 0 };
const lvl = solo => lit * (solo ? 1 : S.dim);
function applyLights() {
  for (const e of dayEls) { const o = f1(e.k * (1 - lit * .75)); if (e.o !== o) { e.o = o; e.n.setAttribute('opacity', o); } }
  for (const e of litEls) { const o = (e.k * lvl(e.solo) * (e.fl ?? 1)).toFixed(2); if (e.o !== o) { e.o = o; e.n.setAttribute('opacity', o); } }
}
function applyColors(force) {
  const key = Math.round(T.t * 1440);
  if (!force && key === lastColor) return;
  lastColor = key;
  const h = T.t * 24;
  night = clamp(1 - smooth(5.4, 7, h) + smooth(18.2, 19.8, h), 0, 1);
  dusk = Math.max(Math.exp(-Math.pow((h - 6.2) / .9, 2)), Math.exp(-Math.pow((h - 18.8) / .9, 2)));
  lit = clamp(1 - smooth(5.6, 6.8, h) + smooth(17.8, 19.1, h), 0, 1);
  for (const k in PAIRS) {
    const Pp = PAIRS[k];
    let c = mix(Pp.d, Pp.n, night);
    if (Pp.k) c = mix(c, Pp.k, dusk * .85);
    root.style.setProperty('--' + k, rgba(c));
  }
  $('clock').textContent = clockText();
  if (!T.dragging) $('timeRange').value = Math.round(T.t * 1000);
  $('cityLights').setAttribute('opacity', f1(night * .9));
  applyLights();
}
function clockText() { const m = Math.floor(T.t * 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
function setTime(h) { T.t = h / 24; T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false'); applyColors(true); }
// 太陽：從東邊（右手邊）升起、中午在南方、傍晚落到西邊

  NY_MEL.forEach(([b, k, len, m]) => { strings(m, t0 + b * bar + k * bt, len * bt - .03, .045, dest); if (b >= 3) glock(m + 12, t0 + b * bar + k * bt, .025, dest); });
  bellH(86, t0 + 3 * bar, .14, dest); bellH(74, t0 + 3 * bar + .02, .1, dest);    // 00:00 的鐘聲
  NY_FW.forEach(f => boomS(t0 + f[0] - .1, .12, dest));
  const te = t0 + 16 * bar;
  [50, 62, 66, 69, 74].forEach(m => strings(m, te, 1.4, .05, dest));
  pizz(38, te, .3, dest); glock(86, te, .06, dest); windRush(te - .6, 3, .14, dest); crash(te, .12, dest);
}

/* ---- 點擊音效 ---- */
const SFX = {
  ding: t => [72, 76, 79, 84].forEach((m, i) => glock(m, t + i * .07, .1)),
  chime: t => [76, 79, 84].forEach((m, i) => glock(m, t + i * .06, .09)),
  bell: t => { bellH(67, t, .18); bellH(67, t + .8, .14); },
  whee: t => windRush(t, 1.6, .22),
  clank: t => { for (let i = 0; i < 6; i++) clank(t + i * .18, .14); },
  boom: t => boomS(t, .3),
  tap: t => osc('triangle', 880, t, .08, envG(t, .002, .08, .1)),
  sizzle: t => nz(t, .9, 5000, .1, 'highpass', .8),
  pop: t => { for (let i = 0; i < 5; i++) { nz(t + i * .14, .04, 1500, .2, 'bandpass', 2); } [79, 84].forEach((m, i) => glock(m, t + .8 + i * .1, .08)); },
  candy: t => { const f = nz(t, 1.3, 600, .14, 'bandpass', 2); f.frequency.linearRampToValueAtTime(1600, t + 1.3); },
  bump: t => { [0, .3, .5].forEach(d => { nz(t + d, .12, 300, .3, 'lowpass', 1); osc('sine', 70, t + d, .1, envG(t + d, .003, .1, .2)); }); },
  calliope: t => [72, 76, 79, 76, 72].forEach((m, i) => { const g = holdG(t + i * .2, .02, .14, .05, .06); osc('sine', MF(m), t + i * .2, .25, g); osc('sine', MF(m) * 2, t + i * .2, .25, envG(t + i * .2, .02, .2, .02)); }),
  clap: t => { for (let i = 0; i < 24; i++) nz(t + Math.random() * 1.2, .03, 1600, .08, 'bandpass', 1); },
  sparkle: t => [84, 86, 88, 91, 93, 96].forEach((m, i) => glock(m, t + i * .04, .04)),
  flap: t => { for (let i = 0; i < 8; i++) nz(t + i * .07, .05, 900, .2, 'bandpass', 1.5); }
};
function sfx(name) { if (!ok()) return; bus('sfx'); SFX[name](actx.currentTime + .02); }
function rainSound(on) {
  if (!actx || !soundOn) { if (!on && rainNode) { rainNode.n.stop(); rainNode = null; } return; }
  if (on && !rainNode) {
    const n = noise(), hp = actx.createBiquadFilter(), g = actx.createGain();
    hp.type = 'highpass'; hp.frequency.value = 1300; g.gain.setValueAtTime(.0001, actx.currentTime); g.gain.linearRampToValueAtTime(.05, actx.currentTime + 1.5);
    n.connect(hp); hp.connect(g); g.connect(master); n.start(); rainNode = { n, g };
  } else if (!on && rainNode) { const r = rainNode; rainNode = null; r.g.gain.linearRampToValueAtTime(.0001, actx.currentTime + 1); r.n.stop(actx.currentTime + 1.1); }
}

/* ---------------- ⑤ 互動 ---------------- */
function onAct(node, fn) {
  node.addEventListener('click', e => { e.stopPropagation(); userGesture = true; ensureAudio(); fn(e); });
  node.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); userGesture = true; ensureAudio(); fn(e); } });
}
function svgPoint(e) { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; const m = svg.getScreenCTM(); return m ? p.matrixTransform(m.inverse()) : { x: 0, y: 0 }; }
const mouse = { x: 800, y: 300, on: false };
// 白天點天空：一群鴿子從眼前飛過（3D 世界裡的小鳥）
const birds = [];
function flock() {
  const ahead = [cam.p[0] + cam.f[0] * 40, cam.p[1] + 8, cam.p[2] + cam.f[2] * 40], dir = Math.random() < .5 ? -1 : 1;
  for (let i = 0; i < 7; i++) {
    const g = el('path', { d: 'M0 0C-3 -3 -7 -4 -11 -2C-7 -1 -3 0 0 2C3 0 7 -1 11 -2C7 -4 3 -3 0 0Z', fill: '#4a4a56' }, $('airG'));
    birds.push({ g, x: ahead[0] + rand(-10, 10), y: ahead[1] + rand(-3, 5), z: ahead[2] + rand(-10, 10), vx: cam.r[0] * dir * rand(8, 12), vz: cam.r[2] * dir * rand(8, 12), vy: rand(1, 3), t: 0, ph: rand(0, 6) });
  }
}
const RR_TIPS = ['維也納摩天輪：1897 年建成', '高約 65 公尺，紅色車廂像小木屋', '車廂亮起彩虹燈'];
const PT_TIPS = ['普拉特塔：117 公尺高的旋轉鞦韆', '座椅環會升到塔頂再轉起來'];
let rrTip = 0, ptTip = 0;
function bindAll() {
  onAct($('sunG'), () => { sfx('chime'); if (show.on) endShow(true); setTime(21.5); });
  onAct($('moonG'), () => { sfx('chime'); if (show.on) endShow(true); setTime(11); });
  $('skyHit').addEventListener('click', e => {
    userGesture = true; ensureAudio();
    if (night > .45) { const p = svgPoint(e); const dx = (p.x - 800) / F; launch(cam.p[0] + (cam.f[0] + cam.r[0] * dx) * 450, cam.p[2] + (cam.f[2] + cam.r[2] * dx) * 450, cam.p[1] + rand(50, 140), pick(NEONS.slice(0, 6)), pick(['peony', 'ring', 'willow', 'heart'])); setTimeout(() => sfx('boom'), 1000); }
    else { flock(); sfx('flap'); }
  });
  onAct(RR.bb.g, () => { RR.rainbow = 6; sfx('chime'); sayAt(RR.bb, RR_TIPS[rrTip++ % 3], 2.2, -40); });
  onAct(PT.bb.g, () => { PT.cyc = 9; sfx('sparkle'); sayAt(PT.bb, PT_TIPS[ptTip++ % 2], 2.2, -40); });
  onAct(LANDMARKS.dom.g, () => { sfx('bell'); sayAt(LANDMARKS.dom, '史蒂芬大教堂：南塔高 136 公尺', 2.4, -50); });
  onAct(LANDMARKS.dc.g, () => { sfx('chime'); sayAt(LANDMARKS.dc, '多瑙城：維也納最高的大樓群', 2.2, -50); });
  onAct(LANDMARKS.donau.g, () => { sfx('chime'); sayAt(LANDMARKS.donau, '多瑙塔：252 公尺，上面有旋轉餐廳', 2.4, -50); });
  [RR.bb, PT.bb, LANDMARKS.dom, LANDMARKS.dc, LANDMARKS.donau].forEach((b, i) => clickable(b.g, ['維也納摩天輪', '普拉特塔', '史蒂芬大教堂', '多瑙城高樓', '多瑙塔'][i] + '：點一下'));
  clickable(CAROU.bb.g, '旋轉木馬：點一下');
  onAct(CAROU.bb.g, () => { sfx('calliope'); CAROU.bulbs.rbT = 4; sayAt(CAROU.bb, '維也納人把旋轉木馬叫 Ringelspiel', 2.4, -20); });
  const auto = BB.find(b => b.name === 'auto');
  clickable(auto.g, '碰碰車：點一下');
  onAct(auto.g, () => { sfx('bump'); sayAt(auto, '碰碰車撞成一團！', 1.8, -20); });
  BOOTHS.forEach(b => {
    clickable(b.g, b.title + '：點一下');
    onAct(b.g, () => {
      b.set.boost = 3; setTimeout(() => b.set.boost = 0, 1600);
      const tips = { wurst: ['來一份維也納香腸！', 'sizzle'], langos: ['匈牙利炸麵餅，抹大蒜酸奶', 'sizzle'], candy: ['棉花糖現做！', 'candy'], shoot: ['打中氣球拿獎品', 'pop'] }[b.kindB];
      sfx(tips[1]); sayAt(b, tips[0], 1.8, -20);
    });
  });
  crowds.forEach(c => { clickable(c.g, '人群：點一下'); onAct(c.g, () => { c.wave = 2.4; sfx('clap'); sayAt(c, pick(['看我們這邊！', '加油～', '好勇敢！', 'Servus！']), 1.6, -20); }); });
  onAct(me.hit, () => { me.upT = 2.4; sfx('whee'); say(760, 230, pick(['哇～！', '好刺激！', '再快一點！']), 1.6); });
  onAct(me.nbHit, () => { me.nbT = 2.4; sfx('tap'); say(1360, 250, pick(['我不敢看！', '再來一次！', '風好大！']), 1.6); });
  svg.addEventListener('pointermove', e => { const p = svgPoint(e); mouse.x = p.x; mouse.y = p.y; mouse.on = true; });
  svg.addEventListener('pointerleave', () => { mouse.on = false; });

  $('btnRide').addEventListener('click', () => { userGesture = true; ensureAudio(); startShow('ride'); });
  $('btnNY').addEventListener('click', () => { userGesture = true; ensureAudio(); startShow('ny'); });
  $('btnWeather').addEventListener('click', () => { userGesture = true; ensureAudio(); setWeather((wxIdx + 1) % WX.length); });
  $('btnSound').addEventListener('click', () => {
    soundOn = !soundOn; userGesture = true; ensureAudio();
    if (master) master.gain.setValueAtTime(soundOn ? .55 : 0, actx.currentTime);
    if (!soundOn) { stopAll(); rainSound(false); try { window.sceneMusic && window.sceneMusic.stop(); } catch (e) {} } else rainSound(WX[wxIdx][0] === 'rain');
    $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  });
  $('btnDay').addEventListener('click', () => { if (show.on) endShow(true); setTime(11); });
  $('btnDusk').addEventListener('click', () => { if (show.on) endShow(true); setTime(18.9); });
  $('btnNight').addEventListener('click', () => { if (show.on) endShow(true); setTime(22); });
  $('btnAuto').addEventListener('click', () => { T.auto = !T.auto; $('btnAuto').setAttribute('aria-pressed', String(T.auto)); });
  const tr = $('timeRange');
  tr.addEventListener('input', () => { if (show.on) endShow(true); T.dragging = true; T.t = tr.value / 1000; applyColors(true); });
  tr.addEventListener('change', () => { T.dragging = false; });
  window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
  window.addEventListener('pointerdown', () => document.body.classList.remove('kbd'));
  mq.addEventListener && mq.addEventListener('change', () => { reduced = mq.matches; });
}

/* ---------------- ④ 主迴圈 ---------------- */
let last = performance.now(), colorAcc = 0, bulbAcc = 0;
function loop(now) { const dt = Math.min(.1, (now - last) / 1000); last = now; step(dt); requestAnimationFrame(loop); }
function step(dt) {
  time += dt;
  const mv = reduced ? 0 : 1;
  if (show.on) stepShow(dt);
  else { if (T.auto && !T.dragging && !reduced) T.t = (T.t + dt / DAY_SEC) % 1; if (cineK > 0) setCine(cineK - dt * .6); }
  colorAcc += dt; if (colorAcc > .12 || show.on) { colorAcc = 0; applyColors(); if (show.on) applyLights(); }
  const r = reduced ? 1 : Math.min(1, dt * .6);
  for (const k in wx) wx[k] += (wxT[k] - wx[k]) * r;

  stepTrain(dt, mv);
  updateCamera(dt);
  renderWorld();
  stepRiesenrad(dt, mv);
  stepPraterturm(dt, mv);
  CAROU.rot += dt * 1.2 * mv;
  CAROU.horses.forEach((h, i) => { const a = CAROU.rot + h.a; h.h.setAttribute('transform', `translate(${f1(Math.sin(a) * 56)} ${f1(Math.sin(time * 3 + i) * 3)})`); h.h.setAttribute('opacity', Math.cos(a) > -.2 ? 1 : .45); });
  updateBillboards(dt);
  // 人群揮手
  crowds.forEach(c => { if (!c.people || !c.vis) return; const w = c.wave > 0 || (show.on && show.drop && c.kind === 'crowd') || (show.on && show.kind === 'ny' && show.t > NY_CREST); if (c.wave > 0) c.wave -= dt; if (w !== c.w || w) { c.w = w; c.people.forEach((p, i) => armsUp(p, w ? 1 : 0, c.ph + i)); } });
  // 路燈、地面燈點
  LANDMARKS.donauBeacon && LANDMARKS.donauBeacon.setAttribute('opacity', Math.floor(time / 1.1) % 2 ? .2 : 1);
  bulbAcc += dt;
  if (bulbAcc > 1 / 15) { bulbAcc = 0; stepBulbs(); }
  bulbSets.forEach(s => { if (s.rbT > 0) s.rbT -= dt; });
  // 速度線（越快越明顯）
  const v = train.v * SPD_NOW;
  if (v > 12 && !reduced) {
    let d = '';
    for (let i = 0; i < 22; i++) { const a = rand(0, Math.PI * 2), r0 = rand(260, 520), l = (v - 10) * rand(3, 7); d += `M${f1(CX + Math.cos(a) * r0)} ${f1(CY + Math.sin(a) * r0 * .6)}l${f1(Math.cos(a) * l)} ${f1(Math.sin(a) * l * .6)}`; }
    $('speedP').setAttribute('d', d); $('speedP').setAttribute('opacity', f1(clamp((v - 12) / 18, 0, .35)));
  } else $('speedP').setAttribute('opacity', 0);
  stepWeatherFx(dt, mv);
  stepFireworks(dt);
  stepCar(dt);
  // 鳥
  for (let i = birds.length - 1; i >= 0; i--) {
    const b = birds[i]; b.t += dt; b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
    const p = proj(b.x, b.y, b.z);
    if (p) { const k = clamp(F / p[2] * .06, .3, 3); b.g.style.display = ''; b.g.setAttribute('transform', `translate(${f1(p[0])} ${f1(p[1])}) scale(${f1(k)} ${f1(k * (.55 + .45 * Math.abs(Math.sin(time * 10 + b.ph))))})`); }
    else b.g.style.display = 'none';
    if (b.t > 6) { b.g.remove(); birds.splice(i, 1); }
  }
  // 補間
  for (let i = tweens.length - 1; i >= 0; i--) {
    const w = tweens[i]; w.t += dt;
    const k = clamp(w.t / w.dur, 0, 1); w.fn(k);
    if (k >= 1) { tweens.splice(i, 1); w.done && w.done(); }
  }
  // 偶爾有一個霓虹字閃一下
  if (!reduced && Math.random() < dt * .25 && lit > .5) { const e = pick(litEls); e.fl = .25; applyLights(); setTimeout(() => { e.fl = 1; applyLights(); }, 90 + Math.random() * 120); }
}

/* ---------------- 初始化 ---------------- */
function init() {
  buildTrack();
  calibrate();
  setupSky();
  setupFar();
  setupDots();
  setupWorld();
  // 軌道燈泡的圖層
  const bo = $('bulbOn'); bo.appendChild(tbGlow); tbOn.forEach(n => bo.appendChild(n));
  drawCar();
  bindAll();
  train.s = trk.sStop; train.state = 'wait'; train.wait = 2;
  if (reduced) { T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false'); }
  setWeather(0, true);
  applyColors(true);
  for (let i = 0; i < 4; i++) step(1 / 30);
  requestAnimationFrame(loop);
}
init();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on && show.kind,
  btn: { ride: 'btnRide', ny: 'btnNY' },
  save: () => ({ t: T.t, auto: T.auto, w: wxIdx }),
  stop: () => {
    endShow(true);
    // 飛車直接回月台待命
    Object.assign(train, { s: trk.sStop, v: 0, state: 'wait', wait: 3, hold: false, lap: false });
    RR.rainbow = 0; bulbSets.forEach(s => s.boost = 0);
  },
  restore: s => { if (wxIdx !== s.w) setWeather(s.w, true); T.t = s.t; T.auto = s.auto; $('btnAuto').setAttribute('aria-pressed', String(T.auto)); applyColors(true); }
});
/* /ShowStop */
})();
