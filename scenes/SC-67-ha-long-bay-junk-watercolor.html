<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>下龍灣的夕照帆船</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-67 下龍灣的夕照帆船｜水彩感
   地點：越南廣寧省下龍灣（聯合國世界自然遺產），海上一千多座石灰岩島。
   畫面：海上矗立一座座陡直的石灰岩島，島頂長滿綠樹，島腳被海浪蝕出一圈凹槽；
        左邊大島腳下是水上漁村：浮在藍色塑膠浮桶上的木屋、方格狀的養魚箱、晾衣繩、看家的狗、
        在平台邊釣魚的小孩、賣水果海鮮的小船，前面有圓圓的竹籃船（thúng chai）在打轉；
        中間遠處是提托普島（Ti Top）：山腳一彎沙灘、山頂有觀景涼亭；
        海中央是兩塊面對面的「鬥雞石」（Hòn Trống Mái）；
        右邊大島腳下有一個海蝕拱門，獨木舟一艘艘划進划出；
        海面上是掛著褐紅色扇形帆的木造遊船（下龍灣的帆船遊船），
        戴斗笠（nón lá）的船娘划竹筏載遊客；天上有黑鳶盤旋。
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   風格重點：水彩感——feTurbulence＋feDisplacementMap 做出暈染毛邊與邊緣顏料堆積，
            紙張顆粒、透明疊色；遠方的島一層比一層淡，像水彩的「空氣遠近法」；
            海面倒影用水平拉長的擾動濾鏡做出波紋。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），部分另有 --k-名稱（晨昏）。
   JS 會依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）。
   ========================================================= */
:root{
  color-scheme: light;

  /* —— 天空、太陽、雲、霧 —— */
  --d-sky-top:#6a9cc8;  --k-sky-top:#6e6aa0;  --n-sky-top:#0b1530;
  --d-sky-mid:#a6cede;  --k-sky-mid:#e8977a;  --n-sky-mid:#16264a;
  --d-sky-low:#eef0e2;  --k-sky-low:#fcc27e;  --n-sky-low:#283a5c;
  --d-sun:#fff4d6;      --k-sun:#ff9a4a;      --n-sun:#ff9a4a;
  --d-cloud:#fbf8f2;    --k-cloud:#f8c0a4;    --n-cloud:#2a3456;
  --d-overcast:#9aa6ae; --k-overcast:#8a7a8a; --n-overcast:#111a2e;
  --d-mist:#eef0ea;     --k-mist:#f6cdb0;     --n-mist:#36446a;

  /* —— 遠方的石灰岩島（越遠越淡） —— */
  --d-karst-far:#a8bcc2;  --k-karst-far:#b28ca4; --n-karst-far:#1e2a44;
  --d-karst-far2:#86a0a4; --k-karst-far2:#94728c; --n-karst-far2:#18233c;

  /* —— 近處的石灰岩島：岩壁、植被、海蝕凹槽 —— */
  --d-rock:#8e9a8e;     --k-rock:#94747a;     --n-rock:#1a2232;
  --d-rock-dk:#5e6a64;  --k-rock-dk:#5e4a56;  --n-rock-dk:#10161f;
  --d-rock-ochre:#c4a274; --k-rock-ochre:#d49a74; --n-rock-ochre:#2a2a30;
  --d-rock-hi:#cfd0bc;  --k-rock-hi:#ecb89a;  --n-rock-hi:#2c3446;
  --d-veg:#4f8a46;      --k-veg:#5c6a3e;      --n-veg:#0f1c18;
  --d-veg-dk:#2e5838;   --k-veg-dk:#3a4630;   --n-veg-dk:#0a1410;
  --d-veg-hi:#9cc060;   --k-veg-hi:#b89c4e;   --n-veg-hi:#1a2a20;
  --d-notch:#3e4a46;    --n-notch:#080c12;
  --d-cave:#2a302e;     --n-cave:#05080c;
  --d-sand:#eedcb2;     --k-sand:#f2c49a;     --n-sand:#3a3a42;

  /* —— 海水 —— */
  --d-sea-far:#b2cdc6;  --k-sea-far:#f0b898;  --n-sea-far:#22304e;
  --d-sea-mid:#78aca6;  --k-sea-mid:#b88a8a;  --n-sea-mid:#172540;
  --d-sea-near:#3f8088; --k-sea-near:#6a5a74; --n-sea-near:#0d182c;
  --d-sea-hi:#eaf6ee;   --k-sea-hi:#ffe0b8;   --n-sea-hi:#4c5c82;
  --d-refl:#4e706a;     --k-refl:#6a4e66;     --n-refl:#0a1222;   /* 島的倒影 */
  --d-refl-g:#4e7a56;   --k-refl-g:#6a6440;   --n-refl-g:#0b1814;

  /* —— 帆船遊船 —— */
  --d-hull:#6e4028;     --k-hull:#7a3e26;     --n-hull:#1e1412;
  --d-hull-dk:#3e2416;  --n-hull-dk:#120c0a;
  --d-hull-hi:#a8744a;  --n-hull-hi:#2e2018;
  --d-deck:#f2ead8;     --k-deck:#f8d0b2;     --n-deck:#46424e;
  --d-deck-dk:#c8b896;  --n-deck-dk:#2c2a32;
  --d-sail:#b8582e;     --k-sail:#cc4e28;     --n-sail:#3a1c18;   /* 褐紅色扇形帆 */
  --d-sail-dk:#8a3a1e;  --n-sail-dk:#26120e;
  --d-sail2:#d08c3c;    --k-sail2:#e07a30;    --n-sail2:#3e2a16;  /* 土黃色帆 */
  --d-win:#3a5670;      --n-win:#141a26;
  --d-flagred:#d42a26;  --n-flagred:#3e1414;

  /* —— 水上漁村 —— */
  --d-house-1:#6ea4c8;  --k-house-1:#8a94b4;  --n-house-1:#1c2a3e;   /* 藍 */
  --d-house-2:#8cc2a2;  --k-house-2:#a8b08e;  --n-house-2:#1a2e2a;   /* 綠 */
  --d-house-3:#ecce6a;  --k-house-3:#f2b862;  --n-house-3:#3a3420;   /* 黃 */
  --d-house-4:#e4a49a;  --k-house-4:#ec9a86;  --n-house-4:#3a2426;   /* 粉 */
  --d-tin:#8a98a2;      --k-tin:#9a8a92;      --n-tin:#20262e;       /* 鐵皮屋頂 */
  --d-tin-r:#b8563c;    --n-tin-r:#34181a;
  --d-plank:#b08a5e;    --k-plank:#c08860;    --n-plank:#2c2624;
  --d-plank-dk:#6e5236; --n-plank-dk:#181414;
  --d-barrel:#3a6ab4;   --n-barrel:#121e36;   /* 藍色塑膠浮桶 */
  --d-foam:#f2f0e8;     --n-foam:#3a3e4a;     /* 白色保麗龍浮塊 */
  --d-net:#4a5a50;      --n-net:#141a18;
  --d-basket:#5a4630;   --n-basket:#181410;   /* 竹籃船：竹編塗瀝青 */
  --d-basket-hi:#9a7c52; --n-basket-hi:#2e261c;

  /* —— 小船、獨木舟 —— */
  --d-boat-b:#3a78a8;   --n-boat-b:#121e30;   /* 漁船的藍色船身 */
  --d-boat-r:#c8463a;   --n-boat-r:#3a1618;
  --d-kayak-1:#f2b42a;  --k-kayak-1:#f2962a;  --n-kayak-1:#3e3016;
  --d-kayak-2:#e2502e;  --n-kayak-2:#3c1812;
  --d-kayak-3:#2e9ab0;  --n-kayak-3:#122e36;
  --d-vest:#f07a24;     --n-vest:#3e2414;     /* 救生衣 */

  /* —— 人物 —— */
  --d-skin:#c8906e;     --n-skin:#3e3036;
  --d-skin2:#ecc4a2;    --n-skin2:#4a3c40;
  --d-skin3:#9a6444;    --n-skin3:#2c2226;
  --d-hair:#2a2222;     --n-hair:#100c0e;
  --d-nonla:#eadcae;    --k-nonla:#f6cc96;    --n-nonla:#4a463c;   /* 斗笠 */
  --d-cloth-1:#d0463a;  --n-cloth-1:#461c22;
  --d-cloth-2:#2f6aa8;  --n-cloth-2:#18284a;
  --d-cloth-3:#e8b23a;  --n-cloth-3:#4a3a20;
  --d-cloth-4:#3e8a6a;  --n-cloth-4:#162e26;
  --d-cloth-5:#f2eee2;  --n-cloth-5:#4a4a58;
  --d-cloth-6:#8a5aa8;  --n-cloth-6:#2c2040;
  --d-cloth-7:#6a5a48;  --n-cloth-7:#201a16;   /* 漁家的褐色衣服 */
  --d-pants:#3e4250;    --n-pants:#14161c;

  /* —— 動物 —— */
  --d-kite:#4a3a2e;     --n-kite:#121014;     /* 黑鳶 */
  --d-egret:#fbfaf4;    --k-egret:#ffe0c8;    --n-egret:#5a6070;
  --d-dog:#c89a5e;      --n-dog:#2e2218;
  --d-fish:#c8d4d8;     --n-fish:#4a5460;
  --d-squid:#f4e8dc;    --n-squid:#f4e8dc;

  /* —— 不隨日夜變化的顏色 —— */
  --moon:#f8f0d0; --star:#fff6d8; --flagstar:#ffd83a;
  --lamp:#ffd27a; --window:#ffd88a; --water:#e8f6ff; --rain:#d8e6f2; --ink:#3a3428;
  --squidlamp:#f2fff0; --flash:#ffffff;

  /* —— 頁面介面 —— */
  --page-bg:#eef2ee; --page-fg:#2a3434; --page-muted:#5e6e6c;
  --ui-surface:#f8faf6; --ui-line:#c8d6d0; --ui-accent:#2e7a78; --ui-hot:#c4562a; --ui-hot2:#24446a;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:6px;overflow:hidden;background:#283a5c;line-height:0;box-shadow:0 1px 0 #fff inset,0 6px 22px rgba(30,60,60,.18)}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:6px;padding:10px 14px}
.panel button{font:700 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1.5px solid var(--ui-line);
  border-radius:999px;padding:9px 15px;cursor:pointer;letter-spacing:.03em}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:#fff}
.panel button.big{border-color:var(--ui-hot);color:#fff;background:var(--ui-hot)}
.panel button.big2{border-color:var(--ui-hot2);color:#fff;background:var(--ui-hot2)}
.panel button.on{background:#f2b23a!important;border-color:#f2b23a!important;color:var(--page-fg)!important}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid #fff3cc;outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(220px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding:0;list-style:none;color:var(--page-muted);font-size:14px;line-height:1.8;display:flex;flex-wrap:wrap;gap:4px 22px}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .bubble path{fill:#fffaf0;stroke:#3e6a66;stroke-width:1.4}
#scene .bubble text{fill:#24363a;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
@media (prefers-reduced-motion: reduce){ .panel button{transition:none} }
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>

<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：天空 → 星空 → 太陽、月亮 → 雲 → 黑鳶 → 遠方島群 → 地平線的霧
       → 海面 → 島的倒影 → 落日／月光倒影 → 海面波紋 → 最遠的帆船 → 提托普島 → 鬥雞石
       → 中距離的帆船 → 夜釣魷魚的漁船 → 海蝕洞內部與洞裡的獨木舟 → 右邊大島 → 左邊大島
       → 獨木舟 → 近處的帆船 → 水上漁村 → 竹筏、竹籃船 → 右下角礁岩 → 漣漪、特效 → 霧、雨 → 紙紋
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="水彩風格的越南下龍灣：海上矗立著長滿綠樹的石灰岩島，掛著褐紅色扇形帆的木造遊船緩緩駛過，左邊是浮在海上的水上漁村與竹籃船，右邊大島腳下的海蝕拱門有獨木舟划進划出。">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-top)"/>
        <stop offset=".62" style="stop-color:var(--sky-mid)"/>
        <stop offset="1" style="stop-color:var(--sky-low)"/>
      </linearGradient>
      <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sea-far)"/>
        <stop offset=".35" style="stop-color:var(--sea-mid)"/>
        <stop offset="1" style="stop-color:var(--sea-near)"/>
      </linearGradient>
      <radialGradient id="glowGrad"><stop offset="0" stop-color="#ffcf6a" stop-opacity=".9"/><stop offset=".45" stop-color="#ffb347" stop-opacity=".35"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
      <radialGradient id="squidGlow"><stop offset="0" stop-color="#f6fff4" stop-opacity="1"/><stop offset=".3" stop-color="#d8ffe8" stop-opacity=".55"/><stop offset="1" stop-color="#b8f0d8" stop-opacity="0"/></radialGradient>
      <radialGradient id="sunHalo"><stop offset="0" style="stop-color:var(--sun)" stop-opacity=".75"/><stop offset="1" style="stop-color:var(--sun)" stop-opacity="0"/></radialGradient>
      <radialGradient id="milkyGrad"><stop offset="0" stop-color="#dcd4ff" stop-opacity=".3"/><stop offset="1" stop-color="#dcd4ff" stop-opacity="0"/></radialGradient>
      <radialGradient id="mistGrad"><stop offset="0" style="stop-color:var(--mist)" stop-opacity=".9"/><stop offset=".6" style="stop-color:var(--mist)" stop-opacity=".45"/><stop offset="1" style="stop-color:var(--mist)" stop-opacity="0"/></radialGradient>
      <radialGradient id="washTop"><stop offset="0" style="stop-color:var(--sky-top)" stop-opacity=".7"/><stop offset=".6" style="stop-color:var(--sky-top)" stop-opacity=".3"/><stop offset="1" style="stop-color:var(--sky-top)" stop-opacity="0"/></radialGradient>
      <radialGradient id="washLow"><stop offset="0" style="stop-color:var(--sky-low)" stop-opacity=".6"/><stop offset=".6" style="stop-color:var(--sky-low)" stop-opacity=".25"/><stop offset="1" style="stop-color:var(--sky-low)" stop-opacity="0"/></radialGradient>
      <linearGradient id="horizonMist" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--mist)" stop-opacity="0"/>
        <stop offset=".6" style="stop-color:var(--mist)" stop-opacity=".85"/>
        <stop offset="1" style="stop-color:var(--mist)" stop-opacity="0"/>
      </linearGradient>
      <!-- 海蝕洞：洞口往裡越來越暗 -->

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);
      }
      return _conn.call(this, dest, ...a);
    };
  }
  function stopAudio() {
    let longs = [], ctx = null;
    for (const s of srcs) {
      const c = s.context, now = c.currentTime, m = s.__ss; ctx = c;
      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }
    if (longs.length && ctx) {
      const g = outs.get(ctx), now = ctx.currentTime;
      if (g) {
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 1.1); g.gain.setValueAtTime(0, now + 1.2);
        g.gain.linearRampToValueAtTime(1, now + 1.9);

      longs.forEach(s => { try { s.stop(now + 1.15); } catch (e) {} srcs.delete(s); });
    }
    srcs.clear();
  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');
    // 凍結色票：把目前的 CSS 變數抄到殘影上，底下換色不影響殘影
    const cs = getComputedStyle(svg);
    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }

    }
    const par = svg.parentElement;
    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });
    added = [];
  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }

/* ---- 石灰岩島的輪廓：從左腳沿著山頂到右腳的一串點 ----

   島腳在海面高度被海浪蝕出一圈內凹的槽（notch），所以島看起來像「站」在水上。 */
function towerPts(x0, x1, yb, top, n, jag = 8) {
  // 自動產生一座塔狀島：兩側陡、頂部起伏
  const pts = [[x0, yb]], w = x1 - x0;
  pts.push([x0 + w * .03, yb - (yb - top) * .45]);
  for (let i = 0; i <= n; i++) {

const mirror = (pts, yb, k = .55) => pts.map(([x, y]) => [x, yb + (yb - y) * k]);
// 畫一座近處的島：岩壁、垂直的岩紋、植被、海蝕凹槽；回傳輪廓路徑
function resample(pts, n) {   // 沿著折線平均取 n 個點
  const seg = []; let tot = 0;
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(l); tot += l; }

  for (let k = 0; k <= n; k++) {

  const H = yb - minY, top = resample(pts.slice(1, -1), 48);

const farPts = [];

  [[600, 700, 66], [690, 740, 40], [740, 812, 82], [800, 846, 48], [960, 1030, 58], [1018, 1060, 34], [1480, 1560, 70], [380, 430, 44], [-10, 60, 50]].forEach(([a, b, h]) => {

/* ---- 海面：底色、島的倒影、水彩筆觸般的水紋 ---- */

function drawSea() {

/* ---- 提托普島（Ti Top）：山腳一彎沙灘，山頂有觀景涼亭，石階一路爬上去 ---- */
let titop = null;

function house(g, x, yd, w, h, wall, roof, i) {

function waveFlag(fl, dt, w = 16, h = 11, a = 1.6, sp = 6) {
  fl.ph += dt * sp;

  const yy = (i, b) => f1(fl.y + b + Math.sin(fl.ph + i) * a * i / 4);
  const dir = fl.dir || -1;   // 旗子往船尾方向飄
  for (let i = 1; i <= 4; i++) d += `L${f1(fl.x + dir * w * i / 4)} ${yy(i, 0)}`;
  for (let i = 4; i >= 0; i--) d += `L${f1(fl.x + dir * w * i / 4)} ${yy(i, h)}`;

  const cx = fl.x + dir * w * .5, cy = fl.y + h / 2 + Math.sin(fl.ph + 2) * a * .5, r = h * .3;

  fl.star.setAttribute('d', s + 'Z');
}

  const h = T.t * 24; hour = h;

  dusk = Math.max(Math.exp(-Math.pow((h - 6.0) / .9, 2)), Math.exp(-Math.pow((h - 18.4) / .95, 2)));
  for (const k in PAIRS) {

function clockText() { const m = Math.floor(T.t * 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
let sunBump = 0, sunX = 0, sunY = 0, sunUp = 0, moonX = 0, moonY = 0, moonUp = 0;

  sunUp = sp > -.02 && sp < 1.02 ? Math.min(1, Math.sin(Math.PI * clamp(sp, 0, 1)) * 6) : 0;
  const big = 1 + (1 - Math.sin(Math.PI * clamp(sp, 0, 1))) * .3;

  $('sunG').style.display = sp > -.04 && sp < 1.04 ? '' : 'none';

/* ---- 帆船：航行、保持距離、升降帆 ---- */
const S = { glow: 0 };
function stepJunks(dt, mv) {
  const sunsetShow = show.on && show.kind === 'sunset';
  LANES.forEach(L => {
    const act = L.list.filter(j => j.active).sort((a, b) => (b.x - a.x) * L.dir);
    act.forEach((J, i) => {
      J.wave = Math.max(0, J.wave - dt); J.bell = Math.max(0, J.bell - dt);
      let sp = L.sp * (1 + wx.storm * .2);
      if (i > 0) {   // 跟前面的船保持距離
        const f = act[i - 1]; const gap = (f.x - J.x) * L.dir - J.len * L.s - 60 * L.s;
        if (gap < 80 * L.s) sp = Math.min(sp, L.sp * clamp(gap / (80 * L.s), 0, 1));
      }
      J.x += L.dir * sp * dt * mv;
      // 升降帆：表演時全部升帆，雷雨時收帆
      const want = sunsetShow ? 1 : wx.storm > .6 ? .12 : J.sailWant;
      J.sailK += (want - J.sailK) * Math.min(1, dt * (reduced ? 20 : .9));
      J.sails.forEach(s => s.g.setAttribute('transform', `translate(0 ${s.bot}) scale(1 ${f1(J.sailK)}) translate(0 ${-s.bot})`));
      J.furl.setAttribute('opacity', f1(clamp(1 - (J.sailK - .12) / .25, 0, 1)));
      J.refl.setAttribute('opacity', f1(.4 * (1 - wx.fog * .5)));
      const bob = Math.sin(time * 1.3 + J.ph) * (1.2 + wx.storm * 2.4) * mv;
      J.inner.setAttribute('transform', `translate(0 ${f1(bob)}) rotate(${f1(Math.sin(time * .9 + J.ph) * (.6 + wx.storm * 1.6) * mv)})`);
      J.g.setAttribute('transform', `translate(${f1(J.x)} ${L.y}) scale(${f1(L.dir * L.s)} ${L.s})`);
      J.foam.setAttribute('opacity', f1(.35 + .25 * Math.sin(time * 4 + J.ph)));
      J.people.forEach(p => p.arm.setAttribute('d', J.wave > 0 && Math.sin(time * 12 + p.ph) > 0 ? 'M1 -7L3 -15' : 'M1 -7L3 -2'));
      waveFlag(J.flag, dt * mv, 14, 9, 1.4 + wx.storm * 2, 6 + wx.storm * 6);
      if ((L.dir > 0 && J.x > L.x1) || (L.dir < 0 && J.x < L.x0)) { J.active = false; J.g.style.display = 'none'; }
    });
    // 補船：入口夠空才放下一艘；晚上遊船大多下錨過夜，海上的船變少
    const base = hour < 6 || hour > 20.5 ? (L.id === 'lane1' ? 1 : 0) : hour > 18.8 ? 1 : L.want;
    const want = base + (sunsetShow ? 1 : 0);
    if (act.length < want && mv && Math.random() < dt * (sunsetShow ? 3 : .35)) {
      const x0 = L.dir > 0 ? L.x0 : L.x1;
      const clear = !act.some(j => Math.abs(j.x - x0) < (j.len + 120) * L.s);
      const idle = L.list.filter(j => !j.active);
      if (clear && idle.length) {

        J.sailWant = Math.random() < .6 ? 1 : .12; J.sailK = J.sailWant;
      }
    }
  });
}

/* ---- 魷魚漁船：天黑後亮起集魚燈，魷魚被光吸引上來 ---- */
function stepSquids(dt, mv) {
  const squidShow = show.on && show.kind === 'squid';
  squids.forEach((Q, i) => {
    const want = squidShow ? (show.t > 1 + i * 1.1 ? 1 : 0) : (night > .7 && (hour > 19.6 || hour < 4.6) && wx.storm < .5 ? 1 : 0);
    Q.on += (want - Q.on) * Math.min(1, dt * (reduced ? 20 : 1.6));
    const vis = squidShow ? 1 : smooth(.4, .8, night) * (wx.storm < .5 ? 1 : 0);
    Q.vis = (Q.vis ?? 0) + (vis - (Q.vis ?? 0)) * Math.min(1, dt * (reduced ? 20 : 1));
    Q.g.style.display = Q.vis < .02 ? 'none' : '';

    Q.g.setAttribute('opacity', f1(Q.vis));
    Q.bulbs.forEach((b, j) => b.setAttribute('opacity', f1(Q.on * (.85 + .15 * Math.sin(time * 9 + j + Q.ph)))));

    Q.jig += dt * mv * 3;
    const tipY = -40 + Math.sin(Q.jig) * 3;
    Q.rod.setAttribute('d', `M14 -24L36 ${f1(tipY)}`);
    Q.line.setAttribute('d', `M36 ${f1(tipY)}L40 4`);
    // 釣起魷魚：魷魚沿著釣線被拉上來
    if (Q.on > .8 && Q.catchT < 0 && Math.random() < dt * (squidShow ? .25 : .05)) Q.catchT = 0;
    if (Q.catchT >= 0) {
      Q.catchT += dt; const k = Q.catchT / 1.8;
      if (k >= 1) { Q.catchT = -1; Q.squid.setAttribute('opacity', 0); }
      else {
        Q.squid.setAttribute('opacity', f1(Math.min(1, k * 4) * (k > .85 ? (1 - k) / .15 : 1)));
        Q.squid.setAttribute('transform', `translate(${f1(lerp(40, 36, k))} ${f1(lerp(6, tipY + 8, Math.min(1, k * 1.2)))}) rotate(${f1(Math.sin(time * 14) * 12)})`);

}

/* ---- 黑鳶盤旋、俯衝 ---- */
function stepKites(dt, mv) {
  kites.forEach(K => {
    let x, y, flap, face;
    if (K.dive) {
      const D = K.dive; D.t += dt; const k = D.t / 2.6;
      if (k >= 1) { K.dive = null; }
      const kk = clamp(k, 0, 1);
      const down = kk < .45 ? smooth(0, .45, kk) : 1 - smooth(.45, 1, kk);
      x = lerp(D.x0, D.tx, kk < .45 ? smooth(0, .45, kk) : 1) + (kk > .45 ? (kk - .45) * 220 * D.dir : 0);
      y = lerp(D.y0, D.ty, down);
      flap = kk > .45 ? Math.abs(Math.sin(time * 10)) : 0;
      face = kk > .45 ? D.dir : Math.sign(D.tx - D.x0) || 1;
      if (kk > .45 && !D.hit) { D.hit = 1; splash(D.tx, D.ty + 6, .8, 10); sfx('splash'); }
      if (!K.dive) { K.a = 0; K.cx = x - K.r; K.cy = y; }
    } else {
      K.a += dt * mv * .32 * K.dir;
      x = K.cx + Math.cos(K.a) * K.r; y = K.cy + Math.sin(K.a) * K.r * .35;
      flap = Math.pow(Math.max(0, Math.sin(time * 1.4 + K.ph)), 6);
      face = -Math.sin(K.a) * K.dir >= 0 ? 1 : -1;
      K.cx += (([220, 1240, 700][kites.indexOf(K)]) - K.cx) * dt * .05;
      K.cy += (([150, 120, 190][kites.indexOf(K)]) - K.cy) * dt * .05;
    }
    K.x = x; K.y = y;
    kiteWings(K, flap * mv);
    K.g.setAttribute('transform', `translate(${f1(x)} ${f1(y)}) scale(${face} 1)`);
    K.g.setAttribute('opacity', f1((1 - smooth(.5, .9, night)) * (1 - wx.storm * .8)));
  });
}

   🦑 夜釣魷魚：天黑後漁船一艘艘點亮集魚燈，魷魚被光吸引上來，漁夫一隻隻釣起

    if (t > 14 && !F.d) { F.d = 1; village.houses.forEach((H, i) => H.lamps.forEach((L, j) => setTimeout(() => { L.force = 8; }, (i * 3 + j) * 120))); say(330, 420, '漁村亮起了燈', 1.8); }

/* 夕陽帆船巡航配樂（原創）：G 調五聲音階（越南北部 Bắc 調），84 BPM，7 小節約 20 秒。

   第 4 小節竹笛加入，最後一小節箏由低到高刷過整排弦（刮奏），小鑼收尾 */
const SUN_ARP = {
  G: ['G3', 'D4', 'G4', 'A4', 'D5', 'A4', 'G4', 'D4'],
  C: ['C4', 'G4', 'C5', 'D5', 'E5', 'D5', 'C5', 'G4'],
  D: ['D4', 'A4', 'D5', 'E5', 'G5', 'E5', 'D5', 'A4'],

const SUN_BASS = { G: 'G2', C: 'C3', D: 'D3', E: 'E3' };
const SUN_BAU = [
  [['D5', 1.5], ['E5', .5], ['D5', 1], ['C5', 1]],
  [['A4', 2], ['G4', 1], ['A4', 1]],
  [['C5', 1], ['D5', 1], ['E5', 1.5], ['D5', .5]],
  [['G5', 2], ['E5', 1], ['D5', 1]],
  [['C5', 1.5], ['A4', .5], ['G4', 2]]

function playSunset() {
  if (!ok()) return;
  const beat = 60 / 84, bar = beat * 4, dur = bar * 7 + 2;
  bus('music', dur);
  const t0 = actx.currentTime + .08;
  SUN_CH.forEach((ch, b) => {
    const tb = t0 + b * bar, last = b === 6;
    if (!last) SUN_ARP[ch].forEach((n, i) => tranh(NT(n), tb + i * beat / 2, (b === 0 ? .06 : .075) * (i % 2 ? .8 : 1), i === 4 && b % 2 ? 1 : 0));
    bass(NT(SUN_BASS[ch]), tb, .2); if (!last) bass(NT(SUN_BASS[ch]), tb + beat * 2, .14);
    if (b >= 1 && b <= 4) drum(tb, .16);
    if (b >= 1 && b <= 5) bau(SUN_BAU[b - 1], tb, beat, .16);
    if (b === 3) { sao(NT('G5'), tb, beat * 2, .05); sao(NT('E5'), tb + beat * 2, beat * 2, .05); }
    if (b === 4) { sao(NT('A5'), tb, beat * 2, .05); sao(NT('G5'), tb + beat * 2, beat * 2, .05); }
    if (b === 5) { sao(NT('E5'), tb, beat * 1.5, .05); sao(NT('D5'), tb + beat * 1.5, beat * 2.5, .05); }
    if (last) {   // 刮奏＋長音收尾
      ['G3', 'A3', 'C4', 'D4', 'E4', 'G4', 'A4', 'C5', 'D5', 'E5', 'G5'].forEach((n, i) => tranh(NT(n), tb + i * .05, .06));
      ['G3', 'D4', 'G4', 'D5'].forEach((n, i) => tranh(NT(n), tb + .7 + i * .03, .07));

/* 夜釣魷魚配樂（原創）：D 調五聲音階，100 BPM，8 小節約 19 秒。
   木魚打著輕快的節奏、箏撥分解和弦，竹笛吹主旋律，
   第 6 小節換獨弦琴用滑音回應，每四小節敲一下小鑼 */
const SQ_ARP = { D: ['D4', 'A4', 'D5', 'A4'], G: ['G3', 'D4', 'G4', 'D4'], A: ['A3', 'E4', 'A4', 'E4'], B: ['B3', 'E4', 'B4', 'E4'] };

const SQ_SAO = [
  null,
  [['A4', .5], ['B4', .5], ['D5', 1], ['E5', 1], ['D5', 1]],
  [['B4', 1], ['A4', .5], ['G4', .5], ['A4', 2]],
  [['D5', .5], ['E5', .5], ['G5', 1], ['E5', 1], ['D5', 1]],
  [['E5', 1.5], ['D5', .5], ['B4', 2]],
  null,
  [['G5', 1], ['E5', .5], ['D5', .5], ['E5', 1], ['A5', 1]],
  [['D5', 3.5]]
];
function playSquid() {
  if (!ok()) return;
  const beat = .6, bar = beat * 4, dur = bar * 8 + 2;
  bus('music', dur);
  const t0 = actx.currentTime + .08;
  SQ_CH.forEach((ch, b) => {
    const tb = t0 + b * bar, last = b === 7;
    // 木魚：咚、咚、咚咚
    [0, 1, 2, 2.5, 3].forEach((q, i) => mo(tb + q * beat, i === 0 ? .14 : .09, i % 2 ? 1300 : 1050));
    for (let i = 0; i < 8; i++) tranh(NT(SQ_ARP[ch][i % 4]), tb + i * beat / 2, .055 * (i % 2 ? .75 : 1));
    bass(NT(SQ_ARP[ch][0].replace(/\d/, m => +m - 1)), tb, .18);
    if (b === 0 || b === 4) gong(tb, .07, 220);
    if (SQ_SAO[b]) { let tt = tb; SQ_SAO[b].forEach(([n, d]) => { sao(NT(n), tt, d * beat * .95, .085); tt += d * beat; }); }
    if (b === 5) bau([['A4', 1], ['B4', 1], ['D5', 2]], tb, beat, .17);
    if (b === 7) bau([['A4', 1], ['D5', 3]], tb, beat, .1);
    if (last) { drum(tb + beat * 3.5, .2); gong(tb + beat * 3.5, .1, 196); }
  });
}

/* 音效 */
const SFX = {

  paddle(t) { [0, .45].forEach(d => { const f = nz(t + d, .32, 700, .22, 'bandpass', 1.2); f.frequency.linearRampToValueAtTime(1400, t + d + .3); }); },

  bell(t) { [0, .3].forEach(d => { [1046, 2793, 4300].forEach((f, i) => osc('sine', f, t + d, 1.4, envG(t + d, .002, 1.3, [.09, .04, .02][i]))); }); },   // 船上的銅鈴「叮、叮」

  flap(t) { for (let i = 0; i < 6; i++) nz(t + i * .08, .05, 900, .12, 'bandpass', 1); },

  thunder(t) { const s = noise(), lp = actx.createBiquadFilter(), g = actx.createGain(); lp.type = 'lowpass'; lp.frequency.value = 160; g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.5, t + .15); g.gain.exponentialRampToValueAtTime(.0001, t + 2.4); s.connect(lp); lp.connect(g); g.connect(OUT); s.start(t); s.stop(t + 2.5); },

/* ---------------- ⑤ 互動：點擊與滑鼠 ---------------- */

function svgPoint(e) { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; const m = svg.getScreenCTM(); return m ? p.matrixTransform(m.inverse()) : { x: 0, y: 0 }; }
const birds = [];

let blooms = 0;

/* ---------------- ④ 動畫：主迴圈 ---------------- */
let last = performance.now(), colorAcc = 0;
function loop(now) { const dt = Math.min(.1, (now - last) / 1000); last = now; step(dt); requestAnimationFrame(loop); }
function step(dt) {
  time += dt;
  const mv = reduced ? 0 : 1;
  if (show.on) stepShow(dt);
  else if (T.auto && !T.dragging && !reduced) T.t = (T.t + dt / DAY_SEC) % 1;
  colorAcc += dt; if (colorAcc > .12 || show.on) { colorAcc = 0; applyColors(); }
  sunBump = Math.max(0, sunBump - dt * 30);

  // 天氣漸變
  const r = reduced ? 1 : Math.min(1, dt * .5);
  for (const k in wx) wx[k] += (wxT[k] - wx[k]) * r;
  const rain = wx.rain, cloud = wx.cloud, fog = wx.fog;
  const morning = smooth(4.5, 6, hour) * (1 - smooth(7.5, 9.5, hour));   // 清晨海面的薄霧
  $('overcastSky').setAttribute('opacity', f1(cloud * .5));
  $('wxVeil').setAttribute('opacity', f1((cloud * .06 + rain * .12) * (1 - night * .6)));
  $('rainG').setAttribute('opacity', f1(rain * .85));
  if (rain > .01 && mv) { $('rain1').setAttribute('y', f1(-240 + (time * 620) % 120)); $('rain1').setAttribute('x', f1(-200 - (time * 170) % 160)); $('rain2').setAttribute('y', f1(-240 + (time * 420) % 120)); }
  $('farG').setAttribute('opacity', f1(1 - fog * .7 - rain * .3));
  $('hzMist').setAttribute('opacity', f1(clamp(.4 + fog * .6 + morning * .4 + rain * .3, 0, 1)));
  $('reflG').setAttribute('opacity', f1(1 - fog * .45 - rain * .35));
  $('titopG').setAttribute('opacity', f1(1 - fog * .35));
  $('fogSky').setAttribute('opacity', f1(fog * .5));
  $('fogVeil').setAttribute('opacity', f1(fog * .32 + morning * .06));
  $('sunG').setAttribute('opacity', f1(1 - cloud * .55 - fog * .3));
  // 霧帶飄移
  mists.forEach(m => {
    m.x += m.sp * dt * mv * (1 + rain); if (m.x > 1900) m.x = -300;
    const a = clamp(fog * (m.near ? .55 : .85) + morning * (m.near ? .15 : .45), 0, 1);
    m.e.setAttribute('opacity', f1(a));
    m.e.setAttribute('transform', `translate(${f1(m.x)} ${f1(m.y + Math.sin(time * .2 + m.ph) * 4)})`);
  });
  // 閃電（雷陣雨時）
  if (wx.storm > .6 && mv) { boltT -= dt; if (boltT <= 0) { boltT = rand(6, 14); tween(.5, k => $('flashR').setAttribute('opacity', f1((k < .2 ? 1 : k < .35 ? .2 : k < .5 ? .8 : 1 - k) * .35))); if (actx && soundOn && userGesture) setTimeout(() => sfx('thunder'), 600); } }

  // 雲
  clouds.forEach(c => {
    c.x += c.sp * (1 + rain) * dt * mv; if (c.x > 1800) c.x = -200;
    const vis = clamp(c.show + cloud, 0, 1);
    c.g.setAttribute('transform', `translate(${f1(c.x)} ${f1(c.y)}) scale(${f1(c.k)})`);
    c.g.setAttribute('opacity', f1(vis * (.9 - night * .3)));
    c.g.style.display = vis < .03 ? 'none' : '';
    if (c.rain > 0) { c.rain -= dt; if (Math.random() < .6) particle(c.x + rand(-c.w * .4, c.w * .4) * c.k, c.y + 16, 'var(--rain)', rand(-4, 4), 160, .9, 1.3, { g: 60, op: .8 }); }
  });

  // 海面的水紋：一道道慢慢漂移
  waves.forEach(w => {
    w.x += w.sp * dt * mv * (1 + wx.storm * 2); if (w.x > 1700) w.x = -100; if (w.x < -100) w.x = 1700;
    w.e.setAttribute('transform', `translate(${f1(w.x)} ${f1(w.y + Math.sin(time * .8 + w.ph) * 1.2 * mv)})`);
  });
  // 落日／月光的倒影光帶
  const useSun = sunUp > .02 && night < .7;
  const colX = useSun ? sunX : moonX;
  const inten = useSun ? sunUp * (.3 + dusk * 1.2 + S.glow * .8) * (1 - cloud * .75) * (1 - fog * .7)
                       : moonUp * night * .55 * (1 - cloud * .8) * (1 - fog * .7);
  const spread = useSun ? 30 + dusk * 40 : 20;
  glints.forEach(g => {
    g.e.setAttribute('fill', useSun ? 'var(--sun)' : 'var(--moon)');
    const x = colX + g.off * spread * (.3 + g.k) + Math.sin(time * 1.3 + g.ph) * 5 * mv;
    g.e.setAttribute('cx', f1(x));
    g.e.setAttribute('opacity', f1(clamp(inten * (.35 + .65 * Math.abs(Math.sin(time * 1.6 + g.ph))) * (1 - g.k * .5), 0, 1)));
  });
  rockFoam.forEach(f => { const k = (Math.sin(time * 1.2 + f.ph) + 1) / 2; f.e.setAttribute('opacity', f1(k * .6 * (1 + wx.storm))); f.e.setAttribute('rx', f1(6 + k * 10)); });

  // 船、獨木舟、動物、居民
  stepJunks(dt, mv);
  stepKayaks(dt, mv);
  stepSampans(dt, mv);
  stepBaskets(dt, mv);
  stepSquids(dt, mv);
  stepKites(dt, mv);
  stepVillage(dt, mv);

  // 星星閃爍
  if (night > .3) stars.forEach(s => s.c.setAttribute('opacity', f1(.5 + .5 * Math.sin(time * s.sp + s.ph))));
  // 燈火（雷雨天、起霧時也會提早開燈）
  lamps.forEach(L => {
    L.force = Math.max(0, L.force - dt);
    const autoOn = hour >= 18.3 + L.th || hour < 5.8 - L.th * .6 || wx.storm > .7;
    L.lv += ((autoOn || L.force > 0 ? 1 : 0) - L.lv) * Math.min(1, dt * (reduced ? 20 : 2.5));
    L.g.setAttribute('opacity', f1(L.lv * (.9 + .1 * Math.sin(time * 5 + L.ph) * mv)));
  });

  // 補間、粒子、漣漪、飛鳥
  for (let i = tweens.length - 1; i >= 0; i--) { const tw = tweens[i]; tw.t += dt; const k = clamp(tw.t / tw.dur, 0, 1); tw.fn(k); if (k >= 1) { tweens.splice(i, 1); tw.done && tw.done(); } }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt;
    if (p.life <= 0) { p.n.remove(); parts.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.y > p.floor) { p.y = p.floor; p.vy *= -.3; p.vx *= .6; }
    const k = p.life / p.max;
    p.n.setAttribute('cx', f1(p.x)); p.n.setAttribute('cy', f1(p.y)); p.n.setAttribute('r', f1(p.r + (1 - k) * p.grow));
    p.n.setAttribute('opacity', f1(Math.min(1, k * 2) * p.op));
  }
  for (let i = rings.length - 1; i >= 0; i--) {
    const R = rings[i]; R.t += dt; const k = R.t / 1.4;
    if (k >= 1) { R.e.remove(); rings.splice(i, 1); continue; }
    const rx = 2 + k * R.big * R.s;
    R.e.setAttribute('rx', f1(rx)); R.e.setAttribute('ry', f1(rx * .22)); R.e.setAttribute('opacity', f1((1 - k) * .7));
  }
  for (let i = birds.length - 1; i >= 0; i--) {
    const b = birds[i]; b.t += dt;
    if (b.t > b.life) { b.g.remove(); birds.splice(i, 1); continue; }
    b.x += b.vx * dt; b.y += b.vy * dt; b.vy *= .99;
    b.g.setAttribute('transform', `translate(${f1(b.x)} ${f1(b.y)}) scale(${b.vx < 0 ? -1 : 1} ${f1(.5 + .5 * Math.abs(Math.sin(b.t * 14 + b.ph)))})`);
    b.g.setAttribute('opacity', f1(Math.min(1, (b.life - b.t) * 2)));
  }
}

/* ---------------- ⑤ 互動：綁定 ---------------- */
const ISLAND_TIPS = ['下龍灣有一千六百多座石灰岩島', '島腳被海浪蝕出一圈凹槽', '「下龍」是「龍降落之處」的意思'];
let tipI = 0;
function bindAll() {
  onAct($('sunG'), () => { sunBump = 14; sfx('chime'); if (show.on) endShow(true); setTime(21.5); });
  onAct($('moonG'), () => { sfx('chime'); if (show.on) endShow(true); setTime(10); });
  clouds.forEach(c => onAct(c.g, () => { c.rain = 2.4; sfx(wx.storm > .5 ? 'thunder' : 'drops'); }));
  $('skyHit').addEventListener('click', e => { userGesture = true; ensureAudio(); const p = svgPoint(e); if (p.y < 300) skyClick(p.x, p.y); });
  $('seaHit').addEventListener('click', e => { userGesture = true; ensureAudio(); const p = svgPoint(e); const s = .4 + (p.y - HZ) / 260; ring(p.x, p.y, s, 40); ring(p.x, p.y, s * .6, 30); sfx('plop'); });
  onAct(trong.g, () => { sfx('pluck'); say(888, 270, '鬥雞石：像一對面對面的公雞與母雞', 2.6); });
  onAct(titop.g, () => { titop.t = 2.6; sfx('tap'); say(565, 200, '提托普島：爬上山頂涼亭看海灣', 2.4); });
  onAct(rightIsland.g, () => {
    sfx('drip'); say(1268, 360, '海蝕拱門：划過去就是島中間的潟湖', 2.6);
    const K = kayaks.inL.find(k => !k.active); if (K && hour > 6 && hour < 18.5) { K.active = true; K.x = 1000; K.vis = 1; K.g.style.display = ''; }
  });
  onAct(leftIsland.g, () => { sfx('kite'); say(160, 120, ISLAND_TIPS[tipI++ % ISLAND_TIPS.length], 2.4); kiteDive(kites[0]); });
  LANES.forEach(L => L.list.forEach(J => onAct(J.g, () => {
    J.sailWant = J.sailK > .5 ? .12 : 1; J.wave = 2.4; sfx('bell');
    say(J.x, L.y - 175 * L.s - 30, J.sailWant > .5 ? '升帆！' : '收帆，靠引擎慢慢開', 1.6);
  })));
  [...kayaks.inL, ...kayaks.outL].forEach(K => onAct(K.g, () => {
    K.boost = 2; sfx('paddle'); const p = K.lane.path(K.x); splash(K.x, p.y, .6, 6);
    say(K.x, p.y - 40, K.lane.dir > 0 ? '划進海蝕洞探險！' : '從潟湖划出來了', 1.6);
  }));
  SAMPAN.list.forEach(S => onAct(S.g, () => { S.photo = 1.8; sfx('shutter'); say(S.x, SAMPAN.y - 62, pick(['船娘划雙槳，帶遊客逛漁村', '這邊拍照好漂亮！']), 2); }));
  baskets.forEach(B => onAct(B.g, () => { B.spin = 3; sfx('swirl'); for (let i = 0; i < 3; i++) setTimeout(() => ring(B.cx, B.cy + 3, B.s, 46), i * 500); say(B.cx, B.cy - 50, '竹籃船原地轉圈圈！', 1.8); }));
  onAct(cage.g, () => {
    sfx('plop'); setTimeout(() => sfx('splash'), 200);
    village.fishes.forEach((F, i) => { if (i < 4) setTimeout(() => { F.t = 0; F.x = rand(262, 380); F.dir = Math.random() < .5 ? -1 : 1; }, i * 180); });
    say(VX(330), VY(470), '養魚箱裡的魚跳出水面', 1.8);
    if (Math.random() < .5) kiteDive(pick(kites));
  });
  onAct(egret.g, () => { sfx('egret'); egretFly(); });
  onAct(dog.g, () => { dog.bark = 1.2; sfx('bark'); say(VX(150), VY(470), '汪汪！', 1.2); });
  onAct(kid.g, () => { if (kid.catchT <= 0) { kid.catchT = 2; sfx('reel'); setTimeout(() => sfx('plop'), 300); say(VX(110), VY(470), '釣到小魚了！', 1.6); } });
  onAct(auntie.g.parentNode, () => { auntie.t = 2; sfx('tap'); say(VX(512), VY(460), 'Xin chào！你好！', 1.8); });
  onAct(vendor.g, () => { vendor.t = 2; sfx('tap'); say(VX(356), VY(500), '新鮮的水果、螃蟹、蝦子喔', 2); });
  village.houses.forEach((H, i) => onAct(H.g, () => {
    H.lamps.forEach((L, j) => setTimeout(() => { L.force = 6; }, j * 60)); sfx('chime');
    say(VX(H.x + H.w / 2), VY(H.yd - H.h - 30), ['浮在塑膠浮桶上的家', '曬衣服、養狗，都在海上', '屋頂是鐵皮波浪板'][i], 2);
  }));
  squids.forEach(Q => onAct(Q.g, () => { if (Q.catchT < 0) Q.catchT = 0; sfx('reel'); say(Q.x, Q.y - 50, '魷魚被燈光吸引上來', 1.8); }));
  kites.forEach(K => onAct(K.g, () => { sfx('kite'); kiteDive(K); say(K.x, K.y - 30, '黑鳶俯衝抓魚！', 1.6); }));
  // 滑鼠在海面上移動：划出一圈圈漣漪
  let rx0 = 0, ry0 = 0;
  svg.addEventListener('pointermove', e => {
    const p = svgPoint(e);
    if (Math.hypot(p.x - rx0, p.y - ry0) > 30) {
      rx0 = p.x; ry0 = p.y; bloom(p.x, p.y);
      if (p.y > HZ + 6 && !reduced) ring(p.x, p.y, .3 + (p.y - HZ) / 300, 26);
    }
  });

  $('btnShow').addEventListener('click', () => { userGesture = true; ensureAudio(); startShow('sunset'); });
  $('btnSquid').addEventListener('click', () => { userGesture = true; ensureAudio(); startShow('squid'); });
  $('btnWeather').addEventListener('click', () => { userGesture = true; ensureAudio(); setWeather((wxIdx + 1) % WX.length); });
  $('btnSound').addEventListener('click', () => {
    soundOn = !soundOn; userGesture = true; ensureAudio();
    if (master) master.gain.setValueAtTime(soundOn ? .55 : 0, actx.currentTime);
    if (!soundOn) { stopAll(); rainSound(false); try { window.sceneMusic && window.sceneMusic.stop(); } catch (e) {} } else rainSound(WX[wxIdx][0] === 'storm');
    $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  });
  $('btnDay').addEventListener('click', () => { if (show.on) endShow(true); setTime(10); });
  $('btnDusk').addEventListener('click', () => { if (show.on) endShow(true); setTime(18.2); });
  $('btnNight').addEventListener('click', () => { if (show.on) endShow(true); setTime(21.5); });
  $('btnAuto').addEventListener('click', () => { T.auto = !T.auto; $('btnAuto').setAttribute('aria-pressed', String(T.auto)); });
  const tr = $('timeRange');
  tr.addEventListener('input', () => { if (show.on) endShow(true); T.dragging = true; T.t = tr.value / 1000; applyColors(true); });
  tr.addEventListener('change', () => { T.dragging = false; });
  window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
  window.addEventListener('pointerdown', () => document.body.classList.remove('kbd'));
  mq.addEventListener && mq.addEventListener('change', () => { reduced = mq.matches; });
}

/* ---------------- 紙張紋理（水彩紙）：一次產生成圖片 ---------------- */
function paperGrain() {
  try {
    const cv = document.createElement('canvas'); cv.width = 800; cv.height = 300;
    const c = cv.getContext('2d'); const im = c.createImageData(800, 300);
    for (let i = 0; i < im.data.length; i += 4) { const v = 236 + Math.random() * 19; im.data[i] = v; im.data[i + 1] = v - 2; im.data[i + 2] = v - 6; im.data[i + 3] = 255; }
    c.putImageData(im, 0, 0);
    c.globalAlpha = .06; c.strokeStyle = '#3e6a66';
    for (let i = 0; i < 260; i++) { c.beginPath(); const x = Math.random() * 800, y = Math.random() * 300; c.moveTo(x, y); c.quadraticCurveTo(x + rand(-8, 8), y + rand(-8, 8), x + rand(-16, 16), y + rand(-16, 16)); c.stroke(); }
    c.globalAlpha = .05; c.fillStyle = '#5a7a76';
    for (let i = 0; i < 40; i++) { c.beginPath(); c.arc(Math.random() * 800, Math.random() * 300, rand(10, 40), 0, 7); c.fill(); }
    $('paper').setAttribute('href', cv.toDataURL('image/jpeg', .85));
  } catch (e) {}
}

/* ---------------- 初始化 ---------------- */
function init() {
  drawSky();
  drawFar();
  drawSea();
  drawTitop();
  drawTrong();
  drawRight();
  drawLeft();
  drawRock();
  drawVillage();
  drawVendor();
  drawJunks();
  drawSquids();
  drawKayaks();
  for (let i = 0; i < 3; i++) makeSampan();
  drawBaskets();
  drawKites();
  drawMist();
  paperGrain();
  bindAll();
  if (reduced) { T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false'); }
  // 開場就有一艘竹筏
  const S0 = SAMPAN.list[0]; S0.active = true; S0.x = 860; S0.fade = 1; S0.g.style.display = '';
  setWeather(0);
  applyColors(true);
  step(1 / 60);
  requestAnimationFrame(loop);
}
init();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on && show.kind,
  btn: { sunset: 'btnShow', squid: 'btnSquid' },
  save: () => ({ t: T.t, auto: T.auto, w: wxIdx }),
  stop: () => endShow(true),
  restore: s => { if (wxIdx !== s.w) setWeather(s.w); T.t = s.t; T.auto = s.auto; $('btnAuto') && $('btnAuto').setAttribute('aria-pressed', String(T.auto)); applyColors(true); }
});
/* /ShowStop */
})();
</script>
