/* =========================================================
   SC-74 九份豎崎路的燈籠雨夜｜浮世繪色塊 ukiyo-e
   地點：新北市瑞芳區九份，山坡上的老礦城。
   畫面（由左到右）：左上是層層疊疊、黑色油毛氈屋頂的山城人家，
        基山街的遮雨棚入口；中間是豎崎路的石階，兩旁茶樓、老店掛滿紅燈籠；
        石階底下是日治時期就有的昇平戲院、芋圓店和看海的觀景平台；
        遠方是海、基隆嶼（有燈塔），右邊是像一口鐘的基隆山，山腳有通往山城的公路。
   人物：撐傘或穿輕便雨衣的遊客、背包客、學生、阿嬤、茶樓客人、芋圓店老闆娘。
   交通：公車、黃色計程車、機車；海上的漁船（夜裡有漁火）。
   動物：盤旋的黑鳶（老鷹）、屋頂上的橘貓、趴在路邊的土狗。
   ---------------------------------------------------------
   風格重點（浮世繪色塊）：普魯士藍的天空暈色（ぼかし）、兩端圓圓的霞帶、
        粗墨線輪廓、平塗色塊、山頭上深下淺、雨畫成細直斜線、
        燈光倒影畫成直條紋、整張疊一層和紙紋理。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   --d-名稱 = 白天、--n-名稱 = 夜晚、--k-名稱 = 晨昏（可省略）。
   JS 依時間自動混色，輸出成 --名稱，並產生 .f-名稱（填色）、.s-名稱（線色）。
   沒有成對的（例如 --lamp）是固定色。
   ========================================================= */

  /* —— 天空、霞帶、雲 —— */

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:6px;overflow:hidden;background:#14244f;line-height:0;box-shadow:0 1px 0 #fff inset,0 6px 22px rgba(40,40,80,.2)}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:6px;padding:10px 14px}
.panel button{font:700 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1.5px solid var(--ui-line);
  border-radius:999px;padding:9px 15px;cursor:pointer;letter-spacing:.03em}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:#fff}
.panel button.big{border-color:var(--ui-hot);color:#fff;background:var(--ui-hot)}
.panel button.big2{border-color:var(--ui-hot2);color:#fff;background:var(--ui-hot2)}
.panel button.on{background:#f2b23a!important;border-color:#f2b23a!important;color:var(--page-fg)!important}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
/* 畫面內可點物件：滑鼠點不顯示外框，用鍵盤 Tab 時才顯示 */
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid #fff3cc;outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(220px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable,#scene [role="button"]{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .ln{stroke:var(--line);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
#scene .ln2{stroke:var(--line);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
#scene .lnT{stroke:var(--line);stroke-width:.9;stroke-linejoin:round;stroke-linecap:round}
#scene .hand{font-family:var(--font-hand);text-anchor:middle;dominant-baseline:central}
#scene .bubble path{fill:#fffaf0;stroke:#2b2622;stroke-width:1.6}
#scene .bubble text{fill:#2b2622;font:400 17px var(--font-hand);text-anchor:middle;dominant-baseline:central}
@media (prefers-reduced-motion: reduce){ .panel button{transition:none} }
</style>
</head>
<body>
<main class="wrap">
  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：天空 → 星星 → 霞帶 → 太陽、月亮 → 雲 → 黑鳶 → 海、基隆嶼 → 基隆山
       → 遠霧 → 山城山坡與人家 → 公路與車 → 山坡下的人家 → 茶樓與老店 → 石階
       → 濕石階的燈光倒影 → 行人 → 前排燈籠 → 戲院、芋圓店、觀景台 → 前景茶席
       → 近霧 → 雨 → 和紙紋理 → 對話泡泡
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="浮世繪風格的九份：中間是掛滿紅燈籠的豎崎路石階，兩旁有木造茶樓和老店，石階下有昇平戲院和芋圓店；左上是黑屋頂層層疊疊的山城，右邊遠方是海、基隆嶼和像一口鐘的基隆山。">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--skyT)"/><stop offset=".42" stop-color="var(--skyM)"/><stop offset=".8" stop-color="var(--skyB)"/>
      </linearGradient>
      <linearGradient id="seaGrad" gradientUnits="userSpaceOnUse" x1="0" y1="262" x2="0" y2="460">
        <stop offset="0" stop-color="var(--seaT)"/><stop offset=".25" stop-color="var(--sea)"/><stop offset="1" stop-color="var(--seaD)"/>
      </linearGradient>
      <!-- 山頭的暈色（上深下淺） -->
      <linearGradient id="kmGrad" gradientUnits="userSpaceOnUse" x1="0" y1="110" x2="0" y2="440">
        <stop offset="0" stop-color="var(--kmTop)"/><stop offset=".45" stop-color="var(--km)"/><stop offset="1" stop-color="var(--kmLt)"/>
      </linearGradient>
      <linearGradient id="hillGrad" gradientUnits="userSpaceOnUse" x1="0" y1="90" x2="0" y2="420">
        <stop offset="0" stop-color="var(--hillTop)"/><stop offset=".6" stop-color="var(--hill)"/>
      </linearGradient>
      <radialGradient id="lanGlow"><stop offset="0" stop-color="var(--lamp)" stop-opacity=".75"/><stop offset=".45" stop-color="var(--lamp)" stop-opacity=".22"/><stop offset="1" stop-color="var(--lamp)" stop-opacity="0"/></radialGradient>
      <radialGradient id="winGlow"><stop offset="0" stop-color="var(--window)" stop-opacity=".55"/><stop offset="1" stop-color="var(--window)" stop-opacity="0"/></radialGradient>
      <radialGradient id="moonGlow"><stop offset="0" stop-color="#fff4cc" stop-opacity=".5"/><stop offset="1" stop-color="#fff4cc" stop-opacity="0"/></radialGradient>
      <radialGradient id="sunGlow"><stop offset="0" stop-color="#ffd8a0" stop-opacity=".55"/><stop offset="1" stop-color="#ffd8a0" stop-opacity="0"/></radialGradient>
      <radialGradient id="fishGlow"><stop offset="0" stop-color="var(--fishLight)" stop-opacity=".9"/><stop offset=".35" stop-color="#ffe6a0" stop-opacity=".35"/><stop offset="1" stop-color="#ffe6a0" stop-opacity="0"/></radialGradient>
      <radialGradient id="fogGrad"><stop offset="0" stop-color="var(--fogC)" stop-opacity=".95"/><stop offset=".55" stop-color="var(--fogC)" stop-opacity=".55"/><stop offset="1" stop-color="var(--fogC)" stop-opacity="0"/></radialGradient>
      <radialGradient id="steamBall"><stop offset="0" stop-color="#ffffff" stop-opacity=".8"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
      <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff6c8" stop-opacity=".7"/><stop offset="1" stop-color="#fff6c8" stop-opacity="0"/></linearGradient>
      <!-- 浮世繪的雨：細直斜線 -->
      <pattern id="rainPat" width="60" height="90" patternUnits="userSpaceOnUse">
        <g stroke="var(--rain)" stroke-width="1" stroke-linecap="round" opacity=".75">
          <path d="M8 0l-5 26M30 20l-6 30M52 4l-5 24M18 50l-6 32M44 58l-5 26M58 40l-4 22M4 70l-3 18"/>
        </g>
      </pattern>
      <!-- 石階的石板縫 -->
      <pattern id="stonePat" width="26" height="14" patternUnits="userSpaceOnUse">
        <path d="M0 7H26M13 0V7M4 7V14M20 7V14" stroke="var(--stoneDk)" stroke-width=".8" fill="none" opacity=".6"/>
      </pattern>
      <!-- 黑色油毛氈屋頂的壓條 -->
      <pattern id="roofPat" width="9" height="40" patternUnits="userSpaceOnUse">
        <rect width="1.4" height="40" fill="var(--roofLt)" opacity=".7"/>
      </pattern>
      <!-- 鐵皮遮雨棚的波浪 -->
      <pattern id="corrPat" width="6" height="20" patternUnits="userSpaceOnUse">

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);
      }
      return _conn.call(this, dest, ...a);
    };
  }
  function stopAudio() {
    let longs = [], ctx = null;
    for (const s of srcs) {
      const c = s.context, now = c.currentTime, m = s.__ss; ctx = c;
      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }
    if (longs.length && ctx) {
      const g = outs.get(ctx), now = ctx.currentTime;
      if (g) {
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 1.1); g.gain.setValueAtTime(0, now + 1.2);
        g.gain.linearRampToValueAtTime(1, now + 1.9);
      }
      longs.forEach(s => { try { s.stop(now + 1.15); } catch (e) {} srcs.delete(s); });
    }
    srcs.clear();
  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');
    // 凍結色票：把目前的 CSS 變數抄到殘影上，底下換色不影響殘影
    const cs = getComputedStyle(svg);
    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }
      }
    }
    const par = svg.parentElement;
    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });
    added = [];
  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>
/* =========================================================
   SC-74 九份豎崎路的燈籠雨夜｜程式區
   區塊：①工具與色票
         ②場景（天空、海、基隆嶼、基隆山、山城、公路、基山街、茶樓與老店、石階、燈籠、
               昇平戲院、芋圓店、觀景台、前景茶席）
         ③角色（行人、茶客、老闆娘、公車、計程車、機車、漁船、黑鳶、貓、狗）
         ④動畫（日夜、天氣、霧、雨、燈籠、兩場表演）
         ⑤互動（點擊、滑鼠、聲音、控制列）
   ========================================================= */
(() => {
'use strict';

/* ---------------- ① 工具與色票 ---------------- */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const root = document.documentElement;
const svg = $('scene');
const DAY_SEC = 160;            // 自動播放時一天幾秒
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
let seed = 20261174;            // 固定亂數：每次開啟構圖一樣
const srand = (a = 0, b = 1) => { seed = (seed * 16807) % 2147483647; return a + (seed / 2147483647) * (b - a); };
const spick = a => a[Math.floor(srand(0, a.length - .001))];
const f1 = n => (+n).toFixed(1);
function el(tag, attrs = {}, parent) {

function lanternString(parent, pts, gap, s, chars = []) {
  // pts：支撐點 [x, y]；燈籠沿著微微下垂的線掛
  const out = [];
  for (let i = 1; i < pts.length; i++) {
    const [a, b] = [pts[i - 1], pts[i]];
    const n = Math.max(1, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1]) / gap));
    const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2 + 7;
    P(parent, `M${f1(a[0])} ${f1(a[1])}Q${f1(mx)} ${f1(my + 7)} ${f1(b[0])} ${f1(b[1])}`, 's-line', { 'stroke-width': .9, opacity: .8 });
    for (let k = 0; k < n; k++) {
      const t = (k + .5) / n;
      const x = lerp(a[0], b[0], t), y = lerp(a[1], b[1], t) + Math.sin(Math.PI * t) * 7;
      out.push([x, y]);
    }
  }
  return out.map(([x, y], i) => lantern(parent, x, y, s, { ch: chars[i] }));
}

/* ---------------- ② 場景：豎崎路石階 ---------------- */
const frontEdge = [];          // 石階前緣的折線
function drawStair() {
  const g = $('stair');
  // 前緣折線（基山街 → 一階一階 → 輕便路）
  frontEdge.push([-20 + SH, YT + DEP], [XT + SH, YT + DEP]);
  for (let i = 0; i < NSTEP; i++) {
    const x0 = XT + RUN * i, y = YT + RISE * (i + 1);
    frontEdge.push([x0 + SH, y + DEP], [x0 + RUN + SH, y + DEP]);
  }
  frontEdge.push([1640, YB + DEP]);
  // 石階前面的石牆（下面會被山坡下的屋頂蓋住一部分）
  let d = `M${frontEdge[0][0]} ${frontEdge[0][1]}`;
  frontEdge.forEach(([x, y]) => d += `L${f1(x)} ${f1(y)}`);
  d += 'V620H-30Z';
  P(g, d, 'f-stone ln');
  P(g, d, '', { fill: 'url(#stonePat)' });
  // 輕便路、戲院前的石板地
  P(g, `M${XB} ${YB}H1620V620H${XB + SH}Z`, 'f-pave ln');
  P(g, `M${XB} ${YB}H1620V620H${XB + SH}Z`, '', { fill: 'url(#stonePat)', opacity: .6 });
  // 基山街路面
  P(g, `M-20 ${YT}H${XT}L${XT + SH} ${YT + DEP}H${-20 + SH}Z`, 'f-pave ln');
  P(g, `M-20 ${YT}H${XT}L${XT + SH} ${YT + DEP}H${-20 + SH}Z`, '', { fill: 'url(#stonePat)', opacity: .6 });
  // 第一階的立面
  P(g, `M${XT} ${YT}L${XT + SH} ${YT + DEP}V${f1(YT + DEP + RISE)}L${XT} ${f1(YT + RISE)}Z`, 'f-riser lnT');
  // 一階一階：踏面（亮）＋右邊的立面（暗）
  for (let i = 0; i < NSTEP; i++) {
    const x0 = XT + RUN * i, x1 = x0 + RUN, y = YT + RISE * (i + 1);
    P(g, `M${x0} ${f1(y)}H${x1}L${x1 + SH} ${f1(y + DEP)}H${x0 + SH}Z`, (i % 2 ? 'f-step' : 'f-stepLt') + ' lnT');
    P(g, `M${x0 + 3} ${f1(y + DEP * .5)}h${RUN - 6}`, 's-riser', { 'stroke-width': .6, opacity: .5 });
    if (i < NSTEP - 1) P(g, `M${x1} ${f1(y)}L${x1 + SH} ${f1(y + DEP)}V${f1(y + DEP + RISE)}L${x1} ${f1(y + RISE)}Z`, 'f-riser lnT');
  }
  // 石階兩側的矮石緣
  P(g, frontEdge.map(([x, y], i) => (i ? 'L' : 'M') + f1(x) + ' ' + f1(y)).join(''), 's-stoneDk', { 'stroke-width': 2.4, fill: 'none' });
}

  back.forEach(L => { L.row = 'back'; stairLans.push(L); });
  // 前排：石階邊的木柱，柱頂拉線掛燈籠
  const g = $('lanFront');

  });
  const front = lanternString(g, posts, 30, .86, ['', '', '', '豎', '崎', '路', '', '', '', '九', '份', '', '', '', '', '', '', '']);
  front.forEach(L => { L.row = 'front'; stairLans.push(L); });
  // 濕石階上的燈光倒影：浮世繪的直條紋
  stairLans.forEach(L => {
    const fx = L.row === 'front' ? L.x : L.x + SH * .3;

    L.refl = el('rect', { x: f1(fx - 3), y: f1(fy), width: 6, height: 14, rx: 2, fill: 'var(--lanLit)', opacity: 0 }, $('wetRefl'));
  });
}

function stepFog(dt, mv, amt) {

  puffs.forEach(p => {
    p.x += p.sp * (1 + wx.fog * .5) * dt * mv;

function seaMusic(t0) {

/* ---------------- ④ 動畫：日夜 ---------------- */
const T = { t: 17.5 / 24, auto: true, target: null, hold: false, dragging: false };
let lastApplied = -1;
function clockText() {
  const h = T.t * 24, hh = Math.floor(h) % 24, mm = Math.floor((h - Math.floor(h)) * 60 + 1e-6);
  return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
}
const SKYK = ['skyT', 'skyM', 'skyB', 'cloud', 'cloudSh'];
function applyTime(force) {
  if (!force && Math.abs(T.t - lastApplied) < .0003) return;
  lastApplied = T.t;
  const h = T.t * 24;
  // 九份：一年平均大約 5:50 日出、17:50 日落
  night = clamp(1 - smooth(5.3, 6.4, h) + smooth(17.4, 18.6, h), 0, 1);
  dusk = Math.max(Math.exp(-Math.pow((h - 5.9) / .7, 2)) * .7, Math.exp(-Math.pow((h - 17.9) / .8, 2)));

    const Pp = PAIRS[k];
    let c = mix(Pp.d, Pp.n, night);

    root.style.setProperty('--' + k, rgba(c));
  }
  // 面向北邊的海：太陽從右邊（基隆山那頭）升起，傍晚落到左邊的山後面
  const sp = (h - 5.6) / 12.6, mp = ((h - 17.6 + 24) % 24) / 12;
  const sx = 1480 - sp * 1380, sy = HZ - Math.sin(Math.PI * clamp(sp, -.1, 1.1)) * 230;
  $('sunG').setAttribute('transform', `translate(${f1(sx)} ${f1(sy)})`);
  $('sunG').style.display = sp > -.06 && sp < 1.06 ? '' : 'none';
  const mx = 1560 - mp * 1400, my = HZ - Math.sin(Math.PI * clamp(mp, 0, 1)) * 240;
  $('moonG').setAttribute('transform', `translate(${f1(mx)} ${f1(my)})`);
  $('moonG').style.display = mp > -.05 && mp < 1.05 ? '' : 'none';
  moonPos.x = mx; moonPos.vis = mp > 0 && mp < 1;
  nOn = smooth(.3, .85, night);
  $('clock').textContent = clockText();
  if (!T.dragging) $('timeRange').value = Math.round(T.t * 1000);
  stars.forEach(s => s.base = nOn);
}
const moonPos = { x: 0, vis: false };
const grey = () => clamp(wx.cloud * .4 + wx.rain * .45 + wx.fog * .35, 0, .85);
function updateSky() {

  if (S.t < 2) { const k = smooth(0, 2, S.t); let d = S.toH / 24 - S.fromT; if (d < -.5) d += 1; if (d > .5) d -= 1; T.t = (S.fromT + d * k + 1) % 1; applyTime(true); }

/* ---------------- ④ 動畫：主迴圈 ---------------- */
const mouse = { x: -999, y: -999, vx: 0, active: false, dx: 0, sdx: 0, lx: 0 };

}
function step(dt) {

  } else if (T.auto && !T.hold && !T.dragging) T.t = (T.t + dt / DAY_SEC) % 1;

  applyTime();

  const want = WX_LIST[wxI][0];
  const k = reduced ? 1 : Math.min(1, dt * .7);
  wx.cloud += ((want === 'sun' ? 0 : want === 'fog' ? .8 : 1) - wx.cloud) * k;
  wx.rain += ((want === 'rain' ? 1 : want === 'fog' ? .18 : 0) - wx.rain) * k;
  wx.fog += ((want === 'fog' ? 1 : want === 'rain' ? .2 : 0) - wx.fog) * k;
  wx.wet += ((wx.rain > .1 ? 1 : 0) - wx.wet) * (reduced ? 1 : Math.min(1, dt * .15));    // 雨停了石階還濕一陣子
  updateSky();
  $('overcast').setAttribute('opacity', f1(grey() * .2 * (1 - night * .6)));

  // 星星閃爍

  stars.forEach(s => s.el.setAttribute('opacity', f1(s.base * (.55 + .45 * Math.sin(tt * s.sp + s.ph)) * (1 - gr))));
  // 雲、霞帶
  mouse.sdx += (mouse.dx - mouse.sdx) * Math.min(1, dt * 3);
  const pdx = mouse.sdx;
  clouds.forEach(c => {
    c.x += c.sp * dt * mv;
    if (c.x > 1700) c.x = -c.w - 60;

  // 夜裡淡入的燈（燈塔會閃）

    const m = meteorEl; m.t += dt;
    const k2 = m.t / .9;
    m.g.setAttribute('x2', f1(m.x - k2 * 220)); m.g.setAttribute('y2', f1(m.y + k2 * 90));
    m.g.setAttribute('x1', f1(m.x - Math.max(0, k2 - .3) * 220)); m.g.setAttribute('y1', f1(m.y + Math.max(0, k2 - .3) * 90));
    m.g.setAttribute('opacity', f1(1 - k2));
    if (k2 >= 1) { m.g.remove(); meteorEl = null; }
  }

  // 雨：浮世繪的細直斜線；石階上濺起小水花
  $('rainG').setAttribute('opacity', f1(clamp(wx.rain * .75, 0, 1)));
  if (wx.rain > .03 && mv) {
    const y1 = (tt * 340) % 90, y2 = (tt * 250) % 90;
    $('rain1').setAttribute('transform', `translate(${f1(-(tt * 340 * 5 / 26) % 60)} ${f1(y1)})`);
    $('rain2').setAttribute('transform', `translate(${f1(-(tt * 250 * 5 / 26) % 60 + 25)} ${f1(y2 - 40)})`);
    if (Math.random() < wx.rain * dt * 22) { const x = rand(0, 1600); drop(x + rand(-12, 0), surfY(x) + rand(2, DEP)); }
  }
  // 戲院跑馬燈（夜裡）
  marquee.forEach(m => m.el.setAttribute('opacity', f1(nOn * ((Math.floor(tt * (theaterChase > 0 ? 10 : 3)) + m.i) % 3 === 0 ? 1 : .25))));
  if (theaterChase > 0) theaterChase -= dt;
  // 貓尾巴、狗尾巴
  cat.tail.setAttribute('transform', `rotate(${f1(Math.sin(tt * (cat.meow > 0 ? 9 : 1.6)) * (cat.meow > 0 ? 20 : 8) * mv)} 8 -2)`);
  if (cat.meow > 0) { cat.meow -= dt; cat.head.setAttribute('transform', 'rotate(-14 -6 -16)'); } else cat.head.removeAttribute('transform');
  if (dog.wag > 0) { dog.wag -= dt; dog.tail.setAttribute('transform', `rotate(${f1(Math.sin(tt * 22) * 26)} -22 -6)`); dog.head.setAttribute('transform', 'translate(0 -5) rotate(-8 20 -6)'); }
  else { dog.tail.setAttribute('transform', `rotate(${f1(Math.sin(tt * 1.2) * 5 * mv)} -22 -6)`); dog.head.removeAttribute('transform'); }
  // 倒茶動畫
  if (pourT > 0) { pourT -= dt; teaTable.pot.setAttribute('transform', `translate(160 548) rotate(${f1(-38 * Math.sin(Math.PI * clamp(1 - pourT / 1.6, 0, 1)))})`); if (Math.random() < dt * 6) puff(rand(140, 182), 548, .8); }
  if (taroT > 0) { taroT -= dt; taroOwner.arm.setAttribute('transform', `rotate(${f1(-60 + Math.sin(taroT * 14) * 30)} 1 -31)`); } else taroOwner.arm.setAttribute('transform', 'rotate(-60 1 -31)');

  stepFx(dt);
  // 對話泡泡
  for (let i = bubbles.length - 1; i >= 0; i--) { const B = bubbles[i]; B.t -= dt; B.g.setAttribute('opacity', f1(clamp(B.t * 3, 0, 1))); if (B.t <= 0) { B.g.remove(); bubbles.splice(i, 1); } }
}
let theaterChase = 0, pourT = 0, taroT = 0;

/* ---------------- 開始：依序畫出場景、角色 ---------------- */
function onAct(node, fn) {
  node.addEventListener('click', e => { e.stopPropagation(); userGesture = true; ensureAudio(); fn(e); if (reduced) step(.05); });
  node.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); userGesture = true; ensureAudio(); fn(e); if (reduced) step(.05); } });
}

// 和紙紋理
(function washi() {
  try {
    const c = document.createElement('canvas'); c.width = 800; c.height = 300;
    const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, 800, 300);
    const im = x.getImageData(0, 0, 800, 300), d = im.data;
    for (let i = 0; i < d.length; i += 4) { const v = 236 + Math.random() * 19; d[i] = v; d[i + 1] = v - 3; d[i + 2] = v - 10; }
    x.putImageData(im, 0, 0);
    x.strokeStyle = 'rgba(150,120,80,.14)'; x.lineWidth = .6;
    for (let i = 0; i < 260; i++) { const a = Math.random() * 800, b = Math.random() * 300; x.beginPath(); x.moveTo(a, b); x.quadraticCurveTo(a + rand(-8, 8), b + rand(-6, 6), a + rand(-16, 16), b + rand(-10, 10)); x.stroke(); }
    $('washi').setAttribute('href', c.toDataURL('image/png'));
  } catch (e) {}
})();

/* ---------------- ⑤ 互動：點擊 ---------------- */
function svgPoint(e) { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
svg.addEventListener('pointerdown', () => { userGesture = true; ensureAudio(); document.body.classList.remove('kbd'); });
window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
svg.addEventListener('pointermove', e => {
  const p = svgPoint(e);
  mouse.vx = mouse.active ? clamp(p.x - mouse.x, -30, 30) : 0;
  mouse.x = p.x; mouse.y = p.y; mouse.active = true;
  mouse.dx = (p.x - 800) / 800 * -10;
});
svg.addEventListener('pointerleave', () => { mouse.dx = 0; mouse.active = false; mouse.x = mouse.y = -999; });
$('skyHit').addEventListener('click', e => {
  userGesture = true; ensureAudio();
  const p = svgPoint(e);
  if (p.y > 300) return;
  if (night > .5 && grey() < .5) { meteor(p.x + 100, Math.min(p.y, 200)); say(p.x, p.y + 40, '流星！許個願吧', 1.4); sfx(t => twinkle(t)); }
  else { swallowFlock(p.x < 800 ? -30 : 1630, clamp(p.y, 60, 240)); sfx(t => chirp(t)); }
  if (reduced) step(.05);
});
onAct($('sunG'), () => { T.auto = false; syncAuto(); goTo(20.5 / 24); });
onAct($('moonG'), () => { T.auto = false; syncAuto(); goTo(10.5 / 24); });
// 燈籠：點一下會晃、亮一下
lanterns.forEach(L => onAct(L.g, () => { L.av += 160 * (Math.random() < .5 ? 1 : -1); L.flare = 1.2; sfx(t => knock(t)); }));
const factsTea = ['九份的茶樓：老房子改成的茶館', '可以一邊泡茶、一邊看海', '泡的是台灣的烏龍茶', '下雨天，窗外雲霧飄過來'];
let fiT = 0;
onAct(teaG, () => { say(540, 150, factsTea[fiT++ % factsTea.length], 2.4); teaGuests.forEach(g => g.ph = rand(0, 1)); sfx(t => pour(t)); puff(560, 300); });
onAct(teaTable, () => { if (pourT > 0) return; pourT = 1.6; say(160, 490, pick(['先溫杯，再倒茶', '茶好香！', '雨天喝熱茶最舒服', '這壺是高山烏龍']), 2.2); sfx(t => pour(t)); });
const factsTaro = ['芋圓、地瓜圓，口感 QQ 的', '要冰的還是熱的？', '芋頭加地瓜粉揉一揉，切成一塊一塊', '來九份一定要吃一碗'];
let fiR = 0;
onAct(taroG, () => { taroT = 1.4; floater(1106, 500, '<path d="M-12 -4h24q0 12 -12 12q-12 0 -12 -12Z" fill="#f6f2e4" stroke="#2b2622" stroke-width="1"/><circle cx="-6" cy="-6" r="3.4" fill="#b8a0d0"/><circle cx="0" cy="-7" r="3.4" fill="#f0c070"/><circle cx="6" cy="-6" r="3.4" fill="#b8a0d0"/>', 1.6); say(1106, 420, factsTaro[fiR++ % factsTaro.length], 2.2); sfx(t => { clink(t, .7); clink(t + .25, .5); }); });
onAct(shopKiG, () => { say(160, 220, pick(['基山街：九份最熱鬧的老街', '魚丸湯、麻糬、花生捲冰淇淋', '窄窄的老街，上面搭著遮雨棚']), 2.4); puff(55, 290); sfx(t => hello(t)); });
const factsTh = ['昇平戲院：日治時期就有的老戲院', '曾經是北台灣最大的戲院之一', '現在修好開放參觀，還會放老電影'];
let fiH = 0;
onAct(theaterG, () => { theaterChase = 3; say(952, 350, factsTh[fiH++ % factsTh.length], 2.6); sfx(t => projector(t)); });
const factsKM = ['基隆山：海拔 588 公尺', '山的形狀像一口倒扣的鐘', '從側面看像躺著的孕婦，又叫大肚美人山'];
let fiK = 0;
onAct(kmG, () => { say(1294, 80, factsKM[fiK++ % factsKM.length], 2.6); sfx(t => chime(t)); });
onAct($('isleG'), () => { say(700, 200, pick(['基隆嶼：基隆外海的火山小島', '島上有一座燈塔']), 2.4); sfx(t => chime(t)); });
onAct(scopeG, () => { say(1520, 470, pick(['投幣望遠鏡：看得到基隆山的步道', '看得到海上的基隆嶼']), 2.2); sfx(t => { clink(t, .6); knock(t + .3); }); });
onAct(catG, () => { cat.meow = 1.4; say(700, 470, pick(['喵～', '貓咪在屋頂上躲雨']), 1.6); sfx(t => meow(t)); });
onAct(dogG, () => { dog.wag = 2; say(1040, 530, pick(['汪！汪！', '土狗趴在戲院門口睡午覺']), 1.6); sfx(t => bark(t)); });
function clickWalker(w) {
  if (w.stop > 0) return;
  w.stop = 1.8;
  w.p.phone.setAttribute('opacity', 1); w.p.arm.setAttribute('transform', 'rotate(-110 1 -31)');
  setTimeout(() => { w.p.phone.setAttribute('opacity', 0); w.p.arm.removeAttribute('transform'); }, 1700);
  const x = w.x + SH * LANE_F[w.lane];
  photoFlash(x + 5 * w.dir, w.y - 34);
  say(x, w.y - 80, pick(wx.rain > .5 ? ['下雨天的九份最有味道', '石階濕濕的，慢慢走', '撐著傘看燈籠好浪漫'] : ['好多階梯，慢慢爬', '燈籠好漂亮！', '等一下去吃芋圓', '幫我拍一張！']), 2);
  sfx(t => shutter(t));
}
function clickCar(C) {
  const x = C.x, y = roadY(C.x) - 40;
  if (C.kind === 'bus') { say(x, y, pick(['公車上山囉，下一站九份老街', '山路彎彎曲曲，慢慢開']), 2.2); sfx(t => busSound(t)); }
  else if (C.kind === 'taxi') { say(x, y, '黃色計程車載客人上山', 1.8); sfx(t => busSound(t)); }
  else { say(x, y, wx.rain > .5 ? '機車騎士穿著雨衣' : '山路彎彎，騎慢一點', 1.8); sfx(t => engineChug(t)); }
}

/* ---------------- ⑤ 互動：控制列 ---------------- */
function syncAuto() { $('btnAuto').setAttribute('aria-pressed', String(T.auto)); $('btnAuto').textContent = T.auto ? '自動播放中' : '自動播放'; }
function goTo(t) { if (reduced) { T.t = t; applyTime(true); step(.05); } else T.target = t; }
const tap = fn => () => { userGesture = true; ensureAudio(); setTimeout(() => { fn(); if (reduced) step(.05); }, actx && actx.state !== 'running' ? 120 : 0); };
$('btnLan').addEventListener('click', tap(() => startLan(true)));
$('btnSea').addEventListener('click', tap(() => startSea(true)));
$('btnWeather').addEventListener('click', () => {
  userGesture = true; ensureAudio();
  wxI = (wxI + 1) % WX_LIST.length;
  if (show.on === 'sea' && wxI >= 2) wxI = 0;     // 雲海漁火時跳過雨和霧
  $('btnWeather').textContent = '天氣：' + WX_LIST[wxI][1];
  if (WX_LIST[wxI][0] === 'fog') say(800, 220, '山嵐飄進山城了，滑鼠劃過可以撥開霧', 2.4);
  if (reduced) step(.05);
});
$('btnSound').addEventListener('click', () => {
  soundOn = !soundOn; userGesture = true;
  $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  if (ensureAudio()) {
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.setValueAtTime(soundOn ? .5 : 0, actx.currentTime);
    if (!soundOn) { [musNode, sfxNode].forEach(n => { if (n) try { n.disconnect(); } catch (e) {} }); musNode = sfxNode = null; }
  }
  if (!soundOn) { try { window.sceneMusic && window.sceneMusic.stop(); } catch (e) {} }
});
$('btnDay').addEventListener('click', () => { T.auto = false; syncAuto(); goTo(10.5 / 24); });
$('btnNight').addEventListener('click', () => { T.auto = false; syncAuto(); goTo(20.5 / 24); });
$('btnAuto').addEventListener('click', () => { T.auto = !T.auto; T.target = null; syncAuto(); });
$('timeRange').addEventListener('input', e => {
  T.t = e.target.value / 1000; T.target = null; T.dragging = true; applyTime(true); T.dragging = false;
  if (reduced) step(.05);
});
function start() {
  cancelAnimationFrame(rafId);
  if (reduced) { T.auto = false; syncAuto(); applyTime(true); step(.05); }
  else { last = performance.now(); rafId = requestAnimationFrame(loop); }
}
mq.addEventListener?.('change', e => { reduced = e.matches; if (!reduced) { T.auto = true; syncAuto(); } start(); });

applyTime(true);
syncAuto();
updateWindows();
step(.016);
start();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on,
  btn: { lan: 'btnLan', sea: 'btnSea' },
  ff: () => { show.wow = show.wow2 = true; show.t = show.dur - .02; },   // 跳到結尾收尾
  save: () => ({ T: { ...T }, w: wxI }),
  stop: () => endShow(),
  restore: s => {
    Object.assign(T, s.T); T.hold = false; syncAuto();
    if (wxI !== s.w) { wxI = s.w; $('btnWeather').textContent = '天氣：' + WX_LIST[wxI][1]; }
    applyTime(true);
  }
});
/* /ShowStop */
})();
