<meta charset="utf-8">

<title>雲南哈尼梯田的雲海晨光</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-80 雲南哈尼梯田的雲海晨光｜墨水畫（水墨山水＋淡彩）
   地點：雲貴高原南緣，雲南紅河州元陽縣的哀牢山。站在多依樹的觀景台，
        往對面看一整面山坡的哈尼梯田：一丘丘水田順著山勢彎成等高線，
        冬春灌滿水時像一面面鏡子，倒映天光與雲；山谷裡常常積滿雲海。
   哈尼族「四素同構」：山頂是寨神林（森林）→ 山腰是村寨（蘑菇房）
        → 村寨下面是梯田 → 谷底是河流；山上的泉水順著水溝流進梯田，
        用「木刻分水」把水公平地分到各家的田裡，一丘一丘往下流。
   人物與生活：犁田的農人與水牛、背著背簍（背帶套在額頭上）的婦女、
        扛鋤頭看田水的男人、拿長竹竿趕鴨子的人、抽水煙筒的老人、
        餵雞的婦女、玩磨秋的孩子、觀景台上架腳架的攝影師與遊客；
        秋收時在田裡用摜斗摜穀子的人。
   動物：水牛、稻田裡的鴨子、白鷺、雞、狗、田魚、飛鳥、夏夜的螢火蟲。
   兩場秀：雲海日出（陽光從上到下一層層照亮水田）、
        長街宴（昂瑪突節村寨擺出長長的桌子，跳棕扇舞）。
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   風格重點：宣紙底、墨分五色（遠山淡、近處濃）、梯田的田埂用毛筆一條條勾出，
            水田只淡淡染上天光；人物是山水畫的「點景人物」，只在衣服上點一點淡彩。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），部分另有 --k-名稱（晨昏）。
   JS 會依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）。
   梯田的三個季節色（--water、--rice、--gold）會再依季節混成 --paddy。
   ========================================================= */
:root{
  color-scheme: light;

  /* —— 宣紙與天空 —— */
  --d-paper:#f1e9d6;     --k-paper:#f6d6bc;     --n-paper:#1e2433;
  --d-paper-top:#dcd8cc; --k-paper-top:#b9a2ac; --n-paper-top:#0f1421;
  --d-sun:#d8432c;       --k-sun:#e44a28;       --n-sun:#b8402c;
  --d-sunglow:#f3c9a0;   --k-sunglow:#f8ae78;   --n-sunglow:#3a3040;
  --d-sheen:#d2dfe2;     --k-sheen:#f8cfa2;     --n-sheen:#3c4a68;   /* 水田倒映的藍天、霞光 */
  --d-glint:#fff3d6;     --k-glint:#ffc98a;     --n-glint:#8a96b8;   /* 水面反光 */

  /* —— 墨色五階：遠山最淡、近處最濃 —— */
  --d-ink-far:#c4beb0;   --k-ink-far:#c2a8a2;   --n-ink-far:#2c3446;
  --d-ink-far2:#aaa598;  --k-ink-far2:#a8908c;  --n-ink-far2:#262e3e;
  --d-ink-mid:#86847c;   --k-ink-mid:#7c6a6a;   --n-ink-mid:#1e2634;
  --d-ink-near:#4a4843;  --k-ink-near:#4a3c3c;  --n-ink-near:#0e1219;
  --d-ink:#1e1d1b;       --n-ink:#05070b;

  /* —— 雲海 —— */
  --d-cloud:#fffdf8;     --k-cloud:#fde4cc;     --n-cloud:#55617a;
  --d-cloud-sh:#c8c2b2;  --k-cloud-sh:#d8b0a2;  --n-cloud-sh:#30394e;
  --d-mist:#efe9da;      --k-mist:#efd2bc;      --n-mist:#283042;

  /* —— 梯田：三個季節 —— */
  --d-water:#e6e6dc;     --k-water:#f3d2bc;     --n-water:#243048;   /* 冬春灌水：倒映天光 */
  --d-rice:#a9bc84;      --k-rice:#a8a674;      --n-rice:#1e2a24;    /* 夏季青苗 */
  --d-gold:#d8b864;      --k-gold:#d8a05c;      --n-gold:#3a3424;    /* 秋收稻黃（紅米） */
  --d-rice-ink:#5f7a4a;  --n-rice-ink:#121a14;  /* 稻叢的筆觸 */
  --d-gold-ink:#9a7432;  --n-gold-ink:#2a2418;
  --d-bank:#9aa77c;      --k-bank:#a29a70;      --n-bank:#1a2220;    /* 田埂上的草 */
  --d-stream:#fbfaf4;    --n-stream:#5a6684;    /* 水溝的流水 */

  /* —— 山林與村寨 —— */
  --d-tree:#3a4236;      --n-tree:#080c0d;
  --d-tree-tint:#8ea27c; --k-tree-tint:#8e8c68; --n-tree-tint:#1a2422;
  --d-bamboo:#6f8a5a;    --n-bamboo:#141e18;
  --d-bark:#4e4136;      --n-bark:#0e1014;
  --d-earth:#d8b98e;     --k-earth:#dca880;     --n-earth:#3a3430;   /* 蘑菇房的土牆 */
  --d-earth-dk:#a8865e;  --n-earth-dk:#262220;
  --d-thatch:#b49a6a;    --k-thatch:#b88a5e;    --n-thatch:#2e2a26;  /* 茅草屋頂 */
  --d-thatch-dk:#6a583c; --n-thatch-dk:#16140f;
  --d-wood:#7a5a3a;      --n-wood:#241c16;
  --d-stone:#d6cebb;     --k-stone:#dcc4a8;     --n-stone:#2c3240;   /* 觀景台石地 */
  --d-stone-dk:#a8a08c;  --n-stone-dk:#1c212c;
  --d-window:#3a3a38;    --n-window:#ffcf78;   /* 窗戶：夜裡亮燈 */

  /* —— 人物淡彩 —— */
  --d-skin:#e8c49c;      --n-skin:#5c5258;
  --d-indigo:#3c4a6a;    --n-indigo:#161c2a;   /* 哈尼族的靛藍布衣 */
  --d-cloth:#2c2c34;     --n-cloth:#0c0d12;    /* 黑布衣、包頭 */
  --d-red:#c4412e;       --n-red:#4e2626;      /* 衣襟上的刺繡 */
  --d-green:#4f8a5e;     --n-green:#1c3024;
  --d-ochre:#c89a48;     --n-ochre:#43392c;
  --d-blue:#5a7896;      --n-blue:#232e3e;
  --d-white:#efeae0;     --n-white:#4a5060;
  --d-plum:#8a5a6e;      --n-plum:#30232c;
  --d-straw:#c8a860;     --n-straw:#3a3424;    /* 斗笠、背簍 */
  --d-palm:#6a9a4a;      --n-palm:#1c2a18;     /* 棕扇 */

  /* —— 動物 —— */
  --d-buffalo:#3a3836;   --n-buffalo:#0a0b0e;
  --d-duck:#8a6a4a;      --n-duck:#2a2420;
  --d-egret:#fbfaf6;     --n-egret:#6a7288;
  --d-hen:#a8643a;       --n-hen:#2e2018;

  /* —— 不隨日夜變化的顏色 —— */
  --moon:#f6efd8; --star:#f4eedc; --rain:#4a4c58; --flash:#ffffff;
  --firefly:#e8f6a0; --bill:#e09a3a; --bowl:#f4efe2; --dish-1:#c4412e; --dish-2:#e0b040; --dish-3:#6a9a4a;
  --lamp:#fff0b0;

  /* —— 頁面介面 —— */
  --page-bg:#efe7d4; --page-fg:#2a2622; --page-muted:#6e665a;
  --ui-surface:#f8f3e6; --ui-line:#cfc4aa; --ui-accent:#3a4a42; --ui-hot:#b8402c; --ui-hot2:#3c4a6a;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-hand:'IansuiSub',"Noto Sans TC","PingFang TC",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border:6px solid var(--ui-surface);outline:1px solid var(--ui-line);border-radius:3px;overflow:hidden;background:#1e2433;line-height:0;
  box-shadow:0 6px 18px rgba(40,30,20,.12)}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:3px;padding:10px 14px}
.panel button{font:700 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1.5px solid var(--ui-line);
  border-radius:3px;padding:9px 14px;cursor:pointer;letter-spacing:.04em}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:#fff}
.panel button.big{border-color:var(--ui-hot);color:#fff;background:var(--ui-hot)}
.panel button.big2{border-color:var(--ui-hot2);color:#fff;background:var(--ui-hot2)}
.panel button.on{background:#e8b84a!important;border-color:#e8b84a!important;color:var(--page-fg)!important}
.panel button:disabled{opacity:.45;cursor:default}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid #b8402c;outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(220px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding:0;list-style:none;color:var(--page-muted);font-size:14px;line-height:1.8;display:flex;flex-wrap:wrap;gap:4px 22px}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .bubble path{fill:#fbf7ec;stroke:#2a2622;stroke-width:1.4}
#scene .bubble text{fill:#2a2622;font:400 18px var(--font-hand);text-anchor:middle;dominant-baseline:central}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：宣紙天空 → 星星、月亮、太陽 → 淡墨雲絲、飛鳥 → 遠山（哀牢山）
       → 遠方雲海 → 右邊山脊森林 → 左邊寨神林與村寨（蘑菇房、磨秋、長街宴）
       → 梯田（水田、倒影、稻叢、田埂）→ 水溝流水與木刻分水 → 田裡的牛、鴨、白鷺
       → 山谷雲霧 → 田埂上的行人 → 近處雲霧 → 觀景台與攝影師 → 雨、霧 → 宣紙紋理
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="水墨畫風格的雲南元陽哈尼梯田：對面整面山坡是一層層彎彎的水田，像鏡子一樣倒映天光；左上方的山頂是寨神林，林下是茅草屋頂像蘑菇的村寨；田裡有農人牽著水牛犁田、一群鴨子和白鷺，田埂上有背著背簍的婦女走過；山谷裡積著雲海，右下角的觀景台上有攝影師架著腳架">
    <defs>
      <!-- 宣紙天空：上深下淺 -->
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--paper-top)"/><stop offset=".55" style="stop-color:var(--paper)"/><stop offset="1" style="stop-color:var(--paper)"/>
      </linearGradient>
      <!-- 山的墨色：上濃下淡，山腳化成留白的雲霧 -->
      <linearGradient id="gFar" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--ink-far)"/><stop offset=".45" style="stop-color:var(--ink-far)" stop-opacity=".75"/><stop offset="1" style="stop-color:var(--ink-far)" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="gFar2" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--ink-far2)"/><stop offset=".5" style="stop-color:var(--ink-far2)" stop-opacity=".7"/><stop offset="1" style="stop-color:var(--ink-far2)" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--tree-tint)" stop-opacity=".75"/><stop offset=".6" style="stop-color:var(--bank)" stop-opacity=".55"/><stop offset="1" style="stop-color:var(--bank)" stop-opacity=".35"/>
      </linearGradient>
      <!-- 水田的倒影：上面的田倒映地平線附近的淡天色，下面的田倒映頭頂較深的天色 -->
      <linearGradient id="reflG" gradientUnits="userSpaceOnUse" x1="0" y1="230" x2="0" y2="620">
        <stop offset="0" style="stop-color:var(--paper)"/><stop offset=".55" style="stop-color:var(--paper)"/><stop offset="1" style="stop-color:var(--paper-top)"/>
      </linearGradient>
      <radialGradient id="glintG"><stop offset="0" style="stop-color:var(--glint)" stop-opacity=".95"/><stop offset=".45" style="stop-color:var(--glint)" stop-opacity=".45"/><stop offset="1" style="stop-color:var(--glint)" stop-opacity="0"/></radialGradient>
      <!-- 雲：中心濃、邊緣化開 -->
      <radialGradient id="puffG"><stop offset="0" style="stop-color:var(--cloud)"/><stop offset=".55" style="stop-color:var(--cloud)" stop-opacity=".85"/><stop offset="1" style="stop-color:var(--cloud)" stop-opacity="0"/></radialGradient>
      <radialGradient id="puffS"><stop offset="0" style="stop-color:var(--cloud-sh)" stop-opacity=".8"/><stop offset="1" style="stop-color:var(--cloud-sh)" stop-opacity="0"/></radialGradient>
      <radialGradient id="smokeG"><stop offset="0" style="stop-color:var(--ink-far)" stop-opacity=".55"/><stop offset="1" style="stop-color:var(--ink-far)" stop-opacity="0"/></radialGradient>
      <radialGradient id="sunGlowG"><stop offset="0" style="stop-color:var(--sunglow)" stop-opacity=".9"/><stop offset="1" style="stop-color:var(--sunglow)" stop-opacity="0"/></radialGradient>
      <radialGradient id="moonGlowG"><stop offset="0" stop-color="#f6efd8" stop-opacity=".35"/><stop offset="1" stop-color="#f6efd8" stop-opacity="0"/></radialGradient>
      <radialGradient id="lampG"><stop offset="0" stop-color="#fff0b0" stop-opacity=".95"/><stop offset="1" stop-color="#fff0b0" stop-opacity="0"/></radialGradient>
      <radialGradient id="ffG"><stop offset="0" stop-color="#f4ffb8" stop-opacity="1"/><stop offset=".3" stop-color="#e8f6a0" stop-opacity=".7"/><stop offset="1" stop-color="#e8f6a0" stop-opacity="0"/></radialGradient>
      <radialGradient id="inkBloomG"><stop offset="0" style="stop-color:var(--ink)" stop-opacity=".5"/><stop offset=".6" style="stop-color:var(--ink)" stop-opacity=".16"/><stop offset="1" style="stop-color:var(--ink)" stop-opacity="0"/></radialGradient>
      <!-- 墨的毛邊：讓輪廓像毛筆在宣紙上暈開 -->
      <filter id="inkEdge" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="3" seed="11" result="t"/>
        <feDisplacementMap in="SourceGraphic" in2="t" scale="5" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <!-- 人物、動物的淡淡毛邊 -->
      <filter id="inkFig" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency=".25" numOctaves="2" seed="3" result="t"/>
        <feDisplacementMap in="SourceGraphic" in2="t" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="washF" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1"/></filter>
      <filter id="inkSoft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.6"/></filter>
      <filter id="blur3" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
      <!-- 宣紙纖維與顆粒 -->
      <filter id="paperF" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".012 .05" numOctaves="3" seed="4" result="fib"/>
        <feColorMatrix in="fib" type="matrix" values="0 0 0 0 .4  0 0 0 0 .34  0 0 0 0 .25  0 0 0 -3.2 1.62" result="a"/>
        <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="1" seed="9" result="g"/>
        <feColorMatrix in="g" type="matrix" values="0 0 0 0 .3  0 0 0 0 .26  0 0 0 0 .2  0 0 0 -2.4 1.2" result="b"/>
        <feMerge><feMergeNode in="a"/><feMergeNode in="b"/></feMerge>
      </filter>
      <!-- 稻叢：一撮撮短短的筆觸（遠處小、近處大，用三種縮放） -->
      <pattern id="riceP" width="26" height="10" patternUnits="userSpaceOnUse">
        <path d="M14.7 9.5L13.3 4.1M14.7 9.5L14.9 3.6M14.7 9.5L15.8 3.7M11.2 9.5L9.8 3.6M11.2 9.5L10.9 3.7M11.2 9.5L12.5 4.8M13.0 9.5L11.0 4.6M13.0 9.5L12.8 5.5M13.0 9.5L14.7 3.7M4.5 9.5L2.6 4.0M4.5 9.5L4.2 4.5M4.5 9.5L6.3 6.0M5.6 9.5L4.4 5.5M5.6 9.5L5.4 3.8M5.6 9.5L7.1 3.6" stroke="var(--rice-ink)" stroke-width=".9" stroke-linecap="round" fill="none"/>
      </pattern>
      <pattern id="riceP2" href="#riceP" patternTransform="scale(.55 .5)"/>
      <pattern id="riceP3" href="#riceP" patternTransform="scale(1.5 1.6)"/>
      <!-- 稻穗：低垂的金黃穗子 -->
      <pattern id="goldP" width="28" height="10" patternUnits="userSpaceOnUse">
        <path d="M17.3 9.5Q16.4 5.0 12.8 6.6M22.4 9.5Q23.1 4.8 25.8 6.4M23.5 9.5Q24.1 4.8 26.6 6.4M15.5 9.5Q16.0 5.5 18.1 7.1M9.5 9.5Q10.1 4.7 12.4 6.3M12.3 9.5Q13.2 5.1 16.8 6.7M1.5 9.5Q2.1 3.6 4.1 5.2" stroke="var(--gold-ink)" stroke-width="1" stroke-linecap="round" fill="none"/>
      </pattern>
      <pattern id="goldP2" href="#goldP" patternTransform="scale(.55 .5)"/>
      <pattern id="goldP3" href="#goldP" patternTransform="scale(1.5 1.6)"/>
      <!-- 雨：斜斜的淡墨細線 -->
      <pattern id="rainPat" width="90" height="120" patternUnits="userSpaceOnUse">
        <g stroke="var(--rain)" stroke-width="1.1" stroke-linecap="round" opacity=".55">
          <path d="M10 6l-4 22M52 34l-4 22M78 70l-4 22M30 84l-4 22M66 2l-4 22M20 46l-4 22"/>
        </g>
      </pattern>
    </defs>

    <rect id="skyHit" class="clickable" x="-50" y="-50" width="1700" height="700" fill="url(#skyGrad)"/>
    <g id="nightSky" class="noHit"></g>
    <g id="sunG" class="clickable" tabindex="0" role="button" aria-label="太陽：點一下換成夜晚"></g>
    <g id="moonG" class="clickable" tabindex="0" role="button" aria-label="月亮：點一下換成白天"></g>
    <g id="streaks" class="noHit"></g>
    <g id="air"></g>
    <g id="far" class="noHit"></g>
    <rect id="sunWash" class="noHit" x="0" y="0" width="1600" height="600" opacity="0"/>
    <g id="cloudA" class="noHit"></g>
    <g id="ridgeR"></g>
    <g id="hillL"></g>
    <g id="village"></g>
    <g id="smoke" class="noHit"></g>
    <g id="feast" class="noHit"></g>
    <g id="vpeople"></g>
    <g id="terr"></g>
    <g id="stream"></g>
    <g id="paddy"></g>
    <g id="cloudB"></g>
    <g id="banks"></g>
    <g id="cloudC" class="noHit"></g>
    <g id="plat"></g>
    <rect id="mistVeil" class="noHit" x="0" y="0" width="1600" height="600" style="fill:var(--mist)" opacity="0"/>
    <g id="rainG" class="noHit" opacity="0">
      <rect id="rain1" x="-100" y="-240" width="1800" height="960" fill="url(#rainPat)"/>
      <rect id="rain2" x="-100" y="-240" width="1800" height="960" fill="url(#rainPat)" transform="scale(1.4)" opacity=".5"/>
    </g>
    <g id="fx" class="noHit"></g>
    <rect id="flash" class="noHit" x="0" y="0" width="1600" height="600" fill="var(--flash)" opacity="0"/>
    <rect id="paper" class="noHit" x="0" y="0" width="1600" height="600" filter="url(#paperF)" opacity=".5"/>
    <g id="say" class="noHit"></g>
  </svg>
  </figure>

  <!-- =====================================================
       【互動】控制列（畫面中物件自己可以點的動作，這裡不再重複做按鈕）
       ===================================================== -->
  <div class="panel">
    <button id="btnShow" class="big" type="button">🌅 雲海日出</button>
    <button id="btnFeast" class="big2" type="button">🥢 長街宴</button>
    <button id="btnSeason" type="button">季節：冬春水田</button>
    <button id="btnWeather" type="button">天氣：晴</button>
    <button id="btnSound" type="button" aria-pressed="true">🔊 聲音：開</button>
    <button id="btnDay" type="button">☀ 白天</button>
    <button id="btnDusk" type="button">🌇 黃昏</button>
    <button id="btnNight" type="button">☾ 夜晚</button>
    <button id="btnAuto" type="button" aria-pressed="true">自動播放</button>
    <label class="timebox" for="timeRange">
      <span>時間</span>
      <input id="timeRange" type="range" min="0" max="1000" value="350">
      <span class="clock" id="clock">08:24</span>
    </label>
  </div>
  <ul class="hint">
    <li>🌅 雲海日出：陽光一層層照亮水田</li>
    <li>🥢 長街宴：村寨擺長桌、跳棕扇舞</li>
    <li>🖐️ 水牛、鴨子、村民、蘑菇房、磨秋都能點</li>
    <li>🌾 季節可換水田、青苗、稻黃；天氣五種</li>
    <li>🔇 聲音點了才響，可一鍵關閉</li>
  </ul>
</main>
<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);
      }
      return _conn.call(this, dest, ...a);
    };
  }
  function stopAudio() {
    let longs = [], ctx = null;
    for (const s of srcs) {
      const c = s.context, now = c.currentTime, m = s.__ss; ctx = c;
      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }
    if (longs.length && ctx) {
      const g = outs.get(ctx), now = ctx.currentTime;
      if (g) {
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 1.1); g.gain.setValueAtTime(0, now + 1.2);
        g.gain.linearRampToValueAtTime(1, now + 1.9);
      }
      longs.forEach(s => { try { s.stop(now + 1.15); } catch (e) {} srcs.delete(s); });
    }
    srcs.clear();
  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');
    // 凍結色票：把目前的 CSS 變數抄到殘影上，底下換色不影響殘影
    const cs = getComputedStyle(svg);
    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);

    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop

  const btns = [];

            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };

    },

  };
})();

  TER.glint = el('ellipse', { cx: 800, cy: 430, rx: 70, ry: 220, fill: 'url(#glintG)', opacity: 0 }, refl);

  TER.refl = refl;
  // 一層層的田再用短短的田埂隔成一丘丘；每丘水面倒映的天光深淺不同

      cross[z] += `M${f1(x2)} ${f1(ya)}Q${f1(x2 + srand(-5, 5))} ${f1((ya + yb) / 2)} ${f1(x2 + srand(-4, 4))} ${f1(yb)}`;
      const r = srand();
      if (r < .5) {

        const d = 'M' + xs.map(q => f1(q) + ' ' + f1(contourY(i, q))).join('L') + 'L' + [...xs].reverse().map(q => f1(q) + ' ' + f1(contourY(i + 1, q))).join('L') + 'Z';
        if (r < .27) dDark += d; else dLite += d;

  // 4) 稻叢筆觸：遠、中、近三段用不同大小

  } else if (wet) {        // 水田蛙鳴：幾隻青蛙此起彼落

    for (let j = 0; j < n; j++) ambFrog(d, t + rand(0, 1.6), pick([320, 360, 400, 440]), .011, Math.round(rand(4, 8)));
  } else ambCricket(d, t, pick([4300, 4600, 4900]), .006);

  $('skyHit').addEventListener('click', e => { userGesture = true; ensureAudio(); const p = svgPoint(e); skyClick(p.x, p.y); });
  onAct(TER.hit, e => { const p = svgPoint(e); terraceClick(p.x, p.y); });
  [$('cloudB')].forEach(g => { clickable(g, '山谷的雲霧：點一下雲浪翻湧'); onAct(g, e => { const p = svgPoint(e); puffs.forEach(P => { const d = Math.hypot(P.x - p.x, (P.y - p.y) * 2); if (d < 240) P.lift = Math.max(P.lift, 30 * (1 - d / 240)); }); inkBloom(p.x, p.y, .5); sfx('whoosh'); }); });
  onAct(STREAM.wood, () => {
    STREAM.boost = 1; sfx('water'); say(STREAM.x, contourY(0, STREAM.x) - 40, pick(LINES.water), 2.2);
    STREAM.pts.forEach(([x, y], i) => { if (i % 6 === 3) setTimeout(() => { for (let k = 0; k < 4; k++) particle(x, y, 'var(--stream)', rand(-20, 20), rand(-40, -10), .6, 1.4, { g: 160 }); }, i * 40); });
  });
  onAct(TREE.g, () => { TREE.sway = 2; flockAt(250, 190, 6); sfx('rustle'); say(250, 150, LINES.tree[0], 2); });
  houses.forEach(H => onAct(H.o, () => { spawnSmoke(H, 6); sfx('knock'); say(H.x, H.y - 66 * H.s, pick(LINES.house), 1.6); }));
  onAct(PLOW.g, () => { PLOW.boost = 1.2; PLOW.moo = 1.2; sfx('moo'); setTimeout(() => say(PLOW.wx - PLOW.fx * 60 * depthS(PLOW.wy), PLOW.wy - 80, pick(LINES.farmer), 1.6), 600); });
  onAct(harvest, () => { harvest.k = 1.2; sfx('thump'); const b = harvest.getBBox(); for (let k = 0; k < 14; k++) particle(300 + rand(-10, 10), b.y + b.height * .6, 'var(--gold)', rand(-50, 50), rand(-90, -40), .9, 1.6, { g: 220 }); say(300, b.y - 20, pick(LINES.harvest), 1.6); });
  onAct(HERD.ducksG, () => { ducks.forEach((D, i) => setTimeout(() => D.flap = .8, i * 60)); sfx('quack'); ducks.forEach(D => { if (Math.random() < .4) ripple(D.x, bandY(HERD.band, D.x, D.lane), .6); }); });
  onAct(HERD.W, () => { HERD.pause = 1.4; sfx('greet'); say(HERD.x, contourY(HERD.band, HERD.x) - 70 * depthS(contourY(HERD.band, HERD.x)), pick(LINES.herder), 1.6); setTimeout(() => sfx('quack'), 500); });
  egrets.forEach(E => onAct(E.g, () => { egretFly(E); sfx('flap'); }));
  walkers.forEach(A => onAct(A.W, () => { A.pause = 1.2; sfx('greet'); const y = contourY(A.band, A.x); say(A.x, y - 66 * A.s, pick(LINES[A.lines]), 1.5); }));
  vwalk.forEach(A => onAct(A.W, () => { A.pause = 1.2; sfx('greet'); say(A.x, VSTREET(A.x) - 40, pick(LINES.basket), 1.4); }));
  onAct(elder.g.parentNode, () => {
    elder.t = 2.2; sfx('bubble');
    setTimeout(() => { for (let k = 0; k < 5; k++) setTimeout(() => particle(elder.ex + 4, elder.ey, 'var(--ink-far)', rand(4, 12), rand(-16, -8), 2.4, 2, { g: -2, grow: 4, op: .5 }), k * 120); }, 900);
    say(elder.ex, elder.ey - 26, pick(LINES.pipe), 1.6);
  });
  onAct(feeder.g.parentNode, () => { feeder.t = 2.4; hens.forEach(C => C.t = 1); for (let k = 0; k < 10; k++) particle(feeder.fx - 6, feeder.fy - 18, 'var(--gold)', rand(-40, -5), rand(-30, -5), .7, 1, { g: 150 }); sfx('cluck'); });
  hens.forEach(C => onAct(C.g, () => { C.t = 1.2; sfx('cluck'); say(C.x, VSTREET(C.x) - 28, LINES.hen[0], 1.2); }));
  onAct(dog, () => { dog.t = 2; sfx('bark'); say(214, VSTREET(214) - 30, LINES.dog[0], 1.2); });
  onAct(moqiu.g, () => { moqiu.boost = 1.6; sfx('creak'); say(moqiu.x, moqiu.y - 70, pick(LINES.kids), 1.6); });
  shooters.forEach(S => onAct(S.W, () => { S.ft = .5; sfx('shutter'); say(S.x - 10, S.y - 84 * S.s, pick(LINES.photo), 1.4); }));
  onAct(tourist.W, () => { tourist.t = 2.2; sfx('greet'); say(tourist.x - 20, tourist.y - 84, pick(LINES.tourist), 1.8); });
  // 滑鼠：劃過水田一路起漣漪、劃過稻田吹起稻浪；靠近雲會被推開
  svg.addEventListener('pointermove', e => {
    const p = svgPoint(e); mouse.x = p.x; mouse.y = p.y; mouse.in = true;
    if (reduced) return;
    if (Math.hypot(p.x - mouse.lx, p.y - mouse.ly) > 22 && p.y > topY(p.x) + 4 && !(p.x > 1320 && p.y > 490)) {
      mouse.lx = p.x; mouse.ly = p.y;
      if (SEA.w > .5) ripple(p.x, p.y, .8); else riceWave(p.x, p.y);
    }
  });
  svg.addEventListener('pointerleave', () => { mouse.in = false; });

  $('btnShow').addEventListener('click', () => startShow());
  $('btnFeast').addEventListener('click', () => startFeast());
  $('btnSeason').addEventListener('click', () => { userGesture = true; ensureAudio(); setSeason((seaIdx + 1) % SEASONS.length); sfx(seaIdx === 0 ? 'water' : 'rustle'); });
  $('btnWeather').addEventListener('click', () => { userGesture = true; ensureAudio(); setWeather((wxIdx + 1) % WX.length); if (WX[wxIdx][0] === 'sea' || WX[wxIdx][0] === 'fog') sfx('whoosh'); });
  $('btnSound').addEventListener('click', () => {
    soundOn = !soundOn; userGesture = true; ensureAudio();
    if (master) master.gain.setValueAtTime(soundOn ? .6 : 0, actx.currentTime);
    if (!soundOn) { stopAll(); rainSound(false); } else rainSound(wxT.rain > 0);
    $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  });
  $('btnDay').addEventListener('click', () => setTime(10));
  $('btnDusk').addEventListener('click', () => setTime(18.5));
  $('btnNight').addEventListener('click', () => setTime(22));
  $('btnAuto').addEventListener('click', () => { T.auto = !T.auto; $('btnAuto').setAttribute('aria-pressed', String(T.auto)); });
  const tr = $('timeRange');
  tr.addEventListener('input', () => { if (show.on) return; T.dragging = true; T.t = tr.value / 1000; applyColors(true); });
  tr.addEventListener('change', () => { T.dragging = false; });
  window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
  window.addEventListener('pointerdown', () => document.body.classList.remove('kbd'));
  mq.addEventListener && mq.addEventListener('change', () => { reduced = mq.matches; });
}

/* ---------------- 初始化 ---------------- */
function init() {
  // 晨昏時照在山上的暖光（中心跟著太陽移動）
  washG = el('radialGradient', { id: 'washG', gradientUnits: 'userSpaceOnUse', cx: 1300, cy: 260, r: 900 }, svg.querySelector('defs'));
  el('stop', { offset: 0, style: 'stop-color:var(--sunglow)', 'stop-opacity': .9 }, washG);
  el('stop', { offset: .5, style: 'stop-color:var(--sunglow)', 'stop-opacity': .35 }, washG);
  el('stop', { offset: 1, style: 'stop-color:var(--sunglow)', 'stop-opacity': 0 }, washG);
  $('sunWash').setAttribute('fill', 'url(#washG)');
  // 雷雨時整個畫面暗下來的一層淡墨
  el('rect', { id: 'dimVeil', class: 'noHit f-ink-mid', x: 0, y: 0, width: 1600, height: 600, opacity: 0 }, svg).parentNode.insertBefore($('dimVeil'), $('mistVeil'));
  drawSky();
  drawFar();
  drawClouds();
  drawRidgeR();
  drawHillL();
  drawVillage();
  drawTerraces();
  drawStream();
  ripG = el('g', { class: 'noHit' }, $('paddy'));
  drawPaddyLife();
  drawBankWalkers();
  drawVillagePeople();
  drawFeast();
  drawPlatform();
  drawPlatPeople();
  for (let i = 0; i < 26; i++) { const x = rand(0, 1300), y = rand(360, 590); fireflies.push({ x, y, ph: rand(0, 6), n: el('circle', { r: 5, fill: 'url(#ffG)', opacity: 0 }, $('fx')) }); }
  bindAll();
  if (reduced) { T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false'); }
  setSeason(0); Object.assign(SEA, seaT);
  setWeather(0); Object.assign(wx, wxT);
  applyColors(true);
  step(1 / 60);
  requestAnimationFrame(loop);
}
init();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on ? 'sun' : feast.on ? 'feast' : '',
  btn: { sun: 'btnShow', feast: 'btnFeast' },
  ff: () => {   // 跳到結尾，讓場景自己收尾（梯田光、宴席桌都會收起來）
    if (show.on) { show.fired = new Proxy({}, { get: () => 1 }); show.t = show.dur; } else { feast.fired = new Proxy({}, { get: () => 1 }); feast.t = feast.dur; }
  },
  save: () => ({ t: T.t, auto: T.auto, s: seaIdx, w: wxIdx }),
  stop: () => { show.on = false; feast.on = false; $('btnShow').classList.remove('on'); $('btnFeast').classList.remove('on'); $('btnShow').disabled = $('btnFeast').disabled = false; },
  restore: s => {
    if (seaIdx !== s.s) { setSeason(s.s); Object.assign(SEA, seaT); }
    if (wxIdx !== s.w) setWeather(s.w);
    T.t = s.t; T.auto = s.auto; $('btnAuto').setAttribute('aria-pressed', String(T.auto)); applyColors(true);
  }
});
/* /ShowStop */
})();
</script>
</body>
