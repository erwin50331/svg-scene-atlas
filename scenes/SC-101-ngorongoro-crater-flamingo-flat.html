<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>恩格羅恩格羅火山口的紅鶴湖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-101 恩格羅恩格羅火山口的紅鶴湖｜扁平插畫 flat illustration
   地點：坦尚尼亞北部・恩格羅恩格羅保護區（Ngorongoro Conservation Area）。
        站在火山口底部的草原上，四周是高約 600 公尺、長滿森林的火山口內壁，
        直徑約 19 公里，是世界上最大、沒有積水也沒有崩塌的完整火山口（破火山口）。
        左邊是黃皮金合歡（fever tree）組成的萊萊森林（Lerai），裡面有長牙老公象；
        右邊是馬加迪鹼湖（Lake Magadi），湖邊一圈白色鹼殼，上千隻紅鶴站在淺水裡；
        中景有黑犀牛母子、斑馬與牛羚、湯氏瞪羚、鴕鳥、灰冠鶴，泥土路旁趴著黑鬃獅子；
        左前方是恩戈伊托基托克泉（Ngoitokitok）的河馬池與野餐區（黑鳶會搶遊客的三明治），
        右前方是穿紅色格子披布（shuka）的馬賽人帶牛來泉邊喝水。
   遊獵車、營地都是原創造型，沒有真實品牌。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   --d-名稱 = 白天、--n-名稱 = 夜晚、--k-名稱 = 黃昏（--n／--k 可省略，省略時程式自動算出夜色與暮色）。
   JS 依時間混色，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（線色）兩個 class。
   沒有 --d- 前綴的（例如 --lamp）是固定色，不隨日夜改變。
   ========================================================= */
:root{
  color-scheme: light;
  /* —— 天空 —— */
  --d-skyT:#4eaee6; --k-skyT:#5d5aa8; --n-skyT:#0a1330;
  --d-skyB:#d2eef6; --k-skyB:#ffb07a; --n-skyB:#22305a;
  --d-cloud:#ffffff; --k-cloud:#ffdcc4; --n-cloud:#3a4472;
  --d-cloudSh:#dcebf2; --k-cloudSh:#f2aa90; --n-cloudSh:#2b345e;
  /* —— 火山口內壁（遠：藍綠、近底部：草綠）、邊緣的山地森林 —— */
  --d-wall:#7aa88e; --k-wall:#a48d8c; --n-wall:#1b2a3c;
  --d-wallLt:#93bf9c; --k-wallLt:#c09a8c; --n-wallLt:#22344a;
  --d-wallSh:#5f8f78; --k-wallSh:#7e6c7c; --n-wallSh:#142133;
  --d-wallFoot:#9dbb84; --k-wallFoot:#b8a078; --n-wallFoot:#1d3030;
  --d-rimForest:#3d7650; --k-rimForest:#5a5a5a; --n-rimForest:#101e22;
  --d-rimForestLt:#4f8a5e; --n-rimForestLt:#152a2a;
  --d-haze:#cfe6ea; --k-haze:#ffcfb0; --n-haze:#26365a;
  --d-lodge:#e9dcc2; --n-lodge:#3a3a50;
  --d-lodgeRoof:#8a5a3a; --n-lodgeRoof:#2a2230;
  /* —— 火山口底部：遠草原、近草原、泥土路 —— */
  --d-plainFar:#c2cf86; --k-plainFar:#d8b47a; --n-plainFar:#22352e;
  --d-plain:#b0c96c; --k-plain:#c9b06a; --n-plain:#1c3128;
  --d-plainLt:#c7d880; --n-plainLt:#223a2e;
  --d-plainDk:#94b45a; --n-plainDk:#172a22;
  --d-grass:#86b04c; --k-grass:#9e9a4a; --n-grass:#13281e;
  --d-grassDk:#6c9a3e; --n-grassDk:#0f2219;
  --d-grassDry:#d6c27a; --n-grassDry:#3a3a2c;
  --d-road:#cfa874; --k-road:#d89a6e; --n-road:#3a3240;
  --d-roadLt:#e0c08e; --n-roadLt:#463c4a;
  --d-rock:#8c8478; --n-rock:#2c2c36;
  /* —— 馬加迪鹼湖、河馬池 —— */
  --d-lake:#9cc8d4; --k-lake:#e0a296; --n-lake:#1c2c4a;
  --d-lakeLt:#cbe7ee; --k-lakeLt:#ffd0b0; --n-lakeLt:#2e4264;
  --d-lakePink:#f1b2be; --k-lakePink:#f59a8a; --n-lakePink:#4a3050;
  --d-soda:#f6f1e6; --k-soda:#ffe2c8; --n-soda:#4c5272;
  --d-pool:#6c9cae; --k-pool:#c88a80; --n-pool:#16243c;
  --d-poolLt:#9cc4d0; --n-poolLt:#24385a;
  --d-mud:#8c7252; --n-mud:#2c2630;
  /* —— 黃皮金合歡（fever tree）—— */
  --d-fever:#d9d36c; --k-fever:#e6b468; --n-fever:#4a4a34;
  --d-feverSh:#b8b456; --n-feverSh:#36382a;
  --d-leaf:#8cb84e; --k-leaf:#a0a04a; --n-leaf:#16301e;
  --d-leafDk:#6f9e3e; --n-leafDk:#10261a;
  --d-leafLt:#a8cc62; --n-leafLt:#1c3622;
  /* —— 動物 —— */
  --d-zebW:#f7f5ef; --n-zebW:#5a5e74; --d-zebK:#25232a; --n-zebK:#0c0c14;
  --d-gnu:#5e5a62; --n-gnu:#22222e; --d-gnuDk:#3c3942; --n-gnuDk:#16161e;
  --d-rhino:#8e8a86; --n-rhino:#33343e; --d-rhinoDk:#6c6965; --n-rhinoDk:#24252e; --d-horn:#cfc6b6;
  --d-ele:#9a948f; --n-ele:#35363f; --d-eleDk:#7a746f; --n-eleDk:#26272f; --d-tusk:#f4ecd6;
  --d-lion:#d9a75c; --k-lion:#e09a58; --n-lion:#4a4038; --d-lionDk:#b8843e; --n-lionDk:#3a3028; --d-mane:#3e2a20; --n-mane:#18121a;
  --d-hippo:#8a7680; --n-hippo:#2e2a36; --d-hippoPk:#dba2a2; --n-hippoPk:#4a3440;
  --d-buff:#3c3638; --n-buff:#16141a; --d-buffHorn:#6a625c;
  --d-hyena:#b89e78; --n-hyena:#3c3630; --d-hyenaSp:#5a4838;
  --d-gaz:#c98a4a; --n-gaz:#3e3024; --d-gazW:#f6eee0; --d-gazK:#2e2620;
  --d-ostK:#2a2628; --d-ostW:#f4f0ea; --d-ostSkin:#d9a0a0;
  --d-crane:#8c939c; --n-crane:#2e3240; --d-craneW:#f4f4f2; --d-crown:#e8c050; --d-wattle:#d8343a;
  --d-flam:#f28aa8; --k-flam:#ff8a90; --n-flam:#5a3450; --d-flamLt:#f8bccb; --n-flamLt:#6a4462; --d-flamDk:#d85a82; --n-flamDk:#4a2a44;
  --d-kite:#7a5436; --n-kite:#2a2028; --d-vulture:#6c5e52;
  --d-hog:#7c6a60; --n-hog:#2e2a2e;
  --d-cow1:#8a4a2a; --d-cow2:#f2ece2; --d-cow3:#2c2624; --d-cow4:#c48a56; --d-cowHorn:#e8dcc4;
  /* —— 人物：皮膚、馬賽披布（shuka）、珠飾、遊客、巡山員 —— */
  --d-skin1:#f4d2b4; --d-skin2:#d9a882; --d-skin3:#9a6444; --d-skin4:#5e3a26; --d-skin5:#7a4a30;
  --d-hair1:#221c1e; --d-hair2:#6e4a2c; --d-hair3:#e2bf6a; --d-hair4:#c9c2b6;
  --d-shukaR:#cf2f2a; --d-shukaR2:#a8201e; --d-shukaB:#2f5aa8; --d-shukaP:#7a3aa0;
  --d-bead1:#f2f2ee; --d-bead2:#e8b02e; --d-bead3:#2a8ad0; --d-bead4:#d8343a; --d-bead5:#3aa860;
  --d-khaki:#cdb68a; --d-olive:#7c7a4a; --d-ranger:#4e6a3e;
  --d-c1:#e8463e; --d-c2:#2f72c4; --d-c3:#f6b93b; --d-c4:#3faa6e; --d-c5:#a65fd0;
  --d-c6:#ff8fb0; --d-c7:#17a2a0; --d-c8:#ffffff; --d-c9:#ff7a2f; --d-c10:#2a3550;
  --d-staff:#6a4a2c;
  /* —— 遊獵車（原創造型，沒有品牌）—— */
  --d-jeep1:#7a8450; --d-jeep2:#d8c49a; --d-jeep3:#f0ece2;
  --d-jeepDk:#4a4e34; --d-tire:#2a2626; --d-glass:#a8cfe0; --n-glass:#2a3a58; --d-canvas:#e6dcc0;
  --d-shadow:#0000001f; --n-shadow:#00000040;

  /* —— 固定色：燈光、天體、特效 —— */
  --sun:#ffd166; --sunCore:#fff2c4; --moon:#f7f0d4; --star:#fff6da; --milky:#c8d4ff;
  --lamp:#ffe08a; --glow:#ffcf6a; --eyeshine:#e8ff9a; --headlight:#fff3c0;
  --flash:#ffffff; --dust:#c99a5c; --lightning:#f4f6ff;
  --rainc:#a8bcd0; --wx-cloud:#8d97a6; --wx-rain:#34465e; --wx-dust:#c89a5a;
  --nightBase:#121a3c; --duskBase:#ff9a6a;

  /* —— 頁面介面 —— */
  --page-bg:#f5f3ee; --page-fg:#1e2a3e; --page-muted:#5f6878;
  --ui-surface:#ffffff; --ui-line:#d9dde4; --ui-accent:#d85a82; --ui-accent-2:#2f8a6a;
  --cine-shade:#000000; --cine-light:#fff3dc;
  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:14px;overflow:hidden;background:var(--skyB,#d2eef6);line-height:0;box-shadow:0 2px 12px #0000001f}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:12px;padding:10px 14px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--page-fg);border-color:var(--page-fg);color:#fff;font-weight:700}
.panel button.big{border-color:var(--ui-accent);color:#fff;background:var(--ui-accent);font-weight:700}
.panel button.big.alt{border-color:var(--ui-accent-2);background:var(--ui-accent-2)}
.panel button.big.on{background:#f2b632;border-color:#f2b632;color:var(--page-fg)}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid var(--ui-accent);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable,#scene [role="button"]{cursor:pointer}
#scene .bubble rect{fill:#ffffff;stroke:#1e2a3e;stroke-width:1.6}
#scene .bubble text{fill:#1e2a3e;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .bubble .pop{animation:pop var(--dur,1.6s) ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){ #scene .bubble .pop{animation:none} }
</style>
</head>
<body>
<main class="wrap">
  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：天空（漸層、銀河、太陽月亮、星星、雲）→ 遠景（火山口內壁、邊緣森林、營地、雲瀑）
       → 中景（遠草原、萊萊森林與老公象、馬加迪鹼湖與紅鶴、水牛、黑犀牛、斑馬牛羚、鴕鳥、泥土路、遊獵車、獅子）
       → 近景（河馬池與野餐區、灰冠鶴、疣豬、馬賽人與牛群、前景金合歡）→ 天氣 → 表演氛圍
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="扁平插畫風格的恩格羅恩格羅火山口：四周是長滿森林的火山口內壁，雲從邊緣流下來；左邊是黃皮金合歡森林與長牙老公象，右邊是粉紅色的鹼湖與上千隻紅鶴；中間有黑犀牛母子、斑馬、牛羚、鴕鳥和趴在路邊的黑鬃獅子，遊獵車在泥土路上；前景是河馬池、野餐區、灰冠鶴，以及帶牛來喝水的馬賽人。">
    <defs>
      <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--skyT)"/><stop offset="1" style="stop-color:var(--skyB)"/>
      </linearGradient>
      <!-- 火山口內壁下半部的空氣遠近感（越往下越淡） -->
      <linearGradient id="hazeG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--haze);stop-opacity:0"/><stop offset="1" style="stop-color:var(--haze);stop-opacity:.55"/>
      </linearGradient>
      <!-- 馬賽披布的紅色格紋 -->
      <pattern id="shukaChk" width="8" height="8" patternUnits="userSpaceOnUse">
        <rect width="8" height="8" class="f-shukaR"/><rect width="8" height="2" y="5" class="f-shukaR2"/><rect width="2" height="8" x="5" class="f-shukaR2"/><rect width="8" height=".8" y="2" class="f-zebK" opacity=".35"/>
      </pattern>
      <pattern id="shukaBlu" width="8" height="8" patternUnits="userSpaceOnUse">
        <rect width="8" height="8" class="f-shukaB"/><rect width="8" height="2" y="5" class="f-zebK" opacity=".3"/><rect width="1.4" height="8" x="5" class="f-shukaR" opacity=".8"/>
      </pattern>
      <radialGradient id="glowG"><stop offset="0" style="stop-color:var(--glow);stop-opacity:.9"/><stop offset="1" style="stop-color:var(--glow);stop-opacity:0"/></radialGradient>
      <radialGradient id="sunG"><stop offset=".35" style="stop-color:var(--sun);stop-opacity:.55"/><stop offset="1" style="stop-color:var(--sun);stop-opacity:0"/></radialGradient>
      <radialGradient id="lightG"><stop offset="0" style="stop-color:var(--headlight);stop-opacity:.75"/><stop offset="1" style="stop-color:var(--headlight);stop-opacity:0"/></radialGradient>
      <linearGradient id="rayG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sunCore);stop-opacity:.5"/><stop offset="1" style="stop-color:var(--sunCore);stop-opacity:0"/>
      </linearGradient>
      <!-- 雲瀑：上面濃、往下漸漸散掉 -->
      <linearGradient id="spillG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--cloud);stop-opacity:.95"/><stop offset=".55" style="stop-color:var(--cloud);stop-opacity:.55"/><stop offset="1" style="stop-color:var(--cloud);stop-opacity:0"/>
      </linearGradient>
      <clipPath id="frameClip"><rect x="0" y="0" width="1600" height="600"/></clipPath>
      <clipPath id="lakeClip"><ellipse cx="1120" cy="333" rx="316" ry="21"/></clipPath>
      <clipPath id="poolClip"><ellipse cx="190" cy="528" rx="176" ry="30"/></clipPath>
    </defs>

    <g clip-path="url(#frameClip)">
    <!-- ===== 場景：天空 ===== -->
    <rect x="0" y="0" width="1600" height="600" fill="url(#skyG)"/>
    <rect id="skyTint" x="0" y="0" width="1600" height="340" opacity="0" pointer-events="none"/>
    <rect id="skyHit" x="0" y="0" width="1600" height="150" fill="transparent" class="clickable" tabindex="0" role="button" aria-label="天空：白天禿鷲盤旋，夜晚劃過流星"/>
    <g id="milky" pointer-events="none" opacity="0"></g>
    <g id="stars" pointer-events="none"></g>
    <g id="sun" pointer-events="none"></g>
    <g id="moon" pointer-events="none"></g>
    <g id="clouds" pointer-events="none"></g>
    <g id="overcast" pointer-events="none" opacity="0"></g>
    <g id="birds" pointer-events="none"></g>

    <!-- ===== 場景：遠景（火山口內壁、邊緣森林、營地、雲瀑） ===== -->
    <g id="parFar">
      <g id="wall"></g>
      <g id="spill" pointer-events="none"></g>
      <g id="rimMist" pointer-events="none" opacity="0"></g>
    </g>
    <!-- 日出光束：從東邊邊緣斜斜照進火山口 -->
    <g id="rays" pointer-events="none" opacity="0"></g>

    <!-- ===== 場景：中景（火山口底部） ===== -->
    <g id="parMid">
      <g id="floorFar"></g>
      <g id="lerai"></g>
      <g id="lake"></g>
      <g id="flamLake"></g>
      <g id="buffalo"></g>
      <g id="laneA"></g>
      <g id="midAnimals"></g>
      <g id="laneB"></g>
      <g id="hyenas"></g>
      <g id="road"></g>
      <g id="jeepsB"></g>
      <g id="jeepsA"></g>
      <g id="lions"></g>
      <g id="dust" pointer-events="none"></g>
      <g id="flock" pointer-events="none"></g>
    </g>

    <!-- ===== 場景：近景 ===== -->
    <g id="parNear">
      <g id="ground"></g>
      <g id="pool"></g>
      <g id="picnic"></g>
      <g id="cranes"></g>
      <g id="hogs"></g>
      <g id="maasai"></g>
      <g id="fgTree"></g>
      <g id="kites" pointer-events="none"></g>
    </g>

    <!-- ===== 天氣與氛圍 ===== -->
    <g id="rain" pointer-events="none" opacity="0"></g>
    <rect id="wxTint" x="0" y="0" width="1600" height="600" opacity="0" pointer-events="none"/>
    <rect id="bolt" x="0" y="0" width="1600" height="600" opacity="0" pointer-events="none" style="fill:var(--lightning)"/>
    <g id="fx" pointer-events="none"></g>
    <g id="notes" pointer-events="none"></g>
    <g id="bubbles" pointer-events="none"></g>
    <!-- 表演氛圍（取代寬銀幕黑邊）：四周輕微暗角＋中央微亮，緩緩淡入淡出 -->
    <g id="cineFx" opacity="0" pointer-events="none">
      <defs>
        <radialGradient id="cineShadeG" cx=".5" cy=".5" r=".72"><stop offset=".52" style="stop-color:var(--cine-shade);stop-opacity:0"/><stop offset="1" style="stop-color:var(--cine-shade);stop-opacity:.4"/></radialGradient>
        <radialGradient id="cineLightG" cx=".5" cy=".45" r=".5"><stop offset="0" style="stop-color:var(--cine-light);stop-opacity:.08"/><stop offset="1" style="stop-color:var(--cine-light);stop-opacity:0"/></radialGradient>
      </defs>
      <rect x="0" y="0" width="1600" height="600" fill="url(#cineShadeG)"/>
      <rect x="0" y="0" width="1600" height="600" fill="url(#cineLightG)"/>
    </g>
    </g>
  </svg>
  </figure>

  <!-- ===== 互動：控制列 ===== -->
  <div class="panel">
    <button id="btnFlam" class="big" type="button">🦩 紅鶴飛越火山口</button>
    <button id="btnDawn" class="big alt" type="button">☁ 雲瀑晨光冠鶴舞</button>
    <button id="btnWeather" type="button">天氣：晴</button>
    <button id="btnSound" type="button" aria-pressed="true">🔊 聲音：開</button>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;

  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消

  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {

    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };

  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);

    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);

    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}

    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);

    try { ghost(svg); } catch (e) {}

    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop

    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }

    zone = Math.max(0, zone - 1);

    try { cfg.after && cfg.after(); } catch (e) {}

    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}

  }

  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }

    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';

      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它

      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {

    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);

        const b = document.getElementById(id); if (!b) return;

            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };

          }

      });

      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();

/* ---- 表演氛圍（取代寬銀幕黑邊）：k = 0~1，四周輕微暗角＋中央微亮 ---- */
let cineK = 0, cineW = 0;
function setCine(k, fx, fy) {
  cineK = k = Math.max(0, Math.min(1, k));
  if (k === cineW || (Math.abs(k - cineW) < .004 && k > 0 && k < 1)) return;
  cineW = k;

}

/* =========================================================
   SC-101 恩格羅恩格羅火山口的紅鶴湖｜程式區
   區塊：①工具與色票

}

const FLY_PTS = [[1120, 330], [1040, 262], [860, 196], [600, 160], [360, 168], [210, 206], [260, 250], [520, 262], [820, 246], [1080, 252], [1260, 290], [1180, 332]];
function flyAt(s) {
  const n = FLY_PTS.length - 1, f = clamp(s, 0, 1) * n, i = Math.min(n - 1, Math.floor(f)), t = f - i;
  const P = k => FLY_PTS[clamp(k, 0, n)];
  const [p0, p1, p2, p3] = [P(i - 1), P(i), P(i + 1), P(i + 2)];
  const cr = (a, b, c, d) => .5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t * t + (-a + 3 * b - 3 * c + d) * t * t * t);
  return [cr(p0[0], p1[0], p2[0], p3[0]), cr(p0[1], p1[1], p2[1], p3[1])];

/* ---------------- ③ 角色：兩條單向的動物步道（斑馬、牛羚、瞪羚；同一條走同一方向、保持距離、會停下吃草） ---------------- */
const HERD_LANES = [{ y: 388, s: .8, dir: -1 }, { y: 416, s: .92, dir: 1 }];
const herd = [];
function drawHerds() {
  const list = [
    [0, 'zebra', 140], [0, 'gnu', 260], [0, 'gnu', 380], [0, 'zebra', 700], [0, 'zebra', 800], [0, 'gnu', 1040], [0, 'zebra', 1250], [0, 'gnu', 1380],
    [1, 'zebra', 60], [1, 'gaz', 300], [1, 'gaz', 350], [1, 'gnu', 760], [1, 'zebra', 1000], [1, 'zebra', 1110], [1, 'gaz', 1420]
  ];
  list.forEach(([lane, sp, x], i) => {
    const L = HERD_LANES[lane], S = SPEC[sp];
    const g = el('g', {}, $(lane ? 'laneB' : 'laneA'));
    frag(g, S.svg());
    const name = { zebra: '斑馬', gnu: '牛羚', gaz: '湯氏瞪羚' }[sp];
    hit(g, name + '：點一下');
    herd.push({ el: g, sp, S, lane, x, y: L.y + (i % 3) - 1, s: L.s * (sp === 'gaz' ? 1 : srand(.94, 1.06)), dir: L.dir, base: srand(9, 13), v: 0, ph: srand(0, 6),
      lA: g.querySelector('.lA'), lB: g.querySelector('.lB'), hd: g.querySelector('.hd'), tail: g.querySelector('.tail'), graze: srand(0, 4), walk: srand(2, 6), head: 0, look: 0, run: 0 });
  });
}
function updateHerds(dt) {
  for (let lane = 0; lane < 2; lane++) {
    const L = HERD_LANES[lane];
    const ws = herd.filter(w => w.lane === lane).sort((a, b) => (b.x - a.x) * L.dir);
    ws.forEach((w, i) => {
      // 走一段、停下來吃草一段
      if (w.graze > 0) { w.graze -= dt; if (w.graze <= 0) w.walk = rand(4, 9); }
      else { w.walk -= dt; if (w.walk <= 0) w.graze = rand(3, 8); }
      let target = (w.graze > 0 && w.run <= 0) ? 0 : w.base * (w.run > 0 ? 4 : 1);
      if (w.run > 0) w.run -= dt;
      const ahead = i > 0 ? ws[i - 1] : null;
      if (ahead) {
        const gap = (ahead.x - w.x) * L.dir, need = 46 * w.s;
        if (gap < need * 1.4) target = Math.min(target, ahead.v * .9);
        if (gap < need) target = 0;
      }
      w.v += (target - w.v) * Math.min(1, dt * 2.5);
      w.x += L.dir * w.v * dt;
      if (L.dir > 0 && w.x > 1700) w.x = -100;
      if (L.dir < 0 && w.x < -100) w.x = 1700;
      if (w.v > .5) w.ph += w.v * dt / (9 * w.s);
      const a = w.v > .5 ? Math.sin(w.ph * Math.PI) * clamp(w.v / 6, 0, 1) * (w.run > 0 ? 26 : 16) : 0;
      legSwing(w.lA, w.S.top, a); legSwing(w.lB, w.S.top, -a);
      // 停下來就低頭吃草；表演時抬頭看天空
      const want = w.look > 0 ? -18 : (w.v < 2 && w.graze > 0 ? w.S.graze : 0);
      if (w.look > 0) w.look -= dt;
      w.head += (want - w.head) * Math.min(1, dt * 3);
      w.hd.setAttribute('transform', `rotate(${f1(w.head + Math.sin(clock * 2 + w.ph) * (w.head > 20 ? 3 : 1))} ${w.S.px} ${w.S.py})`);
      const bob = w.v > .5 ? Math.abs(Math.sin(w.ph * Math.PI)) * -1 : 0;
      w.el.setAttribute('transform', `translate(${f1(w.x)} ${f1(w.y + bob)}) scale(${f1(w.s * L.dir)} ${f1(w.s)})`);
    });
  }
}

const nextLine = (k, arr) => { sayI[k] = ((sayI[k] ?? -1) + 1) % arr.length; return arr[sayI[k]]; };

/* ---------------- 動畫主迴圈 ---------------- */
let last = 0, rafId = 0;
function loop(now) {
  const dt = clamp((now - last) / 1000, 0, .05); last = now;
  step(dt);
  rafId = requestAnimationFrame(loop);
}
function settle(sec) { for (let s = 0; s < sec; s += .05) step(.05); }
function renderStill() { step(.0001); }
function start() {
  cancelAnimationFrame(rafId);
  if (reduced) { T.auto = false; syncAuto(); applyTime(true); settle(1.5); }
  else { last = performance.now(); rafId = requestAnimationFrame(loop); }
}

/* ---------------- 開始：依序畫出場景、角色 ---------------- */
drawSky();
drawWall();
drawFloor();
drawLerai();
drawLake();
drawFlamingos();
drawBack();
drawHerds();
drawRhinos();
drawHyenas();
drawRoad();
drawJeeps();
drawLions();

// 紅鶴群與湖上的紅鶴配對
flock.forEach((f, i) => { if (!f.extra) { f.lb = lakeFlams.find(l => l.flockI === i); f.lb0 = f.lb; } });

/* ---------------- ⑤ 互動：點擊 ---------------- */
function onAct(node, fn) {
  node.addEventListener('click', e => { e.stopPropagation(); userGesture = true; ensureAudio(); fn(e); if (reduced) settle(.6); });
  node.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); userGesture = true; ensureAudio(); fn(e); if (reduced) settle(.6); } });
}
function svgPoint(e) {
  const p = svg.createSVGPoint(); p.x = e.clientX ?? 800; p.y = e.clientY ?? 300;
  if (!e.clientX && e.target && e.target.getBBox) { try { const b = e.target.getBBox(); return { x: b.x + b.width / 2, y: b.y + b.height / 2 }; } catch (er) {} }
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
svg.addEventListener('pointerdown', () => { userGesture = true; ensureAudio(); document.body.classList.remove('kbd'); });
window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
svg.addEventListener('pointermove', e => { const p = svgPoint(e); px = clamp((800 - p.x) / 800, -1, 1); });
svg.addEventListener('pointerleave', () => { px = 0; });

// 天空：白天一群禿鷲跟著熱氣流盤旋，夜晚劃過流星
onAct($('skyHit'), e => {
  const p = svgPoint(e);
  if (night > .55) { const m = el('line', { style: 'stroke:var(--star)', 'stroke-width': 2, 'stroke-linecap': 'round' }, $('stars')); meteors.push({ el: m, x: rand(200, 1000), y: rand(20, 80), t: 0 }); sfx(t => glock(t, hz(86), .03)); return; }
  for (let i = 0; i < 5; i++) addVulture(clamp(p.x, 120, 1480), clamp(p.y, 50, 110), rand(30, 90), 9);
  sfx(t => flutter(t, 6));
  say(clamp(p.x, 120, 1480), 150, nextLine('vul', ['禿鷲跟著熱氣流往上盤旋', '牠們在找草原上的獵物殘骸', '白背兀鷲，一隻翅膀張開超過兩公尺']), 2);
});
onAct($('wallHit'), e => { const p = svgPoint(e); sfx(t => glock(t, hz(74), .03)); say(clamp(p.x, 200, 1400), 200, nextLine('wall', ['火山口直徑約 19 公里，內壁高約 600 公尺', '約 250 萬年前火山崩塌形成', '世界最大、完整又沒積水的破火山口', '裡面住著約兩萬五千頭大型動物', '是聯合國世界遺產']), 2.4); });
document.querySelectorAll('#wall .lodge').forEach(l => onAct(l, () => { sfx(t => click(t, .05)); say(+l.querySelector('rect').getAttribute('x') + 50, 160, nextLine('lodge', ['邊緣海拔約 2,300 公尺，早晚很冷', '營地蓋在火山口邊緣，往下看整個火山口', '晚上看得到營地的燈']), 2); }));
onAct($('leraiHit'), () => { sfx(rustle); for (let i = 0; i < 4; i++) spawnBird(rand(100, 400), rand(240, 280), 'c3'); say(250, 230, nextLine('lerai', ['萊萊森林：整片黃皮金合歡', '以前的探險家以為它會讓人發燒', '其實是長在有蚊子的水邊，才會得瘧疾', '樹皮是黃綠色的，可以行光合作用']), 2.4); });
elephants.forEach(e => onAct(e.el, () => { e.lift = 3; sfx(trumpet); say(e.x + e.dir * 20, 250, nextLine('ele', ['老公象：長牙快拖到地上了', '火山口裡多半是年紀大的公象', '牠們喜歡在萊萊森林吃樹葉']), 2); }));
onAct($('lakeHit'), e => { const p = svgPoint(e); ripple(p.x, clamp(p.y, 318, 350)); sfx(t => glock(t, hz(81), .02)); say(clamp(p.x, 900, 1340), 280, nextLine('lake', ['馬加迪湖：鹼性的淺水湖', '湖邊白白的是鹼結晶', '湖裡的藍綠藻讓紅鶴變成粉紅色', '乾季時湖會縮小很多']), 2.2); });
onAct($('flamHit'), e => {
  if (show.on === 'flam') return;
  const p = svgPoint(e);
  const near = lakeFlams.filter(l => !l.hopping && l.flockI === undefined).sort((a, b) => Math.abs(a.x - p.x) - Math.abs(b.x - p.x)).slice(0, 6);
  const free = flock.filter(f => f.extra && !f.mini);
  near.forEach((l, i) => {
    const f = free[i]; if (!f) return;
    const dx = rand(60, 140) * (p.x > 1120 ? -1 : 1);
    let x1 = clamp(l.x + dx, 850, 1400);
    l.hopping = true; f.lb = l; f.mini = { t: -i * .12, dur: 2.6, x0: l.x, y0: l.y - 6, x1, y1: l.y };
  });
  sfx(t => { for (let i = 0; i < 5; i++) flamHonk(t + i * .14, .025); flutter(t, 8); });
  say(clamp(p.x, 900, 1340), 280, nextLine('flam', ['小紅鶴：顏色比較深、嘴比較黑', '牠們把頭倒過來，用嘴巴過濾藻類', '上千隻擠在一起，才不怕被吃']), 2);
});
const HERD_LINES = { zebra: ['斑馬：每一隻的條紋都不一樣', '斑馬會發出像狗叫的「咿哈」聲', '火山口裡的斑馬不用長途遷徙'], gnu: ['牛羚：又叫角馬', '火山口有一萬多頭牛羚', '低頭吃草時鬍子會碰到地'], gaz: ['湯氏瞪羚：身上有一條黑線', '跑起來很快，還會彈跳', '尾巴一直甩來甩去'] };
herd.forEach(w => onAct(w.el, () => { w.run = 1.6; w.graze = 0; sfx(w.sp === 'zebra' ? zebraBark : w.sp === 'gnu' ? gnuGrunt : t => click(t, .04)); say(w.x, w.y - 60, nextLine(w.sp, HERD_LINES[w.sp]), 2); }));
onAct(rhino.el, () => { rhino.snort = 2.6; rhino.wait = 0; rhino.tx = clamp(rhino.x + rhino.dir * 120, 440, 720); sfx(snort); say(rhino.x, 330, nextLine('rhino', ['黑犀牛：極度瀕危', '火山口裡只有三十多頭，巡山員每天看守', '「黑」犀牛其實是灰色的', '上嘴唇是勾狀的，可以捲住樹葉']), 2.4); });
onAct(calf.el, () => { sfx(t => { sweep('sine', t, 900, 700, .2, .03); sweep('sine', t + .25, 950, 720, .2, .03); }); say(calf.x, 350, pick(['小犀牛跟在媽媽身邊兩、三年', '咿——媽媽等我！']), 2); });
onAct($('buffHit'), () => { buffs.forEach(b => b.fly = 2); sfx(t => { gnuGrunt(t); flutter(t + .2, 6); }); say(1500, 310, nextLine('buff', ['非洲水牛：脾氣很不好惹', '背上的牛椋鳥幫牠們吃蜱蟲']), 2); });
ostriches.forEach(o => onAct(o.el, () => { o.run = 2.4; o.wait = 0; o.tx = clamp(o.x + o.dir * 110, 700, 880); sfx(ostrichBoom); say(o.x, 290, pick(['鴕鳥跑起來時速可以超過 60 公里', '公鴕鳥會發出低沉的「嗡——」聲', '世界上最大的鳥']), 2); }));
onAct(bustard.el, () => { bustard.puff = 2.5; sfx(t => ostrichBoom(t)); say(676, 330, '灰頸鷺鴇：最重的會飛的鳥之一', 2); });
onAct($('lionHit'), e => {
  const p = svgPoint(e);
  let best = lions[0], bd = 1e9;
  lions.forEach(l => { const d = Math.abs(l.x - p.x); if (d < bd) { bd = d; best = l; } });
  if (best.yawn) { best.yawn.style.display = ''; best.yT = 2.4; }
  if (best.o.male) { sfx(lionRoar); say(best.x, 420, nextLine('lion', ['火山口的公獅以黑色鬃毛出名', '獅吼聲五公里外都聽得到', '獅子一天睡快二十個小時']), 2.2); }
  else { sfx(t => sweep('sawtooth', t, 160, 90, .5, .08, 500)); say(best.x, 430, best.o.cub ? '小獅子在玩媽媽的尾巴' : pick(['母獅負責打獵', '吃飽了，曬太陽睡午覺']), 2); }
});
hyenas.forEach(h => onAct(h.el, () => { sfx(hyenaWhoop); say(h.x, 380, nextLine('hyena', ['斑鬣狗：其實大多自己打獵', '「呼——呼——」的叫聲在夜裡特別遠', '火山口的鬣狗是大家族']), 2); }));
jeeps.forEach(j => onAct(j.el, () => { j.stop = Math.max(j.stop, 5); j.snap = 5; sfx(t => { engine(t); for (let i = 0; i < 4; i++) shutter(t + .6 + i * .35); }); say(j.x, roadY(j.x) - 70, nextLine('jeep', ['車頂升起來，站起來拍照！', '在火山口裡不能下車', '導遊說：前面有獅子！', '每天只能在火山口待六小時']), 2); }));
hippos.forEach(h => onAct(h.el, () => { hippoYawn(h, true); say(h.x, 470, nextLine('hippo', ['河馬打呵欠是在警告：別靠近！', '白天泡在水裡防曬', '晚上才上岸吃草']), 2); }));
onAct($('poolHit'), e => { const p = svgPoint(e); ripple(p.x, clamp(p.y, 510, 550), true); sfx(t => glock(t, hz(79), .02)); say(200, 470, nextLine('pool', ['恩戈伊托基托克泉：湧泉形成的池塘', '遊客可以在這裡下車野餐', '小心河馬和黑鳶']), 2.2); });
picnickers.forEach(p => onAct(p.el, () => {
  if (p.o.ranger) { sfx(t => click(t, .05)); say(p.x, 500, nextLine('ranger', ['巡山員：野餐請在車上吃！', '黑鳶會從手上搶食物', '請跟動物保持距離']), 2.2); return; }
  const k = kites[0];
  if (k.dive <= 0 && sandwichOwner.food.style.display !== 'none') { k.dive = 3; k.dx = k.x; k.dy = k.y; say(p.x, 500, pick(['小心！老鷹衝下來了！', '快把三明治藏起來！']), 1.4); }
  else { sfx(t => shutter(t)); say(p.x, 500, pick(['河馬在打呵欠！快拍！', '這裡風景好漂亮', '在火山口吃午餐！']), 1.8); }
}));
onAct(picnicJeep, () => { sfx(engine); say(560, 470, '導遊：大家吃完要回車上喔', 1.8); });
cranes.forEach(c => onAct(c.el, () => { cranes.forEach(q => { if (Math.abs(q.x - c.x) < 70) q.dance = 4; }); sfx(t => { craneHonk(t); craneHonk(t + .8); }); say(c.x, 470, nextLine('crane', ['灰冠鶴：頭上有金色的冠羽', '求偶時張開翅膀跳舞', '是烏干達的國鳥']), 2); }));
hogs.forEach(hg => onAct(hg.el, () => { hogs[0].run = 2.2; hogs[0].wait = 0; sfx(hogGrunt); say(hogs[0].x, 540, nextLine('hog', ['疣豬跑起來尾巴豎得直直的', '小疣豬排成一排跟著媽媽', '跪著吃草，膝蓋有厚繭']), 2); }));
cows.forEach(c => onAct(c.el, () => { c.moo = 1.6; sfx(t => { moo(t); cowBell(t + .1); }); say(c.x, c.y - 60, pick(['哞——', '瘤牛背上有一個大肉峰', '馬賽人的牛就是他們的財富']), 1.8); }));
maasai.forEach(m => onAct(m.el, () => {
  if (m.boy) { cows.forEach(c => c.moo = .8); sfx(t => { for (let i = 0; i < 3; i++) cowBell(t + i * .2); }); say(m.x, m.y - 100, nextLine('boy', ['我在學怎麼照顧牛', '牛要喝完水才回家']), 2); return; }
  m.jump = 2.1; sfx(t => { for (let i = 0; i < 3; i++) { thump(t + .7 * i + .35, .08); cowBell(t + .7 * i + .1, .015); } });
  say(m.x, m.y - 110, nextLine('maasai', ['馬賽人的跳躍舞：跳得越高越厲害', '紅色的 shuka 披布，獅子看了也會怕', '白天可以帶牛下來喝水、舔鹽', '晚上要回到火山口外面的村子']), 2.4);
}));
onAct($('springHit'), () => { sfx(t => glock(t, hz(76), .02)); say(1350, 480, '泉水：牛群在這裡喝水', 1.8); });
onAct($('fgTreeHit'), () => { sfx(t => { rustle(t); chirp(t + .2); }); nests.forEach(n => spawnBird(n.x, n.y + 6, 'c3')); say(1430, 160, nextLine('tree', ['織布鳥用草編成吊著的巢', '黃皮金合歡長在有水的地方']), 2); });
function ripple(x, y, pool) {
  const r = el('ellipse', { cx: f1(x), cy: f1(y), rx: 2, ry: 1, class: pool ? 's-poolLt' : 's-lakeLt', 'stroke-width': 1.6 }, $('fx'));
  let t = 0;
  const tick = () => { t += .05; r.setAttribute('rx', f1(2 + t * 30)); r.setAttribute('ry', f1(1 + t * 5)); r.setAttribute('opacity', f1(1 - t)); if (t < 1) setTimeout(tick, 50); else r.remove(); };
  tick();
}

/* ---------------- ⑤ 互動：控制列 ---------------- */
function syncAuto() { $('btnAuto').setAttribute('aria-pressed', String(T.auto)); $('btnAuto').textContent = T.auto ? '自動播放中' : '自動播放'; }
function goTo(t) { if (reduced) { T.t = t; applyTime(true); renderStill(); } else T.target = t; }
const tap = fn => () => { userGesture = true; ensureAudio(); setTimeout(() => { fn(); if (reduced) settle(2); }, actx && actx.state !== 'running' ? 120 : 0); };
$('btnFlam').addEventListener('click', tap(startFlam));
$('btnDawn').addEventListener('click', tap(startDawn));
$('btnWeather').addEventListener('click', () => {
  userGesture = true; ensureAudio();
  wxI = (wxI + 1) % WX_LIST.length;
  $('btnWeather').textContent = '天氣：' + WX_LIST[wxI][1];
  if (reduced) { for (const k in wx) wx[k] = WX_LIST[wxI][0] === k ? 1 : 0; applyWeather(0); renderStill(); }
});
$('btnSound').addEventListener('click', () => {
  soundOn = !soundOn; userGesture = true;
  $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  if (ensureAudio()) {
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.setValueAtTime(soundOn ? .5 : 0, actx.currentTime);
    if (!soundOn && musNode) { try { musNode.disconnect(); } catch (e) {} musNode = null; }
  }
});
// 時段：一顆按鈕輪流切換 清晨 → 白天 → 黃昏 → 夜晚
const SLOTS = [['☁ 時段：清晨', 6.9], ['☀ 時段：白天', 11], ['🌅 時段：黃昏', 18.4], ['☾ 時段：夜晚', 21.5]];
let slotI = 1;
$('btnTime').addEventListener('click', () => {
  if (show.on) { busy(); return; }
  slotI = (slotI + 1) % SLOTS.length;
  $('btnTime').textContent = SLOTS[slotI][0];
  goTo(SLOTS[slotI][1] / 24);
});
$('btnAuto').addEventListener('click', () => { T.auto = !T.auto; T.target = null; syncAuto(); });
$('timeRange').addEventListener('input', e => {
  T.t = e.target.value / 1000; T.target = null; T.dragging = true; applyTime(true); T.dragging = false;
  if (reduced) renderStill();
});
mq.addEventListener?.('change', e => { reduced = e.matches; if (!reduced) { T.auto = true; syncAuto(); } start(); });

applyTime(true);
applyWeather(0);
syncAuto();
settle(.2);
start();

// 作者精選輪播：在網站精選區（pure 版、內嵌框）裡自動演出「雲瀑晨光冠鶴舞」；音樂由網站的「聲音」按鈕透過 window.sceneMusic 開關
const inPicks = (() => { let top = true; try { top = window.top === window; } catch (e) { top = false; } return !!document.getElementById('pure-art') && !top; })();
if (inPicks) {
  let pickAudio = false;
  const useCtx = c => {
    actx = c;
    master = actx.createGain(); master.gain.value = soundOn ? .5 : 0;
    const comp = actx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3;
    master.connect(comp); comp.connect(actx.destination);
    sfxBus = actx.createGain(); sfxBus.connect(master);
    musBus = actx.createGain(); musBus.gain.value = .64; /* 音樂軌音量 ×0.64（2026-11-24 兩次各調降 20%） */ musBus.connect(master);
  };
  setTimeout(() => startDawn(true), 800);
  setInterval(() => { if (!show.on) { startDawn(true); if (pickAudio && audioOK()) dawnAudio(); } }, 4000);
  window.sceneMusic = {
    playing: false,
    start(c) {
      if (this.playing) return; this.playing = true; pickAudio = true; userGesture = true; soundOn = true;
      if (c && c !== actx) useCtx(c); else ensureAudio();
      if (actx && actx.state !== 'running') actx.resume();
      const go = () => { if (show.on === 'dawn' && show.t < 3 && audioOK()) dawnAudio(); };
      if (actx.state === 'running') go(); else actx.resume().then(go).catch(() => {});
    },
    stop() { this.playing = false; pickAudio = false; if (musNode) { try { musNode.disconnect(); } catch (e) {} musNode = null; } },
    duck() {}
  };
}
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on || null,
  btn: { flam: 'btnFlam', dawn: 'btnDawn' },
  save: () => ({ t: T.t, auto: T.auto }),
  stop: () => { endShow(); setCine(0); },
  restore: s => { T.t = s.t; T.auto = s.auto; T.target = null; syncAuto(); applyTime(true); }
});
/* /ShowStop */
})();
</script>
