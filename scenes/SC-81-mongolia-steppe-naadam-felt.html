<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蒙古草原的那達慕賽馬</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-81 蒙古草原的那達慕賽馬｜羊毛氈風
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   風格重點：所有東西像針氈戳出來的羊毛——毛茸茸的邊、蓬鬆的凹凸光影、
            整片覆蓋細細的羊毛纖維。蒙古包本身就是羊毛氈做的，正好呼應。
   季節設定：七月盛夏，草原最綠、那達慕節正在舉行。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），
   部分另有 --k-名稱（晨昏）。JS 會依時間內插，輸出成 --名稱，
   並自動產生 .f-名稱（填色）、.s-名稱（描邊）兩個 class。
   ========================================================= */
:root{
  color-scheme: light;

  /* —— 天空 —— */
  --d-sky-top:#78afe0;  --k-sky-top:#5f68a4;  --n-sky-top:#050b1e;
  --d-sky-mid:#a6cdee;  --k-sky-mid:#dc9c98;  --n-sky-mid:#0b1632;
  --d-sky-low:#e4f0f0;  --k-sky-low:#f7c486;  --n-sky-low:#172644;
  --d-cloud:#fcfaf4;    --k-cloud:#ffd9c0;    --n-cloud:#353f5a;
  --d-cloud-sh:#d4dde8; --n-cloud-sh:#222a40;
  --d-overcast:#a2aab4; --n-overcast:#161c28;

  /* —— 遠山與丘陵 —— */
  --d-mtn-far:#9aafca;  --k-mtn-far:#ad98b2;  --n-mtn-far:#141e36;
  --d-mtn-snow:#f2f2ee; --k-mtn-snow:#ffd6c4; --n-mtn-snow:#5e6e8e;
  --d-hill-far:#a3bd7c; --k-hill-far:#b9a274; --n-hill-far:#18262a;
  --d-hill:#88ac5c;     --k-hill:#a6a05a;     --n-hill:#142418;
  --d-hill-dk:#6b8f48;  --n-hill-dk:#0e1a14;

  /* —— 草原、車轍、河 —— */
  --d-grass:#97ba60;    --k-grass:#b4a058;    --n-grass:#15261a;
  --d-grass-near:#7ba64a; --n-grass-near:#112016;
  --d-grass-dk:#5c8838; --n-grass-dk:#0b1810;
  --d-grass-hi:#c4da84; --n-grass-hi:#24382a;
  --d-track:#cdb88e;    --n-track:#2c2a26;
  --d-river:#5b9cc6;    --k-river:#d69c88;    --n-river:#0d1c34;
  --d-river-hi:#d2e8f2; --n-river-hi:#38567c;
  --d-stone:#aaa49a;    --n-stone:#32343a;
  --d-stone-dk:#7c766e; --n-stone-dk:#202228;

  /* —— 蒙古包（ger）——白色羊毛氈外罩、橘色木門、藍色飾邊 —— */
  --d-felt:#f5f0e3;     --k-felt:#ffe0c6;     --n-felt:#585c6e;
  --d-felt-sh:#d8cfbc;  --n-felt-sh:#383c4c;
  --d-rope:#8a7a64;     --n-rope:#2c2826;
  --d-door:#e2782a;     --n-door:#5a2e16;
  --d-door-dk:#b04a1e;  --n-door-dk:#381a10;
  --d-trim:#2f6aa8;     --n-trim:#17274a;
  --d-wood:#9a7650;     --n-wood:#32281e;
  --d-metal:#9ca2aa;    --n-metal:#383c44;

  /* —— 其他會變色的 —— */
  --d-shadow:#1e281832; --n-shadow:#00000058;
  --d-dust:#d8b878;     --n-dust:#4a4030;
  --d-snowc:#f6f6f2;    --n-snowc:#8894ae;
  --d-glow:#ffcf7a00;   --n-glow:#ffc870b0;

  /* —— 不隨日夜變化的顏色 —— */
  --sun:#ffd35e; --sun-hi:#fff2b4; --moon:#f4efd6; --star:#fff6dc; --milky:#cfd6ff;
  --fire-1:#ffe48a; --fire-2:#ffae3a; --fire-3:#f0582a; --ember:#ff8a3a;
  --khadag:#3f8ee8; --khadag-2:#9ccbff;                 /* 敖包上的藍色哈達 */
  --flag-1:#e8344a; --flag-2:#f2c230; --flag-3:#2f8ae0; --flag-4:#3fb86a; --flag-5:#f4f0e6;   /* 五色風馬旗 */
  --ink:#2a2630; --wool:#fbf8f2;

  /* —— 角色：蒙古袍（deel）、腰帶、靴子、帽子 —— */
  --deel-1:#2f5fa8; --deel-2:#8a2a3a; --deel-3:#3f8a5a; --deel-4:#e08a2a; --deel-5:#6a4aa0; --deel-6:#c8a03a; --deel-7:#3a3e4a; --deel-8:#b8d4e8;
  --sash-1:#f2c230; --sash-2:#e0503a; --sash-3:#6ac0e8; --sash-4:#f0e8d8; --sash-5:#e86a8a;
  --boot:#7a2a22; --boot-dk:#3e1c16;
  --hat-1:#3a2e28; --hat-2:#c8302e; --hat-3:#2a3a5a; --hat-4:#e8e0d0;
  --scarf-1:#e86a8a; --scarf-2:#f2c230; --scarf-3:#6ac0e8;
  --skin-1:#e8b890; --skin-2:#d09a6e; --skin-3:#b07a52; --hair:#1e1a1c;
  --jeans:#3a4e74; --jacket:#5a6a3a;
  --jk-1:#e8344a; --jk-2:#f2c230; --jk-3:#2f8ae0; --jk-4:#3fb86a; --jk-5:#f07a2a; --jk-6:#a04ad0; --jk-7:#f4f0e6; --jk-8:#e86ab0;   /* 小騎手的彩色賽服 */
  --zodog:#c8302e; --zodog-2:#2f5fa8;          /* 摔跤手的短上衣與短褲 */

  /* —— 動物 —— */
  --horse-bay:#8a4e2a; --horse-chest:#b2602e; --horse-grey:#cac6be; --horse-dun:#c9a56a; --horse-black:#2e2a2a; --horse-white:#ede7da; --horse-roan:#9a7a6a;
  --mane-dk:#2a2020; --mane-lt:#efe6d4; --hoof:#2a2420;
  --saddle:#c44a22; --saddle-2:#f2c230; --saddle-cloth:#2f5fa8;
  --camel:#a27a4e; --camel-fur:#6e4e30; --camel-lt:#c49c6a;
  --sheep:#f1ebdf; --sheep-sh:#d2c8b4; --sheep-head:#3a2e28; --sheep-head-2:#8a5a36;
  --goat-1:#f4f0e6; --goat-2:#4a3e36; --goat-3:#9a6e4a; --horn:#c8b48a;
  --dog:#24201e; --dog-tan:#c08a4a;
  --marmot:#b28a5a; --marmot-dk:#7a5a38; --marmot-belly:#dcbc8c;
  --kite:#6a4a32; --kite-dk:#3e2a1c; --kite-lt:#b08a62;

  /* —— 器物 —— */
  --moto:#c8302e; --moto-2:#2a2a2e; --solar:#26386a; --solar-hi:#5a7ac0; --frame:#c8ccd4;
  --van:#e4e0d2; --van-dk:#8a9096; --pail:#c8ccd4; --milk:#fffdf6;
  --rain:#a8c8e8; --snow:#ffffff; --bolt:#fff8d0;

  /* —— 頁面介面（淺色） —— */
  --page-bg:#f4f3ee; --page-fg:#2a2a26; --page-muted:#6a6a62;
  --ui-surface:#ffffff; --ui-line:#dcd8cc; --ui-accent:#2f6aa8; --ui-accent-2:#c44a22;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:14px;overflow:hidden;background:#a6cdee;line-height:0;box-shadow:0 6px 24px rgba(40,40,30,.14)}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:var(--ui-surface);border:1.5px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--page-fg);border-color:var(--page-fg);color:var(--ui-surface);font-weight:700}
.panel button.big{background:var(--ui-accent-2);border-color:var(--ui-accent-2);color:#fff;font-weight:700}
.panel button.big.alt{background:var(--ui-accent);border-color:var(--ui-accent)}
.panel button.big.on{background:var(--page-fg);border-color:var(--page-fg)}
.panel button:disabled{opacity:.5;cursor:default}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
/* 畫面內可點物件：滑鼠點不顯示外框，用鍵盤 Tab 時才顯示 */
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid var(--ui-accent);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .say text{fill:var(--ink);font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .fiber{mix-blend-mode:soft-light}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：天空 → 銀河與星星 → 太陽月亮 → 雲
       → 遠方雪山 → 起伏的丘陵 → 敖包山丘 → 遠方車轍（駱駝商隊、越野車）
       → 河流 → 草原 → 蒙古包營地 → 中景動物（羊群、馬群）
       → 隨風擺動的草 → 旱獺洞 → 摔跤手 → 近景小路（騎馬、牽駱駝、賽馬）
       → 黑鳶 → 天氣（沙塵、雨、雪、閃電）→ 羊毛纖維紋理
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="羊毛氈風格的蒙古草原：遠方是覆雪的山和起伏的綠色丘陵，山丘頂上有綁著藍色哈達的敖包；左邊是幾座白色羊毛氈蒙古包，橘色木門、屋頂冒著爐煙，旁邊有太陽能板和摩托車；中間是吃草的羊群和牧羊犬，右邊河邊有馬群在喝水，遠方雙峰駱駝商隊慢慢走過；前景有穿蒙古袍的牧民騎馬，摔跤手在草地上準備比賽，旱獺從洞裡探頭">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-top)"/>
        <stop offset=".6" style="stop-color:var(--sky-mid)"/>
        <stop offset="1" style="stop-color:var(--sky-low)"/>
      </linearGradient>
      <linearGradient id="plainGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--grass)"/>
        <stop offset="1" style="stop-color:var(--grass-near)"/>
      </linearGradient>
      <linearGradient id="riverGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--river-hi)"/>
        <stop offset=".5" style="stop-color:var(--river)"/>
        <stop offset="1" style="stop-color:var(--river)"/>
      </linearGradient>
      <radialGradient id="sunGlow"><stop offset="0" style="stop-color:var(--sun-hi)" stop-opacity=".75"/><stop offset="1" style="stop-color:var(--sun)" stop-opacity="0"/></radialGradient>
      <radialGradient id="moonGlow"><stop offset="0" style="stop-color:var(--moon)" stop-opacity=".35"/><stop offset="1" style="stop-color:var(--moon)" stop-opacity="0"/></radialGradient>
      <radialGradient id="fireGlow"><stop offset="0" style="stop-color:var(--fire-2)" stop-opacity=".75"/><stop offset=".5" style="stop-color:var(--fire-3)" stop-opacity=".22"/><stop offset="1" style="stop-color:var(--fire-3)" stop-opacity="0"/></radialGradient>
      <radialGradient id="doorGlow"><stop offset="0" style="stop-color:var(--glow)"/><stop offset="1" stop-color="#ffc870" stop-opacity="0"/></radialGradient>
      <radialGradient id="milkyGrad"><stop offset="0" style="stop-color:var(--milky)" stop-opacity=".55"/><stop offset=".55" style="stop-color:var(--milky)" stop-opacity=".18"/><stop offset="1" style="stop-color:var(--milky)" stop-opacity="0"/></radialGradient>
      <radialGradient id="flashGlow"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>

      <!-- 【羊毛氈濾鏡 felt】大面積靜態圖層用：
           1. 亂流雜訊推移邊緣 → 毛茸茸的輪廓
           2. 模糊後的透明度當高度圖打光 → 針氈戳出來的蓬鬆凹凸 -->
      <filter id="felt" x="-4%" y="-6%" width="108%" height="112%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" seed="7" result="fz"/>
        <feDisplacementMap in="SourceGraphic" in2="fz" scale="6" xChannelSelector="R" yChannelSelector="G" result="shape"/>
        <feGaussianBlur in="shape" stdDeviation="3.2" result="bl"/>
        <feDiffuseLighting in="bl" surfaceScale="3.2" diffuseConstant="1.2" lighting-color="#ffffff" result="lit">
          <feDistantLight azimuth="235" elevation="52"/>
        </feDiffuseLighting>
        <feComposite in="shape" in2="lit" operator="arithmetic" k1="1.06" k2="0" k3="0" k4="0"/>
      </filter>
      <!-- 【小物件的羊毛氈 feltS】較細緻的版本 -->
      <filter id="feltS" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="3" result="fz"/>
        <feDisplacementMap in="SourceGraphic" in2="fz" scale="3.4" xChannelSelector="R" yChannelSelector="G" result="shape"/>
        <feGaussianBlur in="shape" stdDeviation="1.6" result="bl"/>
        <feDiffuseLighting in="bl" surfaceScale="2.4" diffuseConstant="1.18" lighting-color="#ffffff" result="lit">
          <feDistantLight azimuth="235" elevation="55"/>
        </feDiffuseLighting>
        <feComposite in="shape" in2="lit" operator="arithmetic" k1="1.06" k2="0" k3="0" k4="0"/>
      </filter>
      <!-- 【會動的角色 fuzz】只做毛邊，運算較輕 -->
      <filter id="fuzz" x="-6%" y="-20%" width="112%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="1.3" numOctaves="1" seed="11" result="fz"/>
        <feDisplacementMap in="SourceGraphic" in2="fz" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <!-- 銀河：拉開的羊毛條 -->
      <filter id="roving" x="-10%" y="-30%" width="120%" height="160%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency=".014 .03" numOctaves="3" seed="5" result="fz"/>
        <feDisplacementMap in="SourceGraphic" in2="fz" scale="44" xChannelSelector="R" yChannelSelector="G" result="d"/>
        <feGaussianBlur in="d" stdDeviation="6"/>
      </filter>
      <filter id="soft" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
      <filter id="hazeF" x="-20%" y="-60%" width="140%" height="220%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency=".01 .04" numOctaves="3" seed="9" result="fz"/>
        <feDisplacementMap in="SourceGraphic" in2="fz" scale="50" xChannelSelector="R" yChannelSelector="G" result="d"/>
        <feGaussianBlur in="d" stdDeviation="10"/>
      </filter>

      <!-- 羊毛纖維紋理（JS 用 canvas 畫好塞進 image） -->
      <pattern id="fiberPat" patternUnits="userSpaceOnUse" width="256" height="256">
        <image id="fiberImg" width="256" height="256" href=""/>
      </pattern>
    </defs>

    <!-- ===== 【場景】天空 ===== -->
    <rect x="0" y="0" width="1600" height="600" fill="url(#skyGrad)"/>
    <rect id="skyHit" x="0" y="0" width="1600" height="330" fill="transparent"/>
    <g id="milky" class="noHit" opacity="0"></g>
    <g id="stars" class="noHit"></g>
    <g id="sun" class="clickable" tabindex="0" role="button" aria-label="太陽：切換到夜晚"></g>
    <g id="moon" class="clickable" tabindex="0" role="button" aria-label="月亮：切換到白天"></g>
    <g id="shooting" class="noHit"></g>
    <g id="clouds"></g>
    <g id="cranes" class="clickable" tabindex="0" role="button" aria-label="蓑羽鶴群"></g>
    <g id="larks" class="noHit"></g>
    <rect id="stormSky" class="noHit" x="0" y="0" width="1600" height="340" style="fill:var(--overcast)" opacity="0"/>
    <g id="overcast" class="noHit" opacity="0"></g>
    <g id="bolt" class="noHit" opacity="0"></g>

    <!-- ===== 【場景】遠山、丘陵、敖包山丘 ===== -->
    <g id="cumulus" class="noHit" filter="url(#felt)"></g>
    <g id="farRange" class="noHit" filter="url(#felt)"></g>
    <g id="hills" class="noHit" filter="url(#felt)"></g>
    <g id="ovooHill" filter="url(#felt)"></g>
    <g id="ovooG" class="clickable" tabindex="0" role="button" aria-label="敖包：繞行三圈祈福"></g>

    <!-- ===== 【場景】草原、河流、車轍 ===== -->
    <g id="plain" filter="url(#felt)"></g>
    <g id="snowCover" class="noHit" filter="url(#felt)" opacity="0"></g>
    <g id="river" class="clickable" tabindex="0" role="button" aria-label="河：點一下濺起水花"></g>
    <g id="laneFar" class="noHit" filter="url(#fuzz)"></g>

    <g id="cloudShadows" class="noHit"></g>
    <!-- ===== 【場景】蒙古包營地 ===== -->
    <g id="camp"></g>
    <g id="smoke" class="noHit"></g>
    <g id="campActors" filter="url(#fuzz)"></g>

    <!-- ===== 【角色】中景：羊群、馬群、牧民 ===== -->
    <g id="midActors" filter="url(#fuzz)"></g>

    <!-- ===== 【場景】前景：隨風擺動的草、旱獺、摔跤場、營火 ===== -->
    <g id="tufts" class="noHit"></g>
    <g id="marmots"></g>
    <g id="campfire" class="clickable" tabindex="0" role="button" aria-label="營火：添柴火"></g>
    <g id="concert" class="noHit" filter="url(#fuzz)" opacity="0"></g>
    <g id="wrestle" class="clickable" filter="url(#fuzz)" tabindex="0" role="button" aria-label="摔跤手：開始比賽"></g>
    <g id="crowd" class="noHit" filter="url(#fuzz)" opacity="0"></g>
    <g id="finish" class="noHit" opacity="0"></g>

    <!-- ===== 【角色】近景小路：騎馬、牽駱駝、那達慕賽馬 ===== -->
    <g id="dustBack" class="noHit"></g>
    <g id="laneNear" filter="url(#fuzz)"></g>
    <g id="raceG" class="noHit" filter="url(#fuzz)"></g>
    <g id="dustFront" class="noHit"></g>

    <!-- ===== 【角色】天空的黑鳶 ===== -->
    <g id="kiteG" class="clickable" tabindex="0" role="button" aria-label="黑鳶"></g>

    <!-- ===== 【動畫】沙塵、雨、雪、閃光、對話泡泡 ===== -->
    <rect id="dustHaze" class="noHit" x="0" y="0" width="1600" height="600" style="fill:var(--dust)" opacity="0"/>
    <g id="dustStorm" class="noHit" opacity="0"></g>
    <g id="rain" class="noHit" opacity="0"></g>
    <g id="snowfall" class="noHit" opacity="0"></g>
    <rect id="dimmer" class="noHit" x="0" y="0" width="1600" height="600" fill="#1a2230" opacity="0"/>
    <rect id="flash" class="noHit" x="0" y="0" width="1600" height="600" fill="#f4f6ff" opacity="0"/>
    <!-- 羊毛纖維紋理（柔光混合，覆蓋全畫面） -->

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {

  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);

  if (SN) {

    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {

  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';

    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });

    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);

  }

  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();

  }

  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }

  }

    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }

    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }

  }

  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();

            e.stopImmediatePropagation(); e.preventDefault();

            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();

   SC-81 蒙古草原的那達慕賽馬｜程式區
   區塊：①工具與色票
         ②場景（天空、銀河、遠山、丘陵、敖包、河、草原、蒙古包營地、營火）

        x.quadraticCurveTo((sx + ex) / 2 + Math.cos(a + 1.57) * bend, (sy + ey) / 2 + Math.sin(a + 1.57) * bend, ex, ey); x.stroke();

const CAMP = { y: 566, x0: 220, x1: 680, subs: [-3, 4] };
const walkers = [];
const SAYINGS = ['賽音拜諾！（你好）', '進來喝碗奶茶吧', '今天那達慕，大家都穿新袍子', '羊都放出去了', '晚上要下雨嗎？'];
function addWalker(x, sub, o = {}) {
  const w = { sub, dir: sub === 0 ? 1 : -1, x, speed: o.speed || rand(16, 24), ph: rand(0, 6), stop: 0, len: 24, s: o.kid ? .66 : .94 };
  w.g = el('g', { class: 'clickable', tabindex: 0, role: 'button', 'aria-label': '牧民：打招呼' }, $('campActors'));
  w.p = makePerson(w.g, o);
  walkers.push(w);
  onAct(w.g, () => { w.stop = 2.4; sfx('pop'); say(w.x, CAMP.y + CAMP.subs[w.sub] - 76 * w.s, o.kid ? pick(['來玩羊拐骨！', '我長大要當騎手']) : pick(SAYINGS), 1.8); });
  return w;

function updateWalkers(dt) {
  const mv = reduced ? 0 : 1;
  walkers.forEach(w => {
    const y = CAMP.y + CAMP.subs[w.sub];
    if (w.stop > 0) { w.stop -= dt; walkPose(w.p, 0, 0); }
    else {
      // 同方向前面有人就放慢等待
      const ahead = walkers.find(o => o !== w && o.sub === w.sub && (o.x - w.x) * w.dir > 0 && Math.abs(o.x - w.x) < 40);

        const ns = 1 - w.sub;
        if (!walkers.some(o => o !== w && o.sub === ns && Math.abs(o.x - w.x) < 40)) { w.sub = ns; w.dir = -w.dir; }
        else w.stop = 1;
      }
    }
    w.g.setAttribute('transform', `translate(${f1(w.x)},${y}) scale(${f1(w.dir * w.s)},${w.s})`);

  });
}

const T = { t: 10.5 / 24, auto: true, dayLen: 200, dragging: false, ff: null };

const isNight = () => DAY.dl < .4;
function applyTime(force) {
  const h = ((T.t % 1) + 1) % 1 * 24;
  // 七月的蒙古：大約 5 點半日出、21 點半日落，晚上 10 點多才完全天黑
  const dl = smooth(4.6, 6.4, h) * (1 - smooth(20.6, 22.3, h));

  if (force || Math.abs(dl - lastDl) > .004 || Math.abs(tw - lastTw) > .004) {
    lastDl = dl; lastTw = tw;
    let s = '';

      const p = PAIRS[k];

  const mh = (h + 12) % 24, mp = (mh - 4.5) / 15;

  $('moon').setAttribute('opacity', f1((1 - smooth(5, 6.5, h) * (1 - smooth(20.5, 22, h))) * (1 - WX.cur.cloud * .7)));
  gers.forEach(g => g.glow.setAttribute('opacity', f1((1 - dl) * (g.lit ? 1 : .15) * (.6 + g.open * .4))));
  const hh = Math.floor(h), mm = Math.floor((h - hh) * 60);

  if (!T.dragging) $('timeRange').value = Math.round((T.t % 1) * 1000);

function updateRace(dt, t) {
  const crowdOn = race.on || race.wait;

  ambNode = { n, g };
}

/* 那達慕賽馬配樂（原創）：F 宮五聲音階，馬頭琴拉出「噠噠—噠」的奔馬節奏，
   托布秀爾撥低音、馬蹄聲打拍子；開頭用馬頭琴模仿一聲馬嘶。約 20 秒。 */
const SC = ['F3', 'G3', 'A3', 'C4', 'D4', 'F4', 'G4', 'A4', 'C5', 'D5', 'F5'].map(HZ);
const RACE_TUNE = [
  [5, 5], [5, 6], [7, 7], [7, 6], [5, 5], [5, 4], [3, 3], [4, 5],
  [7, 7], [7, 8], [9, 9], [8, 7], [6, 6], [7, 6], [5, 5], [5, 5],
  [5, 5], [5, 6], [7, 7], [7, 6], [5, 5], [5, 4], [3, 3], [4, 5],
  [8, 8], [9, 10], [9, 9], [8, 7], [8, 8], [7, 6], [5, 6], [7, 8],
  [7, 7], [7, 8], [9, 9], [8, 7], [6, 6], [7, 6], [5, 5], [5, 5],
  [7, 7], [6, 5], [4, 4], [5, 3], [2, 2], [3, 1], [0, 0], [0, 0]];
function playRaceMusic() {
  if (!ok()) return;
  const dest = bus('music', 22); duckMusic(22);
  const B = .4, t0 = actx.currentTime + .1;
  // 開頭的馬嘶滑音
  const g0 = morin(t0, HZ('C5'), 1.1, .07, dest);
  // 奔馬節奏的旋律：每拍兩個十六分音符＋一個八分音符
  const tStart = t0 + 1.2;
  RACE_TUNE.forEach(([a, b], i) => {
    const t = tStart + i * B;
    if (i === RACE_TUNE.length - 1) { morin(t - B, SC[a], 1.6, .08, dest, { slide: .9 }); return; }
    if (i === RACE_TUNE.length - 2) return;
    morin(t, SC[a], B * .22, .065, dest, { att: .02 });
    morin(t + B * .25, SC[a], B * .22, .06, dest, { att: .02 });
    morin(t + B * .5, SC[b], B * .45, .075, dest, { att: .03 });
    // 托布秀爾低音：主音與五度輪流
    pluck(t, HZ(i % 2 ? 'C3' : 'F2'), .12, dest);
    // 馬蹄聲
    [0, .25, .5].forEach((d, k) => nz(t + d * B, .03, k === 2 ? 500 : 800, k === 2 ? .3 : .18, 'lowpass', 1, dest));
  });
}
/* 星空馬頭琴配樂（原創）：像蒙古長調一樣緩慢、悠長，每個音從下方滑上來，
   低音弦一直持續當作持續音。回傳每個旋律音的時間點，讓星星跟著閃。 */
const STAR_TUNE = [[0, 3, 2], [2, 4, 1], [3, 5, 3], [6, 4, 1], [7, 3, 1], [8, 2, 2], [10, 3, 2], [12, 5, 1], [13, 7, 2], [15, 6, 1], [16, 5, 2], [18, 4, 1], [19, 3, 1], [20, 2, 1.5], [21.5, 1, .5], [22, 0, 3]];
function playStarMusic() {
  const B = .8;
  const times = STAR_TUNE.map(n => n[0] * B + .3);
  if (!ok()) return times;
  const dest = bus('music', 22); duckMusic(22);
  const t0 = actx.currentTime + .3;
  const dl = actx.createDelay(1); dl.delayTime.value = .42; const fb = actx.createGain(); fb.gain.value = .35;
  const wet = actx.createGain(); wet.gain.value = .35; dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(dest);
  // 持續低音（F2＋C3）
  ['F2', 'C3'].forEach(n => { const g = morin(t0, HZ(n), 20, .025, dest, { att: 1.2 }); g.connect(dl); });
  STAR_TUNE.forEach(([b, d, len]) => { const g = morin(t0 + b * B, SC[d + 2], len * B + .1, .085, dest, { slide: .92, att: .16 }); g.connect(dl); });
  // 托布秀爾稀疏地撥
  [0, 4, 8, 12, 16, 20].forEach(b => { pluck(t0 + b * B, HZ('F2'), .1, dest); pluck(t0 + (b + 1.5) * B, HZ('C3'), .07, dest); });
  return times;
}

/* ---------------- ⑤ 互動：點擊與鍵盤 ---------------- */
function act(fn) { userGesture = true; ensureAudio(); fn(); }
function onAct(node, fn) {
  node.addEventListener('click', e => { e.stopPropagation(); act(() => fn(e)); });
  node.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(() => fn(e)); } });
}
function svgPoint(e) { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
const mouse = { x: 800, y: 300, in: false, vx: 0, lastX: 800, gust: 0 };
function bindAll() {
  gers.forEach(g => onAct(g.g, () => {
    g.openT = 3.2; sfx('door');
    if (isNight()) g.lit = !g.lit;
    for (let i = 0; i < 4; i++) setTimeout(() => puff(g.chim[0], g.chim[1], true), i * 220);
    say(g.x, g.y - 110 * g.s, pick(['進來喝碗鹹奶茶吧', '爐子上燉著羊肉', '蒙古包的門都朝南', '牆是一片片木格柵撐起來的', '搬家時一個小時就能拆好']), 1.8);
  }));
  onAct($('ovooG'), () => { if (ovooWalker.t < 0) { ovooWalker.t = 0; sfx('wind'); say(OVOO.x, OVOO.y - 76, '順時針繞敖包三圈', 1.8); } });
  onAct($('campfire'), () => { FIRE.boost = 1; sfx('crackle'); for (let i = 0; i < 14; i++) spark(FIRE.x + rand(-8, 8), FIRE.y - 16, rand(-40, 40), rand(-220, -120), 'ember', rand(.6, 1.2), 1.6); });
  onAct($('wrestle'), () => { if (wr.t < 0) { wr.t = 0; sfx('cheer'); say(830, 420, '搏克開賽！', 1.4); } });
  onAct($('river'), e => { const p = svgPoint(e); for (let i = 0; i < 3; i++) setTimeout(() => ripple(p.x, p.y), i * 160); sfx('splash'); for (let i = 0; i < 6; i++) spark(p.x, p.y, rand(-40, 40), rand(-120, -60), 'river-hi', .6, 1.8); });
  marmots.forEach(m => onAct(m.g, () => { if (m.up > .5) { m.target = 0; m.t = rand(3, 6); } else { m.target = 1; m.t = 3; } sfx('marmot'); say(m.x, m.y - 70, pick(['吱——！', '旱獺在放哨', '有老鷹，快躲！']), 1.4); }));
  onAct($('kiteG'), () => { kite.flap = 1.2; sfx('kite'); });
  onAct($('sun'), () => setTime(22.5));
  onAct($('moon'), () => setTime(10.5));
  $('clouds').querySelectorAll('[data-cloud]').forEach(g => onAct(g, () => { clouds[+g.dataset.cloud].puff = 1; sfx('squish'); }));
  $('skyHit').addEventListener('click', e => act(() => {
    const p = svgPoint(e);
    if (isNight()) { shootingStar(p.x, p.y); sfx('chime'); }
    else { kite.dive = 2.4; kite.cx = clamp(p.x, 200, 1400); kite.flap = .8; sfx('kite'); marmots.forEach(m => { m.target = 0; m.t = rand(3, 6); }); say(kite.cx, 60, '黑鳶俯衝，旱獺全躲回洞裡', 1.8); }
  }));
  svg.addEventListener('pointermove', e => {
    const p = svgPoint(e);
    mouse.vx = p.x - mouse.lastX; mouse.lastX = p.x;
    mouse.x = p.x; mouse.y = p.y; mouse.in = true;
    if (Math.abs(mouse.vx) > 2) mouse.gust = 1;
  });
  svg.addEventListener('pointerleave', () => { mouse.in = false; });

  $('btnRace').addEventListener('click', () => act(startRace));
  $('btnStar').addEventListener('click', () => act(startStar));
  $('btnWeather').addEventListener('click', () => act(() => setWeather((WX.idx + 1) % WX.list.length)));
  $('btnSound').addEventListener('click', () => {
    soundOn = !soundOn; userGesture = true; ensureAudio();
    if (master) master.gain.setValueAtTime(soundOn ? .5 : 0, actx.currentTime);
    if (!soundOn) { stopAll(); ambient('none'); try { window.sceneMusic && window.sceneMusic.stop(); } catch (e) {} } else ambient(WX.list[WX.idx][0]);
    $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  });
  $('btnDay').addEventListener('click', () => setTime(10.5));
  $('btnNight').addEventListener('click', () => setTime(22.5));
  $('btnAuto').addEventListener('click', () => { T.auto = !T.auto; $('btnAuto').setAttribute('aria-pressed', String(T.auto)); });
  const tr = $('timeRange');
  tr.addEventListener('input', () => { if (show.kind) return; T.dragging = true; T.t = tr.value / 1000; applyTime(true); updateWeather(0); });
  tr.addEventListener('change', () => { T.dragging = false; });
  window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
  window.addEventListener('pointerdown', () => document.body.classList.remove('kbd'));
  mq.addEventListener && mq.addEventListener('change', () => { reduced = mq.matches; });
}

/* ---------------- ④ 動畫：主迴圈 ---------------- */
let clockT = 0, sortT = 0;
function updateTufts(dt, t) {
  mouse.gust = Math.max(0, mouse.gust - dt * 1.5);
  tufts.forEach(f => {
    let a = Math.sin(t * 1.6 + f.x * .012) * (4 + WX.wind * 10) + WX.wind * 6;
    if (mouse.in && mouse.gust > 0) {
      const dx = f.x - mouse.x, dy = (f.y - mouse.y) * 1.6, d = Math.hypot(dx, dy);
      if (d < 110) a += Math.sign(mouse.vx || dx) * (1 - d / 110) * 46 * mouse.gust;
    }
    f.a = lerp(f.a, a, clamp(dt * 8, 0, 1));
    f.el.setAttribute('transform', `translate(${f1(f.x)},${f1(f.y)}) scale(${f1(f.s)}) rotate(${f1(f.a)})`);
  });
}
function step(dt) {
  clockT += dt;
  const t = clockT, mv = reduced ? 0 : 1;
  // 時間
  if (T.ff) {
    T.ff.t += dt;
    const k = smooth(0, 1, T.ff.t / T.ff.dur);
    T.t = T.ff.from + T.ff.dist * k;
    if (T.ff.t >= T.ff.dur) { const fn = T.ff.then; T.ff = null; fn && fn(); }
  } else if (T.auto && !show.kind && !reduced && !T.dragging) T.t = (T.t + dt / T.dayLen) % 1;
  applyTime(false);
  updateWeather(dt);
  updateParticles(dt * mv);
  // 星星閃爍
  stars.forEach(s => { s.flash = Math.max(0, (s.flash || 0) - dt * 1.5); s.el.setAttribute('opacity', f1(clamp(.55 + .35 * Math.sin(t * s.sp + s.ph) * mv + s.flash, 0, 1))); });
  // 雲飄
  clouds.forEach(c => {
    c.x += dt * c.sp * (1 + WX.wind) * mv; if (c.x > 1600 + c.w) c.x = -c.w;
    c.puff = Math.max(0, c.puff - dt);
    const sc = 1 + Math.sin(c.puff * 12) * .08 * c.puff;
    c.el.setAttribute('transform', `translate(${f1(c.x)},${c.y}) scale(${f1(sc)})`);
  });
  // 河面波光
  riverRipples.forEach(r => { r.el.setAttribute('transform', `translate(${f1(Math.sin(t * r.sp + r.ph) * 4 * mv)},0)`); r.el.setAttribute('opacity', f1(.5 + .4 * Math.sin(t * 2 + r.ph))); });
  updateKhadags(t * (mv || .0001), WX.wind);
  // 蒙古包：門、爐煙
  gers.forEach(g => {
    g.openT = Math.max(0, g.openT - dt); g.open = lerp(g.open, g.openT > 0 ? 1 : 0, clamp(dt * 6, 0, 1));
    g.door.setAttribute('transform', `translate(-10,0) scale(${f1(1 - g.open * .85)},1) translate(10,0)`);
    g.inside.setAttribute('opacity', f1(g.open * (.4 + .6 * (1 - DAY.dl))));
    g.smokeT -= dt;
    if (g.smokeT < 0 && mv && WX.cur.rain < .9) { g.smokeT = rand(.5, 1.1); puff(g.chim[0], g.chim[1], false); }
  });
  FIRE.boost = Math.max(0, FIRE.boost - dt * .3);
  updateFire(t, 1 - DAY.dl);
  updateTufts(dt, t);
  updateFx(dt);
  updateKite(dt * (mv || 0), t);
  updateCranes(dt, t); updateLarks(dt, t); updateShadows(dt);
  $('cumulus').setAttribute('opacity', f1(smooth(.25, .75, DAY.dl) * (1 - WX.cur.cloud * .5) * (1 - WX.cur.dust * .6)));
  updateMarmots(dt, t);
  updateWalkers(dt);
  updateGrazers(herd, HERD, dt);
  updateGrazers(flock, FLOCK, dt);
  updateWrangler(dt);
  updateShepherd(dt, t);
  updateMilking(dt, t);
  updateNear(dt);
  updateFar(dt);
  updateBike(dt);
  updateOvooWalker(dt);
  updateWrestle(dt, t);
  updateRace(dt, t);
  updateStar(dt, t);
  // 中景動物依照遠近排序（每 0.3 秒一次），近的蓋住遠的
  sortT -= dt;
  if (sortT < 0) { sortT = .3; midList.slice().sort((a, b) => a.y - b.y).forEach(a => $('midActors').appendChild(a.g)); }
}
let last = 0;
function loop(ts) {
  const dt = Math.min(.1, (ts - last) / 1000 || 0);
  if (dt >= 1 / 40 || !last) { last = ts; step(dt); }
  requestAnimationFrame(loop);
}

/* ---------------- 初始化 ---------------- */
function init() {
  makeFiber();
  drawSky();
  drawLand();
  drawOvoo(); makeOvooWalker();
  drawPlain();
  drawRiver();
  drawCamp();
  drawFire();
  drawTufts();
  drawMarmots();
  drawWrestle();
  makeKite(); makeCranes(); makeLarks(); makeShadows();
  buildWeather();
  buildRace();
  buildConcert();
  // 主角蒙古包前走動的人：提奶桶的婦女、老人、小孩、穿夾克的年輕人
  addWalker(260, 0, { deel: 'deel-5', hat: 'scarf', pail: true });
  addWalker(420, 0, { kid: true, deel: 'deel-4', hat: 'none' });
  addWalker(560, 1, { deel: 'deel-7', hat: 'trad' });
  addWalker(320, 1, { modern: true, hat: 'cap' });
  addWalker(660, 1, { kid: true, deel: 'deel-3', hat: 'cap' });
  drawMilking();
  makeBike();
  // 馬群：各種毛色（棗紅、栗色、灰白、黑、黃驃、白），還有小馬駒
  [[1140, 440, 'horse-bay'], [1215, 462, 'horse-grey'], [1300, 446, 'horse-black'], [1360, 472, 'horse-chest', { blaze: true }], [1180, 492, 'horse-dun'],
   [1270, 498, 'horse-white'], [1330, 436, 'horse-roan'], [1400, 494, 'horse-bay', { blaze: true }], [1240, 478, 'horse-chest', { foal: true }], [1390, 452, 'horse-grey', { foal: true }]].forEach(([x, y, c, o]) => addHerdHorse(x, y, c, o || {}));
  makeWrangler();
  // 羊群：綿羊與山羊混在一起放牧（蒙古牧民都這樣）
  for (let i = 0; i < 18; i++) {
    const x = 800 + (i % 6) * 38 + srand(-6, 6), y = 396 + Math.floor(i / 6) * 22 + srand(-4, 4);
    if (i % 4 === 3) addSheep(x, y, { goat: true, col: spick(['goat-1', 'goat-2', 'goat-3']) });
    else addSheep(x, y, { head: i % 3 ? 'sheep-head' : 'sheep-head-2' });
  }
  makeShepherd();
  addNearRider(); addNearCamels();
  addCaravan(); addVan();
  bindAll();
  setWeather(0);
  applyTime(true);
  updateWeather(0);
  step(1 / 30);
  requestAnimationFrame(loop);
}
init();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.kind,
  btn: { race: 'btnRace', star: 'btnStar' },
  save: () => ({ t: T.t, auto: T.auto, w: WX.idx }),
  stop: () => {
    T.ff = null;
    if (show.kind === 'race') { race.wait = false; endRace(); } else endStar();
  },
  restore: s => { if (WX.idx !== s.w) setWeather(s.w); T.t = s.t; T.auto = s.auto; $('btnAuto') && $('btnAuto').setAttribute('aria-pressed', String(T.auto)); applyTime(true); }
});
/* /ShowStop */
})();
</script>
