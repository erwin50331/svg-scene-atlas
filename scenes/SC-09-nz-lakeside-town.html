<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>/* 基本重設 */ body{margin:0} img{max-width:100%} [hidden]{display:none!important}</style>
<title>SC-09 紐西蘭湖畔小鎮</title>
<style>
/* =========================================================
   SC-09 紐西蘭湖畔小鎮｜線稿 line art
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   day-* / dusk-* / night-* 是日、黃昏、夜三組，
   JS 會依時間在幾組之間內插，寫進下面的「即時變數」。
   ========================================================= */
:root{
  /* 天空：上緣／下緣 */
  --day-sky-top:#a9d3e8;   --day-sky-bottom:#eef4ea;
  --dusk-sky-top:#5e6aa0;  --dusk-sky-bottom:#f2b27e;
  --night-sky-top:#060b22; --night-sky-bottom:#18224a;

  /* 紙（物件底色）與墨（線條色） */
  --day-paper:#fbf8ef;  --night-paper:#1a2140;
  --day-ink:#28302f;    --night-ink:#cfd8ee;
  --day-far:#dfe6ea;    --night-far:#1d2750;   /* 遠山（南阿爾卑斯） */
  --day-near:#cfdccb;   --night-near:#18213f;  /* 近山丘陵 */
  --day-snow:#ffffff;   --night-snow:#b9c4e4;  /* 山頂積雪 */
  --day-lake-top:#7fc3c9;    --night-lake-top:#16254e;    /* 冰河湖（上緣） */
  --day-lake-bottom:#b9e0d8; --night-lake-bottom:#0f1a3b; /* 冰河湖（近岸） */
  --dusk-lake-top:#c49aa6;
  --day-ground:#e8ecc9; --night-ground:#141b35; /* 岸邊草地 */
  --day-road:#e7e1d2;   --night-road:#1b2240;   /* 道路 */
  --day-shade:#d9dcc0;  --night-shade:#10162d;  /* 陰影、山坡 */

  /* 點綴色（線稿中少量使用） */
  --lupin-1:#8a63c9;   /* 魯冰花：紫 */
  --lupin-2:#e27aa8;   /* 魯冰花：粉 */
  --lupin-3:#f2d9a0;   /* 魯冰花：奶油黃 */
  --roof-a:#c8574a;    /* 鐵皮屋頂：紅 */
  --roof-b:#3f8f8a;    /* 鐵皮屋頂：青 */
  --boat:#c94a3a;      /* 蒸汽船、小船 */
  --canopy:#f0a640;    /* 滑翔傘 */
  --van:#e9b949;       /* 露營車 */
  --pukeko:#3d55a8;    /* 紫水雞羽色 */
  --beak:#d8382a;      /* 紫水雞紅喙 */
  --glow:#ffd27a;      /* 窗光、燈光 */
  --worm:#7ef0e6;      /* 螢火蟲洞的藍光 */
  --aurora-1:#4ef0a6;  /* 南極光：綠 */
  --aurora-2:#d86cf0;  /* 南極光：紫粉 */
  --sun:#f5b84a;
  --moon:#f5efd2;
  --rain:#5f7891;       /* 雨絲 */
  --flake:#ffffff;      /* 雪花 */
  --storm:#55606e;      /* 陰雨天的灰色罩層 */

  /* 頁面介面 */
  --page:#eef1e8; --page-ink:#28302f; --page-mute:#5f6a66; --page-line:#cdd5cb;
  --btn:#fbf8ef; --btn-on:#28302f; --btn-on-ink:#fbf8ef;

  /* 即時變數（JS 每幀改寫，這裡是白天的初始值） */
  --sky-top:var(--day-sky-top); --sky-bottom:var(--day-sky-bottom);
  --paper:var(--day-paper); --ink:var(--day-ink); --far:var(--day-far); --near:var(--day-near);
  --snow:var(--day-snow); --lake-top:var(--day-lake-top); --lake-bottom:var(--day-lake-bottom);
  --ground:var(--day-ground); --road:var(--day-road); --shade:var(--day-shade);

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-sign:"Georgia","Noto Serif TC","Songti TC",serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page);color:var(--page-ink)}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.code{font:600 13px/1 var(--font-ui);letter-spacing:.12em;padding:5px 8px;border:1.5px solid var(--page-ink);border-radius:3px}
h1{margin:0;font:700 26px/1.2 var(--font-ui);letter-spacing:.06em;text-wrap:balance}
.style{color:var(--page-mute);font-size:14px;letter-spacing:.04em}
.stage{margin:0;border:1.5px solid var(--page-ink);border-radius:4px;overflow:hidden;background:var(--sky-bottom);line-height:0}
#scene{display:block;width:100%;height:auto;touch-action:manipulation}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-ink);background:var(--btn);border:1.5px solid var(--page-ink);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button[aria-pressed="true"]{background:var(--btn-on);color:var(--btn-on-ink)}
.panel button:focus-visible,#scene [tabindex]:focus-visible{outline:2px dashed var(--roof-b);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;flex:1 1 260px;min-width:0}
.timebox input{flex:1;min-width:0;accent-color:var(--page-ink)}
.clock{font:600 15px/1 var(--font-ui);font-variant-numeric:tabular-nums;min-width:3.2em}
.hint{margin:0;color:var(--page-mute);font-size:13.5px;line-height:1.7;max-width:70em}

/* ---------- SVG 線稿共用樣式 ---------- */
#scene .ink{stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#scene .thin{stroke:var(--ink);fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
#scene .hair{stroke:var(--ink);fill:none;stroke-width:.8;stroke-linecap:round;opacity:.5}
#scene .paper{fill:var(--paper)}
#scene .shade{fill:var(--shade)}
#scene .far{fill:var(--far)}
#scene .near{fill:var(--near)}
#scene .snow{fill:var(--snow)}
#scene .ground{fill:var(--ground)}
#scene .road{fill:var(--road)}
#scene .inkfill{fill:var(--ink)}
#scene .glowfill{fill:var(--glow)}
#scene .hatch{stroke:var(--ink);stroke-width:1;opacity:.28;fill:none}
#scene .sign-t{fill:var(--ink);font-family:var(--font-sign);font-weight:700;text-anchor:middle;dominant-baseline:central;letter-spacing:.08em}
#scene .clickable{cursor:pointer}
#scene .bubble rect{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}
#scene .bubble text{fill:var(--ink);font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
@media (prefers-reduced-motion:reduce){ *{scroll-behavior:auto!important} }
</style>

<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="紐西蘭南島湖畔小鎮線稿動畫：雪山倒映在冰河湖上，有木棧碼頭、石造小教堂、魯冰花、羊群、露營車與日夜變化，夜裡出現南極光">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-top)"/>
        <stop offset="1" style="stop-color:var(--sky-bottom)"/>
      </linearGradient>
      <linearGradient id="lakeGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--lake-top)"/>
        <stop offset="1" style="stop-color:var(--lake-bottom)"/>
      </linearGradient>
      <radialGradient id="glowGrad">
        <stop offset="0" style="stop-color:var(--glow);stop-opacity:.85"/>
        <stop offset="1" style="stop-color:var(--glow);stop-opacity:0"/>
      </radialGradient>
      <radialGradient id="wormGrad">
        <stop offset="0" style="stop-color:var(--worm);stop-opacity:1"/>
        <stop offset="1" style="stop-color:var(--worm);stop-opacity:0"/>
      </radialGradient>
      <linearGradient id="coneGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" style="stop-color:var(--glow);stop-opacity:.6"/>
        <stop offset="1" style="stop-color:var(--glow);stop-opacity:0"/>
      </linearGradient>
      <!-- 南極光：下緣亮綠、往上漸淡成紫粉 -->
      <linearGradient id="auroraGrad" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" style="stop-color:var(--aurora-1);stop-opacity:.0"/>
        <stop offset=".12" style="stop-color:var(--aurora-1);stop-opacity:.85"/>
        <stop offset=".55" style="stop-color:var(--aurora-1);stop-opacity:.25"/>
        <stop offset="1" style="stop-color:var(--aurora-2);stop-opacity:0"/>
      </linearGradient>
      <linearGradient id="meteorGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" style="stop-color:var(--moon);stop-opacity:0"/>
        <stop offset="1" style="stop-color:var(--moon);stop-opacity:1"/>
      </linearGradient>
      <filter id="soft" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
      <filter id="mist" x="-10%" y="-100%" width="120%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
      <!-- 湖面範圍（倒影只畫在湖裡） -->
      <clipPath id="lakeClip"><rect x="-40" y="318" width="1680" height="180"/></clipPath>
      <!-- 鐵皮浪板屋頂的直紋 -->
      <pattern id="tin" width="6" height="10" patternUnits="userSpaceOnUse">
        <path class="hatch" d="M3 0V10" style="opacity:.45"/>
      </pattern>
      <!-- 木板牆的橫紋 -->
      <pattern id="board" width="10" height="7" patternUnits="userSpaceOnUse">
        <path class="hatch" d="M0 6.5H10"/>
      </pattern>
      <!-- 石牆紋 -->
      <pattern id="stone" width="22" height="14" patternUnits="userSpaceOnUse">
        <path class="hatch" d="M0 .5H22M0 7.5H22M6 .5V7.5M17 .5V7.5M2 7.5V14M12 7.5V14" style="opacity:.4"/>
      </pattern>
      <!-- 草坡短線 -->
      <pattern id="tussock" width="34" height="18" patternUnits="userSpaceOnUse">
        <path class="hatch" d="M4 14l2 -5M8 14l-1 -6M22 6l2 -4M26 6l-1 -5"/>
      </pattern>
    </defs>

    <!-- ===== 場景：天空 ===== -->
    <rect x="-20" y="-20" width="1640" height="640" fill="url(#skyGrad)" id="sky"/>
    <g id="milky"></g>
    <g id="stars"></g>
    <!-- 南極光（JS 每幀改寫波形） -->
    <g id="aurora" filter="url(#soft)" style="mix-blend-mode:screen"></g>
    <g id="meteors"></g>
    <!-- 太陽 -->
    <g id="sun"><g id="sunRays" class="ink"></g><circle r="26" style="fill:var(--sun)" class="ink"/></g>
    <!-- 月亮（用遮罩挖出彎月） -->
    <g id="moon">
      <mask id="moonMask"><circle r="22" fill="#fff"/><circle cx="10" cy="-6" r="19" fill="#000"/></mask>
      <circle r="22" style="fill:var(--moon)" mask="url(#moonMask)"/>
      <path class="thin" d="M-6 -21A22 22 0 1 0 21 7A19 19 0 0 1 -6 -21Z"/>
    </g>
    <g id="clouds"></g>

    <!-- ===== 場景：雪山（遠山＋近山）＝視差圖層 ===== -->
    <g id="farLayer">
      <g id="mtnAll"><!-- JS 依 RANGES 設定產生山稜、積雪 --></g>
      <g id="mtnHatch"></g>
      <g id="farShore"></g>
    </g>
    <!-- 天上的小飛機、滑翔傘（在山前面） -->
    <g id="paraglider"></g>
    <g id="plane"></g>
    <g id="flock"></g>

    <!-- ===== 場景：冰河湖、倒影、波光 ===== -->
    <rect x="-20" y="316" width="1640" height="200" fill="url(#lakeGrad)"/>
    <g clip-path="url(#lakeClip)">
      <g id="reflect" opacity=".38"><g id="reflectInner" transform="translate(0 513.2) scale(1 -.614)"><!-- JS 複製雪山進來當倒影 --></g></g>
      <g id="glint"></g>
      <g id="shimmer"></g>
    </g>
    <path class="thin" d="M-20 318 H1620"/>
    <!-- 清晨湖霧 -->
    <g id="mistG" filter="url(#mist)" opacity="0"></g>
    <!-- 湖上：蒸汽船、獨木舟、鴨子、漣漪 -->
    <g id="ripples"></g>
    <g id="steamer" class="clickable" tabindex="0" role="button" aria-label="蒸汽船，點了會鳴笛"></g>
    <g id="kayaks"></g>
    <g id="ducks"></g>
    <g id="fishJump"></g>
    <!-- 點湖面的感應區（透明） -->
    <rect id="lakeHit" class="clickable" x="0" y="330" width="1600" height="110" fill="transparent"/>

    <!-- ===== 場景：岸邊草地與右側牧場山坡 ===== -->
    <path id="land" class="ground ink" d=""/>
    <path id="landHatch" d="" fill="url(#tussock)"/>
    <g id="shoreDetail"></g>

    <!-- ===== 場景：碼頭、教堂、柳樹、蘆葦 ===== -->
    <g id="jetty"></g>
    <g id="church" class="clickable" tabindex="0" role="button" aria-label="石造小教堂，點了會敲鐘"></g>
    <g id="trees"></g>
    <g id="reeds"></g>
    <g id="woolshed"></g>

    <!-- ===== 角色：牧場羊群、紫水雞、觀星的人 ===== -->
    <g id="sheep"></g>
    <g id="fence"></g>
    <g id="pukeko" class="clickable" tabindex="0" role="button" aria-label="紫水雞，點了會跑開"></g>
    <g id="stargazers"></g>
    <g id="lupinsBack"></g>

    <!-- ===== 場景：小鎮街屋（由 JS 依 TOWN 設定產生） ===== -->
    <g id="town"></g>
    <g id="lamps"></g>

    <!-- ===== 場景：道路 ===== -->
    <rect class="road" x="-20" y="522" width="1640" height="42"/>
    <path class="ink" d="M-20 522 H1620 M-20 564 H1620"/>
    <path class="thin" d="M-20 543 H1620" stroke-dasharray="26 22" style="opacity:.55"/>
    <rect class="ground" x="-20" y="564" width="1640" height="60"/>
    <path class="hatch" d="M30 580l3 -6M90 590l-2 -7M210 584l3 -6M380 592l2 -6M470 578l-2 -6M820 586l3 -7M960 594l-2 -6M1100 582l2 -6M1220 590l-3 -6"/>

    <!-- ===== 角色＆交通工具：人行道行人、車輛 ===== -->
    <g id="walkers"></g>
    <g id="traffic"></g>

    <!-- ===== 場景：前景（蕨類土坡、螢火蟲、魯冰花） ===== -->
    <g id="fernBank"></g>
    <g id="lupins" class="clickable"></g>

    <!-- ===== 動畫：天氣（陰天罩層、雨絲、雪花），由「天氣」按鈕切換 ===== -->
    <rect id="wxShade" x="-20" y="-20" width="1640" height="640" style="fill:var(--storm)" opacity="0" pointer-events="none"/>
    <g id="wx" pointer-events="none"></g>

    <!-- 粒子：煙、花瓣、音符、對話泡泡 -->
    <g id="smoke"></g>
    <g id="petals"></g>
    <g id="bubbles"></g>
  </svg>
  </figure>

  <!-- ===== 互動：控制列 ===== -->
  <div class="panel">
    <button id="btnDay" type="button">☀ 白天</button>
    <button id="btnNight" type="button">☾ 夜晚</button>
    <button id="btnAuto" type="button" aria-pressed="true">自動播放</button>
    <button id="btnGust" type="button">🌬 吹一陣風</button>
    <button id="btnMeteor" type="button">✦ 流星雨</button>
    <button id="btnWeather" type="button">☀ 天氣：晴天</button>
    <label class="timebox" for="timeRange">
      <span>時間</span>
      <input id="timeRange" type="range" min="0" max="1000" value="440">
      <span class="clock" id="clock">10:33</span>
    </label>
  </div>
  <p class="hint">可以點：羊（跳起來咩一聲）、湖面（漣漪，偶爾有鱒魚躍出）、蒸汽船（鳴笛冒煙）、石造小教堂（敲鐘）、碼頭盡頭的釣客（收竿）、紫水雞（拍翅逃跑）、露營車（按喇叭加速）、魯冰花（花瓣隨風飛散）、天空（白天飛過一群鳥，夜裡劃過流星並讓極光變亮）。滑鼠移動時雪山會微微視差。按鈕：「吹一陣風」讓雲、風向袋、樹和魯冰花一起被吹動、花瓣滿天飛；「流星雨」會轉成夜晚，連續劃過流星並讓極光變亮。「天氣」按鈕會在晴天、下雨、下雪之間輪流切換，下雨時湖面會冒出雨滴漣漪。</p>
</main>

<script>
/* =========================================================
   SC-09 紐西蘭湖畔小鎮｜程式區
   區塊：①工具 ②場景（山、湖、岸、小鎮） ③角色 ④動畫 ⑤互動
   ========================================================= */
(() => {
'use strict';

/* ---------------- ① 工具 ---------------- */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const root = document.documentElement;
const svg = $('scene');
const HORIZON = 318;   // 湖的遠岸線
const WALK = 520;      // 人行道（行人腳底）
const LANE_A = 556;    // 前車道（往右）
const LANE_B = 540;    // 後車道（往左）
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
// 固定亂數：讓每次開啟的構圖一樣
let seed = 20261121;
const srand = (a = 0, b = 1) => { seed = (seed * 16807) % 2147483647; return a + (seed / 2147483647) * (b - a); };
function el(tag, attrs = {}, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function frag(parent, html) { parent.insertAdjacentHTML('beforeend', html); return parent.lastElementChild; }
const f1 = n => n.toFixed(1);
// 色票讀取與內插
const css = n => getComputedStyle(root).getPropertyValue(n).trim();
const hex = h => { h = h.replace('#', ''); if (h.length === 3) h = [...h].map(c => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const PAL = {};
['sky-top', 'sky-bottom', 'lake-top'].forEach(k => PAL[k] = { day: hex(css('--day-' + k)), dusk: hex(css('--dusk-' + k)), night: hex(css('--night-' + k)) });
['paper', 'ink', 'far', 'near', 'snow', 'lake-bottom', 'ground', 'road', 'shade'].forEach(k => PAL[k] = { day: hex(css('--day-' + k)), night: hex(css('--night-' + k)) });

/* 動態偏好 */
const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
let reduced = mq.matches;

/* 岸線高度：x 位置的草地上緣（右側是牧場山坡） */
const hill = x => 92 * smooth(1110, 1470, x) - 8 * smooth(1470, 1640, x);
const shoreY = x => 458 + 5 * Math.sin(x / 140) + 3 * Math.sin(x / 53 + 1) - hill(x);

/* ---------------- ② 場景：雪山 ----------------
   RANGES：每一道山稜的折點，想改山形改這裡。
   cls：填色（far 遠山／near 近山）；snow：積雪最大深度 */
const RANGES = [
  { cls: 'far', snow: 58, pts: [[-40, 250], [30, 214], [80, 232], [150, 172], [205, 206], [262, 150], [330, 200], [384, 184], [446, 228], [508, 196], [574, 128], [636, 180], [690, 162], [760, 214], [822, 190], [890, 112], [948, 166], [1000, 146], [1066, 204], [1126, 176], [1196, 100], [1262, 160], [1314, 142], [1384, 200], [1444, 172], [1508, 210], [1566, 180], [1640, 226]] },
  { cls: 'near', snow: 26, pts: [[-40, 284], [60, 258], [140, 270], [230, 236], [320, 262], [420, 250], [520, 276], [640, 254], [760, 280], [880, 266], [960, 286], [1060, 258], [1160, 244], [1240, 268], [1330, 252], [1440, 276], [1540, 262], [1640, 280]] }
];
function drawMountains() {
  const g = $('mtnAll'), hg = $('mtnHatch');
  RANGES.forEach(r => {
    const p = r.pts;
    el('path', { class: r.cls + ' ink', d: 'M' + p.map(q => q.join(' ')).join(' L') + ` V${HORIZON + 2} H-40Z` }, g);
    // 積雪：每個山峰往下挖出鋸齒狀雪帽
    let d = '', hd = '';
    for (let i = 1; i < p.length - 1; i++) {
      const [px, py] = p[i], L = p[i - 1], R = p[i + 1];
      if (!(py < L[1] && py < R[1])) continue;
      const dep = Math.min(r.snow, (L[1] - py) * .62, (R[1] - py) * .62);
      if (dep < 10) continue;
      const lx = px + (L[0] - px) * dep / (L[1] - py), rx = px + (R[0] - px) * dep / (R[1] - py);
      const y = py + dep;
      d += `M${px} ${py} L${f1(rx)} ${f1(y)}`;
      for (let k = 1; k < 5; k++) d += ` L${f1(rx + (lx - rx) * k / 5)} ${f1(y + (k % 2 ? -dep * .34 : dep * .12))}`;
      d += ` L${f1(lx)} ${f1(y)}Z`;
      // 山的右側陰影排線
      for (let k = 1; k <= 4; k++) {
        const t = .25 + k * .16;
        const sx = px + (R[0] - px) * t, sy = py + (R[1] - py) * t;
        hd += `M${f1(sx)} ${f1(sy + 4)} l${-6 - k * 2} ${14 + k * 4}`;
      }
    }
    el('path', { class: 'snow thin', d }, g);
    el('path', { class: 'hatch', d: hd }, hg);
  });
  // 倒影：複製一份山稜到湖裡（上下翻轉、壓扁）
  $('reflectInner').appendChild(g.cloneNode(true)).removeAttribute('id');
  // 近山腳下的森林（小三角樹）與遠岸小屋
  const fs = $('farShore');
  let t = '';
  for (let x = -20; x < 1640; x += srand(9, 16)) {
    const h = srand(8, 16), y = HORIZON - srand(0, 5);
    t += `M${f1(x)} ${f1(y)} l${f1(h * .35)} ${f1(-h)} l${f1(h * .35)} ${f1(h)}`;
  }
  el('path', { class: 'hair', d: t, style: 'opacity:.6' }, fs);
  [[1215, 312], [1236, 314], [1262, 311], [300, 313], [318, 315]].forEach(([x, y]) =>
    frag(fs, `<g><rect x="${x}" y="${y - 6}" width="12" height="6" class="paper thin"/><path class="thin" d="M${x - 1} ${y - 6} l7 -5 l7 5"/></g>`));
}

const lupins = [];
function lupin(parent, x, y, h, col, s = 1) {
  let bells = '';
  const n = Math.round(h / 4.2);
  for (let k = 0; k < n; k++) {
    const t = k / n, yy = -h * .35 - t * h * .65, w = (1 - t) * 4 + 1.4;
    bells += `<ellipse cx="${f1(-w)}" cy="${f1(yy)}" rx="${f1(w * .7 + .6)}" ry="2" /><ellipse cx="${f1(w)}" cy="${f1(yy - 1.8)}" rx="${f1(w * .7 + .6)}" ry="2"/>`;
  }
  let lf = '';
  for (let k = 0; k < 7; k++) { const a = -Math.PI * (.12 + k * .126); lf += `M0 ${-h * .22} l${f1(Math.cos(a) * 11)} ${f1(Math.sin(a) * 7 + 4)}`; }
  const g = frag(parent, `<g transform="translate(${f1(x)} ${f1(y)}) scale(${s})"><g class="stem"><path class="thin" d="M0 0 Q1 ${f1(-h * .4)} 0 ${f1(-h)}"/><path class="hair" d="${lf}" style="opacity:.9"/>
    <g style="fill:var(--${col});stroke:var(--ink);stroke-width:.7">${bells}</g></g></g>`);
  const l = { g, stem: g.querySelector('.stem'), x, y, h, col, ph: srand(0, 6), kick: 0 };
  lupins.push(l);
  return l;
}

  for (let i = 0; i < n; i++) { const x0 = i * w / n, x1 = (i + 1) * w / n, h = 18 + srand(0, 18); d += ` C${f1(x0)} ${f1(-h)} ${f1(x1)} ${f1(-h)} ${f1(x1)} 0`; }
  return d + ` Q${f1(w / 2)} 8 0 0Z`;
}
function drawSky() {
  [[100, 70, 180, 3], [560, 46, 140, 4], [980, 84, 220, 2.5], [1340, 58, 150, 3.5], [1600, 110, 120, 4.5]].forEach(([x, y, w, sp]) => {
    const g = frag($('clouds'), `<g><path class="paper ink" d="${cloudPath(w)}"/><path class="hair" d="M${w * .2} -4 h${w * .4}"/></g>`);
    clouds.push({ g, x, y, sp, s: 1 });
  });
  // 星星與銀河
  for (let i = 0; i < 140; i++) {
    const c = el('circle', { cx: f1(srand(0, 1600)), cy: f1(srand(0, 300)), r: f1(srand(.5, 1.6)), style: 'fill:var(--moon)', opacity: 0 }, $('stars'));
    stars.push({ el: c, sp: srand(.8, 3), ph: srand(0, 6) });
  }
  for (let i = 0; i < 360; i++) {
    const t = srand(), off = (srand() + srand() + srand() - 1.5) * 60;
    const x = 200 + t * 1200 + off * .5, y = 40 + t * 180 - off;
    el('circle', { cx: f1(x), cy: f1(y), r: f1(srand(.3, 1)), style: 'fill:var(--moon)' }, $('milky'));
  }
  // 南極光三道
  for (let i = 0; i < 3; i++) aurora.push({ el: el('path', { fill: 'url(#auroraGrad)', d: '' }, $('aurora')), base: 210 + i * 18, h: 120 - i * 25, sp: .25 + i * .08, ph: i * 2 });
  // 滑翔傘
  frag($('paraglider'), `<g><path class="ink" style="fill:var(--canopy)" d="M-26 0 Q0 -14 26 0 Q0 -6 -26 0Z"/><path class="hair" d="M-24 0 L0 30 M24 0 L0 30 M-10 -4 L0 30 M10 -4 L0 30" style="opacity:.8"/><circle cx="0" cy="34" r="3.5" class="paper thin"/><path class="thin" d="M0 38 v6"/></g>`);
  // 水上小飛機
  frag($('plane'), `<g class="clickable" tabindex="0" role="button" aria-label="水上小飛機"><g class="pl">
    <rect x="-46" y="-30" width="92" height="44" fill="transparent"/>
    <path class="paper ink" d="M-40 -8 Q-40 -16 -30 -16 L20 -18 Q34 -16 36 -8 Q30 -2 -30 -2Z"/>
    <path class="ink" style="fill:var(--boat)" d="M-14 -18 L18 -22 L22 -18 L-12 -16Z"/>
    <path class="paper ink" d="M-40 -14 L-48 -28 L-36 -28 L-30 -16"/>
    <path class="paper thin" d="M14 -16 L24 -16 L30 -9 L14 -9Z"/>
    <path class="thin" d="M-20 -2 L-24 8 M14 -2 L18 8 M-34 10 H34 Q38 10 38 6"/>
    <g class="prop"><path class="thin" d="M38 -16 V0"/></g>
  </g></g>`);
}
const stars = [];
const aurora = [];

/* ---------------- ④ 動畫 ---------------- */
const DAY_SECONDS = 80;     // 自動播放時，一天＝80 秒
let tod = 0.44;              // 一天中的時間 0～1（0＝午夜、0.5＝中午）
let target = null;
let auto = !reduced;
let T = 0, wind = 0.4, mx = 0, mxS = 0, nightAmt = 0, auroraBoost = 0;
let gust = 0;        // 【互動】「吹一陣風」按鈕：0～1，逐漸消退
let meteorRain = 0;  // 【互動】「流星雨」按鈕：剩餘秒數
// 【動畫】天氣：0 晴天／1 下雨／2 下雪；rainAmt、snowAmt 會慢慢淡入淡出
const WEATHER = [{ icon: '☀', name: '晴天' }, { icon: '☂', name: '下雨' }, { icon: '❄', name: '下雪' }];
let weather = 0, rainAmt = 0, snowAmt = 0;
const wxDrops = [];
const plane = { x: 1900, y: 170, v: -90, wob: 0, wait: 6 };
const glider = { x: 1300, y: 150 };

/* 粒子池：煙 */
const smokePool = [];
for (let i = 0; i < 46; i++) {
  const p = el('circle', { class: 'paper thin', r: 4, opacity: 0 }, $('smoke'));
  smokePool.push({ el: p, life: 0, max: 1, x: 0, y: 0, vx: 0, vy: 0, r: 4 });
}
function emitSmoke(x, y, big = 1) {
  const p = smokePool.find(q => q.life <= 0);
  if (!p) return;
  Object.assign(p, { x: x + rand(-2, 2), y, vx: rand(-2, 4), vy: rand(-16, -10) * big, life: rand(1.8, 3), r: rand(2.5, 4) * big });
  p.max = p.life;
}
/* 粒子池：花瓣 */
const petalPool = [];
for (let i = 0; i < 50; i++) {
  const p = el('ellipse', { rx: 2.6, ry: 1.5, opacity: 0, style: 'stroke:var(--ink);stroke-width:.5' }, $('petals'));
  petalPool.push({ el: p, life: 0, x: 0, y: 0, vx: 0, vy: 0, rot: 0 });
}
function emitPetal(x, y, col) {
  const p = petalPool.find(q => q.life <= 0);
  if (!p) return;
  Object.assign(p, { x, y, vx: rand(20, 70), vy: rand(-50, -10), life: rand(2, 3.5), rot: rand(0, 360) });
  p.el.style.fill = `var(--${col})`;
}
/* 漣漪 */
const ripples = [];
function addRipple(x, y, big = 1) {
  const e = el('ellipse', { cx: x, cy: y, rx: 2, ry: .6, class: 'thin' }, $('ripples'));
  ripples.push({ el: e, t: 0, big });
}
/* 對話泡泡 */
const bubbles = [];
function say(x, y, text, dur = 1.6) {
  const w = text.length * 15 + 20;
  const g = frag($('bubbles'), `<g class="bubble" transform="translate(${x} ${y})"><rect x="${-w / 2}" y="-30" width="${w}" height="26" rx="13"/><path class="ink" d="M-4 -4 L0 4 L4 -4" style="fill:var(--paper)"/><text y="-17">${text}</text></g>`);
  bubbles.push({ g, x, y, t: 0, dur });
}

function applyTime() {
  const elev = Math.sin((tod - 0.25) * Math.PI * 2);
  const day = smooth(-0.2, 0.25, elev);
  const dusk = Math.max(0, 1 - Math.abs(elev) / 0.34) * (elev > -0.25 ? 1 : 0);
  nightAmt = 1 - day;
  for (const k of ['sky-top', 'sky-bottom', 'lake-top']) {
    const c = mix(mix(PAL[k].night, PAL[k].day, day), PAL[k].dusk, dusk * 0.75);
    root.style.setProperty('--' + k, rgb(c));
  }
  for (const k of ['paper', 'ink', 'far', 'near', 'snow', 'lake-bottom', 'ground', 'road', 'shade']) root.style.setProperty('--' + k, rgb(mix(PAL[k].night, PAL[k].day, day)));

  // 太陽、月亮軌跡（會從雪山後面升起）
  const sp = (tod - 0.25) / 0.5;
  const sx = 120 + sp * 1360, sy = 360 - elev * 300;
  $('sun').setAttribute('transform', `translate(${f1(sx)} ${f1(sy)}) rotate(${f1(T * 8)})`);
  $('sun').style.opacity = elev > -0.15 ? f1(1 - Math.max(rainAmt, snowAmt) * .8) : 0; // 雨雪天太陽變淡
  const mt = (tod + 0.5) % 1, melev = Math.sin((mt - 0.25) * Math.PI * 2), msp = (mt - 0.25) / 0.5;
  const mxp = 120 + msp * 1360, myp = 360 - melev * 280;
  $('moon').setAttribute('transform', `translate(${f1(mxp)} ${f1(myp)})`);
  $('moon').style.opacity = melev > -0.15 ? 1 : 0;
  // 湖面光帶：跟著太陽或月亮
  const useSun = elev > 0.05, gx = useSun ? sx : mxp, gEl = useSun ? elev : melev;
  const gOp = clamp(gEl * 2, 0, 1) * (useSun ? .55 : .8);
  [...$('glint').children].forEach((p, i) => {
    const y = 326 + i * 10 + i * i * .4, w = 6 + i * 3 + Math.sin(T * 2 + i) * 3;
    const x = gx + Math.sin(T * 1.3 + i * 1.7) * (3 + i);
    p.setAttribute('d', `M${f1(x - w)} ${f1(y)} H${f1(x + w)}`);
    p.setAttribute('opacity', f1(gOp * (1 - i / 14)));
    p.style.stroke = useSun ? 'var(--sun)' : 'var(--moon)';
  });
  // 清晨湖霧（日出前後最濃）
  const mistAmt = Math.max(0, 1 - Math.abs(tod - 0.27) / 0.07);
  $('mistG').setAttribute('opacity', f1(mistAmt * .7));
  $('milky').setAttribute('opacity', f1(smooth(.6, .95, nightAmt) * .55));

  const mins = Math.floor(tod * 1440);
  $('clock').textContent = `${String(Math.floor(mins / 60)).padStart(2, '0')}:${String(mins % 60).padStart(2, '0')}`;
  $('timeRange').value = Math.round(tod * 1000);
}

function step(dt) {
  T += dt;
  if (target !== null) {
    let d = target - tod; if (d > .5) d -= 1; if (d < -.5) d += 1;
    tod = (tod + d * Math.min(1, dt * 2.2) + 1) % 1;
    if (Math.abs(d) < 0.002) { tod = target; target = null; }
  } else if (auto) tod = (tod + dt / DAY_SECONDS) % 1;
  applyTime();

  // 風：兩個正弦疊加＋陣風
  wind = 0.45 + 0.3 * Math.sin(T * 0.21) + 0.2 * Math.sin(T * 0.67 + 1.3) + 0.1 * Math.sin(T * 2.1) + gust * 1.3;
  // 【動畫】強風：魯冰花花瓣被吹散
  if (gust > 0) {
    gust = Math.max(0, gust - dt * .22);
    if (dt > 0 && Math.random() < gust * 1.2) { const l = lupins[Math.floor(rand(0, lupins.length))]; emitPetal(l.x, l.y - l.h * rand(.5, 1), l.col); }
  }
  // 【動畫】天氣：雨絲斜落、雪花飄落，湖面在雨中冒出漣漪
  const k = dt > .001 ? Math.min(1, dt * .8) : 1;
  rainAmt += ((weather === 1 ? 1 : 0) - rainAmt) * k;
  snowAmt += ((weather === 2 ? 1 : 0) - snowAmt) * k;
  $('wxShade').setAttribute('opacity', f1((rainAmt * .38 + snowAmt * .18) * (1 - nightAmt * .5)));
  wxDrops.forEach(d => {
    const amt = d.snow ? snowAmt : rainAmt;
    if (amt < .02) { d.el.setAttribute('opacity', 0); return; }
    if (d.snow) { d.y += d.v * dt; d.x += (wind * 30 + Math.sin(T * 1.5 + d.ph) * 14) * dt; }
    else { d.y += d.v * dt; d.x += (wind * 120 - 40) * dt; }
    if (d.y > 610) { d.y = rand(-40, -5); d.x = rand(-100, 1700); }
    if (d.x > 1700) d.x -= 1800; if (d.x < -100) d.x += 1800;
    if (d.snow) d.el.setAttribute('transform', `translate(${f1(d.x)} ${f1(d.y)})`);
    else d.el.setAttribute('transform', `translate(${f1(d.x)} ${f1(d.y)}) rotate(${f1(-8 - wind * 14)})`);
    d.el.setAttribute('opacity', f1(amt * d.op));
  });
  if (rainAmt > .3 && dt > .001 && Math.random() < rainAmt * dt * 6) addRipple(rand(0, 1600), rand(345, 435), .45);

  // 【動畫】流星雨：夜晚時在天空隨機劃過流星
  if (meteorRain > 0) {
    meteorRain -= dt;
    if (nightAmt > .5 && dt > 0 && Math.random() < dt * 5) {
      const m = el('line', { stroke: 'url(#meteorGrad)', 'stroke-width': 2, 'stroke-linecap': 'round' }, $('meteors'));
      meteors.push({ el: m, x: rand(200, 1500), y: rand(20, 200), t: 0 });
      auroraBoost = 1;
    }
  }

  // 視差：雪山、雲、倒影
  mxS += (mx - mxS) * Math.min(1, dt * 3);
  $('farLayer').setAttribute('transform', `translate(${f1(-mxS * 14)} 0)`);
  $('reflect').setAttribute('transform', `translate(${f1(-mxS * 14)} 0)`);
  $('clouds').setAttribute('transform', `translate(${f1(-mxS * 22)} 0)`);
  // 倒影隨波紋微微晃動
  $('reflectInner').setAttribute('transform', `translate(${f1(Math.sin(T * .9) * 2)} 513.2) scale(1 ${f1(-.614 + Math.sin(T * 1.3) * .006)})`);

  // 雲
  clouds.forEach(c => {
    c.x += (c.sp + wind * 8) * dt;
    if (c.x > 1700) c.x = -260;
    c.g.setAttribute('transform', `translate(${f1(c.x)} ${c.y})`);
    c.g.style.opacity = 1 - nightAmt * .55;
  });

  // 星星閃爍、極光波動
  stars.forEach(s => s.el.setAttribute('opacity', f1(nightAmt * (0.55 + 0.45 * Math.sin(T * s.sp + s.ph)))));
  auroraBoost = Math.max(0, auroraBoost - dt * .12);
  const aOp = smooth(.65, .95, nightAmt) * (.55 + auroraBoost * .45);
  $('aurora').setAttribute('opacity', f1(aOp));
  if (aOp > .01) aurora.forEach(a => {
    let top = '', bot = '';
    const pts = [];
    for (let x = -60; x <= 1660; x += 60) {
      const y = a.base + Math.sin(x / 210 + T * a.sp + a.ph) * 22 + Math.sin(x / 90 - T * a.sp * 1.7) * 8;
      const h = a.h * (.6 + .4 * Math.sin(x / 150 + T * a.sp * 1.3 + a.ph)) * (1 + auroraBoost * .4);
      pts.push([x, y, h]);
    }
    top = 'M' + pts.map(p => `${p[0]} ${f1(p[1] - p[2])}`).join(' L');
    bot = pts.reverse().map(p => `L${p[0]} ${f1(p[1])}`).join(' ');
    a.el.setAttribute('d', top + ' ' + bot + 'Z');
  });

  // 湖面波光
  shimmer.forEach(s => {
    s.x += (8 + wind * 10) * s.sp * dt * .4;
    if (s.x > 1620) s.x = -30;
    const o = (.25 + .3 * Math.sin(T * s.sp * 2 + s.ph)) * (1 - nightAmt * .4);
    s.el.setAttribute('transform', `translate(${f1(s.x)} ${f1(s.y + Math.sin(T + s.ph) * .6)})`);
    s.el.setAttribute('opacity', f1(Math.max(0, o)));
  });

  // 隨風擺動：柳枝、樹、蘆葦、風車、招牌、蕨
  swayers.forEach(s => {
    if (s.type === 'willow') {
      const sw = wind * 10 + Math.sin(T * 1.4 + s.ph) * 3;
      s.el.setAttribute('d', `M${f1(s.x)} ${f1(s.top)} q${f1(sw * .2)} ${f1(s.len * .5)} ${f1(sw)} ${f1(s.len)}`);
    } else if (s.type === 'tree') {
      s.el.setAttribute('transform', `rotate(${f1(wind * s.amp + Math.sin(T * 1.2 + s.ph) * .8)} ${s.x} ${s.y})`);
    } else if (s.type === 'crown') {
      s.el.setAttribute('transform', `translate(${s.x} ${s.y}) rotate(${f1(wind * s.amp + Math.sin(T * 1.8 + s.ph) * 2)})`);
    } else if (s.type === 'reed') {
      s.el.style.transform = `skewX(${f1(-wind * s.amp - Math.sin(T * 1.6) * 1.5)}deg)`;
    } else if (s.type === 'mill') {
      s.el.setAttribute('transform', s.el.getAttribute('transform').replace(/rotate\([^)]*\)/, '') + ` rotate(${f1(T * (60 + wind * 120))})`);
    } else if (s.type === 'sign') {
      s.el.setAttribute('transform', `rotate(${f1(-wind * s.amp + Math.sin(T * 2.2) * 2)} ${s.x} ${s.y})`);
    } else if (s.type === 'fern') {
      s.el.setAttribute('transform', `translate(${s.x} ${s.y}) rotate(${f1(s.a + Math.sin(T * 1.3 + s.ph) * s.amp + wind * 2)})`);
    }
  });
  // 風向袋
  windsock.setAttribute('transform', `translate(898 418) rotate(${f1(70 - wind * 85 + Math.sin(T * 3) * 4)}) scale(${f1(.8 + wind * .3)} 1)`);

  // 魯冰花擺動（被點會晃更大）
  lupins.forEach(l => {
    l.kick *= Math.pow(.2, dt);
    l.stem.setAttribute('transform', `rotate(${f1(wind * 4 + Math.sin(T * 1.7 + l.ph) * 2.2 + Math.sin(T * 9) * l.kick)})`);
  });

  // 燈光：窗戶逐盞亮、路燈偶爾閃、串燈、教堂窗
  windows.forEach(w => {
    const on = nightAmt > w.thr ? 1 : 0;
    w.val += (on - w.val) * Math.min(1, dt * 3);
    const fl = 0.92 + 0.08 * Math.sin(T * 7 + w.ph);
    w.el.setAttribute('opacity', f1(w.val * .82 * fl));
  });
  lamps.forEach(l => {
    const fl = Math.random() < 0.01 ? .25 : 1;
    l.el.setAttribute('opacity', f1(smooth(.35, .7, nightAmt) * fl));
  });
  stringLights.forEach(s => {
    const on = nightAmt > .4 && Math.sin(T * 2.4 + s.ph) > -0.6;
    s.el.style.fill = on ? 'var(--glow)' : 'var(--paper)';
  });
  churchWin.setAttribute('opacity', f1(smooth(.5, .8, nightAmt) * (.85 + .15 * Math.sin(T * 5))));
  worms.forEach(w => w.el.setAttribute('opacity', f1(smooth(.6, .9, nightAmt) * (.5 + .5 * Math.sin(T * w.sp + w.ph)))));
  $('stargazers').setAttribute('opacity', f1(smooth(.7, .9, nightAmt)));

  // 煙：煙囪、蒸汽船
  chimneys.forEach(c => { if (Math.random() < c.rate * dt * 3) emitSmoke(c.x, c.y, .9); });
  smokePool.forEach(p => {
    if (p.life <= 0) return;
    p.life -= dt;
    p.x += (p.vx + wind * 18) * dt; p.y += p.vy * dt;
    const k = 1 - p.life / p.max;
    p.el.setAttribute('cx', f1(p.x)); p.el.setAttribute('cy', f1(p.y));
    p.el.setAttribute('r', f1(p.r * (1 + k * 2.2)));
    p.el.setAttribute('opacity', f1(Math.max(0, (1 - k) * .75)));
  });
  // 花瓣
  petalPool.forEach(p => {
    if (p.life <= 0) { p.el.setAttribute('opacity', 0); return; }
    p.life -= dt; p.vx += wind * 30 * dt; p.vy += 22 * dt; p.rot += 200 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt + Math.sin(T * 6 + p.rot) * .3;
    p.el.setAttribute('transform', `translate(${f1(p.x)} ${f1(p.y)}) rotate(${f1(p.rot)})`);
    p.el.setAttribute('opacity', f1(Math.min(1, p.life)));
  });

  // 蒸汽船來回航行
  steamer.horn = Math.max(0, steamer.horn - dt);
  steamer.x += steamer.v * steamer.dir * dt * (1 + steamer.horn * .4);
  if (steamer.x > 1460) steamer.dir = -1;
  if (steamer.x < 140) steamer.dir = 1;
  const sB = Math.sin(T * 1.5) * .8;
  $('steamer').setAttribute('transform', `translate(${f1(steamer.x)} ${f1(356 + sB)}) scale(${steamer.dir * .55} .55)`);
  if (Math.random() < dt * (1.2 + steamer.horn * 10)) emitSmoke(steamer.x - steamer.dir * 1, 356 - 30, .55 + steamer.horn * .4);
  if (Math.random() < dt * 1.5) addRipple(steamer.x - steamer.dir * 36, 359, .6);

  // 獨木舟
  kayaks.forEach(k => {
    k.x += k.v * k.dir * dt;
    if (k.x > 1560) k.dir = -1; if (k.x < 60) k.dir = 1;
    k.g.setAttribute('transform', `translate(${f1(k.x)} ${f1(k.y + Math.sin(T * 2 + k.ph) * .8)}) scale(${k.dir} 1)`);
    k.paddle.setAttribute('transform', `rotate(${f1(Math.sin(T * 4 + k.ph) * 26)})`);
    if (Math.random() < dt * .8) addRipple(k.x - k.dir * 20, k.y + 1, .5);
  });
  // 鴨子：浮沉、偶爾潛水
  ducks.forEach(d => {
    d.dive = Math.max(0, d.dive - dt);
    d.x += Math.sin(T * .3 + d.ph) * 4 * dt;
    const under = d.dive > .3 && d.dive < 1.6;
    d.g.setAttribute('transform', `translate(${f1(d.x)} ${f1(d.y + Math.sin(T * 2.2 + d.ph) * .8 + (under ? 10 : 0))}) scale(${d.dir} 1)`);
    d.g.style.opacity = under ? 0 : 1;
  });
  // 漣漪
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i]; r.t += dt;
    const k = r.t / (1.8 * r.big + .6);
    r.el.setAttribute('rx', f1(2 + k * 40 * r.big)); r.el.setAttribute('ry', f1(.6 + k * 7 * r.big));
    r.el.setAttribute('opacity', f1(Math.max(0, 1 - k)));
    if (k >= 1) { r.el.remove(); ripples.splice(i, 1); }
  }
  // 躍出的鱒魚
  for (let i = fishes.length - 1; i >= 0; i--) {
    const f = fishes[i]; f.t += dt;
    const k = f.t / .9;
    const x = f.x + k * 34 * f.dir, y = f.y - Math.sin(k * Math.PI) * 34;
    f.el.setAttribute('transform', `translate(${f1(x)} ${f1(y)}) rotate(${f1((k - .5) * 120 * f.dir)}) scale(${f.dir} 1)`);
    if (k >= 1) { addRipple(x, f.y, 1); f.el.remove(); fishes.splice(i, 1); }
  }

  // 滑翔傘：從山上慢慢飄下來
  glider.x -= (14 + wind * 6) * dt;
  glider.y = 130 + Math.sin(T * .2) * 20 + (1300 - glider.x) * .04;
  if (glider.x < -60) { glider.x = 1700; }
  $('paraglider').setAttribute('transform', `translate(${f1(glider.x)} ${f1(glider.y)}) rotate(${f1(Math.sin(T * .8) * 4)})`);
  $('paraglider').style.opacity = 1 - nightAmt;

  // 水上小飛機：每隔一陣子飛過
  if (plane.wait > 0) { plane.wait -= dt; plane.x = 1760; }
  else {
    plane.x += plane.v * dt;
    plane.wob = Math.max(0, plane.wob - dt);
    if (plane.x < -120) { plane.wait = rand(14, 26); plane.v = -90; }
  }
  const pr = Math.sin(T * 2) * 2 + Math.sin(plane.wob * 10) * plane.wob * 12;
  $('plane').setAttribute('transform', `translate(${f1(plane.x)} ${f1(plane.y + Math.sin(T * .9) * 6)}) rotate(${f1(pr)}) scale(-.7 .7)`);
  $('plane').querySelector('.prop').setAttribute('transform', `scale(1 ${f1(Math.sin(T * 40))})`);
  $('plane').style.opacity = 1 - nightAmt * .9;

  // 飛鳥群
  for (let i = flock.length - 1; i >= 0; i--) {
    const b = flock[i]; b.x += b.vx * dt; b.y += Math.sin(T * 2 + b.ph) * 8 * dt;
    const wv = Math.sin(T * 9 + b.ph) * 4;
    b.el.setAttribute('d', `M${f1(b.x - 7)} ${f1(b.y + wv)} Q${f1(b.x - 3)} ${f1(b.y - 2)} ${f1(b.x)} ${f1(b.y)} Q${f1(b.x + 3)} ${f1(b.y - 2)} ${f1(b.x + 7)} ${f1(b.y + wv)}`);
    if (b.x > 1700 || b.x < -100) { b.el.remove(); flock.splice(i, 1); }
  }
  // 流星
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i]; m.t += dt;
    const k = m.t / .9;
    const x = m.x + k * 260, y = m.y + k * 110;
    m.el.setAttribute('x1', f1(x - 80)); m.el.setAttribute('y1', f1(y - 34)); m.el.setAttribute('x2', f1(x)); m.el.setAttribute('y2', f1(y));
    m.el.setAttribute('opacity', f1(Math.sin(k * Math.PI)));
    if (k >= 1) { m.el.remove(); meteors.splice(i, 1); }
  }

  // 羊：吃草（低頭）、慢慢走、被點會跳
  sheep.forEach(s => {
    s.jump = Math.max(0, s.jump - dt);
    s.wait -= dt;
    if (s.wait < 0 && Math.abs(s.tx - s.x) < 1) { s.tx = clamp(s.x + rand(-40, 40), 1200, 1590); s.wait = rand(4, 12); }
    const dx = s.tx - s.x;
    if (Math.abs(dx) > 1) { s.x += Math.sign(dx) * 6 * dt; s.dir = Math.sign(dx); }
    const graze = Math.abs(dx) <= 1 && Math.sin(T * .7 + s.ph) > 0;
    const jy = s.jump > 0 ? -Math.sin((1 - s.jump / .6) * Math.PI) * 22 : 0;
    s.g.setAttribute('transform', `translate(${f1(s.x)} ${f1(s.y + jy)}) scale(${f1(s.dir * s.s)} ${f1(s.s)})`);
    s.head.setAttribute('transform', graze ? `translate(2 7) rotate(18 18 -14)` : `translate(0 ${f1(Math.sin(T * 2 + s.ph) * .6)})`);
  });

  // 紫水雞：在蘆葦旁走來走去，受驚會快跑
  puk.run = Math.max(0, puk.run - dt);
  const pv = puk.run > 0 ? 90 : 10;
  puk.x += puk.dir * pv * dt;
  if (puk.x > 880) puk.dir = -1; if (puk.x < 736) puk.dir = 1;
  puk.ph += dt * (puk.run > 0 ? 18 : 5);
  const py = shoreY(puk.x) + 22;
  $('pukeko').setAttribute('transform', `translate(${f1(puk.x)} ${f1(py - (puk.run > 0 ? Math.abs(Math.sin(puk.ph)) * 3 : 0))}) scale(${puk.dir * .9} .9)`);
  $('pukeko').querySelector('.legs').setAttribute('d', `M-2 -8 L${f1(-4 + Math.sin(puk.ph) * 3)} 0 M3 -8 L${f1(5 - Math.sin(puk.ph) * 3)} 0`);

  // 行人走路
  walkers.forEach(w => {
    w.x += w.v * dt;
    if (w.x > 1660) w.x = -60; if (w.x < -60) w.x = 1660;
    const dir = Math.sign(w.v), ph = T * Math.abs(w.v) * .28 + w.ph, sw = Math.sin(ph) * 6, a = Math.sin(ph) * 5;
    w.g.setAttribute('transform', `translate(${f1(w.x)} ${f1(WALK - Math.abs(Math.cos(ph)) * 1.2)}) scale(${dir} 1)`);
    const [lL, lR, aL, aR] = w.legs;
    lL.setAttribute('d', `M-2 -18 L${f1(-2 + sw)} 0`); lR.setAttribute('d', `M2 -18 L${f1(2 - sw)} 0`);
    aL.setAttribute('d', `M-5 -35 L${f1(-5 - a)} -20`); aR.setAttribute('d', `M5 -35 L${f1(5 + a)} -20`);
    if (w.dog) {
      w.dog.querySelector('.dl').setAttribute('d', `M-6 -9 L${f1(-6 + sw * .8)} 0 M6 -9 L${f1(6 - sw * .8)} 0`);
      w.dog.querySelector('.tail').setAttribute('transform', `rotate(${f1(Math.sin(T * 12) * 18)} -10 -14)`);
    }
  });

  // 車輛
  traffic.forEach(c => {
    c.boost = Math.max(0, (c.boost || 0) - dt);
    c.x += c.v * c.dir * dt * (1 + (c.boost || 0) * .8);
    if (c.dir > 0 && c.x > 1800) c.x = -rand(200, 700);
    if (c.dir < 0 && c.x < -200) c.x = 1800 + rand(200, 900);
    c.g.setAttribute('transform', `translate(${f1(c.x)} ${f1(c.y + (c.bike ? 0 : Math.sin(T * 8 + c.x * .05) * .5))}) scale(${c.dir} 1)`);
    const ang = (c.x / 9) * 57.3 * c.dir;
    c.g.querySelectorAll('.spin').forEach(s => s.setAttribute('transform', `rotate(${f1(ang)})`));
    const bm = c.g.querySelector('.beam'); if (bm) bm.setAttribute('opacity', f1(smooth(.4, .7, nightAmt) * .9));
    if (c.bike) {
      const p = c.x / 9 * c.dir;
      c.g.querySelector('.pedal').setAttribute('d', `M4 -22 L${f1(Math.cos(p) * 6)} ${f1(-4 + Math.sin(p) * 6)} M4 -22 L${f1(-Math.cos(p) * 6)} ${f1(-4 - Math.sin(p) * 6)}`);
    }
    const dh = c.g.querySelector('.dogHead'); if (dh) dh.setAttribute('transform', `translate(0 ${f1(Math.sin(T * 5) * 1.2)})`);
  });

  // 教堂鐘擺動
  bellSwing.v += (-bellSwing.a * 30 - bellSwing.v * 2.2) * dt;
  bellSwing.a += bellSwing.v * dt;
  bell.setAttribute('transform', `translate(640 362) rotate(${f1(bellSwing.a)} 0 -4)`);

  // 釣客：收竿動作
  if (fishing.t > 0) {
    fishing.t -= dt;
    const k = 1 - fishing.t / 2.2;
    const lift = Math.sin(Math.min(1, k * 2) * Math.PI / 2);
    fisher.querySelector('.rod').setAttribute('d', `M14 -30 Q${f1(40 - lift * 6)} ${f1(-70 - lift * 20)} ${f1(68 - lift * 24)} ${f1(-60 - lift * 40)}`);
    fisher.querySelector('.line').setAttribute('d', `M${f1(68 - lift * 24)} ${f1(-60 - lift * 40)} L${f1(72 - lift * 10)} ${f1(20 - lift * 60)}`);
    fisher.querySelector('.catch').setAttribute('opacity', fishing.got && k > .3 ? 1 : 0);
    fisher.querySelector('.catch').setAttribute('transform', `translate(${f1(-lift * 4)} ${f1(-lift * 40)}) rotate(${f1(Math.sin(T * 16) * 12)} 72 -8)`);
    if (fishing.t <= 0) {
      fisher.querySelector('.rod').setAttribute('d', 'M14 -30 Q40 -70 68 -60');
      fisher.querySelector('.line').setAttribute('d', 'M68 -60 L72 20');
      fisher.querySelector('.catch').setAttribute('opacity', 0);
    }
  }

  // 泡泡
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i]; b.t += dt;
    const k = Math.min(1, b.t / .25);
    b.g.setAttribute('transform', `translate(${b.x} ${f1(b.y - (reduced ? 0 : (1 - k) * 14))})`);
    b.g.setAttribute('opacity', f1(Math.min(k, Math.max(0, (b.dur - b.t) / .3))));
    if (b.t > b.dur) { b.g.remove(); bubbles.splice(i, 1); }
  }
}
const fishes = [], flock = [], meteors = [];
const bellSwing = { a: 0, v: 0 };
const fishing = { t: 0, got: false };

let last = 0, rafId = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  step(dt);
  rafId = requestAnimationFrame(loop);
}
/* 減少動態：停在一個畫面，只在互動時更新 */
function renderStill() { step(0.0001); }
function start() {
  cancelAnimationFrame(rafId);
  if (reduced) { auto = false; syncAuto(); renderStill(); }
  else { last = performance.now(); rafId = requestAnimationFrame(loop); }
}

/* ---------------- 開始：依序畫出場景、角色 ---------------- */
drawSky();
drawMountains();
drawLake();
drawLand();
drawJetty();
drawChurch();
drawTrees();
drawFence();
drawSheep();
drawPukeko();
drawStargazers();
drawLakeLife();
drawTown();
drawLamps();
drawWalkers();
drawTraffic();
drawFernBank();
drawLupins();
// 太陽光芒
let rays = ''; for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; rays += `M${f1(Math.cos(a) * 32)} ${f1(Math.sin(a) * 32)} L${f1(Math.cos(a) * 42)} ${f1(Math.sin(a) * 42)}`; }
el('path', { d: rays }, $('sunRays'));

/* ---------------- ⑤ 互動 ---------------- */
function onAct(node, fn) {
  node.addEventListener('click', e => { e.stopPropagation(); fn(e); if (reduced) renderStill(); });
  node.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(e); if (reduced) renderStill(); } });
}
function svgPoint(e) {
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
// 羊：跳起來咩一聲
function baa(s) {
  s.jump = .6;
  say(s.x, s.y - 34 * s.s, ['咩～', '咩咩！', 'Baa～'][Math.floor(rand(0, 3))]);
  if (reduced) renderStill();
}
// 湖面：漣漪，偶爾鱒魚躍出
onAct($('lakeHit'), e => {
  const p = e.clientX !== undefined && e.type === 'click' ? svgPoint(e) : { x: 800, y: 400 };
  addRipple(p.x, p.y, 1); setTimeout(() => addRipple(p.x, p.y, .6), 200);
  if (Math.random() < .55 && !reduced) {
    const f = el('path', { class: 'paper ink', d: 'M-10 0 q10 -8 20 0 q-10 8 -20 0z M10 0 l6 -5 v10z' }, $('fishJump'));
    fishes.push({ el: f, x: p.x, y: p.y, t: 0, dir: Math.random() < .5 ? 1 : -1 });
    addRipple(p.x, p.y, .8);
  }
  // 附近的鴨子會潛水
  ducks.forEach(d => { if (Math.abs(d.x - p.x) < 80 && Math.abs(d.y - p.y) < 40) d.dive = 1.9; });
});
ducks.forEach(d => onAct(d.g, () => { d.dive = 1.9; say(d.x, d.y - 16, '呱！', 1.2); addRipple(d.x, d.y, .7); }));
// 蒸汽船：鳴笛冒煙
onAct($('steamer'), () => {
  steamer.horn = 2;
  say(steamer.x, 310, '嗚——嗚！', 1.8);
  for (let i = 0; i < 8; i++) emitSmoke(steamer.x, 326, 1);
});
// 教堂：敲鐘
onAct($('church'), () => {
  bellSwing.v += 160;
  say(640, 330, '噹～噹～', 1.8);
});
// 釣客：收竿
onAct(fisher, () => {
  if (fishing.t > 0) return;
  fishing.t = 2.2; fishing.got = Math.random() < .6;
  setTimeout(() => say(982, 340, fishing.got ? '釣到了！' : '跑掉了…', 1.6), 500);
  addRipple(1027, 402, .8);
});
// 紫水雞：拍翅逃跑
onAct($('pukeko'), () => { puk.run = 1.4; puk.dir *= -1; say(puk.x, shoreY(puk.x) - 14, '咕咕！', 1.2); });
// 露營車：按喇叭加速
onAct(traffic[0].g, () => { traffic[0].boost = 2; say(traffic[0].x + 10, LANE_A - 76, '叭叭！', 1.4); });
// 水上小飛機：搖搖機翼
onAct($('plane'), () => { plane.wob = 1.5; plane.v = -150; say(plane.x, plane.y - 22, '嗡～', 1.2); });
// 魯冰花：花瓣隨風飛散
$('lupins').addEventListener('click', e => {
  e.stopPropagation();
  const p = svgPoint(e);
  lupins.forEach(l => {
    const d = Math.abs(l.x - p.x);
    if (d < 70 && l.y > 560) {
      l.kick = 10 * (1 - d / 70);
      if (!reduced) for (let i = 0; i < 2; i++) emitPetal(l.x, l.y - l.h * rand(.5, 1), l.col);
    }
  });
});
// 天空：白天飛過一群鳥、夜裡劃過流星＋極光增強
svg.addEventListener('click', e => {
  const p = svgPoint(e);
  if (p.y > 320) return;
  if (nightAmt > .5) {
    auroraBoost = 1;
    if (!reduced) for (let i = 0; i < 2; i++) {
      const m = el('line', { stroke: 'url(#meteorGrad)', 'stroke-width': 2, 'stroke-linecap': 'round' }, $('meteors'));
      meteors.push({ el: m, x: p.x - 120 + i * 90, y: p.y - 60 + i * 30, t: -i * .35 });
    }
    say(p.x, p.y, '許個願吧', 1.6);
  } else if (!reduced) {
    const dir = p.x < 800 ? 1 : -1;
    for (let i = 0; i < 7; i++) {
      const b = el('path', { class: 'thin' }, $('flock'));
      flock.push({ el: b, x: p.x - dir * (i * 18 + rand(0, 10)), y: p.y + (i % 2 ? 10 : -6) * Math.ceil(i / 2), vx: dir * rand(90, 120), ph: rand(0, 6) });
    }
  }
  if (reduced) renderStill();
});
// 滑鼠視差
svg.addEventListener('pointermove', e => { const r = svg.getBoundingClientRect(); mx = ((e.clientX - r.left) / r.width - .5) * 2; });
svg.addEventListener('pointerleave', () => { mx = 0; });

// 控制列
function syncAuto() { $('btnAuto').setAttribute('aria-pressed', String(auto)); $('btnAuto').textContent = auto ? '自動播放中' : '自動播放'; }
function goTo(t) {
  if (reduced) { tod = t; target = null; renderStill(); } else target = t;
}
$('btnDay').addEventListener('click', () => goTo(0.45));
$('btnNight').addEventListener('click', () => goTo(0.95));
$('btnAuto').addEventListener('click', () => { auto = !auto; target = null; syncAuto(); });
// 吹一陣風：雲、旗子、樹與魯冰花一起被吹動，花瓣飛散
$('btnGust').addEventListener('click', () => {
  gust = 1;
  lupins.forEach(l => { l.kick = rand(4, 9); });
  if (reduced) renderStill();
});
// 天氣：晴天 → 下雨 → 下雪 → 晴天 輪流切換
for (let i = 0; i < 220; i++) wxDrops.push({ snow: false, el: el('line', { x1: 0, y1: 0, x2: 0, y2: rand(14, 24), style: 'stroke:var(--rain);stroke-width:1.6;stroke-linecap:round', opacity: 0 }, $('wx')), x: rand(-100, 1700), y: rand(-20, 600), v: rand(520, 700), op: rand(.5, .9), ph: 0 });
for (let i = 0; i < 110; i++) wxDrops.push({ snow: true, el: el('circle', { r: f1(rand(1.4, 3.2)), style: 'fill:var(--flake);stroke:var(--ink);stroke-width:.4', opacity: 0 }, $('wx')), x: rand(-100, 1700), y: rand(-20, 600), v: rand(26, 55), op: rand(.7, 1), ph: rand(0, 6) });
$('btnWeather').addEventListener('click', () => {
  weather = (weather + 1) % WEATHER.length;
  const w = WEATHER[weather];
  $('btnWeather').textContent = `${w.icon} 天氣：${w.name}`;
  say(800, 140, ['放晴了！', '下雨囉，帶把傘', '下雪了！'][weather], 1.6);
  if (reduced) renderStill();
});
// 流星雨：白天會先轉成夜晚，再連續落下流星、極光變亮
$('btnMeteor').addEventListener('click', () => {
  if (nightAmt < .5) { auto = false; syncAuto(); goTo(0.95); }
  meteorRain = reduced ? 0 : 7;
  auroraBoost = 1;
  say(800, 120, '一起許願吧', 1.8);
  if (reduced) renderStill();
});
$('timeRange').addEventListener('input', e => {
  tod = e.target.value / 1000; target = null;
  if (reduced) renderStill();
});
mq.addEventListener?.('change', e => { reduced = e.matches; if (!reduced) { auto = true; syncAuto(); } start(); });

syncAuto();
start();
})();
</script>
