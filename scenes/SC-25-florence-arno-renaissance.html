<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>佛羅倫斯阿諾河畔旗手慶典</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-25 佛羅倫斯阿諾河畔旗手慶典｜文藝復興濕壁畫／蛋彩畫風
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   風格重點：礦物顏料色（青金石藍、土綠、赭黃、朱紅、熟赭）、
            線性透視（老橋斜向退入遠方）、遠山「空氣透視」與暈塗法、
            金箔（燈籠金球、夜空金星、畫框金線）、灰泥牆面的斑駁與細裂紋、
            人物以深褐色輪廓線勾邊。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），
   部分另有 --k-名稱（晨昏）。JS 會依時間內插，輸出成 --名稱，
   並自動產生 .f-名稱（填色）、.s-名稱（描邊）兩個 class。
   ========================================================= */
:root{
  color-scheme: dark;

  /* —— 礦物顏料（不隨日夜變化） —— */
  --lapis:#2f4f9a;        /* 青金石藍：衣袍、旗幟 */
  --vermilion:#c8452c;    /* 朱紅 */
  --verde:#5f8a55;        /* 土綠 */
  --ochre:#d29a3c;        /* 赭黃 */
  --sienna:#8a4a2a;       /* 熟赭 */
  --rose:#d98a8a;         /* 玫瑰粉 */
  --cream:#f3ead2;        /* 灰泥白 */
  --sepia:#3a2a20;        /* 深褐輪廓線 */
  --umber:#5a3e2a;
  --gold:#d4a63a;         /* 金箔 */
  --gold-hi:#f6e2a0;
  --gold-dk:#9a6f1e;
  --sinopia:#8b3a24;      /* 畫框：濕壁畫底稿用的紅土色 */
  --sinopia-dk:#5a2516;

  /* —— 天空：青金石漸層 —— */
  --d-sky-1:#3f6fae; --k-sky-1:#4a4f8a; --n-sky-1:#0c1838;
  --d-sky-2:#7ea4c9; --k-sky-2:#c88a7a; --n-sky-2:#142757;
  --d-sky-3:#e6dcc0; --k-sky-3:#f2b36a; --n-sky-3:#263561;
  --d-cloud:#f6efdc;  --k-cloud:#f7caa0; --n-cloud:#2b3a66;
  --d-cloud-sh:#c9c3b4; --k-cloud-sh:#c98a7a; --n-cloud-sh:#1b2850;
  --d-ray:#fff4cf;    --n-ray:#f0c96a;     /* 金色光芒 */

  /* —— 遠山（菲耶索萊丘陵）與絲柏 —— */
  --d-hill-1:#a7b8bd; --k-hill-1:#b49aa6; --n-hill-1:#1d2a4c;
  --d-hill-2:#8fa08a; --k-hill-2:#9a8a80; --n-hill-2:#18263c;
  --d-hill-3:#7a8f6c; --n-hill-3:#142232;
  --d-cypress:#3d5236; --n-cypress:#0d1a18;
  --d-villa:#efe3c4;  --n-villa:#4a4560;

  /* —— 城市：赤陶屋頂與灰泥牆 —— */
  --d-roof:#c0653c;   --n-roof:#4a2a2c;
  --d-roof-sh:#97492c; --n-roof-sh:#331c22;
  --d-wall-1:#e2c48e; --n-wall-1:#3d3550;   /* 赭黃 */
  --d-wall-2:#efe0bf; --n-wall-2:#45405a;   /* 灰泥白 */
  --d-wall-3:#d9a184; --n-wall-3:#43334a;   /* 玫瑰 */
  --d-wall-4:#e6b66a; --n-wall-4:#423750;   /* 橙黃 */
  --d-wall-sh:#b99a6a; --n-wall-sh:#2a2638;
  --d-shutter:#5f7a4e; --n-shutter:#1e2a26; /* 綠色百葉窗 */
  --d-win:#4a3a30;    --n-win:#ffcf72;      /* 窗：夜晚亮燈 */

  /* —— 地標：舊宮（褐色粗石）、大理石、穹頂赤陶瓦（夜晚打上暖光） —— */
  --d-pf:#b88b5a;     --n-pf:#8a5f3e;
  --d-pf-sh:#94683f;  --n-pf-sh:#5a3a28;
  --d-marble:#f1ead8; --n-marble:#e0c79a;
  --d-marble-sh:#cfc6ae; --n-marble-sh:#a88a62;
  --d-mgreen:#4f7a5e; --n-mgreen:#3a5244;   /* 普拉托綠大理石 */
  --d-mpink:#d9a39a;  --n-mpink:#b8786a;    /* 粉紅大理石 */
  --d-tile:#c96a3e;   --n-tile:#b4593a;     /* 穹頂瓦 */
  --d-tile-sh:#9d4a2a; --n-tile-sh:#7a3424;
  --d-tile-line:#a85432; --n-tile-line:#8e4029;
  --d-clock:#f3ead2;  --n-clock:#ffe7a8;

  /* —— 老橋：懸挑的金匠小店、瓦薩里長廊 —— */
  --d-shop-1:#e0a14e; --n-shop-1:#5a3a34;
  --d-shop-2:#cf7a45; --n-shop-2:#4e3036;
  --d-shop-3:#ecc874; --n-shop-3:#5c4a3e;
  --d-shop-4:#d98e6a; --n-shop-4:#553440;
  --d-bracket:#6a4a32; --n-bracket:#1e1620;
  --d-bridge:#c8a36e; --n-bridge:#4a3c44;   /* 橋身石材 */
  --d-bridge-sh:#9c7a4c; --n-bridge-sh:#2e2632;
  --d-corr:#e4bf7c;   --n-corr:#4c4048;      /* 長廊 */

  /* —— 阿諾河 —— */
  --d-river-1:#7d9474; --k-river-1:#9a8a7e; --n-river-1:#0f1c30;
  --d-river-2:#8fa27e; --k-river-2:#c49a76; --n-river-2:#16263f;
  --d-river-3:#5d7559; --n-river-3:#0b1526;
  --d-river-hi:#e9e2c4; --n-river-hi:#e2b45a;
  --d-refl:#c9a774;   --n-refl:#f2b75a;

  /* —— 近岸：灰石欄杆、人行道、河濱路、懸鈴木 —— */
  --d-parapet:#b2ad9c; --n-parapet:#3b3a4c;
  --d-parapet-sh:#8d8878; --n-parapet-sh:#26263a;
  --d-pave:#d3c4a2;   --n-pave:#2f2c40;
  --d-pave-line:#b9a986; --n-pave-line:#24223a;
  --d-road:#6e665a;   --n-road:#1b1a26;
  --d-road-line:#e9dfc4; --n-road-line:#6e6650;
  --d-tree-1:#4a6a3a; --n-tree-1:#10241c;
  --d-tree-2:#6a8a48; --n-tree-2:#173024;
  --d-tree-3:#8fa85e; --n-tree-3:#20402c;
  --d-bark:#9a8a6a;   --n-bark:#2e2a36;
  --d-iron:#2e2a26;   --n-iron:#0f0e14;
  --d-shadow:#3a2a2026; --n-shadow:#00000070;
  --d-car-win:#3c4a54; --n-car-win:#f2c46a;

  /* —— 光源 —— */
  --sun:#fff3cc; --sun-ring:#ffd98a;
  --moon:#fff1d0;
  --lamp:#ffd27a;

  /* —— 煙火（聖約翰節） —— */
  --fw-1:#ff6a4a; --fw-2:#ffd25a; --fw-3:#8fe0ff; --fw-4:#fff6dc; --fw-5:#ff9fd8;

  /* —— 天氣 —— */
  --d-fog:#ece6d6;  --n-fog:#4a5578;
  --d-rainc:#5a6e80; --n-rainc:#a6b6d6;
  --wx-cloud:#7d8a92; --wx-fog:#e8e2d2; --wx-rain:#3a4a62; --wx-snow:#e8eef2;

  /* —— 人物 —— */
  --skin-1:#f2d0aa; --skin-2:#dcaa80; --skin-3:#b07a50; --skin-4:#74503a;
  --hair-1:#2a2024; --hair-2:#6a4228; --hair-3:#c89a50; --hair-4:#b8b2a8;
  --cloth-1:#2f4f9a;  /* 青金石藍 */
  --cloth-2:#c8452c;  /* 朱紅 */
  --cloth-3:#5f8a55;  /* 土綠 */
  --cloth-4:#d29a3c;  /* 赭黃 */
  --cloth-5:#8a4a6a;  /* 紫紅 */
  --cloth-6:#e9e0c8;  /* 亞麻白 */
  --pants-1:#3a3440; --pants-2:#6a5a48;
  --umb-1:#2f4f9a; --umb-2:#c8452c; --umb-3:#d29a3c; --umb-4:#5f8a55;
  /* 旗手隊四色：歷史上佛羅倫斯的四個城區 */
  --q-blue:#2f5aa8; --q-red:#c8352a; --q-green:#3f8a4a; --q-white:#f3ecd8;

  /* —— 頁面介面 —— */
  --page-bg:#1e1712; --page-fg:#f3ead2; --page-muted:#bba98a;
  --ui-surface:#2a211a; --ui-line:#4a3a2c; --ui-accent:#d4a63a;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border:1px solid var(--ui-line);border-radius:10px;overflow:hidden;background:var(--sinopia);line-height:0}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:10px;padding:10px 14px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--page-bg);font-weight:700}
.panel button.big{border-color:var(--vermilion);color:#fff;background:var(--vermilion);font-weight:700}
.panel button.big.on,.panel button.on{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--page-bg)}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
/* 畫面內可點物件：滑鼠點不顯示外框，用鍵盤 Tab 時才顯示 */
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid var(--ui-accent);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable,#scene [role="button"]{cursor:pointer}
#scene .bubble rect{fill:var(--cream);stroke:var(--sepia);stroke-width:1.6}
#scene .bubble text{fill:var(--sepia);font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
/* 對話泡泡：定位用外層 g 的 transform 屬性，淡入淡出只動內層的 opacity */
#scene .bubble .pop{animation:pop var(--dur,1.6s) ease-out forwards}
@keyframes pop{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  #scene .bubble .pop{animation:none}
}
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：天空 → 煙火 → 遠山 → 鐘樓、穹頂、舊宮、聖十字 → 對岸房屋
       → 阿諾河 → 橋後的船 → 老橋 → 橋前的船 → 近岸欄杆與人行道 → 旗手隊與車輛
       → 天氣 → 灰泥質感 → 畫框
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="文藝復興濕壁畫風格的佛羅倫斯河岸動畫：青金石藍的天空下，遠方是有絲柏與別墅的丘陵；城市赤陶屋頂之上，聖母百花大教堂的紅色大穹頂居中高聳，頂端白色燈籠亭與金球閃耀，左邊是白綠粉三色大理石的喬托鐘樓和舊宮的雉堞高塔；左側的老橋斜斜跨過阿諾河，橋上掛滿彩色的懸挑小店，頂上是瓦薩里長廊；河上有划船隊的賽艇與撐篙的平底木船；近岸人行道上有畫家、冰淇淋推車、吉他手與行人，河濱路上有偉士牌機車、白色計程車、馬車與自行車">
    <defs>
      <!-- 金箔漸層 -->
      <linearGradient id="goldLeaf" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f6e2a0"/><stop offset=".45" stop-color="#d4a63a"/><stop offset=".7" stop-color="#9a6f1e"/><stop offset="1" stop-color="#f0d68a"/>
      </linearGradient>
      <!-- 天空：青金石三段漸層（色票由 JS 控制） -->
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-1)"/><stop offset=".55" style="stop-color:var(--sky-2)"/><stop offset="1" style="stop-color:var(--sky-3)"/>
      </linearGradient>
      <!-- 穹頂的明暗（光從左上來：蛋彩畫的柔和塑形） -->
      <linearGradient id="domeShade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#3a1a10" stop-opacity=".32"/>
      </linearGradient>
      <!-- 金色光芒：越遠越淡 -->
      <radialGradient id="rayGrad" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="620">
        <stop offset="0" style="stop-color:var(--ray)" stop-opacity="1"/><stop offset=".35" style="stop-color:var(--ray)" stop-opacity=".55"/><stop offset="1" style="stop-color:var(--ray)" stop-opacity="0"/>
      </radialGradient>
      <!-- 暈塗：柔邊模糊，用在遠山與霧 -->
      <filter id="sfumato" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
      <!-- 灰泥質感：由程式用 canvas 產生後填入 href -->
      <pattern id="plasterPat" width="256" height="256" patternUnits="userSpaceOnUse">
        <image id="plasterImg" width="256" height="256" href=""/>
      </pattern>
      <!-- 人行道石板 -->
      <pattern id="paving" width="40" height="16" patternUnits="userSpaceOnUse">
        <path d="M0 .5H40M.5 0V8M20.5 8V16M0 8.5H40" class="s-pave-line" stroke-width="1.2"/>
      </pattern>
      <!-- 穹頂瓦片紋（一排排細弧） -->
      <pattern id="tiles" width="10" height="7" patternUnits="userSpaceOnUse">
        <path d="M0 6.5 Q5 3 10 6.5" class="s-tile-line" stroke-width="1"/>
      </pattern>
      <!-- 粗石砌（舊宮） -->
      <pattern id="ashlar" width="16" height="9" patternUnits="userSpaceOnUse">
        <path d="M0 .5H16M.5 0V4.5M8.5 4.5V9M0 4.5H16" class="s-pf-sh" stroke-width="1"/>
      </pattern>
      <clipPath id="frameClip"><rect x="0" y="0" width="1600" height="600"/></clipPath>
    </defs>

    <g clip-path="url(#frameClip)">
    <!-- ===== 場景：天空 ===== -->
    <rect x="0" y="0" width="1600" height="420" fill="url(#skyGrad)"/>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);
      }
      return _conn.call(this, dest, ...a);
    };
  }
  function stopAudio() {
    let longs = [], ctx = null;
    for (const s of srcs) {
      const c = s.context, now = c.currentTime, m = s.__ss; ctx = c;
      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }
    if (longs.length && ctx) {
      const g = outs.get(ctx), now = ctx.currentTime;
      if (g) {
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 1.1); g.gain.setValueAtTime(0, now + 1.2);
        g.gain.linearRampToValueAtTime(1, now + 1.9);
      }
      longs.forEach(s => { try { s.stop(now + 1.15); } catch (e) {} srcs.delete(s); });
    }
    srcs.clear();
  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');
    // 凍結色票：把目前的 CSS 變數抄到殘影上，底下換色不影響殘影
    const cs = getComputedStyle(svg);
    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }
      }
    }
    const par = svg.parentElement;
    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });
    added = [];
  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>
/* =========================================================
   SC-25 佛羅倫斯阿諾河畔旗手慶典｜程式區
   區塊：①工具與色票 ②場景（天空、遠山、穹頂、鐘樓、舊宮、聖十字、
         對岸房屋、阿諾河、老橋、近岸）③角色（船、鴨、行人、攤販、車輛、旗手隊）
         ④動畫（日夜、天氣、旗手表演、煙火、環境）⑤互動（點擊、滑鼠、聲音、控制列）
   ========================================================= */
(() => {
'use strict';

/* ---------------- ① 工具與色票 ---------------- */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const root = document.documentElement;
const svg = $('scene');
const HORIZON = 398;        // 對岸河堤線＝河面頂
const RIVER_B = 494;        // 近岸欄杆頂
const LANE_FAR = 570;       // 河濱路遠車道（往左開）
const LANE_NEAR = 592;      // 河濱路近車道（往右開；義大利靠右行駛）
const DX = 1180;            // 穹頂中心 x
const CX_C = 960;           // 喬托鐘樓中心 x
const PX = 714;             // 舊宮鐘塔中心 x
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function makePlaster() {
  try {
    const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
    const x = c.getContext('2d');
    x.fillStyle = '#ffffff'; x.fillRect(0, 0, S, S);
    for (let i = 0; i < 60; i++) {
      const px = Math.random() * S, py = Math.random() * S, r = 10 + Math.random() * 46;
      const g = x.createRadialGradient(px, py, 0, px, py, r);
      const dark = Math.random() < .6;
      g.addColorStop(0, dark ? 'rgba(170,140,100,.11)' : 'rgba(255,250,235,.0)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = g;
      for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]) { x.save(); x.translate(ox, oy); x.beginPath(); x.arc(px, py, r, 0, 7); x.fill(); x.restore(); }
    }
    const img = x.getImageData(0, 0, S, S), d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const r = Math.random();
      if (r < .1) { const k = 200 + Math.random() * 40; d[i] = Math.min(d[i], k); d[i + 1] = Math.min(d[i + 1], k - 14); d[i + 2] = Math.min(d[i + 2], k - 34); }
    }
    x.putImageData(img, 0, 0);
    $('plasterImg').setAttribute('href', c.toDataURL('image/png'));
  } catch (e) {}
}

/* ---------------- ② 場景：老橋（斜向退入遠方的線性透視） ----------------
   P(L, h)：L 是沿橋身的位置（0＝近端，1＝遠端），h 是離水面的高度。
   近端大、遠端小，L 越往遠處越壓縮，這就是文藝復興畫家愛用的透視法。 */
const BRG = { x0: -80, x1: 612, y0: 508, y1: 398, s0: 1.3, s1: .42, a: 1.6 };
const bq = L => L * (1 + BRG.a) / (1 + BRG.a * L);
function P(L, h) {
  const q = bq(L), s = lerp(BRG.s0, BRG.s1, q);
  return [lerp(BRG.x0, BRG.x1, q), lerp(BRG.y0, BRG.y1, q) - h * s];
}
const pts = list => list.map(([L, h], i) => { const [x, y] = P(L, h); return (i ? 'L' : 'M') + f1(x) + ' ' + f1(y); }).join(' ') + ' Z';
const quad = (L0, L1, h0, h1) => pts([[L0, h0], [L1, h0], [L1, h1], [L0, h1]]);
// 河面某一條航道（y）與橋身水線的交會 x：船在這之左就是在橋後方
const crossX = y => lerp(BRG.x0, BRG.x1, (BRG.y0 - y) / (BRG.y0 - BRG.y1));
const ARCH = [[.07, .32], [.38, .62], [.68, .93]];
function archPts(a, b, sign = 1) {
  const arr = [];
  for (let i = 0; i <= 16; i++) { const t = i / 16, L = lerp(a, b, t); arr.push([L, sign * (6 + 28 * Math.sin(Math.PI * t))]); }
  return arr;
}

  // 馬腿的旋轉中心要在每條腿的上端

    v.el.querySelectorAll('.hl1, .hl2').forEach((e, i) => { const px0 = [100, 106, 120, 125][i] ?? 110; const s = (e.classList.contains('hl1') ? 1 : -1) * Math.sin(v.ph) * 22; e.setAttribute('transform', `rotate(${f1(s)} ${px0} -30)`); });
  });

  // —— 行人：走路、跟前面的人保持距離、表演時停下來看 ——
  walkers.forEach(w => {
    const still = w.look || w.stop > 0;
    if (w.stop > 0) w.stop -= dt;
    let sp = still ? 0 : w.sp;
    if (!still) {
      const need = 26 + (w.type === 'stroller' || w.type === 'dog' ? 34 : 0);
      walkers.forEach(o => {
        if (o === w || o.lane !== w.lane) return;
        const d = (o.x - w.x) * w.dir;
        if (d > 0 && d < need + 10) sp = Math.min(sp, (o.cur ?? 0) * clamp((d - need * .8) / 12, 0, 1));
      });
    }
    w.cur = sp;
    w.x += w.dir * sp * dt; w.ph += dt * sp * .2;
    if (w.x > 1660 || w.x < -60) {
      w.x = w.dir > 0 ? -60 : 1660;
      walkers.forEach(o => { if (o !== w && o.lane === w.lane && Math.abs(o.x - w.x) < 70) w.x -= w.dir * 80; });
    }
    const sw = sp > 0 ? Math.sin(w.ph) * 22 : 0;
    w.l1.setAttribute('transform', `rotate(${f1(sw)} 0 -20)`); w.l2.setAttribute('transform', `rotate(${f1(-sw)} 0 -20)`);
    const bob = sp > 0 ? Math.abs(Math.sin(w.ph)) * -1.4 : 0;
    w.el.setAttribute('transform', `translate(${f1(w.x)} ${f1(w.y + bob)}) scale(${f1(w.dir * w.s)} ${f1(w.s)})`);
    if (w.up) { const up = !!w.look && !umbOpen; w.up.style.display = up ? '' : 'none'; if (w.dn) w.dn.style.display = up ? 'none' : ''; }
  });

  // —— 欄杆上的鴿子 ——
  pigeons.forEach(p => {
    if (!p.fly) {
      p.el.querySelector('.bh').setAttribute('transform', Math.sin(clock * 3 + p.ph) > .7 ? 'translate(2 3)' : '');
      p.el.setAttribute('transform', `translate(${f1(p.hx + Math.sin(clock * .3 + p.ph) * 5)} ${p.hy}) scale(${p.dir} 1)`);
      return;
    }
    p.fly += dt;
    const wg = p.el.querySelector('.wg');
    if (p.fly < 3) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 20 * dt; wg.setAttribute('d', Math.sin(clock * 30 + p.ph) > 0 ? 'M-3 -6 Q0 -18 5 -16' : 'M-3 -6 Q0 2 5 0'); }
    else if (p.fly < 6) p.el.style.display = 'none';
    else if (p.fly < 8) { p.el.style.display = ''; const k = smooth(6, 8, p.fly); p.x = p.hx + p.vx * 1.2 * (1 - k); p.y = p.hy - 160 * (1 - k); wg.setAttribute('d', Math.sin(clock * 22 + p.ph) > 0 ? 'M-3 -6 Q0 -18 5 -16' : 'M-3 -6 Q0 2 5 0'); }
    else { p.fly = 0; p.y = p.hy; wg.setAttribute('d', 'M-3 -6 Q1 -8 4 -5'); }
    p.el.setAttribute('transform', `translate(${f1(p.x)} ${f1(p.y)}) scale(${p.vx > 0 ? 1 : -1} 1)`);
  });
  trees.forEach(t => t.crown.setAttribute('transform', `rotate(${f1(Math.sin(clock * .9 + t.ph) * .8 * wind)} ${t.x} ${t.y})`));

  // —— 畫家、冰淇淋、吉他手 ——
  if (brushT > 0) { brushT -= dt; painter.querySelector('.brushArm').setAttribute('transform', `rotate(${f1(Math.sin(clock * 14) * 10)} -5 -38)`); }
  else painter.querySelector('.brushArm').removeAttribute('transform');
  if (scoopT > 0) { scoopT -= dt; gelato.querySelector('.cone').style.display = ''; } else gelato.querySelector('.cone').style.display = 'none';
  if (strumT > 0) {
    strumT -= dt;
    guitarist.querySelector('.strum').setAttribute('transform', `rotate(${f1(Math.sin(clock * 16) * 14)} 3 -38)`);
    if (Math.random() < dt * 2.4) { const n = el('text', { x: 1206, y: 470, style: 'font:700 18px serif;fill:var(--sepia)' }, $('notes')); n.textContent = pick(['♪', '♫', '♩']); notes.push({ el: n, t: 0, x: 1200 + rand(-6, 10), vx: rand(-14, 14) }); }
  } else guitarist.querySelector('.strum').removeAttribute('transform');
  for (let i = notes.length - 1; i >= 0; i--) {
    const n = notes[i]; n.t += dt; n.x += n.vx * dt;
    n.el.setAttribute('x', f1(n.x)); n.el.setAttribute('y', f1(470 - n.t * 34)); n.el.setAttribute('opacity', f1(Math.max(0, 1 - n.t / 2)));
    if (n.t > 2) { n.el.remove(); notes.splice(i, 1); }
  }

  // —— 雨、雪、水花 ——
  if (wx.rain > .01) {
    rainDrops.forEach(r => {
      r.y += r.sp * dt; r.x -= r.sp * .2 * dt;
      if (r.y > 610) { r.y = rand(-60, -10); r.x = rand(-50, 1750); }
      r.el.setAttribute('x1', f1(r.x)); r.el.setAttribute('y1', f1(r.y)); r.el.setAttribute('x2', f1(r.x - 4)); r.el.setAttribute('y2', f1(r.y + 18));
    });
    if (Math.random() < dt * 30 * wx.rain) {
      const y = Math.random() < .55 ? rand(404, 490) : rand(516, 600);
      splashes.push({ el: el('ellipse', { cx: f1(rand(20, 1580)), cy: f1(y), rx: 1, ry: .5, class: 's-rainc', 'stroke-width': 1.1 }, $('splashes')), t: 0 });
    }
  }
  for (let i = splashes.length - 1; i >= 0; i--) {
    const s = splashes[i]; s.t += dt;
    s.el.setAttribute('rx', f1(1 + s.t * 22)); s.el.setAttribute('ry', f1(.5 + s.t * 5)); s.el.setAttribute('opacity', f1(Math.max(0, 1 - s.t * 2.5)));
    if (s.t > .4) { s.el.remove(); splashes.splice(i, 1); }
  }
  if (wx.snow > .01) flakes.forEach(f => {
    f.y += f.sp * dt; if (f.y > 606) { f.y = -8; f.x = rand(0, 1600); }
    f.el.setAttribute('cx', f1(f.x + Math.sin(clock * .8 + f.ph) * f.sw)); f.el.setAttribute('cy', f1(f.y));
  });

  // —— 煙火 ——
  if (fwPending && night > .75) { fwPending = false; fireShow(10); }
  if (fw.on && clock > fw.until && !rockets.length) { fw.on = false; $('btnFire').classList.remove('on'); }
  if (fw.on && clock < fw.until && clock > fw.next) { fw.next = clock + rand(.35, .8); launch(rand(500, 1500), rand(50, 210)); if (Math.random() < .35) launch(rand(300, 1300), rand(80, 220)); }
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i]; r.y += r.vy * dt;
    r.line.setAttribute('x1', f1(r.x)); r.line.setAttribute('y1', f1(r.y)); r.line.setAttribute('x2', f1(r.x)); r.line.setAttribute('y2', f1(r.y + 24));
    if (r.y <= r.top) { burst(r.x, r.y, r.single); r.el.remove(); rockets.splice(i, 1); }
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]; s.life -= dt * s.dec;
    s.vx *= 1 - dt * 1.2; s.vy = s.vy * (1 - dt * 1.2) + 60 * dt;
    s.x += s.vx * dt; s.y += s.vy * dt;
    s.el.setAttribute('cx', f1(s.x)); s.el.setAttribute('cy', f1(s.y)); s.el.setAttribute('opacity', f1(Math.max(0, s.life)));
    if (s.life <= 0) { s.el.remove(); sparks.splice(i, 1); }
  }

  // —— 滑鼠視差 ——
  pxCur += (px - pxCur) * Math.min(1, dt * 3);
  $('parFar').setAttribute('transform', `translate(${f1(-pxCur * 8)} 0)`);
  $('parMid').setAttribute('transform', `translate(${f1(-pxCur * 3)} 0)`);
  $('parNear').setAttribute('transform', `translate(${f1(pxCur * 4)} 0)`);
}

/* ---------------- ⑤ 互動：對話泡泡 ---------------- */
function say(x, y, text, dur = 1.6) {
  const g = el('g', { class: 'bubble' }, $('bubbles'));
  const inner = el('g', { class: 'pop', style: `--dur:${dur}s` }, g);
  const t = el('text', { x: 0, y: 0 }, inner);
  t.textContent = text;
  const w = Math.max(44, (t.getComputedTextLength() || text.length * 15) + 24);
  inner.insertBefore(el('rect', { x: f1(-w / 2), y: -15, width: f1(w), height: 30, rx: 4 }), t);
  x = clamp(x, w / 2 + 24, 1600 - w / 2 - 24); y = clamp(y, 36, 566);
  g.setAttribute('transform', `translate(${f1(x)} ${f1(y)})`);
  setTimeout(() => g.remove(), dur * 1000);
}

/* ---------------- 動畫主迴圈 ---------------- */
let last = 0, rafId = 0;
function loop(now) {
  const dt = clamp((now - last) / 1000, 0, .05); last = now;
  step(dt);
  rafId = requestAnimationFrame(loop);
}
// 減少動態：只畫靜止畫面；互動時快轉一小段再停住
function settle(sec) { for (let s = 0; s < sec; s += .05) step(.05); }
function renderStill() { step(.0001); }
function start() {
  cancelAnimationFrame(rafId);
  if (reduced) { T.auto = false; syncAuto(); applyTime(true); settle(1.5); }
  else { last = performance.now(); rafId = requestAnimationFrame(loop); }
}

$('timeRange').addEventListener('input', e => {
  T.t = e.target.value / 1000; T.target = null; T.dragging = true; applyTime(true); T.dragging = false;
  if (reduced) renderStill();
});
mq.addEventListener?.('change', e => { reduced = e.matches; if (!reduced) { T.auto = true; syncAuto(); } start(); });
document.addEventListener('visibilitychange', () => { if (!actx) return; if (document.hidden) actx.suspend(); else if (userGesture) actx.resume(); });

vehicles.forEach(placeV);
applyTime(true);
applyWeather(0);
syncAuto();
start();
// 圖鑑網站「作者精選」播放區（純插畫版嵌在網頁裡）：旗手表演自動輪播，演完（夜晚含煙火）休息幾秒再來一輪
const inPicks = (() => { let top = true; try { top = window.top === window; } catch (e) { top = false; } return !!document.getElementById('pure-art') && !top; })();
if (inPicks && !reduced) { setTimeout(startShow, 1500); setInterval(() => { if (!show.on && !fw.on && clock - lastEnd > 6) startShow(); }, 1000); }
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on ? 'show' : fw.on ? 'fire' : '',
  btn: { show: 'btnShow', fire: 'btnFire' },
  save: () => ({ ...T }),
  stop: () => {
    if (show.on) { clearTimeout(show.timer); endShow(); vehicles.forEach(v => { v.el.style.display = ''; }); }
    if (fw.on) { fw.on = false; fw.until = 0; $('btnFire').classList.remove('on'); }
    fwPending = false;
  },
  restore: s => { Object.assign(T, s); syncAuto(); applyTime(true); renderStill(); }
});
/* /ShowStop */
})();
</script>
<script id="scene-bgm">
/* =========================================================
   【互動】背景配樂（Web Audio 即時合成，原創曲，不使用任何音檔）
   - 控制列「♪ 配樂」按鈕開關；網站「作者精選」播放區會呼叫
     window.sceneMusic.start() / stop()
   - 想換曲子：改下面 SCORE 區塊裡的音符陣列即可
     音符寫法："A4"、"C#5"、"Eb4"；"-" 是休止；數字是長度（幾格）
   ========================================================= */
(function () {
  "use strict";
  // __SceneAudioContext：下載時選了「不要點擊音效」會把場景音效靜音，配樂仍用原本的 AudioContext
  const AC = window.__SceneAudioContext || window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  // 音名 → 頻率
  function hz(n) {
    const m = /^([A-G])([#b]?)(-?\d)$/.exec(n);
    const st = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0);
    return 440 * Math.pow(2, (st + (+m[3] + 1) * 12 - 69) / 12);
  }
  // 旋律陣列 → { 格數: [音名, 長度] }
  function seq(list) {
    const map = {}; let s = 0;
    for (const [n, len] of list) { if (n !== "-") map[s] = [n, len]; s += len; }
    return map;
  }

  let ctx = null, out = null, timer = null, playing = false, nextT = 0, step = 0;

  /* ---------- 樂器 ---------- */
  function env(t, a, d, v) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    g.connect(out); return g;
  }
  function osc(type, f, t, dur, dest, detune) {
    const o = ctx.createOscillator(); o.type = type; o.frequency.value = f;
    if (detune) o.detune.value = detune;
    o.connect(dest); o.start(t); o.stop(t + dur + 0.05); return o;
  }
  let noiseBuf = null;
  function noise() {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const x = noiseBuf.getChannelData(0); for (let i = 0; i < x.length; i++) x[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; return s;
  }
  const I = {
    // 撥弦（吉他、烏德琴）：鋸齒波＋快速關閉的低通濾波
    pluck(f, t, d, v, bright) {
      const lp = ctx.createBiquadFilter(); lp.type = "lowpass";
      lp.frequency.setValueAtTime(bright || 2600, t); lp.frequency.exponentialRampToValueAtTime(350, t + d);
      lp.connect(env(t, 0.004, d, v || 0.1));
      osc("sawtooth", f, t, d, lp); osc("triangle", f * 2, t, d * 0.5, lp);
    },
    // 顫音撥弦：同一個音快速連撥（葡萄牙吉他、卡農琴的招牌）
    tremolo(f, t, d, v, gap) {
      gap = gap || 0.085;
      for (let k = 0; k * gap < d - 0.04; k++) I.pluck(f, t + k * gap, 0.16, (v || 0.07) * (k ? 0.8 : 1.1), 3200);
    },
    // 柔和撥弦（豎琴）
    harp(f, t, d, v) { osc("triangle", f, t, d, env(t, 0.006, d, v || 0.05)); osc("sine", f * 2, t, d * 0.4, env(t, 0.004, d * 0.4, (v || 0.05) * 0.25)); },
    // 長笛／錫口哨：正弦波＋輕微抖音、慢起音
    flute(f, t, d, v) {
      v = v || 0.06;
      const g = ctx.createGain(); g.connect(out);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.12);
      g.gain.setValueAtTime(v, t + Math.max(0.13, d - 0.18)); g.gain.linearRampToValueAtTime(0.0001, t + d + 0.12);
      const o = osc("sine", f, t, d + 0.15, g);
      const lfo = ctx.createOscillator(), lg = ctx.createGain();
      lfo.frequency.value = 5.2; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(f * 0.007, t + 0.4);
      lfo.connect(lg); lg.connect(o.frequency); lfo.start(t); lfo.stop(t + d + 0.2);
      const h = ctx.createGain(); h.gain.value = 0.15; h.connect(g); osc("sine", f * 2, t, d + 0.15, h);
      // 氣音
      const n = noise(), bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = f * 2; bp.Q.value = 2;
      n.connect(bp); bp.connect(env(t, 0.05, 0.25, v * 0.25)); n.start(t); n.stop(t + 0.4);
    },
    // 持續低音墊底
    pad(f, t, d, v) {
      v = v || 0.03;
      const g = ctx.createGain(); g.connect(out);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + d * 0.35); g.gain.linearRampToValueAtTime(0.0001, t + d + 0.3);
      const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 800; lp.connect(g);
      osc("sawtooth", f, t, d + 0.3, lp, -7); osc("sawtooth", f, t, d + 0.3, lp, 7);
    },
    // 手鼓低音「咚」
    dum(t, v) {
      const o = osc("sine", 120, t, 0.4, env(t, 0.003, 0.32, v || 0.3));
      o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(58, t + 0.25);
    },
    // 手鼓高音「嗒」
    tek(t, v) {
      const n = noise(), hp = ctx.createBiquadFilter(); hp.type = "bandpass"; hp.frequency.value = 3200; hp.Q.value = 0.9;
      n.connect(hp); hp.connect(env(t, 0.002, 0.07, v || 0.12)); n.start(t); n.stop(t + 0.12);
    },
    // 海浪聲：濾過的白噪音慢慢起落
    wave(t, d, v) {
      const n = noise(), lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 520;
      const g = ctx.createGain(); g.connect(out);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v || 0.04, t + d * 0.45); g.gain.linearRampToValueAtTime(0.0001, t + d);
      n.connect(lp); lp.connect(g); n.start(t); n.stop(t + d + 0.1);
    }
  };

  /* ---------- 曲譜（每組場景不同，見下方 SCORE） ---------- */
  // 佛羅倫斯：托斯卡尼小圓舞曲（G 大調，3/4 拍）。曼陀林顫音彈旋律，吉他「蹦—恰—恰」伴奏，手風琴輕輕墊和弦，原創曲
  const SCORE = (() => {
    const mel = seq([
      ["D5",3],["B4",1],["C5",1],["D5",1], ["G5",4],["F#5",1],["E5",1], ["E5",3],["C5",1],["D5",1],["E5",1], ["D5",6],
      ["C5",3],["A4",1],["B4",1],["C5",1], ["F#5",4],["E5",1],["D5",1], ["C5",2],["B4",2],["A4",2], ["B4",4],["-",2],
      ["D5",2],["G5",2],["B5",2], ["A5",3],["G5",1],["F#5",1],["E5",1], ["E5",2],["G5",2],["E5",2], ["D5",4],["B4",2],
      ["C5",2],["E5",2],["A5",2], ["G5",3],["F#5",1],["E5",1],["F#5",1], ["E5",2],["C5",2],["F#4",2], ["G4",4],["-",2]
    ]);
    // 每小節和弦：[低音, 和弦音]
    const CH = {
      G: ["G2", ["G3","B3","D4"]], C: ["C3", ["C4","E4","G3"]], Am: ["A2", ["A3","C4","E4"]],
      D: ["D3", ["D4","F#4","A3"]], D7: ["D3", ["C4","F#4","A3"]], Em: ["E2", ["E3","G3","B3"]]
    };
    const bars = ["G","G","C","G", "Am","D","D7","G", "G","Em","C","G", "Am","D","D7","G"];
    return {
      bpm: 96, stepsPerBeat: 2, steps: 96, volume: 0.55, gain: 5,
      play(s, t, dt) {
        const bar = Math.floor(s / 6), i = s % 6, ch = CH[bars[bar]];
        if (i === 0) { I.pluck(hz(ch[0]), t, dt * 3, 0.08, 1200); I.pad(hz(ch[1][0]), t, dt * 5.6, 0.012); I.pad(hz(ch[1][1]), t, dt * 5.6, 0.01); }
        if (i === 2 || i === 4) ch[1].forEach((n, k) => I.pluck(hz(n), t + k * 0.012, dt * 1.4, 0.03, 1800));
        const m = mel[s];
        if (m) m[1] >= 2 ? I.tremolo(hz(m[0]), t, m[1] * dt * 0.95, 0.05, 0.07) : I.pluck(hz(m[0]), t, dt * 1.6, 0.06, 3200);
      }
    };
  })();

  /* ---------- 播放引擎（一般不需要修改） ---------- */
  function schedule() {
    const dt = 60 / SCORE.bpm / SCORE.stepsPerBeat;
    while (nextT < ctx.currentTime + 0.35) {
      try { SCORE.play(step, nextT, dt); } catch (e) {}
      nextT += dt; step = (step + 1) % SCORE.steps;
    }
  }
  function setBtn() {
    const b = document.getElementById("btnMusic");
    if (b) { b.setAttribute("aria-pressed", String(playing)); b.textContent = "♪ 配樂：" + (playing ? "開" : "關"); }
  }
  function level(v, sec) {
    const t = ctx.currentTime; out.gain.cancelScheduledValues(t);
    out.gain.setValueAtTime(Math.max(0.0001, out.gain.value), t); out.gain.linearRampToValueAtTime(Math.max(0.0001, v), t + sec);
  }
  let duckTimer = null;
  // ext：外層網頁（例如圖鑑網站的精選播放區）在使用者點擊時先建立好的 AudioContext，
  // 這樣瀏覽器不會擋自動播放；單獨打開這個檔案時不用傳
  function start(ext) {
    if (!ctx) {
      ctx = ext || new AC(); out = ctx.createGain(); out.gain.value = 0.0001;
      // 壓縮器讓音量平均，不會忽大忽小
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -20; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = 0.01; comp.release.value = 0.25;
      const master = ctx.createGain(); master.gain.value = (SCORE.gain || 1) * .64; // 配樂音量 ×0.64（2026-11-24 兩次各調降 20%）
      out.connect(comp); comp.connect(master); master.connect(ctx.destination);
    }
    if (ctx.state !== "running") ctx.resume();
    if (playing) return;
    playing = true; step = 0; nextT = ctx.currentTime + 0.1;
    level(SCORE.volume, 1.5); schedule(); timer = setInterval(schedule, 90); setBtn();
  }
  function stop() {
    if (!playing) return;
    playing = false; clearInterval(timer); clearTimeout(duckTimer); level(0.0001, 0.8); setBtn();
  }
  // 場景裡其他音樂（例如水舞、法朵）響起時，配樂先轉小聲
  function duck(sec) {
    if (!playing) return;
    clearTimeout(duckTimer); level(SCORE.volume * 0.12, 0.6);
    duckTimer = setTimeout(() => { if (playing) level(SCORE.volume, 2); }, sec * 1000);
  }
  document.addEventListener("visibilitychange", () => {
    if (!ctx) return;
    if (document.hidden) { if (playing) ctx.suspend(); } else if (playing) ctx.resume();
  });
  window.sceneMusic = {
    start, stop, duck,
    toggle() { playing ? stop() : start(); },
    get playing() { return playing; }
  };
  const btn = document.getElementById("btnMusic");
  if (btn) btn.addEventListener("click", () => window.sceneMusic.toggle());
  setBtn();
  // 純插畫版沒有按鈕：單獨打開時，點一下畫面就開始播（嵌在別的網頁裡時交給外層控制）
  let top = true; try { top = window.top === window; } catch (e) { top = false; }
  if (document.getElementById("pure-art") && top) {
    const go = () => { start(); document.removeEventListener("pointerdown", go); document.removeEventListener("keydown", go); };
    document.addEventListener("pointerdown", go); document.addEventListener("keydown", go);
  }
})();
</script>
