<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>北京紫禁城</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-49 北京紫禁城｜刺繡布藝風
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   視角：站在太和殿廣場南側往北看，太和殿坐在三層漢白玉台基上，
        左右是弘義閣與體仁閣，前景是鋪磚廣場與御道。
   風格重點：亞麻布底紋、貼布色塊、虛線平針縫邊、緞面繡的斜向絲線光澤、
            長短針繡的天空色帶、法式結粒繡的圓點（雪花、脊獸）、
            琉璃瓦用一條條直針表現瓦壟、彩畫用金線勾邊。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），
   部分另有 --k-名稱（晨昏）。JS 會依時間內插，輸出成 --名稱，
   並自動產生 .f-名稱（填色）、.s-名稱（描邊）兩個 class。
   ========================================================= */
:root{
  color-scheme: dark;

  /* —— 布料與繡線（不隨日夜變化） —— */
  --linen:#efe4cc;
  --thread-gold:#e6b34a;
  --thread-red:#cf3f37;
  --thread-green:#3f9450;
  --thread-blue:#3d6fb4;
  --thread-pink:#e57aa2;
  --thread-white:#fffaf0;

  /* —— 天空：四道長短針繡色帶（由上而下） —— */
  --d-sky-1:#5d9fd6; --k-sky-1:#545c9c; --n-sky-1:#0c1534;
  --d-sky-2:#7cb4df; --k-sky-2:#a5739d; --n-sky-2:#121d42;
  --d-sky-3:#a6cde8; --k-sky-3:#ec9a7a; --n-sky-3:#1a2752;
  --d-sky-4:#d4e7ee; --k-sky-4:#ffc47a; --n-sky-4:#24335f;
  --d-cloud:#fcf7ec;  --k-cloud:#ffd8b6; --n-cloud:#38457a;
  --d-cloud-sh:#d7cfbd; --n-cloud-sh:#232d58;
  --d-storm:#6c7886;  --n-storm:#1b2238;
  --d-storm-2:#8a95a0; --n-storm-2:#252d48;

  /* —— 繡線描邊（虛線平針） —— */
  --d-stitch:#5a4536;   --n-stitch:#0b1026;
  --d-stitch-lt:#fffaf0; --n-stitch-lt:#8a98cc;

  /* —— 主角：太和殿（黃琉璃瓦、朱紅柱牆、青綠和璽彩畫） —— */
  --d-roof:#e8ae2e;    --k-roof:#f2a640; --n-roof:#5c4a2c;   /* 黃琉璃瓦 */
  --d-roof-2:#f6cd55;  --n-roof-2:#6e5a34;                   /* 瓦面受光 */
  --d-roof-dk:#ad7618; --n-roof-dk:#352816;                  /* 瓦壟、脊 */
  --d-wall:#b3302a;    --n-wall:#3d1a24;                     /* 朱紅牆 */
  --d-wall-dk:#87231e; --n-wall-dk:#26101a;
  --d-col:#c43a2e;     --n-col:#47202a;                      /* 柱子 */
  --d-lattice:#d9a53a; --n-lattice:#5a4628;                  /* 菱花隔扇 */
  --d-dg-blue:#2f6c9c; --n-dg-blue:#1a2d48;                  /* 斗栱、額枋：青 */
  --d-dg-green:#3e8a6c; --n-dg-green:#1a3a34;                /* 綠 */
  --d-dg-gold:#e8b844; --n-dg-gold:#6a5530;                  /* 金線 */
  --d-plaque:#23436e;  --n-plaque:#121e36;                   /* 匾額底 */
  --d-hall-in:#2a1a14; --n-hall-in:#120a0a;                  /* 殿內 */

  /* —— 三台：漢白玉 —— */
  --d-marble:#f3eee2;   --k-marble:#ffe2c4; --n-marble:#596180;
  --d-marble-sh:#d3cab6; --n-marble-sh:#3e4562;
  --d-marble-dk:#a99f8a; --n-marble-dk:#2a2f48;

  /* —— 廣場鋪磚、御道 —— */
  --d-paving:#b4ada1;   --k-paving:#c8a890; --n-paving:#30364e;
  --d-paving-2:#a29b8e; --n-paving-2:#2a2f46;
  --d-paving-ln:#857d70; --n-paving-ln:#1c2034;
  --d-yudao:#ddd6c6;    --n-yudao:#474e6a;
  --d-shadow:#00000024; --n-shadow:#00000060;

  /* —— 銅器 —— */
  --d-bronze:#6e6a54;  --n-bronze:#262a32;
  --d-bronze-hi:#aaa07c; --n-bronze-hi:#3a3f48;
  --d-gilt:#cf9a30;    --n-gilt:#5a4426;    /* 鎏金銅缸 */
  --d-gilt-hi:#f2c95a; --n-gilt-hi:#77603a;

  /* —— 光源 —— */
  --sun:#ffd24a; --sun-ring:#ffb12c;
  --moon:#fff4d6; --star:#fff6dc;
  --lamp:#ffd27a; --lamp-hot:#fff1c4;
  --lantern:#d8322a; --lantern-dk:#9a1e1a; --lantern-glow:#ff8a4a;

  /* —— 投影：青綠山水 —— */
  --proj-1:#2f8f8a; --proj-2:#5bb38a; --proj-3:#1f5f86; --proj-gold:#f0cf6a;

  /* —— 天氣 —— */
  --d-rainc:#5d7fa0; --n-rainc:#a3b6e2;
  --snow:#ffffff; --snow-sh:#dfe6ee;
  --wx-cloud:#7c8a8c; --wx-storm:#29344a; --wx-snow:#e8eef4; --bolt:#fff8d0;
  --rb-1:#e8524a; --rb-2:#f39a2e; --rb-3:#f2d04a; --rb-4:#5fb85a; --rb-5:#4a8ad8; --rb-6:#7a5ac8;

  /* —— 角色：膚色、髮色、衣著 —— */
  --skin-1:#f3d2b0; --skin-2:#e3b48c; --skin-3:#c58e62; --skin-4:#8a5a3a;
  --hair-1:#1f1a1c; --hair-2:#4a3226; --hair-3:#c9a35c; --hair-4:#bdb6ac;
  --shirt-1:#e2574c; --shirt-2:#f2c14e; --shirt-3:#3f9e8f; --shirt-4:#f4f1e8; --shirt-5:#8b6fc4; --shirt-6:#4f8fd0; --shirt-7:#2d3a55;
  --pants-1:#2c2f3e; --pants-2:#6a5c4a; --pants-3:#3d5a86;
  --redcap:#d8322a;                         /* 旅行團小紅帽 */
  --guard:#26324a; --guard-2:#3a4866;       /* 保全制服 */
  --qing-1:#e05a8a; --qing-2:#4aa0c8; --qing-trim:#f2d06a; --qitou:#1d1a22; /* 清宮旗裝、旗頭 */
  --hanfu-1:#f6e6ea; --hanfu-2:#c8414e; --hanfu-3:#7fb7b0;  /* 明制漢服、馬面裙 */
  --poncho:#e7e15a; --poncho-2:#6ec3e8;     /* 輕便雨衣 */
  --umb-1:#e2574c; --umb-2:#f2c14e; --umb-3:#3f9e8f; --umb-4:#8b6fc4;
  --stroller:#4f8fd0; --phone:#2a2a2e; --screen:#bfe6ff;

  /* —— 動物 —— */
  --cat-orange:#e89a4a; --cat-orange-dk:#b8692a; --cat-white:#f6f1e6; --cat-black:#2a2626; --cat-gray:#8a8a90;
  --crow:#23232b; --crow-hi:#4a4c5c;
  --pigeon:#9aa3b4; --pigeon-dk:#5e6678; --pigeon-neck:#6aa38a;
  --sparrow:#9a6a42; --sparrow-dk:#5e3e26; --sparrow-lt:#e6d6bc;
  --crane:#f6f1e6;

  /* —— 頁面介面 —— */
  --page-bg:#1b1916; --page-fg:#f3e8d2; --page-muted:#b3a68c;
  --ui-surface:#26221d; --ui-line:#413a30; --ui-accent:#e6b34a; --ui-hot:#cf3f37;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border:1px solid var(--ui-line);border-radius:10px;overflow:hidden;background:var(--linen);line-height:0}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:10px;padding:10px 14px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px dashed var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--page-bg);font-weight:700}
.panel button.big{border-style:solid;border-color:var(--ui-hot);color:#fff;background:var(--ui-hot);font-weight:700}
.panel button.big.on{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--page-bg)}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
/* 畫面內可點物件：滑鼠點不顯示外框，用鍵盤 Tab 時才顯示 */
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid var(--ui-accent);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable,#scene [role="button"]{cursor:pointer}
/* 繡線描邊：虛線平針 */
#scene .st{fill:none;stroke:var(--stitch);stroke-width:1.3;stroke-dasharray:4 2.6;stroke-linecap:round}
#scene .st-lt{fill:none;stroke:var(--stitch-lt);stroke-width:1.2;stroke-dasharray:3.5 3;stroke-linecap:round;opacity:.75}
#scene .st-gold{fill:none;stroke:var(--dg-gold);stroke-width:1.1;stroke-dasharray:3 2;stroke-linecap:round}
/* 螭首吐水：跑針水柱往下流 */
#scene .spout-u{fill:none;stroke:#4f86b0;stroke-linecap:round;opacity:.75}
#scene .spout{fill:none;stroke:#e2f4ff;stroke-linecap:round;stroke-dasharray:5 4;animation:flow .5s linear infinite}
@keyframes flow{to{stroke-dashoffset:-9}}
/* 對話泡泡：縫在布上的小標籤 */
#scene .bubble rect{fill:var(--thread-white);stroke:var(--stitch);stroke-width:1.6;stroke-dasharray:5 3}
#scene .bubble text{fill:#3a2a22;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .bubble .pop{animation:pop var(--dur,1.6s) ease-out forwards}
@keyframes pop{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  #scene .bubble .pop{animation:none}
  #scene .spout{animation:none}
}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：天空 → 彩虹 → 後方門廡 → 太和殿 → 三層台基（每層：台面欄杆、台壁、螭首、水柱）
       → 弘義閣／體仁閣 → 廣場鋪磚、御道、品級山 → 動物與人物 → 天氣 → 亞麻布紋
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="刺繡布藝風格的北京紫禁城太和殿廣場動畫：太和殿是重簷廡殿頂的黃琉璃瓦大殿，紅柱紅牆、青綠彩畫，正脊兩端有鴟吻，簷角排著脊獸；大殿坐在三層漢白玉台基上，每層欄杆下都有螭首；台上有銅龜、銅鶴、日晷、嘉量與鎏金銅缸；左右是弘義閣與體仁閣；前景是鋪磚廣場、白石御道與品級山，遊客、導遊帶的旅行團、穿旗裝和漢服拍照的人、保全，以及御貓、烏鴉和麻雀">
    <defs>
      <!-- 緞面繡：斜向絲線光澤（疊在色塊上） -->
      <pattern id="satinA" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
        <rect width="5" height="1.4" fill="#ffffff" opacity=".16"/><rect y="2.5" width="5" height=".8" fill="#000000" opacity=".07"/>
      </pattern>
      <pattern id="satinB" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
        <rect width="5" height="1.4" fill="#ffffff" opacity=".16"/><rect y="2.5" width="5" height=".8" fill="#000000" opacity=".07"/>
      </pattern>
      <pattern id="satinV" width="4" height="6" patternUnits="userSpaceOnUse">
        <rect width="1.2" height="6" fill="#ffffff" opacity=".15"/><rect x="2.2" width=".7" height="6" fill="#000000" opacity=".07"/>
      </pattern>
      <!-- 長短針繡：天空的橫向針腳 -->
      <pattern id="longShort" width="36" height="8" patternUnits="userSpaceOnUse">
        <rect x="1" y="1" width="20" height="1.6" rx=".8" fill="#ffffff" opacity=".16"/>
        <rect x="18" y="5" width="16" height="1.6" rx=".8" fill="#ffffff" opacity=".12"/>
        <rect x="24" y="1.6" width="9" height=".8" fill="#000000" opacity=".05"/>
      </pattern>
      <!-- 菱花隔扇：門窗上的金色斜格 -->
      <pattern id="lingHua" width="7" height="7" patternUnits="userSpaceOnUse">
        <rect width="7" height="7" class="f-wall-dk"/>
        <path d="M0 0 L7 7 M7 0 L0 7" class="s-lattice" stroke-width="1.3"/>
        <circle cx="3.5" cy="3.5" r="1" class="f-lattice"/>
      </pattern>
      <!-- 漢白玉的石紋：細小的短針 -->
      <pattern id="stoneTex" width="22" height="9" patternUnits="userSpaceOnUse">
        <path d="M2 3 h6 M13 6.5 h5" stroke="#000000" stroke-opacity=".07" stroke-width=".9"/>
      </pattern>
      <!-- 御路的雲龍浮雕：捲雲針腳 -->
      <pattern id="yunLong" width="26" height="22" patternUnits="userSpaceOnUse">
        <path d="M3 15 q4 -8 9 -3 q3 4 -2 5 M14 7 q5 -6 9 0 q2 4 -3 4" class="s-marble-dk" stroke-width="1.2" stroke-dasharray="2.5 1.6"/>
      </pattern>
      <!-- 屋頂積雪：瓦壟之間一條條白 -->
      <pattern id="snowStripe" width="9" height="10" patternUnits="userSpaceOnUse">
        <rect x="0" width="6.2" height="10" style="fill:var(--snow)"/><rect x="0" width="1.4" height="10" style="fill:var(--snow-sh)"/>
      </pattern>
      <!-- 亞麻布紋：由程式用 canvas 產生後填入 href -->
      <pattern id="linenPat" width="200" height="200" patternUnits="userSpaceOnUse">
        <image id="linenImg" width="200" height="200" href=""/>
      </pattern>
      <radialGradient id="glowG"><stop offset="0" stop-color="#ffd27a" stop-opacity=".9"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
      <radialGradient id="lanternGlow"><stop offset="0" stop-color="#ff9a4a" stop-opacity=".75"/><stop offset="1" stop-color="#ff7a3a" stop-opacity="0"/></radialGradient>
      <radialGradient id="throneGlow"><stop offset="0" stop-color="#ffd86a" stop-opacity="1"/><stop offset="1" stop-color="#ffb43a" stop-opacity="0"/></radialGradient>
      <linearGradient id="beamG" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff3c4" stop-opacity=".55"/><stop offset="1" stop-color="#fff3c4" stop-opacity="0"/></linearGradient>
      <!-- 貼布投影：讓靜態的大片布塊像疊在底布上（只用在不會動的圖層） -->
      <filter id="appl" x="-5%" y="-5%" width="110%" height="115%">
        <feDropShadow dx="1.2" dy="2" stdDeviation="1.1" flood-color="#2a1a10" flood-opacity=".32"/>
      </filter>
      <clipPath id="frameClip"><rect x="0" y="0" width="1600" height="600"/></clipPath>
      <clipPath id="faceClip"></clipPath>
    </defs>

    <g clip-path="url(#frameClip)">
    <!-- ===== 場景：天空 ===== -->
    <g id="skyBands"></g>
    <rect id="skyHit" x="0" y="0" width="1600" height="200" fill="transparent" class="clickable" tabindex="0" role="button" aria-label="天空：白天飛過帶鴿哨的鴿群，夜晚劃過流星，雷雨時打雷"/>
    <g id="stars" pointer-events="none"></g>
    <g id="sun" class="clickable" role="button" tabindex="0" aria-label="太陽：切換到夜晚"></g>
    <g id="moon" class="clickable" role="button" tabindex="0" aria-label="月亮：切換到白天"></g>
    <g id="parSky">
      <g id="clouds" pointer-events="none"></g>
      <g id="overcast" pointer-events="none" opacity="0"></g>
    </g>
    <g id="bolt" pointer-events="none" opacity="0"></g>
    <g id="rainbow" pointer-events="none" opacity="0"></g>
    <g id="skyBirds" pointer-events="none"></g>
    <g id="meteors" pointer-events="none"></g>

    <!-- ===== 場景：後方門廡（中左門、中右門一帶的屋頂） ===== -->
    <g id="backHalls" filter="url(#appl)"></g>

    <!-- ===== 主角：太和殿 ===== -->
    <g id="hallWrap">
      <g id="hall" filter="url(#appl)"></g>
      <g id="hallDoors"></g>
      <rect id="hallHit" x="560" y="236" width="480" height="124" fill="transparent" class="clickable" tabindex="0" role="button" aria-label="太和殿：殿門打開，看見金色的寶座"/>
      <g id="hallSnow" pointer-events="none" opacity="0"></g>
      <g id="hallLights" pointer-events="none" opacity="0"></g>
      <g id="lanterns" pointer-events="none"></g>
      <g id="beasts"></g>
      <g id="perched"></g>
    </g>

    <!-- ===== 三層漢白玉台基（由上而下、由後往前） ===== -->
    <g id="platformTop" transform="translate(0 -8)"></g>
    <g id="tier3"></g>
    <g id="tier2"></g>
    <g id="tier1"></g>
    <g id="spoutsAll" pointer-events="none"></g>
    <g id="stairs"></g>
    <g id="projection" pointer-events="none" opacity="0"></g>
    <g id="tierSnow" pointer-events="none" opacity="0"></g>

    <!-- ===== 左右：弘義閣、體仁閣 ===== -->
    <g id="sidePav" filter="url(#appl)"></g>
    <g id="sideExtra"></g>

    <!-- ===== 前景：廣場、御道、品級山 ===== -->
    <g id="court"></g>
    <rect id="courtHit" x="0" y="470" width="1600" height="130" fill="transparent"/>
    <g id="courtSnow" pointer-events="none" opacity="0"></g>
    <g id="puddles" pointer-events="none"></g>
    <g id="splashes" pointer-events="none"></g>

    <!-- ===== 角色：動物與人物（依腳底 y 排序） ===== -->
    <g id="people"></g>
    <g id="phoneGlow" pointer-events="none"></g>

    <!-- ===== 天氣與氛圍 ===== -->
    <g id="rain" pointer-events="none" opacity="0"></g>
    <g id="snowfall" pointer-events="none" opacity="0"></g>
    <g id="wxTint" pointer-events="none"></g>
    <rect id="flash" x="0" y="0" width="1600" height="600" style="fill:var(--bolt)" opacity="0" pointer-events="none"/>
    <g id="fx" pointer-events="none"></g>
    <g id="bubbles" pointer-events="none"></g>
    </g>

    <!-- ===== 布藝質感：亞麻布紋＋四周的鎖邊針腳 ===== -->
    <rect x="0" y="0" width="1600" height="600" fill="url(#linenPat)" pointer-events="none"/>
    <rect x="7" y="7" width="1586" height="586" fill="none" style="stroke:var(--thread-gold)" stroke-width="2.4" stroke-dasharray="9 5" pointer-events="none" opacity=".85"/>
  </svg>
  </figure>

  <!-- ===== 互動：控制列 ===== -->
  <div class="panel">
    <button id="btnLantern" class="big" type="button">🏮 上元之夜</button>
    <button id="btnDragon" class="big" type="button">🐉 千龍吐水</button>
    <button id="btnTour" type="button">🚩 導覽團</button>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);
      }
      return _conn.call(this, dest, ...a);
    };
  }
  function stopAudio() {
    let longs = [], ctx = null;
    for (const s of srcs) {
      const c = s.context, now = c.currentTime, m = s.__ss; ctx = c;
      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }

      const g = outs.get(ctx), now = ctx.currentTime;
      if (g) {
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 1.1); g.gain.setValueAtTime(0, now + 1.2);
        g.gain.linearRampToValueAtTime(1, now + 1.9);

      longs.forEach(s => { try { s.stop(now + 1.15); } catch (e) {} srcs.delete(s); });
    }
    srcs.clear();
  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');
    // 凍結色票：把目前的 CSS 變數抄到殘影上，底下換色不影響殘影
    const cs = getComputedStyle(svg);
    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }
      }
    }
    const par = svg.parentElement;
    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });
    added = [];
  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>
/* =========================================================
   SC-49 北京紫禁城｜程式區
   區塊：①工具與色票 ②場景（天空、太和殿、三台、閣樓、廣場）
         ③角色（遊客、旅行團、保全、御貓、烏鴉、鴿群、麻雀）
         ④動畫（日夜、天氣、上元之夜、千龍吐水、環境）⑤互動（點擊、滑鼠、聲音、控制列）
   ========================================================= */
(() => {
'use strict';

/* ---------------- ① 工具與色票 ---------------- */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const root = document.documentElement;
const svg = $('scene');
const GY = 470;            // 廣場地面頂（三台底邊）
const CX = 800;            // 太和殿中軸
const STAIR = [714, 886];  // 中央御路台階範圍（欄杆在這裡斷開）
// 三層台基：x 範圍、台壁（face）上下緣、欄杆（bal）上下緣。由下而上。
const TIERS = [
  { x0: 200, x1: 1400, face: [438, 470], bal: [422, 438] },
  { x0: 268, x1: 1332, face: [404, 438], bal: [388, 404] },
  { x0: 336, x1: 1264, face: [370, 404], bal: [354, 370] }
];
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
let seed = 20261123;  // 固定亂數：每次開啟構圖一樣
const srand = (a = 0, b = 1) => { seed = (seed * 16807) % 2147483647; return a + (seed / 2147483647) * (b - a); };
const f1 = n => (+n).toFixed(1);
function el(tag, attrs = {}, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function frag(parent, html) { parent.insertAdjacentHTML('beforeend', html); return parent.lastElementChild; }
// 刺繡色塊：底色＋緞面光澤＋虛線縫邊（三層同一個形狀）
function patch(d, fillCls, sat = 'satinA', stitch = 'st') {
  return `<path d="${d}" class="${fillCls}"/>${sat ? `<path d="${d}" fill="url(#${sat})"/>` : ''}${stitch ? `<path d="${d}" class="${stitch}"/>` : ''}`;
}
function patchS(d, style, sat = 'satinA', stitch = 'st') {
  return `<path d="${d}" style="${style}"/>${sat ? `<path d="${d}" fill="url(#${sat})"/>` : ''}${stitch ? `<path d="${d}" class="${stitch}"/>` : ''}`;
}
const R = (x, y, w, h) => `M${f1(x)} ${f1(y)}h${f1(w)}v${f1(h)}h${f1(-w)}Z`;
// 二次貝茲曲線上的點（脊獸沿垂脊排列用）
const qpt = (a, c, b, t) => [(1 - t) * (1 - t) * a[0] + 2 * (1 - t) * t * c[0] + t * t * b[0], (1 - t) * (1 - t) * a[1] + 2 * (1 - t) * t * c[1] + t * t * b[1]];

const css = n => getComputedStyle(root).getPropertyValue(n).trim();
const hex = h => {
  h = h.replace('#', '');
  if (h.length === 3) h = [...h].map(c => c + c).join('');
  const n = parseInt(h.slice(0, 6), 16);
  return [n >> 16 & 255, n >> 8 & 255, n & 255, h.length === 8 ? parseInt(h.slice(6), 16) / 255 : 1];
};
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgba = c => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${(c[3] ?? 1).toFixed(3)})`;
// 成對色票：自動找出所有 --d-xxx，配對 --n-xxx（與選用的 --k-xxx）
const PAIRS = {};
(() => {
  const names = [];
  for (const sheet of document.styleSheets) {
    try { for (const r of sheet.cssRules) if (r.selectorText === ':root') for (const p of r.style) if (p.startsWith('--d-')) names.push(p.slice(4)); } catch (e) {}
  }
  let cls = '';
  names.forEach(k => {
    const k2 = css('--k-' + k);
    PAIRS[k] = { d: hex(css('--d-' + k)), n: hex(css('--n-' + k)), k: k2 ? hex(k2) : null };
    cls += `#scene .f-${k}{fill:var(--${k})}#scene .s-${k}{stroke:var(--${k});fill:none}`;
  });

function makeLinen() {

    const c = document.createElement('canvas'); c.width = c.height = 200;
    const x = c.getContext('2d');

      x.fillStyle = `rgba(60,40,20,${(.03 + Math.random() * .05).toFixed(3)})`; x.fillRect(i, 0, 1, 200);
    }
    for (let i = 0; i < 900; i++) {
      x.fillStyle = Math.random() < .5 ? 'rgba(60,40,20,.10)' : 'rgba(255,250,235,.14)';
      x.fillRect(Math.random() * 200, Math.random() * 200, 1 + Math.random() * 3, 1);
    }
    $('linenImg').setAttribute('href', c.toDataURL('image/png'));
  } catch (e) {}
}

/* ---------------- ② 場景：天空（長短針繡色帶、太陽、月亮、貼布雲） ---------------- */
const stars = [], clouds = [];
function drawSky() {
  const bands = [[0, 80], [80, 165], [165, 250], [250, 480]];
  bands.forEach(([a, b], i) => {
    el('rect', { x: 0, y: a, width: 1600, height: b - a + 1, class: 'f-sky-' + (i + 1) }, $('skyBands'));
    el('rect', { x: 0, y: a, width: 1600, height: b - a + 1, fill: 'url(#longShort)' }, $('skyBands'));
  });
  // 色帶交界：一排斜向的長短針，像兩種顏色的繡線互相咬合
  bands.slice(1).forEach(([a], i) => {
    let d = '';
    for (let x = 0; x < 1600; x += 9) d += `M${x} ${a + 3 + (x * 7 % 5)} L${x + 5} ${a - 5 - (x * 3 % 4)} `;
    el('path', { d, class: 's-sky-' + (i + 2), 'stroke-width': 2.2, 'stroke-linecap': 'round' }, $('skyBands'));
  });
  // 星星：十字繡的小叉叉
  for (let i = 0; i < 70; i++) {
    const x = srand(20, 1580), y = srand(14, 300), r = srand(2, 4);
    const s = el('path', { d: `M${f1(x - r)} ${f1(y - r)}L${f1(x + r)} ${f1(y + r)}M${f1(x + r)} ${f1(y - r)}L${f1(x - r)} ${f1(y + r)}`, style: 'stroke:var(--star)', 'stroke-width': 1.4, 'stroke-linecap': 'round' }, $('stars'));
    stars.push({ el: s, ph: srand(0, 6.28), sp: srand(.6, 2) });
  }
  // 太陽：緞面繡圓盤＋一圈放射直針
  let rays = '';
  for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2, r0 = 46, r1 = i % 2 ? 58 : 68; rays += `M${f1(Math.cos(a) * r0)} ${f1(Math.sin(a) * r0)}L${f1(Math.cos(a) * r1)} ${f1(Math.sin(a) * r1)}`; }
  frag($('sun'), `<g><circle r="70" fill="transparent"/><path d="${rays}" style="stroke:var(--sun-ring)" stroke-width="3.2" stroke-linecap="round"/>
    <circle r="38" style="fill:var(--sun)"/><circle r="38" fill="url(#satinA)"/><circle r="32" class="st" style="stroke:var(--sun-ring)"/></g>`);
  frag($('moon'), `<g><circle r="44" fill="transparent"/><circle r="40" style="fill:var(--moon)" opacity=".1"/><path d="M6 -26A26 26 0 1 0 6 26A20 24 0 1 1 6 -26Z" style="fill:var(--moon)"/>
    <path d="M6 -26A26 26 0 1 0 6 26A20 24 0 1 1 6 -26Z" class="st" style="stroke:#c9b98a"/></g>`);
  // 貼布雲：平底圓頂，周圍一圈平針
  const shapes = [
    [[0, 0, 24], [28, -10, 30], [62, -2, 22], [86, 4, 14]],
    [[0, 0, 16], [22, -12, 24], [52, -6, 20], [74, 2, 13]],
    [[0, 0, 20], [26, -14, 28], [60, -10, 24], [90, -2, 18], [112, 4, 11]]
  ];
  for (let i = 0; i < 6; i++) {
    const shp = shapes[i % 3];
    const g = el('g', {}, $('clouds'));
    let d = '';
    const minX = -shp[0][2], maxX = shp[shp.length - 1][0] + shp[shp.length - 1][2];
    shp.forEach(([cx, cy, r]) => { d += `M${cx - r} ${cy} a${r} ${r} 0 1 1 ${r * 2} 0 a${r} ${r} 0 1 1 ${-r * 2} 0 `; });
    d += `M${minX} 0 H${maxX} V12 H${minX} Z`;
    frag(g, `<path d="M${minX + 4} 10 H${maxX - 2} V16 H${minX + 4}Z" class="f-cloud-sh"/><path d="${d}" class="f-cloud"/><path d="M${minX + 6} 8 H${maxX - 6}" class="st" opacity=".6"/>`);
    clouds.push({ el: g, x: srand(-100, 1600), y: srand(36, 170), sp: srand(5, 10), s: srand(.75, 1.15) });
  }
  // 陰天、雷雨雲：三條厚重的貼布雲帶
  [[16, 70, 'f-storm'], [84, 60, 'f-storm-2'], [150, 50, 'f-storm']].forEach(([y, h, c], i) => {
    let d = `M-20 ${y + h}`;
    for (let x = -20; x <= 1640; x += 80) d += ` Q${x + 40} ${y - 18 - (i * 37 + x) % 22} ${x + 80} ${y}`;
    d += ` L1640 ${y + h} Z`;
    frag($('overcast'), `<path d="${d}" class="${c}"/><path d="${d}" fill="url(#longShort)"/>`);
  });
  // 彩虹（千龍吐水雨停後出現）：七色跑針弧線，掛在大殿後方
  ['--rb-1', '--rb-2', '--rb-3', '--rb-4', '--rb-5', '--rb-6'].forEach((c, i) =>
    el('path', { d: `M${150 + i * 7} 430 A${650 - i * 7} ${360 - i * 7} 0 0 1 ${1450 - i * 7} 430`, style: `stroke:var(${c});fill:none`, 'stroke-width': 6, 'stroke-dasharray': '11 3', opacity: .85 }, $('rainbow')));
}

/* ---------------- ② 場景：重簷廡殿頂（屋頂工具） ----------------
   廡殿頂正面是一個上窄下寬、兩側下凹的梯形：正脊在上，垂脊斜斜往下到翹起的簷角。 */
const snowShapes = [];   // 下雪時要蓋白的屋頂形狀
function hipRoof(g, o) {
  // o: cx, ry（正脊高）, rh（正脊半寬）, ey（簷口高）, eh（簷口半寬）, lift（簷角翹起）
  const { cx, ry, rh, ey, eh, lift } = o;
  const L = [cx - eh - 14, ey - lift], Rr = [cx + eh + 14, ey - lift];
  const cR = [cx + rh + (eh - rh) * .28, ey - lift - 4], cL = [cx - rh - (eh - rh) * .28, ey - lift - 4];
  const d = `M${cx - rh} ${ry} L${cx + rh} ${ry} Q${f1(cR[0])} ${f1(cR[1])} ${f1(Rr[0])} ${f1(Rr[1])} Q${cx + eh} ${ey + 1} ${cx + eh - 18} ${ey} L${cx - eh + 18} ${ey} Q${cx - eh} ${ey + 1} ${f1(L[0])} ${f1(L[1])} Q${f1(cL[0])} ${f1(cL[1])} ${cx - rh} ${ry} Z`;
  const id = 'rc' + Math.random().toString(36).slice(2, 7);
  frag($('scene').querySelector('defs'), `<clipPath id="${id}"><path d="${d}"/></clipPath>`);
  let s = `<path d="${d}" class="f-roof"/>`;
  // 瓦壟：一條條直針，亮暗交錯像琉璃瓦的反光
  let tl = '', tl2 = '';
  for (let x = cx - eh - 14; x <= cx + eh + 14; x += 7) {
    if (Math.round((x - cx) / 7) % 2) tl += `M${f1(x)} ${ry} V${ey + 2}`; else tl2 += `M${f1(x + 1.5)} ${ry} V${ey + 2}`;
  }
  s += `<g clip-path="url(#${id})"><path d="${tl}" class="s-roof-dk" stroke-width="1.6" stroke-dasharray="5 2"/><path d="${tl2}" class="s-roof-2" stroke-width="2.2" stroke-dasharray="6 2.5"/>
    <path d="M${cx - eh - 20} ${ey - 5} H${cx + eh + 20}" class="s-roof-dk" stroke-width="3" opacity=".5"/></g>`;
  s += `<path d="${d}" fill="url(#satinA)"/><path d="${d}" class="st"/>`;
  // 簷口瓦當：一排小圓點（法式結粒繡）
  let dots = '';
  for (let x = cx - eh + 14; x <= cx + eh - 14; x += 7) dots += `<circle cx="${f1(x)}" cy="${ey - 1}" r="1.7" class="f-roof-dk"/>`;
  s += dots;
  // 垂脊
  s += `<path d="M${cx + rh} ${ry} Q${f1(cR[0])} ${f1(cR[1])} ${f1(Rr[0])} ${f1(Rr[1])} M${cx - rh} ${ry} Q${f1(cL[0])} ${f1(cL[1])} ${f1(L[0])} ${f1(L[1])}" class="s-roof-dk" stroke-width="4.2" stroke-linecap="round"/>`;
  s += `<path d="M${cx + rh} ${ry} Q${f1(cR[0])} ${f1(cR[1])} ${f1(Rr[0])} ${f1(Rr[1])} M${cx - rh} ${ry} Q${f1(cL[0])} ${f1(cL[1])} ${f1(L[0])} ${f1(L[1])}" class="st-lt" stroke-width="1"/>`;
  // 簷角的套獸（小小的龍頭）
  s += `<circle cx="${f1(Rr[0] + 2)}" cy="${f1(Rr[1] + 1)}" r="2.6" class="f-roof-dk"/><circle cx="${f1(L[0] - 2)}" cy="${f1(L[1] + 1)}" r="2.6" class="f-roof-dk"/>`;
  frag(g, `<g>${s}</g>`);
  snowShapes.push({ d, host: o.snow || 'hall' });
  return { d, hipR: [[cx + rh, ry], cR, Rr], hipL: [[cx - rh, ry], cL, L] };
}
// 鴟吻：正脊兩端張口咬住屋脊的龍形裝飾（右邊那隻，左邊用鏡像）
function chiwen(x, y, flip) {
  const d = `M-12 0 V-24 Q-12 -38 2 -40 L8 -40 Q15 -42 13 -50 Q22 -46 20 -35 Q18 -27 12 -26 V-14 Q12 -6 6 -4 L6 0 Z`;
  return `<g transform="translate(${x} ${y}) scale(${flip ? -1 : 1} 1)">${patch(d, 'f-roof', 'satinV')}
    <path d="M-12 -20 Q-4 -18 -2 -10 Q-6 -6 -12 -8" class="f-roof-dk"/><circle cx="-6" cy="-14" r="1.3" fill="#2a1a10"/>
    <path d="M-2 -40 v-8 h4 v8" class="f-roof-dk"/><path d="M-6 -30 q6 -4 12 0" class="s-roof-dk" stroke-width="1.3"/></g>`;
}

/* ---------------- ② 場景：太和殿 ----------------
   面闊十一間、重簷廡殿頂、黃琉璃瓦；下層是紅柱與金色菱花隔扇門，
   柱頂是青綠和璽彩畫的額枋與斗栱，上下兩重屋簷之間掛著豎匾。 */
const COLS = [];
for (let i = 0; i < 12; i++) COLS.push(560 + i * 480 / 11);
const beastGroups = [];   // 四組脊獸（仙人＋十隻）
const lanternsHall = [];

function drawHall() {
  const g = $('hall');
  let s = '';
  // 殿身底牆
  s += patch(R(552, 294, 496, 70), 'f-wall-dk', null, null);
  // 隔扇門與檻窗
  for (let i = 0; i < 11; i++) {
    const a = COLS[i] + 4.5, b = COLS[i + 1] - 4.5, w = b - a;
    if (i === 5) continue;   // 正中間那間另外畫（可以打開）

      s += patch(R(a, 338, w, 26), 'f-wall', 'satinV', 'st');

      for (let k = 0; k < 4; k++) {

        s += `<path d="${R(x + .6, 342, w / 4 - 1.2, 20)}" class="f-wall"/><path d="${R(x + 2.2, 347, w / 4 - 4.4, 9)}" class="st-gold"/>`;
      }
      s += `<path d="${R(a, 299, w, 64)}" class="st-gold" opacity=".8"/>`;
    }
  }
  // 紅柱
  COLS.forEach(x => { s += patch(R(x - 4.5, 294, 9, 70), 'f-col', 'satinV', 'st'); });
  // 額枋：青綠相間，金線勾出和璽彩畫的「Σ」紋
  for (let i = 0; i < 11; i++) {
    const a = COLS[i], b = COLS[i + 1], m = (a + b) / 2;
    s += `<path d="${R(a, 286, b - a, 9)}" class="${i % 2 ? 'f-dg-green' : 'f-dg-blue'}"/>`;
    s += `<path d="M${f1(a + 4)} 286 l5 4.5 l-5 4.5 M${f1(b - 4)} 286 l-5 4.5 l5 4.5 M${f1(m - 7)} 290.5 h14" class="s-dg-gold" stroke-width="1.3"/>`;
  }
  s += `<path d="M548 286 H1052 M548 295 H1052" class="s-dg-gold" stroke-width="1.2"/>`;
  // 斗栱：一排青綠小方塊，頂上一顆金點
  for (let x = 552; x <= 1048; x += 11) s += `<path d="${R(x - 3.6, 279, 7.2, 7)}" class="${Math.round((x - 552) / 11) % 2 ? 'f-dg-green' : 'f-dg-blue'}"/><circle cx="${x}" cy="279.5" r="1.3" class="f-dg-gold"/>`;
  frag(g, `<g>${s}</g>`);
  // 下層屋簷（腰簷）：從上層牆根往外斜到翹起的簷角
  const lowD = `M592 256 L1008 256 Q1060 262 1114 266 Q1094 281 1054 280 L546 280 Q506 281 486 266 Q540 262 592 256 Z`;
  const lid = 'lowClip';
  frag($('scene').querySelector('defs'), `<clipPath id="${lid}"><path d="${lowD}"/></clipPath>`);
  let tl = '', tl2 = '';
  for (let x = 486; x <= 1114; x += 7) { if (Math.round(x / 7) % 2) tl += `M${x} 250 V282`; else tl2 += `M${x + 1.5} 250 V282`; }
  let dots = '';
  for (let x = 552; x <= 1048; x += 7) dots += `<circle cx="${x}" cy="279" r="1.6" class="f-roof-dk"/>`;
  frag(g, `<g><path d="${lowD}" class="f-roof"/><g clip-path="url(#${lid})"><path d="${tl}" class="s-roof-dk" stroke-width="1.5" stroke-dasharray="4 2"/><path d="${tl2}" class="s-roof-2" stroke-width="2" stroke-dasharray="5 2"/></g>
    <path d="${lowD}" fill="url(#satinA)"/><path d="${lowD}" class="st"/>${dots}
    <path d="M1008 256 Q1060 262 1114 266 M592 256 Q540 262 486 266" class="s-roof-dk" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M592 256 H1008" class="s-roof-dk" stroke-width="3"/></g>`);
  snowShapes.push({ d: lowD, host: 'hall' });
  // 上層：牆身與斗栱
  let u = patch(R(598, 234, 404, 23), 'f-wall', 'satinV', 'st');
  for (let i = 0; i < 10; i++) { const x = 598 + i * 404 / 9; u += `<path d="${R(x - 3, 234, 6, 23)}" class="f-col"/>`; }
  u += `<path d="${R(590, 230, 420, 5)}" class="f-dg-blue"/>`;
  for (let x = 566; x <= 1034; x += 10) u += `<path d="${R(x - 3.2, 226, 6.4, 5)}" class="${Math.round(x / 10) % 2 ? 'f-dg-green' : 'f-dg-blue'}"/><circle cx="${x}" cy="226.5" r="1.1" class="f-dg-gold"/>`;

  // 豎匾：藍底金框，中間是金線繡出的字樣筆畫

    <path d="M${f1(m - 7)} 352 v-12 h14 v12 M${f1(m - 9)} 341 h18" style="stroke:#9a1e1a;fill:none" stroke-width="2.2"/></g>`);
  throneGlowEl = $('throneGlow');
  const leaf = side => {

    for (let k = 0; k < 2; k++) {
      const x = k * w / 4;
      t += `<path d="${R(x + .6, 300, w / 4 - 1.2, 40)}" fill="url(#lingHua)"/><path d="${R(x + .6, 342, w / 4 - 1.2, 20)}" class="f-wall"/><path d="${R(x + 2.2, 347, w / 4 - 4.4, 9)}" class="st-gold"/>`;

  doorR = frag(dg, `<g transform="translate(${f1(b)} 0)"><g class="lf" transform="translate(${f1(-w / 2)} 0)">${leaf()}</g></g>`).firstElementChild;
  doorR._w = w / 2;
  // 上元之夜的紅燈籠：掛在下層屋簷下（平常藏起來）
  for (let i = 0; i < 11; i++) {
    if (i === 0 || i === 10) continue;

    lanternsHall.push(lanternAt($('lanterns'), x, 297, .9));

  // 夜裡的金色打光：殿身＋屋簷、屋脊勾邊
  frag($('hallLights'), `<g>
    <path d="M648 140 H952 M${up.hipR[0].join(' ')} Q${up.hipR[1].map(f1).join(' ')} ${up.hipR[2].map(f1).join(' ')} M${up.hipL[0].join(' ')} Q${up.hipL[1].map(f1).join(' ')} ${up.hipL[2].map(f1).join(' ')} M546 280 H1054 M1008 256 Q1060 262 1114 266 M592 256 Q540 262 486 266" style="stroke:var(--lamp)" stroke-width="7" opacity=".35" fill="none" stroke-linecap="round"/>
    <path d="M648 140 H952 M${up.hipR[0].join(' ')} Q${up.hipR[1].map(f1).join(' ')} ${up.hipR[2].map(f1).join(' ')} M${up.hipL[0].join(' ')} Q${up.hipL[1].map(f1).join(' ')} ${up.hipL[2].map(f1).join(' ')} M546 280 H1054 M1008 256 Q1060 262 1114 266 M592 256 Q540 262 486 266" style="stroke:var(--lamp-hot)" stroke-width="2" stroke-dasharray="5 3" fill="none" stroke-linecap="round"/>
    <path d="M${COLS.map(x => `${f1(x)} 294 v70`).join(' M')}" style="stroke:var(--lamp-hot)" stroke-width="1.6" opacity=".55"/></g>`);
  // 脊獸：仙人騎鳳在最前，後面排著十隻（龍、鳳、獅子、天馬、海馬、狻猊、押魚、獬豸、斗牛、行什）
  const lowHipR = [[1008, 256], [1060, 262], [1114, 266]], lowHipL = [[592, 256], [540, 262], [486, 266]];
  [[up.hipR, 1], [up.hipL, -1], [lowHipR, 1], [lowHipL, -1]].forEach(([hip, dir], gi) => {
    const grp = el('g', { class: 'clickable', tabindex: 0, role: 'button', 'aria-label': '脊獸：仙人騎鳳和十隻脊獸，只有太和殿有第十隻「行什」' }, $('beasts'));

      if (k === 0) frag(f, `<path d="M-2.4 0 q0 -5 2.4 -6.4 q2.4 1.4 2.4 6.4 Z" class="f-roof-2"/><circle cx="0" cy="-7.6" r="1.6" class="f-roof-2"/><path d="M${-3 * dir} -1 q${3 * dir} -2 ${6 * dir} 0" class="s-roof-dk" stroke-width="1"/>`);
      else if (k === 10) frag(f, `<path d="M-2.6 0 v-5 q2.6 -2.4 5.2 0 v5 Z" class="f-roof-2"/><path d="M${-2 * dir} -6.6 l${1 * dir} -2 l${1 * dir} 2" class="s-roof-dk" stroke-width="1"/>`); // 行什：有翅膀、手持金剛杵的猴面像
      else frag(f, `<path d="M-2.4 0 q-.4 -4.6 ${2 * dir} -5.6 q${1.6 * dir} .4 ${.6 * dir} 2 L${2.6 * dir} 0 Z" class="f-roof-2"/><circle cx="${1.6 * dir}" cy="-4.8" r=".7" fill="#4a2a10"/>`);
      figs.push({ el: f, x, y: y - 2, hop: 0, delay: 0 });
      hx0 = Math.min(hx0, x); hx1 = Math.max(hx1, x); hy0 = Math.min(hy0, y); hy1 = Math.max(hy1, y);
    }
    el('rect', { x: f1(hx0 - 8), y: f1(hy0 - 14), width: f1(hx1 - hx0 + 16), height: f1(hy1 - hy0 + 18), fill: 'transparent' }, grp);
    beastGroups.push({ el: grp, figs });
  });
}
// 紅燈籠（宮燈）：橢圓燈身＋金色上下蓋＋流蘇，夜裡燈心發光
function lanternAt(parent, x, y, s = 1) {

/* ---------------- ② 場景：三層漢白玉台基 ----------------
   每一層：上緣一排欄杆（望柱、欄板），下面是須彌座台壁（上枋、束腰、下枋），
   每根望柱底下伸出一個螭首，下大雨時從嘴裡吐水。 */
const spouts = [[], [], []];      // 每層的水柱
const heads = [];                 // 所有螭首（點擊用）
const tierSpoutG = [];
function drawTiers() {
  ['tier1', 'tier2', 'tier3'].forEach((id, ti) => {
    const T = TIERS[ti], g = $(id);
    const [b0, b1] = T.bal, [f0, f1y] = T.face;
    let s = '';
    // 台壁（須彌座）：上枋、束腰（刻蓮瓣）、下枋
    const segs = [[T.x0, STAIR[0]], [STAIR[1], T.x1]];
    segs.forEach(([a, b]) => {
      s += patch(R(a, b1, b - a, f1y - b1), 'f-marble', null, null);
      s += `<path d="${R(a, b1, b - a, f1y - b1)}" fill="url(#stoneTex)"/>`;
      const mid0 = f0 + (f1y - f0) * .38, mid1 = f0 + (f1y - f0) * .72;
      s += `<path d="${R(a + 3, mid0, b - a - 6, mid1 - mid0)}" class="f-marble-sh"/>`;
      let lotus = '';
      for (let x = a + 8; x < b - 6; x += 9) lotus += `M${f1(x)} ${f1(mid1)} q4.5 ${f1(-(mid1 - mid0) * .9)} 9 0 `;
      s += `<path d="${lotus}" class="s-marble-dk" stroke-width="1" stroke-dasharray="2.5 1.5"/>`;
      s += `<path d="M${a} ${f1(mid0)} H${b} M${a} ${f1(mid1)} H${b}" class="s-marble-dk" stroke-width="1.2"/>`;
      s += `<path d="${R(a, b1, b - a, f1y - b1)}" class="st"/>`;
    });
    // 台壁下緣的影子
    s += `<path d="${R(T.x0, f1y - 2.5, T.x1 - T.x0, 2.5)}" class="f-shadow"/>`;
    frag(g, `<g filter="url(#appl)">${s}</g>`);
    // 欄杆：望柱＋欄板（中間鏤空寶瓶），上面一條尋杖扶手
    let r = '';
    const posts = [];
    segs.forEach(([a, b]) => {
      r += patch(R(a, b0 + 3, b - a, b1 - b0 - 3), 'f-marble', null, null);
      for (let x = a + 6; x < b - 4; x += 24) {
        r += `<path d="${R(x + 5.5, b0 + 6, 13, b1 - b0 - 9)}" class="f-marble-sh"/><path d="M${x + 12} ${b0 + 7} q-3.4 ${f1((b1 - b0) * .3)} 0 ${f1((b1 - b0) * .6)} q3.4 ${f1(-(b1 - b0) * .3)} 0 ${f1(-(b1 - b0) * .6)}" class="f-marble"/>`;
      }
      r += `<path d="M${a} ${b0 + 4} H${b}" class="s-marble-dk" stroke-width="1.4"/>`;
      for (let x = a + 3; x <= b - 2; x += 24) posts.push(x);
      if (b - 3 - posts[posts.length - 1] > 10) posts.push(b - 3);
    });
    posts.forEach(x => {
      r += patch(R(x - 2.5, b0 - 1, 5, b1 - b0 + 1), 'f-marble', null, 'st');
      r += `<circle cx="${x}" cy="${b0 - 3}" r="3.3" class="f-marble"/><path d="M${x - 2} ${b0 - 3} q2 -3 4 0" class="s-marble-dk" stroke-width=".9"/>`;
    });
    r += `<path d="M${T.x0} ${b1} H${STAIR[0]} M${STAIR[1]} ${b1} H${T.x1}" class="st" />`;
    frag(g, `<g>${r}</g>`);
    // 螭首與水柱
    const hg = el('g', {}, g);
    const sg = el('g', { opacity: 0 }, $('spoutsAll'));
    tierSpoutG[ti] = sg;
    const L = ti === 0 ? GY - f0 - 6 : 32;
    let under = '', top = '', spl = '';
    posts.forEach(x => {
      const y = f0 + 4;
      const h = el('g', { class: 'clickable' }, hg);
      frag(h, `<rect x="${x - 7}" y="${y - 6}" width="14" height="14" fill="transparent"/><ellipse cx="${x}" cy="${y}" rx="3.4" ry="2.8" class="f-marble"/><ellipse cx="${x}" cy="${y}" rx="3.4" ry="2.8" class="st" stroke-width=".9"/><circle cx="${x}" cy="${y + 1.4}" r="1.2" class="f-marble-dk"/><circle cx="${x - 1.4}" cy="${y - .8}" r=".5" fill="#3a3030"/><circle cx="${x + 1.4}" cy="${y - .8}" r=".5" fill="#3a3030"/>`);
      const dx = (x - CX) / 800 * 6;
      const d = `M${x} ${y + 2} Q${f1(x + dx * 1.4)} ${f1(y + 4 + L * .15)} ${f1(x + dx)} ${f1(y + 2 + L)}`;
      under += d + ' '; top += d + ' ';
      spl += `M${f1(x + dx - 5)} ${f1(y + 2 + L)} q5 -6 10 0 `;
      heads.push({ el: h, x, y, ti, L, dx });
    });
    // 水柱：底下一道深藍描邊，上面一道會流動的淺色跑針
    el('path', { d: under, class: 'spout-u', 'stroke-width': ti === 0 ? 4.4 : 3.8 }, sg);
    el('path', { d: top, class: 'spout', 'stroke-width': ti === 0 ? 2.6 : 2.2 }, sg);
    el('path', { d: spl, style: 'stroke:#e8f6ff', fill: 'none', 'stroke-width': 1.6, 'stroke-dasharray': '2 2' }, sg);
  });
}
// 中央御路台階：兩側踏步＋中間雕雲龍的大石（御路石）
function drawStairs() {
  const g = $('stairs');
  let s = '';
  s += patch(R(STAIR[0], 352, STAIR[1] - STAIR[0], GY - 352), 'f-marble', null, null);
  let steps = '';
  for (let y = 356; y < GY; y += 5) steps += `M${STAIR[0] + 8} ${y} H${STAIR[1] - 8} `;
  s += `<path d="${steps}" class="s-marble-dk" stroke-width="1" stroke-dasharray="6 2.5"/>`;
  // 每一層的平台

  // 御路石：雲龍浮雕
  s += patch(R(CX - 30, 354, 60, GY - 354), 'f-marble-sh', null, 'st');

  s += `<path d="M${CX - 18} 380 q10 -12 22 -2 q8 8 -4 10 q-10 0 -6 -8 M${CX - 14} 418 q12 -10 24 2 q6 8 -6 8 M${CX - 16} 452 q14 -10 26 0" class="s-marble-dk" stroke-width="1.6" stroke-dasharray="3 1.6"/>`;
  // 兩側的垂帶與欄杆
  [STAIR[0], STAIR[1]].forEach((x, i) => {

    for (let y = 356; y < GY - 4; y += 18) s += `<circle cx="${x + (i ? 4 : -4)}" cy="${y}" r="2.6" class="f-marble-sh"/>`;
  });
  frag(g, `<g filter="url(#appl)">${s}</g>`);
  // 青綠山水投影（上元之夜）：裁切在三層台壁上
  const cp = $('faceClip');
  TIERS.forEach((T, i) => {
    const y1 = i === 0 ? T.face[1] : TIERS[i - 1].bal[0] - 4;
    el('rect', { x: T.x0, y: T.bal[1], width: STAIR[0] - T.x0, height: y1 - T.bal[1] }, cp);
    el('rect', { x: STAIR[1], y: T.bal[1], width: T.x1 - STAIR[1], height: y1 - T.bal[1] }, cp);
  });
  const pj = $('projection');
  pj.setAttribute('clip-path', 'url(#faceClip)');
  const strip = el('g', { id: 'projStrip' }, pj);
  for (let k = 0; k < 2; k++) {
    let d = `M${k * 1600} 470`, d2 = `M${k * 1600} 470`;
    for (let x = 0; x <= 1600; x += 40) {
      const y = 405 + Math.sin(x * .011 + 1) * 22 + Math.sin(x * .031) * 10 - (x % 120 === 0 ? 18 : 0);
      d += ` L${k * 1600 + x} ${f1(y)}`;
      d2 += ` L${k * 1600 + x} ${f1(y + 26 + Math.sin(x * .02) * 8)}`;
    }
    d += ` L${(k + 1) * 1600} 470 Z`; d2 += ` L${(k + 1) * 1600} 470 Z`;
    frag(strip, `<g><rect x="${k * 1600}" y="350" width="1600" height="120" style="fill:var(--proj-3)" opacity=".55"/>
      <path d="${d}" style="fill:var(--proj-1)"/><path d="${d}" style="stroke:var(--proj-gold);fill:none" stroke-width="1.6" stroke-dasharray="5 3"/>
      <path d="${d2}" style="fill:var(--proj-2)"/><path d="${d2}" style="stroke:var(--proj-gold);fill:none" stroke-width="1.2" stroke-dasharray="4 3"/></g>`);
    for (let i = 0; i < 6; i++) {
      const x = k * 1600 + i * 270 + 60;
      frag(strip, `<path d="M${x} 396 q8 -8 16 0 q8 -8 16 0 q-6 6 -16 4 q-10 2 -16 -4 Z" style="fill:#ffffff" opacity=".75"/>`);
    }
  }
}

      ${patch('M-13 -4 Q-13 -18 0 -19 Q12 -18 12 -4 Z', 'f-bronze', 'satinA', 'st')}
      <path d="M-9 -8 h18 M-6 -14 h12 M-4 -4 l4 -14 l4 14" class="s-bronze-hi" stroke-width="1"/>
      <g class="head"><path d="M10 -10 Q16 -16 18 -22 Q22 -24 22 -18 Q20 -12 12 -8 Z" class="f-bronze"/><circle cx="19" cy="-20" r="1" style="fill:var(--thread-gold)"/><path d="M18 -24 l-2 -4 M21 -24 l1 -4" class="s-bronze" stroke-width="1.2"/></g></g></g>`);

/* ---------------- ② 場景：弘義閣（左）、體仁閣（右） ----------------
   兩座兩層的閣樓，坐在廣場東西兩側的台基上，下層紅牆、上層一圈窗，單簷廡殿頂。 */
const pavLanterns = [];
function drawPavilions() {
  const g = $('sidePav');

    let s = '';
    s += patch(R(cx - hw - 8, 448, hw * 2 + 16, 34), 'f-marble', null, 'st');

    s += patch(R(cx - hw + 6, 384, hw * 2 - 12, 64), 'f-wall', 'satinV', 'st');
    for (let x = cx - hw + 10; x <= cx + hw - 10; x += (hw * 2 - 20) / 6) s += `<path d="${R(x - 3, 384, 6, 64)}" class="f-col"/>`;
    for (let i = 0; i < 6; i++) {
      const a = cx - hw + 10 + i * (hw * 2 - 20) / 6 + 4, w = (hw * 2 - 20) / 6 - 8;
      if (i === 2 || i === 3) s += `<path d="${R(a, 396, w, 52)}" fill="url(#lingHua)"/><path d="${R(a, 396, w, 52)}" class="st-gold"/>`;
      else s += `<path d="${R(a, 398, w, 24)}" fill="url(#lingHua)"/>`;

    frag(g, `<g>${s}</g>`);
    // 腰簷

    let t = '';
    for (let x = cx - hw - 14; x <= cx + hw + 14; x += 7) t += `M${x} 352 V378`;
    frag(g, `<g><path d="${md}" class="f-roof"/><path d="${t}" class="s-roof-dk" stroke-width="1.4" stroke-dasharray="4 2" clip-path="url(#pc${cx})"/><path d="${md}" fill="url(#satinA)"/><path d="${md}" class="st"/></g>`);
    frag($('scene').querySelector('defs'), `<clipPath id="pc${cx}"><path d="${md}"/></clipPath>`);

/* ---------------- ② 場景：廣場（鋪磚、御道、品級山） ---------------- */
function drawCourt() {
  const g = $('court');
  let s = `<path d="${R(0, GY, 1600, 600 - GY)}" class="f-paving"/>`;

      f.hop -= dt;
      const el2 = 2.4 - f.hop - f.start;
      const k = el2 > 0 && el2 < .35 ? Math.sin(el2 / .35 * Math.PI) : 0;
      if (el2 >= 0 && !f.pl) { f.pl = 1; beastPling(f.k); }
      f.el.setAttribute('transform', `translate(${f1(f.x)} ${f1(f.y - k * 5)})`);
    }
  }));
  // 殿門開關
  door.v += (door.target - door.v) * Math.min(1, dt * 3);
  if (door.t > 0) { door.t -= dt; if (door.t <= 0) door.target = 0; }
  doorL.setAttribute('transform', `scale(${f1(1 - .82 * door.v)} 1)`);
  doorR.setAttribute('transform', `scale(${f1(1 - .82 * door.v)} 1) translate(${f1(-doorR._w)} 0)`);
  throneGlowEl.setAttribute('opacity', f1(door.v));
  // 銅鶴抬頭、銅龜伸頭
  ['craneL', 'craneR', 'turtleL', 'turtleR'].forEach(k => {
    const p = props[k]; p._a = p._a || 0; p._t = Math.max(0, (p._t || 0) - dt);
    p._a += ((p._t > 0 ? 1 : 0) - p._a) * Math.min(1, dt * 4);
    const n = p.querySelector(k.startsWith('crane') ? '.neck' : '.head');
    n.setAttribute('transform', k.startsWith('crane') ? `rotate(${f1(-p._a * 14)} 6 -28)` : `rotate(${f1(-p._a * 16)} 10 -10)`);
  });
  updateWalkers(dt);
  updateStanders(dt);
  updateCats(dt);
  updateSparrows(dt);
  updateBirds(dt);
  updateParts(dt);
  // 拍照的閃光
  if (flashes.length) for (let i = flashes.length - 1; i >= 0; i--) { const f = flashes[i]; f.t += dt; f.el.setAttribute('opacity', f1(Math.max(0, 1 - f.t / .35))); if (f.t > .35) { f.el.remove(); flashes.splice(i, 1); } }
  // 人物前後排序（腳底 y）
  if (clock - lastSort > .5) { lastSort = clock; sortPeople(); }
  void sunF;
}
const door = { v: 0, target: 0, t: 0 };
const flashes = [];
function camFlash(x, y) { flashes.push({ el: el('circle', { cx: f1(x), cy: f1(y), r: 9, style: 'fill:#ffffff', opacity: 1 }, $('fx')), t: 0 }); }

/* ---------------- ⑤ 互動：對話泡泡（縫在布上的小標籤） ---------------- */
function say(x, y, text, dur = 1.6) {
  const g = el('g', { class: 'bubble' }, $('bubbles'));
  const inner = el('g', { class: 'pop', style: `--dur:${dur}s` }, g);
  const t = el('text', { x: 0, y: 0 }, inner);
  t.textContent = text;
  const w = Math.max(44, (t.getComputedTextLength() || text.length * 15) + 26);
  const r = el('rect', { x: f1(-w / 2), y: -15, width: f1(w), height: 30, rx: 6 });
  inner.insertBefore(r, t);
  x = clamp(x, w / 2 + 16, 1600 - w / 2 - 16); y = clamp(y, 30, 570);
  g.setAttribute('transform', `translate(${f1(x)} ${f1(y)})`);
  setTimeout(() => g.remove(), dur * 1000);
}

/* ---------------- 動畫迴圈 ---------------- */
let last = 0, rafId = 0;
function loop(now) {
  const dt = clamp((now - last) / 1000, 0, .05); last = now;
  step(dt);
  rafId = requestAnimationFrame(loop);
}
// 減少動態：只畫靜止畫面；互動時快轉一小段再停住
function settle(sec) { for (let s = 0; s < sec; s += .05) step(.05); }
function renderStill() { step(.0001); }
function start() {
  cancelAnimationFrame(rafId);
  if (reduced) { T.auto = false; syncAuto(); applyTime(true); settle(1.5); }
  else { last = performance.now(); rafId = requestAnimationFrame(loop); }
}

/* ---------------- 開始：依序畫出場景、角色 ---------------- */
makeLinen();
drawSky();
drawBackHalls();
drawHall();
drawProps();
drawTiers();
drawStairs();
drawPavilions();
drawCourt();
drawSnow();
drawCats();
drawPeople();
drawPerched();
drawSparrows();

/* ---------------- ⑤ 互動：點擊 ---------------- */
function onAct(node, fn) {
  node.addEventListener('click', e => { e.stopPropagation(); userGesture = true; ensureAudio(); fn(e); if (reduced) settle(.8); });
  node.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); userGesture = true; ensureAudio(); fn(e); if (reduced) settle(.8); } });
}
function svgPoint(e) {
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
svg.addEventListener('pointerdown', () => { userGesture = true; ensureAudio(); document.body.classList.remove('kbd'); });
window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
svg.addEventListener('pointermove', e => {
  const p = svgPoint(e);
  mouse.x = p.x; mouse.y = p.y; mouse.t = clock;
  const sx = clamp((p.x - 800) / 800, -1, 1);
  $('parSky').setAttribute('transform', `translate(${f1(-sx * 14)} 0)`);
});
svg.addEventListener('pointerleave', () => { mouse.t = -99; });
// 天空：白天鴿群（帶鴿哨）、夜晚流星、雷雨時打雷
onAct($('skyHit'), e => {
  const p = e.clientX ? svgPoint(e) : { x: 800 };
  if (wx.storm > .5) { strike(p.x); return; }
  if (night > .6) { meteor(); softTick(); return; }
  if (flyers.filter(f => f.kind === 'pigeon').length > 20) return;
  spawnFlock('pigeon', 11, { dir: p.x < 800 ? 1 : -1 });
  pigeonWhistle();
});
onAct($('sun'), () => goTo(20.5 / 24));
onAct($('moon'), () => goTo(10 / 24));
// 太和殿：殿門打開，看見金色寶座
onAct($('hallHit'), () => {
  door.target = 1; door.t = 4;
  bellChord();
  say(800, 214, pick(['太和殿：皇帝登基、大婚都在這裡', '俗稱「金鑾殿」，殿裡是金漆雕龍寶座', '面闊十一間，是紫禁城最大的殿']), 2.2);
});
// 脊獸：從仙人開始一隻接一隻跳起來
beastGroups.forEach((bg, gi) => onAct(bg.el, () => {
  // 第 k 隻在 0.2＋k×0.16 秒後跳起來
  bg.figs.forEach((f, k) => { f.k = k; f.hop = 2.4; f.start = .2 + k * .16; f.pl = 0; });
  const [x, y] = [bg.figs[5].x, bg.figs[5].y];
  say(x, y - 30, pick(['仙人騎鳳，後面跟著十隻脊獸', '第十隻「行什」只有太和殿才有', '龍、鳳、獅子、天馬、海馬……']), 2.2);
}));
// 銅鶴、銅龜：抬頭鳴叫，嘴裡冒出香煙
[['craneL', 605, 295], ['craneR', 995, 295], ['turtleL', 658, 331], ['turtleR', 942, 331]].forEach(([k, mx, my]) => onAct(props[k], () => {
  props[k]._t = 2.2;
  if (k.startsWith('crane')) { craneCall(); say(mx, my - 30, '銅鶴：象徵長壽', 1.6); }
  else { sizzleSmoke(); say(mx, my - 30, '銅龜：龍頭龜身，象徵江山永固', 1.8); }
  setTimeout(() => puff(mx, my - (k.startsWith('crane') ? 4 : 0), 7), 350);
}));
// 日晷：用時辰報時
onAct(props.sd, () => {
  const h = T.t * 24;
  const names = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
  const i = Math.floor(((h + 1) % 24) / 2);
  softTick();
  if (night > .6) say(1025, 290, '沒有太陽，日晷看不出時間', 1.8);
  else if (wx.storm > .5 || wx.snow > .5) say(1025, 290, '陰天沒影子，日晷休息中', 1.8);
  else say(1025, 290, `日晷：現在是${names[i]}時`, 1.8);
});
onAct(props.jl, () => { softTick(); say(575, 290, '嘉量：乾隆年間的標準量器', 1.9); });
// 鎏金銅缸：門海
[['vatL', 526], ['vatR', 1074]].forEach(([k, x]) => onAct(props[k], () => {
  vatDong();
  say(x, 300, wx.snow > .5 ? '冬天以前會在缸下燒炭防結冰' : pick(['門海：儲水防火的大銅缸', '鎏金銅缸，敲起來「噹——」']), 2);
  puff(x, 318, 4);
}));
// 螭首：點一個就吐一道水
heads.forEach(h => onAct(h.el, () => { headSpurt(h); spurt(); if (Math.random() < .3) say(h.x, h.y - 26, '螭首：台基的排水口', 1.5); }));
// 御貓
onAct(cats[0].el, () => { cats[0].stretch = 1.4; meow(); say(330, 380, '喵～（伸懶腰）', 1.4); });
onAct(cats[1].el, () => { meow(.2); const c = cats[1]; c.tx = clamp(c.x + c.dir * rand(120, 220), 60, 1540); c.idle = 3; say(c.x, c.y - 40, '喵！', 1.2); });
onAct(cats[2].el, () => { cats[2].awake = 3.2; meow(.14); say(672, 446, '喵嗚～（打哈欠）', 1.6); });
// 屋脊上的烏鴉
perched.forEach(p => onAct(p.el, () => { crowCaw(2); crowFly(p); }));
// 麻雀
sparrows.forEach(s => onAct(s.el, () => { chirp(); sparrowFlee(s, true); }));
// 夜巡保全
onAct(guardN.el, () => say(guardN.x, 480, '閉館了，明天早上 8:30 再來喔', 1.8));
// 遊客
const LINES = {
  tourist: ['好大的廣場！', '每個屋簷都是黃色的耶', '來，拍一張！'], couple: ['這裡真的好大', '下次下雪再來'], student: ['課本裡的太和殿！', '台階好多層'],
  kid: ['貓咪在哪裡？', '我要看脊獸！'], family: ['寶寶睡著了', '慢慢走'], hanfu: ['穿漢服來拍照', '這個角度最好看'], elder: ['年輕時來過一次', '慢慢逛'],
  selfie: ['自拍一張！', '背景是金鑾殿'], qing: ['格格駕到～', '花盆底鞋好難走'],
  guide: ['這就是太和殿，俗稱金鑾殿！', '大家跟緊小旗子喔', '屋脊上有十隻脊獸'], redcap: ['哎呀，真氣派！', '快幫我拍一張', '導遊等等我'],
  photog: ['再側一點，好！', '光線剛剛好'], model: ['拍好了沒～', '這樣可以嗎？'], hanfuSelfie: ['和大殿一起自拍', '再一張！'],
  mom: ['皇帝登基就在這裡喔', '那些是脊獸'], kidPoint: ['媽媽，那是金鑾殿嗎？', '屋頂上有小動物！'], guard: ['請勿攀爬欄杆', '下午五點閉館'], crowd: ['好美！', '燈全亮了！']
};
$('people').addEventListener('click', e => {
  const pt = svgPoint(e);
  let best = null, bd = 1e9;
  walkers.forEach(w => { if (w.away) return; const d = Math.abs(w.x - pt.x) + Math.abs(WLANES[w.w].y - 30 * w.s - pt.y) * .5; if (d < bd) { bd = d; best = w; } });
  standers.forEach(s => { if (s.pres < .5) return; const d = Math.abs(s.x - pt.x) + Math.abs(s.y - 30 * s.s - pt.y) * .5; if (d < bd) { bd = d; best = s; } });
  if (!best || bd > 44) return;
  e.stopPropagation(); userGesture = true; ensureAudio();
  if (best.w != null) best.stop = 2.2;
  const by = (best.w != null ? WLANES[best.w].y : best.y) - 86 * (best.s || 1);
  const lines = wx.storm > .5 ? ['雨好大，先躲一下', '雷陣雨來得快去得也快'] : wx.snow > .5 ? ['下雪的故宮好美！', '紅牆白雪黃琉璃瓦'] : LINES[best.type] || ['你好！'];
  if (['tourist', 'selfie', 'photog', 'hanfuSelfie', 'crowd', 'redcap'].includes(best.type)) { shutter(); camFlash(best.x + 12 * (best.dir || 1), by + 30); }
  else softTick();
  if (best.type === 'photog' || best.type === 'model') { shutter(); camFlash(props.photog.x + 22, props.photog.y - 36); }
  say(best.x, by, pick(lines), 1.8);
  if (reduced) renderStill();
});

/* ---------------- ⑤ 互動：控制列 ---------------- */
function syncAuto() { $('btnAuto').setAttribute('aria-pressed', String(T.auto)); $('btnAuto').textContent = T.auto ? '自動播放中' : '自動播放'; }
function goTo(t) { if (reduced) { T.t = t; applyTime(true); renderStill(); } else T.target = t; }
function unlock() { userGesture = true; ensureAudio(); }
// 表演：剛解鎖音訊時稍等一下再開始，避免第一個音被吃掉
function later(fn) { setTimeout(() => { fn(); if (reduced) settle(show.kind ? 12 : 2); }, actx && actx.state !== 'running' ? 150 : 0); }
$('btnLantern').addEventListener('click', () => { unlock(); later(() => startLantern()); });
$('btnDragon').addEventListener('click', () => { unlock(); later(() => startDragon()); });
$('btnTour').addEventListener('click', () => {
  unlock();
  if (!isOpen()) { say(800, 470, '閉館了，導覽團明天 8:30 再來', 1.8); return; }
  if (walkers.some(w => w.temp)) { say(800, 470, '導覽團已經在路上了！', 1.4); return; }
  spawnTour();
  softTick();
  setTimeout(() => say(1460, 450, '各位團員，跟緊小旗子喔！', 2), 1500);
  if (reduced) settle(4);
});
$('btnWeather').addEventListener('click', () => {
  unlock();
  if (show.kind === 'dragon') { say(800, 90, '千龍吐水進行中', 1.2); return; }
  setWx((wxI + 1) % WX_LIST.length);
  if (reduced) { for (const k in wx) wx[k] = WX_LIST[wxI][0] === k ? 1 : 0; applyWeather(0); renderStill(); }
});
$('btnSound').addEventListener('click', () => {
  soundOn = !soundOn; userGesture = true;
  $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 音效：開' : '🔇 音效：關';
  if (ensureAudio()) {
    if (!soundOn) { killBus('music'); killBus('sfx'); rainSound(false); gushSound(false); master.gain.cancelScheduledValues(actx.currentTime); master.gain.setValueAtTime(0, actx.currentTime); }
    else master.gain.setTargetAtTime(.32, actx.currentTime, .05);
  }
});
$('btnDay').addEventListener('click', () => goTo(10 / 24));
$('btnNight').addEventListener('click', () => goTo(20.5 / 24));
$('btnAuto').addEventListener('click', () => { T.auto = !T.auto; T.target = null; syncAuto(); });
$('timeRange').addEventListener('input', e => {
  T.t = e.target.value / 1000; T.target = null; T.dragging = true; applyTime(true); T.dragging = false;
  if (reduced) renderStill();
});
mq.addEventListener?.('change', e => { reduced = e.matches; if (!reduced) { T.auto = true; syncAuto(); } start(); });

// 開場：讓遊客、動物先就定位
applyTime(true);
applyWeather(0);
syncAuto();
for (let i = 0; i < 20; i++) step(.05);
start();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.kind,
  btn: { lantern: 'btnLantern', dragon: 'btnDragon' },
  ff: () => { show.bolts = []; show.t = show.end - .02; },
  save: () => ({ T: { ...T }, w: wxI }),
  stop: () => endShow(),
  restore: s => { Object.assign(T, s.T); syncAuto(); if (wxI !== s.w) setWx(s.w); boltT = 4; applyTime(true); renderStill(); }
});
/* /ShowStop */
})();
