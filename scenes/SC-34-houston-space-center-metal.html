<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>德州休士頓太空中心</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-34 德州休士頓太空中心｜金屬感科技風
   地點：德州休士頓的詹森太空中心與休士頓太空中心（遊客中心）。
   畫面：左邊「獨立廣場」——真的 747 太空梭載運機背著太空梭複製機，旁邊有觀景塔；
        中間是火箭公園的展示館，裡面躺著一整枚農神五號（各節分開陳列）；
        館外立著小約翰二號與水星-紅石火箭；右邊是歷史任務控制中心（剖面）。
        前面有遊園電車、德州長角牛牧場（太空中心真的養長角牛）、白尾鹿、
        路燈上的大尾擬八哥、遊客，天上有太空人訓練用的 T-38 噴射機。
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   風格重點：拉絲金屬、鉻面反光、冷光青色 HUD 線條與掃描框、細格線天空。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），部分另有 --k-名稱（晨昏）。
   JS 會依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）。
   ========================================================= */
:root{
  color-scheme: light;

  /* —— 天空、太陽、雲、HUD 線條 —— */
  --d-sky-top:#3d7fc0;  --k-sky-top:#2a3a78;  --n-sky-top:#040916;
  --d-sky-low:#cfe9f6;  --k-sky-low:#f4a462;  --n-sky-low:#0f1d38;
  --d-sun:#fffbea;      --k-sun:#ff9440;      --n-sun:#ff9440;
  --d-cloud:#f4f8fb;    --k-cloud:#f2bc9c;    --n-cloud:#202c48;
  --d-cloud-sh:#aebccb; --k-cloud-sh:#a6768a; --n-cloud-sh:#111a30;
  --d-overcast:#8792a0; --k-overcast:#6c6074; --n-overcast:#0b1222;
  --d-hud:#0a7c9e;      --k-hud:#2aa8c8;      --n-hud:#52f2ff;

  /* —— 遠景：樹林、遠方辦公大樓 —— */
  --d-tree-far:#4b6a58; --k-tree-far:#4a4446; --n-tree-far:#0b1418;
  --d-bldg-far:#a9b8c5; --k-bldg-far:#9e8c9a; --n-bldg-far:#18223a;

  /* —— 地面：草地、廣場、電車道、步道 —— */
  --d-lawn:#7da35a;     --k-lawn:#7e7646;     --n-lawn:#0e1a16;
  --d-lawn-dk:#5f8646;  --n-lawn-dk:#09130f;
  --d-lawn-hi:#a2c676;  --n-lawn-hi:#16241c;
  --d-concrete:#ccd1d6; --k-concrete:#d0ae94; --n-concrete:#262d3a;
  --d-concrete-dk:#9aa2ab; --n-concrete-dk:#181d28;
  --d-road:#48505a;     --n-road:#12151d;
  --d-road-line:#ece2a8;--n-road-line:#6a6648;

  /* —— 金屬（拉絲鋁、鉻）與玻璃 —— */
  --d-metal-hi:#f6f9fc; --k-metal-hi:#ffe2cc; --n-metal-hi:#6c7c94;
  --d-metal:#b8c3cd;    --k-metal:#bc9e9c;    --n-metal:#34405a;
  --d-metal-md:#8c9aa8; --n-metal-md:#26304a;
  --d-metal-dk:#56626f; --n-metal-dk:#121828;
  --d-glass:#9ccbe2;    --k-glass:#eaa98a;    --n-glass:#0f1f3a;
  --d-glass-hi:#e8f7ff; --k-glass-hi:#ffe4cc; --n-glass-hi:#2a4a6c;
  --d-hall-in:#6c7a89;  --n-hall-in:#0d1528;
  --d-hall-floor:#8e9aa6; --n-hall-floor:#1a2236;
  --d-mc-wall:#6e7a88;  --n-mc-wall:#141b2c;
  --d-console:#929eaa;  --n-console:#2a3446;
  --d-console-dk:#606c7a; --n-console-dk:#192030;

  /* —— 太空梭、747、火箭 —— */
  --d-white:#f3f5f8;    --k-white:#ffdcc6;    --n-white:#8892a8;
  --d-tile:#23272e;     --n-tile:#0b0d13;
  --d-stripe:#2b5ba8;   --n-stripe:#1a2a5a;
  --d-rocket:#f1f3f6;   --k-rocket:#ffe0cc;   --n-rocket:#7c879c;
  --d-rocket-blk:#1f2329; --n-rocket-blk:#0a0c12;

  /* —— 動物 —— */
  --d-lh-1:#a4552e;     --n-lh-1:#3a2a26;     /* 長角牛：鏽紅 */
  --d-lh-2:#eadfc4;     --n-lh-2:#5a5650;     /* 長角牛：奶油白 */
  --d-lh-3:#5c3b27;     --n-lh-3:#2a201c;     /* 長角牛：深褐 */
  --d-horn:#efe6cc;     --n-horn:#6a665a;
  --d-deer:#a77a50;     --n-deer:#3a3028;
  --d-egret:#fbfbf6;    --n-egret:#7a7e88;
  --d-grackle:#1a1c26;  --n-grackle:#06070c;

  /* —— 人物與電車 —— */
  --d-s1:#f2c8a2;  --n-s1:#5e5058;   /* 膚色 */
  --d-s2:#c08a5e;  --n-s2:#4a3c3c;
  --d-s3:#7a4e32;  --n-s3:#32282a;
  --d-c1:#e2483a;  --n-c1:#4a2228;   /* 衣服 */
  --d-c2:#f4c43a;  --n-c2:#4e4426;
  --d-c3:#2f7fb0;  --n-c3:#1a2c44;
  --d-c4:#3aa87a;  --n-c4:#183a30;
  --d-c5:#8a5ac8;  --n-c5:#2e2244;
  --d-c6:#f08a4a;  --n-c6:#4a3024;
  --d-c7:#fafafa;  --n-c7:#5a6070;
  --d-c8:#5aa0d8;  --n-c8:#1e3048;   /* 飛行員藍 */
  --d-jeans:#3a5a8a; --n-jeans:#161e30;
  --d-khaki:#c8b48a; --n-khaki:#3e3a30;
  --d-dark:#2a2e36;  --n-dark:#0e1016;
  --d-hat:#c9a272;   --n-hat:#40362c;
  --d-hat2:#5a3a26;  --n-hat2:#241a16;
  --d-hair:#3a2a1e;  --n-hair:#141012;
  --d-pack:#3a4656;  --n-pack:#141a24;
  --d-tree:#3f6a3a;  --k-tree:#465032;  --n-tree:#0a1610;
  --d-trunk:#5a4632; --n-trunk:#14110e;

  /* —— 不隨日夜變化的顏色（燈光、螢幕、HUD 光） —— */
  --moon:#f4f0dc; --star:#ffffff; --lit:#ffd98a; --lamp:#eaf6ff;
  --scr-bg:#06202c; --scr-line:#4ff0ff; --scr-map:#1f7a5c; --scr-amber:#ffb84a; --scr-red:#ff5a4a;
  --flame:#ffb03a; --flame2:#ff6a2a; --flag-r:#c8282e; --flag-b:#1e3a78; --tower-red:#c8382a;
  --rain:#d4e4f0; --flash:#f4f6ff; --bolt:#fff8d0; --fog:#dfe6ea;

  /* —— 頁面介面（金屬控制台） —— */
  --page-bg:#e4e9ee; --page-fg:#16202a; --page-muted:#5a6774;
  --ui-surface:#f5f7f9; --ui-line:#b4c0cb; --ui-accent:#0a7c9e; --ui-hot:#0b4f78; --ui-hot2:#c8642a;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border:1px solid #8a96a2;border-radius:10px;overflow:hidden;background:#0f1d38;line-height:0;
  box-shadow:0 0 0 4px #d6dde3,0 0 0 5px #9aa6b2,0 10px 24px rgba(20,30,45,.18)}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  background:linear-gradient(180deg,#fbfcfd,#e2e8ed);border:1px solid var(--ui-line);border-radius:10px;padding:10px 14px;
  box-shadow:inset 0 1px 0 #fff}
.panel button{font:700 14px/1 var(--font-ui);color:var(--page-fg);
  background:linear-gradient(180deg,#ffffff,#dfe5ea);border:1px solid var(--ui-line);
  border-radius:6px;padding:9px 14px;cursor:pointer;letter-spacing:.04em;box-shadow:inset 0 1px 0 #fff}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:#fff;box-shadow:none}
.panel button.big{border-color:var(--ui-hot);color:#fff;background:linear-gradient(180deg,#1a6a98,var(--ui-hot))}
.panel button.big2{border-color:var(--ui-hot2);color:#fff;background:linear-gradient(180deg,#e07a3a,var(--ui-hot2))}
.panel button.on{background:#f2b23a!important;border-color:#d89a20!important;color:var(--page-fg)!important}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid #52f2ff;outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(220px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 var(--font-mono);color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding:0;list-style:none;color:var(--page-muted);font-size:14px;line-height:1.8;display:flex;flex-wrap:wrap;gap:4px 22px}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .bubble rect{fill:#f6fbff;stroke:#0a7c9e;stroke-width:1.5}
#scene .bubble path{fill:#f6fbff;stroke:#0a7c9e;stroke-width:1.5}
#scene .bubble text{fill:#16202a;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .hudtxt{font:700 13px var(--font-ui);fill:var(--hud)}
#scene .hudmono{font:600 10px var(--font-mono);fill:var(--hud)}
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：天空與 HUD 細格線 → 星星、太陽、月亮 → 國際太空站 → 雲 → 探照燈 → T-38 → 鳥
       → 遠方樹林與辦公大樓 → 地面 → 獨立廣場（觀景塔、747、太空梭）→ 農神五號展示館
       → 火箭公園 → 任務控制中心剖面 → 廣場遊客 → 遊園電車 → 草地（長角牛、鹿、牛背鷺）
       → 圍欄、路燈、大尾擬八哥 → 步道遊客 → 熱浪 → 天氣 → HUD 掃描框、滑鼠準星
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="金屬感科技風的德州休士頓太空中心：左邊一架 747 載運機背著太空梭停在高高的支架上，旁邊是觀景塔；中間長長的展示館裡躺著一整枚農神五號火箭；館外立著兩枚早期火箭；右邊是剖開的任務控制中心，可以看到一排排控制台和大螢幕；前面有遊園電車、長角牛牧場、白尾鹿和遊客，天上有噴射教練機飛過">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-top)"/><stop offset="1" style="stop-color:var(--sky-low)"/>
      </linearGradient>
      <!-- 拉絲金屬：上亮下暗 -->
      <linearGradient id="metalV" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--metal-hi)"/><stop offset=".28" style="stop-color:var(--metal)"/>
        <stop offset=".72" style="stop-color:var(--metal-md)"/><stop offset="1" style="stop-color:var(--metal-dk)"/>
      </linearGradient>
      <!-- 圓柱金屬：左右暗、中間一道鉻亮光 -->
      <linearGradient id="metalH" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" style="stop-color:var(--metal-dk)"/><stop offset=".3" style="stop-color:var(--metal-hi)"/>
        <stop offset=".55" style="stop-color:var(--metal)"/><stop offset="1" style="stop-color:var(--metal-dk)"/>
      </linearGradient>
      <!-- 圓柱體明暗疊層（白色火箭、機身用）：橫躺用 shadeV、直立用 shadeH -->
      <linearGradient id="shadeV" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#000" stop-opacity=".32"/><stop offset=".2" stop-color="#fff" stop-opacity=".55"/>
        <stop offset=".34" stop-color="#fff" stop-opacity="0"/><stop offset=".72" stop-color="#000" stop-opacity=".08"/>
        <stop offset="1" stop-color="#000" stop-opacity=".42"/>
      </linearGradient>
      <linearGradient id="shadeH" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#000" stop-opacity=".38"/><stop offset=".24" stop-color="#fff" stop-opacity=".55"/>
        <stop offset=".38" stop-color="#fff" stop-opacity="0"/><stop offset=".75" stop-color="#000" stop-opacity=".1"/>
        <stop offset="1" stop-color="#000" stop-opacity=".45"/>
      </linearGradient>
      <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset=".35" style="stop-color:var(--cloud)"/><stop offset="1" style="stop-color:var(--cloud-sh)"/>
      </linearGradient>
      <radialGradient id="sunGlow"><stop offset="0" style="stop-color:var(--sun)" stop-opacity=".75"/><stop offset=".45" style="stop-color:var(--sun)" stop-opacity=".22"/><stop offset="1" style="stop-color:var(--sun)" stop-opacity="0"/></radialGradient>
      <radialGradient id="litGlow"><stop offset="0" stop-color="#ffe4a0" stop-opacity=".75"/><stop offset="1" stop-color="#ffe4a0" stop-opacity="0"/></radialGradient>
      <radialGradient id="cyanGlow"><stop offset="0" stop-color="#52f2ff" stop-opacity=".8"/><stop offset="1" stop-color="#52f2ff" stop-opacity="0"/></radialGradient>
      <radialGradient id="fireGlow"><stop offset="0" stop-color="#ffd27a" stop-opacity=".95"/><stop offset=".5" stop-color="#ff7a2a" stop-opacity=".45"/><stop offset="1" stop-color="#ff5a1a" stop-opacity="0"/></radialGradient>
      <linearGradient id="spotGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbe6" stop-opacity=".5"/><stop offset="1" stop-color="#fffbe6" stop-opacity="0"/></linearGradient>
      <linearGradient id="beamGrad" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#cfffff" stop-opacity=".55"/><stop offset="1" stop-color="#cfffff" stop-opacity="0"/></linearGradient>
      <linearGradient id="fogGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--fog)" stop-opacity=".15"/><stop offset=".55" style="stop-color:var(--fog)" stop-opacity=".7"/><stop offset="1" style="stop-color:var(--fog)" stop-opacity=".88"/></linearGradient>
      <linearGradient id="beamTram" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff4c0" stop-opacity=".6"/><stop offset="1" stop-color="#fff4c0" stop-opacity="0"/></linearGradient>
      <!-- 拉絲紋理：細細的水平刮痕，由程式隨機產生 -->
      <pattern id="brushPat" width="320" height="48" patternUnits="userSpaceOnUse"><g id="brushLines"></g></pattern>
      <!-- HUD 冷光 -->
      <filter id="glowF" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <pattern id="rainPat" width="80" height="110" patternUnits="userSpaceOnUse">

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);
      }
      return _conn.call(this, dest, ...a);
    };
  }
  function stopAudio() {
    let longs = [], ctx = null;
    for (const s of srcs) {
      const c = s.context, now = c.currentTime, m = s.__ss; ctx = c;
      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }

      const g = outs.get(ctx), now = ctx.currentTime;
      if (g) {
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 1.1); g.gain.setValueAtTime(0, now + 1.2);
        g.gain.linearRampToValueAtTime(1, now + 1.9);

    }
    srcs.clear();
  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');
    // 凍結色票：把目前的 CSS 變數抄到殘影上，底下換色不影響殘影
    const cs = getComputedStyle(svg);
    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }

    }

    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });
    added = [];
  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>

/* =========================================================

   區塊：①工具與色票

(() => {
'use strict';

/* ---------------- ① 工具 ---------------- */

const DAY_SEC = 150;
const T = { t: 10.07 / 24, auto: true, dragging: false };
let night = 0, dusk = 0, lastColor = -1;
function applyColors(force) {
  const key = Math.round(T.t * 1440);
  if (!force && key === lastColor) return;
  lastColor = key;
  const h = T.t * 24;
  night = clamp(1 - smooth(5.5, 7.1, h) + smooth(18.4, 19.8, h), 0, 1);
  dusk = Math.max(Math.exp(-Math.pow((h - 6.5) / .9, 2)), Math.exp(-Math.pow((h - 18.8) / .9, 2)));
  for (const k in PAIRS) {
    const P = PAIRS[k];
    let c = mix(P.d, P.n, night);
    if (P.k) c = mix(c, P.k, dusk * .9);
    root.style.setProperty('--' + k, rgba(c));
  }
  $('clock').textContent = clockText();
  if (!T.dragging) $('timeRange').value = Math.round(T.t * 1000);
  placeSunMoon();
  $('nightSky').setAttribute('opacity', f1(smooth(.5, 1, night)));
  const ln = smooth(.25, .85, night);
  lits.forEach(L => L.node.setAttribute('opacity', f1(ln * L.k)));
}
function clockText() { const m = Math.floor(T.t * 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
let sunBump = 0, sunPos = { x: 800, y: 100, vis: true };
function placeSunMoon() {
  const h = T.t * 24;
  const sp = (h - 6.2) / 12.8, mp = ((h - 19 + 24) % 24) / 11.2;
  // 太陽從右（東）升起、左（西）落下；德州正午的太陽又白又大
  const sx = 1480 - sp * 1360, sy = 330 - Math.sin(Math.PI * clamp(sp, 0, 1)) * 260 - sunBump;
  const big = 1 + (1 - Math.sin(Math.PI * clamp(sp, 0, 1))) * .35;
  $('sunG').setAttribute('transform', `translate(${f1(sx)} ${f1(sy)}) scale(${f1(big)})`);
  sunPos = { x: sx, y: sy, vis: sp > -.05 && sp < 1.05 };
  $('sunG').style.display = sunPos.vis ? '' : 'none';
  $('moonG').setAttribute('transform', `translate(${f1(1460 - mp * 1320)} ${f1(320 - Math.sin(Math.PI * clamp(mp, 0, 1)) * 230)})`);
  $('moonG').style.display = mp > -.05 && mp < 1.05 ? '' : 'none';
}

let hudNow = null;
function hudScan(b, lines) {
  const g = $('hud'); g.innerHTML = '';

  H.corners = [0, 1, 2, 3].map(() => el('path', { d: '', class: 's-hud', 'stroke-width': 2.2, filter: 'url(#glowF)' }, g));
  H.scan = el('rect', { x: b.x, y: b.y, width: b.w, height: 2, class: 'f-hud', opacity: .7 }, g);
  const w = Math.max(...lines.map(s => s.length)) * 13.5 + 26, h = lines.length * 19 + 14;
  const right = b.x + b.w + 30 + w < 1594;
  const lx = right ? b.x + b.w + 30 : b.x - 30 - w, ly = clamp(b.y - 10, 8, 590 - h);
  H.lead = el('path', { d: `M${right ? b.x + b.w : b.x} ${b.y + 8}L${right ? lx - 8 : lx + w + 8} ${ly + 12}L${right ? lx : lx + w} ${ly + 12}`, class: 's-hud', 'stroke-width': 1.2 }, g);
  H.label = el('g', { opacity: 0 }, g);
  el('rect', { x: lx, y: ly, width: w, height: h, rx: 3, fill: 'rgba(6,20,34,.78)', stroke: '#52f2ff', 'stroke-width': 1 }, H.label);
  el('path', { d: `M${lx} ${ly + 8}L${lx} ${ly}L${lx + 8} ${ly}M${lx + w - 8} ${ly + h}L${lx + w} ${ly + h}L${lx + w} ${ly + h - 8}`, stroke: '#52f2ff', 'stroke-width': 2.4, fill: 'none' }, H.label);
  lines.forEach((s, i) => { const t = el('text', { x: lx + 13, y: ly + 22 + i * 19, style: `font:${i ? 600 : 700} ${i ? 12 : 14}px var(--font-ui);fill:${i ? '#bdf6ff' : '#52f2ff'}` }, H.label); t.textContent = s; });
  hudNow = H;
  sfx('scan');
}
function stepHud(dt) {
  const H = hudNow; if (!H) return;
  H.t += dt;
  const { b } = H, k = smooth(0, .35, H.t), e = (1 - k) * 34, L = 12;
  const pts = [[b.x - e, b.y - e, 1, 1], [b.x + b.w + e, b.y - e, -1, 1], [b.x - e, b.y + b.h + e, 1, -1], [b.x + b.w + e, b.y + b.h + e, -1, -1]];
  pts.forEach(([x, y, sx, sy], i) => H.corners[i].setAttribute('d', `M${f1(x)} ${f1(y + sy * L)}L${f1(x)} ${f1(y)}L${f1(x + sx * L)} ${f1(y)}`));
  H.scan.setAttribute('y', f1(b.y + ((H.t * .9) % 1) * b.h));
  H.scan.setAttribute('opacity', f1(H.t < 2 ? .6 : 0));
  H.label.setAttribute('opacity', f1(smooth(.3, .55, H.t)));
  H.g.setAttribute('opacity', f1(1 - smooth(H.life - .5, H.life, H.t)));
  if (H.t > H.life) { H.g.innerHTML = ''; hudNow = null; }
}

  const SINFO = [['農神五號・第一節 S-IC', '5 具 F-1 引擎', '燃燒約 2.5 分鐘'], ['農神五號・第二節 S-II', '5 具 J-2 引擎', '燃料：液氫＋液氧'], ['農神五號・第三節 S-IVB', '1 具 J-2 引擎', '把太空船推向月球'], ['阿波羅太空船', '指揮艙＋服務艙', '載 3 名太空人，頂端是逃生塔']];
  const SBOX = [[544, 340, 206, 64], [754, 348, 114, 48], [870, 355, 100, 34], [972, 360, 108, 26]];
  stageG.forEach((s, i) => onAct(s, () => { const [x, y, w, h] = SBOX[i]; hudScan({ x, y, w, h }, SINFO[i]); tween(1.4, k => stageGlow[i].setAttribute('opacity', f1(Math.sin(k * Math.PI))), () => { if (!show.on) stageGlow[i].setAttribute('opacity', 0); }); }));
  onAct(ljG, () => hudScan({ x: 1104, y: 246, w: 52, h: 172 }, ['小約翰二號', '用來測試阿波羅', '太空船的逃生系統']));
  onAct(mrG, () => hudScan({ x: 1158, y: 214, w: 30, h: 204 }, ['水星-紅石火箭', '1961 年把美國第一位', '太空人送上太空']));
  onAct(mcG, () => {
    if (!show.on) setScreen((scrMode + 1) % 3);
    crts.forEach(c => c.setAttribute('opacity', 1));
    sfx('console');
    hudScan({ x: 1212, y: 256, w: 368, h: 156 }, ['歷史任務控制中心', '阿波羅 11 號登月', '就在這裡指揮', ['大螢幕：世界地圖', '大螢幕：地球軌道', '大螢幕：月球航線'][scrMode]]);
  });
  trams.forEach(T2 => onAct(T2.g, () => { sfx('tram'); say(T2.x + T2.lane.dir * -100, T2.lane.y - 70, pick(TRAM_TALK), 2); }));
  walkQ.forEach(Q => Q.list.forEach(w => onAct(w.P.g, () => { w.stopT = 2.2; camFlash(w.x + Q.dir * 8, Q.y - 26); sfx('shutter'); say(w.x, Q.y - 70, pick(PEOPLE_TALK)); })));
  standers.forEach(s => onAct(s.P.g, () => { camFlash(s.x + s.d * 6, s.y - 22); sfx('shutter'); say(s.x, s.y - 62, pick(PEOPLE_TALK)); }));
  longhorns.forEach(L => onAct(L.g, () => { L.toss = 1.2; L.graze = 0; sfx('moo'); }));
  egrets.forEach(E => onAct(E.g, () => { if (E.fly <= 0) { E.fly = 2.4; sfx('flap'); } }));
  deers.forEach(D => onAct(D.g, () => { if (D.bound > 0) return; D.bound = 1; D.tx = D.x - D.range[0] > D.range[1] - D.x ? D.range[0] : D.range[1]; sfx('hooves'); }));
  grackles.forEach(G => onAct(G.g, () => { if (G.fly > 0) return; G.puff = .6; setTimeout(() => G.fly = 2.2, 500); sfx('whistle'); }));
  onAct(jets.g, () => { jets.roll = 1.2; sfx('jet'); });
  svg.addEventListener('pointermove', e => { const p = svgPoint(e); mouse.x = p.x; mouse.y = p.y; mouse.in = e.pointerType === 'mouse'; });
  svg.addEventListener('pointerleave', () => { mouse.in = false; });

  $('btnShow').addEventListener('click', () => startShow());
  $('btnJets').addEventListener('click', () => { userGesture = true; ensureAudio(); startJets(); });
  $('btnWeather').addEventListener('click', () => { userGesture = true; ensureAudio(); setWeather((wxIdx + 1) % WX.length); if (WX[wxIdx][0] === 'fog') sfx('wind'); });
  $('btnSound').addEventListener('click', () => {
    soundOn = !soundOn; userGesture = true; ensureAudio();
    if (master) master.gain.setValueAtTime(soundOn ? .55 : 0, actx.currentTime);
    if (!soundOn) { stopAll(); rainSound(false); try { window.sceneMusic && window.sceneMusic.stop(); } catch (e) {} } else rainSound(WX[wxIdx][0] === 'storm');
    $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  });
  $('btnDay').addEventListener('click', () => setTime(10));
  $('btnDusk').addEventListener('click', () => setTime(18.7));
  $('btnNight').addEventListener('click', () => setTime(21.5));
  $('btnAuto').addEventListener('click', () => { T.auto = !T.auto; $('btnAuto').setAttribute('aria-pressed', String(T.auto)); });
  const tr = $('timeRange');
  tr.addEventListener('input', () => { T.dragging = true; T.t = tr.value / 1000; applyColors(true); });
  tr.addEventListener('change', () => { T.dragging = false; });
  window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
  window.addEventListener('pointerdown', () => document.body.classList.remove('kbd'));
  mq.addEventListener && mq.addEventListener('change', () => { reduced = mq.matches; });
}

/* ---- 熱浪線條 ---- */
function drawShimmer() {
  const g = $('shimmer');
  for (let i = 0; i < 26; i++) { const x = srand(20, 1580), y = srand(424, 440); el('path', { d: `M${f1(x)} ${f1(y)}c4 -6 -4 -10 0 -16c4 -6 -4 -10 0 -16`, stroke: '#fff', 'stroke-width': 1.2, fill: 'none', opacity: .6 }, g); }
}

/* ---------------- 初始化 ---------------- */
function init() {
  drawBrush();
  drawSky();
  drawFar();
  drawGround();
  drawIndependence();
  drawHall();
  drawPark();
  drawMC();
  drawStanders();
  makeTram(tramLanes[0]); makeTram(tramLanes[1]);
  trams[0].x = 1300; trams[1].x = 300;
  drawFenceLampsTree();
  drawAnimals();
  drawWalkers();
  drawJets();
  drawShimmer();
  drawReticle();
  setScreen(0);
  bindAll();
  if (reduced) { T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false'); }
  setWeather(0);
  applyColors(true);
  step(1 / 60);
  requestAnimationFrame(loop);
}
init();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on,
  btn: 'btnShow',
  ff: () => { show.t = show.len; },
  save: () => ({ t: T.t, auto: T.auto }),
  stop: () => endShow(),
  restore: s => { T.t = s.t; T.auto = s.auto; $('btnAuto') && $('btnAuto').setAttribute('aria-pressed', String(T.auto)); applyColors(true); }
});
/* /ShowStop */
})();
</script>
