<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聖托里尼伊亞的風車夕陽</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-64 希臘・聖托里尼伊亞｜扁平插畫 flat illustration
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   --d-名稱 = 白天、--n-名稱 = 夜晚、--k-名稱 = 黃昏（可省略）。
   JS 依時間自動混色，輸出成 --名稱，並產生 .f-名稱（填色）、.s-名稱（線色）兩種 class。
   沒有 d/n 成對的（例如 --glow）是固定色。
   ========================================================= */
:root{
  /* —— 天空 —— */
  --d-skyT:#5fb4e6;  --n-skyT:#0b1636;  --k-skyT:#6d6cb2;
  --d-skyB:#d3ecf7;  --n-skyB:#2b2f5e;  --k-skyB:#ffb070;
  --d-cloud:#ffffff; --n-cloud:#39416e; --k-cloud:#ffcfb4;
  --d-cloudSh:#e3eef5; --n-cloudSh:#2e3561; --k-cloudSh:#f3a98f;

  /* —— 愛琴海與遠方的提拉夏島 —— */
  --d-sea:#1f78b4;   --n-sea:#0d1838;  --k-sea:#4a5f9c;
  --d-seaLt:#5fb3e0; --n-seaLt:#233466; --k-seaLt:#ffb877;   /* 波光、反光 */
  --d-seaDk:#16649c; --n-seaDk:#0a122c; --k-seaDk:#34467e;
  --d-isl:#a08679;   --n-isl:#262141;  --k-isl:#a5685f;      /* 提拉夏島崖面 */
  --d-islDk:#7d675d; --n-islDk:#1b1732; --k-islDk:#7c4a50;
  --d-islTop:#f4f0e6; --n-islTop:#3b3b5e;

  /* —— 火山口斷崖（上層白色浮石、下面紅、褐、黑色岩層） —— */
  --d-cliffP:#eadfca; --n-cliffP:#3b3652; --k-cliffP:#f6c9a0;
  --d-cliffR:#b5583f; --n-cliffR:#3a2131; --k-cliffR:#c55a3c;
  --d-cliffR2:#cd7a52; --n-cliffR2:#472737; --k-cliffR2:#dc7a4c;
  --d-cliffD:#74503f; --n-cliffD:#291b29;
  --d-cliffB:#40322f; --n-cliffB:#17121e;

  /* —— 白屋與藍頂 —— */
  --d-wall:#fbfaf6;  --n-wall:#6d7397; --k-wall:#ffe0c4;     /* 石灰白牆：黃昏會染成杏桃色 */
  --d-wallSh:#dde3eb; --n-wallSh:#4c5277; --k-wallSh:#f0b996;
  --d-dome:#1f5fae;  --n-dome:#1c2d60;
  --d-domeLt:#4b88d0; --n-domeLt:#2b407e;
  --d-domeDk:#154a8a; --n-domeDk:#121f47;
  --d-door:#2f6db5;  --n-door:#1f3561;
  --d-doorG:#2c8f88; --n-doorG:#1a4247;
  --d-doorR:#8f3b3b; --n-doorR:#3d2030;
  --d-win:#2a3346;   --n-win:#1a1d33;
  --d-shut:#3a7cc4;  --n-shut:#22396a;
  --d-ochre:#e8b75b; --n-ochre:#5c4a3d; --k-ochre:#f2a75a;
  --d-pink:#f0aea3;  --n-pink:#5a3e53;
  --d-terra:#d98860; --n-terra:#5a3641;
  --d-peach:#f7d2a2; --n-peach:#5f4c4f;
  --d-pool:#3cc8d8;  --n-pool:#164d6a;
  --d-poolDk:#20a2bb; --n-poolDk:#103a55;
  --d-lane:#f1eee6;  --n-lane:#4a4f70;  --k-lane:#f6d6bb;     /* 大理石步道 */
  --d-laneLn:#d6d0c1; --n-laneLn:#393d5c;
  --d-floor:#ebe4d8; --n-floor:#3e4361;  --k-floor:#f3cfb0;
  --d-bougain:#d8327e; --n-bougain:#562245;                  /* 九重葛 */
  --d-bougainLt:#f06aa3; --n-bougainLt:#77305f;
  --d-leaf:#4e8a3e;  --n-leaf:#1b3329;
  --d-wood:#8a5a3a;  --n-wood:#33242a;
  --d-thatch:#b38a55; --n-thatch:#40342e;                     /* 風車的木頂 */
  --d-stone:#d3b58a; --n-stone:#4a3f45; --k-stone:#e5a26c;     /* 城堡遺跡石牆 */
  --d-stoneDk:#ae9068; --n-stoneDk:#372e38;

  /* —— 船 —— */
  --d-boatW:#fdfdfb; --n-boatW:#7a809f;
  --d-boatR:#d0473a; --n-boatR:#5a2530;
  --d-boatB:#2f6db5; --n-boatB:#1f3561;
  --d-boatY:#f0c03a; --n-boatY:#6a5a30;
  --d-boatG:#3f9a6a; --n-boatG:#1f4338;
  --d-hull:#7a4a30;  --n-hull:#2d1f26;
  --d-sailR:#b8442f; --n-sailR:#4a2230;
  --d-sailW:#f6f1e4; --n-sailW:#6a6f8e; --k-sailW:#ffd5b4;
  --d-rope:#5a4a3e;  --n-rope:#2a2430;

  /* —— 動物 —— */
  --d-donkey:#8e8075; --n-donkey:#3d3640;
  --d-donkeyDk:#655a52; --n-donkeyDk:#2a2530;
  --d-donkeyLt:#ddd3c7; --n-donkeyLt:#5e5866;
  --d-cat1:#e39a4c;  --n-cat1:#5a3d33;
  --d-cat2:#3b3638;  --n-cat2:#16141c;
  --d-cat3:#f2efe9;  --n-cat3:#6a6c84;
  --d-gull:#ffffff;  --n-gull:#9aa0c0;

  /* —— 人物 —— */
  --d-skin1:#f3d4b7; --n-skin1:#9a8c9e;
  --d-skin2:#d4a179; --n-skin2:#7d6a7c;
  --d-skin3:#8d6145; --n-skin3:#55465a;
  --d-hair1:#2b2327; --n-hair1:#14152a;
  --d-hair2:#6e4a30; --n-hair2:#3a2e3c;
  --d-hair3:#d8c9a8; --n-hair3:#7a7a90;
  --d-hair4:#c06a34; --n-hair4:#5c3a3a;
  --d-coat1:#e2574c; --n-coat1:#6e3245;
  --d-coat2:#3f7fc6; --n-coat2:#2a3f6e;
  --d-coat3:#f0bf45; --n-coat3:#76643e;
  --d-coat4:#5fae86; --n-coat4:#2f5050;
  --d-coat5:#9b6cba; --n-coat5:#4d3a6a;
  --d-coat6:#f5a7b8; --n-coat6:#7a5577;
  --d-coat7:#2f3b52; --n-coat7:#1d2440;
  --d-coat8:#f7f3ea; --n-coat8:#7d829c;
  --d-pants1:#33384f; --n-pants1:#151a30;
  --d-pants2:#b79f7d; --n-pants2:#4c4350;
  --d-pants3:#5b7fa8; --n-pants3:#2a3a5c;
  --d-black:#2a2628; --n-black:#121018;
  --d-tray:#c9cdd3;  --n-tray:#5a5e74;

  /* —— 固定色（燈光、天體、特效） —— */
  --glow:#ffd98a;      /* 窗光 */
  --lamp:#ffe7a8;      /* 壁燈、串燈 */
  --poolN:#5ff0ff;     /* 夜裡泳池的水下燈 */
  --flood:#fff3d6;     /* 教堂夜間泛光 */
  --sun:#ffd166; --sunCore:#fff1c2; --moon:#f7f0d4; --star:#fff6da;
  --rainc:#8ea2bb;
  --petal1:#f06aa3; --petal2:#ffffff; --petal3:#ffd1e2; --rice:#fffaf0;
  --flash:#ffffff;

  /* —— 頁面介面 —— */
  --page-bg:#f6f3ec; --page-fg:#1f2d44; --page-muted:#5f6a7c;
  --ui-surface:#ffffff; --ui-line:#d8dde6; --ui-accent:#1f5fae; --ui-accent-2:#d8327e;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:14px;overflow:hidden;background:var(--skyB,#d3ecf7);line-height:0;box-shadow:0 6px 24px rgba(31,45,68,.14)}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:var(--ui-surface);border:1.5px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--page-fg);border-color:var(--page-fg);color:var(--ui-surface);font-weight:700}
.panel button.big{background:var(--ui-accent);border-color:var(--ui-accent);color:#fff;font-weight:700}
.panel button.big.alt{background:var(--ui-accent-2);border-color:var(--ui-accent-2)}
.panel button.big.on{background:var(--page-fg);border-color:var(--page-fg)}
.panel button:focus-visible,.panel input:focus-visible{outline:2px dashed var(--ui-accent);outline-offset:3px}
/* 畫面內可點物件：滑鼠點不顯示外框，用鍵盤 Tab 時才顯示 */
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px dashed var(--ui-accent);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 共用 ---------- */
#scene .clickable,#scene [role="button"]{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .bubble rect,#scene .bubble path{fill:#ffffff;stroke:#1f2d44;stroke-width:1.6}
#scene .bubble text{fill:#1f2d44;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
@media (prefers-reduced-motion:reduce){ *{scroll-behavior:auto!important;transition:none!important} }
</style>
</head>
<body>
<main class="wrap">
  <figure class="stage">
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="聖托里尼伊亞：白牆藍頂的村莊沿著火山口斷崖層層往下，崖頂有風車和城堡遺跡，愛琴海上夕陽西下，崖下是阿姆迪漁港">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--skyT)"/><stop offset=".55" stop-color="var(--skyB)"/>
      </linearGradient>
      <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--seaLt)"/><stop offset=".12" stop-color="var(--sea)"/><stop offset="1" stop-color="var(--seaDk)"/>
      </linearGradient>
      <radialGradient id="sunGlow"><stop offset="0" stop-color="var(--sun)" stop-opacity=".65"/><stop offset="1" stop-color="var(--sun)" stop-opacity="0"/></radialGradient>
      <radialGradient id="warmGlow"><stop offset="0" stop-color="var(--glow)" stop-opacity=".85"/><stop offset="1" stop-color="var(--glow)" stop-opacity="0"/></radialGradient>
      <radialGradient id="poolGlow"><stop offset="0" stop-color="var(--poolN)" stop-opacity=".7"/><stop offset="1" stop-color="var(--poolN)" stop-opacity="0"/></radialGradient>
      <clipPath id="clipSky"><rect x="0" y="0" width="1600" height="331"/></clipPath>
      <clipPath id="clipCliff"><path id="cliffClipPath" d=""/></clipPath>
    </defs>

    <!-- ===== 場景：天空 ===== -->
    <rect x="0" y="0" width="1600" height="600" fill="url(#skyGrad)"/>
    <ellipse id="duskGlow" cx="1250" cy="330" rx="520" ry="200" fill="url(#sunGlow)" opacity="0" class="noHit"/>
    <g id="stars" class="noHit"></g>
    <g id="moon" role="button" tabindex="0" aria-label="月亮" class="clickable"></g>
    <g clip-path="url(#clipSky)"><g id="sun" role="button" tabindex="0" aria-label="太陽" class="clickable"></g></g>
    <g id="clouds" class="noHit"></g>
    <g id="sky" class="noHit"></g>

    <!-- ===== 場景：遠景島嶼、海 ===== -->
    <g id="far"></g>
    <rect id="seaRect" x="0" y="330" width="1600" height="270" fill="url(#seaGrad)"/>
    <g id="seaFx" class="noHit"></g>
    <g id="boatsFar"></g>
    <g id="boatsMid"></g>
    <g id="ripples" class="noHit"></g>
    <g id="bay"></g>

    <!-- ===== 場景：斷崖與村莊 ===== -->
    <g id="cliff"></g>
    <g id="village"></g>
    <g id="donkeys"></g>
    <g id="port"></g>
    <g id="crowd"></g>
    <g id="lane"></g>
    <g id="walkB"></g>
    <g id="dancers"></g>
    <g id="walkF"></g>
    <g id="fore"></g>

    <!-- ===== 特效 ===== -->
    <g id="petals" class="noHit"></g>
    <g id="rain" class="noHit"></g>
    <rect id="wxDim" class="noHit" x="0" y="0" width="1600" height="600" fill="#5d6878" opacity="0"/>
    <g id="fx" class="noHit"></g>
    <g id="bubbles" class="noHit"></g>
  </svg>
  </figure>

  <!-- ===== 互動：控制列 ===== -->
  <div class="panel">
    <button id="btnSunset" class="big" type="button">🌅 伊亞夕陽</button>
    <button id="btnWed" class="big alt" type="button">💒 藍頂教堂婚禮</button>
    <button id="btnWeather" type="button">天氣：晴</button>
    <button id="btnSound" type="button" aria-pressed="true">🔊 聲音：開</button>
    <button id="btnDay" type="button">☀ 白天</button>
    <button id="btnNight" type="button">☾ 夜晚</button>
    <button id="btnAuto" type="button" aria-pressed="true">自動播放</button>
    <label class="timebox" for="timeRange">
      <span>時間</span>
      <input id="timeRange" type="range" min="0" max="1000" value="458">
      <span class="clock" id="clock">11:00</span>
    </label>
  </div>
  <ul class="hint">
    <li><b>伊亞夕陽</b>：太陽沉進愛琴海，城堡上的人群鼓掌。</li>
    <li><b>藍頂教堂婚禮</b>：鐘聲響起，新人出場，賓客跳起圍圈舞。</li>
    <li><b>點一點</b>：風車、教堂鐘樓、驢子、貓、船、泳池、酒館、畫家、行人。</li>
    <li><b>滑鼠</b>：掠過九重葛飄花瓣、劃過海面起漣漪；點天空有海鷗或流星。</li>
    <li><b>天氣</b>：晴、多雲、強風、冬雨輪流切換。</li>
  </ul>
</main>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);
      }
      return _conn.call(this, dest, ...a);
    };
  }
  function stopAudio() {
    let longs = [], ctx = null;
    for (const s of srcs) {
      const c = s.context, now = c.currentTime, m = s.__ss; ctx = c;
      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }
    if (longs.length && ctx) {
      const g = outs.get(ctx), now = ctx.currentTime;
      if (g) {
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 1.1); g.gain.setValueAtTime(0, now + 1.2);
        g.gain.linearRampToValueAtTime(1, now + 1.9);
      }
      longs.forEach(s => { try { s.stop(now + 1.15); } catch (e) {} srcs.delete(s); });
    }
    srcs.clear();
  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');
    // 凍結色票：把目前的 CSS 變數抄到殘影上，底下換色不影響殘影
    const cs = getComputedStyle(svg);
    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }
      }
    }
    const par = svg.parentElement;
    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });
    added = [];
  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>
/* =========================================================
   SC-64 聖托里尼伊亞的風車夕陽｜程式區
   區塊：①工具與色票 ②場景（天空、提拉夏島、海、斷崖、村莊、教堂、風車、城堡、阿姆迪漁港、步道、前景露台）
         ③角色（行人、驢隊、貓、船、海鷗、跳舞的賓客）
         ④動畫（日夜、天氣、花瓣、漣漪、兩場表演）
         ⑤互動（點擊、滑鼠、聲音、控制列）
   ========================================================= */
(() => {
'use strict';

/* ---------------- ① 工具與色票 ---------------- */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const root = document.documentElement;
const svg = $('scene');
const DAY_SEC = 160;            // 自動播放時一天幾秒
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
let seed = 20261164;            // 固定亂數：每次開啟構圖一樣
const srand = (a = 0, b = 1) => { seed = (seed * 16807) % 2147483647; return a + (seed / 2147483647) * (b - a); };
const spick = a => a[Math.floor(srand(0, a.length - .001))];
const f1 = n => (+n).toFixed(1);
function el(tag, attrs = {}, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function frag(parent, html) { parent.insertAdjacentHTML('beforeend', html); return parent.lastElementChild; }

// 讀取色票、依日夜內插混色
const css = n => getComputedStyle(root).getPropertyValue(n).trim();
const hex = h => {
  h = h.replace('#', '');
  if (h.length === 3) h = [...h].map(c => c + c).join('');
  const n = parseInt(h.slice(0, 6), 16);
  return [n >> 16 & 255, n >> 8 & 255, n & 255, 1];
};
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgba = c => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${(c[3] ?? 1).toFixed(3)})`;
const PAIRS = {};
(() => {
  const names = [];
  for (const sheet of document.styleSheets) {
    try { for (const r of sheet.cssRules) if (r.selectorText === ':root') for (const p of r.style) if (p.startsWith('--d-')) names.push(p.slice(4)); } catch (e) {}
  }
  let cls = '';
  names.forEach(k => {
    const k2 = css('--k-' + k);
    PAIRS[k] = { d: hex(css('--d-' + k)), n: hex(css('--n-' + k)), k: k2 ? hex(k2) : null };
    cls += `#scene .f-${k}{fill:var(--${k})}#scene .s-${k}{stroke:var(--${k});fill:none}`;
  });
  const st = document.createElement('style'); st.textContent = cls; document.head.appendChild(st);
})();

const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
let reduced = mq.matches;

/* ---------------- ② 場景：斷崖稜線（村莊、風車都沿著它擺放） ---------------- */
// 崖頂稜線：左邊最高，往右（西邊的岬角）慢慢降低
const ridge = x => x <= 900 ? 150 + x * .14 : 276 + (x - 900) * .13;
const LANE_TOP = 450, LANE_BOT = 505;          // 大理石主街
const HORIZON = 330;

/* ---------------- ② 場景：天空（星星、太陽、月亮、雲） ---------------- */
const stars = [], clouds = [];
function cloudShape(w) {
  // 扁平雲：平底＋三顆圓
  const h = w * .32;
  return `<rect x="0" y="${f1(-h * .45)}" width="${f1(w)}" height="${f1(h * .45)}" rx="${f1(h * .22)}" class="f-cloud"/>
    <circle cx="${f1(w * .3)}" cy="${f1(-h * .45)}" r="${f1(h * .42)}" class="f-cloud"/>
    <circle cx="${f1(w * .58)}" cy="${f1(-h * .55)}" r="${f1(h * .55)}" class="f-cloud"/>
    <circle cx="${f1(w * .8)}" cy="${f1(-h * .4)}" r="${f1(h * .34)}" class="f-cloud"/>
    <rect x="${f1(w * .08)}" y="${f1(-h * .12)}" width="${f1(w * .84)}" height="${f1(h * .12)}" rx="${f1(h * .06)}" class="f-cloudSh"/>`;
}
function drawSky() {
  for (let i = 0; i < 80; i++) {
    const s = el('circle', { cx: f1(srand(0, 1600)), cy: f1(srand(8, 300)), r: f1(srand(.6, 1.7)), fill: 'var(--star)', opacity: 0 }, $('stars'));
    stars.push({ el: s, tw: srand(0, 6.28), sp: srand(1, 3) });
  }
  frag($('sun'), `<g><circle r="90" fill="url(#sunGlow)"/><circle r="30" fill="var(--sun)"/><circle r="22" fill="var(--sunCore)" opacity=".55"/></g>`);
  frag($('moon'), `<g><circle r="50" fill="url(#sunGlow)" opacity=".3"/><circle r="20" fill="var(--moon)"/>
    <circle cx="-6" cy="-5" r="4" fill="#e3dab8"/><circle cx="6" cy="6" r="3" fill="#e3dab8"/><circle cx="-2" cy="9" r="2" fill="#e3dab8"/></g>`);
  for (let i = 0; i < 11; i++) {
    const w = i < 5 ? srand(100, 170) : srand(160, 280);
    const g = el('g', {}, $('clouds'));
    frag(g, cloudShape(w));
    clouds.push({ g, x: srand(-200, 1600), y: i < 5 ? srand(50, 170) : srand(40, 240), w, sp: srand(5, 10), extra: i >= 5, th: (i - 5) * .1 });
  }
}

/* ---------------- ② 場景：遠景（提拉夏島、遠方郵輪） ---------------- */
function drawFar() {
  const g = $('far');
  // 提拉夏島：火山口外環的另一段，崖面同樣是層層岩層；崖頂是馬諾拉斯小村
  frag(g, `<g id="thirasia">
    <path d="M1330 331 L1352 306 Q1380 296 1420 298 Q1470 294 1520 300 Q1570 296 1610 302 L1610 331Z" class="f-isl"/>
    <path d="M1352 318 Q1420 312 1480 316 Q1540 312 1610 316 L1610 322 Q1540 318 1480 322 Q1420 318 1350 324Z" class="f-islDk"/>
    <path d="M1352 306 Q1380 296 1420 298 Q1470 294 1520 300 Q1570 296 1610 302 L1610 306 Q1570 300 1520 304 Q1470 298 1420 302 Q1380 300 1352 309Z" class="f-islTop" opacity=".9"/>
    ${[...Array(16)].map((_, i) => `<rect x="${f1(1440 + i * 6 + srand(-2, 2))}" y="${f1(294 + srand(-2, 1))}" width="${f1(srand(3, 5))}" height="${f1(srand(3, 5))}" class="f-islTop"/>`).join('')}
    <g id="thLights">${[...Array(12)].map((_, i) => `<circle cx="${f1(1442 + i * 8 + srand(-2, 2))}" cy="${f1(297 + srand(-1, 2))}" r="1.1" fill="var(--glow)"/>`).join('')}</g>
  </g>`);
}

/* ---------------- ② 場景：海（波紋、夕陽倒影、強風白浪） ---------------- */
const waves = [], caps = [];
let sunPath = null;
function drawSea() {
  const g = $('seaFx');
  for (let i = 0; i < 46; i++) {
    const y = srand(338, 595), w = srand(14, 40) * (0.6 + (y - 330) / 300);
    const l = el('rect', { x: f1(srand(1050, 1600)), y: f1(y), width: f1(w), height: f1(srand(1.4, 2.4)), rx: 1, class: 'f-seaLt', opacity: .55 }, g);
    waves.push({ el: l, x: +l.getAttribute('x'), y, ph: srand(0, 6.28), sp: srand(3, 8) });
  }
  // 太陽在海面上的金色光柱（位置跟著太陽）
  sunPath = el('g', { opacity: 0 }, g);
  for (let i = 0; i < 22; i++) {
    const y = 334 + i * i * .55, w = 70 - i * 1.6 + srand(-10, 10);
    el('rect', { x: f1(-w / 2 + srand(-8, 8)), y: f1(y), width: f1(Math.max(10, w)), height: 2.4, rx: 1.2, fill: 'var(--sun)' }, sunPath);
  }
  for (let i = 0; i < 26; i++) {
    const c = el('path', { d: 'M0 0 q6 -4 12 0', stroke: '#ffffff', 'stroke-width': 2, fill: 'none', 'stroke-linecap': 'round', opacity: 0 }, g);
    caps.push({ el: c, x: srand(1120, 1600), y: srand(345, 595), ph: srand(0, 6.28) });
  }
}

/* ---------------- ② 場景：火山口斷崖 ---------------- */
let cliffD = '';
function drawCliff() {
  const g = $('cliff');
  let d = 'M-10 600 L-10 ' + f1(ridge(0));
  for (let x = 0; x <= 1095; x += 15) d += ` L${x} ${f1(ridge(x) + (x % 45 === 0 ? -1.5 : 0))}`;
  // 西端岬角之後，崖面一路落到阿姆迪港
  d += ' L1112 322 L1136 360 L1122 404 L1150 446 L1146 488 L1176 520 L1206 548 L1236 566 L1262 600 Z';
  cliffD = d;
  $('cliffClipPath').setAttribute('d', d);
  el('path', { d, class: 'f-cliffR' }, g);
  // 岩層：白色浮石（頂）、紅、褐、黑互相交錯（裁切在崖形內）
  const s = el('g', { 'clip-path': 'url(#clipCliff)' }, g);
  const band = (y0, amp, th, cls, slope) => {
    let p = `M-20 ${y0}`, q = '';
    for (let x = -20; x <= 1300; x += 40) p += ` L${x} ${f1(y0 + x * slope + Math.sin(x * .013 + y0) * amp)}`;
    for (let x = 1300; x >= -20; x -= 40) q += ` L${x} ${f1(y0 + th + x * slope + Math.sin(x * .017 + y0 * .5) * amp)}`;
    el('path', { d: p + q + 'Z', class: cls }, s);
  };
  band(300, 6, 26, 'f-cliffR2', .03);
  band(352, 7, 18, 'f-cliffD', .025);
  band(392, 8, 30, 'f-cliffB', .02);
  band(440, 6, 14, 'f-cliffR2', .03);
  band(470, 9, 40, 'f-cliffD', .02);
  band(520, 7, 22, 'f-cliffB', .025);
  // 崖頂一層白色浮石（3600 年前米諾斯火山爆發留下的火山灰）
  let top = 'M-10 ' + f1(ridge(0) - 1);
  for (let x = 0; x <= 1095; x += 15) top += ` L${x} ${f1(ridge(x) - 1)}`;
  for (let x = 1095; x >= -10; x -= 15) top += ` L${x} ${f1(ridge(x) + 18 + Math.sin(x * .05) * 4)}`;
  el('path', { d: top + 'Z', class: 'f-cliffP' }, s);
  // 崖面的小陰影塊
  for (let i = 0; i < 26; i++) {
    const x = srand(880, 1180), y = srand(310, 560);
    el('path', { d: `M${f1(x)} ${f1(y)} l${f1(srand(8, 20))} ${f1(srand(-4, 4))} l${f1(srand(-6, 2))} ${f1(srand(5, 12))}Z`, class: 'f-cliffB', opacity: .35 }, s);
  }
}

/* ---------------- ② 場景：通往阿姆迪港的之字形石階（驢子走的路） ---------------- */
const STAIR = [[985, 312], [1092, 340], [1030, 378], [1112, 414], [1048, 452], [1126, 490], [1080, 522], [1166, 556]];
const stairLen = [];
let stairTotal = 0;
function drawStairs() {
  const g = $('cliff');
  let d = `M${STAIR[0][0]} ${STAIR[0][1]}`;
  for (let i = 1; i < STAIR.length; i++) d += ` L${STAIR[i][0]} ${STAIR[i][1]}`;
  el('path', { d, class: 's-wallSh', 'stroke-width': 13, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, g);
  el('path', { d, class: 's-lane', 'stroke-width': 9, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, g);
  // 階梯紋路與外側白色矮牆
  for (let i = 1; i < STAIR.length; i++) {
    const [x0, y0] = STAIR[i - 1], [x1, y1] = STAIR[i];
    const L = Math.hypot(x1 - x0, y1 - y0);
    stairLen.push(L); stairTotal += L;

/* ---------------- ③ 角色：主街行人（兩排各走一個方向，會跟車距、不穿模） ---------------- */
const walkers = [];
const LANES = [{ y: 474, dir: -1, g: 'walkB' }, { y: 499, dir: 1, g: 'walkF' }];
function addWalker(lane, x, look) {
  const L = LANES[lane];
  const p = person($(L.g), look);
  const w = { p, lane, x, dir: L.dir, v0: look.speed || rand(20, 30), v: 0, ph: rand(0, 6), stop: 0, wave: 0, look };
  w.v = w.v0;
  p.g.classList.add('clickable');
  onAct(p.g, () => { w.wave = 1.6; w.stop = 1.6; say(w.x, L.y - 70, pick(['Γεια σας！（你好）', 'Kalimera！早安', 'Efcharistó！謝謝', '這裡好美！', '要去看夕陽嗎？'])); sfx(t => hello(t)); });
  walkers.push(w);
}
function stepWalkers(dt, mv) {
  const zone = show.on === 'wed' && show.t > 3 ? [340, 640] : null;
  for (const w of walkers) {
    const L = LANES[w.lane];
    const inside = zone && w.x > zone[0] && w.x < zone[1];
    let v = inside ? 70 : w.v0;              // 婚禮跳舞時，舞區內的人加快走出去
    if (zone && !inside) { const next = w.x + w.dir * 14; if (next > zone[0] && next < zone[1]) v = 0; }  // 舞區外的人停下來看
    // 跟前面的人保持距離（不穿模）
    for (const o of walkers) {
      if (o === w || o.lane !== w.lane) continue;
      const d = (o.x - w.x) * w.dir;
      if (d > 0 && d < 34) v = Math.min(v, d < 26 ? 0 : o.v);
    }
    if (w.stop > 0) { w.stop -= dt; v = 0; }
    w.v = v;
    w.x += w.dir * v * dt * mv;
    if (w.x < -30) w.x = 905; if (w.x > 905 && w.dir > 0) w.x = -30;
    w.ph += v * dt * .32 * mv;
    walkLegs(w.p, v > 1 ? w.ph : 0);
    if (w.wave > 0) { w.wave -= dt; arms(w.p, 10, -150 + Math.sin(w.wave * 14) * 18); }
    else arms(w.p, 10 + Math.sin(w.ph) * (v > 1 ? 14 : 0), -10 - Math.sin(w.ph) * (v > 1 ? 14 : 0));
    // 右端走上通往風車的階梯：淡出
    const op = w.x > 860 ? clamp((905 - w.x) / 45, 0, 1) : w.x < -10 ? clamp((w.x + 30) / 20, 0, 1) : 1;
    w.p.g.setAttribute('opacity', f1(op));
    w.p.g.setAttribute('transform', `translate(${f1(w.x)} ${L.y}) scale(${w.dir < 0 ? -1 : 1} 1)`);
    w.p.umb.setAttribute('opacity', f1(wx.rain > .4 ? 1 : 0));
  }
}

function hello(t) { [76, 79].forEach((n, i) => osc('sine', hz(n), t + i * .1, .25, gainEnv(t + i * .1, .01, .25, .06))); }

function foghorn(t) { const o = osc('sawtooth', 98, t, 1.4, gainEnv(t, .12, 1.2, .1)); const o2 = osc('sawtooth', 147, t, 1.4, gainEnv(t, .12, 1.2, .05)); }

/* —— 音樂一：伊亞夕陽（原創，A 小調慢板 72 拍，布祖基琴顫音撥弦＋弦樂墊底，太陽落下時轉成 A 大調和弦） —— */
function bouzouki(t, f, d, v, dest) {
  // 布祖基琴：金屬弦撥奏，長音用快速顫音（tremolo）
  const n = Math.max(1, Math.round(d / .085));
  for (let i = 0; i < n; i++) {
    const tt = t + i * .085, vv = v * (i ? .7 : 1);
    osc('sawtooth', f, tt, .16, (() => { const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600; lp.connect(gainEnv(tt, .002, .14, vv, dest)); return lp; })());
    osc('triangle', f * 2, tt, .1, gainEnv(tt, .002, .08, vv * .3, dest));
  }
}
function pad(t, notes, d, v, dest) {
  notes.forEach(n => { const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1200; const g = actx.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + .6); g.gain.setValueAtTime(v, t + d - .5); g.gain.linearRampToValueAtTime(.0001, t + d + .3); lp.connect(g); g.connect(dest); osc('sawtooth', hz(n), t, d + .4, lp); osc('sawtooth', hz(n) * 1.004, t, d + .4, lp); });
}
function guitar(t, f, v, dest) { osc('triangle', f, t, .8, gainEnv(t, .003, .8, v, dest)); }
function sunsetMusic(t0) {
  const dest = newTrack('mus');
  const B = 60 / 72;   // 一拍
  // 和弦進行：Am – Dm – E – Am – F – G – E – A（最後一小節轉大調）
  const CH = [[57, 60, 64], [62, 65, 69], [56, 59, 64], [57, 60, 64], [53, 57, 60], [55, 59, 62], [56, 59, 64], [57, 61, 64]];
  CH.forEach((c, i) => {
    const t = t0 + i * 2 * B;
    pad(t, c.map(n => n - 12), 2 * B, .028, dest);
    [0, 1, 2, 1].forEach((k, j) => guitar(t + j * B * .5, hz(c[k] - 12), .05, dest));
    guitar(t + 2 * B * .75, hz(c[0] - 24), .07, dest);
  });
  // 主旋律（音高, 起拍, 拍數）：和聲小調的升 G 帶出地中海味道
  const M = [[76, 0, 1.5], [74, 1.5, .5], [72, 2, 1], [71, 3, 1], [69, 4, 1.5], [71, 5.5, .5], [72, 6, 1], [74, 7, 1],
             [76, 8, 1], [77, 9, .5], [76, 9.5, .5], [74, 10, 1], [72, 11, 1], [69, 12, 2], [71, 14, 1], [68, 15, 1],
             [72, 16, 1.5], [74, 17.5, .5], [76, 18, 2]];
  M.forEach(([n, s, d]) => bouzouki(t0 + s * B, hz(n), d * B, .045, dest));
  // 結尾：A 大調長和弦（太陽沉入海面）
  const tE = t0 + 16 * B;
  pad(tE, [57, 61, 64, 69], 3.4, .03, dest);
  [69, 73, 76, 81].forEach((n, i) => guitar(tE + 1.6 + i * .12, hz(n), .05, dest));
}

/* —— 音樂二：婚禮圍圈舞（原創，7/8 拍「卡拉瑪提亞諾斯」節奏 3+2+2，D 大調；單簧管＋布祖基琴＋手鼓） —— */
function clarinet(t, f, d, v, dest) {
  const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200; lp.connect(gainEnv(t, .03, d, v, dest));
  const o = osc('square', f, t, d + .05, lp);
  const lfo = osc('sine', 5.5, t, d + .05); const lg = actx.createGain(); lg.gain.value = f * .008; lfo.connect(lg); lg.connect(o.frequency);
}
function drum(t, low, v, dest) {
  if (low) { const o = osc('sine', 110, t, .3, gainEnv(t, .002, .28, v, dest)); o.frequency.exponentialRampToValueAtTime(55, t + .2); }
  else noise(t, .06, 2200, v * .7, 'bandpass', 1.5, .001, dest);
}
function weddingMusic(t0) {
  const dest = newTrack('mus');
  // 開場：教堂鐘聲 2.4 秒
  OUT = dest; churchBell(t0, 4); OUT = null;
  const E = .155;                // 八分音符
  const BAR = 7 * E;
  const tS = t0 + 2.6;
  const bars = 15;
  // 和弦：D – D – G – A – D – D – A – D（每 2 小節換一次）
  const CH = [50, 50, 55, 57, 50, 50, 57, 50];
  for (let b = 0; b < bars; b++) {
    const t = tS + b * BAR, root = CH[Math.floor(b / 2) % CH.length];
    // 手鼓 3+2+2：咚–答答｜咚–答｜咚–答

    // 貝斯與布祖基和弦
    guitar(t, hz(root - 12), .07, dest); guitar(t + 3 * E, hz(root - 5), .05, dest); guitar(t + 5 * E, hz(root - 12), .05, dest);
    [0, 4, 7].forEach(k => { const f = hz(root + k + 12); osc('sawtooth', f, t + 3 * E, .12, (() => { const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400; lp.connect(gainEnv(t + 3 * E, .002, .12, .018, dest)); return lp; })()); });
  }
  // 單簧管旋律：每小節 [音, 八分音符數]，加總 7
  const MEL = [
    [[74, 3], [76, 2], [78, 2]], [[79, 3], [78, 2], [76, 2]], [[78, 3], [76, 2], [74, 2]], [[73, 3], [74, 2], [76, 2]],
    [[79, 3], [81, 2], [79, 2]], [[78, 3], [76, 2], [74, 2]], [[76, 3], [78, 2], [76, 2]], [[74, 7]],
    [[81, 3], [79, 2], [78, 2]], [[79, 3], [78, 2], [76, 2]], [[78, 3], [79, 2], [81, 2]], [[83, 3], [81, 2], [79, 2]],
    [[78, 3], [76, 2], [78, 2]], [[76, 3], [73, 2], [76, 2]], [[74, 7]]
  ];
  MEL.forEach((bar, b) => { let s = 0; bar.forEach(([n, d]) => { clarinet(tS + b * BAR + s * E, hz(n), d * E * .92, .05, dest); bouzouki(tS + b * BAR + s * E, hz(n - 12), Math.min(d * E, .3), .02, dest); s += d; }); });
  // 結尾和弦
  const tE = tS + bars * BAR;
  [62, 66, 69, 74].forEach(n => guitar(tE, hz(n), .06, dest)); drum(tE, 1, .25, dest);
}

/* ---------------- ④ 動畫：日夜 ---------------- */
const T = { t: 11 / 24, auto: true, target: null, dragging: false, hold: false };
let night = 0, dusk = 0, nOn = 0, lastApplied = -1, sunY = 0, sunX = 0;
function clockText() {
  const h = T.t * 24, hh = Math.floor(h) % 24, mm = Math.floor((h - Math.floor(h)) * 60 + 1e-6);
  return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
}
function applyTime(force) {
  if (!force && Math.abs(T.t - lastApplied) < .0003) return;
  lastApplied = T.t;
  const h = T.t * 24;
  night = clamp(1 - smooth(5.5, 7, h) + smooth(20.3, 21.5, h), 0, 1);
  dusk = Math.max(Math.exp(-Math.pow((h - 6.3) / .9, 2)) * .7, Math.exp(-Math.pow((h - 20.1) / .85, 2)));
  for (const k in PAIRS) {
    if (k === 'skyT' || k === 'skyB' || k === 'cloud' || k === 'cloudSh') continue;
    const Pp = PAIRS[k];
    let c = mix(Pp.d, Pp.n, night);
    if (Pp.k) c = mix(c, Pp.k, dusk * .85);
    root.style.setProperty('--' + k, rgba(c));
  }
  // 太陽從左邊（東）升起，往右邊（西）沉進愛琴海；月亮同理
  const sp = (h - 6.2) / 13.8, mp = ((h - 20.6 + 24) % 24) / 10;
  sunX = 120 + sp * 1130; sunY = HORIZON - Math.sin(Math.PI * sp) * 260;
  $('sun').setAttribute('transform', `translate(${f1(sunX)} ${f1(sunY)})`);
  $('sun').style.display = sp > -.06 && sp < 1.06 ? '' : 'none';
  $('sun').setAttribute('opacity', f1(1 - grey() * .75));
  $('moon').setAttribute('transform', `translate(${f1(160 + mp * 1250)} ${f1(HORIZON - Math.sin(Math.PI * clamp(mp, 0, 1)) * 250)})`);
  $('moon').style.display = mp > -.05 && mp < 1.05 ? '' : 'none';
  $('duskGlow').setAttribute('cx', f1(clamp(sunX, 600, 1500)));
  $('duskGlow').setAttribute('opacity', f1(dusk * (1 - grey() * .8)));
  sunPath.setAttribute('transform', `translate(${f1(sunX)} 0)`);
  sunPath.setAttribute('opacity', f1(sp > 0.5 && sp < 1.03 ? (dusk * .9 + .15) * (1 - grey()) : 0));
  nOn = smooth(.3, .85, night);
  $('clock').textContent = clockText();
  if (!T.dragging) $('timeRange').value = Math.round(T.t * 1000);
  windows.forEach(w => w.el.setAttribute('opacity', f1(!w.off && nOn > w.th ? .95 : 0)));
  pools.forEach(p => p.setAttribute('opacity', f1(nOn * .9)));
  floods.forEach(p => p.setAttribute('opacity', f1(nOn * .7)));
  lanterns.forEach(l => { l.l.setAttribute('opacity', f1(l.bulb ? .25 + nOn * .75 : nOn)); if (l.gl) l.gl.setAttribute('opacity', f1(nOn * .8)); });
  $('tavWin').setAttribute('opacity', f1(nOn));
  $('thLights').setAttribute('opacity', f1(nOn));
  stars.forEach(s => s.base = nOn);
}
const grey = () => clamp(wx.cloud * .5 + wx.rain * .75, 0, .85);
function updateSky() {
  const gr = grey();
  ['skyT', 'skyB', 'cloud', 'cloudSh'].forEach(k => {
    const Pp = PAIRS[k];
    let c = mix(Pp.d, Pp.n, night);
    if (Pp.k) c = mix(c, Pp.k, dusk * .85 * (1 - gr * .7));
    const g = mix([160, 170, 182, 1], [40, 46, 66, 1], night);
    const gc = k.startsWith('cloud') ? mix([232, 235, 240, 1], [70, 78, 104, 1], night) : g;
    c = mix(c, gc, gr * (k.startsWith('cloud') ? .6 : 1));
    root.style.setProperty('--' + k, rgba(c));
  });
}

/* ---------------- ④ 動畫：天氣（晴、多雲、夏天的梅爾特米強風、冬雨） ---------------- */

/* ---------------- ④ 動畫：花瓣、米粒、漣漪、閃光 ---------------- */
const petals = [], ripples = [], flashes = [];
function petal(x, y, vx = 0, vy = 0, rice) {
  const c = rice ? 'var(--rice)' : pick(['var(--petal1)', 'var(--petal1)', 'var(--petal3)', 'var(--petal2)']);
  const e = el('ellipse', { rx: rice ? 1.6 : 3.2, ry: rice ? 1.1 : 2, fill: c }, $('petals'));
  petals.push({ e, x, y, vx, vy, r: rand(0, 360), vr: rand(-200, 200), life: rand(4, 7), ph: rand(0, 6) });
}
function stepPetals(dt) {
  for (let i = petals.length - 1; i >= 0; i--) {
    const P = petals[i];
    P.vy = Math.min(P.vy + 30 * dt, 40); P.vx += ((wx.wind * 50) - P.vx) * dt * .5;
    P.x += (P.vx + Math.sin(P.ph += dt * 3) * 12) * dt; P.y += P.vy * dt; P.r += P.vr * dt; P.life -= dt;
    P.e.setAttribute('transform', `translate(${f1(P.x)} ${f1(P.y)}) rotate(${f1(P.r)})`);
    P.e.setAttribute('opacity', f1(Math.min(1, P.life)));

  }

  for (let i = ripples.length - 1; i >= 0; i--) {
    const R = ripples[i]; R.t += dt;
    R.e.setAttribute('rx', f1(4 + R.t * 34 * R.big)); R.e.setAttribute('ry', f1(1.5 + R.t * 8 * R.big));
    R.e.setAttribute('opacity', f1(Math.max(0, .8 - R.t * .6)));

  }
}

    if (F.t > .3) { F.e.remove(); flashes.splice(i, 1); }

// 酒館的炭烤煙
const smokes = [];
function puff(x, y, big = 1) {

/* ---------------- ④ 動畫：兩種表演（不能同時進行） ----------------
   sunset：伊亞夕陽——時間轉到傍晚，太陽沉進愛琴海，白牆染成杏桃色，城堡上人潮湧入、
           閃光燈此起彼落，太陽完全沒入海面時大家鼓掌，接著村莊燈火一盞盞亮起（約 21 秒）
   wed   ：藍頂教堂婚禮——鐘樓三口鐘搖響，新人在教堂門口出現、賓客撒花瓣和米，
           主街上一排人手搭肩跳起卡拉瑪提亞諾斯圍圈舞，領舞的人揮手帕（約 21 秒） */
const show = { on: '', t: 0, dur: 0, clapped: false };
function startSunset(auto) {
  if (show.on) { busy(); return; }
  ensureAudio();
  Object.assign(show, { on: 'sunset', t: 0, dur: 21, clapped: false, fromT: T.t });
  $('btnSunset').classList.add('on');
  T.hold = true; T.target = null;
  if (wxI !== 0) { wxI = 0; $('btnWeather').textContent = '天氣：晴'; }   // 看夕陽要放晴
  if ((!auto || pickAudio) && audioOK()) { sunsetMusic(actx.currentTime + .05); duckSfx(20); duckMusic(20); }
  say(1060, 230, pick(['大家都往城堡跑去看夕陽！', '伊亞的夕陽要開始了']), 2);
}
function startWed(auto) {
  if (show.on) { busy(); return; }
  ensureAudio();
  Object.assign(show, { on: 'wed', t: 0, dur: 21 });
  $('btnWed').classList.add('on');
  if (night > .6) { T.auto = false; syncAuto(); goTo(17 / 24); }
  if (!auto && audioOK()) { weddingMusic(actx.currentTime + .05); duckSfx(21); duckMusic(21); }
  say(470, 260, '噹──噹──教堂的鐘響了！', 2);
}
function endShow() {
  $('btnSunset').classList.remove('on'); $('btnWed').classList.remove('on');
  if (show.on === 'sunset') T.hold = false;
  show.on = '';
}
function busy() { say(800, 250, '表演進行中，等一下喔！', 1.4); }
function showStep(dt) {
  show.t += dt;
  const S = show;
  if (S.on === 'sunset') {
    // 前 2 秒轉到 19:20，接著 16 秒從 19:20 走到 20:30
    const h0 = 19 + 20 / 60, h1 = 20.5;
    let target;
    if (S.t < 2) { const k = smooth(0, 2, S.t); let d = h0 / 24 - S.fromT; if (d < -.5) d += 1; if (d > .5) d -= 1; target = (S.fromT + d * k + 1) % 1; }

      if (this.playing) return; this.playing = true; pickAudio = true; userGesture = true;
      if (c && c !== actx) useCtx(c); else ensureAudio();
      if (actx && actx.state !== 'running') actx.resume();
      // 夕陽剛開始就補上配樂；已經演到一半就等下一輪
      if (show.on === 'sunset' && show.t < 3 && actx) setTimeout(() => { if (audioOK()) { sunsetMusic(actx.currentTime + .05); duckSfx(20); } }, 60);
    },
    stop() {
      this.playing = false; pickAudio = false;
      [musNode, sfxNode].forEach(n => { if (n) try { n.disconnect(); } catch (e) {} }); musNode = sfxNode = null;
      if (rainGain) rainGain.gain.value = 0; if (windGain) windGain.gain.value = 0;
    },
    duck() {}
  };
}
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on,
  btn: { sunset: 'btnSunset', wed: 'btnWed' },
  ff: () => { show.clapped = true; show.t = show.dur - .02; },
  save: () => ({ ...T }),
  stop: () => endShow(),
  restore: s => { Object.assign(T, s); T.hold = false; syncAuto(); applyTime(true); }
});
/* /ShowStop */
})();
</script>
