<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>/* 基本重設 */ body{margin:0} img{max-width:100%} [hidden]{display:none!important}</style>
<title>SC-03 雨夜巷弄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
/* =========================================================
   SC-03 雨夜巷弄｜剪紙層疊風格
   【色票 token】所有顏色集中在這裡。
   - 場景色成對出現：--名稱-day / --名稱-night，
     JS 會依「日夜比例」自動混色，輸出成 --名稱 給 SVG 使用。
   - 「常亮光源」不參與混色（燈、霓虹、燈籠）。
   換色時只需改這個區塊。
   版面概念：深色紙框中央放一張寬幅剪紙舞台，下方是一排紙籤式控制鈕。
   ========================================================= */
:root{
  color-scheme:dark;

  /* ---- 頁面外框（單一深色主題） ---- */
  --page-bg:#17161f;
  --page-panel:#211f2c;
  --page-fg:#efe8da;
  --page-dim:#a9a397;
  --page-line:#34314a;
  --page-accent:#ff7a5c;
  --font-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;

  /* ---- 天空與遠景 ---- */
  --sky-top-day:#9eb0bb;   --sky-top-night:#0f1330;
  --sky-bot-day:#d3d9da;   --sky-bot-night:#2b2c58;
  --far-day:#aebbc2;       --far-night:#1d2245;
  --far2-day:#bcc6cb;      --far2-night:#262b55;
  --cloud-day:#c6ced2;     --cloud-night:#2c315c;
  --cloud-dk-day:#aab5bc;  --cloud-dk-night:#21254a;

  /* ---- 建築（四種牆色 + 巷內陰影 + 線腳） ---- */
  --bld-a-day:#d8c4ad;     --bld-a-night:#3c3459;
  --bld-b-day:#a9bbb0;     --bld-b-night:#2a3955;
  --bld-c-day:#d5a593;     --bld-c-night:#4a3252;
  --bld-d-day:#c0c4ce;     --bld-d-night:#343761;
  --bld-shade-day:#8b929b; --bld-shade-night:#171932;
  --trim-day:#6f6a75;      --trim-night:#1b1a33;
  --win-off-day:#7b8e9b;   --win-off-night:#1a2143;
  --metal-day:#8f969d;     --metal-night:#2b2f4a;
  --sign-txt-day:#f6ecd9;  --sign-txt-night:#ffd47e;

  /* ---- 街道 ---- */
  --road-day:#646d77;      --road-night:#13162a;
  --walk-day:#979ca2;      --walk-night:#252842;
  --curb-day:#b4b8bc;      --curb-night:#363a5c;
  --puddle-day:#adc0cc;    --puddle-night:#2c3768;
  --rain-day:#f4f7f9;      --rain-night:#bcc8ff;
  --ink-day:#3c3a42;       --ink-night:#04050e;

  /* ---- 人物與物件 ---- */
  --skin-day:#eac7a4;      --skin-night:#9a7f79;
  --hair-day:#3b2f2c;      --hair-night:#15111b;
  --coat1-day:#4b5560;     --coat1-night:#1f232f;
  --coat2-day:#8a6b52;     --coat2-night:#3d3040;
  --coat3-day:#556b4f;     --coat3-night:#22302c;
  --umb1-day:#d9503a;      --umb1-night:#a03b3b;
  --umb2-day:#eab33a;      --umb2-night:#a8843b;
  --umb3-day:#3aa898;      --umb3-night:#2a7b75;
  --umb4-day:#6c5bc9;      --umb4-night:#4b3f91;
  --umb5-day:#e77ea3;      --umb5-night:#a65b7c;
  --umb6-day:#2f608d;      --umb6-night:#22456b;
  --awning1-day:#c65040;   --awning1-night:#6c2c37;
  --awning2-day:#3d7a8c;   --awning2-night:#203f56;
  --noren-day:#2f4f7a;     --noren-night:#1d2b50;
  --plant-day:#5f8a5a;     --plant-night:#1e3933;
  --wood-day:#8a6a4c;      --wood-night:#35283a;

  /* ---- 常亮光源（不隨日夜混色） ---- */
  --win-on:#ffd47e;   /* 窗內暖光 */
  --lamp:#ffe8b0;     /* 路燈 */
  --lantern:#ff5a3c;  /* 紅燈籠 */
  --neon:#4ff0d8;     /* 霓虹青 */
  --neon2:#ff6fb1;    /* 霓虹粉 */
  --vend:#d6f2ff;     /* 販賣機面板 */
  --tail:#ff3b3b;     /* 車尾燈 */
}

/* ===== 頁面版面 ===== */
html,body{background:var(--page-bg);color:var(--page-fg)}
body{font-family:var(--font-body);line-height:1.6}
.wrap{max-width:1680px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
h1{font-family:var(--font-display);font-weight:900;font-size:clamp(1.4rem,2.6vw,2rem);margin:0;letter-spacing:.04em;text-wrap:balance}
h1 small{font-size:.55em;font-weight:700;color:var(--page-accent);letter-spacing:.12em;margin-right:.6em}
.meta{color:var(--page-dim);font-size:.9rem;margin:0}
.stage{position:relative;border-radius:6px;overflow:hidden;background:#000;
  box-shadow:0 0 0 1px var(--page-line),0 18px 40px -18px #000}
.stage svg{display:block;width:100%;height:auto;max-width:100%;touch-action:manipulation}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.controls button{font:500 .95rem/1 var(--font-body);color:var(--page-fg);background:var(--page-panel);
  border:1px solid var(--page-line);border-radius:3px;padding:10px 16px;cursor:pointer;
  box-shadow:0 3px 0 -1px #0007;transition:transform .12s,background .2s}
.controls button:hover{background:#2c2a3b}
.controls button:active{transform:translateY(2px)}
.controls button:focus-visible{outline:2px solid var(--page-accent);outline-offset:2px}
.controls button[aria-pressed="true"]{border-color:var(--page-accent);color:#fff}
.clock{margin-left:auto;font-family:var(--font-display);font-size:1rem;color:var(--page-dim);font-variant-numeric:tabular-nums}
.hint{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 20px;color:var(--page-dim);font-size:.88rem}
.hint b{color:var(--page-fg);font-weight:500;margin-right:.4em}

/* ===== SVG 內樣式 ===== */
#cut feDropShadow{flood-color:var(--ink);flood-opacity:.55}
#cutSoft feDropShadow{flood-color:var(--ink);flood-opacity:.4}
.lit{fill:var(--win-on);opacity:0;transition:opacity .35s}
.lit.on{opacity:var(--lit,.2)}
/* 光錐、光暈只是光，不擋住後面窗戶的點擊 */
.nightOnly,.lampLight,.lampLight2,#reflect,#ripples,#splashes,#rain{pointer-events:none}
.win,.lantern,.walker,.vehicle,#cat,#foreLamp,#hangSign{cursor:pointer}
.signtxt{fill:var(--sign-txt);font-family:var(--font-display);font-weight:900}
.neontxt{font-family:var(--font-display);font-weight:900}
.bubble text{font-family:var(--font-display);font-weight:900;font-size:22px;fill:var(--ink)}
/* 麵店蒸氣 */
.steam{fill:none;stroke:var(--rain);stroke-width:4;stroke-linecap:round;opacity:0;animation:steam 4s ease-in infinite}
.steam:nth-child(2){animation-delay:1.3s}.steam:nth-child(3){animation-delay:2.6s}
@keyframes steam{0%{opacity:0;transform:translateY(0)}30%{opacity:.55}100%{opacity:0;transform:translateY(-46px)}}

/* ===== 減少動態：關閉 CSS 動畫（JS 端另行停住雨、行人、車） ===== */
@media (prefers-reduced-motion: reduce){
  .steam{animation:none;opacity:.35}
  .lit{transition:none}
  .controls button{transition:none}
}
</style>

<main class="wrap">

  <div class="stage">
  <!-- =====================================================
       【場景】SVG 主舞台 viewBox 1600×600
       圖層由後到前：天空 → 遠景 → 雲 → 巷內 → 建築 → 窗光 → 動態招牌
       → 電線 → 街道 → 倒影 → 漣漪 → 行人 → 車輛 → 貓 → 雨 → 前景 → 紙紋
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img" aria-label="下雨的巷弄，行人撐傘走過麵館、舊書店與自助洗衣店，可切換白天與夜晚">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-top)"/>
        <stop offset="1" style="stop-color:var(--sky-bot)"/>
      </linearGradient>
      <linearGradient id="reflGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--win-on);stop-opacity:.75"/>
        <stop offset="1" style="stop-color:var(--win-on);stop-opacity:0"/>
      </linearGradient>
      <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" style="stop-color:var(--lamp);stop-opacity:.8"/>
        <stop offset="1" style="stop-color:var(--lamp);stop-opacity:0"/>
      </linearGradient>
      <linearGradient id="coneGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--lamp);stop-opacity:.55"/>
        <stop offset="1" style="stop-color:var(--lamp);stop-opacity:0"/>
      </linearGradient>
      <radialGradient id="glowGrad">
        <stop offset="0" style="stop-color:var(--lamp);stop-opacity:.85"/>
        <stop offset="1" style="stop-color:var(--lamp);stop-opacity:0"/>
      </radialGradient>
      <radialGradient id="redGlow">
        <stop offset="0" style="stop-color:var(--lantern);stop-opacity:.7"/>
        <stop offset="1" style="stop-color:var(--lantern);stop-opacity:0"/>
      </radialGradient>
      <radialGradient id="vignette" cx=".5" cy=".5" r=".75">
        <stop offset=".6" stop-color="#000" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity=".45"/>
      </radialGradient>
      <!-- 剪紙投影：每層紙板底下的影子 -->
      <filter id="cut" x="-5%" y="-10%" width="110%" height="125%">
        <feDropShadow dx="0" dy="5" stdDeviation="4"/>
      </filter>
      <filter id="cutSoft" x="-20%" y="-20%" width="140%" height="150%">
        <feDropShadow dx="0" dy="3" stdDeviation="2"/>
      </filter>
      <!-- 霓虹光暈 -->
      <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="1.6" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <!-- 路面倒影的水波扭曲 -->
      <filter id="wobble" x="-10%" y="0" width="120%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".02 .25" numOctaves="2" seed="4"/>
        <feDisplacementMap in="SourceGraphic" scale="14"/>
      </filter>
      <!-- 紙張纖維紋理 -->
      <filter id="paper" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="8"/>
        <feColorMatrix values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .9 0"/>
      </filter>
    </defs>

    <!-- 天空 -->
    <rect id="sky" width="1600" height="600" fill="url(#skyGrad)"/>
    <!-- 遠景樓群（JS 生成） -->
    <g id="far" filter="url(#cut)"></g>
    <g id="farLights"></g>
    <!-- 雨雲（JS 生成） -->
    <g id="clouds" filter="url(#cut)"></g>

    <!-- 巷內縱深（固定繪製） -->
    <g id="alley">
      <polygon class="f-bld-shade" points="720,470 720,160 780,245 780,440"/>
      <polygon class="f-bld-shade" points="880,470 880,180 820,250 820,440" opacity=".85"/>
      <rect class="f-trim" x="780" y="245" width="40" height="195"/>
      <rect class="lit on" x="791" y="398" width="18" height="42"/>
      <polygon class="f-walk" points="720,470 880,470 820,440 780,440"/>
      <!-- 巷內雜物：水管、冷氣、木箱、腳踏車 -->
      <line class="s-metal" x1="735" y1="180" x2="735" y2="462" stroke-width="4"/>
      <line class="s-metal" x1="866" y1="195" x2="866" y2="462" stroke-width="3"/>
      <rect class="f-metal" x="742" y="300" width="22" height="14"/>
      <rect class="f-metal" x="838" y="330" width="20" height="13"/>
      <rect class="f-wood" x="740" y="440" width="22" height="20"/>
      <rect class="f-wood" x="746" y="424" width="16" height="16"/>
      <g class="s-ink" fill="none" stroke-width="2">
        <circle cx="836" cy="452" r="9"/><circle cx="862" cy="452" r="9"/>
        <path d="M836,452 L846,438 L862,452 M846,438 L856,438 L862,452 M844,434 L850,434"/>
      </g>
      <circle cx="800" cy="384" r="16" fill="url(#glowGrad)" class="nightOnly"/>
      <circle cx="800" cy="384" r="3" fill="var(--lamp)"/>
    </g>

    <!-- 主建築（JS 生成） -->
    <g id="mid" filter="url(#cut)"></g>
    <!-- 夜間光暈（JS 生成） -->
    <g id="glow" class="nightOnly"></g>
    <!-- 窗光與可點擊窗戶（JS 生成） -->
    <g id="litLayer"></g>
    <!-- 會動的招牌細節：晾衣、門簾、燈籠、霓虹（JS 生成） -->
    <g id="midAnim" filter="url(#cutSoft)"></g>

    <!-- 電線 -->
    <g id="wires" fill="none" class="s-ink" stroke-width="1.6" opacity=".75">
      <path d="M0,118 Q180,160 330,150 T720,170"/>
      <path d="M0,132 Q200,178 330,166 T720,186"/>
      <path d="M720,170 Q800,205 880,186"/>
      <path d="M720,186 Q800,222 880,200"/>
      <path d="M880,186 Q1060,230 1220,190 T1600,160"/>
      <path d="M880,200 Q1060,246 1220,206 T1600,176"/>
      <path d="M560,90 Q800,150 1100,96"/>
    </g>

    <!-- 街道 -->
    <g id="street">
      <rect class="f-walk" x="0" y="470" width="1600" height="24"/>
      <rect class="f-curb" x="0" y="492" width="1600" height="5"/>
      <rect class="f-road" x="0" y="497" width="1600" height="103"/>
      <!-- 路面標線與水溝蓋 -->
      <g class="f-curb" opacity=".55">
        <rect x="40" y="586" width="70" height="4"/><rect x="200" y="586" width="70" height="4"/>
        <rect x="360" y="586" width="70" height="4"/><rect x="520" y="586" width="70" height="4"/>
        <rect x="680" y="586" width="70" height="4"/><rect x="840" y="586" width="70" height="4"/>
        <rect x="1000" y="586" width="70" height="4"/><rect x="1160" y="586" width="70" height="4"/>
        <rect x="1320" y="586" width="70" height="4"/><rect x="1480" y="586" width="70" height="4"/>
      </g>
      <ellipse class="f-metal s-ink" cx="1290" cy="520" rx="26" ry="5" stroke-width="1" opacity=".8"/>
      <!-- 水窪 -->
      <g id="puddles" class="f-puddle">
        <ellipse cx="300" cy="540" rx="80" ry="8"/>
        <ellipse cx="780" cy="572" rx="100" ry="9"/>
        <ellipse cx="1150" cy="536" rx="62" ry="7"/>
        <ellipse cx="1460" cy="578" rx="84" ry="8"/>
      </g>
      <!-- 中段路燈 -->
      <g id="midLamp">
        <rect class="f-ink" x="998" y="330" width="5" height="142"/>
        <path class="f-ink" d="M1000,334 Q1000,316 1020,316 L1036,316 L1036,321 L1020,321 Q1006,321 1005,334Z"/>
        <path class="f-trim" d="M1026,320 L1046,320 L1042,330 L1030,330Z"/>
        <polygon class="nightOnly lampLight" points="1028,330 1044,330 1100,494 972,494" fill="url(#coneGrad)"/>
        <circle class="lampLight" cx="1036" cy="331" r="4" fill="var(--lamp)"/>
      </g>
    </g>
    <!-- 濕路面倒影（JS 生成） -->
    <g id="reflect" class="nightOnly" filter="url(#wobble)"></g>
    <g id="ripples" fill="none" class="s-rain"></g>

    <!-- 【角色】行人、車輛、貓（JS 生成） -->
    <g id="walkers"></g>
    <g id="vehicles"></g>
    <g id="cat" transform="translate(690,478)">
      <path id="catTail" class="f-hair" d="M10,-4 Q26,-6 24,-22 Q23,-30 28,-32 Q32,-30 29,-24 Q30,-2 12,0Z"/>
      <ellipse class="f-hair" cx="0" cy="-10" rx="13" ry="11"/>
      <circle class="f-hair" cx="-8" cy="-24" r="8"/>
      <path class="f-hair" d="M-15,-27 L-14,-37 L-8,-30Z M-6,-30 L-1,-37 L0,-27Z"/>
      <g class="catEyes nightOnly"><circle cx="-11" cy="-25" r="1.6" fill="var(--lamp)"/><circle cx="-5" cy="-25" r="1.6" fill="var(--lamp)"/></g>
    </g>

    <!-- 【動畫】雨絲、水花（JS 生成） -->
    <g id="rain" class="s-rain" stroke-width="1.4" stroke-linecap="round" opacity=".55"></g>
    <g id="splashes" fill="none" class="s-rain" stroke-width="1.3"></g>

    <!-- 前景剪紙層 -->
    <g id="fore" filter="url(#cut)">
      <!-- 左前景路燈（可點擊） -->
      <g id="foreLamp">
        <polygon class="nightOnly lampLight2" points="118,150 150,150 260,600 0,600" fill="url(#coneGrad)"/>
        <rect class="f-ink" x="38" y="140" width="9" height="460"/>
        <rect class="f-ink" x="30" y="560" width="25" height="40"/>
        <path class="f-ink" d="M42,150 Q42,112 86,112 L134,112 L134,120 L86,120 Q50,120 50,150Z"/>
        <path class="f-trim" d="M112,118 L156,118 L148,142 L120,142Z"/>
        <circle class="nightOnly lampLight2" cx="134" cy="146" r="38" fill="url(#glowGrad)"/>
        <ellipse class="lampLight2" cx="134" cy="143" rx="12" ry="4" fill="var(--lamp)"/>
        <!-- 燈柱上的小告示 -->
        <rect class="f-sign-txt" x="34" y="300" width="17" height="44" opacity=".9"/>
        <path class="s-ink" d="M38,308 H47 M38,316 H47 M38,324 H47 M38,332 H44" stroke-width="1.5"/>
      </g>
      <!-- 右上前景吊牌（可點擊） -->
      <g id="hangSign">
        <line class="s-ink" x1="1440" y1="0" x2="1446" y2="52" stroke-width="2.5"/>
        <line class="s-ink" x1="1560" y1="0" x2="1554" y2="52" stroke-width="2.5"/>
        <rect class="f-wood" x="1420" y="50" width="160" height="58" rx="4"/>
        <rect class="s-trim" x="1426" y="56" width="148" height="46" rx="3" fill="none" stroke-width="2"/>
        <text class="signtxt" x="1500" y="90" font-size="30" text-anchor="middle" letter-spacing="4">夜雨食堂</text>
      </g>
      <!-- 前景植物剪影 -->
      <g class="f-plant">
        <path d="M60,600 Q70,540 110,520 Q96,560 92,600Z"/>
        <path d="M90,600 Q120,530 170,515 Q140,560 128,600Z"/>
        <path d="M0,600 Q20,548 62,540 Q42,570 40,600Z"/>
        <path d="M130,600 Q170,560 210,556 Q180,580 170,600Z"/>
      </g>
      <rect class="f-wood" x="1470" y="548" width="90" height="52"/>
      <rect class="f-trim" x="1464" y="540" width="102" height="10"/>
      <g class="f-plant">
        <path d="M1480,542 Q1470,490 1500,470 Q1498,510 1500,542Z"/>
        <path d="M1500,542 Q1510,480 1550,462 Q1530,505 1522,542Z"/>
        <path d="M1520,542 Q1560,500 1590,500 Q1560,520 1545,542Z"/>
      </g>
    </g>

    <!-- 閃電、紙紋、暗角 -->
    <rect id="flash" width="1600" height="600" fill="#eef2ff" opacity="0" pointer-events="none"/>
    <rect width="1600" height="600" filter="url(#paper)" opacity=".10" pointer-events="none" style="mix-blend-mode:multiply"/>
    <rect width="1600" height="600" fill="url(#vignette)" pointer-events="none"/>
  </svg>
  </div>

  <!-- 【互動】控制列 -->
  <div class="controls">
    <button id="btnDayNight" type="button">切換日夜</button>
    <button id="btnAuto" type="button" aria-pressed="true">自動循環：開</button>
    <button id="btnRain" type="button">雨量：中雨</button>
    <span class="clock" id="clock">雨天・午後</span>
  </div>
  <ul class="hint">
    <li><b>滑鼠左右移動</b>改變風向，雨絲、雲、晾衣跟著飄</li>
    <li><b>點窗戶</b>開燈或關燈</li>
    <li><b>點行人</b>換一把傘的顏色</li>
    <li><b>點燈籠、吊牌</b>讓它晃起來</li>
    <li><b>點路面或水窪</b>踩出漣漪</li>

function ripple(x, y, big = 1) {
  const r = ripplePool.find(p => p.life <= 0); if (!r) return;
  r.life = 1; r.x = x; r.y = y; r.big = big;
}
const PUDDLES = [...$("puddles").children].map(e => ({ cx: +e.getAttribute("cx"), cy: +e.getAttribute("cy"), rx: +e.getAttribute("rx"), ry: +e.getAttribute("ry") }));

/* =========================================================
   【動畫】日夜循環
   phase：0 = 白天、0.5 = 深夜；night = 0~1
   ========================================================= */
const RM_QUERY = matchMedia("(prefers-reduced-motion: reduce)");
let reduced = RM_QUERY.matches;
let phase = 0.32;           // 初始：黃昏偏夜，讓第一眼就看得到燈光
let auto = !reduced;
let tween = null;            // 手動切換時的補間 {from,to,t}
const CYCLE = 60;            // 自動循環一圈秒數
const nightOf = p => .5 - .5 * Math.cos(p * Math.PI * 2);
function clockLabel(p) {
  const n = nightOf(p), rising = (p % 1) < .5;
  if (n < .25) return "雨天・午後";
  if (n > .75) return "雨夜・深夜";
  return rising ? "黃昏・華燈初上" : "清晨・天色漸亮";
}

/* =========================================================
   主迴圈
   ========================================================= */
let wind = .25, windTarget = .25, pointerIn = false;
let last = performance.now(), t = 0, mixTimer = 0, flash = 0;
const catTail = $("catTail"); let catWag = 0;

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;

  // --- 日夜 ---
  if (tween) {
    tween.t += dt / (reduced ? .001 : 1.6);
    const k = Math.min(1, tween.t), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    phase = tween.from + (tween.to - tween.from) * e;
    if (k >= 1) tween = null;
  } else if (auto && !reduced) phase = (phase + dt / CYCLE) % 1;
  const night = nightOf(phase);
  mixTimer -= dt;
  if (mixTimer <= 0 || tween) { applyNight(night); mixTimer = .12; $("clock").textContent = clockLabel(phase); }

  // --- 風：滑鼠控制，沒滑鼠時自己飄 ---
  if (!pointerIn) windTarget = .25 + Math.sin(t * .3) * .35;
  wind += (windTarget - wind) * Math.min(1, dt * 2.5);

  if (!reduced) {
    // 雲
    for (const c of clouds) {
      c.x += (c.sp + wind * 30) * dt;
      if (c.x > 1760) c.x = -160; if (c.x < -160) c.x = 1760;
      c.g.setAttribute("transform", `translate(${c.x.toFixed(1)},${c.y})`);
    }
    // 雨
    const n = RAIN_LEVELS[rainLevel].n;
    for (let i = 0; i < n; i++) {
      const d = drops[i];
      d.y += d.sp * dt; d.x += wind * 280 * dt;
      if (d.y >= d.ground) {
        if (Math.random() < .25) splash(d.x, d.ground, .7);
        d.y = rand(-80, -10); d.x = rand(-150, 1750); d.ground = rand(472, 600);
      }
      drawDrop(d, wind);
    }
    if (Math.random() < dt * (3 + rainLevel * 5)) randomPuddleRipple();

    // 晾衣、門簾
    for (const s of swingers) {
      const a = wind * s.amp + Math.sin(t * 2.4 + s.ph) * s.amp * .25;
      s.g.setAttribute("transform", `translate(${s.x.toFixed(1)},${s.y.toFixed(1)}) rotate(${a.toFixed(1)})`);
    }
    // 燈籠：彈簧擺
    for (const L of lanterns) {
      const target = wind * 8 + Math.sin(t * 1.7 + L.ph) * 3;
      L.v += ((target - L.a) * 30 - L.v * 2.2) * dt;
      L.a += L.v * dt;
      L.g.setAttribute("transform", `rotate(${L.a.toFixed(1)})`);
    }
    // 前景吊牌
    $("hangSign").setAttribute("transform", `rotate(${(wind * 2.5 + Math.sin(t * 1.3) * .8 + signKick * Math.sin(t * 9)).toFixed(2)} 1500 0)`);
    signKick *= Math.pow(.25, dt);

    // 行人
    for (const W of walkers) {
      W.x += W.dir * W.sp * dt;
      W.ph += dt * W.sp / 6.5;
      if (W.hop > 0) W.hop = Math.max(0, W.hop - dt * 2.5);
      if (W.dir > 0 && W.x > 1680) W.x = -80;
      if (W.dir < 0 && W.x < -80) W.x = 1680;
      drawWalker(W, wind);
    }
    // 車
    if (!veh) { vehWait -= dt; if (vehWait <= 0) spawnVehicle(); }
    else {
      veh.x += veh.dir * veh.sp * dt; veh.spin += veh.dir * veh.sp * dt * 4;
      const rx = veh.x + veh.rear * veh.dir;
      if (PUDDLES.some(p => Math.abs(rx - p.cx) < p.rx && Math.abs(veh.y - p.cy) < 24) && Math.random() < .7) { splash(rx - veh.dir * 6, veh.y, 2); ripple(rx, veh.y - 4, 1.4); }
      drawVehicle(veh);
      if (veh.x < -veh.len - 40 || veh.x > 1640 + veh.len) { veh.g.remove(); veh = null; vehWait = rand(1.5, 5); }
    }
    // 貓尾巴
    catWag = Math.max(0, catWag - dt);
    catTail.setAttribute("transform", `rotate(${(Math.sin(t * (catWag > 0 ? 14 : 1.5)) * (catWag > 0 ? 18 : 6)).toFixed(1)} 10 -4)`);

    // 閃電（大雨的夜晚偶爾出現）
    if (rainLevel === 2 && night > .6 && Math.random() < dt / 9) flash = 1;
  }

  // 霓虹與路燈閃爍（夜晚才明顯）
  for (const nn of neons) {
    if (!reduced && Math.random() < dt * .4) nn.flick = rand(.08, .3);
    nn.flick = Math.max(0, nn.flick - dt);
    nn.g.style.opacity = ((.45 + .55 * night) * (nn.flick > 0 && Math.sin(t * 60) > 0 ? .25 : 1)).toFixed(2);
  }
  if (!reduced && Math.random() < dt * .25) lampFlick = rand(.2, .5);
  lampFlick = Math.max(0, lampFlick - dt);
  const lampOp = lampFlick > 0 && Math.sin(t * 45) > 0 ? .2 : 1;
  document.querySelectorAll("#foreLamp .lampLight2").forEach(e => e.style.opacity = ((e.classList.contains("nightOnly") ? night : .35 + .65 * night) * lampOp).toFixed(2));
  if (veh && veh.honk > 0) { veh.honk -= dt; }

  // 水花與漣漪
  for (const s of splashPool) {
    if (s.life <= 0) continue;
    s.life -= dt * 4;
    const k = 1 - s.life, sc = (.6 + k) * s.big;
    s.e.setAttribute("transform", `translate(${s.x.toFixed(1)},${s.y.toFixed(1)}) scale(${sc.toFixed(2)})`);
    s.e.setAttribute("opacity", Math.max(0, s.life * .8).toFixed(2));
  }
  for (const r of ripplePool) {
    if (r.life <= 0) continue;
    r.life -= dt * (reduced ? 3 : 1.1);
    const k = 1 - r.life;
    r.e.setAttribute("cx", r.x.toFixed(1)); r.e.setAttribute("cy", r.y.toFixed(1));
    r.e.setAttribute("rx", (4 + k * 30 * r.big).toFixed(1)); r.e.setAttribute("ry", (1 + k * 5 * r.big).toFixed(1));
    r.e.setAttribute("opacity", Math.max(0, r.life * .8).toFixed(2));
  }
  if (flash > 0) { flash = Math.max(0, flash - dt * 3); $("flash").setAttribute("opacity", (flash * (Math.sin(t * 50) > -.3 ? .45 : .1)).toFixed(2)); }

  requestAnimationFrame(frame);
}
let signKick = 0, lampFlick = 0;

function svgPoint(evt) {
  const p = svg.createSVGPoint(); p.x = evt.clientX; p.y = evt.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}

$("cat").addEventListener("click", e => { e.stopPropagation(); catWag = 1.2; bubble(684, 430, "喵～"); });
// 點路燈：一陣閃爍
$("foreLamp").addEventListener("click", e => { e.stopPropagation(); lampFlick = 1; });
// 點吊牌：晃一下
$("hangSign").addEventListener("click", e => { e.stopPropagation(); signKick = 6; });
// 點路面或水窪：漣漪 + 水花
svg.addEventListener("click", e => {
  const p = svgPoint(e);
  if (p.y > 468) { ripple(p.x, p.y, 1.6); ripple(p.x, p.y, 1); splash(p.x, p.y, 2.2); }
});

// 控制鈕
$("btnDayNight").addEventListener("click", () => {
  const n = nightOf(phase);
  const to = n > .5 ? Math.ceil(phase) : Math.floor(phase) + .5; // 往下一個「正午」或「深夜」
  tween = { from: phase, to: to <= phase ? to + 1 : to, t: 0 };
});
$("btnAuto").addEventListener("click", () => {
  auto = !auto;
  $("btnAuto").setAttribute("aria-pressed", auto);
  $("btnAuto").textContent = "自動循環：" + (auto ? "開" : "關");
});
$("btnRain").addEventListener("click", () => setRain((rainLevel + 1) % RAIN_LEVELS.length));

// 減少動態：停住雨與行人，只保留切換
function applyReduced() {
  reduced = RM_QUERY.matches;
  if (reduced) { auto = false; $("btnAuto").setAttribute("aria-pressed", "false"); $("btnAuto").textContent = "自動循環：關"; }
}
RM_QUERY.addEventListener && RM_QUERY.addEventListener("change", applyReduced);
applyReduced();

/* =========================================================
   初始化
   ========================================================= */
setRain(1);
applyNight(nightOf(phase), true);
clouds.forEach(c => c.g.setAttribute("transform", `translate(${c.x},${c.y})`));
drops.forEach(d => { d.y = rand(-20, d.ground); drawDrop(d, wind); });
walkers.forEach(W => drawWalker(W, wind));
swingers.forEach(s => s.g.setAttribute("transform", `translate(${s.x},${s.y})`));
spawnVehicle(); veh.x = veh.dir > 0 ? 420 : 1180; drawVehicle(veh);
requestAnimationFrame(frame);
})();
</script>

</html>
