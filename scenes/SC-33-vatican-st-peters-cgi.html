<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>梵蒂岡聖伯多祿廣場</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-33 梵蒂岡聖伯多祿廣場｜CGI 電影質感
   地點：梵蒂岡城國的聖伯多祿廣場（St. Peter's Square），從協和大道方向往西看。
   真實元素：米開朗基羅設計的大穹頂（含燈籠亭與十字架）、兩側小穹頂、
            馬德諾設計的大殿立面（13 尊雕像、兩座大鐘、中央降福陽台、立面拉丁文題字）、
            階梯前的聖伯多祿（持鑰匙）與聖保祿（持劍）雕像、
            貝尼尼的四排柱廊（頂上一整排聖人雕像）、廣場中央的紅色花崗岩方尖碑（四隻銅獅底座、頂上十字架）、
            方尖碑旁的銅燈柱、左右兩座噴泉、從方尖碑往北延伸的子午線與星座圓盤（方尖碑就是日晷的指針）、
            右後方的宗座宮與西斯汀禮拜堂（屋頂上的小煙囪）、鐘樓下的鐘、
            鐘拱門與銅門的瑞士衛隊（藍黃紅條紋制服、黑色貝雷帽、長戟）、排隊進大殿的人龍、
            朝聖團與舉旗導遊、修女、神父、鴿子、站在煙囪上的海鷗，
            前景廣場外的庇護十二世廣場路口：白色計程車、紅色公車、速克達、腳踏車、石柱。
   風格重點：像 CGI 電影的一格畫面——體積光（光束穿過空氣）、景深模糊（遠山和前景車流是糊的）、
            青橙色電影調色、鏡頭光暈與橫向變形光斑、暗角、底片顆粒、柔和接觸陰影；
            表演時上下出現寬銀幕黑邊、鏡頭緩緩推近。
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），部分另有 --k-名稱（晨昏）。
   JS 會依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）。
   ========================================================= */
:root{
  color-scheme: dark;

  /* —— 天空、雲 —— */
  --d-sky-top:#3a76ad;  --k-sky-top:#2b3c6a;  --n-sky-top:#03070f;
  --d-sky-mid:#86b6d6;  --k-sky-mid:#c97a68;  --n-sky-mid:#0a142a;
  --d-sky-low:#e8dcc4;  --k-sky-low:#ffbd70;  --n-sky-low:#26304a;
  --d-haze:#efe4cc;     --k-haze:#ffc982;     --n-haze:#2a3048;
  --d-cloud:#ffffff;    --k-cloud:#ffd6aa;    --n-cloud:#2c3450;
  --d-cloud-dk:#a4b4c6; --k-cloud-dk:#8a6676; --n-cloud-dk:#10172a;
  --d-overcast:#8e98a4; --k-overcast:#7a6870; --n-overcast:#0c1220;

  /* —— 遠景：梵蒂岡山丘、石松、羅馬建築 —— */
  --d-hill:#93a6a8;     --k-hill:#8c6e72;     --n-hill:#141a2a;
  --d-pine:#4c6a4a;     --k-pine:#3c3a38;     --n-pine:#0a0e16;
  --d-pine-dk:#30482f;  --n-pine-dk:#05080d;
  --d-bldg:#d9c09a;     --k-bldg:#d29a72;     --n-bldg:#2a2934;
  --d-bldg-dk:#a8906e;  --n-bldg-dk:#1b1a24;
  --d-palace:#dcbc8c;   --k-palace:#d6965f;   --n-palace:#383036;
  --d-palace-dk:#a98a62;--n-palace-dk:#221c22;
  --d-brick:#bb8c66;    --k-brick:#b0704e;    --n-brick:#2a2026;
  --d-roof:#a6644a;     --k-roof:#8e4a3a;     --n-roof:#1e171b;

  /* —— 大殿（石灰華）與穹頂（鉛皮） —— */
  --d-stone:#ece0c4;    --k-stone:#f0bf8a;    --n-stone:#84694a;
  --d-stone-hi:#fff7e4; --k-stone-hi:#ffdca6; --n-stone-hi:#b8955e;
  --d-stone-dk:#c0ae8c; --k-stone-dk:#a67a62; --n-stone-dk:#54412f;
  --d-stone-sh:#8c7e68; --k-stone-sh:#664c4c; --n-stone-sh:#2a2024;
  --d-open:#3a3640;     --n-open:#1a1418;
  --d-dome:#9cafbc;     --k-dome:#ae908e;     --n-dome:#4a5268;
  --d-dome-hi:#dbe6ec;  --k-dome-hi:#ffd2a2;  --n-dome-hi:#8e9ab6;
  --d-dome-dk:#5c6e7e;  --k-dome-dk:#584858;  --n-dome-dk:#20263a;
  --d-rib:#efe6d2;      --k-rib:#f4c896;      --n-rib:#a08e78;

  /* —— 柱廊與廣場（深灰小方石＋石灰華分隔線） —— */
  --d-colon:#e8dabe;    --k-colon:#e8b486;    --n-colon:#5e4e42;
  --d-colon-dk:#b2a084; --n-colon-dk:#382e2e;
  --d-colon-deep:#6a6052;--k-colon-deep:#58424a;--n-colon-deep:#181216;
  --d-pave:#9c948a;     --k-pave:#a07c6a;     --n-pave:#2a2830;
  --d-pave-dk:#7a7268;  --n-pave-dk:#1e1c24;
  --d-pave-line:#ece2cc;--k-pave-line:#f2c69a;--n-pave-line:#4e4856;
  --d-granite:#b07868;  --k-granite:#c06e58;  --n-granite:#4a3434;
  --d-granite-dk:#784e46;--n-granite-dk:#241a1c;
  --d-bronze:#4a4036;   --n-bronze:#1a1614;
  --d-water:#8ebfd6;    --k-water:#e0a68a;    --n-water:#2a3a5a;
  --d-water-hi:#eaf6ff; --k-water-hi:#ffe2c2; --n-water-hi:#7a96c0;

  /* —— 前景路口 —— */
  --d-road:#55524f;     --n-road:#16161c;
  --d-curb:#d2c6ae;     --n-curb:#3a3640;

  /* —— 人物 —— */
  --d-skin-1:#f0c8a8;   --n-skin-1:#5e4c4e;
  --d-skin-2:#c08a64;   --n-skin-2:#4a3a3a;
  --d-skin-3:#7a5238;   --n-skin-3:#2e2224;
  --d-hair:#3a2a20;     --n-hair:#141012;
  --d-c1:#c8463c; --n-c1:#4a2226;   /* 紅 */
  --d-c2:#2f5f8a; --n-c2:#18243a;   /* 藍 */
  --d-c3:#e6d6b0; --n-c3:#4a4640;   /* 米 */
  --d-c4:#4a7a5a; --n-c4:#1c2c24;   /* 綠 */
  --d-c5:#e2a23a; --n-c5:#4a3a1e;   /* 芥末黃 */
  --d-c6:#6a4a8a; --n-c6:#2a1e36;   /* 紫 */
  --d-c7:#f2eee6; --n-c7:#5e5e68;   /* 白 */
  --d-c8:#3a3a46; --n-c8:#141418;   /* 深灰 */
  --d-black:#1e1c22;    --n-black:#0b0a0d;   /* 神父與修女的黑袍 */
  --d-white:#f4f2ec;    --n-white:#6a6a74;
  --d-guard-b:#24439a;  --n-guard-b:#121c3e;  /* 瑞士衛隊：藍 */
  --d-guard-y:#f0b02e;  --n-guard-y:#4a381c;  /* 黃 */
  --d-guard-r:#c62e2a;  --n-guard-r:#3a1416;  /* 紅 */

  /* —— 動物 —— */
  --d-pigeon:#8a8e9a;   --n-pigeon:#2e3038;
  --d-pigeon-dk:#565a68;--n-pigeon-dk:#1a1c22;
  --d-gull:#f2f2f0;     --n-gull:#5c5e68;

  /* —— 交通工具 —— */
  --d-taxi:#f2f0ea;     --n-taxi:#5a5a62;
  --d-bus:#b4262c;      --n-bus:#3a1418;
  --d-moto:#5a8a9a;     --n-moto:#1e2a30;
  --d-glass:#2a3a4a;    --n-glass:#0c1218;
  --d-tire:#1c1a1c;     --n-tire:#08080a;

  /* —— 聖誕樹 —— */
  --d-fir:#2f5a3a;      --n-fir:#0e1c14;
  --d-fir-dk:#1e3e28;   --n-fir-dk:#07100b;

  /* —— 不隨日夜變化的顏色（光、煙、燈） —— */
  --sun:#fff6dc; --sun-glow:#ffc878; --moon:#f4f0e0; --star:#ffffff;
  --ray:#ffd6a0; --ray-cool:#cfe6ff; --flare:#8fd0ff; --flare-warm:#ffb070;
  --lit:#ffcf7a; --lamp:#ffe2a0; --flood:#ffb860; --bokeh:#ffc070;
  --smoke-w:#fbfbf8; --smoke-b:#2a2a2c;
  --drape:#a3121c; --drape-hi:#d8343a; --gold:#e8c060;
  --tree-1:#ff5a4a; --tree-2:#ffd25a; --tree-3:#7ad0ff; --tree-4:#ffffff;
  --phone:#e8f4ff; --cam-flash:#ffffff; --rain:#cfdcea; --fog:#e6e8ec;
  --grade-cool:#0d5a70; --grade-warm:#ff8838; --vignette:#000000; --cine-shade:#000000; --cine-light:#fff1d6;
  --taxi-sign:#ffffff; --flag-a:#2f7fd0; --flag-b:#ffd23a; --flag-c:#e2483a; --flag-d:#3aa86a;

  /* —— 頁面介面（電影院般的深色） —— */
  --page-bg:#0f1013; --page-fg:#ece6da; --page-muted:#a49c8e;
  --ui-surface:#1a1b20; --ui-line:#3a3a42; --ui-accent:#d89a4a; --ui-hot:#e8e2d2; --ui-hot2:#b8343a;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:6px;overflow:hidden;background:#000;line-height:0;box-shadow:0 18px 50px rgba(0,0,0,.55)}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:6px;padding:10px 14px}
.panel button{font:700 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:4px;padding:9px 14px;cursor:pointer;letter-spacing:.04em}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:#16120c}
.panel button.big{border-color:var(--ui-hot);color:#16120c;background:var(--ui-hot)}
.panel button.big2{border-color:var(--ui-hot2);color:#fff;background:var(--ui-hot2)}
.panel button.on{background:#f2b23a!important;border-color:#f2b23a!important;color:#16120c!important}
.panel button:disabled{opacity:.45;cursor:default}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid #fff3cc;outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(220px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding:0;list-style:none;color:var(--page-muted);font-size:14px;line-height:1.8;display:flex;flex-wrap:wrap;gap:4px 22px}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .bubble path{fill:rgba(20,20,26,.82);stroke:rgba(255,240,210,.6);stroke-width:1}
#scene .bubble text{fill:#fff4e0;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .screen{mix-blend-mode:screen}
#scene .soft{mix-blend-mode:soft-light}
#scene .ink{font:600 6.4px Georgia,"Times New Roman",serif;letter-spacing:.9px}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       #world 是「攝影機」：整體推近、拉遠、滑鼠視差都在這裡。
       圖層由後往前：天空（星、月、太陽、雲）→ 遠景（山丘、石松、宗座宮、西斯汀禮拜堂與煙囪）
       → 大殿（小穹頂、大穹頂、立面、鐘樓、雕像、階梯）→ 廣場（地面、子午線、柱廊、人群、
       鴿子、方尖碑、噴泉、聖誕樹）→ 前景路口（計程車、公車、速克達，景深模糊）
       → 鏡頭效果（體積光、霧、雨、光暈、調色、暗角、顆粒、寬銀幕黑邊）
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="CGI 電影質感的梵蒂岡聖伯多祿廣場：米開朗基羅的大穹頂高高在上，下方是有十三尊雕像和兩座大鐘的大殿立面；貝尼尼的柱廊像兩隻手臂環抱廣場，中央是紅色花崗岩方尖碑和兩座噴泉；右後方是宗座宮和西斯汀禮拜堂的小煙囪；廣場上有朝聖團、修女、神父、瑞士衛隊和鴿子，前景路口有計程車、公車與速克達經過；陽光從穹頂後方灑下一道道光束">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-top)"/><stop offset=".5" style="stop-color:var(--sky-mid)"/>
        <stop offset=".82" style="stop-color:var(--sky-low)"/><stop offset="1" style="stop-color:var(--haze)"/>
      </linearGradient>
      <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--cloud)"/><stop offset=".55" style="stop-color:var(--cloud)"/><stop offset="1" style="stop-color:var(--cloud-dk)"/>
      </linearGradient>
      <radialGradient id="sunGlow"><stop offset="0" stop-color="#fff6dc" stop-opacity="1"/><stop offset=".12" stop-color="#fff0c8" stop-opacity=".9"/><stop offset=".35" stop-color="#ffc878" stop-opacity=".35"/><stop offset="1" stop-color="#ff9a50" stop-opacity="0"/></radialGradient>
      <radialGradient id="moonGlow"><stop offset="0" stop-color="#e8eeff" stop-opacity=".5"/><stop offset="1" stop-color="#e8eeff" stop-opacity="0"/></radialGradient>
      <radialGradient id="litGlow"><stop offset="0" stop-color="#ffd890" stop-opacity=".9"/><stop offset=".4" stop-color="#ffb860" stop-opacity=".35"/><stop offset="1" stop-color="#ffb860" stop-opacity="0"/></radialGradient>
      <radialGradient id="bokehG"><stop offset="0" stop-color="#ffc070" stop-opacity=".12"/><stop offset=".75" stop-color="#ffc070" stop-opacity=".3"/><stop offset=".9" stop-color="#ffe2b8" stop-opacity=".55"/><stop offset="1" stop-color="#ffd6a0" stop-opacity="0"/></radialGradient>
      <radialGradient id="shadowGrad"><stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
      <radialGradient id="smokeW"><stop offset="0" stop-color="#fbfbf8" stop-opacity=".95"/><stop offset=".6" stop-color="#eeeeea" stop-opacity=".6"/><stop offset="1" stop-color="#e0e0dc" stop-opacity="0"/></radialGradient>
      <radialGradient id="smokeB"><stop offset="0" stop-color="#2a2a2c" stop-opacity=".95"/><stop offset=".6" stop-color="#3a3a3c" stop-opacity=".6"/><stop offset="1" stop-color="#4a4a4c" stop-opacity="0"/></radialGradient>
      <radialGradient id="fogG"><stop offset="0" stop-color="#e6e8ec" stop-opacity=".75"/><stop offset="1" stop-color="#e6e8ec" stop-opacity="0"/></radialGradient>
      <radialGradient id="rayG" cx="0" cy="0" r="1100" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffe6b8" stop-opacity=".6"/><stop offset=".35" stop-color="#ffd6a0" stop-opacity=".22"/><stop offset="1" stop-color="#ffd6a0" stop-opacity="0"/></radialGradient>
      <radialGradient id="ghostG"><stop offset="0" stop-color="#8fd0ff" stop-opacity=".05"/><stop offset=".8" stop-color="#8fd0ff" stop-opacity=".22"/><stop offset="1" stop-color="#8fd0ff" stop-opacity="0"/></radialGradient>
      <radialGradient id="ghostW"><stop offset="0" stop-color="#ffb070" stop-opacity=".3"/><stop offset="1" stop-color="#ffb070" stop-opacity="0"/></radialGradient>
      <linearGradient id="streakG" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#6ab8ff" stop-opacity="0"/><stop offset=".5" stop-color="#d8f0ff" stop-opacity=".9"/><stop offset="1" stop-color="#6ab8ff" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="vigG" cx=".5" cy=".5" r=".72"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".72"/></radialGradient>
      <linearGradient id="gradeG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--grade-cool)"/><stop offset=".55" stop-color="#808080"/><stop offset="1" style="stop-color:var(--grade-warm)"/></linearGradient>
      <linearGradient id="colG" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" style="stop-color:var(--stone-hi)"/><stop offset=".45" style="stop-color:var(--colon)"/><stop offset="1" style="stop-color:var(--colon-dk)"/>
      </linearGradient>
      <linearGradient id="facColG" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" style="stop-color:var(--stone-dk)"/><stop offset=".35" style="stop-color:var(--stone-hi)"/><stop offset=".7" style="stop-color:var(--stone)"/><stop offset="1" style="stop-color:var(--stone-sh)"/>
      </linearGradient>
      <radialGradient id="domeG" cx=".38" cy=".3" r=".85">
        <stop offset="0" style="stop-color:var(--dome-hi)"/><stop offset=".55" style="stop-color:var(--dome)"/><stop offset="1" style="stop-color:var(--dome-dk)"/>
      </radialGradient>
      <linearGradient id="paveG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--pave-dk)"/><stop offset=".5" style="stop-color:var(--pave)"/><stop offset="1" style="stop-color:var(--pave-dk)"/>
      </linearGradient>
      <linearGradient id="wetG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe0f0" stop-opacity=".0"/><stop offset=".2" stop-color="#cfe0f0" stop-opacity=".22"/><stop offset="1" stop-color="#cfe0f0" stop-opacity=".05"/></linearGradient>
      <linearGradient id="floodG" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffb860" stop-opacity=".55"/><stop offset="1" stop-color="#ffb860" stop-opacity=".05"/></linearGradient>
      <linearGradient id="drapeG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--drape)"/><stop offset=".5" style="stop-color:var(--drape-hi)"/><stop offset="1" style="stop-color:var(--drape)"/></linearGradient>
      <linearGradient id="glassG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ab8d0" stop-opacity=".9"/><stop offset="1" style="stop-color:var(--glass)"/></linearGradient>
      <!-- 瑞士衛隊制服的藍黃直條紋 -->
      <pattern id="guardPat" width="6" height="10" patternUnits="userSpaceOnUse">
        <rect width="3" height="10" style="fill:var(--guard-b)"/><rect x="3" width="3" height="10" style="fill:var(--guard-y)"/>
      </pattern>
      <pattern id="rainPat" width="70" height="120" patternUnits="userSpaceOnUse">
        <g stroke="#cfdcea" stroke-width="1.2" stroke-linecap="round" opacity=".7">
          <path d="M10 6l-4 24M48 30l-4 24M64 70l-4 24M26 84l-4 24M58 2l-4 24M18 48l-4 24"/>
        </g>
      </pattern>
      <!-- 景深：遠景輕微模糊、前景車流較模糊 -->

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);
      }
      return _conn.call(this, dest, ...a);
    };
  }
  function stopAudio() {
    let longs = [], ctx = null;
    for (const s of srcs) {
      const c = s.context, now = c.currentTime, m = s.__ss; ctx = c;
      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }
    if (longs.length && ctx) {
      const g = outs.get(ctx), now = ctx.currentTime;
      if (g) {
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 1.1); g.gain.setValueAtTime(0, now + 1.2);
        g.gain.linearRampToValueAtTime(1, now + 1.9);
      }
      longs.forEach(s => { try { s.stop(now + 1.15); } catch (e) {} srcs.delete(s); });
    }
    srcs.clear();
  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');
    // 凍結色票：把目前的 CSS 變數抄到殘影上，底下換色不影響殘影
    const cs = getComputedStyle(svg);
    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }
      }
    }
    const par = svg.parentElement;
    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });
    added = [];
  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>
/* ---- 表演氛圍（取代寬銀幕黑邊）：k = 0~1，四周輕微暗角＋中央微亮；fx/fy 可讓亮處偏向表演焦點 ---- */
let cineK = 0, cineW = 0;
function setCine(k, fx, fy) {

    sfx('shoot'); return;
  }
  // 白天：一群鴿子從天空飛過
  for (let i = 0; i < 9; i++) { const g = el('path', { d: 'M0 0C-4 -5 -9 -5 -12 -2C-7 -2 -3 0 0 2C3 0 7 -2 12 -2C9 -5 4 -5 0 0Z', fill: 'rgba(40,40,50,.75)' }, $('fx')); birds.push({ g, x: x + rand(-30, 30), y: y + rand(-20, 20), vx: rand(90, 150) * (x < 800 ? 1 : -1), vy: rand(-30, -8), t: 0, life: rand(3, 5), ph: rand(0, 6) }); }
  sfx('flap');
}
function gullFly() { if (gull.fly > 0) return; gull.fly = 1; gull.t = 0; }
function blackSmoke() {
  if (show.on) return;
  for (let i = 0; i < 10; i++) setTimeout(() => puff(true, 1.1), i * 120);
  sfx('whoosh');
  setTimeout(() => say(700, 400, 'Fumata nera…還沒選出', 2.2), 900);
}
let queueOff = 0, queueTarget = 0;
function guardSalute() {
  guards.forEach((G, i) => { G.salute = 1.4; });
  sfx('stamp');
}

/* ---------------- ④ 動畫：主迴圈 ---------------- */
let last = performance.now(), time = 0, colorAcc = 0, twAcc = 0;
function loop(now) { const dt = Math.min(.1, (now - last) / 1000); last = now; step(dt); requestAnimationFrame(loop); }
function step(dt) {
  time += dt;
  const mv = reduced ? 0 : 1;
  if (T.auto && !T.dragging && !reduced && !show.on) T.t = (T.t + dt / DAY_SEC) % 1;
  // 天氣漸變
  const wk = Math.min(1, dt * .6);
  for (const k in wx) wx[k] = lerp(wx[k], wxT[k], wk);
  colorAcc += dt; if (colorAcc > .12) { colorAcc = 0; applyColors(); }
  $('overcastSky').setAttribute('opacity', f1(wx.cloud * .7 + wx.rain * .22));
  $('rainG').setAttribute('opacity', f1(wx.rain));
  $('wetSheen').setAttribute('opacity', f1(wx.rain * .9));
  $('rain1').setAttribute('transform', `translate(${f1((time * 60) % 70)} ${f1((time * 520) % 120)})`);
  $('rain2').setAttribute('transform', `scale(1.4) translate(${f1((time * 50) % 70)} ${f1((time * 420) % 120)})`);
  $('fogG').setAttribute('opacity', f1(wx.fog * (1 - night * .4)));
  fogBack.setAttribute('opacity', f1(wx.fog * .55 * (1 - night * .5))); fogBas.setAttribute('opacity', f1(wx.fog * .32 * (1 - night * .5)));
  fogs.forEach(F => { F.x += F.v * dt * mv; if (F.x > 1900) F.x = -300; F.n.setAttribute('transform', `translate(${f1(F.x)} ${f1(F.y)})`); });
  // 星星閃爍
  twAcc += dt; if (twAcc > .2 && night > .3) { twAcc = 0; const s = $('stars').children; for (let i = 0; i < 6; i++) { const n = s[Math.floor(Math.random() * s.length)]; n.setAttribute('opacity', f1(rand(.2, 1))); } }
  // 雲
  clouds.forEach(C => {
    C.x += C.v * dt * mv; if (C.x > 1800) C.x = -250;
    C.g.setAttribute('transform', `translate(${f1(C.x)} ${f1(C.y)})`);
    C.g.setAttribute('opacity', f1(.55 + wx.cloud * .45));
    if (C.rain > 0) { C.rain -= dt; if (Math.random() < dt * 30) particle($('fx'), ...toScreen(C.x + rand(-60, 60), C.y + 10, PAR.sky), 'var(--rain)', 0, 280, .8, 1.3); }
  });
  stepCamera(dt, mv);
  stepLens(dt);
  stepShow(dt, mv);
  stepTree(dt);
  // 穹頂推近（點穹頂）
  if (cam.pushT > 0) {
    cam.pushT -= dt;
    const k = 1 - cam.pushT / 6;
    cam.fz = 1.7; cam.fx = 800; cam.fy = 120;
    cam.push = ease(smooth(0, .4, k)) * (1 - ease(smooth(.7, 1, k)));
    if (cam.pushT <= 0) cam.push = 0;
  }
  // 行人
  lanes.forEach(Q => {
    stepLane(Q, dt, mv);
    Q.list.forEach(P => P.umb.setAttribute('opacity', f1(smooth(.3, .7, wx.rain))));
  });
  // 靜止的人：輕微呼吸、下雨撐傘
  staticPeople.concat(guideGroup, nuns, photographers).forEach(P => {
    P.ph += dt * .8 * mv; P.walk = 0;
    if (P.wave > 0) { P.wave -= dt; P.armF.setAttribute('transform', `rotate(${f1(-150 + Math.sin(time * 14) * 20)} 2 -76)`); }
    else if (P.kind !== 'photo' && P.kind !== 'selfie' && P.kind !== 'guide') P.armF.removeAttribute('transform');
    P.umb.setAttribute('opacity', f1(smooth(.3, .7, wx.rain)));
    P.b.setAttribute('transform', `translate(0 ${f1(Math.sin(P.ph) * .6)}) scale(${f1(P.s * P.dir)} ${f1(P.s)})`);
  });
  if (guideGroup[0] && guideGroup[0].flag) guideGroup[0].flag.setAttribute('transform', `rotate(${f1(Math.sin(time * 2) * 5 * mv)} 8 -134)`);
  // 瑞士衛隊：平常站得筆直，被點時頓地立正
  guards.forEach(G => {
    if (G.salute > 0) { G.salute -= dt; const k = G.salute; G.jump = Math.max(0, Math.sin(k * 9)) * 3; if (G.halberd) G.halberd.setAttribute('transform', `translate(0 ${f1(-Math.max(0, Math.sin(k * 9)) * 6)})`); }
    else { G.jump = 0; }
    G.walk = 0; placeP(G);
  });
  // 排隊人龍：沿著柱廊往大殿方向一格一格前進
  queueOff = lerp(queueOff, queueTarget, Math.min(1, dt * 1.5));
  queue.forEach((P, i) => {
    let k = ((i - queueOff) % 12 + 12) % 12;
    const kk = k / 11;
    P.x = lerp(1100, 1300, kk); P.y = lerp(408, 446, kk); P.s = lerp(.4, .5, kk) * (P.kind === 'kid' ? .66 : 1);
    P.walk = Math.abs(queueTarget - queueOff) > .05 ? 1 : 0; P.ph += dt * 6 * P.walk * mv;
    P.g.setAttribute('opacity', f1(clamp(Math.min(k, 11.6 - k) * 2.5 + .1, 0, 1)));
    P.umb.setAttribute('opacity', f1(smooth(.3, .7, wx.rain)));
    placeP(P);
  });
  // 鴿子：在地上啄食，滑鼠靠近或被點就飛起來，繞一圈再降落
  pigeons.forEach(P => {
    P.t += dt;
    if (P.fly === 0) {
      if (mouse.in && mv) { const [lx, ly] = toLayer(mouse.x, mouse.y, PAR.stage); if (Math.hypot(lx - P.x, (ly - P.y) * 2) < 46) { if (scarePigeons(lx, ly, 70) > 2) sfx('flap'); } }
      if (Math.random() < dt * .3) P.dir *= -1;
      if (Math.random() < dt * .5) P.x += P.dir * rand(2, 6);
      const peck = Math.max(0, Math.sin(P.t * 3 + P.ph)) * 30 * mv;
      P.head.setAttribute('transform', `rotate(${f1(peck)} 3 -7)`);
      P.wing.setAttribute('transform', '');
    } else {
      P.x += P.vx * dt; P.y += P.vy * dt;
      P.vy += (P.t < 1.6 ? 30 : 90) * dt;
      if (P.t > 1.6 && P.t < 3.2) { P.vx = lerp(P.vx, (P.hx - P.x) * .8, dt * 2); }
      if (P.t > 2 && P.y >= P.hy) { P.y = P.hy; P.fly = 0; P.t = 0; }
      P.dir = P.vx >= 0 ? 1 : -1;
      P.wing.setAttribute('transform', `translate(0 -8) scale(1 ${f1(Math.sin(time * 30 + P.ph) * 2.4)}) translate(0 8)`);
    }
    P.g.setAttribute('transform', `translate(${f1(P.x)} ${f1(P.y)}) scale(${f1(P.s * P.dir)} ${f1(P.s)})`);
  });
  // 海鷗
  if (gull.fly > 0) {
    gull.t += dt; const k = gull.t / 6;
    const a = k * Math.PI * 2;
    gull.x = gull.home[0] + Math.sin(a) * 160; gull.y = gull.home[1] - Math.sin(a / 2) * 90 + (1 - Math.cos(a)) * 6;
    gull.wing.setAttribute('transform', `translate(0 -3) scale(1 ${f1(Math.sin(time * 18) * 3)}) translate(0 3)`);
    gull.g.setAttribute('transform', `translate(${f1(gull.x)} ${f1(gull.y)}) scale(${Math.cos(a) >= 0 ? 1.3 : -1.3} 1.3)`);
    if (gull.t > 6) { gull.fly = 0; gull.x = gull.home[0]; gull.y = gull.home[1]; }
  } else {
    gull.wing.setAttribute('transform', '');
    gull.g.setAttribute('transform', `translate(${gull.home[0]} ${gull.home[1]}) scale(1.3)`);
  }
  // 噴泉的水流
  fountains.forEach((F, i) => {
    F.boost = Math.max(0, F.boost - dt * .4);
    F.streaks.forEach((s, j) => s.setAttribute('stroke-dashoffset', f1(-(time * (40 + F.boost * 60) * mv + j * 3))));
    F.jet.setAttribute('d', `M${F.x} ${F.y - 74}V${f1(F.y - 92 - F.boost * 40 - Math.sin(time * 6 + i) * 2 * mv)}`);
    F.ripples.setAttribute('transform', `translate(${F.x} ${F.y - 12}) scale(${f1(1 + Math.sin(time * 1.5 + i) * .05 * mv)}) translate(${-F.x} ${-F.y + 12})`);
    if (F.boost > .2 && Math.random() < dt * 20) particle(stageFx, F.x + rand(-6, 6), F.y - 92 - F.boost * 40, 'var(--water-hi)', rand(-50, 50), rand(-40, 10), .9, rand(1, 2), { g: 220 });
  });
  stepVehicles(dt, mv);
  // 子午線發光（點方尖碑）
  if (meridianG.t > 0) { meridianG.t -= dt; meridianG.setAttribute('opacity', f1(Math.min(1, meridianG.t) * (.75 + .25 * Math.sin(time * 5)))); } else meridianG.setAttribute('opacity', 0);
  // 鐘（點大鐘時擺動）
  if (bellG.swing > 0 && !show.on) { bellG.swing -= dt; bellG.setAttribute('transform', `translate(580 257) rotate(${f1(Math.sin(time * 4.2) * 24 * Math.min(1, bellG.swing))})`); }
  // 天上飛過的鳥
  for (let i = birds.length - 1; i >= 0; i--) {
    const b = birds[i]; b.t += dt; b.x += b.vx * dt; b.y += b.vy * dt;
    b.g.setAttribute('transform', `translate(${f1(b.x)} ${f1(b.y)}) scale(${f1(1 + Math.sin(time * 16 + b.ph) * .35)} 1)`);
    b.g.setAttribute('opacity', f1(Math.min(1, (b.life - b.t) * 2)));
    if (b.t > b.life) { b.g.remove(); birds.splice(i, 1); }
  }
  // 粒子（煙、水花、雨滴）
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt;
    if (p.life <= 0) { p.n.remove(); parts.splice(i, 1); continue; }
    p.vy += p.g * dt; p.vx += p.drift * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    const k = p.life / p.max;
    p.n.setAttribute('transform', `translate(${f1(p.x)} ${f1(p.y)})`);
    if (p.grow) p.n.setAttribute('r', f1(p.r + (1 - k) * p.grow * 3));
    p.n.setAttribute('opacity', f1(p.op * Math.min(1, k * 1.6)));
  }
  for (let i = tweens.length - 1; i >= 0; i--) { const tw = tweens[i]; tw.t += dt; const k = Math.min(1, tw.t / tw.dur); tw.fn(k); if (k >= 1) { tweens.splice(i, 1); tw.done && tw.done(); } }
}

/* ---------------- ⑤ 互動：綁定 ---------------- */
function bindAll() {
  onAct($('moonG'), () => { sfx('chime'); setTime(10); });
  $('clouds').querySelectorAll('[data-cloud]').forEach(g => onAct(g, () => { clouds[+g.dataset.cloud].rain = 2.4; sfx('drops'); }));
  $('skyHit').addEventListener('click', e => { userGesture = true; ensureAudio(); const p = svgPoint(e); skyClick(p.x, p.y); });
  onAct(domeG, () => { if (show.on) return; cam.pushT = 6; sfx('chord'); });
  onAct(chimneyG, () => blackSmoke());
  onAct(gull.g, () => { gullFly(); sfx('gull'); });
  [clockL, clockR].forEach(c => onAct(c.g, () => {
    if (show.on) return;
    const n = Math.min(6, Math.round(hourNow) % 12 || 12);
    bellG.swing = n * 1.1 + .6; sfx('toll', n);
    say(c.cx, 190, `噹～ ${n} 響`, 1.6);
  }));
  onAct(obeliskG, () => { meridianG.t = 5; sfx('chime'); say(OB.x, 200, '方尖碑的影子就是日晷指針', 2.4); });
  fountains.forEach(F => onAct(F.g, () => { F.boost = 1.6; splash(F, 16); sfx('water'); if (scarePigeons(F.x + (F.x < 800 ? 150 : -150), 490, 160)) setTimeout(() => sfx('flap'), 200); }));
  guards.groups.forEach(g => onAct(g, () => guardSalute()));
  const qg = queue[0].g.parentNode;
  onAct(qg, () => { queueTarget += 1; sfx('steps'); });
  onAct(guideGroup[0].g.parentNode, () => { guideGroup.forEach((P, i) => setTimeout(() => camFlash(P.x + 6 * P.s, P.y - 92 * P.s), i * 140)); sfx('shutter'); });
  onAct(nuns[0].g.parentNode, () => { nuns.forEach(P => P.wave = 1.6); sfx('wave'); say(940, 400, 'Buongiorno!', 1.6); });
  onAct(photographers[1].g.parentNode, () => { const P = photographers[1]; camFlash(P.x - 20, P.y - 88); sfx('shutter'); });
  const pg = pigeons[0].g.parentNode; clickable(pg, '鴿子：點一下全部飛起來');
  onAct(pg, e => { const p = svgPoint(e); const [x, y] = toLayer(p.x, p.y, PAR.stage); scarePigeons(x, y, 400); sfx('flap'); setTimeout(() => sfx('coo'), 1200); });
  vehicles.forEach(V => {
    clickable(V.g, { taxi: '計程車：點一下靠邊停', bus: '公車：點一下進站停靠', moto: '速克達：點一下加速', bike: '腳踏車：點一下按車鈴' }[V.kind]);
    onAct(V.g, () => {
      if (V.kind === 'taxi') { V.stop = 2.2; sfx('door'); }
      else if (V.kind === 'bus') { V.stop = 3; sfx('hiss'); }
      else if (V.kind === 'moto') { V.v = V.v0 * 1.8; sfx('rev'); }
      else sfx('bikebell');
    });
  });
  // 路人：點一下揮手
  lanes.forEach(Q => Q.list.forEach(P => { clickable(P.g, '路人：點一下揮手'); onAct(P.g, () => { P.v0 = P.v0 || P.v; P.wave = 1.2; sfx('wave'); say(P.x, P.y - 110 * P.s, pick(['Ciao!', 'Bellissimo!', '好壯觀！', 'Wow!']), 1.4); }); }));
  svg.addEventListener('pointermove', e => { const p = svgPoint(e); mouse.x = p.x; mouse.y = p.y; mouse.in = true; });
  svg.addEventListener('pointerleave', () => { mouse.in = false; });

  $('btnShow').addEventListener('click', () => { userGesture = true; ensureAudio(); startShow('smoke'); });
  $('btnXmas').addEventListener('click', () => { userGesture = true; ensureAudio(); startShow('xmas'); });
  $('btnWeather').addEventListener('click', () => { userGesture = true; ensureAudio(); setWeather((wxIdx + 1) % WX.length); if (WX[wxIdx][0] === 'fog') sfx('wind'); if (WX[wxIdx][0] === 'cloudy') sfx('swoosh'); });
  $('btnSound').addEventListener('click', () => {
    soundOn = !soundOn; userGesture = true; ensureAudio();
    if (master) master.gain.setValueAtTime(soundOn ? .55 : 0, actx.currentTime);
    if (!soundOn) { stopAll(); rainSound(false); try { window.sceneMusic && window.sceneMusic.stop(); } catch (e) {} } else rainSound(WX[wxIdx][0] === 'rain');
    $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  });
  $('btnDay').addEventListener('click', () => setTime(10.5));
  $('btnDusk').addEventListener('click', () => setTime(17.9));
  $('btnNight').addEventListener('click', () => setTime(21.5));
  $('btnAuto').addEventListener('click', () => { T.auto = !T.auto; $('btnAuto').setAttribute('aria-pressed', String(T.auto)); });
  const tr = $('timeRange');
  tr.addEventListener('input', () => { T.dragging = true; T.t = tr.value / 1000; applyColors(true); });
  tr.addEventListener('change', () => { T.dragging = false; });
  window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
  window.addEventListener('pointerdown', () => document.body.classList.remove('kbd'));
  mq.addEventListener && mq.addEventListener('change', () => { reduced = mq.matches; });
}

/* ---------------- 初始化 ---------------- */
function init() {
  drawSky();
  drawBack();
  smokeG = el('g', { class: 'noHit' }, L.back);
  drawBasilica();
  // 空氣透視：遠景前面一層薄霧
  el('rect', { x: -200, y: 140, width: 2000, height: 200, fill: 'url(#hazeG)', class: 'noHit' }, L.back);
  // 立面底部的環境遮蔽陰影、穹頂的高光
  el('rect', { x: 548, y: 300, width: 504, height: 84, fill: 'url(#aoG)', class: 'noHit' }, L.bas);
  specEl = el('ellipse', { cx: 762, cy: 112, rx: 34, ry: 52, fill: 'url(#specG)', class: 'noHit screen' }, domeG);
  // 起霧時，越遠的建築越看不清楚
  fogBack = el('rect', { x: -200, y: -200, width: 2000, height: 600, fill: 'var(--fog)', opacity: 0, class: 'noHit' }, L.back);
  fogBas = el('rect', { x: -200, y: -200, width: 2000, height: 620, fill: 'var(--fog)', opacity: 0, class: 'noHit' }, L.bas);
  drawSquare();
  // 廣場上的光池與前景的暗部（電影打光）
  poolEl = el('ellipse', { cx: 800, cy: 470, rx: 720, ry: 80, fill: 'url(#poolG)', class: 'noHit screen' }, L.stage);
  el('rect', { x: -100, y: 500, width: 1800, height: 140, fill: 'url(#foreDarkG)', class: 'noHit' }, L.stage);
  drawColonnade(-1);
  drawColonnade(1);
  drawPeople();
  stageFx = el('g', { class: 'noHit' }, L.stage);
  drawFog();
  drawLens();
  bindAll();
  if (reduced) { T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false'); }
  setWeather(0);
  applyColors(true);
  step(1 / 60);
  requestAnimationFrame(loop);
  // 網站「作者精選」播放區（純插畫版放在 iframe 裡）：預設播放聖誕夜點燈，結束後重複輪播；
  // 不會自己出聲。不另外放背景配樂：網站的「播放配樂」開關直接控制點燈秀自己的音樂。
  const inPicks = (() => { let top = true; try { top = window.top === window; } catch (e) { top = false; } return !!document.getElementById('pure-art') && !top; })();
  if (inPicks) {
    setTimeout(() => startShow('xmas', true), 800);
    setInterval(() => { if (!show.on) startShow('xmas', true); }, 3000);
    window.sceneMusic = {
      playing: false,
      start(c) {
        if (this.playing) return; this.playing = true; pickAudio = true; userGesture = true;
        if (c && c !== actx) useCtx(c); else ensureAudio();
        if (actx && actx.state !== 'running') actx.resume();
        if (show.on && show.t < 4) playChristmas();
      },
      stop() { this.playing = false; pickAudio = false; stopAll(); },
      duck() {}
    };
  }
}
// 讓 person() 建立的人都登記到 ALLP（更新影子用）
const _person = person;
person = function (parent, o) { const P = _person(parent, o); ALLP.push(P); return P; };
init();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on && show.kind,
  btn: { smoke: 'btnShow', xmas: 'btnXmas' },
  ff: () => { show.flags = new Proxy({}, { get: () => 1 }); show.t = 99; },
  save: () => ({ t: T.t, auto: T.auto, w: wxIdx, x: xmasOn }),
  stop: () => endShow(),
  restore: s => {
    if (!s.x) { xmasOn = false; treeG.style.display = presepeG.style.display = 'none'; }   // 聖誕樹收起來
    if (wxIdx !== s.w) setWeather(s.w);
    T.t = s.t; T.auto = s.auto; $('btnAuto') && $('btnAuto').setAttribute('aria-pressed', String(T.auto)); applyColors(true);
  }
});
/* /ShowStop */
})();
</script>
