<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>深海熱泉的發光生物</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-82 深海熱泉的發光生物｜CGI 電影質感
   地點：海面下約 1,500 公尺的深海熱泉區（陽光完全照不到的「午夜帶」）。
   視角：鏡頭跟在一艘深海潛水器旁邊，潛水器的探照燈照向右方的熱泉噴口。
         背景：深不見底的黑藍海水、遠方的海底山脊、零星閃爍的發光生物。
         中景：黑煙囪熱泉（礦物堆成的煙囪，噴出黑色熱水煙柱）、
               根部的管蟲叢（白色的管子、紅色的鰓冠）、貽貝床、白色的熱泉螃蟹、成群的熱泉蝦；
               海床上慢慢走的海豬（深海海參）、大王具足蟲；
               水層裡的冠水母、櫛水母、長長一串的管水母、小飛象章魚、燈籠魚群；
               左邊懸停的深海潛水器（兩名駕駛在前方的觀察窗裡）。
         前景：左下角的玄武岩枕狀熔岩，岩石前埋伏著一條深海鮟鱇魚，頭上的餌球發著藍光。
   真實元素：深海鮟鱇魚頭上的釣竿（餌球裡住著發光細菌）；
         冠水母被攻擊時，鐘體周圍會一圈圈閃出藍光（「防盜警報」），還有一條特別長的觸手；
         櫛水母身上的八排櫛板被光照到會折射出彩虹；
         管水母是由許多小個體連成一長串的群體；
         黑煙囪噴出的熱水可超過 300°C，管蟲沒有嘴巴，靠體內的細菌製造養分；
         燈籠魚的「日夜垂直遷移」：白天待在深海，晚上游到上層覓食；
         海雪：從上層慢慢飄落的有機碎屑；
         抹香鯨用喀喀聲（回聲定位）在深海找大王魷魚，鯨魚皮膚上常留著魷魚吸盤的圓形疤痕。
   日夜循環：深海沒有日夜，這裡用「海面時間」表示。白天燈籠魚群在這一層，入夜後牠們往上游走。
   風格重點：CGI 動畫電影的寬銀幕畫面——四周幾乎全黑，只有潛水器的探照燈照出一道有體積感的光束，
            光束裡看得到飄落的海雪；發光生物自己會亮；暗角、底片顆粒；
            滑鼠移動帶動多層視差，探照燈跟著滑鼠轉；表演時上下出現寬銀幕黑邊、鏡頭緩緩推近。
   效能：不對大圖層做模糊；光暈一律用放射漸層；黑暗用一張遮罩（mask）挖出光照的地方。
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（海面白天）／--n-名稱（海面夜晚），JS 依時間內插，輸出成 --名稱。
   其餘色票不隨時間變化，直接使用。
   ========================================================= */
:root{
  color-scheme: dark;

  /* —— 海水（白天、夜晚只差一點點：深海幾乎沒有陽光） —— */
  --d-water-top:#0b3550;  --n-water-top:#061a2c;
  --d-water-mid:#06263a;  --n-water-mid:#041624;
  --d-water-deep:#03121e; --n-water-deep:#020b14;
  --d-far-glow:#1a5a7a;   --n-far-glow:#0e3048;
  --abyss:#010409;          /* 黑暗本身的顏色（遮罩外面） */
  --ridge:#0a1a26; --ridge2:#0c2230;

  /* —— 海床、岩石、熱泉煙囪 —— */
  --floor:#3a3e44; --floor-dk:#1c1f24; --floor-hi:#5c6066;
  --sediment:#6a6458;
  --basalt:#2a2d34; --basalt-hi:#4a505a; --basalt-dk:#121418;
  --chim:#4a3a30; --chim-hi:#7a6450; --chim-dk:#1e1612; --chim-rust:#8a4a26; --chim-sulf:#b8a04a;
  --bact:#d8d4c4;           /* 白色細菌墊 */
  --plume:#4a4038; --plume-hi:#8a7a6c;
  --shimmer:#9ab8c8;

  /* —— 熱泉生物 —— */
  --tube:#e8e4da; --tube-dk:#a8a294;
  --plume-red:#d8203a; --plume-red-dk:#8a0e22;
  --mussel:#2a2620; --mussel-hi:#8a7a5a;
  --crab:#ece6da; --crab-dk:#b4aa98;
  --shrimp:#e8c8b0;
  --seapig:#e8b8b0; --seapig-dk:#b87a78;
  --isopod:#b8aab0; --isopod-dk:#7a6a76;

  /* —— 水層生物 —— */
  --angler:#2a2224; --angler-hi:#5a4a46; --angler-dk:#0e0a0c; --tooth:#f4f0e6; --angler-eye:#c8d8e0;
  --atolla:#9a1a24; --atolla-dk:#4a060e; --atolla-hi:#d24a4a;
  --comb:#cfe8f0; --comb-dk:#7aa8b8;
  --siph:#d8e8f0; --siph-dk:#8aa8c0; --siph-red:#e06a5a;
  --dumbo:#f0a880; --dumbo-dk:#c0705a; --dumbo-hi:#ffd0b0;
  --lantern:#5a6a7a; --lantern-hi:#b8c8d4;
  --whale:#4a4644; --whale-dk:#262422; --whale-hi:#7a746e; --whale-scar:#a8a098;
  --squid:#b4483a; --squid-dk:#6a2018; --squid-hi:#e0806a; --squid-eye:#1a1a22;
  --ink:#140a0c;

  /* —— 深海潛水器（原創設計） —— */
  --sub-hull:#eef0ee; --sub-hull-hi:#ffffff; --sub-hull-dk:#9aa2a6;
  --sub-orange:#f08a1a; --sub-orange-dk:#b05a0e;
  --sub-frame:#3a4048; --sub-metal:#8a949c; --sub-glass:#16384a;
  --pilot1:#2a3a5a; --pilot2:#5a2a3a; --skin1:#e8b898; --skin2:#a8704c; --hair:#1e1612;

  /* —— 光（不隨時間變化） —— */
  --beam:#d8f4ff; --lamp:#ffffff; --lamp-warm:#fff2d0;
  --bio-blue:#3ab8ff; --bio-cyan:#4af0e8; --bio-green:#7affb8; --lure:#8af6ff;
  --spark:#9adfff; --strobe:#f4fbff; --screen-glow:#5ab8ff; --beacon:#ffffff; --nav-red:#ff4a3a;
  --snow:#e8f0f0;
  --cine-shade:#000000; --cine-light:#fff1d6;

  /* —— 頁面介面（電影院般的深色） —— */
  --page-bg:#05080c; --page-fg:#e8f2f6; --page-muted:#8a9aa6;
  --ui-surface:#0c141a; --ui-line:#22323e; --ui-accent:#3ab8e8; --ui-hot:#f08a1a; --ui-hot2:#3a6ae8;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:6px;overflow:hidden;background:#000;line-height:0;box-shadow:0 18px 50px rgba(0,0,0,.55)}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:6px;padding:10px 14px}
.panel button{font:700 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:4px;padding:9px 14px;cursor:pointer;letter-spacing:.04em}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:#03141c}
.panel button.big{border-color:var(--ui-hot);color:#1a0c04;background:var(--ui-hot)}
.panel button.big2{border-color:var(--ui-hot2);color:#fff;background:var(--ui-hot2)}
.panel button:disabled{opacity:.45;cursor:default}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid #d8fbff;outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(220px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding:0;list-style:none;color:var(--page-muted);font-size:14px;line-height:1.8;display:flex;flex-wrap:wrap;gap:4px 22px}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .bubble path{fill:rgba(4,14,22,.86);stroke:rgba(150,220,255,.5);stroke-width:1}
#scene .bubble text{fill:#eaf8ff;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .screen{mix-blend-mode:screen}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 舞台。圖層由遠到近：
       海水背景（遠方山脊、遠處的發光點）
       → 中景（海床、熱泉煙囪與煙柱、管蟲、貽貝、螃蟹、蝦、海豬、具足蟲、
               水母、管水母、章魚、燈籠魚、潛水器、表演用的抹香鯨與大王魷魚、海雪）
       → 前景（枕狀熔岩、鮟鱇魚）
       → 黑暗（一整片深色，用遮罩挖出探照燈照到的地方）
       → 發光層（生物自己發的光、潛水器的燈）→ 探照燈光束 → 特效
       → 鏡頭效果（暗角、顆粒、寬銀幕黑邊）
       大部分的物件由下方 JS 產生，這裡只放骨架與漸層。
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" role="img" aria-label="深海熱泉：一艘深海潛水器的探照燈照亮黑煙囪熱泉、紅色管蟲叢與白色螃蟹，四周漂著會發光的水母、管水母和燈籠魚，前景有一條頭上掛著發光餌球的鮟鱇魚">
    <defs>
      <!-- 海水 -->
      <linearGradient id="waterG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--water-top)"/><stop offset=".55" style="stop-color:var(--water-mid)"/><stop offset="1" style="stop-color:var(--water-deep)"/>
      </linearGradient>
      <radialGradient id="farGlowG"><stop offset="0" style="stop-color:var(--far-glow)" stop-opacity=".55"/><stop offset="1" style="stop-color:var(--far-glow)" stop-opacity="0"/></radialGradient>
      <!-- 黑暗遮罩用：白色＝黑暗、黑色＝被照亮 -->
      <radialGradient id="coneMG" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="980">
        <stop offset="0" stop-color="#000"/><stop offset=".35" stop-color="#1a1a1a"/><stop offset=".7" stop-color="#7a7a7a"/><stop offset="1" stop-color="#fff"/>
      </radialGradient>
      <radialGradient id="haloMG"><stop offset="0" stop-color="#000"/><stop offset=".45" stop-color="#555"/><stop offset="1" stop-color="#fff"/></radialGradient>
      <!-- 看得見的光束（水中的散射光） -->
      <radialGradient id="beamG" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="980">
        <stop offset="0" style="stop-color:var(--beam)" stop-opacity=".5"/><stop offset=".12" style="stop-color:var(--beam)" stop-opacity=".2"/>
        <stop offset=".5" style="stop-color:var(--beam)" stop-opacity=".07"/><stop offset="1" style="stop-color:var(--beam)" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="flareG"><stop offset="0" style="stop-color:var(--lamp)" stop-opacity="1"/><stop offset=".25" style="stop-color:var(--beam)" stop-opacity=".55"/><stop offset="1" style="stop-color:var(--beam)" stop-opacity="0"/></radialGradient>
      <!-- 發光 -->
      <radialGradient id="glowBlue"><stop offset="0" style="stop-color:var(--bio-blue)" stop-opacity=".95"/><stop offset=".35" style="stop-color:var(--bio-blue)" stop-opacity=".35"/><stop offset="1" style="stop-color:var(--bio-blue)" stop-opacity="0"/></radialGradient>
      <radialGradient id="glowCyan"><stop offset="0" stop-color="#ffffff"/><stop offset=".18" style="stop-color:var(--lure)" stop-opacity=".9"/><stop offset=".5" style="stop-color:var(--lure)" stop-opacity=".22"/><stop offset="1" style="stop-color:var(--lure)" stop-opacity="0"/></radialGradient>
      <radialGradient id="glowGreen"><stop offset="0" style="stop-color:var(--bio-green)" stop-opacity=".9"/><stop offset=".4" style="stop-color:var(--bio-green)" stop-opacity=".25"/><stop offset="1" style="stop-color:var(--bio-green)" stop-opacity="0"/></radialGradient>
      <radialGradient id="glowWhite"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".3" stop-color="#e8f8ff" stop-opacity=".45"/><stop offset="1" stop-color="#e8f8ff" stop-opacity="0"/></radialGradient>
      <radialGradient id="glowRed"><stop offset="0" style="stop-color:var(--nav-red)" stop-opacity="1"/><stop offset="1" style="stop-color:var(--nav-red)" stop-opacity="0"/></radialGradient>
      <!-- 煙柱、墨汁 -->
      <radialGradient id="plumeG"><stop offset="0" style="stop-color:var(--plume-hi)" stop-opacity=".9"/><stop offset=".55" style="stop-color:var(--plume)" stop-opacity=".55"/><stop offset="1" style="stop-color:var(--plume)" stop-opacity="0"/></radialGradient>
      <radialGradient id="inkG"><stop offset="0" style="stop-color:var(--ink)" stop-opacity=".95"/><stop offset=".6" style="stop-color:var(--ink)" stop-opacity=".6"/><stop offset="1" style="stop-color:var(--ink)" stop-opacity="0"/></radialGradient>
      <radialGradient id="silG"><stop offset="0" stop-color="#d8c8b0" stop-opacity=".5"/><stop offset="1" stop-color="#d8c8b0" stop-opacity="0"/></radialGradient>
      <!-- 物件材質 -->
      <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--floor-hi)"/><stop offset=".25" style="stop-color:var(--floor)"/><stop offset="1" style="stop-color:var(--floor-dk)"/></linearGradient>
      <linearGradient id="basaltG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--basalt-hi)"/><stop offset=".4" style="stop-color:var(--basalt)"/><stop offset="1" style="stop-color:var(--basalt-dk)"/></linearGradient>
      <linearGradient id="chimG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--chim-dk)"/><stop offset=".28" style="stop-color:var(--chim-hi)"/><stop offset=".55" style="stop-color:var(--chim)"/><stop offset="1" style="stop-color:var(--chim-dk)"/></linearGradient>
      <linearGradient id="tubeG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--tube-dk)"/><stop offset=".4" style="stop-color:var(--tube)"/><stop offset="1" style="stop-color:var(--tube-dk)"/></linearGradient>
      <linearGradient id="hullG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sub-hull-hi)"/><stop offset=".45" style="stop-color:var(--sub-hull)"/><stop offset="1" style="stop-color:var(--sub-hull-dk)"/></linearGradient>
      <linearGradient id="sailG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sub-orange)"/><stop offset="1" style="stop-color:var(--sub-orange-dk)"/></linearGradient>
      <radialGradient id="domeG" cx=".35" cy=".35" r=".75"><stop offset="0" stop-color="#9ad8f0" stop-opacity=".55"/><stop offset=".5" style="stop-color:var(--sub-glass)" stop-opacity=".85"/><stop offset="1" style="stop-color:var(--sub-glass)"/></radialGradient>
      <linearGradient id="angG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--angler-hi)"/><stop offset=".5" style="stop-color:var(--angler)"/><stop offset="1" style="stop-color:var(--angler-dk)"/></linearGradient>
      <radialGradient id="atollaG" cx=".5" cy=".3" r=".75"><stop offset="0" style="stop-color:var(--atolla-hi)"/><stop offset=".6" style="stop-color:var(--atolla)"/><stop offset="1" style="stop-color:var(--atolla-dk)"/></radialGradient>
      <radialGradient id="combG" cx=".45" cy=".4" r=".7"><stop offset="0" style="stop-color:var(--comb)" stop-opacity=".18"/><stop offset=".8" style="stop-color:var(--comb)" stop-opacity=".35"/><stop offset="1" style="stop-color:var(--comb-dk)" stop-opacity=".7"/></radialGradient>
      <radialGradient id="bellG" cx=".5" cy=".35" r=".7"><stop offset="0" style="stop-color:var(--siph)" stop-opacity=".25"/><stop offset="1" style="stop-color:var(--siph-dk)" stop-opacity=".75"/></radialGradient>
      <linearGradient id="dumboG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--dumbo-hi)"/><stop offset=".5" style="stop-color:var(--dumbo)"/><stop offset="1" style="stop-color:var(--dumbo-dk)"/></linearGradient>
      <linearGradient id="whaleG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--whale-hi)"/><stop offset=".4" style="stop-color:var(--whale)"/><stop offset="1" style="stop-color:var(--whale-dk)"/></linearGradient>
      <linearGradient id="squidG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--squid-hi)"/><stop offset=".5" style="stop-color:var(--squid)"/><stop offset="1" style="stop-color:var(--squid-dk)"/></linearGradient>
      <linearGradient id="seapigG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--seapig)" stop-opacity=".85"/><stop offset="1" style="stop-color:var(--seapig-dk)" stop-opacity=".95"/></linearGradient>
      <linearGradient id="isoG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--isopod)"/><stop offset="1" style="stop-color:var(--isopod-dk)"/></linearGradient>
      <!-- 櫛水母的彩虹：JS 會讓它慢慢流動 -->
      <linearGradient id="rainbowG" gradientUnits="userSpaceOnUse" x1="-30" y1="0" x2="30" y2="0" spreadMethod="repeat">
        <stop offset="0" stop-color="#ff4a6a"/><stop offset=".17" stop-color="#ffb43a"/><stop offset=".34" stop-color="#e8ff4a"/>
        <stop offset=".5" stop-color="#4aff9a"/><stop offset=".67" stop-color="#3ac8ff"/><stop offset=".84" stop-color="#8a5aff"/><stop offset="1" stop-color="#ff4a6a"/>
      </linearGradient>
      <!-- 黑暗遮罩：一整片白色（黑暗），探照燈、燈光、餌球挖出黑色（亮處） -->
      <mask id="darkM" maskUnits="userSpaceOnUse" x="-400" y="-400" width="2400" height="1400">
        <rect x="-400" y="-400" width="2400" height="1400" fill="#fff"/>
        <g id="mMid"></g>
        <g id="mFore"></g>
      </mask>
      <!-- 鏡頭：暗角、顆粒 -->
      <radialGradient id="vignG" cx=".5" cy=".5" r=".75"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient>
      <filter id="grainF" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="82" result="n"/>
        <feColorMatrix type="matrix" values="0 0 0 0 .5  0 0 0 0 .55  0 0 0 0 .6  0 0 0 1.6 -.55"/>
      </filter>
    </defs>

    <g id="world">
      <g id="Lbg">
        <rect id="waterBg" x="-300" y="-300" width="2200" height="1200" fill="url(#waterG)"/>
      </g>
      <g id="Lmid"></g>
      <g id="Lfore"></g>
      <!-- 黑暗：用遮罩挖出被照亮的地方 -->
      <rect id="dark" class="noHit" x="-400" y="-400" width="2400" height="1400" style="fill:var(--abyss)" mask="url(#darkM)" opacity=".9"/>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;

    SN.start = function (when, ...a) {

      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };

      return _start.call(this, when, ...a);

    SN.stop = function (when, ...a) {

  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {

        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }

        g.gain.linearRampToValueAtTime(1, now + 1.9);

    }
    srcs.clear();
  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');
    // 凍結色票：把目前的 CSS 變數抄到殘影上，底下換色不影響殘影
    const cs = getComputedStyle(svg);
    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }

    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });

  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>
/* ---- 表演氛圍（取代寬銀幕黑邊）：k = 0~1，四周輕微暗角＋中央微亮；fx/fy 可讓亮處偏向表演焦點 ---- */
let cineK = 0, cineW = 0;
function setCine(k, fx, fy) {
  cineK = k = Math.max(0, Math.min(1, k));
  if (k === cineW || (Math.abs(k - cineW) < .004 && k > 0 && k < 1)) return;   // 變化太小就先不重畫
  cineW = k;

  g.setAttribute('opacity', k.toFixed(3));

}

/* =========================================================

         ③角色（潛水器、鮟鱇魚、冠水母、櫛水母、管水母、小飛象章魚、燈籠魚、

(() => {
'use strict';

/* ---------------- ① 工具 ---------------- */

    const p0 = g(i - 1), p1 = g(i), p2 = g(i + 1), p3 = g(i + 2);

function headingTf(x, y, vx, vy, s, faceVar) {

  const sgn = sx < 0 ? -1 : 1;

function chimney(x, top, w, tw, rate, so) {
  const base = FLOOR(x) + 8, n = 10, L = [], R = [];
  for (let i = 0; i <= n; i++) {

  }
  const g = el('g', {}, G.chim);
  el('path', { d: cr(L.concat(R.slice().reverse()), true), fill: 'url(#chimG)' }, g);

  for (let k = 0; k < 7; k++) {
    const f = srand(.15, .85), pts = L.map((p, i) => [lerp(p[0], R[i][0], f) + srand(-1.5, 1.5), p[1]]);
    el('path', { d: cr(pts.slice(0, Math.floor(srand(5, 11)))), style: S('chim-dk', srand(.8, 2)), opacity: f2(srand(.3, .6)) }, g);
  }

  for (let k = 0; k < 2 + Math.floor(srand(0, 2)); k++) {

  }
  // 鐵鏽、硫磺、白色細菌墊
  for (let k = 0; k < 9; k++) {

    el('ellipse', { cx: f1(p[0]), cy: f1(p[1]), rx: f1(srand(2, 6)), ry: f1(srand(2, 7)), style: F(pick(['chim-rust', 'chim-sulf', 'bact', 'chim-rust'])), opacity: f2(srand(.35, .7)) }, g);

// 魷魚的腕：沿著一條會扭動的曲線，算出兩側輪廓，做成越來越細的形狀
function squidArms(t) {
  squid.arms.forEach(A => {
    const L = A.long ? 250 : 120, n = 12, base = A.off, wr = squid.writhe;
    const left = [], right = [];
    for (let k = 0; k <= n; k++) {
      const u = k / n, x = 10 + u * L;
      const y = base * (1 + u * 1.6) + Math.sin(t * (2.4 + wr * 2) + A.ph + u * 4) * (6 + wr * 16) * u + (A.long ? Math.sin(t * 1.3 + A.ph) * 14 * u : 0);
      const w = (A.long ? 3.2 : 5.5) * (1 - u * .85) + (A.long && u > .85 ? 3 : 0);   // 長觸手末端有一個觸手棒
      left.push([x, y - w]); right.push([x, y + w]);
    }
    A.p.setAttribute('d', cr(left.concat(right.reverse()), true));
  });
}

}
/* ---- 海床上的生物：螃蟹、蝦、海豬、具足蟲、管蟲 ---- */
function updateFloorLife(dt, adt) {
  crabs.forEach(C => {
    C.fast = Math.max(0, C.fast - dt);
    let moving = false;
    if (C.wait > 0) C.wait -= adt;
    else {
      const sp = (C.fast > 0 ? 70 : 16) * (wx.vent > 1.5 ? 1.4 : 1), d = C.tx - C.x;
      if (Math.abs(d) < 1) { C.tx = rand(C.a, C.b); C.wait = rand(1, 4.5); }
      else { C.x += Math.sign(d) * Math.min(Math.abs(d), sp * adt); moving = adt > 0; }
    }
    C.g.setAttribute('transform', `translate(${f1(C.x)} ${f1(FLOOR(C.x) + 6)})`);
    C.legs.forEach(L => {
      const lift = moving ? Math.max(0, Math.sin(time * 18 + L.i * 1.7 + L.s)) * 3 : 0;
      L.p.setAttribute('d', `M${L.s * 7} ${-5 + L.i * 1.2}L${L.s * (13 + L.i * 1.5)} ${f1(-10 + L.i * 1.6 - lift)}L${L.s * (17 + L.i * 2)} ${f1(-lift * .4)}`);
    });
  });
  shrimps.forEach(Sh => {
    const k = wx.vent > 1.5 ? 1.6 : 1;
    const tx = Sh.ax + Math.sin(time * .8 * k + Sh.ph) * 7, ty = Sh.ay + Math.cos(time * .6 * k + Sh.ph * 1.3) * 8;
    Sh.vx = lerp(Sh.vx, (tx - Sh.x) * 2, Math.min(1, adt * 2)); Sh.vy = lerp(Sh.vy, (ty - Sh.y) * 2, Math.min(1, adt * 2));
    Sh.x += Sh.vx * adt; Sh.y += Sh.vy * adt;
    if (Math.abs(Sh.vx) > 1.5) Sh.face = lerp(Sh.face, Sh.vx > 0 ? 1 : -1, Math.min(1, dt * 5));
    Sh.g.setAttribute('transform', headingTf(Sh.x, Sh.y, Sh.vx, Sh.vy, Sh.s, Sh.face));
  });
  seapigs.forEach(P => {
    P.boost = Math.max(0, (P.boost || 0) - dt);
    let moving = false;
    if (P.wait > 0) P.wait -= adt;
    else { P.x += P.dir * (5 + P.boost * 6) * adt; moving = adt > 0; if (P.x > P.b) { P.dir = -1; P.wait = rand(2, 5); } if (P.x < P.a) { P.dir = 1; P.wait = rand(2, 5); } }
    P.face = lerp(P.face, P.dir, Math.min(1, dt * 2));
    const f = Math.abs(P.face) < .1 ? .1 * Math.sign(P.face || 1) : P.face;
    P.g.setAttribute('transform', `translate(${f1(P.x)} ${f1(FLOOR(P.x) + 2)}) scale(${f2(f * P.s)} ${f2(P.s)})`);
    P.legs.forEach((L, i) => { const sw = moving ? Math.sin(time * 4 + i * 1.3) * 3 : 0; L.setAttribute('d', `M${-18 + i * 9} 1L${f1(-18 + i * 9 + sw)} 7`); });
    P.pap.forEach((n, i) => { const x = +n.dataset.x, y = +n.dataset.y, a = (+n.dataset.a + Math.sin(time * 1.2 + i) * 8 * mvK()) * RAD; n.setAttribute('d', `M${x} ${y}Q${f1(x + Math.sin(a) * 6)} ${f1(y - 8)} ${f1(x + Math.sin(a) * 12)} ${f1(y - Math.cos(a) * 14)}`); });
  });
  const I = isopod;
  I.curl = Math.max(0, I.curl - dt * .5);
  let moving = false;
  if (I.curl <= 0) {
    if (I.wait > 0) I.wait -= adt;
    else { I.x += I.dir * 7 * adt; moving = adt > 0; if (I.x > I.b) { I.dir = -1; I.wait = rand(2, 5); } if (I.x < I.a) { I.dir = 1; I.wait = rand(2, 5); } }
  }
  I.face = lerp(I.face, I.dir, Math.min(1, dt * 2));
  const fI = Math.abs(I.face) < .1 ? .1 * Math.sign(I.face || 1) : I.face, cu = Math.sin(Math.min(1, I.curl) * Math.PI / 2);
  I.g.setAttribute('transform', `translate(${f1(I.x)} ${f1(FLOOR(I.x) + 3)}) scale(${f2(fI * I.s)} ${f2(I.s)})`);
  I.body.setAttribute('transform', `translate(0 ${f1(-cu * 3)}) scale(${f2(1 - cu * .25)} ${f2(1 + cu * .3)})`);
  I.legs.forEach((L, i) => { const sw = moving ? Math.sin(time * 9 + i * 1.1) * 3 : 0, x = -24 + i * 8; L.setAttribute('d', `M${x} -1L${f1(x + 3 + sw)} ${f1(6 - cu * 5)}`); });
  wormClusters.forEach(C => {
    if (C.hold > 0) C.hold -= dt; else C.rt = 0;
    C.r = lerp(C.r, C.rt, Math.min(1, dt * (C.rt ? 10 : 1.2)));
    C.worms.forEach(W => {
      const sw = Math.sin(time * .9 + W.ph) * 2.5 * mvK() + wx.cur * 9;
      W.g.setAttribute('transform', `translate(${f1(W.x)} ${f1(W.y)}) rotate(${f1(W.lean + sw)})`);
      W.p.setAttribute('transform', `translate(0 ${f1(-W.L + C.r * 18)}) rotate(${f1(Math.sin(time * 1.4 + W.ph) * 6 * mvK())}) scale(${f2(1 - C.r * .88)})`);
    });
  });
}
/* ---- 黑煙囪的煙柱 ---- */
function updatePlume(dt, adt) {
  VENTS.forEach(V => {
    V.puff = Math.max(0, V.puff - dt * .6);
    if (!V.rate) return;
    V.acc += V.rate * wx.vent * (1 + V.puff * 3) * (adt || dt * .3);
    while (V.acc > 1) {
      V.acc--;
      const P = plumeP.find(p => !p.on); if (!P) break;
      Object.assign(P, { on: true, x: V.x + rand(-3, 3), y: V.y, vx: rand(-5, 5), vy: -rand(48, 70) * (1 + V.puff * .3), age: 0, life: rand(5, 7.5), big: V.rate > 5 ? 1.2 : .8 });
    }
  });
  plumeP.forEach(P => {
    if (!P.on) return;
    const a = adt || dt * .3;
    P.age += a; P.x += (P.vx + wx.cur * 40 * Math.min(1, P.age * .6) + Math.sin(P.age * 1.6 + P.life) * 6) * a; P.y += P.vy * a; P.vy *= (1 - .1 * a);
    if (P.age > P.life || P.y < -140) { P.on = false; P.n.setAttribute('opacity', 0); return; }
    P.n.setAttribute('cx', f1(P.x)); P.n.setAttribute('cy', f1(P.y)); P.n.setAttribute('r', f1((5 + P.age * 11) * P.big));
    P.n.setAttribute('opacity', f2(Math.min(1, P.age * 4) * (1 - P.age / P.life) * .9));
  });
}
/* ---- 海雪 ---- */
function updateSnow(dt, adt) {
  const n = snow.length;
  snow.forEach((p, i) => {
    const on = p.k < wx.snow;
    if (!on) { if (p.vis !== false) { p.n.setAttribute('cy', -50); p.vis = false; } return; }
    p.vis = true;
    p.y += p.vy * adt * (1 + wx.snow * .3); p.x += (wx.cur * 34 + Math.sin(time * .5 + p.ph) * 3) * adt;
    if (p.y > 610) { p.y = -10; p.x = rand(-100, 1700); }
    if (p.x > 1720) p.x = -110; if (p.x < -120) p.x = 1710;
    p.n.setAttribute('cx', f1(p.x)); p.n.setAttribute('cy', f1(p.y));
  });
}
function updateFar(dt) {
  farSpecks.forEach(S => {
    const u = ((time + S.ph) % S.per);
    S.n.setAttribute('opacity', f2((u < S.dur ? Math.sin(u / S.dur * Math.PI) * .8 : 0) + bioK * .35));
  });
}

/* ---------------- 初始化 ---------------- */
function init() {
  drawBackground();
  drawFloor();
  drawVents(); drawPlume();
  drawMussels(); drawWorms();
  drawCrabs(); drawShrimp(); drawSeapigs(); drawIsopod();
  makeAtolla(260, 230, .9, [150, 170, 330, 290]); makeAtolla(1450, 190, .8, [1300, 90, 1560, 260]);
  drawComb(); drawSiph(); drawDumbo(); drawLantern();
  drawWhale(); drawSquid();
  whale.fl.setAttribute('d', 'M-196 -2C-214 -26 -246 -34 -262 -24C-246 -10 -232 -2 -200 0C-232 2 -246 12 -262 24C-246 32 -214 26 -196 2Z');
  drawSub();
  drawSnow();
  drawForeRocks(); drawAngler();
  drawBeam();
  bindAll();
  if (reduced) { T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false'); }
  setWeather(0);
  applyColors(true);
  step(1 / 60);
  requestAnimationFrame(loop);
}
init();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on && show.kind,
  btn: { whale: 'btnWhale', bio: 'btnBio' },
  ff: () => { show.cues = new Proxy({}, { get: () => 1 }); show.t = show.dur - .02; },
  save: () => ({ t: T.t, auto: T.auto }),
  stop: () => endShow(),
  restore: s => { T.t = s.t; T.auto = s.auto; $('btnAuto') && $('btnAuto').setAttribute('aria-pressed', String(T.auto)); applyColors(true); }
});
/* /ShowStop */
})();
</script>
