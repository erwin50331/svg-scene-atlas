<style>
/* =========================================================
   SC-59 少女峰下的牛鈴與齒軌列車｜復古石版海報風
   地點：瑞士伯恩高地（Berner Oberland）・小夏德格（Kleine Scheidegg，海拔 2061 公尺）。
        從小夏德格下方的高山牧場往南望，三座名峰一字排開：
        左邊是艾格峰（Eiger，3967 公尺）陡峭的黑色北壁，
        中間是戴著雪帽的僧侶峰（Mönch，4107 公尺），
        右邊是全身雪白的少女峰（Jungfrau，4158 公尺）與尖尖的銀角峰（Silberhorn）；
        僧侶峰與少女峰之間的鞍部是少女峰車站所在的少女峰山坳（Jungfraujoch），
        岩頂上有史芬克斯觀景台。
        小夏德格車站旁是老旅館，黃綠色的溫根阿爾卑斯鐵道（WAB）從右邊爬上來，
        紅色的少女峰鐵道（JB）從車站往左爬，鑽進艾格冰河旁的隧道。
        兩條都是齒軌鐵道：兩條鐵軌中間多一條齒條，車廂跟著坡度傾斜；上方有架空電車線。
        前景是牧場：西門塔爾牛（紅白花色）掛著牛鈴吃草，木造高山小屋窗台開著天竺葵、
        煙囪冒著煮起司的煙，原木水槽、黃色健行路標、斜木條圍籬、站在石頭上的土撥鼠，
        穿藍色雪絨花襯衫的阿爾卑斯長號手。
   風格重點（1930 年代瑞士石版印刷旅遊海報）：
        - 少色套印：只用幾種褪色油墨平塗，不用漸層
        - 套版偏移：墨線版刻意跟色塊錯開 2px，露出米白紙縫
        - 粗墨線輪廓、斜線與網點陰影、天空是硬邊色帶
        - 泛黃紙張、斑駁水漬、折痕、印刷顆粒、不規則的紙邊
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚，角色與小物在夜裡會變暗），部分另有 --k-名稱（晨昏，雪山的高山紅光）。
   JS 會依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）兩個 class。
   ========================================================= */
:root{
  color-scheme: light;

  /* —— 紙與油墨（不隨日夜變化） —— */
  --paper:#efe2c2;      /* 泛黃海報紙 */
  --paper-dk:#d6c196;
  --ink:#22303e;        /* 墨線版（深藍黑） */
  --cream:#f5ecd2;
  --red:#c63a2c;        /* 瑞士紅 */
  --red-dk:#8e2a22;
  --yellow:#efc04a;
  --ochre:#d39a3c;
  --navy:#26476b;
  --blue:#3f6f9e;

  /* —— 天空：四道硬邊色帶（由上而下） —— */
  --d-sky-1:#3f7fb0; --k-sky-1:#3b4a80; --n-sky-1:#121e36;
  --d-sky-2:#6aa3c6; --k-sky-2:#9c6a8e; --n-sky-2:#172744;
  --d-sky-3:#9cc6d2; --k-sky-3:#e08c7a; --n-sky-3:#1d3152;
  --d-sky-4:#d4e2d0; --k-sky-4:#f2bf86; --n-sky-4:#263a5e;

  --d-cloud-sh:#c9c3ae; --k-cloud-sh:#c98e8a; --n-cloud-sh:#26344f;
  --d-sunring:#f4e2a2; --k-sunring:#f7b26e; --n-sunring:#2b3a5e;

  /* —— 雪山：雪、陰影雪、冰河、岩壁（晨昏染成高山紅光 Alpenglühen） —— */
  --d-snow:#f7f2e2;   --k-snow:#f6b49c;   --n-snow:#8a9cc0;
  --d-snow-2:#e2e6e0; --k-snow-2:#e99c8e; --n-snow-2:#6f82a8;
  --d-snow-sh:#a9bfd0; --k-snow-sh:#ad7894; --n-snow-sh:#4a5a82;
  --d-glacier:#9fc4cf; --k-glacier:#b78aa0; --n-glacier:#405676;
  --d-rock:#6a6058;   --k-rock:#7a5250;   --n-rock:#2a2c3a;

  --d-rock-hi:#8c7e6e; --k-rock-hi:#a86a58; --n-rock-hi:#3a3a4a;
  --d-scree:#8f8676;  --k-scree:#8f6a5e;  --n-scree:#2c2e3c;

  /* —— 牧場（由遠到近）、雲杉 —— */
  --d-pas-far:#6f9a5a; --k-pas-far:#7a7a5a; --n-pas-far:#1e3030;
  --d-pas-mid:#7fae5c; --k-pas-mid:#8f8a5a; --n-pas-mid:#223a30;
  --d-pas:#8fbd62;     --k-pas:#a09a5c;     --n-pas:#26402f;
  --d-pas-2:#a6cd70;   --k-pas-2:#b8ac68;   --n-pas-2:#2d4a36;
  --d-pas-dk:#5a8a48;  --n-pas-dk:#182a24;
  --d-spruce:#2f5a3e;  --n-spruce:#101e1c;
  --d-spruce-2:#3e7048; --n-spruce-2:#142620;
  --d-path:#d8c08a;    --k-path:#d8a47a;    --n-path:#4a4658;
  --d-stone:#9a948a;   --n-stone:#3a3c46;
  --d-stone-2:#7a746c; --n-stone-2:#2a2c36;

  /* —— 建築：老旅館、車站、高山小屋 —— */
  --d-hotel:#c99a62;   --n-hotel:#4a3a3c;
  --d-hotel-sh:#a57a4c; --n-hotel-sh:#382c30;
  --d-roofc:#7a3a2a;   --n-roofc:#2e1e22;
  --d-win:#3b4a5a;     --n-win:#ffd36a;     /* 夜裡會亮燈的窗 */
  --d-wood:#8a5a32;    --n-wood:#3a2a24;
  --d-wood-dk:#5e3a22; --n-wood-dk:#261a18;
  --d-wood-hi:#a8743e; --n-wood-hi:#4a3628;
  --d-shingle:#6e6458; --n-shingle:#2a2a32;
  --d-shadow:#22303e30; --n-shadow:#00000070;

  /* —— 鐵道 —— */
  --d-rail:#4a4a4a;    --n-rail:#222630;
  --d-ballast:#9a8f7c; --n-ballast:#34343e;
  --d-wab-y:#e8b93a; --n-wab-y:#6f6138;     /* 溫根阿爾卑斯鐵道：黃 */
  --d-wab-g:#3f7a4a; --n-wab-g:#28473e;     /* 溫根阿爾卑斯鐵道：綠 */
  --d-jb-r:#b83a2e; --n-jb-r:#5b2c33;      /* 少女峰鐵道：紅 */
  --d-jb-c:#efe3c4; --n-jb-c:#727372;      /* 少女峰鐵道：米白窗帶 */
  --train-roof:#3a3e44;
  --d-twin:#2a3846;    --n-twin:#ffd98a;    /* 車窗 */

  /* —— 光源 —— */
  --sun:#f6d98a;
  --moon:#f4ecd2;
  --star:#f4ecd2;
  --lamp:#ffd36a;
  --flame:#f08a3a; --flame-2:#ffd86a; --ember:#c8402e;

  /* —— 花與小物 —— */
  --d-geranium:#d8432f; --n-geranium:#693033;  /* 窗台天竺葵 */
  --d-gentian:#3460b0; --n-gentian:#243c69;   /* 龍膽 */
  --d-alprose:#d8708e; --n-alprose:#69435b;   /* 阿爾卑斯玫瑰 */
  --d-buttercup:#f0c64a; --n-buttercup:#73673e; /* 毛茛 */
  --d-edelweiss:#f6f2e4; --n-edelweiss:#75797f; /* 雪絨花 */
  --d-sign:#efc04a; --n-sign:#72643e;      /* 黃色健行路標 */
  --d-flag-red:#d0352a; --n-flag-red:#652a31; --d-flag-white:#fbf6ea; --n-flag-white:#777b82;
  --d-water:#7fb4c8; --n-water:#435f73;
  --d-shutter:#c63a2c; --n-shutter:#4a2a30;   /* 小屋的紅白百葉窗 */
  --lan-red:#e0483a; --lan-yellow:#f6cc5a; --lan-pink:#ee8aa6; --lan-blue:#5a86d0; --lan-white:#fff6e0;  /* 燈籠（夜裡也亮） */

  /* —— 動物 —— */
  --d-cow-white:#f3ead4; --n-cow-white:#747678; --d-cow-red:#b2602e; --n-cow-red:#593c33; --d-cow-pink:#e8a69a; --n-cow-pink:#6f5960; --d-horn:#efe2c0; --n-horn:#727370;
  --d-bell:#d9a640; --n-bell:#69593a; --bell-dk:#8a6420; --d-strap:#6a3a22; --n-strap:#3a2c2e;
  --d-marmot:#9a6e44; --n-marmot:#4f423c; --d-marmot-dk:#6a4a2e; --n-marmot-dk:#3a3333; --d-marmot-lt:#c9a47a; --n-marmot-lt:#625953;
  --chough:#1e1e24; --beak:#f0c44a; --leg-red:#d04a3a;

  /* —— 煙火 —— */
  --fw-1:#d0352a; --fw-2:#f2c95a; --fw-3:#8fd0c4; --fw-4:#fbf6ea; --fw-5:#e8a2a0;

  /* —— 天氣 —— */
  --d-rainc:#3e5a74; --n-rainc:#9eb0d4;
  --flake:#fbf8ee;
  --wx-cloud:#7d8a8a; --wx-rain:#35455c; --wx-snow:#dfe6ec; --wx-fog:#ebe6d6;

  /* —— 角色 —— */
  --d-skin-1:#f0cba4; --n-skin-1:#736964; --d-skin-2:#d8a074; --n-skin-2:#695750; --d-skin-3:#a8714b; --n-skin-3:#54433f; --d-skin-4:#6d4932; --n-skin-4:#3c3234;
  --hair-1:#2a2226; --hair-2:#6b4428; --hair-3:#d8ae62; --hair-4:#b9b3a8;
  --d-cloth-1:#c63a2c; --n-cloth-1:#612c32; --d-cloth-2:#26476b; --n-cloth-2:#1e324c; --d-cloth-3:#efc04a; --n-cloth-3:#72643e; --d-cloth-4:#3f8a86; --n-cloth-4:#284e58; --d-cloth-5:#e8a2a0; --n-cloth-5:#6f5863; --d-cloth-6:#4f8a4a; --n-cloth-6:#2f4e3e; --d-cloth-7:#f5ecd2; --n-cloth-7:#757778; --d-cloth-8:#d97a3a; --n-cloth-8:#694738;
  --d-edel-shirt:#2f5e9a; --n-edel-shirt:#223b60; /* 雪絨花襯衫的藍 */
  --mutz:#1e1e26;       /* 伯恩傳統服的黑絨短外套 */
  --pants:#3a3a44;
  --d-alphorn:#a8743e; --n-alphorn:#544439; --alphorn-band:#5e3a22;
  --d-glider-1:#d0352a; --n-glider-1:#652a31; --d-glider-2:#efc04a; --n-glider-2:#72643e; --d-glider-3:#f5ecd2; --n-glider-3:#757778;

  /* —— 頁面介面 —— */
  --page-bg:#ece3cf; --page-fg:#22303e; --page-muted:#6c6556;
  --ui-surface:#f6efde; --ui-line:#cdbd98; --ui-accent:#c63a2c;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:6px;overflow:hidden;background:var(--paper);line-height:0;box-shadow:0 2px 10px #0000002a}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:10px;padding:10px 14px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
.panel button.big{border-color:var(--red);color:#fff;background:var(--red);font-weight:700}
.panel button.big.alt{border-color:var(--navy);background:var(--navy)}
.panel button.big.on{background:var(--ochre);border-color:var(--ochre);color:var(--ink)}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
/* 畫面內可點物件：滑鼠點不顯示外框，用鍵盤 Tab 時才顯示 */
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid var(--ui-accent);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 內的樣式 ---------- */
/* 墨線版：粗墨線，和色塊錯開一點（套版偏移） */
#scene .key{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
#scene .key-thin{fill:none;stroke:var(--ink);stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round}
#scene .clickable,#scene [role="button"]{cursor:pointer}
#scene .bubble rect{fill:var(--cream);stroke:var(--ink);stroke-width:2}
#scene .bubble text{fill:var(--ink);font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .bubble .pop{animation:pop var(--dur,1.6s) ease-out forwards}
@keyframes pop{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  #scene .bubble .pop{animation:none}
}
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>
<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。
   想恢復完整版，刪掉這整段 <style id="pure-art"> 即可。
   ========================================================= */
html,body{height:100%;margin:0!important;overflow:hidden}
body{display:flex!important;align-items:center;justify-content:center;padding:0!important}
body>.wrap{width:100%!important;max-width:min(100vw,calc(100vh * 8 / 3))!important;
  margin:0!important;padding:0!important;gap:0!important;display:block!important}
body>.wrap>:not(.stage){display:none!important}
body>.wrap>.stage{width:100%!important;max-width:100%!important;margin:0!important;
  border:0!important;border-radius:0!important;box-shadow:none!important}
</style>

<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：天空 → 三座雪山（艾格峰、僧侶峰、少女峰）、冰河、史芬克斯觀景台
       → 煙火、篝火 → 中景牧場、老旅館、小夏德格車站、齒軌鐵道、列車、電車線、健行步道
       → 前景牧場、高山小屋、水槽、路標、土撥鼠、牛群、長號手、農路 → 畫框雲杉
       → 天氣 → 紙張質感（水漬、折痕、顆粒、紙邊）
       ===================================================== -->

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });

           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，

   ========================================================= */
(function () {
  'use strict';

  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;

  const LINE = /\b(say|bubble|narr)\(/;

    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);

    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop

const DAY_SEC = 150;

  const h = T.t * 24, hh = Math.floor(h) % 24, mm = Math.floor((h - Math.floor(h)) * 60 + 1e-6);

  if (show.on) { busy(); return; }
  ensureAudio();
  Object.assign(show, { on: 'parade', t: 0, dur: 29, auto: !!auto });
  $('btnParade').classList.add('on');
  if (night > .5) goTo(10.5 / 24);
  let px0 = 1640; parade.forEach(p => { p.x = px0; px0 += p.k === 'cow' ? 98 : 54; p.g.style.display = ''; });
  hornMates.forEach(g => { g.style.display = ''; });
  flagger.style.display = ''; flagger.dataset.t = 0;
  walkers.forEach(w => { w.g.style.display = 'none'; });
  if (!auto && audioOK()) { paradeMusic(actx.currentTime + .05); duckSfx(20); duckMusic(21); }
  say(1330, 440, pick(['下山節囉！牛群要回村子了', '叮噹叮噹，戴花冠的牛來了！']), 1.8);
}
function startFire(auto) {
  if (show.on) { busy(); return; }
  ensureAudio();
  Object.assign(show, { on: 'fire', t: 0, dur: 23, auto: !!auto });
  $('btnFire').classList.add('on');
  if (night < .8) goTo(21.4 / 24);
  fires.forEach((f, i) => { f.delay = 2.4 + i * .7; f.on = 0; });
  lanternKids.forEach((k, i) => { k.x = -40 - i * 52; k.g.style.display = ''; });
  walkers.forEach(w => { w.g.style.display = 'none'; });
  if (!auto && audioOK()) { fireMusic(actx.currentTime + .4); duckSfx(20); duckMusic(21); }
  show.fwT = 4;
  say(800, 230, pick(['八月一日，瑞士國慶快樂！', '山上的篝火一座座亮起來了']), 1.8);
}
function endShow() {
  if (show.on === 'parade') {
    parade.forEach(p => { p.g.style.display = 'none'; });
    hornMates.forEach(g => { g.style.display = 'none'; });
    flagger.style.display = 'none';
    $('btnParade').classList.remove('on');
  } else {
    lanternKids.forEach(k => { k.g.style.display = 'none'; });
    $('btnFire').classList.remove('on');
  }
  walkers.forEach((w, i) => { w.x = w.dir > 0 ? -40 - i * 60 : 1640 + i * 60; w.g.style.display = ''; });
  show.on = '';
}
function busy() { say(800, 200, '表演進行中，等一下喔！', 1.4); }

/* ---------------- ④ 動畫：煙火、流星、雪崩 ---------------- */
const sparks = [], rockets = [], avalanches = [];
function launch(x, top) {
  const g = el('g', {}, $('fireworks'));
  el('line', { style: 'stroke:var(--fw-4)', 'stroke-width': 2, 'stroke-linecap': 'round' }, g);
  rockets.push({ el: g, line: g.firstChild, x, y: 330, top, vy: -300 });
  sfx(whoosh);
}
function burst(x, y) {
  const col = pick(FW), col2 = pick(FW), n = 30;
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2 + rand(-.05, .05), v = rand(80, 140) * (i % 2 ? 1 : .6);
    const c = el('circle', { cx: 0, cy: 0, r: i % 2 ? 2.6 : 2, style: `fill:${i % 2 ? col : col2}` }, $('fireworks'));
    sparks.push({ el: c, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, dec: rand(.5, .7) });
  }
  const ray = el('g', { transform: `translate(${f1(x)} ${f1(y)})` }, $('fireworks'));
  for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; el('line', { x1: f1(Math.cos(a) * 12), y1: f1(Math.sin(a) * 12), x2: f1(Math.cos(a) * 36), y2: f1(Math.sin(a) * 36), style: `stroke:${col}`, 'stroke-width': 2.6, 'stroke-linecap': 'round' }, ray); }
  sparks.push({ el: ray, ray: true, life: 1, dec: 2.2, x, y });
  sfx(t => boom(t, .2));
}
function meteor() {
  const x = rand(300, 1300), y = rand(20, 80);
  const l = el('line', { x1: x, y1: y, x2: x, y2: y, style: 'stroke:var(--star)', 'stroke-width': 2, 'stroke-linecap': 'round' }, $('meteor'));
  sparks.push({ el: l, meteor: true, x, y, vx: -260, vy: 120, life: 1, dec: 1.1 });
  sfx(chime);
}
// 雪崩：一團團雪塊沿山溝滑下，後面拖著雪煙
const AVA = { eiger: [[370, 146], [376, 200], [384, 250], [392, 296]], monch: [[812, 214], [818, 250], [826, 292]], jungfrau: [[1232, 120], [1190, 180], [1150, 240], [1132, 300]] };
function avalanche(k) {
  const pl = mkPoly(spline(AVA[k], 6));
  const g = el('g', {}, $('avalanche'));
  const blobs = [];
  for (let i = 0; i < 9; i++) blobs.push({ el: el('circle', { r: f1(rand(3, 6)), class: 'f-snow', stroke: 'var(--ink)', 'stroke-width': .6 }, g), s: -i * 9, off: rand(-6, 6) });
  avalanches.push({ g, pl, blobs, v: 30, t: 0 });
  sfx(t => rumble(t, 3));
}

/* ---------------- ④ 動畫：每一格的更新 ---------------- */
let clock = 0, px = 0, pxCur = 0, smokeT = 0, gliderWait = 3, lampOn = 0;
const mouse = { x: -999, y: -999 };
const smokes = [], notesArr = [], puffs = [];
const limbs = g => ({ l1: g.querySelector('.lg1'), l2: g.querySelector('.lg2'), arm: g.querySelector('.arm') });
function walkPose(o, ph, amp = 22) {
  const a = Math.sin(ph) * amp;
  if (o.l1) o.l1.setAttribute('transform', `rotate(${f1(a)} 0 -18)`);
  if (o.l2) o.l2.setAttribute('transform', `rotate(${f1(-a)} 0 -18)`);
  if (o.arm && !o.waving) o.arm.setAttribute('transform', `rotate(${f1(-a * .8)} 2 -33)`);
}
function note(x, y, col = 'var(--ink)') {
  const t = el('text', { x: f1(x), y: f1(y), style: `fill:${col};font:700 18px serif` }, $('notes'));
  t.textContent = pick(['♪', '♫', '♩']);
  notesArr.push({ el: t, x, y, t: 0, vx: rand(-10, 10) });
}
function updTrain(tr, dt) {
  if (tr.state === 'wait') { tr.v = 0; tr.t -= dt; if (tr.t <= 0) tr.state = 'out'; }
  else if (tr.state === 'out') { tr.v = Math.min(tr.vmax * tr.boost, tr.v + dt * 7); tr.s += tr.v * dt; if (tr.s >= tr.end) { tr.s = tr.end; tr.state = 'away'; tr.t = tr.away; } }
  else if (tr.state === 'away') { tr.t -= dt; if (tr.t <= 0) tr.state = 'in'; }
  else { tr.v = Math.min(tr.vmax * tr.boost, 3 + tr.s * .35); tr.s -= tr.v * dt; if (tr.s <= 0) { tr.s = 0; tr.state = 'wait'; tr.t = rand(7, 11); } }
  tr.boost = Math.max(1, tr.boost - dt * .15);
  const dirS = tr.state === 'in' ? -1 : 1;
  const sc0 = tr.sc(at(tr.pl, tr.s).y), gap = 58 * sc0;
  const lead = dirS > 0 ? 1 : 0;
  tr.cars.forEach((c, i) => {
    const s = tr.s + i * gap, p = at(tr.pl, s), sc = tr.sc(p.y);
    let a = p.a; if (Math.cos(a) < 0) a += Math.PI;
    const hide = tr.kind === 'jb' ? s > tr.pl.L - 3 : p.x > 1680;
    c.style.display = hide ? 'none' : '';
    c.setAttribute('transform', `translate(${f1(p.x)} ${f1(p.y)}) rotate(${f1(a * 180 / Math.PI)}) scale(${f1(sc)})`);
    const leadRight = dirS * Math.cos(p.a) > 0;
    const moving = tr.state === 'out' || tr.state === 'in';
    const front = leadRight ? 'R' : 'L', back = leadRight ? 'L' : 'R';
    const isLead = i === lead, isTail = i !== lead;
    c.querySelector('.lamp' + front).style.fill = isLead ? 'var(--lamp)' : 'var(--ink)';
    c.querySelector('.lamp' + back).style.fill = isTail ? 'var(--red)' : 'var(--ink)';
    c.querySelector('.beam' + front).setAttribute('opacity', f1(isLead ? nOn * (moving ? .45 : .2) : 0));
    c.querySelector('.beam' + back).setAttribute('opacity', 0);
  });
}
function respawnHiker(h) {
  h.dir = Math.random() < .5 ? 1 : -1;
  h.s = h.dir > 0 ? 0 : MIDPATH.L;
  if (hikers.some(o => o !== h && o.wait <= 0 && o.dir === h.dir && Math.abs(o.s - h.s) < 40)) { h.wait = 1.5; return; }
  h.v = rand(9, 13);
  h.g.firstChild.innerHTML = personSVG(pick(HIKER_LOOKS)); h.lm = null;
  h.g.style.display = '';
}
function step(dt) {
  clock += dt;
  // —— 時間推進 ——
  if (T.target != null) {
    // 走最近的方向（往前或往回）
    const d = ((T.target - T.t + 1.5) % 1) - .5, mv = Math.sign(d) * Math.min(Math.abs(d), dt * .12);
    T.t = (T.t + mv + 1) % 1;
    if (Math.abs(d - mv) < .0005) { T.t = T.target; T.target = null; }
  } else if (T.auto && !show.on) {
    const prev = T.t * 24;
    T.t = (T.t + dt / DAY_SEC) % 1;
    const h = T.t * 24;
    if (prev < 10 && h >= 10) startParade(true);
    if (prev < 21.2 && h >= 21.2) startFire(true);
  }
  applyTime();
  const gloom = applyWeather(dt);
  if (show.on) { show.t += dt; if (show.t >= show.dur) endShow(); }

  // —— 視差 ——
  pxCur += (px - pxCur) * Math.min(1, dt * 3);
  $('parFar').setAttribute('transform', `translate(${f1(pxCur * 4)} 0)`);
  $('parMid').setAttribute('transform', `translate(${f1(pxCur * 9)} 0)`);
  $('parNear').setAttribute('transform', `translate(${f1(pxCur * 15)} 0)`);

  // —— 天空：星星、雲 ——
  if (night > .4) stars.forEach(s => s.el.setAttribute('opacity', f1(.55 + .45 * Math.sin(clock * s.sp + s.ph))));
  const wind = 1 + wx.rain + wx.snow * 1.5;
  clouds.forEach(c => { c.x += c.sp * wind * dt; if (c.x > 1720) c.x = -160; c.el.setAttribute('transform', `translate(${f1(c.x)} ${f1(c.y)}) scale(${f1(c.s)})`); });

  // —— 國旗飄揚 ——
  document.querySelectorAll('#scene .fl').forEach((f, i) => {
    if (f.closest('#bonfiresFar')) return;
    const k = Math.sin(clock * 5 + i) * (5 + wx.rain * 4 + wx.snow * 6) + (f.dataset.kick ? +f.dataset.kick : 0);
    f.setAttribute('transform', `skewY(${f1(k)}) scale(${f1(.9 + Math.sin(clock * 3.2 + i) * .08)} 1)`);
  });
  const cf = $('chaletFlag').querySelector('.fl'); if (cf.dataset.kick) { cf.dataset.kick = f1(Math.max(0, +cf.dataset.kick - dt * 20)); }

  // —— 列車 ——
  trains.forEach(tr => updTrain(tr, dt));

  // —— 中景健行客 ——
  hikers.forEach(h => {
    if (h.wait > 0) { h.g.style.display = 'none'; h.wait -= dt; if (h.wait <= 0) respawnHiker(h); return; }
    let v = h.v;
    hikers.forEach(o => { if (o !== h && o.wait <= 0 && o.dir === h.dir) { const ds = (o.s - h.s) * h.dir; if (ds > 0 && ds < 30) v = Math.min(v, o.v * .85); } });
    h.s += h.dir * v * dt; h.ph += dt * 7;
    if (h.s > MIDPATH.L + 2 || h.s < 0) { h.wait = rand(2, 5); return; }
    h.g.setAttribute('opacity', f1(clamp(Math.min(h.s, MIDPATH.L - h.s) / 16, 0, 1)));   // 從坡後冒出來、走進車站時淡入淡出
    const p = at(MIDPATH, h.s), sc = scMid(p.y) * .8;
    h.g.setAttribute('transform', `translate(${f1(p.x)} ${f1(p.y + (h.dir > 0 ? -2.4 : 2.4) * sc)}) scale(${f1(sc)})`);
    h.g.firstChild.setAttribute('transform', `scale(${h.dir} 1)`);
    h.lm = h.lm || limbs(h.g); walkPose(h.lm, h.ph);
  });

  // —— 前景農路的行人（遊行時讓路） ——
  walkers.forEach(w => {
    if (w.g.style.display === 'none') return;
    let v = w.v;
    walkers.forEach(o => { if (o !== w && o.dir === w.dir) { const dx = (o.x - w.x) * w.dir; if (dx > 0 && dx < 70) v = Math.min(v, o.v * .85); } });
    if (w.pause > 0) { w.pause -= dt; v = 0; }
    w.x += w.dir * v * dt; if (v) w.ph += dt * 7;
    if (w.x > 1660 || w.x < -60) {
      w.dir = -w.dir; w.y = w.dir > 0 ? TRACK_Y - 5 : TRACK_Y + 7; w.v = rand(26, 34);
      w.look = (w.look + 2) % WALK_LOOKS.length; w.g.firstChild.innerHTML = personSVG(WALK_LOOKS[w.look]); w.lm = null;
      w.x = w.dir > 0 ? -50 : 1650;
    }
    w.g.setAttribute('transform', `translate(${f1(w.x)} ${f1(w.y)}) scale(1.05)`);
    w.g.firstChild.setAttribute('transform', `scale(${w.dir} 1)`);
    w.lm = w.lm || limbs(w.g); walkPose(w.lm, v ? w.ph : 0);
  });

  // —— 牛群：吃草、慢慢走、互相避開；滑鼠靠近就抬頭看 ——
  cows.forEach(c => {
    const md = Math.hypot(mouse.x - c.x, mouse.y - (c.y - 30));
    const look = md < 170 && c.state === 'graze';
    if (c.moo > 0) c.moo -= dt;
    if (c.state === 'graze') {
      c.t -= dt;
      if (look) c.dir = mouse.x > c.x ? 1 : -1;
      else if (c.t <= 0) {
        c.tx = clamp(c.x + rand(-170, 170), 700, 1150);
        if (Math.abs(c.tx - c.x) > 30) { c.dir = Math.sign(c.tx - c.x); c.state = 'walk'; } else c.t = rand(2, 5);
      }
    } else {
      const nx = c.x + c.dir * 14 * c.s * dt;
      const block = cows.some(o => o !== c && Math.abs(o.y - c.y) < 30 && (o.x - c.x) * c.dir > 0 && Math.abs(o.x - nx) < 96 * Math.max(c.s, o.s));
      if (block || Math.abs(c.tx - c.x) < 2) { c.state = 'graze'; c.t = rand(3, 8); } else { c.x = nx; c.ph = (c.ph || 0) + dt * 5; }
    }
    c.chew += dt * 4;
    const ang = c.moo > 0 ? -14 : look ? -8 : c.state === 'walk' ? 6 : 40 + Math.sin(c.chew) * 3;
    c.ha = (c.ha ?? ang) + (ang - (c.ha ?? ang)) * Math.min(1, dt * 4);
    c.head.setAttribute('transform', `rotate(${f1(c.ha)})`);
    c.tail.setAttribute('transform', `rotate(${f1(Math.sin(clock * 1.7 + c.pitch * 5) * 10)} -35 -40)`);
    const lp = c.state === 'walk' ? Math.sin(c.ph) * 14 : 0;
    c.legs.forEach((l, i) => l.setAttribute('transform', `rotate(${f1(i % 2 ? lp : -lp)} ${l.dataset.x} -24)`));
    c.g.setAttribute('transform', `translate(${f1(c.x)} ${f1(c.y)}) scale(${f1(c.s)})`);
    c.g.firstChild.setAttribute('transform', `scale(${c.dir} 1)`);
    c.bellT -= dt;
    if (c.bellT <= 0) {
      c.bellT = c.state === 'walk' ? rand(.5, .9) : rand(4, 9);
      if (userGesture && !show.on) sfx(t => cowbell(t, 600 * c.pitch, c.state === 'walk' ? .018 : .01));
    }
  });

  farCows.forEach(f => f.head.setAttribute('transform', `rotate(${f1(36 + Math.sin(clock * 1.5 + f.ph) * 6)})`));

  // —— 土撥鼠：站崗、左右張望；受驚鑽回洞裡 ——
  if (marmot.state === 'up') {
    marmot.look -= dt;
    if (marmot.look <= 0) { marmot.look = rand(1.5, 4); marmot.face = mouse.x > -900 && Math.abs(mouse.x - 594) < 300 ? (mouse.x > 594 ? 1 : -1) : pick([1, -1]); }
    marmot.body.setAttribute('transform', `scale(${marmot.face || 1} 1)`);
  } else {
    marmot.t += dt;
    if (marmot.state === 'dive') { const k = clamp(marmot.t / .5, 0, 1); marmot.g.setAttribute('transform', `translate(${f1(594 + 46 * k)} ${f1(520 + 32 * k - Math.sin(k * Math.PI) * 14)}) scale(${f1(1 - k * .8)})`); if (k >= 1) { marmot.state = 'hid'; marmot.t = 0; marmot.g.style.opacity = 0; } }
    else if (marmot.state === 'hid') { if (marmot.t > 4) { marmot.state = 'peek'; marmot.t = 0; marmot.g.style.opacity = 1; } }
    else { const k = clamp(marmot.t / .6, 0, 1); marmot.g.setAttribute('transform', `translate(594 ${f1(540 - 20 * k)}) scale(${f1(.6 + .4 * k)})`); if (k >= 1) { marmot.state = 'up'; } }
  }

  // —— 黑嘴山鴉在少女峰山坳附近盤旋 ——
  choughs.forEach(b => {
    b.a += b.sp * dt;
    const x = b.cx + Math.cos(b.a) * b.r * 1.5, y = b.cy + Math.sin(b.a) * b.r * .45 + Math.sin(clock + b.ph) * 4;
    const dx = -Math.sin(b.a);
    b.g.setAttribute('transform', `translate(${f1(x)} ${f1(y)}) scale(${dx > 0 ? 1 : -1} 1)`);
    b.wing.setAttribute('transform', `rotate(${f1(Math.sin(clock * 9 + b.ph) * 30)} -2 0)`);
  });
  $('birds').setAttribute('opacity', f1((1 - night) * (1 - Math.max(wx.rain, wx.snow, wx.fog * .7))));

  // —— 滑翔傘：乘著氣流從左飄到右（夜晚與壞天氣不飛） ——
  const flyOK = night < .4 && gloom < .5;
  glider.op = clamp((glider.op ?? 1) + (flyOK ? dt : -dt), 0, 1);
  glider.g.setAttribute('opacity', f1(glider.op));
  if (glider.op <= 0) { glider.g.style.display = 'none'; glider.x = 1800; }
  else {
    if (glider.x > 1700) { gliderWait -= dt; if (gliderWait <= 0 && flyOK) { glider.x = -80; glider.y = rand(90, 170); gliderWait = rand(6, 14); } }
    else { glider.x += glider.vx * dt; glider.t += dt; }
    glider.g.style.display = '';
    glider.spin = Math.max(0, glider.spin - dt);
    const rot = Math.cos(glider.t * .7) * 6 + (glider.spin > 0 ? (1 - glider.spin / 1.6) * 360 : 0);
    glider.g.setAttribute('transform', `translate(${f1(glider.x)} ${f1(glider.y + Math.sin(glider.t * .7) * 14)}) rotate(${f1(rot)} 0 14)`);
  }

  // —— 小屋煙囪的炊煙（煮起司的柴火） ——
  smokeT -= dt;
  if (smokeT <= 0) {
    smokeT = .35;
    const c = el('circle', { cx: 217, cy: 378, r: 4, class: 'f-cloud-sh' }, $('smoke'));
    smokes.push({ el: c, x: 217, y: 378, t: 0, life: 4 });
  }
  for (let i = smokes.length - 1; i >= 0; i--) {
    const s = smokes[i]; s.t += dt;
    s.x += (10 + wind * 8) * dt; s.y -= 16 * dt;
    s.el.setAttribute('cx', f1(s.x)); s.el.setAttribute('cy', f1(s.y)); s.el.setAttribute('r', f1(4 + s.t * 4));
    s.el.setAttribute('opacity', f1(clamp(.8 - s.t / s.life, 0, .8)));
    if (s.t > s.life) { s.el.remove(); smokes.splice(i, 1); }
  }
  $('spout').setAttribute('stroke-dashoffset', f1(-clock * 26));

  // —— 天氣粒子 ——
  if (wx.rain > .01) rainDrops.forEach(r => {
    r.y += r.sp * dt; r.x -= 120 * dt;
    if (r.y > 610) { r.y = -20; r.x = rand(-60, 1700); }
    r.el.setAttribute('x1', f1(r.x)); r.el.setAttribute('y1', f1(r.y)); r.el.setAttribute('x2', f1(r.x - 4)); r.el.setAttribute('y2', f1(r.y + 16));
  });
  if (wx.snow > .01) flakes.forEach(f => {
    f.y += f.sp * dt; f.x += Math.sin(clock * 1.3 + f.ph) * 20 * dt - 14 * dt;
    if (f.y > 606) { f.y = -8; f.x = rand(0, 1640); }
    f.el.setAttribute('cx', f1(f.x)); f.el.setAttribute('cy', f1(f.y));
  });
  if (wx.fog > .01) fogBands.forEach(b => { b.x += b.sp * .4 * dt; const x = ((b.x % 100) + 100) % 100 - 100; b.g.setAttribute('transform', `translate(${f1(x)} 0)`); });

  // —— 表演：下山節遊行 ——
  if (show.on === 'parade') {
    parade.forEach(p => {
      p.x -= 82 * dt;
      p.g.setAttribute('transform', `translate(${f1(p.x)} ${TRACK_Y + 2})`);
      if (p.k === 'cow') {
        const lp = Math.sin(clock * 7 + p.i) * 16;
        p.legs.forEach((l, i) => l.setAttribute('transform', `rotate(${f1(i % 2 ? lp : -lp)} ${l.dataset.x} -24)`));
        p.head.setAttribute('transform', `rotate(${f1(4 + Math.sin(clock * 3.5 + p.i) * 6)})`);
        p.bellT -= dt;
        if (p.bellT <= 0 && p.x > -40 && p.x < 1640) { p.bellT = .44; if (!show.auto) sfx(t => cowbell(t, 380 + p.i * 26, .028, true)); }
      } else { p.lm = p.lm || limbs(p.g); walkPose(p.lm, clock * 7 + p.i); }
    });
    // 擲旗手：甩旗、繞圈、往上拋
    const ft = show.t, tf = flagger.querySelector('.tflag'), cyc = ft % 4;
    const ang = cyc < 1.3 ? cyc / 1.3 * 360 : Math.sin(ft * 3.2) * 60;
    const lift = cyc > 2.6 && cyc < 3.4 ? -Math.sin((cyc - 2.6) / .8 * Math.PI) * 50 : 0;
    tf.setAttribute('transform', `translate(9 ${f1(-40 + lift)}) rotate(${f1(ang)})`);
    tf.querySelector('.tcloth').setAttribute('transform', `skewY(${f1(Math.sin(ft * 8) * 8)})`);
    // 三支長號：吹奏時冒出音符
    if (!show.auto && show.t < 19.5 && Math.random() < dt * 3) { const g = pick([horn1, ...hornMates]); const m = /translate\(([-\d.]+) ([-\d.]+)\)/.exec(g.getAttribute('transform')); note(+m[1] - 96, +m[2] - 26); }
  }

  // —— 表演：國慶篝火夜 ——
  fires.forEach(f => {
    const tgt = show.on === 'fire' && show.t > f.delay ? 1 : 0;
    if (tgt && !f.on && !show.auto) sfx(t => crackle(t, 1));
    f.on = clamp(f.on + (tgt ? dt * 1.4 : -dt * .5), 0, 1);
    if (f.on > 0) {
      f.fl.setAttribute('opacity', f1(f.on));
      f.f1.setAttribute('transform', `scale(${f1(1 + Math.sin(clock * 11 + f.ph) * .08)} ${f1(f.on * (1 + Math.sin(clock * 9 + f.ph) * .16))})`);
      f.f2.setAttribute('transform', `scale(1 ${f1(f.on * (1 + Math.sin(clock * 13 + f.ph) * .2))})`);
      f.glow.setAttribute('opacity', f1(f.on * (.3 + Math.sin(clock * 7 + f.ph) * .06)));
    } else { f.fl.setAttribute('opacity', 0); f.glow.setAttribute('opacity', 0); }
  });
  lampOn = show.on === 'fire' ? Math.min(1, show.t / 2) : Math.max(0, lampOn - dt * .4);
  lampions.setAttribute('opacity', lampOn.toFixed(3));
  if (show.on === 'fire') {
    lanternKids.forEach(k => {
      k.x += 30 * dt;
      k.g.setAttribute('transform', `translate(${f1(k.x)} ${TRACK_Y - 4}) scale(1.05)`);
      k.lm = k.lm || limbs(k.g); walkPose(k.lm, clock * 7 + k.ph);
      const ln = k.g.querySelector('.lantern'); ln.setAttribute('transform', `rotate(${f1(Math.sin(clock * 3 + k.ph) * 8)} 10 -34)`);
    });
    show.fwT -= dt;
    if (show.fwT <= 0 && show.t > 5 && show.t < 20) { show.fwT = rand(.6, 1.3); launch(rand(260, 1340), rand(70, 200)); }
  }

  // —— 煙火與流星 ——
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i]; r.y += r.vy * dt;
    r.line.setAttribute('x1', f1(r.x)); r.line.setAttribute('y1', f1(r.y)); r.line.setAttribute('x2', f1(r.x)); r.line.setAttribute('y2', f1(r.y + 16));
    if (r.y <= r.top) { burst(r.x, r.y); r.el.remove(); rockets.splice(i, 1); }
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]; s.life -= dt * s.dec;
    if (s.ray) { s.el.setAttribute('opacity', f1(Math.max(0, s.life))); s.el.setAttribute('transform', `translate(${f1(s.x)} ${f1(s.y)}) scale(${f1(1.6 - s.life * .6)})`); }
    else if (s.meteor) { s.x += s.vx * dt; s.y += s.vy * dt; s.el.setAttribute('x2', f1(s.x)); s.el.setAttribute('y2', f1(s.y)); s.el.setAttribute('x1', f1(s.x + 60)); s.el.setAttribute('y1', f1(s.y - 28)); s.el.setAttribute('opacity', f1(Math.max(0, s.life))); }
    else { s.vy += 60 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= .985; s.el.setAttribute('cx', f1(s.x)); s.el.setAttribute('cy', f1(s.y)); s.el.setAttribute('opacity', f1(Math.max(0, s.life))); }
    if (s.life <= 0) { s.el.remove(); sparks.splice(i, 1); }
  }

  // —— 雪崩 ——
  for (let i = avalanches.length - 1; i >= 0; i--) {
    const a = avalanches[i]; a.t += dt; a.v += 70 * dt;
    let alive = false;
    a.blobs.forEach(b => {
      b.s += a.v * dt;
      if (b.s < 0) { b.el.setAttribute('opacity', 0); return; }
      if (b.s < a.pl.L) {
        alive = true;
        const p = at(a.pl, b.s);
        b.el.setAttribute('cx', f1(p.x + b.off)); b.el.setAttribute('cy', f1(p.y)); b.el.setAttribute('opacity', 1);
        if (Math.random() < dt * 14) { const c = el('circle', { cx: f1(p.x + b.off), cy: f1(p.y), r: 4, style: 'fill:var(--snow)' }, a.g); puffs.push({ el: c, t: 0, r: rand(5, 10) }); }
      } else b.el.setAttribute('opacity', 0);
    });
    if (!alive && a.t > 1) { setTimeout(() => a.g.remove(), 2500); avalanches.splice(i, 1); }
  }
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i]; p.t += dt;
    p.el.setAttribute('r', f1(4 + p.t * p.r)); p.el.setAttribute('opacity', f1(Math.max(0, .8 - p.t / 1.8)));
    if (p.t > 1.8) { p.el.remove(); puffs.splice(i, 1); }
  }

  // —— 音符 ——
  for (let i = notesArr.length - 1; i >= 0; i--) {
    const n = notesArr[i]; n.t += dt; n.x += n.vx * dt; n.y -= 26 * dt;
    n.el.setAttribute('x', f1(n.x)); n.el.setAttribute('y', f1(n.y)); n.el.setAttribute('opacity', f1(Math.max(0, 1 - n.t / 2)));
    if (n.t > 2) { n.el.remove(); notesArr.splice(i, 1); }
  }
}

/* ---------------- ⑤ 互動：對話泡泡 ---------------- */
function say(x, y, text, dur = 1.6) {
  const g = el('g', { class: 'bubble' }, $('bubbles'));
  const inner = el('g', { class: 'pop', style: `--dur:${dur}s` }, g);
  const t = el('text', { x: 0, y: 0 }, inner);
  t.textContent = text;
  const w = Math.max(44, (t.getComputedTextLength() || text.length * 15) + 24);
  const r = el('rect', { x: f1(-w / 2), y: -15, width: f1(w), height: 30, rx: 3 });
  inner.insertBefore(r, t);
  x = clamp(x, w / 2 + 26, 1600 - w / 2 - 26); y = clamp(y, 40, 562);
  g.setAttribute('transform', `translate(${f1(x)} ${f1(y)})`);
  setTimeout(() => g.remove(), dur * 1000);
}

/* ---------------- 動畫主迴圈 ---------------- */
let last = 0, rafId = 0;
function loop(now) {
  const dt = clamp((now - last) / 1000, 0, .05); last = now;
  step(dt);
  rafId = requestAnimationFrame(loop);
}
function settle(sec) { for (let s = 0; s < sec; s += .05) step(.05); }
function renderStill() { step(.0001); }
function start() {
  cancelAnimationFrame(rafId);
  if (reduced) { T.auto = false; syncAuto(); applyTime(true); settle(1.5); }
  else { last = performance.now(); rafId = requestAnimationFrame(loop); }
}

/* ---------------- 開始：依序畫出場景、角色 ---------------- */
makePaper();
drawSky();
drawMountains();
drawMidLand();
drawTracks();
drawNear();
drawFrame();
drawTrains();
drawFires();
drawCows();
drawFarCows();
drawPeopleNear();
drawHikers();
drawWalkers();
drawParade();
drawSkyLife();
drawWeather();
sortActors();
trains.forEach(tr => { tr.boost = 1; });
// 開場時讓溫根的列車已經在半路上
trains[0].state = 'out'; trains[0].s = 380; trains[0].v = 30;

/* ---------------- ⑤ 互動：點擊 ---------------- */
function onAct(node, fn) {
  node.addEventListener('click', e => { e.stopPropagation(); userGesture = true; ensureAudio(); fn(e); if (reduced) settle(.6); });
  node.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); userGesture = true; ensureAudio(); fn(e); if (reduced) settle(.6); } });
}
function svgPoint(e) {
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
svg.addEventListener('pointerdown', () => { userGesture = true; ensureAudio(); document.body.classList.remove('kbd'); });
window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
// 滑鼠：視差＋牛群轉頭
svg.addEventListener('pointermove', e => {
  const p = svgPoint(e);
  px = clamp((p.x - 800) / 800, -1, 1);
  mouse.x = p.x - pxCur * 15; mouse.y = p.y;
  if (reduced) renderStill();
});
svg.addEventListener('pointerleave', () => { px = 0; mouse.x = -999; });

// 天空：白天叫來滑翔傘與山鴉，夜晚劃過流星
onAct($('skyHit'), e => {
  const p = e.clientX != null ? svgPoint(e) : { x: rand(400, 1200), y: 150 };   // 鍵盤操作時沒有滑鼠座標
  if (night > .5) { meteor(); say(p.x, p.y + 30, pick(['流星！許個願吧', '阿爾卑斯的星空好亮'])); return; }
  sfx(choughCall);
  if (glider.x > 1650 || glider.x < -60) { glider.x = -80; glider.y = clamp(p.y, 80, 180); }
  say(p.x, p.y + 30, pick(['黑嘴山鴉在山坳盤旋', '滑翔傘乘著上升氣流飛來了']));
});
onAct(PEAK_HIT.eiger, () => { avalanche('eiger'); say(330, 120, '艾格峰北壁：近 1800 公尺高的岩壁'); });
onAct(PEAK_HIT.monch, () => { avalanche('monch'); say(780, 130, '僧侶峰：海拔 4107 公尺'); });
onAct(PEAK_HIT.jungfrau, () => { avalanche('jungfrau'); say(1172, 110, '少女峰：海拔 4158 公尺'); });
onAct(PEAK_HIT.sphinx, () => {
  sfx(chime);
  const l = $('sxLamp'); l.setAttribute('opacity', 1); setTimeout(() => applyTime(true), 900);
  say(958, 106, '史芬克斯觀景台：海拔 3571 公尺');
});
// 列車：點了鳴笛，停在車站的會馬上出發
trains.forEach(tr => onAct(tr.g, () => {
  sfx(trainHorn); sfx(t => rackTrain(t + .7));
  if (tr.state === 'wait') tr.t = 0;
  tr.boost = 1.8;
  const p = at(tr.pl, tr.s);
  say(p.x, p.y - 50, tr.kind === 'wab' ? '溫根阿爾卑斯鐵道：齒輪咬著齒軌爬坡' : '少女峰鐵道：開往海拔 3454 公尺的車站');
}));
// 牛：哞一聲、抬頭搖牛鈴
cows.forEach(c => onAct(c.g, () => {
  c.moo = 1.6; c.state = 'graze'; c.t = rand(3, 6);
  sfx(t => moo(t, .9 + c.pitch * .1)); sfx(t => cowbell(t + .1, 600 * c.pitch, .05));
  say(c.x, c.y - 70 * c.s, pick(['哞～', '哞——', '叮噹！哞～']), 1.2);
}));
onAct(horn1, () => {
  if (show.on) { busy(); return; }
  if (audioOK()) { hornCall(actx.currentTime + .05); duckSfx(6); duckMusic(7); }
  for (let i = 0; i < 6; i++) setTimeout(() => note(1236 + rand(-6, 6), 470), i * 700);
  say(1330, 420, pick(['阿爾卑斯長號，聲音能傳遍山谷', '這支長號有三公尺多長']));
});
onAct(marmot.g, () => {
  if (marmot.state !== 'up') return;
  sfx(marmotWhistle);
  marmot.state = 'dive'; marmot.t = 0;
  say(600, 470, '吱——！土撥鼠吹哨示警', 1.4);
});
onAct($('chalet'), () => {
  sfx(knock);
  for (let i = 0; i < 8; i++) { const c = el('circle', { cx: 217, cy: 378, r: 5, class: 'f-cloud-sh' }, $('smoke')); smokes.push({ el: c, x: 217 + rand(-4, 4), y: 378 - i * 6, t: 0, life: 4 }); }
  say(170, 360, pick(['牧人正在大銅鍋裡煮高山起司', '夏天住在山上的牧場小屋']));
});
onAct($('chaletFlag'), () => { const f = $('chaletFlag').querySelector('.fl'); f.dataset.kick = 18; sfx(t => noise(t, .5, 900, .04, 'bandpass', .8, .05)); say(330, 360, '瑞士國旗是正方形的'); });
onAct($('fountain'), () => {
  sfx(splash);
  for (let i = 0; i < 8; i++) { const c = el('circle', { cx: 364, cy: 510, r: 2.4, style: 'fill:var(--water)' }, $('fireworks')); sparks.push({ el: c, x: 364 + pxCur * 15, y: 510, vx: rand(-60, 60), vy: rand(-140, -60), life: 1, dec: 1.4 }); }
  say(380, 470, '清涼的山泉水');
});
onAct($('signpost'), () => { sfx(knock); say(470, 420, pick(['往溫根、格林德瓦、艾格冰河', '黃色路標＝一般健行步道'])); });
onAct($('hotel'), () => {
  sfx(chime);
  document.querySelectorAll('#hotel .hWin').forEach((w, i) => { if (Math.random() < .5) { w.style.fill = 'var(--lamp)'; setTimeout(() => { w.style.fill = ''; }, 600 + i * 30); } });
  say(590, 220, '百年老旅館，窗外就是艾格峰北壁');
});
onAct($('station'), () => { sfx(t => cowbell(t, 1200, .03)); say(732, 290, '小夏德格車站：海拔 2061 公尺'); });
hikers.forEach(h => onAct(h.g, () => {
  sfx(pop); h.lm = h.lm || limbs(h.g);
  const p = at(MIDPATH, h.s);
  say(p.x, p.y - 44, pick(['Grüezi！', '再走一段就到車站了', '好美的艾格峰！']), 1.4);
}));
walkers.forEach(w => onAct(w.g, () => {
  sfx(pop); w.pause = 1.6;
  say(w.x, w.y - 64, pick(['Grüezi mitenand！', 'Grüezi！', '牛鈴聲好好聽']), 1.4);
}));
onAct(document.querySelector('#scene .benchP'), () => { sfx(pop); say(190, 430, '走累了，在小屋旁喝口水'); });
onAct(glider.g, () => { glider.spin = 1.6; sfx(whoosh); say(glider.x, glider.y + 60, '轉個圈！'); });

/* ---------------- ⑤ 互動：控制列 ---------------- */
function syncAuto() { $('btnAuto').setAttribute('aria-pressed', String(T.auto)); $('btnAuto').textContent = T.auto ? '自動播放中' : '自動播放'; }
function goTo(t) { if (reduced) { T.t = t; applyTime(true); renderStill(); } else T.target = t; }
const tap = fn => () => { userGesture = true; ensureAudio(); setTimeout(() => { fn(); if (reduced) settle(2); }, actx && actx.state !== 'running' ? 120 : 0); };
$('btnParade').addEventListener('click', tap(() => startParade(false)));
$('btnFire').addEventListener('click', tap(() => startFire(false)));
$('btnWeather').addEventListener('click', () => {
  userGesture = true; ensureAudio();
  wxI = (wxI + 1) % WX_LIST.length;
  $('btnWeather').textContent = '天氣：' + WX_LIST[wxI][1];
  if (reduced) { for (const k in wx) wx[k] = WX_LIST[wxI][0] === k ? 1 : 0; if (wx.snow) snowAcc = 1; applyWeather(0); renderStill(); }
});
$('btnSound').addEventListener('click', () => {
  soundOn = !soundOn; userGesture = true;
  $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  if (ensureAudio()) {
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.setValueAtTime(soundOn ? .5 : 0, actx.currentTime);
    if (!soundOn && musNode) { try { musNode.disconnect(); } catch (e) {} musNode = null; }
  }
  if (!soundOn) { try { window.sceneMusic && window.sceneMusic.stop(); } catch (e) {} }
});
$('btnDay').addEventListener('click', () => goTo(11 / 24));
$('btnNight').addEventListener('click', () => goTo(21.5 / 24));
$('btnAuto').addEventListener('click', () => { T.auto = !T.auto; T.target = null; syncAuto(); });
$('timeRange').addEventListener('input', e => {
  T.t = e.target.value / 1000; T.target = null; T.dragging = true; applyTime(true); T.dragging = false;
  if (reduced) renderStill();
});
mq.addEventListener?.('change', e => { reduced = e.matches; if (!reduced) { T.auto = true; syncAuto(); } start(); });

applyTime(true);
applyWeather(0);
syncAuto();
start();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on,
  btn: { parade: 'btnParade', fire: 'btnFire' },
  ff: () => { show.t = show.dur - .02; },
  save: () => ({ ...T }),
  stop: () => endShow(),
  restore: s => { Object.assign(T, s); syncAuto(); applyTime(true); renderStill(); }
});
/* /ShowStop */
})();
</script>
