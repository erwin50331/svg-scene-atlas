<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>稻城亞丁的日照金山</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-89 稻城亞丁的日照金山｜CGI 電影質感
   地點：中國四川・甘孜州稻城縣，亞丁自然保護區的「洛絨牛場」（海拔約 4100 多公尺）。
   視角：站在洛絨牛場的草甸上，望向三座神山（三怙主雪山）。為了一次看到三座山，
         構圖把它們排成一列：左邊仙乃日（6032 公尺，像端坐的觀音）、
         中間央邁勇（5958 公尺，尖尖的金字塔形）、右邊夏諾多吉（5958 公尺，鋸齒狀山脊）。
         中景：央邁勇山腳的牛奶海（冰川融水湖，乳白的青綠色）、旁邊高一點的五色海、
               登山步道上的健行者與馬隊、冷杉林。
         近景：秋天金黃的楊樹與白樺、紅色灌叢、洛絨牛場的草甸與溪流、
               往返沖古寺的電瓶觀光車、吃草的犛牛、藏族馬夫牽著載遊客的馬。
         前景：白塔、五色經幡、煨桑爐、瑪尼堆、木棧道上的遊客、攝影師、旱獺。
   風格重點：CGI 動畫電影的畫面——雪山分亮面與陰影面、大氣透視（越遠越淡越藍）、
            柔和的光暈（一律用放射漸層，不對大圖層做模糊）、暗角、底片顆粒、滑鼠多層視差。
            表演時不用上下黑邊，改成四周輕微暗角＋中央微亮，鏡頭只推近約 3%。
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），JS 依時間內插，輸出成 --名稱。
   其餘色票不隨時間變化，直接使用。
   ========================================================= */
:root{
  color-scheme: dark;

  /* —— 天空、雲、霧 —— */
  --d-sky-top:#2c6cc4;  --n-sky-top:#03081a;
  --d-sky-mid:#62a2e2;  --n-sky-mid:#0a1634;
  --d-sky-hor:#d4e6f4;  --n-sky-hor:#1e2a50;
  --d-cloud:#ffffff;    --n-cloud:#3a466c;
  --d-cloud-sh:#b4c6dc; --n-cloud-sh:#18203e;
  --d-haze:#c6dcee;     --n-haze:#141e3c;
  --d-fog:#eef4fa;      --n-fog:#3a4670;
  --storm:#5a6474;           /* 陰天、下雨時混入的灰 */
  --dawn:#ff9a5a; --dawn2:#ff6a8a;
  --sun:#fff6d8; --sun-glow:#ffd890; --moon:#f2f0e4; --star:#ffffff; --milky:#b8c8ff;

  /* —— 雪山 —— */
  --d-far:#8eaacc;      --n-far:#121c3a;
  --d-far-hi:#b8cee2;   --n-far-hi:#1c284a;
  --d-rock-lit:#74707a; --n-rock-lit:#1c2036;
  --d-rock-sh:#3c4258;  --n-rock-sh:#0c1024;
  --d-snow-lit:#ffffff; --n-snow-lit:#8496c8;
  --d-snow-sh:#aec4e4;  --n-snow-sh:#34447a;
  --alpen:#ffbe3c; --alpen2:#ff7a52;      /* 日照金山：金色與玫瑰色 */

  /* —— 中景：冰磧坡、湖、森林 —— */
  --d-moraine:#9c9080;  --n-moraine:#20223a;
  --d-moraine-dk:#6c6254; --n-moraine-dk:#131526;
  --d-milk:#86dcd4;     --n-milk:#1c4660;       /* 牛奶海 */
  --d-milk2:#d4f6f0;    --n-milk2:#2c5e7e;
  --d-lake5a:#1a5cb0;   --n-lake5a:#0a2044;      /* 五色海：深藍、青綠、黃綠 */
  --d-lake5b:#24b0a4;   --n-lake5b:#12445a;
  --d-lake5c:#c6d66a;   --n-lake5c:#344638;
  --d-fir:#2c583a;      --n-fir:#0b1919;
  --d-fir-dk:#183826;   --n-fir-dk:#050d0f;

  /* —— 近景：秋天的樹、草甸、溪流 —— */
  --d-leaf:#f0a624;     --n-leaf:#463826;
  --d-leaf-hi:#ffdc6c;  --n-leaf-hi:#665232;
  --d-leaf-dk:#b46614;  --n-leaf-dk:#281e14;
  --d-bush:#c8442a;     --n-bush:#381c1a;
  --d-trunk:#efe9de;    --n-trunk:#565866;
  --d-meadow:#c49c50;   --n-meadow:#28282e;
  --d-meadow-hi:#e6c676;--n-meadow-hi:#38383e;
  --d-meadow-dk:#86683a;--n-meadow-dk:#15151b;
  --d-creek:#94d4f0;    --n-creek:#36568a;
  --d-road:#b6a88c;     --n-road:#2c2c34;
  --d-wood:#a67a4e;     --n-wood:#382c28;
  --d-wood-dk:#6c4a2c;  --n-wood-dk:#1c1614;
  --d-stone:#a8a49c;    --n-stone:#383a46;
  --d-stone-dk:#6c6862; --n-stone-dk:#20222c;
  --d-stupa:#fbfaf4;    --n-stupa:#868ca8;
  --d-stupa-sh:#c6cad4; --n-stupa-sh:#464c6c;

  /* —— 不隨時間變化的顏色 —— */
  --gold:#e8b23a; --gold-dk:#a6721c;
  --flag-b:#2f6fd6; --flag-w:#f4f4ee; --flag-r:#d83a2e; --flag-g:#2f9a4e; --flag-y:#f2c22e;   /* 經幡五色：藍白紅綠黃 */
  --yak:#2a2220; --yak-hi:#5a463a; --yak-white:#f0eade; --horn:#e8dcc0;
  --horse:#8a5634; --horse-dk:#5a3420; --mane:#2a1a14; --rug1:#c8302a; --rug2:#2a62c8; --rug3:#f2c22e;
  --skin1:#f0c4a0; --skin2:#c98a5e; --skin3:#a66a44; --skin4:#f6d6bc;
  --hair1:#1e1612; --hair2:#5a3a26; --hair3:#c8c8cc;
  --chuba1:#6a2622; --chuba2:#3a2c26; --chuba3:#2a3a5a; --chuba-trim:#ecdcb2; --sash:#d84a3a; --felt:#7a5a3a; --coral:#e2503a; --turq:#3ac0b0;
  --cl1:#ff6a4a; --cl2:#2f7ae0; --cl3:#ffcf3a; --cl4:#2fae84; --cl5:#a85ad8; --cl6:#f2f0ea; --cl7:#e84a7a;
  --pants:#2e3440; --boot:#3a2a22; --pack:#3a4a5a;
  --bus:#f4f6f2; --bus-band:#2a9a5a; --bus-glass:#1e2e3a; --tire:#1e1e22;
  --smoke:#f6f4ee; --ember:#ff8a3a; --lamp:#ffd27a; --headlamp:#fff4d0;
  --marmot:#b88448; --marmot-dk:#6e4a26; --chough:#16161a; --chough-bill:#e8302a; --vulture:#3e3226; --vulture-hi:#d8c8a8;
  --rain:#d4e4f4; --flake:#ffffff;
  --lungta1:#2f6fd6; --lungta2:#f4f4ee; --lungta3:#d83a2e; --lungta4:#2f9a4e; --lungta5:#f2c22e;   /* 風馬紙 */
  --cine-shade:#000000; --cine-light:#fff1d6;   /* 表演氛圍：暗角與中央微亮 */

  /* —— 頁面介面（電影院般的深色） —— */
  --page-bg:#080a10; --page-fg:#eef0f6; --page-muted:#8e98a8;
  --ui-surface:#10141e; --ui-line:#262f44; --ui-accent:#f2b63a; --ui-hot:#ffb02e; --ui-hot2:#3a86e8;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:6px;overflow:hidden;background:#000;line-height:0;box-shadow:0 18px 50px rgba(0,0,0,.55)}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:6px;padding:10px 14px}
.panel button{font:700 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:4px;padding:9px 14px;cursor:pointer;letter-spacing:.04em}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:#1c1204}
.panel button.big{border-color:var(--ui-hot);color:#1c1204;background:var(--ui-hot)}
.panel button.big2{border-color:var(--ui-hot2);color:#fff;background:var(--ui-hot2)}
.panel button:disabled{opacity:.45;cursor:default}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid #fff4d8;outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(220px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding:0;list-style:none;color:var(--page-muted);font-size:14px;line-height:1.8;display:flex;flex-wrap:wrap;gap:4px 22px}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .bubble path{fill:rgba(14,12,8,.84);stroke:rgba(255,214,140,.55);stroke-width:1}
#scene .bubble text{fill:#fff8ea;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>
<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。
   想恢復完整版，刪掉這整段 <style id="pure-art"> 即可。
   ========================================================= */
html,body{height:100%;margin:0!important;overflow:hidden}
body{display:flex!important;align-items:center;justify-content:center;padding:0!important}
body>.wrap{width:100%!important;max-width:min(100vw,calc(100vh * 8 / 3))!important;
  margin:0!important;padding:0!important;gap:0!important;display:block!important}
body>.wrap>:not(.stage){display:none!important}
body>.wrap>.stage{width:100%!important;max-width:100%!important;margin:0!important;
  border:0!important;border-radius:0!important;box-shadow:none!important}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 舞台。圖層由遠到近（每層的滑鼠視差不同）：
       天空（太陽、月亮、星星、銀河、雲）
       → 遠山（淡藍的山脊）→ 三神山（亮面、陰影面、積雪、日照金山的金光）
       → 山腰的雲帶 → 中景（冰磧坡、牛奶海、五色海、步道、冷杉林、鳥）
       → 近景（草甸、溪流、道路與電瓶車、金黃樹林、犛牛、馬隊）
       → 前景（經幡、白塔、轉經的人、煨桑爐、瑪尼堆、木棧道與遊客、攝影師、旱獺）
       → 雨雪、風馬紙、暗角、顆粒、說話泡泡、表演氛圍
       大部分的物件由下方 JS 產生，這裡只放骨架、漸層與圖樣。
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" role="img" aria-label="稻城亞丁：站在洛絨牛場望向三座雪山，仙乃日、央邁勇、夏諾多吉，山腳有牛奶海與五色海，秋天金黃的樹林、犛牛、白塔與五色經幡">
    <defs>
      <!-- 天空 -->
      <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-top)"/><stop offset=".55" style="stop-color:var(--sky-mid)"/><stop offset="1" style="stop-color:var(--sky-hor)"/>
      </linearGradient>
      <linearGradient id="duskG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--dawn2)" stop-opacity="0"/><stop offset=".5" style="stop-color:var(--dawn2)" stop-opacity=".3"/><stop offset="1" style="stop-color:var(--dawn)" stop-opacity=".9"/>
      </linearGradient>
      <radialGradient id="sunG"><stop offset="0" style="stop-color:var(--sun)"/><stop offset=".12" style="stop-color:var(--sun)"/><stop offset=".22" style="stop-color:var(--sun-glow)" stop-opacity=".55"/><stop offset="1" style="stop-color:var(--sun-glow)" stop-opacity="0"/></radialGradient>
      <radialGradient id="moonGlowG"><stop offset="0" style="stop-color:var(--moon)" stop-opacity=".45"/><stop offset="1" style="stop-color:var(--moon)" stop-opacity="0"/></radialGradient>
      <radialGradient id="milkyG"><stop offset="0" style="stop-color:var(--milky)" stop-opacity=".32"/><stop offset="1" style="stop-color:var(--milky)" stop-opacity="0"/></radialGradient>
      <radialGradient id="cloudG" cx=".5" cy=".42" r=".55"><stop offset="0" style="stop-color:var(--cloud)"/><stop offset=".6" style="stop-color:var(--cloud)" stop-opacity=".9"/><stop offset="1" style="stop-color:var(--cloud-sh)" stop-opacity="0"/></radialGradient>
      <radialGradient id="cloudShG" cx=".5" cy=".5" r=".5"><stop offset="0" style="stop-color:var(--cloud-sh)" stop-opacity=".85"/><stop offset="1" style="stop-color:var(--cloud-sh)" stop-opacity="0"/></radialGradient>
      <radialGradient id="fogG" cx=".5" cy=".5" r=".5"><stop offset="0" style="stop-color:var(--fog)" stop-opacity=".9"/><stop offset=".6" style="stop-color:var(--fog)" stop-opacity=".6"/><stop offset="1" style="stop-color:var(--fog)" stop-opacity="0"/></radialGradient>
      <linearGradient id="hazeG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--haze)" stop-opacity="0"/><stop offset=".7" style="stop-color:var(--haze)" stop-opacity=".75"/><stop offset="1" style="stop-color:var(--haze)" stop-opacity=".95"/></linearGradient>
      <!-- 雪山材質 -->
      <linearGradient id="farG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--far-hi)"/><stop offset=".5" style="stop-color:var(--far)"/><stop offset="1" style="stop-color:var(--haze)"/></linearGradient>
      <linearGradient id="rockLitG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--rock-lit)"/><stop offset=".7" style="stop-color:var(--rock-lit)"/><stop offset="1" style="stop-color:var(--haze)"/></linearGradient>
      <linearGradient id="rockShG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--rock-sh)"/><stop offset=".7" style="stop-color:var(--rock-sh)"/><stop offset="1" style="stop-color:var(--haze)"/></linearGradient>
      <linearGradient id="snowLitG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--snow-lit)"/><stop offset="1" style="stop-color:var(--snow-sh)" stop-opacity=".9"/></linearGradient>
      <linearGradient id="snowShG" x1="1" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--snow-sh)"/><stop offset="1" style="stop-color:var(--rock-sh)" stop-opacity=".9"/></linearGradient>
      <!-- 日照金山：金光由山頂往下照（遮罩的漸層由 JS 移動） -->

      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();

  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {

    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);

    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}

    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>

  T.t = (((hNow % 24) + 24) % 24) / 24;
  PEAKS.forEach(P => {
    const [a, b] = GOLD_T[P.key];
    P.gp = smooth(a, b, t) * .5 + smooth(b, 19, t) * .25;
    P.gk = smooth(a - .4, a + 1.2, t) * (1 - smooth(16.5, 21.5, t) * .85);
  });
  // 光芒：從左上斜射下來
  $('rays').setAttribute('opacity', f2(win(4, 8, 16, 21, t) * .55));

  vul.x = x; vul.y = y;
  vul.g.setAttribute('transform', `translate(${f1(x)} ${f1(y)}) scale(${dir * .8} .8) rotate(${f1(headAng(vx, vy, dir) * .6)})`);
  vul.g.setAttribute('opacity', f2(dayK * (1 - wx.cloud * .3)));
  // 步道上的健行者
  mid.hikers.forEach(H => {
    H.u += H.sp * adt; if (H.u > 1) { H.u = 1; H.sp *= -1; } if (H.u < 0) { H.u = 0; H.sp *= -1; }
    const p = H.path.getPointAtLength(H.u * H.L), q = H.path.getPointAtLength(clamp(H.u + .01 * Math.sign(H.sp), 0, 1) * H.L);
    const dir = q.x >= p.x ? 1 : -1;
    H.g.setAttribute('transform', `translate(${f1(p.x)} ${f1(p.y)}) scale(${dir} 1)`);
  });
}

/* ---------------- 主迴圈 ---------------- */
function loop(now) { const dt = Math.min(.1, (now - last) / 1000); last = now; step(dt); requestAnimationFrame(loop); }
function step(dt) {
  time += dt;
  const adt = dt * mvK();
  if (T.auto && !T.dragging && !reduced && !show.on) T.t = (T.t + dt / DAY_SEC) % 1;
  const wk = Math.min(1, dt * (show.on ? 1.2 : .6));
  for (const k in wx) if (typeof wx[k] === 'number') wx[k] = lerp(wx[k], wxT[k], wk);
  updateShow(dt);
  colorAcc += dt; if (colorAcc > .1 || show.on) { colorAcc = 0; applyColors(); }
  updateGold();
  mouse.nx = lerp(mouse.nx, mouse.x, Math.min(1, dt * 2.5)); mouse.idle += dt;
  for (const k in PX) LY[k].setAttribute('transform', `translate(${f1(parallaxX(PX[k] * mvK()))} 0)`);
  LY.world.setAttribute('transform', cam.s > 1.001 ? `translate(${cam.fx} ${cam.fy}) scale(${cam.s.toFixed(4)}) translate(${-cam.fx} ${-cam.fy})` : '');
  updateEnv(dt, adt);
  updateKora(dt, adt);
  updateWalkers(dt, adt);
  updateYaks(dt, adt);
  updateHorse(dt, adt);
  updateBus(dt, adt);
  updateMarmot(dt, adt);
  updateBirds(dt, adt);
  updateLungta(dt, adt);
  for (let i = tweens.length - 1; i >= 0; i--) { const tw = tweens[i]; tw.t += dt; const k = Math.min(1, tw.t / tw.dur); tw.fn(k); if (k >= 1) { tweens.splice(i, 1); tw.done && tw.done(); } }
}

/* ---------------- 初始化 ---------------- */
function drawRays() {
  const g = $('rays');
  [[-40, 40, 0], [120, 30, 1], [300, 26, 2], [520, 22, 3]].forEach(([x, w, i]) => el('path', { d: `M${x} -20 L${x + w} -20 L${x + 900 + i * 60} 640 L${x + 760 + i * 60} 640 Z`, fill: 'url(#rayG)', opacity: .5 - i * .08 }, g));
}
function init() {
  drawSky();
  drawFar();
  drawPeaks();
  drawVulture();
  drawBands();
  drawMid();
  for (let i = 0; i < 6; i++) makeChough(LY.Lmid);
  drawNear();
  drawFore();
  drawKora();
  drawCast();
  drawRays();
  initLungta();
  bindAll();
  if (reduced) { T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false'); }
  setWeather(0);
  applyColors();
  step(1 / 60);
  requestAnimationFrame(loop);
}
init();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on && show.kind,
  btn: { gold: 'btnGold', wind: 'btnWind' },
  ff: () => { show.cues = new Proxy({}, { get: () => 1 }); show.t = show.dur - .02; },   // 跳過剩下橋段直接收尾（天氣會自動恢復）
  save: () => ({ t: T.t, auto: T.auto }),
  stop: () => endShow(),
  restore: s => { T.t = s.t; T.auto = s.auto; $('btnAuto') && $('btnAuto').setAttribute('aria-pressed', String(T.auto)); applyColors(true); }
});
/* /ShowStop */
})();
</script>
