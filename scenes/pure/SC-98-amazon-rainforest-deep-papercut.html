<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>亞馬遜雨林深處</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-98 亞馬遜雨林深處｜剪紙層疊（紙雕立體光影）
   地點：巴西亞馬遜雨林內部，像自然紀錄片的鏡頭走進森林最深處。
        畫面裡沒有人：一層層越遠越淡的樹幹與霧氣，陽光從樹冠的縫隙斜斜照下來；
        中間是有板根的巨型木棉、絞殺榕、號角樹和會「走路」的高跷根棕櫚，
        林下有一條黑水小溪和一根橫倒的大樹幹。
        動物：美洲豹、南美貘、角鵰、凱門鱷、樹懶、松鼠猴、紅吼猴、巨嘴鳥、
        金剛鸚鵡、切葉蟻、箭毒蛙、藍閃蝶、蜂鳥、螢火蟲、夜裡發光的蕈菇。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   --d-名稱 = 白天、--n-名稱 = 夜晚、--k-名稱 = 黃昏（--n／--k 可省略，省略時程式自動算出夜色與暮色）。
   JS 依時間混色，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（線色）兩個 class。
   沒有 --d- 前綴的（例如 --lamp）是固定色，不隨日夜改變。
   ========================================================= */
:root{
  color-scheme: light;
  /* —— 樹冠縫隙裡的天空 —— */
  --d-skyT:#7cc8ea; --k-skyT:#8a78c0; --n-skyT:#0a1630;
  --d-skyB:#e6f6e0; --k-skyB:#ffbe86; --n-skyB:#1c2e48;
  /* —— 林中空氣（越深越藍綠，像紀錄片裡的霧氣） —— */
  --d-airT:#bfdc9c; --k-airT:#d8b890; --n-airT:#0c1c22;
  --d-airB:#86b89c; --k-airB:#a49a86; --n-airB:#0a1a1e;
  /* —— 一層層的樹幹與葉叢（越遠越淡） —— */
  --d-far1:#94c2a0; --k-far1:#b8a896; --n-far1:#132a2c;
  --d-far2:#6ca883; --k-far2:#94907a; --n-far2:#102426;
  --d-far3:#4a8a62; --n-far3:#0c2022;
  --d-trunk1:#a4c3a8; --n-trunk1:#16292c;
  --d-trunk2:#7aa285; --n-trunk2:#122428;
  --d-trunk3:#5a7c61; --n-trunk3:#0e1e20;
  /* —— 樹葉（紙板由深到淺） —— */
  --d-leafDk:#1a5232; --n-leafDk:#06141a;
  --d-leaf1:#2a7740; --n-leaf1:#09191c;
  --d-leaf2:#3c9449; --n-leaf2:#0c2220;
  --d-leaf3:#58b455; --n-leaf3:#112a24;
  --d-leaf4:#8acb5a; --n-leaf4:#163226;
  --d-leafLt:#b6e27c; --n-leafLt:#1c3a2c;
  --d-vine:#566830; --n-vine:#101814;
  --d-moss:#7aa83e; --n-moss:#142418;
  --d-cecro:#d2dcc8; --n-cecro:#24303a;
  /* —— 樹幹 —— */
  --d-bark:#ada48a; --k-bark:#c0a084; --n-bark:#262830;
  --d-barkSh:#857c64; --n-barkSh:#1a1a22;
  --d-barkLt:#cdc5aa; --n-barkLt:#34363e;
  --d-fig:#8e7a5e; --n-fig:#221e22;            /* 絞殺榕纏繞的氣根 */
  --d-figLt:#ae9876; --n-figLt:#2e2a2c;
  --d-trunk2b:#dcd6c6; --n-trunk2b:#30343c;    /* 號角樹淺色樹幹 */
  --d-palm:#6a5a40; --n-palm:#1c1a1a;          /* 高跷根棕櫚 */
  /* —— 林地與小溪 —— */
  --d-floor:#6f5a38; --k-floor:#7e5c3e; --n-floor:#161414;
  --d-floorLt:#8e7446; --n-floorLt:#201c1a;
  --d-litter:#b0864a; --n-litter:#2a2218;      /* 落葉 */
  --d-creek:#2c2a1e; --k-creek:#4a2c20; --n-creek:#07080e;    /* 黑水小溪 */
  --d-creekLt:#55704a; --n-creekLt:#181a26;
  --d-creekHi:#d4e2b8; --n-creekHi:#34384e;
  --d-log:#7a5634; --n-log:#1e1616;            /* 倒木 */
  --d-logDk:#56391f; --n-logDk:#140e0e;
  --d-logLt:#a07448; --n-logLt:#2a2020;
  --d-fungus:#efe2c6; --n-fungus:#9fe0b8;      /* 夜裡會發光的蕈菇 */
  /* —— 王蓮 —— */
  --d-lily:#4e9b3c; --n-lily:#122a1e;
  --d-lilyLt:#6fbb50; --n-lilyLt:#183424;
  --d-lilyRim:#9b3f3a; --n-lilyRim:#2a1418;
  --d-lilyFlw:#fbf8ee; --n-lilyFlw:#e8e6f0;
  /* —— 動物 —— */
  --d-jag:#d9a043; --k-jag:#e0a050; --n-jag:#4a3a28;      /* 美洲豹 */
  --d-jagLt:#f3dcae; --n-jagLt:#5e5040;
  --d-jagSpot:#2a1c14; --n-jagSpot:#0e0a0a;
  --d-tapir:#5a4a44; --n-tapir:#1a1618;        /* 南美貘 */
  --d-tapirDk:#3c302c; --n-tapirDk:#100c0e;
  --d-harpy:#8c8c92; --n-harpy:#2a2a32;        /* 角鵰 */
  --d-harpyDk:#2e2e34; --n-harpyDk:#0e0e12;
  --d-harpyW:#f2f0ea; --n-harpyW:#4a4a54;
  --d-caiman:#7d8a50; --n-caiman:#1a2018;
  --d-caimanDk:#4f5a32; --n-caimanDk:#101410;
  --d-sloth:#ab9474; --n-sloth:#2e2a28;
  --d-slothDk:#7c6650; --n-slothDk:#1e1a1a;
  --d-slothFace:#ece0c6; --n-slothFace:#3e3a36;
  --d-monkey:#8d8a40; --n-monkey:#22241a;
  --d-monkeyY:#efb63a; --n-monkeyY:#3a3020;
  --d-howler:#9c3e22; --n-howler:#2a1614;
  --d-howlerDk:#702a16; --n-howlerDk:#1c0e0e;
  --d-toucanB:#1c1a1c; --n-toucanB:#0a0a0e;
  --d-toucanBill:#f39a28; --n-toucanBill:#6a4220;
  --d-toucanW:#fff1b8; --n-toucanW:#4a4636;
  --d-macawR:#e0322e; --n-macawR:#4a1a1e;
  --d-macawY:#f6c331; --n-macawY:#5a4a22;
  --d-macawB:#2e6fd0; --n-macawB:#1a2a4a;
  --d-macawG:#3aa860; --n-macawG:#163a2a;
  --d-morpho:#2aa6ff; --n-morpho:#1a4a7a;
  --d-morphoDk:#123a6a;
  --d-frog:#2b7fe6; --n-frog:#1a3a6a;
  --d-heli:#e8402e; --n-heli:#4a1a1e;
  --d-heliY:#f6c331; --n-heliY:#4a3a1e;
  --d-hum:#2fbf8a; --n-hum:#163a2e;
  --d-brom:#e0476a; --n-brom:#3a1624;
  --d-orchid:#e98ad0; --n-orchid:#4a2442;
  --d-ant:#5a2a1a; --n-ant:#1a0c0a;            /* 切葉蟻 */
  --d-white:#fbfbf6; --n-white:#5a5e74;
  --d-shadow:#12241a; --n-shadow:#000000;

  /* —— 固定色：光束、天體、特效 —— */
  --sun:#ffe08a; --sunCore:#fff6d2; --moon:#f7f0d4; --star:#fff6da;
  --ray:#fff6c8; --glow:#ffcf6a;
  --firefly:#e4ff7a; --fireflyGlow:#b8ff5a; --funGlow:#8affc8;
  --eye:#ffd23a; --splash:#ffffff; --rainc:#b9d0c4; --flash:#eef4ff;
  --wx-cloud:#7d8a86; --wx-rain:#1e3030; --wx-mist:#eef6ee;
  --nightBase:#0a1820; --duskBase:#ff9a6a;

  /* —— 頁面介面 —— */
  --page-bg:#f1f4ec; --page-fg:#1c2a22; --page-muted:#566a5e;
  --ui-surface:#ffffff; --ui-line:#d4ddd4; --ui-accent:#2b7a44; --ui-accent-2:#b4521e;
  --cine-shade:#000000; --cine-light:#fff3dc;
  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:14px;overflow:hidden;background:var(--skyB,#dff4ec);line-height:0;box-shadow:0 2px 12px #0000001f}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:12px;padding:10px 14px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--page-fg);border-color:var(--page-fg);color:#fff;font-weight:700}
.panel button.big{border-color:var(--ui-accent);color:#fff;background:var(--ui-accent);font-weight:700}
.panel button.big.alt{border-color:var(--ui-accent-2);background:var(--ui-accent-2)}
.panel button.big.on{background:#f2b632;border-color:#f2b632;color:var(--page-fg)}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid var(--ui-accent);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable,#scene [role="button"]{cursor:pointer}
/* 紙板投影：靜態圖層複製一份塗成影子色，跟著太陽方向位移（--shx、--shy 由程式更新） */
#scene .shc,#scene .shc *{fill:var(--shadow)!important;stroke:var(--shadow)!important;pointer-events:none}
#scene .shc{opacity:.3}
#scene .shc [class^="s-"]{fill:none!important}
#scene .sh1{transform:translate(calc(var(--shx,2) * 1px),calc(var(--shy,3) * 1px))}
#scene .sh2{transform:translate(calc(var(--shx,2) * 1.7px),calc(var(--shy,3) * 1.7px))}
#scene .sh3{transform:translate(calc(var(--shx,2) * 2.6px),calc(var(--shy,3) * 2.6px))}
#scene .bubble rect{fill:#ffffff;stroke:#1e2a26;stroke-width:1.6}
#scene .bubble text{fill:#1e2a26;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .bubble .pop{animation:pop var(--dur,1.6s) ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){ #scene .bubble .pop{animation:none} }
</style>
<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。
   想恢復完整版，刪掉這整段 <style id="pure-art"> 即可。
   ========================================================= */
html,body{height:100%;margin:0!important;overflow:hidden}
body{display:flex!important;align-items:center;justify-content:center;padding:0!important}
body>.wrap{width:100%!important;max-width:min(100vw,calc(100vh * 8 / 3))!important;
  margin:0!important;padding:0!important;gap:0!important;display:block!important}
body>.wrap>:not(.stage){display:none!important}
body>.wrap>.stage{width:100%!important;max-width:100%!important;margin:0!important;
  border:0!important;border-radius:0!important;box-shadow:none!important}
</style>
</head>
<body>
<main class="wrap">
  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       紙板由後往前疊：樹冠縫隙裡的天空（太陽、月亮、星星）→ 林中空氣
       → 最遠的樹幹層 → 第二層樹幹與葉叢 → 從縫隙照下來的光束、霧
       → 中景大樹（巨型木棉、絞殺榕、號角樹、高跷根棕櫚）與樹上的動物
       → 林地、黑水小溪、倒木與林下動物（美洲豹、貘、凱門鱷、切葉蟻、蕈菇）
       → 前景大葉子、赫蕉、箭毒蛙、垂藤 → 樹冠最上層 → 天氣 → 表演氛圍
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="紙雕風格的亞馬遜雨林深處：一層層越遠越淡的樹幹與霧氣，陽光從樹冠縫隙照下來，中間有板根巨樹、絞殺榕與黑水小溪，倒木上走著美洲豹，溪邊有貘在喝水，樹上有樹懶、猴子、巨嘴鳥、金剛鸚鵡與角鵰">
    <defs>
      <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--skyT)"/><stop offset="1" style="stop-color:var(--skyB)"/>
      </linearGradient>
      <linearGradient id="airG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--airT)"/><stop offset="1" style="stop-color:var(--airB)"/>
      </linearGradient>
      <linearGradient id="rayG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--ray);stop-opacity:.85"/><stop offset=".7" style="stop-color:var(--ray);stop-opacity:.25"/><stop offset="1" style="stop-color:var(--ray);stop-opacity:0"/>
      </linearGradient>
      <filter id="pshS" x="-20%" y="-20%" width="150%" height="150%" color-interpolation-filters="sRGB">
        <feDropShadow id="pshSd" dx="2" dy="2.5" stdDeviation="1" style="flood-color:var(--shadow)" flood-opacity=".34"/>
      </filter>
      <filter id="paperTex" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".9 .6" numOctaves="2" seed="7" result="n"/>
        <feColorMatrix type="matrix" values="0 0 0 0 .35  0 0 0 0 .3  0 0 0 0 .22  0 0 0 -1.1 .62"/>
      </filter>
      <radialGradient id="glowG"><stop offset="0" style="stop-color:var(--glow);stop-opacity:.9"/><stop offset="1" style="stop-color:var(--glow);stop-opacity:0"/></radialGradient>
      <radialGradient id="sunG"><stop offset=".25" style="stop-color:var(--sun);stop-opacity:.75"/><stop offset="1" style="stop-color:var(--sun);stop-opacity:0"/></radialGradient>
      <radialGradient id="moonG"><stop offset=".3" style="stop-color:var(--moon);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--moon);stop-opacity:0"/></radialGradient>
      <radialGradient id="flyG"><stop offset="0" style="stop-color:var(--firefly);stop-opacity:1"/><stop offset=".35" style="stop-color:var(--fireflyGlow);stop-opacity:.5"/><stop offset="1" style="stop-color:var(--fireflyGlow);stop-opacity:0"/></radialGradient>
      <radialGradient id="funG"><stop offset="0" style="stop-color:var(--funGlow);stop-opacity:.8"/><stop offset="1" style="stop-color:var(--funGlow);stop-opacity:0"/></radialGradient>
      <radialGradient id="eyeG"><stop offset="0" style="stop-color:var(--eye);stop-opacity:1"/><stop offset="1" style="stop-color:var(--eye);stop-opacity:0"/></radialGradient>
      <radialGradient id="mistR"><stop offset="0" style="stop-color:var(--wx-mist);stop-opacity:.8"/><stop offset=".6" style="stop-color:var(--wx-mist);stop-opacity:.4"/><stop offset="1" style="stop-color:var(--wx-mist);stop-opacity:0"/></radialGradient>
      <clipPath id="frameClip"><rect x="0" y="0" width="1600" height="600"/></clipPath>
      <clipPath id="clipCreek"><path id="creekPath" d=""/></clipPath>
      <path id="antPath" d="" fill="none"/>
    </defs>

    <g clip-path="url(#frameClip)">
    <!-- ===== 場景：樹冠縫隙裡的天空 ===== -->
    <rect x="0" y="0" width="1600" height="600" fill="url(#skyG)"/>
    <rect id="skyTint" x="0" y="0" width="1600" height="200" opacity="0" pointer-events="none"/>
    <g id="stars" pointer-events="none"></g>
    <g id="sun" pointer-events="none"></g>
    <g id="moon" pointer-events="none"></g>
    <g id="skyBirds" pointer-events="none"></g>

    <!-- ===== 場景：林中空氣與一層層的遠方樹木 ===== -->
    <g id="parFar">
      <path id="air" d="" fill="url(#airG)"/>
      <g id="layer0"></g>
      <g id="mistFar" pointer-events="none"></g>
      <g id="layer1"></g>
    </g>
    <g id="parRay" pointer-events="none">
      <g id="rays"></g>
      <g id="mistNear"></g>
      <g id="motes"></g>
    </g>

    <!-- ===== 場景：中景大樹與樹上的動物 ===== -->
    <g id="parMid">
      <g id="layer2"></g>
      <g id="midTrees"></g>
      <g id="treeAnimals"></g>
      <g id="flyBirds" pointer-events="none"></g>
    </g>

    <!-- ===== 場景：林地、黑水小溪、倒木與林下動物 ===== -->
    <g id="parNear">
      <g id="floor"></g>
      <g id="creek"></g>
      <g id="creekStrips" pointer-events="none" clip-path="url(#clipCreek)"></g>
      <g id="ripples" pointer-events="none"></g>
      <g id="tapir"></g>
      <g id="caiman"></g>
      <g id="lilies"></g>
      <g id="log"></g>
      <g id="fungi"></g>
      <g id="ants" pointer-events="none"></g>
      <g id="jaguar"></g>
      <g id="splashes" pointer-events="none"></g>
      <g id="seeds" pointer-events="none"></g>
    </g>

    <!-- ===== 場景：前景（大葉子、赫蕉、箭毒蛙、垂藤、樹冠最上層、蝴蝶、螢火蟲） ===== -->
    <g id="parFront">
      <g id="frontL"></g>
      <g id="frontR"></g>
      <g id="frontB"></g>
      <g id="canopy"></g>
      <g id="vines"></g>
      <g id="butterflies"></g>
      <g id="hums" pointer-events="none"></g>
      <g id="fireflies" pointer-events="none"></g>
    </g>

    <!-- ===== 天氣與氛圍 ===== -->
    <g id="rain" pointer-events="none" opacity="0"></g>
    <rect id="wxTint" x="0" y="0" width="1600" height="600" opacity="0" pointer-events="none"/>
    <rect id="flashR" x="0" y="0" width="1600" height="600" opacity="0" pointer-events="none" style="fill:var(--flash)"/>
    <rect x="0" y="0" width="1600" height="600" filter="url(#paperTex)" opacity=".5" pointer-events="none"/>
    <g id="notes" pointer-events="none"></g>
    <g id="bubbles" pointer-events="none"></g>
    <!-- 表演氛圍（取代寬銀幕黑邊）：四周輕微暗角＋中央微亮，緩緩淡入淡出 -->
    <g id="cineFx" opacity="0" pointer-events="none">
      <defs>
        <radialGradient id="cineShadeG" cx=".5" cy=".5" r=".72"><stop offset=".52" style="stop-color:var(--cine-shade);stop-opacity:0"/><stop offset="1" style="stop-color:var(--cine-shade);stop-opacity:.4"/></radialGradient>
        <radialGradient id="cineLightG" cx=".5" cy=".45" r=".5"><stop offset="0" style="stop-color:var(--cine-light);stop-opacity:.08"/><stop offset="1" style="stop-color:var(--cine-light);stop-opacity:0"/></radialGradient>
      </defs>
      <rect x="0" y="0" width="1600" height="600" fill="url(#cineShadeG)"/>
      <rect x="0" y="0" width="1600" height="600" fill="url(#cineLightG)"/>
    </g>
    </g>
  </svg>
  </figure>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }

  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */

      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {

    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {

  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {

      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';

    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }

    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });

    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}

  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });

  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }

  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>
/* ---- 表演氛圍（取代寬銀幕黑邊）：k = 0~1，四周輕微暗角＋中央微亮 ---- */
let cineK = 0, cineW = 0;
function setCine(k, fx, fy) {
  cineK = k = Math.max(0, Math.min(1, k));
  if (k === cineW || (Math.abs(k - cineW) < .004 && k > 0 && k < 1)) return;
  cineW = k;
  const g = document.getElementById('cineFx'); if (!g) return;
  g.setAttribute('opacity', k.toFixed(3));
  if (fx != null) { const G = document.getElementById('cineLightG'); G.setAttribute('cx', (fx / 1600).toFixed(3)); G.setAttribute('cy', (fy / 600).toFixed(3)); }
}

/* =========================================================
   SC-98 亞馬遜雨林深處｜程式區
   區塊：①工具與色票
         ②場景（樹冠縫隙的天空、一層層的遠方樹木、光束與霧、中景大樹、林地與黑水小溪、倒木、前景植物、樹冠）
         ③角色（美洲豹、南美貘、角鵰、凱門鱷、樹懶、松鼠猴、紅吼猴、巨嘴鳥、金剛鸚鵡、切葉蟻、箭毒蛙、蝴蝶、蜂鳥、螢火蟲）
         ④動畫（日夜、紙板投影、光束、天氣、雨林晨曲、美洲豹夜行、環境）

(() => {
'use strict';

const $ = id => document.getElementById(id);
const root = document.documentElement;
const svg = $('scene');
const GROUND = 480;            // 林地的大約高度
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------------- ⑤ 互動：聲音引擎（音樂軌、音效軌分開；同軌的新聲音讓舊的淡出） ---------------- */
let actx = null, master = null, sfxBus = null, musBus = null, noiseBuf = null, soundOn = true, userGesture = false;

  if (!actx) {
    const AC = window.__SceneAudioContext || window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
    master = actx.createGain(); master.gain.value = soundOn ? .5 : 0;
    const comp = actx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3;
    master.connect(comp); comp.connect(actx.destination);

    musBus = actx.createGain(); musBus.gain.value = .64; /* 音樂軌音量 ×0.64（2026-11-24 兩次各調降 20%） */ musBus.connect(master);
  }

}
const audioOK = () => actx && actx.state === 'running' && soundOn;
function newTrack() {
  const g = actx.createGain(); g.connect(musBus);
  const old = musNode;
  if (old) { old.gain.setTargetAtTime(0, actx.currentTime, .15); setTimeout(() => { try { old.disconnect(); } catch (e) {} }, 900); }
  musNode = g;

}

}

}

function ambient(rain, bugs) {
  if (!actx || actx.state !== 'running') return;
  if (!rainGain) {
    const mk = (hpF, lpF, q) => {
      const s = actx.createBufferSource(); s.buffer = nbuf(); s.loop = true;
      const hp = actx.createBiquadFilter(); hp.type = q ? 'bandpass' : 'highpass'; hp.frequency.value = hpF; if (q) hp.Q.value = q;
      const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = lpF;
      const g = actx.createGain(); g.gain.value = 0;
      s.connect(hp); hp.connect(lp); lp.connect(g); g.connect(sfxBus); s.start();
      return g;
    };
    rainGain = mk(500, 5200);
    const bg = mk(5600, 9000, 9);
    const trem = actx.createGain(); trem.gain.value = .5; bg.disconnect(); bg.connect(trem); trem.connect(sfxBus);
    const lfo = actx.createOscillator(), lg = actx.createGain(); lfo.frequency.value = 17; lg.gain.value = .45; lfo.connect(lg); lg.connect(trem.gain); lfo.start();

}

    [[74, 1], [79, 1], [83, 2], [86, 4]], [[85, 2], [81, 2], [76, 2], [73, 2]], [[78, 2], [81, 2], [86, 4]], [[86, 8]]

/* ---------------- ④ 動畫：日夜循環＋紙板投影 ----------------
   T.t：一天中的時間（0–1，0 = 午夜）。自動播放時一天約 150 秒 */
const DAY_SEC = 150;
const T = { t: 9 / 24, auto: true, target: null };

let sunX = 0, sunY = 0, moonX = 0, moonY = 0;
function clockText() {
  const h = T.t * 24, hh = Math.floor(h) % 24, mm = Math.floor((h - Math.floor(h)) * 60 + 1e-6);
  return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
}
function applyTime(force) {
  if (!force && Math.abs(T.t - lastApplied) < .0006 && Math.abs(nightLift - liftApplied) < .01) return;
  lastApplied = T.t; liftApplied = nightLift;
  const h = T.t * 24;
  // 赤道附近：早上六點左右日出、傍晚六點左右日落，黃昏很短
  night = clamp(1 - smooth(5.5, 6.8, h) + smooth(18, 19.3, h), 0, 1);
  dusk = Math.max(Math.exp(-Math.pow((h - 6.1) / .8, 2)), Math.exp(-Math.pow((h - 18.3) / .85, 2)));
  for (const k in PAIRS) {
    const Pp = PAIRS[k];
    let c = mix(Pp.d, Pp.n, night * (1 - nightLift * .3));   // 美洲豹夜行時整體稍微亮一點（像月光照進林子）
    c = mix(c, Pp.k, dusk * .8);
    root.style.setProperty('--' + k, rgba(c));
  }
  // 太陽：早上從右邊（東）升起，傍晚落到左邊；只有在樹冠的縫隙裡看得到
  const sp = (h - 6) / 12.4, mp = ((h - 18.6 + 24) % 24) / 11.4;
  sunX = 1500 - sp * 1400; sunY = 250 - Math.sin(Math.PI * clamp(sp, 0, 1)) * 205;
  $('sun').setAttribute('transform', `translate(${f1(sunX)} ${f1(sunY)})`);
  $('sun').style.display = sp > -.04 && sp < 1.04 ? '' : 'none';
  moonX = 1500 - mp * 1400; moonY = 250 - Math.sin(Math.PI * clamp(mp, 0, 1)) * 190;
  $('moon').setAttribute('transform', `translate(${f1(moonX)} ${f1(moonY)})`);
  $('moon').style.display = mp > -.05 && mp < 1.05 ? '' : 'none';
  nOn = smooth(.3, .85, night);
  // 光束跟著太陽斜：太陽在右邊（早上）光往左下照，傍晚往右下照
  const rd = Math.round(clamp((800 - sunX) / 700, -1, 1) * .6 * 20) / 20;
  if (rd !== rayDx) { rayDx = rd; placeRays(); }
  // 紙板投影：太陽在右邊時影子往左，太陽越低影子越長；夜裡用月光、影子淡一點
  const lx = night < .5 ? sunX : moonX, ly = night < .5 ? sunY : moonY;
  const elev = clamp((260 - ly) / 210, 0, 1);
  let shx = clamp((800 - lx) / 700, -1.2, 1.2) * 3, shy = 1.6 + (1 - elev) * 1.6;
  if (night > .5) { shx *= .5; shy *= .6; }
  const key = (Math.round(shx * 4) / 4) + ',' + (Math.round(shy * 4) / 4);
  if (key !== shQ) {
    shQ = key;
    const [a, b] = key.split(',');
    root.style.setProperty('--shx', a); root.style.setProperty('--shy', b);
    $('pshSd').setAttribute('dx', (a * .8).toFixed(2)); $('pshSd').setAttribute('dy', (b * .8).toFixed(2));
  }
  $('clock').textContent = clockText();
  if (!T.dragging) $('timeRange').value = Math.round(T.t * 1000);
}

/* ---------------- ④ 動畫：天氣（晴、多雲、午後雷雨、晨霧） ----------------
   亞馬遜的午後常常突然下一場大雷雨；清晨河面會起霧 */
const WX_LIST = [['sun', '晴'], ['cloud', '多雲'], ['storm', '午後雷雨'], ['mist', '晨霧']];

const wx = { cloud: 0, storm: 0, mist: 0 };
const rainDrops = [];
let boltT = 4, flashK = 0, mistBoost = 0, mistLevel = 0, rayBoost = 0;
function drawWeather() {
  for (let i = 0; i < 170; i++) {
    const l = el('line', { style: 'stroke:var(--rainc)', 'stroke-width': 1.5, opacity: .7, 'stroke-linecap': 'round' }, $('rain'));
    rainDrops.push({ el: l, x: srand(-100, 1700), y: srand(-40, 600), sp: srand(780, 980) });
  }
  // 閃電：只在樹冠的縫隙裡看得到
  frag($('skyBirds'), `<path id="bolt" d="M0 -20 L-10 20 L2 22 L-14 70 L14 12 L2 10 L12 -20Z" style="fill:var(--flash)" opacity="0"/>`);
}
function applyWeather(dt) {
  const key = WX_LIST[wxI][0];
  for (const k in wx) { const tg = key === k ? 1 : 0; const nv = wx[k] + (tg - wx[k]) * Math.min(1, dt * 1.1); wx[k] = Math.abs(tg - nv) < .002 ? tg : nv; }
  const gray = Math.max(wx.cloud * .75, wx.storm);
  $('sun').setAttribute('opacity', f1(1 - gray * .8));
  const st = $('skyTint');
  st.style.fill = wx.mist > .05 ? 'var(--wx-mist)' : 'var(--wx-cloud)';
  st.setAttribute('opacity', f1(Math.max(wx.storm * .8, wx.cloud * .6, wx.mist * .5) * (1 - night * .6)));
  $('wxTint').style.fill = 'var(--wx-rain)';
  $('wxTint').setAttribute('opacity', f1(wx.storm * .22 + wx.cloud * .06));
  $('rain').setAttribute('opacity', f1(wx.storm));
  $('stars').setAttribute('opacity', f1(smooth(.6, 1, night) * (1 - gray) * (1 - wx.mist * .7)));
  // 霧：晨霧天氣、清晨自然起霧、晨曲表演開始時的霧
  const h = T.t * 24, morning = Math.exp(-Math.pow((h - 6.4) / 1.1, 2)) * .55;
  mistLevel = clamp(Math.max(wx.mist, morning, mistBoost), 0, 1);
  $('mistNear').setAttribute('opacity', f1(mistLevel * .9));
  $('mistFar').setAttribute('opacity', f1(.35 + mistLevel * .65));
  $('layer0').setAttribute('opacity', f1(1 - mistLevel * .5));
  $('layer1').setAttribute('opacity', f1(1 - mistLevel * .25));
  // 光束：白天、太陽夠高才有；多雲雷雨變淡；霧裡光束最明顯；晨曲表演時特別亮
  const sunK = (1 - night) * smooth(-.02, .12, (h - 6) / 12.4) * (1 - smooth(.9, 1.02, (h - 6) / 12.4));
  const rayK = clamp(sunK * (1 - gray * .9) * (.5 + mistLevel * .5 + rayBoost * .5), 0, 1);
  $('rays').setAttribute('opacity', f1(rayK));
  $('motes').setAttribute('opacity', f1(rayK));
  ambient(soundOn ? wx.storm : 0, soundOn && userGesture ? (.35 + night * .65) * (1 - wx.storm * .6) : 0);
}

// 溪水的位置：給一個 x，算出溪中心的 y 與溪寬

    fireflies.forEach((f, i) => {
      f.x = f.x0 + Math.sin(clock * f.dr + f.ph) * 26; f.y = f.y0 + Math.cos(clock * f.dr * 1.3 + f.ph) * 14;
      let b = Math.pow(Math.max(0, Math.sin(clock * f.sp + f.ph)), 4);
      if (ffShow > 0) b = Math.max(b * (1 - ffShow), ffShow * (.3 + .7 * Math.pow(1 - beatPh, 2)) * (i % 2 ? 1 : .75));
      f.el.setAttribute('transform', `translate(${f1(f.x)} ${f1(f.y)})`);
      f.el.setAttribute('opacity', f1(b * ffOn));
    });
  } else if (fireflies[0].el.getAttribute('opacity') !== '0') fireflies.forEach(f => f.el.setAttribute('opacity', 0));
  // —— 木棉棉絮（像棉花一樣飄） ——
  for (let i = seeds.length - 1; i >= 0; i--) {
    const s = seeds[i]; s.t += dt;
    s.x += (s.vx + Math.sin(s.t * 2 + s.ph) * 14) * dt; s.y += s.vy * dt;
    s.el.setAttribute('transform', `translate(${f1(s.x)} ${f1(s.y)})`);
    s.el.setAttribute('opacity', f1(clamp(1 - (s.t - 5) / 2, 0, 1)));
    if (s.t > 7) { s.el.remove(); seeds.splice(i, 1); }
  }
  // 水花
  for (let i = splashes.length - 1; i >= 0; i--) {
    const sp = splashes[i]; sp.t += dt;
    sp.drops.forEach(d => { d.vy += 300 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.el.setAttribute('cx', f1(d.x)); d.el.setAttribute('cy', f1(Math.min(d.y, 2))); d.el.setAttribute('opacity', f1(d.y > 1 ? 0 : 1)); });
    sp.ring.setAttribute('rx', f1(6 + sp.t * 50 * sp.s)); sp.ring.setAttribute('ry', f1(1.6 + sp.t * 10 * sp.s)); sp.ring.setAttribute('opacity', f1(clamp(1 - sp.t, 0, 1)));
    if (sp.t > 1.1) { sp.el.remove(); splashes.splice(i, 1); }
  }
  // 雨
  if (wx.storm > .01) rainDrops.forEach(r => {
    r.y += r.sp * dt; r.x -= r.sp * .1 * dt;
    if (r.y > 610) { r.y = rand(-60, -10); r.x = rand(-60, 1700); }
    r.el.setAttribute('x1', f1(r.x)); r.el.setAttribute('y1', f1(r.y)); r.el.setAttribute('x2', f1(r.x - 2.4)); r.el.setAttribute('y2', f1(r.y + 18));
  });
}

/* ---------------- ⑤ 互動：說明泡泡（像紀錄片的旁白字幕） ---------------- */
function say(x, y, text, dur = 1.6) {
  const g = el('g', { class: 'bubble' }, $('bubbles'));
  const inner = el('g', { class: 'pop', style: `--dur:${dur}s` }, g);
  const t = el('text', { x: 0, y: 0 }, inner);
  t.textContent = text;
  const w = Math.max(44, (t.getComputedTextLength() || text.length * 15) + 24);
  const r = el('rect', { x: f1(-w / 2), y: -15, width: f1(w), height: 30, rx: 15 });
  inner.insertBefore(r, t);
  x = clamp(x, w / 2 + 16, 1600 - w / 2 - 16); y = clamp(y, 30, 570);
  g.setAttribute('transform', `translate(${f1(x)} ${f1(y)})`);
  setTimeout(() => g.remove(), dur * 1000);
}
const sayI = {};
const nextLine = (k, arr) => { sayI[k] = ((sayI[k] ?? -1) + 1) % arr.length; return arr[sayI[k]]; };

/* ---------------- 動畫主迴圈 ---------------- */
let last = 0, rafId = 0;
function loop(now) {
  const dt = clamp((now - last) / 1000, 0, .05); last = now;
  step(dt);
  rafId = requestAnimationFrame(loop);
}
function settle(sec) { for (let s = 0; s < sec; s += .05) step(.05); }
function renderStill() { step(.0001); }
function start() {
  cancelAnimationFrame(rafId);
  if (reduced) { T.auto = false; syncAuto(); applyTime(true); settle(1.5); }
  else { last = performance.now(); rafId = requestAnimationFrame(loop); }
}

  if (!e.clientX && !e.clientY) return { x: 800, y: 300 };

}

/* ---------------- ⑤ 互動：控制列 ---------------- */
function syncAuto() { $('btnAuto').setAttribute('aria-pressed', String(T.auto)); $('btnAuto').textContent = T.auto ? '自動播放中' : '自動播放'; }
function goTo(t) { if (reduced) { T.t = t; applyTime(true); renderStill(); } else T.target = t; }
const tap = fn => () => { userGesture = true; ensureAudio(); setTimeout(() => { fn(); if (reduced) settle(2); }, actx && actx.state !== 'running' ? 120 : 0); };
$('btnDawn').addEventListener('click', tap(startDawn));
$('btnNightT').addEventListener('click', tap(startNight));
$('btnWeather').addEventListener('click', () => {
  userGesture = true; ensureAudio();
  wxI = (wxI + 1) % WX_LIST.length;
  $('btnWeather').textContent = '天氣：' + WX_LIST[wxI][1];
  if (WX_LIST[wxI][0] === 'storm') boltT = 1.2;
  if (reduced) { for (const k in wx) wx[k] = WX_LIST[wxI][0] === k ? 1 : 0; applyWeather(0); renderStill(); }
});
$('btnSound').addEventListener('click', () => {
  soundOn = !soundOn; userGesture = true;
  $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  if (ensureAudio()) {
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.setValueAtTime(soundOn ? .5 : 0, actx.currentTime);
    if (!soundOn && musNode) { try { musNode.disconnect(); } catch (e) {} musNode = null; }
  }
});
$('btnDay').addEventListener('click', () => goTo(9 / 24));
$('btnNight').addEventListener('click', () => goTo(20.5 / 24));
$('btnAuto').addEventListener('click', () => { T.auto = !T.auto; T.target = null; syncAuto(); });
$('timeRange').addEventListener('input', e => {
  T.t = e.target.value / 1000; T.target = null; T.dragging = true; applyTime(true); T.dragging = false;
  if (reduced) renderStill();
});
mq.addEventListener?.('change', e => { reduced = e.matches; if (!reduced) { T.auto = true; syncAuto(); } start(); });

// 作者精選輪播：在網站精選區（pure 版、內嵌框）裡自動演出「雨林晨曲」（表演時不出現文字框）；音樂由網站的「聲音」按鈕透過 window.sceneMusic 開關
const inPicks = (() => { let top = true; try { top = window.top === window; } catch (e) { top = false; } return !!document.getElementById('pure-art') && !top; })();
if (inPicks) {
  const useCtx = c => {
    actx = c; rainGain = bugGain = null;
    master = actx.createGain(); master.gain.value = soundOn ? .5 : 0;
    const comp = actx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3;
    master.connect(comp); comp.connect(actx.destination);
    sfxBus = actx.createGain(); sfxBus.connect(master);
    musBus = actx.createGain(); musBus.gain.value = .64; /* 音樂軌音量 ×0.64（2026-11-24 兩次各調降 20%） */ musBus.connect(master);
  };
  setTimeout(() => startDawn(), 800);
  setInterval(() => { if (!show.on) startDawn(); }, 4000);
  window.sceneMusic = {
    playing: false,
    start(c) {
      if (this.playing) return; this.playing = true; userGesture = true; soundOn = true;
      if (c && c !== actx) useCtx(c); else ensureAudio();
      if (!actx) return;
      const go = () => { if (show.on === 'dawn' && show.t < 3 && audioOK()) { dawnSong(actx.currentTime + .05); duckSfx(23); } };
      if (actx.state === 'running') go(); else actx.resume().then(go).catch(() => {});
    },
    stop() { this.playing = false; userGesture = false; if (musNode) { try { musNode.disconnect(); } catch (e) {} musNode = null; } if (master) master.gain.setValueAtTime(0, actx.currentTime); soundOn = false; },
    duck() {}
  };
}
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on || null,
  btn: { dawn: 'btnDawn', night: 'btnNightT' },
  save: () => ({ t: T.t, auto: T.auto }),
  stop: () => {
    flyMacaws.forEach(m => m.el.remove()); flyMacaws.length = 0;   // 鸚鵡群收走
    endShow(); mistBoost = 0; rayBoost = 0; setCine(0);
  },
  restore: s => { T.t = s.t; T.auto = s.auto; T.target = null; syncAuto(); applyTime(true); }
});
/* /ShowStop */
})();
