/* =========================================================
   SC-70 克羅埃西亞十六湖的翡翠瀑布｜剪紙層疊
   地點：克羅埃西亞普利特維采湖群國家公園（Plitvička jezera，俗稱「十六湖」），
         站在下湖區的木棧道上，往上游一層一層的湖泊看。
   真實元素：16 座湖泊由石灰華（travertine／鈣華）堤壩一階一階隔開，湖水是翡翠綠到土耳其藍；
            堤壩上長滿青苔與樹，湖水從堤壩的缺口流下來，形成數不清的小瀑布；
            左邊石灰岩峽谷的大瀑布（Veliki slap，約 78 公尺，克羅埃西亞最高的瀑布）；
            貼著水面、沒有欄杆的原木棧道（一片片橫鋪的木板）；最大的湖（Kozjak）上
            安靜無聲的電動渡船、可租的手划木船、湖邊的全景小火車與旅館；
            水清到看得見湖底的石灰華枯木、水草與鱒魚；綠頭鴨、灰鷺、在急流裡潛水的河烏、
            湖邊的狍子，森林裡偶爾出現的棕熊；山毛櫸、冷杉與雲杉混合林；
            四季差很多：春天水量最大、夏天翠綠、秋天山毛櫸變成橘紅金黃、冬天瀑布結冰。
   風格重點：剪紙層疊——遠山、湖岸森林、每一層湖與堤壩、峽谷岩壁、前景木棧道
            各是一張張彩色紙板，紙板邊緣有手剪的不規則感，底下墊一層深色投影紙；
            越遠的紙越淡越藍；瀑布是一條條白紙條往下流；全畫面疊一層紙纖維紋理，
            滑鼠移動時各層紙板產生視差。
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），部分另有 --k-名稱（晨昏）。
   JS 會依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）。
   --sz-季節-名稱 是四季的樹葉、草地顏色，JS 依季節混色後輸出 --leaf1/2/3、--grass。
   ========================================================= */

  /* 表演氛圍（取代寬銀幕黑邊）：四周暗角與中央微亮的顏色 */
  --cine-shade:#000000; --cine-light:#fff1d6;
  color-scheme: dark;

  /* —— 天空、霧、雲 —— */
  --d-sky-top:#5f9bd6;  --k-sky-top:#4a4a86;  --n-sky-top:#050912;
  --d-sky-mid:#9ccbea;  --k-sky-mid:#d89aa4;  --n-sky-mid:#0c1830;
  --d-sky-low:#e2f2f0;  --k-sky-low:#ffcf9a;  --n-sky-low:#1a2a48;

  --d-cloud:#ffffff;    --k-cloud:#ffd8bc;    --n-cloud:#2c3854;
  --d-cloud-dk:#b4c4d0; --k-cloud-dk:#957388; --n-cloud-dk:#141c2e;
  --d-overcast:#8e9aa2; --k-overcast:#70686e; --n-overcast:#0a1018;

  --d-light:#ffffff;    --k-light:#ffcfa8;    --n-light:#34425e;

  --d-hill-far:#a6c4c8; --k-hill-far:#b89eb2;  --n-hill-far:#18243a;

  /* —— 船、小火車、湖畔旅館 —— */
  --d-boat-white:#f4f6f2;--k-boat-white:#ffe2cc;--n-boat-white:#3a4256;
  --d-boat-shade:#c0cac8;--k-boat-shade:#b8a0a0;--n-boat-shade:#20263a;
  --d-boat-stripe:#2a7a8a;--k-boat-stripe:#3a5a6a;--n-boat-stripe:#0a1820;
  --d-row:#9a5e34;      --k-row:#8a5034;      --n-row:#1e120a;

  /* —— 動物 —— */
  --d-duck-grey:#c8c2b6; --k-duck-grey:#d2b4a6; --n-duck-grey:#2c2e34;

  --d-skin:#e8bc96;     --k-skin:#e8a888;     --n-skin:#3a2c26;

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:6px;overflow:hidden;background:#000;line-height:0;box-shadow:0 18px 50px rgba(0,0,0,.55)}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:6px;padding:10px 14px}
.panel button{font:700 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:4px;padding:9px 14px;cursor:pointer;letter-spacing:.04em}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:#06201c}
.panel button.big{border-color:var(--ui-hot);color:#16120c;background:var(--ui-hot)}
.panel button.big2{border-color:var(--ui-hot2);color:#200c04;background:var(--ui-hot2)}
.panel button:disabled{opacity:.45;cursor:default}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid #dff4ff;outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(220px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding:0;list-style:none;color:var(--page-muted);font-size:14px;line-height:1.8;display:flex;flex-wrap:wrap;gap:4px 22px}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .shd{fill:#062420;opacity:.26}
#scene .cano{opacity:var(--bare,1)}
#scene .snowy{opacity:var(--wv,0)}
#scene .icy{opacity:var(--wv,0)}
#scene .blos{opacity:var(--spr,0)}
#scene .flow{fill:none;stroke:var(--fallc);stroke-linecap:round}
#scene .flow2{fill:none;stroke:var(--water-hi);stroke-linecap:round;opacity:.55}
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>

/* =========================================================

<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 舞台。圖層由遠到近：
       天空（色帶、星星、月亮、太陽、雲、飛鳥）→ 遠山兩層
       → 湖岸森林（湖畔旅館、全景小火車、棕熊）→ 上湖（電動渡船、手划船、碼頭）
       → 第一道石灰華堤壩＋瀑布群（狍子）→ 中湖（木棧道 A、遊客、綠頭鴨）
       → 第二道堤壩＋瀑布群（河烏）→ 下湖（湖底枯木、水草、鱒魚、木棧道 B、灰鷺）
       → 左側石灰岩峽谷＋大瀑布、水霧、彩虹 → 前景（最近的木棧道、遊客、山毛櫸、蘆葦、蜻蜓、螢火蟲）

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);
      }
      return _conn.call(this, dest, ...a);
    };
  }
  function stopAudio() {
    let longs = [], ctx = null;
    for (const s of srcs) {
      const c = s.context, now = c.currentTime, m = s.__ss; ctx = c;
      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }
    if (longs.length && ctx) {
      const g = outs.get(ctx), now = ctx.currentTime;
      if (g) {
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 1.1); g.gain.setValueAtTime(0, now + 1.2);
        g.gain.linearRampToValueAtTime(1, now + 1.9);
      }
      longs.forEach(s => { try { s.stop(now + 1.15); } catch (e) {} srcs.delete(s); });
    }
    srcs.clear();
  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');
    // 凍結色票：把目前的 CSS 變數抄到殘影上，底下換色不影響殘影
    const cs = getComputedStyle(svg);
    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }
      }
    }
    const par = svg.parentElement;
    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });
    added = [];
  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>
/* ---- 表演氛圍（取代寬銀幕黑邊）：k = 0~1，四周輕微暗角＋中央微亮；fx/fy 可讓亮處偏向表演焦點 ---- */
let cineK = 0, cineW = 0;

/* ---- 石灰華堤壩：長著青苔與樹的小島之間，湖水從缺口流下來 ---- */
function barrier(L, foamParent, lipF, bot, list, ts) {
  const segs = []; let prev = 380;
  list.forEach(([x, w]) => { segs.push([prev, x - w / 2]); prev = x + w / 2; }); segs.push([prev, 1660]);
  const pts = [], humps = [];
  segs.forEach(([a, b], i) => {

    for (let k = 0; k <= n; k++) { const t = k / n, x = lerp(a, b, t); const p = [x, lipF(x) - Math.pow(Math.sin(t * Math.PI), wide ? .35 : .55) * h + (k && k < n ? srand(-1.4, 1.4) : 0)]; pts.push(p); hp.push(p); }
    humps.push(hp);

  cut(L, P(pts.concat([[1660, bot + 4], [380, bot + 4]])), 'f-tufa', { sh: 4 });
  // 青苔、草（冬天＝雪）
  humps.forEach(hp => {
    const a = hp[0][0], b = hp[hp.length - 1][0];

    const low = []; for (let k = 6; k >= 0; k--) { const x = lerp(a, b, k / 6), lp = lipF(x); low.push([x, lp + (bot - lp) * srand(.25, .55)]); }

    poly(L, top.concat(low.map(([x, y]) => [x, lerp(lipF(x) - 4, y, .45)])), 'f-grass', { opacity: .9 });
    // 石灰華表面一道道往下垂的鈣化紋
    for (let k = 0; k < (b - a) / 14; k++) { const x = srand(a + 3, b - 3), lp = lipF(x); el('path', { d: `M${f1(x)} ${f1(lp + 2)}q1.5 ${f1((bot - lp) * .3)} 0 ${f1((bot - lp) * .6)}`, class: 's-rock2', 'stroke-width': 1.2, opacity: .7 }, L); }
  });

  humps.forEach(hp => {
    const a = hp[0][0], b = hp[hp.length - 1][0], f = profile(hp), wide = b - a > 120;
    const rows = wide ? [[0, 1.5], [7, 1.15]] : [[0, 1]];
    rows.forEach(([dy, hs], r) => {
      const n = Math.max(1, Math.floor((b - a) / (ts * (wide ? .5 : .62))));
      for (let k = 0; k < n; k++) {
        const x = lerp(a + 5, b - 5, n === 1 ? .5 : (k + r * .5) / Math.max(1, n - 1 + r)) + srand(-3, 3), y = f(x) + srand(3, 6) + dy, h = ts * srand(.8, 1.3) * hs;

      }
    });
  });
  return list.map(([x, w]) => makeCascade(L, foamParent, x, lipF(x) - 1, bot + 1, w));
}

/* ---- 遊客 ---- */
function updatePeople(dt, adt) {

        p.wave = Math.max(0, p.wave - dt); p.photo = Math.max(0, p.photo - dt); p.stop = Math.max(0, p.stop - dt); p.cheer = Math.max(0, p.cheer - dt);
        if (p.wait > 0) {
          p.wait -= adt;
          if (p.wait <= 0) {

            else { p.dir = -p.dir; W.lanes[p.dir > 0 ? 0 : 1].appendChild(p.g); p.hidden = false; }
          }
          p.g.setAttribute('opacity', 0);
          return;
        }
        let v = p.v;

        const lead = lane[i - 1];
        if (lead && lead.wait <= 0) { const gap = (lead.x - p.x) * dir; if (gap < 30 * W.s) v = 0; else if (gap < 46 * W.s) v = Math.min(v, lead.v * .9); }

        if ((dir > 0 && p.x > W.x1) || (dir < 0 && p.x < W.x0)) { p.wait = rand(1, 5); p.hidden = true; }
        const sw = v > 0 ? Math.sin(p.ph) * 26 : 0;
        p.legs[0].setAttribute('transform', `translate(-3.4 -25) rotate(${f1(sw)})`);
        p.legs[1].setAttribute('transform', `translate(3.4 -25) rotate(${f1(-sw)})`);
        const armA = p.cheer > 0 ? -160 + Math.sin(time * 12) * 18 : p.wave > 0 ? -150 + Math.sin(time * 14) * 22 : p.photo > 0 ? -90 : -sw * .8;
        p.arm.setAttribute('transform', `translate(3 -48) rotate(${f1(armA)})`);

function updateAnimals(dt, adt) {

      D.x += adt * D.dir * v;
      const B = D.bounds;
      const block = ducks.some(o => o !== D && o.bounds === B && Math.abs(o.y - D.y) < 10 && (o.x - D.x) * D.dir > 0 && (o.x - D.x) * D.dir < 34 * D.s);
      if ((D.dir > 0 && D.x > B.x1) || (D.dir < 0 && D.x < B.x0) || block) D.turnK = .001;
    }
    const dipA = D.dip > 0 ? Math.sin(Math.min(1, (1.8 - D.dip) / .3) * Math.PI / 2) * (D.dip > .3 ? 1 : D.dip / .3) * 70 : 0;
    D.b.setAttribute('transform', `rotate(${f1(dipA)} 0 0)`);
    const ts = D.turnK > 0 ? Math.cos(D.turnK * Math.PI) : 1;
    D.g.setAttribute('transform', `translate(${f1(D.x)} ${f1(D.y + Math.sin(time * 2 + D.ph) * .8)}) scale(${f1(D.dir * D.s * ts)} ${f1(D.s)})`);
  });
  // 鱒魚：水裡來回游，尾巴擺動
  fishes.forEach(F => {
    F.lure = Math.max(0, (F.lure || 0) - dt);
    if (F.jump > 0) { F.jump -= dt; if (F.jump <= 0) F.g.setAttribute('opacity', .6); return; }
    const v = F.v * (F.lure > 0 && Math.abs(F.lx - F.x) > 20 ? 2 : 1);
    F.x += adt * F.dir * v;
    if (F.x > 1480 && F.dir > 0 || F.x < 470 && F.dir < 0) F.dir = -F.dir;
    if (F.lure > 0 && Math.abs(F.lx - F.x) < 20) F.lure = 0;
    F.tail.setAttribute('transform', `scale(1 ${f1(1 + Math.sin(time * 9 + F.ph) * .25)})`);
    F.g.setAttribute('transform', `translate(${f1(F.x)} ${f1(F.y + Math.sin(time * .8 + F.ph) * 3)}) scale(${f1(F.dir * F.s)} ${f1(F.s)}) rotate(${f1(Math.sin(time * 4 + F.ph) * 3)})`);
  });
  for (let i = jumper.list.length - 1; i >= 0; i--) {
    const J = jumper.list[i]; J.t += dt;
    const k = J.t / 1.1;
    if (k >= 1) { jumper.list.splice(i, 1); jumper.g.setAttribute('opacity', 0); ripple(J.x + J.dir * 40, J.y, 5, 1.6); spray(lakes.low.fx, J.x + J.dir * 40, J.y, 10, { speed: 80, w: 6, r: 1.6 }); continue; }
    if (J.t - dt <= 0) { ripple(J.x, J.y, 5, 1.6); spray(lakes.low.fx, J.x, J.y, 10, { speed: 90, w: 6, r: 1.6 }); }
    const x = J.x + J.dir * 40 * k, y = J.y - Math.sin(k * Math.PI) * 46;
    const ang = -Math.cos(k * Math.PI) * 50;
    jumper.g.setAttribute('opacity', 1);
    jumper.g.setAttribute('transform', `translate(${f1(x)} ${f1(y)}) scale(${f1(J.dir * J.s)} ${f1(J.s)}) rotate(${f1(-ang)})`);
  }
  // 灰鷺
  const H = heron;
  if (H.state === 'stand') {
    H.preen -= adt;
    const look = H.preen < 0 ? Math.sin(Math.min(1, -H.preen) * Math.PI) * 12 : 0;
    if (H.preen < -1) H.preen = rand(4, 9);
    H.neck.setAttribute('transform', `rotate(${f1(look)} -8 -38)`);
    H.st.setAttribute('opacity', 1); H.fl.setAttribute('opacity', 0);
    H.g.setAttribute('transform', `translate(${f1(H.hx)} ${f1(H.hy)}) scale(${H.s})`);
  } else {
    H.t += adt;
    H.st.setAttribute('opacity', 0); H.fl.setAttribute('opacity', 1);
    let x, y, dir;
    if (H.t < 7) { const k = H.t / 7; x = lerp(H.hx, 1760, k); y = H.hy - Math.sin(k * Math.PI * .5) * 260; dir = 1; }
    else if (H.t < 16) { x = 1800; y = -100; dir = -1; }
    else { const k = clamp((H.t - 16) / 6, 0, 1); x = lerp(1760, H.hx, ease(k)); y = lerp(H.hy - 260, H.hy, ease(k)); dir = -1; if (k >= 1) { H.state = 'stand'; } }
    const fl = Math.sin(time * 7);
    H.wing.setAttribute('transform', `scale(1 ${f1(fl)})`); H.wing2.setAttribute('transform', `scale(1 ${f1(fl * .8)})`);
    // 飛行姿的頭在 -x：往右飛要翻過來
    H.g.setAttribute('transform', `translate(${f1(x)} ${f1(y - 20)}) scale(${f1(-dir * H.s)} ${H.s})`);
  }
  // 河烏：每隔一下就屈膝點頭；潛水時消失再冒出來
  const Dp = dipper;
  Dp.bob -= adt; if (Dp.bob < -.35) Dp.bob = rand(.8, 2.2);
  Dp.dive = Math.max(0, Dp.dive - dt);
  const sq = Dp.bob < 0 ? Math.sin(-Dp.bob / .35 * Math.PI) * 2.4 : 0;
  if (Dp.dive > 0) {
    const k = 1 - Dp.dive / 2.2;
    const inW = k > .2 && k < .8;
    if (Math.abs(k - .2) < dt / 2.2 * 1.5 || Math.abs(k - .8) < dt / 2.2 * 1.5) spray(lakes.low.fx, Dp.x + 6, Dp.y + 12, 6, { speed: 50, w: 3, r: 1.2 });
    Dp.g.setAttribute('opacity', inW ? 0 : 1);
    Dp.g.setAttribute('transform', `translate(${f1(Dp.x + (k > .5 ? 0 : k * 20))} ${f1(Dp.y + (k < .2 ? k * 40 : 0))}) scale(${Dp.s})`);
  } else {
    Dp.g.setAttribute('opacity', 1);
    Dp.g.setAttribute('transform', `translate(${f1(Dp.x)} ${f1(Dp.y + sq)}) scale(${Dp.s} ${f1(Dp.s * (1 - sq * .04))})`);
  }
  // 狍子
  const Dr = deer;
  const dayish = 1 - smooth(.7, .95, night);
  if (Dr.state === 'graze') {
    Dr.ph += adt;
    const down = (Math.sin(Dr.ph * .7) > .2) ? 1 : 0;
    Dr.head.setAttribute('transform', down ? 'rotate(48 12 -24)' : 'rotate(0)');
    Dr.g.setAttribute('opacity', f1(dayish));
    Dr.g.setAttribute('transform', `translate(${f1(Dr.hx)} ${f1(Dr.hy)}) scale(${Dr.s})`);
  } else {
    Dr.t += adt;
    if (Dr.t < 1.6) { const k = Dr.t / 1.6; const x = lerp(Dr.hx, Dr.hx - 110, k), y = Dr.hy - Math.abs(Math.sin(k * Math.PI * 2)) * 14; Dr.head.setAttribute('transform', 'rotate(-8 12 -24)'); Dr.legs.forEach((L, i) => L.setAttribute('transform', `rotate(${f1((i < 2 ? -1 : 1) * 25 * Math.sin(k * Math.PI * 4))} ${i < 2 ? -8 : 10} -14)`)); Dr.g.setAttribute('transform', `translate(${f1(x)} ${f1(y)}) scale(${-Dr.s} ${Dr.s})`); Dr.g.setAttribute('opacity', f1(1 - smooth(.6, 1, k))); }
    else if (Dr.t > 22) { Dr.state = 'graze'; Dr.legs.forEach(L => L.removeAttribute('transform')); Dr.g.setAttribute('opacity', 0); }
  }
  // 棕熊：黃昏與夜晚比較容易出現
  const Br = bear;
  Br.timer -= adt;
  if (Br.timer <= 0) { Br.timer = rand(30, 60); Br.want = (night > .3 || dusk > .4) ? Math.random() < .8 : Math.random() < .25; }
  Br.vis = lerp(Br.vis, Br.want ? 1 : 0, Math.min(1, dt * .8));
  Br.stand = Math.max(0, Br.stand - dt);
  if (Br.vis > .02) {
    if (Br.stand <= 0) { Br.x += adt * Br.dir * 6; if (Br.x > 780 && Br.dir > 0 || Br.x < 560 && Br.dir < 0) Br.dir = -Br.dir; }
    const st = Br.stand > 0 ? Math.sin(Math.min(1, (2.4 - Br.stand) / .4, Br.stand / .4) * Math.PI / 2) : 0;
    Br.b.setAttribute('transform', `rotate(${f1(-st * 62)} -18 0)`);
    Br.g.setAttribute('opacity', f1(Br.vis));
    Br.g.setAttribute('transform', `translate(${f1(Br.x)} ${f1(Br.y)}) scale(${f1(Br.dir * Br.s)} ${Br.s})`);
  } else Br.g.setAttribute('opacity', 0);
  // 燕子
  if (!flock.on) { flock.t -= adt; if (flock.t <= 0 && night < .4 && wx.rain < .5) startFlock(Math.random() < .5 ? 1 : -1); birds.forEach(b => b.n.setAttribute('opacity', 0)); }
  else {
    flock.focus = Math.max(0, flock.focus - dt);
    if (flock.focus > 0 && flock.cx != null) { const dx = flock.cx - flock.x; flock.x += adt * clamp(dx, -140, 140) * .8; flock.y = lerp(flock.y, flock.cy, Math.min(1, dt * 1.2)); if (Math.abs(dx) > 4) flock.dir = dx > 0 ? 1 : -1; }
    else { flock.x += adt * flock.dir * 90; flock.y += Math.sin(time * .7) * adt * 10; }
    if (flock.x < -260 || flock.x > 1860) { flock.on = false; flock.t = rand(15, 30); }
    birds.forEach((b, i) => {
      const x = flock.x - flock.dir * b.ox + Math.sin(time * 2 + b.ph) * 8, y = flock.y + b.oy + Math.sin(time * 3 + b.ph) * 5;
      b.n.setAttribute('opacity', f1(1 - smooth(.4, .7, night)));
      b.n.setAttribute('transform', `translate(${f1(x)} ${f1(y)}) scale(${f1(flock.dir * .9)} ${f1(.6 + .4 * Math.abs(Math.sin(time * 9 + b.ph)))})`);
    });
  }
}

/* ---- 落葉、花瓣：飄落，掉到湖面就漂一下再消失 ---- */
function updateParts(dt, adt, au, sp) {
  if (!reduced && !show.on) {
    if (Math.random() < dt * au * 2.2 * (1 + wx.wind * 2)) spawnPart(rand(-60, 1660), rand(-20, 120), 'leaf', { vx: rand(-8, 20) + wx.wind * 30 });
    if (Math.random() < dt * sp * .9) spawnPart(rand(-60, 1660), rand(-20, 140), 'petal', { vx: rand(-8, 20) });
  }
  parts.forEach(q => {
    if (!q.on) return;
    q.life += adt;
    if (q.float > 0) { q.float -= adt; q.x += adt * 6; if (q.float <= 0) { q.on = false; q.n.setAttribute('opacity', 0); return; } q.n.setAttribute('opacity', f1(Math.min(1, q.float))); q.n.setAttribute('transform', `translate(${f1(q.x)} ${f1(q.y)}) rotate(${f1(q.rot)}) scale(1 .5)`); return; }
    q.y += adt * q.vy; q.x += adt * (q.vx + Math.sin(time * 2 + q.ph) * 14); q.rot += adt * q.vr;
    if (q.y > q.land) { const inW = q.land > UP_TOP + 4 && (q.land < B1_LIP - 6 || (q.land > MID_TOP && q.land < B2_LIP - 14) || q.land > LOW_TOP); if (inW && q.kind !== 'snow') { q.float = rand(3, 6); ripple(q.x, q.y, 2, 1); } else { q.on = false; q.n.setAttribute('opacity', 0); return; } }
    q.n.setAttribute('opacity', 1);
    q.n.setAttribute('transform', `translate(${f1(q.x)} ${f1(q.y)}) rotate(${f1(q.rot)}) scale(${f1(.6 + .5 * Math.abs(Math.sin(q.life * 3 + q.ph)))} 1)`);
  });
}

/* ---------------- 初始化 ---------------- */
function init() {
  drawSky(); drawClouds(); makeBirds();
  drawFar();
  drawHill(); makeTrain(); makeBear();
  // 上湖（Kozjak 那一類的大湖）：碼頭、渡船、手划船
  const up = drawLake(LY.Lup, 'up', UP_TOP, 'f-water-up', { glintH: 40, nGlint: 30, hitH: 48, label: '上湖：點一下起漣漪' });
  upGlow = el('path', { d: `M-60 ${UP_TOP}L1660 ${UP_TOP}L1660 ${B1_LIP}L-60 ${B1_LIP}Z`, fill: '#fff', opacity: 0, class: 'noHit' }, LY.Lup);
  [[1440, 'R'], [912, 'L']].forEach(([x]) => {
    const g = el('g', {}, LY.Lup);
    cut(g, `M${x} ${UP_TOP - 1}L${x + 16} ${UP_TOP - 1}L${x + 20} ${UP_TOP + 22}L${x - 2} ${UP_TOP + 22}Z`, 'f-wood-lt', { sh: 2 });
    for (let k = 0; k < 4; k++) el('path', { d: `M${x - 2 + k * .6} ${UP_TOP + 22}h2.4v6h-2.4ZM${x + 18 - k * .2} ${UP_TOP + 22}h2.4v6h-2.4Z`, class: 'f-wood-dk' }, g);
    el('path', { d: `M${x + 3} ${UP_TOP + 4}h${x > 1000 ? 12 : 10}v14h-12Z`, class: 'snowy f-snowc' }, g);
    const lamp = el('g', {}, g); el('path', { d: `M${x + 18} ${UP_TOP + 20}v-16`, class: 's-wood-dk', 'stroke-width': 1.4 }, lamp);
  });
  makeRowboat(LY.Lup); makeEBoat(LY.Lup);
  // 第一道堤壩
  C1 = barrier(LY.Lbar1, null, x => B1_LIP - 2 + 6 * Math.sin(x * .009 + 1) + 3 * Math.sin(x * .023), MID_TOP, [[505, 14], [556, 34], [612, 16], [694, 58], [800, 22], [838, 16], [962, 64], [1080, 20], [1120, 28], [1238, 54], [1332, 18], [1374, 30], [1472, 60], [1582, 24]], 24);
  // 中湖
  const mid = drawLake(LY.Lmid, 'mid', MID_TOP, 'f-water-mid', { glintH: 64, nGlint: 34, hitH: 80, label: '中湖：點一下起漣漪' });
  C1.forEach(C => { C.foam.forEach(f => mid.fx.parentNode.insertBefore(f.n, mid.fx)); });
  makeDeer(LY.Lbar1, 470, B1_LIP - 8);
  boardwalk(LY.Lmid, 600, 1220, 346, 6, 3, 2.4);
  const wA = makeWalk(LY.Lmid, { x0: 628, x1: 1190, y: 348, dy: 3, s: .3, v: 9, n: 6 });
  // 棧道兩端的小島（遮住走進走出的遊客）
  [[600, 350], [1215, 350]].forEach(([x, y]) => {
    cut(LY.Lmid, blobD([[x, y + 4, 20], [x + 16, y + 6, 14], [x - 16, y + 6, 14]]), 'f-tufa', { sh: 2 });
    el('path', { d: blobD([[x, y + 1, 18], [x + 15, y + 3, 12], [x - 15, y + 3, 12]]), class: 'f-grass' }, LY.Lmid);
    decid(LY.Lmid, x - 8, y + 6, 30); decid(LY.Lmid, x + 10, y + 8, 26, { bloom: true }); conifer(LY.Lmid, x + 2, y + 10, 30, 'f-conifer2');
  });
  [[700, 378, 1], [760, 384, 0], [1300, 380, 1], [1380, 372, 0]].forEach(([x, y, m], i) => makeDuck(LY.Lmid, !!m, x, y, .5, { x0: i < 2 ? 520 : 1250, x1: i < 2 ? 1150 : 1560, lake: mid }));
  // 第二道堤壩＋河烏
  C2 = barrier(LY.Lbar2, null, x => B2_LIP - 4 + 9 * Math.sin(x * .007 + 2) + 4 * Math.sin(x * .02 + 1), LOW_TOP, [[478, 22], [540, 44], [600, 18], [668, 70], [930, 30], [972, 20], [1018, 58], [1122, 26], [1300, 84], [1418, 22], [1468, 30], [1560, 56]], 36);
  // 下湖：湖底的石灰華枯木、石頭、水草，鱒魚在水裡游
  const low = drawLake(LY.Llow, 'low', LOW_TOP, 'f-water-low', { deep: 520, glintH: 110, nGlint: 40, hitH: 120, label: '下湖：點一下起漣漪，鱒魚會游過來' });
  C2.forEach(C => { C.foam.forEach(f => low.fx.parentNode.insertBefore(f.n, low.fx)); });
  const bed = low.extra;
  for (let i = 0; i < 7; i++) { const x = srand(480, 1500), y = srand(500, 590), L = srand(60, 140), a = srand(-.25, .25); el('path', { d: `M${f1(x)} ${f1(y)}l${f1(L * Math.cos(a))} ${f1(L * Math.sin(a))}`, class: 's-water-bed', 'stroke-width': f1(srand(5, 9)), 'stroke-linecap': 'round', opacity: .32 }, bed); }
  for (let i = 0; i < 14; i++) { const x = srand(460, 1560), y = srand(470, 600); el('path', { d: blobD([[x, y, srand(6, 14)]]), class: 'f-water-bed', opacity: .2, transform: `translate(0 ${f1(y * .55)}) scale(1 .45)` }, bed); }
  const weeds = [];
  for (let i = 0; i < 16; i++) { const x = srand(470, 1560), y = srand(520, 600), h = srand(16, 34); weeds.push(el('path', { d: `M${f1(x)} ${f1(y)}q-4 ${f1(-h / 2)} 0 ${f1(-h)}q4 ${f1(h / 2)} 2 ${f1(h)}Z`, class: 'f-moss', opacity: .45 }, bed)); }
  for (let i = 0; i < 7; i++) makeFish(bed, srand(500, 1450), 494 + i * 14 + srand(-3, 3), srand(.6, .8));
  jumper = makeJumper(low.fx);
  // 灰鷺站的石灰華礁石、右端的小島（遮住走出去的遊客）
  cut(LY.Llow, blobD([[1330, 486, 34], [1300, 490, 24], [1360, 490, 26], [1395, 492, 18]]), 'f-tufa', { sh: 3 });
  el('path', { d: blobD([[1320, 480, 30], [1290, 486, 20], [1356, 484, 22]]), class: 'f-grass' }, LY.Llow);
  makeDipper(LY.Lbar2, 1018 - 40, B2_LIP + 6);
  boardwalk(LY.Llow, 430, 1300, 476, 10, 5, 3.4);
  const wB = makeWalk(LY.Llow, { x0: 470, x1: 1286, y: 479, dy: 5, s: .48, v: 13, n: 8 });
  decid(LY.Llow, 1300, 486, 58); conifer(LY.Llow, 1334, 490, 66, 'f-conifer'); decid(LY.Llow, 1356, 492, 50, { bloom: true });
  makeHeron(LY.Llow, 1390, 486);
  cut(LY.Llow, blobD([[452, 484, 26], [430, 490, 20], [476, 492, 16]]), 'f-rock2', { sh: 3 });
  el('path', { d: blobD([[450, 476, 20], [432, 482, 14]]), class: 'f-grass' }, LY.Llow);
  decid(LY.Llow, 450, 486, 46);
  [[620, 456, 1], [680, 462, 0], [1000, 452, 1], [880, 520, 0], [940, 526, 1], [1180, 516, 0]].forEach(([x, y, m], i) => makeDuck(LY.Llow, !!m, x, y, .7, { x0: i < 3 ? 520 : 560, x1: i < 3 ? 1240 : 1400, lake: low }));
  // 峽谷與大瀑布
  drawCliff();
  // 前景
  drawFore();
  const wC = makeWalk(LY.Lfore, { x0: -60, x1: 1660, y: 553, dy: 9, s: .82, v: 26, n: 7, ranger: true });
  // 前景的人走在山毛櫸樹幹後面
  LY.Lfore.appendChild(foreTree);
  makeInsects();
  drawWeather();
  initParts();
  bindAll();
  if (reduced) { T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false'); }
  setWeather(0);
  setSeason(1);
  seasonVars();
  applyColors(true);
  step(1 / 60);
  requestAnimationFrame(loop);
  // 網站「作者精選」播放區（純插畫版放在 iframe 裡）：預設輪播瀑布接力；不會自己出聲。
  const inPicks = (() => { let top = true; try { top = window.top === window; } catch (e) { top = false; } return !!document.getElementById('pure-art') && !top; })();
  if (inPicks) {
    setTimeout(() => startShow('relay', true), 800);
    setInterval(() => { if (!show.on) startShow('relay', true); }, 8000);
    window.sceneMusic = {
      playing: false,
      start(c) {
        if (this.playing) return; this.playing = true; pickAudio = true; userGesture = true;
        if (c && c !== actx) useCtx(c); else ensureAudio();
        if (actx && actx.state !== 'running') actx.resume();
        if (show.on && show.t < 4) playRelayMusic();
      },
      stop() { this.playing = false; pickAudio = false; stopAll(); },
      duck() {}
    };
  }
}
init();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on && show.kind,
  btn: { relay: 'btnRelay', seasons: 'btnSeasons' },
  ff: () => { show.flags = new Proxy({}, { get: () => 1 }); show.t = show.dur - .02; },   // 跳到結尾：季節、天氣自動恢復
  save: () => ({ t: T.t, auto: T.auto, w: wxIdx }),
  stop: () => endShow(),
  restore: s => { if (wxIdx !== s.w) setWeather(s.w); T.t = s.t; T.auto = s.auto; $('btnAuto') && $('btnAuto').setAttribute('aria-pressed', String(T.auto)); applyColors(true); }
});
/* /ShowStop */
})();
</script>
