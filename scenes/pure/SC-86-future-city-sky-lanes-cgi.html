<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>未來城市的空中航道</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-86 未來城市的空中航道｜CGI 電影質感
   地點：原創的未來都市（不是任何真實城市，也不用任何品牌或既有作品的元素）。
   視角：站在一座高樓的空中觀景平台上，望向整片懸在雲層上方的城市。
         遠景：一層層淡藍色的高樓剪影、遠方直通天際的軌道電梯（升降艙慢慢往上爬）。
         中景：主角「天穹塔」——扭轉向上的玻璃高塔，有四層環形空中花園、頂端的光環與投影器；
               垂直森林塔（整面植栽與空中瀑布）、以空中花園橋相連的雙子塔、
               圓頂塔、屋頂有飛車停機坪的塔、屋頂有垂直風力發電機的高塔；
               三層空中航道：遠、中、近三層，每層兩個方向，飛車排隊行駛、互相保持距離；
               兩條懸浮列車軌道與一座玻璃空中車站；全息投影鯨魚在高樓間游動。
         近景：左右兩棟很近的大樓（左邊投影出全息廣告）。
         前景：觀景平台——玻璃欄杆、望遠鏡、無人機收件櫃、親子、拍照的情侶、
               機器人飲料攤、長椅上看書的人、散步的人和機器狗、送貨無人機。
   風格重點：CGI 動畫電影的寬銀幕畫面——玻璃帷幕的高光與反射、大氣透視（越遠越淡越藍）、
            柔和的體積光與光暈（一律用放射漸層，不對大圖層做模糊）、暗角、底片顆粒、
            滑鼠移動帶動多層視差；表演時上下出現寬銀幕黑邊、鏡頭緩緩推近。
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），JS 依時間內插，輸出成 --名稱。
   其餘色票不隨時間變化，直接使用。
   ========================================================= */
:root{
  color-scheme: dark;

  /* —— 天空、雲、霧 —— */
  --d-sky-top:#3a86d4;  --n-sky-top:#050a1c;
  --d-sky-mid:#86bfea;  --n-sky-mid:#0d1838;
  --d-sky-hor:#e2eef6;  --n-sky-hor:#26305a;
  --d-cloud:#ffffff;    --n-cloud:#3c4670;
  --d-cloud-sh:#c2d2e4; --n-cloud-sh:#1c2446;
  --d-haze:#d4e4f0;     --n-haze:#1c2650;
  --d-fog:#f4f8fc;      --n-fog:#4a5684;
  --storm:#4c5868;          /* 雷雨時天空混入的灰 */
  --dusk:#ff9a5a; --dusk2:#ff6a8a;
  --sun:#fff6d8; --sun-glow:#ffd890; --moon:#f2f0e4; --star:#ffffff;

  /* —— 大樓：玻璃帷幕、金屬、遠景剪影 —— */
  --d-far:#a2bcd2;      --n-far:#1a2448;
  --d-far-hi:#c8dae8;   --n-far-hi:#26325e;
  --d-glass-a:#5a8cb6;  --n-glass-a:#132040;
  --d-glass-b:#b4daf2;  --n-glass-b:#2a3c68;
  --d-glass-c:#2a5276;  --n-glass-c:#0a1026;
  --d-near-a:#36597a;   --n-near-a:#0c1530;
  --d-near-b:#7aa6c8;   --n-near-b:#1e2c52;
  --d-metal:#e2e8ee;    --n-metal:#5c6680;
  --d-metal-dk:#8e9cac; --n-metal-dk:#2a3250;
  --win-lit:#ffd88a; --win-cool:#a2e4ff;

  /* —— 植物、水 —— */
  --d-leaf:#4e9e48;     --n-leaf:#1e4a36;
  --d-leaf-hi:#94d468;  --n-leaf-hi:#2e6a4a;
  --d-leaf-dk:#2a6634;  --n-leaf-dk:#10301f;
  --d-water:#c4ecff;    --n-water:#6aaee0;
  --bark:#6a4a32; --flower1:#ff8ab0; --flower2:#ffd45a; --flower3:#c89aff;

  /* —— 觀景平台 —— */
  --d-deck:#dfe4e9;     --n-deck:#2a3044;
  --d-deck-dk:#aab2bc;  --n-deck-dk:#161a2a;
  --d-rail:#cfe6f4;     --n-rail:#3a5070;

  /* —— 光（不隨時間變化） —— */
  --neon-c:#3af0ff; --neon-m:#ff4ad8; --neon-g:#7aff9a; --neon-y:#ffd23a;
  --holo:#5af0ff; --holo2:#b48aff;
  --head:#fffbe8; --tail:#ff3a4a; --fan:#6ae8ff; --aviation:#ff3a30;
  --rain:#d4e6ff; --bolt:#f4f8ff; --flash:#e8f0ff;

  /* —— 飛車（原創設計） —— */
  --car-pearl:#f2f4f6; --car-red:#e2463a; --car-blue:#2f6ee0; --car-silver:#b4bec8; --car-teal:#1fb5a6; --car-plum:#8a4ad0;
  --taxi:#ffc61a; --bus:#dff4ea; --bus-band:#22a878; --cargo:#ff8a2a;
  --cab:#16283c; --cab-hi:#8fd0f0;
  --car-trim:#2a3240;

  /* —— 懸浮列車 —— */
  --train:#f4f7fa; --train-dk:#a8b4c2; --train-band:#1aa8ff; --train-glass:#1a2a3e;

  /* —— 人物、機器人（CGI 動畫的圓潤造型） —— */
  --skin1:#f2c6a4; --skin2:#c88a62; --skin3:#8a5a3a; --skin4:#f6d8c0;
  --hair1:#2a1e18; --hair2:#7a4a2a; --hair3:#e8c070; --hair4:#c4c8d0;
  --cl1:#ff7a5a; --cl2:#3a7ae0; --cl3:#f4f0e8; --cl4:#2fb08a; --cl5:#ffcf4a; --cl6:#8a5ad0; --cl7:#343a48; --cl8:#e85a8a;
  --robot:#f0f2f5; --robot-dk:#b6bec8; --robot-acc:#ff8a3a; --screen:#0e1a2a;
  --umbrella:#cfeeff;

  --cine-shade:#000000; --cine-light:#fff1d6;

  /* —— 頁面介面（電影院般的深色） —— */
  --page-bg:#070a12; --page-fg:#eaf0f8; --page-muted:#8c98aa;
  --ui-surface:#0e1420; --ui-line:#24304a; --ui-accent:#3ac8f0; --ui-hot:#ff6ad0; --ui-hot2:#3a8af0;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:6px;overflow:hidden;background:#000;line-height:0;box-shadow:0 18px 50px rgba(0,0,0,.55)}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:6px;padding:10px 14px}
.panel button{font:700 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:4px;padding:9px 14px;cursor:pointer;letter-spacing:.04em}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:#03141c}
.panel button.big{border-color:var(--ui-hot);color:#1e0418;background:var(--ui-hot)}
.panel button.big2{border-color:var(--ui-hot2);color:#fff;background:var(--ui-hot2)}
.panel button:disabled{opacity:.45;cursor:default}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid #d8fbff;outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(220px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding:0;list-style:none;color:var(--page-muted);font-size:14px;line-height:1.8;display:flex;flex-wrap:wrap;gap:4px 22px}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .bubble path{fill:rgba(6,14,30,.86);stroke:rgba(140,230,255,.55);stroke-width:1}
#scene .bubble text{fill:#eef8ff;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .sign{font:900 13px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .screen{mix-blend-mode:screen}
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>
<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。
   想恢復完整版，刪掉這整段 <style id="pure-art"> 即可。
   ========================================================= */
html,body{height:100%;margin:0!important;overflow:hidden}
body{display:flex!important;align-items:center;justify-content:center;padding:0!important}
body>.wrap{width:100%!important;max-width:min(100vw,calc(100vh * 8 / 3))!important;
  margin:0!important;padding:0!important;gap:0!important;display:block!important}
body>.wrap>:not(.stage){display:none!important}
body>.wrap>.stage{width:100%!important;max-width:100%!important;margin:0!important;
  border:0!important;border-radius:0!important;box-shadow:none!important}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 舞台。圖層由遠到近（每層的滑鼠視差不同）：
       天空（太陽、月亮、星星、雲、閃電）
       → 遠景（高樓剪影、軌道電梯、遠方的霧）→ 遠層航道（小小的飛車）
       → 中景（天穹塔與其他高樓、空中花園、停機坪、風力發電機、全息鯨魚、無人機燈光秀）
       → 中層航道（飛車）與懸浮列車、空中車站 → 雲海
       → 近景大樓（全息廣告）→ 近層航道（大大的飛車）
       → 前景觀景平台（人物、機器人、送貨無人機）
       → 雨、閃光、暗角、顆粒、說話泡泡、寬銀幕黑邊
       大部分的物件由下方 JS 產生，這裡只放骨架、漸層與圖樣。
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" role="img" aria-label="未來城市：站在高樓觀景平台上，望向懸在雲上的城市，飛車在三層空中航道穿梭，扭轉的天穹塔有四層空中花園，懸浮列車駛過玻璃車站，全息鯨魚在高樓間游動">
    <defs>
      <!-- 天空 -->
      <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-top)"/><stop offset=".55" style="stop-color:var(--sky-mid)"/><stop offset="1" style="stop-color:var(--sky-hor)"/>
      </linearGradient>
      <linearGradient id="duskG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--dusk2)" stop-opacity="0"/><stop offset=".55" style="stop-color:var(--dusk2)" stop-opacity=".35"/><stop offset="1" style="stop-color:var(--dusk)" stop-opacity=".9"/>
      </linearGradient>
      <radialGradient id="sunG"><stop offset="0" style="stop-color:var(--sun)"/><stop offset=".12" style="stop-color:var(--sun)"/><stop offset=".22" style="stop-color:var(--sun-glow)" stop-opacity=".55"/><stop offset="1" style="stop-color:var(--sun-glow)" stop-opacity="0"/></radialGradient>
      <radialGradient id="moonGlowG"><stop offset="0" style="stop-color:var(--moon)" stop-opacity=".45"/><stop offset="1" style="stop-color:var(--moon)" stop-opacity="0"/></radialGradient>
      <radialGradient id="cloudG" cx=".5" cy=".42" r=".55"><stop offset="0" style="stop-color:var(--cloud)"/><stop offset=".6" style="stop-color:var(--cloud)" stop-opacity=".92"/><stop offset="1" style="stop-color:var(--cloud-sh)" stop-opacity="0"/></radialGradient>
      <radialGradient id="cloudShG" cx=".5" cy=".5" r=".5"><stop offset="0" style="stop-color:var(--cloud-sh)" stop-opacity=".9"/><stop offset="1" style="stop-color:var(--cloud-sh)" stop-opacity="0"/></radialGradient>
      <radialGradient id="fogG" cx=".5" cy=".5" r=".5"><stop offset="0" style="stop-color:var(--fog)" stop-opacity=".95"/><stop offset=".6" style="stop-color:var(--fog)" stop-opacity=".7"/><stop offset="1" style="stop-color:var(--fog)" stop-opacity="0"/></radialGradient>
      <linearGradient id="hazeG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--haze)" stop-opacity="0"/><stop offset=".7" style="stop-color:var(--haze)" stop-opacity=".85"/><stop offset="1" style="stop-color:var(--haze)"/></linearGradient>
      <!-- 大樓材質 -->
      <linearGradient id="glassG" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" style="stop-color:var(--glass-c)"/><stop offset=".18" style="stop-color:var(--glass-b)"/><stop offset=".42" style="stop-color:var(--glass-a)"/><stop offset="1" style="stop-color:var(--glass-c)"/>
      </linearGradient>
      <linearGradient id="nearG" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" style="stop-color:var(--near-a)"/><stop offset=".55" style="stop-color:var(--near-b)"/><stop offset="1" style="stop-color:var(--near-a)"/>
      </linearGradient>
      <linearGradient id="reflG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <linearGradient id="metalG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--metal)"/><stop offset="1" style="stop-color:var(--metal-dk)"/></linearGradient>
      <linearGradient id="farTopG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--far)"/><stop offset=".35" style="stop-color:var(--far-hi)"/><stop offset="1" style="stop-color:var(--far)"/></linearGradient>
      <!-- 窗戶：白天是反光的格子；夜晚亮燈（暖黃與冷白交錯） -->
      <pattern id="winP" patternUnits="userSpaceOnUse" width="12" height="14">
        <rect x="1" y="2" width="10" height="10" style="fill:var(--glass-b)" opacity=".28"/>
      </pattern>
      <pattern id="litP" patternUnits="userSpaceOnUse" width="48" height="42">
        <rect x="1" y="2" width="10" height="10" style="fill:var(--win-lit)" opacity=".85"/><rect x="37" y="2" width="10" height="10" style="fill:var(--win-cool)" opacity=".55"/>
        <rect x="25" y="16" width="10" height="10" style="fill:var(--win-lit)" opacity=".7"/><rect x="13" y="30" width="10" height="10" style="fill:var(--win-lit)" opacity=".45"/>
        <rect x="37" y="30" width="10" height="10" style="fill:var(--win-cool)" opacity=".4"/>
      </pattern>
      <pattern id="farLitP" patternUnits="userSpaceOnUse" width="24" height="20">
        <rect x="1" y="1" width="3" height="4" style="fill:var(--win-lit)" opacity=".8"/><rect x="9" y="1" width="3" height="4" style="fill:var(--win-cool)" opacity=".5"/>
        <rect x="5" y="11" width="3" height="4" style="fill:var(--win-lit)" opacity=".6"/><rect x="17" y="6" width="3" height="4" style="fill:var(--win-lit)" opacity=".9"/>
        <rect x="13" y="15" width="3" height="4" style="fill:var(--win-cool)" opacity=".7"/>
      </pattern>
      <!-- 表演用的立面 LED：一條條彩色光帶，JS 讓它上下流動 -->

    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }

  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();

/* =========================================================

const TOWERS = [];
const hwAt = (Tw, y) => lerp(Tw.hb, Tw.ht, clamp((Tw.bot - y) / (Tw.bot - Tw.top), 0, 1));

/* ---- 主角：天穹塔（扭轉向上的玻璃塔＋四層環形空中花園＋頂端光環與投影器） ---- */

  hero.ringBack = el('ellipse', { cx: 800, cy: 66, rx: 58, ry: 9, style: S('neon-c', 2) + ';stroke-dasharray:14 8', opacity: .55 }, g);
  hero.ringGlow = el('ellipse', { cx: 800, cy: 66, rx: 70, ry: 18, fill: 'url(#glowC)', opacity: .25 }, g);
  hero.emit = el('circle', { cx: 800, cy: 40, r: 14, fill: 'url(#glowC)', opacity: .6 }, g);

  // 四層環形空中花園

  [150, 236, 322, 408].forEach((y, i) => hero.gardens.push(terrace(Tw, y, 24 - i * 2, i)));
  clickable(Tw.g, '天穹塔'); clickable(g, '天穹塔頂端');
}
function terrace(Tw, y, extra, idx) {
  const hw = hwAt(Tw, y), rx = hw + extra, x = Tw.x;
  const g = el('g', {}, LY.Lmid);
  // 後半圈的樹（在塔身後面露出來）

/* =========================================================
   ④ 表演（兩場不能同時進行，約 20 秒）
   ========================================================= */
const show = { on: false, kind: '', t: 0, dur: 22, cues: {} };
const cam = { s: 1, fx: 800, fy: 220 };
let prevAuto = true;
function startShow(kind, silent) {
  if (show.on) return;
  Object.assign(show, { on: true, kind, t: 0, silent: !!silent, dur: kind === 'drone' ? 22.6 : 21.6, cues: {} });
  prevAuto = T.auto; T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false');
  $('btnDrone').disabled = $('btnWhale').disabled = true;
  // 秀在晚上最好看：白天按下去時，天色會在兩秒內轉成夜晚
  const h = T.t * 24;
  show.h0 = h; show.dh = (h >= 19.6 || h < 4.5) ? 0 : ((21 - h) % 24 + 24) % 24;
  if (kind === 'drone') { initSwarm(); whale.opT = 0; }
  else { whale.op = 0; whale.opT = 1; }
  if (!silent) kind === 'drone' ? playDroneMusic() : playWhaleMusic();
}
function endShow() {
  show.on = false;
  $('btnDrone').disabled = $('btnWhale').disabled = false;
  swarm.forEach(d => { d.dot.setAttribute('opacity', 0); d.glow && d.glow.setAttribute('opacity', 0); }); swarm.dim.setAttribute('opacity', 0);
  TOWERS.forEach(Tw => Tw.led.setAttribute('opacity', 0));
  whale.op = 0; whale.opT = 1; whale.wt = Math.asin(clamp((whale.x - 800) / 430, -1, 1)) / .09;
  T.auto = prevAuto; $('btnAuto').setAttribute('aria-pressed', T.auto ? 'true' : 'false');
}
const cue = (name, at, fn) => { if (show.t >= at && !show.cues[name]) { show.cues[name] = 1; fn(); } };
function updateShow(dt) {
  if (!show.on) { cam.s = lerp(cam.s, 1, Math.min(1, dt * 2)); if (cineK > 0) setCine(cineK - dt * .6); return; }
  show.t += dt;
  const t = show.t, d = show.dur;
  if (show.dh) T.t = ((show.h0 + show.dh * smooth(0, 2.4, t)) % 24) / 24;
  setCine(smooth(0, 2.6, t) * (1 - smooth(d - 2.8, d, t)), cam.fx, cam.fy);   // 表演氛圍：緩緩淡入淡出（不用寬銀幕黑邊）
  // 效能：這個場景物件很多，鏡頭不做推近（整個畫面每格重新縮放會掉幀），只用輕微暗角＋燈光營造氣氛
  cam.s = 1;
  if (show.kind === 'drone') updateDroneShow(t, dt); else updateWhaleShow(t, dt);
  if (t >= d) endShow();
}

/* ---- 表演一：無人機燈光秀 ---- */
const ROOFS = [[800, 40], [990, 108], [1160, 218], [1335, 82], [340, 132], [520, 152], [658, 196]];
const FORM = [[0, 'grid'], [2.6, 'planet'], [5.6, 'car'], [9, 'whale'], [12.4, 'heart'], [15.4, 'flower'], [18, 'burst'], [19.8, 'land']];
const COLS = { grid: ['#ffffff'], planet: ['#ffb44a', '#3af0ff'], car: ['#ff4ad8', '#3af0ff'], whale: ['#5af0ff', '#b48aff'], heart: ['#ff4a6a', '#ff8ab0'], flower: ['#ffd23a', '#ff8ab0', '#7aff9a'], burst: ['#ff4a6a', '#ffd23a', '#3af0ff', '#7aff9a', '#ff4ad8', '#ffffff'] };
function samplePath(d, n, sx, ox, oy) {
  swarm.tmp.setAttribute('d', d);
  const L = swarm.tmp.getTotalLength(), out = [];
  for (let i = 0; i < n; i++) { const p = swarm.tmp.getPointAtLength(L * i / n); out.push([ox + p.x * sx, oy + p.y * sx]); }
  return out;
}
let formName = '', formBase = [];
function initSwarm() {
  swarm.forEach((d, i) => { const r = ROOFS[i % ROOFS.length]; d.sx = r[0] + rand(-14, 14); d.sy = r[1] + rand(-4, 2); d.x = d.sx; d.y = d.sy; d.ang = rand(0, 6.28); d.rr = rand(.3, 1); d.ph = rand(0, 6); });
  formName = '';
  // 事先把各個圖案取樣好
  const N = swarm.length;
  swarm.shapes = {
    grid: swarm.map((_, i) => [536 + (i % 15) * 38, 64 + Math.floor(i / 15) * 22]),
    planet: swarm.map((_, i) => {
      if (i < 46) { const a = i / 46 * 6.283; return [800 + Math.cos(a) * 72, 170 + Math.sin(a) * 72]; }
      if (i < 64) { const a = (i - 46) / 18 * 6.283; return [800 + Math.cos(a) * 38, 170 + Math.sin(a) * 38]; }
      const a = (i - 64) / (N - 64) * 6.283, x = Math.cos(a) * 200, y = Math.sin(a) * 34, c = Math.cos(-14 * RAD), s = Math.sin(-14 * RAD);
      return [800 + x * c - y * s, 170 + x * s + y * c];
    }),
    car: samplePath('M-56 4C-57 -7 -46 -13 -22 -14L22 -14C42 -14 55 -6 57 3C58 11 50 15 38 15L-46 15C-53 15 -56 11 -56 4ZM-24 -13C-16 -31 18 -32 33 -13M-48 15C-48 24 -16 24 -16 15M16 15C16 24 46 24 46 15', N, 3.4, 0, 170),
    whale: samplePath('M130 0C128 -20 100 -34 60 -36C10 -38 -50 -26 -100 -10C-112 -6 -122 -3 -130 -2L-130 4C-118 6 -104 10 -90 14C-40 26 30 32 80 26C112 22 132 14 130 0ZM-128 1C-138 -5 -154 -25 -174 -31C-168 -17 -162 -7 -150 1C-162 9 -168 19 -174 31C-154 25 -138 5 -128 1ZM62 16C40 40 10 56 -12 60C-2 48 30 30 48 12', N, 1.55, 0, 170),
    heart: swarm.map((_, i) => { const a = i / N * 6.283; return [800 + 16 * Math.pow(Math.sin(a), 3) * 7.6, 166 - (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) * 7.6]; }),
    flower: swarm.map((_, i) => { if (i < 18) { const a = i / 18 * 6.283; return [800 + Math.cos(a) * 18, 170 + Math.sin(a) * 18]; } const a = (i - 18) / (N - 18) * 6.283, r = 40 + 80 * Math.abs(Math.cos(3 * a)); return [800 + Math.cos(a) * r, 170 + Math.sin(a) * r * .9]; })
  };
}
function setForm(name) {
  formName = name;
  const C = COLS[name] || ['#ffffff'];
  swarm.forEach((d, i) => {
    let c = C[0];
    if (name === 'planet') c = i < 64 ? C[0] : C[1];
    else if (name === 'car' || name === 'whale') c = C[i % 7 === 0 ? 1 : 0];
    else if (name === 'flower') c = i < 18 ? C[2] : C[Math.floor((i - 18) / 17) % 2];
    else if (name === 'burst') c = C[i % C.length];
    else if (name === 'heart') c = C[i % 5 === 0 ? 1 : 0];
    d.col = c; d.dot.setAttribute('fill', c);
  });
  if (name === 'burst') sfxShow('sparkle');
}
function updateDroneShow(t, dt) {
  let cur = 'grid'; FORM.forEach(([at, n]) => { if (t >= at) cur = n; });
  if (cur !== formName) setForm(cur);
  const S2 = swarm.shapes, all = smooth(0, .8, t) * (1 - smooth(21.4, 22.5, t));
  swarm.dim.setAttribute('opacity', f2(.42 * win(.3, 2.4, 20.6, 22.4, t)));
  swarm.forEach((d, i) => {
    let tx, ty;
    if (cur === 'grid') { tx = S2.grid[i][0]; ty = S2.grid[i][1]; }
    else if (cur === 'car') { const ox = lerp(-180, 180, smooth(5.6, 9, t)); tx = 800 + S2.car[i][0] + ox; ty = S2.car[i][1]; }
    else if (cur === 'whale') { const ox = lerp(-80, 80, smooth(9, 12.4, t)); tx = 800 + S2.whale[i][0] + ox; ty = S2.whale[i][1] + Math.sin(t * 2 + S2.whale[i][0] * .02) * 6; }
    else if (cur === 'heart') { const k = 1 + .07 * Math.max(0, Math.sin(t * 6.283 * 1)); tx = 800 + (S2.heart[i][0] - 800) * k; ty = 166 + (S2.heart[i][1] - 166) * k; }
    else if (cur === 'flower') { const a = (t - 15.4) * .35, x = S2.flower[i][0] - 800, y = S2.flower[i][1] - 170; tx = 800 + x * Math.cos(a) - y * Math.sin(a); ty = 170 + x * Math.sin(a) + y * Math.cos(a); }
    else if (cur === 'burst') { const k = smooth(18, 19.6, t); tx = 800 + Math.cos(d.ang) * 260 * d.rr * k; ty = 170 + Math.sin(d.ang) * 170 * d.rr * k + 40 * k * k; }
    else if (cur === 'land') { tx = d.sx; ty = d.sy; }
    else { tx = S2[cur][i][0]; ty = S2[cur][i][1]; }
    const rate = cur === 'burst' ? 5 : 2.6;
    d.x += (tx - d.x) * Math.min(1, dt * rate); d.y += (ty - d.y) * Math.min(1, dt * rate);
    const tw = .8 + .2 * Math.sin(t * 9 + d.ph);
    let op = all * tw;
    if (cur === 'burst') op *= 1 - smooth(19.2, 19.8, t) * .6;
    if (cur === 'land') op *= .4 + .6 * (1 - smooth(19.8, 21, t));
    d.dot.setAttribute('cx', f1(d.x)); d.dot.setAttribute('cy', f1(d.y)); d.dot.setAttribute('opacity', f2(op));
    if (d.glow) { d.glow.setAttribute('cx', f1(d.x)); d.glow.setAttribute('cy', f1(d.y)); d.glow.setAttribute('opacity', f2(op * .75)); }
    if (d.glow && d.gcol !== d.col) { d.gcol = d.col; d.glow.setAttribute('fill', d.col === '#ffffff' ? 'url(#glowW)' : /ff4a6a|ff8ab0|ff4ad8/.test(d.col) ? 'url(#glowM)' : /ffd23a|ffb44a/.test(d.col) ? 'url(#glowO)' : /7aff9a/.test(d.col) ? 'url(#glowG)' : /b48aff/.test(d.col) ? 'url(#glowP)' : 'url(#glowC)'); }
  });
  cue('burst', 18, () => { for (let k = 0; k < 5; k++) setTimeout(() => ring(800 + rand(-80, 80), 170 + rand(-40, 40), 'Lmid', rand(140, 240), pick(['neon-c', 'neon-m', 'neon-y']), 1.4), k * 120); });
}

/* ---- 表演二：全息鯨魚巡游（鯨魚繞塔、整座城市的燈跟著拍子亮） ---- */
const WK = [[0, 800, 44, .05], [2.4, 820, 120, .9], [5.4, 1250, 150, .95], [7.4, 1390, 236, .95], [9, 1150, 296, .95], [11.4, 600, 280, .95], [13, 400, 210, .95], [14.4, 560, 104, 1.0], [16, 800, 96, .95], [17.6, 1010, 150, .9], [19.2, 870, 104, .6], [20.4, 800, 44, .04], [21.6, 800, 44, .04]];
function wkAt(t) {
  let i = 0; while (i < WK.length - 2 && t > WK[i + 1][0]) i++;
  const a = WK[Math.max(0, i - 1)], b = WK[i], c = WK[i + 1], d = WK[Math.min(WK.length - 1, i + 2)];
  const u = clamp((t - b[0]) / (c[0] - b[0]), 0, 1), u2 = u * u, u3 = u2 * u;
  return [1, 2, 3].map(j => .5 * (2 * b[j] + (-a[j] + c[j]) * u + (2 * a[j] - 5 * b[j] + 4 * c[j] - d[j]) * u2 + (-a[j] + 3 * b[j] - 3 * c[j] + d[j]) * u3));
}
function updateWhaleShow(t, dt) {
  const p = wkAt(t), q = wkAt(t + .05);
  setWhale(p[0], p[1], Math.max(.03, p[2]), (q[0] - p[0]) / .05, (q[1] - p[1]) / .05, dt);
  hero.spin = Math.max(hero.spin, 1.5);
  // 立面 LED：從 6 秒起跟著拍子（每拍 0.667 秒）一波波從左掃到右
  const env = win(6, 7, 19.2, 20.6, t), B = .667;
  $('ledG').setAttribute('gradientTransform', `translate(0 ${f1(-(t * 70) % 140)})`);
  TOWERS.forEach(Tw => {
    const loc = t - 6 - Tw.x / 1600 * .5, ph = ((loc % B) + B) % B;
    const pulse = loc > 0 ? Math.exp(-ph * 5) : 0;
    Tw.led.setAttribute('opacity', f2(env * (.25 + .6 * pulse)));
  });
  cue('breach', 14.3, () => { burst(560, 110, 'Lmid', 20); ring(560, 100, 'Lmid', 160, 'holo', 1.4); sfxShow('splash'); });
  cue('home', 20.2, () => { tween(1.4, k => hero.flare.setAttribute('opacity', f2(Math.sin(k * Math.PI) * .9))); for (let k = 0; k < 3; k++) setTimeout(() => ring(800, 66, 'Lmid', 260 + k * 80, 'neon-c', 1.5), k * 180); });
}

/* =========================================================
   ④ 動畫：飛車（跟車、繞開滑鼠、車頭對準前進方向）
   ========================================================= */
const LCENTER = {};
function laneCenters() { ['Lc3', 'Lc2', 'Lc1'].forEach(L => { const ys = LANES.filter(l => l.L === L).map(l => l.y); LCENTER[L] = ys.reduce((a, b) => a + b, 0) / ys.length; }); }
function updateCars(dt, adt) {
  LANES.forEach(ln => {
    const list = ln.cars.slice().sort((a, b) => (b.x - a.x) * ln.dir);      // 最前面的車排第一
    const m = toLayer(mouse.x, mouse.y, ln.L);
    list.forEach((c, i) => {
      c.boost = Math.max(0, c.boost - dt);
      let vt = c.v0 * (c.boost > 0 ? 1.9 : 1);
      const A = list[i - 1];
      if (A) {                                 // 跟車：距離前車太近就減速，絕不會撞上
        const gap = (A.x - c.x) * ln.dir - (A.L + c.L) / 2 * ln.s, safe = (46 + c.v * .45) * ln.s;
        if (gap < safe) vt = Math.min(vt, A.v * clamp(gap / safe, 0, 1.05));
        if (gap < 8 * ln.s) vt = 0;
      }
      c.v = lerp(c.v, vt, Math.min(1, adt * (vt < c.v ? 3.5 : 1.2)));
      c.x += c.v * ln.dir * adt;
      // 滑鼠靠近：同一層的車一起往遠離滑鼠的方向（上或下）讓開，兩條車道的距離保持不變
      let yt = 0;
      if (mouse.idle < 2.5 && !reduced) {
        const R = 130 * ln.s + 50, dx = m.x - c.x, dy = m.y - (ln.y + c.yo);
        if (Math.abs(dx) < R && Math.abs(dy) < 70 + 60 * ln.s) yt = (m.y < LCENTER[ln.L] ? 1 : -1) * (70 * ln.s + 22) * (1 - Math.abs(dx) / R) * (1 - Math.abs(dy) / (70 + 60 * ln.s) * .5);
      }
      c.vy = (yt - c.yo) * 3; c.yo += c.vy * adt;
      c.ang = lerp(c.ang, clamp(headAng(c.v * ln.dir, c.vy, ln.dir), -22, 22), Math.min(1, dt * 6));
    });
    // 開出畫面的車，從畫面外排到最後一台後面重新進場
    list.forEach(c => {
      if ((ln.dir > 0 && c.x > 1880) || (ln.dir < 0 && c.x < -280)) {
        const rear = ln.cars.reduce((r, o) => (o.x * ln.dir < r.x * ln.dir ? o : r), ln.cars[0]);
        let nx = rear.x - ln.dir * ((rear.L + c.L) / 2 * ln.s + rand(180, 480) * ln.s);
        nx = ln.dir > 0 ? Math.min(nx, -260) : Math.max(nx, 1860);
        c.x = nx; c.v = c.v0; c.yo = 0;
      }
    });
    ln.cars.forEach(c => {
      const vis = c.x > -300 && c.x < 1900;
      const bob = Math.sin(time * 1.6 + c.bob) * 1.6 * mvK();
      c.g.setAttribute('transform', `translate(${f1(c.x)} ${f1(ln.y + c.yo + bob)}) rotate(${f1(c.ang)}) scale(${f2(ln.dir * ln.s)} ${f2(ln.s)})`);
      if (!vis) return;
      c.trail.setAttribute('opacity', f2(clamp(c.boost, 0, 1) * .9));
      c.fans.forEach((f, k) => f.setAttribute('opacity', f2(.35 + .3 * Math.abs(Math.sin(time * 23 + k * 1.7 + c.bob)) + litK * .2)));
      if (c.rotors) c.rotors.forEach((r, k) => r.setAttribute('rx', f1(4 + 18 * Math.abs(Math.cos(time * 26 + k)))));
    });
  });
}

/* ---- 懸浮列車：加速、減速進站、停站開門、出站 ---- */
function updateTrains(dt, adt) {
  const A = 150;
  TRAINS.forEach(Tr => {
    if (Tr.state === 'wait') { Tr.t -= adt; if (Tr.t <= 0) { Tr.x = Tr.dir > 0 ? -520 : 2120; Tr.state = 'run'; Tr.v = 300; Tr.stopped = false; } }
    else if (Tr.state === 'run') {
      Tr.v = Math.min(320, Tr.v + 80 * adt);
      const d = (STATION_X - Tr.x) * Tr.dir;
      if (!Tr.stopped && d > 0 && d <= Tr.v * Tr.v / (2 * A) + 2) Tr.state = 'brake';
      Tr.x += Tr.v * Tr.dir * adt;
      if ((Tr.dir > 0 && Tr.x > 2150) || (Tr.dir < 0 && Tr.x < -550)) { Tr.state = 'wait'; Tr.t = rand(3, 8); }
    } else if (Tr.state === 'brake') {
      const d = (STATION_X - Tr.x) * Tr.dir;
      Tr.v = Math.sqrt(2 * A * Math.max(d, 0));
      Tr.x += Math.min(Tr.v * adt, Math.max(d, 0)) * Tr.dir;
      if (d < 1.5) { Tr.x = STATION_X; Tr.v = 0; Tr.state = 'dwell'; Tr.t = 4.2; }
    } else if (Tr.state === 'dwell') {
      Tr.t -= adt;
      if (Tr.t <= 0) { Tr.state = 'run'; Tr.stopped = true; Tr.v = 0; }
    }
    const dk = Tr.state === 'dwell' ? win(.3, .9, 3.3, 3.9, 4.2 - Tr.t) : 0;
    Tr.doorK = lerp(Tr.doorK, dk, Math.min(1, dt * 6));
    Tr.doors.forEach(n => n.setAttribute('style', `fill:var(--neon-c);fill-opacity:${f2(Tr.doorK * .55)};stroke:var(--train-dk);stroke-width:1`));
    Tr.flash = Math.max(0, Tr.flash - dt);
    Tr.g.setAttribute('transform', `translate(${f1(Tr.x)} ${Tr.y}) scale(${f2(Tr.dir * Tr.s)} ${Tr.s})`);
    if (Tr.flash > 0) { const f = (Math.sin(Tr.flash * 18) > 0 ? 1 : .3); Tr.hg.setAttribute('opacity', f2(f)); }
  });
}

/* ---- 空中計程車：停機坪起飛 → 飛出畫面 → 飛回來 → 盤旋 → 垂直降落 ---- */
const PAD = { x: 1160, y: 207 };
function moveTo(O, tx, ty, sp, adt, k = 1.8) {
  const dx = tx - O.x, dy = ty - O.y, d = Math.hypot(dx, dy) || 1, v = sp * Math.min(1, d / 70 + .2);
  O.vx = lerp(O.vx, dx / d * v, Math.min(1, adt * k)); O.vy = lerp(O.vy, dy / d * v, Math.min(1, adt * k));
  O.x += O.vx * adt; O.y += O.vy * adt;
  return Math.hypot(tx - O.x, ty - O.y);
}
function updateTaxi(dt, adt) {
  const X = taxi;
  switch (X.state) {
    case 'park': X.x = PAD.x; X.y = PAD.y; X.vx = X.vy = 0; X.t -= adt; if (X.t <= 0 && !show.on) { X.state = 'lift'; } break;
    case 'lift': if (moveTo(X, PAD.x, 150, 40, adt) < 4) X.state = 'out'; break;
    case 'out': moveTo(X, -240, 132, 140, adt, 1.2); if (X.x < -200) { X.state = 'away'; X.t = rand(9, 16); } break;
    case 'away': X.t -= adt; if (X.t <= 0) { X.state = 'in'; X.x = 1840; X.y = 120; X.vx = -130; X.vy = 0; } break;
    case 'in': if (moveTo(X, 1250, 160, 140, adt, 1.2) < 22) X.state = 'hover'; break;
    case 'hover': if (moveTo(X, PAD.x, 162, 50, adt) < 5) X.state = 'down'; break;
    case 'down': if (moveTo(X, PAD.x, PAD.y, 26, adt, 3) < 1.2) { X.state = 'park'; X.t = rand(10, 16); } break;
  }
  if (Math.abs(X.vx) > 8) X.face = lerp(X.face, X.vx > 0 ? 1 : -1, Math.min(1, dt * 3));
  const dir = X.face >= 0 ? 1 : -1, fx = Math.abs(X.face) < .12 ? .12 * dir : X.face;
  const ta = Math.abs(X.vx) > 20 ? clamp(headAng(X.vx, X.vy, dir), -24, 24) : 0;     // 垂直起降時機身保持水平
  X.ang = lerp(X.ang, ta, Math.min(1, dt * 4));
  const bob = X.state === 'park' ? 0 : Math.sin(time * 2.2) * 1.2 * mvK();
  X.g.setAttribute('transform', `translate(${f1(X.x)} ${f1(X.y + bob)}) rotate(${f1(X.ang)}) scale(${f2(fx * X.s)} ${f2(X.s)})`);
  const fly = X.state !== 'park';
  X.fans.forEach((f, k) => f.setAttribute('opacity', f2(fly ? .5 + .4 * Math.abs(Math.sin(time * 25 + k)) : .15)));
}

/* ---- 送貨無人機：收件櫃／飲料攤 ⇄ 畫面外 ---- */
function updateDrones(dt, adt) {
  const m = toLayer(mouse.x, mouse.y, 'Lfore');
  drones.forEach((D, i) => {
    const H = D.home, cy = H.y - 104;
    switch (D.state) {
      case 'dock': D.x = H.x; D.y = H.y; D.vx = D.vy = 0; D.t -= adt; if (D.t <= 0) D.state = 'up'; break;
      case 'up': if (moveTo(D, H.x, cy, 50, adt) < 4) { D.state = 'go'; D.ex = H.x < 800 ? -140 : 1740; D.cy = cy + rand(-30, 6); } break;
      case 'go': moveTo(D, D.ex, D.cy, 120, adt, 1.4); if (Math.abs(D.x - D.ex) < 14) { D.state = 'away'; D.t = rand(6, 12); } break;
      case 'away': D.t -= adt; if (D.t <= 0) D.state = 'back'; break;
      case 'back': if (moveTo(D, H.x, cy, 120, adt, 1.4) < 8) D.state = 'down'; break;
      case 'down': if (moveTo(D, H.x, H.y, 34, adt, 3) < 1.2) { D.state = 'dock'; D.t = rand(9, 16); if (i === 0) cast.locker.open = 2; } break;
    }
    // 互相避讓，也會避開滑鼠
    if (D.state !== 'dock' && D.state !== 'away') {
      const O = drones[1 - i], ex = D.x - O.x, ey = D.y - O.y, e = Math.hypot(ex, ey) || 1;
      if (e < 70) { D.x += ex / e * (70 - e) * .5; D.y += ey / e * (70 - e) * .5; }
      if (mouse.idle < 2.5 && D.state !== 'down') { const mx = D.x - m.x, my = D.y - m.y, me = Math.hypot(mx, my) || 1; if (me < 80) { D.x += mx / me * (80 - me) * adt * 4; D.y += my / me * (80 - me) * adt * 4; } }
    }
    if (Math.abs(D.vx) > 6) D.face = lerp(D.face, D.vx > 0 ? 1 : -1, Math.min(1, dt * 4));
    D.flip = Math.max(0, D.flip - dt * 1.1);
    const fx = Math.abs(D.face) < .12 ? .12 * Math.sign(D.face || 1) : D.face;
    const ang = clamp(D.vx * .12, -16, 16) + (D.flip > 0 ? smooth(0, 1, 1 - D.flip) * 360 * Math.sign(D.face || 1) : 0);
    const fly = D.state !== 'dock';
    const bob = fly ? Math.sin(time * 3 + i) * 2 * mvK() : 0;
    D.g.setAttribute('transform', `translate(${f1(D.x)} ${f1(D.y + bob)}) rotate(${f1(ang)}) scale(${f2(fx)} 1)`);
    D.rot.forEach((r, k) => r.setAttribute('rx', f1(fly ? 3 + 9 * Math.abs(Math.cos(time * 40 + k)) : 11)));
    D.glow.setAttribute('opacity', f2(.2 + .6 * litK));
  });
}

/* ---- 全息鯨魚：平常在高樓之間慢慢繞，頭永遠朝前進方向 ---- */
function setWhale(x, y, s, vx, vy, dt) {
  whale.x = x; whale.y = y; whale.s = s;
  if (Math.abs(vx) > 4) whale.face = lerp(whale.face, vx > 0 ? 1 : -1, Math.min(1, dt * 2));
  const dir = whale.face >= 0 ? 1 : -1, fx = Math.abs(whale.face) < .12 ? .12 * dir : whale.face;
  const ta = Math.abs(vx) + Math.abs(vy) > 3 ? clamp(headAng(vx, vy, dir), -55, 55) : 0;
  whale.ang = lerp(whale.ang, ta, Math.min(1, dt * 3));
  whale.spin = Math.max(0, whale.spin - dt * .7);
  const sp = whale.spin > 0 ? smooth(0, 1, 1 - whale.spin) * 360 * dir : 0;
  // 全息影像偶爾會閃一下、錯位一下
  whale.gl = (whale.gl || 0) - dt;
  let jx = 0, fl = 1;
  if (whale.gl < 0) { whale.gl = rand(2.5, 6); whale.glOn = .18; }
  if (whale.glOn > 0) { whale.glOn -= dt; jx = rand(-5, 5); fl = rand(.4, 1); }
  whale.g.setAttribute('transform', `translate(${f1(x + jx)} ${f1(y)}) rotate(${f1(whale.ang + sp)}) scale(${f2(fx * s)} ${f2(s)})`);
  whale.tail.setAttribute('transform', `rotate(${f1(Math.sin(time * 2.4) * 13 * mvK())} -128 1)`);
  whale.fin.setAttribute('transform', `rotate(${f1(Math.sin(time * 1.2) * 9 * mvK())} 60 16)`);
  whale.op = lerp(whale.op, whale.opT, Math.min(1, dt * 1.5));
  const op = whale.op * (.68 + .32 * litK) * (1 - wx.fog * .25) * fl;
  whale.g.setAttribute('opacity', f2(op));
  const ex = 800, ey = 44, dx = x - ex, dy = y - ey, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L, w = 64 * s;
  whale.proj.setAttribute('d', `M${f1(ex - nx * 3)} ${f1(ey - ny * 3)}L${f1(ex + nx * 3)} ${f1(ey + ny * 3)}L${f1(x + nx * w)} ${f1(y + ny * w)}L${f1(x - nx * w)} ${f1(y - ny * w)}Z`);
  whale.proj.setAttribute('opacity', f2(op * .45 * clamp(L / 60, 0, 1)));
}
function updateWhaleAmbient(dt, adt) {
  whale.wt += adt;

  const Sc = cast.scope;
  Sc.t = Math.max(0, Sc.t - dt);
  const sk = Sc.t > 0 ? win(0, .4, 1.9, 2.4, 2.4 - Sc.t) : 0;
  Sc.head.setAttribute('transform', `translate(0 -50) rotate(${f1(-22 * sk)})`);
  Sc.lens.setAttribute('opacity', f2(.25 + .6 * sk + litK * .2));
  // 收件櫃的門
  const Lk = cast.locker;
  Lk.open = Math.max(0, Lk.open - dt);
  const ok2 = Lk.open > 0 ? win(0, .3, 1.7, 2.1, 2.4 - Lk.open) : 0;
  Lk.doorF.setAttribute('transform', `translate(-8 0) scale(${f2(1 - ok2 * .9)} 1) translate(8 0)`);
  Lk.scr.setAttribute('style', Lk.open > 0 && (time % .4) < .2 ? F('neon-y') : F('neon-g'));
  // 散步的人與機器狗
  const W = cast.walker;
  if (W.wait > 0) W.wait -= adt;
  else { W.x += W.dir * 30 * adt; W.ph += adt * 6.2; if (W.x > 1690) { W.dir = -1; W.wait = 1.6; } else if (W.x < -90) { W.dir = 1; W.wait = 1.6; } }
  W.face = lerp(W.face, W.dir, Math.min(1, dt * 5));
  const wf = Math.abs(W.face) < .1 ? .1 * W.dir : W.face;
  const walking = W.wait <= 0 && adt > 0;
  W.g.setAttribute('transform', `translate(${f1(W.x)} ${f1(590 - (walking ? Math.abs(Math.sin(W.ph)) * 1.4 : 0))})`);
  W.inner.setAttribute('transform', `scale(${f2(wf)} 1)`);
  setLegs(W, walking ? W.ph : 0);
  W.armB.setAttribute('transform', `translate(${f1(-8 * W.k)} ${f1(-44 * W.k)}) rotate(${f1(walking ? Math.sin(W.ph) * 18 : 0)})`);
  W.armF.setAttribute('transform', `translate(${f1(8 * W.k)} ${f1(-44 * W.k)}) rotate(${W.wave > 0 ? f1(-150 + Math.sin(time * 12) * 22) : f1(walking ? -Math.sin(W.ph) * 14 - 20 : -20)})`);
  const D = cast.dog;
  const tx = W.x + W.dir * 30, ddx = tx - D.x;
  const dmove = Math.abs(ddx) > 2 && adt > 0;
  if (dmove) { D.x += Math.sign(ddx) * Math.min(Math.abs(ddx), (Math.abs(ddx) > 40 ? 70 : 34) * adt); D.dir = Math.sign(ddx); }
  else D.dir = W.dir;
  D.face = lerp(D.face ?? 1, D.dir, Math.min(1, dt * 6));
  const df = Math.abs(D.face) < .1 ? .1 * D.dir : D.face;
  D.hop = Math.max(0, D.hop - dt * 1.8); D.wag = Math.max(0, D.wag - dt);
  D.lp = (D.lp || 0) + (dmove ? adt * 12 : 0);
  D.g.setAttribute('transform', `translate(${f1(D.x)} ${f1(597 - Math.sin(D.hop * Math.PI) * 12)})`);
  D.in.setAttribute('transform', `scale(${f2(df)} 1)`);
  D.legs.forEach((L, i) => { const x = +L.dataset.x, s = dmove ? Math.sin(D.lp + i * 1.6) * 3 : 0; L.setAttribute('d', `M${x} -8L${f1(x + s)} -1`); });
  D.tail.setAttribute('d', `M-15 -14L${f1(-22 + (D.wag > 0 ? Math.sin(time * 30) * 4 : Math.sin(time * 4) * 1.5))} -22`);
  // 牽繩：從手連到狗的項圈
  const hx = W.x + wf * 9 * W.k + (W.wave > 0 ? 0 : 0), hy = 590 - 26 * W.k, cx2 = D.x + df * 10, cy2 = 597 - 20 - Math.sin(D.hop * Math.PI) * 12;
  cast.leash.setAttribute('d', `M${f1(hx)} ${f1(hy)}Q${f1((hx + cx2) / 2)} ${f1(Math.max(hy, cy2) + 10)} ${f1(cx2)} ${f1(cy2)}`);
}

/* =========================================================
   ④ 主迴圈
   ========================================================= */
let last = performance.now(), colorAcc = 0;
function loop(now) { const dt = Math.min(.1, (now - last) / 1000); last = now; step(dt); requestAnimationFrame(loop); }
function step(dt) {
  time += dt;
  const adt = dt * mvK();
  if (T.auto && !T.dragging && !reduced && !show.on) T.t = (T.t + dt / DAY_SEC) % 1;
  const wk = Math.min(1, dt * .6);
  for (const k in wx) if (typeof wx[k] === 'number') wx[k] = lerp(wx[k], wxT[k], wk);
  colorAcc += dt; if (colorAcc > .12) { colorAcc = 0; applyColors(); }
  updateShow(dt);
  mouse.nx = lerp(mouse.nx, mouse.x, Math.min(1, dt * 2.5)); mouse.idle += dt;
  for (const k in PX) LY[k].setAttribute('transform', `translate(${f1(parallaxX(PX[k] * mvK()))} 0)`);
  LY.world.setAttribute('transform', cam.s > 1.001 ? `translate(${cam.fx} ${cam.fy}) scale(${cam.s.toFixed(4)}) translate(${-cam.fx} ${-cam.fy})` : '');
  updateEnv(dt, adt);
  updateCars(dt, adt);
  updateTrains(dt, adt);
  updateTaxi(dt, adt);
  updateDrones(dt, adt);
  if (!(show.on && show.kind === 'whale')) updateWhaleAmbient(dt, adt);
  updateBirds(dt, adt);
  updateCast(dt, adt);
  for (let i = tweens.length - 1; i >= 0; i--) { const tw = tweens[i]; tw.t += dt; const k = Math.min(1, tw.t / tw.dur); tw.fn(k); if (k >= 1) { tweens.splice(i, 1); tw.done && tw.done(); } }
}

/* ---------------- 初始化 ---------------- */
function init() {
  drawSky();
  drawFar();
  drawLanes();
  drawTowers();
  drawHero();
  el('rect', { x: -300, y: 380, width: 2200, height: 240, fill: 'url(#hazeG)', class: 'noHit' }, LY.Lmid);   // 塔底的雲霧（城市像浮在雲上）
  drawTaxi();
  drawWhale(); drawSwarm(); drawBirds();
  drawCars(); laneCenters();
  drawRail();
  drawFog();
  drawNear();
  drawDeck();
  drawCast();
  cast.leash = el('path', { style: S('robot-acc', 1.2), class: 'noHit' }, LY.Lfore); cast.dog.g.before(cast.leash);
  drawDrones();
  // 不該擋住點擊的光暈與透明物件
  [hero.flare, hero.ringGlow, hero.emit, whale.proj, whale.glow, cast.flash].forEach(n => n.classList.add('noHit'));
  [...LY.Lfar.children].forEach(n => { if (n !== far.elev) n.classList.add('noHit'); });
  Object.assign(hero, { spin: 0, rot: 0 }); whale.wt = 0;
  bindAll();
  if (reduced) { T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false'); }
  setWeather(0);
  applyColors();
  step(1 / 60);
  requestAnimationFrame(loop);
}
init();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on && show.kind,
  btn: { drone: 'btnDrone', whale: 'btnWhale' },
  ff: () => { show.cues = new Proxy({}, { get: () => 1 }); show.t = show.dur - .02; },   // 跳過剩下的橋段直接收尾
  save: () => ({ t: T.t, auto: T.auto }),
  stop: () => endShow(),
  restore: s => { T.t = s.t; T.auto = s.auto; $('btnAuto') && $('btnAuto').setAttribute('aria-pressed', String(T.auto)); applyColors(true); }
});
/* /ShowStop */
})();
</script>
