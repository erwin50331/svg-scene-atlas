<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>泰姬瑪哈陵的月光倒影</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-97 泰姬瑪哈陵的月光倒影｜刺繡布藝 embroidery
   地點：印度阿格拉・泰姬瑪哈陵。站在南邊花園的十字水道旁往北看：
        正中央是白色大理石陵墓（洋蔥形大圓頂、四座小亭、大拱門 iwan），
        坐在方形大理石台基上，四個角落各有一座微微往外傾斜的尖塔；
        左（西）邊是紅砂岩、三座白圓頂的清真寺，右（東）邊是外觀一樣的答辯廳（Jawab）。
        前面是四分花園（Charbagh）：長長的水道與噴泉、兩排柏樹、草坪，
        水道映出陵墓的倒影；近景是紅砂岩步道、中央平台的大理石長椅與遊客。
   風格重點：亞麻布底、貼布色塊、虛線平針縫邊、緞面繡的斜向絲線光澤、
            長短針繡的天空色帶、法式結粒繡的星星與花、金線（zardozi）勾邊、
            外框一圈印度鏡片繡（shisha）的小圓鏡，夜裡會閃。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   --d-名稱 = 白天、--n-名稱 = 夜晚、--k-名稱 = 傍晚、--m-名稱 = 清晨（--n／--k／--m 可省略，程式自動算）。
   泰姬陵的大理石：清晨偏粉紅（--m）、正午雪白（--d）、傍晚金黃（--k）、月光下銀藍（--n）。
   JS 依時間混色，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（線色）兩個 class。
   沒有 --d- 前綴的（例如 --thread-gold）是固定色，不隨日夜改變。
   ========================================================= */
:root{
  color-scheme: light;
  /* —— 天空：四條長短針繡色帶（由上而下） —— */
  --d-sky1:#5fa9de; --m-sky1:#7f8fc8; --k-sky1:#6b62a8; --n-sky1:#0c1433;
  --d-sky2:#82bfe8; --m-sky2:#c99cc0; --k-sky2:#c98a9e; --n-sky2:#141f47;
  --d-sky3:#a9d4ef; --m-sky3:#f2b8bc; --k-sky3:#f0a873; --n-sky3:#1d2a5a;
  --d-sky4:#d4ebf5; --m-sky4:#fcd9c8; --k-sky4:#ffd08a; --n-sky4:#2b3868;
  --d-cloud:#fbfaf4; --m-cloud:#ffe0e0; --k-cloud:#ffd9b0; --n-cloud:#3a4672;
  --d-cloudSh:#dfe6ee; --m-cloudSh:#efbcc4; --k-cloudSh:#eba98a; --n-cloudSh:#2a345e;
  /* —— 泰姬陵：白色大理石（清晨粉、正午白、傍晚金、月光銀藍） —— */
  --d-marble:#f8f4ea; --m-marble:#f7d9d6; --k-marble:#f8d398; --n-marble:#b9c6e8;
  --d-marbleSh:#e1d9c9; --m-marbleSh:#e6bcbc; --k-marbleSh:#e0ae70; --n-marbleSh:#8f9dc8;
  --d-marbleDk:#c2b7a2; --m-marbleDk:#c99a9e; --k-marbleDk:#b98450; --n-marbleDk:#6a78a6;
  --d-marbleLn:#a89a82; --n-marbleLn:#56628e;
  --d-inlay:#3e3a3c; --n-inlay:#262a44;         /* 黑色大理石鑲嵌的書法飾帶 */
  --d-niche:#9c8f78; --m-niche:#a87c80; --k-niche:#9a6a3e; --n-niche:#3e4772;  /* 大拱門內的陰影 */
  --d-finial:#d8a441; --n-finial:#9a926e;        /* 圓頂頂端的金色尖頂 */
  --d-gem1:#c0392b; --d-gem2:#2e7d4f; --d-gem3:#c78a1e;  /* 硬石鑲嵌的花：紅玉髓、碧玉、黃玉 */
  /* —— 紅砂岩：清真寺、答辯廳、圍牆、步道 —— */
  --d-sand:#b8553c; --k-sand:#c9663f; --n-sand:#4a2c3e;
  --d-sandSh:#93402f; --n-sandSh:#36202f;
  --d-sandLt:#d27458; --k-sandLt:#e0874f; --n-sandLt:#5c384a;
  --d-pave:#c88d6d; --k-pave:#d39a66; --n-pave:#4b3a4e;
  --d-paveLn:#a66a50; --n-paveLn:#35283a;
  --d-edge:#efe8da; --k-edge:#f4d6a4; --n-edge:#8a94b8;   /* 水道與步道邊的白石 */
  /* —— 花園 —— */
  --d-lawn:#7fb45c; --k-lawn:#9aa654; --n-lawn:#1a3a30;
  --d-lawnDk:#6a9f4b; --n-lawnDk:#142f28;
  --d-lawnLt:#9cc970; --n-lawnLt:#21463a;
  --d-cypress:#2f6a3c; --n-cypress:#10281f;
  --d-cypressLt:#4c8c4a; --n-cypressLt:#173628;
  --d-tree:#3f7d3f; --n-tree:#122c22;
  --d-treeLt:#5b9a4e; --n-treeLt:#1a3a2c;
  --d-treeFar:#5c8f62; --k-treeFar:#7a7a50; --n-treeFar:#16283a;
  --d-trunk:#6b4a32; --n-trunk:#2a1e24;
  --d-water:#5b9ec6; --m-water:#9c9cc8; --k-water:#c8946a; --n-water:#1c2c56;
  --d-waterLt:#9dd0ea; --k-waterLt:#f2c48a; --n-waterLt:#34508a;
  --d-flowerO:#f39a1c; --d-flowerR:#e2483a; --d-flowerP:#ee79a8; --d-flowerW:#fff6e0;
  /* —— 人物：皮膚、頭髮、服裝（紗麗、旁遮普套裝、庫爾塔長衫） —— */
  --d-skin1:#f1c9a5; --d-skin2:#d9a27a; --d-skin3:#b77d58; --d-skin4:#8a5a3c;
  --d-hair1:#1e1a1c; --d-hair2:#3a2a20; --d-hair3:#7a5232; --d-hair4:#e0c486; --d-hair5:#c9c2b6;
  --d-c1:#e23b5a; --d-c2:#f39c1f; --d-c3:#1f8a70; --d-c4:#6a3fb5; --d-c5:#2f6fd0;
  --d-c6:#e8c21f; --d-c7:#c2185b; --d-c8:#fbf8f0; --d-c9:#3a8f3a; --d-c10:#1d2a44;
  --d-c11:#f06a3a; --d-c12:#8fc8e8;
  --d-khaki:#b59a62; --d-khakiDk:#8a7344; --d-beret:#7a2a34;
  --d-jeans:#3e5a86; --d-shoe:#3a2a24; --d-shoeCover:#4a86c8;
  --d-camera:#2a2a2e;
  /* —— 動物 —— */
  --d-monkey:#a08868; --d-monkeyDk:#7e6648; --d-monkeyFace:#e8a08c;
  --d-squirrel:#9a8670; --d-squirrelDk:#6e5c48; --d-squirrelLt:#efe2c6;
  --d-parrot:#4cb04a; --d-parrotDk:#2f8a3a; --d-beak:#d6322a;
  --d-kite:#6a4a34; --d-kiteDk:#4a3222;
  /* —— 繡線：縫邊的針腳 —— */
  --d-stitch:#5a4536; --n-stitch:#0b1026;
  --d-stitchLt:#fffaf0; --n-stitchLt:#8a98cc;
  --d-shadow:#2a1a1024; --n-shadow:#00000040;

  /* —— 固定色：布料、金線、燈光、天體、特效 —— */
  --linen:#efe4cc;
  --thread-gold:#e6b34a; --thread-gold2:#f6d488;
  --thread-red:#cf3f37; --mirror:#e8f2ff; --mirror-glint:#ffffff;
  --sun:#ffd166; --sunCore:#fff2c4; --moon:#f7f0d4; --moonSh:#e2d8b6; --star:#fff6da;
  --spray:#eaf7ff; --sprayLt:#ffffff; --flash:#ffffff;
  --rb1:#e2483a; --rb2:#f39a1c; --rb3:#f2d02a; --rb4:#4cb04a; --rb5:#3a86d0; --rb6:#7a4ab8;
  --rainc:#a8bcd2; --fog:#eef0ec; --fogSh:#d8dcd8;
  --wx-cloud:#8d97a6; --wx-rain:#3a4a62; --wx-fog:#e8ebe6;
  --nightBase:#121a3e; --duskBase:#ff9a5a;

  /* —— 頁面介面 —— */
  --page-bg:#f6f1e6; --page-fg:#2a2230; --page-muted:#6a5f68;
  --ui-surface:#fffdf8; --ui-line:#d9cdb8; --ui-accent:#1f8a70; --ui-accent-2:#c2185b;
  --cine-shade:#000000; --cine-light:#fff3dc;
  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:14px;overflow:hidden;background:var(--linen);line-height:0;box-shadow:0 2px 12px #0000001f}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:var(--ui-surface);
  border:1px dashed var(--ui-line);border-radius:12px;padding:10px 14px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px dashed var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--page-fg);border-color:var(--page-fg);color:#fff;font-weight:700}
.panel button.big{border-style:solid;border-color:var(--ui-accent);color:#fff;background:var(--ui-accent);font-weight:700}
.panel button.big.alt{border-color:var(--ui-accent-2);background:var(--ui-accent-2)}
.panel button.big.on{background:#e6b34a;border-color:#e6b34a;color:var(--page-fg)}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid var(--ui-accent);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 內的樣式：針腳 ---------- */
#scene .clickable,#scene [role="button"]{cursor:pointer}
#scene .st{fill:none;stroke:var(--stitch);stroke-width:1.2;stroke-dasharray:4 2.6;stroke-linecap:round}
#scene .st-lt{fill:none;stroke:var(--stitchLt);stroke-width:1.1;stroke-dasharray:3.5 3;stroke-linecap:round;opacity:.8}
#scene .st-gold{fill:none;stroke:var(--thread-gold);stroke-width:1.1;stroke-dasharray:3 2;stroke-linecap:round}
#scene .bubble rect{fill:#fffdf6;stroke:var(--thread-red);stroke-width:1.6;stroke-dasharray:5 3}
#scene .bubble text{fill:#2a2230;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .bubble .pop{animation:pop var(--dur,1.6s) ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){ #scene .bubble .pop{animation:none} }
</style>
<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。
   想恢復完整版，刪掉這整段 <style id="pure-art"> 即可。
   ========================================================= */
html,body{height:100%;margin:0!important;overflow:hidden}
body{display:flex!important;align-items:center;justify-content:center;padding:0!important}
body>.wrap{width:100%!important;max-width:min(100vw,calc(100vh * 8 / 3))!important;
  margin:0!important;padding:0!important;gap:0!important;display:block!important}
body>.wrap>:not(.stage){display:none!important}
body>.wrap>.stage{width:100%!important;max-width:100%!important;margin:0!important;
  border:0!important;border-radius:0!important;box-shadow:none!important}
</style>
</head>
<body>
<main class="wrap">
  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：天空（長短針色帶、太陽月亮、星星、貼布雲、黑鳶）
       → 遠景（樹林、紅砂岩圍牆、清真寺、答辯廳、獼猴）→ 泰姬陵（尖塔、陵墓、圓頂、台基、台基上的遊客）
       → 中景（草坪、樹、水道與倒影、噴泉、柏樹、松鼠、園丁、十字水道）
       → 近景（紅砂岩步道、遊客、大理石長椅、拍照的人、花圃、前景大樹）→ 鳥 → 天氣 → 表演氛圍 → 布框
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="刺繡布藝風格的印度阿格拉泰姬瑪哈陵：白色大理石陵墓有洋蔥形大圓頂與四座微微外傾的尖塔，左右是紅砂岩的清真寺與答辯廳；前面的四分花園有長水道、噴泉與兩排柏樹，水面映出陵墓倒影；近景是紅砂岩步道、大理石長椅與穿紗麗、庫爾塔長衫的遊客">
    <defs>
      <!-- 緞面繡：斜向絲線光澤（疊在色塊上） -->
      <pattern id="satinA" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
        <rect width="5" height="1.4" fill="#ffffff" opacity=".16"/><rect y="2.5" width="5" height=".8" fill="#000000" opacity=".07"/>
      </pattern>
      <pattern id="satinB" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
        <rect width="5" height="1.4" fill="#ffffff" opacity=".16"/><rect y="2.5" width="5" height=".8" fill="#000000" opacity=".07"/>
      </pattern>
      <pattern id="satinV" width="4" height="6" patternUnits="userSpaceOnUse">
        <rect width="1.2" height="6" fill="#ffffff" opacity=".18"/><rect x="2.2" width=".7" height="6" fill="#000000" opacity=".07"/>
      </pattern>
      <!-- 長短針繡：天空、水面的橫向針腳 -->
      <pattern id="longShort" width="36" height="8" patternUnits="userSpaceOnUse">
        <rect x="1" y="1" width="20" height="1.6" rx=".8" fill="#ffffff" opacity=".16"/>
        <rect x="18" y="5" width="16" height="1.6" rx=".8" fill="#ffffff" opacity=".12"/>
        <rect x="24" y="1.6" width="9" height=".8" fill="#000000" opacity=".05"/>
      </pattern>
      <!-- 草坪：短短的直針 -->
      <pattern id="grassPat" width="10" height="7" patternUnits="userSpaceOnUse">
        <path d="M2 6 l1 -4 M6 5 l-1 -3.5 M8.5 6.5 l.6 -3" stroke="#ffffff" stroke-opacity=".14" stroke-width="1"/>
        <path d="M4 3 l.6 -2.4" stroke="#000000" stroke-opacity=".08" stroke-width="1"/>
      </pattern>
      <!-- 紅砂岩步道：八角星與十字的鋪石紋（回針繡） -->
      <pattern id="paveStar" width="56" height="28" patternUnits="userSpaceOnUse">
        <path d="M0 14 L14 0 L28 14 L14 28 Z M28 14 L42 0 L56 14 L42 28 Z" class="s-paveLn" stroke-width="1.1" stroke-dasharray="3 2"/>
        <circle cx="14" cy="14" r="2.2" class="f-paveLn"/><circle cx="42" cy="14" r="2.2" class="f-paveLn"/>
      </pattern>
      <!-- 台基的一排小拱龕 -->
      <pattern id="plinthArch" width="24" height="26" patternUnits="userSpaceOnUse" x="596" y="303">
        <path d="M5 24 V10 Q5 4 12 2 Q19 4 19 10 V24" class="s-marbleLn" stroke-width="1" stroke-dasharray="2.5 1.6"/>
      </pattern>
      <!-- 紅砂岩牆面的白石鑲邊格子 -->
      <pattern id="sandPanel" width="30" height="24" patternUnits="userSpaceOnUse">
        <rect x="3" y="3" width="24" height="18" class="s-sandLt" stroke-width="1" stroke-dasharray="2.5 1.8"/>
      </pattern>
      <!-- 亞麻布紋：由程式用 canvas 產生後填入 href -->
      <pattern id="linenPat" width="200" height="200" patternUnits="userSpaceOnUse">
        <image id="linenImg" width="200" height="200" href=""/>
      </pattern>
      <linearGradient id="waterG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--waterLt)"/><stop offset="1" style="stop-color:var(--water)"/>
      </linearGradient>
      <radialGradient id="glowG"><stop offset="0" stop-color="#ffd27a" stop-opacity=".9"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
      <radialGradient id="sunG"><stop offset=".35" style="stop-color:var(--sun);stop-opacity:.55"/><stop offset="1" style="stop-color:var(--sun);stop-opacity:0"/></radialGradient>
      <radialGradient id="moonG"><stop offset=".3" style="stop-color:var(--moon);stop-opacity:.5"/><stop offset="1" style="stop-color:var(--moon);stop-opacity:0"/></radialGradient>
      <radialGradient id="mistG"><stop offset="0" style="stop-color:var(--sprayLt);stop-opacity:.65"/><stop offset="1" style="stop-color:var(--sprayLt);stop-opacity:0"/></radialGradient>
      <linearGradient id="fogG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--fog);stop-opacity:0"/><stop offset=".35" style="stop-color:var(--fog);stop-opacity:.85"/><stop offset="1" style="stop-color:var(--fog);stop-opacity:.95"/>
      </linearGradient>
      <!-- 貼布投影：讓靜態的大片布塊像疊在底布上（只用在不會動的圖層） -->
      <filter id="appl" x="-5%" y="-5%" width="110%" height="115%">
        <feDropShadow dx="1.2" dy="2" stdDeviation="1.1" flood-color="#2a1a10" flood-opacity=".3"/>
      </filter>
      <clipPath id="frameClip"><rect x="0" y="0" width="1600" height="600"/></clipPath>
      <!-- 長水道的水面（倒影只畫在這裡面） -->
      <clipPath id="poolClip"><path d="M786 336 L814 336 L878 438 L722 438 Z"/></clipPath>
    </defs>

    <g clip-path="url(#frameClip)">
    <!-- ===== 場景：天空 ===== -->
    <g id="skyBands"></g>
    <rect id="skyTint" x="0" y="0" width="1600" height="340" opacity="0" pointer-events="none"/>
    <rect id="skyHit" x="0" y="0" width="1600" height="180" fill="transparent" class="clickable" tabindex="0" role="button" aria-label="天空：白天黑鳶與鸚鵡飛過，夜晚劃過流星"/>
    <g id="stars" pointer-events="none"></g>
    <g id="sun" pointer-events="none"></g>
    <g id="moon" pointer-events="none"></g>
    <g id="clouds" pointer-events="none"></g>
    <g id="overcast" pointer-events="none" opacity="0"></g>
    <g id="kites" pointer-events="none"></g>

    <!-- ===== 場景：遠景（樹林、圍牆、清真寺、答辯廳、獼猴） ===== -->
    <g id="parFar">
      <g id="farTrees"></g>
      <g id="wall"></g>
      <g id="mosque"></g>
      <g id="jawab"></g>
      <g id="monkeys"></g>
    </g>

    <!-- ===== 場景：泰姬陵（parTaj 只負責視差，倒影用 <use> 引用 tajAll） ===== -->
    <g id="parTaj">
      <g id="tajAll"></g>
      <g id="gemGlints" pointer-events="none"></g>
      <g id="plinthPeople" pointer-events="none"></g>
    </g>
    <rect id="fogFar" x="0" y="60" width="1600" height="300" fill="url(#fogG)" opacity="0" pointer-events="none"/>

    <!-- ===== 場景：中景（花園、水道、噴泉、柏樹、松鼠、園丁） ===== -->
    <g id="parMid">
      <g id="garden"></g>
      <g id="pool"></g>
      <g id="midCrowd"></g>
      <g id="fountains" pointer-events="none"></g>
      <g id="rainbow" pointer-events="none" opacity="0"></g>
      <g id="cypressL"></g>
      <g id="cypressR"></g>
      <g id="squirrels"></g>
      <g id="gardener"></g>
      <g id="crossCanal"></g>
    </g>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，

   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消

  function wrapFn(fn, ep) {

    return function () {
      if (ep !== epoch) return;          // 已被停止

    };

  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;

      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';

    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });

    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}

      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);

  }

  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });

  }

  let stopping = false;

    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };

  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }

    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);

    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}

  }

  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }

    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';

      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);

          const k = isOn();

            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();

/* ---- 表演氛圍（取代寬銀幕黑邊）：k = 0~1，四周輕微暗角＋中央微亮 ---- */
let cineK = 0, cineW = 0;
function setCine(k, fx, fy) {
  cineK = k = Math.max(0, Math.min(1, k));
  if (k === cineW || (Math.abs(k - cineW) < .004 && k > 0 && k < 1)) return;
  cineW = k;
  const g = document.getElementById('cineFx'); if (!g) return;
  g.setAttribute('opacity', k.toFixed(3));
  if (fx != null) { const G = document.getElementById('cineLightG'); G.setAttribute('cx', (fx / 1600).toFixed(3)); G.setAttribute('cy', (fy / 600).toFixed(3)); }
}

const P = (d, cls, sat = 'satinA', st = 'st') => `<path d="${d}" class="${cls}"/>${sat ? `<path d="${d}" fill="url(#${sat})"/>` : ''}${st ? `<path d="${d}" class="${st}"/>` : ''}`;
const R = (x, y, w, h) => `M${f1(x)} ${f1(y)} h${f1(w)} v${f1(h)} h${f1(-w)} Z`;
// 尖拱：左右兩條弧線在頂端相交（蒙兀兒式的拱門）
const archD = (x1, x2, spring, apex, bottom) => { const m = (x1 + x2) / 2, w = x2 - x1; return `M${f1(x1)} ${f1(bottom)} V${f1(spring)} Q${f1(x1)} ${f1(spring - (spring - apex) * .7)} ${f1(m - w * .08)} ${f1(apex + (spring - apex) * .12)} L${f1(m)} ${f1(apex)} L${f1(m + w * .08)} ${f1(apex + (spring - apex) * .12)} Q${f1(x2)} ${f1(spring - (spring - apex) * .7)} ${f1(x2)} ${f1(spring)} V${f1(bottom)} Z`; };
// 洋蔥形圓頂：底寬、最鼓處、細頸、尖頂
const domeD = (cx, by, r, h) => {
  const w0 = r * .86;
  return `M${f1(cx - w0)} ${f1(by)} C${f1(cx - r * 1.02)} ${f1(by - h * .15)} ${f1(cx - r * 1.08)} ${f1(by - h * .45)} ${f1(cx - r * .72)} ${f1(by - h * .66)} C${f1(cx - r * .4)} ${f1(by - h * .84)} ${f1(cx - r * .1)} ${f1(by - h * .86)} ${f1(cx)} ${f1(by - h)} C${f1(cx + r * .1)} ${f1(by - h * .86)} ${f1(cx + r * .4)} ${f1(by - h * .84)} ${f1(cx + r * .72)} ${f1(by - h * .66)} C${f1(cx + r * 1.08)} ${f1(by - h * .45)} ${f1(cx + r * 1.02)} ${f1(by - h * .15)} ${f1(cx + w0)} ${f1(by)} Z`;
};

// 讀取色票、日夜混色（沒寫 --n／--k／--m 的色票自動算出）
const css = n => getComputedStyle(root).getPropertyValue(n).trim();
const hex = h => {
  h = h.replace('#', '');
  if (h.length === 3) h = [...h].map(c => c + c).join('');
  const n = parseInt(h.slice(0, 6), 16);
  return [n >> 16 & 255, n >> 8 & 255, n & 255, h.length === 8 ? parseInt(h.slice(6), 16) / 255 : 1];
};
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgba = c => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${(c[3] ?? 1).toFixed(3)})`;
const PAIRS = {};
(() => {
  const names = [];
  for (const sheet of document.styleSheets) {
    try { for (const r of sheet.cssRules) if (r.selectorText === ':root') for (const p of r.style) if (p.startsWith('--d-')) names.push(p.slice(4)); } catch (e) {}
  }
  const NB = hex(css('--nightBase')), DB = hex(css('--duskBase'));
  let cls = '';
  names.forEach(k => {
    const d = hex(css('--d-' + k));
    const n2 = css('--n-' + k), k2 = css('--k-' + k), m2 = css('--m-' + k);
    const nAuto = mix(d, NB, .66); nAuto[3] = d[3];
    const kAuto = mix(d, DB, .2); kAuto[3] = d[3];
    const kk = k2 ? hex(k2) : kAuto;
    PAIRS[k] = { d, n: n2 ? hex(n2) : nAuto, k: kk, m: m2 ? hex(m2) : kk };
    cls += `#scene .f-${k}{fill:var(--${k})}#scene .s-${k}{stroke:var(--${k});fill:none}`;
  });
  const st = document.createElement('style'); st.textContent = cls; document.head.appendChild(st);
})();

/* 亞麻布紋：用 canvas 畫出經緯線與細小的纖維結點，做成重複貼圖 */
function makeLinen() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 200;
    const x = c.getContext('2d');
    for (let i = 0; i < 200; i += 2) {
      x.fillStyle = `rgba(255,248,230,${(.04 + Math.random() * .06).toFixed(3)})`; x.fillRect(0, i, 200, 1);
      x.fillStyle = `rgba(60,40,20,${(.025 + Math.random() * .045).toFixed(3)})`; x.fillRect(i, 0, 1, 200);
    }
    for (let i = 0; i < 900; i++) {

}

/* ---------------- ② 場景：天空（長短針繡色帶、太陽、月亮、法式結粒繡星星、貼布雲） ---------------- */
const stars = [], clouds = [];
function cloudD(w, h) {
  const n = Math.max(3, Math.round(w / 30));
  let d = `M0 0`;
  for (let i = 0; i < n; i++) { const r = h * .55 + srand(0, h * .35) + (i > 0 && i < n - 1 ? h * .3 : 0); const x = (i + .5) * w / n; d += ` L${f1(x - r * .8)} 0 A${f1(r * .8)} ${f1(r)} 0 0 1 ${f1(x + r * .8)} 0`; }
  return d + ` L${w} 0 Q${w / 2} ${f1(h * .35)} 0 0 Z`;
}
function drawSky() {
  const bands = [[0, 92], [92, 180], [180, 262], [262, 345]];
  bands.forEach(([a, b], i) => {
    el('rect', { x: 0, y: a, width: 1600, height: b - a + 1, class: 'f-sky' + (i + 1) }, $('skyBands'));
    el('rect', { x: 0, y: a, width: 1600, height: b - a + 1, fill: 'url(#longShort)' }, $('skyBands'));
  });
  // 色帶交界：一排斜向的長短針，像兩種顏色的繡線互相咬合
  bands.slice(1).forEach(([a], i) => {
    let d = '';
    for (let x = 0; x < 1600; x += 9) d += `M${x} ${a + 3 + (x * 7 % 5)} L${x + 5} ${a - 5 - (x * 3 % 4)} `;
    el('path', { d, class: 's-sky' + (i + 2), 'stroke-width': 2.2, 'stroke-linecap': 'round' }, $('skyBands'));
  });
  for (let i = 0; i < 80; i++) {
    const x = srand(20, 1580), y = srand(18, 250), r = srand(1, 2.1);
    const g = el('g', { transform: `translate(${f1(x)} ${f1(y)})` }, $('stars'));
    el('circle', { r: f1(r), style: 'fill:var(--star)' }, g);
    if (r > 1.7) el('path', { d: `M${f1(-r * 2.4)} 0 H${f1(r * 2.4)} M0 ${f1(-r * 2.4)} V${f1(r * 2.4)}`, style: 'stroke:var(--star)', 'stroke-width': .7, 'stroke-dasharray': '1.4 1' }, g);
    stars.push({ el: g, ph: srand(0, 6.28), sp: srand(.6, 2) });
  }
  frag($('sun'), `<circle r="64" fill="url(#sunG)"/><circle r="28" style="fill:var(--sun)"/><circle r="28" fill="url(#satinA)"/><circle r="20" style="fill:var(--sunCore)"/><circle r="28" style="stroke:var(--thread-gold);fill:none" stroke-width="1.6" stroke-dasharray="4 2.5"/>`);
  frag($('moon'), `<circle r="54" fill="url(#moonG)"/><circle r="22" style="fill:var(--moon)"/><circle r="22" fill="url(#satinB)"/><circle cx="-6" cy="-5" r="4.5" style="fill:var(--moonSh)"/><circle cx="7" cy="6" r="3.2" style="fill:var(--moonSh)"/><circle cx="4" cy="-9" r="2" style="fill:var(--moonSh)"/><circle r="22" style="stroke:var(--moonSh);fill:none" stroke-width="1.2" stroke-dasharray="3 2"/>`);
  for (let i = 0; i < 6; i++) {
    const w = srand(90, 180), h = srand(18, 26);
    const g = el('g', {}, $('clouds'));
    frag(g, `<g>${P(cloudD(w, h).replace(/ Z$/, ' Z'), 'f-cloudSh', '', '')}</g>`).setAttribute('transform', 'translate(4 4)');
    frag(g, `<g>${P(cloudD(w, h), 'f-cloud', 'satinA', 'st-lt')}</g>`);
    clouds.push({ el: g, x: srand(-150, 1600), y: srand(40, 190), sp: srand(4, 9), s: srand(.75, 1.1) });
  }
  // 陰天、季風雨：三條長雲帶
  [[0, 70, 'f-cloudSh'], [46, 80, 'f-cloud'], [104, 60, 'f-cloudSh']].forEach(([y, h, c], i) => {
    let d = `M-20 ${y + h}`;

    d += ` L1640 ${y + h} Z`;
    frag($('overcast'), `<g>${P(d, c, 'longShort', '')}</g>`);
  });
}

const poolX = (y, side) => 800 + side * lerp(14, 78, (y - POOL.yT) / (POOL.yB - POOL.yT));

  // 花園四個區塊裡的大樹
  [[110, 402, 52], [250, 390, 44], [380, 404, 48], [500, 388, 36], [1100, 388, 36], [1220, 404, 48], [1350, 390, 44], [1490, 402, 52]].forEach(([x, y, r]) => {

  });
  // 中央步道（紅砂岩）與水道的白石邊

  // 水道：水面、倒影（引用陵墓圖層、上下翻轉並壓扁）、長短針的水紋
  const pg = $('pool');
  el('path', { d: 'M786 336 L814 336 L878 438 L722 438 Z', fill: 'url(#waterG)' }, pg);
  const refl = el('g', { 'clip-path': 'url(#poolClip)' }, pg);
  el('use', { href: '#tajAll', transform: 'matrix(1 0 0 -0.36 0 451.5)', opacity: .65 }, refl);
  el('ellipse', { id: 'moonRefl', cx: 870, cy: 431, rx: 16, ry: 5, style: 'fill:var(--moon)', opacity: 0 }, refl);
  el('path', { d: 'M786 336 L814 336 L878 438 L722 438 Z', fill: 'url(#waterG)', opacity: .26 }, pg);
  el('path', { d: 'M786 336 L814 336 L878 438 L722 438 Z', fill: 'url(#longShort)' }, pg);
  const rg = el('g', { 'clip-path': 'url(#poolClip)' }, pg);
  for (let i = 0; i < 9; i++) {
    const y = lerp(342, 432, i / 8), w = poolX(y, 1) - 800;
    const l = el('path', { d: `M${f1(800 - w + 4)} ${f1(y)} H${f1(800 + w - 4)}`, style: 'stroke:var(--waterLt)', 'stroke-width': f1(lerp(.8, 1.6, i / 8)), 'stroke-dasharray': `${f1(lerp(4, 12, i / 8))} ${f1(lerp(5, 14, i / 8))}`, opacity: .7 }, rg);
    ripples.push({ el: l, sp: lerp(4, 14, i / 8) * (i % 2 ? 1 : -1), off: 0 });
  }
  el('path', { d: 'M786 336 L814 336 L878 438 L722 438 Z', class: 'st-lt' }, pg);
  hit(frag(pg, `<path id="poolHit" d="M779 334 L821 334 L890 442 L710 442 Z" fill="transparent"/>`), '長水道：點一下水面起漣漪');
  // 十字水道與中央平台（白石平台上的小蓮花池）
  const cc = $('crossCanal');

    ${P('M690 438 H910 V462 H690 Z', 'f-marble', 'satinB', 'st')}

    ${[766, 783, 800, 817, 834].map(x => `<circle cx="${x}" cy="450" r="2.4" class="f-edge"/><circle cx="${x}" cy="450" r="2.4" class="st" stroke-width=".7"/>`).join('')}</g>`);
}

const cypresses = [];

function drawCypress() {
  [-1, 1].forEach(side => {
    const g = $(side < 0 ? 'cypressL' : 'cypressR');
    for (let i = 8; i >= 0; i--) {
      const z = .02 + i * .118, y = lerp(440, 337, z), x = 800 + side * lerp(176, 52, z);
      const h = lerp(128, 24, z), w = lerp(26, 6, z);

}

/* ---------------- ③ 角色：遊客（紗麗、旁遮普套裝 salwar kameez、庫爾塔長衫、觀光客） ----------------
   原點在腳底、面向右邊；legL／legR 以髖部為軸擺動，arm 可以舉手機，umb 是下雨用的傘 */
function personSVG(o) {
  const skin = `var(--skin${o.skin || 2})`, hair = `var(--hair${o.hair || 1})`;
  const c = `var(--${o.c || 'c1'})`, c2 = `var(--${o.c2 || 'c8'})`;
  const shoe = 'var(--shoe)';
  let s = `<ellipse cx="0" cy="0" rx="11" ry="2.4" class="f-shadow"/>`;
  // —— 腿 ——
  if (o.kind === 'sari') {
    [-2, 2].forEach((x, i) => s += `<g class="${i ? 'legR' : 'legL'}"><path d="M${x} -7 V-1.5" style="stroke:${skin}" stroke-width="2.6" stroke-linecap="round"/><path d="M${x - 2.6} -1 h5" style="stroke:${shoe}" stroke-width="2.2" stroke-linecap="round"/></g>`);
  } else {
    const pants = o.kind === 'casual' ? 'var(--jeans)' : o.kind === 'guard' ? 'var(--khaki)' : o.kind === 'kurta' ? 'var(--c8)' : o.kind === 'salwar' ? c2 : skin;
    [-2.4, 2.4].forEach((x, i) => {
      s += `<g class="${i ? 'legR' : 'legL'}"><path d="M${x} -26 L${x * 1.2} -1.5" style="stroke:${pants}" stroke-width="4.4" stroke-linecap="round"/>`;
      if (o.kind === 'tourist') s += `<path d="M${x} -26 L${x * 1.08} -17" style="stroke:var(--khaki)" stroke-width="5.4"/>`;
      s += `<path d="M${x * 1.2 - 2.4} -1 h5.2" style="stroke:${shoe}" stroke-width="2.4" stroke-linecap="round"/></g>`;
    });
  }
  // —— 身體 ——
  if (o.pack) s += `<path d="M-13 -47 h7 v17 h-7 Z" style="fill:var(--${o.pack})"/><path d="M-13 -47 h7 v17 h-7 Z" class="st" stroke-width=".8"/>`;
  if (o.kind === 'sari') {
    const sk = 'M-6 -30 Q-9 -15 -10.5 -3 H10.5 Q9 -15 6 -30 Z', bl = 'M-6.5 -48 Q-7.6 -40 -6.5 -30 H6.5 Q7.6 -40 6.5 -48 Q0 -50.5 -6.5 -48 Z';
    s += `<path d="${sk}" style="fill:${c}"/><path d="M-1 -26 L-2 -4 M2 -26 L2.6 -4 M5 -26 L6.6 -4" style="stroke:#000;stroke-opacity:.14" stroke-width="1"/><path d="M-10 -5 H10" style="stroke:var(--thread-gold)" stroke-width="2.4" stroke-dasharray="3 1.2"/><path d="${sk}" class="st" stroke-width=".9"/>`;
    s += `<path d="${bl}" style="fill:${c2}"/><path d="${bl}" class="st" stroke-width=".9"/>`;
    // 披在肩上的紗麗尾端（pallu），金色滾邊
    s += `<path d="M6 -30 L-6.5 -48 L-2.4 -50 L7.4 -36 Z" style="fill:${c}"/><path d="M-6.5 -48 Q-11 -36 -9.5 -21 L-5.5 -23 Q-6.5 -36 -2.4 -50 Z" style="fill:${c}"/><path d="M-9.5 -21 L-5.5 -23 M7.4 -36 L-2.4 -50" style="stroke:var(--thread-gold)" stroke-width="1.6" stroke-dasharray="2.4 1"/>`;
  } else if (o.kind === 'salwar' || o.kind === 'kurta') {
    const tu = 'M-7 -48 Q-8.6 -34 -9 -15 H9 Q8.6 -34 7 -48 Q0 -50.5 -7 -48 Z';
    s += `<path d="${tu}" style="fill:${c}"/><path d="${tu}" class="st" stroke-width=".9"/>`;
    if (o.kind === 'salwar') s += `<path d="M-3 -48 Q0 -43 3 -48 M-9 -16 H9" style="stroke:var(--thread-gold);fill:none" stroke-width="1.4" stroke-dasharray="2 1.2"/><path d="M-7 -47 Q0 -39 7 -47 M-7 -47 Q-10.5 -36 -9.5 -25" style="stroke:${c2};fill:none" stroke-width="3" stroke-linecap="round"/>`;
    else s += `<path d="M1 -48 V-38" style="stroke:#000;stroke-opacity:.25" stroke-width="1"/><circle cx="1" cy="-45" r=".7" fill="#000" opacity=".3"/><circle cx="1" cy="-41" r=".7" fill="#000" opacity=".3"/>`;
  } else {
    const col = o.kind === 'guard' ? 'var(--khaki)' : c;
    const tor = 'M-7 -48 Q-8.6 -36 -7 -24 L7 -24 Q8.6 -36 7 -48 Q0 -50.5 -7 -48 Z';
    s += `<path d="${tor}" style="fill:${col}"/><path d="${tor}" class="st" stroke-width=".9"/>`;
    if (o.kind === 'guard') s += `<path d="M-7 -26 H7" style="stroke:var(--khakiDk)" stroke-width="2.2"/><rect x="2" y="-45" width="4" height="3" style="fill:var(--thread-gold)"/>`;

  // —— 頭 ——
  const H = -55;
  if (o.kind !== 'turban' && o.long) s += `<path d="M-5 ${H - 1} Q-9 ${H + 9} -7 ${H + 20}" style="stroke:${hair};fill:none" stroke-width="3.4" stroke-linecap="round"/>`;

const DAY_SEC = 150;

      if (p.x > 990) { p.x = 990; p.dir = -1; p.wait = rand(1, 4); }
      if (p.x < 612) { p.x = 612; p.dir = 1; p.wait = rand(1, 4); }
      if (Math.random() < dt * .08) p.wait = rand(1.5, 4);
    }
    p.el.setAttribute('transform', `translate(${f1(p.x)} ${f1(p.y + (p.wait > 0 ? 0 : -Math.abs(Math.sin(p.ph)) * .5))}) scale(${p.dir} 1)`);
  });
}
// 獼猴：坐著搔癢、沿著牆走、被點到會跳到別處
function updateMonkeys(dt) {
  monkeys.forEach(m => {
    let y = 296;
    if (m.state === 'jump') {
      m.jt += dt;
      const k = clamp(m.jt / .9, 0, 1);
      m.x = lerp(m.jx0, m.jx1, k); y = 296 - Math.sin(k * Math.PI) * 46;
      if (k >= 1) { m.state = 'sit'; m.t = rand(2, 5); }
    } else if (m.state === 'walk') {
      const d = m.tx - m.x;
      m.dir = Math.sign(d) || m.dir;
      m.x += m.dir * Math.min(Math.abs(d), 18 * dt);
      m.ph += dt * 9;
      m.legs.forEach((l, i) => l.setAttribute('transform', `rotate(${f1(Math.sin(m.ph + (i % 2) * Math.PI) * 20)} ${[-7, 6, -4, 8][i]} -6)`));
      if (Math.abs(d) < 1) { m.state = 'sit'; m.t = rand(2.5, 6); }
    } else {
      m.t -= dt;
      m.sarm.setAttribute('transform', `rotate(${f1(Math.sin(clock * 6 + m.x) > .6 ? -40 : 0)} 3 -14)`);
      if (m.t <= 0) { m.state = 'walk'; m.tx = rand(m.a, m.b); }
    }
    const sitting = m.state === 'sit';
    m.walk.style.display = sitting ? 'none' : ''; m.sit.style.display = sitting ? '' : 'none';
    m.el.setAttribute('transform', `translate(${f1(m.x)} ${f1(y)}) scale(${f1(m.s * m.dir)} ${m.s})`);
  });
}
// 松鼠：跑一小段、停下來甩尾巴
function updateSquirrels(dt) {
  squirrels.forEach(q => {
    q.t -= dt;
    if (q.t <= 0 && q.v === 0) { q.tx = rand(q.a, q.b); q.v = q.boost > 0 ? 160 : rand(60, 90); q.dir = Math.sign(q.tx - q.x) || 1; }
    if (q.v > 0) {
      const d = q.tx - q.x;
      q.x += q.dir * Math.min(Math.abs(d), q.v * dt);
      q.ph += dt * 26;
      if (Math.abs(d) < 1) { q.v = 0; q.t = rand(1, 4); q.boost = 0; }
    }
    const hop = q.v > 0 ? -Math.abs(Math.sin(q.ph)) * 3 : 0;
    q.tail.setAttribute('transform', q.v > 0 ? 'rotate(-12 -6 -4)' : `rotate(${f1(Math.sin(clock * 9 + q.x) > .7 ? 10 : 0)} -6 -4)`);
    q.el.setAttribute('transform', `translate(${f1(q.x)} ${f1(q.y + hop)}) scale(${f1(q.s * q.dir)} ${q.s})`);
  });
}
// 園丁：拿竹掃帚邊走邊掃
function updateGardener(dt) {
  const g = gardener;
  g.t = (g.t || 0) - dt;
  if (g.t <= 0) { g.walking = !g.walking; g.t = g.walking ? rand(1.6, 3) : rand(3, 6); if (g.walking) { g.dir = g.x > 610 ? -1 : g.x < 540 ? 1 : pick([-1, 1]); } }
  const fast = g.fast > 0; if (fast) g.fast -= dt;
  if (g.walking) { g.x = clamp(g.x + g.dir * 10 * dt, 530, 625); g.ph += stepPh(10, dt, .56); walkLegs(g, g.ph, 16); }
  else walkLegs(g, 0, 0);
  g.arm.setAttribute('transform', `rotate(${f1(-10 + Math.sin(clock * (fast ? 9 : 3.2)) * 16)} 3 -46)`);
  g.el.setAttribute('transform', `translate(${f1(g.x)} 432) scale(${f1(.56 * g.dir)} .56)`);
}

function say(x, y, text, dur = 1.6) {
  const g = el('g', { class: 'bubble' }, $('bubbles'));
  const inner = el('g', { class: 'pop', style: `--dur:${dur}s` }, g);
  const t = el('text', { x: 0, y: 0 }, inner);
  t.textContent = text;
  const w = Math.max(44, (t.getComputedTextLength() || text.length * 15) + 24);
  const r = el('rect', { x: f1(-w / 2), y: -15, width: f1(w), height: 30, rx: 15 });
  inner.insertBefore(r, t);
  x = clamp(x, w / 2 + 20, 1600 - w / 2 - 20); y = clamp(y, 34, 566);
  g.setAttribute('transform', `translate(${f1(x)} ${f1(y)})`);
  setTimeout(() => g.remove(), dur * 1000);
}

function loop(now) {

}
function settle(sec) { for (let s = 0; s < sec; s += .05) step(.05); }

function start() {
  cancelAnimationFrame(rafId);
