<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>曼谷運河水上市場</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-26 曼谷運河水上市場｜刺繡布藝風
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   風格重點：亞麻布底紋、貼布（appliqué）色塊、虛線平針縫邊、
            緞面繡的斜向絲線光澤、法式結粒繡的圓點（樹叢、鄭王廟瓷片）、
            長短針繡的天空色帶、跑針繡的水波。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），
   部分另有 --k-名稱（晨昏）。JS 會依時間內插，輸出成 --名稱，
   並自動產生 .f-名稱（填色）、.s-名稱（描邊）兩個 class。
   ========================================================= */
:root{
  color-scheme: dark;

  /* —— 布料與繡線（不隨日夜變化） —— */
  --linen:#efe4cc;        /* 亞麻布底色 */
  --thread-gold:#e6b34a;  /* 金線：鄭王廟尖頂、船頭彩帶 */
  --thread-red:#cf3f37;
  --thread-green:#3f9450;
  --thread-blue:#3d6fb4;
  --thread-pink:#e57aa2;
  --thread-orange:#ef8a2a;
  --thread-purple:#8150aa;
  --thread-white:#fffaf0;

  /* —— 鄭王廟瓷片（法式結粒繡的彩色圓點） —— */
  --mos-1:#e86f8f; --mos-2:#4a86c8; --mos-3:#5fae62; --mos-4:#f0c14a; --mos-5:#e98a3c;

  /* —— 天空：四道長短針繡色帶（由上而下） —— */
  --d-sky-1:#6aaed4; --k-sky-1:#57609e; --n-sky-1:#101a3c;
  --d-sky-2:#86c0dd; --k-sky-2:#a7779f; --n-sky-2:#16224a;
  --d-sky-3:#aed6e6; --k-sky-3:#ec9b7c; --n-sky-3:#1d2b58;
  --d-sky-4:#dcebe2; --k-sky-4:#ffc477; --n-sky-4:#283969;
  --d-cloud:#fcf7ec;  --k-cloud:#ffd8b6; --n-cloud:#38457a;
  --d-cloud-sh:#d7cfbd; --n-cloud-sh:#232d58;
  --d-storm:#6c7886;  --n-storm:#1b2238;   /* 雷雨雲 */
  --d-storm-2:#8a95a0; --n-storm-2:#252d48;

  /* —— 繡線描邊（虛線平針） —— */
  --d-stitch:#5a4536;   --n-stitch:#0b1026;
  --d-stitch-lt:#fffaf0; --n-stitch-lt:#8a98cc;

  /* —— 主角：鄭王廟（白天米白瓷，夜晚打上金色投射燈） —— */
  --d-temple:#f2ebdc;    --n-temple:#f6bd62;
  --d-temple-sh:#d8cab0; --n-temple-sh:#cc8636;
  --d-temple-dk:#a8957c; --n-temple-dk:#7e4620;
  --d-niche:#7d6a58;     --n-niche:#5a2c16;
  --d-glow:#ffd88000;    --n-glow:#ffb54acc;  /* 夜間光暈 */
  --d-hall-roof:#e07a2e; --n-hall-roof:#7a3a20; /* 佛殿屋頂（橘綠琉璃瓦） */
  --d-hall-roof2:#3f8a52; --n-hall-roof2:#1f3d2a;
  --d-hall-wall:#f6f0e2; --n-hall-wall:#e8a650;

  /* —— 樹木與植物 —— */
  --d-tree-1:#2e6a3b; --n-tree-1:#0e2820;
  --d-tree-2:#4a8b45; --n-tree-2:#163828;
  --d-tree-3:#7db352; --n-tree-3:#22472e;
  --d-palm:#3b7a39;   --n-palm:#11301e;
  --d-trunk:#8c6b48;  --n-trunk:#2c2430;

  /* —— 運河高腳屋 —— */
  --d-wood-1:#9f673b; --n-wood-1:#3a2828;
  --d-wood-2:#c58a52; --n-wood-2:#4a3430;
  --d-wood-dk:#67402a; --n-wood-dk:#20161c;
  --d-roof-1:#c4553b; --n-roof-1:#4a2430;   /* 紅陶瓦 */
  --d-roof-2:#8ea3ad; --n-roof-2:#2b3450;   /* 鐵皮浪板 */
  --d-roof-3:#d68a3a; --n-roof-3:#4e3126;
  --d-win:#3a2a22;    --n-win:#ffcd6c;      /* 窗：夜晚亮燈 */
  --d-stilt:#5b4030;  --n-stilt:#1c1520;

  /* —— 運河水面 —— */
  --d-water-1:#4f8e7b; --k-water-1:#8a6e86; --n-water-1:#0f2236;
  --d-water-2:#5d9c85; --k-water-2:#c58a78; --n-water-2:#13293f;
  --d-water-3:#3e7967; --n-water-3:#0a1a2a;
  --d-water-hi:#d2eadb; --n-water-hi:#5a74a8;
  --d-refl:#f2ebdc;    --n-refl:#ffc25a;    /* 倒影：夜晚金色 */

  /* —— 前景木棧碼頭 —— */
  --d-plank:#b98755;   --n-plank:#3d2d2c;
  --d-plank-2:#a47547; --n-plank-2:#33252a;
  --d-plank-dk:#6e4a2e; --n-plank-dk:#1b1318;
  --d-shadow:#00000022; --n-shadow:#00000066;

  /* —— 光源 —— */
  --sun:#ffd24a; --sun-ring:#ffb12c;
  --moon:#fff4d6; --star:#fff6dc;
  --lamp:#ffd27a; --flame:#ffb43a; --flame-core:#fff3c4;

  /* —— 天氣 —— */
  --d-rainc:#5d7fa0; --n-rainc:#a3b6e2;
  --wx-cloud:#7c8a8c; --wx-storm:#29344a; --bolt:#fff8d0;

  /* —— 角色：膚色、髮色 —— */
  --skin-1:#f0c9a0; --skin-2:#d9a274; --skin-3:#b47a4e; --skin-4:#7f5436;
  --hair-1:#1f1a1c; --hair-2:#4a3226; --hair-3:#c9a35c; --hair-4:#b9b2a8;
  /* 衣著 */
  --mohom:#2a3e74; --mohom-2:#3b5592;    /* 靛藍粗布衫（Mor Hom） */
  --ngob:#dcb874; --ngob-dk:#a8844a;     /* 斗笠（Ngob） */
  --saffron:#e8902a; --saffron-dk:#bf6614; /* 僧袍 */
  --shirt-1:#e2574c; --shirt-2:#f2c14e; --shirt-3:#3f9e8f; --shirt-4:#f4f1e8; --shirt-5:#8b6fc4; --shirt-6:#4f8fd0;
  --pants-1:#2c2f3e; --pants-2:#6a5c4a; --pasin:#7b2f4a; --pasin-2:#e0a43c;
  --vest:#f07a24;   /* 救生衣 */
  --umb-1:#e2574c; --umb-2:#f2c14e; --umb-3:#3f9e8f; --umb-4:#8b6fc4;

  /* —— 船隻 —— */
  --hull:#5a3a26; --hull-2:#7a5034; --hull-in:#3b2418;
  --lt-hull:#2f6a8e; --lt-hull-2:#e8e1cf;  /* 長尾船船身 */
  --engine:#7b8288; --engine-2:#c8423a; --canopy:#2f82c4;

  /* —— 攤販貨物 —— */
  --mango:#f4c430; --banana:#ecd24a; --rambutan:#d4362b; --mangosteen:#5b2a48;
  --coconut:#6fa040; --pomelo:#b9d36a; --jasmine:#fffbea; --marigold:#f39a1e; --orchid:#a85ac6;
  --thaitea:#e98638; --leaf:#4f9a3a; --steel:#bcc3c8; --charcoal:#3a3532; --rice:#fbf8ee;

  /* —— 煙火、水燈、潑水 —— */
  --fw-1:#ff6b6b; --fw-2:#ffd25a; --fw-3:#6fe0c8; --fw-4:#fff6dc; --fw-5:#ff9ad8;
  --splash:#bfe6ff;

  /* —— 頁面介面 —— */
  --page-bg:#1b1916; --page-fg:#f3e8d2; --page-muted:#b3a68c;
  --ui-surface:#26221d; --ui-line:#413a30; --ui-accent:#e6b34a; --ui-hot:#cf3f37;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border:1px solid var(--ui-line);border-radius:10px;overflow:hidden;background:var(--linen);line-height:0}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:10px;padding:10px 14px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px dashed var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--page-bg);font-weight:700}
.panel button.big{border-style:solid;border-color:var(--ui-hot);color:#fff;background:var(--ui-hot);font-weight:700}
.panel button.big.on{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--page-bg)}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
/* 畫面內可點物件：滑鼠點不顯示外框，用鍵盤 Tab 時才顯示 */
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid var(--ui-accent);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable,#scene [role="button"]{cursor:pointer}
/* 繡線描邊：虛線平針 */
#scene .st{fill:none;stroke:var(--stitch);stroke-width:1.3;stroke-dasharray:4 2.6;stroke-linecap:round}
#scene .st-lt{fill:none;stroke:var(--stitch-lt);stroke-width:1.2;stroke-dasharray:3.5 3;stroke-linecap:round;opacity:.75}
/* 對話泡泡：縫在布上的小標籤 */
#scene .bubble rect{fill:var(--thread-white);stroke:var(--stitch);stroke-width:1.6;stroke-dasharray:5 3}
#scene .bubble text{fill:#3a2a22;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .bubble .pop{animation:pop var(--dur,1.6s) ease-out forwards}
@keyframes pop{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  #scene .bubble .pop{animation:none}
}
</style>
<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。
   想恢復完整版，刪掉這整段 <style id="pure-art"> 即可。
   ========================================================= */
html,body{height:100%;margin:0!important;overflow:hidden}
body{display:flex!important;align-items:center;justify-content:center;padding:0!important}
body>.wrap{width:100%!important;max-width:min(100vw,calc(100vh * 8 / 3))!important;
  margin:0!important;padding:0!important;gap:0!important;display:block!important}
body>.wrap>:not(.stage){display:none!important}
body>.wrap>.stage{width:100%!important;max-width:100%!important;margin:0!important;
  border:0!important;border-radius:0!important;box-shadow:none!important}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：天空 → 煙火 → 鄭王廟 → 樹叢 → 對岸高腳屋
       → 運河（四條航道，由遠到近）→ 前景木棧碼頭與人物
       → 天氣 → 亞麻布紋
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="刺繡布藝風格的曼谷運河水上市場動畫：遠方是鄭王廟高聳的主塔與兩座小塔，塔身綴滿彩色瓷片；運河對岸是木造高腳屋、椰子樹和香蕉樹；運河上有船頭綁著彩帶的長尾船載著遊客駛過，戴斗笠、穿靛藍粗布衫的小販划著小船賣水果、船麵、椰奶煎餅、烤肉串、泰式奶茶和花環；前景木棧碼頭上有遊客、吃麵的客人、椰子冰淇淋攤和土地公小屋">
    <defs>
      <!-- 緞面繡：斜向絲線光澤（疊在色塊上） -->
      <pattern id="satinA" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
        <rect width="5" height="1.4" fill="#ffffff" opacity=".16"/><rect y="2.5" width="5" height=".8" fill="#000000" opacity=".07"/>
      </pattern>
      <pattern id="satinB" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
        <rect width="5" height="1.4" fill="#ffffff" opacity=".16"/><rect y="2.5" width="5" height=".8" fill="#000000" opacity=".07"/>
      </pattern>
      <pattern id="satinV" width="4" height="6" patternUnits="userSpaceOnUse">
        <rect width="1.2" height="6" fill="#ffffff" opacity=".15"/><rect x="2.2" width=".7" height="6" fill="#000000" opacity=".07"/>
      </pattern>
      <!-- 長短針繡：天空與水面的橫向針腳 -->
      <pattern id="longShort" width="36" height="8" patternUnits="userSpaceOnUse">
        <rect x="1" y="1" width="20" height="1.6" rx=".8" fill="#ffffff" opacity=".16"/>
        <rect x="18" y="5" width="16" height="1.6" rx=".8" fill="#ffffff" opacity=".12"/>
        <rect x="24" y="1.6" width="9" height=".8" fill="#000000" opacity=".05"/>
      </pattern>
      <!-- 木板紋：碼頭與高腳屋的木頭 -->
      <pattern id="woodGrain" width="40" height="10" patternUnits="userSpaceOnUse">
        <path d="M0 3 Q10 1.5 20 3 T40 3 M0 7.5 Q12 6 22 7.5 T40 7.5" stroke="#000000" stroke-opacity=".12" stroke-width=".9" fill="none"/>
      </pattern>
      <!-- 竹編籃 -->
      <pattern id="weave" width="6" height="6" patternUnits="userSpaceOnUse">
        <rect width="6" height="6" fill="#b88a4a"/><path d="M0 0 L6 6 M6 0 L0 6" stroke="#7a5626" stroke-width="1.1"/>
      </pattern>
      <!-- 泰國傳統筒裙（Pha Sin）橫紋 -->
      <pattern id="pasin" width="10" height="7" patternUnits="userSpaceOnUse">
        <rect width="10" height="7" style="fill:var(--pasin)"/><rect y="4.5" width="10" height="1.6" style="fill:var(--pasin-2)"/>
      </pattern>
      <!-- 潑水節的花襯衫 -->
      <pattern id="floral" width="12" height="12" patternUnits="userSpaceOnUse">
        <rect width="12" height="12" fill="#3aa7d8"/><circle cx="3" cy="3" r="2.2" fill="#ffe14a"/><circle cx="9" cy="9" r="2.2" fill="#ff6fa8"/><circle cx="9" cy="3" r="1" fill="#ffffff"/>
      </pattern>
      <!-- 亞麻布紋：由程式用 canvas 產生後填入 href -->
      <pattern id="linenPat" width="200" height="200" patternUnits="userSpaceOnUse">
        <image id="linenImg" width="200" height="200" href=""/>
      </pattern>
      <!-- 水燈的燭光、夜燈光暈 -->
      <radialGradient id="glowG"><stop offset="0" stop-color="#ffd27a" stop-opacity=".9"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
      <radialGradient id="templeGlow"><stop offset="0" style="stop-color:var(--glow)"/><stop offset="1" stop-color="#ffb54a" stop-opacity="0"/></radialGradient>
      <!-- 貼布投影：讓靜態的大片布塊像疊在底布上（只用在不會動的圖層，效能較好） -->
      <filter id="appl" x="-5%" y="-5%" width="110%" height="115%">
        <feDropShadow dx="1.2" dy="2" stdDeviation="1.1" flood-color="#2a1a10" flood-opacity=".32"/>
      </filter>
      <clipPath id="frameClip"><rect x="0" y="0" width="1600" height="600"/></clipPath>
      <clipPath id="waterClip"><rect x="0" y="352" width="1600" height="170"/></clipPath>
    </defs>

    <g clip-path="url(#frameClip)">
    <!-- ===== 場景：天空 ===== -->
    <g id="skyBands"></g>
    <rect id="skyHit" x="0" y="0" width="1600" height="250" fill="transparent" class="clickable" tabindex="0" role="button" aria-label="天空：白天飛過一群鳥，夜晚劃過流星，雷雨時打雷"/>
    <g id="stars" pointer-events="none"></g>
    <g id="sun" pointer-events="none"></g>
    <g id="moon" pointer-events="none"></g>
    <g id="clouds" pointer-events="none"></g>
    <g id="overcast" pointer-events="none" opacity="0"></g>
    <g id="bolt" pointer-events="none" opacity="0"></g>
    <g id="fireworks" pointer-events="none"></g>
    <g id="birds" pointer-events="none"></g>

    <!-- ===== 場景：鄭王廟與遠景（滑鼠移動時有輕微視差） ===== -->
    <g id="parFar">
      <ellipse id="tGlow" cx="800" cy="200" rx="330" ry="210" fill="url(#templeGlow)" pointer-events="none" opacity="0"/>
      <g id="temple" filter="url(#appl)"></g>
      <g id="templeLights" pointer-events="none"></g>
      <rect id="templeHit" x="690" y="40" width="220" height="250" fill="transparent" class="clickable" tabindex="0" role="button" aria-label="鄭王廟：寺鐘響起，塔身的瓷片閃閃發亮"/>
      <g id="treeLine" filter="url(#appl)"></g>
    </g>
    <g id="parMid">
      <g id="houses" filter="url(#appl)"></g>
      <g id="houseLife"></g>
      <g id="palmsFront"></g>
    </g>

    <!-- ===== 場景：運河（由遠到近四條航道，船頭朝前進方向） ===== -->
    <g id="water"></g>
    <g id="refl" pointer-events="none" clip-path="url(#waterClip)"></g>
    <g id="waterStitch" pointer-events="none"></g>
    <rect id="waterHit" x="0" y="352" width="1600" height="168" fill="transparent" class="clickable"/>
    <g id="ripples" pointer-events="none"></g>
    <g id="hyacinths"></g>
    <g id="laneA"></g>
    <g id="laneB"></g>
    <g id="lizard"></g>
    <g id="kratFar" pointer-events="none"></g>
    <g id="laneC"></g>
    <g id="laneD"></g>
    <g id="kratNear" pointer-events="none"></g>
    <g id="splashes" pointer-events="none"></g>

    <!-- ===== 場景：前景木棧碼頭、攤位、人物 ===== -->
    <g id="parNear">
      <g id="pier" filter="url(#appl)"></g>
      <g id="pierFront"></g>
      <g id="people"></g>
      <g id="spirit"></g>
    </g>
    <g id="steam" pointer-events="none"></g>
    <g id="water-arcs" pointer-events="none"></g>

    <!-- ===== 天氣與氛圍 ===== -->
    <g id="rain" pointer-events="none" opacity="0"></g>
    <g id="wxTint" pointer-events="none"></g>
    <rect id="flash" x="0" y="0" width="1600" height="600" style="fill:var(--bolt)" opacity="0" pointer-events="none"/>
    <g id="notes" pointer-events="none"></g>
    <g id="bubbles" pointer-events="none"></g>
    </g>

    <!-- ===== 布藝質感：亞麻布紋＋四周的鎖邊針腳 ===== -->
    <rect x="0" y="0" width="1600" height="600" fill="url(#linenPat)" pointer-events="none"/>
    <rect x="7" y="7" width="1586" height="586" fill="none" style="stroke:var(--thread-gold)" stroke-width="2.4" stroke-dasharray="9 5" pointer-events="none" opacity=".85"/>
  </svg>
  </figure>

  <!-- ===== 互動：控制列 ===== -->
  <div class="panel">
    <button id="btnLoy" class="big" type="button">🪷 水燈節</button>
    <button id="btnSong" class="big" type="button">💦 潑水節</button>
    <button id="btnFleet" type="button">🛶 叫賣船隊</button>
    <button id="btnMonk" type="button">🙏 晨間布施</button>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);
      }
      return _conn.call(this, dest, ...a);
    };
  }
  function stopAudio() {
    let longs = [], ctx = null;
    for (const s of srcs) {
      const c = s.context, now = c.currentTime, m = s.__ss; ctx = c;
      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }
    if (longs.length && ctx) {
      const g = outs.get(ctx), now = ctx.currentTime;
      if (g) {
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 1.1); g.gain.setValueAtTime(0, now + 1.2);
        g.gain.linearRampToValueAtTime(1, now + 1.9);
      }
      longs.forEach(s => { try { s.stop(now + 1.15); } catch (e) {} srcs.delete(s); });
    }
    srcs.clear();
  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');
    // 凍結色票：把目前的 CSS 變數抄到殘影上，底下換色不影響殘影
    const cs = getComputedStyle(svg);
    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }
      }
    }
    const par = svg.parentElement;
    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });
    added = [];
  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>
/* =========================================================
   SC-26 曼谷運河水上市場｜程式區
   區塊：①工具與色票 ②場景（天空、鄭王廟、樹叢、高腳屋、運河、碼頭）
         ③角色（小販船、長尾船、僧人、行人、巨蜥、白鷺、布袋蓮）
         ④動畫（日夜、天氣、水燈節、潑水節、環境）⑤互動（點擊、滑鼠、聲音、控制列）
   ========================================================= */
(() => {
'use strict';

/* ---------------- ① 工具與色票 ---------------- */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const root = document.documentElement;
const svg = $('scene');
const BANK = 352;          // 對岸水線＝運河水面頂
const DECK = 522;          // 前景碼頭邊緣
const TX = 800;            // 鄭王廟主塔中心 x
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
let seed = 20261126;  // 固定亂數：每次開啟構圖一樣
const srand = (a = 0, b = 1) => { seed = (seed * 16807) % 2147483647; return a + (seed / 2147483647) * (b - a); };
const f1 = n => (+n).toFixed(1);
function el(tag, attrs = {}, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function frag(parent, html) { parent.insertAdjacentHTML('beforeend', html); return parent.lastElementChild; }
// 刺繡色塊：底色＋緞面光澤＋虛線縫邊（三層同一個形狀）
function patch(d, fillCls, sat = 'satinA', stitch = 'st') {
  return `<path d="${d}" class="${fillCls}"/>${sat ? `<path d="${d}" fill="url(#${sat})"/>` : ''}${stitch ? `<path d="${d}" class="${stitch}"/>` : ''}`;
}
function patchS(d, style, sat = 'satinA', stitch = 'st') {
  return `<path d="${d}" style="${style}"/>${sat ? `<path d="${d}" fill="url(#${sat})"/>` : ''}${stitch ? `<path d="${d}" class="${stitch}"/>` : ''}`;
}

// 讀取色票、內插混色
const css = n => getComputedStyle(root).getPropertyValue(n).trim();
const hex = h => {
  h = h.replace('#', '');
  if (h.length === 3) h = [...h].map(c => c + c).join('');
  const n = parseInt(h.slice(0, 6), 16);
  return [n >> 16 & 255, n >> 8 & 255, n & 255, h.length === 8 ? parseInt(h.slice(6), 16) / 255 : 1];
};
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgba = c => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${(c[3] ?? 1).toFixed(3)})`;
// 成對色票：自動找出所有 --d-xxx，配對 --n-xxx（與選用的 --k-xxx）
const PAIRS = {};
(() => {
  const names = [];
  for (const sheet of document.styleSheets) {
    try { for (const r of sheet.cssRules) if (r.selectorText === ':root') for (const p of r.style) if (p.startsWith('--d-')) names.push(p.slice(4)); } catch (e) {}
  }
  let cls = '';
  names.forEach(k => {
    const k2 = css('--k-' + k);
    PAIRS[k] = { d: hex(css('--d-' + k)), n: hex(css('--n-' + k)), k: k2 ? hex(k2) : null };
    cls += `#scene .f-${k}{fill:var(--${k})}#scene .s-${k}{stroke:var(--${k});fill:none}`;
  });
  const st = document.createElement('style'); st.textContent = cls; document.head.appendChild(st);
})();

/* 動態偏好 */
const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
let reduced = mq.matches;

/* 亞麻布紋：用 canvas 畫出經緯線與細小的纖維結點，做成重複貼圖 */
function makeLinen() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 200;
    const x = c.getContext('2d');
    for (let i = 0; i < 200; i += 2) {
      x.fillStyle = `rgba(255,248,230,${(.05 + Math.random() * .07).toFixed(3)})`; x.fillRect(0, i, 200, 1);
      x.fillStyle = `rgba(60,40,20,${(.03 + Math.random() * .05).toFixed(3)})`; x.fillRect(i, 0, 1, 200);
    }
    for (let i = 0; i < 900; i++) {
      x.fillStyle = Math.random() < .5 ? 'rgba(60,40,20,.10)' : 'rgba(255,250,235,.14)';
      x.fillRect(Math.random() * 200, Math.random() * 200, 1 + Math.random() * 3, 1);
    }
    $('linenImg').setAttribute('href', c.toDataURL('image/png'));
  } catch (e) {}
}

/* ---------------- ② 場景：天空（長短針繡色帶、太陽、月亮、貼布雲） ---------------- */
const stars = [], clouds = [];
function drawSky() {
  const bands = [[0, 80], [80, 160], [160, 235], [235, 340]];

/* ---------------- ② 場景：鄭王廟（Wat Arun） ----------------
   主塔（Prang）是高棉式的玉米形尖塔：底下三層台基與陡梯，塔身一圈圈橫帶綴滿彩色瓷片，
   中段有壁龕，塔頂是細長尖頂與三叉戟；前後各有兩座小塔。旁邊露出泰式佛殿的橘綠屋頂。 */
function prang(cx, baseY, h, w, tiers, small) {
  const bodyH = h * .8;
  const hw = f => w / 2 * (1 - .9 * Math.pow(f, 1.7));
  let L = [], R = [];
  for (let i = 0; i <= 20; i++) { const f = i / 20, y = baseY - f * bodyH; L.push(`${f1(cx - hw(f))} ${f1(y)}`); R.unshift(`${f1(cx + hw(f))} ${f1(y)}`); }
  const body = `M${L.join(' L')} L${R.join(' L')} Z`;
  let s = '';
  // 台基：三層，越往下越寬，上緣一排欄杆（短直針）
  const tb = small ? [[1.3, 10], [1.7, 10]] : [[1.3, 16], [1.75, 18], [2.3, 22]];
  let ty = baseY;
  tb.forEach(([k, th], i) => {
    const tw = w * k;
    s += patch(`M${f1(cx - tw / 2)} ${ty} H${f1(cx + tw / 2)} V${ty + th} H${f1(cx - tw / 2)} Z`, i % 2 ? 'f-temple' : 'f-temple-sh', 'satinV');
    let rail = '';
    for (let x = cx - tw / 2 + 4; x < cx + tw / 2 - 2; x += 5) rail += `M${f1(x)} ${ty + 1} V${ty + 5} `;
    s += `<path d="${rail}" class="s-temple-dk" stroke-width="1.3"/>`;
    // 瓷片圓點
    for (let x = cx - tw / 2 + 6, j = 0; x < cx + tw / 2 - 4; x += 9, j++) s += `<circle cx="${f1(x)}" cy="${ty + th * .65}" r="1.7" style="fill:var(--mos-${1 + j % 5})"/>`;
    ty += th;
  });
  // 中央陡梯
  const sw = w * (small ? .14 : .12);
  s += `<path d="M${f1(cx - sw / 2)} ${f1(baseY - bodyH * .18)} H${f1(cx + sw / 2)} L${f1(cx + sw * .8)} ${ty} H${f1(cx - sw * .8)} Z" class="f-temple-dk"/>`;
  let st = '';
  for (let y = baseY - bodyH * .18 + 3; y < ty; y += 4) st += `M${f1(cx - sw * .7)} ${f1(y)} H${f1(cx + sw * .7)} `;
  s += `<path d="${st}" class="s-temple" stroke-width="1.2"/>`;
  // 塔身
  s += patch(body, 'f-temple', 'satinV');
  // 一圈圈橫帶＋瓷片（法式結粒繡）
  for (let i = 1; i <= tiers; i++) {
    const f = i / (tiers + 1), y = baseY - f * bodyH, th = bodyH / (tiers + 1) * .42;
    const a = hw(f), b = hw(f + th / bodyH);
    s += `<path d="M${f1(cx - a)} ${f1(y)} H${f1(cx + a)} L${f1(cx + b)} ${f1(y - th)} H${f1(cx - b)} Z" class="f-temple-sh"/>`;
    const n = Math.max(2, Math.floor(a * 2 / 6.5));
    for (let j = 0; j < n; j++) { const x = cx - a + 3 + j * (a * 2 - 6) / Math.max(1, n - 1); s += `<circle cx="${f1(x)}" cy="${f1(y - th / 2)}" r="${small ? 1.4 : 1.8}" style="fill:var(--mos-${1 + (i + j) % 5})"/>`; }
    s += `<path d="M${f1(cx - a)} ${f1(y)} H${f1(cx + a)}" class="st" stroke-width="1"/>`;
  }
  // 壁龕（尖拱）
  if (!small) {
    const ny = baseY - bodyH * .36, nw = w * .2, nh = bodyH * .16;
    s += `<path d="M${f1(cx - nw / 2)} ${f1(ny)} V${f1(ny - nh * .6)} Q${cx} ${f1(ny - nh * 1.3)} ${f1(cx + nw / 2)} ${f1(ny - nh * .6)} V${f1(ny)} Z" class="f-niche"/>
      <path d="M${f1(cx - nw / 2 - 3)} ${f1(ny)} V${f1(ny - nh * .6)} Q${cx} ${f1(ny - nh * 1.45)} ${f1(cx + nw / 2 + 3)} ${f1(ny - nh * .6)} V${f1(ny)}" style="stroke:var(--thread-gold);fill:none" stroke-width="2" stroke-dasharray="3 2"/>`;
  }
  // 尖頂：一串圓珠＋三叉戟
  const top = baseY - bodyH, sp = h - bodyH;
  s += `<path d="M${cx} ${f1(top)} V${f1(top - sp)}" style="stroke:var(--thread-gold)" stroke-width="${small ? 2 : 3}"/>`;
  for (let k = 1; k <= 3; k++) s += `<circle cx="${cx}" cy="${f1(top - sp * k / 4.2)}" r="${small ? 2 : 3}" style="fill:var(--thread-gold)"/>`;
  if (!small) s += `<path d="M${cx - 6} ${f1(top - sp + 10)} Q${cx - 6} ${f1(top - sp + 3)} ${cx} ${f1(top - sp + 4)} Q${cx + 6} ${f1(top - sp + 3)} ${cx + 6} ${f1(top - sp + 10)} M${cx} ${f1(top - sp + 10)} V${f1(top - sp - 4)}" style="stroke:var(--thread-gold);fill:none" stroke-width="1.8" stroke-linecap="round"/>`;
  return s;
}

    s += `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(srand(5, 9))}" class="f-tree-${Math.max(1, k - shade)}"/>`;
  }
  // 結粒的高光點
  for (let i = 0; i < n / 2; i++) { const a = srand(0, Math.PI * 2), d = srand(0, r); s += `<circle cx="${f1(cx + Math.cos(a) * d)}" cy="${f1(cy + Math.sin(a) * d * .7 - 2)}" r="1.3" style="fill:var(--stitch-lt)" opacity=".35"/>`; }
  return s;
}

/* ---------------- ② 場景：運河對岸的木造高腳屋 ---------------- */

function house(x, w, type, hW, opt = {}) {

  s += patch(`M${x} ${top} H${x + w} V${fl} H${x} Z`, opt.alt ? 'f-wood-2' : 'f-wood-1', 'satinV');

  s += `<path d="${planks}" class="s-wood-dk" stroke-width=".8" opacity=".5"/>`;

  const nw = Math.max(1, Math.floor((w - 30) / 44));
  for (let i = 0; i < nw; i++) {
    const wx = x + 16 + i * ((w - 32) / nw) + ((w - 32) / nw - 22) / 2, wy = top + 12;
    s += `<rect x="${f1(wx)}" y="${wy}" width="22" height="22" class="f-win"/><rect x="${f1(wx)}" y="${wy}" width="22" height="22" class="st"/>`;

  }

  if (type === 'tin') {
    const d = `M${x - 10} ${top + 2} L${x + w * .5} ${top - 26} L${x + w + 10} ${top + 2} Z`;
    s += patch(d, 'f-roof-2', null);
    let cor = '';
    for (let px = x - 4; px < x + w + 6; px += 6) { const k = Math.abs(px - (x + w * .5)) / (w * .5 + 10); cor += `M${px} ${f1(top + 2)} V${f1(top - 26 + k * 26 + 2)} `; }
    s += `<path d="${cor}" stroke="#ffffff" stroke-opacity=".22" stroke-width="1.4"/>`;
  } else {
    // 傳統泰式山牆：陡斜屋頂、兩端微微翹起
    const d = `M${x - 14} ${top + 4} Q${x + w * .2} ${top - 20} ${x + w * .5} ${top - 48} Q${x + w * .8} ${top - 20} ${x + w + 14} ${top + 4} Z`;

  }
  // 陽台欄杆與通往水面的梯子
  s += `<path d="M${x} ${fl - 12} H${x + w}" class="s-wood-dk" stroke-width="2"/>`;
  let rail = '';
  for (let px = x + 3; px < x + w; px += 7) rail += `M${px} ${fl - 12} V${fl} `;
  s += `<path d="${rail}" class="s-wood-dk" stroke-width="1.2"/>`;
  s += `<rect x="${x}" y="${fl - 2}" width="${w}" height="5" class="f-wood-dk"/>`;
  if (opt.ladder) {

    for (let y = fl + 6; y < BANK; y += 7) s += `<path d="M${f1(lx - (y - fl) / 10)} ${y} h12" class="s-wood-dk" stroke-width="1.6"/>`;

const stitchRows = [];
function drawWater() {
  const bands = [[BANK, 400, 'f-water-1'], [400, 460, 'f-water-2'], [460, 526, 'f-water-3']];

  el('path', { d: `M0 ${BANK + 1} H1600`, class: 's-stitch', 'stroke-width': 1.6, 'stroke-dasharray': '6 3' }, $('water'));
  // 倒影：鄭王廟與高腳屋的倒影用直向的波浪跑針表現
  // 倒影長度依塔的輪廓：主塔最長、兩座小塔次之、圍牆最短
  let rd = '';
  for (let x = 566; x < 1040; x += 8) {
    const m = Math.max(0, 1 - Math.abs(x - TX) / 62), s1 = Math.max(0, 1 - Math.abs(x - 654) / 26), s2 = Math.max(0, 1 - Math.abs(x - 946) / 26);
    const L = Math.max(16, Math.pow(m, .7) * 150, Math.pow(Math.max(s1, s2), .7) * 70);
    rd += `M${x} ${BANK + 5} q3 ${f1(L / 4)} 0 ${f1(L / 2)} t0 ${f1(L / 2)} `;
  }
  el('path', { d: rd, id: 'tRefl', class: 's-refl', 'stroke-width': 2.6, 'stroke-dasharray': '6 6', 'stroke-linecap': 'round' }, $('refl'));
  let hd = '';
  houseLamps.forEach(l => { if (!l.bulb) hd += `M${f1(l.x)} ${BANK + 4 + (318 - l.y) * .3} v26 `; });
  el('path', { d: hd, class: 's-win', 'stroke-width': 4, 'stroke-dasharray': '4 4', id: 'winRefl', 'stroke-linecap': 'round' }, $('refl'));
  // 一排排跑針水波（程式讓針腳慢慢往右流動）
  for (let y = BANK + 10, i = 0; y < 520; y += 13 + i * .8, i++) {

    stitchRows.push({ el: p, sp: 7 + i * 1.6, off: srand(0, 50) });

}

  t.textContent = text;
  const w = Math.max(44, (t.getComputedTextLength() || text.length * 15) + 26);
  const r = el('rect', { x: f1(-w / 2), y: -15, width: f1(w), height: 30, rx: 6 });
  inner.insertBefore(r, t);
  x = clamp(x, w / 2 + 16, 1600 - w / 2 - 16); y = clamp(y, 30, 570);
  g.setAttribute('transform', `translate(${f1(x)} ${f1(y)})`);
  setTimeout(() => g.remove(), dur * 1000);
}

/* ---------------- 動畫迴圈 ---------------- */
let last = 0, rafId = 0;
function loop(now) {
  const dt = clamp((now - last) / 1000, 0, .05); last = now;
  step(dt);
  rafId = requestAnimationFrame(loop);
}
// 減少動態：只畫靜止畫面；互動時快轉一小段再停住
function settle(sec) { for (let s = 0; s < sec; s += .05) step(.05); }
function renderStill() { step(.0001); }
function start() {
  cancelAnimationFrame(rafId);
  if (reduced) { T.auto = false; syncAuto(); applyTime(true); settle(1.5); }
  else { last = performance.now(); rafId = requestAnimationFrame(loop); }
}

/* ---------------- 開始：依序畫出場景、角色 ---------------- */
makeLinen();
drawSky();
drawTemple();
drawTrees();
drawHouses();
drawWater();
drawPier();
drawPeople();
drawBoats();
drawLizard();
drawHyacinths();
drawWeather();
// 潑水節的彩虹（平常看不見）：七色跑針弧線
// 放在水面上、船的後面，像水霧裡浮出的小彩虹
rainbowEl = el('g', { opacity: 0, 'pointer-events': 'none' });
$('waterStitch').after(rainbowEl);
['#e8524a', '#f39a2e', '#f2d04a', '#5fb85a', '#4a8ad8', '#7a5ac8'].forEach((c, i) => el('path', { d: `M${330 + i * 6} 522 A${470 - i * 6} ${150 - i * 6} 0 0 1 ${1270 - i * 6} 522`, style: `stroke:${c};fill:none`, 'stroke-width': 5, 'stroke-dasharray': '10 3' }, rainbowEl));
lizard.wait = 4;

/* ---------------- ⑤ 互動：點擊 ---------------- */
function onAct(node, fn) {
  node.addEventListener('click', e => { e.stopPropagation(); userGesture = true; ensureAudio(); fn(e); if (reduced) settle(.6); });
  node.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); userGesture = true; ensureAudio(); fn(e); if (reduced) settle(.6); } });
}
function svgPoint(e) {
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
svg.addEventListener('pointerdown', () => { userGesture = true; ensureAudio(); document.body.classList.remove('kbd'); });
window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
// 滑鼠：視差＋水面跑針漣漪＋推開布袋蓮
svg.addEventListener('pointermove', e => {
  const p = svgPoint(e);
  px = clamp((p.x - 800) / 800, -1, 1);
  mouse.x = p.x; mouse.y = p.y;
  if (p.y > BANK + 6 && p.y < DECK - 2 && clock - lastRipple > .07 && !reduced) {
    lastRipple = clock;
    ripples.push({ el: el('ellipse', { cx: f1(p.x), cy: f1(p.y), rx: 4, ry: 1, class: 's-water-hi', 'stroke-width': 1.8, 'stroke-dasharray': '4 3' }, $('ripples')), t: 0, s: .5 + (p.y - BANK) / 170 * .6 });
  }
});
svg.addEventListener('pointerleave', () => { px = 0; mouse.x = mouse.y = -999; });

// 鄭王廟：寺鐘響起，瓷片閃閃發亮
onAct($('templeHit'), () => {
  templeBell();
  for (let i = 0; i < 22; i++) {
    const y = rand(70, 290), hw = 56 * (1 - .9 * Math.pow(clamp((238 - y) / 160, 0, 1), 1.7));
    const x = TX + rand(-hw, hw), r = rand(3, 6);
    const s = el('path', { d: `M${f1(x - r)} ${f1(y)}H${f1(x + r)}M${f1(x)} ${f1(y - r)}V${f1(y + r)}`, style: 'stroke:#fffbe0', 'stroke-width': 1.8, 'stroke-linecap': 'round', opacity: 0 }, $('templeLights'));
    sparkles.push({ el: s, t: -rand(0, .8), dur: 1.2 });
  }
  say(TX, 30, pick(['鄭王廟的瓷片是用彩色碎瓷拼成的', '黎明寺，晨光最美', '噹——寺鐘響了']), 2);
});
// 天空：白天鳥群、夜晚流星、雷雨時打雷
onAct($('skyHit'), e => {
  const p = e.type === 'click' ? svgPoint(e) : { x: 800, y: 120 };
  if (wx.storm > .5) { strike(clamp(p.x, 40, 1560)); return; }
  if (night < .5) {
    for (let i = 0; i < 5; i++) spawnBird(p.x - 40 - i * 22, clamp(p.y, 50, 230) + rand(-16, 16), (p.x < 800 ? 1 : -1) * rand(80, 110));
    birdCall();
  } else {
    const g = el('g', {}, $('birds'));
    frag(g, `<path d="M0 0 L60 -20" style="stroke:var(--star)" stroke-width="2" stroke-dasharray="6 3" stroke-linecap="round"/><circle r="2.6" style="fill:var(--star)"/>`);
    sparkles.push({ el: g, kind: 'meteor', x: p.x, y: p.y, vx: -260, vy: 90, t: 0 });
    smallBell(2400);
  }
});
// 水面：魚跳出來
onAct($('waterHit'), e => {
  const p = e.type === 'click' ? svgPoint(e) : { x: 800, y: 470 };
  const dir = Math.random() < .5 ? 1 : -1, s = .6 + (p.y - BANK) / 170 * .6;
  const g = el('g', {}, $('splashes'));
  frag(g, `<g transform="scale(${f1(s)})"><path d="M-10 0 Q0 -7 10 0 Q0 7 -10 0 Z M-10 0 l-6 -5 v10 Z" style="fill:#b8c4c8"/><path d="M-10 0 Q0 -7 10 0" class="st" stroke-width=".8"/><circle cx="6" cy="-1" r="1" fill="#2a2020"/></g>`);
  fishes.push({ el: g, x: p.x, y: p.y, dir, t: 0 });
  splashAt(p.x, p.y, 5);
  splash(.22);
});
// 布袋蓮：轉一圈被推開
$('hyacinths').addEventListener('click', e => {
  e.stopPropagation(); userGesture = true; ensureAudio();
  const p = svgPoint(e);
  hyacinths.forEach(h => { const d = Math.hypot(h.x - p.x, h.y - p.y); if (d < 50) { h.vx += (h.x - p.x) * 3; h.vy += (h.y - p.y); } });
  splash(.15);
  say(p.x, p.y - 30, '布袋蓮，運河裡很常見', 1.4);
});
// 船
function boatClick(b) {
  const L = b.L;
  if (b.kind === 'longtail') {
    b.boost = 2.6; engineRev();
    say(clamp(b.x, 80, 1520), L.y - 82 * L.s, pick(['哇～好快！', '抓緊囉！', '水花噴好高！', '去鄭王廟那邊看看！']), 1.6);
    return;
  }
  if (b.kind === 'monk') return;
  const G = GOODS[b.kind];
  ({ noodle: () => clink(3), kanomkrok: () => sizzle(1.2), grill: () => sizzle(1.6), drinks: iceRattle, coconut: chop, flower: () => smallBell(), fruit: () => splash(.2) })[b.kind]();
  b.stop = Math.max(b.stop, 2.6);
  let best = null, bd = 1e9;
  if (L.dir > 0 || b.lane === 'C') customers.forEach(c => { const d = Math.abs(c.x - b.x); if (d < bd) { bd = d; best = c; } });
  if (best && bd < 200) sell(b, best);
  else say(clamp(b.x, 80, 1520), L.y - 72 * L.s, pick(G.calls), 1.8);
}
boats.forEach(b => onAct(b.el, () => boatClick(b)));
// 白鷺
onAct(egret.el, () => {
  if (egret.fly) return;
  egret.fly = .001; egret.el.querySelector('.eg').style.display = 'none'; egret.el.querySelector('.egf').style.display = '';
  flaps(); say(990, 290, '白鷺飛走了～', 1.4);
});
// 水巨蜥
onAct(lizard.el, () => {
  if (lizard.dive) return;
  lizard.dive = .001; splash(.28); splashAt(lizard.x, 430, 6);
  say(clamp(lizard.x, 80, 1520), 396, pick(['是水巨蜥！曼谷運河常常看到', '牠潛下去了！', '別怕，牠很害羞']), 1.8);
});
// 土地公小屋
onAct(spiritHouse, () => {
  spiritSmoke = 7;
  spiritHouse.querySelector('.newGarland').style.display = '';
  smallBell(1500);
  say(1500, 384, pick(['獻上茉莉花環，保佑生意興隆', '點三炷香，雙手合十', '再放一杯紅色汽水給土地公']), 2.2);
});
// 椰子冰淇淋
let bellT = 0;
onAct(iceCart, () => {
  handBell(); bellT = 1.4;
  say(360, 420, pick(['椰子冰淇淋，裝在椰殼裡！', '加花生、加糯米都可以', '一球 30 銖～']), 1.8);
});
// 吃麵的客人
onAct(noodleTable, () => { clink(2); say(130, 470, pick(['船麵小小碗，一次吃五碗！', '再加一點辣椒', '好吃！老闆再一碗！']), 1.8); });
// 紀念品攤
onAct(hatStall, () => { smallBell(1200); say(1250, 440, pick(['สวัสดีค่ะ！斗笠一頂 100 銖', '大象褲、布包都有喔', '試戴看看斗笠？']), 1.8); });
// 行人
$('people').addEventListener('click', e => {
  const pt = svgPoint(e);
  let best = null, bd = 1e9;
  walkers.forEach(w => { const d = Math.abs(w.x + pxCur * 4 - pt.x) + Math.abs(WLANES[w.w].y - 28 - pt.y) * .5; if (d < bd) { bd = d; best = w; } });
  customers.forEach(c => { const d = Math.abs(c.x + pxCur * 4 - pt.x) + Math.abs(536 - 28 - pt.y) * .5; if (d < bd) { bd = d; best = c; } });
  if (!best || bd > 44) return;
  e.stopPropagation(); userGesture = true; ensureAudio();
  if (best.type === 'dog') { bark(); best.stop = 1.6; say(best.x, 530, '汪汪！', 1.2); return; }
  if (best.type) best.stop = 2.2; else best.reach = 1.6;
  const by = best.type ? WLANES[best.w].y - 80 * best.s : 452;
  const lines = wx.storm > .5 ? ['雷陣雨來得快去得也快', '先躲一下雨吧', '好大的雨！'] :
    best.type === 'tourist' ? ['幫我跟鄭王廟合照！', '長尾船好酷！', '我想吃芒果糯米飯'] : best.type === 'yoke' ? ['新鮮芒果喔～', '扁擔挑了一早上了'] : best.type === 'kid' ? ['我要椰子冰淇淋！', '那是大蜥蜴嗎？'] :
    best.type === 'auntie' ? ['太陽好大，撐把傘', 'สวัสดีค่ะ！'] : best.type === 'backpack' ? ['下一站去大皇宮', '這裡好熱鬧！'] : ['สวัสดีครับ！你好！', '吃飽了嗎？', '要不要搭長尾船？'];
  if (best.type === 'tourist') shutter();
  say(best.x, by, pick(lines), 1.6);
  if (reduced) renderStill();
});

/* ---------------- ⑤ 互動：控制列 ---------------- */
function syncAuto() { $('btnAuto').setAttribute('aria-pressed', String(T.auto)); $('btnAuto').textContent = T.auto ? '自動播放中' : '自動播放'; }
function goTo(t) { if (reduced) { T.t = t; applyTime(true); renderStill(); } else T.target = t; }
function unlock() { userGesture = true; ensureAudio(); }
// 「水燈節」「潑水節」：剛解鎖音訊時稍等一下再開始，避免第一個音被吃掉
function later(fn) { setTimeout(() => { fn(); if (reduced) settle(show.kind ? show.end + .5 : 2); }, actx && actx.state !== 'running' ? 150 : 0); }
$('btnLoy').addEventListener('click', () => { unlock(); later(() => startLoy()); });
$('btnSong').addEventListener('click', () => { unlock(); later(() => startSong()); });
$('btnFleet').addEventListener('click', () => {
  unlock();
  const temp = boats.filter(b => b.temp && b.kind !== 'monk').length;
  if (temp >= 4) { say(800, 330, '船隊已經在路上了！', 1.4); return; }
  [['D', 'fruit'], ['C', 'coconut'], ['D', 'flower']].forEach(([ln, kind], i) => {
    const b = addBoat(ln, kind, -200, 18 + i * 2, { temp: true, skin: 1 + i, long: i % 2, hair: 1 + i });
    b.hidden = true; onAct(b.el, () => boatClick(b));
  });
  applyTime(true);
  boats.filter(b => b.lane === 'C' || b.lane === 'D').forEach((b, i) => { if (!b.hidden && b.kind !== 'monk' && i % 2 === 0) setTimeout(() => say(clamp(b.x, 80, 1520), b.L.y - 72 * b.L.s, pick(GOODS[b.kind].calls), 1.8), i * 400); });
  smallBell(1600);
  if (reduced) settle(3);
});
$('btnMonk').addEventListener('click', () => {
  unlock();
  if (monkBoat) { say(800, 330, '僧人正在化緣中', 1.4); return; }
  const h = T.t * 24;
  if (h >= 5.6 && h < 9) spawnMonk();
  else { show.pending = show.kind ? show.pending : 'monk'; if (!show.kind) goTo(6.05 / 24); say(800, 330, '等到清晨，僧人會划船來化緣', 1.8); }
  if (reduced) settle(3);
});
$('btnTail').addEventListener('click', () => {
  unlock();
  const lt = boats.filter(b => b.kind === 'longtail');
  const vis = lt.filter(b => !b.hidden && b.x > 0 && b.x < 1600);
  const b = vis.length ? pick(vis) : lt[0];
  if (b.hidden) { b.hidden = false; b.x = b.L.dir > 0 ? -b.front * b.L.s : 1600 + b.front * b.L.s; }
  boatClick(b);
  if (reduced) settle(.5);
});
$('btnWeather').addEventListener('click', () => {
  unlock();
  wxI = (wxI + 1) % WX_LIST.length;
  $('btnWeather').textContent = '天氣：' + WX_LIST[wxI][1];
  if (WX_LIST[wxI][0] === 'storm') boltT = 1.5;
  if (reduced) { for (const k in wx) wx[k] = WX_LIST[wxI][0] === k ? 1 : 0; applyWeather(0); renderStill(); }
});
$('btnSound').addEventListener('click', () => {
  soundOn = !soundOn; userGesture = true;
  $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 音效：開' : '🔇 音效：關';
  if (ensureAudio()) {
    if (!soundOn) { killBus('music'); killBus('sfx'); rainSound(false); master.gain.cancelScheduledValues(actx.currentTime); master.gain.setValueAtTime(0, actx.currentTime); }
    else master.gain.setTargetAtTime(.32, actx.currentTime, .05);
  }
});
$('btnDay').addEventListener('click', () => goTo(10 / 24));
$('btnNight').addEventListener('click', () => goTo(20.5 / 24));
$('btnAuto').addEventListener('click', () => { T.auto = !T.auto; T.target = null; syncAuto(); });
$('timeRange').addEventListener('input', e => {
  T.t = e.target.value / 1000; T.target = null; T.dragging = true; applyTime(true); T.dragging = false;
  if (reduced) renderStill();
});
mq.addEventListener?.('change', e => { reduced = e.matches; if (!reduced) { T.auto = true; syncAuto(); } start(); });

// 開場：讓船隻與行人先就定位
applyTime(true);
applyWeather(0);
syncAuto();
for (let i = 0; i < 20; i++) step(.05);
start();
// 圖鑑網站「作者精選」播放區（純插畫版嵌在網頁裡）：停在夜晚，水燈節預設開著，結束後自動再來一輪
const inPicks = (() => { let top = true; try { top = window.top === window; } catch (e) { top = false; } return !!document.getElementById('pure-art') && !top; })();
if (inPicks) {
  T.auto = false; T.t = 20.3 / 24; applyTime(true); syncAuto();
  setTimeout(() => startLoy(true), 1000);
  setInterval(() => { if (!show.kind && night > .75) startLoy(true); }, 30000);
}
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.kind || (show.pending === 'loy' || show.pending === 'song' ? show.pending : null),   // 等天黑／天亮的期間也算
  btn: { loy: 'btnLoy', song: 'btnSong' },
  ff: () => { show.fw = 99; show.t = show.end - .02; },
  save: () => ({ ...T }),
  stop: () => { show.pending = null; T.target = null; if (show.kind) endShow(); },
  restore: s => { Object.assign(T, s); syncAuto(); applyTime(true); renderStill(); }
});
/* /ShowStop */
})();
</script>
