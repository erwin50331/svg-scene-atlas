<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>克拉科夫中央廣場的號角</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-27 克拉科夫中央廣場的號角｜黏土定格動畫風
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   風格重點：所有物件像手捏黏土——圓潤邊緣、左上打光的高光、
            右下的厚度陰影、凹進去的窗洞、整片指紋紋理；
            動畫一律「逐格」更新（每秒 12 格），帶一點定格動畫的頓感與燈光微閃。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），
   部分另有 --k-名稱（晨昏）。JS 會依時間內插，輸出成 --名稱，
   並自動產生 .f-名稱（填色）、.s-名稱（描邊）兩個 class。
   ========================================================= */
:root{
  color-scheme: dark;

  /* —— 天空（黏土背板） —— */
  --d-sky-top:#7fb7e0;  --k-sky-top:#5a6aa8;  --n-sky-top:#141c3c;
  --d-sky-mid:#a9d2ec;  --k-sky-mid:#d58a9a;  --n-sky-mid:#1f2a52;
  --d-sky-low:#e4efe6;  --k-sky-low:#f6b878;  --n-sky-low:#34406a;
  --d-cloud:#fbf7f0;    --k-cloud:#ffd9c0;    --n-cloud:#3c4772;
  --d-cloud-sh:#d6dde6; --n-cloud-sh:#2a3358;
  --d-thread:#8a8f99;   --n-thread:#59607a;    /* 吊雲朵、太陽的細線 */
  --d-overcast:#b9c0c8; --n-overcast:#2c3250;

  /* —— 後排老屋（kamienice）—— */
  --d-house-1:#e9c87a;  --n-house-1:#6d5a50;   /* 赭黃 */
  --d-house-2:#e7a99a;  --n-house-2:#6a4a58;   /* 鮭粉 */
  --d-house-3:#b9d4b4;  --n-house-3:#41555a;   /* 薄荷 */
  --d-house-4:#f2e6cc;  --n-house-4:#6c6470;   /* 奶油 */
  --d-house-5:#d98f66;  --n-house-5:#6a4440;   /* 陶土橘 */
  --d-roof:#b8573e;     --n-roof:#4a2a32;      /* 紅瓦 */
  --d-win:#4b5670;      --n-win:#ffcf72;       /* 窗：夜晚亮燈 */
  --d-win-off:#4b5670;  --n-win-off:#252a44;   /* 夜裡不亮的窗 */

  /* —— 市政廳塔、紡織會館 —— */
  --d-th-brick:#b0603f; --n-th-brick:#6d3a30;
  --d-stone:#efdcb2;    --n-stone:#c8a874;     /* 紡織會館的米色石牆（夜晚打黃光） */
  --d-stone-sh:#d4bb8a; --n-stone-sh:#94784e;
  --d-attic:#faf1dc;    --n-attic:#e0c690;     /* 文藝復興女兒牆 */
  --d-arcade:#7a5a44;   --n-arcade:#ffbf66;    /* 拱廊裡的攤位：夜晚亮燈 */

  /* —— 主角：聖母聖殿（紅磚哥德式，夜晚泛光照明） —— */
  --d-brick:#c0573d;    --n-brick:#b05a38;
  --d-brick-sh:#9a4230; --n-brick-sh:#7a3828;
  --d-brick-hi:#d8775a; --n-brick-hi:#d0784a;
  --d-patina:#5f8f7c;   --n-patina:#2e4a48;    /* 尖塔的銅綠 */
  --d-patina-sh:#467060; --n-patina-sh:#1f3434;
  --d-glass:#3c4a78;    --n-glass:#e8a64a;     /* 大彩窗：夜晚透光 */
  --d-roof-nave:#8a3a2c; --n-roof-nave:#3c2026;

  /* —— 密茨凱維奇紀念像、聖沃伊切赫小教堂 —— */
  --d-bronze:#5a7a6a;   --n-bronze:#33484a;
  --d-bronze-hi:#86a896; --n-bronze-hi:#4f6a68;
  --d-pedestal:#cfc6b4; --n-pedestal:#6a6478;
  --d-chapel:#f4efe4;   --n-chapel:#a8a0a8;
  --d-dome:#4f8a72;     --n-dome:#264040;

  /* —— 廣場地面 —— */
  --d-cobble:#c9b596;   --n-cobble:#4a4658;
  --d-cobble-2:#b29e80; --n-cobble-2:#3c394c;
  --d-cobble-hi:#e0d0b2; --n-cobble-hi:#5a566c;
  --d-ground-sh:#7a684e; --n-ground-sh:#1c1a28;
  --d-lamp-post:#2e3438; --n-lamp-post:#15171e;
  --d-glow:#fff2c400;   --n-glow:#ffd27acc;    /* 路燈光暈 */
  --d-shadow:#3a280f33; --n-shadow:#00000066;  /* 角色腳下的影子 */
  --d-puddle:#9fb6c8;   --n-puddle:#4a5a86;

  /* —— 瓦維爾山布景（山、峭壁、城堡、步道、維斯瓦河、龍雕像） —— */
  --d-hill:#8fb86a;     --n-hill:#2c4234;      /* 草坡 */
  --d-tree:#5f9450;     --n-tree:#1f3328;
  --d-rock:#e6dcc4;     --n-rock:#6c6676;      /* 石灰岩峭壁 */
  --d-rock-sh:#c6b694;  --n-rock-sh:#4a4658;
  --d-castle:#f2deb0;   --n-castle:#d2ae72;    /* 王宮外牆（夜晚打黃光） */
  --d-path:#dccca8;     --n-path:#4c4858;      /* 河濱步道 */
  --d-path-sh:#c2b08a;  --n-path-sh:#3a3646;
  --d-river-1:#5e9cc6;  --k-river-1:#8a7aa8;  --n-river-1:#1a2848;
  --d-river-2:#86bede;  --n-river-2:#2a3a64;
  --d-river-hi:#e2f2fa; --n-river-hi:#56679a;
  --d-dragon:#4c5e4c;   --n-dragon:#2c3832;    /* 青銅龍 */
  --d-dragon-hi:#86a07e; --n-dragon-hi:#4c6052;
  --boat:#f6f2ea; --boat-trim:#2f5d9a;
  --cine-shade:#0c0816; --cine-light:#ffe2b0;  /* 表演燈光：暗角與中央微亮 */

  /* —— 不隨日夜變化的顏色 —— */
  --gold:#e8b23a;  --gold-hi:#ffe08a;
  --sun:#ffd25a;   --sun-hi:#fff2b0;
  --moon:#f4efd8;  --star:#fff6d6;
  --lamp:#ffd884;
  --white-clay:#f6f2ea;
  --ink:#2a2230;
  --clay-shade:#2a1408;      /* 黏土厚度陰影的顏色 */
  --thumb:#3c2414;           /* 指紋紋路 */
  --cart-blue:#3f7fc4;  --cart-blue-dk:#2a5a94;   /* 圈餅推車的藍色 */
  --obw:#d8964a;   --obw-dk:#a86a2c;   --seed:#f6ead0;  /* 圈餅與芝麻 */
  --horse-white:#f3efe6; --horse-grey:#cfc8bc; --horse-dark:#3a2e2a;
  --carriage:#2a2a32; --carriage-trim:#e8b23a; --seat:#b8303a;
  --umbrella-1:#f4ead6; --umbrella-2:#c8323a;     /* 咖啡座陽傘 */
  --flower-1:#e8445a; --flower-2:#ffd23e; --flower-3:#f088c0; --flower-4:#ffffff; --flower-5:#8a5ad8; --leaf:#4f8a3e;
  --pigeon:#9aa0ae; --pigeon-dk:#6c7282; --pigeon-neck:#6aa88c;
  --bubble:#cfeaff;
  --note:#e8b23a;  /* 號角飄出的音符 */
  --rain:#a8c8e8; --snow:#ffffff;

  /* —— 角色 —— */
  --skin-1:#f6d2b0; --skin-2:#e0aa82; --skin-3:#b07a52; --skin-4:#7a5038;
  --hair-1:#2a2024; --hair-2:#7a4a2a; --hair-3:#e0b45a; --hair-4:#c8c0b8; --hair-5:#b8502e;
  --coat-1:#c8323a; --coat-2:#2f5d9a; --coat-3:#e8a83a; --coat-4:#3f8a6a; --coat-5:#8a5ab0;
  --coat-6:#e86a8a; --coat-7:#4a4a58; --coat-8:#c8b08a; --coat-9:#f2ece0;
  --pants-1:#2a2e44; --pants-2:#5a4a3e; --pants-3:#3a5a8a;

  /* —— 頁面介面 —— */
  --page-bg:#1c1a26; --page-fg:#f6efe0; --page-muted:#b4ab9c;
  --ui-surface:#28243a; --ui-line:#433d58; --ui-accent:#e8b23a; --ui-hot:#c8323a;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border:1px solid var(--ui-line);border-radius:14px;overflow:hidden;background:var(--page-bg);line-height:0}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:14px;padding:10px 14px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--page-bg);font-weight:700}
.panel button.big{border-color:var(--ui-hot);color:#fff;background:var(--ui-hot);font-weight:700}
.panel button.big.on{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--page-bg)}
.panel button:disabled{opacity:.45;cursor:default}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
/* 畫面內可點物件：滑鼠點不顯示外框，用鍵盤 Tab 時才顯示 */
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid var(--ui-accent);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75;display:grid;gap:2px}
.hint b{color:var(--page-fg)}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .bubble rect{fill:var(--white-clay);stroke:var(--ink);stroke-width:2}
#scene .bubble text{fill:var(--ink);font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .noHit{pointer-events:none}
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>
<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。
   想恢復完整版，刪掉這整段 <style id="pure-art"> 即可。
   ========================================================= */
html,body{height:100%;margin:0!important;overflow:hidden}
body{display:flex!important;align-items:center;justify-content:center;padding:0!important}
body>.wrap{width:100%!important;max-width:min(100vw,calc(100vh * 8 / 3))!important;
  margin:0!important;padding:0!important;gap:0!important;display:block!important}
body>.wrap>:not(.stage){display:none!important}
body>.wrap>.stage{width:100%!important;max-width:100%!important;margin:0!important;
  border:0!important;border-radius:0!important;box-shadow:none!important}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：天空背板 → 吊線的太陽月亮與雲 → 後排老屋
       → 市政廳塔 → 紡織會館 → 聖母聖殿 → 聖沃伊切赫小教堂
       → 紀念像、攤位、路燈 → 廣場地面 → 角色（依前後排序）
       → 號手特寫 → 天氣 → 燈光微閃 → 指紋紋理
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="黏土定格動畫風格的波蘭克拉科夫中央廣場：右側是紅磚雙塔的聖母聖殿，較高的北塔有銅綠尖頂與金色王冠，號手會從塔窗探出身吹奏海那爾號角曲；左側是米色長形的紡織會館，拱廊下有花攤；中間是密茨凱維奇紀念像，旁邊停著藍色的圈餅推車；最左邊是磚造的市政廳塔與蒙眼的巨大銅像頭；廣場上有白馬馬車、行人、泡泡藝人、咖啡座與成群的鴿子，太陽和雲朵用細線吊在天上。按「去瓦維爾山」鏡頭會橫移到維斯瓦河畔：瓦維爾山頂有王宮、磚塔與大教堂的金色圓頂，山腳石頭上站著會噴火的青銅龍雕像，河上有觀光船與天鵝">
    <defs>
      <!-- 天空漸層：顏色由色票控制 -->
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-top)"/>
        <stop offset=".55" style="stop-color:var(--sky-mid)"/>
        <stop offset="1" style="stop-color:var(--sky-low)"/>
      </linearGradient>
      <!-- 黏土質感濾鏡：左上高光＋右下厚度陰影（大型物件用） -->
      <filter id="clay" x="-6%" y="-6%" width="112%" height="112%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceAlpha" stdDeviation="3.2" result="b"/>
        <feSpecularLighting in="b" surfaceScale="4" specularConstant=".95" specularExponent="26" lighting-color="#fff4e2" result="spec">
          <feDistantLight azimuth="225" elevation="40"/>
        </feSpecularLighting>
        <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
        <feOffset in="b" dx="-3.5" dy="-4.5" result="off"/>
        <feComposite in="SourceAlpha" in2="off" operator="arithmetic" k2="1" k3="-1" result="rim"/>
        <feFlood style="flood-color:var(--clay-shade)" flood-opacity=".5"/>
        <feComposite in2="rim" operator="in" result="shade"/>
        <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/><feMergeNode in="specIn"/></feMerge>
      </filter>
      <!-- 小型物件用的黏土濾鏡（邊緣更細） -->
      <filter id="clayS" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="b"/>
        <feSpecularLighting in="b" surfaceScale="2.4" specularConstant=".9" specularExponent="24" lighting-color="#fff6e8" result="spec">
          <feDistantLight azimuth="225" elevation="42"/>
        </feSpecularLighting>
        <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
        <feOffset in="b" dx="-1.6" dy="-2.2" result="off"/>
        <feComposite in="SourceAlpha" in2="off" operator="arithmetic" k2="1" k3="-1" result="rim"/>
        <feFlood style="flood-color:var(--clay-shade)" flood-opacity=".45"/>
        <feComposite in2="rim" operator="in" result="shade"/>
        <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/><feMergeNode in="specIn"/></feMerge>
      </filter>
      <!-- 壓進去的凹洞（窗戶、拱門）：左上內陰影＋右下亮邊 -->
      <filter id="dent" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="b"/>
        <feOffset in="b" dx="2" dy="2.6" result="off"/>
        <feComposite in="SourceAlpha" in2="off" operator="arithmetic" k2="1" k3="-1" result="rim"/>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }

  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {

        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }

      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }

  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */

  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';

    const cl = svg.cloneNode(true);

    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);

      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }

    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });

    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });
    added = [];
  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }

    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }

  W.ShowStop = {

const pigeons = [];
function pigeonSVG() {
  return `<ellipse cx="0" cy="0" rx="8" ry="2" style="fill:var(--shadow)"/>
   <g class="pb" filter="url(#clayS)">
    <ellipse cx="0" cy="-8" rx="9" ry="6.5" style="fill:var(--pigeon)"/>
    <path d="M-7 -9 L-15 -5 L-8 -4Z" style="fill:var(--pigeon-dk)"/>
    <circle cx="7" cy="-15" r="4.6" style="fill:var(--pigeon)"/>
    <path d="M4 -12 Q8 -9 10 -12" stroke="var(--pigeon-neck)" stroke-width="2.4" fill="none"/>
    <path d="M11 -15 L14 -14 L11 -13Z" fill="#e8b0a0"/>
    <path class="wing" d="M-4 -10 Q2 -14 6 -8 Q0 -5 -4 -10Z" style="fill:var(--pigeon-dk)"/>
    <path d="M-1 -2 V1 M2 -2 V1" stroke="#e86a6a" stroke-width="1.4"/></g>
   <circle cx="8.4" cy="-16" r="1.1" fill="#c8323a"/>`;
}
function addPigeon(x, y) {
  const g = el('g', { class: 'clickable' });
  g.innerHTML = pigeonSVG();
  const p = { g, x, y, hx: x, hy: y, dir: Math.random() < .5 ? 1 : -1, peck: 0, fly: 0, vx: 0, vy: 0, alt: 0, kind: 'pigeon', wing: g.querySelector('.wing'), pb: g.querySelector('.pb'), target: null };
  addActor(p); pigeons.push(p);
  onAct(g, () => { scarePigeons(p.x, p.y, 90, true); sfx('flap'); });
}
function scarePigeons(x, y, r, fly) {
  pigeons.forEach(p => {
    if (p.fly) return;
    const d = Math.hypot(p.x - x, p.y - y);
    if (d < r) {
      if (fly) { p.fly = 1; p.vx = (p.x - x || 1) / (d || 1) * rand(80, 160); p.vy = -rand(140, 220); p.alt = 0; p.flyT = 0; }
      else { p.x += (p.x - x) / (d || 1) * 18; p.y = clamp(p.y + (p.y - y) / (d || 1) * 6, 544, 598); p.dir = Math.sign(p.x - x) || 1; p.hopT = 2; }
    }
  });
}

/* ---------------- ④ 動畫：工具（補間、粒子、泡泡、對話泡泡） ---------------- */
const tweens = [];
function tween(node, dur, fn, done) { tweens.push({ t: 0, dur, fn, done }); }
function particle(x, y, fill, vx, vy, life, r) {
  const c = el('circle', { cx: f1(x), cy: f1(y), r: f1(r || 3), style: `fill:${fill}` }, $('fx'));
  let px = x, py = y, t = 0;
  tween(c, life, (k, dt) => { vy += 160 * dt; px += vx * dt; py += vy * dt; c.setAttribute('cx', f1(px)); c.setAttribute('cy', f1(py)); c.setAttribute('opacity', f1(1 - k)); }, () => c.remove());
}
function steam(x, y, delay) {
  setTimeout(() => {
    const p = el('path', { d: `M${x} ${y} q-4 -6 0 -12 q4 -6 0 -12`, stroke: '#fff', 'stroke-width': 2.4, fill: 'none', opacity: .7, 'stroke-linecap': 'round' }, $('fx'));
    tween(p, 1.6, k => { p.setAttribute('transform', `translate(0 ${f1(-k * 20)})`); p.setAttribute('opacity', f1(.7 * (1 - k))); }, () => p.remove());
  }, delay * 1000);
}
const bubbles = [];
function blowBubbles(x, y) {
  sfx('blow');
  for (let i = 0; i < 6; i++) {
    const r = rand(10, 26);
    const g = el('g', {}, $('bubbles'));
    el('circle', { r: f1(r), fill: 'var(--bubble)', 'fill-opacity': .18, stroke: '#ffffff', 'stroke-opacity': .8, 'stroke-width': 1.6 }, g);
    el('path', { d: `M${f1(-r * .5)} ${f1(-r * .3)} A${f1(r * .7)} ${f1(r * .7)} 0 0 1 ${f1(-r * .1)} ${f1(-r * .65)}`, stroke: '#fff', 'stroke-width': 2.4, fill: 'none', opacity: .9 }, g);
    el('path', { d: `M${f1(r * .2)} ${f1(r * .7)} A${f1(r * .8)} ${f1(r * .8)} 0 0 0 ${f1(r * .7)} ${f1(r * .2)}`, stroke: '#ff9ad8', 'stroke-width': 1.6, fill: 'none', opacity: .7 }, g);
    bubbles.push({ g, x: x + i * 4, y: y - i * 3, vx: rand(-30, 40), vy: rand(-40, -18), life: rand(3, 6), t: 0, r });
  }
}
function say(x, y, text, dur = 1.6) {
  const g = el('g', { class: 'bubble' }, $('fx'));
  const t = el('text', { x: 0, y: 0 }, g); t.textContent = text;
  const w = Math.max(44, (t.getComputedTextLength() || text.length * 15) + 26);
  const r = el('rect', { x: f1(-w / 2), y: -16, width: f1(w), height: 32, rx: 16 });
  g.insertBefore(r, t);
  x = clamp(x, w / 2 + 8, 1600 - w / 2 - 8); y = clamp(y, 24, 576);
  g.setAttribute('transform', `translate(${f1(x)} ${f1(y)})`);
  setTimeout(() => g.remove(), dur * 1000);
}

/* ---------------- ④ 動畫：日夜循環 ----------------
   T.t：一天中的時間（0–1，0 = 午夜）。自動播放時一天約 160 秒。 */
const DAY_SEC = 160;
const T = { t: 11 / 24, auto: true, target: null };

  const h = T.t * 24, hh = Math.floor(h) % 24, mm = Math.floor((h - Math.floor(h)) * 60 + 1e-6);

  $('sun').style.display = sp > -.05 && sp < 1.05 ? '' : 'none';
  $('moon').setAttribute('transform', `translate(${f1(1480 - mp * 1360)} ${f1(330 - Math.sin(Math.PI * clamp(mp, 0, 1)) * 240)})`);

/* ---------------- ④ 動畫：號角秀（Hejnał mariacki） ----------------

      show.phase = 'play'; show.t = 0;
      show.dur = playHejnal();
      walkers.forEach(w => { w.look = 1; });
      scarePigeons(800, 570, 2000, true); sfx('flap');
    }

/* ---------------- ⑤ 互動：聲音（Web Audio 即時合成，不使用任何音檔） ----------------
   聲音分兩條軌：音樂軌（號角）與音效軌（點擊音效）。
   同一條軌一次只播一段：新的一段開始時，舊的會淡出停掉，不會疊在一起；
   音樂播放時，音效會自動轉小聲；按「聲音：關」立刻全部停止。 */

/* 海那爾號角曲：傳統曲調（公有領域），這裡依其輪廓簡化改編。

  ['A4', .5], ['C5', .5], ['F5', 1.5], ['-', .15], ['F5', .32], ['E5', .32], ['D5', .32], ['C5', .32], ['D5', 1.2], ['-', .3],

// 音效

  boop(t) { const o = osc('sine', 520, t, .2, envG(t, .01, .2, .2)); o.frequency.exponentialRampToValueAtTime(820, t + .12); },
  squish(t) { const f = nz(t, .3, 300, .35, 'lowpass', 3); f.frequency.setValueAtTime(700, t); f.frequency.exponentialRampToValueAtTime(140, t + .28); osc('sine', 120, t, .2, envG(t, .01, .18, .2)); },
  flap(t) { for (let i = 0; i < 12; i++) nz(t + i * .06 + Math.random() * .02, .05, 1000 + Math.random() * 600, .22, 'bandpass', .8); },
  coo(t) { [0, .45].forEach(k => { const o = osc('sine', 420, t + k, .4, envG(t + k, .06, .36, .16)); o.frequency.exponentialRampToValueAtTime(310, t + k + .38); }); },

function popBubble(i) {

// 瞳孔看向滑鼠（號角時看向塔頂）
function lookAt(nodes, ox, oy, s) {
  let tx = mouse.x, ty = mouse.y;
  if (show.on && show.phase !== 'clock') { tx = TOWER_X; ty = WIN_Y; }
  const dx = tx - ox, dy = ty - (oy - 59 * s), d = Math.hypot(dx, dy) || 1;
  const px = dx / d * 1.2, py = dy / d * 1.2;
  nodes.forEach((p, i) => { p.setAttribute('transform', `translate(${f1(px)} ${f1(py)})`); });
}
function stepWalkers(dt) {
  const rain = wx.rain > .5 || wx.snow > .5;
  // 每條步道照前後順序處理：太靠近前一個人就放慢、停下
  LANES.forEach((L, li) => {
    const ws = walkers.filter(w => w.lane === li);
    ws.forEach(w => {
      let want = (show.on && show.phase !== 'clock') ? 0 : w.base;
      let minGap = Infinity, front = null;
      ws.forEach(o => { if (o === w) return; const g = laneGap(w, o); if (g < minGap) { minGap = g; front = o; } });
      const need = 34 * w.s;
      if (minGap < need) want = 0;
      else if (minGap < need * 2.2 && front) want = Math.min(want, front.v);
      w.v += (want - w.v) * Math.min(1, dt * 4);
      w.x += w.v * w.dir * dt;
      if (w.x > X0W + SPAN) w.x -= SPAN; if (w.x < X0W) w.x += SPAN;
    });
  });
  walkers.forEach(w => {
    const moving = w.v > 4;
    if (moving) w.ph += dt * w.v / 9;
    const f = moving ? Math.floor(w.ph) % 4 : 1;
    const ang = [16, 0, -16, 0][f];
    w.legL.setAttribute('transform', `rotate(${ang} -3 -20)`);
    w.legR.setAttribute('transform', `rotate(${-ang} 3 -20)`);
    let armL = -ang * .8, armR = ang * .8;
    if (w.wave > 0) { w.wave -= dt || 1 / FPS; armR = -150 + (Math.floor(frame / 2) % 2) * 24; }
    w.armL.setAttribute('transform', `rotate(${armL} -12 -44)`);
    w.armR.setAttribute('transform', `rotate(${armR} 12 -44)`);
    const showUmb = rain && w.hasUmb;
    w.umb.setAttribute('display', showUmb ? '' : 'none');
    if (w.hop > 0) w.hop = Math.max(0, w.hop - (1 / FPS) * 2.5);
    const hop = Math.sin(w.hop * Math.PI) * 14;
    const bob = moving && f % 2 === 0 ? -1.2 : 0;
    const jit = reduced ? 0 : (Math.random() - .5) * .5;   // 定格動畫的細微抖動
    w.g.setAttribute('transform', `translate(${f1(w.x + jit)} ${f1(w.y + bob - hop)}) scale(${w.s})`);
    lookAt(w.pu, w.x, w.y, w.s);
  });

function stepCarriages(dt) {
  CLANES.forEach((L, li) => {
    const cs = carriages.filter(c => c.lane === li);
    cs.forEach(c => {
      let want = c.base * (c.boost > 0 ? 1.6 : 1);
      if (show.on && show.phase !== 'clock') want = 0;   // 號角響起時馬車也停下來聽
      cs.forEach(o => { if (o === c) return; const g = laneGap(c, o); if (g < 240 * c.s) want = 0; else if (g < 380 * c.s) want = Math.min(want, o.v); });

      c.x += c.v * c.dir * dt;
      if (c.x > X0W + SPAN + 100) c.x -= SPAN + 200; if (c.x < X0W - 100) c.x += SPAN + 200;
      if (c.boost > 0) c.boost -= dt;
    });
  });
  carriages.forEach(c => {
    const moving = c.v > 4;
    if (moving) c.ph += dt * c.v / 10;
    const f = Math.floor(c.ph) % 4;
    c.legs.forEach((l, i) => { const k = l.getAttribute('class'), j = +k.slice(2) - 1; l.setAttribute('transform', moving ? `rotate(${[14, -10, -14, 10][(f + j) % 4]} ${[19, 11, -19, -11][j]} -30)` : ''); });

    c.g.setAttribute('transform', `translate(${f1(c.x + jit)} ${f1(c.y)}) scale(${f1(c.s * c.dir)} ${c.s})`);
    lookAt(c.pu, c.x, c.y - 40, c.s);
  });

function stepPigeons(dt) {
  const mv = reduced ? 0 : 1;
  pigeons.forEach(p => {
    if (p.fly) {
      // 飛起來：繞一圈再降落回原地附近
      p.flyT += dt;
      if (p.flyT < 2.4) { p.x += p.vx * dt * mv; p.alt += -p.vy * dt * mv * (1 - p.flyT / 2.4); }
      else { p.x += (p.hx - p.x) * Math.min(1, dt * 1.2); p.alt = Math.max(0, p.alt - 120 * dt); if (p.alt <= 0 && Math.abs(p.hx - p.x) < 6) { p.fly = 0; p.y = p.hy; } }

      p.wing.setAttribute('transform', frame % 2 ? 'translate(0 -6) scale(1 -1.4)' : 'translate(0 2)');
      p.g.setAttribute('transform', `translate(${f1(p.x)} ${f1(p.y - p.alt)}) scale(${p.dir} 1)`);
      p.g.querySelector('ellipse').setAttribute('opacity', p.alt > 30 ? 0 : 1);
      return;
    }
    p.wing.removeAttribute('transform');
    // 走向撒下的種子
    if (p.target) {
      const dx = p.target.x - p.x, dy = p.target.y - p.y, d = Math.hypot(dx, dy);
      if (d > 4) { p.x += dx / d * 40 * dt * mv; p.y += dy / d * 40 * dt * mv; p.dir = Math.sign(dx) || p.dir; }
      else { p.peck = 1; if (Math.random() < .02) { p.target = null; p.hx = p.x; p.hy = p.y; } }
    } else if (mv && Math.random() < .01) { p.dir *= -1; }
    else if (mv && Math.random() < .03) { p.x += p.dir * 3; }
    // 行人靠近就跳開（人不會踩過鴿子）
    walkers.forEach(w => { if (Math.abs(w.y - p.y) < 14 && Math.abs(w.x - p.x) < 26 * w.s) { p.x += (p.x > w.x ? 1 : -1) * 6; p.y = clamp(p.y + (p.y > w.y ? 6 : -6), 544, 598); if (Math.abs(w.y - p.y) < 14) p.y = w.y + (p.y > w.y ? 15 : -15); p.hx = p.x; p.hy = p.y; } });
    p.y = clamp(p.y, 544, 598);
    const pk = (p.peck > 0 || Math.random() < .04) && mv && frame % 4 < 2;
    if (p.peck > 0) p.peck -= dt;
    p.pb.setAttribute('transform', pk ? 'rotate(24 4 -6)' : '');
    p.g.setAttribute('transform', `translate(${f1(p.x)} ${f1(p.y)}) scale(${p.dir} 1)`);
    p.g.querySelector('ellipse').setAttribute('opacity', 1);
  });
}

function feedPigeons() {
  sfx('rustle');
  const cx = rand(500, 1100), cy = rand(560, 590);
  for (let i = 0; i < 16; i++) {
    const sx = cx + rand(-60, 60), sy = clamp(cy + rand(-14, 14), 548, 596);
    const s = el('circle', { cx: f1(sx), cy: f1(sy), r: 2, style: 'fill:var(--seed)' }, $('fx'));
    tween(s, 8, k => s.setAttribute('opacity', f1(k < .8 ? 1 : (1 - k) * 5)), () => s.remove());
  }
  pigeons.forEach((p, i) => { if (!p.fly) p.target = { x: cx + rand(-60, 60), y: clamp(cy + rand(-12, 12), 548, 596) }; });
  // 再從天上飛來幾隻
  for (let i = 0; i < 4; i++) {
    const p = pigeons[Math.floor(Math.random() * pigeons.length)];
    if (p.fly) continue;
    p.x = cx + rand(-500, 500); p.alt = 200; p.fly = 1; p.flyT = 2.4; p.hx = cx + rand(-50, 50); p.hy = clamp(cy + rand(-10, 10), 548, 596); p.y = p.hy;
  }
  say(cx, cy - 60, '咕咕咕～', 1.4);
  setTimeout(() => sfx('coo'), 600);
}

/* ---------- 動畫：噴火 ---------- */
function dragonFire(p, dur) {
  const F = W.fire;
  F.on = true; F.t = 0; F.p = p; F.dur = dur;
  W.cool = dur + 1.2;
  if (view.k > .9) sfx(p > 1.6 ? 'fireBig' : 'fire');
  // 觀眾歡呼
  W.spect.forEach((s, i) => { s.hop = .6 + i * .05; s.cheer = dur + .8; });
  if (!dshow.on && view.k > .9) setTimeout(() => say(pick(W.spect).x, 380, pick(['哇——！', 'Smok!', '好燙！', '噴火了！']), 1.4), 300);
  if (night > .5) { const c = W.spect.find(s => s.cam); if (c) flash(c.x + 2, c.y - 34 * c.s); }
}
function flash(x, y) {
  const c = el('circle', { cx: x, cy: y, r: 6, fill: '#fff', opacity: .95 }, W.fx);
  tween(c, .35, k => { c.setAttribute('r', f1(6 + k * 26)); c.setAttribute('opacity', f1(.95 * (1 - k))); }, () => c.remove());
}
function stepFire(dt) {
  const F = W.fire;
  W.cool = Math.max(0, W.cool - dt);
  if (!F.on) { if (F.env > 0) F.env = 0; return; }
  F.t += dt;
  const t = F.t;
  F.env = reduced ? (t < F.dur ? .8 : 0) : Math.min(1, t / .18) * (t < F.dur ? 1 : Math.max(0, 1 - (t - F.dur) / .4));
  const e = F.env, p = F.p;
  if (e <= 0 && t > F.dur) { F.on = false; W.flame.setAttribute('opacity', 0); W.fireLight.setAttribute('opacity', 0); W.fireRefl.setAttribute('opacity', 0); W.eye.setAttribute('fill', '#e8c24a'); return; }
  const jit = reduced ? 1 : rand(.86, 1.14);
  const L = 150 * p * e * jit, H = 34 * Math.sqrt(p) * e * (reduced ? 1 : rand(.9, 1.15));
  W.flame.setAttribute('opacity', 1);
  W.flameParts.forEach(fp => fp.p.setAttribute('d', flamePath(L * fp.l, H * fp.h)));
  W.licks.forEach((c, i) => {
    const k = (i + 1) / 6;
    c.setAttribute('cx', f1(L * (.4 + k * .55)));
    c.setAttribute('cy', f1((reduced ? 0 : rand(-1, 1)) * H * .5));
    c.setAttribute('r', f1(H * (.5 - k * .3) * (reduced ? 1 : rand(.7, 1.2))));
  });
  W.fireLight.setAttribute('opacity', (e * Math.min(1, .45 + night * .6) * (reduced ? 1 : rand(.85, 1))).toFixed(3));
  W.fireRefl.setAttribute('opacity', (e * .8 * (.4 + night * .6)).toFixed(3));
  const sx = .6 + L / 300, jx = reduced ? 0 : rand(-5, 5);
  W.fireRefl.setAttribute('transform', `translate(${f1(1170 + jx)} 0) scale(${sx.toFixed(2)} 1) translate(-1170 0)`);
  W.eye.setAttribute('fill', e > .3 ? '#ff6a2a' : '#e8c24a');
  // 火星與黑煙
  if (!reduced && e > .4) {
    const a = MOUTH.a * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
    for (let i = 0; i < 2; i++) {
      const d = L * rand(.6, 1);
      emb(MOUTH.x + ca * d, MOUTH.y + sa * d, ca * rand(40, 90) + rand(-20, 20), sa * rand(40, 90) - rand(30, 70));
    }
    if (Math.random() < .5) smoke(MOUTH.x + ca * L * .9, MOUTH.y + sa * L * .9 - 10);
  }
}
function emb(x, y, vx, vy) {
  const c = el('circle', { cx: f1(x), cy: f1(y), r: f1(rand(2, 4)), fill: pick(['#ffd25a', '#ff8a2a', '#ffb04a']) }, W.fx);
  let px = x, py = y;
  tween(c, rand(.6, 1.1), (k, dt) => { vy -= 30 * dt; px += vx * dt; py += vy * dt; c.setAttribute('cx', f1(px)); c.setAttribute('cy', f1(py)); c.setAttribute('opacity', f1(1 - k)); }, () => c.remove());

function smoke(x, y) {
  const c = el('circle', { cx: f1(x), cy: f1(y), r: 8, fill: '#5a5058', opacity: .5, filter: 'url(#clayS)' }, W.fx);

function eyes(nodes, ox, oy, s) {
  let tx = mouse.x, ty = mouse.y;

  const dx = tx - ox, dy = ty - (oy - 59 * s), d = Math.hypot(dx, dy) || 1;

function stepWWalkers(dt) {
  const rain = wx.rain > .5 || wx.snow > .5;
  WLANES.forEach((L, li) => {
    const ws = W.walkers.filter(w => w.lane === li);
    ws.forEach(w => {
      let want = (dshow.on && dshow.phase === 'play') ? w.base * .35 : w.base;
      let minGap = Infinity, front = null;
      ws.forEach(o => { if (o === w) return; const gp = laneGap(w, o); if (gp < minGap) { minGap = gp; front = o; } });
      const need = 34 * w.s;
      if (minGap < need) want = 0; else if (minGap < need * 2.2 && front) want = Math.min(want, front.v);
      w.v += (want - w.v) * Math.min(1, dt * 4);
      w.x += w.v * w.dir * dt;
      if (w.x > X0W + SPAN) w.x -= SPAN; if (w.x < X0W) w.x += SPAN;
    });
  });
  W.walkers.forEach(w => {
    const moving = w.v > 4;

    const f = moving ? Math.floor(w.ph) % 4 : 1, ang = [16, 0, -16, 0][f];
    w.legL.setAttribute('transform', `rotate(${ang} -3 -20)`);
    w.legR.setAttribute('transform', `rotate(${-ang} 3 -20)`);
    w.armL.setAttribute('transform', `rotate(${-ang * .8} -12 -44)`);
    w.armR.setAttribute('transform', `rotate(${ang * .8} 12 -44)`);
    w.umb.setAttribute('display', rain && w.hasUmb ? '' : 'none');
    if (w.hop > 0) w.hop = Math.max(0, w.hop - (1 / FPS) * 2.5);
    const hop = Math.sin(w.hop * Math.PI) * 12, bob = moving && f % 2 === 0 ? -1.2 : 0, jit = reduced ? 0 : (Math.random() - .5) * .5;
    w.g.setAttribute('transform', `translate(${f1(w.x + jit)} ${f1(w.y + bob - hop)}) scale(${w.s})`);
    eyes(w.pu, w.x, w.y, w.s);
  });
  const rainS = wx.rain > .5 || wx.snow > .5;
  W.spect.forEach(s => {
    if (s.hop > 0) s.hop = Math.max(0, s.hop - (1 / FPS) * 2);
    if (s.cheer > 0) s.cheer -= dt || 1 / FPS;
    const up = s.cheer > 0 ? -150 + (Math.floor(frame / 2) % 2) * 22 : 0;
    s.armR.setAttribute('transform', `rotate(${up} 12 -44)`);
    s.armL.setAttribute('transform', `rotate(${s.cheer > 0 ? 150 - (Math.floor(frame / 2) % 2) * 22 : 0} -12 -44)`);
    s.umb.setAttribute('display', rainS && s.cheer <= 0 ? '' : 'none');
    const hop = Math.sin(s.hop * Math.PI) * 10;
    s.g.setAttribute('transform', `translate(${f1(s.x)} ${f1(s.y - hop)}) scale(${s.s})`);
    eyes(s.pu, s.x, s.y, s.s);
  });
}

/* ---------- 攝影機：在兩座布景之間橫移 ---------- */
const view = { cur: 'square', k: 0, from: 0, to: 0, t: 0, dur: 2.4, moving: false, cb: null };
function goTo(name, cb) {
  const to = name === 'wawel' ? 1 : 0;
  if (view.moving) return;
  if (view.k === to) { cb && cb(); return; }
  if (to === 1) W.nextFire = Math.min(W.nextFire, 5);     // 到了沒多久龍就會噴火
  view.cur = name; view.from = view.k; view.to = to; view.t = reduced ? view.dur : 0; view.moving = true; view.cb = cb || null;
  $('squareSet').removeAttribute('display'); $('wawelSet').removeAttribute('display');
  updateGoBtn(); sfx('slide');
}
function stepView(dt) {
  if (view.moving) {
    view.t += dt;
    view.k = view.from + (view.to - view.from) * smooth(0, view.dur, view.t);
    if (view.t >= view.dur) {
      view.moving = false; view.k = view.to;
      $(view.to ? 'squareSet' : 'wawelSet').setAttribute('display', 'none');
      const cb = view.cb; view.cb = null; cb && cb();
    }
  }
  const z = 1 + .035 * smooth(0, 1, cine.k) * (dshow.on ? 1 : 0) * (reduced ? 0 : 1);
  $('squareSet').setAttribute('transform', `translate(${f1(-1600 * view.k)} 0)`);
  $('wawelSet').setAttribute('transform', `translate(${f1(1600 * (1 - view.k))} 0)` + (z > 1.0005 ? ` translate(1180 330) scale(${z.toFixed(4)}) translate(-1180 -330)` : ''));
  $('clouds').setAttribute('transform', `translate(${f1(-180 * view.k)} 0)`);
}
function updateGoBtn() {
  $('btnGo').textContent = view.cur === 'wawel' ? '📍 回中央廣場' : '📍 去瓦維爾山';
}
function onSquare(fn) { return () => { userGesture = true; ensureAudio(); if (dshow.on) return; goTo('square', fn); }; }

/* ---------- 燈光：表演時的暗角＋中央微亮（約 2.5 秒淡入淡出，不用上下黑邊） ---------- */
const cine = { k: 0, target: 0 };
function setCine(k) { cine.target = k; }
function stepCine(dt) {
  if (cine.k === cine.target) return;
  const s = reduced ? 1 : dt / 2.5;
  cine.k = cine.k < cine.target ? Math.min(cine.target, cine.k + s) : Math.max(cine.target, cine.k - s);
  $('cineFx').setAttribute('opacity', smooth(0, 1, cine.k).toFixed(3));
}

/* ---------- 噴火龍秀：約 20 秒原創克拉科維亞克舞曲（2/4 拍、切分節奏），龍跟著重拍噴火 ----------
   和弦：Dm–A7–F–C–Gm，旋律每個音都是當下和弦的組成音。 */
const dshow = { on: false, t: 0, phase: '', fired: 0, dur: 0 };
const BAR = .8;    // 一小節 0.8 秒（四分音符 0.4 秒）
const KRAK = [     // [和弦, 旋律 [[音, 拍長(秒)]…]]
  ['Dm', [['A4', .2], ['D5', .4], ['F5', .2]]], ['Dm', [['D5', .2], ['A4', .4], ['F4', .2]]],
  ['A7', [['E5', .2], ['C#5', .4], ['A4', .2]]], ['A7', [['G4', .2], ['A4', .2], ['C#5', .4]]],
  ['Dm', [['D5', .2], ['F5', .4], ['A5', .2]]], ['Dm', [['F5', .2], ['D5', .4], ['A4', .2]]],
  ['A7', [['C#5', .2], ['E5', .2], ['G5', .2], ['E5', .2]]], ['Dm', [['D5', .8]]],
  ['F', [['C5', .2], ['F5', .4], ['A5', .2]]], ['F', [['A5', .2], ['F5', .4], ['C5', .2]]],
  ['C', [['E5', .2], ['G5', .4], ['E5', .2]]], ['C', [['C5', .4], ['G4', .4]]],
  ['Gm', [['Bb4', .2], ['D5', .4], ['G5', .2]]], ['Dm', [['F5', .2], ['D5', .4], ['A4', .2]]],
  ['A7', [['E5', .2], ['C#5', .2], ['E5', .2], ['G5', .2]]], ['Dm', [['F5', .4], ['D5', .4]]],
  ['Dm', [['A4', .2], ['D5', .2], ['F5', .2], ['A5', .2]]], ['Gm', [['G5', .2], ['D5', .4], ['Bb4', .2]]],
  ['A7', [['A4', .2], ['C#5', .2], ['E5', .2], ['A5', .2]]], ['Dm', [['F5', .4], ['D5', .4]]],
  ['Dm', [['D5', .2], ['F5', .2], ['A5', .4]]], ['Gm', [['Bb5', .2], ['G5', .2], ['D5', .4]]],
  ['A7', [['C#5', .2], ['E5', .2], ['G5', .2], ['A5', .2]]], ['Dm', [['A5', .2], ['D6', 1.4]]]
];
const CHORD = { Dm: ['D', 'F', 'A'], A7: ['C#', 'E', 'G'], F: ['F', 'A', 'C'], C: ['C', 'E', 'G'], Gm: ['G', 'Bb', 'D'] };
const BASS = { Dm: ['D3', 'A2'], A7: ['A2', 'E3'], F: ['F2', 'C3'], C: ['C3', 'G2'], Gm: ['G2', 'D3'] };
// 噴火時間點：[小節（從 0 起算）, 火力, 持續秒數]
const DFIRE = [[3, 1, 1], [7, 1.2, 1.3], [11, 1, 1], [15, 1.3, 1.4], [19, 1.2, 1.2], [21, 1.4, 1.3], [23, 2, 2.4]];

function fiddle(f, t, d, v, dest) {
  const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600; lp.Q.value = 1.2;
  const g = actx.createGain();
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + .03);
  g.gain.setValueAtTime(v * .85, t + Math.max(.04, d - .05)); g.gain.linearRampToValueAtTime(.0001, t + d + .06);
  lp.connect(g); g.connect(dest);
  const vib = actx.createOscillator(), vg = actx.createGain(); vib.frequency.value = 5.5; vg.gain.value = d > .3 ? f * .006 : 0; vib.connect(vg);
  [['sawtooth', 1, .7], ['triangle', 2, .25]].forEach(([ty, m, gv]) => {
    const o = actx.createOscillator(); o.type = ty; o.frequency.value = f * m; vg.connect(o.frequency);
    const og = actx.createGain(); og.gain.value = gv; o.connect(og); og.connect(lp); o.start(t); o.stop(t + d + .1);
  });
  vib.start(t); vib.stop(t + d + .1);
}
function pluck(f, t, d, v, dest) { const o = osc('triangle', f, t, d, envG(t, .005, d, v, dest)); return o; }
function playKrakowiak() {
  const total = KRAK.length * BAR + 1;
  if (!ok()) return total;
  bus('music', total + 1);
  const out = OUT;
  const t0 = actx.currentTime + .1;
  KRAK.forEach(([ch, mel], i) => {
    const tb = t0 + i * BAR, last = i === KRAK.length - 1;
    // 低音：重拍根音、第二拍五音
    pluck(HZ(BASS[ch][0]), tb, .36, .2, out);
    if (!last) pluck(HZ(BASS[ch][1]), tb + .4, .3, .16, out);
    // 手風琴和弦：反拍（八分音符的「&」）
    (last ? [0] : [.2, .6]).forEach(o => CHORD[ch].forEach(n => pluck(HZ(n + (n === 'C' || n === 'C#' || n === 'D' ? '5' : '4')), tb + o, last ? 1.4 : .14, .045, out)));
    // 鼓：重拍低鼓、反拍鈴鼓
    const k = osc('sine', 110, tb, .25, envG(tb, .003, .22, .3, out)); k.frequency.exponentialRampToValueAtTime(48, tb + .2);
    if (!last) [.2, .6].forEach(o => nz(tb + o, .06, 7000, .06, 'highpass', .8, out));
    // 旋律（小提琴）
    let tt = tb;
    mel.forEach(([n, d]) => { fiddle(HZ(n), tt, d * .92, .09, out); tt += d; });
  });
  // 結尾：鈴鼓滾奏
  const te = t0 + (KRAK.length - 1) * BAR;
  for (let i = 0; i < 10; i++) nz(te + i * .07, .05, 7000, .05, 'highpass', .8, out);
  return total;
}
function startDragonShow() {
  if (show.on || dshow.on || view.moving) return;
  userGesture = true; ensureAudio();
  dshow.on = true; dshow.phase = 'go'; dshow.t = 0; dshow.fired = 0;
  $('btnDragon').classList.add('on'); $('btnDragon').textContent = '🐉 噴火中…';
  goTo('wawel', () => {
    dshow.phase = 'dusk'; dshow.t = 0; dshow.fromT = T.t;
    const h = T.t * 24;
    let to = h >= 20.5 || h < 4 ? T.t : 20.75 / 24;
    dshow.toT = to;
    setCine(1);
  });
}
function dshowStep(dt) {
  dshow.t += dt;
  const t = dshow.t;
  if (dshow.phase === 'dusk') {
    const k = reduced ? 1 : smooth(0, 1.6, t);
    T.t = dshow.fromT + (dshow.toT - dshow.fromT) * k; applyTime(true);
    if (t >= 1.8) { dshow.phase = 'play'; dshow.t = 0; dshow.dur = playKrakowiak(); say(1210, 130, '龍要表演了！', 1.4); }
    return;
  }
  if (dshow.phase === 'play') {
    while (dshow.fired < DFIRE.length && t >= DFIRE[dshow.fired][0] * BAR + .1) {
      const [, p, d] = DFIRE[dshow.fired++];
      W.fire.on = false; dragonFire(p, d);
      if (dshow.fired === DFIRE.length) say(1300, 120, 'Smok Wawelski!', 2);
    }
    if (t >= dshow.dur + .4) { dshow.phase = 'end'; dshow.t = 0; setCine(0); sfx('applause'); W.spect.forEach(s => { s.cheer = 2.4; s.hop = 1; }); }
    return;
  }
  if (dshow.phase === 'end' && t >= 2.6) {
    dshow.on = false; dshow.phase = ''; W.nextFire = rand(20, 30);
    $('btnDragon').classList.remove('on'); $('btnDragon').textContent = '🐉 噴火龍秀';
  }
}

/* ---------------- 初始化 ---------------- */
function init() {
  makeThumbprints();
  drawSky();
  drawHouses();
  drawTownHall();
  drawClothHall();
  drawBasilica();
  drawChapel();
  drawProps();
  drawWawel();
  buildIris();
  buildWeather();
  // 行人：四條步道
  [[0, 7], [1, 7], [2, 6], [3, 6]].forEach(([li, n]) => { for (let i = 0; i < n; i++) addWalker(li, X0W + (i + srand(.1, .5)) * SPAN / n); });
  // 馬車：每條馬車道兩輛
  addCarriage(0, 200); addCarriage(0, 1100); addCarriage(1, 600); addCarriage(1, 1500);
  // 鴿子
  for (let i = 0; i < 22; i++) addPigeon(srand(80, 1520), srand(546, 596));
  sortActors();
  bindAll();
  setWeather(0);
  applyTime(true);
  step(1 / FPS);
  requestAnimationFrame(loop);
}
init();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on ? 'show' : dshow.on ? 'dragon' : null,
  btn: { show: 'btnShow', dragon: 'btnDragon' },
  save: () => ({ t: T.t, auto: T.auto, k: view.k, cur: view.cur }),
  stop: () => {
    if (show.on) endShow();
    if (dshow.on) {
      view.cb = null; dshow.on = false; dshow.phase = ''; W.fire.on = false; W.nextFire = rand(20, 30); setCine(0);
      $('btnDragon').classList.remove('on'); $('btnDragon').textContent = '🐉 噴火龍秀';
    }
  },
  restore: s => {
    T.t = s.t; T.auto = s.auto; T.target = null; $('btnAuto').setAttribute('aria-pressed', String(T.auto));
    if (view.k !== s.k || view.moving) {   // 回到表演前的鏡頭（廣場或瓦維爾山）
      view.moving = false; view.cb = null; view.k = s.k; view.cur = s.cur;
      $('squareSet').removeAttribute('display'); $('wawelSet').removeAttribute('display');
      $(s.k ? 'squareSet' : 'wawelSet').setAttribute('display', 'none'); updateGoBtn();
    }
    applyTime(true);
  }
});
/* /ShowStop */
})();
</script>
