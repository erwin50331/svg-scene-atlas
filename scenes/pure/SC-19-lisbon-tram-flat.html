<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>里斯本坡道電車</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;900&display=swap">
<style>
/* =========================================================
   SC-19 葡萄牙・里斯本｜扁平插畫風格
   【色票 token】所有顏色集中在這裡。
   - 場景色成對出現：--名稱-day / --名稱-night，
     JS 依「日夜比例」自動混色，輸出成 --名稱 給 SVG 使用，
     並自動產生 .f-名稱（填色）與 .s-名稱（描邊）class。
   - 「常亮光源」不參與混色（窗燈、路燈、炭火、星月）。
   換色時只需改這個區塊。
   ========================================================= */
:root{
  color-scheme:dark;

  /* ---- 頁面外框 ---- */
  --page-bg:#14161f;
  --page-panel:#20232f;
  --page-fg:#f1ece0;
  --page-dim:#a9a69c;
  --page-line:#343848;
  --page-accent:#f2c230;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-sign:"Noto Sans TC","Arial Narrow",sans-serif;

  /* ---- 天空、雲 ---- */
  --sky-top-day:#7cc6ea;      --sky-top-night:#0a1238;
  --sky-bot-day:#fbe7c4;      --sky-bot-night:#2c2c5e;
  --cloud-day:#ffffff;        --cloud-night:#3b3f72;
  --cloud-sh-day:#e4eef5;     --cloud-sh-night:#2d3162;

  /* ---- 對岸、河、吊橋 ---- */
  --far-hill-day:#b3c7c4;     --far-hill-night:#1d2550;
  --far-hill-dk-day:#9bb3b1;  --far-hill-dk-night:#182046;
  --statue-day:#e8e2d4;       --statue-night:#7c80a8;
  --river-day:#4f9fc4;        --river-night:#121c46;
  --river-lt-day:#a7dbee;     --river-lt-night:#3a4d8a;
  --river-dk-day:#3c86ab;     --river-dk-night:#0d153a;
  --bridge-day:#d0442e;       --bridge-night:#5c2232;
  --bridge-dk-day:#a5321f;    --bridge-dk-night:#3f1828;

  /* ---- 城堡山 ---- */
  --hill-day:#8fb070;         --hill-night:#1d3038;
  --hill-dk-day:#769a5c;      --hill-dk-night:#16262f;
  --pine-day:#4f7d45;         --pine-night:#122228;
  --pine-dk-day:#3e6638;      --pine-dk-night:#0d1a20;
  --trunk-day:#7a5236;        --trunk-night:#2a1e24;
  --castle-day:#d8c39a;       --castle-night:#c09a5e;   /* 夜裡打燈，變成暖金色 */
  --castle-dk-day:#b8a074;    --castle-dk-night:#8c6c3e;
  --house-a-day:#f2d48a;      --house-a-night:#4a4466;
  --house-b-day:#f1b9a8;      --house-b-night:#4d3a5a;
  --house-c-day:#f7f1e3;      --house-c-night:#575a7c;
  --house-d-day:#a9d1d9;      --house-d-night:#334465;

  /* ---- 街屋 ---- */
  --roof-day:#d0683d;         --roof-night:#4f2a34;
  --roof-dk-day:#a9502c;      --roof-dk-night:#3a1f2a;
  --wall-pink-day:#efa59b;    --wall-pink-night:#5b3a52;
  --wall-yellow-day:#f2c35a;  --wall-yellow-night:#5f4c3c;
  --wall-white-day:#f6f0e2;   --wall-white-night:#5a5d7e;
  --wall-red-day:#cf6a4c;     --wall-red-night:#4f2c3c;
  --wall-lilac-day:#b9a3d6;   --wall-lilac-night:#40395f;
  --tile-blue-day:#2f62b0;    --tile-blue-night:#1b2a5c;
  --tile-white-day:#eef2f6;   --tile-white-night:#4f5a80;
  --tile-green-day:#3e9a7d;   --tile-green-night:#1b3d44;
  --trim-day:#fbf7ee;         --trim-night:#6a6d8e;
  --shutter-day:#3f8a5a;      --shutter-night:#1a3238;
  --iron-day:#2c2e36;         --iron-night:#0b0c16;
  --glass-day:#36506a;        --glass-night:#141a33;
  --door-day:#6b3f2a;         --door-night:#26182a;

  /* ---- 街道、石材 ---- */
  --stone-day:#c9bfae;        --stone-night:#3e3e58;
  --stone-lt-day:#e7dfcf;     --stone-lt-night:#55566f;
  --stone-dk-day:#a69b88;     --stone-dk-night:#2c2c44;
  --road-day:#8f8a84;         --road-night:#2b2b40;
  --road-dk-day:#77726c;      --road-dk-night:#222236;
  --rail-day:#d7d3cc;         --rail-night:#6e6f8e;
  --walk-day:#f1ece2;         --walk-night:#5a5b78;
  --calc-day:#3a3a40;         --calc-night:#191a2a;

  /* ---- 交通工具 ---- */
  --tram-day:#f2c230;         --tram-night:#8a6e2c;
  --tram-dk-day:#c99a1c;      --tram-dk-night:#5e4a20;
  --tram-cream-day:#fbf3dc;   --tram-cream-night:#6d6a80;
  --tram-roof-day:#9aa0a6;    --tram-roof-night:#373a52;
  --wheel-day:#2b2b30;        --wheel-night:#0b0b14;
  --tuk-day:#2fa58c;          --tuk-night:#164a4a;
  --tuk-top-day:#f4efe2;      --tuk-top-night:#5a5b78;
  --ferry-day:#f08a2c;        --ferry-night:#6a3c2a;
  --ferry-dk-day:#c76a1c;     --ferry-dk-night:#4a2a22;
  --hull-day:#fbfbf6;         --hull-night:#6a6d8c;
  --sail-day:#ffffff;         --sail-night:#7d82aa;

  /* ---- 觀景台、樹、攤子 ---- */
  --kiosk-day:#3f8f6a;        --kiosk-night:#173a38;
  --kiosk-dk-day:#2f7055;     --kiosk-dk-night:#102a2c;
  --umb-a-day:#e8553f;        --umb-a-night:#5a2532;
  --umb-b-day:#fdf6ea;        --umb-b-night:#5d5f7e;
  --jac-day:#9c7fd8;          --jac-night:#3e3466;
  --jac-dk-day:#7e62bf;       --jac-dk-night:#2e2752;
  --jac-lt-day:#c0a9ee;       --jac-lt-night:#544a82;
  --leaf-day:#5f9a52;         --leaf-night:#1a3030;
  --wood-day:#a2734a;         --wood-night:#3a2a2e;
  --fish-day:#b9c4cc;         --fish-night:#555c7c;
  --natas-day:#f4c25a;        --natas-night:#8a6c3c;
  --natas-dk-day:#8a4a1c;     --natas-dk-night:#3a2220;
  --orange-day:#f08c24;       --orange-night:#6a4026;
  --lemon-day:#f5d63a;        --lemon-night:#6c6030;
  --greens-day:#6aae4a;       --greens-night:#24402e;
  --pot-day:#c4643c;          --pot-night:#4a2a2e;
  --geranium-day:#e83a4a;     --geranium-night:#62223a;
  --smoke-day:#f4f1ea;        --smoke-night:#6f7396;

  /* ---- 人物、動物 ---- */
  --ink-day:#26262e;          --ink-night:#05060f;
  --skin-day:#f0c7a2;         --skin-night:#8a7378;
  --skin2-day:#b47a52;        --skin2-night:#55404a;
  --hair-day:#3a2a22;         --hair-night:#100d16;
  --hair2-day:#d9a25a;        --hair2-night:#5a4636;
  --coat1-day:#e0533c;        --coat1-night:#5e2832;
  --coat2-day:#2f6fb0;        --coat2-night:#1c2f56;
  --coat3-day:#f2b632;        --coat3-night:#6a5430;
  --coat4-day:#4f9a62;        --coat4-night:#1e3a34;
  --coat5-day:#9a62b8;        --coat5-night:#3a2a52;
  --pants-day:#3a3f52;        --pants-night:#14151f;
  --black-day:#24222a;        --black-night:#0a0910;
  --gull-day:#ffffff;         --gull-night:#9aa0c4;
  --cat-day:#e48a3a;          --cat-night:#5a3a2a;
  --bubble-day:#ffffff;       --bubble-night:#eceaf6;

  /* ---- 常亮光源（不隨日夜混色） ---- */
  --win-on:#ffd27a;     /* 窗內暖光 */
  --shop-on:#ffe2a0;    /* 店內燈光 */
  --lamp:#ffe6a8;       /* 路燈、車燈 */
  --sun:#ffd166;
  --moon:#f6f1dc;
  --star:#fff8e0;
  --dusk:#ff8f5a;       /* 黃昏地平線暖光 */
  --flame:#ff7a2a;      /* 烤沙丁魚的火 */
  --ember:#ffcf5a;
  --spark:#c8f0ff;      /* 電車集電桿火花 */
  --note:#ffe08a;       /* 法朵音符 */
  --rb1:#e85a4f; --rb2:#f2b632; --rb3:#4fa8d8; --rb4:#6cc46a; --rb5:#f4f1ea; /* 節慶三角旗 */
}

/* ===== 頁面版面 ===== */
html,body{margin:0;background:var(--page-bg);color:var(--page-fg)}
body{font-family:var(--font-body);line-height:1.6}
.wrap{max-width:1680px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:16px}
.stage{position:relative;border-radius:10px;overflow:hidden;background:#000;
  box-shadow:0 0 0 1px var(--page-line),0 18px 40px -18px #000}
.stage svg{display:block;width:100%;height:auto;max-width:100%;touch-action:manipulation}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.controls button{font:500 .95rem/1 var(--font-body);color:var(--page-fg);background:var(--page-panel);
  border:1px solid var(--page-line);border-radius:999px;padding:10px 18px;cursor:pointer;
  transition:transform .12s,background .2s}
.controls button:hover{background:#2b2f3e}
.controls button:active{transform:translateY(2px)}
.controls button:focus-visible{outline:2px solid var(--page-accent);outline-offset:2px}
.controls button[aria-pressed="true"]{border-color:var(--page-accent);color:#fff}
.clock{margin-left:auto;font-size:1rem;color:var(--page-dim);font-variant-numeric:tabular-nums}
.hint{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px 20px;color:var(--page-dim);font-size:.88rem}
.hint b{color:var(--page-fg);font-weight:500;margin-right:.4em}

/* ===== SVG 內樣式 ===== */
.sign{font-family:var(--font-sign);font-weight:900;letter-spacing:.06em}
.lit{fill:var(--win-on);opacity:0;transition:opacity .4s}
.lit.on{opacity:var(--lit,.9)}
.hit{fill:#000;opacity:0}
.clickable,.win,#tram,#tuk,#ferry,#sky,#jacaranda,.laundry,#cat,#grill,#kiosk{cursor:pointer}
.star{fill:var(--star)}
.twinkle{animation:tw 3s ease-in-out infinite}
.twinkle:nth-child(3n){animation-delay:-1s}.twinkle:nth-child(3n+1){animation-delay:-2s}
@keyframes tw{50%{opacity:.25}}
/* 對話泡泡：外層 g 定位（transform 屬性），內層 .pop 做彈出動畫，兩者分開才不會互相覆蓋 */
.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes pop{from{transform:scale(0)}}
.bubble text{font-family:var(--font-body);font-weight:900;font-size:20px;fill:var(--ink)}
.note{font-family:serif;font-size:24px;fill:var(--note)}
@media (prefers-reduced-motion: reduce){
  .twinkle,.pop{animation:none}
  .lit{transition:none}
}
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>
<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。
   想恢復完整版，刪掉這整段 <style id="pure-art"> 即可。
   ========================================================= */
html,body{height:100%;margin:0!important;overflow:hidden}
body{display:flex!important;align-items:center;justify-content:center;padding:0!important}
body>.wrap{width:100%!important;max-width:min(100vw,calc(100vh * 8 / 3))!important;
  margin:0!important;padding:0!important;gap:0!important;display:block!important}
body>.wrap>:not(.stage){display:none!important}
body>.wrap>.stage{width:100%!important;max-width:100%!important;margin:0!important;
  border:0!important;border-radius:0!important;box-shadow:none!important}
</style>
</head>
<body>
<main class="wrap">
  <div class="stage">
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="里斯本黃色坡道電車爬上磁磚老街的扁平插畫動畫場景">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--sky-top)"/><stop offset="1" stop-color="var(--sky-bot)"/>
      </linearGradient>
      <linearGradient id="duskGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset=".3" stop-color="var(--dusk)" stop-opacity="0"/><stop offset="1" stop-color="var(--dusk)" stop-opacity=".75"/>
      </linearGradient>
      <radialGradient id="sunGlow"><stop offset=".3" stop-color="var(--sun)" stop-opacity=".55"/><stop offset="1" stop-color="var(--sun)" stop-opacity="0"/></radialGradient>
      <radialGradient id="moonGlow"><stop offset=".3" stop-color="var(--moon)" stop-opacity=".3"/><stop offset="1" stop-color="var(--moon)" stop-opacity="0"/></radialGradient>
      <radialGradient id="lampGlow"><stop offset="0" stop-color="var(--lamp)" stop-opacity=".85"/><stop offset=".35" stop-color="var(--lamp)" stop-opacity=".3"/><stop offset="1" stop-color="var(--lamp)" stop-opacity="0"/></radialGradient>
      <radialGradient id="fireGlow"><stop offset="0" stop-color="var(--ember)" stop-opacity=".9"/><stop offset="1" stop-color="var(--flame)" stop-opacity="0"/></radialGradient>
      <mask id="moonMask"><circle r="24" fill="#fff"/><circle cx="10" cy="-6" r="20" fill="#000"/></mask>
      <!-- 磁磚花紋（azulejo）：藍白四瓣花 -->
      <pattern id="azBlue" width="20" height="20" patternUnits="userSpaceOnUse">
        <rect width="20" height="20" class="f-tile-white"/>
        <path class="f-tile-blue" d="M10,2 Q12.5,7.5 18,10 Q12.5,12.5 10,18 Q7.5,12.5 2,10 Q7.5,7.5 10,2Z"/>
        <circle cx="10" cy="10" r="2" class="f-tile-white"/>
        <path class="f-tile-blue" d="M0,0h3v3h-3zM17,0h3v3h-3zM0,17h3v3h-3zM17,17h3v3h-3z"/>
      </pattern>
      <!-- 綠底白菱紋磁磚 -->
      <pattern id="azGreen" width="16" height="16" patternUnits="userSpaceOnUse">
        <rect width="16" height="16" class="f-tile-green"/>
        <path class="f-tile-white" d="M8,4 L12,8 L8,12 L4,8Z" opacity=".85"/>
        <circle cx="0" cy="0" r="1.6" class="f-tile-white"/><circle cx="16" cy="0" r="1.6" class="f-tile-white"/>
        <circle cx="0" cy="16" r="1.6" class="f-tile-white"/><circle cx="16" cy="16" r="1.6" class="f-tile-white"/>
      </pattern>
      <!-- 淡紫底白點磁磚 -->
      <pattern id="azLilac" width="14" height="14" patternUnits="userSpaceOnUse">
        <rect width="14" height="14" class="f-wall-lilac"/>
        <circle cx="7" cy="7" r="2.2" class="f-tile-white" opacity=".7"/>
        <path class="s-tile-white" stroke-width=".8" opacity=".35" d="M0,0H14M0,0V14"/>
      </pattern>
      <!-- 葡式碎石路（calçada）黑白波浪 -->
      <pattern id="calcada" width="72" height="34" patternUnits="userSpaceOnUse">
        <rect width="72" height="34" class="f-walk"/>
        <path class="s-calc" fill="none" stroke-width="6" d="M0,17 Q18,3 36,17 T72,17"/>
      </pattern>
      <!-- 石板路面 -->
      <pattern id="cobble" width="22" height="10" patternUnits="userSpaceOnUse">
        <rect width="22" height="10" class="f-road"/>
        <rect x="1" y="1" width="9" height="3.5" rx="1.5" class="f-road-dk"/>
        <rect x="12" y="6" width="9" height="3.5" rx="1.5" class="f-road-dk"/>
      </pattern>
    </defs>

    <!-- ================= 【場景】天空 ================= -->
    <!-- 點天空放出一隻海鷗 -->
    <rect id="sky" width="1600" height="600" fill="url(#skyGrad)"/>
    <rect id="duskGlow" width="1600" height="600" fill="url(#duskGrad)" opacity="0" pointer-events="none"/>
    <g id="stars" pointer-events="none"></g>
    <g id="sun" pointer-events="none"><circle r="95" fill="url(#sunGlow)"/><circle r="34" fill="var(--sun)"/></g>

function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const R = rng(19191919);
const pick = arr => arr[Math.floor(R() * arr.length)];
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const f1 = v => (+v).toFixed(1);

const cs = getComputedStyle(root);
const hex = s => { s = s.trim().replace("#",""); if (s.length === 3) s = s.split("").map(c => c + c).join(""); const n = parseInt(s,16); return [n>>16&255, n>>8&255, n&255]; };
const PAIRS = MIX.map(n => [n, hex(cs.getPropertyValue(`--${n}-day`)), hex(cs.getPropertyValue(`--${n}-night`))]);
let lastApplied = -1, night = 0;
const windows = [];   // 每扇窗：{ lit, thr, manual }
function applyNight(nt, force) {
  if (!force && Math.abs(nt - lastApplied) < 0.004) return;
  lastApplied = nt;
  for (const [n, a, b] of PAIRS) {
    const c = a.map((v, i) => Math.round(v + (b[i] - v) * nt));
    root.style.setProperty(`--${n}`, `rgb(${c[0]},${c[1]},${c[2]})`);
  }
  $("duskGlow").setAttribute("opacity", (Math.pow(4 * nt * (1 - nt), 2) * .7).toFixed(3));
  const on = clamp(nt * 1.6 - .5, 0, 1);
  document.querySelectorAll(".nightOnly").forEach(e => e.style.opacity = on.toFixed(3));
  $("stars").style.opacity = on.toFixed(3);
  // 燈光：路燈、壁燈、車燈的光暈
  document.querySelectorAll(".glow").forEach(e => e.setAttribute("opacity", (on * .95).toFixed(3)));
  $("headGlow").setAttribute("opacity", on.toFixed(3));
  $("tukGlow").setAttribute("opacity", on.toFixed(3));
  document.querySelectorAll(".tramLit,.ferryLit").forEach(e => e.classList.toggle("on", nt > .45));
  $("kioskLit").style.opacity = (.15 + on * .85).toFixed(2);
  for (const w of windows) w.lit.classList.toggle("on", w.manual !== null ? w.manual : nt > w.thr);
}

const bunting = [];
(function buildBunting() {

})();

function person(parent, o = {}) {

  if (o.dress) el("path", { class: coat, d: "M-6,-33 L6,-33 L10,-12 L-10,-12 Z" }, g);
  else el("rect", { x: -6.8, y: -34, width: 13.6, height: 18, rx: 4.5, class: coat }, g);

  if (o.bag) el("rect", { x: 5, y: -26, width: 6, height: 8, rx: 1.5, class: "f-" + o.bag }, g);
  el("circle", { cx: 0, cy: -40.5, r: 6.6, class: "f-" + (o.skin || "skin") }, g);

  if (o.hat) el("path", { class: "f-" + o.hat, d: "M-9,-45 L9,-45 L5,-47 L5,-51 L-5,-51 L-5,-47 Z" }, g);
  return { g, legL, legR };
}
function walkLegs(p, ph) {

/* =========================================================
   【互動】聲音（Web Audio 即時合成，不用音檔）
   ========================================================= */
let actx = null, soundOn = true;
function ac() {
  if (!soundOn) return null;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
  } catch (e) { return null; }
  return actx;
}
function env(ctx, t0, a, d, peak) {
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak, t0 + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d);
  g.connect(ctx.destination);
  return g;
}
function osc(ctx, type, f, t0, dur, dest) {
  const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t0);
  o.connect(dest); o.start(t0); o.stop(t0 + dur + .05); return o;
}
// 電車鈴：叮、叮
function sndBell() {
  const c = ac(); if (!c) return;
  for (let i = 0; i < 2; i++) {
    const t0 = c.currentTime + i * .26;
    osc(c, "sine", 1320, t0, 1.2, env(c, t0, .004, 1.1, .22));
    osc(c, "sine", 3410, t0, .6, env(c, t0, .002, .5, .06));
  }
}
// 低音汽笛
function sndHorn(f = 110, dur = 1.3, vol = .16) {
  const c = ac(); if (!c) return;
  const t0 = c.currentTime, lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900;
  const g = c.createGain(); g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + .08); g.gain.setValueAtTime(vol, t0 + dur - .2);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  lp.connect(g); g.connect(c.destination);
  osc(c, "sawtooth", f, t0, dur, lp); osc(c, "sawtooth", f * 1.5, t0, dur, lp);
}
// 三輪車喇叭：叭叭
function sndBeep() {

}
// 葡萄牙吉他撥弦（快速顫音）＋小調旋律
function pluck(c, f, t0, d, v = .12) {
  const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2600;
  const g = env(c, t0, .004, d, v); lp.connect(g);
  osc(c, "sawtooth", f, t0, d, lp); osc(c, "triangle", f * 2, t0, d * .6, g);
}
function sndFado() {
  const c = ac(); if (!c) return;
  const N = { E4: 329.6, A3: 220, E3: 164.8, G3s: 207.7, A4: 440, B4: 493.9, C5: 523.3, D5: 587.3, E5: 659.3, G4s: 415.3, F5: 698.5 };
  const mel = [["E5",.6],["F5",.3],["E5",.3],["D5",.6],["C5",.3],["B4",.3],["C5",.6],["B4",.3],["A4",.3],["G4s",.6],["A4",.3],["B4",.3],["E4",1.2],
               ["A4",.3],["B4",.3],["C5",.6],["D5",.3],["C5",.3],["B4",.6],["A4",.3],["G4s",.3],["A4",1.4]];

  let bt = t, bi = 0;
  for (const [n, d] of mel) {
    // 長音用顫音（同音快速連撥），是葡萄牙吉他的招牌
    if (d >= .6) { for (let k = 0; k < d / .09 - 1; k++) pluck(c, N[n], t + k * .09, .14, .07); }
    else pluck(c, N[n], t, d + .25);

  }
  while (bt < t) { pluck(c, N[bass[bi++ % bass.length]], bt, .9, .1); bt += .6; }

  const hp = c.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 3000;
  s.connect(hp); hp.connect(env(c, c.currentTime, .05, 1.1, .12)); s.start();

  const c = ac(); if (!c) return;

/* =========================================================
   【動畫】日夜循環
   phase：0 = 正午、0.5 = 深夜；night = 0~1
   ========================================================= */
const RM_QUERY = matchMedia("(prefers-reduced-motion: reduce)");
let reduced = RM_QUERY.matches;
let phase = 0.06;
let auto = !reduced;
let tween = null;
const CYCLE = 70;
const nightOf = p => .5 - .5 * Math.cos(p * Math.PI * 2);
function clockLabel(p) {
  const n = nightOf(p), rising = (p % 1) < .5;
  if (n < .25) return "白天・電車爬坡中";
  if (n > .75) return "深夜・法朵時間";
  return rising ? "黃昏・路燈亮起" : "清晨・第一班電車";
}

/* =========================================================
   【動畫】電車狀態：run 行駛 → dwell 停站 → away 出畫面等待
   上坡（dir=1）與下坡（dir=-1）輪流
   ========================================================= */
const STOP_X = 1172;
const tram = { x: 360, dir: 1, state: "run", wait: 0, vel: 40, stopped: false, spark: 0, wheel: 0 };
const tuk = { x: 1760, dir: -1, state: "run", wait: 0, boost: 0, wheel: 0 };
let gust = 0, wind = .4;
const petals = [], smoke = [], notes = [];

function placeVehicle(gEl, flipEl, x, y, dir) {
  gEl.setAttribute("transform", `translate(${f1(x)},${f1(y)}) rotate(${f1(ANG)})`);
  flipEl.setAttribute("transform", `scale(${dir},1)`);
}
function tramPax() {
  const g = $("tramPax"); g.innerHTML = "";
  [-49, -25, 23, 47, 71, -71].forEach(x => {
    if (Math.random() < .7) {
      el("circle", { cx: x, cy: -68, r: 5, class: Math.random() < .5 ? "f-skin" : "f-skin2" }, g);
      el("rect", { x: x - 6, y: -63, width: 12, height: 6, rx: 3, class: pick(["f-coat1","f-coat2","f-coat3","f-coat4"]) }, g);
    }
  });
}
tramPax();

function updateTram(dt) {
  const T = tram;
  if (T.state === "away") {
    T.wait -= dt;
    if (T.wait <= 0) { T.state = "run"; T.stopped = false; T.vel = 40; T.x = T.dir > 0 ? -220 : 1830; tramPax(); waiting.forEach(W => W.op = 1); }
    $("tram").setAttribute("opacity", 0);
    return;
  }
  $("tram").setAttribute("opacity", 1);
  if (T.state === "dwell") {
    T.wait -= dt;
    // 等車的人上車（淡出）
    waiting.forEach(W => W.op = Math.max(0, W.op - dt * .6));
    if (T.wait <= 0) { T.state = "run"; T.stopped = true; sndBell(); T.spark = 1; }
  } else if (!reduced) {
    const base = T.dir > 0 ? 46 : 62;
    let target = base;
    const toStop = (STOP_X - T.x) * T.dir;
    if (!T.stopped && toStop > 0 && toStop < 140) target = Math.max(8, base * toStop / 140);
    T.vel += (target - T.vel) * Math.min(1, dt * 1.8);
    T.x += T.vel * T.dir * dt;
    T.wheel += T.vel * dt * 7;
    if (!T.stopped && toStop <= 2) { T.state = "dwell"; T.wait = 5; T.vel = 0; }
    if ((T.dir > 0 && T.x > 1830) || (T.dir < 0 && T.x < -220)) { T.state = "away"; T.wait = 5; T.dir *= -1; }
    // 偶爾集電桿閃火花（夜裡比較看得見）
    if (Math.random() < dt * .25) T.spark = .7;
  }
  T.spark = Math.max(0, T.spark - dt * 3);
  placeVehicle($("tram"), $("tramFlip"), T.x, railY(T.x), T.dir);
  $("spark").setAttribute("opacity", (T.spark * (.5 + Math.random() * .5)).toFixed(2));
  $("tramNo").setAttribute("transform", "");
  $("wheelA").setAttribute("transform", `translate(-50,-4) rotate(${f1(T.wheel)})`);
  $("wheelB").setAttribute("transform", `translate(50,-4) rotate(${f1(T.wheel)})`);
}
function updateTuk(dt) {
  const K = tuk;
  if (K.state === "away") {
    K.wait -= dt;
    if (K.wait <= 0) { K.state = "run"; K.x = K.dir > 0 ? -80 : 1700; }
    $("tuk").setAttribute("opacity", 0);
    return;
  }
  $("tuk").setAttribute("opacity", 1);
  if (!reduced) {
    K.boost = Math.max(0, K.boost - dt);
    const v = (K.dir > 0 ? 34 : 52) * (K.boost > 0 ? 2.4 : 1);
    K.x += v * K.dir * dt;
    if ((K.dir > 0 && K.x > 1700) || (K.dir < 0 && K.x < -80)) { K.state = "away"; K.wait = 6 + Math.random() * 6; K.dir *= -1; }
  }
  const bob = reduced ? 0 : Math.sin(t * 22) * .5;
  placeVehicle($("tuk"), $("tukFlip"), K.x, laneY(K.x) + bob, K.dir);
}

/* =========================================================
   【動畫】主迴圈
   ========================================================= */
let last = performance.now(), t = 0, mixTimer = 0;
let ferryX = 120, ferryDir = 1, sailX = 560;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;

  // --- 日夜 ---
  if (tween) {
    tween.t += dt / (reduced ? .001 : 1.6);
    const k = Math.min(1, tween.t), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    phase = tween.from + (tween.to - tween.from) * e;
    if (k >= 1) { tween = null; phase %= 1; }
  } else if (auto && !reduced) phase = (phase + dt / CYCLE) % 1;
  night = nightOf(phase);
  mixTimer -= dt;
  if (mixTimer <= 0 || tween) { applyNight(night); mixTimer = .12; $("clock").textContent = clockLabel(phase); }
  const rising = (phase % 1) < .5;
  const sunY = 70 + night * 340, sunX = rising ? 1300 + night * 160 : 980 - night * 160;
  $("sun").setAttribute("transform", `translate(${f1(sunX)},${f1(sunY)})`);
  $("moon").setAttribute("transform", `translate(1420,${f1(440 - night * 360)})`);

  // --- 風 ---
  wind = .45 + Math.sin(t * .23) * .3 + Math.sin(t * .71) * .12;
  gust = Math.max(0, gust - dt * .35);
  const W = reduced ? 0 : wind + gust * 2.2;

  // --- 雲 ---
  for (const C of clouds) {
    if (!reduced) { C.x += C.v * dt * (1 + gust); if (C.x > 1720) C.x = -140; }
    C.g.setAttribute("transform", `translate(${f1(C.x)},${f1(C.y)}) scale(${C.s})`);
  }
  // --- 河面：波光、渡輪、帆船、橋上車流 ---
  if (!reduced) {
    for (const G of glints) { G.x += G.v * dt; if (G.x > 900) G.x = -40; G.g.setAttribute("x", f1(G.x)); }
    ferryX += 14 * ferryDir * dt;
    if (ferryX > 600) ferryDir = -1; if (ferryX < -60) ferryDir = 1;
    sailX -= 5 * dt; if (sailX < -40) sailX = 620;
    for (const C of bridgeCars) { C.x += C.v * C.dir * dt; if (C.x > 720) C.x = -30; if (C.x < -30) C.x = 720; C.c.setAttribute("x", f1(C.x)); }
  }
  $("ferry").setAttribute("transform", `translate(${f1(ferryX)},${f1(334 + Math.sin(t * 1.4) * 1.2)})`);
  $("ferryBody").setAttribute("transform", `scale(${ferryDir},1)`);
  $("sailboat").setAttribute("transform", `translate(${f1(sailX)},${f1(312 + Math.sin(t * 1.1 + 1) * 1)})`);
  // 城堡旗子
  const fw = Math.sin(t * 5) * 3 * (reduced ? 0 : 1);
  $("flag").setAttribute("d", `M939,67 Q950,${f1(66 + fw)} 962,${f1(72 + fw * .6)} Q950,${f1(76 - fw)} 939,78 Z`);

  // --- 電車、三輪車 ---
  updateTram(dt);
  updateTuk(dt);
  waiting.forEach(W2 => W2.p.g.setAttribute("opacity", W2.op.toFixed(2)));

  // --- 行人 ---
  for (const P of walkers) {
    if (!reduced) {
      P.x += P.v * P.dir * dt * (P.dir > 0 ? .85 : 1.1);   // 上坡走得慢一點
      if (P.x > 1640) P.x = 520; if (P.x < 520) P.x = 1640;
      P.ph += dt * P.v * .35;
    }
    P.p.g.setAttribute("transform", `translate(${f1(P.x)},${f1(walkY(P.x))}) scale(${P.dir},1)`);
    walkLegs(P.p, P.ph);
  }
  // 觀景台小孩追鴿子
  if (!reduced) {
    kidS.x += 26 * kidS.dir * dt; kidS.ph += dt * 10;
    if (kidS.x > 380) kidS.dir = -1; if (kidS.x < 130) kidS.dir = 1;
  }
  kid.g.setAttribute("transform", `translate(${f1(kidS.x)},592) scale(${kidS.dir * 1.2},1.2)`);
  walkLegs(kid, kidS.ph);
  for (const P of pigeons) {
    const near = Math.abs(P.x - kidS.x) < 34;
    if (near && P.fly <= 0 && !reduced) P.fly = 1.6;
    if (P.fly > 0) {
      P.fly -= dt;
      const k = 1 - Math.abs(P.fly - .8) / .8;
      P.g.setAttribute("transform", `translate(${f1(P.x + (1 - P.fly / 1.6) * 30)},${f1(P.y - k * 40)})`);

<script id="scene-bgm">
/* =========================================================
   【互動】背景配樂（Web Audio 即時合成，原創曲，不使用任何音檔）
   - 控制列「♪ 配樂」按鈕開關；網站「作者精選」播放區會呼叫
     window.sceneMusic.start() / stop()
   - 想換曲子：改下面 SCORE 區塊裡的音符陣列即可
     音符寫法："A4"、"C#5"、"Eb4"；"-" 是休止；數字是長度（幾格）
   ========================================================= */
(function () {
  "use strict";
  // __SceneAudioContext：下載時選了「不要點擊音效」會把場景音效靜音，配樂仍用原本的 AudioContext
  const AC = window.__SceneAudioContext || window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  // 音名 → 頻率
  function hz(n) {
    const m = /^([A-G])([#b]?)(-?\d)$/.exec(n);
    const st = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0);
    return 440 * Math.pow(2, (st + (+m[3] + 1) * 12 - 69) / 12);
  }
  // 旋律陣列 → { 格數: [音名, 長度] }
  function seq(list) {
    const map = {}; let s = 0;
    for (const [n, len] of list) { if (n !== "-") map[s] = [n, len]; s += len; }
    return map;
  }

  let ctx = null, out = null, timer = null, playing = false, nextT = 0, step = 0;

  /* ---------- 樂器 ---------- */
  function env(t, a, d, v) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    g.connect(out); return g;
  }
  function osc(type, f, t, dur, dest, detune) {
    const o = ctx.createOscillator(); o.type = type; o.frequency.value = f;
    if (detune) o.detune.value = detune;
    o.connect(dest); o.start(t); o.stop(t + dur + 0.05); return o;
  }
  let noiseBuf = null;
  function noise() {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const x = noiseBuf.getChannelData(0); for (let i = 0; i < x.length; i++) x[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; return s;
  }
  const I = {
    // 撥弦（吉他、烏德琴）：鋸齒波＋快速關閉的低通濾波
    pluck(f, t, d, v, bright) {
      const lp = ctx.createBiquadFilter(); lp.type = "lowpass";
      lp.frequency.setValueAtTime(bright || 2600, t); lp.frequency.exponentialRampToValueAtTime(350, t + d);
      lp.connect(env(t, 0.004, d, v || 0.1));

    },
    // 顫音撥弦：同一個音快速連撥（葡萄牙吉他、卡農琴的招牌）
    tremolo(f, t, d, v, gap) {
      gap = gap || 0.085;

    // 長笛／錫口哨：正弦波＋輕微抖音、慢起音
    flute(f, t, d, v) {
      v = v || 0.06;
      const g = ctx.createGain(); g.connect(out);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.12);
      g.gain.setValueAtTime(v, t + Math.max(0.13, d - 0.18)); g.gain.linearRampToValueAtTime(0.0001, t + d + 0.12);
      const o = osc("sine", f, t, d + 0.15, g);
      const lfo = ctx.createOscillator(), lg = ctx.createGain();
      lfo.frequency.value = 5.2; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(f * 0.007, t + 0.4);
      lfo.connect(lg); lg.connect(o.frequency); lfo.start(t); lfo.stop(t + d + 0.2);
      const h = ctx.createGain(); h.gain.value = 0.15; h.connect(g); osc("sine", f * 2, t, d + 0.15, h);
      // 氣音
      const n = noise(), bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = f * 2; bp.Q.value = 2;
      n.connect(bp); bp.connect(env(t, 0.05, 0.25, v * 0.25)); n.start(t); n.stop(t + 0.4);
    },
    // 持續低音墊底
    pad(f, t, d, v) {
      v = v || 0.03;
      const g = ctx.createGain(); g.connect(out);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + d * 0.35); g.gain.linearRampToValueAtTime(0.0001, t + d + 0.3);
      const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 800; lp.connect(g);
      osc("sawtooth", f, t, d + 0.3, lp, -7); osc("sawtooth", f, t, d + 0.3, lp, 7);
    },
    // 手鼓低音「咚」
    dum(t, v) {
      const o = osc("sine", 120, t, 0.4, env(t, 0.003, 0.32, v || 0.3));
      o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(58, t + 0.25);
    },
    // 手鼓高音「嗒」
    tek(t, v) {
      const n = noise(), hp = ctx.createBiquadFilter(); hp.type = "bandpass"; hp.frequency.value = 3200; hp.Q.value = 0.9;
      n.connect(hp); hp.connect(env(t, 0.002, 0.07, v || 0.12)); n.start(t); n.stop(t + 0.12);
    },

    wave(t, d, v) {
      const n = noise(), lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 520;
      const g = ctx.createGain(); g.connect(out);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v || 0.04, t + d * 0.45); g.gain.linearRampToValueAtTime(0.0001, t + d);
      n.connect(lp); lp.connect(g); n.start(t); n.stop(t + d + 0.1);
    }
  };

  /* ---------- 曲譜（每組場景不同，見下方 SCORE） ---------- */
  // 里斯本：法朵風（A 小調）。葡萄牙吉他顫音彈旋律，古典吉他分解和弦伴奏
  const SCORE = (() => {
    const chords = [
      ["A2","E3","A3","C4"], ["D3","A3","D4","F4"], ["G2","D3","G3","B3"], ["C3","G3","C4","E4"],
      ["F2","C3","F3","A3"], ["D3","A3","D4","F4"], ["E2","B2","E3","G#3"], ["A2","E3","A3","C4"]
    ];
    const pat = [0, 1, 2, 3, 1, 2, 3, 2];
    const mel = seq([
      ["E5",4],["D5",2],["C5",2],   ["D5",3],["F5",1],["E5",2],["D5",2],
      ["B4",4],["D5",2],["C5",2],   ["C5",4],["E5",2],["G5",2],
      ["A5",3],["G5",1],["F5",2],["E5",2],   ["F5",2],["E5",2],["D5",2],["C5",2],
      ["B4",3],["C5",1],["B4",2],["G#4",2],  ["A4",6],["-",2]
    ]);
    return {
      bpm: 74, stepsPerBeat: 2, steps: 64, volume: 0.6, gain: 4,
      play(s, t, dt) {
        const c = chords[Math.floor(s / 8)], i = s % 8;

  /* ---------- 播放引擎（一般不需要修改） ---------- */
  function schedule() {
    const dt = 60 / SCORE.bpm / SCORE.stepsPerBeat;
    while (nextT < ctx.currentTime + 0.35) {
      try { SCORE.play(step, nextT, dt); } catch (e) {}
      nextT += dt; step = (step + 1) % SCORE.steps;
    }
  }
  function setBtn() {
    const b = document.getElementById("btnMusic");
    if (b) { b.setAttribute("aria-pressed", String(playing)); b.textContent = "♪ 配樂：" + (playing ? "開" : "關"); }
  }
  function level(v, sec) {
    const t = ctx.currentTime; out.gain.cancelScheduledValues(t);
    out.gain.setValueAtTime(Math.max(0.0001, out.gain.value), t); out.gain.linearRampToValueAtTime(Math.max(0.0001, v), t + sec);
  }
  let duckTimer = null;
  // ext：外層網頁（例如圖鑑網站的精選播放區）在使用者點擊時先建立好的 AudioContext，
  // 這樣瀏覽器不會擋自動播放；單獨打開這個檔案時不用傳
  function start(ext) {
    if (!ctx) {
      ctx = ext || new AC(); out = ctx.createGain(); out.gain.value = 0.0001;
      // 壓縮器讓音量平均，不會忽大忽小
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -20; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = 0.01; comp.release.value = 0.25;
      const master = ctx.createGain(); master.gain.value = (SCORE.gain || 1) * .64; // 配樂音量 ×0.64（2026-11-24 兩次各調降 20%）
      out.connect(comp); comp.connect(master); master.connect(ctx.destination);
    }
    if (ctx.state !== "running") ctx.resume();
    if (playing) return;
    playing = true; step = 0; nextT = ctx.currentTime + 0.1;
    level(SCORE.volume, 1.5); schedule(); timer = setInterval(schedule, 90); setBtn();
  }
  function stop() {
    if (!playing) return;
    playing = false; clearInterval(timer); clearTimeout(duckTimer); level(0.0001, 0.8); setBtn();
  }
  // 場景裡其他音樂（例如水舞、法朵）響起時，配樂先轉小聲
  function duck(sec) {
    if (!playing) return;
    clearTimeout(duckTimer); level(SCORE.volume * 0.12, 0.6);
    duckTimer = setTimeout(() => { if (playing) level(SCORE.volume, 2); }, sec * 1000);
  }
  document.addEventListener("visibilitychange", () => {
    if (!ctx) return;
    if (document.hidden) { if (playing) ctx.suspend(); } else if (playing) ctx.resume();
  });
  window.sceneMusic = {
    start, stop, duck,
    toggle() { playing ? stop() : start(); },
    get playing() { return playing; }
  };
  const btn = document.getElementById("btnMusic");
  if (btn) btn.addEventListener("click", () => window.sceneMusic.toggle());
  setBtn();
  // 純插畫版沒有按鈕：單獨打開時，點一下畫面就開始播（嵌在別的網頁裡時交給外層控制）
  let top = true; try { top = window.top === window; } catch (e) { top = false; }
  if (document.getElementById("pure-art") && top) {
    const go = () => { start(); document.removeEventListener("pointerdown", go); document.removeEventListener("keydown", go); };
    document.addEventListener("pointerdown", go); document.addEventListener("keydown", go);
  }
})();
</script>
</body>
</html>
