<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>挪威峽灣的極光漁村</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-28 挪威峽灣的極光漁村｜羊毛氈風
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   風格重點：所有物件像針氈戳出來的羊毛——邊緣毛茸茸、
            表面有蓬鬆的凹凸光影、整片覆蓋細細的羊毛纖維；
            極光像一縷縷拉開的彩色羊毛條。
   季節設定：三月下旬，山頂還有積雪、鱈魚乾掛滿木架、夜裡看得到極光。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），
   部分另有 --k-名稱（晨昏）。JS 會依時間內插，輸出成 --名稱，
   並自動產生 .f-名稱（填色）、.s-名稱（描邊）兩個 class。
   ========================================================= */
:root{
  color-scheme: dark;

  /* —— 天空 —— */
  --d-sky-top:#86b2d4;  --k-sky-top:#5e6aa0;  --n-sky-top:#070f22;
  --d-sky-mid:#b4d0e2;  --k-sky-mid:#d8a0a4;  --n-sky-mid:#0e1c34;
  --d-sky-low:#e4ecec;  --k-sky-low:#f4c08c;  --n-sky-low:#183048;
  --d-cloud:#f6f3ee;    --k-cloud:#ffd6c2;    --n-cloud:#3e4862;
  --d-cloud-sh:#d0d8e0; --n-cloud-sh:#262e44;
  --d-overcast:#a6aeb8; --n-overcast:#1c2230;

  /* —— 山（花崗岩尖峰）與積雪 —— */
  --d-mtn-far:#9fb2c2;  --k-mtn-far:#a89ab4;  --n-mtn-far:#18243a;
  --d-mtn:#6d7874;      --n-mtn:#141c24;
  --d-mtn-dk:#4c5656;   --n-mtn-dk:#0c1218;
  --d-moss:#7c8862;     --n-moss:#18221e;
  --d-snow:#f6f3ee;     --k-snow:#ffd8c8;     --n-snow:#8a9cba;
  --d-snow-sh:#cfd8e2;  --n-snow-sh:#566884;

  /* —— 峽灣海水 —— */
  --d-water:#3e7488;    --k-water:#7a7a98;    --n-water:#081624;
  --d-water-far:#6e9aac; --k-water-far:#c49a96; --n-water-far:#0e2032;
  --d-water-hi:#b2d2dc; --n-water-hi:#2c4a68;
  --d-foam:#f2f6f4;     --n-foam:#7a8aa4;

  /* —— 岸邊、碼頭、木頭 —— */
  --d-rock:#8c8a82;     --n-rock:#262a30;
  --d-rock-dk:#666660;  --n-rock-dk:#171a20;
  --d-grass:#8a9262;    --n-grass:#1e2620;
  --d-wood:#8c6c4c;     --n-wood:#33281f;
  --d-wood-dk:#5e4632;  --n-wood-dk:#1f1814;
  --d-pole:#6c5842;     --n-pole:#272019;
  --d-road:#5a5c62;     --n-road:#1a1c22;
  --d-sand:#e6dabc;     --n-sand:#3e3c3c;     /* 小海灘的白沙 */
  --d-trail:#c8bfae;    --n-trail:#2a2a2e;     /* 登山步道的石階 */

  /* —— 漁人小屋（rorbu） —— */
  --d-red:#b43a30;      --n-red:#4a1a1c;
  --d-red-dk:#8a2a24;   --n-red-dk:#2e1014;
  --d-ochre:#d9a23c;    --n-ochre:#5a4420;
  --d-ochre-dk:#ae7c26; --n-ochre-dk:#3a2c16;
  --d-white:#f1ebdd;    --n-white:#7c7e8c;     /* 白色窗框、教堂外牆 */
  --d-roof:#3a3638;     --n-roof:#121218;
  --d-turf:#748c4c;     --n-turf:#1c261a;      /* 草皮屋頂 */
  --d-win:#3c4c5e;      --n-win:#ffcf78;       /* 窗：夜晚亮燈 */
  --d-win-off:#3c4c5e;  --n-win-off:#1a2030;   /* 夜裡關燈的窗 */
  --d-glow:#ffe6a000;   --n-glow:#ffcf7a99;    /* 燈光暈 */

  /* —— 鱈魚乾 —— */
  --d-fish:#bfae90;     --n-fish:#4e4840;
  --d-fish-dk:#907e64;  --n-fish-dk:#332e28;

  /* —— 其他會變色的 —— */
  --d-shadow:#1a222a30; --n-shadow:#00000050;
  --d-fog:#e8ecee;      --n-fog:#4a5470;
  --d-dim:#00000000;    --n-dim:#00000000;

  /* —— 不隨日夜變化的顏色 —— */
  --sun:#ffd66a;  --sun-hi:#fff2b8;  --moon:#f4efd8;  --star:#fff6dc;
  --aur-g:#62ffaa; --aur-g2:#2ee08a; --aur-p:#ff6aae; --aur-v:#9a7aff;   /* 極光：綠、深綠、粉紅下緣、紫色上緣 */
  --lamp:#ffd884;
  --ink:#2a2630;
  --wool:#fbf8f2;            /* 對話泡泡的白羊毛 */
  --hull-1:#f2efe6; --hull-2:#2f5d8a; --hull-3:#b8342e; --hull-4:#2f6a52;   /* 船殼 */
  --trim-1:#b8342e; --trim-2:#f2c230;
  --rib:#f07a2a;             /* 觀光快艇的橘色浮筒 */
  --boat-wood:#c08a52; --boat-wood-dk:#8a5a32;   /* 北國划艇的木頭 */
  --crate-1:#3f78b8; --crate-2:#2f8a6a; --buoy:#f07a2a;
  --oil-1:#f08a2a; --oil-2:#f2c230;               /* 漁夫的防水油布衣 */
  --car-1:#c83a34; --car-2:#3a6aa8; --car-3:#e8e4da; --car-4:#3a3e46; --car-5:#4f8a5a; --bus:#2f6a9a;
  --gull:#fbfbf8; --gull-wing:#aab4c0; --gull-tip:#2a2a30; --beak:#f2c230;
  --eagle:#6a4a30; --eagle-dk:#4a3220; --eagle-head:#d8c8a8; --eagle-tail:#f6f2e8;
  --pennant-r:#c8303a; --pennant-w:#f6f2ea; --pennant-b:#2a3a7a;   /* 旗桿上的長條三角旗 */
  --rain:#a8c8e8; --snow:#ffffff;
  --wing-1:#e8445a; --wing-2:#f2c230; --wing-3:#3f7fc4;   /* 飛行傘的翼面 */
  --rope:#f2d230; --wetsuit:#1e2026; --board:#f2ece0; --board-stripe:#e8445a;
  --kayak-1:#e8445a; --kayak-2:#f2c230; --kayak-3:#3f9a6a;
  --cormorant:#1e2226; --cormorant-hi:#3a4248;
  --dog:#e0c8a0; --dog-dk:#8a6a48;

  /* —— 角色：毛線帽、外套、膚色 —— */
  --skin-1:#f6d4b4; --skin-2:#e2ae86; --skin-3:#b07a52; --skin-4:#7a5038;
  --hair-1:#2a2024; --hair-2:#7a4a2a; --hair-3:#e8c46a; --hair-4:#cfc8c0; --hair-5:#c0602e;
  --coat-1:#c8323a; --coat-2:#2f5d9a; --coat-3:#e8a83a; --coat-4:#3f7a6a; --coat-5:#7a5ab0;
  --coat-6:#e86a8a; --coat-7:#3c3e4a; --coat-8:#c8b08a; --coat-9:#eee8dc;
  --knit-1:#f2ece0; --knit-2:#c8323a; --knit-3:#2f5d9a; --knit-4:#f2c230; --knit-5:#3f8a6a;
  --pants-1:#2a2e44; --pants-2:#4a3e36; --pants-3:#3a5a8a;
  --umb-1:#2f5d9a; --umb-2:#c8323a; --umb-3:#f2c230; --umb-4:#3c3e4a;

  /* —— 頁面介面 —— */
  --page-bg:#141a26; --page-fg:#f4efe4; --page-muted:#aeb2b8;
  --ui-surface:#1e2636; --ui-line:#384256; --ui-accent:#62e0a0; --ui-hot:#b43a30;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border:1px solid var(--ui-line);border-radius:14px;overflow:hidden;background:var(--page-bg);line-height:0}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:14px;padding:10px 14px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--page-bg);font-weight:700}
.panel button.big{border-color:var(--ui-hot);color:#fff;background:var(--ui-hot);font-weight:700}
.panel button.big.on{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--page-bg)}
.panel button:disabled{opacity:.45;cursor:default}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
/* 畫面內可點物件：滑鼠點不顯示外框，用鍵盤 Tab 時才顯示 */
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid var(--ui-accent);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .say text{fill:var(--ink);font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .fiber{mix-blend-mode:soft-light}
</style>
<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。
   想恢復完整版，刪掉這整段 <style id="pure-art"> 即可。
   ========================================================= */
html,body{height:100%;margin:0!important;overflow:hidden}
body{display:flex!important;align-items:center;justify-content:center;padding:0!important}
body>.wrap{width:100%!important;max-width:min(100vw,calc(100vh * 8 / 3))!important;
  margin:0!important;padding:0!important;gap:0!important;display:block!important}
body>.wrap>:not(.stage){display:none!important}
body>.wrap>.stage{width:100%!important;max-width:100%!important;margin:0!important;
  border:0!important;border-radius:0!important;box-shadow:none!important}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：天空 → 星星 → 極光 → 太陽月亮 → 雲
       → 遠山 → 主峰群（積雪、陰影）→ 對岸公路、小教堂、車流
       → 峽灣水面（倒影、波紋）→ 左側漁人小屋與木棧道
       → 右側鱈魚乾木架 → 遠近兩條航道的船 → 前景碼頭
       → 海鷗、海鵰 → 霧 → 雨雪 → 羊毛纖維紋理
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="羊毛氈風格的挪威北部峽灣漁村：背景是覆雪的陡峭花崗岩尖峰與峽灣，對岸山腳有公路和白色木造小教堂；左側是一排架在木樁上的紅色與黃色漁人小屋，木棧道上有穿毛線帽的行人；右側岩岸上是掛滿鱈魚乾的木架，穿橘色防水衣的漁夫正在掛魚；水面上有漁船、觀光快艇與北國划艇，海鷗跟著漁船飛；右下角的碼頭上有遊客架著三腳架等極光">
    <defs>
      <!-- 天空與海水的漸層：顏色由色票控制 -->
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-top)"/>
        <stop offset=".55" style="stop-color:var(--sky-mid)"/>
        <stop offset="1" style="stop-color:var(--sky-low)"/>
      </linearGradient>
      <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--water-far)"/>
        <stop offset=".45" style="stop-color:var(--water)"/>
        <stop offset="1" style="stop-color:var(--water)"/>
      </linearGradient>
      <!-- 極光羊毛條：上淡、中綠、下緣粉紅 -->
      <linearGradient id="aurA" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--aur-v)" stop-opacity="0"/>
        <stop offset=".35" style="stop-color:var(--aur-v)" stop-opacity=".35"/>
        <stop offset=".62" style="stop-color:var(--aur-g)" stop-opacity=".8"/>
        <stop offset=".86" style="stop-color:var(--aur-g2)" stop-opacity="1"/>
        <stop offset=".94" style="stop-color:var(--aur-p)" stop-opacity=".75"/>
        <stop offset="1" style="stop-color:var(--aur-p)" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="aurB" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--aur-g)" stop-opacity="0"/>
        <stop offset=".5" style="stop-color:var(--aur-g)" stop-opacity=".55"/>
        <stop offset=".9" style="stop-color:var(--aur-g2)" stop-opacity=".95"/>
        <stop offset="1" style="stop-color:var(--aur-g2)" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="sunGlow"><stop offset="0" style="stop-color:var(--sun-hi)" stop-opacity=".7"/><stop offset="1" style="stop-color:var(--sun)" stop-opacity="0"/></radialGradient>
      <radialGradient id="moonGlow"><stop offset="0" style="stop-color:var(--moon)" stop-opacity=".35"/><stop offset="1" style="stop-color:var(--moon)" stop-opacity="0"/></radialGradient>
      <radialGradient id="lampGlow"><stop offset="0" style="stop-color:var(--glow)"/><stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/></radialGradient>
      <radialGradient id="flashGlow"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>

      <!-- 【羊毛氈濾鏡 felt】大面積靜態圖層用：
           1. 亂流雜訊推移邊緣 → 毛茸茸的輪廓
           2. 模糊後的透明度當高度圖打光 → 針氈戳出來的蓬鬆凹凸 -->
      <filter id="felt" x="-4%" y="-6%" width="108%" height="112%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" seed="7" result="fz"/>
        <feDisplacementMap in="SourceGraphic" in2="fz" scale="6" xChannelSelector="R" yChannelSelector="G" result="shape"/>
        <feGaussianBlur in="shape" stdDeviation="3.2" result="bl"/>
        <feDiffuseLighting in="bl" surfaceScale="3.2" diffuseConstant="1.2" lighting-color="#ffffff" result="lit">
          <feDistantLight azimuth="235" elevation="52"/>
        </feDiffuseLighting>
        <feComposite in="shape" in2="lit" operator="arithmetic" k1="1.06" k2="0" k3="0" k4="0"/>
      </filter>
      <!-- 【小物件的羊毛氈 feltS】較細緻的版本 -->
      <filter id="feltS" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="3" result="fz"/>
        <feDisplacementMap in="SourceGraphic" in2="fz" scale="3.4" xChannelSelector="R" yChannelSelector="G" result="shape"/>
        <feGaussianBlur in="shape" stdDeviation="1.6" result="bl"/>
        <feDiffuseLighting in="bl" surfaceScale="2.4" diffuseConstant="1.18" lighting-color="#ffffff" result="lit">
          <feDistantLight azimuth="235" elevation="55"/>
        </feDiffuseLighting>
        <feComposite in="shape" in2="lit" operator="arithmetic" k1="1.06" k2="0" k3="0" k4="0"/>
      </filter>
      <!-- 【會動的角色 fuzz】只做毛邊，運算較輕 -->
      <filter id="fuzz" x="-6%" y="-20%" width="112%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="1.3" numOctaves="1" seed="11" result="fz"/>
        <feDisplacementMap in="SourceGraphic" in2="fz" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <!-- 極光：拉開的羊毛條，柔焦＋毛邊 -->
      <filter id="roving" x="-5%" y="-30%" width="110%" height="160%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency=".012 .04" numOctaves="2" seed="5" result="fz"/>
        <feDisplacementMap in="SourceGraphic" in2="fz" scale="36" xChannelSelector="R" yChannelSelector="G" result="d"/>
        <feGaussianBlur in="d" stdDeviation="5 3"/>
      </filter>
      <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
      <filter id="soft3" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="2.2"/></filter>
      <filter id="fogF" x="-20%" y="-60%" width="140%" height="220%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency=".012 .05" numOctaves="3" seed="9" result="fz"/>
        <feDisplacementMap in="SourceGraphic" in2="fz" scale="40" xChannelSelector="R" yChannelSelector="G" result="d"/>
        <feGaussianBlur in="d" stdDeviation="9"/>
      </filter>

      <!-- 羊毛纖維紋理（JS 用 canvas 畫好塞進 image） -->
      <pattern id="fiberPat" patternUnits="userSpaceOnUse" width="256" height="256">
        <image id="fiberImg" width="256" height="256" href=""/>
      </pattern>
      <clipPath id="waterClip"><rect x="0" y="390" width="1600" height="210"/></clipPath>
      <clipPath id="skyClip"><rect x="0" y="0" width="1600" height="392"/></clipPath>
    </defs>

    <!-- ===== 【場景】天空 ===== -->
    <rect x="0" y="0" width="1600" height="600" fill="url(#skyGrad)"/>
    <rect id="skyHit" x="0" y="0" width="1600" height="392" fill="transparent"/>
    <g id="stars" class="noHit"></g>
    <rect id="auroraTint" class="noHit" x="0" y="0" width="1600" height="392" style="fill:var(--aur-g)" opacity="0"/>
    <g id="aurora" class="noHit" filter="url(#roving)" opacity="0"></g>
    <g id="sun" class="clickable" tabindex="0" role="button" aria-label="太陽：切換到夜晚"></g>
    <g id="moon" class="clickable" tabindex="0" role="button" aria-label="月亮：切換到白天"></g>
    <g id="shooting" class="noHit"></g>
    <g id="clouds"></g>
    <g id="overcast" class="noHit" opacity="0"></g>

    <!-- ===== 【場景】山：遠山 → 主峰群 ===== -->
    <g id="farRange" class="noHit" filter="url(#felt)"></g>
    <g id="mtnWrap" class="clickable" filter="url(#felt)" tabindex="0" role="button" aria-label="山峰：叫醒崖上的海鵰"><g id="mtnArt"></g></g>
    <!-- 山上的極限運動：滑雪下降、攀岩、登山步道、飛行傘 -->
    <g id="sports"><g id="trailG" class="noHit"></g><g id="skiTrails" class="noHit"></g><g id="sprays" class="noHit"></g></g>
    <g id="lowCloud" class="noHit" filter="url(#fogF)" opacity="0"></g>

    <!-- ===== 【場景】對岸：公路、小教堂、民宅、車流 ===== -->
    <g id="farShore" filter="url(#feltS)"></g>
    <g id="cars" filter="url(#fuzz)"></g>

    <!-- ===== 【場景】峽灣水面 ===== -->
    <g id="water">
      <rect x="0" y="390" width="1600" height="210" fill="url(#waterGrad)"/>
      <g clip-path="url(#waterClip)" opacity=".26" filter="url(#soft3)" class="noHit">
        <use href="#mtnArt" transform="translate(0,784) scale(1,-1)"/>
      </g>
      <g id="reflSun" class="noHit" clip-path="url(#waterClip)"></g>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);
      }
      return _conn.call(this, dest, ...a);
    };
  }
  function stopAudio() {
    let longs = [], ctx = null;
    for (const s of srcs) {
      const c = s.context, now = c.currentTime, m = s.__ss; ctx = c;
      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }
    if (longs.length && ctx) {
      const g = outs.get(ctx), now = ctx.currentTime;
      if (g) {
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 1.1); g.gain.setValueAtTime(0, now + 1.2);
        g.gain.linearRampToValueAtTime(1, now + 1.9);
      }
      longs.forEach(s => { try { s.stop(now + 1.15); } catch (e) {} srcs.delete(s); });
    }
    srcs.clear();
  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');
    // 凍結色票：把目前的 CSS 變數抄到殘影上，底下換色不影響殘影
    const cs = getComputedStyle(svg);
    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }
      }
    }
    const par = svg.parentElement;
    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });
    added = [];
  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>
/* =========================================================
   SC-28 挪威峽灣的極光漁村｜程式區
   區塊：①工具與色票 ②場景（天空、山、對岸、水面、漁人小屋、
         鱈魚乾木架、碼頭）③角色（行人、漁夫、車、船、海鷗、海鵰）
         ④動畫（日夜、天氣、極光、極光秀）⑤互動（點擊、滑鼠、聲音、控制列）
   ========================================================= */
(() => {
'use strict';

/* ---------------- ① 工具與色票 ---------------- */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const root = document.documentElement;
const svg = $('scene');
const SHORE = 390;           // 對岸水線 y
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
let seed = 20261128;         // 固定亂數：每次開啟構圖一樣
const srand = (a = 0, b = 1) => { seed = (seed * 16807) % 2147483647; return a + (seed / 2147483647) * (b - a); };
const spick = a => a[Math.floor(srand(0, a.length - .001))];
const f1 = n => (+n).toFixed(1);
function el(tag, attrs = {}, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function frag(parent, html, attrs = {}) { const g = el('g', attrs, parent); g.innerHTML = html; return g; }

// 讀取色票、內插混色
const css = n => getComputedStyle(root).getPropertyValue(n).trim();
const hex = h => {
  h = h.replace('#', '');
  if (h.length === 3) h = [...h].map(c => c + c).join('');
  const n = parseInt(h.slice(0, 6), 16);
  return [n >> 16 & 255, n >> 8 & 255, n & 255, h.length === 8 ? parseInt(h.slice(6), 16) / 255 : 1];
};
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgba = c => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${(c[3] ?? 1).toFixed(3)})`;
// 成對色票：自動找出所有 --d-xxx，配對 --n-xxx（與選用的 --k-xxx）
const PAIRS = {};
(() => {
  const names = [];
  for (const sheet of document.styleSheets) {

    PAIRS[k] = { d: hex(css('--d-' + k)), n: hex(css('--n-' + k)), k: k2 ? hex(k2) : null };
    cls += `#scene .f-${k}{fill:var(--${k})}#scene .s-${k}{stroke:var(--${k});fill:none}`;

/* 羊毛纖維紋理：用 canvas 畫上千根短短的彎曲纖維，做成可重複的貼圖 */
function makeFiber() {
  try {
    const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
    const x = c.getContext('2d');
    x.fillStyle = 'rgb(128,128,128)'; x.fillRect(0, 0, S, S);
    for (let i = 0; i < 2600; i++) {
      const px = Math.random() * S, py = Math.random() * S, a = Math.random() * Math.PI * 2, L = 5 + Math.random() * 14, bend = (Math.random() - .5) * 8;
      const light = Math.random() < .5;
      x.strokeStyle = light ? `rgba(255,255,255,${.10 + Math.random() * .16})` : `rgba(0,0,0,${.08 + Math.random() * .14})`;
      x.lineWidth = .5 + Math.random() * .9;
      [[0, 0], [S, 0], [-S, 0], [0, S], [0, -S]].forEach(([ox, oy]) => {
        const sx = px + ox, sy = py + oy, ex = sx + Math.cos(a) * L, ey = sy + Math.sin(a) * L;
        x.beginPath(); x.moveTo(sx, sy);
        x.quadraticCurveTo((sx + ex) / 2 + Math.cos(a + 1.57) * bend, (sy + ey) / 2 + Math.sin(a + 1.57) * bend, ex, ey); x.stroke();
      });
    }
    $('fiberImg').setAttribute('href', c.toDataURL('image/png'));
  } catch (e) {}
}

function drawMountains() {
  // 遠山：淡藍色，從主峰的山谷間露出來
  const far = [[0, 250], [60, 230], [120, 252], [560, 236], [620, 196], [660, 214], [700, 176], [744, 208], [790, 232], [1140, 240], [1190, 206], [1230, 222], [1600, 250]];

  // 用主峰形狀當剪裁，裡面畫：下坡苔綠、背光面陰影、積雪與雪溝

  // 背光面：每個尖峰的右側畫一塊深色
  for (let i = 1; i < RIDGE.length - 1; i++) {
    const [px, py] = RIDGE[i];
    if (py < RIDGE[i - 1][1] && py < RIDGE[i + 1][1]) {
      let j = i + 1; while (j < RIDGE.length - 1 && RIDGE[j + 1][1] > RIDGE[j][1]) j++;

  }
  for (let i = 0; i < 30; i++) {
    const x = srand(0, 1600), y = 230 + Math.sin(x * .021) * 22 + srand(0, 70);

  el('path', { d: 'M' + TRAIL.map(p => p.join(' ')).join('L'), style: 'stroke:var(--trail)', 'stroke-width': 2.6, 'stroke-dasharray': '3 2', fill: 'none', 'stroke-linejoin': 'round' }, $('trailG'));

    const g = el('g', { class: 'clickable', tabindex: 0, role: 'button', 'aria-label': '登山客' }, $('sports'));

    g.addEventListener('click', e => { e.stopPropagation(); act(() => { sfx('pop'); say(h.x, h.y - 30, pick(['Hei！上面風景超美', '石階好多階…', '快到山脊了！']), 1.6); }); });

/* ---------------- ④ 動畫：極光（一縷縷彩色羊毛條） ---------------- */
const curtains = [];
function buildAurora() {
  const defs = [
    { y: 150, amp: 46, k: .0042, ph: 0, n: 120, w: 20, grad: 'aurA', h: 160, cx: 600, wd: 700 },
    { y: 92, amp: 30, k: .0056, ph: 2.1, n: 100, w: 22, grad: 'aurB', h: 110, cx: 1100, wd: 520 },
    { y: 222, amp: 34, k: .0033, ph: 4.0, n: 100, w: 22, grad: 'aurA', h: 120, cx: 1000, wd: 600 }
  ];
  defs.forEach(d => {
    const g = el('g', {}, $('aurora'));
    d.strips = [];
    for (let i = 0; i < d.n; i++) {
      const x = -60 + i * 1720 / d.n + srand(-4, 4);
      d.strips.push({ el: el('rect', { x: f1(x - d.w / 2), y: 0, width: d.w, height: 10, fill: `url(#${d.grad})` }, g), x, ph: srand(0, 6) });
    }
    curtains.push(d);
  });
}
const AUR = { level: 0, natural: 0, t: 0 };
function updateAurora(dt) {
  const night = 1 - DAY.dl;
  const clear = 1 - Math.max(WX.cur.cloud, WX.cur.fog * .9, WX.cur.rain, WX.cur.snow);
  // 晴朗的夜晚：淡淡的自然極光，慢慢起伏
  AUR.natural = night * clamp(clear, 0, 1) * (.18 + .12 * Math.sin(AUR.t * .11) + .08 * Math.sin(AUR.t * .37));
  let level = AUR.natural;
  if (show.on) level = Math.max(level, show.level);
  AUR.level = lerp(AUR.level, level, clamp(dt * 3, 0, 1));
  const L = AUR.level;
  $('aurora').setAttribute('opacity', f1(clamp(L * 1.3, 0, 1) * 100 / 100));
  $('auroraRefl').setAttribute('opacity', f1(L * .42));
  $('auroraTint').setAttribute('opacity', (L * .09).toFixed(3));
  if (L < .01) return;
  AUR.t += reduced ? 0 : dt * (1 + (show.on ? show.speed : 0));
  const t = AUR.t;
  const mx = mouse.in && mouse.y < SHORE ? mouse.x : null;
  curtains.forEach((c, ci) => {
    const grow = show.on ? show.grow : .55;
    // 每條光幕只佔天空的一段，中心慢慢漂移；秀的高潮時展開到整片天空
    const cx = c.cx + Math.sin(t * .06 + c.ph) * 380, wd = c.wd * (1 + (show.on ? clamp(show.grow, 0, 1.3) * .9 : 0));
    c.strips.forEach(s => {
      let x = s.x;
      // 滑鼠在天空時，光幕往游標彎過去
      let pull = 0;
      if (mx !== null) { const dx = mx - x; pull = Math.exp(-(dx * dx) / 50000); x += dx * pull * .18; }
      const yb = c.y + c.amp * Math.sin(c.k * x + t * .35 + c.ph) + 14 * Math.sin(c.k * 3.1 * x - t * .9 + c.ph);
      const h = c.h * (.45 + .55 * (.5 + .5 * Math.sin(.011 * x + t * 1.1 + s.ph))) * (.55 + grow * .9) * (1 + pull * .5);
      const env = Math.exp(-Math.pow((x - cx) / wd, 2) * 2.2);
      const op = (.25 + .75 * Math.pow(.5 + .5 * Math.sin(.031 * x - t * 1.7 + s.ph + ci), 2) * (.6 + .4 * Math.sin(.11 * x + s.ph * 3))) * env * (1 + pull * .9) * (show.on ? (1 + show.flare * .8) : 1);
      s.el.setAttribute('x', f1(x - c.w / 2));
      s.el.setAttribute('y', f1(yb - h));
      s.el.setAttribute('height', f1(h));
      s.el.setAttribute('opacity', clamp(op, 0, 1).toFixed(2));
    });
  });
}

/* ---------------- ④ 動畫：時間與日夜 ---------------- */
const T = { t: 10.5 / 24, auto: true, dayLen: 200, dragging: false, ff: null };
const DAY = { dl: 1, tw: 0, h: 10.5 };
let lastDl = -1, lastTw = -1;
const isNight = () => DAY.dl < .4;
function applyTime(force) {
  const h = ((T.t % 1) + 1) % 1 * 24;
  // 三月的挪威北部：大約 6 點日出、18 點半日落
  const dl = smooth(5.4, 7.4, h) * (1 - smooth(17.6, 19.6, h));
  const tw = Math.max(clamp(1 - Math.abs(h - 6.6) / 1.4, 0, 1), clamp(1 - Math.abs(h - 18.4) / 1.4, 0, 1));
  DAY.dl = dl; DAY.tw = tw; DAY.h = h;
  if (force || Math.abs(dl - lastDl) > .004 || Math.abs(tw - lastTw) > .004) {
    lastDl = dl; lastTw = tw;
    let s = '';
    for (const k in PAIRS) {
      const p = PAIRS[k];
      let c = mix(p.n, p.d, dl);
      if (p.k) c = mix(c, p.k, tw * .85);
      s += `--${k}:${rgba(c)};`;
    }
    root.setAttribute('style', s);
  }
  // 太陽：三月的太陽很低，從右邊升起、往左邊落下前會躲到山後
  const sp = (h - 6) / 12.5;
  const sx = 1500 - sp * 1300, sy = 330 - Math.sin(clamp(sp, 0, 1) * Math.PI) * 220;
  $('sun').setAttribute('transform', `translate(${f1(sx)},${f1(sy)})`);
  $('sun').setAttribute('opacity', f1(smooth(5.2, 6.2, h) * (1 - smooth(18.3, 19.2, h))));
  const mh = (h + 12) % 24, mp = (mh - 5) / 14;
  $('moon').setAttribute('transform', `translate(${f1(1450 - mp * 1250)},${f1(280 - Math.sin(clamp(mp, 0, 1) * Math.PI) * 200)})`);
  $('moon').setAttribute('opacity', f1(1 - smooth(5.5, 7, h) * (1 - smooth(17.5, 19, h))));
  $('reflSun').setAttribute('transform', `translate(${f1(DAY.dl > .5 ? sx : 1450 - mp * 1250)},0)`);
  $('reflSun').setAttribute('opacity', f1((DAY.dl > .5 ? .5 : .25) * (1 - WX.cur.cloud) * (sy < 330 || DAY.dl <= .5 ? 1 : 0)));
  $('houseLights').setAttribute('opacity', f1(1 - dl));
  const hh = Math.floor(h), mm = Math.floor((h - hh) * 60);
  $('clock').textContent = `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
  if (!T.dragging) $('timeRange').value = Math.round((T.t % 1) * 1000);
  cars.forEach(c => c.light.setAttribute('opacity', f1((1 - dl) * .9)));
  boats.concat(moored).forEach(b => { if (b.extra.mast) { b.extra.mast.setAttribute('opacity', f1(1 - dl)); b.extra.side.setAttribute('opacity', f1(1 - dl)); } });
}

/* ---------------- ④ 動畫：天氣（晴、陰、霧、雨、雪） ---------------- */
const WX = {
  list: [['clear', '晴', { cloud: 0, fog: 0, rain: 0, snow: 0 }], ['cloudy', '陰', { cloud: 1, fog: 0, rain: 0, snow: 0 }],
    ['fog', '霧', { cloud: .5, fog: 1, rain: 0, snow: 0 }], ['rain', '雨', { cloud: 1, fog: .15, rain: 1, snow: 0 }],
    ['snow', '雪', { cloud: .8, fog: .1, rain: 0, snow: 1 }]],
  idx: 0, cur: { cloud: 0, fog: 0, rain: 0, snow: 0 }, cover: 0
};
function setWeather(i) {
  WX.idx = i;
  $('btnWeather').textContent = '天氣：' + WX.list[i][1];
  rainSound(WX.list[i][0] === 'rain');
  if (reduced) { Object.assign(WX.cur, WX.list[i][2]); WX.cover = WX.list[i][0] === 'snow' ? 1 : 0; updateWeather(0); }
}
function updateWeather(dt) {
  const tg = WX.list[WX.idx][2];
  for (const k in WX.cur) WX.cur[k] = lerp(WX.cur[k], tg[k], clamp(dt * .8, 0, 1));
  const c = WX.cur;
  WX.cover = clamp(WX.cover + (c.snow > .5 ? dt * .06 : -dt * .03), 0, 1);
  $('overcast').setAttribute('opacity', f1(c.cloud * .95));
  $('clouds').setAttribute('opacity', f1((1 - c.cloud * .6) * (1 - (show.on ? show.level : 0) * .95)));
  $('fogBack').setAttribute('opacity', f1(c.fog * .85));
  $('fogFront').setAttribute('opacity', f1(c.fog * .55));
  $('lowCloud').setAttribute('opacity', f1(Math.max(c.fog, c.rain * .6) * .8));
  $('rain').setAttribute('opacity', f1(c.rain));
  $('snowfall').setAttribute('opacity', f1(c.snow));
  $('dimmer').setAttribute('opacity', f1(c.cloud * .12 + c.rain * .06));
  $('stars').setAttribute('opacity', f1((1 - DAY.dl) * (1 - c.cloud)));
  svg.querySelectorAll('.snowcap').forEach(s => s.setAttribute('opacity', f1(WX.cover)));
  snowman.setAttribute('opacity', f1(smooth(.5, .9, WX.cover)));
  const umb = c.rain > .5 ? 1 : 0;
  walkers.forEach(w => w.p.umb.setAttribute('opacity', umb));
  photogs.forEach(p => p.p.umb.setAttribute('opacity', umb));
}

/* ---------------- ④ 動畫：極光秀 ---------------- */
// 約 21 秒：00–03 天色暗下、淡綠光帶浮現；03–09 光幕長高起伏；09–15 頭頂爆發成粉紅下緣的光幕；15–21 慢慢淡去
const show = { on: false, t: 0, dur: 21, level: 0, grow: 0, flare: 0, speed: 0, notes: [], prevLights: [] };
function startShow() {
  if (show.on) return;
  show.on = true; show.t = -1; show.waitFF = true;
  $('btnShow').disabled = true; $('btnShow').classList.add('on'); $('btnShow').textContent = '🌌 極光出現中…';
  // 快轉到晚上十點、天氣放晴
  const target = 22 / 24;
  let cur = ((T.t % 1) + 1) % 1;
  let dist = target - cur; if (dist < 0) dist += 1;
  T.ff = { from: cur, dist, t: 0, dur: dist * 24 < .5 ? .1 : 2.2 };
  T.auto = false;
  if (WX.idx !== 0) setWeather(0);
}
function beginShowProper() {
  show.t = 0; show.waitFF = false;
  show.notes = playAuroraMusic();
  // 小屋關燈，大家出來看極光
  show.prevLights = houses.map(h => h.on);
  houses.forEach(h => setHouseLight(h, false));
  walkers.forEach(w => { w.stop = 20; w.look = 1; });
  setTimeout(() => say(380, 360, 'Nordlys！極光！', 2.2), 2600);
  setTimeout(() => say(1420, 500, '快拍！', 1.6), 6200);
  setTimeout(() => say(560, 380, '哇——', 1.6), 10200);
  setTimeout(() => say(1300, 410, '整片天都在跳舞', 2), 12500);
}
function updateShow(dt) {
  if (!show.on) return;
  if (show.waitFF) return;
  show.t += dt;
  const t = show.t;
  show.level = smooth(0, 3, t) * (1 - smooth(16, show.dur, t)) * .95 + .05 * (1 - smooth(16, show.dur, t));
  show.grow = smooth(1, 9, t) * .7 + smooth(9, 11, t) * .6 - smooth(14, 19, t) * .9;
  show.speed = smooth(3, 9, t) * 1.2 + smooth(9, 11, t) * 1.6 - smooth(14, 18, t) * 2.4;
  // 跟著旋律每個音閃一下
  let fl = 0;
  show.notes.forEach(n => { if (t >= n) fl += Math.exp(-(t - n) * 2.6); });
  show.flare = clamp(fl, 0, 1.4) * (t > 9 && t < 15 ? 1.3 : .8);
  // 攝影客閃光
  photogs.forEach(p => { p.flash -= dt; if (p.flash < 0) { p.flash = rand(1.6, 3.6); camFlash(p.x + p.dir * 18, 548); } });
  if (t >= show.dur) endShow();
}
function endShow() {
  show.on = false; show.level = 0;
  houses.forEach((h, i) => setHouseLight(h, show.prevLights[i] ?? true));
  walkers.forEach(w => { w.stop = rand(0, 1.5); w.look = 0; });
  $('btnShow').disabled = false; $('btnShow').classList.remove('on'); $('btnShow').textContent = '🌌 極光秀';
}

/* ---------------- ④ 動畫：主迴圈 ---------------- */
const mouse = { x: 800, y: 300, in: false, lastRipple: 0 };
let clockT = 0, eagleIdle = 20;
function step(dt) {
  clockT += dt;
  const mv = reduced ? 0 : 1;
  // 時間
  if (T.ff) {
    T.ff.t += dt;
    const k = smooth(0, 1, T.ff.t / T.ff.dur);
    T.t = T.ff.from + T.ff.dist * k;
    if (T.ff.t >= T.ff.dur) { T.ff = null; if (show.waitFF) beginShowProper(); }
  } else if (T.auto && !show.on && !reduced && !T.dragging) T.t = (T.t + dt / T.dayLen) % 1;
  applyTime(false);
  updateWeather(dt);
  updateShow(dt);
  updateAurora(dt);
  const wind = .5 + WX.cur.rain * .6 + WX.cur.snow * .3;

  // 星星閃爍
  if (DAY.dl < .9 && mv) stars.forEach(s => { s.el.setAttribute('opacity', f1(.55 + .45 * Math.sin(clockT * s.sp + s.ph))); });
  // 雲飄
  clouds.forEach(c => {
    c.x += c.sp * dt * mv * wind; if (c.x > 1700) c.x = -100;
    c.puff = Math.max(0, c.puff - dt);
    const sc = 1 + Math.sin(c.puff * 12) * c.puff * .15;
    c.el.setAttribute('transform', `translate(${f1(c.x)},${c.y}) scale(${sc.toFixed(3)})`);
  });
  // 水面波紋
  ripples.forEach(r => {
    r.x += r.sp * dt * mv * (r.y > 470 ? 1 : .6); if (r.x > 1640) r.x = -60;
    r.el.setAttribute('x', f1(r.x + Math.sin(clockT * .8 + r.ph) * 6));
  });
  // 霧
  fogs.forEach(f => { f.x += f.sp * dt * mv; if (f.x > 1900) f.x = -300; f.el.setAttribute('transform', `translate(${f1(f.x)},${f.y})`); });
  // 三角旗
  const pw = clockT * 5 * (1 + pennantKick) * mv;
  pennantKick = Math.max(0, pennantKick - dt * .5);
  const plen = 64 + wind * 10, py = DECK_Y - 118;
  pennant.setAttribute('d', `M720 ${py}C${f1(740)} ${f1(py + Math.sin(pw) * 4)} ${f1(760)} ${f1(py + 2 + Math.sin(pw - 1) * 6)} ${f1(720 + plen)} ${f1(py + 6 + Math.sin(pw - 2) * 9)}C${f1(760)} ${f1(py + 8 + Math.sin(pw - 1) * 6)} ${f1(740)} ${f1(py + 10 + Math.sin(pw) * 4)} 720 ${py + 12}Z`);
  // 晾的衣服
  laundry.forEach(l => l.el.setAttribute('transform', `translate(${l.x},${DECK_Y - 54}) skewX(${f1(Math.sin(clockT * 3 + l.ph) * 10 * wind * mv)}) translate(${-l.x},${-(DECK_Y - 54)})`));
  // 鱈魚乾在風裡晃
  fishRows.forEach(r => {
    r.kick = Math.max(0, r.kick - dt * .6);
    const a = (Math.sin(clockT * 1.7 + r.ph) * (2 + wind * 3) + Math.sin(clockT * 7 + r.ph) * r.kick * 12) * mv;
    r.el.setAttribute('transform', `translate(0,${r.py}) skewX(${a.toFixed(2)}) translate(0,${-r.py})`);
  });
  // 煙囪的煙
  if (mv && Math.random() < dt * 1.5) { const h = pick(houses); if (h.on || Math.random() < .3) puff(h.chim[0], h.chim[1] - 18); }
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i]; p.t += dt;
    const k = p.t / p.life;
    p.el.setAttribute('transform', `translate(${f1(p.x + p.dx * p.t * wind)},${f1(p.y - p.t * 14)}) scale(${f1(1 + k * 2.2)})`);
    p.el.setAttribute('opacity', f1((1 - k) * .75));
    if (k >= 1) { p.el.remove(); puffs.splice(i, 1); }
  }
  updateWalkers(dt * mv);
  updateFishers(dt * mv);
  updateCars(dt * mv);
  updateBoats(dt * mv);
  updateSkiers(dt * mv);
  updateClimb(dt * mv);
  updateHikers(dt * mv);
  updatePara(dt * mv);
  updateCove(dt * mv);
  // 白天才有戶外活動；夜裡淡出
  const outdoor = smooth(.35, .75, DAY.dl);
  $('sports').setAttribute('opacity', f1(outdoor)); cove.sg.setAttribute('opacity', f1(outdoor));
  // 海鵰偶爾自己出來盤旋（不發出叫聲）
  eagleIdle -= dt * mv;
  if (eagleIdle < 0) { eagleIdle = rand(45, 70); if (eagle.mode === 'perch' && DAY.dl > .5) launchEagle('soar', true); }
  updateGulls(dt * mv);
  updateEagle(dt);   // 海鵰只在使用者點了才出場，所以照常飛
  // 雨雪
  if (WX.cur.rain > .02) drops.forEach(d => {
    d.y += d.sp * dt * mv; d.x -= d.sp * .2 * dt * mv;
    if (d.y > 600) { d.y = rand(-40, 0); d.x = rand(0, 1700); if (Math.random() < .12 && WX.cur.rain > .5) ripple(rand(0, 1600), rand(400, 596), false); }
    d.el.setAttribute('transform', `translate(${f1(d.x)},${f1(d.y)})`);
  });
  if (WX.cur.snow > .02) flakes.forEach(f => {
    f.y += f.sp * dt * mv; f.x += Math.sin(clockT + f.ph) * 14 * dt * mv;
    if (f.y > 604) { f.y = -6; f.x = rand(0, 1600); }
    f.el.setAttribute('transform', `translate(${f1(f.x)},${f1(f.y)})`);
  });
  // 泡泡、閃光、漣漪、跳魚
  for (let i = bubbles.length - 1; i >= 0; i--) { const b = bubbles[i]; b.t -= dt; if (b.t < .25) b.g.setAttribute('opacity', f1(Math.max(0, b.t / .25))); if (b.t <= 0) { b.g.remove(); bubbles.splice(i, 1); } }
  for (let i = flashes.length - 1; i >= 0; i--) { const f = flashes[i]; f.t -= dt; f.el.setAttribute('opacity', f1(Math.max(0, f.t / .35))); if (f.t <= 0) { f.el.remove(); flashes.splice(i, 1); } }
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i]; r.t += dt; const k = r.t / r.life;
    r.el.setAttribute('rx', f1(4 + k * r.max)); r.el.setAttribute('ry', f1(1.4 + k * r.max * .28)); r.el.setAttribute('opacity', f1((1 - k) * .8));
    if (k >= 1) { r.el.remove(); rings.splice(i, 1); }
  }
  for (let i = jumps.length - 1; i >= 0; i--) {
    const j = jumps[i]; j.t += dt; const k = j.t / .8;
    j.el.setAttribute('transform', `translate(${f1(j.x - 14 + k * 28)},${f1(j.y - Math.sin(k * Math.PI) * 34)}) rotate(${f1(-50 + k * 100)})`);
    if (k >= 1) { ripple(j.x + 14, j.y, false); sfx('plip'); j.el.remove(); jumps.splice(i, 1); }
  }
}

/* 行人：保持距離、走到底掉頭、下雨撐傘、極光秀時停下抬頭 */
function updateWalkers(dt) {
  walkers.forEach(w => {

  });
  // 鐘琴旋律
  MELODY.forEach(([b, n, len]) => {
    const t = t0 + b * BEAT, f = HZ(n), d = Math.max(.8, len * BEAT * 1.4);
    [[1, .16], [2, .05], [3.01, .025], [4.2, .012]].forEach(([m, v]) => { const g = envG(t, .004, d / m, v, dest); g.connect(dl); osc('sine', f * m, t, d, g); });
    // 長笛般的柔和氣音
    const g2 = actx.createGain(); g2.gain.setValueAtTime(.0001, t); g2.gain.linearRampToValueAtTime(.045, t + .12); g2.gain.linearRampToValueAtTime(.0001, t + len * BEAT);
    g2.connect(dest); g2.connect(dl);
    const fo = osc('triangle', f, t, len * BEAT, g2);
    const vib = actx.createOscillator(), vg = actx.createGain(); vib.frequency.value = 5; vg.gain.value = 4; vib.connect(vg); vg.connect(fo.frequency); vib.start(t); vib.stop(t + len * BEAT + .1);
  });
  // 高音閃爍琶音（極光最亮那段）
  ['D6', 'A5', 'F6', 'E6', 'C6', 'A5', 'G6', 'E6'].forEach((n, i) => { for (let r = 0; r < 2; r++) { const t = t0 + (8 + r * 4 + i * .5) * BEAT; const g = envG(t, .003, .6, .03, dest); g.connect(dl); osc('sine', HZ(n), t, .6, g); } });
  return times;
}

/* ---------------- ⑤ 互動：點擊與鍵盤 ---------------- */
function act(fn) { userGesture = true; ensureAudio(); fn(); }
function onAct(node, fn) {
  node.addEventListener('click', e => { e.stopPropagation(); act(() => fn(e)); });
  node.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(() => fn(e)); } });
}
function svgPoint(e) { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
function setHouseLight(h, on) { h.on = on; h.wins.forEach(w => w.setAttribute('class', on ? 'f-win' : 'f-win-off')); }
let pennantKick = 0;
function bindAll() {
  houses.forEach(h => onAct(h.g, () => { setHouseLight(h, !h.on); sfx('pop'); for (let i = 0; i < 3; i++) setTimeout(() => puff(h.chim[0], h.chim[1] - 18, true), i * 250); }));
  onAct($('racks'), () => { fishRows.forEach(r => r.kick = 1); scareGulls(1370, 380, 260); hangFish(); });
  onAct($('church'), () => { sfx('bell'); say(1240, SHORE - 90, '噹——噹——', 1.8); });
  onAct(pennant, () => { pennantKick = 2; sfx('wind'); });
  onAct($('laundry'), () => { pennantKick = 1.5; sfx('wind'); say(272, DECK_Y - 90, '衣服快被吹走了！', 1.6); });
  onAct($('mtnWrap'), () => { launchEagle('soar'); say(1006, 40, '崖上的海鵰醒了', 1.6); });
  onAct($('eagleG'), () => { sfx('eagle'); });
  onAct($('sun'), () => setTime(22));
  onAct($('moon'), () => setTime(10.5));
  $('clouds').querySelectorAll('[data-cloud]').forEach(g => onAct(g, () => { clouds[+g.dataset.cloud].puff = 1; sfx('squish'); }));
  photogs.forEach(p => onAct(p.g, () => {}));
  $('skyHit').addEventListener('click', e => act(() => {
    const p = svgPoint(e);
    if (isNight()) shootingStar(p.x, p.y);
    else { sfx('gull'); for (let i = 0; i < 6; i++) { const g = gulls[i]; g.perch = null; g.follow = null; g.x = -30 - i * 24; g.y = p.y + rand(-30, 30); g.tx = 1660; g.ty = p.y + rand(-40, 40); g.t = 8; } }
  }));
  $('waterHit').addEventListener('click', e => act(() => { const p = svgPoint(e); fishJump(p.x, Math.max(p.y, 400)); for (let i = 0; i < 2; i++) ripple(p.x, p.y, true); sfx('splash'); }));
  svg.addEventListener('pointermove', e => {
    const p = svgPoint(e); mouse.x = p.x; mouse.y = p.y; mouse.in = true;
    if (p.y > 396 && !reduced && clockT - mouse.lastRipple > .12) { mouse.lastRipple = clockT; ripple(p.x, p.y, false); }
  });
  svg.addEventListener('pointerleave', () => { mouse.in = false; });

  $('btnShow').addEventListener('click', () => act(startShow));
  $('btnBoat').addEventListener('click', () => act(boatReturn));
  $('btnEagle').addEventListener('click', () => act(() => { if (eagle.mode === 'perch' || eagle.mode === 'soar') launchEagle('dive'); }));
  $('btnRow').addEventListener('click', () => act(rowOut));
  $('btnSki').addEventListener('click', () => act(() => { if (isNight()) { say(1004, 120, '天黑了，明天再滑', 1.6); return; } skiers.forEach((s, i) => { if (s.t < 0 || s.t > 13) s.t = i * 2.2 * -1 + .01; }); sfx('whoosh'); say(1004, 40, '從山頂出發！', 1.6); }));
  $('btnPara').addEventListener('click', () => act(launchPara));
  $('btnWeather').addEventListener('click', () => act(() => setWeather((WX.idx + 1) % WX.list.length)));
  $('btnSound').addEventListener('click', () => {
    soundOn = !soundOn; userGesture = true; ensureAudio();
    if (master) master.gain.setValueAtTime(soundOn ? .5 : 0, actx.currentTime);
    if (!soundOn) { stopAll(); rainSound(false); } else rainSound(WX.list[WX.idx][0] === 'rain');
    $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  });
  $('btnDay').addEventListener('click', () => setTime(10.5));
  $('btnNight').addEventListener('click', () => setTime(22));
  $('btnAuto').addEventListener('click', () => { T.auto = !T.auto; $('btnAuto').setAttribute('aria-pressed', String(T.auto)); });
  const tr = $('timeRange');
  tr.addEventListener('input', () => { if (show.on) return; T.dragging = true; T.t = tr.value / 1000; applyTime(true); updateWeather(0); });
  tr.addEventListener('change', () => { T.dragging = false; });
  window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
  window.addEventListener('pointerdown', () => document.body.classList.remove('kbd'));
  mq.addEventListener && mq.addEventListener('change', () => { reduced = mq.matches; });
}
function setTime(h) {
  if (show.on) return;
  T.t = h / 24; T.auto = false; T.ff = null; $('btnAuto').setAttribute('aria-pressed', 'false'); applyTime(true); updateWeather(0);
  if (reduced) step(0);
}
function shootingStar(x, y) {
  const g = el('path', { d: 'M0 0L-60 -22', stroke: '#fff6d6', 'stroke-width': 2.4, 'stroke-linecap': 'round' }, $('shooting'));
  let k = 0; sfx('chime');
  const iv = setInterval(() => { k += .06; g.setAttribute('transform', `translate(${f1(x + k * 220)},${f1(y + k * 80)})`); g.setAttribute('opacity', f1(1 - k)); if (k >= 1) { clearInterval(iv); g.remove(); } }, 30);
  AUR.t += 1.5;
}
// 漁船返航：一艘漁船從左邊開進近航道，海鷗成群跟著
function boatReturn() {
  let b = boats.find(o => o.lane === 1 && o.type === 'sjark' && (o.x < -50 || o.x > 1650));
  if (!b) b = boats.filter(o => o.lane === 1 && o.type === 'sjark').sort((a, c) => a.x - c.x)[0];
  sfx('engine');
  gullsTo(b, 7);
  setTimeout(() => sfx('gull'), 700);
  say(clamp(b.x, 120, 1400), 470, '漁船帶著鱈魚回來了！', 1.8);
}
// 掛鱈魚：漁夫把新的一對對鱈魚掛上木架
function hangFish() {
  fishers.forEach((f, i) => setTimeout(() => { f.lift = 1.4; sfx('clack'); }, i * 500));
  fishRows.forEach(r => r.kick = .6);
  say(1300, 360, pick(['鱈魚一對一對綁起來掛好', '要在風裡曬到六月', '這就是挪威的鱈魚乾']), 1.8);
  // 一隻海鷗想偷魚，被漁夫趕走
  const g = gulls.find(o => !o.follow);
  if (g) { g.perch = null; g.tx = 1260; g.ty = 410; g.t = 2.2; setTimeout(() => { sfx('gull'); say(1260, 330, '走開！那是我們的魚', 1.6); flyGull(g, true); }, 2000); }
}
// 划船出海：北國划艇從右邊划進遠航道
function rowOut() {
  const b = boats.find(o => o.type === 'row');
  if (b && (b.x < -40 || b.x > 1640)) { const start = 1600 + b.len; if (!boats.some(o => o !== b && o.lane === b.lane && Math.abs(o.x - start) < 120)) b.x = start; }
  sfx('splash');
  if (b) say(clamp(b.x, 100, 1500), 450, '划著傳統的北國划艇', 1.8);
}

/* ---------------- 主迴圈 ---------------- */
let last = 0;
function loop(ts) {
  const dt = Math.min(.1, (ts - last) / 1000 || 0);
  if (dt >= 1 / 40 || !last) { last = ts; step(dt); }   // 減少動態時，step 裡的移動會乘上 0，只保留計時（泡泡、秀的流程）
  requestAnimationFrame(loop);
}

/* ---------------- 初始化 ---------------- */
function init() {
  makeFiber();
  drawSky();
  buildAurora();
  drawMountains();
  drawFarShore();
  drawWater();
  drawIslet();
  drawSpit();
  drawDock();
  drawMoored();
  buildWeather();
  makeEagle();
  drawTrail(); drawClimb(); makePara(); drawCove(); drawCormorants();
  addSkier(0, 'coat-1'); addSkier(1, 'coat-3');
  // 行人：木棧道、岩岸步道、前景碼頭
  [[0, 90, 0, {}], [0, 260, 0, { backpack: true }], [0, 470, 0, { kind: 'kid' }], [0, 640, 1, {}], [0, 380, 1, { camera: true }], [0, 160, 1, {}],
   [1, 1160, 0, { camera: true }], [1, 1400, 1, { kind: 'spark' }], [1, 1560, 1, { backpack: true }],
   [2, 1420, 0, { kind: 'kid' }]].forEach(([l, x, s, o]) => addWalker(l, x, s, o));
  addFisher(1250); addFisher(1488);
  addPhotog(1320, 1); addPhotog(1540, -1);
  // 車：兩個方向各三輛
  [-20, 520, 1100].forEach(x => addCar(0, x)); [200, 760, 1380].forEach(x => addCar(1, x));
  // 船：遠航道往左（漁船、觀光快艇、划艇），近航道往右（兩艘漁船）
  addBoat(0, 1300, 'sjark'); addBoat(0, 700, 'rib'); addBoat(0, 1750, 'row'); addBoat(0, 2150, 'kayak'); addBoat(0, 2700, 'sjark');
  addBoat(1, 300, 'sjark'); addBoat(1, -900, 'sjark');
  // 海鷗
  for (let i = 0; i < 9; i++) addGull(srand(100, 1500), srand(80, 300));
  PERCHES.slice(0, 5).forEach(p => { const g = addGull(p[0], p[1]); g.perch = p; });
  bindAll();
  setWeather(0);
  applyTime(true);
  updateWeather(0);
  step(1 / 30);
  if (reduced) { WX.cur = { ...WX.list[0][2] }; }
  requestAnimationFrame(loop);
}
init();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on,
  btn: 'btnShow',
  save: () => ({ t: T.t, auto: T.auto, w: WX.idx }),
  stop: () => { T.ff = null; endShow(); },
  restore: s => { if (WX.idx !== s.w) setWeather(s.w); T.t = s.t; T.auto = s.auto; $('btnAuto') && $('btnAuto').setAttribute('aria-pressed', String(T.auto)); applyTime(true); }
});
/* /ShowStop */
})();
</script>
