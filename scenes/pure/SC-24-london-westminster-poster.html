<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>倫敦西敏河岸報時</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-24 倫敦西敏河岸報時｜復古旅遊海報風
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   風格重點：限色油墨（約十色）、大色塊、階梯式天空色帶、
            放射光芒、網點陰影、印刷顆粒、米色紙邊框。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），
   部分另有 --k-名稱（晨昏）。JS 會依時間內插，輸出成 --名稱，
   並自動產生 .f-名稱（填色）、.s-名稱（描邊）兩個 class。
   ========================================================= */
:root{
  color-scheme: dark;

  /* —— 海報紙與油墨（不隨日夜變化） —— */
  --paper:#f4e6c8;       /* 米色紙：邊框、光芒、亮部 */
  --ink:#1f2a44;         /* 深藍墨：細節、指針、輪廓 */
  --gold:#e8b23a;        /* 金色：鐘面框、尖頂飾條 */
  --red:#d23a2c;         /* 倫敦紅：巴士、電話亭 */
  --red-dk:#9a2620;
  --teal:#2f8f8a;
  --mustard:#e4a83c;
  --orange:#e0723a;
  --cream:#f6ecd4;
  --black-cab:#1c1d24;

  /* —— 天空：五道階梯色帶（由上而下） —— */
  --d-sky-1:#4f97b0; --k-sky-1:#3d4f8a; --n-sky-1:#0f1636;
  --d-sky-2:#72adbd; --k-sky-2:#7a5e94; --n-sky-2:#152044;
  --d-sky-3:#9cc6c4; --k-sky-3:#c46f86; --n-sky-3:#1c2a54;
  --d-sky-4:#cfdcc0; --k-sky-4:#ec9067; --n-sky-4:#253563;
  --d-sky-5:#f1dcae; --k-sky-5:#f6b35c; --n-sky-5:#334373;
  --d-cloud:#f7ecd2;  --k-cloud:#f8c8a0; --n-cloud:#2a3766;
  --d-cloud-sh:#d6cbb0; --n-cloud-sh:#1d2850;
  --d-ray:#fff6dc;    --n-ray:#3a4a80;    /* 放射光芒 */

  /* —— 遠景：天際線、西敏寺 —— */
  --d-far:#a9c2b4;    --n-far:#1f2b55;
  --d-far-2:#93b0a4;  --n-far-2:#1a2449;
  --d-abbey:#d8c49a;  --n-abbey:#4d4462;
  --d-abbey-sh:#bca57a; --n-abbey-sh:#3a3352;

  /* —— 主角：國會大廈與伊莉莎白塔（夜晚打上金色投射燈） —— */
  --d-stone:#e2b468;    --n-stone:#d39445;
  --d-stone-sh:#b9803f; --n-stone-sh:#8a4d26;
  --d-stone-dk:#7c5230; --n-stone-dk:#4a2618;
  --d-slate:#3b5868;    --n-slate:#1a2242;   /* 屋頂與尖塔的鐵灰石板 */
  --d-slate-hi:#557688; --n-slate-hi:#2a3560;
  --d-clock:#f8efd6;    --n-clock:#fff3bf;   /* 鐘面：夜晚背光發亮 */
  --d-win:#5c4a3e;      --n-win:#ffd77e;     /* 窗戶：夜晚亮燈 */
  --d-tree-far:#6f9a6a; --n-tree-far:#18302a;

  /* —— 摩天輪與大橋 —— */
  --d-wheel:#eef1ee;    --n-wheel:#d65ad0;   /* 夜晚打上洋紅燈 */
  --d-wheel-pod:#f7f9f8; --n-wheel-pod:#ffd6f6;
  --d-bridge:#3f8a6a;   --n-bridge:#1f4740;  /* 西敏橋的綠色 */
  --d-bridge-sh:#2b6650; --n-bridge-sh:#14302c;
  --d-pier:#c8b998;     --n-pier:#3a3550;

  /* —— 泰晤士河 —— */
  --d-river-1:#2f7d8f; --k-river-1:#6a5a8a; --n-river-1:#0d1838;
  --d-river-2:#3c8e9c; --k-river-2:#c07a72; --n-river-2:#13214a;
  --d-river-3:#256878; --n-river-3:#0a1230;
  --d-river-hi:#cfe6d8; --n-river-hi:#5e72b8;
  --d-refl:#e2b468;     --n-refl:#ffcf6a;    /* 建築倒影：夜晚金色 */

  /* —— 前景：河堤欄杆、步道、馬路、梧桐 —— */
  --d-parapet:#c8bea8;  --n-parapet:#3d3b56;
  --d-parapet-sh:#a39a86; --n-parapet-sh:#2b2a42;
  --d-pave:#d9c7a0;     --n-pave:#2d2c45;
  --d-pave-line:#c4b086; --n-pave-line:#25243b;
  --d-road:#4c5160;     --n-road:#191a29;
  --d-road-line:#f2e6c8; --n-road-line:#8a8466;
  --d-tree-1:#3f6e3a;   --n-tree-1:#122a1e;
  --d-tree-2:#5f8f45;   --n-tree-2:#1a3826;
  --d-tree-3:#86ad55;   --n-tree-3:#244630;
  --d-bark:#9a8c6c;     --n-bark:#2e2b3a;
  --d-bark-2:#c9bc94;   --n-bark-2:#403c4e;
  --d-lamp-post:#2a3a3a; --n-lamp-post:#11161f;
  --d-shadow:#00000024; --n-shadow:#00000070;
  --d-bus-win:#26384a;  --n-bus-win:#f4b860;
  --d-bus:#d23a2c;      --n-bus:#a42c26;

  /* —— 光源 —— */
  --sun:#fff1c8;
  --sun-ring:#ffd98a;
  --moon:#fff3d6;
  --star:#fff6dc;
  --lamp:#ffd27a;
  --ayrton:#fff1a8;      /* 塔頂的國會開會燈 */

  /* —— 煙火（只用海報色票） —— */
  --fw-1:#ff5a4a; --fw-2:#ffd25a; --fw-3:#5fe0d0; --fw-4:#fff6dc; --fw-5:#ff8fd8;

  /* —— 天氣：霧帶、雨絲、疊色 —— */
  --d-fog:#ece4d0;  --n-fog:#4a5578;
  --d-rainc:#4e6a86; --n-rainc:#9fb0d8;
  --wx-cloud:#7d8a92;  --wx-fog:#e8e2d2;  --wx-rain:#3a4a62;  --wx-snow:#e8eef2;

  /* —— 角色 —— */
  --skin-1:#f2cfa8; --skin-2:#d9a37a; --skin-3:#a8724c; --skin-4:#6e4a33;
  --hair-1:#2a2024; --hair-2:#6a4228; --hair-3:#d6a85a; --hair-4:#b8b2a8;
  --coat-1:#c9a46a;  /* 風衣卡其 */
  --coat-2:#2c3a5a;  /* 海軍藍大衣 */
  --coat-3:#d23a2c;  /* 紅外套 */
  --coat-4:#2f8f8a;  /* 青綠 */
  --coat-5:#e4a83c;  /* 芥末黃 */
  --coat-6:#4a4a52;  /* 炭灰 */
  --pants-1:#24283a; --pants-2:#5a5248;
  --umb-1:#1f2a44; --umb-2:#d23a2c; --umb-3:#e4a83c; --umb-4:#2f8f8a;

  /* —— 頁面介面 —— */
  --page-bg:#141a2e; --page-fg:#f4e6c8; --page-muted:#b0a88f;
  --ui-surface:#1d2540; --ui-line:#34405f; --ui-accent:#e8b23a;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border:1px solid var(--ui-line);border-radius:10px;overflow:hidden;background:var(--paper);line-height:0}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:10px;padding:10px 14px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--page-bg);font-weight:700}
.panel button.big{border-color:var(--red);color:#fff;background:var(--red);font-weight:700}
.panel button.big.on{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--page-bg)}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
/* 畫面內可點物件：滑鼠點不顯示外框，用鍵盤 Tab 時才顯示 */
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid var(--ui-accent);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable,#scene [role="button"]{cursor:pointer}
#scene .bubble rect{fill:var(--paper);stroke:var(--ink);stroke-width:2}
#scene .bubble text{fill:var(--ink);font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
/* 對話泡泡：定位用外層 g 的 transform 屬性，淡入淡出只動內層的 opacity（不碰 transform） */
#scene .bubble .pop{animation:pop var(--dur,1.6s) ease-out forwards}
@keyframes pop{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  #scene .bubble .pop{animation:none}
}
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>
<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。
   想恢復完整版，刪掉這整段 <style id="pure-art"> 即可。
   ========================================================= */
html,body{height:100%;margin:0!important;overflow:hidden}
body{display:flex!important;align-items:center;justify-content:center;padding:0!important}
body>.wrap{width:100%!important;max-width:min(100vw,calc(100vh * 8 / 3))!important;
  margin:0!important;padding:0!important;gap:0!important;display:block!important}
body>.wrap>:not(.stage){display:none!important}
body>.wrap>.stage{width:100%!important;max-width:100%!important;margin:0!important;
  border:0!important;border-radius:0!important;box-shadow:none!important}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：天空 → 煙火 → 遠景 → 摩天輪 → 國會大廈與鐘塔
       → 泰晤士河 → 西敏橋 → 船 → 河堤 → 步道人物 → 馬路車輛
       → 天氣 → 印刷顆粒 → 紙邊框
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="復古旅遊海報風格的倫敦河岸插畫動畫：泰晤士河對岸是金黃色的哥德式國會大廈，右端高聳的伊莉莎白塔（大笨鐘）鐘面顯示目前時間，後方露出西敏寺雙塔；右側綠色的西敏橋上有紅色雙層巴士駛過，橋後一座白色摩天輪緩緩轉動；河上有觀光遊船、河上巴士與拖船；前景河堤上有鱘魚燈柱、梧桐樹、紅色電話亭、糖炒堅果攤與街頭藝人，步道上行人來往，馬路上有紅色雙層巴士與黑色計程車">
    <defs>
      <!-- 網點（半色調）：用在陰影與天空色帶交界 -->
      <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse">
        <circle cx="3.5" cy="3.5" r="1.3" style="fill:var(--ink)" opacity=".22"/>
      </pattern>
      <pattern id="dotsLight" width="6" height="6" patternUnits="userSpaceOnUse">
        <circle cx="3" cy="3" r="1.1" style="fill:var(--paper)" opacity=".45"/>
      </pattern>
      <!-- 步道鋪面石板 -->
      <pattern id="paving" width="46" height="20" patternUnits="userSpaceOnUse">
        <path d="M0 .5H46M.5 0V10M23.5 10V20M0 10.5H46" class="s-pave-line" stroke-width="1.4"/>
      </pattern>
      <!-- 印刷顆粒：由程式用 canvas 產生後填入 href -->
      <pattern id="grainPat" width="240" height="240" patternUnits="userSpaceOnUse">
        <image id="grainImg" width="240" height="240" href=""/>
      </pattern>
      <!-- 電話亭的小方格玻璃 -->
      <pattern id="panes" width="6" height="7" patternUnits="userSpaceOnUse">
        <rect width="6" height="7" style="fill:var(--red)"/>
        <rect x="1" y="1" width="4" height="5" class="f-bus-win"/>
      </pattern>
      <clipPath id="frameClip"><rect x="0" y="0" width="1600" height="600"/></clipPath>
    </defs>

    <g clip-path="url(#frameClip)">
    <!-- ===== 場景：天空 ===== -->
    <g id="skyBands"></g>
    <rect id="skyHit" x="0" y="0" width="1600" height="300" fill="transparent" class="clickable" tabindex="0" role="button" aria-label="天空：白天飛過海鷗，夜晚放一發煙火"/>
    <g id="rays" pointer-events="none"></g>
    <g id="stars" pointer-events="none"></g>
    <g id="sun" pointer-events="none"></g>
    <g id="moon" pointer-events="none"></g>
    <g id="clouds" pointer-events="none"></g>
    <g id="overcast" pointer-events="none" opacity="0"></g>
    <g id="plane" pointer-events="none"></g>
    <g id="fireworks" pointer-events="none"></g>
    <g id="gulls" pointer-events="none"></g>

    <!-- ===== 場景：遠景與地標（滑鼠移動時有輕微視差） ===== -->
    <g id="parFar">
      <g id="far"></g>
      <g id="abbey"></g>
    </g>
    <g id="parMid">
      <g id="wheel" class="clickable" tabindex="0" role="button" aria-label="摩天輪：點一下車廂亮燈、轉快一點"></g>
      <g id="palace"></g>
      <g id="bigben"></g>
      <g id="rings" pointer-events="none"></g>
      <g id="towerBirds" pointer-events="none"></g>
    </g>
    <g id="fogFar" pointer-events="none" opacity="0"></g>

    <!-- ===== 場景：泰晤士河、西敏橋、船 ===== -->
    <g id="river"></g>
    <g id="riverRefl" pointer-events="none"></g>
    <g id="ripples" pointer-events="none"></g>
    <g id="bridgeTraffic" pointer-events="none"></g>
    <g id="bridge"></g>
    <g id="boats"></g>
    <g id="fogMid" pointer-events="none" opacity="0"></g>

    <!-- ===== 場景：前景河堤、步道、馬路 ===== -->
    <g id="parNear">
      <g id="embank"></g>
      <g id="props"></g>
      <g id="walkers"></g>
      <g id="pigeons"></g>
      <g id="road"></g>
      <g id="vehiclesFar"></g>
      <g id="vehiclesNear"></g>
      <g id="treesFront"></g>
    </g>

    <!-- ===== 天氣與氛圍 ===== -->
    <g id="splashes" pointer-events="none"></g>
    <g id="rain" pointer-events="none" opacity="0"></g>
    <g id="snow" pointer-events="none" opacity="0"></g>
    <g id="fogNear" pointer-events="none" opacity="0"></g>
    <g id="wxTint" pointer-events="none"></g>
    <g id="notes" pointer-events="none"></g>
    <g id="bubbles" pointer-events="none"></g>
    </g>

    <!-- ===== 海報質感：印刷顆粒＋米色紙邊框 ===== -->

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);
      }
      return _conn.call(this, dest, ...a);
    };
  }
  function stopAudio() {
    let longs = [], ctx = null;
    for (const s of srcs) {
      const c = s.context, now = c.currentTime, m = s.__ss; ctx = c;
      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }
    if (longs.length && ctx) {
      const g = outs.get(ctx), now = ctx.currentTime;
      if (g) {
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 1.1); g.gain.setValueAtTime(0, now + 1.2);
        g.gain.linearRampToValueAtTime(1, now + 1.9);
      }
      longs.forEach(s => { try { s.stop(now + 1.15); } catch (e) {} srcs.delete(s); });
    }
    srcs.clear();
  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');
    // 凍結色票：把目前的 CSS 變數抄到殘影上，底下換色不影響殘影
    const cs = getComputedStyle(svg);
    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }
      }
    }
    const par = svg.parentElement;
    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });
    added = [];
  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>
/* =========================================================
   SC-24 倫敦西敏河岸報時｜程式區
   區塊：①工具與色票 ②場景（天空、遠景、西敏寺、國會大廈、鐘塔、
         摩天輪、河、橋、河堤）③角色（船、行人、車輛、鴿子）
         ④動畫（日夜、天氣、報時秀、煙火、環境）⑤互動（點擊、滑鼠、聲音、控制列）
   ========================================================= */
(() => {
'use strict';

/* ---------------- ① 工具與色票 ---------------- */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const root = document.documentElement;
const svg = $('scene');
const HORIZON = 398;        // 對岸河堤線＝河面頂
const RIVER_B = 480;        // 近岸欄杆頂
const LANE_FAR = 566;       // 馬路遠車道（往右開）
const LANE_NEAR = 586;      // 馬路近車道（往左開；英國靠左行駛）
const BX = 1010;            // 伊莉莎白塔中心 x
const CLOCK_Y = 143;        // 鐘面中心 y
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
let seed = 20261124;  // 固定亂數：每次開啟構圖一樣
const srand = (a = 0, b = 1) => { seed = (seed * 16807) % 2147483647; return a + (seed / 2147483647) * (b - a); };
const f1 = n => (+n).toFixed(1);
function el(tag, attrs = {}, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function frag(parent, html) { parent.insertAdjacentHTML('beforeend', html); return parent.lastElementChild; }

// 讀取色票、內插混色
const css = n => getComputedStyle(root).getPropertyValue(n).trim();
const hex = h => {
  h = h.replace('#', '');
  if (h.length === 3) h = [...h].map(c => c + c).join('');
  const n = parseInt(h.slice(0, 6), 16);
  return [n >> 16 & 255, n >> 8 & 255, n & 255, h.length === 8 ? parseInt(h.slice(6), 16) / 255 : 1];
};
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgba = c => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${(c[3] ?? 1).toFixed(3)})`;
// 成對色票：自動找出所有 --d-xxx，配對 --n-xxx（與選用的 --k-xxx）
const PAIRS = {};
(() => {
  const names = [];
  for (const sheet of document.styleSheets) {
    try { for (const r of sheet.cssRules) if (r.selectorText === ':root') for (const p of r.style) if (p.startsWith('--d-')) names.push(p.slice(4)); } catch (e) {}
  }
  let cls = '';
  names.forEach(k => {
    const k2 = css('--k-' + k);
    PAIRS[k] = { d: hex(css('--d-' + k)), n: hex(css('--n-' + k)), k: k2 ? hex(k2) : null };
    cls += `#scene .f-${k}{fill:var(--${k})}#scene .s-${k}{stroke:var(--${k});fill:none}`;
  });
  const st = document.createElement('style'); st.textContent = cls; document.head.appendChild(st);
})();
const FW = [1, 2, 3, 4, 5].map(i => `var(--fw-${i})`);

/* 動態偏好 */
const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
let reduced = mq.matches;

/* 印刷顆粒：用 canvas 撒一層深色與米色的細點，做成重複貼圖 */
function makeGrain() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 240;
    const x = c.getContext('2d'), img = x.createImageData(240, 240), d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const r = Math.random();
      if (r < .09) { d[i] = 30; d[i + 1] = 34; d[i + 2] = 52; d[i + 3] = 20 + Math.random() * 42; }
      else if (r < .15) { d[i] = 250; d[i + 1] = 236; d[i + 2] = 206; d[i + 3] = 20 + Math.random() * 50; }
    }
    x.putImageData(img, 0, 0);
    $('grainImg').setAttribute('href', c.toDataURL('image/png'));
  } catch (e) {}
}

/* ---------------- ② 場景：天空（五道階梯色帶＋放射光芒） ---------------- */
const stars = [], clouds = [];

  const bands = [[0, 92], [92, 170], [170, 244], [244, 318], [318, 400]];
  bands.forEach(([a, b], i) => el('rect', { x: 0, y: a, width: 1600, height: b - a + 1, class: 'f-sky-' + (i + 1) }, $('skyBands')));
  // 色帶交界的網點過渡（海報印刷常見的手法）
  bands.slice(1).forEach(([a]) => el('rect', { x: 0, y: a - 9, width: 1600, height: 9, fill: 'url(#dotsLight)', opacity: .35 }, $('skyBands')));
  // 放射光芒：以鐘面為中心的楔形光束
  const g = el('g', { id: 'rayWheel' }, $('rays'));
  for (let i = 0; i < 14; i++) {
    const a0 = i / 14 * Math.PI * 2, a1 = a0 + Math.PI / 14 * .82;
    el('path', { d: `M0 0L${f1(Math.cos(a0) * 1300)} ${f1(Math.sin(a0) * 1300)}L${f1(Math.cos(a1) * 1300)} ${f1(Math.sin(a1) * 1300)}Z`, class: 'f-ray' }, g);
  }
  // 星星：圓點＋幾顆四角星
  for (let i = 0; i < 70; i++) {
    const x = srand(20, 1580), y = srand(20, 300);
    const s = i % 9 === 0
      ? el('path', { d: `M${f1(x)} ${f1(y - 5)}L${f1(x + 1.4)} ${f1(y - 1.4)}L${f1(x + 5)} ${f1(y)}L${f1(x + 1.4)} ${f1(y + 1.4)}L${f1(x)} ${f1(y + 5)}L${f1(x - 1.4)} ${f1(y + 1.4)}L${f1(x - 5)} ${f1(y)}L${f1(x - 1.4)} ${f1(y - 1.4)}Z`, style: 'fill:var(--star)' }, $('stars'))
      : el('circle', { cx: f1(x), cy: f1(y), r: f1(srand(.8, 1.8)), style: 'fill:var(--star)' }, $('stars'));
    stars.push({ el: s, ph: srand(0, 6.28), sp: srand(.6, 2) });
  }
  // 太陽：平塗圓盤＋一圈光環；月亮：彎月
  frag($('sun'), `<circle r="66" style="fill:var(--sun-ring)" opacity=".35"/><circle r="46" style="fill:var(--sun)"/>`);
  frag($('moon'), `<circle r="44" style="fill:var(--moon)" opacity=".12"/><path d="M6 -30A30 30 0 1 0 6 30A23 28 0 1 1 6 -30Z" style="fill:var(--moon)"/>`);
  // 海報雲：平底、圓頂、底下一條陰影
  const cloudShapes = [
    [[0, 0, 26], [30, -10, 32], [66, -2, 24], [92, 4, 16]],
    [[0, 0, 18], [24, -12, 26], [56, -6, 22], [80, 2, 14]],
    [[0, 0, 22], [28, -14, 30], [64, -10, 26], [96, -2, 20], [120, 4, 12]]
  ];
  for (let i = 0; i < 6; i++) {
    const shp = cloudShapes[i % 3];
    const g2 = el('g', {}, $('clouds'));
    const w = shp[shp.length - 1][0] + shp[shp.length - 1][2];
    const minX = -shp[0][2];
    el('rect', { x: minX, y: 6, width: w - minX, height: 8, rx: 4, class: 'f-cloud-sh' }, g2);
    shp.forEach(([cx, cy, r]) => el('circle', { cx, cy, r, class: 'f-cloud' }, g2));
    el('rect', { x: minX, y: -2, width: w - minX, height: 12, class: 'f-cloud' }, g2);
    clouds.push({ el: g2, x: srand(-100, 1600), y: srand(50, 230), sp: srand(5, 11), s: srand(.8, 1.3) });
  }
  // 陰天雲層：三條長長的平塗雲帶（陰、雨、雪時出現）
  [[60, 46, 'f-cloud-sh'], [130, 54, 'f-cloud'], [210, 40, 'f-cloud-sh']].forEach(([y, h, c], i) => {
    let d = `M-20 ${y + h}`;
    for (let x = -20; x <= 1640; x += 70) d += ` Q${x + 35} ${y - 14 - (i * 37 + x) % 20} ${x + 70} ${y}`;
    el('path', { d: d + ` L1640 ${y + h} Z`, class: c }, $('overcast'));
  });
  // 飛機（白天沿高空飛過，夜晚亮閃燈）
  frag($('plane'), `<path d="M-20 0 L16 -2 L22 0 L16 2 Z M-2 0 L-9 -10 L-5 -10 L6 0 L-5 10 L-9 10 Z M-17 0 L-21 -6 L-18 -6 L-13 0 Z" style="fill:var(--ink)"/><circle id="planeL" cx="-20" cy="0" r="2" fill="#ff5a4a"/>`);
}

/* ---------------- ② 場景：遠景天際線 ---------------- */
function drawFar() {
  const g = $('far');
  // 後排：低矮屋頂與幾座塔樓的剪影
  let d = 'M0 398 V352';
  let x = 0;
  while (x < 1600) {
    const w = srand(26, 70), h = srand(330, 362);
    d += ` H${f1(x)} V${f1(h)}`;
    if (srand() < .25) d += ` L${f1(x + w / 2)} ${f1(h - srand(10, 22))} L${f1(x + w)} ${f1(h)}`;
    else d += ` H${f1(x + w)}`;
    x += w;
  }
  el('path', { d: d + ' V398 Z', class: 'f-far-2' }, g);
  // 前排：樹叢（維多利亞塔花園一帶）
  for (let i = 0; i < 28; i++) {
    const cx = srand(0, 1600), r = srand(12, 24);
    el('circle', { cx: f1(cx), cy: f1(392 - r * .5), r: f1(r), class: 'f-tree-far' }, g);
  }
  el('rect', { x: 0, y: 380, width: 1600, height: 20, class: 'f-far' }, g);
}

/* ---------------- ② 場景：西敏寺西側雙塔（在國會大廈後方） ---------------- */
function drawAbbey() {
  const g = $('abbey');
  const T1 = 404, T2 = 470, W = 36, TOP = 200;
  // 中殿山牆與大窗
  el('path', { d: `M${T1 + W} 320 V246 L${(T1 + W + T2) / 2} 222 L${T2} 246 V320 Z`, class: 'f-abbey-sh' }, g);
  el('path', { d: `M${(T1 + W + T2) / 2 - 8} 300 V262 Q${(T1 + W + T2) / 2} 248 ${(T1 + W + T2) / 2 + 8} 262 V300 Z`, class: 'f-win', opacity: .8 }, g);
  [T1, T2].forEach((tx, k) => {

    [tx - 2, tx + 9, tx + W - 15, tx + W - 4].forEach((px, j) => {

    });
    el('rect', { x: tx - 2, y: TOP - 3, width: W + 4, height: 4, class: 'f-abbey-sh' }, g);

    [[TOP + 16, 22], [TOP + 50, 26]].forEach(([wy, wh]) => {

    if (k === 1) el('circle', { cx: tx + W / 2 - 2, cy: TOP + 92, r: 6, class: 'f-clock', opacity: .9 }, g);

}

  for (let i = 0; i < 32; i++) {
    const a = i / 32 * Math.PI * 2;
    el('line', { x1: WX, y1: WY, x2: f1(WX + Math.cos(a) * (WR - 6)), y2: f1(WY + Math.sin(a) * (WR - 6)), class: 's-wheel', 'stroke-width': .9, opacity: .7 }, sp);
  }
  el('circle', { cx: WX, cy: WY, r: WR, class: 's-wheel', 'stroke-width': 5 }, g);
  el('circle', { cx: WX, cy: WY, r: WR - 10, class: 's-wheel', 'stroke-width': 2 }, g);
  el('circle', { cx: WX, cy: WY, r: 12, class: 'f-wheel' }, g);
  el('circle', { cx: WX, cy: WY, r: 5, style: 'fill:var(--ink)' }, g);
  // 32 個膠囊車廂（位置每格更新）
  for (let i = 0; i < 32; i++) {
    const p = el('g', {}, g);
    el('ellipse', { rx: 6.5, ry: 8.5, class: 'f-wheel-pod', style: 'stroke:var(--ink)', 'stroke-width': .8 }, p);
    el('rect', { x: -4.5, y: -2, width: 9, height: 3, style: 'fill:var(--ink)', opacity: .5 }, p);
    const lit = el('circle', { r: 11, style: 'fill:var(--fw-5)', opacity: 0 }, p);
    pods.push({ el: p, lit, f: 0 });
  }
}

/* ---------------- ④ 動畫：日夜循環 ----------------

/* ---------------- ④ 動畫：整點報時秀 ----------------
   wind：指針快轉到整點 → chime：西敏寺鐘聲四段旋律（16 音）
   → strike：大鐘敲出點數 → finale：船鳴笛；夜晚加一場煙火 */
const PHRASES = [['E', 'G#', 'F#', 'B'], ['E', 'F#', 'G#', 'E'], ['G#', 'E', 'F#', 'B'], ['B', 'F#', 'G#', 'E']];

/* ---------------- ④ 動畫：每一格的更新 ---------------- */

  puffs.push({ el: c, x, y, s, t: 0, vx: rand(-6, 10) });
}
function step(dt) {

        const e = show.events.shift();
        if (e.kind === 'q') { ringWave(false); show.flash = .6; }
        else {
          ringWave(true); show.flash = 1; show.pulse = 1;
          if (e.k === 1) { towerBirds.forEach(b => { b.fly = 1; b.ret = 0; }); if (audioOK()) flap(actx.currentTime); }

  // —— 天空：光芒、星星、雲、飛機、海鷗 ——

  show.pulse = Math.max(0, (show.pulse || 0) - dt * .9);

  $('rayWheel').setAttribute('transform', `translate(${BX} ${CLOCK_Y}) rotate(${f1(clock * (show.on ? 6 : 1.5))})`);
  $('clockGlow').setAttribute('opacity', f1(Math.max(nOn * .35, show.flash * .7)));

  $('planeL').setAttribute('opacity', Math.sin(clock * 8) > .6 ? 1 : .15);
  gullT -= dt;
  if (gullT < 0 && night < .5 && wx.snow < .5) { gullT = rand(9, 18); const dir = Math.random() < .5 ? 1 : -1; for (let i = 0; i < 2 + (Math.random() * 2 | 0); i++) spawnGull(dir > 0 ? -30 - i * 40 : 1630 + i * 40, rand(120, 300), dir * rand(70, 100)); }
  for (let i = gulls.length - 1; i >= 0; i--) {
    const g = gulls[i]; g.t += dt; g.x += g.vx * dt; g.y += (g.vy + Math.sin(g.t * 1.4 + g.ph) * 10) * dt;
    g.el.firstChild.setAttribute('d', Math.sin(g.t * 9 + g.ph) > 0 ? 'M-10 0 Q-5 -6 0 0 Q5 -6 10 0' : 'M-10 -2 Q-5 3 0 0 Q5 3 10 -2');
    g.el.setAttribute('transform', `translate(${f1(g.x)} ${f1(g.y)})`);
    if (g.x < -80 || g.x > 1680) { g.el.remove(); gulls.splice(i, 1); }
  }
  // 旗子飄動
  flag.setAttribute('transform', `translate(264 20) skewY(${f1(Math.sin(clock * 3) * 4 * wind)}) scale(${f1(.9 + Math.sin(clock * 2.3) * .08)} 1)`);

  // —— 摩天輪：約四分鐘轉一圈，點擊後轉快 ——
  wheelBoost = Math.max(0, wheelBoost - dt);
  wheelA += dt * (Math.PI * 2 / 240) * (1 + (wheelBoost > 0 ? 6 : 0));
  $('spokes').setAttribute('transform', `rotate(${f1(wheelA * 180 / Math.PI)} ${WX} ${WY})`);
  pods.forEach((p, i) => {
    const a = wheelA + i / 32 * Math.PI * 2;
    p.el.setAttribute('transform', `translate(${f1(WX + Math.cos(a) * WR)} ${f1(WY + Math.sin(a) * WR)})`);
    p.f = Math.max(0, p.f - dt * .5);
    p.lit.setAttribute('opacity', f1(Math.max(p.f, nOn * (.25 + .2 * Math.sin(clock * 2 + i)))));
  });

  // —— 鐘塔的鴿子：報時時繞塔飛 ——
  towerBirds.forEach(b => {
    if (b.fly) {
      b.a += b.sp * dt; b.fly += dt;
      const tx = BX + Math.cos(b.a) * b.r, ty = 150 + Math.sin(b.a) * b.r * .35;
      if (b.ret > 0) { b.ret -= dt; if (b.ret <= 0) b.fly = 0; }
      if (b.ret > 0 && b.ret < 2) { const k = 1 - b.ret / 2; b.x += (b.px - b.x) * k * .2; b.y += (b.py - b.y) * k * .2; }
      else { b.x += (tx - b.x) * Math.min(1, dt * 2); b.y += (ty - b.y) * Math.min(1, dt * 2); }
      b.el.firstChild.setAttribute('d', Math.sin(clock * 14 + b.a * 3) > 0 ? 'M-6 0 Q-3 -5 0 0 Q3 -5 6 0' : 'M-6 -1 Q-3 3 0 0 Q3 3 6 -1');
    } else { b.x = b.px; b.y = b.py; b.el.firstChild.setAttribute('d', 'M-4 0 Q0 -3 4 0'); }
    b.el.setAttribute('transform', `translate(${f1(b.x)} ${f1(b.y)})`);
  });
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i]; r.t += dt;
    r.el.setAttribute('r', f1(20 + r.t * (r.big ? 170 : 110)));
    r.el.setAttribute('opacity', f1(Math.max(0, (r.big ? .9 : .6) * (1 - r.t / 1.6))));
    if (r.t > 1.6) { r.el.remove(); rings.splice(i, 1); }
  }

  // —— 河面：波紋、滑鼠漣漪 ——
  waves.forEach(w => {
    w.x += w.sp * dt; if (w.x > 1640) w.x = -40;
    const L = w.len * (.7 + .3 * Math.sin(clock * 1.2 + w.ph));
    w.el.setAttribute('x1', f1(w.x)); w.el.setAttribute('x2', f1(w.x + L));
    w.el.setAttribute('y1', f1(w.y)); w.el.setAttribute('y2', f1(w.y));
  });
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i]; r.t += dt;
    r.el.setAttribute('rx', f1(4 + r.t * 34)); r.el.setAttribute('ry', f1(1 + r.t * 8));
    r.el.setAttribute('opacity', f1(Math.max(0, .8 - r.t * .6)));
    if (r.t > 1.4) { r.el.remove(); ripples.splice(i, 1); }
  }

  // —— 船：前進、上下晃、拖船冒煙 ——
  boats.forEach(b => {
    b.honk = Math.max(0, b.honk - dt); b.wave = Math.max(0, b.wave - dt);
    b.x += b.sp * b.dir * dt * (b.honk > 0 ? 1.4 : 1);
    if (b.dir > 0 && b.x > 1700 + b.len / 2) b.x = -b.len - rand(80, 400);
    if (b.dir < 0 && b.x < -b.len - 40) b.x = 1700 + rand(80, 400);
    const bob = Math.sin(clock * 1.6 + b.bob) * 1.6 * (1 + wx.rain * .6);
    b.el.setAttribute('transform', `translate(${f1(b.x)} ${f1(b.y + bob)})`);
    if (b.kind === 'cruise') b.el.querySelectorAll('.paxp').forEach((p, i) => p.setAttribute('transform', b.wave > 0 && Math.sin(clock * 12 + i) > 0 ? 'translate(0 -3)' : ''));
    if (b.kind === 'tug') { b.smoke -= dt; if (b.smoke < 0) { b.smoke = .5; puff(b.x + 16, b.y - 42, .8); } }
  });
  // 西敏橋上的小車
  bridgeCars.forEach(c => {
    c.x += c.sp * c.dir * dt;
    if (c.dir > 0 && c.x > 1700) c.x = BR0 - 20 - rand(0, 200);
    if (c.dir < 0 && c.x < BR0 - c.len - 20) c.x = 1640 + rand(0, 200);
    c.el.setAttribute('transform', `translate(${f1(c.x)} ${DECK})`);
  });

  // —— 馬路車輛（會跟前車保持距離；巴士可進站） ——
  vehicles.forEach(v => {
    let sp = v.base;
    if (v.stopping) {
      const d = v.x - 300;
      sp = v.base * clamp(d / 160, .12, 1);
      if (d <= 0) { v.stopping = false; v.stopT = 4; busBellAt(v); v.wave = 3; }
    }
    if (v.stopT > 0) { v.stopT -= dt; sp = 0; }
    if (v.hail > 0) { v.hail -= dt; sp = 0; }
    // 跟車距離
    vehicles.forEach(o => {
      if (o === v || o.lane !== v.lane) return;
      const gap = v.lane === 'near' ? v.x - (o.x + o.len) : (o.x - o.len) - v.x;
      if (gap > -20 && gap < 50) sp = Math.min(sp, Math.max(0, o.cur ?? o.base) * clamp((gap - 14) / 36, 0, 1));
    });
    v.cur = sp;
    v.x += (v.lane === 'near' ? -1 : 1) * sp * dt;
    if (v.lane === 'near' && v.x < -v.len - 60) v.x = 1660 + rand(0, 500);
    if (v.lane === 'far' && v.x - v.len > 1660) v.x = -60 - rand(0, 500);
    v.ph += sp * dt * .12;
    const bounce = sp > 0 ? Math.sin(clock * 9 + v.x * .01) * .5 : 0;
    v.el.setAttribute('transform', `translate(${f1(v.x)} ${f1((v.lane === 'near' ? LANE_NEAR : LANE_FAR) + bounce)})`);
    if (v.l1) v.l1.setAttribute('transform', `rotate(${f1(Math.sin(v.ph) * 24)} 0 -28)`);
    if (v.l2) v.l2.setAttribute('transform', `rotate(${f1(-Math.sin(v.ph) * 24)} 0 -28)`);
    v.wave = Math.max(0, v.wave - dt);
    const bw = v.el.querySelector('.busWave'); if (bw) bw.style.display = v.wave > 0 && Math.sin(clock * 10) > -.3 ? '' : 'none';
  });

  // —— 行人：走路、停下來（報時時抬頭拍照） ——
  walkers.forEach(w => {
    const still = w.look || w.stop > 0;
    if (w.stop > 0) w.stop -= dt;
    if (!still) {
      w.x += w.dir * w.sp * dt; w.ph += dt * w.sp * .2;
      if (w.x > 1660) w.x = -60; if (w.x < -60) w.x = 1660;
    }
    const sw = still ? 0 : Math.sin(w.ph) * 22;
    w.l1.setAttribute('transform', `rotate(${f1(sw)} 0 -20)`);
    w.l2.setAttribute('transform', `rotate(${f1(-sw)} 0 -20)`);
    const bob = still ? 0 : Math.abs(Math.sin(w.ph)) * -1.4;
    w.el.setAttribute('transform', `translate(${f1(w.x)} ${f1(w.y + bob)}) scale(${f1(w.dir * w.s)} ${f1(w.s)})`);
    if (w.up) { const up = !!w.look && !umbOpen; w.up.style.display = up ? '' : 'none'; if (w.dn) w.dn.style.display = up ? 'none' : ''; }
    const dog = w.el.querySelector('.dogg'); if (dog) dog.setAttribute('transform', still ? '' : `translate(0 ${f1(Math.abs(Math.sin(w.ph * 1.6)) * -1.5)})`);
  });
  // —— 步道鴿子：啄食、被嚇飛、再飛回來 ——
  pigeons.forEach(p => {
    if (!p.fly) {
      const peck = Math.sin(clock * 3 + p.ph) > .7;
      p.el.querySelector('.bh').setAttribute('transform', peck ? 'translate(2 4)' : '');
      p.x = p.hx + Math.sin(clock * .3 + p.ph) * 6;
      p.el.setAttribute('transform', `translate(${f1(p.x)} ${p.hy}) scale(${p.dir} 1)`);
      return;
    }
    p.fly += dt;
    const wg = p.el.querySelector('.wg');
    if (p.fly < 3) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 20 * dt; wg.setAttribute('d', Math.sin(clock * 30 + p.ph) > 0 ? 'M-3 -6 Q0 -18 5 -16' : 'M-3 -6 Q0 2 5 0'); }
    else if (p.fly < 6) { p.el.style.display = 'none'; }
    else if (p.fly < 8) {
      p.el.style.display = '';
      const k = smooth(6, 8, p.fly);
      p.x = p.hx + p.vx * 1.2 * (1 - k); p.y = p.hy - 160 * (1 - k);
      wg.setAttribute('d', Math.sin(clock * 22 + p.ph) > 0 ? 'M-3 -6 Q0 -18 5 -16' : 'M-3 -6 Q0 2 5 0');
    } else { p.fly = 0; p.y = p.hy; wg.setAttribute('d', 'M-3 -6 Q1 -8 4 -5'); }
    p.el.setAttribute('transform', `translate(${f1(p.x)} ${f1(p.y)}) scale(${p.vx > 0 ? 1 : -1} 1)`);
  });
  // —— 梧桐樹隨風擺動 ——
  trees.forEach(t => t.crown.setAttribute('transform', `rotate(${f1(Math.sin(clock * .9 + t.ph) * .9 * wind)} ${t.x} ${t.y})`));

  // —— 電話亭、街頭藝人、堅果攤 ——
  if (phoneRingT > 0) {
    phoneRingT -= dt;
    phoneBox.querySelector('.pbBody').setAttribute('transform', `rotate(${f1(Math.sin(clock * 40) * (phoneRingT % 2.4 > 1.4 ? 1.2 : 0))} 0 0)`);
    if (phoneRingT <= 0) { phoneCaller.style.display = ''; callerT = 4.5; say(392, 450, pick(['Hello？喂？', '是我，我在河邊！', '我找福爾摩斯先生…']), 2); }
  }
  if (callerT > 0) { callerT -= dt; if (callerT <= 0) phoneCaller.style.display = 'none'; }
  if (buskT > 0) {
    buskT -= dt;
    busker.querySelector('.strum').setAttribute('transform', `rotate(${f1(Math.sin(clock * 16) * 14)} 4 -38)`);
    if (Math.random() < dt * 2.4) {
      const n = el('text', { x: 560 + rand(-6, 10), y: 490, style: 'font:700 18px serif;fill:var(--ink)' }, $('notes'));
      n.textContent = pick(['♪', '♫', '♩']);
      notes.push({ el: n, t: 0, x: 560 + rand(-6, 10), vx: rand(-14, 14) });
    }
  } else busker.querySelector('.strum').removeAttribute('transform');
  for (let i = notes.length - 1; i >= 0; i--) {
    const n = notes[i]; n.t += dt; n.x += n.vx * dt;
    n.el.setAttribute('x', f1(n.x)); n.el.setAttribute('y', f1(490 - n.t * 34)); n.el.setAttribute('opacity', f1(Math.max(0, 1 - n.t / 2)));
    if (n.t > 2) { n.el.remove(); notes.splice(i, 1); }
  }
  if (nutT > 0) { nutT -= dt; if (Math.random() < dt * 14) puff(834 + rand(-8, 8), 486, 1.3); }
  else if (Math.random() < dt * 1.5) puff(834 + rand(-6, 6), 486, .8);
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i]; p.t += dt; p.x += (p.vx + wind * 6) * dt; p.y -= 22 * dt;
    p.el.setAttribute('cx', f1(p.x)); p.el.setAttribute('cy', f1(p.y)); p.el.setAttribute('r', f1(p.s * (4 + p.t * 7)));
    p.el.setAttribute('opacity', f1(Math.max(0, .7 - p.t * .35)));
    if (p.t > 2) { p.el.remove(); puffs.splice(i, 1); }
  }

  // —— 雨、雪、水花 ——
  if (wx.rain > .01) {
    rainDrops.forEach(r => {
      r.y += r.sp * dt; r.x -= r.sp * .25 * dt;
      if (r.y > 610) { r.y = rand(-60, -10); r.x = rand(-50, 1750); }
      r.el.setAttribute('x1', f1(r.x)); r.el.setAttribute('y1', f1(r.y));
      r.el.setAttribute('x2', f1(r.x - 5)); r.el.setAttribute('y2', f1(r.y + 20));
    });
    if (Math.random() < dt * 30 * wx.rain) {
      const y = Math.random() < .5 ? rand(402, 476) : rand(514, 600);
      const s = el('ellipse', { cx: f1(rand(20, 1580)), cy: f1(y), rx: 1, ry: .5, class: 's-rainc', 'stroke-width': 1.2 }, $('splashes'));
      splashes.push({ el: s, t: 0 });
    }
  }
  for (let i = splashes.length - 1; i >= 0; i--) {
    const s = splashes[i]; s.t += dt;
    s.el.setAttribute('rx', f1(1 + s.t * 22)); s.el.setAttribute('ry', f1(.5 + s.t * 5)); s.el.setAttribute('opacity', f1(Math.max(0, 1 - s.t * 2.5)));
    if (s.t > .4) { s.el.remove(); splashes.splice(i, 1); }
  }
  if (wx.snow > .01) flakes.forEach(f => {
    f.y += f.sp * dt; if (f.y > 606) { f.y = -8; f.x = rand(0, 1600); }
    f.el.setAttribute('cx', f1(f.x + Math.sin(clock * .8 + f.ph) * f.sw)); f.el.setAttribute('cy', f1(f.y));
  });

  // —— 煙火 ——
  if (fwPending && night > .75) { fwPending = false; fireShow(10); }
  if (clock < fwUntil && clock > fwNext) { fwNext = clock + rand(.35, .8); launch(rand(1120, 1580), rand(50, 200)); if (Math.random() < .4) launch(rand(700, 960), rand(90, 210)); }
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i]; r.y += r.vy * dt;
    r.line.setAttribute('x1', f1(r.x)); r.line.setAttribute('y1', f1(r.y)); r.line.setAttribute('x2', f1(r.x)); r.line.setAttribute('y2', f1(r.y + 26));
    if (r.y <= r.top) { burst(r.x, r.y); r.el.remove(); rockets.splice(i, 1); }
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]; s.life -= dt * s.dec;
    if (s.ray) { s.el.setAttribute('opacity', f1(Math.max(0, s.life))); s.el.setAttribute('transform', `translate(${f1(s.x)} ${f1(s.y)}) scale(${f1(1 + (1 - s.life) * .8)})`); }
    else {
      s.vx *= 1 - dt * 1.2; s.vy = s.vy * (1 - dt * 1.2) + 60 * dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
      s.el.setAttribute('cx', f1(s.x)); s.el.setAttribute('cy', f1(s.y)); s.el.setAttribute('opacity', f1(Math.max(0, s.life)));
    }
    if (s.life <= 0) { s.el.remove(); sparks.splice(i, 1); }
  }

  // —— 滑鼠視差 ——
  pxCur += (px - pxCur) * Math.min(1, dt * 3);
  $('parFar').setAttribute('transform', `translate(${f1(-pxCur * 7)} 0)`);
  $('parMid').setAttribute('transform', `translate(${f1(-pxCur * 3)} 0)`);
  $('parNear').setAttribute('transform', `translate(${f1(pxCur * 5)} 0)`);
}

/* ---------------- ⑤ 互動：對話泡泡 ----------------
   外層 g 用 transform 屬性定位；內層 .pop 只做 opacity 淡入淡出 */
function say(x, y, text, dur = 1.6) {
  const g = el('g', { class: 'bubble' }, $('bubbles'));
  const inner = el('g', { class: 'pop', style: `--dur:${dur}s` }, g);
  const t = el('text', { x: 0, y: 0 }, inner);
  t.textContent = text;
  const w = Math.max(44, (t.getComputedTextLength() || text.length * 15) + 24);
  const r = el('rect', { x: f1(-w / 2), y: -15, width: f1(w), height: 30, rx: 4 });
  inner.insertBefore(r, t);
  x = clamp(x, w / 2 + 24, 1600 - w / 2 - 24); y = clamp(y, 36, 566);
  g.setAttribute('transform', `translate(${f1(x)} ${f1(y)})`);
  setTimeout(() => g.remove(), dur * 1000);
}

/* ---------------- 動畫主迴圈 ---------------- */
let last = 0, rafId = 0;
function loop(now) {
  const dt = clamp((now - last) / 1000, 0, .05); last = now;
  step(dt);
  rafId = requestAnimationFrame(loop);
}
// 減少動態：只畫靜止畫面；互動時快轉一小段再停住
function settle(sec) { for (let s = 0; s < sec; s += .05) step(.05); }
function renderStill() { step(.0001); }
function start() {
  cancelAnimationFrame(rafId);
  if (reduced) { T.auto = false; syncAuto(); applyTime(true); settle(1.5); }
  else { last = performance.now(); rafId = requestAnimationFrame(loop); }
}

/* ---------------- ⑤ 互動：點擊 ---------------- */
function onAct(node, fn) {
  node.addEventListener('click', e => { e.stopPropagation(); userGesture = true; ensureAudio(); fn(e); if (reduced) settle(.6); });
  node.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); userGesture = true; ensureAudio(); fn(e); if (reduced) settle(.6); } });
}
function svgPoint(e) {
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
const at = () => (audioOK() ? actx.currentTime + .02 : null);
// 第一次點畫面就解鎖音訊（瀏覽器規定要有使用者手勢）
svg.addEventListener('pointerdown', () => { userGesture = true; ensureAudio(); document.body.classList.remove('kbd'); });
window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
// 滑鼠：視差＋河面漣漪
svg.addEventListener('pointermove', e => {
  const p = svgPoint(e);
  px = clamp((p.x - 800) / 800, -1, 1);
  if (p.y > HORIZON + 6 && p.y < RIVER_B - 2 && clock - lastRipple > .07 && !reduced) {
    lastRipple = clock;
    ripples.push({ el: el('ellipse', { cx: f1(p.x), cy: f1(p.y), rx: 4, ry: 1, class: 's-river-hi', 'stroke-width': 2 }, $('ripples')), t: 0 });
  }
});
svg.addEventListener('pointerleave', () => { px = 0; });

// 鐘面：整點報時
onAct($('clockHit'), () => { if (show.on) { say(BX, 210, '正在報時中，仔細聽！', 1.4); return; } startShow(); });
// 塔頂的國會開會燈
onAct($('ayrtonHit'), () => {

  if (at()) click(at());
  if (night < .4) say(BX + 60, 40, '這盞燈只在天黑後、國會開會時點亮', 2);
  else say(BX + 60, 40, ayrtonOn ? '國會開會中，塔頂燈亮了' : '散會了，熄燈', 1.8);

});
// 船
function honkBoat(b, quiet) {
  b.honk = 2; b.wave = 2.4;
  const t = at();
  if (t) b.kind === 'cruise' ? boatHorn(t, 88, 1.6, .2) : b.kind === 'riverbus' ? boatHorn(t, 165, .8, .14) : (boatHorn(t, 120, .35, .16), boatHorn(t + .5, 120, .35, .16));
  if (!quiet) say(clamp(b.x, 80, 1520), b.y - 70, b.kind === 'cruise' ? pick(['右手邊是國會大廈！', '嘟——遊船出發', '大家揮揮手～']) : b.kind === 'riverbus' ? pick(['下一站：西敏碼頭', '河上巴士，快速通勤']) : pick(['嘟！嘟！', '拖著駁船慢慢走']), 1.8);
}
boats.forEach(b => onAct(b.el, () => honkBoat(b)));
// 車輛
function busBellAt(v) {
  const t = at(); if (t) busBell(t);
  say(clamp(v.lane === 'near' ? v.x + 125 : v.x - 125, 100, 1500), (v.lane === 'near' ? LANE_NEAR : LANE_FAR) - 124, pick(['叮叮！下一站下車', 'Ding ding！', '請往上層走，還有位子']), 1.8);
}
vehicles.forEach(v => onAct(v.el, () => {
  const t = at();
  const cx = v.lane === 'near' ? v.x + v.len / 2 : v.x - v.len / 2;
  const cy = (v.lane === 'near' ? LANE_NEAR : LANE_FAR) - (v.kind === 'bus' ? 124 : 70);
  if (v.kind === 'bus') { busBellAt(v); v.wave = 2.5; }
  else if (v.kind === 'cab') {
    v.hired = !v.hired; v.hail = 1.6;
    v.el.querySelector('.taxiSign').style.fill = v.hired ? 'var(--ink)' : '';
    if (t) carHorn(t);
    say(clamp(cx, 80, 1520), cy, v.hired ? pick(['Taxi！到國王十字車站！', '師傅，去博物館', '上車囉！']) : '空車，可以招手', 1.8);
    applyTime(true);
  } else { if (t) bell(t, 2400, .06, .5), bell(t + .15, 2400, .06, .6); say(clamp(cx, 80, 1520), cy, v.kind === 'pedicab' ? '要搭三輪車遊河岸嗎？' : '叮鈴——借過！', 1.6); }
}));
// 電話亭
onAct(phoneBox, () => { if (phoneRingT > 0 || callerT > 0) return; phoneRingT = 4.8; const t = at(); if (t) phoneRing(t, 2); });
// 堅果攤
onAct(nutCart, () => { nutT = 2; const t = at(); if (t) sizzle(t); say(850, 420, pick(['糖炒堅果，熱騰騰的！', '一小包，暖暖手', '花生、杏仁、腰果都有']), 1.8); });
// 街頭藝人
onAct(busker, () => { if (buskT > 0) return; buskT = 6.2; const t = at(); if (t) { buskTune(t); duckMusic(7); } say(560, 440, pick(['來一首原創曲！', '謝謝你的銅板！', '這首叫〈河岸的午後〉']), 1.8); });
// 鱘魚燈柱
lamps.forEach(l => onAct(l.g, () => { l.on = !l.on; applyLamps(); const t = at(); if (t) click(t); if (night < .4) say(l.x, 350, '白天燈不亮，晚上再來試試', 1.4); }));
// 鴿子：一隻被點，整群飛起
$('pigeons').addEventListener('click', e => {
  e.stopPropagation(); userGesture = true; ensureAudio();
  pigeons.forEach(p => { if (!p.fly) { p.fly = .001; p.vx = rand(-140, 140); p.vy = rand(-150, -90); p.y = p.hy; } });
  const t = at(); if (t) { flap(t); coo(t + .6); }
  if (reduced) settle(.3);
});
// 行人：停下來打招呼
$('walkers').addEventListener('click', e => {
  const pt = svgPoint(e);
  let best = null, bd = 1e9;
  walkers.forEach(w => { const d = Math.abs(w.x - pt.x) + Math.abs(w.y - 22 - pt.y) * .5; if (d < bd) { bd = d; best = w; } });
  if (!best || bd > 40) return;
  e.stopPropagation(); userGesture = true;
  best.stop = 2.2;
  const lines = wx.rain > .5 ? ['又下雨了，還好有帶傘', '倫敦就是這樣！', '雨一下就停了啦'] : wx.fog > .5 ? ['霧好濃，看不到塔頂！', '小心別走散了'] : wx.snow > .5 ? ['下雪了！好難得', '好冷，來杯熱茶吧'] :
    best.type === 'tourist' ? ['幫我跟大鐘合照！', '好想上摩天輪', '那是大笨鐘耶！'] : best.type === 'jogger' ? ['早安！跑河岸一圈', '呼…呼…'] : best.type === 'kid' ? ['巴士是紅色的！', '我想看鴿子！'] : best.type === 'dog' ? ['汪！', '牠想去追鴿子'] : ['Cheers！', 'Lovely day！', '要趕去上班了'];
  say(best.x, best.y - 68 * best.s, pick(lines), 1.6);
  if (reduced) renderStill();
});

/* ---------------- ⑤ 互動：控制列 ---------------- */
function syncAuto() { $('btnAuto').setAttribute('aria-pressed', String(T.auto)); $('btnAuto').textContent = T.auto ? '自動播放中' : '自動播放'; }
function goTo(t) { if (show.on) return; if (reduced) { T.t = t; applyTime(true); renderStill(); } else T.target = t; }
$('btnShow').addEventListener('click', () => { userGesture = true; ensureAudio(); if (show.on) return; setTimeout(() => { startShow(); if (reduced) { while (show.on) step(.05); } }, actx && actx.state !== 'running' ? 120 : 0); });
$('btnFire').addEventListener('click', () => {
  userGesture = true; ensureAudio();
  if (night < .6) { fwPending = true; goTo(21.5 / 24); say(1300, 120, '等天黑就放煙火！', 1.8); }
  else fireShow(10);
  if (reduced) settle(2);
});
$('btnBus').addEventListener('click', () => {
  userGesture = true; ensureAudio();
  if (mainBus.x < 300 || mainBus.x > 1500) mainBus.x = 1640;
  mainBus.stopping = true; mainBus.stopT = 0;
  if (reduced) settle(4);
});
$('btnBoat').addEventListener('click', () => {
  userGesture = true; ensureAudio();
  const b = boats[0];
  if (b.x < -60 || b.x > 1500) b.x = -40;
  honkBoat(b);
  if (reduced) settle(.5);
});
$('btnWeather').addEventListener('click', () => {
  userGesture = true; ensureAudio();
  wxI = (wxI + 1) % WX_LIST.length;
  $('btnWeather').textContent = '天氣：' + WX_LIST[wxI][1];
  if (reduced) { for (const k in wx) wx[k] = WX_LIST[wxI][0] === k ? 1 : 0; applyWeather(0); renderStill(); }
});
$('btnSound').addEventListener('click', () => {
  soundOn = !soundOn; userGesture = true;
  $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  if (ensureAudio()) master.gain.setTargetAtTime(soundOn ? .5 : 0, actx.currentTime, .05);
});
$('btnDay').addEventListener('click', () => goTo(11.5 / 24));
$('btnNight').addEventListener('click', () => goTo(21 / 24));
$('btnAuto').addEventListener('click', () => { T.auto = !T.auto; T.target = null; syncAuto(); });
$('timeRange').addEventListener('input', e => {
  if (show.on) return;
  T.t = e.target.value / 1000; T.target = null; T.dragging = true; applyTime(true); T.dragging = false;
  if (reduced) renderStill();
});
mq.addEventListener?.('change', e => { reduced = e.matches; if (!reduced) { T.auto = true; syncAuto(); } start(); });

applyTime(true);
applyWeather(0);
syncAuto();
start();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on ? 'show' : (clock < fwUntil ? 'fire' : ''),
  btn: { show: 'btnShow', fire: 'btnFire' },
  save: () => ({ ...T }),
  stop: () => { if (show.on) endShow(); fwUntil = 0; fwPending = false; },   // 散場後的鳴笛、煙火也一起取消
  restore: s => { Object.assign(T, s); syncAuto(); applyTime(true); renderStill(); }
});
/* /ShowStop */
})();
</script>
<script id="scene-bgm">
/* =========================================================
   【互動】背景配樂（Web Audio 即時合成，原創曲，不使用任何音檔）
   - 控制列「♪ 配樂」按鈕開關；網站「作者精選」播放區會呼叫
     window.sceneMusic.start() / stop()
   - 想換曲子：改下面 SCORE 區塊裡的音符陣列即可
     音符寫法："A4"、"C#5"、"Eb4"；"-" 是休止；數字是長度（幾格）
   ========================================================= */
(function () {
  "use strict";
  // __SceneAudioContext：下載時選了「不要點擊音效」會把場景音效靜音，配樂仍用原本的 AudioContext
  const AC = window.__SceneAudioContext || window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  // 音名 → 頻率
  function hz(n) {
    const m = /^([A-G])([#b]?)(-?\d)$/.exec(n);
    const st = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0);
    return 440 * Math.pow(2, (st + (+m[3] + 1) * 12 - 69) / 12);
  }
  // 旋律陣列 → { 格數: [音名, 長度] }
  function seq(list) {
    const map = {}; let s = 0;
    for (const [n, len] of list) { if (n !== "-") map[s] = [n, len]; s += len; }
    return map;
  }

  let ctx = null, out = null, timer = null, playing = false, nextT = 0, step = 0;

  /* ---------- 樂器 ---------- */
  function env(t, a, d, v) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    g.connect(out); return g;
  }
  function osc(type, f, t, dur, dest, detune) {
    const o = ctx.createOscillator(); o.type = type; o.frequency.value = f;
    if (detune) o.detune.value = detune;
    o.connect(dest); o.start(t); o.stop(t + dur + 0.05); return o;
  }
  let noiseBuf = null;
  function noise() {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const x = noiseBuf.getChannelData(0); for (let i = 0; i < x.length; i++) x[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; return s;
  }
  const I = {
    // 撥弦（吉他、烏德琴）：鋸齒波＋快速關閉的低通濾波
    pluck(f, t, d, v, bright) {
      const lp = ctx.createBiquadFilter(); lp.type = "lowpass";
      lp.frequency.setValueAtTime(bright || 2600, t); lp.frequency.exponentialRampToValueAtTime(350, t + d);
      lp.connect(env(t, 0.004, d, v || 0.1));
      osc("sawtooth", f, t, d, lp); osc("triangle", f * 2, t, d * 0.5, lp);
    },
    // 顫音撥弦：同一個音快速連撥（葡萄牙吉他、卡農琴的招牌）
    tremolo(f, t, d, v, gap) {
      gap = gap || 0.085;
      for (let k = 0; k * gap < d - 0.04; k++) I.pluck(f, t + k * gap, 0.16, (v || 0.07) * (k ? 0.8 : 1.1), 3200);
    },
    // 柔和撥弦（豎琴）
    harp(f, t, d, v) { osc("triangle", f, t, d, env(t, 0.006, d, v || 0.05)); osc("sine", f * 2, t, d * 0.4, env(t, 0.004, d * 0.4, (v || 0.05) * 0.25)); },
    // 長笛／錫口哨：正弦波＋輕微抖音、慢起音
    flute(f, t, d, v) {
      v = v || 0.06;
      const g = ctx.createGain(); g.connect(out);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.12);
      g.gain.setValueAtTime(v, t + Math.max(0.13, d - 0.18)); g.gain.linearRampToValueAtTime(0.0001, t + d + 0.12);
      const o = osc("sine", f, t, d + 0.15, g);
      const lfo = ctx.createOscillator(), lg = ctx.createGain();
      lfo.frequency.value = 5.2; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(f * 0.007, t + 0.4);
      lfo.connect(lg); lg.connect(o.frequency); lfo.start(t); lfo.stop(t + d + 0.2);
      const h = ctx.createGain(); h.gain.value = 0.15; h.connect(g); osc("sine", f * 2, t, d + 0.15, h);
      // 氣音
      const n = noise(), bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = f * 2; bp.Q.value = 2;
      n.connect(bp); bp.connect(env(t, 0.05, 0.25, v * 0.25)); n.start(t); n.stop(t + 0.4);
    },
    // 持續低音墊底
    pad(f, t, d, v) {
      v = v || 0.03;
      const g = ctx.createGain(); g.connect(out);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + d * 0.35); g.gain.linearRampToValueAtTime(0.0001, t + d + 0.3);
      const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 800; lp.connect(g);
      osc("sawtooth", f, t, d + 0.3, lp, -7); osc("sawtooth", f, t, d + 0.3, lp, 7);
    },
    // 手鼓低音「咚」
    dum(t, v) {
      const o = osc("sine", 120, t, 0.4, env(t, 0.003, 0.32, v || 0.3));
      o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(58, t + 0.25);
    },
    // 手鼓高音「嗒」
    tek(t, v) {
      const n = noise(), hp = ctx.createBiquadFilter(); hp.type = "bandpass"; hp.frequency.value = 3200; hp.Q.value = 0.9;
      n.connect(hp); hp.connect(env(t, 0.002, 0.07, v || 0.12)); n.start(t); n.stop(t + 0.12);
    },
    // 海浪聲：濾過的白噪音慢慢起落
    wave(t, d, v) {
      const n = noise(), lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 520;
      const g = ctx.createGain(); g.connect(out);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v || 0.04, t + d * 0.45); g.gain.linearRampToValueAtTime(0.0001, t + d);
      n.connect(lp); lp.connect(g); n.start(t); n.stop(t + d + 0.1);
    }
  };

  /* ---------- 曲譜（每組場景不同，見下方 SCORE） ---------- */
  // 倫敦：英式銅管樂隊風的輕快進行曲（G 大調，2/4 拍）。小號旋律＋低音號「嗡—啪」伴奏＋小鼓，原創曲
  const SCORE = (() => {
    // 銅管：鋸齒波＋濾波器快速打開，聽起來像小號／短號
    function brass(f, t, d, v) {
      const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = 2;
      lp.frequency.setValueAtTime(500, t); lp.frequency.linearRampToValueAtTime(2600, t + 0.05); lp.frequency.exponentialRampToValueAtTime(1300, t + d);
      const g = ctx.createGain(); g.connect(out);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.03);
      g.gain.setValueAtTime(v * 0.8, t + Math.max(0.05, d - 0.06)); g.gain.linearRampToValueAtTime(0.0001, t + d + 0.04);
      lp.connect(g); osc("sawtooth", f, t, d + 0.05, lp); osc("sawtooth", f, t, d + 0.05, lp, 6);
    }
    // 低音號：圓潤的三角波＋一點鋸齒
    function tuba(f, t, d, v) {
      const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 700; lp.connect(env(t, 0.02, d, v));
      osc("triangle", f, t, d, lp); osc("sawtooth", f, t, d, lp);
    }
    // 鐘琴點綴
    function glock(f, t, v) { osc("sine", f, t, 0.8, env(t, 0.003, 0.8, v)); osc("sine", f * 2.76, t, 0.25, env(t, 0.002, 0.25, v * 0.3)); }
    const mel = seq([
      ["G4",2],["B4",1],["D5",1], ["G5",3],["F#5",1], ["E5",1],["D5",1],["C5",1],["B4",1], ["A4",4],
      ["A4",2],["C5",1],["E5",1], ["D5",3],["B4",1], ["C5",1],["A4",1],["F#4",1],["A4",1], ["G4",4],
      ["B4",1],["C5",1],["D5",2], ["E5",1],["D5",1],["B4",2], ["C5",1],["B4",1],["A4",1],["G4",1], ["F#4",2],["D4",2],
      ["G4",1],["A4",1],["B4",1],["C5",1], ["D5",2],["G5",2], ["F#5",1],["D5",1],["E5",1],["F#5",1], ["G5",2],["-",2]
    ]);
    // 每小節的和弦：[低音根音, 五度, 和弦三音]
    const CH = { G: ["G2","D3",["G3","B3","D4"]], C: ["C3","G2",["C4","E4","G4"]], D: ["D3","A2",["D4","F#4","A3"]], Am: ["A2","E3",["A3","C4","E4"]], Em: ["E2","B2",["E3","G3","B3"]] };
    const bars = ["G","G","C","D", "Am","G","D","G", "G","Em","C","D", "G","G","D","G"];
    return {
      bpm: 112, stepsPerBeat: 2, steps: 64, volume: 0.45, gain: 12,
      play(s, t, dt) {
        const bar = Math.floor(s / 4), i = s % 4, ch = CH[bars[bar]];
        // 嗡—啪：第 1、3 格低音號，第 2、4 格短和弦
        if (i === 0) tuba(hz(ch[0]), t, dt * 1.6, 0.11);
        if (i === 2) tuba(hz(ch[1]), t, dt * 1.6, 0.09);
        if (i === 1 || i === 3) ch[2].forEach(n => brass(hz(n), t, dt * 0.55, 0.018));
        // 小鼓
        if (i === 1 || i === 3) I.tek(t, 0.07);
        if (i === 0 && bar % 4 === 3) { I.tek(t + dt * 0.5, 0.05); I.tek(t + dt * 0.75, 0.05); }
        if (i === 0 && bar % 2 === 0) I.dum(t, 0.14);
        const m = mel[s];
        if (m) {
          brass(hz(m[0]), t, Math.min(m[1] * dt * 0.92, 1.4), 0.06);
          if (m[1] >= 3) glock(hz(m[0]) * 2, t, 0.03);
        }
      }
    };
  })();

  /* ---------- 播放引擎（一般不需要修改） ---------- */
  function schedule() {
    const dt = 60 / SCORE.bpm / SCORE.stepsPerBeat;
    while (nextT < ctx.currentTime + 0.35) {
      try { SCORE.play(step, nextT, dt); } catch (e) {}
      nextT += dt; step = (step + 1) % SCORE.steps;
    }
  }
  function setBtn() {
    const b = document.getElementById("btnMusic");
    if (b) { b.setAttribute("aria-pressed", String(playing)); b.textContent = "♪ 配樂：" + (playing ? "開" : "關"); }
  }
  function level(v, sec) {
    const t = ctx.currentTime; out.gain.cancelScheduledValues(t);
    out.gain.setValueAtTime(Math.max(0.0001, out.gain.value), t); out.gain.linearRampToValueAtTime(Math.max(0.0001, v), t + sec);
  }
  let duckTimer = null;
  // ext：外層網頁（例如圖鑑網站的精選播放區）在使用者點擊時先建立好的 AudioContext，
  // 這樣瀏覽器不會擋自動播放；單獨打開這個檔案時不用傳
  function start(ext) {
    if (!ctx) {
      ctx = ext || new AC(); out = ctx.createGain(); out.gain.value = 0.0001;
      // 壓縮器讓音量平均，不會忽大忽小
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -20; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = 0.01; comp.release.value = 0.25;
      const master = ctx.createGain(); master.gain.value = (SCORE.gain || 1) * .64; // 配樂音量 ×0.64（2026-11-24 兩次各調降 20%）
      out.connect(comp); comp.connect(master); master.connect(ctx.destination);
    }
    if (ctx.state !== "running") ctx.resume();
    if (playing) return;
    playing = true; step = 0; nextT = ctx.currentTime + 0.1;
    level(SCORE.volume, 1.5); schedule(); timer = setInterval(schedule, 90); setBtn();
  }
  function stop() {
    if (!playing) return;
    playing = false; clearInterval(timer); clearTimeout(duckTimer); level(0.0001, 0.8); setBtn();
  }
  // 場景裡其他音樂（例如水舞、法朵）響起時，配樂先轉小聲
  function duck(sec) {
    if (!playing) return;
    clearTimeout(duckTimer); level(SCORE.volume * 0.12, 0.6);
    duckTimer = setTimeout(() => { if (playing) level(SCORE.volume, 2); }, sec * 1000);
  }
  document.addEventListener("visibilitychange", () => {
    if (!ctx) return;
    if (document.hidden) { if (playing) ctx.suspend(); } else if (playing) ctx.resume();
  });
  window.sceneMusic = {
    start, stop, duck,
    toggle() { playing ? stop() : start(); },
    get playing() { return playing; }
  };
  const btn = document.getElementById("btnMusic");
  if (btn) btn.addEventListener("click", () => window.sceneMusic.toggle());
  setBtn();
  // 純插畫版沒有按鈕：單獨打開時，點一下畫面就開始播（嵌在別的網頁裡時交給外層控制）
  let top = true; try { top = window.top === window; } catch (e) { top = false; }
  if (document.getElementById("pure-art") && top) {
    const go = () => { start(); document.removeEventListener("pointerdown", go); document.removeEventListener("keydown", go); };
    document.addEventListener("pointerdown", go); document.addEventListener("keydown", go);
  }
})();
</script>
