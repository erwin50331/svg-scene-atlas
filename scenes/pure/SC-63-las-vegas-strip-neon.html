<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拉斯維加斯大道的霓虹夜</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-63 拉斯維加斯大道的霓虹夜｜霓虹夜景（美式沙漠賭城霓虹）
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），
   部分另有 --k-名稱（晨昏）。JS 會依時間內插，輸出成 --名稱，
   並自動產生 .f-名稱（填色）、.s-名稱（描邊）兩個 class。
   畫面裡的飯店、招牌名稱都是原創，沒有使用真實賭場的品牌或商標。
   ========================================================= */
:root{
  color-scheme: dark;

  /* —— 天空（莫哈韋沙漠：白天乾淨的藍、晨昏粉橘、夜裡被城市照成紫紅） —— */
  --d-sky-top:#3f97da;  --k-sky-top:#4a3a8e;  --n-sky-top:#0a0624;
  --d-sky-bot:#f6dcae;  --k-sky-bot:#ff8a5c;  --n-sky-bot:#41185a;
  --d-haze:#fff0cf;     --k-haze:#ffb27a;     --n-haze:#a0307a;
  --d-cloud:#ffffff;    --k-cloud:#ffb48c;    --n-cloud:#2c1a46;

  /* —— 春山山脈與紅岩峽谷（城西的沙漠山） —— */
  --d-mtn-far:#c7a991;  --k-mtn-far:#8a5c86;  --n-mtn-far:#1e1234;
  --d-mtn-near:#b97a58; --k-mtn-near:#74405e; --n-mtn-near:#170c28;
  --d-mtn-snow:#fbf7f2; --n-mtn-snow:#3c3254;
  --d-city-far:#b9b2ae; --n-city-far:#1a1230;

  /* —— 原創賭場飯店 —— */
  --d-pyr-1:#4c4c5c;    --n-pyr-1:#14141f;    /* 古埃及主題：黑玻璃金字塔「NILE」 */
  --d-pyr-2:#30303e;    --n-pyr-2:#0b0b14;
  --d-sphinx-1:#dcbc88; --n-sphinx-1:#3a2e2a;   /* 人面獅身像 */
  --d-sphinx-2:#b8945e; --n-sphinx-2:#2a2018;
  --d-ny-1:#e4d8be;     --n-ny-1:#2a2436;       /* 紐約主題「LIBERTY」：階梯尖塔（石灰岩色） */
  --d-ny-2:#cfd6de;     --n-ny-2:#262a3e;       /* 拱形尖頂（不鏽鋼色） */
  --d-ny-3:#b8634a;     --n-ny-3:#2a1620;       /* 紅磚公寓樓 */
  --d-liberty:#7fbfa8;  --n-liberty:#1c3a36;    /* 自由女神像的銅綠 */
  --d-coaster:#e8473a;  --n-coaster:#5a1a26;    /* 雲霄飛車軌道 */
  --d-stella-1:#86b8dd; --n-stella-1:#121a3c; /* 藍玻璃曲面主樓「STELLA」 */
  --d-stella-2:#5287b6; --n-stella-2:#0b1230;
  --d-venice-1:#f2d4c8; --n-venice-1:#2e2034;  /* 威尼斯主題「LAGUNA」：總督宮風格的粉白立面 */
  --d-venice-2:#c48a7a; --n-venice-2:#1a1222;
  --d-campanile:#b65a3e;--n-campanile:#2a1418;  /* 聖馬可鐘樓複製品 */
  --d-spire:#5f9a7e;    --n-spire:#14282a;
  --d-comet-1:#53647c;  --n-comet-1:#10142c;  /* 深色玻璃塔「COMET」 */
  --d-comet-2:#34405a;  --n-comet-2:#0a0c20;
  --d-eiffel:#9a7550;   --n-eiffel:#2c2026;    /* 巴黎主題：半比例艾菲爾鐵塔 */
  --d-eiffel-dk:#6a4e34;--n-eiffel-dk:#160e14;
  --d-podium:#ebdcc4;   --n-podium:#211832;   /* 臨街的賭場裙樓 */
  --d-podium-2:#d1bb9c; --n-podium-2:#170f28;
  --d-canopy:#f6f0e6;   --n-canopy:#2e2440;
  --d-band:#5a4a3a;     --n-band:#05040e;     /* 樓層線 */
  --d-needle:#ece8e0;   --n-needle:#2c2c42;   /* 觀景高塔 */
  --d-needle-dk:#b2ada4;--n-needle-dk:#1a1a2e;
  --d-wheel:#e9eef4;    --n-wheel:#3c3c5e;    /* 觀景摩天輪 */
  --d-cabin:#bfe0f2;    --n-cabin:#2a3460;
  --d-pylon:#e2dccf;    --n-pylon:#231c36;    /* 路邊大型 LED 看板 */
  --d-pylon-2:#a49a8a;  --n-pylon-2:#141024;
  --d-screen:#1a1830;   --n-screen:#08060f;

  /* —— 大道、人行道、廣場 —— */
  --d-road:#5c5b64;     --n-road:#1b1628;
  --d-road-2:#68676f;   --n-road-2:#211a30;
  --d-line:#f2f0e8;     --n-line:#8a8098;
  --d-lane-y:#e8c040;   --n-lane-y:#8a7030;
  --d-median:#c9b89c;   --n-median:#2a2034;
  --d-shrub:#5c8c4c;    --n-shrub:#122a22;
  --d-walk:#dccbb0;     --n-walk:#2a2238;
  --d-curb:#bfb2a0;     --n-curb:#3e3450;
  --d-plaza:#e6d6ba;    --n-plaza:#271e36;
  --d-plaza-2:#d2c0a2;  --n-plaza-2:#1e172c;
  --d-palm-trunk:#9a7048; --n-palm-trunk:#2c1c26;
  --d-palm-leaf:#3f8a4a;  --n-palm-leaf:#0f2a26;
  --d-palm-leaf2:#5fae5c; --n-palm-leaf2:#163c32;
  --d-palm-dead:#b8945a;  --n-palm-dead:#2a1e20;

  /* —— 前景：婚禮小教堂 —— */
  --d-chapel:#fbfaf6;   --n-chapel:#3a3452;
  --d-chapel-2:#dcdad4; --n-chapel-2:#2a2640;
  --d-chapel-roof:#c3c8d2; --n-chapel-roof:#222038;
  --d-door:#8a5a3a;     --n-door:#3a2418;
  --d-rose:#e2507a;     --n-rose:#5a1c34;
  --d-leaf:#4a8a4a;     --n-leaf:#123222;

  /* —— 角色（日夜變化：夜裡變暗、帶一點霓虹紫） —— */
  --d-skin-1:#f4cfa8; --n-skin-1:#8e6a6a;
  --d-skin-2:#d9a37a; --n-skin-2:#7a5254;
  --d-skin-3:#a8724c; --n-skin-3:#583a3e;
  --d-skin-4:#6e4a33; --n-skin-4:#3a2630;
  --d-hair-1:#231a1c; --n-hair-1:#0e0a12;
  --d-hair-2:#6a4426; --n-hair-2:#2a1a1e;
  --d-hair-3:#e0b866; --n-hair-3:#6a5240;
  --d-hair-4:#b8b4ae; --n-hair-4:#56525e;
  --d-cloth-1:#e2574c; --n-cloth-1:#6a2438;
  --d-cloth-2:#2f8fd6; --n-cloth-2:#1c3870;
  --d-cloth-3:#f2c14e; --n-cloth-3:#7a6030;
  --d-cloth-4:#3fae8c; --n-cloth-4:#1c5050;
  --d-cloth-5:#9b6bd6; --n-cloth-5:#4a3080;
  --d-cloth-6:#f08aa8; --n-cloth-6:#7a3a6a;
  --d-cloth-7:#f4f2ec; --n-cloth-7:#7a7894;
  --d-cloth-8:#2a2a34; --n-cloth-8:#0e0e18;
  --d-pants-1:#2c3a5c; --n-pants-1:#121a30;
  --d-pants-2:#d2c2a0; --n-pants-2:#4a4258;
  --d-pants-3:#4a4a52; --n-pants-3:#1a1a26;

  /* —— 交通工具 —— */
  --d-car-1:#d23c3c;  --n-car-1:#4a1626;
  --d-car-2:#f0f0f2;  --n-car-2:#4c4a62;
  --d-car-3:#2a5a9a;  --n-car-3:#141e44;
  --d-car-4:#1c1c22;  --n-car-4:#08080e;
  --d-car-5:#9aa2aa;  --n-car-5:#2e3044;
  --d-taxi:#f2c230;   --n-taxi:#6a5420;
  --d-pink:#f59ac0;   --n-pink:#7a3a62;     /* 婚禮粉紅老式敞篷車 */
  --d-bus:#c8343a;    --n-bus:#4a1222;      /* 雙層觀光巴士 */
  --d-bus-2:#f2c84a;  --n-bus-2:#6a5424;
  --d-limo:#f6f6f4;   --n-limo:#56546c;
  --d-tire:#232328;   --n-tire:#08080c;
  --d-glassc:#9cc8e6; --n-glassc:#1c2448;

  /* —— 不隨日夜變化的顏色：霓虹燈管、燈泡、車燈 —— */
  --neon-pink:#ff3fa4;
  --neon-red:#ff3b30;
  --neon-gold:#ffcc33;
  --neon-blue:#39c6ff;
  --neon-green:#45f5a8;
  --neon-purple:#b66bff;
  --neon-orange:#ff8a2a;
  --bulb:#fff2b8;
  --bulb-off:#d8cfae;
  --win-on:#ffd98a;
  --win-cool:#bfe4ff;
  --headlight:#fff6d0;
  --taillight:#ff3030;
  --sun:#fff2c4;
  --moon:#fff4dc;
  --star:#ffffff;
  --beacon:#ff2f40;
  --rain:#cfd8ee;
  --dust:#d9b88a;
  --sign-face:#fffaf0;     /* 歡迎標誌的米白底 */
  --sign-red:#e0262e;
  --sign-blue:#2a6ad8;
  --sign-gold:#f2b830;
  --coin:#ffd54a;
  --feather:#ffffff;
  --sequin:#f4c2e0;
  --sax:#e8b440;

  /* —— 頁面介面 —— */
  --page-bg:#0b0820; --page-fg:#f2eefc; --page-muted:#a59cc4;
  --ui-surface:#151030; --ui-line:#2e2656; --ui-accent:#ffcc33; --ui-hot:#ff3fa4; --ui-hot2:#39c6ff;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-sign:"Futura","Avenir Next","Century Gothic","Trebuchet MS",sans-serif;
  --font-script:"Brush Script MT","Snell Roundhand","Segoe Script",cursive;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border:1px solid var(--ui-line);border-radius:10px;overflow:hidden;background:#0a0624;line-height:0}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:10px;padding:10px 14px}
.panel button{font:700 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1.5px solid var(--ui-line);
  border-radius:999px;padding:9px 15px;cursor:pointer;letter-spacing:.03em}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--page-bg)}
.panel button.big{border-color:var(--ui-hot);color:#fff;background:var(--ui-hot);box-shadow:0 0 12px #ff3fa488}
.panel button.big2{border-color:var(--ui-hot2);color:#08122a;background:var(--ui-hot2);box-shadow:0 0 12px #39c6ff88}
.panel button.on{background:var(--ui-accent)!important;border-color:var(--ui-accent)!important;color:var(--page-bg)!important}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-hot2);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid var(--ui-hot2);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(220px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding:0;list-style:none;color:var(--page-muted);font-size:14px;line-height:1.8;display:flex;flex-wrap:wrap;gap:4px 22px}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .bubble path{fill:#1a1030;stroke:#ff8fd0;stroke-width:1.6}
#scene .bubble text{fill:#fff4fb;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .sign{font-family:var(--font-sign);font-weight:800;text-anchor:middle;dominant-baseline:central}
#scene .script{font-family:var(--font-script);font-style:italic;font-weight:700;text-anchor:middle;dominant-baseline:central}
@media (prefers-reduced-motion: reduce){ .panel button{transition:none} }
</style>
<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。
   想恢復完整版，刪掉這整段 <style id="pure-art"> 即可。
   ========================================================= */
html,body{height:100%;margin:0!important;overflow:hidden}
body{display:flex!important;align-items:center;justify-content:center;padding:0!important}
body>.wrap{width:100%!important;max-width:min(100vw,calc(100vh * 8 / 3))!important;
  margin:0!important;padding:0!important;gap:0!important;display:block!important}
body>.wrap>:not(.stage){display:none!important}
body>.wrap>.stage{width:100%!important;max-width:100%!important;margin:0!important;
  border:0!important;border-radius:0!important;box-shadow:none!important}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 舞台：由後往前分層
       天空 → 山 → 探照燈 → 煙火 → 摩天輪 → 飯店群 → 觀景高塔 → LED 看板
       → 對街人行道 → 大道車流 → 廣場行人 → 前景（歡迎標誌、小教堂、棕櫚樹）
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" role="img" aria-label="拉斯維加斯大道：歡迎標誌、原創賭場飯店、觀景高塔與摩天輪、車流與行人，可切換日夜與天氣">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-top)"/>
        <stop offset="1" style="stop-color:var(--sky-bot)"/>
      </linearGradient>
      <linearGradient id="hazeGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--haze)" stop-opacity="0"/>
        <stop offset="1" style="stop-color:var(--haze)" stop-opacity=".85"/>
      </linearGradient>
      <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".45"/>
        <stop offset=".45" stop-color="#ffffff" stop-opacity=".06"/>
        <stop offset=".55" stop-color="#ffffff" stop-opacity=".2"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="beamGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="-700">
        <stop offset="0" stop-color="#eaf2ff" stop-opacity=".55"/>
        <stop offset="1" stop-color="#eaf2ff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="roadGlow" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ff4fb0" stop-opacity=".0"/>
        <stop offset=".5" stop-color="#ff7ac8" stop-opacity=".22"/>
        <stop offset="1" stop-color="#7a6bff" stop-opacity=".1"/>
      </linearGradient>
      <radialGradient id="sunHalo">
        <stop offset="0" stop-color="#fff4d0" stop-opacity=".9"/>
        <stop offset="1" stop-color="#fff4d0" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="glowWarm">
        <stop offset="0" stop-color="#fff3c8" stop-opacity=".95"/>
        <stop offset=".35" stop-color="#ffcf7a" stop-opacity=".45"/>
        <stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="glowHead">
        <stop offset="0" stop-color="#fffbe6" stop-opacity=".9"/>
        <stop offset="1" stop-color="#fffbe6" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="glowTail">
        <stop offset="0" stop-color="#ff4040" stop-opacity=".85"/>
        <stop offset="1" stop-color="#ff4040" stop-opacity="0"/>
      </radialGradient>
      <!-- 霓虹燈管的光暈：只套在靜態的小招牌上，避免整層模糊掉幀 -->
      <filter id="neon" x="-40%" y="-60%" width="180%" height="220%">
        <feGaussianBlur stdDeviation="2.4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
      <filter id="blur2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter>
      <pattern id="rainPat" width="60" height="80" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
        <path d="M6 0v14M26 30v16M44 10v12M16 52v14M50 56v12M36 70v10" stroke="var(--rain)" stroke-width="1.3" stroke-linecap="round" opacity=".7"/>
      </pattern>
      <pattern id="dustPat" width="140" height="70" patternUnits="userSpaceOnUse">
        <path d="M0 20q20 -6 40 0t40 0M60 50q18 -5 36 0t36 0M10 62q12 -4 24 0" stroke="var(--dust)" stroke-width="1.4" fill="none" opacity=".55"/>
        <circle cx="30" cy="40" r="1" fill="var(--dust)"/><circle cx="100" cy="14" r="1.2" fill="var(--dust)"/><circle cx="120" cy="40" r=".9" fill="var(--dust)"/>
      </pattern>
    </defs>

    <!-- ② 場景：天空 -->
    <rect x="0" y="0" width="1600" height="600" fill="url(#skyGrad)"/>
    <g id="nightSky" class="noHit"></g>
    <rect id="skyHit" x="0" y="0" width="1600" height="420" fill="transparent"/>
    <g id="sunG"></g>
    <g id="moonG"></g>
    <g id="clouds"></g>
    <g id="mtnG"></g>
    <rect id="hazeR" class="noHit" x="0" y="250" width="1600" height="170" fill="url(#hazeGrad)"/>
    <g id="beams" class="noHit"></g>
    <g id="fwG" class="noHit"></g>
    <!-- ② 場景：摩天輪、飯店群、觀景高塔、LED 看板 -->
    <g id="wheelG"></g>
    <g id="bldg"></g>
    <g id="needleG"></g>
    <g id="pylonG"></g>
    <g id="farWalk"></g>
    <!-- ② 場景：大道（遠側車道往左、近側車道往右） -->
    <g id="roadG"></g>
    <g id="lane0"></g>
    <g id="lane1"></g>
    <g id="medianG"></g>
    <g id="lane2"></g>
    <g id="lane3"></g>
    <g id="plazaG"></g>
    <!-- ③ 角色：廣場行人（後排往左、中間定點、前排往右） -->
    <g id="walkBack"></g>
    <g id="standG"></g>
    <g id="walkFront"></g>
    <!-- ② 場景：前景 -->
    <g id="foreG"></g>
    <g id="air" class="noHit"></g>
    <g id="fx" class="noHit"></g>
    <g id="wxG" class="noHit">
      <rect id="dustR" x="0" y="0" width="1600" height="600" fill="#c9a06a" opacity="0"/>
      <rect id="dustP" x="-300" y="0" width="2200" height="600" fill="url(#dustPat)" opacity="0"/>
      <rect id="rainR" x="-200" y="-240" width="2000" height="960" fill="url(#rainPat)" opacity="0"/>
      <rect id="flash" x="0" y="0" width="1600" height="600" fill="#f2eaff" opacity="0"/>
    </g>
    <g id="say" class="noHit"></g>
  </svg>
  </figure>

  <!-- =====================================================
       【互動】控制列（畫面中物件自己可以點的動作，這裡不再重複做按鈕）
       ===================================================== -->
  <div class="panel">
    <button id="btnShow" class="big" type="button">🎆 霓虹燈光秀</button>
    <button id="btnWed" class="big2" type="button">💒 小教堂婚禮</button>
    <button id="btnWeather" type="button">天氣：晴</button>
    <button id="btnSound" type="button" aria-pressed="true">🔊 聲音：開</button>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);

      return _conn.call(this, dest, ...a);
    };
  }

    let longs = [], ctx = null;
    for (const s of srcs) {
      const c = s.context, now = c.currentTime, m = s.__ss; ctx = c;
      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }

      if (g) {

        g.gain.linearRampToValueAtTime(1, now + 1.9);

    }

  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';

    }

    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);

    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });

  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>
/* =========================================================
   SC-63 拉斯維加斯大道的霓虹夜｜程式區
   區塊：①工具與色票
         ②場景（天空、春山山脈、探照燈、摩天輪、原創賭場飯店、觀景高塔、LED 看板、
               對街人行道、大道、廣場、歡迎標誌、婚禮小教堂、棕櫚樹）
         ③角色（汽車、計程車、加長禮車、雙層巴士、LED 廣告車、行人、歌舞女郎、街頭樂手、新人）
         ④動畫（主迴圈、日夜、天氣、燈泡跑馬燈、煙火、兩場秀）
         ⑤互動（點擊、滑鼠探照燈、聲音、控制列）
   ========================================================= */
(() => {
'use strict';

/* ---------------- ① 工具 ---------------- */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const root = document.documentElement;
const svg = $('scene');
const defs = svg.querySelector('defs');
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
let seed = 20261163;        // 固定亂數：每次開啟構圖都一樣
const srand = (a = 0, b = 1) => { seed = (seed * 16807) % 2147483647; return a + (seed / 2147483647) * (b - a); };
const spick = a => a[Math.floor(srand(0, a.length - .001))];
const f1 = n => (+n).toFixed(1);

  const n = document.createElementNS(NS, tag);

}

}

function clipOf(d) {   // 動態建立 clipPath，回傳 url(#…)

  const p = el('path', { d }, defs);

  for (let s = L * from; s <= L * to + .01; s += step) { const q = p.getPointAtLength(Math.min(s, L)); pts.push([q.x, q.y]); }
  p.remove(); return pts;
}

const dayEls = [], nightEls = [], litEls = [];
const dayOn = (n, k = 1) => { dayEls.push({ n, k }); return n; };
const nightOn = (n, k = 1, b = -1) => { nightEls.push({ n, k, b }); n.setAttribute('opacity', 0); return n; };
const litOn = (n, k = 1, b = -1) => { litEls.push({ n, k, b }); n.setAttribute('opacity', 0); return n; };
// 霓虹字：白天是沒通電的彩色燈管，傍晚通電後發光
function neonText(parent, x, y, txt, color, size, o = {}) {
  const g = el('g', {}, parent);
  const base = { x, y, 'font-size': size, class: o.script ? 'script' : 'sign' };

  dayOn(T_(g, x, y, txt, Object.assign({}, base, { fill: o.day || color, opacity: .9 })), .9);
  litOn(T_(g, x, y, txt, Object.assign({}, base, { fill: color, stroke: color, 'stroke-width': f1(size * .06), filter: 'url(#neon)' })), 1, o.b ?? -1);
  litOn(T_(g, x, y, txt, Object.assign({}, base, { fill: '#fffaf0' })), .45, o.b ?? -1);
  return g;
}
// 霓虹燈管線條
function neonPath(parent, d, color, w, o = {}) {
  const g = el('g', {}, parent);

  litOn(el('path', { d, fill: o.fill ? color : 'none', stroke: color, 'stroke-width': w * 1.2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', filter: 'url(#neon)' }, g), 1, o.b ?? -1);
  litOn(el('path', { d, fill: 'none', stroke: '#fffaf0', 'stroke-width': w * .35, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g), .6, o.b ?? -1);

}
// 燈泡跑馬燈：pts 是一串點；mode：chase（追逐）、blink（全閃）、fill（一顆顆點亮）
const bulbSets = [];
function bulbRow(parent, pts, o = {}) {

// 窗戶圖樣：夜裡亮燈的窗（每一格亂數決定亮不亮、什麼顏色）
function winPat(id, w, h, cols, rows, colors, pOn, ww, wh) {
  const p = el('pattern', { id, width: w, height: h, patternUnits: 'userSpaceOnUse' }, defs);
  const cw = w / cols, ch = h / rows;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    if (srand() > pOn) continue;
    el('rect', { x: f1(c * cw + (cw - ww) / 2), y: f1(r * ch + (ch - wh) / 2), width: ww, height: wh, fill: spick(colors), opacity: f1(srand(.55, 1)) }, p);
  }

}

const palms = [];
function palm(parent, x, base, h, s = 1, o = {}) {
  const g = el('g', {}, parent);
  const lean = o.lean ?? srand(-6, 6);
  const tx = x + lean, ty = base - h;
  P(g, `M${f1(x - 3.4 * s)} ${base}C${f1(x - 3 * s)} ${f1(base - h * .5)} ${f1(tx - 2.2 * s)} ${f1(ty + h * .2)} ${f1(tx - 1.8 * s)} ${f1(ty)}L${f1(tx + 1.8 * s)} ${f1(ty)}C${f1(tx + 2.2 * s)} ${f1(ty + h * .2)} ${f1(x + 3 * s)} ${f1(base - h * .5)} ${f1(x + 3.4 * s)} ${base}Z`, 'f-palm-trunk');
  // 樹幹上的環紋
  for (let y = base - 6; y > ty + 10; y -= 7 * s) P(g, `M${f1(lerp(x, tx, (base - y) / h) - 3 * s)} ${f1(y)}h${f1(6 * s)}`, 's-palm-dead', { 'stroke-width': .8 * s, opacity: .6 });
  // 枯葉裙
  P(g, `M${f1(tx - 6 * s)} ${f1(ty + 2)}Q${f1(tx)} ${f1(ty + 16 * s)} ${f1(tx + 6 * s)} ${f1(ty + 2)}Z`, 'f-palm-dead');
  const crown = el('g', { transform: `translate(${f1(tx)} ${f1(ty)})` }, g);
  const leaves = [];
  for (let i = 0; i < 9; i++) {
    const a = -Math.PI + i / 8 * Math.PI + srand(-.1, .1);
    const L = srand(20, 28) * s;
    const ex = Math.cos(a) * L, ey = Math.sin(a) * L * .55 + 4 * s;
    leaves.push(P(crown, `M0 0Q${f1(ex * .5)} ${f1(ey - 10 * s)} ${f1(ex)} ${f1(ey + 4 * s)}Q${f1(ex * .5)} ${f1(ey - 2 * s)} 0 0Z`, i % 2 ? 'f-palm-leaf' : 'f-palm-leaf2'));
  }
  const pl = { g, crown, tx, ty, ph: srand(0, 6), s, k: o.k ?? 1 };
  palms.push(pl);
  return pl;
}

/* ---------------- ④ 動畫：主迴圈 ---------------- */
let last = performance.now(), colorAcc = 0, bulbAcc = 0, wheelAcc = 0;
function loop(now) { const dt = Math.min(.1, (now - last) / 1000); last = now; step(dt); requestAnimationFrame(loop); }
function step(dt) {
  time += dt;
  const mv = reduced ? 0 : 1;
  if (show.on) stepShow(dt);
  else if (T.auto && !T.dragging && !reduced) T.t = (T.t + dt / DAY_SEC) % 1;

    p.crown.setAttribute('transform', `translate(${f1(p.tx)} ${f1(p.ty)}) rotate(${f1(a)})`);

    if (b.follow && mouse.on && mouse.y < 420 && night > .4) a = clamp(Math.atan2(mouse.x - b.x, b.y - mouse.y), -1.1, 1.1);
    b.a += (a - b.a) * Math.min(1, dt * 4);

/* ---- 車流：同車道依序前進，太近就減速、保持車距；開出畫面後從另一頭接在最後一台車後面 ---- */
function stepTraffic(dt, mv) {
  lanes.forEach(L => {
    const d = L.dir;
    L.list.sort((a, b) => (b.x - a.x) * d);
    for (let i = 0; i < L.list.length; i++) {
      const v = L.list[i], ahead = i > 0 ? L.list[i - 1] : null;
      let target = v.vmax;
      if (v.stop > 0) { v.stop -= dt; target = 0; }
      if (v.stopAt != null) {
        const dist = (v.stopAt - v.x) * d;
        target = Math.min(target, Math.sqrt(Math.max(0, 2 * 160 * dist)));
        if (dist <= .5) { target = 0; v.sp = 0; v.x = v.stopAt; }
      }
      if (ahead) {
        const gap = (ahead.x - v.x) * d - (ahead.len + v.len) / 2 * L.s;
        const safe = 24 * L.s + v.sp * .4;
        if (gap < safe) target = Math.min(target, Math.max(0, ahead.sp * (gap / safe) - 4));
        if (gap < 10 * L.s) target = 0;
      }
      v.sp += clamp(target - v.sp, -300 * dt, 110 * dt);
      v.x += d * v.sp * dt * mv;
      // 開出畫面：接到這一道的車尾後面
      const half = v.len * L.s / 2;
      if ((d > 0 && v.x - half > 1640) || (d < 0 && v.x + half < -40)) {
        if (v.temp) { v.g.remove(); L.list.splice(i, 1); i--; if (wed.car === v) wed.car = null; continue; }
        const others = L.list.filter(o => o !== v);
        if (d > 0) { const mn = Math.min(-40, ...others.map(o => o.x - o.len * L.s / 2)); v.x = mn - rand(60, 220) - half; }
        else { const mx = Math.max(1640, ...others.map(o => o.x + o.len * L.s / 2)); v.x = mx + rand(60, 220) + half; }
        v.sp = v.vmax * .8;
      }
      v.g.setAttribute('transform', `translate(${f1(v.x)} ${L.y})`);
      // 小細節
      if (v.kind === 'taxi' && v.roof) v.roof.setAttribute('fill', Math.floor(time / 2.5 + L.i) % 2 ? '#ff3fa4' : '#39c6ff');
      if (v.kind === 'truck') { const k = Math.floor(time / 3.5 + v.x * .001) % 4; if (v.scrK !== k) { v.scrK = k; v.scrBg.setAttribute('fill', ['#ff3fa4', '#39c6ff', '#ffcc33', '#b66bff'][k]); v.scrTxt.textContent = ['SHOW TONIGHT', '♥ VEGAS ♥', 'MAGIC LIVE', 'POOL PARTY'][k]; } }
      if (v.wave > 0) { v.wave = Math.max(0, v.wave - dt); }
      if (v.kind === 'limo') v.roof.setAttribute('opacity', v.wave > 0 ? 1 : 0);
      if (v.wavers) v.wavers.forEach((w, j) => { w.setAttribute('opacity', v.wave > 0 ? 1 : 0); w.setAttribute('transform', `rotate(${f1(Math.sin(time * 12 + j) * 18)} ${-49 + j * 32} -62)`); });
    }
  });
  // 對街的小行人
  farWalkers.forEach(w => {
    w.x += w.dir * w.sp * dt * mv;
    if (w.x > 1620) w.x = -20; if (w.x < -20) w.x = 1620;
    w.g.setAttribute('transform', `translate(${f1(w.x)} ${f1(w.y + Math.abs(Math.sin(time * 8 + w.ph)) * -.6)}) scale(${w.dir} 1)`);
  });
}

/* ---- 廣場行人 ---- */
function stepWalkers(dt, mv) {
  const wedZone = show.on && show.kind === 'wed';
  WL.forEach(L => {
    const d = L.dir;
    L.list.sort((a, b) => (b.x - a.x) * d);
    L.list.forEach((p, i) => {
      const ahead = i > 0 ? L.list[i - 1] : null;
      let target = p.sp;
      if (p.stop > 0) { p.stop -= dt; target = 0; }
      if (wedZone && p.x > 1110 && p.x < 1560) target = 0;
      if (ahead) { const gap = (ahead.x - p.x) * d; if (gap < 34) target = Math.min(target, Math.max(0, ahead.v * (gap - 22) / 12)); }
      p.v += clamp(target - p.v, -80 * dt, 40 * dt);
      p.x += d * p.v * dt * mv;
      if (d > 0 && p.x > 1640) { p.x = Math.min(-40, ...L.list.map(o => o.x)) - rand(50, 120); }
      if (d < 0 && p.x < -40) { p.x = Math.max(1640, ...L.list.map(o => o.x)) + rand(50, 120); }
      const moving = p.v > 3 && mv;
      if (moving) p.ph += dt * p.v * .2;
      walkPose(p, moving);
      const cheer = (S.cheer && (show.kind === 'neon' || (p.x > 1080 && p.x < 1600))) || p.wave > 0;
      if (p.wave > 0) p.wave -= dt;
      if (cheer) p.arms[1].setAttribute('transform', `rotate(${f1(160 + Math.sin(time * 10 + p.ph) * 20)} 0 -40)`);
      p.umb.setAttribute('opacity', wx.rain > .4 ? 1 : 0);
      const bob = moving ? Math.abs(Math.sin(p.ph)) * -1.2 : 0;
      p.g.setAttribute('transform', `translate(${f1(p.x)} ${f1(L.y + bob)})`);
    });
  });
}

/* ---- 定點人物的小動作 ---- */
function stepStanders(dt, mv) {
  // 歌舞女郎：羽扇輕輕擺；點她會張開雙臂擺姿勢
  showgirl.pose = Math.max(0, showgirl.pose - dt);
  const pz = showgirl.pose > 0 ? 1 : 0;
  showgirl.fan.setAttribute('transform', `translate(0 -40) scale(${f1(1 + pz * .12 + Math.sin(time * 2) * .02 * mv)})`);
  showgirl.arms[0].setAttribute('transform', `rotate(${f1(pz * 110 + Math.sin(time * 1.6) * 6 * mv)} -5 -39)`);
  showgirl.arms[1].setAttribute('transform', `rotate(${f1(-pz * 110 - Math.sin(time * 1.6) * 6 * mv)} 5 -39)`);
  showgirl.hd.setAttribute('transform', `translate(0 -53) rotate(${f1(Math.sin(time * 1.3) * 3 * mv)})`);
  // 街頭樂手：吹奏時身體搖擺
  busker.play = Math.max(0, busker.play - dt);
  const sw = busker.play > 0 ? Math.sin(time * 8) * 6 : Math.sin(time * 1.5) * 1.5 * mv;
  busker.inner.setAttribute('transform', `scale(-1 1) rotate(${f1(sw)} 0 0)`);
  busker.arms[1].setAttribute('transform', 'rotate(-60 0 -40)');
  busker.arms[0].setAttribute('transform', 'rotate(-40 0 -40)');
  // 拍照的遊客
  photoGroup.forEach((p, i) => {
    const up = (p.pose || 0) > 0;
    if (up) p.pose -= dt;
    p.arms[1].setAttribute('transform', `rotate(${up ? 150 + Math.sin(time * 6 + i) * 10 : 10} 0 -40)`);
    p.arms[0].setAttribute('transform', 'rotate(-8 0 -40)');
  });
}

  [B.oro, B.luna, B.stella, B.eiffel, B.mesa, B.comet].forEach(b => {

  lanes.forEach(L => L.list.forEach(v => bindVehicle(v)));
  WL.forEach(L => L.list.forEach(p => {

      else if (k.hat === 'cowboy') { sfx('tap'); say(p.x, L.y - 80, 'Howdy！來自內華達州', 1.8); }
      else if (k.item === 'balloon') { sfx('tap'); say(p.x, L.y - 70, '我想坐摩天輪！', 1.6); }
      else if (k.item === 'bags') { sfx('tap'); say(p.x, L.y - 80, '買了好多紀念品', 1.6); }
      else { sfx('tap'); say(p.x, L.y - 80, pick(['好熱鬧的大道', '晚上去看秀吧', '燈好漂亮！']), 1.6); }

function bindVehicle(v) {
  clickable(v.g, '車子：點一下');
  onAct(v.g, () => {
    const L = v.L, y = L.y - 70 * L.s - 20;

    if (v.kind === 'truck') { v.scrK = -1; sfx('chime'); say(v.x, L.y - 90 * L.s, 'LED 廣告車在大道上繞圈', 2); return; }

    v.stop = 1.6; sfx('beep');
    say(v.x, y, v.kind === 'taxi' ? '計程車：去哪間飯店？' : v.kind === 'moto' ? '機車騎士巡遊大道' : '慢慢開，欣賞霓虹', 1.8);
  });
}
