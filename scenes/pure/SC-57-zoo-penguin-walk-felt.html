<title>動物園的企鵝散步時間</title>

<style>
/* =========================================================
   SC-57 動物園的企鵝散步時間｜羊毛氈風
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   風格重點：所有東西像針氈戳出來的羊毛——邊緣毛茸茸、
            表面有蓬鬆凹凸的光影，全畫面再覆蓋一層細細的羊毛纖維。
   場景（原創動物園，由左到右）：國王企鵝池（前面是看得到水下的玻璃牆）→
            長頸鹿、斑馬、鴕鳥的非洲草原與長頸鹿餵食台 → 大象區與水池 →
            獅子岩與紅鶴池；前景是遊客步道、路燈、花圃與狐獴小窩。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   每個顏色寫成 --d-名稱（白天色）。夜晚色與晨昏色預設由程式自動算
   （白天色 × 夜色濾鏡／晨昏暖色），想自己指定就加上
   --n-名稱（夜晚）或 --k-名稱（晨昏）。
   JS 會依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）與 .s-名稱（描邊）。
   ========================================================= */
:root{
  color-scheme: dark;

  /* —— 天空 —— */
  --d-sky-top:#8cc4e8;  --k-sky-top:#7b78b8;  --n-sky-top:#0b1430;
  --d-sky-mid:#b8dcef;  --k-sky-mid:#e8a7a0;  --n-sky-mid:#16244a;
  --d-sky-low:#e8f3e6;  --k-sky-low:#f8c890;  --n-sky-low:#26375c;
  --d-cloud:#fbf8f1;    --k-cloud:#ffd8c4;    --n-cloud:#4a5578;
  --d-cloud-sh:#d8e2ea; --n-cloud-sh:#2c3552;
  --d-overcast:#b4bcc6; --n-overcast:#20263a;

  /* —— 遠山與樹林 —— */
  --d-hill-far:#b4d0b8; --k-hill-far:#c4a8b4; --n-hill-far:#1c2a40;
  --d-hill:#93b882;     --d-hill-dk:#76a066;
  --d-tree:#5f9a58;     --d-tree-dk:#437a44;  --d-tree-hi:#8cc070;
  --d-trunk:#8a6446;    --d-trunk-dk:#5e4230;

  /* —— 地面：草地、非洲草原、大象沙地、岩石 —— */
  --d-lawn:#9cc46c;     --d-lawn-dk:#7aa652;
  --d-sav:#dcc47c;      --d-sav-dk:#bfa45c;   --d-sav-hi:#eedb9c;
  --d-dirt:#cfa47c;     --d-dirt-dk:#a8805c;  --d-mud:#8a6448;
  --d-rock:#aaa49a;     --d-rock-dk:#868078;  --d-rock-hi:#cec8bc;
  --d-snowc:#f6f8fb;    --n-snowc:#7e8aac;    /* 下雪時地上的積雪 */

  /* —— 水：企鵝池、大象水池、紅鶴池 —— */
  --d-water:#72b8d2;    --d-water-dk:#4c92b2; --d-water-hi:#d0eef6;
  --d-uw-top:#5aaed0;   --d-uw-bot:#2c6c98;   /* 企鵝池玻璃後面的水下 */
  --d-pond:#7cbcc4;
  --d-glass:#e4f6fc;

  /* —— 步道、木頭、建築 —— */
  --d-path:#ebdfc6;     --d-path-dk:#d2c2a2;  --d-path-line:#dccdb0;
  --d-wood:#b07e52;     --d-wood-dk:#845a38;  --d-wood-hi:#d0a06e;
  --d-thatch:#cfa85e;   --d-thatch-dk:#a47e3e;   /* 茅草屋頂 */
  --d-roof:#b44c3c;     --d-roof-dk:#8a3628;
  --d-wall:#f0e4ca;
  --d-hedge:#4f8a4a;    --d-hedge-hi:#70ae5e;
  --d-win:#5a6a7c;      --n-win:#ffd68a;      /* 窗：夜晚亮燈 */
  --d-glow:#ffe0a000;   --n-glow:#ffd27aa0;   /* 燈光暈 */
  --d-lamp-on:#8a8a80;  --n-lamp-on:#fff0b8;  /* 路燈燈泡 */
  --d-shadow:#2a301e2e; --n-shadow:#00000050;

  /* —— 動物 —— */
  --d-gir:#f2dcae;  --d-gir-p:#c8783a;  --d-gir-p2:#a85e2a;  --d-gir-dk:#6a4a30;  --d-tongue:#4a2a52;   /* 網紋長頸鹿：奶油色網線、紅褐色斑塊、深紫色舌頭 */
  --d-zb-w:#f8f5ee; --d-zb-k:#2c2a30; --d-zb-muz:#3e3638;                                   /* 平原斑馬 */
  --d-os-k:#302c2e; --d-os-w:#f4f0e8; --d-os-skin:#d6aaa2;                                  /* 鴕鳥：黑羽、白尾羽、粉灰色脖子和腿 */
  --d-el:#9c9ca2;   --d-el-dk:#7c7c84;  --d-el-hi:#b8b8be;  --d-el-wet:#6e6e78; --d-tusk:#f2ead8;   /* 非洲象 */
  --d-lion:#d8a050; --d-lion-dk:#b98238; --d-lion-hi:#ecc27a; --d-mane:#8a5a2a; --d-mane-dk:#6a4220;
  --d-pg-k:#2a2c36; --d-pg-w:#f8f6f0; --d-pg-or:#f39a26; --d-pg-y:#f8d47c; --d-pg-chick:#8a6a4e; --d-pg-chick-dk:#6a5038;   /* 國王企鵝與棕色毛毛的幼鳥 */
  --d-fl:#f59aa2;   --d-fl-dk:#e46c7c;  --d-fl-leg:#ea8a94; --d-fl-blk:#2a2a30;              /* 紅鶴：翅膀下的黑色飛羽 */
  --d-mk:#caa274;   --d-mk-dk:#8a6a48;  --d-mk-belly:#ead2a8;                                 /* 狐獴 */
  --d-bird:#7a6050; --d-bird-hi:#c8b090;                                                      /* 麻雀 */

  /* —— 食物 —— */
  --d-fish:#b8c6d0; --d-melon:#4a9a4a; --d-melon-r:#ea5a5a; --d-meat:#b8483a; --d-hay:#e2c262; --d-lettuce:#8ccf5a; --d-pellet:#c87a4a;

  /* —— 人物：膚色、髮色、衣服 —— */
  --d-skin-1:#f6d6b8; --d-skin-2:#e4b08a; --d-skin-3:#b47c54; --d-skin-4:#7a5038;
  --d-hair-1:#2a2024; --d-hair-2:#7a4a2a; --d-hair-3:#e8c46a; --d-hair-4:#cfc8c0;
  --d-shirt-1:#e8505a; --d-shirt-2:#3f7fc4; --d-shirt-3:#f2c23a; --d-shirt-4:#4fa874; --d-shirt-5:#9a6ac4;
  --d-shirt-6:#f08aa8; --d-shirt-7:#f4f0e6; --d-shirt-8:#f08a3a;
  --d-pants-1:#34405e; --d-pants-2:#6a5444; --d-pants-3:#7a9ac0; --d-pants-4:#e8dcc0;
  --d-cap-1:#e8505a; --d-cap-2:#3f7fc4; --d-cap-3:#f4f0e6; --d-sunhat:#e8d4a0;
  --d-keeper:#b6a26a; --d-keeper-dk:#4e5c3c; --d-keeper-hat:#6c7a4c;   /* 保育員：卡其色制服 */
  --d-guard:#3a4a6a;
  --d-bal-1:#f25a6a; --d-bal-2:#ffcc3a; --d-bal-3:#5ab0f0; --d-bal-4:#7ad08a;
  --d-umb-1:#3f7fc4; --d-umb-2:#e8505a; --d-umb-3:#f2c23a; --d-umb-4:#4fa874;
  --d-stroller:#3f78b8; --d-cart:#f6f2e8; --d-cart-st:#ea5a7a; --d-cone:#d8a060; --d-scoop-1:#f6a8c0; --d-scoop-2:#a8e8c8;
  --d-flower-1:#f25a6a; --d-flower-2:#ffcc3a; --d-flower-3:#f6f2ff; --d-flower-4:#b08ae0;

  /* —— 不隨日夜變化的顏色 —— */
  --sun:#ffd66a;  --sun-hi:#fff2b8;  --moon:#f4efd8;  --star:#fff6dc;
  --ink:#2a2630;
  --wool:#fbf8f2;            /* 對話泡泡的白羊毛 */
  --rain:#b4d0ea; --snow:#ffffff;
  --beam:#fff2c0;            /* 夜間巡邏的手電筒光 */

  /* —— 頁面介面 —— */
  --page-bg:#18201a; --page-fg:#f4efe4; --page-muted:#b2b8ac;
  --ui-surface:#222c24; --ui-line:#3c4a3e; --ui-accent:#f2a93a; --ui-hot:#3f8a5a;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border:1px solid var(--ui-line);border-radius:14px;overflow:hidden;background:var(--page-bg);line-height:0}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:14px;padding:10px 14px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--page-bg);font-weight:700}
.panel button.big{border-color:var(--ui-hot);color:#fff;background:var(--ui-hot);font-weight:700}
.panel button.big.alt{border-color:#c0602e;background:#c0602e}
.panel button.big.on{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--page-bg)}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
/* 畫面內可點物件：滑鼠點不顯示外框，用鍵盤 Tab 時才顯示 */
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid var(--ui-accent);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .say text{fill:var(--ink);font:400 17px 'IansuiSub',var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .fiber{}
#scene .baked{display:none}
#scene .bakedHit{opacity:0}
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>
<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。
   想恢復完整版，刪掉這整段 <style id="pure-art"> 即可。
   ========================================================= */
html,body{height:100%;margin:0!important;overflow:hidden}
body{display:flex!important;align-items:center;justify-content:center;padding:0!important}
body>.wrap{width:100%!important;max-width:min(100vw,calc(100vh * 8 / 3))!important;
  margin:0!important;padding:0!important;gap:0!important;display:block!important}
body>.wrap>:not(.stage){display:none!important}
body>.wrap>.stage{width:100%!important;max-width:100%!important;margin:0!important;
  border:0!important;border-radius:0!important;box-shadow:none!important}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：天空 → 星星、太陽月亮、雲 → 遠山 → 樹林
       → 各展區地面（企鵝岩岸、非洲草原、大象沙地、獅子岩）
       → 動物（長頸鹿、斑馬、鴕鳥、大象、獅子、紅鶴、企鵝）
       → 企鵝池水下玻璃牆 → 木柵欄 → 步道與遊客 → 路燈、花圃、狐獴
       → 鳥 → 雨雪 → 羊毛纖維紋理 → 對話泡泡
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="羊毛氈風格的動物園：左邊是國王企鵝的岩岸水池，前面的玻璃牆看得到企鵝在水下游泳；中間是非洲草原，長頸鹿在金合歡樹下吃葉子、斑馬和鴕鳥在吃草，旁邊有長頸鹿餵食台；右邊是大象和水池、獅子躺在大岩石上、粉紅色的紅鶴站在池塘裡；前面的步道上有推嬰兒車、拿氣球的遊客和冰淇淋車，左下角有狐獴站崗">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-top)"/>
        <stop offset=".55" style="stop-color:var(--sky-mid)"/>
        <stop offset="1" style="stop-color:var(--sky-low)"/>
      </linearGradient>
      <linearGradient id="uwGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--uw-top)"/>
        <stop offset="1" style="stop-color:var(--uw-bot)"/>
      </linearGradient>
      <radialGradient id="sunGlow"><stop offset="0" style="stop-color:var(--sun-hi)" stop-opacity=".7"/><stop offset="1" style="stop-color:var(--sun)" stop-opacity="0"/></radialGradient>
      <radialGradient id="moonGlow"><stop offset="0" style="stop-color:var(--moon)" stop-opacity=".35"/><stop offset="1" style="stop-color:var(--moon)" stop-opacity="0"/></radialGradient>
      <radialGradient id="lampGlow"><stop offset="0" style="stop-color:var(--glow)"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
      <radialGradient id="flashGlow"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" style="stop-color:var(--beam)" stop-opacity=".55"/><stop offset="1" style="stop-color:var(--beam)" stop-opacity="0"/>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);
      }
      return _conn.call(this, dest, ...a);
    };
  }
  function stopAudio() {
    let longs = [], ctx = null;
    for (const s of srcs) {
      const c = s.context, now = c.currentTime, m = s.__ss; ctx = c;
      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }
    if (longs.length && ctx) {
      const g = outs.get(ctx), now = ctx.currentTime;
      if (g) {
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 1.1); g.gain.setValueAtTime(0, now + 1.2);
        g.gain.linearRampToValueAtTime(1, now + 1.9);
      }
      longs.forEach(s => { try { s.stop(now + 1.15); } catch (e) {} srcs.delete(s); });
    }
    srcs.clear();
  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');
    // 凍結色票：把目前的 CSS 變數抄到殘影上，底下換色不影響殘影
    const cs = getComputedStyle(svg);
    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }
      }
    }
    const par = svg.parentElement;
    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });
    added = [];
  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;

    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}

  }

  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;

    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {

      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }

        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;

            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();

function leg(parent, x, top, len, w, cls, hoof) {
  const g = el('g', {}, parent);
  el('rect', { x: f1(x - w / 2), y: f1(top), width: f1(w), height: f1(len), rx: f1(w / 2), [cls.startsWith('url') ? 'fill' : 'class']: cls }, g);

  return { g, x, top };
}

   分「音樂軌」與「音效軌」：同一軌新的音樂會讓舊的淡出；表演音樂響起時音效轉小聲；
   「聲音：關」會立即全部停止。畫面不會自己發出叫聲，只有點了才會響。
   ========================================================= */
let actx = null, master = null, sfxBus = null, musBus = null, soundOn = true, userGesture = false, noiseBuf = null, rainGain = null;

/* ---------- 音效：動物叫聲與小聲音 ---------- */

function crunch(t) { for (let i = 0; i < 5; i++) noise(t + i * .09 + Math.random() * .03, .05, 2200 + Math.random() * 800, .07, 'bandpass', 2); }
function thud(t) { const o = osc('sine', 120, t, .3, gainEnv(t, .004, .28, .2)); o.frequency.exponentialRampToValueAtTime(48, t + .25); noise(t, .12, 400, .06, 'lowpass', .7); }
// 獅吼：低沉、粗糙、先鼓起再落下
function roar(t) {

// 象鳴：鼻子吹出來的高亢喇叭聲（帶粗糙顫動）
function trumpet(t, calfV) {

  const g = actx.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.12, t + .06); g.gain.setValueAtTime(.1, t + dur * .7); g.gain.exponentialRampToValueAtTime(.0001, t + dur); g.connect(OUT || sfxBus);

// 國王企鵝的叫聲：像小喇叭的高低起伏「嘎——嘎嘎」
function penguinCall(t) {

    const lfo = actx.createOscillator(), lg = actx.createGain(); lfo.frequency.value = 22; lg.gain.value = 50; lfo.connect(lg); lfo.start(t + dt); lfo.stop(t + dt + d + .1);

/* 企鵝散步進行曲：F 大調、每分鐘 120 拍的原創小進行曲（約 20 秒）
   鐵琴旋律＋低音號「蹦—恰」＋小鼓 */
function marchMusic(t) {
  OUT = newTrack('mus');
  const b = .5;
  const CH = { F: [65, [69, 72, 77]], C7: [60, [70, 72, 76]], Bb: [58, [70, 74, 77]] };
  const bars = ['F', 'F', 'C7', 'F', 'Bb', 'F', 'C7', 'F', 'Bb', 'F'];
  bars.forEach((c, m) => {
    const bt = t + m * 4 * b, [root, ch] = CH[c];
    const r = m === 8 ? [58, 58, 60, 60] : [root, root + 7, root, root + 7];
    const chs = m === 8 ? [ch, ch, CH.C7[1], CH.C7[1]] : [ch, ch, ch, ch];
    for (let k = 0; k < 4; k++) {
      if (m === 9 && k > 0) break;
      tuba(bt + k * b, hz(r[k] - 24 + (k % 2 ? 0 : 0)), b * .7, k % 2 ? .07 : .1);
      if (k % 2) stab(bt + k * b, chs[k].map(n => hz(n - 12)));
      snare(bt + k * b + b * .5, .025);
      if (k % 2 === 0) kick(bt + k * b, .1); else snare(bt + k * b, .05);
    }
  });
  const mel = [
    [72, 1], [69, .5], [72, .5], [77, 1], [72, 1],
    [74, .5], [72, .5], [70, .5], [69, .5], [67, 1], [72, 1],
    [70, .5], [72, .5], [74, .5], [76, .5], [79, 1], [76, 1],
    [77, 1], [72, .5], [69, .5], [65, 2],
    [74, 1], [77, .5], [74, .5], [70, 1], [74, 1],
    [72, 1], [69, .5], [72, .5], [77, 1], [81, 1],
    [79, .5], [77, .5], [76, .5], [74, .5], [72, 1], [76, 1],
    [77, 1], [81, .5], [79, .5], [77, 2],
    [74, .5], [77, .5], [82, 1], [76, .5], [79, .5], [84, 1],
    [77, .5], [72, .5], [69, .5], [72, .5], [77, 2]
  ];
  let s = 0;
  mel.forEach(([n, d]) => { glock(t + s * b, hz(n), .055); s += d; });
  cymbal(t + 36 * b); kick(t + 36 * b, .16);
  OUT = null;

/* 餵食時間：C 大調、每分鐘 112 拍的原創搖擺小曲（約 20 秒）

function feedMusic(t) {
  OUT = newTrack('mus');
  const b = 60 / 112;
  const bass = [[48, 52, 55, 57], [45, 48, 52, 55], [41, 45, 48, 50], [43, 47, 50, 53], [48, 52, 55, 57], [45, 48, 52, 55], [50, 53, 55, 59], [43, 47, 50, 53], [48, 48, 48, 48]];

    const bt = t + (m * 4 + k) * b;
    pizz(bt, hz(n), .11);
    brush(bt + b * .66); if (k % 2) { brush(bt, .04); block(bt, .03); }
  }));

    [72, 1], [76, .5], [79, .5], [81, 1], [79, 1],
    [76, .5], [74, .5], [72, .5], [69, .5], [72, 2],
    [77, 1], [81, .5], [77, .5], [72, 1], [77, 1],
    [79, .5], [77, .5], [76, .5], [74, .5], [71, 1], [74, 1],
    [72, .5], [76, .5], [79, .5], [84, .5], [83, 1], [79, 1],
    [81, 1], [79, .5], [76, .5], [72, 1], [69, 1],
    [74, .5], [77, .5], [81, 1], [79, .5], [77, .5], [76, 1],
    [74, .5], [71, .5], [67, .5], [71, .5], [74, 1], [79, 1],
    [84, 1], [79, .5], [76, .5], [72, 2]

}

    if (!A.lock && A.mode !== 'feed') { A.goal = 'feed'; A.tx = FEED_X(A.s); A.mode = 'walk'; A.lock = false; }
    d.reach = 5; say(d.x, 240, pick(['長頸鹿～來吃葉子！', '牠的舌頭好長！']), 1.6); sfx(t => pop(t));
  }));
  viewers.forEach(v => onAct(v.g, () => { v.wave = 2; say(v.x, 400, pick(['企鵝在游泳！', '牠在看我耶！', '好快喔！']), 1.5); sfx(t => pop(t)); }));
  onAct($('iceCart'), () => {
    sfx(t => cartBellSnd(t));
    let k = 0; const iv = setInterval(() => { cartBell.setAttribute('transform', `translate(-26 -46) rotate(${k % 2 ? 18 : -18})`); if (++k > 6) { clearInterval(iv); cartBell.setAttribute('transform', 'translate(-26 -46)'); } }, 90);
    say(780, 360, pick(['冰淇淋～有草莓和薄荷喔！', '一球還是兩球？']), 1.6);
  });
  cabins.forEach(c => onAct(c.g, () => { c.wave = 2; sfx(t => pop(t)); say(c.x, cableY(c.C, c.x) + 70, pick(['從空中看長頸鹿！', '看得到整個動物園！', '哈囉～']), 1.6); }));
  onAct($('sun'), () => goTo(21 / 24));
  onAct($('moon'), () => goTo(11 / 24));
  onAct($('skyHit'), e => { if (isNight()) { const p = svgPoint(e); shootingStar(p.x, p.y); } else flock(); });
  // 水面：企鵝池、大象水池、紅鶴池
  const poolHit = el('rect', { x: 0, y: 414, width: 318, height: 56, fill: 'transparent', class: 'clickable' }, $('pgPool'));
  $('pgPool').insertBefore(poolHit, $('pgPool').firstChild.nextSibling);
  onAct(poolHit, e => { const p = svgPoint(e); ripple(p.x, Math.min(p.y, 420), true); sfx(t => plop(t, .6)); const pg = penguins.find(q => q.layer === 'pgLand' && q.mode === 'stand' && Math.abs(q.x - p.x) < 80); if (pg) dive(pg); });
  onAct($('elePool'), e => { const p = svgPoint(e); ripple(p.x, p.y, true); sfx(t => plop(t, .6)); });
  onAct($('flPond'), e => { const p = svgPoint(e); ripple(p.x, p.y, true); sfx(t => plop(t, .5)); });
  // 滑鼠：記住位置（企鵝、狐獴轉頭），劃過水面起漣漪
  let lastRip = 0;
  svg.addEventListener('pointermove', e => {
    const p = svgPoint(e); mouse = { x: p.x, y: p.y };
    if (clock - lastRip > .12) {
      const inPg = p.x < 318 && p.y > 414 && p.y < 470, inEle = p.x > 1066 && p.x < 1300 && p.y > 432 && p.y < 464, inFl = p.x > 1340 && p.y > 424 && p.y < 468;
      if (inPg || inEle || inFl) { ripple(p.x, inPg ? 419 : p.y, false); lastRip = clock; }
    }
    if (reduced) renderStill();
  });
  svg.addEventListener('pointerleave', () => { mouse = null; });
  svg.addEventListener('pointerdown', () => { userGesture = true; ensureAudio(); document.body.classList.remove('kbd'); });
  window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
}

/* =========================================================
   ⑤ 互動：控制列
   ========================================================= */
function syncAuto() { $('btnAuto').setAttribute('aria-pressed', String(T.auto)); $('btnAuto').textContent = T.auto ? '自動播放中' : '自動播放'; }
function goTo(t) { if (reduced) { T.t = t; applyTime(true); renderStill(); } else T.target = t; }
const tap = fn => () => { userGesture = true; ensureAudio(); setTimeout(() => { fn(); if (reduced) settle(2); }, actx && actx.state !== 'running' ? 120 : 0); };
$('btnWalk').addEventListener('click', tap(() => startWalk(false)));
$('btnFeed').addEventListener('click', tap(() => startFeed(false)));
$('btnWeather').addEventListener('click', () => {
  userGesture = true; ensureAudio();
  if (show.on === 'walk') { say(800, 150, '企鵝正在雪地散步，等牠們回家喔！', 1.6); return; }
  wxI = (wxI + 1) % WX_LIST.length;
  $('btnWeather').textContent = '天氣：' + WX_LIST[wxI][1];
  if (reduced) { for (const k in wx) wx[k] = WX_LIST[wxI][0] === k ? 1 : 0; applyWeather(0); renderStill(); }
});
$('btnSound').addEventListener('click', () => {
  soundOn = !soundOn; userGesture = true;
  $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  if (ensureAudio()) {
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.setValueAtTime(soundOn ? .5 : 0, actx.currentTime);
    if (!soundOn && musNode) { try { musNode.disconnect(); } catch (e) {} musNode = null; }
  }
  if (!soundOn) { try { window.sceneMusic && window.sceneMusic.stop(); } catch (e) {} }
});
$('btnDay').addEventListener('click', () => goTo(11 / 24));
$('btnNight').addEventListener('click', () => goTo(21 / 24));
$('btnAuto').addEventListener('click', () => { T.auto = !T.auto; T.target = null; syncAuto(); });
$('timeRange').addEventListener('input', e => {
  T.t = e.target.value / 1000; T.target = null; T.dragging = true; applyTime(true); T.dragging = false;
  if (reduced) renderStill();
});


/* =========================================================
   效能：把不會動的羊毛氈圖層「烘焙」成圖片
   羊毛氈濾鏡（凹凸打光）很耗效能，畫面上一有東西在動就得重算。
   所以把地面、步道、柵欄、花圃等靜態圖層，連同目前的色票，
   另外產生一張 SVG 圖片疊在原位，原本的圖層藏起來；
   日夜或晨昏顏色改變時再重新烘焙（約每 0.5 秒最多一次）。
   想直接編輯原始圖層時，把 BAKE_ON 改成 false 就好。
   ========================================================= */
const BAKE_ON = true;
const BAKE_CONST = ['sun', 'sun-hi', 'moon', 'star', 'ink', 'wool', 'rain', 'snow', 'beam'];
const bakes = [];
let bakeKey = '', lastBake = -9, bakeBusy = 0;
function setupBake(ids, o = {}) {
  const els = ids.map(i => $(i));
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  els.forEach(e => { const b = e.getBBox(); if (b.width || b.height) { x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.width); y1 = Math.max(y1, b.y + b.height); } });
  const m = 14, w = x1 - x0, h = y1 - y0;
  const box = [Math.floor(x0 - m - w * .05), Math.floor(y0 - m - h * .07), Math.ceil(w + 2 * m + w * .1), Math.ceil(h + 2 * m + h * .14)];
  const img = el('image', { x: box[0], y: box[1], width: box[2], height: box[3], preserveAspectRatio: 'none', class: 'noHit' });
  els[0].parentNode.insertBefore(img, els[0]);
  bakes.push({ els, img, box, hit: !!o.hit, sync: o.sync, filters: els.map(e => e.getAttribute('filter')), url: null, ready: false });
}
function bakeAll() {
  if (!BAKE_ON) return;
  lastBake = clock;
  let vars = ':root{';
  for (const k in PAIRS) vars += `--${k}:${root.style.getPropertyValue('--' + k)};`;
  BAKE_CONST.forEach(k => { vars += `--${k}:${css('--' + k)};`; });
  vars += '}';
  const defs = svg.querySelector('defs').outerHTML;
  bakes.forEach(B => {
    const content = B.els.map((e, i) => {
      let h = e.outerHTML.replace(/ class="(baked|bakedHit)"/, '').replace(/(baked|bakedHit)/, '');
      // 同步透明度的圖層（積雪）：烘焙內容本身要完全不透明，透明度交給外層 image
      if (B.sync) h = h.replace(/^(<g\b[^>]*?) opacity="[^"]*"/, '$1');
      if (B.hit && B.filters[i] && !e.hasAttribute('filter')) h = h.replace(/^<g /, `<g filter="${B.filters[i]}" `);
      return h;
    }).join('');
    const [x, y, w, h] = B.box;
    const src = `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${w}" height="${h}" viewBox="${x} ${y} ${w} ${h}"><style>${vars}${BAKE_CLS}</style>${defs}${content}</svg>`;
    const url = URL.createObjectURL(new Blob([src], { type: 'image/svg+xml' }));
    const nimg = B.img.cloneNode(false);
    nimg.setAttribute('opacity', 0);
    B.img.parentNode.insertBefore(nimg, B.img.nextSibling);
    bakeBusy++;
    nimg.addEventListener('load', () => {
      bakeBusy--;
      nimg.setAttribute('opacity', B.sync ? (B.els[0].getAttribute('opacity') ?? 1) : 1);
      const old = B.img, oldUrl = B.url;
      B.img = nimg; B.url = url;
      setTimeout(() => { old.remove(); if (oldUrl) URL.revokeObjectURL(oldUrl); }, 60);
      if (!B.ready) {
        B.ready = true;
        B.els.forEach(e => { if (B.hit) { e.removeAttribute('filter'); e.classList.add('bakedHit'); } else e.classList.add('baked'); });
      }
    }, { once: true });
    nimg.addEventListener('error', () => { bakeBusy--; nimg.remove(); URL.revokeObjectURL(url); }, { once: true });
    nimg.setAttribute('href', url);
  });
}
function bakeTick() {
  if (!BAKE_ON || !bakes.length) return;
  bakes.forEach(B => { if (B.sync && B.ready) B.img.setAttribute('opacity', B.els[0].getAttribute('opacity') ?? 1); });
  const key = Math.round(night * 40) + '_' + Math.round(dusk * 40) + '_' + Math.round(nOn * 10);
  if (key !== bakeKey && clock - lastBake > .5 && bakeBusy === 0) { bakeKey = key; bakeAll(); }
}

/* ---------------- 動畫主迴圈 ---------------- */
let last = 0, rafId = 0;
function loop(now) {
  const dt = clamp((now - last) / 1000, 0, .05); last = now;
  step(dt);
  rafId = requestAnimationFrame(loop);
}
function settle(sec) { for (let s = 0; s < sec; s += .05) step(.05); }
function renderStill() { step(.0001); }
function start() {
  cancelAnimationFrame(rafId);
  if (reduced) { T.auto = false; syncAuto(); applyTime(true); settle(1.5); }
  else { last = performance.now(); rafId = requestAnimationFrame(loop); }
}
mq.addEventListener?.('change', e => { reduced = e.matches; if (!reduced) { T.auto = true; syncAuto(); } start(); });

/* ---------------- 開始：依序畫出場景、角色 ---------------- */
makeFiber();
drawSky();
drawGondola();
drawHills();
drawGround();
drawProps();
drawAcaciaTop();
drawElePool();
drawFlPond();
drawPenguinPool();
drawPath();
drawFence();
drawPathProps();
drawFront();
drawFrontTop();
drawWeather();
bindAll();
// 靜態圖層烘焙成圖片（見上方說明）
[['hills', 'treesBack', 'ground'], ['groundSnow'], ['pathSnow'], ['props'], ['acaciaTop'], ['elePool'], ['flPond'], ['pgPoolSt'], ['pgGlassFr'], ['path', 'fence'], ['front'], ['frontTop']].forEach(ids => setupBake(ids, { hit: ids[0] === 'elePool' || ids[0] === 'flPond', sync: ids[0] === 'groundSnow' || ids[0] === 'pathSnow' }));
// 一開場步道上就有遊客
[[0, 1500, 'stroller'], [0, 1080, 'adult'], [0, 600, 'kid'], [0, 230, 'photo'], [1, 140, 'kid'], [1, 520, 'adult'], [1, 980, 'elder'], [1, 1360, 'keeper']].forEach(([li, x, k]) => addWalker(li, x, k));
applyTime(true);
applyWeather(0);
syncAuto();
settle(.2);
start();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on,
  btn: { walk: 'btnWalk', feed: 'btnFeed' },
  ff: () => { show.t = show.dur - .02; },   // 跳到結尾：企鵝回家、飼育員收工
  save: () => ({ T: { ...T }, w: wxI }),
  stop: () => { if (show.on === 'walk') endWalk(); else endFeed(); show.on = ''; },
  restore: s => {
    Object.assign(T, s.T); syncAuto();
    if (wxI !== s.w) { wxI = s.w; $('btnWeather').textContent = '天氣：' + WX_LIST[wxI][1]; }
    applyTime(true); renderStill();
  }
});
/* /ShowStop */
})();
