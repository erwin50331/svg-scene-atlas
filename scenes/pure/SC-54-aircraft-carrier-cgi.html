<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>太平洋航空母艦的彈射起飛</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-54 太平洋航空母艦的彈射起飛｜CGI 電影質感
   主題：在大洋上航行的核動力航空母艦（原創艦艇：不用真實艦名、舷號、國徽或部隊標誌）。
   視角：從艦艏右前方的護衛直升機高度往左看——
         整艘航艦斜斜躺在畫面中間：左邊是艦艉與斜角降落甲板，
         中間偏右是右舷的艦島（艦橋、飛行管制室、相位陣列雷達面板、旋轉雷達），
         右邊是艦艏的兩條蒸汽彈射器，戰機從這裡彈射升空、往右上方飛走。
   真實元素：飛行甲板上依顏色分工的甲板人員——
            黃衣（引導員、彈射官）、綠衣（彈射器與攔截索）、紫衣（加油）、紅衣（彈藥、消防）、
            白衣（安全、降落信號官）、藍衣（拖車、輪檔）、棕衣（機務長）；
            彈射前升起的噴流偏導板（JBD）、彈射官的手勢（蹲下摸甲板、手往艦艏一指）、
            彈射後從彈射槽冒出的白色蒸汽；
            斜角甲板上的三條攔截索、降落區白色虛線與紅白相間的界線、
            左舷的光學助降鏡（中間的「肉球」與兩排綠色基準燈）、艦艉的降落信號官平台；
            機翼折疊（停放時外翼向上折起）、降落時放下的尾鉤、
            艦舷外側的升降機與機庫開口、艦艉右舷的近迫武器（白色圓頂）；
            艦艉翻白的航跡、艦艏破浪、護衛的驅逐艦與補給艦、擔任救援的直升機、
            在艦艏浪頭上跟著跑的海豚、飛魚、信天翁。
   風格重點：CGI 動畫電影的寬銀幕畫面——戰機與艦島用真正的 3D 透視即時計算，
            每一面依陽光方向打亮或變暗，甲板上有隨太陽移動的影子；
            海面閃光、遠方大氣霧化、青橙調色、暗角、底片顆粒；
            滑鼠移動帶動多層視差；表演時上下出現寬銀幕黑邊、鏡頭緩緩推近。
   效能：不對大圖層做模糊；發光一律用放射漸層；靜止的戰機不會每格重算。
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），部分另有 --k-名稱（晨昏）。
   JS 會依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）。
   ========================================================= */
:root{
  color-scheme: dark;

  /* —— 天空、雲 —— */
  --d-sky-top:#2f6fc0;  --k-sky-top:#2c3a78;  --n-sky-top:#03050d;
  --d-sky-mid:#7fb2e6;  --k-sky-mid:#c47a8a;  --n-sky-mid:#0a1226;
  --d-sky-low:#d8e8f4;  --k-sky-low:#ffb070;  --n-sky-low:#1a2236;
  --d-haze:#dce8f0;     --k-haze:#f6b488;     --n-haze:#16203a;
  --d-cloud:#ffffff;    --k-cloud:#ffd2a8;    --n-cloud:#283048;
  --d-cloud-dk:#a4b6cc; --k-cloud-dk:#8a5a78; --n-cloud-dk:#0e1424;
  --d-overcast:#8e9aa8; --k-overcast:#6e5a6a; --n-overcast:#0c1018;

  /* —— 海 —— */
  --d-sea-far:#7fa6c6;  --k-sea-far:#c88a86;  --n-sea-far:#0e1830;
  --d-sea:#2c6a9a;      --k-sea:#3c4a74;      --n-sea:#06101e;
  --d-sea-deep:#0f3a62; --k-sea-deep:#1c2448; --n-sea-deep:#02060e;
  --d-sea-hi:#cfe6f6;   --k-sea-hi:#ffcf9a;   --n-sea-hi:#3a4c6e;
  --d-foam:#f4f8fa;     --k-foam:#ffe2c8;     --n-foam:#5a6c86;

  /* —— 航艦：艦體、飛行甲板、標線 —— */
  --d-hull:#7c8690;     --k-hull:#7a6c74;     --n-hull:#161c26;
  --d-hull-dk:#4c545e;  --k-hull-dk:#463e4a;  --n-hull-dk:#080b11;
  --d-hull-hi:#a6b0b8;  --k-hull-hi:#c09080;  --n-hull-hi:#262e3c;
  --d-boot:#22262c;     --n-boot:#05070a;
  --d-deck:#4a4f55;     --k-deck:#5a4e52;     --n-deck:#15181e;
  --d-deck-dk:#3e4246;  --k-deck-dk:#3c3238;  --n-deck-dk:#0b0d11;
  --d-mark-w:#e8ecee;   --k-mark-w:#f0d0b8;   --n-mark-w:#4a5262;
  --d-mark-y:#e8c23a;   --k-mark-y:#f0a840;   --n-mark-y:#4a3e18;
  --d-mark-r:#c8382e;   --k-mark-r:#d84a30;   --n-mark-r:#3a1410;
  --d-island:#8a949e;   --k-island:#8a7a80;   --n-island:#1a202a;
  --d-glass:#2a3e52;    --k-glass:#3a3046;    --n-glass:#0a0e16;

  /* —— 戰機、直升機、甲板車輛 —— */
  --d-jet:#aab6c2;      --k-jet:#a08e8e;      --n-jet:#2c3440;
  --d-jet-dk:#6a7682;   --k-jet-dk:#5e5058;   --n-jet-dk:#161b22;
  --d-canopy:#3c5a74;   --k-canopy:#6a5a7a;   --n-canopy:#101826;
  --d-helo:#8a949c;     --k-helo:#8a7a7e;     --n-helo:#1a1f28;
  --d-tractor:#e4e6e2;  --k-tractor:#e8cfb8;  --n-tractor:#3a3e44;

  /* —— 遠方艦艇 —— */
  --d-escort:#8a96a4;   --k-escort:#8a7488;   --n-escort:#121826;
  --d-far:#a6b4c2;      --k-far:#b48e98;      --n-far:#162034;

  /* —— 甲板人員：依顏色分工的背心與頭盔 —— */
  --d-jy:#f2c418;  --n-jy:#6a5410;   /* 黃：引導員、彈射官 */
  --d-jg:#3a9a46;  --n-jg:#143a1a;   /* 綠：彈射器、攔截索 */
  --d-jp:#8a4ab8;  --n-jp:#2e1a40;   /* 紫：加油 */
  --d-jr:#d83a30;  --n-jr:#4a1410;   /* 紅：彈藥、消防 */
  --d-jw:#f2f2ee;  --n-jw:#5a5e66;   /* 白：安全、降落信號官 */
  --d-jb:#2a6ad0;  --n-jb:#10224a;   /* 藍：拖車、輪檔 */
  --d-jbr:#8a5a2e; --n-jbr:#2e1e10;  /* 棕：機務長 */
  --d-skin:#d8a07a; --k-skin:#e89a72; --n-skin:#3e2a22;
  --d-skin2:#8a5a3e; --n-skin2:#24160e;
  --d-pants:#3a4048; --n-pants:#0c0e12;

  /* —— 動物 —— */
  --d-dolphin:#5a6e80; --k-dolphin:#5e5468; --n-dolphin:#0e141e;
  --d-belly:#c8d2da;   --n-belly:#2a323e;
  --d-bird:#f0f0ec;    --k-bird:#ffd8bc;    --n-bird:#3a4050;

  /* —— 不隨日夜變化的顏色（燈光、火焰、蒸氣） —— */
  --sun:#fff6e0; --moon:#f2efe2; --star:#ffffff;
  --nav-red:#ff3a2a; --nav-green:#3aff7a; --nav-white:#ffffff; --strobe:#ff2a1a;
  --land-light:#fffbe8; --deck-amber:#ffb84a; --deck-blue:#6ab4ff; --drop:#ff6a2a;
  --meatball:#ffb400; --datum:#4aff6a; --flood:#ffe6b0; --red-night:#ff3a3a;
  --flame-core:#fff8e0; --flame:#ff9a3a; --flame-edge:#ff4a1a; --ab-blue:#8ac4ff;
  --steam:#f4f6f8; --spark:#ffd27a; --window-in:#ffcf7a;
  --bolt:#eef0ff; --rain:#c8d4e6;
  --grade-cool:#103a5c; --grade-warm:#ff7a2a; --cine-shade:#000000; --cine-light:#fff1d6;

  /* —— 頁面介面（電影院般的深色） —— */
  --page-bg:#0b0d10; --page-fg:#eef0f2; --page-muted:#9aa2ac;
  --ui-surface:#14181d; --ui-line:#2e353e; --ui-accent:#6ab4ff; --ui-hot:#ffcf6a; --ui-hot2:#e2502a;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:6px;overflow:hidden;background:#000;line-height:0;box-shadow:0 18px 50px rgba(0,0,0,.55)}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:6px;padding:10px 14px}
.panel button{font:700 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:4px;padding:9px 14px;cursor:pointer;letter-spacing:.04em}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:#04121e}
.panel button.big{border-color:var(--ui-hot2);color:#fff;background:var(--ui-hot2)}
.panel button.big2{border-color:var(--ui-hot);color:#1a1206;background:var(--ui-hot)}
.panel button:disabled{opacity:.45;cursor:default}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid #d8ecff;outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(220px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding:0;list-style:none;color:var(--page-muted);font-size:14px;line-height:1.8;display:flex;flex-wrap:wrap;gap:4px 22px}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .bubble path{fill:rgba(8,14,22,.84);stroke:rgba(180,215,255,.55);stroke-width:1}
#scene .bubble text{fill:#f2f8ff;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .soft{mix-blend-mode:soft-light}
#scene .screen{mix-blend-mode:screen}
</style>
<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。
   想恢復完整版，刪掉這整段 <style id="pure-art"> 即可。
   ========================================================= */
html,body{height:100%;margin:0!important;overflow:hidden}
body{display:flex!important;align-items:center;justify-content:center;padding:0!important}
body>.wrap{width:100%!important;max-width:min(100vw,calc(100vh * 8 / 3))!important;
  margin:0!important;padding:0!important;gap:0!important;display:block!important}
body>.wrap>:not(.stage){display:none!important}
body>.wrap>.stage{width:100%!important;max-width:100%!important;margin:0!important;
  border:0!important;border-radius:0!important;box-shadow:none!important}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 舞台。圖層由遠到近：
       天空（星空、月亮、太陽、雲、遠方編隊）→ 海（海面、反光、浪、遠方護衛艦）
       → 航艦（航跡、艦體、飛行甲板與標線、艦島、甲板上的戰機與人員、蒸汽）
       → 近海（海豚、飛魚、浪花）→ 空中（起飛與降落的戰機、救援直升機、信天翁）
       → 天氣（海霧、雨、閃電）→ 鏡頭效果（調色、暗角、顆粒、寬銀幕黑邊）
       幾乎所有物件都由下方 JS 用 3D 透視產生，這裡只放骨架與漸層。
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" role="img" aria-label="大洋上的航空母艦：戰機從艦艏彈射起飛，從艦艉進場鉤住攔截索降落">
    <defs>
      <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky-top)"/><stop offset=".62" style="stop-color:var(--sky-mid)"/><stop offset="1" style="stop-color:var(--sky-low)"/></linearGradient>
      <linearGradient id="hazeG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--haze)" stop-opacity="0"/><stop offset=".7" style="stop-color:var(--haze)" stop-opacity=".85"/><stop offset="1" style="stop-color:var(--haze)" stop-opacity="0"/></linearGradient>
      <linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sea-far)"/><stop offset=".12" style="stop-color:var(--sea)"/><stop offset="1" style="stop-color:var(--sea-deep)"/></linearGradient>
      <linearGradient id="overG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--overcast)"/><stop offset="1" style="stop-color:var(--overcast)" stop-opacity=".2"/></linearGradient>
      <radialGradient id="sunGlowG"><stop offset="0" style="stop-color:var(--sun)" stop-opacity=".95"/><stop offset=".12" style="stop-color:var(--sun)" stop-opacity=".55"/><stop offset=".4" stop-color="#ffd8a0" stop-opacity=".16"/><stop offset="1" stop-color="#ffd8a0" stop-opacity="0"/></radialGradient>
      <radialGradient id="moonGlowG"><stop offset="0" stop-color="#e8eeff" stop-opacity=".45"/><stop offset="1" stop-color="#e8eeff" stop-opacity="0"/></radialGradient>
      <radialGradient id="puffG" cx=".42" cy=".36" r=".62"><stop offset="0" style="stop-color:var(--cloud)"/><stop offset=".7" style="stop-color:var(--cloud)"/><stop offset="1" style="stop-color:var(--cloud-dk)"/></radialGradient>
      <radialGradient id="glitG"><stop offset="0" style="stop-color:var(--sun)" stop-opacity=".9"/><stop offset="1" style="stop-color:var(--sun)" stop-opacity="0"/></radialGradient>
      <linearGradient id="hullG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--hull-hi)"/><stop offset=".35" style="stop-color:var(--hull)"/><stop offset="1" style="stop-color:var(--hull-dk)"/></linearGradient>
      <linearGradient id="deckShadeG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".18"/><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient>
      <linearGradient id="wakeG" x1="1" y1="0" x2="0" y2="0"><stop offset="0" style="stop-color:var(--foam)" stop-opacity=".9"/><stop offset=".35" style="stop-color:var(--foam)" stop-opacity=".45"/><stop offset="1" style="stop-color:var(--foam)" stop-opacity="0"/></linearGradient>
      <linearGradient id="flameG" x1="1" y1="0" x2="0" y2="0"><stop offset="0" style="stop-color:var(--flame-core)"/><stop offset=".3" style="stop-color:var(--flame)" stop-opacity=".95"/><stop offset="1" style="stop-color:var(--flame-edge)" stop-opacity="0"/></linearGradient>
      <radialGradient id="glowWarmG"><stop offset="0" style="stop-color:var(--flame)" stop-opacity=".8"/><stop offset="1" style="stop-color:var(--flame)" stop-opacity="0"/></radialGradient>
      <radialGradient id="glowWhiteG"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset=".25" stop-color="#ffffff" stop-opacity=".35"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
      <radialGradient id="floodG"><stop offset="0" style="stop-color:var(--flood)" stop-opacity=".5"/><stop offset="1" style="stop-color:var(--flood)" stop-opacity="0"/></radialGradient>
      <radialGradient id="steamG"><stop offset="0" style="stop-color:var(--steam)" stop-opacity=".9"/><stop offset=".6" style="stop-color:var(--steam)" stop-opacity=".4"/><stop offset="1" style="stop-color:var(--steam)" stop-opacity="0"/></radialGradient>
      <radialGradient id="fogPuff"><stop offset="0" style="stop-color:var(--haze)" stop-opacity=".85"/><stop offset="1" style="stop-color:var(--haze)" stop-opacity="0"/></radialGradient>
      <linearGradient id="beamG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--land-light)" stop-opacity=".55"/><stop offset="1" style="stop-color:var(--land-light)" stop-opacity="0"/></linearGradient>
      <linearGradient id="rayG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff0d0" stop-opacity=".5"/><stop offset="1" stop-color="#fff0d0" stop-opacity="0"/></linearGradient>
      <linearGradient id="gradeG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--grade-cool)"/><stop offset=".5" stop-color="#808080"/><stop offset="1" style="stop-color:var(--grade-warm)"/></linearGradient>
      <radialGradient id="vignG" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
      <filter id="grainF" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/><feColorMatrix type="saturate" values="0"/></filter>
      <clipPath id="seaClip"><rect x="-200" y="0" width="2000" height="800"/></clipPath>
    </defs>

    <!-- 整個世界放在 world 裡：表演時鏡頭推近就是縮放這一層 -->
    <g id="world">
      <g id="Lsky">
        <rect id="skyBg" x="-200" y="-100" width="2000" height="420" fill="url(#skyG)"/>
        <g id="stars" class="noHit"></g>
        <g id="moonG" class="clickable" tabindex="0" role="button" aria-label="月亮：點一下切換成白天">
          <circle r="60" fill="url(#moonGlowG)"/>
          <circle r="13" style="fill:var(--moon)"/>
          <circle cx="-3" cy="-3" r="3" fill="#000" opacity=".08"/><circle cx="4" cy="4" r="2.2" fill="#000" opacity=".07"/>
        </g>
        <g id="sunG" class="clickable" tabindex="0" role="button" aria-label="太陽：點一下切換成夜晚">
          <circle r="190" fill="url(#sunGlowG)"/>
          <circle r="17" style="fill:var(--sun)"/>
        </g>
        <g id="cloudsG"></g>
        <rect id="overcast" class="noHit" x="-200" y="-100" width="2000" height="330" fill="url(#overG)" opacity="0"/>
        <g id="skyPlanes" class="noHit"></g>
        <rect id="hazeBand" class="noHit" x="-200" y="150" width="2000" height="80" fill="url(#hazeG)"/>
      </g>
      <g id="Lsea">
        <rect id="seaBg" x="-200" y="200" width="2000" height="500" fill="url(#seaG)"/>
        <g id="glitter" class="noHit"></g>
        <g id="waves" class="noHit"></g>
        <g id="farShips"></g>
        <g id="seaHit"></g>
      </g>
      <g id="Lship">
        <g id="wakeG2" class="noHit"></g>
        <g id="hullG2"></g>
        <g id="foamG" class="noHit"></g>
        <g id="deckG"></g>
        <g id="deckLights" class="noHit"></g>
        <g id="objs"></g>
        <g id="steamL" class="noHit"></g>
      </g>
      <g id="Lnear"></g>
      <g id="Lair"></g>
      <g id="Lwx" class="noHit">
        <g id="fogG"></g>
        <g id="rainG"></g>
      </g>
    </g>
    <g id="raysG" class="noHit screen"></g>
    <rect id="grade" class="soft noHit" x="0" y="0" width="1600" height="600" fill="url(#gradeG)" opacity=".34"/>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);
      }
      return _conn.call(this, dest, ...a);
    };
  }
  function stopAudio() {
    let longs = [], ctx = null;
    for (const s of srcs) {
      const c = s.context, now = c.currentTime, m = s.__ss; ctx = c;
      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }

      const g = outs.get(ctx), now = ctx.currentTime;
      if (g) {
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 1.1); g.gain.setValueAtTime(0, now + 1.2);
        g.gain.linearRampToValueAtTime(1, now + 1.9);

    }
    srcs.clear();
  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');
    // 凍結色票：把目前的 CSS 變數抄到殘影上，底下換色不影響殘影
    const cs = getComputedStyle(svg);
    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }

    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });
    added = [];
  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>
/* ---- 表演氛圍（取代寬銀幕黑邊）：k = 0~1，四周輕微暗角＋中央微亮；fx/fy 可讓亮處偏向表演焦點 ---- */
let cineK = 0, cineW = 0;
function setCine(k, fx, fy) {
  cineK = k = Math.max(0, Math.min(1, k));
  if (k === cineW || (Math.abs(k - cineW) < .004 && k > 0 && k < 1)) return;   // 變化太小就先不重畫
  cineW = k;
  const g = document.getElementById('cineFx'); if (!g) return;
  g.setAttribute('opacity', k.toFixed(3));
  if (fx != null) { const G = document.getElementById('cineLightG'); G.setAttribute('cx', (fx / 1600).toFixed(3)); G.setAttribute('cy', (fy / 600).toFixed(3)); }
}

/* =========================================================
   SC-54 太平洋航空母艦的彈射起飛｜程式區
   區塊：①工具、色票、3D 透視
         ②場景（星空、雲、海面與浪、遠方艦艇、航跡、艦體、飛行甲板與標線、艦島、

         ③角色（3D 戰機、甲板人員、救援直升機、海豚、飛魚、信天翁）
         ④動畫（主迴圈、日夜、天氣、甲板作業：滑行→彈射→離艦→進場→攔截→滑回停機位、
               彈射起飛秀、夜間著艦秀）
         ⑤互動（點擊、滑鼠、聲音、控制列）
   座標：艦上座標以公尺計——X 沿著艦身（0 = 艦艉，往右 330 = 艦艏），

(() => {

/* ---------------- ① 工具 ---------------- */

const $ = id => document.getElementById(id);

const svg = $('scene');
const rand = (a, b) => a + Math.random() * (b - a);

const css = n => getComputedStyle(root).getPropertyValue(n).trim();

/* ---------------- ① 3D 透視 ----------------
   鏡頭：在航艦右舷外約 180 公尺、海面上 85 公尺（像從另一架直升機上往下看），稍微往艦艏看。 */
const CAM = { x: 170, y: 85, z: -180, yaw: .03, pitch: .15, f: 840, cx: 815, cy: 240 };
const C_A = Math.cos(CAM.yaw), S_A = Math.sin(CAM.yaw), C_P = Math.cos(CAM.pitch), S_P = Math.sin(CAM.pitch);
const HORIZON = CAM.cy - CAM.f * S_P / C_P;          // 海平線在畫面上的高度（約 y=201）
function proj(X, Y, Z) {
  const dx = X - CAM.x, dy = Y - CAM.y, dz = Z - CAM.z;
  const xr = dx * C_A - dz * S_A, zr = dx * S_A + dz * C_A;
  const yc = dy * C_P + zr * S_P, zc = zr * C_P - dy * S_P;
  const k = CAM.f / Math.max(zc, 1);
  return [CAM.cx + xr * k, CAM.cy - yc * k, zc, k];
}
const dPath = pts => { let d = ''; for (let i = 0; i < pts.length; i++) { const p = proj(pts[i][0], pts[i][1], pts[i][2]); d += (i ? 'L' : 'M') + f1(p[0]) + ' ' + f1(p[1]); } return d + 'Z'; };
const dLine = pts => { let d = ''; for (let i = 0; i < pts.length; i++) { const p = proj(pts[i][0], pts[i][1], pts[i][2]); d += (i ? 'L' : 'M') + f1(p[0]) + ' ' + f1(p[1]); } return d; };
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
/* 光線：L 指向太陽（或月亮）；AMB 環境光、DIF 直射光強度，由日夜計算 */
let L = norm([-.3, .8, .5]), AMB = .6, DIF = .6;
function shade(base, n, extra = 0) {
  const b = clamp(AMB + DIF * Math.max(0, dot(n, L)) + extra, .2, 1.45);
  return `rgb(${Math.min(255, base[0] * b) | 0},${Math.min(255, base[1] * b) | 0},${Math.min(255, base[2] * b) | 0})`;
}
/* 一個面的法向量（朝向鏡頭的那一面）；cull=true 時背對鏡頭就不畫 */
function faceN(pts, cull) {
  let n = norm(cross(sub(pts[1], pts[0]), sub(pts[2], pts[0])));
  const c = pts[0], v = [CAM.x - c[0], CAM.y - c[1], CAM.z - c[2]];
  const facing = dot(n, v) > 0;
  if (!facing) { if (cull) return null; n = [-n[0], -n[1], -n[2]]; }
  return n;
}

function prism(base, y0, y1, col, parent, opt = {}) {

    const pts = [[a[0], y0, a[1]], [b[0], y0, b[1]], [b[0], y1, b[1]], [a[0], y1, a[1]]];
    let nn = norm([b[1] - a[1], 0, -(b[0] - a[0])]);
    const mid = [(a[0] + b[0]) / 2 - cxz[0], (a[1] + b[1]) / 2 - cxz[1]];
    if (nn[0] * mid[0] + nn[2] * mid[1] < 0) nn = [-nn[0], 0, -nn[2]];
    const v = [CAM.x - (a[0] + b[0]) / 2, CAM.y - (y0 + y1) / 2, CAM.z - (a[1] + b[1]) / 2];
    if (dot(nn, v) <= 0) continue;
    faces.push({ pts, n: nn, path: el('path', { d: dPath(pts), 'stroke-linejoin': 'round' }, parent), col, side: i });
  }
  if (CAM.y > y1 || opt.top) { const pts = base.map(p => [p[0], y1, p[1]]); faces.push({ pts, n: [0, 1, 0], path: el('path', { d: dPath(pts) }, parent), col, top: true }); }
  return faces;
}

  // 戰機：兩架在彈射器上待命、三架停在停機位、三架在空中、兩架在機庫
  for (let i = 0; i < 10; i++) makeJet(i);
  placeJet(jets[0], CATS[0].x0, CATS[0].z, 0, 0, 'hold'); CATS[0].who = jets[0]; jets[0].cat = 0; jets[0].t = 5;
  placeJet(jets[1], CATS[1].x0, CATS[1].z, 0, 0, 'hold'); CATS[1].who = jets[1]; jets[1].cat = 1; jets[1].t = 5;
  [[2, 0], [3, 1], [4, 3]].forEach(([ji, si]) => { placeJet(jets[ji], SPOTS[si].x, SPOTS[si].z, 0, 1, 'park'); SPOTS[si].who = jets[ji]; jets[ji].spot = SPOTS[si]; });
  [[5, 4], [6, 30], [9, 17]].forEach(([ji, t]) => { const j = jets[ji]; j.state = 'away'; j.t = t; setParent(j, LY.Lair); hideJet(j); });
  [7, 8].forEach(ji => { const j = jets[ji]; j.state = 'hangar'; setParent(j, $('objs')); hideJet(j); hangar.push(j); });
  // 表演用的四機編隊
  for (let i = 0; i < 4; i++) { const tr = el('path', { fill: 'none', stroke: '#fff', 'stroke-width': .8, opacity: 0, class: 'noHit' }, LY.Lair); const f = makeJet(100 + i); f.trail = tr; f.state = 'off'; setParent(f, LY.Lair); hideJet(f); flyers.push(f); }
  drawHelo(); drawAnimals(); drawSkyJets(); drawWeather();
  bindAll();
  if (reduced) { T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false'); }
  setWeather(0);
  applyColors(true);
  drawElevator();
  step(1 / 60); sortObjs();
  requestAnimationFrame(loop);
  // 網站「作者精選」播放區（純插畫版放在 iframe 裡）：預設輪播彈射起飛秀；不會自己出聲。
  const inPicks = (() => { let top = true; try { top = window.top === window; } catch (e) { top = false; } return !!document.getElementById('pure-art') && !top; })();
  if (inPicks) {
    setTimeout(() => startShow('launch', true), 800);
    setInterval(() => { if (!show.on) startShow('launch', !pickAudio); }, 9000);
    window.sceneMusic = {
      playing: false,
      start(c) {
        if (this.playing) return; this.playing = true; pickAudio = true; userGesture = true;
        if (c && c !== actx) useCtx(c); else ensureAudio();
        if (actx && actx.state !== 'running') actx.resume();
        if (show.on && show.t < 4) playLaunchMusic();
      },
      stop() { this.playing = false; pickAudio = false; stopAll(); },
      duck() {}
    };
  }
}
init();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on && show.kind,
  btn: { launch: 'btnLaunch', night: 'btnRecover' },
  ff: () => { show.cues = new Proxy({}, { get: () => 1 }); show.t = show.dur - .02; },
  save: () => ({ t: T.t, auto: T.auto, w: wxIdx }),
  stop: () => endShow(),
  restore: s => { if (wxIdx !== s.w) setWeather(s.w); T.t = s.t; T.auto = s.auto; $('btnAuto') && $('btnAuto').setAttribute('aria-pressed', String(T.auto)); applyColors(true); }
});
/* /ShowStop */
})();
</script>
