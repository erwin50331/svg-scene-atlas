<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>廟口夜市</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* =========================================================
   SC-08 廟口夜市｜極簡幾何風格
   【色票 token】所有顏色集中在這裡。
   - 場景色成對出現：--名稱-day / --名稱-night，
     JS 會依「日夜比例」自動混色，輸出成 --名稱 給 SVG 使用，
     並自動產生 .f-名稱（填色）、.s-名稱（描邊）兩種 class。
   - 「常亮色」不參與混色（燈泡、霓虹、煙火、太陽月亮）。
   換色時只需改這個區塊。
   風格重點：只用圓、矩形、三角形與半圓組成畫面；不描邊、平塗色塊、
   有限色票（珊瑚紅、芥末黃、青綠、靛藍、米白），以格線與重複節奏取代細節線條。
   ========================================================= */
:root{
  color-scheme:dark;

  /* ---- 頁面外框（單一深色主題） ---- */
  --page-bg:#14162a;
  --page-panel:#1f2240;
  --page-fg:#f4ecd8;
  --page-dim:#a3a3bd;
  --page-line:#30345a;
  --page-accent:#ef6f5a;
  --font-display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;

  /* ---- 天空、雲、遠景 ---- */
  --sky-top-day:#bfe0e6;   --sky-top-night:#0d1331;
  --sky-mid-day:#d6ebe7;   --sky-mid-night:#18204a;
  --sky-bot-day:#f4ecd8;   --sky-bot-night:#2b2b63;
  --cloud-day:#ffffff;     --cloud-night:#2a3168;
  --hill-day:#a2cdc2;      --hill-night:#151f47;
  --far-day:#aac3cf;       --far-night:#1c2652;
  --far2-day:#8fb1c1;      --far2-night:#161f46;
  --tower-day:#7898ad;     --tower-night:#121a3d;
  --win-off-day:#cfe0e6;   --win-off-night:#242d5c;
  --tree-day:#4f9a7f;      --tree-night:#11303a;
  --tree2-day:#6fb796;     --tree2-night:#183f42;
  --trunk-day:#7a5a46;     --trunk-night:#22192c;

  /* ---- 廟宇與牌樓 ---- */
  --roof-day:#2f7d6d;      --roof-night:#113632;   /* 綠釉瓦 */
  --roof-lt-day:#4aa08c;   --roof-lt-night:#1a4a44;
  --temple-day:#c8443a;    --temple-night:#4a1c2e;
  --trim-day:#f0b541;      --trim-night:#6e5428;
  --arch-day:#e2553f;      --arch-night:#57223a;
  --plate-day:#1f2a44;     --plate-night:#0a0f24;

  /* ---- 地面、道路 ---- */
  --ground-day:#ece2cc;    --ground-night:#2b2848;
  --tile-day:#ddd1b6;      --tile-night:#232041;
  --curb-day:#c9bba0;      --curb-night:#1e1b37;
  --road-day:#5d6373;      --road-night:#17182c;
  --road-ln-day:#f2e8d0;   --road-ln-night:#55536f;

  /* ---- 攤位 ---- */
  --coral-day:#ef6f5a;     --coral-night:#80344a;
  --cream-day:#f6eedc;     --cream-night:#4c4868;
  --teal-day:#2fa39a;      --teal-night:#1a4c58;
  --mustard-day:#f1b740;   --mustard-night:#7c632f;
  --blue-day:#3d6fb6;      --blue-night:#1f3066;
  --pink-day:#f19bb3;      --pink-night:#6f3a5d;
  --green-day:#6bb36a;     --green-night:#2b4c3b;
  --sign-day:#1f2a44;      --sign-night:#0c1128;   /* 招牌底 */
  --sign-txt-day:#f6eedc;  --sign-txt-night:#ffe08a;
  --inside-day:#3b4058;    --inside-night:#2a2443; /* 攤位內牆 */
  --top-day:#e3dbc6;       --top-night:#3a3656;    /* 檯面 */
  --metal-day:#4a5266;     --metal-night:#191c33;
  --shutter-day:#bcc3cd;   --shutter-night:#3c405f;
  --shutter-ln-day:#a1a8b5;--shutter-ln-night:#2d3150;
  --grill-day:#2c2f3d;     --grill-night:#0f1020;

  /* ---- 人物、車輛 ---- */
  --skin-day:#f2c9a5;      --skin-night:#a88a86;
  --skin2-day:#c99572;     --skin2-night:#7c6166;
  --hair-day:#2a2230;      --hair-night:#0c0a14;
  --hair2-day:#7a5442;     --hair2-night:#2c2026;
  --hair3-day:#d9d4cc;     --hair3-night:#6d6a80;  /* 白髮 */
  --c1-day:#ef6f5a;        --c1-night:#7a3347;
  --c2-day:#2fa39a;        --c2-night:#1a4a55;
  --c3-day:#f1b740;        --c3-night:#7a612f;
  --c4-day:#3d6fb6;        --c4-night:#1e2f63;
  --c5-day:#f6eedc;        --c5-night:#55516f;
  --c6-day:#2e3550;        --c6-night:#121528;
  --c7-day:#f19bb3;        --c7-night:#6a3858;
  --truck-day:#f2c230;     --truck-night:#7d6629;
  --wheel-day:#232634;     --wheel-night:#0a0b15;
  --smoke-day:#f3efe6;     --smoke-night:#8a8fb5;
  --water-day:#6fc3d1;     --water-night:#24527a;
  --ink-day:#232838;       --ink-night:#0a0c18;

  /* ---- 常亮色（不隨日夜混色） ---- */
  --bulb:#ffd86b;       /* 燈泡 */
  --glow:#ffb347;       /* 燈泡光暈、地面光 */
  --lit:#ffcf80;        /* 攤位內暖光、窗光 */
  --neon-a:#ff5fa2;     /* 霓虹粉 */
  --neon-b:#4fe0ff;     /* 霓虹青 */
  --sun:#ff7a4d;
  --moon:#fff2c4;
  --star:#fff6d8;
  --beacon:#ff3b4f;     /* 高塔航空燈 */
  --fire:#ff8a3d;       /* 炭火 */
  --fish:#ff7a30;       /* 金魚 */
  --fish2:#ffffff;
  --tea:#c99b6d;        /* 奶茶 */
  --boba:#3b2416;       /* 珍珠 */
  --candy:#ff9ec7;      /* 棉花糖 */
  --candy2:#bfe6ff;
  --fw1:#ffd86b; --fw2:#ff5fa2; --fw3:#4fe0ff; --fw4:#9dff8a; --fw5:#ffffff;
}

/* ===== 頁面版面 ===== */
html,body{margin:0;background:var(--page-bg);color:var(--page-fg)}
body{font-family:var(--font-body);line-height:1.6}
.wrap{max-width:1680px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
h1{font-family:var(--font-display);font-weight:900;font-size:clamp(1.4rem,2.6vw,2rem);margin:0;letter-spacing:.06em;text-wrap:balance}
h1 small{font-size:.55em;font-weight:700;color:var(--page-accent);letter-spacing:.12em;margin-right:.6em}
.meta{color:var(--page-dim);font-size:.9rem;margin:0}
.stage{position:relative;border-radius:10px;overflow:hidden;background:#000;
  box-shadow:0 0 0 1px var(--page-line),0 18px 40px -18px #000}
.stage svg{display:block;width:100%;height:auto;max-width:100%;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.controls button{font:500 .95rem/1 var(--font-body);color:var(--page-fg);background:var(--page-panel);
  border:1px solid var(--page-line);border-radius:999px;padding:10px 18px;cursor:pointer;
  transition:transform .12s,background .2s}
.controls button:hover{background:#2a2e55}
.controls button:active{transform:translateY(2px)}
.controls button:focus-visible{outline:2px solid var(--page-accent);outline-offset:2px}
.controls button[aria-pressed="true"]{border-color:var(--page-accent);color:#fff}
.clock{margin-left:auto;font-family:var(--font-display);font-weight:500;font-size:1rem;color:var(--page-dim);font-variant-numeric:tabular-nums}
.hint{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px 20px;color:var(--page-dim);font-size:.88rem}
.hint b{color:var(--page-fg);font-weight:500;margin-right:.4em}

/* ===== SVG 內樣式 ===== */
.sans{font-family:var(--font-display);font-weight:900}
.signTxt{fill:var(--sign-txt);font-family:var(--font-display);font-weight:900;letter-spacing:2px}
.walker,.vehicle,.stallHit,#tub,#burner,#cat,#bulbs,#cart,#balloonWall .bl{cursor:pointer}
.bubble text{font-family:var(--font-display);font-weight:900;font-size:16px;fill:#232838}
.bubble{animation:pop 1.8s ease-out forwards;pointer-events:none}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}12%{opacity:1;transform:translateY(0)}75%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.twinkle{animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
#beacon{animation:blink 1.6s steps(1) infinite}
@keyframes blink{0%{opacity:1}50%{opacity:.15}}
.neonFlick{animation:flick 7s linear infinite}
@keyframes flick{0%,41%,44%,47%,100%{opacity:1}42%,46%{opacity:.25}}

/* ===== 減少動態：關閉 CSS 動畫（JS 端另行停住行人、車、煙） ===== */
@media (prefers-reduced-motion: reduce){
  .twinkle,#beacon,.neonFlick{animation:none}
  .bubble{animation:none}
  .controls button{transition:none}
}
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>
<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。
   想恢復完整版，刪掉這整段 <style id="pure-art"> 即可。
   ========================================================= */
html,body{height:100%;margin:0!important;overflow:hidden}
body{display:flex!important;align-items:center;justify-content:center;padding:0!important}
body>.wrap{width:100%!important;max-width:min(100vw,calc(100vh * 8 / 3))!important;
  margin:0!important;padding:0!important;gap:0!important;display:block!important}
body>.wrap>:not(.stage){display:none!important}
body>.wrap>.stage{width:100%!important;max-width:100%!important;margin:0!important;
  border:0!important;border-radius:0!important;box-shadow:none!important}
</style>
</head>
<body>
<main class="wrap">

  <div class="stage">
  <!-- =====================================================
       【場景】SVG 主舞台 viewBox 1600×600
       圖層由後到前：天空 → 星星日月 → 雲 → 煙火 → 遠山、天際線、高塔 → 榕樹
       → 廟宇 → 半圓牌樓 → 地面 → 攤位 → 燈泡串 → 光暈 → 廟埕香爐、撈金魚盆、用餐區
       → 後排行人 → 道路、車輛 → 前排行人 → 前景小物 → 煙霧蒸氣 → 對話泡泡
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img" aria-label="極簡幾何風格的台灣夜市動畫場景，可切換日夜並點擊攤位互動">
    <defs>
      <!-- 鐵捲門橫紋 -->
      <pattern id="shutterPat" width="8" height="7" patternUnits="userSpaceOnUse">
        <rect width="8" height="7" class="f-shutter"/>
        <rect y="5" width="8" height="2" class="f-shutter-ln"/>
      </pattern>
      <!-- 屋瓦直紋 -->
      <pattern id="tilePat" width="10" height="10" patternUnits="userSpaceOnUse">
        <rect width="10" height="10" class="f-roof"/>
        <rect width="4" height="10" class="f-roof-lt"/>
      </pattern>
      <!-- 光暈 -->
      <radialGradient id="glowGrad">
        <stop offset="0" stop-color="var(--glow)" stop-opacity=".55"/>
        <stop offset="1" stop-color="var(--glow)" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="bulbGlow">
        <stop offset="0" stop-color="var(--bulb)" stop-opacity=".8"/>
        <stop offset="1" stop-color="var(--bulb)" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="headGlow">
        <stop offset="0" stop-color="#fff3c8" stop-opacity=".5"/>
        <stop offset="1" stop-color="#fff3c8" stop-opacity="0"/>
      </radialGradient>
      <!-- 撈金魚盆裁切 -->
      <clipPath id="tubClip"><rect x="934" y="482" width="132" height="22" rx="11"/></clipPath>
    </defs>

    <!-- ===== 【場景】天空：三段平塗色帶 ===== -->
    <rect width="1600" height="600" class="f-sky-bot"/>
    <rect width="1600" height="260" class="f-sky-mid"/>
    <rect width="1600" height="150" class="f-sky-top"/>
    <g id="stars"></g>

    <!-- 太陽與月亮（JS 依時間沿圓弧移動） -->
    <g id="sun"><circle r="64" style="fill:var(--sun)" opacity=".18"/><circle r="44" style="fill:var(--sun)"/></g>
    <g id="moon">
      <circle r="58" style="fill:var(--moon)" opacity=".12"/>
      <!-- 弦月：兩段圓弧組成 -->
      <path d="M0,-34 A34,34 0 1 0 0,34 A22,34 0 1 1 0,-34 Z" style="fill:var(--moon)" transform="rotate(-25)"/>
    </g>

    <!-- 雲：膠囊形，JS 讓它隨風飄 -->
    <g id="clouds"></g>
    <!-- 煙火、鳥群（點天空產生） -->
    <g id="sky-fx"></g>

    <!-- ===== 【場景】遠景：三角形山、方塊天際線、高塔 ===== -->
    <g id="hills">
      <polygon points="-40,330 160,190 360,330" class="f-hill"/>
      <polygon points="200,330 330,230 470,330" class="f-hill" opacity=".8"/>
      <polygon points="1100,330 1260,210 1440,330" class="f-hill" opacity=".8"/>
    </g>
    <g id="skyline"></g>
    <g id="backLights"></g>
    <!-- 高塔：階梯狀矩形，塔頂紅色航空燈 -->
    <g id="tower">
      <rect x="1392" y="128" width="56" height="210" class="f-tower"/>
      <rect x="1400" y="100" width="40" height="30" class="f-tower"/>
      <rect x="1408" y="78" width="24" height="24" class="f-tower"/>
      <rect x="1418" y="44" width="4" height="36" class="f-tower"/>
      <g id="towerWins"></g>
      <circle id="beacon" cx="1420" cy="42" r="4" style="fill:var(--beacon)"/>
    </g>

    <!-- 榕樹：圓形樹冠堆疊（廟口大榕樹） -->
    <g id="trees">
      <rect x="1166" y="226" width="20" height="110" class="f-trunk"/>
      <rect x="1150" y="250" width="3" height="60" class="f-trunk" opacity=".7"/>
      <rect x="1200" y="246" width="3" height="54" class="f-trunk" opacity=".7"/>
      <circle cx="1128" cy="214" r="48" class="f-tree"/>
      <circle cx="1236" cy="222" r="44" class="f-tree"/>
      <circle cx="1182" cy="186" r="60" class="f-tree2"/>
      <circle cx="1160" cy="240" r="34" class="f-tree2"/>
      <rect x="452" y="232" width="12" height="100" class="f-trunk"/>
      <circle cx="430" cy="238" r="36" class="f-tree"/>
      <circle cx="470" cy="216" r="44" class="f-tree2"/>
    </g>

    <!-- ===== 【場景】廟宇：綠瓦、紅牆、燕尾脊 ===== -->
    <g id="temple">
      <rect x="682" y="250" width="236" height="220" class="f-temple"/>
      <!-- 屋身與屋瓦 -->
      <polygon points="652,254 948,254 904,214 696,214" fill="url(#tilePat)"/>
      <rect x="640" y="250" width="320" height="8" class="f-roof"/>
      <rect x="692" y="206" width="216" height="9" class="f-trim"/>
      <!-- 燕尾：兩端上翹的細三角 -->
      <polygon points="694,215 694,206 654,184" class="f-trim"/>
      <polygon points="906,215 906,206 946,184" class="f-trim"/>
      <!-- 脊上寶珠與火焰三角 -->
      <circle cx="800" cy="194" r="8" class="f-trim"/>
      <polygon points="800,172 794,186 806,186" class="f-coral"/>
      <polygon points="780,206 772,196 788,200" class="f-trim"/>
      <polygon points="820,206 828,196 812,200" class="f-trim"/>
      <!-- 屋簷下橫樑 -->
      <rect x="682" y="258" width="236" height="6" class="f-trim"/>
      <!-- 廟名匾額（虛構廟名） -->

<script>
(() => {
"use strict";
/* =========================================================
   基本工具
   ========================================================= */
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const svg = $("scene");
const root = document.documentElement;
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
// 固定亂數種子，讓每次載入的背景長一樣
function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const R = rng(20261121);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const RM_QUERY = window.matchMedia("(prefers-reduced-motion: reduce)");
let reduced = RM_QUERY.matches;

/* =========================================================
   【色票】日夜混色引擎
   讀取 --名稱-day / --名稱-night，依 night(0~1) 混色寫回 --名稱。
   ========================================================= */
const MIX = ["sky-top","sky-mid","sky-bot","cloud","hill","far","far2","tower","win-off","tree","tree2","trunk",
  "roof","roof-lt","temple","trim","arch","plate",
  "ground","tile","curb","road","road-ln",
  "coral","cream","teal","mustard","blue","pink","green","sign","sign-txt","inside","top","metal","shutter","shutter-ln","grill",
  "skin","skin2","hair","hair2","hair3","c1","c2","c3","c4","c5","c6","c7","truck","wheel","smoke","water","ink"];
(function injectClasses() {
  const css = MIX.map(n => `.f-${n}{fill:var(--${n})}.s-${n}{stroke:var(--${n})}`).join("");
  const st = document.createElement("style"); st.textContent = css; document.head.appendChild(st);
})();
const cs = getComputedStyle(root);
const hex = s => { s = s.trim().replace("#",""); if (s.length === 3) s = s.split("").map(c => c + c).join(""); const n = parseInt(s,16); return [n>>16&255, n>>8&255, n&255]; };
const PAIRS = MIX.map(n => [n, hex(cs.getPropertyValue(`--${n}-day`)), hex(cs.getPropertyValue(`--${n}-night`))]);
let lastApplied = -1;
function applyNight(nt, force) {
  if (!force && Math.abs(nt - lastApplied) < 0.004) return;
  lastApplied = nt;
  for (const [n, a, b] of PAIRS) {
    const c = a.map((v, i) => Math.round(v + (b[i] - v) * nt));
    root.style.setProperty(`--${n}`, `rgb(${c[0]},${c[1]},${c[2]})`);
  }
  $("stars").style.opacity = Math.max(0, nt * 1.6 - .6).toFixed(3);
  $("backLights").style.opacity = Math.max(0, nt * 1.4 - .4).toFixed(3);
  $("towerWins").style.opacity = Math.max(0, nt * 1.4 - .4).toFixed(3);
  document.querySelectorAll(".nightOnly").forEach(e => e.style.opacity = nt.toFixed(3));
}

/* =========================================================
   【場景】星星、雲、天際線、地磚、道路標線
   ========================================================= */
(function buildStars() {
  const g = $("stars");
  for (let i = 0; i < 70; i++) {
    const s = R() < .15 ? 3.4 : 1.6 + R() * 1.2;
    const x = R() * 1600, y = R() * 230;
    // 菱形星星（旋轉 45° 的小正方形）

      style: "fill:var(--star)", class: R() < .35 ? "twinkle" : "", "style": `fill:var(--star);animation-delay:${(R()*2.6).toFixed(2)}s` }, g);
  }
})();
const clouds = [];
(function buildClouds() {
  const g = $("clouds");
  [[180,96,1],[600,140,.7],[1000,70,.9],[1320,150,.65],[-200,60,.8]].forEach(([x, y, s]) => {
    const c = el("g", {}, g);

})();
(function buildSkyline() {
  const g = $("skyline"), L = $("backLights");
  let x = -10;
  while (x < 1610) {
    const w = 46 + R() * 70;
    // 牌樓內留出天空：中間的樓矮一些
    const inArch = x > 520 && x < 1060;
    const top = inArch ? 280 + R() * 30 : 196 + R() * 90;
    const cls = R() < .5 ? "f-far" : "f-far2";
    el("rect", { x, y: top, width: w, height: 340 - top, class: cls }, g);
    if (R() < .3) el("rect", { x: x + w * .3, y: top - 14, width: w * .4, height: 14, class: cls }, g);  // 頂樓水塔
    if (R() < .35) el("rect", { x: x + w * .5, y: top - 30, width: 3, height: 30, class: cls }, g);      // 天線
    for (let yy = top + 12; yy < 326; yy += 20)
      for (let xx = x + 8; xx < x + w - 12; xx += 16) {
        el("rect", { x: xx, y: yy, width: 7, height: 9, class: "f-win-off" }, g);
        if (R() < .42) el("rect", { x: xx, y: yy, width: 7, height: 9, style: "fill:var(--lit)" }, L);
      }
    x += w + 4 + R() * 10;
  }
  const T = $("towerWins");
  for (let yy = 140; yy < 330; yy += 14)
    for (let xx = 1398; xx < 1442; xx += 12)
      if (R() < .6) el("rect", { x: xx, y: yy, width: 6, height: 6, style: "fill:var(--lit)" }, T);
})();
(function buildTiles() {
  const g = $("tiles");
  for (let x = 0; x < 1600; x += 40) el("rect", { x, y: 468, width: 2, height: 68, class: "f-tile" }, g);
  for (let y = 490; y < 536; y += 22) el("rect", { x: 0, y, width: 1600, height: 2, class: "f-tile" }, g);
  const r = $("roadLines");
  for (let x = 10; x < 1600; x += 70) el("rect", { x, y: 559, width: 34, height: 4, class: "f-road-ln" }, r);
})();
(function buildArchBulbs() {
  const g = $("archBulbs");
  for (let i = 0; i <= 24; i++) {
    const a = Math.PI - i / 24 * Math.PI;
    el("circle", { cx: (800 + 243 * Math.cos(a)).toFixed(1), cy: (330 - 243 * Math.sin(a)).toFixed(1), r: 4, class: "archBulb", style: "fill:var(--bulb)" }, g);
  }
})();
const lanterns = [];
(function buildLanterns() {
  const g = $("lanterns");
  [708, 744, 856, 892].forEach((x, i) => {
    const L = el("g", {}, g);
    el("rect", { x: -1, y: 0, width: 2, height: 8, class: "f-ink" }, L);

/* =========================================================

const STALLS = [
  { id: "sausage", x: 10,   w: 170, name: "烤香腸",   a: "coral",   b: "cream",   c: "mustard", open: 17,   close: 24.5 },
  { id: "tea",     x: 186,  w: 160, name: "珍珠奶茶", a: "teal",    b: "cream",   c: "coral",   open: 11,   close: 25 },
  { id: "balloon", x: 352,  w: 200, name: "射氣球",   a: "blue",    b: "mustard", c: "pink",    open: 17.5, close: 24 },

  { id: "chicken", x: 734,  w: 160, name: "大雞排",   a: "coral",   b: "mustard", c: "blue",    open: 16,   close: 25.5 },

function buildStall(S) {

  el("rect", { x: 9, y: 356, width: w - 18, height: 114, fill: "url(#shutterPat)" }, S.shutter);
  el("circle", { cx: w / 2, cy: 404, r: 22, class: "f-" + S.a }, S.shutter);

  // 光暈（地面）

let phase = 0.29;            // 初始：傍晚 19 點左右，夜市剛熱鬧
let auto = true, tween = null;
let wind = 0, windTarget = 0, pointerIn = false;
let marketLevel = 0;         // 全體攤位平均營業程度 0~1
let party = false;
const nightOf = p => .5 - .5 * Math.cos(p * Math.PI * 2);
const hourOf = p => (12 + p * 24) % 24;
function openness(h, o, c) {
  const H = h < 6 ? h + 24 : h;
  return smooth((H - o) / .6) * (1 - smooth((H - c) / .6));
}
function clockLabel(p) {
  const h = hourOf(p), hh = Math.floor(h), mm = Math.floor((h - hh) * 6) * 10;
  const name = hh < 5 ? "深夜" : hh < 8 ? "清晨" : hh < 11 ? "上午" : hh < 13 ? "中午" : hh < 16 ? "午後" : hh < 18 ? "傍晚" : hh < 23 ? "夜晚" : "深夜";
  const st = marketLevel > .7 ? "夜市營業中" : marketLevel > .15 ? (hh >= 12 && hh < 20 ? "陸續開張" : "陸續收攤") : "攤位休息中";
  return `${name}　${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}　｜　${st}${crowdMul > 1 ? "　｜　週末人潮" : ""}`;
}
let last = performance.now(), mixTimer = 0, t = 0, lastHour = hourOf(phase);
let catWag = 0, catAwake = 0, shakeT = 0, flareT = 0, sizzleT = 0;

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;

  // 時間推進
  if (tween) {
    tween.t = Math.min(1, tween.t + dt / 1.8);
    const e = tween.t < .5 ? 2 * tween.t * tween.t : 1 - Math.pow(-2 * tween.t + 2, 2) / 2;
    phase = (tween.from + (tween.to - tween.from) * e) % 1;
    if (tween.t >= 1) tween = null;
  } else if (auto && !reduced) phase = (phase + dt / CYCLE) % 1;
  const night = nightOf(phase);
  const hour = hourOf(phase);

  // 營業狀態：每個攤位依自己的時間開關鐵捲門
  let sum = 0;
  STALLS.forEach(S => {
    const o = openness(hour, S.open, S.close);
    S.openness = o; sum += o;
  });
  const C = stallMap.cart; C.openness = openness(hour, C.open, C.close);
  marketLevel = sum / STALLS.length;

  mixTimer -= dt;
  if (mixTimer <= 0 || tween) {
    applyNight(night);
    mixTimer = .12;
    $("clock").textContent = clockLabel(phase);
    STALLS.forEach(S => {
      const o = S.openness;
      S.shutter.setAttribute("transform", `translate(${S.x},${(-o * 112).toFixed(1)})`);
      S.litRect.setAttribute("opacity", (o * (.12 + .3 * night)).toFixed(3));
      S.pool.setAttribute("opacity", (o * night).toFixed(3));
      S.signGlow.setAttribute("opacity", (o * night * .9).toFixed(3));
    });
    const oy = stallMap.oyster.openness, fo = stallMap.fish.openness;
    stallMap.oyster.eat.setAttribute("opacity", smooth(oy * 1.4 - .3).toFixed(2));
    stallMap.fish.tub.setAttribute("opacity", smooth(fo * 1.4 - .2).toFixed(2));
    stallMap.balloon.player.setAttribute("opacity", smooth(stallMap.balloon.openness * 1.4 - .3).toFixed(2));
    // 推車：開張時從右邊推進來，收攤時推走
    C.g.setAttribute("transform", `translate(${(1515 + (1 - smooth(C.openness)) * 200).toFixed(1)},0)`);
    $("crowdSea").setAttribute("opacity", (crowdMul > 1 ? smooth(marketLevel * 1.5 - .3) : 0).toFixed(2));
    document.querySelectorAll(".lanternGlow").forEach(e => e.setAttribute("opacity", (night * .55).toFixed(2)));
    document.querySelectorAll(".archBulb").forEach((e, i) => e.setAttribute("opacity", (.25 + .75 * marketLevel * (party ? (Math.sin(t * 6 + i) > 0 ? 1 : .3) : 1)).toFixed(2)));
  }

  // 太陽、月亮：沿大圓弧移動
  const a = phase * Math.PI * 2;
  $("sun").setAttribute("transform", `translate(${(800 + 660 * Math.sin(a)).toFixed(1)},${(400 - 330 * Math.cos(a)).toFixed(1)})`);
  $("moon").setAttribute("transform", `translate(${(800 - 660 * Math.sin(a)).toFixed(1)},${(400 + 330 * Math.cos(a)).toFixed(1)})`);

  // 風：滑鼠控制，沒有滑鼠時緩慢自然變化
  if (!pointerIn) windTarget = Math.sin(t * .13) * .8 + Math.sin(t * .37) * .3;
  wind += (windTarget - wind) * Math.min(1, dt * 1.5);
  const motion = reduced ? 0 : 1;

  // 雲
  clouds.forEach(c => {
    c.x += (c.sp + wind * 14) * dt * motion;
    if (c.x > 1800) c.x = -220; if (c.x < -260) c.x = 1760;
    c.g.setAttribute("transform", `translate(${c.x.toFixed(1)},${c.y})`);
  });

  // 燈籠擺動
  lanterns.forEach(L => {
    const r = reduced ? 0 : Math.sin(t * 1.6 + L.ph) * (3 + Math.abs(wind) * 4) + wind * 6;
    L.g.setAttribute("transform", `translate(${L.x},262) rotate(${r.toFixed(1)})`);
  });

  // 燈泡串：隨風改變下垂弧度，夜晚閃爍
  const bulbOn = Math.max(marketLevel, 0);
  bulbStrings.forEach(B => {
    const sway = reduced ? 0 : wind * 8 + Math.sin(t * 1.3 + B.x0) * 2;
    const mx = (B.x0 + B.x1) / 2 + sway, my = B.y + B.sag + Math.abs(wind) * 3;
    B.line.setAttribute("d", `M${B.x0},${B.y} Q${mx.toFixed(1)},${(my * 2 - B.y).toFixed(1)} ${B.x1},${B.y}`);
    B.bs.forEach((b, i) => {
      const k = b.k, u = 1 - k;
      const x = u * u * B.x0 + 2 * u * k * mx + k * k * B.x1;
      const y = u * u * B.y + 2 * u * k * (my * 2 - B.y) + k * k * B.y + 6;
      b.off.setAttribute("cx", x.toFixed(1)); b.off.setAttribute("cy", y.toFixed(1));
      b.on.setAttribute("cx", x.toFixed(1)); b.on.setAttribute("cy", y.toFixed(1));
      b.glow.setAttribute("cx", x.toFixed(1)); b.glow.setAttribute("cy", y.toFixed(1));
      let lv = bulbOn;
      if (!reduced) {
        if (party) {
          const c = Math.floor(t * 4 + i) % 3;
          b.on.style.fill = ["var(--bulb)", "var(--neon-a)", "var(--neon-b)"][c];
          lv *= (Math.sin(t * 8 + i * 1.1) > -.2 ? 1 : .2);
        } else {
          b.on.style.fill = "var(--bulb)";
          if (Math.sin(t * 13 + b.f * 7) > .985) lv *= .3;   // 偶爾接觸不良閃一下
        }
      }
      b.on.setAttribute("opacity", lv.toFixed(2));
      b.glow.setAttribute("opacity", (lv * night).toFixed(2));
    });
  });

  // 攤販動作
  vendors.forEach(V => {
    V.boost = Math.max(0, V.boost - dt);
    const sp = V.sp * (V.boost > 0 ? 3 : 1);
    const r = reduced ? V.base : V.base + Math.sin(t * sp + V.ph) * V.amp * (V.boost > 0 ? 1.6 : 1);
    V.arm.setAttribute("transform", `translate(${V.ax},${V.ay}) rotate(${r.toFixed(1)})`);
  });

  // 香腸攤：炭火明暗、香腸翻面變色、點擊後冒火
  const SS = stallMap.sausage;
  SS.coals.setAttribute("opacity", ((.3 + .5 * night) * SS.openness * (reduced ? 1 : (.8 + .2 * Math.sin(t * 9)))).toFixed(2));
  if (!reduced) SS.sausages.forEach((s, i) => { if (Math.sin(t * .8 + i * 2.1) > .995) s.setAttribute("class", s.getAttribute("class") === "f-coral" ? "f-c1" : "f-coral"); });
  flareT = Math.max(0, flareT - dt);
  SS.flames.setAttribute("opacity", flareT > 0 ? (Math.min(1, flareT * 2) * (reduced ? 1 : .7 + .3 * Math.sin(t * 30))).toFixed(2) : 0);
  SS.flames.setAttribute("transform", `translate(0,${(reduced ? 0 : Math.sin(t * 22) * 1.5).toFixed(1)})`);

  // 奶茶攤：搖杯
  const TS = stallMap.tea;
  shakeT = Math.max(0, shakeT - dt);
  const sh = shakeT > 0 && !reduced ? Math.sin(t * 40) * 10 : 0;
  TS.shaker.setAttribute("transform", `translate(${70 + sh * .4},${392 - Math.abs(sh) * .6}) rotate(${sh})`);

  // 雞排攤：油鍋泡泡
  sizzleT = Math.max(0, sizzleT - dt);
  const CK = stallMap.chicken;
  if (!reduced && CK.openness > .5 && Math.random() < (sizzleT > 0 ? .9 : .15)) {
    const b = el("circle", { cx: CK.x + rand(28, 66), cy: 386, r: rand(1.5, 3), style: "fill:#ffe9a8" }, $("fx"));
    fxs.push({ e: b, life: 0, max: .5, kind: "oil" });
  }

  // 蚵仔煎：鐵板上的煎餅輕輕跳動
  stallMap.oyster.omelets.forEach((o, i) => o.setAttribute("ry", (4 + (reduced ? 0 : Math.max(0, Math.sin(t * 3 + i)) * .8)).toFixed(2)));

  // 棉花糖慢慢變大
  C.grow += (C.target - C.grow) * Math.min(1, dt * 2);
  C.candy.setAttribute("r", C.grow.toFixed(1));
  if (C.target > 6 && C.grow > C.target - .2) C.target = C.target > 20 ? 6 : C.target;

  // 煙霧與蒸氣：依營業程度與風
  if (!reduced) {
    emitters.forEach(E => {
      const lv = E.stall.openness;
      if (lv > .2 && Math.random() < E.rate * lv * dt * (E.kind === "smoke" && flareT > 0 ? 5 : 1)) puff(E.x + rand(-E.spread / 2, E.spread / 2), E.y, E.kind, flareT > 0 && E.kind === "smoke");
    });
    // 廟埕天公爐的香煙（白天也有）
    if (Math.random() < 2.2 * dt) puff(800 + rand(-12, 12), 456, "smoke", false);
  }
  for (let i = puffs.length - 1; i >= 0; i--) {
    const P = puffs[i];
    P.life += dt;
    const k = P.life / P.max;
    P.x += (P.vx + wind * 22) * dt; P.y += P.vy * dt; P.vy *= (1 - dt * .3);
    const r = P.r * (1 + k * 2.4);
    P.e.setAttribute("cx", P.x.toFixed(1)); P.e.setAttribute("cy", P.y.toFixed(1)); P.e.setAttribute("r", r.toFixed(1));
    P.e.setAttribute("opacity", ((k < .15 ? k / .15 : 1 - (k - .15) / .85) * (P.kind === "smoke" ? .55 : .7)).toFixed(2));
    if (k >= 1) { P.e.remove(); puffs.splice(i, 1); }
  }

  // 金魚游動
  fish.forEach(F => {
    F.panic = Math.max(0, F.panic - dt);
    const sp = F.sp * (F.panic > 0 ? 4 : 1) * motion;
    F.a += (Math.random() - .5) * dt * 3;
    F.x += Math.cos(F.a) * sp * dt; F.y += Math.sin(F.a) * sp * .35 * dt;
    if (F.x < 942 || F.x > 1058) { F.a = Math.PI - F.a; F.x = clamp(F.x, 942, 1058); }
    if (F.y < 486 || F.y > 500) { F.a = -F.a; F.y = clamp(F.y, 486, 500); }
    F.e.setAttribute("transform", `translate(${F.x.toFixed(1)},${F.y.toFixed(1)}) scale(${Math.cos(F.a) < 0 ? -1 : 1},1)`);
  });

  // 射氣球：破掉的氣球過一陣子補回來
  balloons.forEach(B => { if (!B.alive) { B.t -= dt; if (B.t <= 0) { B.alive = true; B.e.setAttribute("opacity", 1); } } });
  if (!reduced) balloons.forEach((B, i) => B.e.setAttribute("transform", `translate(0,${(Math.sin(t * 2 + i * .7) * 1.2).toFixed(1)})`));

  // 背景人海輕輕晃動
  if (!reduced && crowdMul > 1 && marketLevel > .2) seaHeads.forEach(h => {
    h.ph += dt * 3;
    h.g.setAttribute("transform", `translate(${(h.x + Math.sin(h.ph * .3) * 2).toFixed(1)},${(h.y - Math.abs(Math.sin(h.ph)) * 1.2).toFixed(1)}) scale(${h.k.toFixed(2)})`);
  });

  // 行人
  const walkMul = reduced ? 0 : 1;
  for (let i = walkers.length - 1; i >= 0; i--) {
    const W = walkers[i];
    if (W.hop > 0) W.hop = Math.max(0, W.hop - dt * 2.2);
    // 偶爾停下來看攤位
    W.pauseCD -= dt;
    const packed = packedNow();
    if (W.pauseCD <= 0 && W.pause <= 0 && marketLevel > .4 && Math.random() < (packed ? .6 : .4)) { W.pause = rand(1.2, 3.2); }
    if (W.pauseCD <= 0) W.pauseCD = packed ? rand(3, 7) : rand(5, 14);
    if (W.pause > 0) W.pause -= dt;
    else {
      // 爆滿時人擠人，只能慢慢挪動
      const crawl = packed ? .4 : 1;
      W.x += W.dir * W.sp * crawl * dt * walkMul; W.ph += dt * W.sp * crawl * .2 * walkMul;
    }
    drawWalker(W);
    if (W.x < -60 || W.x > 1660) {
      W.g.remove(); walkers.splice(i, 1);
    }
  }
  if (!reduced) for (const k of LANE_KEYS) {
    const n = walkers.filter(w => w.lane === k).length;
    if (n < targetCount(k) && Math.random() < dt * (crowdMul > 1 ? 4 : 1.2)) {
      const dir = Math.random() < .5 ? 1 : -1;
      makeWalker(k, dir > 0 ? -40 : 1640, dir);
    }
  }

  // 車輛：機車隨機出現；20:00 垃圾車準時來
  if (!reduced) {
    vehCD -= dt;
    if (vehCD <= 0 && packedNow()) vehCD = 2;   // 人潮滿到馬路上，機車進不來
    if (vehCD <= 0) { makeScooter(Math.random() < .5 ? 1 : -1); vehCD = rand(2.5, 6) / (marketLevel > .5 ? .8 : 1); }
    if (lastHour < 20 && hour >= 20 && !truck && !packedNow()) makeTruck();
  }
  lastHour = hour;
  for (let i = vehicles.length - 1; i >= 0; i--) {
    const V = vehicles[i];
    if (V.type === "truck") {
      // 垃圾車在畫面中央停一下，音符飄出
      if (!V.stopped && V.x > 760) { V.stopped = true; V.stop = 5; }
      if (V.stop > 0) V.stop -= dt; else V.x += V.sp * dt * walkMul;
      V.noteT -= dt;
      if (V.noteT <= 0 && !reduced) { note(V.x - 70, V.y - 90); V.noteT = .45; }
    } else {
      V.x += V.dir * V.sp * dt * walkMul;
      if (V.honk > 0) V.honk -= dt;
    }
    drawVehicle(V);
    if (V.x < -200 || V.x > 1800) { V.g.remove(); vehicles.splice(i, 1); if (V === truck) truck = null; }
  }

  // 特效更新
  for (let i = fxs.length - 1; i >= 0; i--) {
    const F = fxs[i];
    F.life += dt;
    const k = Math.min(1, F.life / F.max);
    if (F.kind === "burst") { F.g.setAttribute("opacity", (1 - k).toFixed(2)); F.ring.setAttribute("r", (6 + k * 14).toFixed(1)); F.g.setAttribute("transform", F.g.getAttribute("transform").split(" scale")[0] + ` scale(${(1 + k * .8).toFixed(2)})`); }
    else if (F.kind === "ripple") { F.e.setAttribute("rx", (2 + k * 34).toFixed(1)); F.e.setAttribute("ry", (1 + k * 7).toFixed(1)); F.e.setAttribute("opacity", (1 - k).toFixed(2)); }
    else if (F.kind === "oil") { F.e.setAttribute("opacity", (1 - k).toFixed(2)); F.e.setAttribute("cy", (386 - k * 6).toFixed(1)); }
    else if (F.kind === "note") { F.x += (F.vx + wind * 10) * dt; F.y -= 28 * dt; F.e.setAttribute("transform", `translate(${F.x.toFixed(1)},${F.y.toFixed(1)})`); F.e.setAttribute("opacity", (1 - k).toFixed(2)); }
    else if (F.kind === "firework") {
      const ek = 1 - Math.pow(1 - k, 3);
      const R0 = 10 + ek * 70;
      F.rays.forEach((r, j) => { const a = j / F.n * 360; r.setAttribute("transform", `rotate(${a}) translate(${(R0 * .55).toFixed(1)},0)`); r.setAttribute("width", (6 + 16 * (1 - k)).toFixed(1)); });
      F.dots.forEach((d, j) => { const a = (j + .5) / F.n * Math.PI * 2; d.setAttribute("cx", (Math.cos(a) * R0).toFixed(1)); d.setAttribute("cy", (Math.sin(a) * R0 + k * k * 26).toFixed(1)); });
      F.ring.setAttribute("r", (R0 * .35).toFixed(1));
      F.g.setAttribute("opacity", (k < .7 ? 1 : 1 - (k - .7) / .3).toFixed(2));
      F.ring.setAttribute("opacity", (1 - k).toFixed(2));
    }
    if (k >= 1) { (F.g || F.e).remove(); fxs.splice(i, 1); }
  }

  // 鳥群
  for (let i = birds.length - 1; i >= 0; i--) {
    const b = birds[i];
    b.life -= dt; b.x += (70 + wind * 20) * dt; b.ph += dt * 9;
    const flap = Math.sin(b.ph);
    b.e.setAttribute("d", `M-8,${(flap * 4).toFixed(1)} L0,0 L8,${(flap * 4).toFixed(1)}`);
    b.e.setAttribute("transform", `translate(${b.x.toFixed(1)},${(b.y + Math.sin(b.ph * .2) * 4).toFixed(1)})`);
    if (b.life <= 0 || b.x > 1700) { b.e.remove(); birds.splice(i, 1); }
  }

  // 貓：白天睡、晚上醒；點了會搖尾巴
  catWag = Math.max(0, catWag - dt);
  catAwake = Math.max(0, catAwake - dt);
  const tailA = reduced ? 0 : Math.sin(t * (catWag > 0 ? 10 : 1.5)) * (catWag > 0 ? 8 : 3);
  catTail.setAttribute("d", `M-15,-10 q${(-14 + tailA).toFixed(1)},-2 ${(-12 + tailA * 1.5).toFixed(1)},-16`);
  const awake = night > .5 || catAwake > 0;
  catEye.setAttribute("height", awake ? 4 : 1.6);
  catEye.setAttribute("y", awake ? -27 : -26);

  requestAnimationFrame(frame);
}

/* =========================================================
   【互動】
   ========================================================= */
function svgPoint(evt) {
  const p = svg.createSVGPoint(); p.x = evt.clientX; p.y = evt.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
// 風向：滑鼠在畫面左右位置
svg.addEventListener("pointermove", e => { pointerIn = true; windTarget = (svgPoint(e).x / 1600 - .5) * 2.4; });
svg.addEventListener("pointerleave", () => { pointerIn = false; });

// 射氣球：點氣球 → 爆開、客人出手
$("balloonWall").addEventListener("click", e => {
  const b = e.target.closest(".bl");
  e.stopPropagation();
  const S = stallMap.balloon;
  if (S.openness < .5) { bubble(S.x + S.w / 2, 350, "還沒開喔"); return; }
  let B = b ? balloons.find(x => x.e === b) : null;
  if (!B || !B.alive) B = balloons.find(x => x.alive);
  if (!B) { bubble(S.x + S.w / 2, 350, "全破了！"); return; }
  B.alive = false; B.t = rand(4, 7); B.e.setAttribute("opacity", 0);
  burst(B.cx, B.cy, B.e.getAttribute("fill"));
  S.playerArm.setAttribute("transform", "translate(10,-60) rotate(-100)");
  setTimeout(() => S.playerArm.setAttribute("transform", "translate(10,-60) rotate(-150)"), 220);
  const left = balloons.filter(x => x.alive).length;
  if (left % 6 === 0) bubble(S.x + S.w / 2, 350, left === 0 ? "全中！送熊熊" : "好準！");
});

// 撈金魚：漣漪＋魚四散
$("tub").addEventListener("click", e => {
  e.stopPropagation();
  const p = svgPoint(e);
  ripple(clamp(p.x, 950, 1050), 493);
  if (!reduced) setTimeout(() => ripple(clamp(p.x, 950, 1050), 493), 200);
  fish.forEach(F => { F.panic = 1.4; F.a = Math.atan2(F.y - 493, F.x - p.x) + rand(-.5, .5); });
  if (Math.random() < .3) bubble(1000, 456, pick(["撈到了！", "紙網破了…", "再一次！"]));
});

// 點攤位：各攤不同反應
$("stalls").addEventListener("click", e => {
  const g = e.target.closest(".stallHit"); if (!g) return;
  const S = stallMap[g.dataset.id];
  const bx = S.x + S.w / 2;
  if (S.openness < .5) { bubble(bx, 350, pick(["下午五點開", "還在備料", "收攤囉"])); return; }
  vendors.forEach(V => { if (S.g.contains(V.g)) V.boost = 1.6; });
  switch (S.id) {
    case "sausage": flareT = 1.2; bubble(bx, 350, pick(["香腸烤好了！", "蒜頭自己拿", "要辣嗎？"])); break;
    case "tea": {
      shakeT = 1.1;
      const cups = S.cups.childNodes;
      if (cups.length >= 6) cups[0].remove();
      [...S.cups.childNodes].forEach((c, i) => c.setAttribute("transform", `translate(${20 + i * 24},428)`));
      drawTeaCup(S.cups, 20 + S.cups.childNodes.length * 24, 428);
      bubble(bx, 350, pick(["微糖去冰！", "珍珠加量", "一杯好了"])); break;
    }
    case "oyster": for (let i = 0; i < 6; i++) puff(S.x + rand(70, 160), 410, "steam", true); bubble(bx, 350, pick(["蚵仔煎一份", "醬多一點", "內用請坐"])); break;
    case "chicken": sizzleT = 1.4; for (let i = 0; i < 5; i++) puff(S.x + rand(24, 70), 382, "steam", true); bubble(bx, 350, pick(["大雞排來囉！", "切不切？", "胡椒粉多一點"])); break;
    case "fish": bubble(bx, 350, pick(["一網二十元", "撈到送一隻", "小心紙網"])); break;
    case "tofu": for (let i = 0; i < 5; i++) puff(S.x + rand(90, 140), 400, "steam", true); bubble(bx, 350, pick(["臭得剛剛好", "泡菜加滿", "外酥內嫩"])); break;
    case "bao": for (let i = 0; i < 8; i++) puff(S.x + rand(76, 138), 362, "steam", true); bubble(bx, 350, pick(["刈包出籠！", "花生粉多一點", "不要香菜"])); break;
    default: bubble(bx, 350, pick(["來喔來喔！", "歡迎參觀"]));
  }
});

// 燈泡串：派對模式
$("bulbs").addEventListener("click", e => { e.stopPropagation(); party = !party; bubble(e && svgPoint(e).x || 800, 262, party ? "派對模式！" : "恢復暖光"); });

// 棉花糖推車：棉花糖變大
$("cart").addEventListener("click", e => {
  e.stopPropagation();
  const C = stallMap.cart;
  C.target = C.target >= 20 ? 6 : C.target + 7;
  if (reduced) C.grow = C.target;
  bubble(1515, 356, C.target >= 20 ? "好大一朵！" : "繞～繞～");
});

// 點天公爐：香煙一陣、許個願
$("burner").addEventListener("click", e => {
  e.stopPropagation();
  for (let i = 0; i < 8; i++) puff(800 + rand(-14, 14), 456, "smoke", true);
  bubble(800, 446, pick(["拜拜保平安", "求個好籤", "感謝神明", "生意興隆！"]));
});

// 貓
$("cat").addEventListener("click", e => { e.stopPropagation(); catWag = 1.4; catAwake = 3; bubble(1482, 492, pick(["喵～", "喵嗚？", "想吃香腸"])); });

// 行人：跳一下打招呼
["walkersBack", "walkersRoad", "walkersFront"].forEach(id => $(id).addEventListener("click", e => {
  const g = e.target.closest(".walker"); if (!g) return;
  e.stopPropagation();
  const W = walkers.find(w => w.g === g); if (!W) return;
  W.hop = 1;
  bubble(W.x, W.y - 96 * W.s, W.type === "dog" && Math.random() < .5 ? "汪！" : pick(GREET));
}));
// 車輛：機車按喇叭、垃圾車放音樂
$("vehicles").addEventListener("click", e => {
  const g = e.target.closest(".vehicle"); if (!g) return;
  e.stopPropagation();
  const V = vehicles.find(v => v.g === g); if (!V) return;
  if (V.type === "truck") { playMelody(); for (let i = 0; i < 4; i++) note(V.x - 80 + i * 20, V.y - 90); bubble(V.x, 480, "垃圾車來囉！"); }
  else bubble(V.x, 500, pick(["叭叭！", "借過一下", "外送中～"]));
});
// 點天空：夜晚煙火、白天鳥群
svg.addEventListener("click", e => {
  const p = svgPoint(e);
  if (p.y > 240) return;
  if (nightOf(phase) > .45) firework(p.x, p.y);
  else flock(p.x, p.y);
});

// 控制鈕
$("btnDayNight").addEventListener("click", () => {
  // 白天 → 跳到 20:00 夜市高峰；夜晚 → 跳到隔天 13:00
  const h = hourOf(phase);
  const toHour = (h >= 9 && h < 18) ? 20 : 13;
  let to = ((toHour - 12 + 24) % 24) / 24;
  if (to <= phase) to += 1;
  if (reduced) { phase = to % 1; tween = null; mixTimer = 0; lastApplied = -1; return; }
  tween = { from: phase, to, t: 0 };
});
$("btnAuto").addEventListener("click", () => {
  auto = !auto;
  $("btnAuto").setAttribute("aria-pressed", auto);
  $("btnAuto").textContent = "自動循環：" + (auto ? "開" : "關");
});
$("btnCrowd").addEventListener("click", () => {
  crowdMul = crowdMul > 1 ? 1 : 1.7;
  $("btnCrowd").setAttribute("aria-pressed", crowdMul > 1);
  $("btnCrowd").textContent = "人潮：" + (crowdMul > 1 ? "爆滿" : "一般");
  if (reduced) { walkers.slice().forEach(w => w.g.remove()); walkers.length = 0; spawnWalkers(); }
  else if (crowdMul > 1) {
    // 馬路被人潮占滿：路上的機車先離開，避免和行人重疊
    for (let i = vehicles.length - 1; i >= 0; i--) if (vehicles[i].type === "scooter") { vehicles[i].g.remove(); vehicles.splice(i, 1); }
    // 一按下就湧進人潮：直接在畫面中補滿
    for (const k of LANE_KEYS) {
      const need = targetCount(k) - walkers.filter(w => w.lane === k).length;
      for (let i = 0; i < need; i++) makeWalker(k, rand(20, 1580), Math.random() < .5 ? 1 : -1);
    }
  }
  $("clock").textContent = clockLabel(phase);
});

// 減少動態：停住行人、車與煙，只保留切換
function applyReduced() {
  reduced = RM_QUERY.matches;
  if (reduced) { auto = false; $("btnAuto").setAttribute("aria-pressed", "false"); $("btnAuto").textContent = "自動循環：關"; }
}
RM_QUERY.addEventListener && RM_QUERY.addEventListener("change", applyReduced);
applyReduced();

/* =========================================================
   初始化
   ========================================================= */
(function init() {
  const h = hourOf(phase);
  let sum = 0; STALLS.forEach(S => sum += openness(h, S.open, S.close));
  marketLevel = sum / STALLS.length;
  applyNight(nightOf(phase), true);
  clouds.forEach(c => c.g.setAttribute("transform", `translate(${c.x},${c.y})`));
  spawnWalkers();
  const s1 = makeScooter(1); s1.x = 420; drawVehicle(s1);
  const s2 = makeScooter(-1); s2.x = 1180; drawVehicle(s2);
  requestAnimationFrame(frame);
})();
})();
</script>
</body>
</html>
