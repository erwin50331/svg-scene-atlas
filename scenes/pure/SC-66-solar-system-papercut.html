        每顆行星都是一個小世界：月兔坐在月亮上、火星探測車繞著火星跑、
        木星的紙條紋會滑動、土星環上坐著釣星星的太空人、天王星躺著轉呼拉圈；
        背景有慢慢游過的太空鯨魚、紙彗星風箏、從天花板垂下來的紙星星。
   日夜：白天是粉桃色與淡紫的紙天空，晚上轉成深藍，紙星星發光、偶爾劃過流星。
   風格重點：剪紙層疊——每一片紙都有投影，大物件由好幾層紙疊成（亮面、暗面、花紋），
            全畫面疊一層紙纖維紋理，滑鼠移動時各層紙產生視差。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   --d-名稱 = 白天、--n-名稱 = 夜晚、--k-名稱 = 晨昏（可省略）。
   JS 會依時間自動混色輸出成 --名稱，並產生 .f-名稱（填色）、.s-名稱（線色）。
   沒有 d/n 成對的是固定色。
   ========================================================= */
:root{
  /* —— 紙天空 —— */
  --d-skyT:#9db4ea;  --k-skyT:#5a4b9c;  --n-skyT:#0b1034;
  --d-skyB:#f8d6c6;  --k-skyB:#f39a86;  --n-skyB:#2b2160;
  /* —— 星雲紙帶（背景三層） —— */

  --d-neb2:#f2bfd4;  --k-neb2:#e48aa8;  --n-neb2:#3b2a72;
  --d-neb3:#acd8e4;  --k-neb3:#8c9ccc;  --n-neb3:#1b3668;
  /* —— 底部紙雲（三層） —— */
  --d-cl1:#fff4ec;   --k-cl1:#ffd8c8;   --n-cl1:#3c3c80;
  --d-cl2:#f8dfea;   --k-cl2:#f2b8c4;   --n-cl2:#2e2d6a;
  --d-cl3:#e6d8f8;   --k-cl3:#c8a8de;   --n-cl3:#22215a;
  /* —— 緞帶軌道、名牌、字 —— */
  --d-ribbon:#fffaf3; --n-ribbon:#7b80c8;
  --d-stitch:#e7a3a0; --n-stitch:#c4c8ff;
  --d-tag:#fffaf3;    --n-tag:#d9d4fa;
  --d-ink:#4b3a5c;    --n-ink:#ffffff;
  --d-tagInk:#4b3a5c; --n-tagInk:#2c2560;
  --d-veil:#ffffff;   --n-veil:#1a1250;    /* 夜晚蓋在行星上的一層薄藍 */
  --d-dot:#ffffff;    --n-dot:#fff6d8;     /* 背景小星點 */

  /* —— 太陽（紙燈籠） —— */
  --sun1:#ff8a3a; --sun2:#ffb030; --sun3:#ffd24a; --sun4:#ffe27a; --sun5:#fff3a8; --sunGlow:#ffcf6a;
  /* —— 行星（紙色） —— */
  --mer1:#bcb0a4; --mer2:#9a8e82; --mer3:#d8cec2;
  --ven1:#f2cf8a; --ven2:#e8a85c; --ven3:#fff1c8;
  --ear1:#4f9be0; --ear2:#6cc07a; --ear3:#ffffff; --ear4:#8fc4f0;
  --moon1:#efe9dc; --moon2:#d2c8b6;
  --mar1:#e2764a; --mar2:#b9502e; --mar3:#f3a27c;
  --jup1:#f6e2c0; --jup2:#e3b27e; --jup3:#c98a5a; --jup4:#f2cfa0; --jup5:#d9583e;
  --sat1:#f4dc9a; --sat2:#e6c07a; --ring1:#e9c98c; --ring2:#c9a46a; --ring3:#f6e6c0;
  --ura1:#9fe0e0; --ura2:#7cc9cf; --ura3:#d8f6f4;
  --nep1:#4a6fe0; --nep2:#3552c0; --nep3:#8fb0ff;
  --rock1:#a8968a; --rock2:#8a7a70; --rock3:#c8b8aa;
  /* —— 角色 —— */
  --whale1:#6a7fd6; --whale2:#9fb0f0; --whale3:#e8ecff;
  --suit:#ffffff; --suit2:#d9dde8; --visor:#5a6fd0; --visorHi:#bfe0ff;
  --rabbit:#ffffff; --rabbit2:#ffc6cf;
  --rocket1:#ff6b5e; --rocket2:#fff8ee; --rocket3:#5ab0e8; --flame1:#ffd24a; --flame2:#ff8a3a;
  --rover:#e9e4da; --rover2:#6a6a7a;
  --star1:#ffd86b; --star2:#ffb8c8; --star3:#bfe8ff; --star4:#fff3b0;
  --kite1:#ffd36b; --kite2:#ff9fb8; --kite3:#9fd8ff;
  --glow:#fff3b0;
  --shadowC:#2a1840;

  /* —— 頁面介面 —— */
  --page-bg:#f6efe8; --page-fg:#3e3150; --page-muted:#76687f;
  --ui-surface:#fffdf9; --ui-accent:#e0607e; --ui-accent-2:#5a63c8;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-hand:"IansuiSub","Iansui","Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS",cursive;
}

<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {

        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });

           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */

  const W = window;

    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);

  const btns = [];

  };
})();

// 一顆紙行星：底色圓＋內層亮紙＋花紋（裁在圓內）＋背光側的暗紙
function paperBall(g, R, base, hi) {
  el('circle', { r: R, fill: `var(--${base})` }, g);
  const inner = el('g', { 'clip-path': clipCircle(R) }, g);
  el('circle', { r: R * .86, cx: -R * .1, cy: -R * .1, fill: `var(--${hi})`, opacity: .55 }, inner);
  return inner;
}
function shadeOn(inner, R) {
  el('path', { d: `M${-R * 2} ${-R * 2}H${R * 2}V${R * 2}H${-R * 2}Z M${-R * .36} ${-R}a${R} ${R} 0 1 0 0.01 0Z`, 'fill-rule': 'evenodd', fill: '#2a1840', opacity: .2, transform: `translate(${-R * .0} 0)` }, inner);
}
// 會捲動的花紋：放兩份，往左平移就像在自轉
function scroller(inner, W, draw) {
  const g = el('g', {}, inner);
  draw(g, 0); draw(g, W);
  return { g, W };
}

  rayA.setAttribute('transform', `rotate(${f1(T * 6 + sunBurst * 90)}) scale(${f1(sScale)})`);
  rayB.setAttribute('transform', `rotate(${f1(360 / 28 - T * 9 - sunBurst * 120)}) scale(${f1(sScale * (1 + Math.sin(T * 2) * .03))})`);
  scal.setAttribute('transform', `rotate(${f1(T * 3)})`);
  sunSwirl.setAttribute('transform', `rotate(${f1(-T * 8)})`);
  sunGlow.setAttribute('r', f1(270 + Math.sin(T * 1.3) * 10 + sunBurst * 60));
  sunGlow.setAttribute('opacity', f1(.75 + nf * .25));

  // 軌道緞帶亮光（音樂盒）
  PL.forEach(p => { if (p.flash) { p.flash = Math.max(0, p.flash - dt * 1.6); p.orbGlow.setAttribute('opacity', f1(p.flash * .7)); p.glow.setAttribute('opacity', f1(p.flash)); } });

  // 行星：沿著軌道上下擺動、跳躍、滑過時浮起
  PL.forEach(p => {
    const dy = p.amp * Math.sin(T * p.sp * .55 + p.ph);
    const th = Math.asin(clamp(dy / p.r, -1, 1));
    p.x = SX + p.r * Math.cos(th); p.y = SY + p.r * Math.sin(th);
    p.jump = Math.max(0, p.jump - dt * 2.4);
    const jy = -Math.sin(Math.min(1, p.jump) * Math.PI) * 18;
    p.hover += ((p.hov ? 1 : 0) - p.hover) * Math.min(1, dt * 8);
    p.g.setAttribute('transform', `translate(${f1(p.x)} ${f1(p.y)})`);
    p.lift.setAttribute('transform', `translate(0 ${f1(jy - p.hover * 6)}) scale(${f1(1 + p.hover * .06 + Math.min(1, p.jump) * .05)})`);
    p.act = Math.max(0, p.act - dt);
    const boost = 1 + p.act * 6;
    if (p.scr) { const o = (T * p.scr.sp * boost) % p.scr.W; p.scr.g.setAttribute('transform', p.scr.vy ? `translate(0 0)` : `translate(${f1(-((o + p.scr.W) % p.scr.W))} 0)`); }
    if (p.cl) p.cl.g.setAttribute('transform', `translate(${f1(-((T * p.cl.sp * boost) % p.cl.W))} 0)`);
    if (p.bands) p.bands.forEach(b => { const o = ((T * b.sp * boost) % b.W + b.W) % b.W; b.g.setAttribute('transform', `translate(${f1(-o)} 0)`); });
    if (p.spot) { const W = p.R * 3, o = ((T * 10 * boost) % W); p.spot.setAttribute('transform', `translate(${f1(p.R * 1.3 - o)} ${f1(p.R * .3)}) rotate(${f1(T * 40 * boost)})`); }
    // 名牌跟著行星、輕輕搖晃
    const ty = p.y + p.R + (p.id === 'saturn' ? 34 : 14) + jy;
    p.tagLine.setAttribute('x1', f1(p.x)); p.tagLine.setAttribute('y1', f1(p.y + p.R * .9 + jy)); p.tagLine.setAttribute('x2', f1(p.x)); p.tagLine.setAttribute('y2', f1(ty));
    p.tagCard.setAttribute('transform', `translate(${f1(p.x)} ${f1(ty)}) rotate(${f1(Math.sin(T * 1.6 + p.i) * 6)})`);
  });
  tagL.setAttribute('opacity', tagsOn ? 1 : 0);
  // 土星：環上的冰塊轉圈、太空人釣星星
  {
    const S = PM.saturn, R = S.R;
    S.iceDots.forEach((o, i) => { o.a += dt * (.6 + S.act * 4); const k = 2.1; const x = Math.cos(o.a) * R * k, y = Math.sin(o.a) * R * k * .58; o.e.setAttribute('cx', f1(x)); o.e.setAttribute('cy', f1(y)); o.e.setAttribute('opacity', Math.sin(o.a) > 0 ? .9 : 0); });
    S.reel = Math.max(0, S.reel - dt * .45);
    const rl = S.reel > 0 ? Math.sin(Math.min(1, (1 - S.reel) * 1.6) * Math.PI) : 0;
    const len = 30 + Math.sin(T * 1.4) * 4 - rl * 36;
    S.line.setAttribute('y2', f1(-18 + len + 18 - 18));
    S.fishStar.setAttribute('transform', `translate(26 ${f1(-18 + len + 4)}) rotate(${f1(Math.sin(T * 2) * 15 + rl * 360)})`);
  }
  // 天王星：躺著的呼拉圈（直立的光環）跟著搖擺
  {
    const U = PM.uranus, R = U.R; U.roll += dt * (.8 + U.act * 6);
    const rx = R * .45, ry = R * 1.75, w = Math.sin(U.roll) * 8;
    U.hoop.setAttribute('transform', `rotate(${f1(w)})`); U.hoopF.setAttribute('transform', `rotate(${f1(w)})`);
    U.scr.g.setAttribute('transform', `translate(0 ${f1(-((T * (8 + U.act * 40)) % (R * 2.4)))})`);
  }
  // 海王星：點了會吹出風
  { const N = PM.neptune; N.wind.setAttribute('opacity', f1(Math.min(1, N.act))); N.wind.setAttribute('transform', `translate(${f1(-(1 - N.act / 2) * 20)} 0)`); }
  // 月亮與月兔：繞地球公轉，在後面時移到地球後方
  moon.a += dt * .7 * sp;
  {
    const x = Math.cos(moon.a) * moon.d, y = Math.sin(moon.a) * moon.d * .35;
    const want = Math.sin(moon.a) < 0 ? E.moonB : E.moonF;
    if (moon.g.parentNode !== want) want.appendChild(moon.g);
    moon.g.setAttribute('transform', `translate(${f1(x)} ${f1(y)})`);
    moon.hop = Math.max(0, moon.hop - dt * 1.8);
    moon.rab.setAttribute('transform', `translate(0 ${f1(-moon.R - 3 - Math.abs(Math.sin(moon.hop * Math.PI * 2)) * 12)})`);
  }
  // 火星探測車：沿著表面繞（順時針前進，車頭朝前）
  {
    rover.boost = Math.max(0, rover.boost - dt * .4);
    rover.a += dt * (.35 + rover.boost * 2.2) * sp;
    const R = MA.R + 1, x = Math.cos(rover.a) * R, y = Math.sin(rover.a) * R;
    rover.g.setAttribute('transform', `translate(${f1(x)} ${f1(y)}) rotate(${f1(rover.a * 180 / Math.PI + 90)})`);
    const want = Math.cos(rover.a) > .2 && Math.sin(rover.a) > 0 ? MA.moonB : MA.moonF;
    if (rover.g.parentNode !== MA.moonF) MA.moonF.appendChild(rover.g); void want;
  }
  // 小行星帶：紙石頭漂浮、慢慢自轉
  ROCKS.forEach(o => {
    const a = o.a + Math.sin(T * .2 + o.ph) * .02, y0 = Math.sin(T * .9 + o.ph) * 3;
    o.g.setAttribute('transform', `translate(${f1(SX + Math.cos(a) * o.r)} ${f1(SY + Math.sin(a) * o.r + y0)}) rotate(${f1(o.rot + T * o.sp)})`);
  });
  // 掛著的紙星星：輕輕擺動、被點到時轉一圈
  HANG.forEach(h => {
    h.sw = Math.max(0, h.sw - dt * .5); h.spin = Math.max(0, h.spin - dt * .8);
    const ang = Math.sin(T * 1.1 + h.ph) * 3 + Math.sin(T * 6) * h.sw * 18;
    h.g.setAttribute('transform', `translate(${h.x} 0) rotate(${f1(ang)})`);
    h.s.setAttribute('transform', `translate(0 ${h.len}) rotate(${f1((1 - h.spin) * 360 * (h.spin > 0 ? 1 : 0))}) scale(${f1(1 + h.spin * .3)})`);
  });
  // 太空鯨魚：往左游，尾巴擺動
  whale.x -= dt * 16 * sp; if (whale.x < -200) whale.x = 1800;
  whale.y = 128 + Math.sin(T * .5) * 18;
  whale.g.setAttribute('transform', `translate(${f1(whale.x)} ${f1(whale.y)}) rotate(${f1(Math.cos(T * .5) * 3)})`);
  whale.tail.setAttribute('transform', `translate(118 -6) rotate(${f1(Math.sin(T * 2.2) * 12)})`);
  if (whale.spout > 0) {
    whale.spout -= dt;
    if (Math.random() < dt * 30) { const e = el('path', { d: starD(rand(3, 7), .5), fill: `var(--star${1 + Math.floor(rand(0, 4))})`, transform: `translate(${f1(whale.x - 40)} ${f1(whale.y - 50)})` }, $('fx')); drops.push({ e, x: whale.x - 40 - ox * 10, y: whale.y - 50, vx: rand(-60, 60), vy: rand(-170, -100), life: 2, rot: 0, g: 160 }); }
  }
  // 紙彗星風箏：斜斜飛過，尾巴跟在後面（頭朝前進方向）
  KITES.forEach((k, i) => {
    k.t += dt * k.sp * sp; if (k.t > 1.25) k.t = -.15;
    const x = lerp(-80, 1680, k.t), y = (i ? 60 : 230) + Math.sin(k.t * 9 + i) * 26 - k.t * (i ? -40 : 90);
    k.hist.unshift([x, y]); if (k.hist.length > 26) k.hist.pop();
    let d = ''; k.hist.forEach(([hx, hy], j) => d += (j ? 'L' : 'M') + f1(hx - j * 2) + ' ' + f1(hy + Math.sin(T * 5 + j * .6) * j * .5));
    k.tail.setAttribute('d', d); k.tail2.setAttribute('d', d);
    k.head.setAttribute('transform', `translate(${f1(x)} ${f1(y)}) rotate(${f1(T * 60)})`);
  });
  // 夜晚的流星
  if (nf > .6 && !reduced) { shootT -= dt; if (shootT < 0) { shootT = rand(3, 7); shoot(); } }
  // 掉落的紙星星與彩帶
  [drops, rocket.trail].forEach(arr => {
    for (let i = arr.length - 1; i >= 0; i--) {
      const o = arr[i]; o.life -= dt; o.vy += (o.g ?? 30) * dt; o.x += o.vx * dt; o.y += o.vy * dt; o.rot += dt * 120;
      o.e.setAttribute('transform', `translate(${f1(o.x)} ${f1(o.y)}) rotate(${f1(o.rot)})`); o.e.setAttribute('opacity', f1(clamp(o.life, 0, 1)));
      if (o.life <= 0 || o.y > 640) { o.e.remove(); arr.splice(i, 1); }
    }
  });
  // 表演
  if (show) { show.t += dt; if (show.type === 'box') updBox(dt); else updRocket(dt); }
  syncShadows();
  requestAnimationFrame(frame);
}
function shoot() {
  const x = rand(300, 1500), y = rand(20, 160);
  const g = el('path', { d: `M${f1(x)} ${f1(y)}l-90 40`, stroke: 'var(--glow)', 'stroke-width': 2.5, 'stroke-linecap': 'round', 'stroke-dasharray': '100 200', 'stroke-dashoffset': 100 }, $('glows'));
  const t0 = performance.now();
  const step = () => { const k = (performance.now() - t0) / 900; if (k >= 1) { g.remove(); return; } g.setAttribute('stroke-dashoffset', f1(100 - k * 200)); requestAnimationFrame(step); };
  step();
}

/* ---------------- ⑤ 互動：點擊 ---------------- */
function keyable(node, fn) {
  node.addEventListener('click', e => { e.stopPropagation(); fn(e); });
  node.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(e); } });
}
PL.forEach(p => {
  keyable(p.g, () => {
    p.jump = 1; p.flash = 1; p.act = 1.6;
    SFX.note(p.note);
    if (p.id === 'neptune') SFX.wind();
    if (p.id === 'jupiter' || p.id === 'venus') SFX.swirl();
    if (p.id === 'mars') { rover.boost = 1.5; SFX.rover(); }
    bubble(p.x, p.y - p.R - 40, `${p.name}：${p.fact}`);
  });
  p.g.addEventListener('pointerenter', () => p.hov = true);
  p.g.addEventListener('pointerleave', () => p.hov = false);
});
keyable(moon.g, () => { moon.hop = 1; SFX.hop(); bubble(E.x, E.y - 90, '月兔跳跳～月球永遠同一面朝地球'); });
keyable(PM.saturn.astro, () => { PM.saturn.reel = 1; SFX.reel(); const S = PM.saturn; bubble(S.x + 80, S.y - 40, '釣到一顆星星啦！'); });
keyable(sunL, () => { sunBurst = 1; SFX.sun(); bubble(SX + 150, SY - 150, '太陽：裝得下 130 萬個地球！'); });
keyable(beltL, () => { SFX.chime(84); ROCKS.forEach(o => o.sp *= -1.2); bubble(SX + 580, SY + 200, '小行星帶：好多太空石頭在漂～'); });
keyable(whale.g, () => { whale.spout = 1.6; SFX.whale(); bubble(whale.x - 30, whale.y - 90, '噗～噴出一串星星！'); });
HANG.forEach((h, i) => keyable(h.g, () => { h.spin = 1; h.sw = 1; SFX.chime([84, 86, 88, 91, 93][i % 5]); }));
// 點天空：掉下一顆紙星星
svg.addEventListener('click', e => {
  const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 1600, y = (e.clientY - r.top) / r.height * 600;
  const e2 = el('path', { d: starD(rand(6, 10), .48), fill: `var(--star${1 + Math.floor(rand(0, 4))})` }, $('fx'));
  drops.push({ e: e2, x, y, vx: rand(-20, 20), vy: -40, life: 3, rot: 0, g: 120 });
  SFX.drop();
});
svg.addEventListener('pointermove', e => { const r = svg.getBoundingClientRect(); mx = (e.clientX - r.left) / r.width * 1600; my = (e.clientY - r.top) / r.height * 600; });
svg.addEventListener('pointerleave', () => { mx = 800; my = 300; });

/* ---------------- ⑤ 互動：控制列 ---------------- */
btnBox.addEventListener('click', () => { if (show && show.type === 'box') endShow(true); else startShow('box'); });
btnRocket.addEventListener('click', () => { if (show && show.type === 'rocket') endShow(true); else startShow('rocket'); });
$('btnTag').addEventListener('click', () => { tagsOn = !tagsOn; $('btnTag').setAttribute('aria-pressed', tagsOn); $('btnTag').textContent = tagsOn ? '名牌：開' : '名牌：關'; });
$('btnSound').addEventListener('click', () => {
  soundOn = !soundOn;
  $('btnSound').setAttribute('aria-pressed', soundOn); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  if (AC) {
    if (!soundOn) { master.gain.cancelScheduledValues(AC.currentTime); master.gain.setValueAtTime(0, AC.currentTime); stopMusic(true); if (curSfx) { curSfx.disconnect(); curSfx = null; } }
    else master.gain.setValueAtTime(.9, AC.currentTime);
  }
});
const setAuto = on => { auto = on; $('btnAuto').setAttribute('aria-pressed', on); };
$('btnDay').addEventListener('click', () => { hour = 10.5; setAuto(false); });
$('btnNight').addEventListener('click', () => { hour = 22; setAuto(false); });
$('btnAuto').addEventListener('click', () => setAuto(!auto));
range.addEventListener('input', () => { hour = range.value / 1000 * 24; setAuto(false); });
mq.addEventListener && mq.addEventListener('change', e => { reduced = e.matches; });
setAuto(auto);
window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
window.addEventListener('pointerdown', () => document.body.classList.remove('kbd'));
requestAnimationFrame(t => { last = t; frame(t); });
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show && show.type,
  btn: { box: 'btnBox', rocket: 'btnRocket' },
  stop: () => endShow(true)
});
/* /ShowStop */
})();
</script>
