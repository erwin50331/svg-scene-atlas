<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>塔林舊城</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-39 塔林舊城｜復古石版海報風
   地點：愛沙尼亞首都塔林。從上城（Toompea 座堂山）的觀景台往下看：
        一片紅瓦屋頂的下城、中世紀城牆與圓錐頂塔樓、
        聖奧拉夫教堂的高尖塔、聖靈教堂（牆上有藍底金框的古老時鐘）、
        市政廳與塔頂的「老湯瑪士」風向標、聖尼古拉教堂，
        遠處是港口、往返赫爾辛基的渡輪與芬蘭灣。
   風格重點（1930 年代石版印刷旅遊海報）：
        - 少色套印：只用幾種褪色油墨平塗，不用漸層
        - 套版偏移：墨線版刻意跟色塊錯開 2px，露出米白紙縫
        - 粗墨線輪廓、斜線與網點陰影、天空與海面是硬邊色帶
        - 泛黃紙張、斑駁水漬、折痕、印刷顆粒、不規則的紙邊
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），部分另有 --k-名稱（晨昏）。
   JS 會依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）兩個 class。
   ========================================================= */
:root{
  color-scheme: light;

  /* —— 紙與油墨（不隨日夜變化） —— */
  --paper:#efe2c2;      /* 泛黃海報紙 */
  --paper-dk:#d9c49a;   /* 紙邊陰影、折痕 */
  --stain:#b98a4a;      /* 水漬 */
  --ink:#26303d;        /* 墨線版 */
  --red:#c2492e;        /* 磚紅 */
  --ochre:#d9a441;      /* 赭黃 */
  --sage:#7f9c74;       /* 灰綠 */
  --teal:#3e7a7e;       /* 海青 */
  --cream:#f3e8cc;
  --rose:#d88a6e;
  --navy:#2f4766;

  /* —— 天空：四道硬邊色帶（由上而下） —— */
  --d-sky-1:#8fbab6; --k-sky-1:#4b5b86; --n-sky-1:#17213a;
  --d-sky-2:#acccbf; --k-sky-2:#b86a6c; --n-sky-2:#1d2a47;
  --d-sky-3:#cadcc4; --k-sky-3:#e3955a; --n-sky-3:#253554;
  --d-sky-4:#e7dcb6; --k-sky-4:#efbf72; --n-sky-4:#2f4064;
  --d-cloud:#f3e8cc;  --k-cloud:#f3c79a; --n-cloud:#34446a;
  --d-cloud-sh:#cdbf9c; --n-cloud-sh:#26324f;
  --d-sunring:#f3e3a8; --k-sunring:#f6c47a; --n-sunring:#2b3a5e;

  /* —— 芬蘭灣、島、港口、新城區 —— */
  --d-sea-1:#5b9696; --k-sea-1:#7d6c88; --n-sea-1:#18263f;
  --d-sea-2:#3e7a7e; --k-sea-2:#5d5a7a; --n-sea-2:#142037;
  --d-sea-hi:#d6e4cf; --k-sea-hi:#f2c48a; --n-sea-hi:#6f85ad;
  --d-island:#6f8f7c; --n-island:#1b293c;
  --d-farcity:#c2b996; --n-farcity:#2b3654;
  --d-farcity-2:#a4a98c; --n-farcity-2:#232e4a;
  --d-port:#d9cba6;   --n-port:#3a3d56;

  /* —— 下城：屋頂、外牆、城牆 —— */
  --d-roof:#c2492e;   --n-roof:#63302f;
  --d-roof-2:#d4693a; --n-roof-2:#723b2f;
  --d-roof-sh:#93372a; --n-roof-sh:#45202a;
  --d-h1:#efe2c2; --n-h1:#555670;   /* 米白 */
  --d-h2:#ddb05a; --n-h2:#655842;   /* 赭黃 */
  --d-h3:#a9b78f; --n-h3:#404f4f;   /* 灰綠 */
  --d-h4:#dca184; --n-h4:#644a50;   /* 玫瑰 */
  --d-h5:#b4ccc4; --n-h5:#3f4d66;   /* 淡藍 */
  --d-wall:#e2d3ae;   --n-wall:#5e5c70;      /* 城牆石灰岩 */
  --d-wall-sh:#c2ae86; --n-wall-sh:#45435a;
  --d-copper:#4f7d70; --n-copper:#22393d;    /* 銅綠尖頂 */
  --d-copper-hi:#7aa18b; --n-copper-hi:#2e4b4c;
  --d-stone:#ddd0b0;  --n-stone:#c49c62;     /* 地標石牆：夜晚打上暖色投射燈 */
  --d-stone-sh:#bba985; --n-stone-sh:#8a6640;
  --d-dark:#2f3a45;   --n-dark:#1a2030;      /* 聖靈教堂的深色尖塔、市政廳屋頂 */
  --d-win:#3b4656;    --n-win:#ffd36a;       /* 會亮燈的窗 */
  --d-winoff:#3b4656; --n-winoff:#283044;
  --d-tree:#5f7d55;   --n-tree:#1d2e2a;
  --d-tree-2:#82a073; --n-tree-2:#283d34;
  --d-tree-dk:#435e42; --n-tree-dk:#142320;

  /* —— 前景：上城觀景台 —— */
  --d-pave:#d8c69e;   --n-pave:#3b3b4e;
  --d-parapet:#d0bd93; --n-parapet:#4b485c;
  --d-parapet-sh:#a99569; --n-parapet-sh:#353347;
  --d-shadow:#26303d2a; --n-shadow:#0000006b;

  /* —— 光源 —— */
  --sun:#f6dd8e;
  --moon:#f3e8cc;
  --star:#f3e8cc;
  --lamp:#ffd36a;

  /* —— 煙火（只用海報油墨色） —— */
  --fw-1:#e0603e; --fw-2:#f2c95a; --fw-3:#8fd0c4; --fw-4:#f3e8cc; --fw-5:#e89a8a;

  /* —— 天氣 —— */
  --d-fog:#e8dfc6;  --n-fog:#4a5576;
  --d-rainc:#3e5a74; --n-rainc:#9eb0d4;
  --wx-cloud:#7d8a8a; --wx-fog:#e8e0c8; --wx-rain:#35455c; --wx-snow:#e6ecee;

  /* —— 角色 —— */
  --skin-1:#f0cba4; --skin-2:#d8a074; --skin-3:#a8714b; --skin-4:#6d4932;
  --hair-1:#2a2226; --hair-2:#6b4428; --hair-3:#d8ae62; --hair-4:#b9b3a8;
  --coat-1:#c2492e; --coat-2:#2f4766; --coat-3:#d9a441; --coat-4:#3e7a7e; --coat-5:#7f9c74; --coat-6:#4a4a52;
  --pants-1:#26303d; --pants-2:#5c5248;
  --umb-1:#26303d; --umb-2:#c2492e; --umb-3:#d9a441; --umb-4:#3e7a7e;

  /* —— 頁面介面 —— */
  --page-bg:#ece3cf; --page-fg:#26303d; --page-muted:#6c6556;
  --ui-surface:#f6efde; --ui-line:#cdbd98; --ui-accent:#c2492e;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:6px;overflow:hidden;background:var(--paper);line-height:0;box-shadow:0 2px 10px #0000002a}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:10px;padding:10px 14px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
.panel button.big{border-color:var(--red);color:#fff;background:var(--red);font-weight:700}
.panel button.big.on{background:var(--ochre);border-color:var(--ochre);color:var(--ink)}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
/* 畫面內可點物件：滑鼠點不顯示外框，用鍵盤 Tab 時才顯示 */
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid var(--ui-accent);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 內的樣式 ---------- */
/* 墨線版：粗墨線，和色塊錯開一點（套版偏移） */
#scene .key{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
#scene .key-thin{fill:none;stroke:var(--ink);stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round}
#scene .clickable,#scene [role="button"]{cursor:pointer}
#scene .bubble rect{fill:var(--cream);stroke:var(--ink);stroke-width:2}
#scene .bubble text{fill:var(--ink);font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .bubble .pop{animation:pop var(--dur,1.6s) ease-out forwards}
@keyframes pop{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  #scene .bubble .pop{animation:none}
}
</style>
<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。
   想恢復完整版，刪掉這整段 <style id="pure-art"> 即可。
   ========================================================= */
html,body{height:100%;margin:0!important;overflow:hidden}
body{display:flex!important;align-items:center;justify-content:center;padding:0!important}
body>.wrap{width:100%!important;max-width:min(100vw,calc(100vh * 8 / 3))!important;
  margin:0!important;padding:0!important;gap:0!important;display:block!important}
body>.wrap>:not(.stage){display:none!important}
body>.wrap>.stage{width:100%!important;max-width:100%!important;margin:0!important;
  border:0!important;border-radius:0!important;box-shadow:none!important}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：天空 → 煙火 → 芬蘭灣與船 → 港口、新城區
       → 下城屋頂、城牆、教堂與市政廳 → 觀景台人物 → 畫框樹
       → 天氣 → 紙張質感（水漬、折痕、顆粒、紙邊）
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="復古石版印刷旅遊海報風格的塔林舊城插畫動畫：從座堂山觀景台往下看，一片紅瓦屋頂與粉彩外牆的老房子，左邊聖奧拉夫教堂的銅綠尖塔高聳入天，中間是白色的聖靈教堂和市政廳細長的塔樓與老湯瑪士風向標，右邊是聖尼古拉教堂；中世紀城牆上有紅色圓錐頂塔樓；遠方芬蘭灣上渡輪與帆船來往；前景觀景台上有遊客、彈奏卡內琴的街頭樂手與煙囪清潔工">
    <defs>
      <!-- 網點：陰影與色帶交界 -->
      <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
        <circle cx="3" cy="3" r="1.2" style="fill:var(--ink)" opacity=".35"/>
      </pattern>
      <pattern id="dotsLight" width="6" height="6" patternUnits="userSpaceOnUse">
        <circle cx="3" cy="3" r="1.2" style="fill:var(--cream)" opacity=".6"/>
      </pattern>
      <!-- 斜線陰影：石版畫的手繪排線 -->
      <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="5" style="stroke:var(--ink)" stroke-width="1.3" opacity=".42"/>
      </pattern>
      <pattern id="hatchLight" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
        <line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--ink)" stroke-width="1" opacity=".22"/>
      </pattern>
      <!-- 觀景台石板 -->
      <pattern id="paving" width="52" height="22" patternUnits="userSpaceOnUse">
        <path d="M0 .5H52M.5 0V11M26.5 11V22M0 11.5H52" style="stroke:var(--ink)" stroke-width="1" opacity=".25" fill="none"/>
      </pattern>
      <!-- 矮牆的石塊 -->
      <pattern id="blocks" width="40" height="12" patternUnits="userSpaceOnUse">
        <path d="M0 .5H40M.5 0V6M20.5 6V12M0 6.5H40" style="stroke:var(--ink)" stroke-width="1" opacity=".3" fill="none"/>
      </pattern>
      <!-- 印刷顆粒與紙張水漬：由程式用 canvas 產生後填入 href -->
      <pattern id="grainPat" width="240" height="240" patternUnits="userSpaceOnUse">
        <image id="grainImg" width="240" height="240" href=""/>
      </pattern>
      <clipPath id="frameClip"><rect x="0" y="0" width="1600" height="600"/></clipPath>
    </defs>

    <g clip-path="url(#frameClip)">
    <!-- ===== 場景：天空 ===== -->
    <g id="skyBands"></g>
    <rect id="skyHit" x="0" y="0" width="1600" height="212" fill="transparent" class="clickable" tabindex="0" role="button" aria-label="天空：白天飛過海鷗，夜晚放一發煙火"/>
    <g id="stars" pointer-events="none"></g>
    <g id="sun" pointer-events="none"></g>
    <g id="moon" pointer-events="none"></g>
    <g id="clouds" pointer-events="none"></g>
    <g id="overcast" pointer-events="none" opacity="0"></g>
    <g id="plane" pointer-events="none"></g>
    <g id="fireworks" pointer-events="none"></g>
    <g id="gulls" pointer-events="none"></g>

    <!-- ===== 場景：芬蘭灣、船、港口（滑鼠移動有視差） ===== -->
    <g id="parFar">
      <g id="sea"></g>
      <g id="seaWaves" pointer-events="none"></g>
      <g id="ripples" pointer-events="none"></g>
      <g id="boatsFar"></g>
      <g id="tallShip" pointer-events="none"></g>
      <g id="boatsNear"></g>
      <g id="spray" pointer-events="none"></g>
      <g id="port"></g>
      <g id="farCity"></g>
    </g>
    <g id="fogFar" pointer-events="none" opacity="0"></g>

    <!-- ===== 場景：下城（屋頂、城牆、地標） ===== -->
    <g id="parMid">
      <g id="rowBack"></g>
      <g id="townWall"></g>
      <g id="olaf"></g>
      <g id="rowMid"></g>
      <g id="holySpirit"></g>
      <g id="townHall"></g>
      <g id="nicholas"></g>
      <g id="rowFront"></g>
      <g id="sweep"></g>
      <g id="smoke" pointer-events="none"></g>
      <g id="daws" pointer-events="none"></g>
      <g id="bells" pointer-events="none"></g>
    </g>
    <g id="fogMid" pointer-events="none" opacity="0"></g>

    <!-- ===== 場景：前景觀景台 ===== -->
    <g id="parNear">
      <g id="platform"></g>
      <g id="garland" pointer-events="none" opacity="0"></g>
      <g id="props"></g>
      <g id="walkers"></g>
      <g id="pigeons"></g>
      <g id="frameTree"></g>
    </g>

    <!-- ===== 天氣與氛圍 ===== -->
    <g id="rain" pointer-events="none" opacity="0"></g>
    <g id="snow" pointer-events="none" opacity="0"></g>
    <g id="fogNear" pointer-events="none" opacity="0"></g>
    <g id="wxTint" pointer-events="none"></g>
    <g id="notes" pointer-events="none"></g>
    <g id="bubbles" pointer-events="none"></g>
    </g>

    <!-- ===== 海報紙張：水漬、折痕、印刷顆粒、不規則紙邊 ===== -->
    <image id="stainImg" x="0" y="0" width="1600" height="600" preserveAspectRatio="none" href="" opacity=".55" pointer-events="none"/>
    <rect x="0" y="0" width="1600" height="600" fill="url(#grainPat)" pointer-events="none"/>
    <g id="creases" pointer-events="none"></g>
    <path id="paperEdge" fill-rule="evenodd" style="fill:var(--paper)" pointer-events="none"/>
    <path id="paperEdgeLine" class="key-thin" pointer-events="none" opacity=".7"/>
  </svg>
  </figure>

  <!-- ===== 互動：控制列 ===== -->
  <div class="panel">
    <button id="btnFest" class="big" type="button">🥁 古城節慶</button>
    <button id="btnSea" class="big" type="button">⛵ 海洋節帆船</button>
    <button id="btnWeather" type="button">天氣：晴</button>
    <button id="btnSound" type="button" aria-pressed="true">🔊 聲音：開</button>
    <button id="btnMusic" type="button" aria-pressed="false">♪ 配樂：關</button>
    <button id="btnDay" type="button">☀ 白天</button>
    <button id="btnNight" type="button">☾ 夜晚</button>
    <button id="btnAuto" type="button" aria-pressed="true">自動播放</button>
    <label class="timebox" for="timeRange">
      <span>時間</span>
      <input id="timeRange" type="range" min="0" max="1000" value="440">
      <span class="clock" id="clock">10:30</span>
    </label>
  </div>
  <ul class="hint">
    <li><b>古城節慶</b>：風笛手與民俗舞者上場，城牆掛起彩旗。</li>
    <li><b>海洋節</b>：高桅帆船入港，夜晚加放煙火。</li>
    <li><b>點一點</b>：教堂時鐘、老湯瑪士、渡輪、帆船、煙囪清潔工、樂手、行人。</li>
    <li><b>滑鼠</b>：移動有視差，劃過海面起漣漪。</li>
    <li><b>天氣</b>：晴、陰、霧、雨、雪輪流切換。</li>
  </ul>
</main>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;

<script>
/* =========================================================

/* ---------------- ② 場景：下城房子（三排，由遠到近） ----------------
   每棟房子：粉彩外牆、紅瓦屋頂（山牆朝外或屋簷朝外兩種）、窗戶、煙囪；
   右側加一條斜線陰影（光從左邊來） */
const chimneys = [];
function house(g, x, by, w, h, o) {
  const fc = 'f-h' + o.c, rc = o.r2 ? 'f-roof-2' : 'f-roof';
  const top = by - h;
  if (o.gable) {
    // 山牆朝外：先畫往後退的屋頂斜面，再畫五邊形的山牆立面
    const rh = w * .62, ax = x + w / 2, ay = top - rh, dx = w * .38, dy = rh * .32;
    P(g, `M${f1(ax)} ${f1(ay)} L${f1(ax + dx)} ${f1(ay - dy)} L${f1(x + w + dx)} ${f1(top - dy)} L${f1(x + w)} ${f1(top)} Z`, rc, 'key-thin');
    el('path', { d: `M${f1(ax)} ${f1(ay)} L${f1(ax + dx)} ${f1(ay - dy)} L${f1(x + w + dx)} ${f1(top - dy)} L${f1(x + w)} ${f1(top)} Z`, fill: 'url(#hatch)' }, g);
    P(g, `M${f1(x)} ${by} V${f1(top)} L${f1(ax)} ${f1(ay)} L${f1(x + w)} ${f1(top)} V${by} Z`, fc, 'key-thin');
    // 山牆上的小閣樓窗或吊貨梁（中世紀商人屋的特徵）
    if (o.s > .7) el('rect', { x: f1(ax - 3), y: f1(ay + rh * .45), width: 6, height: 8, class: 'f-winoff' }, g);
    else el('path', { d: `M${f1(ax)} ${f1(ay + rh * .2)} v-4 h7`, class: 'key-thin', 'stroke-width': 1.6 }, g);
  } else {
    // 屋簷朝外：高聳的梯形紅瓦屋頂
    const rh = Math.min(w * .55, 40) * (o.s > .8 ? .8 : 1);
    P(g, `M${f1(x - 3)} ${f1(top)} L${f1(x + w * .16)} ${f1(top - rh)} L${f1(x + w * .84)} ${f1(top - rh)} L${f1(x + w + 3)} ${f1(top)} Z`, rc, 'key-thin');
    el('path', { d: `M${f1(x + w * .55)} ${f1(top - rh)} L${f1(x + w * .84)} ${f1(top - rh)} L${f1(x + w + 3)} ${f1(top)} L${f1(x + w * .62)} ${f1(top)} Z`, fill: 'url(#hatch)' }, g);
    // 屋頂上的老虎窗
    if (w > 46 && o.s < .5) { const dx = x + w * .4; P(g, `M${f1(dx)} ${f1(top - rh * .2)} V${f1(top - rh * .55)} L${f1(dx + 6)} ${f1(top - rh * .75)} L${f1(dx + 12)} ${f1(top - rh * .55)} V${f1(top - rh * .2)} Z`, fc, 'key-thin'); }
    P(g, `M${f1(x)} ${by} V${f1(top)} H${f1(x + w)} V${by} Z`, fc, 'key-thin');
  }
  // 窗戶：格狀排列，部分晚上亮燈
  const cols = Math.max(1, Math.floor((w - 6) / 13)), rows = Math.max(1, Math.floor((h - 8) / 17));
  const ww = Math.min(6, w / cols * .45), hh = 9 * o.k;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const wx = x + (c + .5) * w / cols - ww / 2, wy = top + 7 + r * 17 * o.k;
    if (wy + hh > by - 2) continue;
    el('rect', { x: f1(wx), y: f1(wy), width: f1(ww), height: f1(hh), class: srand() < .55 ? 'f-win' : 'f-winoff' }, g);
  }
  // 右側陰影排線
  el('rect', { x: f1(x + w * .78), y: f1(top), width: f1(w * .22), height: f1(h), fill: 'url(#hatch)', opacity: .8 }, g);
  // 煙囪
  if (o.chim) {
    const cx = x + w * (o.gable ? .75 : .7), cy = o.gable ? top - w * .3 : top - Math.min(w * .55, 40) * .7;
    P(g, `M${f1(cx)} ${f1(cy)} V${f1(cy - 14 * o.k)} H${f1(cx + 7 * o.k)} V${f1(cy + 2)} Z`, 'f-wall', 'key-thin');
    chimneys.push({ x: cx + 3.5 * o.k, y: cy - 14 * o.k, k: o.k, t: srand(0, 3), row: o.row });
  }
}
// 一排房子：skip 是要讓出位置給地標的 x 範圍
function row(id, by, hMin, hMax, wMin, wMax, k, x0, x1, skip = [], rowName) {
  const g = $(id);
  let x = x0;
  while (x < x1) {
    const w = srand(wMin, wMax), h = srand(hMin, hMax);
    const blocked = skip.some(([a, b]) => x + w > a && x < b);
    if (!blocked) house(g, x, by + srand(-4, 4), w, h, { c: 1 + Math.floor(srand(0, 5)), gable: srand() < .55, r2: srand() < .3, s: srand(), k, chim: srand() < .45, row: rowName });
    x += w + srand(-6, 2);
  }
}

const wallTowers = [];
function tower(g, x, by, w, h, cone) {
  const top = by - h;
  P(g, `M${f1(x - w / 2)} ${by} V${f1(top)} H${f1(x + w / 2)} V${by} Z`, 'f-wall');
  el('rect', { x: f1(x + w * .18), y: f1(top), width: f1(w * .32), height: f1(h), fill: 'url(#hatch)' }, g);
  [.3, .6].forEach(t => el('rect', { x: f1(x - 1.6), y: f1(top + h * t), width: 3.2, height: 9, class: 'f-winoff' }, g));
  P(g, `M${f1(x - w / 2 - 4)} ${f1(top + 2)} L${f1(x)} ${f1(top - cone)} L${f1(x + w / 2 + 4)} ${f1(top + 2)} Z`, 'f-roof');
  el('path', { d: `M${f1(x)} ${f1(top - cone)} L${f1(x + w / 2 + 4)} ${f1(top + 2)} L${f1(x + 3)} ${f1(top + 2)} Z`, fill: 'url(#hatch)' }, g);
  // 節慶時升起的小三角旗（平時收起）
  const fl = el('g', { class: 'towerFlag', transform: `translate(${f1(x)} ${f1(top - cone)})` }, g);
  el('line', { x1: 0, y1: 0, x2: 0, y2: -16, style: 'stroke:var(--ink)', 'stroke-width': 1.4 }, fl);
  const pen = el('path', { d: 'M0 -16 L14 -12 L0 -8 Z', style: `fill:var(--${['red', 'ochre', 'teal'][wallTowers.length % 3]})` }, fl);
  wallTowers.push({ fl, pen, up: 0 });
}

  const blobs = [[1600, 40, 110, 'tree-dk'], [1520, 70, 70, 'tree'], [1450, 30, 60, 'tree-2'], [1560, 160, 80, 'tree'], [1490, 160, 54, 'tree-2'], [1430, 110, 44, 'tree'], [1560, 260, 64, 'tree-2'], [1500, 300, 40, 'tree'], [1600, 330, 50, 'tree-dk']];

    const bg = el('g', { class: 'leafBlob', 'data-x': x, 'data-y': y }, leafG);
    let d = '';
    const n = 9;
    for (let i = 0; i <= n; i++) { const a = i / n * Math.PI * 2, rr = r * (i % 2 ? .86 : 1); d += (i ? 'L' : 'M') + f1(Math.cos(a) * rr) + ' ' + f1(Math.sin(a) * rr); }

/* ---------------- ④ 動畫：日夜循環 ----------------
   T.t：一天中的時間（0–1，0 = 午夜）。自動播放時一天約 150 秒 */
const DAY_SEC = 150;
const T = { t: 10.5 / 24, auto: true, target: null };

function clockText() {
  const h = T.t * 24, hh = Math.floor(h) % 24, mm = Math.floor((h - Math.floor(h)) * 60 + 1e-6);

  $('moon').style.display = mp > -.05 && mp < 1.05 ? '' : 'none';

  boats.forEach(b => b.el.querySelectorAll('.boatLamp').forEach(e => e.setAttribute('opacity', f1(nOn * .85))));
  applyLamps();

}

/* ---------------- ④ 動畫：天氣（晴、陰、霧、雨、雪；波羅的海邊天氣多變） ---------------- */
const WX_LIST = [['sun', '晴'], ['cloud', '陰'], ['fog', '霧'], ['rain', '雨'], ['snow', '雪']];

const wx = { cloud: 0, fog: 0, rain: 0, snow: 0 };

  for (const id in FOG) FOG[id].forEach(([y, h, o]) => el('rect', { x: 0, y, width: 1600, height: h, class: 'f-fog', opacity: o }, $(id)));
  ['cloud', 'fog', 'rain', 'snow'].forEach(k => { tints[k] = el('rect', { x: 0, y: 0, width: 1600, height: 600, style: `fill:var(--wx-${k})`, opacity: 0 }, $('wxTint')); });
}
function applyWeather(dt) {
  const key = WX_LIST[wxI][0];

/* ---------------- ④ 動畫：兩種表演（不能同時進行） ----------------
   fest：古城節慶——風笛手與民俗舞者在觀景台上表演，城牆塔樓升起三角旗、
         觀景台掛起彩旗串，寒鴉繞塔飛，老湯瑪士轉一圈（約 20 秒）

/* ---------------- ④ 動畫：每一格的更新 ---------------- */
let clock = 0, wind = 1, px = 0, pxCur = 0;
const plane = { x: -100, y: 60, t: 8 };
const puffs = [], ripples = [], sprays = [];
const thomas = { a: 0, spin: 0 };
let gullT = 3, lastRipple = 0, kannelT = 0, dawT = 6, puffT = 0;
function puff(x, y, s = 1, col = 'var(--cream)') {
  const c = el('circle', { cx: f1(x), cy: f1(y), r: f1(3 * s), style: `fill:${col};stroke:var(--ink);stroke-width:.8`, opacity: .85 }, $('smoke'));
  puffs.push({ el: c, x, y, s, t: 0, vx: rand(4, 12) });
}
function step(dt) {
  clock += dt;
  // —— 時間推進 ——
  if (T.target != null) {
    const d = (T.target - T.t + 1) % 1;
    const mv = Math.min(d, dt * .3);
    T.t = (T.t + mv) % 1;
    if (d - mv < .0005) { T.t = T.target; T.target = null; }
  } else if (T.auto && !show.on) {
    const prev = T.t * 24;
    T.t = (T.t + dt / DAY_SEC) % 1;
    const h = T.t * 24;
    if (prev < 14 && h >= 14) startFest(true);
    if (prev < 21.5 && h >= 21.5) startSea(true);
  }
  applyTime();
  const sunF = applyWeather(dt);
  wind = 1 + wx.rain * 1.4 + wx.snow * .4;

  // —— 表演計時 ——
  if (show.on) { show.t += dt; if (show.t >= show.dur) endShow(); }

  // —— 天空 ——
  if (night > .5) stars.forEach(s => s.el.setAttribute('opacity', f1(.4 + .6 * Math.sin(clock * s.sp + s.ph) ** 2)));
  clouds.forEach(c => { c.x += c.sp * dt * wind; if (c.x > 1760) c.x = -200; c.el.setAttribute('transform', `translate(${f1(c.x)} ${f1(c.y)}) scale(${f1(c.s)})`); });
  plane.t -= dt;
  if (plane.t < 0) { plane.x += 55 * dt; if (plane.x > 1720) { plane.x = -120; plane.t = rand(20, 34); plane.y = rand(40, 90); } }
  $('plane').setAttribute('transform', `translate(${f1(plane.x)} ${f1(plane.y)}) scale(.7)`);
  $('planeL').setAttribute('opacity', Math.sin(clock * 8) > .6 ? 1 : .15);
  gullT -= dt;
  if (gullT < 0 && night < .5 && wx.snow < .5) { gullT = rand(8, 16); const dir = Math.random() < .5 ? 1 : -1; for (let i = 0; i < 2 + (Math.random() * 2 | 0); i++) spawnGull(dir > 0 ? -30 - i * 40 : 1630 + i * 40, rand(90, 250), dir * rand(60, 90)); }
  for (let i = gulls.length - 1; i >= 0; i--) {
    const g = gulls[i]; g.t += dt; g.x += g.vx * dt; g.y += (g.vy + Math.sin(g.t * 1.4 + g.ph) * 10) * dt;
    g.el.firstChild.setAttribute('d', Math.sin(g.t * 9 + g.ph) > 0 ? 'M-10 0 Q-5 -6 0 0 Q5 -6 10 0' : 'M-10 -2 Q-5 3 0 0 Q5 3 10 -2');
    g.el.setAttribute('transform', `translate(${f1(g.x)} ${f1(g.y)})`);
    if (g.x < -80 || g.x > 1680) { g.el.remove(); gulls.splice(i, 1); }
  }

  // —— 海面：浪紋往左漂、滑鼠漣漪 ——

  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i]; r.t += dt;
    r.el.setAttribute('rx', f1(4 + r.t * 26)); r.el.setAttribute('ry', f1(1 + r.t * 4)); r.el.setAttribute('opacity', f1(Math.max(0, .9 - r.t)));
    if (r.t > .9) { r.el.remove(); ripples.splice(i, 1); }
  }

  // —— 船：航行、鳴笛時晃動、帆船轉向時傾斜 ——
  boats.forEach(b => {
    b.x += b.sp * dt;
    if (b.sp < 0 && b.x < -b.len) b.x = 1600 + b.len;
    if (b.sp > 0 && b.x > 1600 + b.len) b.x = -b.len;
    b.honk = Math.max(0, b.honk - dt);
    b.heel = Math.max(0, b.heel - dt);
    if (b.salute) { b.salute -= dt; if (b.salute <= 0) { b.salute = 0; honk(b, true); } }
    const bob = Math.sin(clock * 1.6 + b.bob) * 1.2 + (b.honk > 0 ? Math.sin(clock * 20) * .8 : 0);
    const tilt = b.kind === 'sail' ? Math.sin(b.heel * 3) * 10 * (b.heel > 0 ? 1 : 0) + Math.sin(clock + b.bob) * 2 * wind : 0;
    b.el.setAttribute('transform', `translate(${f1(b.x)} ${f1(b.y + bob)}) scale(${b.sp < 0 ? -1 : 1} 1) rotate(${f1(tilt)})`);
    if (b.kind === 'tug' && b.honk > 0 && Math.random() < dt * 8) puff(b.x - 18, b.y - 26, .9, 'var(--cream)');
  });
  // 海洋節：高桅帆船、拖船噴水
  if (tall.on) {
    tall.x -= 30 * dt; tall.sails = Math.min(1, tall.sails + dt * .4); tall.fade = Math.min(1, tall.fade + dt * .7); $('tallShip').setAttribute('opacity', tall.fade.toFixed(2));
    $('tallShip').setAttribute('transform', `translate(${f1(tall.x)} ${f1(tall.y + Math.sin(clock * 1.2) * 1.4)})`);
    $('tallSails').setAttribute('transform', `scale(1 ${f1(.3 + tall.sails * .7)})`);

    if (show.on === 'sea' && show.t > 3 && show.t < 16 && tug.x > 40 && tug.x < 1560 && Math.random() < dt * 30) {
      const c = el('circle', { r: 2.2, style: 'fill:var(--cream);stroke:var(--sea-hi);stroke-width:.6' }, $('spray'));
      sprays.push({ el: c, x: tug.x + 10, y: tug.y - 22, vx: rand(-20, 30), vy: rand(-110, -80), t: 0 });
    }
  }
  for (let i = sprays.length - 1; i >= 0; i--) {
    const s = sprays[i]; s.t += dt; s.vy += 140 * dt; s.x += s.vx * dt; s.y += s.vy * dt;
    s.el.setAttribute('cx', f1(s.x)); s.el.setAttribute('cy', f1(s.y));
    if (s.t > 1.4) { s.el.remove(); sprays.splice(i, 1); }
  }

  // —— 煙囪的炊煙（冷天、夜晚比較多） ——
  puffT -= dt;
  if (puffT < 0) {
    puffT = (wx.snow > .5 ? .5 : 1.2) / (1 + night);
    const c = pick(chimneys);
    if (c) puff(c.x, c.y, c.k * .9);
  }
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i]; p.t += dt;
    p.x += (p.vx + wind * 6) * dt; p.y -= 12 * dt;
    p.el.setAttribute('cx', f1(p.x)); p.el.setAttribute('cy', f1(p.y));
    p.el.setAttribute('r', f1(3 * p.s * (1 + p.t * .9)));

  // —— 老湯瑪士：隨風輕輕擺，點擊或節慶時轉一圈 ——

  daws.forEach(d => {

      if (d.ret) { d.ret -= dt; if (d.ret <= 0 && !show.on) { d.fly = 0; d.ret = 0; } }

      d.el.querySelector('.w').setAttribute('d', 'M-1 -3 L-6 -4');
    }
    d.el.setAttribute('transform', `translate(${f1(d.x)} ${f1(d.y)})`);
  });

  // —— 城牆塔樓的三角旗、觀景台彩旗串 ——
  wallTowers.forEach(w => {
    if (w.delay > 0) { w.delay -= dt; return; }
    w.up += ((w.target || 0) - w.up) * Math.min(1, dt * 2.5);
    w.fl.style.display = w.up < .02 ? 'none' : '';
    w.pen.setAttribute('transform', `scale(${f1(w.up)} ${f1(w.up * (1 + Math.sin(clock * 5 + w.up) * .15))})`);
  });
  const gOp = +$('garland').getAttribute('opacity');
  const gTarget = show.on === 'fest' ? 1 : 0;
  if (gOp !== gTarget) { let v = gOp + (gTarget - gOp) * Math.min(1, dt * 2); if (Math.abs(v - gTarget) < .02) v = gTarget; $('garland').setAttribute('opacity', v.toFixed(3)); }
  $('garland').setAttribute('transform', `translate(0 ${f1(Math.sin(clock * 2) * 1.5)})`);

  // —— 表演者 ——
  if (show.on === 'fest') {
    piper.setAttribute('transform', `translate(650 556) scale(1.05)`);
    piper.querySelector('.bag').setAttribute('transform', `translate(9 -34) scale(${f1(1 + Math.sin(clock * 6) * .06)}) translate(-9 34)`);
    dancers.forEach((d, i) => {
      d.a += dt * 1.4;
      const x = 800 + Math.cos(d.a) * 58, y = 566 + Math.sin(d.a) * 12;
      const hop = Math.abs(Math.sin(clock * 6 + i)) * 5;
      d.el.dataset.y = y;
      d.el.setAttribute('transform', `translate(${f1(x)} ${f1(y)}) scale(1.08)`);
      d.fig.setAttribute('transform', `translate(0 ${f1(-hop)})`);
    });
    [...$('walkers').children].sort((a, b) => a.dataset.y - b.dataset.y).forEach(n => $('walkers').appendChild(n));
  }

  // —— 煙火 ——
  if (fwUntil > clock) { fwNext -= dt; if (fwNext <= 0) { fwNext = rand(.5, 1.1); launch(rand(250, 1150), rand(50, 160)); } }
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i]; r.y += r.vy * dt;
    r.line.setAttribute('x1', f1(r.x)); r.line.setAttribute('x2', f1(r.x)); r.line.setAttribute('y1', f1(r.y)); r.line.setAttribute('y2', f1(r.y + 16));
    if (r.y < r.top) { burst(r.x, r.y); r.el.remove(); rockets.splice(i, 1); }
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]; s.life -= s.dec * dt;
    if (s.ray) { s.el.setAttribute('opacity', f1(Math.max(0, s.life))); s.el.setAttribute('transform', `translate(${f1(s.x)} ${f1(s.y)}) scale(${f1(1 + (1 - s.life) * .7)})`); }
    else { s.vy += 60 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= .985; s.el.setAttribute('cx', f1(s.x)); s.el.setAttribute('cy', f1(s.y)); s.el.setAttribute('opacity', f1(Math.max(0, s.life))); }
    if (s.life <= 0) { s.el.remove(); sparks.splice(i, 1); }
  }

  // —— 觀景台行人：走路、停下、互相讓路（同方向保持距離） ——
  walkers.forEach(w => {
    if (w.stop > 0) w.stop -= dt;
    else {
      const ahead = walkers.find(o => o !== w && o.dir === w.dir && Math.abs(o.y - w.y) < 10 && (o.x - w.x) * w.dir > 0 && (o.x - w.x) * w.dir < 34);
      const slow = ahead ? .3 : 1;
      w.x += w.dir * w.sp * dt * slow * (show.on === 'fest' && Math.abs(w.x - 790) < 120 ? .2 : 1);
      if (w.x > 1680) w.x = -60; if (w.x < -80) w.x = 1660;
    }
    const sw = w.stop > 0 ? 0 : Math.sin(clock * w.sp * .28 + w.ph) * 16;
    w.l1.setAttribute('transform', `rotate(${f1(sw)} 0 -20)`); w.l2.setAttribute('transform', `rotate(${f1(-sw)} 0 -20)`);
    w.el.setAttribute('transform', `translate(${f1(w.x)} ${w.y}) scale(${f1(w.s * w.dir)} ${f1(w.s)})`);
  });
  // 樂手撥琴
  if (kannelT > 0) { kannelT -= dt; kannel.querySelector('.kArm').setAttribute('transform', `rotate(${f1(Math.sin(clock * 14) * 8)} 590 506)`); }
  // 煙囪清潔工揮手
  if (sweep.wave > 0) { sweep.wave -= dt; sweep.arm.setAttribute('transform', `rotate(${f1(Math.sin(clock * 10) * 26 - 20)} 3 -26)`); }
  else sweep.arm.setAttribute('transform', '');

  // —— 鴿子：在矮牆上啄食，被點就飛起再回來 ——
  pigeons.forEach(p => {
    if (p.fly) {
      p.fly += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.fly > 2.5 ? 60 : -10) * dt;
      if (p.fly > 2.5) { p.x += (p.hx - p.x) * dt * 1.5; if (p.y >= p.hy) { p.y = p.hy; p.fly = 0; } }
      p.el.querySelector('.w').setAttribute('d', Math.sin(clock * 22) > 0 ? 'M-4 -5 Q0 -16 3 -5' : 'M-4 -5 Q0 2 3 -5');
    } else {
      p.peck -= dt;
      const pk = p.peck < .25 && p.peck > 0 ? 2 : 0;
      if (p.peck < 0) p.peck = rand(1.5, 4);
      p.el.querySelector('.w').setAttribute('d', 'M-4 -5 Q0 -9 3 -5');
      p.el.firstElementChild.nextElementSibling.setAttribute('transform', `rotate(${pk * 8} 6 0)`);
    }
    p.el.setAttribute('transform', `translate(${f1(p.x)} ${f1(p.y)}) scale(${p.dir} 1)`);
  });

  // —— 畫框樹的葉子隨風搖 ——
  document.querySelectorAll('#leaves .leafBlob').forEach((b, i) => {
    const x = +b.dataset.x, y = +b.dataset.y;
    b.setAttribute('transform', `translate(${f1(x + Math.sin(clock * 1.3 + i) * 2 * wind)} ${f1(y + Math.cos(clock * 1.1 + i) * 1.2)})`);
  });

  // —— 雨、雪 ——
  if (wx.rain > .01) rainDrops.forEach(d => {
    d.y += d.sp * dt; d.x -= d.sp * .2 * dt;
    if (d.y > 610) { d.y = rand(-40, 0); d.x = rand(-100, 1700); }
    d.el.setAttribute('x1', f1(d.x)); d.el.setAttribute('y1', f1(d.y)); d.el.setAttribute('x2', f1(d.x + 4)); d.el.setAttribute('y2', f1(d.y - 18));
  });
  if (wx.snow > .01) flakes.forEach(f => {
    f.y += f.sp * dt; if (f.y > 610) { f.y = -10; f.x = rand(0, 1600); }
    f.el.setAttribute('cx', f1(f.x + Math.sin(clock + f.ph) * f.sw)); f.el.setAttribute('cy', f1(f.y));
  });

  // —— 視差 ——
  pxCur += (px - pxCur) * Math.min(1, dt * 3);
  $('parFar').setAttribute('transform', `translate(${f1(-pxCur * 4)} 0)`);
  $('parMid').setAttribute('transform', `translate(${f1(-pxCur * 1.5)} 0)`);
  $('parNear').setAttribute('transform', `translate(${f1(pxCur * 4)} 0)`);
}

/* ---------------- ⑤ 互動：對話泡泡 ---------------- */
function say(x, y, text, dur = 1.6) {
  const g = el('g', { class: 'bubble' }, $('bubbles'));
  const inner = el('g', { class: 'pop', style: `--dur:${dur}s` }, g);
  const t = el('text', { x: 0, y: 0 }, inner);
  t.textContent = text;
  const w = Math.max(44, (t.getComputedTextLength() || text.length * 15) + 24);
  const r = el('rect', { x: f1(-w / 2), y: -15, width: f1(w), height: 30, rx: 3 });
  inner.insertBefore(r, t);
  x = clamp(x, w / 2 + 26, 1600 - w / 2 - 26); y = clamp(y, 40, 562);
  g.setAttribute('transform', `translate(${f1(x)} ${f1(y)})`);
  setTimeout(() => g.remove(), dur * 1000);
}

/* ---------------- 動畫主迴圈 ---------------- */
let last = 0, rafId = 0;
function loop(now) {
  const dt = clamp((now - last) / 1000, 0, .05); last = now;
  step(dt);
  rafId = requestAnimationFrame(loop);
}
function settle(sec) { for (let s = 0; s < sec; s += .05) step(.05); }
function renderStill() { step(.0001); }
function start() {
  cancelAnimationFrame(rafId);
  if (reduced) { T.auto = false; syncAuto(); applyTime(true); settle(1.5); }
  else { last = performance.now(); rafId = requestAnimationFrame(loop); }
}

/* ---------------- 開始：依序畫出場景、角色 ---------------- */
makePaper();
drawSky();
drawSea();
drawPort();
drawFarCity();
// 下城三排房子（讓出地標的位置）；先鋪一層深色屋頂底色，房子之間不會露出紙
el('rect', { x: -20, y: 318, width: 1640, height: 200, class: 'f-roof-sh' }, $('rowBack'));
row('rowBack', 344, 22, 36, 26, 44, .75, 120, 1640, [[260, 340], [OX - 40, OX + 150], [NX - 24, NX + 24]], 'back');
drawWall();
drawOlaf();
row('rowMid', 420, 34, 56, 36, 60, .9, -20, 1640, [[OX - 40, OX + 40], [HX - 64, HX + 44], [TX - 18, TX + 18], [NX - 26, NX + 26]], 'mid');
drawHolySpirit();
drawTownHall();
drawNicholas();
row('rowFront', 500, 40, 66, 52, 84, 1.05, -20, 1640, [[NX - 30, NX + 30]], 'front');
drawSweep();
drawDaws();
drawBoats();
drawTallShip();
drawPlatform();
drawFrameTree();
drawPeople();
drawPerformers();
drawPigeons();
drawWeather();
// 觀景台彩旗串（兩盞街燈之間，節慶時出現）
(() => {
  const g = $('garland');
  let d = 'M300 404', pts = [];
  for (let i = 0; i <= 40; i++) { const t = i / 40, x = 300 + t * 850, y = 404 + Math.sin(t * Math.PI) * 46; d += `L${f1(x)} ${f1(y)}`; if (i % 2 === 1) pts.push([x, y]); }
  el('path', { d, style: 'stroke:var(--ink);fill:none', 'stroke-width': 1.2 }, g);
  pts.forEach(([x, y], i) => P(g, `M${f1(x - 8)} ${f1(y)} L${f1(x + 8)} ${f1(y)} L${f1(x)} ${f1(y + 16)} Z`, '', 'key-thin').setAttribute('style', `fill:var(--${['red', 'ochre', 'teal', 'cream', 'sage'][i % 5]})`));
})();
[...$('walkers').children].sort((a, b) => a.dataset.y - b.dataset.y).forEach(n => $('walkers').appendChild(n));

/* ---------------- ⑤ 互動：點擊 ---------------- */
function onAct(node, fn) {
  node.addEventListener('click', e => { e.stopPropagation(); userGesture = true; ensureAudio(); fn(e); if (reduced) settle(.6); });
  node.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); userGesture = true; ensureAudio(); fn(e); if (reduced) settle(.6); } });
}
function svgPoint(e) {
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
svg.addEventListener('pointerdown', () => { userGesture = true; ensureAudio(); document.body.classList.remove('kbd'); });
window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
// 滑鼠：視差＋海面漣漪
svg.addEventListener('pointermove', e => {
  const p = svgPoint(e);
  px = clamp((p.x - 800) / 800, -1, 1);
  if (p.y > HORIZON + 4 && p.y < 300 && clock - lastRipple > .07 && !reduced) {
    lastRipple = clock;
    ripples.push({ el: el('ellipse', { cx: f1(p.x + pxCur * 4), cy: f1(p.y), rx: 4, ry: 1, class: 's-sea-hi', 'stroke-width': 1.6 }, $('ripples')), t: 0 });
  }
});
svg.addEventListener('pointerleave', () => { px = 0; });

// 天空：白天海鷗、夜晚放一發煙火
onAct($('skyHit'), e => {
  const p = e.type === 'click' ? svgPoint(e) : { x: 800, y: 100 };
  if (night < .5) {
    for (let i = 0; i < 4; i++) spawnGull(p.x - 40 - i * 26, clamp(p.y, 50, 200) + rand(-20, 20), (p.x < 800 ? 1 : -1) * rand(70, 100));
    sfx(gullCry);
  } else launch(clamp(p.x, 40, 1560), clamp(p.y, 40, 180));
});
// 聖靈教堂時鐘：敲鐘
let bellBusy = 0;
onAct($('clockHit'), () => {
  if (clock < bellBusy) return;
  bellBusy = clock + 4;
  sfx(t => { [0, .9, 1.8].forEach((dt, i) => bell(t + dt, [392, 330, 262][i], .24, 3)); });
  for (let i = 0; i < 3; i++) setTimeout(() => {
    const c = el('circle', { cx: 714, cy: 338, r: 16, style: 'stroke:var(--ochre);fill:none', 'stroke-width': 3 }, $('bells'));
    let r = 16; const iv = setInterval(() => { r += 3; c.setAttribute('r', r); c.setAttribute('opacity', f1(Math.max(0, 1 - (r - 16) / 60))); if (r > 76) { clearInterval(iv); c.remove(); } }, 30);
  }, i * 900);
  say(714, 290, pick(['噹——噹——', '這是塔林最古老的公共時鐘', '藍色鐘面配金框，很好認吧']), 2);
});
// 老湯瑪士
onAct($('thomas'), () => {
  thomas.spin = 1.5; sfx(click);
  say(TX, 70, pick(['我是老湯瑪士，從 1530 年就在這裡站崗！', '風從哪裡吹，我就看向哪裡', '守護塔林的老衛兵']), 2.2);
});
// 聖奧拉夫教堂
onAct($('olaf'), () => {
  sfx(t => bell(t, 196, .22, 4));
  say(OX + 40, 130, pick(['中世紀時，我曾是世界最高的建築之一', '尖塔是水手回港的地標', '可以爬上塔頂看整座舊城喔']), 2.2);
});
// 聖尼古拉教堂（現在是美術館與音樂廳，常有管風琴音樂會）
onAct($('nicholas'), () => {
  if (show.on) { busy(); return; }
  if (audioOK()) { organ(actx.currentTime + .02); duckMusic(6); }
  say(NX, 180, pick(['今晚有管風琴音樂會', '這裡現在是美術館和音樂廳']), 2);
});
// 船：渡輪長鳴、拖船兩短聲、帆船轉向
function honk(b, quiet) {
  b.honk = 1.6;
  if (b.kind === 'sail') { b.heel = 1.2; sfx(t => noise(t, .5, 700, .04, 'bandpass', 1, .08)); if (!quiet) say(b.x, b.y - 66, pick(['迎風轉向！', '今天風剛剛好']), 1.6); return; }
  sfx(t => b.kind === 'ferry' ? shipHorn(t, 92, 1.5, .18) : (shipHorn(t, 150, .35, .14), shipHorn(t + .5, 150, .35, .14)));
  if (!quiet) say(b.x, b.y - 66, b.kind === 'ferry' ? pick(['往赫爾辛基的渡輪，約兩小時', '嘟——準備出港', '對岸就是芬蘭']) : pick(['嘟！嘟！', '小拖船來幫忙靠岸']), 1.8);
}
boats.forEach(b => onAct(b.el, () => honk(b)));
// 煙囪清潔工：揮手，告訴你摸鈕扣會帶來好運
onAct($('sweep'), () => {
  sweep.wave = 2;
  sfx(t => noise(t, .25, 1600, .05, 'bandpass', 3));
  const c = chimneys.filter(c => c.row === 'mid').sort((a, b) => Math.abs(a.x - 560) - Math.abs(b.x - 560))[0];
  if (c) for (let i = 0; i < 5; i++) setTimeout(() => puff(c.x, c.y, c.k * 1.2, 'var(--ink)'), i * 120);
  say(560, 340, pick(['摸摸我的鈕扣，會帶來好運！', '煙囪清乾淨了！', '祝你今天好運～']), 2);
});
// 卡內琴樂手
onAct(kannel, () => {
  if (kannelT > 0) return;
  if (show.on) { busy(); return; }
  kannelT = 4.2;
  if (audioOK()) { kannelTune(actx.currentTime + .05); duckMusic(5); }
  say(600, 450, pick(['這是卡內琴，愛沙尼亞的傳統樂器', '來一首老民謠', '謝謝你停下來聽']), 2);
});
// 望遠鏡：看遠方的船
onAct(scope, () => {
  sfx(click);
  const f = boats.find(b => b.kind === 'ferry');
  say(900, 450, night > .5 ? '晚上只看得到船上的燈' : wx.fog > .5 ? '霧太濃，什麼都看不到' : pick(['看得到對岸的芬蘭嗎？', '渡輪正在進港！', '遠處那座是奈薩爾島']), 2);
  if (f) f.honk = 1;
});
// 街燈
lamps.forEach(l => onAct(l.g, () => { l.on = !l.on; applyLamps(); sfx(click); if (night < .4) say(l.x, 370, '白天不亮，晚上再來試試', 1.4); }));
// 鴿子：一隻被點，整群飛起
$('pigeons').addEventListener('click', e => {
  e.stopPropagation(); userGesture = true; ensureAudio();
  pigeons.forEach(p => { if (!p.fly) { p.fly = .001; p.vx = rand(-120, 120); p.vy = rand(-130, -80); } });
  sfx(t => { flap(t); coo(t + .6); });
  if (reduced) settle(.3);
});
// 行人：停下來說句話
$('walkers').addEventListener('click', e => {
  const pt = svgPoint(e);
  let best = null, bd = 1e9;
  walkers.forEach(w => { const d = Math.abs(w.x + pxCur * 4 - pt.x) + Math.abs(w.y - 24 - pt.y) * .5; if (d < bd) { bd = d; best = w; } });
  if (!best || bd > 40) return;
  e.stopPropagation(); userGesture = true;
  best.stop = 2.2;
  const lines = wx.rain > .5 ? ['又下雨了，波羅的海的天氣就是這樣', '快去咖啡館躲雨'] : wx.fog > .5 ? ['霧好濃，尖塔都不見了！', '海上起霧了'] : wx.snow > .5 ? ['下雪的舊城像童話一樣', '好冷，來杯熱紅酒吧'] :
    best.type === 'photo' ? ['紅屋頂好好拍！', '這是塔林最美的角度'] : best.type === 'tourist' ? ['想去爬聖奧拉夫的塔', '舊城好像童話故事'] : best.type === 'kid' ? ['那隻黑色的鳥是寒鴉！', '我看到渡輪了！'] : best.type === 'dog' ? ['汪！', '牠想去追鴿子'] : ['Tere!（你好！）', 'Aitäh!（謝謝！）', '今天天氣真好'];
  say(best.x + pxCur * 4, best.y - 70 * best.s, pick(lines), 1.8);
  if (reduced) renderStill();
});

/* ---------------- ⑤ 互動：控制列 ---------------- */
function syncAuto() { $('btnAuto').setAttribute('aria-pressed', String(T.auto)); $('btnAuto').textContent = T.auto ? '自動播放中' : '自動播放'; }
function goTo(t) { if (reduced) { T.t = t; applyTime(true); renderStill(); } else T.target = t; }
const tap = fn => () => { userGesture = true; ensureAudio(); setTimeout(() => { fn(); if (reduced) settle(2); }, actx && actx.state !== 'running' ? 120 : 0); };
$('btnFest').addEventListener('click', tap(() => startFest(false)));
$('btnSea').addEventListener('click', tap(() => {
  if (!show.on && night < .55) say(1200, 230, '帆船進港了！想看煙火就切到夜晚再按一次', 2.4);
  startSea(false);
}));
$('btnWeather').addEventListener('click', () => {
  userGesture = true; ensureAudio();
  wxI = (wxI + 1) % WX_LIST.length;
  $('btnWeather').textContent = '天氣：' + WX_LIST[wxI][1];
  if (reduced) { for (const k in wx) wx[k] = WX_LIST[wxI][0] === k ? 1 : 0; applyWeather(0); renderStill(); }
});
$('btnSound').addEventListener('click', () => {
  soundOn = !soundOn; userGesture = true;
  $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  if (ensureAudio()) {
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.setValueAtTime(soundOn ? .5 : 0, actx.currentTime);
    if (!soundOn && musNode) { try { musNode.disconnect(); } catch (e) {} musNode = null; }
  }
  if (!soundOn) { try { window.sceneMusic && window.sceneMusic.stop(); } catch (e) {} }
});
$('btnDay').addEventListener('click', () => goTo(11 / 24));
$('btnNight').addEventListener('click', () => goTo(21 / 24));
$('btnAuto').addEventListener('click', () => { T.auto = !T.auto; T.target = null; syncAuto(); });
$('timeRange').addEventListener('input', e => {
  T.t = e.target.value / 1000; T.target = null; T.dragging = true; applyTime(true); T.dragging = false;
  if (reduced) renderStill();
});
mq.addEventListener?.('change', e => { reduced = e.matches; if (!reduced) { T.auto = true; syncAuto(); } start(); });

applyTime(true);
applyWeather(0);
syncAuto();
start();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on,
  btn: { fest: 'btnFest', sea: 'btnSea' },
  ff: () => { show.t = show.dur - .02; },
  save: () => ({ ...T }),
  stop: () => endShow(),
  after: () => { fwUntil = 0; tall.on = false; $('tallShip').style.display = 'none'; },   // 煙火不再放、帆船收走
  restore: s => { Object.assign(T, s); syncAuto(); applyTime(true); renderStill(); }
});
/* /ShowStop */
})();
</script>
<script id="scene-bgm">
/* =========================================================
   【互動】背景配樂（Web Audio 即時合成，原創曲，不使用任何音檔）
   - 控制列「♪ 配樂」按鈕開關；網站「作者精選」播放區會呼叫
     window.sceneMusic.start() / stop()
   - 想換曲子：改下面 SCORE 區塊裡的音符陣列即可
     音符寫法："A4"、"C#5"、"Eb4"；"-" 是休止；數字是長度（幾格）
   ========================================================= */
(function () {
  "use strict";
  // __SceneAudioContext：下載時選了「不要點擊音效」會把場景音效靜音，配樂仍用原本的 AudioContext
  const AC = window.__SceneAudioContext || window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  // 音名 → 頻率
  function hz(n) {
    const m = /^([A-G])([#b]?)(-?\d)$/.exec(n);
    const st = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0);
    return 440 * Math.pow(2, (st + (+m[3] + 1) * 12 - 69) / 12);
  }
  // 旋律陣列 → { 格數: [音名, 長度] }
  function seq(list) {
    const map = {}; let s = 0;
    for (const [n, len] of list) { if (n !== "-") map[s] = [n, len]; s += len; }
    return map;
  }

  let ctx = null, out = null, timer = null, playing = false, nextT = 0, step = 0;

  /* ---------- 樂器 ---------- */
  function env(t, a, d, v) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    g.connect(out); return g;
  }
  function osc(type, f, t, dur, dest, detune) {
    const o = ctx.createOscillator(); o.type = type; o.frequency.value = f;
    if (detune) o.detune.value = detune;
    o.connect(dest); o.start(t); o.stop(t + dur + 0.05); return o;
  }
  let noiseBuf = null;
  function noise() {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const x = noiseBuf.getChannelData(0); for (let i = 0; i < x.length; i++) x[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; return s;
  }
  const I = {
    // 撥弦（吉他、烏德琴）：鋸齒波＋快速關閉的低通濾波
    pluck(f, t, d, v, bright) {
      const lp = ctx.createBiquadFilter(); lp.type = "lowpass";
      lp.frequency.setValueAtTime(bright || 2600, t); lp.frequency.exponentialRampToValueAtTime(350, t + d);
      lp.connect(env(t, 0.004, d, v || 0.1));
      osc("sawtooth", f, t, d, lp); osc("triangle", f * 2, t, d * 0.5, lp);
    },
    // 顫音撥弦：同一個音快速連撥（葡萄牙吉他、卡農琴的招牌）
    tremolo(f, t, d, v, gap) {
      gap = gap || 0.085;
      for (let k = 0; k * gap < d - 0.04; k++) I.pluck(f, t + k * gap, 0.16, (v || 0.07) * (k ? 0.8 : 1.1), 3200);
    },
    // 柔和撥弦（豎琴）
    harp(f, t, d, v) { osc("triangle", f, t, d, env(t, 0.006, d, v || 0.05)); osc("sine", f * 2, t, d * 0.4, env(t, 0.004, d * 0.4, (v || 0.05) * 0.25)); },
    // 長笛／錫口哨：正弦波＋輕微抖音、慢起音
    flute(f, t, d, v) {
      v = v || 0.06;
      const g = ctx.createGain(); g.connect(out);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.12);
      g.gain.setValueAtTime(v, t + Math.max(0.13, d - 0.18)); g.gain.linearRampToValueAtTime(0.0001, t + d + 0.12);
      const o = osc("sine", f, t, d + 0.15, g);
      const lfo = ctx.createOscillator(), lg = ctx.createGain();
      lfo.frequency.value = 5.2; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(f * 0.007, t + 0.4);
      lfo.connect(lg); lg.connect(o.frequency); lfo.start(t); lfo.stop(t + d + 0.2);
      const h = ctx.createGain(); h.gain.value = 0.15; h.connect(g); osc("sine", f * 2, t, d + 0.15, h);
      // 氣音
      const n = noise(), bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = f * 2; bp.Q.value = 2;
      n.connect(bp); bp.connect(env(t, 0.05, 0.25, v * 0.25)); n.start(t); n.stop(t + 0.4);
    },
    // 持續低音墊底
    pad(f, t, d, v) {
      v = v || 0.03;
      const g = ctx.createGain(); g.connect(out);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + d * 0.35); g.gain.linearRampToValueAtTime(0.0001, t + d + 0.3);
      const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 800; lp.connect(g);
      osc("sawtooth", f, t, d + 0.3, lp, -7); osc("sawtooth", f, t, d + 0.3, lp, 7);
    },
    // 手鼓低音「咚」
    dum(t, v) {
      const o = osc("sine", 120, t, 0.4, env(t, 0.003, 0.32, v || 0.3));
      o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(58, t + 0.25);
    },
    // 手鼓高音「嗒」
    tek(t, v) {
      const n = noise(), hp = ctx.createBiquadFilter(); hp.type = "bandpass"; hp.frequency.value = 3200; hp.Q.value = 0.9;
      n.connect(hp); hp.connect(env(t, 0.002, 0.07, v || 0.12)); n.start(t); n.stop(t + 0.12);
    },
    // 海浪聲：濾過的白噪音慢慢起落
    wave(t, d, v) {
      const n = noise(), lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 520;
      const g = ctx.createGain(); g.connect(out);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v || 0.04, t + d * 0.45); g.gain.linearRampToValueAtTime(0.0001, t + d);
      n.connect(lp); lp.connect(g); n.start(t); n.stop(t + d + 0.1);
    }
  };

  /* ---------- 曲譜（每組場景不同，見下方 SCORE） ---------- */
  // 塔林：愛沙尼亞民謠風的原創小曲（D 多利安調式，3/4 拍）。卡內琴撥弦伴奏＋木笛旋律＋輕手鼓
  const SCORE = (() => {
    const mel = seq([
      ["D5",2],["E5",1], ["F5",2],["G5",1], ["A5",3], ["G5",2],["F5",1],
      ["E5",2],["D5",1], ["C5",2],["E5",1], ["D5",6],
      ["A4",2],["C5",1], ["D5",2],["E5",1], ["F5",2],["E5",1], ["D5",2],["C5",1],
      ["B4",2],["C5",1], ["A4",2],["G4",1], ["A4",6],
      ["D5",2],["F5",1], ["A5",2],["G5",1], ["F5",2],["E5",1], ["F5",2],["G5",1],
      ["A5",2],["C6",1], ["B5",2],["G5",1], ["A5",6],
      ["G5",2],["F5",1], ["E5",2],["C5",1], ["D5",2],["E5",1], ["F5",2],["D5",1],
      ["E5",2],["C5",1], ["A4",2],["C5",1], ["D5",6]
    ]);
    // 每小節的低音與和弦（多利安：Dm、C、G 大三和弦是招牌色彩）
    const CH = { Dm: ["D3", ["D4","F4","A4"]], C: ["C3", ["C4","E4","G4"]], G: ["G2", ["G3","B3","D4"]], Am: ["A2", ["A3","C4","E4"]], F: ["F2", ["F3","A3","C4"]] };
    const bars = ["Dm","Dm","C","Dm", "Dm","G","Am","Am", "Dm","F","G","Am", "G","C","Am","Dm"];
    return {
      bpm: 132, stepsPerBeat: 1, steps: 48, volume: 0.42, gain: 12,
      play(s, t, dt) {
        const bar = Math.floor(s / 3), i = s % 3, ch = CH[bars[bar]];
        if (i === 0) { I.harp(hz(ch[0]), t, dt * 2.6, 0.07); I.dum(t, 0.12); }
        else { ch[1].forEach((n, k) => I.pluck(hz(n), t + k * 0.03, dt * 0.9, 0.028, 2400)); I.tek(t, 0.04); }
        const m = mel[s];
        if (m) I.flute(hz(m[0]), t, m[1] * dt * 0.95, 0.055);
        if (m && m[1] >= 3) I.pluck(hz(m[0]), t, dt * 2, 0.04, 3400);
      }
    };
  })();

  /* ---------- 播放引擎（一般不需要修改） ---------- */
  function schedule() {
    const dt = 60 / SCORE.bpm / SCORE.stepsPerBeat;
    while (nextT < ctx.currentTime + 0.35) {
      try { SCORE.play(step, nextT, dt); } catch (e) {}
      nextT += dt; step = (step + 1) % SCORE.steps;
    }
  }
  function setBtn() {
    const b = document.getElementById("btnMusic");
    if (b) { b.setAttribute("aria-pressed", String(playing)); b.textContent = "♪ 配樂：" + (playing ? "開" : "關"); }
  }
  function level(v, sec) {
    const t = ctx.currentTime; out.gain.cancelScheduledValues(t);
    out.gain.setValueAtTime(Math.max(0.0001, out.gain.value), t); out.gain.linearRampToValueAtTime(Math.max(0.0001, v), t + sec);
  }
  let duckTimer = null;
  // ext：外層網頁（例如圖鑑網站的精選播放區）在使用者點擊時先建立好的 AudioContext，
  // 這樣瀏覽器不會擋自動播放；單獨打開這個檔案時不用傳
  function start(ext) {
    if (!ctx) {
      ctx = ext || new AC(); out = ctx.createGain(); out.gain.value = 0.0001;
      // 壓縮器讓音量平均，不會忽大忽小
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -20; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = 0.01; comp.release.value = 0.25;
      const master = ctx.createGain(); master.gain.value = (SCORE.gain || 1) * .64; // 配樂音量 ×0.64（2026-11-24 兩次各調降 20%）
      out.connect(comp); comp.connect(master); master.connect(ctx.destination);
    }
    if (ctx.state !== "running") ctx.resume();
    if (playing) return;
    playing = true; step = 0; nextT = ctx.currentTime + 0.1;
    level(SCORE.volume, 1.5); schedule(); timer = setInterval(schedule, 90); setBtn();
  }
  function stop() {
    if (!playing) return;
    playing = false; clearInterval(timer); clearTimeout(duckTimer); level(0.0001, 0.8); setBtn();
  }
  // 場景裡其他音樂（例如水舞、法朵）響起時，配樂先轉小聲
  function duck(sec) {
    if (!playing) return;
    clearTimeout(duckTimer); level(SCORE.volume * 0.12, 0.6);
    duckTimer = setTimeout(() => { if (playing) level(SCORE.volume, 2); }, sec * 1000);
  }
  document.addEventListener("visibilitychange", () => {
    if (!ctx) return;
    if (document.hidden) { if (playing) ctx.suspend(); } else if (playing) ctx.resume();
  });
  window.sceneMusic = {
    start, stop, duck,
    toggle() { playing ? stop() : start(); },
    get playing() { return playing; }
  };
  const btn = document.getElementById("btnMusic");
  if (btn) btn.addEventListener("click", () => window.sceneMusic.toggle());
  setBtn();
  // 純插畫版沒有按鈕：單獨打開時，點一下畫面就開始播（嵌在別的網頁裡時交給外層控制）
  let top = true; try { top = window.top === window; } catch (e) { top = false; }
  if (document.getElementById("pure-art") && top) {
    const go = () => { start(); document.removeEventListener("pointerdown", go); document.removeEventListener("keydown", go); };
    document.addEventListener("pointerdown", go); document.addEventListener("keydown", go);
  }
})();
</script>
</body>
</html>
