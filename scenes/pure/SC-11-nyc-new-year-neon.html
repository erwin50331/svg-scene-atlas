<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }

  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  var fakes = [];

    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);

      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };

      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };

    return mq;

  window.addEventListener("load", applyCss);

  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {

<title>時代廣場的水晶球跨年倒數</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-11 時代廣場的水晶球跨年倒數｜霓虹夜景（美式 LED 看板版）
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），
   部分另有 --k-名稱（晨昏）。JS 會依時間內插，輸出成 --名稱，
   並自動產生 .f-名稱（填色）、.s-名稱（描邊）兩個 class。
   ========================================================= */
:root{
  color-scheme: dark;

  /* —— 天空 —— */
  --d-sky-top:#6aaee6;  --k-sky-top:#2b3a78;  --n-sky-top:#040a1d;
  --d-sky-bot:#d3ecf8;  --k-sky-bot:#ff8f66;  --n-sky-bot:#1f2a48;
  --d-haze:#ffffff;     --n-haze:#ff9a4a;     /* 地平線的城市光暈（鈉燈橘） */
  --d-cloud:#ffffff;    --n-cloud:#232b40;

  /* —— 遠景天際線 —— */
  --d-far-1:#a9bccf;    --n-far-1:#0e1426;
  --d-far-2:#c4d1de;    --n-far-2:#151c32;

  /* —— 近景大樓（四種立面色）與裝飾線 —— */
  --d-bldg-1:#cdb9a2;   --n-bldg-1:#221c1e;
  --d-bldg-2:#a9b0be;   --n-bldg-2:#151a26;
  --d-bldg-3:#dccdb6;   --n-bldg-3:#25211f;
  --d-bldg-4:#8f98aa;   --n-bldg-4:#11151f;
  --d-trim:#f2ece0;     --n-trim:#3c3a3e;   /* 簷口、窗台 */
  --d-edge:#6b7390;     --n-edge:#30364a;   /* 大樓輪廓線 */
  --d-win-off:#6f86a3;  --n-win-off:#0b0e17;
  --win-on:#ffd98a;                            /* 亮燈的窗 */
  --d-screen-bg:#151827; --n-screen-bg:#06060f;
  --d-metal:#8c94a3;    --n-metal:#4a4f60;    /* 旗桿、燈柱、鐵件 */

  /* —— 地面 —— */
  --d-plaza:#c3beb6;    --n-plaza:#1e1e26;    /* 後方廣場人行道 */
  --d-curb:#8e8a85;     --n-curb:#2c2c36;
  --d-road:#55565e;     --n-road:#121319;
  --d-lane:#ece6d2;     --n-lane:#6e6c72;
  --d-walk:#b9b4ad;     --n-walk:#1a1a21;     /* 前景人行道 */
  --d-shadow:#00000033; --n-shadow:#00000066;
  --d-glass:#a8d8f0;    --n-glass:#2a3550;    /* 車窗 */

  /* —— 光源 —— */
  --sun:#fff1b8;
  --moon:#fff6dc;
  --star:#ffffff;
  --lamp:#ffe3a0;
  --headlight:#fff3c4;
  --taillight:#ff2b4a;
  --snow:#ffffff;
  --steam:#ffffff;

  /* —— LED 看板色（看板、煙火、彩紙共用；美式紅白藍金） —— */
  --neon-1:#ff3b3b;  /* 紅 */
  --neon-2:#3b8bff;  /* 藍 */
  --neon-3:#ffd24a;  /* 金 */
  --neon-4:#f4f6ff;  /* 白 */
  --neon-5:#39d0ff;  /* 冰藍 */
  --neon-6:#ff9a1f;  /* 琥珀（新聞跑馬燈） */
  --ball-1:#ffffff;  /* 水晶球：亮面 */
  --ball-2:#9fd0ff;  /* 水晶球：冰藍 */
  --ball-3:#2f6fd6;  /* 水晶球：邊緣深藍 */
  --gold:#ffd35a;    /* 年份數字、香檳金彩帶 */

  /* —— 交通工具 —— */
  --taxi:#ffc928;
  --taxi-dark:#1b1b22;
  --bus:#e8edf3;
  --bus-stripe:#2c62c9;
  --pedicab:#c8324a;
  --tire:#16161d;
  --barrier:#2f6fd6;      /* 封街的藍色拒馬 */
  --steam-pipe:#ff7a1a;   /* 冒蒸汽的橘白條紋管 */
  --hydrant:#d8342f;
  --subway:#2f8f5a;       /* 地鐵入口的綠燈球 */
  --mailbox:#2c4f9e;
  --cart:#d9dde4;         /* 熱狗攤 */
  --umbrella-a:#ffcf3a; --umbrella-b:#2c62c9;

  /* —— 角色 —— */
  --skin-1:#f4cfa8; --skin-2:#d9a37a; --skin-3:#a8724c; --skin-4:#6e4a33;
  --hair-1:#1f1820; --hair-2:#5a3a24; --hair-3:#c99a5a; --hair-4:#8a8a96;
  --coat-1:#c8324a; --coat-2:#2d3f7a; --coat-3:#e6dccb; --coat-4:#3a7d6a;
  --coat-5:#6b4a9c; --coat-6:#d98a2b; --coat-7:#2a2a33;
  --pants:#2a2c3c;
  --pigeon:#8c93a3;
  --dog:#c8955a;

  /* —— 頁面介面 —— */
  --page-bg:#0b0d16; --page-fg:#eef1fa; --page-muted:#9aa3b8;
  --ui-surface:#141826; --ui-line:#2a3044; --ui-accent:#ffd24a;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-neon:"Arial Rounded MT Bold","Avenir Next","Helvetica Neue",Arial,sans-serif;
  --font-led:"DIN Condensed","Arial Narrow","Roboto Condensed",Arial,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.code{font:700 13px/1 var(--font-ui);letter-spacing:.12em;padding:5px 8px;border:1.5px solid var(--ui-accent);color:var(--ui-accent);border-radius:3px}
h1{margin:0;font:700 26px/1.2 var(--font-ui);letter-spacing:.06em;text-wrap:balance}
.style{color:var(--page-muted);font-size:14px;letter-spacing:.04em}
.stage{margin:0;border:1px solid var(--ui-line);border-radius:10px;overflow:hidden;background:var(--n-sky-top);line-height:0}
.panel button.big{border-color:var(--neon-3);color:var(--neon-3)}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:10px;padding:10px 14px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--page-bg);font-weight:700}
.panel button.big{border-color:var(--neon-3);color:var(--neon-3);font-weight:700}
.panel button:disabled{opacity:.5;cursor:default}
.panel button:focus-visible,.panel input:focus-visible,#scene [tabindex]:focus-visible{outline:2px solid var(--neon-2);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;flex:1 1 260px;min-width:0;color:var(--page-muted);font-size:13px}
.timebox input{flex:1;min-width:0;accent-color:var(--ui-accent)}
.clock{font:700 15px/1 var(--font-ui);font-variant-numeric:tabular-nums;min-width:4.6em;color:var(--page-fg)}
.hint{margin:0;color:var(--page-muted);font-size:13.5px;line-height:1.75;max-width:72em}
.hint b{color:var(--page-fg);font-weight:600}

/* ---------- SVG 共用樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .edge{stroke:var(--edge);stroke-width:1.2;fill:none}
#scene .neon{fill:none;stroke-linecap:round;stroke-linejoin:round}
#scene .led{font-family:var(--font-led);font-weight:700;text-anchor:middle;dominant-baseline:central}
#scene .neon-t{font-family:var(--font-neon);font-weight:700;text-anchor:middle;dominant-baseline:central}
#scene .bubble rect{fill:#120c26;stroke:var(--neon-2);stroke-width:1.6}
#scene .bubble text{fill:#ffffff;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
/* 人群：舉手／放下 */
#crowd .au{display:none}
#crowd.cheer .au,#crowd .p.wave .au{display:inline}
#crowd.cheer .ad,#crowd .p.wave .ad{display:none}
#walkers .p.wave .ad{display:none}
#walkers .p:not(.wave) .au{display:none}
@media (prefers-reduced-motion:reduce){ *{scroll-behavior:auto!important} }
</style>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);
      }
      return _conn.call(this, dest, ...a);
    };
  }
  function stopAudio() {
    let longs = [], ctx = null;
    for (const s of srcs) {
      const c = s.context, now = c.currentTime, m = s.__ss; ctx = c;
      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }

      const g = outs.get(ctx), now = ctx.currentTime;
      if (g) {
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 1.1); g.gain.setValueAtTime(0, now + 1.2);
        g.gain.linearRampToValueAtTime(1, now + 1.9);

    }

  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');
    // 凍結色票：把目前的 CSS 變數抄到殘影上，底下換色不影響殘影
    const cs = getComputedStyle(svg);
    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }
      }
    }

    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });
    added = [];
  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>
/* =========================================================
   SC-11 時代廣場的水晶球跨年倒數｜程式區
   區塊：①工具與色票 ②場景（天空、天際線、大樓、看板、高塔、街道）
         ③角色（人群、行人、鴿子、車流） ④動畫（日夜、煙火、彩帶、蒸汽、雪）
         ⑤互動（倒數、點擊、控制列）
   ========================================================= */
(() => {
'use strict';

/* ---------------- ① 工具與色票 ---------------- */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const root = document.documentElement;
const svg = $('scene');
const BASE = 430;            // 大樓底線
const LANE_B = 506;          // 後車道（往左）
const LANE_F = 548;          // 前車道（往右）
const WALK_Y = 594;          // 前景行人腳底
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
let seed = 20261231;  // 固定亂數：每次開啟構圖一樣
const srand = (a = 0, b = 1) => { seed = (seed * 16807) % 2147483647; return a + (seed / 2147483647) * (b - a); };
const spick = a => a[Math.floor(srand(0, a.length - 1e-9))];
const f1 = n => n.toFixed(1);
function el(tag, attrs = {}, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function frag(parent, html) { parent.insertAdjacentHTML('beforeend', html); return parent.lastElementChild; }

// 讀取色票、內插混色
const css = n => getComputedStyle(root).getPropertyValue(n).trim();

  h = h.replace('#', '');
  if (h.length === 3) h = [...h].map(c => c + c).join('');
  const n = parseInt(h.slice(0, 6), 16);
  return [n >> 16 & 255, n >> 8 & 255, n & 255, h.length === 8 ? parseInt(h.slice(6), 16) / 255 : 1];
};

const rgba = c => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${c[3].toFixed(3)})`;
// 成對色票：自動找出所有 --d-xxx，配對 --n-xxx（與選用的 --k-xxx）
const PAIRS = {};
(() => {
  const names = [];
  for (const sheet of document.styleSheets) {
    try { for (const r of sheet.cssRules) if (r.selectorText === ':root') for (const p of r.style) if (p.startsWith('--d-')) names.push(p.slice(4)); } catch (e) {}
  }

  names.forEach(k => {
    const k2 = css('--k-' + k);
    PAIRS[k] = { d: hex(css('--d-' + k)), n: hex(css('--n-' + k)), k: k2 ? hex(k2) : null };
    cls += `#scene .f-${k}{fill:var(--${k})}#scene .s-${k}{stroke:var(--${k});fill:none}`;
  });

const NEON = [1, 2, 3, 4, 5, 6].map(i => css('--neon-' + i));
const GOLD = css('--gold');

// 新年年份（11 月底看的話，就是明年）
const now = new Date();
const YEAR = now.getMonth() === 0 ? now.getFullYear() : now.getFullYear() + 1;

/* 動態偏好 */
const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
let reduced = mq.matches;

/* ---------------- ② 場景：天空 ---------------- */
const stars = [];
function drawSky() {
  for (let i = 0; i < 70; i++) {
    const s = el('circle', { cx: f1(srand(0, 1600)), cy: f1(srand(0, 230)), r: f1(srand(.5, 1.5)), style: 'fill:var(--star)' }, $('stars'));
    stars.push({ el: s, ph: srand(0, 6.28), sp: srand(.8, 2.4) });
  }
  // 雲：用幾個圓組成
  for (let i = 0; i < 6; i++) {
    const w = srand(120, 220), g = el('g', { class: 'f-cloud' }, $('clouds'));
    let d = '';
    for (let j = 0; j < 5; j++) { const cx = (j - 2) * w / 6, r = w / 7 * (1 - Math.abs(j - 2) * .18); d += `<circle cx="${f1(cx)}" cy="${f1(-r * .4)}" r="${f1(r)}"/>`; }
    g.innerHTML = d + `<rect x="${f1(-w / 2.4)}" y="-6" width="${f1(w / 1.2)}" height="12" rx="6"/>`;
    clouds.push({ el: g, x: srand(-100, 1700), y: srand(40, 170), v: srand(6, 14), s: srand(.6, 1) });
  }
  // 探照燈兩支
  [[712, 330], [888, 330], [140, 330], [1460, 330]].forEach(([x, y], i) => {
    const b = el('path', { fill: 'url(#beamGrad)', d: 'M-5 0 L-46 -560 L46 -560 L5 0Z' }, $('beams'));

}

    const scr = { ...s, g, content, ov, big, l1, l2, wash, idx: 0, i, upd: null, flash: 0 };

function setProgram(scr, idx) {
  scr.idx = idx % scr.progs.length;
  scr.content.textContent = '';
  scr.upd = PROGRAMS[scr.progs[scr.idx]](scr.content, scr.w, scr.h, scr.i);
  scr.flash = .35;
}

  // 光芒：12 道細長三角形

  ballFacets = [];

  for (let r = 0; r * th < BALL_R * 2; r++) for (let c = -1; c * tw / 2 < BALL_R * 2 + tw; c++) {
    const x0 = -BALL_R + c * tw / 2, y0 = -BALL_R + r * th, up = (r + c) % 2 === 0;

  }

  });
  screens.forEach(s => s.wash.setAttribute('opacity', f1((1 - night) * .16)));
  // 人群密度：白天觀光客較少，深夜擠滿廣場
  density = .32 + .68 * smooth(.3, 1, night) * (h > 12 || h < 3 ? 1 : .55);
  crowd.forEach(p => { const v = p.rank < density; if (v !== p.vis) { p.vis = v; p.el.style.display = v ? '' : 'none'; } });
  $('clock').textContent = clockText();
  if (!T.dragging) $('timeRange').value = Math.round(T.t * 1000);
}

/* ---------------- ⑤ 互動：跨年倒數狀態機 ----------------
   idle → count（10 秒，水晶球落下）→ party（約 40 秒，煙火彩帶）→ idle */
const cd = { state: 'idle', t: 0, last: -1 };
const COUNT_FROM = (23 + 59 / 60 + 50 / 3600) / 24;
function startCountdown() {
  if (cd.state === 'count') return;
  cd.state = 'count'; cd.t = 0; cd.last = -1;
  T.t = COUNT_FROM; T.target = null;
  $('crowd').classList.add('cheer');
  $('btnCount').disabled = true;
  applyTime(true);
  if (reduced) { cd.t = 10; toParty(); settle(1.1); }
}
function toParty() {
  cd.state = 'party'; cd.t = 0;
  T.t = 0; applyTime(true);
  confettiBurst(reduced ? 200 : 240);
  releaseBalloons(18);
  for (let i = 0; i < 5; i++) setTimeout(() => launch(rand(150, 1450), rand(60, 200)), reduced ? 0 : i * 180);
  if (reduced) for (let i = 0; i < 5; i++) burst(200 + i * 300, rand(80, 180), pick(['peony', 'ring', 'double', 'heart']), pick(NEON));
  crowd.forEach(p => { if (p.vis && Math.random() < .7) p.jump = rand(0, .6); });
  say(800, 300, `HAPPY NEW YEAR ${YEAR}！`, 3);
}
function endParty() {
  cd.state = 'idle';
  $('crowd').classList.remove('cheer');
  $('btnCount').disabled = false;
}

/* ---------------- ④ 動畫：每一幀 ---------------- */
let clock = 0, mx = 0, my = 0, pointerIn = false, fwTimer = 3, waveTimer = 1, wind = 0;
function step(dt) {
  clock += dt;
  wind = Math.sin(clock * .13) * 14 + Math.sin(clock * .41) * 6;

  // 時間推進
  if (cd.state === 'count') {
    cd.t += dt;
    // 每一秒，人群一起喊出數字
    const d = 10 - Math.floor(cd.t);
    if (d !== cd.last && d > 0) { cd.last = d; for (let k = 0; k < 3; k++) say(rand(120, 1480), rand(400, 425), `${d}!`, .8); }
    if (cd.t >= 10) toParty();
  } else {
    const prev = T.t;
    if (T.target !== null) {
      let d = T.target - T.t; if (d > .5) d -= 1; if (d < -.5) d += 1;
      T.t = (T.t + d * Math.min(1, dt * 2.2) + 1) % 1;
      if (Math.abs(d) < .002) T.target = null;
    } else if (T.auto && cd.state === 'idle') {
      T.t = (T.t + dt / DAY_SEC) % 1;
      // 自動播放到 23:59:50 → 自動開始倒數
      if (prev < COUNT_FROM && T.t >= COUNT_FROM) startCountdown();
    } else if (T.auto && cd.state === 'party') T.t = (T.t + dt / DAY_SEC * .25) % 1;
  }
  applyTime(false);

  // 派對階段
  if (cd.state === 'party') {
    cd.t += dt;
    if (cd.t > 42) endParty();
  }
  const partyHeat = cd.state === 'party' ? (cd.t < 16 ? 1 : Math.max(0, 1 - (cd.t - 16) / 26)) : 0;

  // 水晶球位置：倒數時落下，派對結束後慢慢升回
  if (cd.state === 'count') ballY = BALL_TOP + (BALL_BOT - BALL_TOP) * smooth(0, 10, cd.t);
  else if (cd.state === 'party') ballY = BALL_BOT;
  else ballY += (BALL_TOP - ballY) * Math.min(1, dt * .25);
  ballEl.setAttribute('transform', `translate(800 ${f1(ballY)})`);
  ballHalo.setAttribute('cy', f1(ballY));
  ballHalo.setAttribute('opacity', f1(Math.min(1, .35 + night * .45 + (cd.state !== 'idle' ? .25 : 0) + Math.sin(clock * 3) * .05)));
  // 切面顏色：一道道光波掃過球面，偶爾閃一下白光
  const bs = cd.state === 'idle' ? 1.1 : cd.state === 'count' ? 3 : 5;
  ballFacets.forEach(f => {
    if (f.sp > 0) f.sp -= dt; else if (Math.random() < dt * .25) f.sp = .12;
    const k = Math.floor(clock * bs + f.x * .035 + f.y * .02 + 80) % BALL_COLS.length;
    f.el.setAttribute('fill', f.sp > 0 ? '#ffffff' : BALL_COLS[k]);
  });
  ballRays.setAttribute('transform', `translate(800 ${f1(ballY)}) rotate(${f1(clock * 6)})`);
  ballRays.setAttribute('opacity', f1((.15 + night * .55) * (cd.state === 'party' ? 1.4 : 1)));
  // 年份燈字
  const lit = cd.state === 'party';
  yearT.setAttribute('fill', lit ? GOLD : `rgba(170,165,150,${(.4 + night * .2).toFixed(2)})`);
  yearGlow.setAttribute('opacity', lit ? f1(.75 + Math.sin(clock * 8) * .25) : 0);
  $('poleTip').setAttribute('opacity', Math.sin(clock * 4) > 0 ? 1 : .2);

  // 大螢幕
  const digit = cd.state === 'count' ? Math.max(1, 10 - Math.floor(cd.t)) : 0;
  screens.forEach(s => {
    if (cd.state === 'idle') {
      if (s.ov.style.display !== 'none') s.ov.style.display = 'none';
      s.upd(clock);
    } else {
      s.ov.style.display = '';
      if (cd.state === 'count') {
        s.big.textContent = digit; s.l1.textContent = ''; s.l2.textContent = '';
        const pulse = 1 - (cd.t % 1);
        s.big.setAttribute('opacity', f1(.55 + .45 * pulse));
      } else {
        const alt = Math.floor(cd.t / 1.6 + s.i * .5) % 2;
        s.big.textContent = alt ? YEAR : '';
        s.l1.textContent = alt ? '' : 'HAPPY'; s.l2.textContent = alt ? '' : 'NEW YEAR';
        s.l1.setAttribute('y', f1(s.h * .32)); s.l2.setAttribute('y', f1(s.h * .68));
        s.big.setAttribute('font-size', f1(Math.min(s.h * .55, s.w * .3)));
        s.big.setAttribute('fill', NEON[Math.floor(cd.t * 3 + s.i) % 6]);
        s.big.setAttribute('opacity', 1);
      }
    }
    if (s.flash > 0) { s.flash -= dt; s.wash.setAttribute('opacity', f1(Math.max(0, s.flash) * 2)); }
  });
  if (cd.state !== 'party') screens.forEach(s => { if (s.ov.style.display === '' && cd.state === 'idle') s.ov.style.display = 'none'; s.big.setAttribute('font-size', f1(Math.min(s.h * .8, s.w * .7))); });
  if (!towerTickLen) towerTickLen = towerTicker.getComputedTextLength() / 2;
  towerTicker.setAttribute('x', f1(726 - (clock * 50) % (towerTickLen || 400)));
  zippers.forEach(z => { if (!z.len) z.len = z.t.getComputedTextLength() / 3; z.t.setAttribute('x', f1(z.x - (clock * 55) % (z.len || 500))); });

  // 霓虹招牌：壞掉的字偶爾閃爍
  neonLetters.forEach(L => {
    let o = .35 + night * .65;
    if (L.bad && Math.random() < .015) L.flick = rand(.1, .4);
    if (L.flick > 0) { L.flick -= dt; o *= Math.random() < .5 ? .15 : 1; }
    L.el.setAttribute('opacity', f1(o));
  });
  bulbs.forEach((b, i) => b.setAttribute('opacity', (Math.floor(clock * 8) + i) % 3 === 0 ? 1 : .25));
  blinkers.forEach(b => b.el.setAttribute('opacity', Math.sin(clock * 3 + b.ph) > .6 ? 1 : .15));
  flags.forEach(f => {
    const w = 22, a = 4 + wind * .15;
    f.el.setAttribute('d', `M${f.x} ${f.y} Q${f1(f.x + w / 2)} ${f1(f.y - a * Math.sin(clock * 5 + f.ph))} ${f.x + w} ${f1(f.y + 2 + Math.sin(clock * 5 + f.ph + 1) * 2)} V${f1(f.y + 14 + Math.sin(clock * 5 + f.ph + 1) * 2)} Q${f1(f.x + w / 2)} ${f1(f.y + 12 - a * Math.sin(clock * 5 + f.ph))} ${f.x} ${f.y + 14}Z`);
  });

  // 星星閃爍、雲、探照燈
  stars.forEach(s => s.el.setAttribute('opacity', f1(.45 + .55 * Math.abs(Math.sin(clock * s.sp + s.ph)))));
  clouds.forEach(c => {
    c.x += (c.v + wind * .3) * dt; if (c.x > 1760) c.x = -160;
    c.el.setAttribute('transform', `translate(${f1(c.x + mx * -10)} ${f1(c.y)}) scale(${c.s.toFixed(2)})`);
  });
  beams.forEach(b => {
    let a = Math.sin(clock * b.sp + b.ph) * 28;
    if (pointerIn && my < 420) a = Math.atan2(mx * 800 + 800 - b.x, b.y - my) * 57.3 * .9 + Math.sin(clock + b.ph) * 4;
    b.a += (clamp(a, -55, 55) - b.a) * Math.min(1, dt * 3);
    b.el.setAttribute('transform', `translate(${b.x} ${b.y}) rotate(${f1(b.a)})`);
  });
  $('farLayer').setAttribute('transform', `translate(${f1(mx * -14)} 0)`);

  // 煙火：平常夜裡偶爾放，派對時密集
  fwTimer -= dt;
  if (fwTimer <= 0) {
    if (partyHeat > 0) { launch(rand(100, 1500), rand(50, 210)); fwTimer = rand(.22, .55) / Math.max(.2, partyHeat); }
    else { if (night > .7 && !reduced) launch(rand(150, 1450), rand(80, 200)); fwTimer = rand(4, 8); }
  }
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.t += dt;
    const k = Math.min(1, r.t / r.dur), e = 1 - Math.pow(1 - k, 2);
    const x = r.x + (r.tx - r.x) * e, y = 340 + (r.ty - 340) * e;
    r.trail -= dt;
    if (r.trail <= 0) {
      r.trail = .03;
      const o = take(trailP);
      if (o) { Object.assign(o, { x: x + rand(-1, 1), y, life: .5, max: .5 }); o.el.setAttribute('fill', '#ffe8b0'); }
    }
    if (k >= 1) { burst(r.tx, r.ty, r.type, r.col); rockets.splice(i, 1); }
  }
  fwP.forEach(o => {
    if (!o.live) return;
    o.life -= dt;
    if (o.life <= 0) return free(o);
    const dr = Math.exp(-o.drag * dt);
    o.vx *= dr; o.vy = o.vy * dr + o.g * dt;
    o.x += (o.vx + wind * .6) * dt; o.y += o.vy * dt;
    const a = o.life / o.max;
    o.el.setAttribute('cx', f1(o.x)); o.el.setAttribute('cy', f1(o.y));
    o.el.setAttribute('r', f1(o.size * (.4 + a * .8)));
    o.el.setAttribute('opacity', f1(o.tw ? a * (Math.random() < .3 ? .4 : 1) : Math.min(1, a * 1.6)));
  });
  trailP.forEach(o => {
    if (!o.live) return;
    o.life -= dt; if (o.life <= 0) return free(o);
    o.y += 20 * dt;
    o.el.setAttribute('cx', f1(o.x)); o.el.setAttribute('cy', f1(o.y)); o.el.setAttribute('opacity', f1(o.life / o.max));
  });
  flash = Math.max(0, flash - dt * .5);
  $('skyFlash').setAttribute('opacity', f1(flash * night));

  // 紙花：飄落、翻轉，落地後停一下再消失
  if (partyHeat > .5 && Math.random() < dt * 30) confettiBurst(2);
  confP.forEach(o => {
    if (!o.live) return;
    o.t += dt;
    if (o.y < o.land) {
      o.vy = Math.min(o.vy + 40 * dt, 70);
      o.x += (o.vx + wind + Math.sin(o.t * 2 + o.ph) * 30) * dt; o.y += o.vy * dt; o.rot += o.vr * dt;
      o.el.setAttribute('transform', `translate(${f1(o.x)} ${f1(o.y)}) rotate(${f1(o.rot)}) scale(1 ${Math.cos(o.t * o.fs).toFixed(2)})`);
    } else {
      o.rest += dt;
      if (o.rest > 6) return free(o);
      if (o.rest > 4) o.el.setAttribute('opacity', f1((6 - o.rest) / 2)); else o.el.setAttribute('opacity', 1);
      o.el.setAttribute('transform', `translate(${f1(o.x)} ${f1(o.land)}) rotate(${f1(o.rot)}) scale(1 .5)`);
    }
  });
  streamP.forEach(o => {
    if (!o.live) return;
    if (o.y < o.land) o.y += o.v * dt;
    else { o.land = -1; o.rest = (o.rest || 0) + dt; if (o.rest > 5) { o.rest = 0; return free(o); } }
    o.x += wind * .4 * dt;
    let d = '';
    for (let j = 0; j <= 10; j++) {
      const yy = o.y - j * o.len / 10;
      d += (j ? 'L' : 'M') + f1(o.x + Math.sin(j * .9 + clock * 4 + o.ph) * 8) + ' ' + f1(Math.min(yy, o.y));
    }
    o.el.setAttribute('d', d);
  });
  balloonP.forEach(o => {
    if (!o.live) return;
    o.y -= o.v * dt; o.x += (wind * .8 + Math.sin(clock + o.ph) * 10) * dt;
    if (o.y < -60) return free(o);
    o.el.setAttribute('transform', `translate(${f1(o.x)} ${f1(o.y)}) rotate(${f1(Math.sin(clock * 2 + o.ph) * 8)})`);
  });

  // 蒸汽：條紋管、人孔蓋、熱狗攤持續冒煙
  if (Math.random() < dt * 7) puff(1185, 514, 1.2);
  if (Math.random() < dt * 3) puff(420, 534, .9);
  if (Math.random() < dt * 1.6) puff(286, 548, .5);
  steamP.forEach(o => {
    if (!o.live) return;
    o.t += dt; if (o.t > o.max) return free(o);
    const k = o.t / o.max;
    o.x += (o.vx + wind * 1.4) * dt; o.y += o.vy * dt; o.vy *= Math.exp(-.3 * dt);
    o.el.setAttribute('cx', f1(o.x)); o.el.setAttribute('cy', f1(o.y));
    o.el.setAttribute('r', f1(o.r * (1 + k * 2.6)));
    o.el.setAttribute('opacity', f1((1 - k) * .55 * Math.min(1, k * 6)));
  });
  // 細雪
  snow.forEach(s => {
    s.y += s.v * dt; s.x += (wind * .8 + Math.sin(clock + s.ph) * 8) * dt;
    if (s.y > 600) { s.y = -5; s.x = rand(-40, 1640); }
    if (s.x > 1640) s.x = -20; if (s.x < -40) s.x = 1620;
    s.el.setAttribute('cx', f1(s.x)); s.el.setAttribute('cy', f1(s.y));
  });

  // 人群：倒數時舉手搖擺，派對時跳躍；平常偶爾有人揮手
  waveTimer -= dt;
  if (waveTimer <= 0 && cd.state === 'idle') { const p = pick(crowd); if (p.vis) p.wave = 1.6; waveTimer = rand(.3, .9); }
  crowd.forEach(p => {
    if (!p.vis) return;
    let dy = 0, rot = 0;
    if (p.wave > 0) { p.wave -= dt; p.el.classList.add('wave'); if (p.wave <= 0) p.el.classList.remove('wave'); rot = Math.sin(clock * 10 + p.ph) * 4; }
    if (cd.state === 'count') rot = Math.sin(clock * 5 + p.ph) * 5;
    if (cd.state === 'party' && partyHeat > .2 && p.jump <= 0 && Math.random() < dt * 1.6 * partyHeat) p.jump = .01;
    if (p.jump > 0) {
      p.jump += dt;
      dy = -Math.sin(Math.min(1, p.jump / .45) * Math.PI) * 9;
      if (p.jump > .45) p.jump = 0;
    }
    if (dy !== p.dy || rot || p.rot) {
      p.dy = dy; p.rot = rot;
      p.el.setAttribute('transform', `translate(${f1(p.x)} ${f1(p.y + dy)}) scale(${p.s.toFixed(3)}) rotate(${f1(rot)})`);
    }
  });

  // 前景行人：走路擺腿，點了會停下揮手
  walkers.forEach(w => {
    if (w.stop > 0) { w.stop -= dt; if (w.stop <= 0) w.el.classList.remove('wave'); }
    else w.x += w.v * dt;
    if (w.x > 1660) w.x = -60; if (w.x < -60) w.x = 1660;
    const sw = w.stop > 0 ? 0 : Math.sin(clock * Math.abs(w.v) * .18 + w.ph) * 22;
    w.legL.setAttribute('transform', `rotate(${f1(sw)} 0 -19)`);
    w.legR.setAttribute('transform', `rotate(${f1(-sw)} 0 -19)`);
    const bob = w.stop > 0 ? 0 : Math.abs(Math.sin(clock * Math.abs(w.v) * .18 + w.ph)) * -1.5;
    w.el.setAttribute('transform', `translate(${f1(w.x)} ${f1(WALK_Y + bob)}) scale(${(w.v > 0 ? 1 : -1) * w.s} ${w.s})`);
    if (w.dog) w.dog.querySelector('.tail').setAttribute('transform', `rotate(${f1(Math.sin(clock * 12) * 14)} -12 -12)`);
  });

  // 鴿子：低頭啄食，點了飛走，過一陣子再飛回來
  pigeons.forEach(p => {
    if (p.fly > 0) {
      p.fly += dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 30 * dt;
      p.wing.setAttribute('d', Math.sin(clock * 40) > 0 ? 'M-4 -7 Q0 -20 6 -16' : 'M-4 -7 Q2 0 6 -2');
      if (p.fly > 9) { p.fly = 0; p.x = p.x0; p.y = WALK_Y - 6; p.wing.setAttribute('d', 'M-4 -7 Q2 -9 4 -6'); }
    } else {
      const peck = Math.sin(clock * 3 + p.ph) > .7;
      p.head.setAttribute('transform', peck ? 'translate(3 6)' : '');
      if (Math.random() < dt * .4) p.dir *= -1;
      p.x += p.dir * 4 * dt; p.x = clamp(p.x, p.x0 - 14, p.x0 + 14);
    }
    p.el.setAttribute('transform', `translate(${f1(p.x)} ${f1(p.y)}) scale(${p.dir} 1)`);
  });

  // 車流：倒數到派對期間停下來
  for (const k in lanes) {
    const L = lanes[k];
    const want = cd.state === 'idle' ? 1 : 0;
    L.cur += (want - L.cur) * Math.min(1, dt * 1.2);
  }
  vehicles.forEach(v => {
    const L = v.lane;
    v.x += L.v * L.cur * dt;
    if (v.x > L.span) v.x -= L.span;
    const X = L.dir > 0 ? v.x - 200 : 1600 - (v.x - 200);
    v.g.setAttribute('transform', `translate(${f1(X)} ${L.y})`);
    const rot = (v.x / 8 * 57.3) % 360;
    v.spins.forEach(s => s.setAttribute('transform', `rotate(${f1(rot)})`));
    const beamO = smooth(.4, 1, night) * (v.honk > 0 ? 1.4 : 1);
    v.beams.forEach(b => b.setAttribute('opacity', f1(Math.min(1, beamO))));
    if (v.honk > 0) { v.honk -= dt; v.hl.forEach(h => h.setAttribute('opacity', Math.sin(clock * 30) > 0 ? 1 : .3)); }
    else v.hl.forEach(h => h.setAttribute('opacity', f1(.5 + night * .5)));
  });

  // 紅綠燈循環（綠 6 秒 → 黃 2 秒 → 紅 6 秒）、行人號誌
  const tc = clock % 14;
  $('tl-g').setAttribute('fill', tc < 6 ? '#3dff7a' : '#0f3a1a');
  $('tl-y').setAttribute('fill', tc >= 6 && tc < 8 ? '#ffd23a' : '#3a3010');
  $('tl-r').setAttribute('fill', tc >= 8 ? '#ff3a3a' : '#3a1010');
  $('walkSig').setAttribute('fill', tc >= 8 ? '#ffffff' : (tc > 4 && tc < 8 && Math.sin(clock * 12) < 0) ? '#3a2010' : '#ff7a1a');
}

/* ---------------- ⑤ 互動：對話泡泡 ---------------- */
function say(x, y, text, dur = 1.6) {
  const g = el('g', { class: 'bubble' }, $('bubbles'));
  const t = el('text', { x: 0, y: 0 }, g);
  t.textContent = text;
  const w = Math.max(44, (t.getComputedTextLength() || text.length * 14) + 22);
  const r = el('rect', { x: -w / 2, y: -15, width: w, height: 30, rx: 15 });
  g.insertBefore(r, t);
  x = clamp(x, w / 2 + 6, 1600 - w / 2 - 6); y = clamp(y, 22, 580);
  g.setAttribute('transform', `translate(${f1(x)} ${f1(y)})`);
  setTimeout(() => g.remove(), dur * 1000);
}

/* ---------------- 動畫主迴圈 ---------------- */
let last = 0, rafId = 0;
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  step(dt);
  rafId = requestAnimationFrame(loop);
}
// 減少動態：只畫靜止畫面；互動時快轉一小段再停住
function settle(sec) { for (let s = 0; s < sec; s += .05) step(.05); }
function renderStill() { step(.0001); }
function start() {
  cancelAnimationFrame(rafId);
  if (reduced) { T.auto = false; syncAuto(); applyTime(true); renderStill(); }
  else { last = performance.now(); rafId = requestAnimationFrame(loop); }
}

/* ---------------- 開始：依序畫出場景、角色 ---------------- */
drawSky();
drawFar();
drawBuildings();
drawScreens();
drawTower();
drawStreet();
drawCrowd();
drawTraffic();
drawPigeons();
drawWalkers();

/* ---------------- ⑤ 互動：點擊 ---------------- */
function onAct(node, fn) {
  node.addEventListener('click', e => { e.stopPropagation(); fn(e); if (reduced) settle(.6); });
  node.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(e); if (reduced) settle(.6); } });
}
function svgPoint(e) {
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
// 中央高塔：開始倒數
$('tower').addEventListener('click', e => { e.stopPropagation(); startCountdown(); });
$('tower').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startCountdown(); } });
$('btnCount').addEventListener('click', startCountdown);
// 大螢幕：切換節目
screens.forEach(s => onAct(s.g, () => { setProgram(s, s.idx + 1); if (cd.state === 'idle') s.upd(clock); }));
// 天空：在點的位置放煙火
onAct($('skyHit'), e => {
  const p = e.type === 'click' ? svgPoint(e) : { x: 800, y: 150 };
  if (reduced) { burst(p.x, p.y, pick(['peony', 'ring', 'double', 'heart']), pick(NEON)); return; }
  launch(p.x, Math.min(p.y, 300));
});
// 人群：被點的人跳起來喊新年快樂
$('crowd').addEventListener('click', e => {
  e.stopPropagation();
  const pt = svgPoint(e);
  let best = null, bd = 1e9;
  crowd.forEach(p => { if (!p.vis) return; const d = Math.abs(p.x - pt.x) + Math.abs(p.y - 20 - pt.y) * .5; if (d < bd) { bd = d; best = p; } });
  if (!best) return;
  best.jump = .01; best.wave = 1.8;
  crowd.forEach(p => { if (p !== best && p.vis && Math.abs(p.x - best.x) < 50 && Math.random() < .6) { p.jump = .01 - rand(0, .3); p.wave = 1.2; } });
  say(best.x, best.y - 52, pick(['新年快樂！', 'Happy New Year!', 'Woo-hoo!', '許個願吧！', '乾杯！', '十、九、八…']), 1.6);
  if (reduced) settle(.2);
});
// 車輛：按喇叭、大燈閃
vehicles.forEach(v => onAct(v.g, () => {
  v.honk = 1.2;
  const X = v.lane.dir > 0 ? v.x - 200 : 1600 - (v.x - 200);
  say(X, v.lane.y - (v.type === 'bus' ? 128 : 66), v.type === 'bus' ? '叭——！' : pick(['叭叭！', '嗶嗶！']), 1.3);
}));
// 熱狗攤：冒熱氣
onAct(cart, () => { for (let i = 0; i < 8; i++) setTimeout(() => puff(rand(272, 300), 548, .8), i * 60); say(300, 470, pick(['熱狗一份！', '加芥末嗎？', '暖暖的蝴蝶餅！']), 1.6); });
// 蒸汽管：噴出大團蒸汽
onAct(steamPipe, () => { for (let i = 0; i < 14; i++) setTimeout(() => puff(1185, 514, 1.8), i * 50); say(1185, 450, '噗咻——', 1.3); });
// 鴿子：一起飛走
$('pigeons').addEventListener('click', e => {
  e.stopPropagation();
  pigeons.forEach(p => { if (p.fly) return; p.fly = .01; p.vx = rand(60, 140) * (Math.random() < .5 ? 1 : -1); p.dir = Math.sign(p.vx); p.vy = -rand(80, 130); });
  say(700, 540, '咕咕咕！', 1.2);
  if (reduced) settle(.4);
});
// 前景行人：停下來揮手
$('walkers').addEventListener('click', e => {
  e.stopPropagation();
  const pt = svgPoint(e);
  let best = null, bd = 1e9;
  walkers.forEach(w => { const d = Math.abs(w.x - pt.x); if (d < bd) { bd = d; best = w; } });
  if (!best || bd > 40) return;
  best.stop = 2; best.el.classList.add('wave');
  say(best.x, WALK_Y - 78 * best.s, best.dog ? '汪汪！新年快樂～' : pick(['Happy New Year!', '新年快樂！', '去看倒數嗎？', '好冷喔！']), 1.6);
  if (reduced) renderStill();
});
// 滑鼠：探照燈跟著轉、遠景視差
svg.addEventListener('pointermove', e => {
  const r = svg.getBoundingClientRect();
  mx = ((e.clientX - r.left) / r.width - .5) * 2;
  my = (e.clientY - r.top) / r.height * 600; pointerIn = true;
});
svg.addEventListener('pointerleave', () => { mx = 0; pointerIn = false; });

/* ---------------- ⑤ 互動：控制列 ---------------- */
function syncAuto() { $('btnAuto').setAttribute('aria-pressed', String(T.auto)); $('btnAuto').textContent = T.auto ? '自動播放中' : '自動播放'; }
function goTo(t) { if (cd.state === 'count') return; if (reduced) { T.t = t; applyTime(true); renderStill(); } else T.target = t; }
$('btnDay').addEventListener('click', () => goTo(13 / 24));
$('btnNight').addEventListener('click', () => goTo(22.5 / 24));
$('btnAuto').addEventListener('click', () => { T.auto = !T.auto; T.target = null; syncAuto(); });
$('timeRange').addEventListener('input', e => {
  if (cd.state === 'count') return;
  T.t = e.target.value / 1000; T.target = null; T.dragging = true; applyTime(true); T.dragging = false;
  if (reduced) renderStill();
});
mq.addEventListener?.('change', e => { reduced = e.matches; if (!reduced) { T.auto = true; syncAuto(); } start(); });

applyTime(true);
syncAuto();
start();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => cd.state !== 'idle',
  btn: 'btnCount',
  save: () => ({ t: T.t, auto: T.auto }),
  stop: () => {
    [confP, streamP, balloonP].forEach(p => p.forEach(o => { if (o.live) free(o); }));
    crowd.forEach(p => { p.jump = 0; });
    endParty(); ballY = BALL_TOP;
  },
  restore: s => { T.t = s.t; T.auto = s.auto; T.target = null; syncAuto(); applyTime(true); }
});
/* /ShowStop */
})();
</script>
