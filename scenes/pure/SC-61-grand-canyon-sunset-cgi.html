<style>
/* =========================================================
   SC-61 大峽谷南緣的峽谷夕照｜CGI 電影質感
   地點：美國亞利桑那州大峽谷國家公園，南緣隱士路（Hermit Road）上的霍皮角觀景台一帶。
   視角：站在南緣的石砌觀景矮牆後面往北看——
         地平線是平平的北緣台地（上面長滿松林），
         中間是一座座被侵蝕剩下的孤峰（當地稱為「神殿」），層層疊疊越遠越藍；
         谷底的內峽谷裡，綠色的科羅拉多河由右（東）往左（西）流，
         河上有泛舟的橡皮艇、幾處白浪險灘；
         左右兩側是南緣伸出去的岬角，右邊岬角的岩壁上有之字形的騾隊步道。
   真實岩層（由上往下）：凱巴布石灰岩（米白）→ 托洛威普層 → 科科尼諾砂岩（淡黃色峭壁）
         → 赫密特頁岩（紅色斜坡）→ 蘇派層（紅色階梯狀）→ 紅牆石灰岩（被染紅的大峭壁）
         → 穆阿夫／光明天使頁岩（灰綠色緩坡，就是寬寬的通托平台）→ 塔皮茨砂岩（褐色）
         → 毘濕奴片岩（谷底最古老的黑色岩石，將近 18 億年）。
         峭壁層垂直、頁岩層成斜坡，所以每座孤峰都是一層層的階梯。
   真實元素：南緣的石砌觀景矮牆；戴寬簷平頂帽的國家公園管理員；觀景遊客、帶三腳架的攝影者；
         沿著南緣步道健行的人；隱士路上的接駁公車（前面有腳踏車架）；
         在路邊吃草、會擋住公車的麋鹿；岩壁上的大角羊；岩松鼠；
         加州神鷲（翼展近 3 公尺、翅膀上有編號牌）、渡鴉；
         西黃松（橘紅色龜甲樹皮）、矮松與猶他刺柏；
         夏季午後的季風雷雨、暴雨後從岩壁傾瀉的臨時瀑布與被染成紅褐色的河水；
         冬天峽谷積雪；罕見的「雲海」（逆溫時雲灌滿整座峽谷）；
         國際暗空公園的銀河；泛舟隊晚上在河邊沙灘紮營的營燈。
   風格重點：CGI 動畫電影的寬銀幕畫面——夕陽從左邊（西方）斜照，
            孤峰朝西的一面被照成橘紅色、朝東的一面是藍紫色陰影；
            峽谷的影子會隨著太陽下山一層層往上爬；
            層層的空氣透視（越遠越藍）、體積光束、青橙調色、暗角、底片顆粒；
            滑鼠移動帶動多層視差；表演時上下出現寬銀幕黑邊、鏡頭緩緩推近。
   效能：不對大圖層做模糊；光暈一律用放射漸層。
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），部分另有 --k-名稱（晨昏）。
   JS 會依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）。
   ========================================================= */
:root{
  color-scheme: dark;

  /* —— 天空、雲 —— */
  --d-sky-top:#3a78c8;  --k-sky-top:#33407e;  --n-sky-top:#03050e;
  --d-sky-mid:#80b0e2;  --k-sky-mid:#c8707a;  --n-sky-mid:#091027;
  --d-sky-low:#d6e4ef;  --k-sky-low:#ffb468;  --n-sky-low:#18203a;
  --d-haze:#b4c6dc;     --k-haze:#e6a080;     --n-haze:#121a30;
  --d-cloud:#ffffff;    --k-cloud:#ffc6a0;    --n-cloud:#252a44;
  --d-cloud-dk:#a6b4c8; --k-cloud-dk:#8a5878; --n-cloud-dk:#0e1122;
  --d-overcast:#7c8898; --k-overcast:#6a5462; --n-overcast:#0b0d16;
  --d-storm:#48505e;    --k-storm:#3c3246;    --n-storm:#06070c;

  /* —— 大峽谷岩層（由上往下）——

     supai／supai2 蘇派層、redwall／redwall2 紅牆石灰岩、tonto／tonto2 通托平台（穆阿夫、光明天使頁岩）、
     tapeats 塔皮茨砂岩、vishnu／vishnu2 毘濕奴片岩 */
  --d-st-kaibab:#d6c4a0;  --k-st-kaibab:#ffbc8a;  --n-st-kaibab:#34384e;

  --d-shade:#3a4884;    --k-shade:#3a2a70;    --n-shade:#06081a;
  --d-ledge:#fff2d8;    --k-ledge:#ffd2a0;    --n-ledge:#3a3c56;
  /* 北緣森林、谷底灌木、科羅拉多河 */

  /* —— 前景：南緣的石灰岩地面、觀景矮牆、步道、公路 —— */
  --d-fore:#b7a280;     --k-fore:#c08a62;     --n-fore:#1a1820;

  /* —— 植物：西黃松、矮松、猶他刺柏 —— */
  --d-bark:#b0663c;     --k-bark:#c45e38;     --n-bark:#190f0d;

  --d-ranger-hat:#b8996a;--k-ranger-hat:#d49a62;--n-ranger-hat:#2a2216;
  --d-badge:#d8b048;    --n-badge:#3a3018;
  --d-pants:#3a4a66;    --n-pants:#0b0e16;
  --d-shorts:#b6a07c;   --k-shorts:#c69468;   --n-shorts:#24201a;
  --d-boots:#4a3426;    --n-boots:#0c0806;
  --d-pack:#c24a30;     --n-pack:#240c08;
  --d-pack2:#3a6a8a;    --n-pack2:#0b141c;

  /* —— 動物 —— */
  --d-condor:#1a1a1e;   --n-condor:#050508;

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:6px;overflow:hidden;background:#000;line-height:0;box-shadow:0 18px 50px rgba(0,0,0,.55)}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:6px;padding:10px 14px}
.panel button{font:700 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:4px;padding:9px 14px;cursor:pointer;letter-spacing:.04em}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:#1a0c04}
.panel button.big{border-color:var(--ui-hot2);color:#fff;background:var(--ui-hot2)}
.panel button.big2{border-color:var(--ui-hot);color:#1a1206;background:var(--ui-hot)}
.panel button:disabled{opacity:.45;cursor:default}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid #ffe4c8;outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(220px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding:0;list-style:none;color:var(--page-muted);font-size:14px;line-height:1.8;display:flex;flex-wrap:wrap;gap:4px 22px}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .bubble path{fill:rgba(20,14,12,.84);stroke:rgba(255,210,170,.55);stroke-width:1}
#scene .bubble text{fill:#fff4ea;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .screen{mix-blend-mode:screen}
#scene .soft{mix-blend-mode:soft-light}
#scene .mult{mix-blend-mode:multiply}
</style>
<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。
   想恢復完整版，刪掉這整段 <style id="pure-art"> 即可。
   ========================================================= */
html,body{height:100%;margin:0!important;overflow:hidden}
body{display:flex!important;align-items:center;justify-content:center;padding:0!important}
body>.wrap{width:100%!important;max-width:min(100vw,calc(100vh * 8 / 3))!important;
  margin:0!important;padding:0!important;gap:0!important;display:block!important}
body>.wrap>:not(.stage){display:none!important}
body>.wrap>.stage{width:100%!important;max-width:100%!important;margin:0!important;
  border:0!important;border-radius:0!important;box-shadow:none!important}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 舞台。圖層由遠到近：
       天空（星空、銀河、月亮、太陽、雲、積雨雲）→ 北緣台地 → 空氣透視
       → 遠方的孤峰群 → 雨幕 → 空氣透視 → 中景孤峰 → 雲海（遠）→ 彩虹
       → 谷底：通托平台、內峽谷、科羅拉多河（泛舟、險灘、營地）→ 雲海（近）
       → 左右兩座近景岬角（大角羊、騾隊步道、臨時瀑布）→ 空中的加州神鷲與渡鴉
       → 前景：南緣觀景台（矮牆、遊客、管理員、步道健行者、松樹、麋鹿、接駁公車）
       → 天氣（雨、雪、霧）→ 鏡頭效果（調色、暗角、顆粒、寬銀幕黑邊）
       大部分的物件由下方 JS 產生，這裡只放骨架與漸層。
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" role="img" aria-label="大峽谷南緣：從觀景台往北看，一層層紅色岩層的孤峰、谷底的科羅拉多河，夕陽從左邊照進峽谷">
    <defs>
      <!-- 天空 -->
      <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-top)"/><stop offset=".62" style="stop-color:var(--sky-mid)"/><stop offset="1" style="stop-color:var(--sky-low)"/>
      </linearGradient>
      <radialGradient id="sunGlow"><stop offset="0" stop-color="#fff6e0" stop-opacity=".95"/><stop offset=".12" stop-color="#ffe0a8" stop-opacity=".6"/><stop offset=".4" stop-color="#ffb070" stop-opacity=".2"/><stop offset="1" stop-color="#ffb070" stop-opacity="0"/></radialGradient>
      <radialGradient id="sunWash" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffb060" stop-opacity=".55"/><stop offset=".5" stop-color="#ff8a50" stop-opacity=".18"/><stop offset="1" stop-color="#ff8a50" stop-opacity="0"/></radialGradient>

<script id="showstop">
/* =========================================================

       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾

           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，

/* ---- 近景岬角：南緣往峽谷伸出去的兩座岬角。

}

  p.legs[1].setAttribute('transform', `rotate(${f1(-a)} 0 -15)`);

}
function aimBeam(p, tx, ty, fallbackAng, on) {
  if (!p.beam) return;
  p.lampDot && p.lampDot.setAttribute('opacity', f1(on));
  if (on < .01) { p.beam.setAttribute('opacity', 0); return; }
  let ang = fallbackAng;
  if (tx != null) {
    const wx0 = p.x + p.hx, wy0 = p.y + p.hy;
    ang = Math.atan2(ty - wy0, tx - wx0) * 180 / Math.PI;
    if (p.dir > 0) ang = clamp(ang, -50, 70); else { if (ang < 0) ang = Math.min(ang, -130); else ang = Math.max(ang, 110); if (ang > -130 && ang < 110) ang = 180; }
  }
  p.beam.setAttribute('transform', `translate(${f1(p.hx)} ${f1(p.hy)}) rotate(${f1(ang)}) scale(${f2(p.s)})`);
  p.beam.setAttribute('opacity', f1(on * (1 - wx.fog * .3)));
}

    perch.dir = Math.cos(k * Math.PI * 2) >= 0 ? 1 : -1;
    perch.x = x; perch.y = y;
    perch.wing.setAttribute('transform', `rotate(${f1(Math.sin(time * 16) * 40)} 0 -8)`);
    if (perch.fly <= 0) { perch.x = perch.x0; perch.y = perch.y0; perch.dir = -1; perch.wing.setAttribute('transform', ''); }
  } else {
    perch.head.setAttribute('transform', `rotate(${f1(Math.sin(time * .9) > .7 ? -14 : 0)} 7 -12)`);
    perch.dir = Math.sin(time * .13) > .6 ? 1 : -1;
  }
  perch.g.setAttribute('transform', `translate(${f1(perch.x)} ${f1(perch.y)}) scale(${perch.dir} 1)`);
  perch.g.setAttribute('opacity', f2(1 - smooth(.55, .85, night)));
  perch.g.style.pointerEvents = night > .7 ? 'none' : '';
  // 岩松鼠
  squirrel.wait -= dt;
  if (!squirrel.run && squirrel.wait <= 0) { squirrel.wait = rand(4, 9); squirrel.tx = clamp(squirrel.x + rand(-120, 120), WALL[0] + 20, WALL[1] - 60); squirrel.run = .6; }
  if (squirrel.run && Math.abs(squirrel.tx - squirrel.x) > 2) { const d = Math.sign(squirrel.tx - squirrel.x); squirrel.dir = d; squirrel.x += d * adt * 90 * squirrel.run + d * (reduced ? 0 : 0); }
  else squirrel.run = 0;
  const hopY = squirrel.run ? -Math.abs(Math.sin(time * 18)) * 3 : 0;
  squirrel.g.setAttribute('transform', `translate(${f1(squirrel.x)} ${f1(lineY(wallTop, squirrel.x) - 1 + hopY)}) scale(${squirrel.dir} 1)`);
  squirrel.body.setAttribute('transform', squirrel.run ? '' : `rotate(${f1(Math.sin(time * .7) > .5 ? -38 : 0)} -2 0)`);
  squirrel.tail.setAttribute('transform', `rotate(${f1(Math.sin(time * 3) * 8)} -4 -4)`);
  squirrel.g.setAttribute('opacity', f2(1 - smooth(.5, .8, night)));
  squirrel.g.style.pointerEvents = night > .7 ? 'none' : '';
  // 麋鹿：低頭吃草、偶爾往旁邊走幾步（頭與身體朝走的方向），點了抬頭
  elks.forEach((E, i) => {
    E.alert = Math.max(0, E.alert - dt); E.wait -= dt;
    if (E.wait <= 0 && E.alert <= 0) { E.wait = rand(5, 11); E.tx = clamp(E.x + rand(-70, 70), 1240, 1580); }
    const o = elks[1 - i];
    if (E.tx != null && Math.abs(E.tx - E.x) > 1 && E.alert <= 0) {
      const d = Math.sign(E.tx - E.x);
      if (o && Math.abs(o.x - (E.x + d * 6)) < 60 && Math.sign(o.x - E.x) === d) E.tx = null;
      else { E.dir = d; E.x += d * adt * 10; E.walk += adt * 6; }
    } else E.tx = null;
    E.fl.setAttribute('transform', `scale(${E.dir * E.s} ${E.s})`);
    E.g.setAttribute('transform', `translate(${f1(E.x)} ${f1(E.y)})`);
    const moving = E.tx != null;
    const g2 = E.alert > 0 ? -6 : moving ? 8 : 30 + Math.sin(time * .6 + i) * 6 + (Math.sin(time * .23 + i * 3) > .8 ? -30 : 0);
    E.ph = lerp(E.ph, g2, Math.min(1, dt * 3));
    E.neck.setAttribute('transform', `rotate(${f1(E.ph)} 14 -26)`);
    const la = moving ? Math.sin(E.walk) * 16 : 0;
    E.legs.forEach((lg, k) => { const x0 = [-13, -9, 10, 14][k]; lg.setAttribute('transform', `rotate(${f1(k % 2 ? la : -la)} ${x0} -16)`); });
  });
  // 接駁公車：從右邊開來、在站牌停靠，再轉進刺柏後面的彎道；晚上開大燈
  if (bus.s < 0) { bus.s += dt * 20; }
  else {
    const stopS = bus.stopS;
    if (!bus.served && bus.s >= stopS) { bus.served = true; bus.stop = 4; bus.doorT = 4; if (userGesture) sfxSoft('door'); }
    bus.stop = Math.max(0, bus.stop - dt); bus.doorT = Math.max(0, (bus.doorT || 0) - dt);
    const target = bus.stop > 0 ? 0 : 60;
    // 進站前慢慢煞車
    const brake = !bus.served ? clamp((stopS - bus.s) / 80, .25, 1) : 1;
    bus.v = lerp(bus.v, target * brake, Math.min(1, dt * 1.5));
    if (bus.stop <= 0 || bus.v > 1) bus.s += adt * bus.v;
    if (bus.s > roadLen + 10) { bus.s = -rand(220, 420); bus.served = false; bus.v = 60; }
  }
  const bq = roadAt(Math.max(0, bus.s)), bth = Math.atan2(bq.dy, Math.abs(bq.dx)) * 180 / Math.PI;
  bus.x = bq.x; bus.y = bq.y;
  bus.g.setAttribute('transform', `translate(${f1(bq.x)} ${f1(bq.y + 8)}) rotate(${f1(-bth * .9)}) scale(.92)`);
  bus.g.style.display = bus.s < 0 ? 'none' : '';
  bus.wheel += adt * bus.v * 8;
  bus.wheels.forEach(w => w.lastChild.setAttribute('transform', `rotate(${f1(-bus.wheel)})`));
  const doorK = win(0, .4, 3.4, 4, 4 - (bus.doorT || 0)) * (bus.doorT > 0 ? 1 : 0);
  bus.doorOpen.setAttribute('opacity', f2(doorK * .9));
  const lights = smooth(.3, .7, night) + wx.rain * .5 + wx.snow * .5;
  bus.beam.setAttribute('opacity', f2(clamp(lights, 0, 1)));
  bus.head.setAttribute('opacity', f2(.4 + clamp(lights, 0, 1) * .6));
  bus.winGlow.setAttribute('opacity', f2(smooth(.4, .8, night)));
  // 南緣步道的健行者：往右的走裡側、往左的走外側，同方向保持距離
  walkers.forEach((p, i) => {
    p.pause = Math.max(0, p.pause - dt); p.wave = Math.max(0, p.wave - dt);
    let v = p.v;
    walkers.forEach(q => { if (q !== p && q.dir === p.dir) { const gap = (q.x - p.x) * p.dir; if (gap > 0 && gap < 46) v = Math.min(v, q.pause > 0 ? 0 : q.v * .9); } });
    if (p.pause <= 0 && !reduced) p.x += adt * v * p.dir;
    if (p.dir > 0 && p.x > 1180) p.x = -70; if (p.dir < 0 && p.x < -70) p.x = 1180;
    p.y = p.dir > 0 ? 588 : 600;
    p.g.setAttribute('transform', `translate(${f1(p.x)} ${f1(p.y)})`);
    const moving = p.pause <= 0 && !reduced && v > 1;
    walkPose(p, moving ? time * 7 + i : 0, moving ? 22 : 0);
    if (p.wave > 0) p.arm.setAttribute('transform', `rotate(${f1(-150 + Math.sin(time * 12) * 18)} .7 -26)`);
    aimBeam(p, null, null, p.dir > 0 ? 14 : 166, smooth(.5, .85, night));
  });
  // 觀景台上的人
  const peopleK = 1 - smooth(.6, .9, night);
  const tgtX = mouse.nx - parallaxX(PX.Lfore), tgtY = Math.max(mouse.ny, 200);
  cheerT = Math.max(0, cheerT - dt);
  const back = shelter > 0 ? 1 : 0;
  ranger.point = Math.max(0, ranger.point - dt);
  ranger.arm.setAttribute('transform', `rotate(${f1(ranger.point > 0 ? -86 + Math.sin(time * 2) * 4 : -10 + Math.sin(time * 1.6) * 12)} .7 -26)`);
  ranger.armB.setAttribute('transform', `rotate(${f1(Math.sin(time * 1.2) * 8)} .7 -26)`);
  ranger.head.setAttribute('transform', `rotate(${f1(Math.sin(time * .5) * 3)} .6 -30)`);
  lookers.concat([ranger]).forEach((p, i) => {
    p.g.setAttribute('opacity', f2(peopleK)); p.g.style.pointerEvents = peopleK < .3 ? 'none' : '';
    p.act = Math.max(0, p.act - dt); p.point = Math.max(0, p.point - dt); p.flashT = Math.max(0, (p.flashT || 0) - dt);
    // 雷雨時大家退後一步、用手遮頭
    const by = lerp(p.by ?? 0, back * 10, Math.min(1, dt * 3)); p.by = by;
    p.g.setAttribute('transform', `translate(${f1(p.x)} ${f1(p.y + by)})`);
  });
  lookers.forEach((p, i) => {
    let a;
    if (back) a = -160 + Math.sin(time * 3 + i) * 6;
    else if (cheerT > 0) a = -150 + Math.sin(time * 14 + i) * 20;
    else if (p.point > 0) a = -86;
    else if (p.act > 0 || p.o.binoc) a = -100 + Math.sin(time * .8 + i) * 3;
    else a = Math.sin(time * .6 + i) * 4;
    p.arm.setAttribute('transform', `rotate(${f1(a)} .7 -26)`);
    if (p.cam && p.o.phone) p.cam.setAttribute('opacity', p.act > 0 || cheerT > 0 ? 1 : 0);
    if (p.fl2) p.fl2.setAttribute('opacity', f2(p.flashT > 0 ? p.flashT / .3 : 0));
    p.up.setAttribute('transform', `translate(0 ${f1(Math.sin(time * 1.4 + i) * .25)})`);
  });
  // 攝影者：白天站在三腳架旁邊，晚上開紅光頭燈拍星空
  photog.act = Math.max(0, photog.act - dt);
  photog.arm.setAttribute('transform', `rotate(${f1(photog.act > 0 ? -70 : -40 + Math.sin(time * .5) * 3)} .7 -26)`);
  tripod.blink = Math.max(0, (tripod.blink || 0) - dt);
  tripod.led.setAttribute('opacity', f2(Math.max(smooth(.5, .9, night) * (Math.sin(time * 3) > 0 ? 1 : .2), tripod.blink)));
  aimBeam(photog, tgtX, tgtY, 150, smooth(.55, .9, night));
  aimBeam(ranger, tgtX, tgtY, 20, 0);
  // 樹隨風擺
  pineSw.forEach(T2 => { T2.k = Math.max(0, T2.k - dt * .7); const a = Math.sin(time * (1 + T2.k * 5) + T2.x) * (.6 + wx.wind * 2.2 + T2.k * 3); T2.sw.setAttribute('transform', `rotate(${f2(a * .4)} 0 ${T2 === trees.P1t ? -260 : -40})`); });
  for (let i = tweens.length - 1; i >= 0; i--) { const tw = tweens[i]; tw.t += dt; const k = Math.min(1, tw.t / tw.dur); tw.fn(k); if (k >= 1) { tweens.splice(i, 1); tw.done && tw.done(); } }
  updateLens();
}

/* ---- 太陽光束（傍晚太陽低低地照進峽谷時最明顯） ---- */
const rays = [];
function drawLens() {
  const rg = $('raysG');
  for (let i = 0; i < 9; i++) { const n = el('path', { d: '', fill: 'url(#rayG)' }, rg); rays.push({ n, w: srand(10, 24), l: srand(600, 1000), ph: srand(0, 6) }); }
}
function updateLens() {
  const vis = sunUp * (1 - wx.cloud * .95) * (1 - wx.fog * .8) * smooth(-60, 120, sunY);
  if (vis < .01) { $('raysG').setAttribute('opacity', 0); return; }
  const base = sunX < 800 ? -18 : 162;
  rays.forEach((r, i) => {
    const a = (base + i * 7.5) * Math.PI / 180, w = r.w * .7 * (.8 + .2 * Math.sin(time * .3 + r.ph)), L = r.l;
    r.n.setAttribute('d', `M${f1(sunX)} ${f1(sunY)}L${f1(sunX + Math.cos(a) * L - Math.sin(a) * w)} ${f1(sunY + Math.sin(a) * L + Math.cos(a) * w)}L${f1(sunX + Math.cos(a) * L + Math.sin(a) * w)} ${f1(sunY + Math.sin(a) * L - Math.cos(a) * w)}Z`);
  });
  $('raysG').setAttribute('opacity', f2(vis * (.1 + dusk * .3 + alpen * .2)));
}

/* ---------------- 初始化 ---------------- */
function init() {
  drawSky(); drawClouds(); drawCb();
  drawNorthRim();
  drawFar();
  drawMid();
  drawGorge();
  drawRafts();
  drawSpurs();
  drawNear();
  drawMules();
  drawSheep();
  const air = LY.Lair;
  drawCondor(air, 640, 250, 220, 50, .16, 1.15, '27');
  drawCondor(air, 1180, 200, 160, 40, .2, .8, 'H5');
  const rg = el('g', {}, air);
  makeRaven(rg, 420, 330, 120, 30, .4); makeRaven(rg, 1300, 300, 140, 26, .35);
  drawFore();
  drawSquirrel();
  drawPerch();
  drawElk();
  drawBus();
  bus.stopS = (() => { let best = 0, bd = 1e9; for (let s = 0; s < roadLen; s += 2) { const q = roadAt(s); const d = Math.abs(q.x - 1400); if (d < bd) { bd = d; best = s; } } return best; })();
  bus.s = 40; bus.v = 50;
  drawOverlookPeople();
  drawWalkers();
  // 往左走的健行者走外側（比較靠近鏡頭），所以畫在最上層
  walkers.filter(p => p.dir < 0).forEach(p => p.g.parentNode.appendChild(p.g));
  trees = drawTrees();
  drawWeather();
  drawLens();
  bindAll();
  if (reduced) { T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false'); }
  setWeather(0);
  applyColors(true);
  step(1 / 60);
  requestAnimationFrame(loop);
  // 網站「作者精選」播放區（純插畫版放在 iframe 裡）：預設輪播峽谷夕照；不會自己出聲。
  const inPicks = (() => { let top = true; try { top = window.top === window; } catch (e) { top = false; } return !!document.getElementById('pure-art') && !top; })();
  if (inPicks) {
    setTimeout(() => startShow('sunset', true), 800);
    setInterval(() => { if (!show.on) startShow('sunset', !pickAudio); }, 6000);   // 打開配樂後，每一輪夕照都配上音樂
    window.sceneMusic = {
      playing: false,
      start(c) {
        if (this.playing) return; this.playing = true; pickAudio = true; userGesture = true;
        if (c && c !== actx) useCtx(c); else ensureAudio();
        if (actx && actx.state !== 'running') actx.resume();
        if (show.on && show.t < 4) playSunsetMusic();
      },
      stop() { this.playing = false; pickAudio = false; stopAll(); },
      duck() {}
    };
  }
}
init();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on && show.kind,
  btn: { sunset: 'btnSunset', storm: 'btnStorm' },
  ff: () => { show.cues = new Proxy({}, { get: () => 1 }); show.t = show.dur - .02; },
  save: () => ({ t: T.t, auto: T.auto, w: wxIdx }),
  stop: () => endShow(),
  restore: s => { if (wxIdx !== s.w) setWeather(s.w); rainbowT = 0; T.t = s.t; T.auto = s.auto; $('btnAuto') && $('btnAuto').setAttribute('aria-pressed', String(T.auto)); applyColors(true); }
});
/* /ShowStop */
})();
</script>
