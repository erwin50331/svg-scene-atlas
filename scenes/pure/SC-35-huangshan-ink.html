<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>黃山迎客松的雲海日出</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-35 黃山迎客松的雲海日出｜墨水畫（水墨山水＋淡彩）
   地點：中國安徽黃山。站在玉屏樓前的觀景平台，左邊是千年的迎客松，
        遠處依序是天都峰（鯽魚背石階）、黃山最高的蓮花峰、夢筆生花、
        山頂有氣象站白色圓頂的光明頂、立在山脊上的飛來石；
        峰與峰之間是翻騰的雲海，雲從山坳流下來就是「雲瀑」。
   人物與生活：導遊舉小旗帶團、拍照的遊客、架腳架的攝影師、在鐵鍊上掛同心鎖的情侶、
        看護迎客松的守松人、挑著扁擔上山的挑山工、登山客、
        吊在峭壁上撿垃圾的清潔工（俗稱「蜘蛛人」）、索道纜車。
   動物：黃山短尾猴、紅嘴相思鳥。
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   風格重點：宣紙底、墨分五色（遠山淡、近石濃）、山腳用漸層留白成雲霧、
            皴筆與苔點、松針一簇簇畫成扇形，只在松、人、太陽上加一點淡彩。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），部分另有 --k-名稱（晨昏）。
   JS 會依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）。
   ========================================================= */
:root{
  color-scheme: light;

  /* —— 宣紙與天空 —— */
  --d-paper:#f1e9d6;     --k-paper:#f2d9bc;     --n-paper:#1f2533;
  --d-paper-top:#e2dccb; --k-paper-top:#c9a6a0; --n-paper-top:#111622;
  --d-sun:#d8432c;       --k-sun:#e2482a;       --n-sun:#b8402c;
  --d-sunglow:#f3c9a0;   --k-sunglow:#f6b07a;   --n-sunglow:#3a3040;

  /* —— 墨色五階：遠山最淡、近石最濃 —— */
  --d-ink-far:#bdb8ab;   --k-ink-far:#bfa49a;   --n-ink-far:#2f3747;
  --d-ink-far2:#a7a397;  --k-ink-far2:#a88f8a;  --n-ink-far2:#283040;
  --d-ink-mid:#86847c;   --k-ink-mid:#7f6c6c;   --n-ink-mid:#222a38;
  --d-ink-near:#4a4843;  --k-ink-near:#4a3c3c;  --n-ink-near:#10141c;
  --d-ink:#1e1d1b;       --n-ink:#05070b;
  --d-rock:#cfc4ab;      --k-rock:#d3b69c;      --n-rock:#2b3140;   /* 近石的赭石淡彩 */
  --d-rock-dk:#a59a82;   --n-rock-dk:#212632;
  --d-stone:#d8d0bc;     --k-stone:#dcc4a8;     --n-stone:#2c3240;   /* 平台石板、石階 */
  --d-stone-dk:#a8a08c;  --n-stone-dk:#1c212c;

  /* —— 雲海 —— */
  --d-cloud:#fffdf8;     --k-cloud:#fde6cc;     --n-cloud:#56627a;
  --d-cloud-sh:#c4beae;  --k-cloud-sh:#d8b2a2;  --n-cloud-sh:#323b50;
  --d-mist:#efe9da;      --k-mist:#efd2b8;      --n-mist:#2a3142;

  /* —— 松樹淡彩 —— */
  --d-pine:#26302a;      --n-pine:#080c0e;
  --d-pine-tint:#7e9a78; --k-pine-tint:#7d8a66; --n-pine-tint:#1c2826;
  --d-bark:#4e4136;      --n-bark:#0e1014;

  /* —— 人物淡彩 —— */
  --d-skin:#ecc9a2;      --n-skin:#5c5258;
  --d-red:#c4412e;       --n-red:#4e2626;      /* 團帽、同心鎖、小旗 */
  --d-blue:#5a7896;      --n-blue:#232e3e;
  --d-ochre:#c89a48;     --n-ochre:#43392c;
  --d-teal:#5f8c84;      --n-teal:#213230;
  --d-plum:#8a5a6e;      --n-plum:#30232c;
  --d-white:#efeae0;     --n-white:#4a5060;
  --d-army:#5d6b3c;      --n-army:#252b1c;     /* 山頂出租的軍大衣（看日出時穿） */
  --d-vest:#e07a2a;      --n-vest:#5a3420;     /* 清潔工的橘色背心 */
  --d-guard:#4f6150;     --n-guard:#1c2420;    /* 守松人制服 */
  --d-monkey:#9a7a5c;    --n-monkey:#33302e;   /* 黃山短尾猴 */
  --d-mface:#d8a090;     --n-mface:#4a3a3a;
  --d-bird:#8a9a52;      --n-bird:#2a3020;     /* 紅嘴相思鳥 */
  --d-bird-y:#e8b83a;    --n-bird-y:#4a4024;

  /* —— 建築 —— */
  --d-wall:#f4f0e6;      --n-wall:#3a4050;     /* 徽派白牆 */
  --d-window:#3a3a38;    --n-window:#ffcf78;   /* 窗戶：夜裡亮燈 */
  --d-cabin:#d9d2bf;     --n-cabin:#3a4052;    /* 纜車車廂 */

  /* —— 不隨日夜變化的顏色 —— */
  --moon:#f6efd8; --star:#f4eedc; --snow:#ffffff; --rain:#4a4c58; --flash:#ffffff;
  --glory-1:#c84a5a; --glory-2:#e8a23a; --glory-3:#e8dc6a; --glory-4:#6aba7a; --glory-5:#5a8ad0; --glory-6:#8a6ac8;
  --lamp:#fff0b0;

  /* —— 頁面介面 —— */
  --page-bg:#efe7d4; --page-fg:#2a2622; --page-muted:#6e665a;
  --ui-surface:#f8f3e6; --ui-line:#cfc4aa; --ui-accent:#3a4a42; --ui-hot:#b8402c; --ui-hot2:#5a6f88;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-brush:"Kaiti TC","STKaiti","BiauKai","DFKai-SB","Noto Serif TC",serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border:6px solid var(--ui-surface);outline:1px solid var(--ui-line);border-radius:3px;overflow:hidden;background:#1f2533;line-height:0;
  box-shadow:0 6px 18px rgba(40,30,20,.12)}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:3px;padding:10px 14px}
.panel button{font:700 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1.5px solid var(--ui-line);
  border-radius:3px;padding:9px 14px;cursor:pointer;letter-spacing:.04em}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:#fff}
.panel button.big{border-color:var(--ui-hot);color:#fff;background:var(--ui-hot)}
.panel button.big2{border-color:var(--ui-hot2);color:#fff;background:var(--ui-hot2)}
.panel button.on{background:#e8b84a!important;border-color:#e8b84a!important;color:var(--page-fg)!important}
.panel button:disabled{opacity:.45;cursor:default}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid #b8402c;outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(220px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding:0;list-style:none;color:var(--page-muted);font-size:14px;line-height:1.8;display:flex;flex-wrap:wrap;gap:4px 22px}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .bubble path{fill:#fbf7ec;stroke:#2a2622;stroke-width:1.4}
#scene .bubble text{fill:#2a2622;font:700 16px var(--font-brush);text-anchor:middle;dominant-baseline:central}
</style>
<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。
   想恢復完整版，刪掉這整段 <style id="pure-art"> 即可。
   ========================================================= */
html,body{height:100%;margin:0!important;overflow:hidden}
body{display:flex!important;align-items:center;justify-content:center;padding:0!important}
body>.wrap{width:100%!important;max-width:min(100vw,calc(100vh * 8 / 3))!important;
  margin:0!important;padding:0!important;gap:0!important;display:block!important}
body>.wrap>:not(.stage){display:none!important}
body>.wrap>.stage{width:100%!important;max-width:100%!important;margin:0!important;
  border:0!important;border-radius:0!important;box-shadow:none!important}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：宣紙天空 → 星星、月亮、太陽 → 淡墨雲絲、飛鳥
       → 遠山（最淡）→ 遠雲帶 → 名峰（天都峰、蓮花峰、夢筆生花、光明頂、飛來石）
       → 索道纜車 → 主雲海、雲瀑、佛光 → 近雲 → 右側石階山岩（挑山工、登山客、猴子、清潔工）
       → 左側峭壁與迎客松 → 玉屏樓平台（遊客、同心鎖）→ 雨雪 → 宣紙紋理
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="水墨畫風格的黃山：左邊峭壁上長著伸出長枝的迎客松，前面平台上有導遊帶團、遊客拍照、情侶在鐵鍊上掛同心鎖；遠方是天都峰、蓮花峰、夢筆生花、光明頂和飛來石，山腳都被翻騰的雲海淹沒；纜車從雲海裡升上光明頂，右邊的石階上挑山工挑著扁擔上山，岩頂坐著幾隻短尾猴">
    <defs>
      <!-- 宣紙天空：上深下淺 -->
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--paper-top)"/><stop offset=".62" style="stop-color:var(--paper)"/><stop offset="1" style="stop-color:var(--paper)"/>
      </linearGradient>
      <!-- 山的墨色：上濃下淡，山腳化成留白的雲霧 -->
      <linearGradient id="gFar" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--ink-far)"/><stop offset=".45" style="stop-color:var(--ink-far)" stop-opacity=".8"/><stop offset="1" style="stop-color:var(--ink-far)" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="gFar2" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--ink-far2)"/><stop offset=".5" style="stop-color:var(--ink-far2)" stop-opacity=".75"/><stop offset="1" style="stop-color:var(--ink-far2)" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="gMid" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--ink-mid)"/><stop offset=".35" style="stop-color:var(--ink-mid)" stop-opacity=".85"/><stop offset=".8" style="stop-color:var(--ink-mid)" stop-opacity=".25"/><stop offset="1" style="stop-color:var(--ink-mid)" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="gRock" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" style="stop-color:var(--rock)"/><stop offset=".7" style="stop-color:var(--rock-dk)"/><stop offset="1" style="stop-color:var(--rock-dk)" stop-opacity=".6"/>
      </linearGradient>
      <!-- 雲：中心濃、邊緣化開 -->
      <radialGradient id="puffG"><stop offset="0" style="stop-color:var(--cloud)"/><stop offset=".55" style="stop-color:var(--cloud)" stop-opacity=".85"/><stop offset="1" style="stop-color:var(--cloud)" stop-opacity="0"/></radialGradient>
      <radialGradient id="puffS"><stop offset="0" style="stop-color:var(--cloud-sh)" stop-opacity=".8"/><stop offset="1" style="stop-color:var(--cloud-sh)" stop-opacity="0"/></radialGradient>
      <radialGradient id="sunGlowG"><stop offset="0" style="stop-color:var(--sunglow)" stop-opacity=".9"/><stop offset="1" style="stop-color:var(--sunglow)" stop-opacity="0"/></radialGradient>
      <radialGradient id="moonGlowG"><stop offset="0" stop-color="#f6efd8" stop-opacity=".35"/><stop offset="1" stop-color="#f6efd8" stop-opacity="0"/></radialGradient>
      <radialGradient id="lampG"><stop offset="0" stop-color="#fff0b0" stop-opacity=".95"/><stop offset="1" stop-color="#fff0b0" stop-opacity="0"/></radialGradient>
      <radialGradient id="inkBloomG"><stop offset="0" style="stop-color:var(--ink)" stop-opacity=".55"/><stop offset=".6" style="stop-color:var(--ink)" stop-opacity=".18"/><stop offset="1" style="stop-color:var(--ink)" stop-opacity="0"/></radialGradient>
      <radialGradient id="gloryCore"><stop offset="0" stop-color="#fffbe8" stop-opacity=".95"/><stop offset=".7" stop-color="#fffbe8" stop-opacity=".5"/><stop offset="1" stop-color="#fffbe8" stop-opacity="0"/></radialGradient>
      <!-- 墨的毛邊：讓輪廓像毛筆在宣紙上暈開 -->
      <filter id="inkEdge" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="3" seed="7" result="t"/>
        <feDisplacementMap in="SourceGraphic" in2="t" scale="7" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <!-- 人物的淡淡毛邊與衣服淡彩的暈染 -->
      <filter id="inkFig" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency=".25" numOctaves="2" seed="3" result="t"/>
        <feDisplacementMap in="SourceGraphic" in2="t" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="washF" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.1"/></filter>
      <filter id="inkSoft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.6"/></filter>
      <filter id="blur3" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
      <filter id="blur8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
      <!-- 宣紙纖維與顆粒 -->
      <filter id="paperF" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".012 .05" numOctaves="3" seed="4" result="fib"/>
        <feColorMatrix in="fib" type="matrix" values="0 0 0 0 .4  0 0 0 0 .34  0 0 0 0 .25  0 0 0 -3.2 1.62" result="a"/>
        <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="1" seed="9" result="g"/>
        <feColorMatrix in="g" type="matrix" values="0 0 0 0 .3  0 0 0 0 .26  0 0 0 0 .2  0 0 0 -2.4 1.2" result="b"/>
        <feMerge><feMergeNode in="a"/><feMergeNode in="b"/></feMerge>
      </filter>
      <!-- 雨：斜斜的淡墨細線 -->
      <pattern id="rainPat" width="90" height="120" patternUnits="userSpaceOnUse">
        <g stroke="var(--rain)" stroke-width="1.1" stroke-linecap="round" opacity=".55">
          <path d="M10 6l-4 22M52 34l-4 22M78 70l-4 22M30 84l-4 22M66 2l-4 22M20 46l-4 22"/>
        </g>
      </pattern>
      <!-- 雪：大小不一的白點 -->
      <pattern id="snowPat" width="110" height="110" patternUnits="userSpaceOnUse">
        <g fill="var(--snow)">
          <circle cx="12" cy="10" r="2.2"/><circle cx="60" cy="30" r="1.6"/><circle cx="90" cy="70" r="2.6"/><circle cx="34" cy="62" r="1.4"/>
          <circle cx="76" cy="100" r="1.8"/><circle cx="20" cy="94" r="2"/><circle cx="100" cy="16" r="1.3"/><circle cx="48" cy="86" r="1.2"/>
        </g>
      </pattern>
    </defs>

    <rect id="skyHit" class="clickable" x="-50" y="-50" width="1700" height="700" fill="url(#skyGrad)"/>
    <g id="nightSky" class="noHit"></g>
    <g id="sunG" class="clickable" tabindex="0" role="button" aria-label="太陽：點一下換成夜晚"></g>
    <g id="moonG" class="clickable" tabindex="0" role="button" aria-label="月亮：點一下換成白天"></g>
    <g id="streaks" class="noHit"></g>
    <g id="air"></g>
    <g id="far" class="noHit"></g>
    <g id="cloudA" class="noHit"></g>
    <g id="mid"></g>
    <g id="tianduDots" class="noHit"></g>
    <g id="falls" class="noHit"></g>
    <g id="cable"></g>
    <rect id="sunWash" class="noHit" x="0" y="0" width="1600" height="600" fill="url(#sunGlowG)" opacity="0"/>
    <g id="glory" class="noHit" opacity="0"></g>
    <g id="cloudB"></g>
    <g id="cloudC"></g>
    <g id="right"></g>
    <g id="left"></g>
    <g id="plat"></g>
    <g id="people"></g>
    <rect id="mistVeil" class="noHit" x="0" y="0" width="1600" height="600" style="fill:var(--mist)" opacity="0"/>
    <g id="rainG" class="noHit" opacity="0">
      <rect id="rain1" x="-100" y="-240" width="1800" height="960" fill="url(#rainPat)"/>
      <rect id="rain2" x="-100" y="-240" width="1800" height="960" fill="url(#rainPat)" transform="scale(1.4)" opacity=".5"/>
    </g>
    <g id="snowG" class="noHit" opacity="0">
      <rect id="snow1" x="-120" y="-240" width="1840" height="960" fill="url(#snowPat)"/>
      <rect id="snow2" x="-120" y="-240" width="1840" height="960" fill="url(#snowPat)" transform="scale(1.6)" opacity=".7"/>
    </g>
    <g id="fx" class="noHit"></g>
    <rect id="flash" class="noHit" x="0" y="0" width="1600" height="600" fill="var(--flash)" opacity="0"/>
    <rect id="paper" class="noHit" x="0" y="0" width="1600" height="600" filter="url(#paperF)" opacity=".5"/>
    <g id="say" class="noHit"></g>
  </svg>
  </figure>

  <!-- =====================================================
       【互動】控制列（畫面中物件自己可以點的動作，這裡不再重複做按鈕）
       ===================================================== -->
  <div class="panel">
    <button id="btnShow" class="big" type="button">☁ 雲海日出</button>
    <button id="btnGlory" class="big2" type="button">🌈 佛光</button>
    <button id="btnWeather" type="button">天氣：晴</button>
    <button id="btnSound" type="button" aria-pressed="true">🔊 聲音：開</button>
    <button id="btnDay" type="button">☀ 白天</button>
    <button id="btnDusk" type="button">🌇 黃昏</button>
    <button id="btnNight" type="button">☾ 夜晚</button>
    <button id="btnAuto" type="button" aria-pressed="true">自動播放</button>
    <label class="timebox" for="timeRange">
      <span>時間</span>
      <input id="timeRange" type="range" min="0" max="1000" value="400">
      <span class="clock" id="clock">09:36</span>
    </label>
  </div>
  <ul class="hint">
    <li>☁ 雲海日出：雲瀑翻過山坳，紅日升起</li>
    <li>🌈 佛光：雲上出現七彩光環和人影</li>
    <li>🖐️ 迎客松、山峰、纜車、人和猴子都能點</li>
    <li>🌦️ 天氣可切晴、雲海、雨、雪</li>
    <li>🔇 聲音點了才響，可一鍵關閉</li>
  </ul>
</main>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）

<script>
/* =========================================================

/* ---- 單向路線：每個人只跟在前一個人後面，保持距離、不會互相穿過 ---- */
function makeTrack(pts, sp, gap) {
  const segs = []; let len = 0;
  for (let i = 0; i < pts.length - 1; i++) { const l = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]); segs.push(l); len += l; }
  return { pts, segs, len, sp, gap, items: [] };
}
function posOn(T, d) {
  d = clamp(d, 0, T.len);
  for (let i = 0; i < T.segs.length; i++) {
    if (d <= T.segs[i] || i === T.segs.length - 1) { const t = T.segs[i] ? d / T.segs[i] : 0, a = T.pts[i], b = T.pts[i + 1]; return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), b[0] >= a[0] ? 1 : -1]; }
    d -= T.segs[i];
  }
}
function stepTrack(T, dt, mv) {
  const it = T.items.sort((a, b) => b.d - a.d);
  for (let i = 0; i < it.length; i++) {
    const A = it[i];
    if (A.pause > 0) A.pause -= dt; else A.d += T.sp * A.k * dt * mv;
    if (i > 0 && it[i - 1].d - A.d < T.gap) A.d = it[i - 1].d - T.gap;
    A.moving = mv && A.pause <= 0 && (i === 0 || it[i - 1].d - A.d >= T.gap - .5);
  }
  // 走到終點的人回到隊伍最後面（在畫面外排隊，等前面的人走開才出現）
  if (it.length && it[0].d > T.len) { const A = it[0], lastD = it[it.length - 1].d; A.d = Math.min(-srand(10, 80), lastD - T.gap); }
  it.forEach(A => {
    const [x, y, dir] = posOn(T, A.d);
    const op = smooth(0, 18, A.d) * (1 - smooth(T.len - 18, T.len, A.d));
    A.P.g.setAttribute('transform', `translate(${f1(x)} ${f1(y - (A.moving ? Math.abs(Math.sin(A.ph)) * 1.2 : 0))})`);
    (A.P.outer || A.P.inner).setAttribute('transform', `scale(${f1(dir * A.P.s)} ${f1(A.P.s)})`);
    A.P.g.setAttribute('opacity', f1(op));
    A.P.g.style.visibility = op < .02 ? 'hidden' : '';
    if (A.moving) A.ph += dt * T.sp * A.k * .28;
    walkPose(A.P, A.ph, A.moving ? 5 : 0);
    if (A.P.porter) A.P.poleG.setAttribute('transform', `translate(0 ${f1(-44 + (A.moving ? Math.sin(A.ph * 2) * 1.5 : 0))}) scale(${A.P.flip ? -1 : 1} 1)`);
    A.x = x; A.y = y;
  });
}

    const sw = Math.sin(time * 1.6 + C.s * 20) * 1.2 * mv + C.swing * Math.sin(time * 9) * 8;
    C.g.setAttribute('transform', `translate(${f1(x)} ${f1(y)})`);
    C.box.setAttribute('transform', `translate(0 10) rotate(${f1(sw)} 0 -10)`);
    C.g.setAttribute('opacity', f1(smooth(.02, .12, C.s) * (1 - smooth(.95, .995, C.s))));
    C.hand.setAttribute('opacity', C.swing > .1 ? 1 : 0);
    C.hand.setAttribute('d', `M3 4L${f1(3 + Math.sin(time * 12) * 2)} -1`);
  });

  // 人：平台、石階、天都峰上的人各走各的路
  stepTrack(walkT, dt, mv);
  stepTrack(downT, dt, mv);
  stepTrack(upT, dt, mv);
  stepTrack(tdT, dt, mv);
  [walkT, downT, upT].forEach(Tk => Tk.items.forEach(A => A.P.lamp.setAttribute('opacity', f1(nightLamp))));
  tdT.items.forEach(A => A.P.lamp.setAttribute('opacity', f1(nightLamp)));
  // 導遊的小旗隨風飄
  guide.flag.setAttribute('d', `M3 -56Q12 ${f1(-55 + Math.sin(time * 4) * 3 * mv)} 22 ${f1(-50 + Math.sin(time * 4 + 1) * 2 * mv)}L3 -44Z`);
  guide.flagG.setAttribute('transform', `translate(8 -24) rotate(${f1(flagWave > 0 ? Math.sin(time * 10) * 14 : 0)})`);
  flagWave = Math.max(0, flagWave - dt);
  camT = Math.max(0, camT - dt);
  tour.forEach((P, i) => { if (i < 2) P.arm.setAttribute('transform', `translate(6 -40) rotate(${camT > 0 ? -10 : 40})`); });
  tripodFlashT = Math.max(0, tripodFlashT - dt); tripodFlash.setAttribute('opacity', f1(tripodFlashT > 0 ? tripodFlashT * 2 : 0));
  guardT = Math.max(0, guardT - dt);
  guard.arm.setAttribute('transform', `translate(6 -40) rotate(${guardT > 0 ? 0 : 70})`);
  // 小朋友跳
  kidJump = Math.max(0, kidJump - dt);
  kid.g.setAttribute('transform', `translate(${kid.x} ${f1(kid.y - Math.abs(Math.sin(kidJump * 9)) * (kidJump > 0 ? 12 : 0))})`);
  // 猴子：東張西望、小猴跳到媽媽背上
  monkeys.forEach((M, i) => {
    M.head.setAttribute('transform', `translate(5 -26) rotate(${f1(Math.sin(time * .8 + M.ph) * 10 * mv)})`);
    M.arm.setAttribute('d', `M4 -18Q10 -12 ${f1(6 + Math.sin(time * 3 + M.ph) * 2 * mv)} -4`);
    if (M.baby) {
      M.jump = Math.max(0, M.jump - dt);
      const k = M.jump > 0 ? 1 - M.jump / 1.2 : 0;
      const tx = M.jump > 0 ? lerp(M.x, 1488, k) : M.onBack ? 1488 : M.x, ty = M.jump > 0 ? lerp(M.y, 354, k) - Math.sin(k * Math.PI) * 26 : M.onBack ? 354 : M.y;
      if (M.jump > 0 && M.jump - dt <= 0) M.onBack = true;
      M.o.setAttribute('transform', `translate(${f1(tx)} ${f1(ty)})`);
    }
  });
  // 清潔工：吊在繩子上輕輕晃，點了就降下去撿垃圾再上來
  const C = cleaner;
  if (C.drop > 0) {
    C.drop -= dt; const k = 1 - C.drop / 4;
    C.dy = Math.sin(Math.min(1, k * 1.25) * Math.PI) * 60;
    C.litter.setAttribute('opacity', k < .45 ? 1 : 0);
  } else C.dy = 0;
  const cx = C.x + Math.sin(time * .9) * 2 * mv, cy = C.y + C.dy;
  C.wrap.setAttribute('transform', `translate(${f1(cx)} ${f1(cy)}) rotate(-12)`);
  C.rope.setAttribute('d', `M${C.ax} ${C.ay}Q${f1((C.ax + cx) / 2 + 6)} ${f1((C.ay + cy) / 2 - 10)} ${f1(cx + 2)} ${f1(cy - 30)}`);
  C.litter.setAttribute('transform', `translate(1258 ${C.y + 54})`);

  // 佛光、飛來石搖晃、墨點飛鳥
  if (glory.on) gloryStep(dt);
  feilaiWob = Math.max(0, feilaiWob - dt);
  feilaiRock.setAttribute('transform', `translate(1512 258) rotate(${f1(feilaiWob > 0 ? Math.sin(time * 16) * feilaiWob * 1.6 : 0)})`);
  for (let i = flock.length - 1; i >= 0; i--) {
    const b = flock[i]; b.t += dt; b.x += b.vx * dt; b.y += b.vy * dt;
    b.g.setAttribute('transform', `translate(${f1(b.x)} ${f1(b.y)}) scale(${b.vx < 0 ? -1 : 1} ${f1(.6 + Math.abs(Math.sin(time * 12 + b.ph)) * .6)})`);
    b.g.setAttribute('opacity', f1(1 - smooth(b.life - .8, b.life, b.t)));
    if (b.t > b.life) { b.g.remove(); flock.splice(i, 1); }
  }
  for (let i = tweens.length - 1; i >= 0; i--) { const w = tweens[i]; w.t += dt; const k = Math.min(1, w.t / w.dur); w.fn(k); if (k >= 1) { tweens.splice(i, 1); w.done && w.done(); } }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.t += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    p.n.setAttribute('cx', f1(p.x)); p.n.setAttribute('cy', f1(p.y)); p.n.setAttribute('r', f1(p.r + p.grow * p.t));
    p.n.setAttribute('opacity', f1(p.op * (1 - p.t / p.life)));
    if (p.t > p.life) { p.n.remove(); parts.splice(i, 1); }
  }
}
let flagWave = 0, guardT = 0, kidJump = 0, feilaiWob = 0;

/* ---------------- ⑤ 互動：綁定 ---------------- */
function bindAll() {
  onAct($('sunG'), () => { sunBump = 14; sfx('ding'); setTime(21); });
  onAct($('moonG'), () => { sfx('ding'); setTime(9.6); });
  $('skyHit').addEventListener('click', e => { userGesture = true; ensureAudio(); const p = svgPoint(e); skyClick(p.x, p.y); });
  // 名峰：墨在宣紙上暈開、古琴撥一聲、浮出峰名
  Object.entries(PEAKS).forEach(([key, P]) => onAct(P.g, e => {
    const p = svgPoint(e); inkBloom(p.x, p.y); sfx(key === 'feilai' ? 'knock' : 'pluck');
    const top = P.pts.reduce((a, b) => a[1] < b[1] ? a : b);
    say(top[0], top[1] - (key === 'feilai' ? 110 : 34), P.name, 1.8);
    if (key === 'feilai') feilaiWob = 1.4;
  }));
  // 雲海：點一下雲浪湧起、雲從山坳流下
  [$('cloudB'), $('cloudC')].forEach(g => { clickable(g, '雲海：點一下雲浪翻湧'); onAct(g, e => { const p = svgPoint(e); cloudPoke(p.x, p.y); }); });
  onAct(pine.g, () => { pine.bow = 1; pine.gust = 1.2; sfx('pine'); });
  onAct($('birdsG'), () => { if (birds[0].fly > 0) return; birds.forEach((B, i) => setTimeout(() => B.fly = 2.6, i * 160)); sfx('song'); });
  CAB.cabins.forEach(C => onAct(C.g, () => { C.swing = 1.4; sfx('clank'); }));
  onAct($('tourG'), () => { flagWave = 1.6; raiseCams(2.2); say(guide.x + 12, guide.y - 96, pick(['來，大家拍照！', '跟著小旗走喔', '這就是迎客松']), 1.8); sfx('shutter'); });
  onAct(guard.g.parentNode, () => { guardT = 2.6; say(guard.x, guard.y - 78, pick(['松樹一切安好', '今天風有點大', '枝條狀況良好']), 2); sfx('page'); });
  onAct(photog.g.parentNode, () => { tripodFlashT = .5; sfx('shutter'); say(photog.x + 20, photog.y - 80, night > .5 ? '拍星空' : pick(['好雲！', '再等一下光']), 1.4); });
  onAct($('coupleG'), () => {
    const used = new Set([...lockG.children].map(n => n.getAttribute('transform')));
    const free = LOCK_SPOTS.filter(p => !used.has(`translate(${f1(p[0])} ${f1(p[1])})`));
    const p = free.length ? free[Math.floor(free.length / 2)] : pick(LOCK_SPOTS);
    const l = addLock(p[0], p[1], true);
    tween(.6, k => l.setAttribute('opacity', f1(k)));
    couple[0].arm.setAttribute('transform', 'translate(6 -40) rotate(-30)'); setTimeout(() => couple[0].arm.setAttribute('transform', 'translate(6 -40)'), 900);
    say(couple[0].x, couple[0].y - 80, pick(['永結同心', '一起再來', '鎖好了']), 1.6); sfx('bell');
  });
  onAct(kid.g.parentNode, () => { kidJump = 1.1; say(kid.x + 10, kid.y - 60, pick(['雲在跑！', '好高喔！', '有猴子！']), 1.6); sfx('pop'); });
  [walkT, downT, upT].forEach(Tk => Tk.items.forEach(A => onAct(A.W, () => {
    if (A.P.porter) { A.pause = 1.2; A.P.flip = !A.P.flip; say(A.x, A.y - 74, pick(['嘿咻！', '換個肩膀', '再挑一段']), 1.4); sfx('creak'); return; }
    A.pause = .8; say(A.x, A.y - (Tk === walkT ? 80 : 66), pick(Tk === walkT ? ['你好！', '加油！', '去看日出嗎？'] : Tk === upT ? ['快到了！', '腿好痠', '再一百階'] : ['下山囉', '好累但值得']), 1.4); sfx('tap');
  })));
  onAct($('monkeys'), () => { const b = monkeys.find(M => M.baby); if (b.onBack) { b.onBack = false; } else b.jump = 1.2; sfx('monkey'); });
  onAct(cleaner.wrap, () => { if (cleaner.drop > 0) return; cleaner.drop = 4; sfx('zip'); setTimeout(() => say(1240, cleaner.y - 30, '撿到了！', 1.2), 1700); });
  svg.addEventListener('pointermove', e => { const p = svgPoint(e); mouse.x = p.x; mouse.y = p.y; mouse.in = true; });
  svg.addEventListener('pointerleave', () => { mouse.in = false; });

  $('btnShow').addEventListener('click', () => startShow());
  $('btnGlory').addEventListener('click', () => { userGesture = true; ensureAudio(); startGlory(); });
  $('btnWeather').addEventListener('click', () => { userGesture = true; ensureAudio(); setWeather((wxIdx + 1) % WX.length); if (WX[wxIdx][0] === 'sea') sfx('whoosh'); });
  $('btnSound').addEventListener('click', () => {
    soundOn = !soundOn; userGesture = true; ensureAudio();
    if (master) master.gain.setValueAtTime(soundOn ? .6 : 0, actx.currentTime);
    if (!soundOn) { stopAll(); rainSound(false); } else rainSound(WX[wxIdx][0] === 'rain');
    $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  });
  $('btnDay').addEventListener('click', () => setTime(9.6));
  $('btnDusk').addEventListener('click', () => setTime(18.2));
  $('btnNight').addEventListener('click', () => setTime(22));
  $('btnAuto').addEventListener('click', () => { T.auto = !T.auto; $('btnAuto').setAttribute('aria-pressed', String(T.auto)); });
  const tr = $('timeRange');
  tr.addEventListener('input', () => { if (show.on) return; T.dragging = true; T.t = tr.value / 1000; applyColors(true); });
  tr.addEventListener('change', () => { T.dragging = false; });
  window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
  window.addEventListener('pointerdown', () => document.body.classList.remove('kbd'));
  mq.addEventListener && mq.addEventListener('change', () => { reduced = mq.matches; });
}

/* ---------------- 初始化 ---------------- */
function init() {
  // 晨昏時照在山上的暖光（中心跟著太陽移動）
  washG = el('radialGradient', { id: 'washG', gradientUnits: 'userSpaceOnUse', cx: 1300, cy: 300, r: 900 }, svg.querySelector('defs'));
  el('stop', { offset: 0, style: 'stop-color:var(--sunglow)', 'stop-opacity': .9 }, washG);
  el('stop', { offset: .5, style: 'stop-color:var(--sunglow)', 'stop-opacity': .35 }, washG);
  el('stop', { offset: 1, style: 'stop-color:var(--sunglow)', 'stop-opacity': 0 }, washG);
  $('sunWash').setAttribute('fill', 'url(#washG)');
  drawSky();
  drawFar();
  drawClouds();
  drawMid();
  drawCable();
  drawGlory();
  drawRight();
  drawLeft();
  drawPlatform();
  drawPeople();
  bindAll();
  if (reduced) { T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false'); }
  setWeather(0);
  Object.assign(wx, wxT);
  applyColors(true);
  step(1 / 60);
  requestAnimationFrame(loop);
}
init();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on ? 'show' : glory.on ? 'glory' : '',
  btn: { show: 'btnShow', glory: 'btnGlory' },
  ff: () => { if (show.on) { show.fired = new Proxy({}, { get: () => 1 }); show.t = show.dur; } else glory.t = glory.dur; },
  save: () => ({ t: T.t, auto: T.auto, w: wxIdx }),
  stop: () => { if (glory.on) endGlory(); show.on = false; surge = 0; glowAdd = 0; coatMode = null; $('btnShow').classList.remove('on'); $('btnGlory').disabled = false; },
  restore: s => { if (wxIdx !== s.w) setWeather(s.w); T.t = s.t; T.auto = s.auto; $('btnAuto') && $('btnAuto').setAttribute('aria-pressed', String(T.auto)); applyColors(true); }
});
/* /ShowStop */
})();
</script>
