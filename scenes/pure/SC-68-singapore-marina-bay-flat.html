<style>
/* =========================================================
   SC-68 新加坡・濱海灣｜扁平插畫 flat illustration
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   --d-名稱 = 白天、--n-名稱 = 夜晚、--k-名稱 = 黃昏（可省略）。
   JS 依時間自動混色，輸出成 --名稱，並產生 .f-名稱（填色）、.s-名稱（線色）兩種 class。

   ========================================================= */

  --d-skyB:#bfe7f7;  --n-skyB:#2a2a5c;  --k-skyB:#ff9e6e;

  --d-cloudSh:#dbe9f3; --n-cloudSh:#2b3260; --k-cloudSh:#f2a487;

  /* —— 海灣 —— */
  --d-sea:#1d8fb8;   --n-sea:#0b1a3c;  --k-sea:#3d5f98;

  --d-seaDk:#14678f; --n-seaDk:#08112a; --k-seaDk:#2c4378;

  --d-cityFar:#a9c9dc; --n-cityFar:#1d2550; --k-cityFar:#b99aa8;

  --d-bldLn:#5f86a3; --n-bldLn:#121a3a;
  --d-winD:#7aa3c0;  --n-winD:#1a2448;

  --d-mbsDk:#7f9fb6; --n-mbsDk:#1b2449; --k-mbsDk:#b0838a;
  --d-park:#f4f6f7;  --n-park:#4d5885;  --k-park:#ffe0c8;
  --d-parkSh:#b9c6d0; --n-parkSh:#2a3360;

  /* —— 堤岸、濱海灣花園 —— */

  --d-bankDk:#aaa393; --n-bankDk:#26263e;
  --d-grass:#5fae4e; --n-grass:#1c3a33;

  --d-treeLt:#58b45e; --n-treeLt:#1a4234;

  --d-merlSh:#d5d3cb; --n-merlSh:#565a7a; --k-merlSh:#eeb79a;

  /* —— 船、小販推車 —— */
  --d-hullR:#b4452f; --n-hullR:#4a2430;
  --d-hullB:#2f7f8c; --n-hullB:#173a48;
  --d-hullY:#e0a52e; --n-hullY:#5c4a2c;
  --d-hullW:#f4efe3; --n-hullW:#6b6c8a;
  --d-roof1:#c9352f; --n-roof1:#4c1f2c;
  --d-roof2:#2d6db2; --n-roof2:#1b2e58;
  --d-wood:#7a5236;  --n-wood:#2e2329;
  --d-tyre:#2a2a2e;  --n-tyre:#111118;
  --d-cart:#f4f0e6;  --n-cart:#6d6e8c;
  --d-cartR:#e0453c; --n-cartR:#5a2433;

  --d-umb2:#f5c331; --n-umb2:#6a5a2e;
  --d-umb3:#3aa55d; --n-umb3:#1e4a36;
  --d-umb4:#2f7fd0; --n-umb4:#1e3360;
  --d-bread1:#f7a1c4; --n-bread1:#6a4560;
  --d-bread2:#9fe07a; --n-bread2:#40603a;

  /* —— 動物 —— */
  --d-otter:#6b4a33; --n-otter:#2c2229;
  --d-otterLt:#a88566; --n-otterLt:#4a3d42;
  --d-bird:#2f2f3a;  --n-bird:#a0a6c4;

  /* —— 人物 —— */
  --d-skin1:#f3d4b7; --n-skin1:#9a8c9e;
  --d-skin2:#d4a179; --n-skin2:#7d6a7c;
  --d-skin3:#8d6145; --n-skin3:#55465a;
  --d-hair1:#231d22; --n-hair1:#121224;
  --d-hair2:#6e4a30; --n-hair2:#3a2e3c;
  --d-hair3:#c9c4bb; --n-hair3:#6f6f86;
  --d-coat1:#e2574c; --n-coat1:#6e3245;
  --d-coat2:#3f7fc6; --n-coat2:#2a3f6e;
  --d-coat3:#f0bf45; --n-coat3:#76643e;
  --d-coat4:#3fb08a; --n-coat4:#235050;
  --d-coat5:#9b6cba; --n-coat5:#4d3a6a;
  --d-coat6:#f5a7b8; --n-coat6:#7a5577;
  --d-coat7:#2f3b52; --n-coat7:#1d2440;
  --d-coat8:#f7f3ea; --n-coat8:#7d829c;
  --d-coat9:#ff8a3d; --n-coat9:#74422e;
  --d-pants1:#33384f; --n-pants1:#151a30;
  --d-pants2:#b79f7d; --n-pants2:#4c4350;
  --d-pants3:#5b7fa8; --n-pants3:#2a3a5c;
  --d-black:#24222a; --n-black:#101018;
  --d-sari1:#d8336e; --n-sari1:#5a2140;
  --d-sari2:#f4b73a; --n-sari2:#6b5530;
  --d-tud1:#4aa3a8;  --n-tud1:#204a52;
  --d-tud2:#c78bd0;  --n-tud2:#56406a;

  /* —— 固定色（燈光、天體、特效、表演） —— */
  --glow:#ffd98a;      /* 窗光 */
  --lamp:#ffe7a8;      /* 路燈 */
  --led:#9fe8ff;       /* 摩天輪、橋的 LED */
  --artN:#ff9ad5;      /* 蓮花博物館夜間燈 */
  --st1:#ff4fa3; --st2:#8a63ff; --st3:#38e1ff; --st4:#4dffa6; --st5:#ffd23f; --st6:#ff7a3d;   /* 超級樹燈色 */
  --laser1:#5ef2ff; --laser2:#ff5ee0; --laser3:#b6ff5e;
  --jet:#e8fbff;       /* 水舞水柱 */
  --flagR:#e52a2f; --flagW:#ffffff;
  --fw1:#ff4040; --fw2:#ffffff; --fw3:#ffd35a;
  --smokeR:#f05a5a; --smokeW:#f5f5f5;
  --water:#dff6ff;     /* 魚尾獅噴水 */
  --sun:#ffd166; --sunCore:#fff1c2; --moon:#f7f0d4; --star:#fff6da;
  --rainc:#9fb2c8; --haze:#c9b48a; --flash:#ffffff;

  /* —— 頁面介面 —— */
  --page-bg:#f4f6f2; --page-fg:#1d2b40; --page-muted:#5d6879;
  --ui-surface:#ffffff; --ui-line:#d8dde6; --ui-accent:#d6305a; --ui-accent-2:#2f6fd0;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:14px;overflow:hidden;background:var(--skyB,#bfe7f7);line-height:0;box-shadow:0 6px 24px rgba(29,43,64,.14)}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:var(--ui-surface);border:1.5px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--page-fg);border-color:var(--page-fg);color:var(--ui-surface);font-weight:700}
.panel button.big{background:var(--ui-accent);border-color:var(--ui-accent);color:#fff;font-weight:700}
.panel button.big.alt{background:var(--ui-accent-2);border-color:var(--ui-accent-2)}
.panel button.big.on{background:var(--page-fg);border-color:var(--page-fg)}
.panel button:focus-visible,.panel input:focus-visible{outline:2px dashed var(--ui-accent);outline-offset:3px}
/* 畫面內可點物件：滑鼠點不顯示外框，用鍵盤 Tab 時才顯示 */
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px dashed var(--ui-accent);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 共用 ---------- */
#scene .clickable,#scene [role="button"]{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .bubble rect,#scene .bubble path{fill:#ffffff;stroke:#1d2b40;stroke-width:1.6}
#scene .bubble text{fill:#1d2b40;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
@media (prefers-reduced-motion:reduce){ *{scroll-behavior:auto!important;transition:none!important} }
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>
<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。
   想恢復完整版，刪掉這整段 <style id="pure-art"> 即可。
   ========================================================= */

body{display:flex!important;align-items:center;justify-content:center;padding:0!important}
body>.wrap{width:100%!important;max-width:min(100vw,calc(100vh * 8 / 3))!important;
  margin:0!important;padding:0!important;gap:0!important;display:block!important}

  border:0!important;border-radius:0!important;box-shadow:none!important}

<body>
<main class="wrap">
  <figure class="stage">
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="新加坡濱海灣：前景魚尾獅朝海灣噴水，對岸是濱海藝術中心、摩天輪、蓮花造型博物館與頂著空中花園的三塔酒店，右邊是會發光的超級樹林">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--skyT)"/><stop offset=".62" stop-color="var(--skyB)"/>
      </linearGradient>
      <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--seaLt)"/><stop offset=".1" stop-color="var(--sea)"/><stop offset="1" stop-color="var(--seaDk)"/>
      </linearGradient>
      <radialGradient id="sunGlow"><stop offset="0" stop-color="var(--sun)" stop-opacity=".6"/><stop offset="1" stop-color="var(--sun)" stop-opacity="0"/></radialGradient>
      <radialGradient id="warmGlow"><stop offset="0" stop-color="var(--glow)" stop-opacity=".8"/><stop offset="1" stop-color="var(--glow)" stop-opacity="0"/></radialGradient>
      <radialGradient id="lampGlow"><stop offset="0" stop-color="var(--lamp)" stop-opacity=".75"/><stop offset="1" stop-color="var(--lamp)" stop-opacity="0"/></radialGradient>
      <radialGradient id="artGlow"><stop offset="0" stop-color="var(--artN)" stop-opacity=".55"/><stop offset="1" stop-color="var(--artN)" stop-opacity="0"/></radialGradient>
      <radialGradient id="mistGlow"><stop offset="0" stop-color="#ffffff" stop-opacity=".85"/><stop offset=".6" stop-color="#ffffff" stop-opacity=".35"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
      <!-- 大樓窗戶：白天的玻璃格、夜晚亮燈（兩種疏密） -->
      <pattern id="winDay" width="8" height="9" patternUnits="userSpaceOnUse"><rect x="1.5" y="2" width="5" height="4" fill="var(--winD)"/></pattern>
      <pattern id="winNight" width="8" height="9" patternUnits="userSpaceOnUse"><rect x="1.5" y="2" width="5" height="4" fill="var(--glow)"/></pattern>
      <pattern id="winNight2" width="16" height="18" patternUnits="userSpaceOnUse"><rect x="1.5" y="2" width="5" height="4" fill="var(--glow)"/><rect x="9.5" y="11" width="5" height="4" fill="var(--glow)"/><rect x="9.5" y="2" width="5" height="4" fill="var(--glow)" opacity=".5"/></pattern>
      <!-- 三塔酒店：每層樓的水平線、夜間的房間燈 -->
      <pattern id="mbsFloor" width="20" height="5" patternUnits="userSpaceOnUse"><rect y="3.8" width="20" height="1.1" fill="var(--mbsDk)" opacity=".5"/></pattern>
      <pattern id="mbsNight" width="7" height="5" patternUnits="userSpaceOnUse"><rect x=".6" y=".8" width="5.6" height="2.6" fill="var(--glow)"/></pattern>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);
      }
      return _conn.call(this, dest, ...a);
    };
  }
  function stopAudio() {
    let longs = [], ctx = null;
    for (const s of srcs) {
      const c = s.context, now = c.currentTime, m = s.__ss; ctx = c;
      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }
    if (longs.length && ctx) {
      const g = outs.get(ctx), now = ctx.currentTime;
      if (g) {
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 1.1); g.gain.setValueAtTime(0, now + 1.2);
        g.gain.linearRampToValueAtTime(1, now + 1.9);
      }
      longs.forEach(s => { try { s.stop(now + 1.15); } catch (e) {} srcs.delete(s); });
    }
    srcs.clear();
  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');
    // 凍結色票：把目前的 CSS 變數抄到殘影上，底下換色不影響殘影
    const cs = getComputedStyle(svg);
    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }
      }
    }
    const par = svg.parentElement;
    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });
    added = [];
  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>
/* =========================================================
   SC-68 新加坡濱海灣的燈光水舞夜｜程式區
   區塊：①工具與色票 ②場景（天空、對岸大樓、濱海藝術中心、摩天輪、雙螺旋橋、蓮花博物館、三塔酒店、
         海灣、倒影、濱海灣花園超級樹、魚尾獅、步道）
         ③角色（行人、冰淇淋推車阿伯、拍照遊客、駁船、水獺、鳥群、飛機、直升機、戰機）
         ④動畫（日夜、天氣、漣漪、水花、兩場表演）
         ⑤互動（點擊、滑鼠、聲音、控制列）
   ========================================================= */
(() => {
'use strict';

/* ---------------- ① 工具與色票 ---------------- */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const root = document.documentElement;
const svg = $('scene');
const DAY_SEC = 160;            // 自動播放時一天幾秒
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
let seed = 20261168;            // 固定亂數：每次開啟構圖一樣
const srand = (a = 0, b = 1) => { seed = (seed * 16807) % 2147483647; return a + (seed / 2147483647) * (b - a); };
const spick = a => a[Math.floor(srand(0, a.length - .001))];
const f1 = n => (+n).toFixed(1);
function el(tag, attrs = {}, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;

/* ---------------- ② 場景：濱海藝術中心（兩顆像榴槤的尖刺圓頂） ---------------- */
function durian(g, cx, rx, ry) {
  frag(g, `<path d="M${cx - rx} ${SHORE} A${rx} ${ry} 0 0 1 ${cx + rx} ${SHORE} Z" class="f-espl"/>`);
  // 圓頂上的三角形遮陽板，一排一排往上變小
  let s = '';
  for (let r = 0; r < 7; r++) {
    const a = (r + .5) / 7.6 * Math.PI / 2;
    const yy = SHORE - Math.sin(a) * ry * .97, half = Math.cos(a) * rx * .93;
    const n = Math.max(1, Math.round(half / 7.5));
    const sz = 4.6 - r * .4;
    for (let i = 0; i < n * 2; i++) {
      const xx = cx - half + (i + .5) * (2 * half) / (n * 2) + (r % 2 ? 2 : 0);
      s += `M${f1(xx - sz)} ${f1(yy + sz * .5)} L${f1(xx)} ${f1(yy - sz)} L${f1(xx + sz)} ${f1(yy + sz * .5)}Z`;
    }
  }
  frag(g, `<path d="${s}" class="f-esplDk"/>`);
  // 輪廓上冒出的尖角
  let sp = '';
  for (let i = 1; i < 12; i++) {
    const a = Math.PI * i / 12, px = cx - Math.cos(a) * rx, py = SHORE - Math.sin(a) * ry;
    const nx = -Math.cos(a), ny = -Math.sin(a);
    sp += `M${f1(px - ny * 3)} ${f1(py + nx * 3)} L${f1(px + nx * 5)} ${f1(py + ny * 5)} L${f1(px + ny * 3)} ${f1(py - nx * 3)}Z`;
  }
  frag(g, `<path d="${sp}" class="f-esplDk"/>`);
  const l = frag(g, `<path d="M${cx - rx} ${SHORE} A${rx} ${ry} 0 0 1 ${cx + rx} ${SHORE} Z" fill="url(#warmGlow)" opacity="0"/>`);
  nightEls.push({ el: l, k: .8 });
}

/* ---------------- ③ 角色：步道行人（兩排各走一個方向，會跟前面的人保持距離不穿模） ---------------- */
const walkers = [];
const LANES = [{ y: 574, dir: -1, g: 'walkB' }, { y: 597, dir: 1, g: 'walkF' }];
const HELLO = ['Hello！今天好熱喔', '吃飽了沒？', 'Selamat pagi！（馬來語：早安）', 'Vanakkam！（坦米爾語：你好）', '等一下去吃海南雞飯', '晚上來看燈光秀嗎？', 'Can lah！沒問題', '去魚尾獅那邊拍照！'];
function addWalker(lane, x, look) {
  const L = LANES[lane];
  const p = person($(L.g), look);
  const w = { p, lane, x, dir: L.dir, v0: look.speed || rand(20, 30), v: 0, ph: rand(0, 6), stop: 0, wave: 0, look };
  w.v = w.v0;
  p.g.classList.add('clickable');
  onAct(p.g, () => { w.wave = 1.6; w.stop = 1.6; say(w.x, L.y - 70, look.jog ? pick(['早上慢跑一圈濱海灣', '一圈大約三點五公里！']) : pick(HELLO)); sfx(t => hello(t)); });
  walkers.push(w);
}
function stepWalkers(dt, mv) {
  for (const w of walkers) {
    const L = LANES[w.lane];
    let v = w.v0 * (wx.rain > .5 && !w.look.jog ? 1.25 : 1);
    // 跟前面的人保持距離（不穿模）
    for (const o of walkers) {
      if (o === w || o.lane !== w.lane) continue;
      const d = (o.x - w.x) * w.dir;
      if (d > 0 && d < 34) v = Math.min(v, d < 24 ? 0 : o.v);
    }
    if (w.stop > 0) { w.stop -= dt; v = 0; }
    w.v = v;
    w.x += w.dir * v * dt * mv;
    if (w.x < -30) w.x = 1630; if (w.x > 1630) w.x = -30;
    w.ph += v * dt * (w.look.jog ? .22 : .32) * mv;
    walkLegs(w.p, v > 1 ? w.ph : 0, w.look.jog ? 34 : 24);
    if (w.wave > 0) { w.wave -= dt; arms(w.p, 10, -150 + Math.sin(w.wave * 14) * 18); }
    else if (w.look.jog) arms(w.p, 40 + Math.sin(w.ph) * 40, -40 - Math.sin(w.ph) * 40);
    else arms(w.p, 10 + Math.sin(w.ph) * (v > 1 ? 14 : 0), -10 - Math.sin(w.ph) * (v > 1 ? 14 : 0));
    w.p.g.setAttribute('transform', `translate(${f1(w.x)} ${L.y}) scale(${w.dir < 0 ? -1 : 1} 1)`);
    w.p.umb.setAttribute('opacity', f1(wx.rain > .4 && !w.look.jog ? 1 : 0));
  }
}

function stepBoats(dt, mv, tt) {

      if (o === b || o.near !== b.near) continue;
      const d = (o.x - b.x) * b.dir;
      if (d > 0 && d < 170 * b.s) v = Math.min(v, d < 140 * b.s ? 0 : o.v);
    }
    if (lightOn && !b.near) { const nx = b.x + b.dir * 80 * b.s; if (nx > 960 && nx < 1360 && !(b.x > 960 && b.x < 1360)) v = 0; }
    b.v = v;
    b.x += b.dir * v * dt * mv;
    const W = 1600 + 140 * b.s;
    if (b.dir > 0 && b.x > W) b.x = -140 * b.s;
    if (b.dir < 0 && b.x < -140 * b.s) b.x = W;
    const bob = Math.sin(tt * 1.6 + b.bob) * (1.2 + wx.wind * 2) * mv;
    const tilt = Math.sin(tt * 1.3 + b.bob) * (1 + wx.wind * 2) * mv;
    b.g.setAttribute('transform', `translate(${f1(b.x)} ${f1(b.y + bob)}) scale(${b.dir * b.s} ${b.s})`);
    b.body.setAttribute('transform', `rotate(${f1(tilt)})`);
    b.wake.setAttribute('opacity', f1(clamp(v / b.v0, 0, 1) * (1 - nOn * .5)));
    b.parts.lt.setAttribute('opacity', f1(nOn));
  }
}

/* ---------------- ④ 動畫：主迴圈 ---------------- */
const mouse = { x: 800, y: 300, in: false, lx: 0, ly: 0, dx: 0, sdx: 0 };

function loop(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  step(dt);
  rafId = requestAnimationFrame(loop);
}
function step(dt) {
  const mv = reduced ? 0 : 1; mvG = mv;
  const tt = performance.now() / 1000;
  // 時間：自動播放／跳轉
  if (T.target != null && !T.hold) {
    let d = T.target - T.t; if (d < -.5) d += 1; if (d > .5) d -= 1;
    const s = dt * .14;
    if (Math.abs(d) <= s) { T.t = T.target; T.target = null; } else T.t = (T.t + Math.sign(d) * s + 1) % 1;
  } else if (T.auto && !T.hold && !T.dragging) T.t = (T.t + dt / DAY_SEC) % 1;
  if (show.on) showStep(dt, tt);
  applyTime();

  // 天氣緩緩過渡
  const want = WX_LIST[wxI][0];
  const k = reduced ? 1 : Math.min(1, dt * .8);

  wx.rain += ((want === 'storm' ? 1 : 0) - wx.rain) * k;

  // 拍照的遊客
  if (photoT > 0) photoT -= dt;
  arms(poser, -120 + Math.sin(tt * 2) * 4 * mv, -150 + Math.sin(tt * 2) * 4 * mv);
  // 頂樓泳池的人揮手
  poolT = Math.max(0, poolT - dt);
  poolPeople.setAttribute('opacity', f1(clamp(poolT, 0, 1)));

  // 欄杆邊的人群：表演時湧進來；國慶揮小旗、水舞秀舉手機
  const showOn = show.on && show.t > .5 && show.t < show.dur - .8;
  crowd.forEach((c, i) => {
    const want = c.base || (showOn && show.t > i * .12) ? 1 : 0;
    c.op = (c.op ?? (c.base ? 1 : 0)) + (want - (c.op ?? 0)) * (reduced ? 1 : Math.min(1, dt * 2));
    c.p.g.setAttribute('opacity', c.op.toFixed(2));
    c.p.flag.setAttribute('opacity', show.on === 'ndp' ? 1 : 0);
    c.p.phone.setAttribute('opacity', show.on === 'light' ? 1 : 0);
    if (show.on === 'ndp') arms(c.p, 10, -150 + Math.sin(tt * 8 + c.ph) * 25);
    else if (show.on === 'light') arms(c.p, 10, -120);
    else arms(c.p, 10, -10);
    c.p.umb.setAttribute('opacity', f1(wx.rain > .4 ? 1 : 0));
  });

  // 雨
  const rOn = wx.rain > .05;
  $('rain').style.display = rOn ? '' : 'none';
  if (rOn) rainDrops.forEach((d, i) => {
    if (i / rainDrops.length > wx.rain) { d.el.setAttribute('opacity', 0); return; }
    d.y += d.sp * dt * mv; d.x += (-40 + wx.wind * 100) * dt * mv;
    if (d.y > 610) { d.y = -20; d.x = rand(-100, 1700); if (Math.random() < .3) ripple(rand(0, 1600), rand(410, 530), .5); }
    d.el.setAttribute('opacity', .7);
    d.el.setAttribute('x1', f1(d.x)); d.el.setAttribute('y1', f1(d.y)); d.el.setAttribute('x2', f1(d.x - 3)); d.el.setAttribute('y2', f1(d.y + 15));
  });

  // 對話泡泡
  for (let i = bubbles.length - 1; i >= 0; i--) { const B = bubbles[i]; B.t -= dt; B.g.setAttribute('opacity', f1(clamp(B.t * 3, 0, 1))); if (B.t <= 0) { B.g.remove(); bubbles.splice(i, 1); } }
}

/* ---------------- ⑤ 互動：點擊 ---------------- */
function svgPoint(e) { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
svg.addEventListener('pointerdown', () => { userGesture = true; ensureAudio(); document.body.classList.remove('kbd'); });

const seaAt = (x, y) => y > SHORE + 6 && y < RAIL - 6 && !(x > 1318 && y < GBASE + 22) && !(x < 322 && y > RAIL - 40);
svg.addEventListener('pointermove', e => {
  const p = svgPoint(e);
  const d = Math.hypot(p.x - mouse.lx, p.y - mouse.ly);
  mouse.x = p.x; mouse.y = p.y; mouse.in = true; mouse.dx = (p.x - 800) / 800 * -10;
  if (reduced || d < 18) return;
  mouse.lx = p.x; mouse.ly = p.y;
  if (seaAt(p.x, p.y)) ripple(p.x, p.y, .6);
  // 滑鼠靠近超級樹：那棵樹的燈亮起來
  for (const s of stLights) if (Math.abs(p.x - s.x) < s.w / 2 && p.y > s.top - 10 && p.y < GBASE) s.boost = Math.min(1, s.boost + .5);
});
svg.addEventListener('pointerleave', () => { mouse.in = false; mouse.dx = 0; });
svg.addEventListener('click', e => {
  userGesture = true; ensureAudio();
  const p = svgPoint(e);
  if (seaAt(p.x, p.y)) { ripple(p.x, p.y, 1.3); sfx(t => splash(t, .5)); return; }
  if (p.y < 360) {
    if (night > .5 && wx.rain < .5) { meteor(p.x - 100); say(p.x, p.y + 30, '流星！許個願吧', 1.4); sfx(t => twinkle(t)); }
    else { birdFlock(p.x < 800 ? -30 : 1630, clamp(p.y, 60, 240)); sfx(t => birdCall(t)); }
  }
  if (reduced) step(.05);
});

function syncAuto() { $('btnAuto').setAttribute('aria-pressed', String(T.auto)); $('btnAuto').textContent = T.auto ? '自動播放中' : '自動播放'; }
function goTo(t) { if (reduced) { T.t = t; applyTime(true); step(.05); } else T.target = t; }
const tap = fn => () => { userGesture = true; ensureAudio(); setTimeout(() => { fn(); if (reduced) step(.05); }, actx && actx.state !== 'running' ? 120 : 0); };
$('btnLight').addEventListener('click', tap(() => startLight(false)));

  if (ensureAudio()) {
    master.gain.cancelScheduledValues(actx.currentTime);

    if (!soundOn) { [musNode, sfxNode].forEach(n => { if (n) try { n.disconnect(); } catch (e) {} }); musNode = sfxNode = null; }

function start() {
  cancelAnimationFrame(rafId);
  if (reduced) { T.auto = false; syncAuto(); applyTime(true); step(.05); }
  else { last = performance.now(); rafId = requestAnimationFrame(loop); }
}
