<style>
/* =========================================================
   SC-55 聖母峰基地營的祈福經幡｜浮世繪色塊
   地點：尼泊爾昆布地區，聖母峰南側基地營（海拔約 5364 公尺，搭在昆布冰河上）。
   畫面（由左到右，從冰河側磧往東望）：
        昆布孜峰（山後就是西藏）、聖母峰西肩，西肩後面露出聖母峰的黑色金字塔峰頂
        （黃色岩帶、峰頂被西風吹出的雪煙），洛子峰峰尖、努子峰的大雪壁；
        中間是從西谷傾瀉而下的昆布冰瀑（冰塔、裂隙、鋁梯、固定繩）；
        冰河上是黃橘色的基地營帳篷、餐廳大帳、石砌祭壇與放射狀的五色風馬旗，
        右邊有冰河融水池與直升機停機坪。
   人物與動物：雪巴人背伕（頭帶背竹簍、T 字拐杖）、穿羽絨衣的登山者與健行客、
        趕犛牛的牧人、馱著行李的犛牛隊（紅色流蘇、銅鈴）、喇嘛、渡鴉、紅嘴山鴉。
   ---------------------------------------------------------
   風格重點（浮世繪色塊）：普魯士藍天空的暈色（ぼかし）、橫向霞帶、粗墨線輪廓、
        平塗色塊、雪山用白與淡藍分面、傍晚日照金山像「赤富士」一樣染紅、
        廣重式的圓點雪、和紙紋理。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），部分另有 --k-名稱（晨昏）。
   JS 會依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）。
   ========================================================= */
:root{
  color-scheme: light;

  /* —— 天空、霞帶、雲、太陽 —— */
  --d-sky-top:#1d4a8c;  --k-sky-top:#2f3a78;  --n-sky-top:#040a24;
  --d-sky-mid:#6fa6d2;  --k-sky-mid:#c98a9a;  --n-sky-mid:#0e1c48;
  --d-sky-low:#eef0e2;  --k-sky-low:#f6c08a;  --n-sky-low:#1c2856;
  --d-kasumi:#f0b8a4;   --k-kasumi:#f08a6c;   --n-kasumi:#2a2a5e;
  --d-kasumi2:#efd8a0;  --k-kasumi2:#f2b264;  --n-kasumi2:#242856;
  --d-cloud:#fbf6ea;    --k-cloud:#f8cdb0;    --n-cloud:#2c3662;
  --d-overcast:#9aa2ae; --k-overcast:#8a7c8a; --n-overcast:#121a30;
  --d-sun:#e5462c;      --k-sun:#ec5a30;      --n-sun:#e5462c;

  /* —— 雪山：遠山、雪面、陰影、岩壁、黃色岩帶 —— */
  --d-far:#9fb2cf;      --k-far:#b498b0;      --n-far:#1c284e;
  --d-far-top:#eef2f8;  --k-far-top:#f6cdb8;  --n-far-top:#2e3a68;
  --d-snow:#f8f7f0;     --k-snow:#fbd6bc;     --n-snow:#3a4672;
  --d-snow-sh:#a8c2dc;  --k-snow-sh:#c09ab4;  --n-snow-sh:#232d55;
  --d-snow-sh2:#7e9cc2; --k-snow-sh2:#9a7aa2; --n-snow-sh2:#192246;
  --d-rock:#4a4d5e;     --k-rock:#5a4656;     --n-rock:#141728;
  --d-rock-dk:#2c2e3c;  --n-rock-dk:#0b0d1a;
  --d-rock-2:#7a6c5c;   --k-rock-2:#86625a;   --n-rock-2:#1e1e2e;
  --d-yband:#c8a868;    --k-yband:#d49a62;    --n-yband:#38322e;   /* 聖母峰的黃色岩帶 */

  /* —— 冰瀑、冰河、側磧、地面 —— */
  --d-ice:#d6ecf4;      --k-ice:#f0d4d0;      --n-ice:#2e3e66;
  --d-ice-top:#fbfdfc;  --k-ice-top:#fde2d4;  --n-ice-top:#44568a;
  --d-ice-sh:#86bcdc;   --k-ice-sh:#a8a2c4;   --n-ice-sh:#1c2c56;
  --d-ice-sh2:#4f8fbe;  --k-ice-sh2:#7a72a2;  --n-ice-sh2:#14204a;
  --d-crevasse:#2e5d86; --n-crevasse:#0a1430;
  --d-moraine-far:#a39b8e; --k-moraine-far:#ad8a80; --n-moraine-far:#2a2a3c;
  --d-moraine:#857c70;  --k-moraine:#93766a;  --n-moraine:#22223a;
  --d-rubble:#4c463f;   --n-rubble:#111120;
  --d-ground:#8c7458;   --k-ground:#946a50;   --n-ground:#25222f;
  --d-ground-dk:#5f4c3a;--n-ground-dk:#15131c;
  --d-trail:#c4ae8a;    --k-trail:#c99a78;    --n-trail:#33303e;
  --d-stone:#aaa397;    --k-stone:#b29484;    --n-stone:#3a3a4c;
  --d-stone-dk:#6e675e; --n-stone-dk:#1e1e2c;
  --d-mani:#f2eee2;     --n-mani:#5a5e74;     /* 嘛呢石上的白色刻字 */
  --d-pond:#3fb4c4;     --k-pond:#6a8eb4;     --n-pond:#12305a;
  --d-pond-lt:#9adbe0;  --n-pond-lt:#2a5078;

  /* —— 帳篷 —— */
  --d-tent-y:#f2c230;   --k-tent-y:#f6b040;   --n-tent-y:#4a3a1a;
  --d-tent-o:#ea7a26;   --n-tent-o:#4a2a1a;
  --d-tent-r:#d2402e;   --n-tent-r:#441a1e;
  --d-tent-b:#2f6fb2;   --n-tent-b:#162a48;
  --d-tent-g:#3a8a5a;   --n-tent-g:#16301e;
  --d-tent-w:#eeeae0;   --k-tent-w:#f6d6bc;   --n-tent-w:#4a4a5e;
  --d-tent-dk:#3a3a44;  --n-tent-dk:#101018;

  /* —— 五色風馬旗（藍白紅綠黃：天、風、火、水、土）、祭壇 —— */
  --d-flag-b:#2a62c0;   --n-flag-b:#16284e;
  --d-flag-w:#f8f6ee;   --n-flag-w:#5a5e78;
  --d-flag-r:#d83a2c;   --n-flag-r:#4a1a1e;
  --d-flag-g:#2e9a52;   --n-flag-g:#163a24;
  --d-flag-y:#f2c834;   --n-flag-y:#4c4020;
  --d-pole:#8a6a44;     --n-pole:#2a2228;
  --d-altar:#b8b0a2;    --k-altar:#c09a88;    --n-altar:#3c3c50;
  --d-altar-dk:#7c756a; --n-altar-dk:#222232;

  /* —— 人物衣著 —— */
  --d-skin:#c8916a;     --n-skin:#4a3a40;
  --d-hair:#2a2220;     --n-hair:#0e0c10;
  --d-jk-1:#d23a30;     --n-jk-1:#4a1a1e;
  --d-jk-2:#ee8a2a;     --n-jk-2:#4c2c18;
  --d-jk-3:#2e6ab0;     --n-jk-3:#152848;
  --d-jk-4:#f0c030;     --n-jk-4:#4a3c18;
  --d-jk-5:#3a8a5a;     --n-jk-5:#16301e;
  --d-jk-6:#7a4a9a;     --n-jk-6:#26183a;
  --d-jk-7:#5c4a3c;     --n-jk-7:#1e1814;   /* 牧人的舊外套 */
  --d-pants:#3c4054;    --n-pants:#14161f;
  --d-boot:#5a3a26;     --n-boot:#1a1210;
  --d-hat-r:#c8302a;    --n-hat-r:#3e1416;
  --d-hat-b:#2a5aa0;    --n-hat-b:#14223e;
  --d-hat-w:#e8e0cc;    --n-hat-w:#4a4a58;
  --d-bag-b:#2a72b8;    --n-bag-b:#14284a;
  --d-bag-o:#e8742a;    --n-bag-o:#4a2818;
  --d-bag-y:#e8c030;    --n-bag-y:#4a3c18;
  --d-bag-g:#4a7a4a;    --n-bag-g:#18281a;
  --d-basket:#b88a4a;   --n-basket:#3a2c1e;     /* 背伕的竹簍（doko） */
  --d-basket-dk:#7a5a2e;--n-basket-dk:#22180f;
  --d-robe:#8a2430;     --n-robe:#2e0e14;       /* 喇嘛的絳紅僧袍 */
  --d-robe-y:#e8b030;   --n-robe-y:#4a3814;
  --d-metal:#c8ccd4;    --n-metal:#40465e;      /* 冰瀑鋁梯、登山杖 */
  --d-rope:#e8b030;     --n-rope:#5a4a24;

  /* —— 犛牛 —— */
  --d-yak:#2e2826;      --n-yak:#0e0c10;
  --d-yak-2:#6a4a30;    --n-yak-2:#201610;
  --d-yak-w:#ece6d8;    --n-yak-w:#4a4a58;
  --d-horn:#e8dcc0;     --n-horn:#4a4638;
  --d-blanket:#c8302a;  --n-blanket:#3e1416;
  --d-brass:#d8a840;    --n-brass:#4e4026;

  /* —— 直升機、鳥 —— */
  --d-heli:#d8302a;     --n-heli:#3a1418;
  --d-heli-w:#f6f4ee;   --k-heli-w:#f8dcc6;   --n-heli-w:#4e5272;
  --d-heli-glass:#7ab8d8; --n-heli-glass:#1a2a48;
  --d-raven:#1e1e26;    --n-raven:#08080e;
  --d-beak-y:#f0c020;   --n-beak-y:#4a3c14;   /* 紅嘴山鴉的黃嘴 */

  /* —— 霧、墨線 —— */
  --d-fog:#e8ecf0;      --k-fog:#f0d4c8;      --n-fog:#3a4466;
  --d-line:#262230;     --n-line:#070914;

  /* —— 不隨日夜變化的顏色 —— */
  --moon:#f8f0d0; --star:#fff6d8; --milky:#dfe6ff;
  --lamp:#ffd27a; --window:#ffd88a; --headlamp:#fffbe0;
  --glow:#ff4a26;       /* 日照金山（赤富士）的紅光 */
  --smoke:#f6f2ea; --tsampa:#fbf8ee; --flake:#ffffff;

  /* —— 頁面介面 —— */
  --page-bg:#eef0ee; --page-fg:#262230; --page-muted:#6a6878;
  --ui-surface:#fafaf6; --ui-line:#d2d4d0; --ui-accent:#1d4a8c; --ui-hot:#c8302a; --ui-hot2:#2a62c0;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:6px;overflow:hidden;background:#0e1c48;line-height:0;box-shadow:0 1px 0 #fff inset,0 6px 22px rgba(30,40,80,.22)}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:6px;padding:10px 14px}
.panel button{font:700 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1.5px solid var(--ui-line);
  border-radius:999px;padding:9px 15px;cursor:pointer;letter-spacing:.03em}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:#fff}
.panel button.big{border-color:var(--ui-hot);color:#fff;background:var(--ui-hot)}
.panel button.big2{border-color:var(--ui-hot2);color:#fff;background:var(--ui-hot2)}
.panel button.on{background:#f2b23a!important;border-color:#f2b23a!important;color:var(--page-fg)!important}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid #fff3cc;outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(220px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding:0;list-style:none;color:var(--page-muted);font-size:14px;line-height:1.8;display:flex;flex-wrap:wrap;gap:4px 22px}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .ln{stroke:var(--line);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
#scene .ln2{stroke:var(--line);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
#scene .lnT{stroke:var(--line);stroke-width:.9;stroke-linejoin:round;stroke-linecap:round}
#scene .bubble path{fill:#fffaf0;stroke:#262230;stroke-width:1.6}
#scene .bubble text{fill:#262230;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
@media (prefers-reduced-motion: reduce){ .panel button{transition:none} }
</style>
<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。
   想恢復完整版，刪掉這整段 <style id="pure-art"> 即可。
   ========================================================= */
html,body{height:100%;margin:0!important;overflow:hidden}
body{display:flex!important;align-items:center;justify-content:center;padding:0!important}
body>.wrap{width:100%!important;max-width:min(100vw,calc(100vh * 8 / 3))!important;
  margin:0!important;padding:0!important;gap:0!important;display:block!important}
body>.wrap>:not(.stage){display:none!important}
body>.wrap>.stage{width:100%!important;max-width:100%!important;margin:0!important;
  border:0!important;border-radius:0!important;box-shadow:none!important}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：天空 → 星空與銀河 → 霞帶 → 太陽、月亮 → 雲 → 遠方山鳥
       → 昆布孜峰 → 聖母峰（雪煙）→ 洛子峰 → 西肩 → 努子峰（各自帶日照金山的紅光層）
       → 前霞帶 → 雪崩 → 山腳岩坡 → 冰河 → 昆布冰瀑（冰塔、鋁梯、登山者）
       → 基地營帳篷、祭壇、風馬旗 → 營地行人 → 普迦法會 → 直升機 → 谷霧
       → 前景側磧步道（犛牛隊、背伕、健行客）→ 嘛呢石、渡鴉 → 特效 → 天氣 → 和紙紋理 → 對話泡泡
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="浮世繪風格的聖母峰基地營：遠方是聖母峰黑色金字塔峰頂、洛子峰與努子峰大雪壁，中間是昆布冰瀑，冰河上搭滿黃橘色帳篷，石砌祭壇拉出五色風馬旗，前景步道上有犛牛隊、雪巴人背伕和健行客。">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-top)"/>
        <stop offset=".55" style="stop-color:var(--sky-mid)"/>
        <stop offset="1" style="stop-color:var(--sky-low)"/>
      </linearGradient>
      <!-- 山頭的暈色（上深下淺／上白下藍） -->
      <linearGradient id="farGrad" gradientUnits="userSpaceOnUse" x1="0" y1="170" x2="0" y2="330">
        <stop offset="0" style="stop-color:var(--far-top)"/><stop offset=".55" style="stop-color:var(--far)"/>
      </linearGradient>
      <linearGradient id="evGrad" gradientUnits="userSpaceOnUse" x1="0" y1="60" x2="0" y2="220">
        <stop offset="0" style="stop-color:var(--rock-dk)"/><stop offset=".7" style="stop-color:var(--rock)"/>
      </linearGradient>
      <linearGradient id="snowGrad" gradientUnits="userSpaceOnUse" x1="0" y1="140" x2="0" y2="370">
        <stop offset=".25" style="stop-color:var(--snow)"/><stop offset="1" style="stop-color:var(--snow-sh)"/>
      </linearGradient>
      <linearGradient id="glacGrad" gradientUnits="userSpaceOnUse" x1="0" y1="350" x2="0" y2="460">
        <stop offset="0" style="stop-color:var(--moraine-far)"/><stop offset="1" style="stop-color:var(--moraine)"/>
      </linearGradient>
      <linearGradient id="fgGrad" gradientUnits="userSpaceOnUse" x1="0" y1="440" x2="0" y2="600">
        <stop offset="0" style="stop-color:var(--ground)"/><stop offset="1" style="stop-color:var(--ground-dk)"/>
      </linearGradient>
      <radialGradient id="glowGrad"><stop offset="0" stop-color="#ffcf6a" stop-opacity=".9"/><stop offset=".45" stop-color="#ffb347" stop-opacity=".35"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
      <radialGradient id="lampGlow"><stop offset="0" stop-color="#fffbe0" stop-opacity=".95"/><stop offset=".4" stop-color="#fff2b0" stop-opacity=".35"/><stop offset="1" stop-color="#fff2b0" stop-opacity="0"/></radialGradient>
      <radialGradient id="moonGlow"><stop offset="0" stop-color="#fff2cc" stop-opacity=".5"/><stop offset="1" stop-color="#fff2cc" stop-opacity="0"/></radialGradient>
      <radialGradient id="steamBall"><stop offset="0" stop-color="#ffffff" stop-opacity=".8"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
      <!-- 廣重式的圓點雪 -->
      <pattern id="snowPat" width="90" height="90" patternUnits="userSpaceOnUse">
        <g fill="var(--flake)" stroke="#9aa8c0" stroke-width=".4">
          <circle cx="8" cy="10" r="2.4"/><circle cx="40" cy="4" r="1.8"/><circle cx="70" cy="22" r="2.6"/><circle cx="24" cy="40" r="1.6"/>
          <circle cx="58" cy="50" r="2.2"/><circle cx="86" cy="62" r="1.7"/><circle cx="12" cy="72" r="2.5"/><circle cx="44" cy="80" r="1.9"/>
        </g>
      </pattern>
      <!-- 強風吹起的雪粉：短橫線 -->
      <pattern id="windPat" width="160" height="60" patternUnits="userSpaceOnUse">
        <g stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity=".8">
          <path d="M6 8h34M80 20h46M30 34h28M110 46h40M4 52h20M70 4h18"/>
        </g>
      </pattern>
      <clipPath id="pondClip"><ellipse cx="1238" cy="438" rx="66" ry="10"/></clipPath>
    </defs>

    <rect id="skyHit" class="clickable" x="-50" y="-50" width="1700" height="700" fill="url(#skyGrad)"/>
    <g id="nightSky" class="noHit"></g>
    <g id="kasumiBack" class="noHit"></g>
    <g id="sunG" class="clickable" tabindex="0" role="button" aria-label="太陽：點一下換成夜晚"></g>
    <g id="moonG" class="clickable" tabindex="0" role="button" aria-label="月亮：點一下換成白天"></g>
    <g id="clouds"></g>
    <rect id="overcastSky" class="noHit" x="-50" y="-50" width="1700" height="420" style="fill:var(--overcast)" opacity="0"/>
    <g id="birdsFar" class="noHit"></g>
    <g id="mtnBack"></g>
    <g id="everestG"></g>
    <g id="lhotseG"></g>
    <g id="shoulderG"></g>
    <g id="nuptseG"></g>
    <g id="kasumiFront" class="noHit"></g>
    <g id="avaG" class="noHit"></g>
    <g id="slopesG" class="noHit"></g>
    <g id="glacierG" class="noHit"></g>
    <g id="icefallG"></g>
    <g id="iceClimbers" class="noHit"></g>
    <g id="campG"></g>
    <g id="campPeople"></g>
    <g id="pujaG" class="noHit" opacity="0"></g>
    <g id="heliG"></g>
    <g id="fogG" class="noHit"></g>
    <g id="fgG"></g>
    <g id="laneBack"></g>
    <g id="rocksMid" class="noHit"></g>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);
      }
      return _conn.call(this, dest, ...a);
    };
  }
  function stopAudio() {
    let longs = [], ctx = null;
    for (const s of srcs) {
      const c = s.context, now = c.currentTime, m = s.__ss; ctx = c;
      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }

      const g = outs.get(ctx), now = ctx.currentTime;
      if (g) {
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 1.1); g.gain.setValueAtTime(0, now + 1.2);
        g.gain.linearRampToValueAtTime(1, now + 1.9);

    }
    srcs.clear();
  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');

    const cs = getComputedStyle(svg);
    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }

    }
    const par = svg.parentElement;
    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });
    added = [];
  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>
/* =========================================================
   SC-55 聖母峰基地營的祈福經幡｜程式區
   區塊：①工具與色票
         ②場景（天空、雪山、冰瀑、冰河、帳篷、祭壇與風馬旗、融水池、停機坪、前景步道）
         ③角色（犛牛隊、背伕、登山者、健行客、牧人、喇嘛、直升機、渡鴉、紅嘴山鴉）
         ④動畫（主迴圈、日夜、天氣、燈火、「普迦祈福」與「冰瀑出發」兩場秀）
         ⑤互動（點擊、滑鼠、聲音、控制列）
   ========================================================= */
(() => {
'use strict';

/* ---------------- ① 工具 ---------------- */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const root = document.documentElement;
const svg = $('scene');
const rand = (a, b) => a + Math.random() * (b - a);

let seed = 20261124;        // 固定亂數：每次開啟構圖都一樣
const srand = (a = 0, b = 1) => { seed = (seed * 16807) % 2147483647; return a + (seed / 2147483647) * (b - a); };
const spick = a => a[Math.floor(srand(0, a.length - .001))];
const f1 = n => (+n).toFixed(1);
function el(tag, attrs = {}, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);

}

  pts.forEach(p => d += `L${f1(p[0])} ${f1(p[1])}`);

    H.x = lerp(-120, PAD[0], e); H.y = lerp(150, PAD[1] - 6, smooth(.5, 1, u)) - Math.sin(u * Math.PI) * 30;
    if (u >= 1) { H.state = 'landed'; H.t = 10; H.y = PAD[1] - 6; }
    else if (!fly && u < .7) { H.state = 'out2'; H.dir = -1; }   // 天氣變差就掉頭回去
  } else if (H.state === 'landed') {
    if (H.t < 0 || (!fly && night < .5)) { H.state = 'out'; H.u = 0; H.dir = -1; }
  } else if (H.state === 'out') {
    H.u = Math.min(1, H.u + dt * mv / 11);
    const u = H.u;
    H.x = PAD[0] - u * u * 1700; H.y = PAD[1] - 6 - smooth(0, .4, u) * 220 - u * 40;
    if (u >= 1) { H.state = 'away'; H.t = rand(50, 80); }
  } else if (H.state === 'out2') {
    H.x -= 150 * dt * mv; H.y -= 10 * dt * mv;
    if (H.x < -160) { H.state = 'away'; H.t = rand(50, 80); }
  }
  const vis = H.state !== 'away';
  H.g.setAttribute('opacity', vis ? 1 : 0);
  H.g.style.display = vis ? '' : 'none';
  if (vis) {
    const k = .45 + (H.y - 120) / 300 * .4;
    const tilt = H.state === 'in' && H.u < .8 ? 6 : H.state === 'out' && H.u > .15 ? 8 : 0;
    H.g.setAttribute('transform', `translate(${f1(H.x)} ${f1(H.y)}) scale(${f1(H.dir * k)} ${f1(k)}) rotate(${tilt})`);
    const spin = H.state === 'landed' ? .6 : 1;
    H.rotor.setAttribute('rx', f1(46 * Math.abs(Math.cos(time * 40 * spin * (mv || .1)))));
    H.tail.setAttribute('ry', f1(7 * Math.abs(Math.cos(time * 50 * (mv || .1)))));
  }
}
function stepRavens(dt, mv) {
  ravens.forEach(R => {
    if (R.away > 0) { R.away -= dt; if (R.away <= 0) tween(.8, k => R.g.setAttribute('opacity', f1(k))); return; }
    R.body.setAttribute('transform', `rotate(${f1(Math.sin(time * 1.3 + R.ph) * 4 * mv + (Math.sin(time * .5 + R.ph) > .8 ? -10 : 0))} 0 -6)`);
  });
}

/* ---------------- 初始化 ---------------- */
function init() {
  drawSky();
  drawMountains();
  drawGlacier();
  drawIcefall();
  drawCamp();
  drawCampPeople();
  drawPuja();
  drawHeli();
  drawFog();
  drawForeground();
  drawLanes();
  drawBirds();
  washi();
  bindAll();
  heli.t = 12;
  if (reduced) { T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false'); }
  // 一開始冰瀑上已經有幾位登山者
  [40, 110, 170].forEach(d => { const C = addClimber(routeLen[ICE_START] + d, false); C.alpha = 1; });
  setWeather(0);
  applyColors(true);
  step(1 / 60);
  requestAnimationFrame(loop);
}
init();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on && show.kind,
  btn: { puja: 'btnPuja', climb: 'btnClimb' },
  save: () => ({ t: T.t, auto: T.auto }),
  stop: () => endShow(true),
  restore: s => { T.t = s.t; T.auto = s.auto; $('btnAuto') && $('btnAuto').setAttribute('aria-pressed', String(T.auto)); applyColors(true); }
});
/* /ShowStop */
})();
</script>
