<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>米蘭大教堂廣場的彩窗光影</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-93 米蘭大教堂廣場的彩窗光影｜彩繪玻璃風格
   地點：義大利・米蘭，主教堂廣場（Piazza del Duomo），站在廣場西側往東看。
        正中央是粉白色大理石的米蘭主教堂立面：六根扶壁把立面分成五格，
        下層是五扇大門與巴洛克窗，上層是哥德式尖窗，扶壁頂端與屋簷佈滿小尖塔；
        立面後面是主尖塔，塔頂的金色「小聖母」（Madonnina）。
        左邊是艾曼紐二世拱廊的凱旋門入口，右邊是王宮與阿倫加里奧宮，
        廣場上有艾曼紐二世國王騎馬像、報攤、鴿子，前景是米蘭的橘色老電車。
   畫法：每個物件都切成一片片「玻璃」，用深色鉛條（粗描邊）框起來；
        白天陽光照得玻璃透亮，夜裡大教堂打上金色燈光、彩窗從裡面透出光。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對色票寫成 --d-名稱（白天）／--n-名稱（夜晚），部分另有 --k-名稱（晨昏）。
   JS 會依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）。
   ========================================================= */
:root{
  color-scheme: light;

  /* —— 鉛條（玻璃之間的黑框） —— */
  --d-lead:#231e2a;  --n-lead:#0a0810;

  /* —— 天空玻璃（由上到下四階） —— */
  --d-sky1:#3d7fc4;  --k-sky1:#3b3f8e;  --n-sky1:#0b0f33;
  --d-sky2:#579cd8;  --k-sky2:#6b55a6;  --n-sky2:#111844;
  --d-sky3:#84bce6;  --k-sky3:#e07a78;  --n-sky3:#19225a;
  --d-sky4:#bfdff2;  --k-sky4:#ffb36b;  --n-sky4:#29306a;
  --d-cloud:#f7f8fb; --k-cloud:#ffd6b8; --n-cloud:#2c3364;
  --d-cloud2:#d8e2ee; --k-cloud2:#eaa892; --n-cloud2:#21284f;

  /* —— 主角：主教堂的粉白色坎多利亞大理石（夜裡打上金色投射燈） —— */
  --d-marble1:#f4ebe6; --k-marble1:#fbd2b0; --n-marble1:#f0c77e;
  --d-marble2:#e8dad3; --k-marble2:#efb994; --n-marble2:#dcaa62;
  --d-marble3:#d8c4bc; --k-marble3:#dc9f80; --n-marble3:#b98645;
  --d-marbleD:#a8928c; --k-marbleD:#a46e60; --n-marbleD:#6a4a2a;   /* 雕刻凹處、門框陰影 */
  --d-spire:#e2d3cd;   --k-spire:#eab08e;   --n-spire:#a98a64;     /* 立面後面的尖塔林（遠，燈光較弱） */
  --d-spire2:#cdb9b2;  --k-spire2:#cf9478;  --n-spire2:#7d6448;
  --d-bronze:#7c5a33;  --n-bronze:#6a4824;   /* 銅門 */
  --d-bronze2:#a57d47; --n-bronze2:#94672f;
  --d-winOut:#46577a;  --n-winOut:#f6b850;   /* 彩窗從外面看：白天偏暗，夜裡從裡面透光 */
  --gold:#e9b52f; --gold2:#ffd65a; --gold-glow:#ffe9a0;   /* 小聖母金像 */

  /* —— 教堂內部（透視彩窗時才看得到） —— */
  --in-dark:#3e2c36; --in-wall:#8e7468; --in-pier:#d4bca8; --in-pier2:#a88c7c;
  --in-floor1:#cdbfb4; --in-floor2:#8e5a4a; --in-floor3:#4a4a5a; --in-pew:#5a3a26;
  --candle:#ffd36a;

  /* —— 彩窗玻璃（固定色） —— */
  --gw-1:#2b4fb8; --gw-2:#c0283a; --gw-3:#2e9a5a; --gw-4:#f0b430; --gw-5:#7a3aa8; --gw-6:#2aa6b8; --gw-7:#e86a2a;

  /* —— 艾曼紐二世拱廊（左） —— */
  --d-gal1:#ecd3a2; --k-gal1:#f3b98a; --n-gal1:#5c4a48;
  --d-gal2:#dcbb84; --k-gal2:#e4a274; --n-gal2:#4c3c3c;
  --d-galS:#b89066; --n-galS:#33282c;     /* 陰影、柱間 */
  --d-galIn:#9fb6c8; --n-galIn:#ffcf7a;   /* 穿過凱旋門看到的玻璃拱頂與店面 */
  --d-shop:#4c5a72;  --n-shop:#ffcd70;    /* 一樓店面（夜裡亮） */
  --d-gwin:#5a6a80;  --n-gwin:#2a2840;    /* 樓上的窗 */
  --d-gwinL:#5f7088; --n-gwinL:#ffd27a;   /* 夜裡會亮的窗 */

  /* —— 王宮、阿倫加里奧宮（右） —— */
  --d-pr1:#efdcaa; --k-pr1:#f2bd8a; --n-pr1:#4e4558;
  --d-pr2:#dcc48e; --k-pr2:#e2a676; --n-pr2:#3c3548;
  --d-ar1:#e6d6bc; --k-ar1:#efbc96; --n-ar1:#4a4252;
  --d-ar2:#cbb898; --n-ar2:#36303e;

  /* —— 遠方的維拉斯加塔（王宮後面，頂部較寬的「蘑菇」高樓） —— */
  --d-vel:#c89a86; --k-vel:#d2866a; --n-vel:#3c3246;
  --d-vel2:#a87a68; --n-vel2:#2e2638;

  /* —— 廣場地面 —— */
  --d-pave1:#dcd2c8; --k-pave1:#e8b89a; --n-pave1:#3c3646;
  --d-pave2:#c8bcb0; --k-pave2:#d6a286; --n-pave2:#322c3c;
  --d-pave3:#ece4da; --k-pave3:#f2c8a6; --n-pave3:#4a4254;
  --d-rail:#6a6670;  --n-rail:#8a8090;
  --d-shadow:#231e2a33; --n-shadow:#00000055;

  /* —— 國王騎馬像（青銅）與石座 —— */
  --d-statue:#4d6658; --n-statue:#2c3a36;
  --d-statue2:#6f8a74; --n-statue2:#40524a;
  --d-plinth:#bcb2a8; --k-plinth:#d4a68a; --n-plinth:#4c4654;
  --d-plinth2:#a39890; --n-plinth2:#3c3846;

  /* —— 天體 —— */
  --d-sun:#ffd257; --k-sun:#ff9a48; --n-sun:#ffd257;
  --d-sun2:#fff0a8; --n-sun2:#fff0a8;
  --d-moon:#f4efd8; --n-moon:#f6f0d6;
  --star:#ffe9a6;

  /* —— 街燈、報攤、電車、聖誕樹 —— */
  --lamp:#ffd36a; --lamp-post:#2c2a34;
  --kiosk:#2f6a4e; --kiosk2:#3f8a62;
  --tram:#e8762c; --tram2:#f3e2bc; --tram-roof:#7a7870; --tram-win:#6a8aa8; --tram-winN:#ffd98a;
  --tree1:#1f6a3e; --tree2:#2f8a4e; --tree3:#46a85e; --tree-base:#b02a34;
  --bulb-1:#ffd84a; --bulb-2:#ff5a5a; --bulb-3:#5ad0ff; --bulb-4:#ffffff; --bulb-5:#7aff8a;

  /* —— 天氣 —— */
  --rainc:#cfe0f2; --snow:#ffffff; --fog:#e4e2e6; --fog-n:#4a4658;

  /* —— 角色 —— */
  --skin-1:#f2cfac; --skin-2:#dba57c; --skin-3:#aa7450; --skin-4:#6e4a33;
  --hair-1:#2a2226; --hair-2:#6b4428; --hair-3:#e0b866; --hair-4:#bdb7ae;
  --c-1:#c43c3c; --c-2:#2c4f8a; --c-3:#f2c24a; --c-4:#2a8a7a; --c-5:#e88aa8; --c-6:#3a3a44; --c-7:#f4ede0; --c-8:#8a5aa8;
  --pants-1:#2e3450; --pants-2:#4a3a30; --pants-3:#8a8478;
  --umb-1:#c43c3c; --umb-2:#2c4f8a; --umb-3:#3a3a44; --umb-4:#f2c24a;
  --pigeon:#8e93a4; --pigeon2:#6a7084; --pigeon-neck:#4f8a7e; --beak:#e8a040;

  /* —— 頁面介面 —— */
  --page-bg:#eeeaf0; --page-fg:#231e2a; --page-muted:#625c6c;
  --ui-surface:#f8f6fa; --ui-line:#d2cbd8; --ui-accent:#2b4fb8;
  --cine-shade:#000000; --cine-light:#fff3d6;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:10px;overflow:hidden;background:#0a0810;line-height:0;box-shadow:0 2px 12px #0000002e}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:10px;padding:10px 14px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--page-fg);border-color:var(--page-fg);color:var(--ui-surface);font-weight:700}
.panel button.big{border-color:var(--gw-1);color:#fff;background:var(--gw-1);font-weight:700}
.panel button.big.alt{border-color:var(--gw-2);background:var(--gw-2)}
.panel button.big.on{background:var(--gw-4);border-color:var(--gw-4);color:var(--page-fg)}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
/* 畫面內可點物件：滑鼠點不顯示外框，用鍵盤 Tab 時才顯示 */
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid var(--gw-4);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 內的樣式：鉛條 ---------- */
#scene .ls{stroke:var(--lead);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
#scene .ld{stroke:var(--lead);stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round}
#scene .lt{stroke:var(--lead);stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round}
#scene .lsky{stroke:var(--lead);stroke-width:1.2;stroke-opacity:.5;stroke-linejoin:round}   /* 天空用的細鉛條（想更細改這裡） */
#scene .nf{fill:none}
#scene .clickable,#scene [role="button"]{cursor:pointer}
#scene .bubble rect{fill:#fffdf6;stroke:var(--lead);stroke-width:2.4}
#scene .bubble text{fill:#231e2a;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .bubble{animation:pop var(--dur,1.8s) ease-out forwards}
@keyframes pop{0%{opacity:0}10%{opacity:1}82%{opacity:1}100%{opacity:0}}
#scene #glint{mix-blend-mode:screen}
@media (prefers-reduced-motion:reduce){
  #scene .bubble{animation:none}
}
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>
<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。
   想恢復完整版，刪掉這整段 <style id="pure-art"> 即可。
   ========================================================= */
html,body{height:100%;margin:0!important;overflow:hidden}
body{display:flex!important;align-items:center;justify-content:center;padding:0!important}
body>.wrap{width:100%!important;max-width:min(100vw,calc(100vh * 8 / 3))!important;
  margin:0!important;padding:0!important;gap:0!important;display:block!important}
body>.wrap>:not(.stage){display:none!important}
body>.wrap>.stage{width:100%!important;max-width:100%!important;margin:0!important;
  border:0!important;border-radius:0!important;box-shadow:none!important}
</style>
</head>
<body>
<main class="wrap">
  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：天空（玻璃色塊、太陽、月亮、星星、雲、飛鳥）
       → 主尖塔與小聖母、屋頂尖塔林 → 教堂內部（透視彩窗時才出現）
       → 主教堂立面、大門 → 艾曼紐二世拱廊、王宮與阿倫加里奧宮
       → 廣場地面 → 最後一排行人、報攤、街燈 → 聖誕樹 → 第二排行人、鴿子
       → 國王騎馬像 → 前兩排行人、鴿子 → 老電車 → 天氣 → 表演光效 → 滑鼠光澤
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="彩繪玻璃風格的米蘭主教堂廣場插畫動畫：粉白色大理石的哥德式主教堂立面與佈滿小尖塔的屋頂，主尖塔頂端是金色小聖母像；左邊是艾曼紐二世拱廊的凱旋門，右邊是王宮，廣場上有國王騎馬像、鴿子、遊客與報攤，前景駛過橘色老電車。">
    <defs>
      <radialGradient id="glintG" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".34"/><stop offset=".55" stop-color="#fff6dc" stop-opacity=".1"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="glowG" cx=".5" cy=".5" r=".5">
        <stop offset="0" style="stop-color:var(--lamp)" stop-opacity=".75"/><stop offset="1" style="stop-color:var(--lamp)" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="goldGlowG" cx=".5" cy=".5" r=".5">
        <stop offset="0" style="stop-color:var(--gold-glow)" stop-opacity=".85"/><stop offset="1" style="stop-color:var(--gold-glow)" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="fogG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".55" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity=".45"/>
      </linearGradient>
      <filter id="blurS" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
      <clipPath id="frameClip"><rect x="0" y="0" width="1600" height="600"/></clipPath>
    </defs>

    <g clip-path="url(#frameClip)">
    <!-- ===== 場景：天空 ===== -->
    <g id="parSky">
      <g id="sky"></g>
      <g id="skyShine" pointer-events="none"></g>
      <g id="stars" pointer-events="none"></g>
      <g id="sun"></g>
      <g id="moon"></g>
      <g id="clouds"></g>
    </g>
    <rect id="skyHit" x="0" y="0" width="1600" height="200" fill="transparent" class="clickable" tabindex="0" role="button" aria-label="天空：白天有一群鴿子飛過，夜晚劃過流星"/>
    <g id="skyBirds" pointer-events="none"></g>
    <!-- ===== 場景：主尖塔、小聖母、屋頂尖塔林（在立面後面） ===== -->
    <!-- 大教堂整組放大 1.15 倍（改 scale 就能調整大小）；主尖塔以塔頂為基準另外放大，小聖母才不會超出畫面 -->
    <g id="parSpire">

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);
      }
      return _conn.call(this, dest, ...a);
    };
  }
  function stopAudio() {
    let longs = [], ctx = null;
    for (const s of srcs) {
      const c = s.context, now = c.currentTime, m = s.__ss; ctx = c;
      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }
    if (longs.length && ctx) {
      const g = outs.get(ctx), now = ctx.currentTime;
      if (g) {
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 1.1); g.gain.setValueAtTime(0, now + 1.2);
        g.gain.linearRampToValueAtTime(1, now + 1.9);
      }
      longs.forEach(s => { try { s.stop(now + 1.15); } catch (e) {} srcs.delete(s); });
    }
    srcs.clear();
  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');
    // 凍結色票：把目前的 CSS 變數抄到殘影上，底下換色不影響殘影
    const cs = getComputedStyle(svg);
    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }
      }
    }
    const par = svg.parentElement;
    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });
    added = [];
  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>
/* ---- 表演氛圍（取代寬銀幕黑邊）：k = 0~1，四周輕微暗角＋中央微亮；fx/fy 可讓亮處偏向表演焦點 ---- */
let cineK = 0, cineW = 0;
function setCine(k, fx, fy) {
  cineK = k = Math.max(0, Math.min(1, k));
  if (k === cineW || (Math.abs(k - cineW) < .004 && k > 0 && k < 1)) return;
  cineW = k;
  const g = document.getElementById('cineFx'); if (!g) return;
  g.setAttribute('opacity', k.toFixed(3));
  if (fx != null) { const G = document.getElementById('cineLightG'); G.setAttribute('cx', (fx / 1600).toFixed(3)); G.setAttribute('cy', (fy / 600).toFixed(3)); }
}

/* =========================================================
   SC-93 米蘭大教堂廣場的彩窗光影｜程式區
   區塊：①工具與色票
         ②場景（天空、主尖塔與小聖母、尖塔林、教堂內部、立面、大門、
               艾曼紐二世拱廊、王宮與阿倫加里奧宮、廣場、報攤、街燈、聖誕樹、國王騎馬像、電車）
         ③角色（行人、旅行團、自拍情侶、追鴿子的小孩、手風琴手、報攤老闆、鴿子）
         ④動畫（日夜、天氣、正午鐘聲・透視彩窗、聖誕樹點燈夜、環境）
         ⑤互動（點擊、滑鼠、聲音、控制列）
   ========================================================= */
(() => {
'use strict';

/* ---------------- ① 工具與色票 ---------------- */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const root = document.documentElement;
const svg = $('scene');

/* ---------------- ④ 動畫：日夜 ---------------- */
const T = { t: .69, auto: true, target: null, dragging: false };
const DAY_SEC = 150;          // 自動播放時一天幾秒
let night = 0, dusk = 0, lastApplied = -1, clock = 0;
const TRAM_D = hex(css('--tram-win')), TRAM_N = hex(css('--tram-winN')), FOG_D = hex(css('--fog')), FOG_N = hex(css('--fog-n'));
function clockText() {
  const h = T.t * 24, hh = Math.floor(h) % 24, mm = Math.floor((h - Math.floor(h)) * 60);
  return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
}
let sunPos = { x: 0, y: 0, up: false };
function applyTime(force) {
  if (!force && Math.abs(T.t - lastApplied) < .0004) return;
  lastApplied = T.t;
  const h = T.t * 24;
  night = clamp(1 - smooth(5.6, 7.4, h) + smooth(18.2, 20, h), 0, 1);
  dusk = Math.max(Math.exp(-Math.pow((h - 6.6) / 1, 2)), Math.exp(-Math.pow((h - 19) / 1, 2)));
  const grey = clamp(wx.cloud * .35 + wx.rain * .55 + wx.fog * .5 + wx.snow * .4, 0, .8);
  for (const k in PAIRS) {
    const P = PAIRS[k];
    let c = mix(P.d, P.n, night);
    if (P.k) c = mix(c, P.k, dusk * .8 * (1 - grey));
    if (grey && (k.startsWith('sky') || k.startsWith('cloud'))) { const g = (c[0] + c[1] + c[2]) / 3; c = mix(c, [g * .96, g, g * 1.06, 1], grey); }

  const sp = (h - 6.4) / 12.6, mp = ((h - 19.6 + 24) % 24) / 11;

  $('sun').setAttribute('transform', `translate(${f1(sunPos.x)} ${f1(sunPos.y)})`);
  $('sun').style.display = sp > -.05 && sp < 1.05 ? '' : 'none';
  $('sun').setAttribute('opacity', f1(1 - grey * 1.2));
  $('moon').setAttribute('transform', `translate(${f1(960 + mp * 700)} ${f1(400 - Math.sin(Math.PI * clamp(mp, 0, 1)) * 330)})`);
  $('moon').style.display = mp > -.05 && mp < 1.05 ? '' : 'none';
  $('moon').setAttribute('opacity', f1(1 - grey));
  const nOn = smooth(.35, .9, night);
  $('stars').setAttribute('opacity', f1(smooth(.6, 1, night) * (1 - grey)));

/* ---------------- ④ 動畫：天氣 ---------------- */
const WX_LIST = [['sun', '晴'], ['cloud', '多雲'], ['rain', '雨'], ['fog', '米蘭濃霧'], ['snow', '下雪']];
let wxI = 0;
const wx = { sun: 1, cloud: 0, rain: 0, fog: 0, snow: 0 };
let xmasSnow = 0;
function applyWeather(dt) {
  const target = WX_LIST[wxI][0];
  let changed = false;
  for (const k in wx) {
    const goal = k === target ? 1 : 0;
    const nv = dt ? wx[k] + (goal - wx[k]) * Math.min(1, dt * .9) : goal;
    if (Math.abs(nv - wx[k]) > .0005) changed = true;
    wx[k] = nv;
  }
  const snowK = Math.max(wx.snow, xmasSnow * (1 - wx.rain));
  $('rain').setAttribute('opacity', f1(wx.rain));
  $('snow').setAttribute('opacity', f1(snowK));
  $('fog').setAttribute('opacity', f1(wx.fog * .9));
  $('snowCover').setAttribute('opacity', f1(Math.max(wx.snow * .42, xmasSnow * .3)));
  const cl = wx.cloud + wx.rain + wx.fog * .6 + wx.snow;
  clouds.forEach(c => c.el.setAttribute('opacity', f1(c.extra ? clamp(cl, 0, 1) : 1)));
  if (changed) lastApplied = -1;
  ambient(wx.rain, wx.rain * .6 + wx.snow * .4 + wx.fog * .1);
}

/* ---------------- ④ 動畫：每一格 ---------------- */
let px = 0, pxCur = 0;

    if (dist < .003 || reduced) { T.t = T.target; T.target = null; }
    else T.t = (T.t + Math.min(dist, dt * .22)) % 1;
  } else if (T.auto && !reduced && !show.on) T.t = (T.t + dt / DAY_SEC) % 1;
  applyWeather(dt);
  applyTime();
  updateShow(dt);
  // 視差：天空與尖塔跟著滑鼠微微移動

  $('parSpire').setAttribute('transform', `translate(${f1(pxCur * 2)} 0)`);
  // 星星閃爍
  if (night > .5) stars.forEach(s => s.el.setAttribute('opacity', f1(.55 + .45 * Math.sin(clock * s.sp + s.ph))));
  // 夜裡彩窗透光、店面亮燈；點過的彩窗會亮一下

  centerWin.forEach((c, i) => c.setAttribute('fill-opacity', f1(winFlash > 0 ? .75 + .25 * Math.sin(clock * 6 + i) : 1)));
  // 小聖母：夜裡打燈，被點到或鐘響時閃金光
  madFlash = Math.max(0, madFlash - dt * .6);
  madonnaGlow.setAttribute('opacity', f1(Math.max(smooth(.4, .9, night) * .8, madFlash)));
  galFlash = Math.max(0, galFlash - dt * .3);
  galLights.setAttribute('opacity', f1(galLightsK * (.75 + .25 * Math.sin(clock * 3))));
  if (flashT > 0) { flashT = Math.max(0, flashT - dt); $('flash').setAttribute('opacity', f1(flashT)); }
  // 大門開關
  door.k += (door.target - door.k) * Math.min(1, dt * 2.5);

/* ---------------- ③ 角色：行人、旅行團、小孩、街頭藝人 ---------------- */
function updatePeople(dt) {
  const raining = wx.rain > .5;
  walkers.forEach(w => {
    // 找同一排、走在前面最近的人；太近就跟著放慢
    let gap = 1e9, lead = null;
    walkers.forEach(o => { if (o !== w && o.lane === w.lane) { const g = ((o.x - w.x) * w.dir + 1720) % 1720; if (g < gap) { gap = g; lead = o; } } });
    let want = w.stop > 0 ? 0 : w.sp * (raining ? 1.2 : 1);
    if (lead && gap < 50 * w.s) want = Math.min(want, lead.stop > 0 ? 0 : lead.cur * .95);
    w.cur += (want - w.cur) * Math.min(1, dt * 3);
    if (w.stop > 0) w.stop -= dt;
    w.x += w.dir * w.cur * dt;
    w.ph += dt * w.cur * Math.PI / (26 * w.s);
    const amp = 20 * Math.min(1, w.cur / (w.sp * .5));
    walkPose(w, w.ph, amp);
    if (w.x > 1660) w.x -= 1720; if (w.x < -60) w.x += 1720;
    w.g.setAttribute('transform', `translate(${f1(w.x)} ${f1(w.y - Math.abs(Math.sin(w.ph)) * 1.2 * w.s * (amp / 20))}) scale(${f1(w.dir * w.s)} ${f1(w.s)})`);
    w.umb.style.display = raining ? '' : 'none';
  });
  // 旅行團
  tour.talk += dt;
  const gd = tour.guide, face = Math.sin(tour.talk * .4) > 0 ? 1 : -1;
  setLimb(gd.armR, -25 + Math.sin(clock * 1.3) * 6, 10, -57);
  setLimb(gd.armL, Math.sin(clock * 2.2) * 10 - 10, -10, -57);
  place(gd, face);
  tour.members.forEach((m, i) => {
    if (m.armHold) setLimb(m.armR, -140 + Math.sin(clock * .7) * 5, 10, -57);
    m.umb.style.display = raining ? '' : 'none';
  });
  gd.umb.style.display = 'none';
  [...couple, ...window.__standers].forEach(p => p.umb.style.display = raining ? '' : 'none');
  // 追鴿子的小孩：跑到鴿子那邊，鴿子嚇得飛起來
  if (kid.run > 0) {
    kid.run -= dt;
    const dx = kid.tx - kid.x, sp = 70 * kid.s * 1.6;
    if (Math.abs(dx) > 2) { kid.dir = dx > 0 ? 1 : -1; kid.x += kid.dir * Math.min(Math.abs(dx), sp * dt); kid.ph += dt * 9; walkPose(kid, kid.ph, 28); }
    else { kid.run = 0; walkPose(kid, 0, 0); setLimb(kid.armL, 150, -10, -57); setLimb(kid.armR, -150, 10, -57); }
    pigeons.forEach(p => { if (!p.fly && !p.perch && Math.abs(p.x - kid.x) < 40 && Math.abs(p.y - kid.y) < 34) flyUp(p); });
  } else {
    kid.wait = (kid.wait || 3) - dt;

    walkPose(kid, 0, 0);

  busker.play = Math.max(0, busker.play - dt);
  const sq = busker.play > 0 ? Math.sin(clock * 5) * .18 : Math.sin(clock * 1.5) * .05;
  busker.acc.setAttribute('transform', `scale(${f1(1 + sq)} 1)`);
  setLimb(busker.armL, -40 - sq * 60, -10, -57); setLimb(busker.armR, -40 + sq * 60, 10, -57);
  walkPose(busker, 0, 0); setLimb(busker.armL, -40 - sq * 60, -10, -57);
}

/* ---------------- ③ 角色：鴿子 ---------------- */
function flyUp(p) { p.fly = 1; p.vx = (p.x > 800 ? 1 : -1) * rand(60, 110); p.vy = rand(-150, -110); p.dir = p.vx > 0 ? 1 : -1; }
function scatterAll(x, y, r = 1e9) {

  if (n) sfx(t => flap(t));

}
function updatePigeons(dt) {
  pigeons.forEach(p => {
    const body = p.el.firstChild;
    if (p.perch) {
      // 飛到國王頭上（或從國王頭上飛回地面）

  say(800, 150, nextLine('spire', ['屋頂上有 135 座尖塔', '整座教堂有三千多尊雕像', '可以爬樓梯或搭電梯上屋頂露台散步', '1386 年開工，蓋了將近 600 年']), 2.4);
};
onAct($('spires'), spireTap); onAct($('mainSpire'), spireTap);
// 中央大銅門：打開／關上
onAct(doorG, () => {
  door.target = door.target ? 0 : 1;
  sfx(t => doorThud(t, door.target));
  say(800, 340, door.target ? nextLine('door', ['大銅門刻著聖母的一生', '有一格被大家摸得發亮', '歡迎進來參觀']) : '門關上囉', 2.2);
});
// 中央大彩窗
$('facDeco').querySelectorAll('[role="button"]').forEach(n => onAct(n, () => {
  winFlash = 1.6;
  sfx(t => chime(t, [67, 72, 76, 79], .12, .04));
  say(800, 165, nextLine('win', ['立面在 1805 年依拿破崙的命令完成', '外牆是粉白色的坎多利亞大理石', '教堂後殿有世界最大的彩窗之一', '按「正午鐘聲」可以看到教堂裡面']), 2.4);
}));
// 艾曼紐二世拱廊
onAct($('galleria').querySelector('[role="button"]'), () => {
  galFlash = 1;
  sfx(t => chime(t, [65, 69, 72], .1, .035));
  say(260, 230, nextLine('gal', ['艾曼紐二世拱廊，1867 年啟用', '玻璃鐵頂的購物拱廊，米蘭人的客廳', '地上的公牛馬賽克：踩著轉一圈會帶來好運', '裡面有一百多年的老咖啡館']), 2.6);
});
// 王宮、阿倫加里奧宮
const realeBtns = $('reale').querySelectorAll('[role="button"]');
onAct(realeBtns[1], () => { sfx(t => click(t)); say(1236, 250, nextLine('pr', ['米蘭王宮：以前是公爵與總督的宮殿', '現在是舉辦大型美術展的地方']), 2.2); });
onAct(realeBtns[0], () => { sfx(t => click(t)); say(1292, 80, nextLine('vel', ['維拉斯加塔：1958 年蓋好的米蘭地標', '上面幾層比較寬，像一朵蘑菇', '靈感來自中世紀城堡的瞭望塔']), 2.4); });
onAct(realeBtns[2], () => { sfx(t => click(t)); say(1500, 218, nextLine('ar', ['阿倫加里奧宮：裡面是二十世紀美術館', '從上層的大窗戶可以看到大教堂']), 2.2); });
// 國王騎馬像：一隻鴿子飛到國王頭上
onAct($('statue'), () => {
  const p = pigeons.find(q => !q.fly && !q.perch);
  if (p) { p.perch = { x0: p.x, y0: p.y, x: 799, y: 335, t: 0, stay: 8 }; p.dir = -1; sfx(t => { flap(t); coo(t + 1.6); }); }
  say(800, 320, nextLine('king', ['艾曼紐二世：義大利統一後的第一位國王', '這座騎馬像 1896 年揭幕', '國王面向大教堂', '鴿子最喜歡停在國王頭上']), 2.4);
});
// 報攤
onAct($('kiosk'), () => {
  sfx(rustle);
  say(100, 396, nextLine('kiosk', ['Buongiorno！今天的報紙！', '要明信片嗎？', '米蘭冬天常起大霧喔']), 2);
});
// 聖誕樹
onAct($('tree'), () => {
  tree.rows.flat().forEach(b => { if (b.getAttribute('opacity') !== '.25') b.setAttribute('opacity', .3); });
  for (let i = 0; i < 8; i++) spark(500 + rand(-70, 70), 476 + rand(-220, -30), pick(['gold2', 'bulb-3', 'bulb-2']));
  sfx(t => chime(t, [74, 78, 81, 86], .08, .04));
  say(500, 210, pick(['好大的聖誕樹！', 'Buon Natale！', '要吃米蘭的潘娜朵妮麵包嗎？']), 2);
});
// 電車
onAct(tram.g, () => {
  sfx(t => { tramDing(t); tramRumble(t + .3); });
  tram.boost = 2.5;
  say(tram.x, 470, nextLine('tram', ['1928 年的老電車，米蘭人叫它「二十八號」', '叮叮！要上車的請快喔', '這種老電車還天天在米蘭街上跑']), 2.2);
});
// 手風琴手
onAct(busker.g, () => {
  if (show.on) { busy(); return; }
  busker.play = 3.4;
  if (audioOK()) accordion(actx.currentTime + .05);
  say(430, 410, pick(['來一首米蘭小曲', 'Grazie！']), 1.8);
});
// 廣場：點鴿子會飛起來；點行人、旅行團、情侶會說話
['ground', 'lane0', 'lane1', 'lane2', 'lane3', 'pigeonsBack', 'pigeonsFront'].forEach(id => $(id).addEventListener('click', e => {
  if (e.target.closest('[role="button"]')) return;
  const pt = svgPoint(e);
  userGesture = true; ensureAudio();
  const nearP = pigeons.some(p => !p.fly && Math.hypot(p.x - pt.x, p.y - 8 - pt.y) < 30);
  if (nearP) { scatterAll(pt.x, pt.y, 110); settle(3); return; }
  let best = null, bd = 1e9;
  [...walkers, tour.guide, ...tour.members, ...couple, kid, ...window.__standers].forEach(w => { const d = Math.abs(w.x - pt.x) + Math.abs(w.y - 40 * w.s - pt.y) * .6; if (d < bd) { bd = d; best = w; } });
  if (!best || bd > 40) return;
  const wxLine = wx.fog > .5 ? ['霧好大，大教堂都看不清楚了', '米蘭冬天常常這樣起霧'] : wx.snow > .5 || xmasSnow > .5 ? ['下雪了！', 'Buon Natale！'] : wx.rain > .5 ? ['雨好大，先躲進拱廊吧', '帶傘真是對了'] : null;
  let line;
  if (best === tour.guide) line = nextLine('guide', ['大教堂從 1386 年開始蓋', '大家抬頭看，最高的金像就是小聖母', '等一下帶大家上屋頂露台', '右邊是米蘭王宮']);
  else if (tour.members.includes(best)) line = pick(['好多尖塔！', '拍一張給家人看', '屋頂上真的可以走嗎？']);
  else if (window.__standers.includes(best)) { line = pick(['好多尖塔！拍不完', '一定要拍到小聖母', '人好多喔！']); sfx(shutter); }
  else if (couple.includes(best)) { line = pick(['來，笑一個！', '跟大教堂合照！']); sfx(shutter); flashT = .18; }
  else if (best === kid) line = pick(['鴿子等我！', '我要去看國王！']);
  else { best.stop = 2.2; line = pick(wxLine || ['Ciao！', 'Che bello！', '去拱廊喝杯咖啡吧', '晚餐吃米蘭燉飯！', '明天去看《最後的晚餐》', '要不要上屋頂？']); }
  sfx(t => click(t, .04));
  say(best.x, best.y - 92 * best.s, line, 1.9);
  settle(2.5);
}));

/* ---------------- ⑤ 互動：控制列 ---------------- */
function syncAuto() { $('btnAuto').setAttribute('aria-pressed', String(T.auto)); $('btnAuto').textContent = T.auto ? '自動播放中' : '自動播放'; }
function goTo(t) { if (reduced) { T.t = t; applyTime(true); settle(.3); } else T.target = t; }
const tap = fn => () => { userGesture = true; ensureAudio(); setTimeout(() => fn(), actx && actx.state !== 'running' ? 120 : 0); };
$('btnNoon').addEventListener('click', tap(startNoon));
$('btnXmas').addEventListener('click', tap(startXmas));
$('btnWeather').addEventListener('click', () => {
  userGesture = true; ensureAudio();
  wxI = (wxI + 1) % WX_LIST.length;
  $('btnWeather').textContent = '天氣：' + WX_LIST[wxI][1];
  if (reduced) { applyWeather(0); lastApplied = -1; settle(.3); }
});
$('btnSound').addEventListener('click', () => {
  soundOn = !soundOn; userGesture = true;
  $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  if (ensureAudio()) {
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.setValueAtTime(soundOn ? .5 : 0, actx.currentTime);
    if (!soundOn && musNode) { try { musNode.disconnect(); } catch (e) {} musNode = null; }
  }
});
$('btnDay').addEventListener('click', () => goTo(13 / 24));
$('btnNight').addEventListener('click', () => goTo(21 / 24));
$('btnAuto').addEventListener('click', () => { T.auto = !T.auto; T.target = null; syncAuto(); });
$('timeRange').addEventListener('input', e => {
  T.t = e.target.value / 1000; T.target = null; T.dragging = true; applyTime(true); T.dragging = false;
  settle(.2);
});

/* ---------------- ④ 動畫：主迴圈（減少動態模式下只在表演或點擊後短暫更新） ---------------- */
let running = false, lastTs = 0, settleT = 0;
function frame(ts) {
  const dt = Math.min(.05, (ts - lastTs) / 1000 || .016);
  lastTs = ts;
  step(dt);
  settleT -= dt;
  if (!reduced || show.on || settleT > 0) requestAnimationFrame(frame);
  else running = false;
}
function start() { if (!running) { running = true; lastTs = performance.now(); requestAnimationFrame(frame); } }
function settle(sec) { settleT = Math.max(settleT, sec); start(); }
mq.addEventListener?.('change', e => { reduced = e.matches; if (!reduced) { T.auto = true; syncAuto(); } start(); });

applyWeather(0);
applyTime(true);
syncAuto();
step(0);
start();
// 給網站或測試用：外部可以直接觸發表演、設定時間與天氣
window.scene = { startNoon, startXmas, setTime: h => { T.t = h / 24; T.target = null; applyTime(true); }, setWeather: k => { wxI = WX_LIST.findIndex(w => w[0] === k); $('btnWeather').textContent = '天氣：' + WX_LIST[wxI][1]; applyWeather(0); lastApplied = -1; } };
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on,
  btn: { noon: 'btnNoon', xmas: 'btnXmas' },
  save: () => ({ ...T }),
  stop: () => {
    if (!reduced) { show.t = show.dur - .01; updateShow(.02); }   // 快轉到結尾
    if (show.on) endShow();
  },
  restore: s => { Object.assign(T, s); syncAuto(); applyTime(true); settle(.3); }
});
/* /ShowStop */
})();
</script>
