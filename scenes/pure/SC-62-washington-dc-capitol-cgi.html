<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>國會大廈前的櫻花暮色</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-62 華盛頓特區・國會倒影池與國會大廈｜CGI 電影質感
   ---------------------------------------------------------
   氛圍：政治驚悚影集的冷調調色——偏青的陰影、琥珀色的燈光、低飽和、
   縮時攝影般快速流動的雲；黃昏夕陽從觀眾背後打在國會大廈西側立面上，
   夜晚大廈由下往上打泛光。畫面四周常駐輕微暗角與底片顆粒（沒有上下黑邊）。
   【色票 token】所有顏色集中在這裡。
   --d-名稱 = 白天、--n-名稱 = 夜晚、--k-名稱 = 晨昏（可省略）。
   JS 依時間混色後輸出成 --名稱，並自動產生 .f-名稱（填色）與 .s-名稱（線色）。
   ========================================================= */
:root{
  /* —— 天空（天氣另外在 JS 裡混灰） —— */
  --d-skyT:#6f8ea6;  --n-skyT:#050a17;  --k-skyT:#26324f;
  --d-skyB:#d9dfdc;  --n-skyB:#1b2539;  --k-skyB:#e9a466;
  --d-cloudL:#eef1f2; --n-cloudL:#2c3550; --k-cloudL:#f3b98a;  /* 雲的受光面 */
  --d-cloudD:#8e9ba6; --n-cloudD:#0c1222; --k-cloudD:#4a3d58;  /* 雲的背光面 */

  /* —— 國會大廈的大理石：上緣、下緣（夜裡由下往上打光，所以下緣亮） —— */
  --d-mTop:#eceae4;  --n-mTop:#58617a;  --k-mTop:#f7d3a2;
  --d-mBot:#c8c8c4;  --n-mBot:#f1d7a8;  --k-mBot:#e8a56c;
  --d-mLight:#fbfaf6; --n-mLight:#f6e2bb; --k-mLight:#ffe0b4;  /* 柱子受光面 */
  --d-mShade:#9aa2aa; --n-mShade:#3c4357; --k-mShade:#a9756a;  /* 柱子背光面 */
  --d-mDeep:#5d6772;  --n-mDeep:#1a2030; --k-mDeep:#5a3f45;    /* 柱廊後方的深影 */
  --d-glass:#3e4a58;  --n-glass:#1a2232;                       /* 窗玻璃 */
  --d-bronze:#3b4040; --n-bronze:#0d1118; --k-bronze:#3a2a26;  /* 銅像（格蘭特將軍騎馬像） */
  --d-bronzeL:#7c8678; --n-bronzeL:#3a4252; --k-bronzeL:#c58a55; /* 銅像邊緣的反光 */

  /* —— 地景 —— */
  --d-treeF:#55684f; --n-treeF:#0e1820; --k-treeF:#4c4a3a;    /* 國會山莊的大樹（遠） */
  --d-treeN:#3f5140; --n-treeN:#091117; --k-treeN:#3a3a2e;    /* 大樹（近、較暗） */
  --d-grass:#7d8f66; --n-grass:#121c22; --k-grass:#8a7a52;
  --d-street:#5c636b; --n-street:#10141d;
  --d-stone:#b9b6ae; --n-stone:#2a3040; --k-stone:#c79a74;    /* 倒影池池緣、步道 */
  --d-stoneD:#8d8b85; --n-stoneD:#191e2b;
  --d-walk:#a9a59c;  --n-walk:#1b2030; --k-walk:#b08d72;
  --d-waterT:#8aa2b0; --n-waterT:#0a1222; --k-waterT:#c78d6a; /* 水面遠端（映著地平線） */
  --d-waterB:#4f6878; --n-waterB:#060b16; --k-waterB:#3a3a52; /* 水面近端（映著高空） */

  /* —— 櫻花（電影調色後略帶灰的粉） —— */
  --d-bl1:#fbe3ea; --n-bl1:#b3a3b4; --k-bl1:#ffd9c6;  /* 花團亮面 */
  --d-bl2:#eab3c6; --n-bl2:#5c4e62; --k-bl2:#e7a090;  /* 花團中間調 */
  --d-bl3:#a9768f; --n-bl3:#221d2a; --k-bl3:#7a4c5a;  /* 花團暗面 */
  --d-petal:#f6c9d6; --n-petal:#a98aa8;
  --d-trunk:#3a3030; --n-trunk:#07090f;

  /* —— 角色（低飽和的城市服裝色） —— */
  --d-skin1:#e8c6a8; --n-skin1:#6a5a5c;
  --d-skin2:#c79470; --n-skin2:#574740;
  --d-skin3:#80583e; --n-skin3:#3a2c28;
  --d-hair1:#1d1a1c; --n-hair1:#07080c;
  --d-hair2:#5a3e2c; --n-hair2:#1e1612;
  --d-hair3:#bfb6a8; --n-hair3:#545660;
  --d-c1:#1f2a3c; --n-c1:#0b1018;   /* 海軍藍西裝 */
  --d-c2:#3a3c40; --n-c2:#121418;   /* 炭灰 */
  --d-c3:#a8875e; --n-c3:#3a3026;   /* 駝色風衣 */
  --d-c4:#6e2a32; --n-c4:#2a1216;   /* 酒紅 */
  --d-c5:#e4e2dc; --n-c5:#5a5c66;   /* 白襯衫／淺色外套 */
  --d-c6:#40566a; --n-c6:#151d28;   /* 霧藍 */
  --d-c7:#556048; --n-c7:#1a1f18;   /* 橄欖綠 */
  --d-c8:#c4545a; --n-c8:#4a1e24;   /* 慢跑衣紅 */
  --d-shoe:#151516; --n-shoe:#050507;
  --d-police:#16203a; --n-police:#080c16; /* 國會警察制服 */

  /* —— 鳥 —— */
  --d-duckG:#2a5a46; --n-duckG:#0e1c1c;
  --d-duckB:#7c6a58; --n-duckB:#221e1e;
  --d-gull:#e8e8e4;  --n-gull:#5c6274;
  --d-gullW:#9aa2aa; --n-gullW:#2c3242;

  /* —— 固定色：燈光、天體、調色 —— */
  --flood:#ffd9a0;   /* 國會大廈泛光 */
  --lamp:#ffe1a8;    /* 路燈 */
  --lantern:#fff1c8; /* 圓頂燈籠（國會夜間開會時亮） */
  --redlight:#ff3b3b;
  --tailR:#ff4a3a; --headW:#fff3d6;   /* 車尾燈、車頭燈（縮時光軌） */
  --sun:#fff2d4; --sunGlow:#ffc77a; --moon:#eef2ff;
  --gradeTeal:#1f4a5a; --gradeAmber:#d98a3a;
  --rainc:#a9b8c8;
  --phone:#bfe3ff;
  --cine-shade:#05070c; --cine-light:#ffe6c0;   /* 表演氛圍：暗角與中央微亮 */

  /* —— 頁面介面（深色電影風） —— */
  --page-bg:#0f141c; --page-fg:#e6e8ec; --page-muted:#9aa3b0;
  --ui-surface:#171e29; --ui-line:#2b3545; --ui-accent:#c99a5b; --ui-accent-2:#7d9bb5;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border:1px solid var(--ui-line);border-radius:12px;overflow:hidden;background:#0b0f16;line-height:0;box-shadow:0 6px 30px #00000080}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:var(--ui-surface);border:1px solid var(--ui-line);border-radius:12px;padding:10px 14px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--page-fg);color:var(--page-bg);border-color:var(--page-fg);font-weight:700}
.panel button.big{background:var(--ui-accent);border-color:var(--ui-accent);color:#14110c;font-weight:700}
.panel button.big.alt{background:var(--ui-accent-2);border-color:var(--ui-accent-2)}
.panel button.big.on{background:var(--page-fg);border-color:var(--page-fg)}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid var(--ui-accent);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG ---------- */
#scene .clickable,#scene [role="button"]{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .bubble rect,#scene .bubble path{fill:#11161f;fill-opacity:.88;stroke:#c99a5b;stroke-width:1}
#scene .bubble text{fill:#f1ece2;font:600 15px var(--font-ui);text-anchor:middle;dominant-baseline:central;letter-spacing:.02em}
@media (prefers-reduced-motion:reduce){ *{scroll-behavior:auto!important;transition:none!important} }
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>
<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。
   想恢復完整版，刪掉這整段 <style id="pure-art"> 即可。
   ========================================================= */
html,body{height:100%;margin:0!important;overflow:hidden}
body{display:flex!important;align-items:center;justify-content:center;padding:0!important}
body>.wrap{width:100%!important;max-width:min(100vw,calc(100vh * 8 / 3))!important;
  margin:0!important;padding:0!important;gap:0!important;display:block!important}
body>.wrap>:not(.stage){display:none!important}
body>.wrap>.stage{width:100%!important;max-width:100%!important;margin:0!important;
  border:0!important;border-radius:0!important;box-shadow:none!important}
</style>
</head>
<body>
<main class="wrap">
  <figure class="stage">
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="從國會倒影池望向華盛頓的國會大廈：巨大的白色圓頂在冷調的天空下，格蘭特將軍騎馬像的剪影立在池子盡頭，水面倒映著整座大廈，兩側櫻花盛開，步道上有西裝上班族、慢跑者、遊客與國會警察。">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--skyT)"/>
        <stop offset="1" style="stop-color:var(--skyB)"/>
      </linearGradient>
      <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--waterT)"/>
        <stop offset="1" style="stop-color:var(--waterB)"/>
      </linearGradient>
      <!-- 大理石：牆面（垂直漸層）、柱子與圓頂（水平明暗，模擬圓柱體受光） -->
      <linearGradient id="mVert" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--mTop)"/>
        <stop offset="1" style="stop-color:var(--mBot)"/>
      </linearGradient>
      <linearGradient id="colG" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" style="stop-color:var(--mShade)"/>
        <stop offset=".35" style="stop-color:var(--mLight)"/>
        <stop offset="1" style="stop-color:var(--mShade)"/>
      </linearGradient>
      <linearGradient id="domeG" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" style="stop-color:var(--mShade)"/>
        <stop offset=".18" style="stop-color:var(--mTop)"/>
        <stop offset=".42" style="stop-color:var(--mLight)"/>
        <stop offset=".75" style="stop-color:var(--mTop)"/>
        <stop offset="1" style="stop-color:var(--mShade)"/>
      </linearGradient>
      <linearGradient id="domeV" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".25"/>
        <stop offset=".6" stop-color="#ffffff" stop-opacity="0"/>
        <stop offset="1" stop-color="#000000" stop-opacity=".12"/>
      </linearGradient>
      <linearGradient id="bronzeG" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" style="stop-color:var(--bronze)"/>
        <stop offset=".7" style="stop-color:var(--bronze)"/>
        <stop offset="1" style="stop-color:var(--bronzeL)"/>
      </linearGradient>
      <linearGradient id="treeG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--treeF)"/>
        <stop offset="1" style="stop-color:var(--treeN)"/>
      </linearGradient>
      <!-- 櫻花花團：每一團都是球體受光（左上亮、右下暗） -->
      <radialGradient id="blG" cx=".38" cy=".32" r=".7">
        <stop offset="0" style="stop-color:var(--bl1)"/>
        <stop offset=".55" style="stop-color:var(--bl2)"/>
        <stop offset="1" style="stop-color:var(--bl3)"/>
      </radialGradient>
      <radialGradient id="cloudGrad" cx=".5" cy=".42" r=".5">
        <stop offset="0" style="stop-color:var(--cloudL)" stop-opacity=".8"/>
        <stop offset=".45" style="stop-color:var(--cloudL)" stop-opacity=".45"/>
        <stop offset=".8" style="stop-color:var(--cloudD)" stop-opacity=".12"/>
        <stop offset="1" style="stop-color:var(--cloudD)" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="cloudDark" cx=".5" cy=".5" r=".5">
        <stop offset="0" style="stop-color:var(--cloudD)" stop-opacity=".85"/>
        <stop offset=".7" style="stop-color:var(--cloudD)" stop-opacity=".45"/>
        <stop offset="1" style="stop-color:var(--cloudD)" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="sunGlow">
        <stop offset="0" stop-color="#fffaf0" stop-opacity="1"/>
        <stop offset=".1" style="stop-color:var(--sun)" stop-opacity=".95"/>
        <stop offset=".35" style="stop-color:var(--sunGlow)" stop-opacity=".35"/>
        <stop offset="1" style="stop-color:var(--sunGlow)" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="moonGlow"><stop offset="0" stop-color="#dfe7ff" stop-opacity=".45"/><stop offset="1" stop-color="#dfe7ff" stop-opacity="0"/></radialGradient>
      <radialGradient id="floodGrad"><stop offset="0" style="stop-color:var(--flood)" stop-opacity=".7"/><stop offset=".5" style="stop-color:var(--flood)" stop-opacity=".22"/><stop offset="1" style="stop-color:var(--flood)" stop-opacity="0"/></radialGradient>
      <radialGradient id="lampGrad"><stop offset="0" style="stop-color:var(--lamp)" stop-opacity=".95"/><stop offset=".3" style="stop-color:var(--lamp)" stop-opacity=".35"/><stop offset="1" style="stop-color:var(--lamp)" stop-opacity="0"/></radialGradient>
      <radialGradient id="shadowGrad"><stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
      <linearGradient id="streakG" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="fogG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#c8d0d6" stop-opacity="0"/><stop offset=".55" stop-color="#c8d0d6" stop-opacity=".85"/><stop offset="1" stop-color="#c8d0d6" stop-opacity=".2"/>
      </linearGradient>
      <!-- 電影調色：上半偏青、下半偏琥珀；四周暗角 -->
      <linearGradient id="gradeG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--gradeTeal)" stop-opacity=".28"/>
        <stop offset=".6" style="stop-color:var(--gradeTeal)" stop-opacity="0"/>
        <stop offset="1" style="stop-color:var(--gradeAmber)" stop-opacity=".12"/>
      </linearGradient>
      <radialGradient id="vigGrad" cx=".5" cy=".48" r=".75">
        <stop offset=".5" stop-color="#05070c" stop-opacity="0"/>
        <stop offset="1" stop-color="#05070c" stop-opacity=".75"/>
      </radialGradient>
      <linearGradient id="figShade" x1="0" y1="0" x2="1" y2="0">

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);
      }
      return _conn.call(this, dest, ...a);
    };
  }
  function stopAudio() {
    let longs = [], ctx = null;
    for (const s of srcs) {
      const c = s.context, now = c.currentTime, m = s.__ss; ctx = c;
      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }
    if (longs.length && ctx) {
      const g = outs.get(ctx), now = ctx.currentTime;
      if (g) {
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 1.1); g.gain.setValueAtTime(0, now + 1.2);
        g.gain.linearRampToValueAtTime(1, now + 1.9);
      }
      longs.forEach(s => { try { s.stop(now + 1.15); } catch (e) {} srcs.delete(s); });
    }
    srcs.clear();
  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');
    // 凍結色票：把目前的 CSS 變數抄到殘影上，底下換色不影響殘影
    const cs = getComputedStyle(svg);
    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }
      }
    }
    const par = svg.parentElement;
    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });
    added = [];
  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>
/* =========================================================
   SC-62 國會大廈前的櫻花暮色｜程式區
   區塊：①工具與色票 ②場景（天空、雲、國會大廈、大樹、街道、格蘭特將軍像、倒影池、步道、櫻花樹）
         ③角色（行人、國會警察、車流、綠頭鴨、海鷗、飛機、雁群）
         ④動畫（日夜與光線、天氣、花瓣、漣漪、縮時攝影、櫻吹雪）
         ⑤互動（點擊、滑鼠視差、聲音、控制列）
   ========================================================= */
(() => {
'use strict';

/* ---------------- ① 工具與色票 ---------------- */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const root = document.documentElement;
const svg = $('scene');
const DAY_SEC = 170;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
let seed = 20261124;
const srand = (a = 0, b = 1) => { seed = (seed * 16807) % 2147483647; return a + (seed / 2147483647) * (b - a); };
const f1 = n => (+n).toFixed(1);
function el(tag, attrs = {}, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;

/* —— 步道的三條人行道：每條單一方向，跟隨前人保持距離，不會穿過彼此 —— */
const SPAN = 1760, X0 = -80;

    [1, ['jogger', 'suit', 'tour', 'trench', 'phone', 'tour']],
    [2, ['tour', 'suit', 'tour', 'trench', 'tour', 'suit', 'tour', 'tour']]
  ];
  plan.forEach(([li, kinds]) => {
    const L = lanes[li], par = li === 0 ? laneA : li === 1 ? laneB : far;
    kinds.forEach((k, i) => {
      const P = person(par, { kind: k, s: L.s * rand(.94, 1.06), dir: L.dir, x: X0 + (i + rand(.1, .6)) * SPAN / kinds.length, y: L.y + rand(-3, 3), lane: li, sp: k === 'jogger' ? 70 : rand(22, 30) });
      if (li === 2) P.sp *= .32;

    });

}
function laneGap(P, L) {
  // 同一條道上，前方最近那個人的距離
  let best = 1e9;
  for (const Q of L.ppl) {
    if (Q === P) continue;
    let d = (Q.x - P.x) * P.dir; if (d < 0) d += SPAN;
    if (d < best) best = d;
  }
  return best;
}
let crowdMul = 1;
function stepPeople(dt) {
  lanes.forEach(L => {
    const need = 46 * L.s * 1.15 / .74 * .74;
    L.ppl.forEach(P => {
      if (P.actT > 0) { P.actT -= dt; if (P.actT <= 0) { P.act = 0; P.stop = 0; } }
      if (P.jump > 0 || P.jv) { P.jv = (P.jv || 0) - 900 * dt * P.s; P.jump = Math.max(0, P.jump + P.jv * dt); if (P.jump === 0) P.jv = 0; }
      let v = P.stop ? 0 : P.sp * crowdMul;
      const gap = laneGap(P, L);
      const g0 = (P.kind === 'jogger' ? 70 : 52) * L.s;
      if (gap < g0) v *= clamp((gap - g0 * .55) / (g0 * .45), 0, 1);
      P.x += v * P.dir * dt;
      if (P.x > X0 + SPAN) P.x -= SPAN; if (P.x < X0) P.x += SPAN;
      if (L !== lanes[2]) {

}

function playLapse() {

  g.gain.setValueAtTime(1, t0); g.gain.setValueAtTime(1, t0 + 17.6); g.gain.linearRampToValueAtTime(0, t0 + 20);

  tr.addEventListener('input', () => { if (show.on && show.kind === 'lapse') return; dragging = true; T.t = tr.value / 1000; applyTime(true); });
  tr.addEventListener('change', () => { dragging = false; });

  const gesture = () => { userGesture = true; ensureAudio(); if (actx && actx.state === 'suspended') actx.resume().then(ambience); else ambience(); };
  window.addEventListener('pointerdown', gesture, { capture: true });
  window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); gesture(); }, { capture: true });
  window.addEventListener('pointerdown', () => document.body.classList.remove('kbd'));

  svg.addEventListener('pointermove', e => {
    const [x, y] = svgPt(e);
    mouse.x = x; mouse.y = y;
    if (!reduced) { mouse.tx = (x / 1600 - .5) * 2; mouse.ty = (y / 600 - .5) * 2; }
    const now = performance.now();
    if (y > 406 && y < 482 && now - mouse.lastRip > 140) { mouse.lastRip = now; ripple(x, y, .6); }
    if (now - mouse.lastPetal > 90) {
      for (const T2 of fgTrees) for (const p of T2.pts) if (Math.hypot(p[0] - x, p[1] - y) < p[2]) { mouse.lastPetal = now; spawnPetal(x, y, rand(-40, 40), rand(-10, 20)); break; }
    }
  });
  svg.addEventListener('pointerleave', () => { mouse.tx = 0; mouse.ty = 0; });
  mq.addEventListener && mq.addEventListener('change', e => { reduced = e.matches; });
}
function glint() {
  const s = el('g', { class: 'noHit' }, $('dome'));
  frag(s, `<path d="M800 8L802 22L816 24L802 26L800 40L798 26L784 24L798 22Z" fill="#fff"/>`);
  let k = 0; const f = () => { k += .04; s.setAttribute('opacity', f1(Math.sin(Math.min(1, k) * Math.PI))); if (k < 1) requestAnimationFrame(f); else s.remove(); }; f();
}

/* —— 主迴圈 —— */
let lastNow = 0, time = 0, umbOn = false;
function step(dt) {
  time += dt;
  if (T.auto && !show.on && !dragging) T.t = (T.t + dt / DAY_SEC) % 1;
  stepShow(dt);
  for (const k in wx) wx[k] += (wxT[k] - wx[k]) * Math.min(1, dt * .8);
  if (!(show.on && show.kind === 'storm')) windNow += (wx.wind - windNow) * Math.min(1, dt);
  applyTime(false);
  mouse.px += (mouse.tx - mouse.px) * Math.min(1, dt * 3); mouse.py += (mouse.ty - mouse.py) * Math.min(1, dt * 3);
  $('hill').setAttribute('transform', `translate(${f1(mouse.px * -4)} 0)`);
  $('fgTrees').setAttribute('transform', `translate(${f1(mouse.px * -18)} ${f1(mouse.py * -4)})`);
  stepSky(dt, time);
  stepTrees(dt, time);
  stepPeople(dt);
  stepCars(dt);
  carLights();
  stepDucks(dt, time);
  stepGulls(dt);
  stepPlane(dt, F.night, time);
  stepGeese(dt);
  stepMeteor(dt);
  stepRipples(dt);
  stepRain(dt);
  const umb = wx.rain > .4;
  if (umb !== umbOn) { umbOn = umb; ALLP.forEach(P => { if (P.kind !== 'sit' && P.kind !== 'photog' && P.kind !== 'police' && P.kind !== 'jogger') P.umb.setAttribute('display', umb ? '' : 'none'); }); }
  // 平常零星飄落的花瓣
  if (Math.random() < dt * (1.4 + windNow * 3)) { const [x, y] = canopyPoint(); spawnPetal(x, y, rand(-30, 10), rand(0, 20)); }
  stepPetals(dt, time);
  // 表演氛圍：約 2.5 秒淡入淡出，鏡頭小幅推近（約 3%）
  const want = show.on && show.t < 18 ? 1 : 0;
  cineK += clamp(want - cineK, -dt * .4, dt * .4);
  setCine(cineK);
  const z = 1 + (reduced ? 0 : .03) * smooth(0, 1, cineK);
  $('cam').setAttribute('transform', z > 1.0005 ? `translate(800 300) scale(${z.toFixed(4)}) translate(-800 -300)` : '');
}
let cineK = 0, cineW = -1;
function setCine(k) {
  if (Math.abs(k - cineW) < .004 && k > 0 && k < 1) return;
  if (k === cineW) return;
  cineW = k; $('cineFx').setAttribute('opacity', k.toFixed(3));
}
function loop(now) {
  const dt = Math.min(.05, (now - (lastNow || now)) / 1000); lastNow = now;
  step(dt);
  requestAnimationFrame(loop);
}

/* —— 網站「作者精選」播放區（純插畫版放在 iframe 裡）：預設播放縮時攝影、結束後重複輪播；
   不會自己出聲，網站的「播放配樂」開關直接控制縮時攝影自己的音樂 —— */
const inPicks = (() => { let top = true; try { top = window.top === window; } catch (e) { top = false; } return !!document.getElementById('pure-art') && !top; })();
let pickAudio = false;
function useCtx(c) {
  actx = c; noiseBuf = null; rainGain = windGain = null; musNode = sfxNode = null;
  master = actx.createGain(); master.gain.value = soundOn ? .5 : 0;
  const comp = actx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3;
  master.connect(comp); comp.connect(actx.destination);
  sfxBus = actx.createGain(); sfxBus.connect(master);
  musBus = actx.createGain(); musBus.gain.value = .64; /* 音樂軌音量 ×0.64（2026-11-24 兩次各調降 20%） */ musBus.connect(master);
}
function setupPicks() {
  if (!inPicks) return;
  setTimeout(() => startShow('lapse', true), 800);
  setInterval(() => { if (!show.on) startShow('lapse', true); }, 3000);
  window.sceneMusic = {
    playing: false,
    start(c) {
      if (this.playing) return; this.playing = true; pickAudio = true; userGesture = true;
      if (c && c !== actx) useCtx(c); else ensureAudio();
      if (actx && actx.state !== 'running') actx.resume();
      if (show.on && show.kind === 'lapse' && show.t < 4) playLapse();
    },
    stop() {
      this.playing = false; pickAudio = false;
      if (musNode && actx) { musNode.gain.setTargetAtTime(0, actx.currentTime, .15); const n = musNode; musNode = null; setTimeout(() => { try { n.disconnect(); } catch (e) {} }, 800); }
    },
    duck() {}
  };
}

/* —— 開始 —— */
function init() {
  makeGrain();
  drawSky();
  drawCapitol();
  drawStreet();
  drawSquare();
  drawPool();
  drawBank();
  drawTree(110, 500, -1);
  drawTree(1490, 500, 1);
  buildLitWins();
  buildCars();
  buildDucks();
  buildRipples();
  buildPeople();
  buildStatics();
  buildGulls();
  buildPlane();
  buildPetals();
  buildWeather();
  bindAll();
  if (reduced) { T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false'); }
  setWeather(0);
  for (const k in wx) wx[k] = wxT[k];
  applyTime(true);
  for (let i = 0; i < 40; i++) { const [x, y] = canopyPoint(); spawnPetal(x, y + rand(0, 200), rand(-30, 10), rand(0, 20)); }
  step(1 / 60);
  requestAnimationFrame(loop);
  setupPicks();
}
init();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on && show.kind,
  btn: { lapse: 'btnLapse', storm: 'btnStorm' },
  save: () => ({ t: T.t, auto: T.auto }),
  stop: () => endShow(),
  restore: s => { T.t = s.t; T.auto = s.auto; applyTime(true); }
});
/* /ShowStop */
})();
</script>
