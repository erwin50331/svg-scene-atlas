<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>埃及吉薩金字塔群</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-37 埃及吉薩金字塔群｜3D 說明圖風
   地點：開羅西南邊的吉薩高原。由南到北（畫面左到右）是孟卡拉、卡夫拉、古夫三座金字塔，
        卡夫拉金字塔前方是面朝東方的人面獅身像與河谷神廟，古夫金字塔前有三座王后金字塔。
   視角：站在東邊往西看的「斜投影」立體圖——正面是金字塔的東面、左邊看得到南面，
        往後的深度方向畫成往左上 30 度、長度打五折，就像教科書裡的立體說明圖。
   風格重點：平塗受光面／背光面（明暗跟著太陽方位即時計算）、細墨線輪廓、石塊層線、
            地面上淡淡的立體格線、剖面斜線、引線與編號標註、尺寸線、指北針與比例尺。
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），部分另有 --k-名稱（晨昏）。
   JS 會依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）。
   ========================================================= */
:root{
  color-scheme: light;

  /* —— 天空、太陽、雲 —— */
  --d-sky-top:#9cc8de;  --k-sky-top:#5a6a9a;  --n-sky-top:#0c1530;
  --d-sky-low:#f1e6cc;  --k-sky-low:#f2a868;  --n-sky-low:#243058;
  --d-sun:#fff6d6;      --k-sun:#ff9a4a;      --n-sun:#ff9a4a;
  --d-cloud:#ffffff;    --k-cloud:#f8cfae;    --n-cloud:#34406a;
  --d-cloud-sh:#d6e2ea; --k-cloud-sh:#c89a94; --n-cloud-sh:#222c50;
  --d-grid-sky:#7aa6c0; --n-grid-sky:#3a4c80;   /* 天空上的淡格線 */

  /* —— 沙漠、地面、道路 —— */
  --d-dune-far:#e6c894; --k-dune-far:#d89a72; --n-dune-far:#2a2c4a;
  --d-dune:#dcb77c;     --k-dune:#cf8c5e;     --n-dune:#2c2c44;
  --d-ground:#e2c58e;   --k-ground:#d8a070;   --n-ground:#2c2b40;
  --d-ground-dk:#c9a66c;--n-ground-dk:#22222f;
  --d-ground-hi:#f0dcae;--n-ground-hi:#3a3a52;
  --d-grid:#a8875a;     --n-grid:#4a4c70;      /* 地面立體格線 */
  --d-road:#b9b2a4;     --n-road:#2a2a36;
  --d-road-edge:#8f887c;--n-road-edge:#1c1c26;
  --d-road-line:#f6f2e6;--n-road-line:#6a6a7a;
  --d-shadow:#7a5a3a;   --n-shadow:#0c0c18;    /* 地上的影子 */
  --d-city:#c2b9ae;     --k-city:#b08a86;     --n-city:#1e2038;

  /* —— 金字塔石材 —— */
  --d-lime-lit:#f1d9a4; --k-lime-lit:#f6b87a; --n-lime-lit:#5a5468;   /* 石灰岩受光面 */
  --d-lime-sh:#9c7646;  --k-lime-sh:#8e5e4e;  --n-lime-sh:#2c2a3e;    /* 石灰岩背光面 */
  --d-casing:#fbf3e2;   --k-casing:#ffd2a4;   --n-casing:#6e6a80;     /* 卡夫拉頂端殘留的白色外殼 */
  --d-granite:#c4927e;  --n-granite:#4a3640;                          /* 孟卡拉下段紅色花崗岩 */
  --d-ink:#4a3826;      --n-ink:#0e0e1a;      /* 輪廓墨線 */
  --d-course:#9c7a4a;   --n-course:#22222e;   /* 石塊層線 */

  /* —— 剖面（大金字塔內部） —— */
  --d-cut:#e8cfa0;      --n-cut:#4c4658;      /* 切開的石灰岩斷面 */
  --d-hatch:#b48c58;    --n-hatch:#2c2838;    /* 剖面斜線 */
  --d-bedrock:#b89a74;  --n-bedrock:#2e2a36;   /* 地底岩盤 */
  --d-void:#3a2c24;     --n-void:#08080e;     /* 通道與墓室 */
  --d-red-granite:#b25a4a; --n-red-granite:#4a2a30;  /* 國王室的紅色花崗岩 */

  /* —— 人面獅身像、神廟 —— */
  --d-sph-lit:#e8c890;  --k-sph-lit:#f2ac70;  --n-sph-lit:#5a5266;
  --d-sph-sh:#946a3e;   --k-sph-sh:#86584a;   --n-sph-sh:#2a283a;
  --d-temple:#c49a7a;   --n-temple:#3a3040;
  --d-temple-sh:#8e6a54;--n-temple-sh:#262230;

  /* —— 人物與動物 —— */
  --d-skin-1:#f0c8a0;   --n-skin-1:#6a5a62;
  --d-skin-2:#a8714a;   --n-skin-2:#4a3a40;
  --d-skin-3:#7a4e32;   --n-skin-3:#3a2e34;
  --d-galabeya:#f2efe6; --n-galabeya:#5e5e6e;   /* 當地人的長袍 */
  --d-galabeya-2:#6a7c96; --n-galabeya-2:#2e3446;
  --d-shirt-1:#e2583a;  --n-shirt-1:#4a2a30;
  --d-shirt-2:#3a8ab8;  --n-shirt-2:#22364a;
  --d-shirt-3:#f2c43a;  --n-shirt-3:#4a4230;
  --d-shirt-4:#5aa070;  --n-shirt-4:#24382e;
  --d-pants:#40506a;    --n-pants:#1a1e2a;
  --d-hat:#efe2c0;      --n-hat:#4a4a56;
  --d-camel:#c89a62;    --n-camel:#4a3e3a;
  --d-camel-dk:#9a7244; --n-camel-dk:#2e2828;
  --d-horse:#7a4a2e;    --n-horse:#2e2224;
  --d-horse-dk:#4a2c1a; --n-horse-dk:#1a1416;
  --d-dog:#c8a06a;      --n-dog:#3e3634;
  --d-bus:#f4f4f0;      --n-bus:#5a5e6e;      /* 電動接駁車 */
  --d-bus-sh:#c8ccd0;   --n-bus-sh:#3a3e4c;
  --d-glass:#4a7a9a;    --n-glass:#e8d08a;    /* 夜裡車窗亮燈 */
  --d-tyre:#2a2828;     --n-tyre:#0e0e12;
  --d-seat:#8a3a3a;     --n-seat:#3a1e26;     /* 聲光秀觀眾席 */

  /* —— 說明圖標註 —— */
  --d-label-bg:#fffaf0; --n-label-bg:#1a2040;
  --d-label-fg:#3a2a1a; --n-label-fg:#e8ecff;
  --d-leader:#4a3826;   --n-leader:#b8c4f0;
  --d-dim:#2f6f8a;      --n-dim:#7ad0f0;       /* 尺寸線 */
  --d-accent:#d2552a;   --n-accent:#ffb04a;    /* 編號圓圈 */

  /* —— 不隨日夜變化的顏色 —— */
  --moon:#f8f0d0; --star:#fff6d8;
  --flood-warm:#ffb45a; --flood-gold:#ffd25a; --flood-blue:#4a8cff; --flood-violet:#a65aff; --flood-teal:#2ae0d0; --flood-red:#ff4a5a;
  --laser:#7affd8; --laser-2:#ff5ad2;
  --dust:#e0a860; --haze:#d8d4cc; --flash:#ffffff;
  --kite:#4a3426; --lamp:#ffe08a;
  --blanket-1:#d2382a; --blanket-2:#2a6ab0; --blanket-3:#f2b23a; --tassel:#3aa070;

  /* —— 頁面介面 —— */
  --page-bg:#f4efe4; --page-fg:#2e261c; --page-muted:#76685a;
  --ui-surface:#fffbf3; --ui-line:#d8ccb4; --ui-accent:#2f6f8a; --ui-hot:#2a3a6a; --ui-hot2:#c2652a;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-label:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border:1px solid var(--ui-line);border-radius:10px;overflow:hidden;background:#243058;line-height:0;box-shadow:0 2px 10px rgba(60,40,20,.08)}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:10px;padding:10px 14px}
.panel button{font:600 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:6px;padding:9px 13px;cursor:pointer;letter-spacing:.03em}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:#fff}
.panel button.big{border-color:var(--ui-hot);color:#fff;background:var(--ui-hot)}
.panel button.big2{border-color:var(--ui-hot2);color:#fff;background:var(--ui-hot2)}
.panel button.on{background:#f2b23a!important;border-color:#f2b23a!important;color:var(--page-fg)!important}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px dashed #2f6f8a;outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(220px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding:0;list-style:none;color:var(--page-muted);font-size:14px;line-height:1.8;display:flex;flex-wrap:wrap;gap:4px 22px}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .edge{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linejoin:round}
#scene .thin{fill:none;stroke:var(--ink);stroke-width:.8;stroke-linejoin:round}
#scene .lbl{font:700 13px var(--font-label);fill:var(--label-fg);dominant-baseline:central}
#scene .lbl-s{font:600 11px var(--font-label);fill:var(--label-fg);dominant-baseline:central}
#scene .lbl-box{fill:var(--label-bg);stroke:var(--leader);stroke-width:1}
#scene .leader{fill:none;stroke:var(--leader);stroke-width:1}
#scene .num circle{fill:var(--accent)}
#scene .num text{fill:#fff;font:700 11px var(--font-label);text-anchor:middle;dominant-baseline:central}
#scene .dimln{fill:none;stroke:var(--dim);stroke-width:1.2}
#scene .dimtx{fill:var(--dim);font:700 12px var(--font-label);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--label-bg);stroke-width:3}
#scene .flood{mix-blend-mode:screen;pointer-events:none}
#scene .bubble path{fill:var(--label-bg);stroke:var(--leader);stroke-width:1.2}
#scene .bubble text{fill:var(--label-fg);font:700 14px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .room{cursor:pointer}
#scene .room:hover{filter:brightness(1.6)}
</style>
<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。
   想恢復完整版，刪掉這整段 <style id="pure-art"> 即可。
   ========================================================= */
html,body{height:100%;margin:0!important;overflow:hidden}
body{display:flex!important;align-items:center;justify-content:center;padding:0!important}
body>.wrap{width:100%!important;max-width:min(100vw,calc(100vh * 8 / 3))!important;
  margin:0!important;padding:0!important;gap:0!important;display:block!important}
body>.wrap>:not(.stage){display:none!important}
body>.wrap>.stage{width:100%!important;max-width:100%!important;margin:0!important;
  border:0!important;border-radius:0!important;box-shadow:none!important}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：天空與淡格線 → 星星 → 太陽、月亮 → 雲 → 黑鳶 → 西方沙丘 → 遠方開羅市區
       → 地面與立體格線 → 影子 → 孟卡拉與王后金字塔 → 卡夫拉金字塔 → 古夫金字塔（含剖面）
       → 夜間投射燈與聲光秀燈光 → 全景觀景台 → 駱駝商隊 → 騎馬的人 → 王后金字塔
       → 人面獅身像與河谷神廟 → 觀眾席、遊客、小販、狗 → 接駁車道 → 雷射
       → 天氣 → 標註層（編號、引線、尺寸線、圖例、指北針）→ 對話泡泡
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="3D 說明圖風格的埃及吉薩金字塔群：從東邊往西看，由左到右是孟卡拉、卡夫拉、古夫三座金字塔，金字塔用受光面與背光面畫出立體感，地面有淡淡的立體格線；卡夫拉金字塔前是面朝觀眾的人面獅身像和河谷神廟，前方有聲光秀觀眾席；沙漠上有駱駝商隊、騎馬的人、遊客、導遊、小販和電動接駁車；畫面上有編號標註、圖例、指北針和比例尺">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-top)"/><stop offset="1" style="stop-color:var(--sky-low)"/>
      </linearGradient>
      <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--ground-dk)"/><stop offset=".35" style="stop-color:var(--ground)"/><stop offset="1" style="stop-color:var(--ground-hi)"/>
      </linearGradient>
      <radialGradient id="sunGlow"><stop offset="0" style="stop-color:var(--sun)" stop-opacity=".55"/><stop offset="1" style="stop-color:var(--sun)" stop-opacity="0"/></radialGradient>
      <radialGradient id="cityGlow"><stop offset="0" stop-color="#ffb46a" stop-opacity=".5"/><stop offset="1" stop-color="#ffb46a" stop-opacity="0"/></radialGradient>
      <radialGradient id="lampGlow"><stop offset="0" stop-color="#fff0b0" stop-opacity=".9"/><stop offset="1" stop-color="#fff0b0" stop-opacity="0"/></radialGradient>
      <radialGradient id="dustBall"><stop offset="0" style="stop-color:var(--dust)" stop-opacity=".75"/><stop offset="1" style="stop-color:var(--dust)" stop-opacity="0"/></radialGradient>
      <!-- 剖面斜線（工程圖的斷面記號） -->
      <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="7" height="7" style="fill:var(--cut)"/>
        <line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--hatch)" stroke-width="1.1"/>
      </pattern>
      <pattern id="hatchRock" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
        <rect width="9" height="9" style="fill:var(--bedrock)"/>
        <line x1="0" y1="0" x2="0" y2="9" style="stroke:var(--hatch)" stroke-width="1"/>
        <circle cx="5" cy="4" r=".9" style="fill:var(--hatch)"/>
      </pattern>
      <!-- 雷射光暈 -->
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
      <!-- 沙塵暴的流沙紋理 -->
      <filter id="sandF" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".004 .03" numOctaves="3" seed="7" result="n"/>
        <feColorMatrix in="n" type="matrix" values="0 0 0 0 .85  0 0 0 0 .6  0 0 0 0 .32  0 0 0 1.6 -.55"/>
      </filter>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 1L10 5L0 9Z" style="fill:var(--dim)"/>
      </marker>
      <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
        <circle cx="5" cy="5" r="4" style="fill:var(--leader)"/>
      </marker>
    </defs>

    <rect id="skyHit" class="clickable" x="-50" y="-50" width="1700" height="700" fill="url(#skyGrad)"/>
    <g id="skyGrid" class="noHit"></g>
    <g id="nightSky" class="noHit"></g>
    <circle id="sunHalo" class="noHit" r="120" fill="url(#sunGlow)"/>
    <g id="sunG" class="clickable" tabindex="0" role="button" aria-label="太陽：點一下換成夜晚"></g>
    <g id="moonG" class="clickable" tabindex="0" role="button" aria-label="月亮：點一下換成白天"></g>
    <g id="clouds"></g>
    <rect id="overcastSky" class="noHit" x="-50" y="-50" width="1700" height="420" fill="#8e96a0" opacity="0"/>
    <g id="kites"></g>
    <g id="dunes"></g>
    <g id="city" class="noHit"></g>
    <g id="groundG"></g>
    <g id="shadows" class="noHit"></g>
    <g id="menkaureG"></g>
    <g id="khafreG"></g>
    <g id="khufuG"></g>
    <g id="floodG" class="noHit"></g>
    <g id="projG" class="noHit"></g>
    <g id="panoG"></g>
    <g id="camelG"></g>
    <g id="horseG"></g>
    <g id="queensG"></g>
    <g id="sphinxG"></g>
    <g id="sphLight" class="noHit"></g>
    <g id="nearG"></g>
    <g id="roadG"></g>
    <g id="busG"></g>
    <g id="laserG" class="noHit"></g>
    <g id="fx" class="noHit"></g>
    <rect id="hazeVeil" class="noHit" x="0" y="0" width="1600" height="600" style="fill:var(--haze)" opacity="0"/>
    <rect id="dustVeil" class="noHit" x="0" y="0" width="1600" height="600" style="fill:var(--dust)" opacity="0"/>
    <g id="sandG" class="noHit" opacity="0">
      <rect id="sand1" x="-400" y="0" width="2400" height="600" filter="url(#sandF)"/>
    </g>
    <g id="dustMotes" class="noHit"></g>
    <rect id="flash" class="noHit" x="0" y="0" width="1600" height="600" fill="var(--flash)" opacity="0"/>
    <g id="annot"></g>
    <g id="callG" class="noHit"></g>
    <g id="say" class="noHit"></g>
  </svg>
  </figure>

  <!-- =====================================================
       【互動】控制列（畫面中物件自己可以點的動作，這裡不再重複做按鈕）
       ===================================================== -->
  <div class="panel">
    <button id="btnShow" class="big" type="button">🌙 聲光秀</button>
    <button id="btnBuild" class="big2" type="button">🧱 建造過程</button>
    <button id="btnLabel" type="button" aria-pressed="true">📐 標註</button>
    <button id="btnWeather" type="button">天氣：晴</button>
    <button id="btnSound" type="button" aria-pressed="true">🔊 聲音：開</button>
    <button id="btnDay" type="button">☀ 白天</button>
    <button id="btnDusk" type="button">🌅 沙漠夕陽</button>
    <button id="btnNight" type="button">☾ 夜晚</button>
    <button id="btnAuto" type="button" aria-pressed="true">自動播放</button>
    <label class="timebox" for="timeRange">
      <span>時間</span>
      <input id="timeRange" type="range" min="0" max="1000" value="417">
      <span class="clock" id="clock">10:00</span>
    </label>
  </div>
  <ul class="hint">
    <li>🌙 聲光秀：燈光、雷射配原創音樂</li>
    <li>🧱 建造過程：大金字塔一層層蓋起來</li>
    <li>🔍 點大金字塔剖開，點墓室看說明</li>
    <li>🖐️ 人面獅身、駱駝、接駁車、遊客都能點</li>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);
      }
      return _conn.call(this, dest, ...a);
    };
  }
  function stopAudio() {
    let longs = [], ctx = null;
    for (const s of srcs) {
      const c = s.context, now = c.currentTime, m = s.__ss; ctx = c;
      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }

      const g = outs.get(ctx), now = ctx.currentTime;
      if (g) {
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 1.1); g.gain.setValueAtTime(0, now + 1.2);
        g.gain.linearRampToValueAtTime(1, now + 1.9);

      longs.forEach(s => { try { s.stop(now + 1.15); } catch (e) {} srcs.delete(s); });
    }
    srcs.clear();
  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');
    // 凍結色票：把目前的 CSS 變數抄到殘影上，底下換色不影響殘影
    const cs = getComputedStyle(svg);
    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }
      }
    }
    const par = svg.parentElement;
    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });

  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);

  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>
/* =========================================================
   SC-37 埃及吉薩金字塔群｜程式區
   區塊：①工具、色票與投影
         ②場景（天空、沙丘、開羅市區、地面格線、三座金字塔、大金字塔剖面、王后金字塔、人面獅身像、河谷神廟）
         ③角色（駱駝商隊、騎馬的人、遊客、導遊、小販、狗、黑鳶、電動接駁車、觀眾席）
         ④動畫（主迴圈、日夜與即時明暗、影子、天氣、聲光秀、建造過程）
         ⑤互動（點擊、滑鼠標註、聲音、控制列）
   ========================================================= */
(() => {
'use strict';

/* ---------------- ① 工具 ---------------- */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const root = document.documentElement;
const svg = $('scene');
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
let seed = 20261137;        // 固定亂數：每次開啟構圖都一樣
const srand = (a = 0, b = 1) => { seed = (seed * 16807) % 2147483647; return a + (seed / 2147483647) * (b - a); };
const f1 = n => (+n).toFixed(1);
const pts = a => a.map(p => f1(p[0]) + ',' + f1(p[1])).join(' ');
function el(tag, attrs = {}, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function clickable(g, label, info) {
  g.classList.add('clickable'); g.setAttribute('tabindex', 0); g.setAttribute('role', 'button'); g.setAttribute('aria-label', label);
  if (info) g.dataset.info = info;
  return g;
}

/* ---------------- ① 色票：讀取、配對、日夜內插 ---------------- */
const css = n => getComputedStyle(root).getPropertyValue(n).trim();
const hex = h => { h = h.replace('#', ''); const n = parseInt(h.slice(0, 6), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255, 1]; };
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgba = c => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${(c[3] ?? 1).toFixed(3)})`;
const PAIRS = {}, CUR = {};
(() => {
  const names = [];
  for (const sheet of document.styleSheets) {
    try { for (const r of sheet.cssRules) if (r.selectorText === ':root') for (const p of r.style) if (p.startsWith('--d-')) names.push(p.slice(4)); } catch (e) {}
  }
  let cls = '';
  names.forEach(k => {
    const k2 = css('--k-' + k);
    PAIRS[k] = { d: hex(css('--d-' + k)), n: hex(css('--n-' + k)), k: k2 ? hex(k2) : null };
    CUR[k] = PAIRS[k].d;
    cls += `#scene .f-${k}{fill:var(--${k})}#scene .s-${k}{stroke:var(--${k});fill:none}`;
  });
  const st = document.createElement('style'); st.textContent = cls; document.head.appendChild(st);
})();
const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
let reduced = mq.matches;

/* ---------------- ① 斜投影 ----------------
   世界座標（公尺）：n＝往北（畫面往右）、w＝往西（畫面深處，往左上 30 度、長度打五折）、z＝往上。
   每個物件有自己的原點 o＝{cx, gy}（底面中心在畫面上的位置）與比例 s（每公尺幾像素）。 */
const DX = .433, DY = .25;
const PP = (o, n, w, z) => [o.cx + (n - w * DX) * o.s, o.gy - (w * DY + z) * o.s];

/* 明暗：依太陽方位算出每個面受光多少（0～1），每次更新顏色時重算 */
const SUN = { e: 0, n: 0, u: 1, k: 1 };     // 太陽方向（東、北、上）與天氣造成的對比
const shaded = [];                          // {node, lit, sh, face}
function shadeOf(face) {
  // 金字塔斜面的法向量：東面（0.79 東、0.62 上）、南面（0.79 南、0.62 上）；u＝水平頂面；e2/s2＝垂直牆面
  let d;
  if (face === 'e') d = .786 * SUN.e + .619 * SUN.u;
  else if (face === 's') d = -.786 * SUN.n + .619 * SUN.u;
  else if (face === 'e2') d = SUN.e;
  else if (face === 's2') d = -SUN.n;
  else d = SUN.u;
  // 說明圖要明暗分明：把受光量拉開對比，最暗 0.15、最亮 1
  const b = Math.pow(clamp((d - .25) / .75, 0, 1), 2);
  return clamp(.15 + .85 * (b * SUN.k + (1 - SUN.k) * .45), 0, 1);
}
function addShade(node, lit, sh, face) { shaded.push({ node, lit, sh, face }); return node; }
function paintShades() {
  for (const S of shaded) {
    const a = typeof S.lit === 'string' ? CUR[S.lit] : S.lit(), b = typeof S.sh === 'string' ? CUR[S.sh] : S.sh();
    S.node.style.fill = rgba(mix(b, a, shadeOf(S.face)));
  }
}
const darker = (k, t) => () => mix(CUR[k], [20, 14, 20, 1], t);

/* =========================================================
   ② 場景
   ========================================================= */
/* ---- 天空：淡格線、星星、太陽、月亮、雲、黑鳶 ---- */
const clouds = [];
function drawSky() {
  const gg = $('skyGrid');
  for (let y = 40; y < 360; y += 40) el('line', { x1: 0, y1: y, x2: 1600, y2: y, class: 's-grid-sky', 'stroke-width': .6, opacity: .25 }, gg);
  for (let x = 0; x <= 1600; x += 80) el('line', { x1: x, y1: 0, x2: x, y2: 360, class: 's-grid-sky', 'stroke-width': .6, opacity: .18 }, gg);
  const ns = $('nightSky');
  for (let i = 0; i < 170; i++) el('circle', { cx: f1(srand(0, 1600)), cy: f1(srand(0, 330)), r: f1(srand(.5, 1.7)), fill: 'var(--star)', opacity: f1(srand(.35, 1)) }, ns);

/* =========================================================
   ④ 動畫：日夜、太陽方位、即時明暗、影子
   ========================================================= */
const DAY_SEC = 150;                                  // 一天＝150 秒
const T = { t: 10 / 24, auto: true, dragging: false };
let night = 0, dusk = 0, lastColor = -1, hourNow = 10;
function applyColors(force) {
  const key = Math.round(T.t * 1440);
  if (!force && key === lastColor) return;
  lastColor = key;
  const h = hourNow = T.t * 24;
  // 吉薩十一月：約 6:15 日出、17:00 日落
  night = clamp(1 - smooth(5.5, 6.9, h) + smooth(16.9, 18.3, h), 0, 1);
  dusk = Math.max(Math.exp(-Math.pow((h - 6.3) / .8, 2)), Math.exp(-Math.pow((h - 17.2) / .8, 2)));
  for (const k in PAIRS) {
    const P = PAIRS[k];
    let c = mix(P.d, P.n, night);
    if (P.k) c = mix(c, P.k, dusk * .85);
    CUR[k] = c;
    root.style.setProperty('--' + k, rgba(c));
  }
  // 太陽方向：方位角從東（90°）經南（180°）到西（270°）
  const p = (h - 6.25) / (17.0 - 6.25);
  if (p > 0 && p < 1) {
    const A = (90 + p * 180) * Math.PI / 180, e = Math.sin(Math.PI * p) * 46 * Math.PI / 180;
    SUN.e = Math.sin(A) * Math.cos(e); SUN.n = Math.cos(A) * Math.cos(e); SUN.u = Math.sin(e); SUN.elev = e;
  } else { SUN.e = 0; SUN.n = -.2; SUN.u = .55; SUN.elev = 0; }
  SUN.k = clamp(1 - wx.cloud * .55 - wx.dust * .55 - wx.haze * .4, .2, 1) * (1 - night * .5);
  paintShades();
  drawShadows(p);
  $('clock').textContent = clockText();

/* ---- 影子：把塔頂沿著陽光方向投到地上，和底座四角一起取凸包 ---- */
const shadowNodes = {};
function hull(P) {
  P = P.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const p of P) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (const p of P.slice().reverse()) { while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}
function drawShadows(p) {
  const list = [['menkaure', PYR.menkaure], ['khafre', PYR.khafre], ['khufu', PYR.khufu]];
  const ok = p > .02 && p < .98 && SUN.elev > .05;
  list.forEach(([k, P]) => {
    if (!shadowNodes[k]) shadowNodes[k] = el('polygon', { class: 'f-shadow' }, $('shadows'));
    const node = shadowNodes[k];
    if (!ok) { node.setAttribute('opacity', 0); return; }
    const hl = Math.hypot(SUN.e, SUN.n) || 1, L = Math.min(380, P.H / Math.tan(SUN.elev));
    const tip = PP(P, -SUN.n / hl * L, SUN.e / hl * L, 0);
    const C = P.C;
    node.setAttribute('points', pts(hull([C.FL, C.FR, C.BL, C.BR, tip])));
    node.setAttribute('opacity', f1(.3 * SUN.k * smooth(.04, .3, SUN.elev)));
  });
}

let callTarget = null;

  const g = $('callG');
  while (g.firstChild) g.firstChild.remove();
  if (!info) return;
  const [name, det = ''] = info.split('｜');
  const w = Math.max(name.length * 14, det.length * 12) + 22, left = p.x > 1180, dx = left ? -36 : 36, bx = left ? p.x + dx - w : p.x + dx, by = clamp(p.y - 70, 6, 540);
  el('circle', { cx: f1(p.x), cy: f1(p.y), r: 3, fill: 'var(--leader)' }, g);
  el('path', { d: `M${f1(p.x)} ${f1(p.y)}L${f1(p.x + dx * .6)} ${f1(by + 22)}L${f1(left ? bx + w : bx)} ${f1(by + 22)}`, class: 'leader' }, g);
  el('rect', { x: f1(bx), y: f1(by), width: f1(w), height: det ? 44 : 26, rx: 5, class: 'lbl-box' }, g);
  el('text', { x: f1(bx + 11), y: f1(by + 13), class: 'lbl' }, g).textContent = name;
  if (det) el('text', { x: f1(bx + 11), y: f1(by + 32), class: 'lbl-s' }, g).textContent = det;
}
const birds = [];
function skyClick(x, y) {
  if (night > .5) {
    const g = el('path', { d: 'M0 0L-90 -30', stroke: '#fff8d8', 'stroke-width': 2, 'stroke-linecap': 'round' }, $('fx'));
    tween(1, k => { g.setAttribute('transform', `translate(${f1(x + k * 200)} ${f1(y + k * 70)})`); g.setAttribute('opacity', f1(1 - k)); }, () => g.remove());
    sfx('shoot'); return;
  }
  for (let i = 0; i < 7; i++) { const g = el('path', { d: 'M0 0C-4 -5 -9 -5 -12 -2C-7 -2 -3 0 0 2C3 0 7 -2 12 -2C9 -5 4 -5 0 0Z', fill: 'var(--kite)' }, $('fx')); birds.push({ g, x: x + rand(-30, 30), y: y + rand(-20, 20), vx: rand(80, 140) * (Math.random() < .5 ? -1 : 1), vy: rand(-40, -10), t: 0, life: rand(3, 5), ph: rand(0, 6) }); }
  sfx('birds');
}

/* ---------------- ④ 動畫：主迴圈 ---------------- */
let last = performance.now(), time = 0, colorAcc = 0;
function loop(now) { const dt = Math.min(.1, (now - last) / 1000); last = now; step(dt); requestAnimationFrame(loop); }
function step(dt) {
  time += dt;
  const mv = reduced ? 0 : 1;
  if (T.auto && !T.dragging && !reduced && !show.on && !build.on) T.t = (T.t + dt / DAY_SEC) % 1;
  // 天氣慢慢轉變
  let wch = false;
  for (const k in wx) { const d = wxT[k] - wx[k]; if (Math.abs(d) > .002) { wx[k] += d * Math.min(1, dt * 1.2); wch = true; } }
  colorAcc += dt; if (colorAcc > .12 || (wch && colorAcc > .06)) { colorAcc = 0; applyColors(wch); }
  if (sunBump > 0) sunBump = Math.max(0, sunBump - dt * 40);
  $('overcastSky').setAttribute('opacity', f1(wx.cloud * .3));
  $('hazeVeil').setAttribute('opacity', f1(wx.haze * .42));
  $('dustVeil').setAttribute('opacity', f1(wx.dust * .4));
  $('sandG').setAttribute('opacity', f1(wx.dust * .7));
  $('sand1').setAttribute('x', f1(-400 + ((time * 140 * mv) % 400)));
  // 沙塵暴時的飛沙線條
  if (wx.dust > .3 && mv && Math.random() < wx.dust * .7) {
    const ln = el('line', { x1: 0, y1: 0, x2: rand(30, 70), y2: 0, stroke: 'var(--dust)', 'stroke-width': rand(1, 2.2), opacity: .7 }, $('dustMotes'));
    const y = rand(60, 600), sp = rand(500, 800);
    tween(2.6, k => ln.setAttribute('transform', `translate(${f1(1650 - k * sp * 2.6)} ${f1(y + Math.sin(k * 6) * 6)})`), () => ln.remove());
  }
  // 雲
  clouds.forEach((c, i) => {
    c.x -= c.sp * dt * mv * (1 + wx.dust * 3);
    if (c.x < -160) c.x = 1760;
    c.g.setAttribute('transform', `translate(${f1(c.x)} ${f1(c.y)})`);
    c.g.setAttribute('opacity', f1(clamp(.25 + wx.cloud * 1.2 - i * .06, .2, 1)));
  });
  // 黑鳶盤旋
  kites.forEach(B => {
    B.a += dt * .45 * mv;
    if (B.away > 0) { B.away -= dt; B.cy -= 50 * dt * mv; B.cx += 70 * dt * mv; } else { B.cy = lerp(B.cy, 130, dt * .3); }
    if (B.cx > 1700) B.cx = -100;
    const x = B.cx + Math.cos(B.a) * B.r, y = B.cy + Math.sin(B.a) * B.r * .35;
    B.g.setAttribute('transform', `translate(${f1(x)} ${f1(y)}) scale(${Math.sin(B.a) > 0 ? -1 : 1} 1)`);
    B.w.setAttribute('transform', `scale(1 ${f1(.7 + .3 * Math.sin(time * 3 + B.a))})`);
    B.g.style.display = night > .7 ? 'none' : '';
  });
  stepCamels(dt, mv);
  stepHorses(dt, mv);
  stepWalkers(dt, mv);
  stepCars(dt, mv);
  stepNear(dt, mv);
  if (K.cut) stepExplorer(dt, mv);
  if (show.on) showStep(dt, mv); else nightFloods();
  if (build.on) buildStep(dt, mv);
  // 鳥群、粒子、補間
  for (let i = birds.length - 1; i >= 0; i--) { const b = birds[i]; b.t += dt; b.x += b.vx * dt; b.y += b.vy * dt; b.g.setAttribute('transform', `translate(${f1(b.x)} ${f1(b.y)}) scale(1 ${f1(.6 + .4 * Math.sin(time * 18 + b.ph))})`); b.g.setAttribute('opacity', f1(1 - b.t / b.life)); if (b.t > b.life) { b.g.remove(); birds.splice(i, 1); } }
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; const k = p.life / p.max; p.n.setAttribute('cx', f1(p.x)); p.n.setAttribute('cy', f1(p.y)); p.n.setAttribute('r', f1(p.r + (1 - k) * p.grow)); p.n.setAttribute('opacity', f1(k * p.op)); if (p.life <= 0) { p.n.remove(); parts.splice(i, 1); } }
  for (let i = tweens.length - 1; i >= 0; i--) { const w = tweens[i]; w.t += dt; const k = Math.min(1, w.t / w.dur); w.fn(k); if (k >= 1) { tweens.splice(i, 1); w.done && w.done(); } }
}
/* 駱駝商隊：整隊一起往左走，人在最前面，每隻間隔固定，不會互相穿過；走出畫面後從人面獅身像後方重新出發 */
function stepCamels(dt, mv) {
  const kneeling = camels.list.some(C => C.kneel > 0);
  if (!kneeling) camels.x -= camels.sp * dt * mv;
  if (camels.x < -380) camels.x = 990;
  const ph = time * 5 * mv;
  // 從大金字塔西南角後方的沙地走出來（右端淡入）
  const L = camels.lead; L.x = camels.x - 26; L.y = 446; L.g.style.opacity = f1(clamp((975 - L.x) / 40, 0, 1)); L.dir = -1; placeActor(L); poseWalk(L, kneeling ? 0 : ph, 22 * mv);
  camels.list.forEach((C, i) => {
    const x = camels.x + 30 + i * 74, y = 446;
    C.g.setAttribute('transform', `translate(${f1(x)} ${y}) scale(-.82 .82)`);
    C.g.style.opacity = f1(clamp((975 - x) / 40, 0, 1));
    C.g.style.pointerEvents = x > 975 ? 'none' : '';
    if (C.kneel > 0) C.kneel -= dt;
    const kk = C.kneel > 0 ? smooth(0, .4, Math.min(C.kneel, 2.6 - C.kneel)) : 0;
    C.body.setAttribute('transform', `translate(0 ${f1(kk * 14)})`);
    C.legs.forEach((l, j) => { const b = l.getAttribute('transform').split(' rotate')[0].split(' scale')[0]; const a = kk ? 0 : Math.sin(ph + C.ph + j * Math.PI * .5 + (j > 1 ? Math.PI : 0)) * 16; l.setAttribute('transform', `${b} rotate(${f1(a)}) scale(1 ${f1(1 - kk * .55)})`); });
  });
}
/* 騎馬的人：同一條路線往右，後面的追上前面就放慢，保持距離 */
function stepHorses(dt, mv) {
  const L = horses.list.slice().sort((a, b) => b.x - a.x);
  L.forEach((Hh, i) => {
    let v = Hh.v * (Hh.rear > 0 ? 0 : 1) * (Hh.fast > 0 ? 2 : 1);
    if (Hh.fast > 0) Hh.fast -= dt;
    if (i > 0) { const ahead = L[i - 1]; if (ahead.x - Hh.x < 90) v = Math.min(v, Math.max(0, ahead.x - Hh.x - 60)); }
    Hh.x += v * dt * mv;
    if (Hh.x > 1700) { const minX = Math.min(...horses.list.map(o => o.x)); Hh.x = Math.min(-80, minX - 120); }
    if (Hh.rear > 0) Hh.rear -= dt;
    const rr = Hh.rear > 0 ? Math.sin(Math.PI * clamp(1 - Hh.rear / 1.4, 0, 1)) : 0;
    placeActor(Hh);
    Hh.body.setAttribute('transform', `rotate(${f1(-rr * 22)} -16 0)`);
    const ph = Hh.x * .22;
    Hh.legs.forEach((l, j) => { const b = l.getAttribute('transform').split(' rotate')[0]; l.setAttribute('transform', `${b} rotate(${f1(rr && j < 2 ? -40 : Math.sin(ph + j * 1.6) * 20 * mv)})`); });
  });
}
/* 走路的遊客：往右走，保持距離 */
function stepWalkers(dt, mv) {
  const L = walkers.list.slice().sort((a, b) => b.x - a.x);
  L.forEach((P, i) => {
    let v = P.wave > 0 ? 0 : P.v;
    if (P.wave > 0) P.wave -= dt;
    if (i > 0 && L[i - 1].x - P.x < 46) v = Math.min(v, Math.max(0, L[i - 1].x - P.x - 30));
    P.x += v * dt * mv;
    if (P.x > 1640) { const minX = Math.min(...walkers.list.map(o => o.x)); P.x = Math.min(-30, minX - 60); }
    placeActor(P);
    poseWalk(P, P.x * .28, v > 0 ? 24 * mv : 0);
    P.arm.setAttribute('transform', `translate(0 -24) rotate(${P.wave > 0 ? f1(-150 + Math.sin(time * 14) * 20) : 0})`);
  });
}
/* 接駁車道：往左開，車頭朝左；跟車保持車距 */
function stepCars(dt, mv) {
  const L = cars.list.slice().sort((a, b) => a.x - b.x);
  L.forEach((V, i) => {
    let v = V.v * (V.stop > 0 ? 0 : 1);
    if (V.stop > 0) V.stop -= dt;
    if (i > 0) { const ahead = L[i - 1], gap = (V.x - V.L) - (ahead.x + ahead.L); if (gap < 70) v = Math.min(v, Math.max(0, gap - 40)); }
    V.x -= v * dt * mv;
    if (V.x < -160) { const maxX = Math.max(...cars.list.map(o => o.x)); V.x = Math.max(1760, maxX + 260); }
    V.g.setAttribute('transform', `translate(${f1(V.x)} ${V.y})`);
    V.wheels.forEach(w => { const b = w.getAttribute('transform').split(' rotate')[0]; w.setAttribute('transform', `${b} rotate(${f1(-V.x * 6)})`); });
  });
}
/* 靜態人物的小動作：導遊揮旗、小販、狗、觀景台 */
function stepNear(dt, mv) {
  const gd = guideG.guide;
  gd.arm.setAttribute('transform', `translate(0 -24) rotate(${f1((guideG.talk > 0 ? -40 + Math.sin(time * 9) * 25 : Math.sin(time * 1.2) * 6) * (mv || .2))})`);
  if (guideG.talk > 0) guideG.talk -= dt;
  guideG.people.forEach((P, i) => P.inner.setAttribute('transform', `translate(0 ${f1(Math.sin(time * 1.5 + i) * .6 * mv)})`));
  if (dog.awake > 0) {
    dog.awake -= dt;
    dog.tail.setAttribute('transform', `rotate(${f1(Math.sin(time * 22) * 25)} -14 -4)`);
    dog.head.setAttribute('transform', `translate(13 -9) rotate(-12)`);
  } else { dog.tail.setAttribute('transform', ''); dog.head.setAttribute('transform', `translate(13 ${f1(-5 + Math.sin(time * 1.3) * .5 * mv)})`); }
  vendor.inner.setAttribute('transform', `translate(0 ${f1(vendor.hop > 0 ? -Math.abs(Math.sin(time * 12)) * 3 : 0)})`);
  if (vendor.hop > 0) vendor.hop -= dt;
}
/* 剖面裡的探險小人 */
function stepExplorer(dt, mv) {
  const E = K.explorer, P = K.exPath, Ls = K.exLen, total = Ls[Ls.length - 1];
  if (E.wait > 0) { E.wait -= dt; }
  else {
    E.s += E.dir * 26 * dt * mv;
    if (E.s >= total) { E.s = total; E.dir = -1; E.wait = 2.2; }
    if (E.s <= 0) { E.s = 0; E.dir = 1; E.wait = 1.2; }
  }
  let i = 1; while (i < Ls.length - 1 && Ls[i] < E.s) i++;
  const k = (E.s - Ls[i - 1]) / (Ls[i] - Ls[i - 1] || 1);
  const x = lerp(P[i - 1][0], P[i][0], k), y = lerp(P[i - 1][1], P[i][1], k);
  const goingLeft = (P[i][0] - P[i - 1][0]) * E.dir < 0;
  E.g.setAttribute('transform', `translate(${f1(x)} ${f1(y - 1)})`);
  E.body.setAttribute('transform', `scale(${goingLeft ? -1 : 1} 1) translate(0 ${f1(-Math.abs(Math.sin(E.s * .5)) * .8)})`);
}

/* ---------------- ⑤ 互動：綁定 ---------------- */
function bindAll() {
  onAct($('sunG'), () => { sunBump = 14; sfx('boing'); setTime(21); });
  onAct($('moonG'), () => { sfx('boing'); setTime(10); });
  $('clouds').querySelectorAll('[data-cloud]').forEach(g => onAct(g, () => { const c = clouds[+g.dataset.cloud]; c.sp = c.sp * 1.0 + 40; setTimeout(() => c.sp -= 40, 2500); sfx('cloud'); }));
  $('skyHit').addEventListener('click', e => { userGesture = true; ensureAudio(); const p = svgPoint(e); skyClick(p.x, p.y); });
  onAct($('groundHit'), e => { const p = svgPoint(e); sandPuff(p.x, p.y, 7); sfx('puff'); });
  // 金字塔
  onAct(K.g, () => { if (build.on) return; toggleCut(); sfx('slide'); say(K.cx, K.C.A[1] - 30, K.cut ? '剖開看內部' : '合上', 1.2); });
  ROOMS.forEach(R => onAct(R.node, () => {
    R.node.style.filter = 'brightness(2.2)'; setTimeout(() => R.node.style.filter = '', 900);
    const a = R.anchor; say(a[0], a[1] - 34, R.info, 2.8); sfx('echo');
  }));
  onAct(PYR.khafre.g, () => { showDims('khafre'); sfx('shimmer'); const C = PYR.khafre.C; sparkle(C.A[0], C.A[1] + 20, 10, 'var(--casing)'); });
  onAct(PYR.menkaure.g, () => { showDims('menkaure'); sfx('tape'); });
  queens.forEach(Qp => onAct(Qp.g, () => { say(Qp.C.A[0], Qp.C.A[1] - 26, '王后與王族的小金字塔', 1.8); sfx('tape'); }));
  onAct(SPH.g, () => { showDims('sphinx'); sfx('gong'); });
  onAct(SPH.temple, () => { say(780, 470, '花崗岩巨石，一塊重達數十噸', 2.2); sfx('gong'); });
  // 人與動物
  onAct(camels.lead.g, () => { say(camels.lead.x, 384, pick(['你好！', '歡迎來吉薩！']), 1.4); sfx('wave'); });
  camels.list.forEach(C => onAct(C.g, () => { if (C.kneel > 0) return; C.kneel = 2.6; sfx('grunt'); }));
  horses.list.forEach(Hh => onAct(Hh.g, () => { if (Hh.rear > 0) return; Hh.rear = 1.4; Hh.fast = 3.2; sfx('whinny'); setTimeout(() => sfx('hooves'), 1300); }));
  walkers.list.forEach(P => onAct(P.g, () => { P.wave = 1.4; sfx('wave'); say(P.x, P.y - 52, pick(['哈囉！', '好壯觀！', '太熱了…']), 1.4); }));
  cars.list.forEach(V => onAct(V.g, () => {
    if (V.kind === 'bus') { V.stop = 1.6; say(V.x, V.y - 62, pick(['下一站：全景觀景台', '下一站：孟卡拉', '下一站：卡夫拉']), 2); sfx('chime'); }
    else { say(V.x, V.y - 50, '叮鈴，借過', 1.4); sfx('bell'); }
  }));
  onAct(guideG, () => { guideG.talk = 2.4; say(1030, 500, pick(['大金字塔蓋了大約 20 年', '人面獅身像面朝東方', '這邊走，跟緊旗子！']), 2.4); sfx('wave'); });
  onAct(vendor.wrap, () => { vendor.hop = 1.2; say(1150, 510, pick(['小金字塔要不要？', '明信片、頭巾！']), 1.6); sfx('jingle'); });
  onAct(pinch.g, () => { flash(.4); sfx('shutter'); say(540, 500, '捏到塔尖了！', 1.5); });
  onAct(dog.g, () => { dog.awake = 2.4; sfx('bark'); });
  onAct(seatsG, () => { audience.forEach(a => a.setAttribute('opacity', .95)); setTimeout(() => { if (!show.on) audience.forEach(a => a.setAttribute('opacity', 0)); }, 1800); sfx('clap'); });
  onAct(PANO.g, () => { flash(.45); sfx('shutter'); say(70, 392, '三座金字塔都入鏡！', 1.6); });
  kites.forEach(B => onAct(B.g, () => { B.away = 2.5; sfx('kite'); }));
  // 滑鼠標註
  svg.addEventListener('pointermove', e => {
    const t = e.target.closest && e.target.closest('[data-info]');
    if (t) { callTarget = t; showCall(svgPoint(e), t.dataset.info); }
    else if (callTarget) { callTarget = null; showCall(null, null); }
  });
  svg.addEventListener('pointerleave', () => { callTarget = null; showCall(null, null); });

  $('btnShow').addEventListener('click', () => startShow());
  $('btnBuild').addEventListener('click', () => startBuild());
  $('btnLabel').addEventListener('click', () => {
    annot.on = !annot.on; annot.g.style.display = annot.on ? '' : 'none';
    $('btnLabel').setAttribute('aria-pressed', String(annot.on));
  });
  $('btnWeather').addEventListener('click', () => { userGesture = true; ensureAudio(); setWeather((wxIdx + 1) % WX.length); });
  $('btnSound').addEventListener('click', () => {
    soundOn = !soundOn; userGesture = true; ensureAudio();
    if (master) master.gain.setValueAtTime(soundOn ? .55 : 0, actx.currentTime);
    if (!soundOn) { stopAll(); windSound(false); try { window.sceneMusic && window.sceneMusic.stop(); } catch (e) {} } else windSound(WX[wxIdx][0] === 'dust');
    $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  });
  $('btnDay').addEventListener('click', () => setTime(10));
  $('btnDusk').addEventListener('click', () => setTime(16.6));
  $('btnNight').addEventListener('click', () => setTime(21));
  $('btnAuto').addEventListener('click', () => { T.auto = !T.auto; $('btnAuto').setAttribute('aria-pressed', String(T.auto)); });
  const tr = $('timeRange');
  tr.addEventListener('input', () => { T.dragging = true; T.t = tr.value / 1000; applyColors(true); });
  tr.addEventListener('change', () => { T.dragging = false; });
  window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
  window.addEventListener('pointerdown', () => document.body.classList.remove('kbd'));
  mq.addEventListener && mq.addEventListener('change', () => { reduced = mq.matches; });
}

/* ---------------- 初始化 ---------------- */
function init() {
  drawSky();
  drawKites();
  drawFar();
  drawGround();
  drawPyramids();
  drawSection();
  drawSphinx();
  drawActors();
  drawPano();
  drawAnnot();
  buildShowLayers();
  buildLayer();
  bindAll();
  if (reduced) { T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false'); }
  setWeather(0);
  applyColors(true);
  step(1 / 60);
  requestAnimationFrame(loop);
}
init();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on ? 'show' : build.on ? 'build' : '',
  btn: { show: 'btnShow', build: 'btnBuild' },
  ff: () => { if (show.on) show.t = show.dur; else build.t = build.dur; },   // 跳到結尾：聲光秀收燈、金字塔恢復完整
  stop: () => { show.on = false; build.on = false; $('btnShow').classList.remove('on'); $('btnBuild').classList.remove('on'); buildG.style.display = 'none'; K.body.style.opacity = 1; }
});
/* /ShowStop */
})();
