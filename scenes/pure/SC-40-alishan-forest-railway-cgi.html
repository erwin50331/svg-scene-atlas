<!doctype html>
<html lang="zh-Hant">

<title>阿里山</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-40 阿里山｜CGI 電影質感
   地點：台灣嘉義阿里山，阿里山林業鐵路的祝山線（沼平 → 對高岳 → 祝山）。
   真實元素：762 公釐窄軌的森林鐵路、紅色車身的柴油機車與客車、
            櫻花季與阿里山生日才出動的 Shay 齒輪式蒸汽老火車頭（直立汽缸在車身右側，
            用曲軸和斜齒輪帶動轉向架），搭配台灣檜木打造的檜木車廂、
            日式木造的沼平車站與吉野櫻、紅檜巨木（樹齡兩千年以上）與巨木群棧道、
            柳杉林、對高岳招呼站、台灣最高的火車站「祝山」（海拔 2451 公尺）與觀日平台、
            東方地平線上的玉山山脈、雲海、清晨搭祝山線上山看日出的人潮、
            賣阿里山高山茶的小攤、金翼白眉（阿里山常見、會靠近遊客的特有種鳥）、
            赤腹松鼠、四五月的螢火蟲。
   風格重點：像 CGI 電影的一格畫面——體積光（光束穿過檜木林）、景深模糊（前景樹幹、蕨類是糊的）、
            空氣透視（越遠越藍越淡）、青橙色電影調色、鏡頭光暈、暗角、底片顆粒；
            鏡頭跟著火車橫向平移，不同深度的圖層用不同速度移動（視差），做出火車行進感；
            表演時上下出現寬銀幕黑邊。
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），部分另有 --k-名稱（晨昏）。
   JS 會依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）。
   ========================================================= */
:root{
  color-scheme: dark;

  /* —— 天空、高空雲 —— */
  --d-sky-top:#2f6fb0;  --k-sky-top:#2a3a6e;  --n-sky-top:#02060e;
  --d-sky-mid:#7fb4dc;  --k-sky-mid:#b97a86;  --n-sky-mid:#081428;
  --d-sky-low:#d8e6ee;  --k-sky-low:#ffb466;  --n-sky-low:#1c2844;
  --d-haze:#cfe0ea;     --k-haze:#ffc07a;     --n-haze:#1e2a44;
  --d-cloud:#ffffff;    --k-cloud:#ffd2a4;    --n-cloud:#283250;
  --d-cloud-dk:#a8bccc; --k-cloud-dk:#8a6070; --n-cloud-dk:#0e1628;
  --d-overcast:#8c98a4; --k-overcast:#76666e; --n-overcast:#0a101c;

  /* —— 雲海 —— */
  --d-sea:#ffffff;      --k-sea:#ffd9a8;      --n-sea:#3a4664;
  --d-sea-mid:#e4edf4;  --k-sea-mid:#f4a87c;  --n-sea-mid:#26304c;
  --d-sea-sh:#9fb2c6;   --k-sea-sh:#9a6a7c;   --n-sea-sh:#121a30;

  /* —— 遠山：玉山山脈與層層山稜（越遠越藍） —— */
  --d-peak:#7f9ab8;     --k-peak:#6a5a86;     --n-peak:#0e1630;
  --d-peak-hi:#c8d8ea;  --k-peak-hi:#ffb07a;  --n-peak-hi:#34406a;
  --d-ridge1:#6a8aa0;   --k-ridge1:#5a5276;   --n-ridge1:#0c1428;
  --d-ridge2:#46687a;   --k-ridge2:#3e3c5a;   --n-ridge2:#09101e;
  --d-ridge3:#2c4a50;   --k-ridge3:#2c2a3c;   --n-ridge3:#060b14;

  /* —— 森林：紅檜、柳杉、蕨類、苔蘚 —— */
  --d-trunk:#8a5038;    --k-trunk:#a05a3a;    --n-trunk:#24161a;
  --d-trunk-hi:#c88a62; --k-trunk-hi:#f0a060; --n-trunk-hi:#3e2a2a;
  --d-trunk-dk:#4a2a24; --n-trunk-dk:#100a0e;
  --d-trunk-far:#5c6a6c;--k-trunk-far:#5a4a54; --n-trunk-far:#0e1420;
  --d-leaf:#2c5a3a;     --k-leaf:#33402c;     --n-leaf:#08120e;
  --d-leaf-hi:#5e8e4a;  --k-leaf-hi:#9a8a46;  --n-leaf-hi:#142418;
  --d-leaf-far:#4a7060; --k-leaf-far:#4a4a50; --n-leaf-far:#0a141a;
  --d-cedar:#1f4232;    --n-cedar:#061008;
  --d-moss:#6a9a3a;     --k-moss:#7a7a36;     --n-moss:#16220e;
  --d-fern:#3e7a36;     --n-fern:#0c1a0c;
  --d-fern-dk:#24502a;  --n-fern-dk:#061008;
  --d-ground:#4e4434;   --n-ground:#120f0e;
  --d-ground-dk:#2e2820;--n-ground-dk:#080706;
  --d-rock:#7a7c78;     --k-rock:#8a6c64;     --n-rock:#1c1e24;
  --d-rock-dk:#4a4e4c;  --n-rock-dk:#0c0e12;

  /* —— 吉野櫻（櫻花季是粉白色，平常是綠葉） —— */
  --d-blossom:#ffd6e2;  --k-blossom:#ffc0b4;  --n-blossom:#5a4054;
  --d-blossom-dk:#f2a6bc;--n-blossom-dk:#3a2838;
  --d-sakura-leaf:#5a8a44;--n-sakura-leaf:#122014;
  --d-branch:#4a3430;   --n-branch:#140e10;

  /* —— 車站與鐵道 —— */
  --d-wood:#b98a5a;     --k-wood:#d08a52;     --n-wood:#3a2a22;
  --d-wood-dk:#6e4a30;  --n-wood-dk:#1e1410;
  --d-plaster:#ece4d2;  --k-plaster:#f2c8a0;  --n-plaster:#4a4648;
  --d-roof:#3c4048;     --k-roof:#42384a;     --n-roof:#101218;
  --d-roof-hi:#6a7480;  --n-roof-hi:#22262e;
  --d-platform:#a49c90; --k-platform:#a88a78; --n-platform:#2a2a30;
  --d-platform-dk:#6e685e;--n-platform-dk:#18181c;
  --d-rail:#8a8c90;     --n-rail:#2a2c32;
  --d-rail-hi:#e8ecf0;  --k-rail-hi:#ffc890;  --n-rail-hi:#5a6070;
  --d-sleeper:#4a3628;  --n-sleeper:#120c0a;
  --d-ballast:#7a746a;  --n-ballast:#1e1c1e;
  --d-sign:#f4efe2;     --n-sign:#5a5850;
  --d-sign-ink:#1e2a3a; --n-sign-ink:#0a0e14;

  /* —— 火車：紅色車身＋米白腰帶、Shay 黑色蒸汽火車頭、檜木車廂 —— */
  --d-car-red:#c4282c;  --k-car-red:#d43a2a;  --n-car-red:#4a1418;
  --d-car-red-hi:#ea5a4a;--k-car-red-hi:#ff8a5a;--n-car-red-hi:#6a2026;
  --d-car-red-dk:#7e161c;--n-car-red-dk:#260a0c;
  --d-car-cream:#f2e8cc;--k-car-cream:#ffd8a8;--n-car-cream:#5a5244;
  --d-car-roof:#4c4e54; --n-car-roof:#16171c;
  --d-glass:#2a3846;    --n-glass:#0a0e14;
  --d-steel:#3a3c42;    --n-steel:#101114;
  --d-shay:#1e1e22;     --n-shay:#08080a;
  --d-shay-hi:#5a5e68;  --k-shay-hi:#a07a5a;  --n-shay-hi:#22242a;
  --d-cypress:#c8945e;  --k-cypress:#e09a5a;  --n-cypress:#3e2a1e;
  --d-cypress-dk:#8a5a34;--n-cypress-dk:#1e140e;

  /* —— 人物（山上冷，大家穿外套、戴毛帽） —— */
  --d-skin-1:#f0c8a8;   --n-skin-1:#5e4c4e;
  --d-skin-2:#d4a07a;   --n-skin-2:#4a3a3a;
  --d-skin-3:#a87452;   --n-skin-3:#2e2224;
  --d-hair:#2a201c;     --n-hair:#0e0c0c;
  --d-c1:#c8463c; --n-c1:#4a2226;   /* 紅 */
  --d-c2:#2f5f8a; --n-c2:#18243a;   /* 藍 */
  --d-c3:#e6d6b0; --n-c3:#4a4640;   /* 米 */
  --d-c4:#4a7a5a; --n-c4:#1c2c24;   /* 綠 */
  --d-c5:#e2a23a; --n-c5:#4a3a1e;   /* 芥末黃 */
  --d-c6:#6a4a8a; --n-c6:#2a1e36;   /* 紫 */
  --d-c7:#f2eee6; --n-c7:#5e5e68;   /* 白 */
  --d-c8:#33343e; --n-c8:#121216;   /* 深灰 */
  --d-uniform:#25344e;  --n-uniform:#0e1420;   /* 站務員制服 */

  /* —— 動物 —— */
  --d-bird:#8a6a4a;     --n-bird:#2a2018;    /* 金翼白眉：褐色身體 */
  --d-bird-wing:#d8a830;--n-bird-wing:#3a2e14;/* 金黃色翼斑 */
  --d-squirrel:#6a5a4e; --n-squirrel:#1e1a18;
  --d-squirrel-belly:#b4583a;--n-squirrel-belly:#2e1812; /* 赤腹 */

  /* —— 不隨日夜變化的顏色（光、煙、燈） —— */
  --sun:#fff6dc; --moon:#f4f0e0; --star:#ffffff;
  --lit:#ffcf7a; --lamp:#ffe2a0; --headlight:#fff4d0; --window-in:#ffd890;
  --steam:#f4f4f2; --smoke:#4a4a4e; --petal:#ffd0de; --firefly:#d8ff7a;
  --rain:#cfdcea; --fog:#dfe6ea; --tea:#c88a3a;
  --grade-cool:#0d5a70; --grade-warm:#ff8838; --cine-shade:#000000; --cine-light:#fff1d6;

  /* —— 頁面介面（電影院般的深色） —— */
  --page-bg:#0f1013; --page-fg:#ece6da; --page-muted:#a49c8e;
  --ui-surface:#1a1b20; --ui-line:#3a3a42; --ui-accent:#d89a4a; --ui-hot:#ffd08a; --ui-hot2:#c4282c;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:6px;overflow:hidden;background:#000;line-height:0;box-shadow:0 18px 50px rgba(0,0,0,.55)}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:6px;padding:10px 14px}
.panel button{font:700 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:4px;padding:9px 14px;cursor:pointer;letter-spacing:.04em}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:#16120c}
.panel button.big{border-color:var(--ui-hot);color:#16120c;background:var(--ui-hot)}
.panel button.big2{border-color:var(--ui-hot2);color:#fff;background:var(--ui-hot2)}
.panel button:disabled{opacity:.45;cursor:default}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid #fff3cc;outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(220px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding:0;list-style:none;color:var(--page-muted);font-size:14px;line-height:1.8;display:flex;flex-wrap:wrap;gap:4px 22px}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .bubble path{fill:rgba(20,20,26,.82);stroke:rgba(255,240,210,.6);stroke-width:1}
#scene .bubble text{fill:#fff4e0;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .screen{mix-blend-mode:screen}
#scene .soft{mix-blend-mode:soft-light}
#scene .signTxt{font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central;letter-spacing:2px}
#scene .signSm{font:600 8px var(--font-ui);text-anchor:middle;dominant-baseline:central;letter-spacing:1px}
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>
<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。
   想恢復完整版，刪掉這整段 <style id="pure-art"> 即可。
   ========================================================= */
html,body{height:100%;margin:0!important;overflow:hidden}
body{display:flex!important;align-items:center;justify-content:center;padding:0!important}
body>.wrap{width:100%!important;max-width:min(100vw,calc(100vh * 8 / 3))!important;
  margin:0!important;padding:0!important;gap:0!important;display:block!important}
body>.wrap>:not(.stage){display:none!important}
body>.wrap>.stage{width:100%!important;max-width:100%!important;margin:0!important;
  border:0!important;border-radius:0!important;box-shadow:none!important}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       這是一個「長景」：整條路線寬 5200，鏡頭（#world）跟著火車左右平移。
       圖層由遠到近，各自用不同速度移動（視差）：
       天空（不動）→ 玉山山脈 → 雲海 → 中景山稜 → 檜木林 → 鐵道層（車站、神木、火車、遊客）→ 前景（模糊的樹幹與蕨類）
       → 鏡頭效果（體積光、霧、雨、櫻花瓣、光暈、調色、暗角、顆粒、寬銀幕黑邊）
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="CGI 電影質感的阿里山森林鐵路：紅色小火車從隧道開出，停靠木造的沼平車站，穿過光束灑落的紅檜巨木林，經過對高岳，最後抵達台灣最高的祝山車站；遠方是玉山山脈和一片雲海">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-top)"/><stop offset=".5" style="stop-color:var(--sky-mid)"/>
        <stop offset=".8" style="stop-color:var(--sky-low)"/><stop offset="1" style="stop-color:var(--haze)"/>
      </linearGradient>
      <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--cloud)"/><stop offset=".55" style="stop-color:var(--cloud)"/><stop offset="1" style="stop-color:var(--cloud-dk)"/>
      </linearGradient>
      <!-- 雲海的一團雲：上緣受光、下緣陰影 -->
      <radialGradient id="seaPuff" cx=".45" cy=".3" r=".75">
        <stop offset="0" style="stop-color:var(--sea)"/><stop offset=".55" style="stop-color:var(--sea-mid)"/><stop offset="1" style="stop-color:var(--sea-sh)"/>
      </radialGradient>
      <linearGradient id="seaBase" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sea-mid)"/><stop offset="1" style="stop-color:var(--sea-sh)"/>
      </linearGradient>

<script id="showstop">

      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();

  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}

    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>

/* =========================================================

function posePerson(P, dt, mv) {

/* ---- 走路的人：每一條「人行道」只有一個方向，同方向的人會保持距離、不會穿過彼此 ---- */
const lanes = [];
function makeLane(parent, x0, x1, dir, yFn, s, n) {
  const Q = { g: el('g', {}, parent), x0, x1, dir, yFn, s, list: [] };
  for (let i = 0; i < n; i++) {
    const x = lerp(x0, x1, (i + srand(.1, .6)) / n);
    const P = person(Q.g, { kind: pick(['hiker', 'hiker', 'photo', 'kid', 'hiker']), s: s * srand(.94, 1.06), dir, x, y: yFn(x) });
    P.v0 = P.v = srand(16, 26); P.walk = 1; P.fade = 1;
    clickable(P.g, '遊客：點一下打招呼');
    Q.list.push(P);
  }
  lanes.push(Q);
  return Q;
}
function stepLane(Q, dt, mv) {
  const order = Q.list.slice().sort((a, b) => (b.x - a.x) * Q.dir);   // 由最前面排到最後面
  order.forEach((P, i) => {
    let v = P.v0;
    if (i > 0) { const A = order[i - 1], gap = (A.x - P.x) * Q.dir; if (gap < 34 * Q.s / .45) v = Math.min(v, A.walk ? A.v * .9 : 0); }
    if (P.wave > 0) v = 0;
    P.v = lerp(P.v, v, Math.min(1, dt * 3));
    P.walk = P.v > 3 ? 1 : 0;
    P.x += Q.dir * P.v * dt * mv;
    P.y = Q.yFn(P.x);
    // 走到盡頭：淡出，從另一頭（確認沒人擋著）再走進來
    const end = Q.dir > 0 ? P.x > Q.x1 : P.x < Q.x0;
    if (end) {
      P.fade -= dt * 2;
      if (P.fade <= 0) {
        const sx = Q.dir > 0 ? Q.x0 : Q.x1, last = order[order.length - 1];
        if (last === P || Math.abs(last.x - sx) > 40) { P.x = sx; P.fade = 0; P.back = 1; }
      }
    } else if (P.fade < 1) P.fade = Math.min(1, P.fade + dt * 2);
    P.g.setAttribute('opacity', f1(clamp(P.fade, 0, 1)));
    posePerson(P, dt, mv);
  });
}

/* ---- 火車 ----
   每一節車廂在自己的座標裡畫：x=0 是車尾、x=len 是車頭方向，y=0 是軌面。

  dusk = Math.max(Math.exp(-Math.pow((h - 6.1) / .7, 2)), Math.exp(-Math.pow((h - 17.8) / .8, 2)));
  for (const k in PAIRS) {
    const P = PAIRS[k];

/* ---- 火車行駛：加速、減速停靠、在終點祝山停好後轉場回到隧道口 ---- */
function resetRun() {
  if (train.kind !== 'diesel') buildTrain('diesel');
  train.x = SEC.tunnel - 40; train.v = 30; train.stop = 0; train.dwell = 0;
}
function stepTrain(dt, mv) {
  const vmax = train.kind === 'steam' ? 52 : 70, acc = 16, dec = 20;
  if (train.dwell > 0) {
    train.dwell -= dt; train.v = 0;
    if (train.dwell <= 0) {
      const S = STOPS[train.stop];
      if (S.end) { train.dwell = 0; startCut(resetRun); }
      else { train.stop++; train.leave = 1.2; if (train.kind === 'steam') sfxSoft('chuff'); }
    }
  } else if (cut.t < 0 || cut.fn === null) {
    const S = STOPS[train.stop], d = S.x - train.x;
    const vt = Math.min(vmax, Math.sqrt(2 * dec * Math.max(0, d)));
    train.v = train.v < vt ? Math.min(vt, train.v + acc * dt) : Math.max(vt, train.v - dec * 1.6 * dt);
    train.x += train.v * dt * (mv || .5);
    if (d < 1 && train.v < 4) { train.x = S.x; train.v = 0; train.dwell = S.dwell; arrive(S); }
  }
  train.dist += train.v * dt;
  placeTrain();
  // 車輪、Shay 的活塞與曲軸
  train.units.forEach(U => {
    U.wheels.forEach(Wh => Wh.n.setAttribute('transform', `rotate(${f1(train.dist / Wh.r * 57.3 % 360)})`));
    if (U.pist) { U.pist.forEach(p => p.n.setAttribute('transform', `translate(0 ${f1(Math.sin(train.dist * .35 + p.ph) * 3)})`)); U.shaft.setAttribute('stroke-dashoffset', f1(-train.dist * 1.4)); }
    U.waves.forEach(a => { if (U.wave > 0) { a.setAttribute('opacity', 1); a.setAttribute('transform', `rotate(${f1(Math.sin(time * 14) * 12)} ${a.getAttribute('d').split(' ')[0].slice(1)} -36)`); } else a.setAttribute('opacity', 0); });
    if (U.wave > 0) U.wave -= dt;
  });
  // 煙與蒸汽
  const H = train.units[0], sx = H.x0 + H.stack[0], sy = trackY(H.x0) + H.stack[1];
  if (train.kind === 'steam') {
    train.chuff += train.v * dt + dt * 6;
    const step = train.v > 2 ? 24 : 40;
    if (train.chuff > step && mv) {
      train.chuff = 0;
      const big = train.v > 2 ? 1 : .6;
      particle(trainFx, sx, sy, 'url(#smokeG)', rand(-14, -4) - train.v * .5, rand(-46, -30), rand(3, 4.5), 6 * big, { grow: 9 * big, op: .75, drift: -4 });
      particle(trainFx, sx + 4, sy - 4, 'url(#steamG)', rand(-10, 0) - train.v * .4, rand(-36, -24), rand(2.4, 3.4), 5 * big, { grow: 8 * big, op: .8, drift: -3 });
      if (train.v > 2) { const cx = H.x0 + 58, cy = trackY(H.x0) - 14; particle(trainFx, cx, cy, 'url(#steamG)', rand(-30, 10), rand(-10, 4), 1.2, 4, { grow: 6, op: .6 }); }
    }

    particle(trainFx, sx, sy, 'url(#smokeG)', -train.v * .3, rand(-30, -18), 1.6, 3, { grow: 6, op: .35 });
  }
  if (train.horn > 0) {   // 鳴笛時冒出的白色蒸汽（只有 Shay）
    train.horn -= dt;
    if (H.whistle && mv && Math.random() < dt * 30) particle(trainFx, H.x0 + H.whistle[0], trackY(H.x0) + H.whistle[1], 'url(#steamG)', rand(-8, 8) - train.v * .4, rand(-60, -40), 1.4, 3, { grow: 8, op: .9 });
  }
}

}

/* =========================================================

   清晨的祝山線列車開進祝山站 → 觀日平台的人舉起手機 → 天空由藍轉橘 →
   太陽從玉山主峰後方探出來、光芒射出、雲海翻騰發亮 → 鏡頭緩緩推近玉山。

const show = { on: false, kind: '', t: 0, auto: false, wasAuto: true, h0: 0 };
let seaChurn = 0;
function startShow(kind, auto) {

  $('wetSheen').setAttribute('opacity', f1(wx.rain * .9));
  $('rain1').setAttribute('transform', `translate(${f1((time * 60) % 70)} ${f1((time * 520) % 120)})`);
  $('rain2').setAttribute('transform', `scale(1.4) translate(${f1((time * 50) % 70)} ${f1((time * 420) % 120)})`);
  $('fogG').setAttribute('opacity', f1(wx.fog * (1 - night * .4)));
  fogBack.setAttribute('opacity', f1(wx.fog * .45 * (1 - night * .5))); fogMid.setAttribute('opacity', f1(wx.fog * .55 * (1 - night * .5)));
  fogs.forEach(F => { F.x += F.v * dt * mv; if (F.x > 1900) F.x = -300; F.n.setAttribute('transform', `translate(${f1(F.x)} ${f1(F.y)})`); });
  twAcc += dt; if (twAcc > .2 && night > .3) { twAcc = 0; const s = $('stars').children; for (let i = 0; i < 6; i++) { const n = s[Math.floor(Math.random() * s.length)]; if (n.tagName === 'circle') n.setAttribute('opacity', f1(rand(.2, 1))); } }
  clouds.forEach(C => {
    C.x += C.v * dt * mv; if (C.x > 1800) C.x = -250;
    C.g.setAttribute('transform', `translate(${f1(C.x)} ${f1(C.y)})`);
    C.g.setAttribute('opacity', f1(.5 + wx.cloud * .5));
    if (C.rain > 0) { C.rain -= dt; if (Math.random() < dt * 30) particle($('fx'), C.x + rand(-60, 60), C.y + 10, 'var(--rain)', 0, 280, .8, 1.3); }
  });
  // 雲海：高度跟著天氣，表演或點擊時翻湧
  if (seaSurge > 0) seaSurge -= dt;
  const surge = Math.max(seaChurn, seaSurge > 0 ? Math.sin(Math.PI * seaSurge / 3) : 0);
  const lvl = 338 - wx.sea * 38 - surge * 10;
  seaRows.forEach(R => {
    R.ph += dt * (.25 + surge * .8) * mv;
    const dx = (time * R.v * mv) % 300, amp = 2 + surge * 9;
    R.g.setAttribute('transform', `translate(${f1(-dx + Math.sin(R.ph) * 10)} ${f1(lvl + R.base + Math.sin(R.ph * 1.3 + R.row) * amp)})`);
    if (surge > .05 && mv) for (let i = R.row; i < R.puffs.length; i += 9) { const P = R.puffs[i]; P.setAttribute('transform', `translate(0 ${f1(Math.sin(time * 1.4 + i) * amp * 1.4)})`); }
  });
  L.sea.firstChild.setAttribute('opacity', f1(.85 + wx.sea * .15));
  valleyMist.forEach(M => { M.x += M.v * dt * mv; if (M.x > 3200) M.x = -300; M.n.setAttribute('transform', `translate(${f1(M.x)} ${f1(M.y - wx.sea * 20)})`); M.n.setAttribute('opacity', f1(.45 + wx.sea * .45)); });
  stepCut(dt);
  stepTrain(dt, mv);
  stepCamera(dt, mv);
  stepLens(dt);
  stepShow(dt, mv);
  // 點巨木：鏡頭推近往上看
  if (cam.pushT > 0 && !show.on) {
    cam.pushT -= dt;
    const k = 1 - cam.pushT / 5;
    const [sx] = toScreen(SEC.shenmu, 0);
    cam.fz = 1.35; cam.fx = clamp(sx, 200, 1400); cam.fy = 140;
    cam.push = ease(smooth(0, .35, k)) * (1 - ease(smooth(.7, 1, k)));
    if (cam.pushT <= 0) cam.push = 0;
  }
  lanes.forEach(Q => stepLane(Q, dt, mv));
  ALLP.forEach(P => { if (P.static) posePerson(P, dt, mv); });
  // 站務員舉旗
  if (zpMaster.flagT > 0) { zpMaster.flagT -= dt; zpMaster.flag.setAttribute('opacity', 1); zpMaster.armF.setAttribute('d', 'M2 -76L8 -88'); zpMaster.flag.setAttribute('transform', `rotate(${f1(Math.sin(time * 8) * 6)} 8 -88)`); }
  else { zpMaster.flag.setAttribute('opacity', 0); posePerson(zpMaster, dt, mv); }
  // 觀日平台的手機螢幕（天暗時發光）
  deckCrowd.forEach(P => P.screen.setAttribute('opacity', f1(smooth(.2, .7, night) * .9)));
  // 茶攤的熱氣
  if (teaPour > 0) teaPour -= dt;
  teaSteam.forEach((s, i) => { s.setAttribute('transform', `translate(0 ${f1(-((time * 8 + i * 6) % 18))})`); s.setAttribute('opacity', f1((.25 + (teaPour > 0 ? .5 : 0)) * (1 - ((time * 8 + i * 6) % 18) / 18) * (1 - wx.rain * .5))); });
  stepBirds(dt, mv);
  stepSquirrel(dt, mv);
  // 櫻花：櫻花季開花，被點時搖晃；季節中隨風飄落花瓣
  cherries.forEach(C => {
    C.bloom.setAttribute('opacity', f1(wx.sakura)); C.leaf.setAttribute('opacity', f1(1 - wx.sakura * .9));
    if (C.shake > 0) { C.shake -= dt; }
    const sh = C.shake > 0 ? Math.sin(time * 30) * 2 * C.shake : Math.sin(time * 1.2 + C.x) * .6 * mv;
    C.g.setAttribute('transform', `rotate(${f1(sh)} ${f1(C.x)} ${f1(C.y + 100)})`);
  });
  const nearSakura = 1 - smooth(1800, 2600, cam.x + 800);
  if (wx.sakura > .5 && mv && Math.random() < dt * 10 * nearSakura) petal(rand(-50, 1500), rand(-20, 300), rand(10, 40), rand(10, 30));
  for (let i = petals.length - 1; i >= 0; i--) {
    const p = petals[i]; p.life -= dt;
    p.vx += Math.sin(time * 1.5 + p.ph) * 12 * dt; p.vy = lerp(p.vy, 38, dt);
    p.x += (p.vx - (train.v > 2 ? 10 : 0)) * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    p.n.setAttribute('transform', `translate(${f1(p.x)} ${f1(p.y)}) rotate(${f1(p.rot)}) scale(1 ${f1(.4 + .6 * Math.abs(Math.sin(time * 3 + p.ph)))})`);
    p.n.setAttribute('opacity', f1(Math.min(1, p.life)));
    if (p.life <= 0 || p.y > 620) { p.n.remove(); petals.splice(i, 1); }
  }
  // 螢火蟲
  const ffOn = smooth(.6, .95, night) * (1 - wx.rain) * (1 - wx.fog * .5);
  ffList.forEach(F => { F.ph += dt * F.v; const x = F.x + Math.sin(F.ph * 1.3) * 30, y = F.y + Math.sin(F.ph * .9) * 16; F.n.setAttribute('cx', f1(x)); F.n.setAttribute('cy', f1(y)); F.n.setAttribute('opacity', f1(ffOn * Math.max(0, Math.sin(time * 2.4 + F.ph * 3)))); });
  // 大冠鷲
  for (let i = eagles.length - 1; i >= 0; i--) {
    const E = eagles[i]; E.t += dt; E.x += 60 * dt; E.y += Math.sin(E.t * .8) * 10 * dt;
    E.g.setAttribute('transform', `translate(${f1(E.x)} ${f1(E.y)}) rotate(${f1(Math.sin(E.t * .8) * 8)})`);
    E.g.setAttribute('opacity', f1(Math.min(1, E.t, (10 - E.t))));
    if (E.t > 10) { E.g.remove(); eagles.splice(i, 1); }
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt;
    if (p.life <= 0) { p.n.remove(); parts.splice(i, 1); continue; }
    p.vy += p.g * dt; p.vx += p.drift * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    const k = p.life / p.max;
    p.n.setAttribute('transform', `translate(${f1(p.x)} ${f1(p.y)})`);
    if (p.grow) p.n.setAttribute('r', f1(p.r + (1 - k) * p.grow * 3));
    p.n.setAttribute('opacity', f1(p.op * Math.min(1, k * 1.6)));
  }
  for (let i = tweens.length - 1; i >= 0; i--) { const tw = tweens[i]; tw.t += dt; const k = Math.min(1, tw.t / tw.dur); tw.fn(k); if (k >= 1) { tweens.splice(i, 1); tw.done && tw.done(); } }
}

/* ---------------- 初始化 ---------------- */
function init() {
  drawSky();
  drawPeaks();
  drawSea();
  drawRidges();
  drawBack();
  L.tb = el('g', {}, L.track); L.tt = el('g', {}, L.track); L.tf = el('g', {}, L.track);
  drawTrack();
  drawTrackBed(L.tb);
  trainG = el('g', {}, L.tt); trainFx = el('g', { class: 'noHit' }, L.tt);
  drawFront();
  drawFore();
  drawFog();
  drawLens();
  // 一開場：火車剛停在沼平站
  buildTrain('diesel');
  train.x = SEC.zp.stop; train.dwell = 5; train.stop = 0;
  cam.x = camTarget();
  bindAll();
  if (reduced) { T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false'); }
  setWeather(0);
  applyColors(true);
  step(1 / 60);
  requestAnimationFrame(loop);
  // 網站「作者精選」播放區（純插畫版放在 iframe 裡）：預設輪播蒸汽火車賞櫻（使用者指定）；不會自己出聲。
  const inPicks = (() => { let top = true; try { top = window.top === window; } catch (e) { top = false; } return !!document.getElementById('pure-art') && !top; })();
  if (inPicks) {
    setTimeout(() => startShow('steam', true), 800);
    setInterval(() => { if (!show.on && cut.t < 0) startShow('steam', true); }, 4000);
    window.sceneMusic = {
      playing: false,
      start(c) {
        if (this.playing) return; this.playing = true; pickAudio = true; userGesture = true;
        if (c && c !== actx) useCtx(c); else ensureAudio();
        if (actx && actx.state !== 'running') actx.resume();
        if (show.on && show.t < 4) playSteam();
      },
      stop() { this.playing = false; pickAudio = false; stopAll(); },
      duck() {}
    };
  }
}
init();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on && show.kind,
  btn: { sunrise: 'btnSunrise', steam: 'btnSteam' },
  save: () => ({ t: T.t, auto: T.auto, w: wxIdx, kind: train.kind, tr: { x: train.x, v: train.v, stop: train.stop, dwell: train.dwell } }),
  stop: () => {
    cut.t = -1; cut.fn = null; $('tunnelDark').setAttribute('opacity', 0);
    cam.push = 0; endShow();
  },
  restore: s => {
    if (wxIdx !== s.w) setWeather(s.w);
    if (train.kind !== s.kind) buildTrain(s.kind);   // 換回原本的火車
    Object.assign(train, s.tr); cam.x = camTarget(); placeTrain();
    T.t = s.t; T.auto = s.auto; $('btnAuto') && $('btnAuto').setAttribute('aria-pressed', String(T.auto)); applyColors(true);
  }
});
/* /ShowStop */
})();
</script>
