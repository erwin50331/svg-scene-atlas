<style>
/* =========================================================
   SC-47 剛果尼拉貢戈火山熔岩湖｜CGI 電影質感
   地點：剛果民主共和國東部、維龍加國家公園裡的尼拉貢戈火山（約 3470 公尺），
         山下就是戈馬市與基伍湖。登山客從 Kibati 登山口走約五、六小時上山，
         在火山口邊緣的小木屋過夜，晚上看全世界最大的熔岩湖之一。
   視角：站在火山口邊緣往西看——
         正前方是直徑約 1.2 公里的火山口，內壁有兩層舊熔岩湖留下的「階地」，
         最底下是翻騰的熔岩湖：黑色的冷卻熔岩殼裂成一塊塊，縫隙透出橘紅色岩漿，
         熔岩殼從湧升處往外漂、在湖邊沉下去，偶爾冒泡、噴濺；
         湖面冒出的二氧化硫煙柱被底下的岩漿照成橘紅色。
         左邊山坡往下是戈馬市的燈火與基伍湖（湖上有掛燈的三體漁船），
         右邊地平線是另一座活火山——尼亞穆拉吉拉火山（寬寬矮矮的盾狀火山）。
   真實元素：火山口邊的登山小木屋（木板牆、鐵皮屋頂）；
            穿迷彩服、戴貝雷帽的維龍加國家公園巡守員；背大背包的挑夫；
            戴頭燈、裹著外套的登山客；之字形登山步道；
            高山上的巨型千里光（粗樹幹、頂端蓮座葉）與巨型半邊蓮（毛茸茸的高柱）；
            白頸渡鴉（頸後一塊白斑）；階地上冒著硫磺蒸氣的噴氣孔與黃色硫磺沉積；
            山下平原上舊熔岩流留下的黑色痕跡；赤道附近的日出日落時間（約 6:00、18:10）。
   風格重點：CGI 動畫電影的寬銀幕畫面——岩漿是唯一的強光源，
            夜裡照亮火山口內壁、煙柱底部與雲霧；熱空氣、煙、霧分層；
            青橙電影調色、暗角、底片顆粒；滑鼠移動帶動多層視差；
            表演時上下出現寬銀幕黑邊、鏡頭緩緩推近。
   效能：不對大圖層做模糊；發光一律用放射漸層。
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），部分另有 --k-名稱（晨昏）。
   JS 會依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）。
   ========================================================= */
:root{
  color-scheme: dark;

  /* —— 天空、雲 —— */
  --d-sky-top:#2a5fae;  --k-sky-top:#2a2c62;  --n-sky-top:#04040b;
  --d-sky-mid:#77a6da;  --k-sky-mid:#b46878;  --n-sky-mid:#0e0b1a;
  --d-sky-low:#cfdeec;  --k-sky-low:#ffad6a;  --n-sky-low:#2c1416;
  --d-haze:#c6d4e0;     --k-haze:#e6a486;     --n-haze:#2a1618;
  --d-cloud:#ffffff;    --k-cloud:#ffc69c;    --n-cloud:#2c2230;
  --d-cloud-dk:#9cadc2; --k-cloud-dk:#7a5270;  --n-cloud-dk:#120e18;
  --d-overcast:#8c96a2; --k-overcast:#6c5862;  --n-overcast:#0e0b10;

  /* —— 遠景：基伍湖、湖對岸山丘、戈馬平原、尼亞穆拉吉拉火山 —— */
  --d-far-hill:#8296ac; --k-far-hill:#8a6a86;  --n-far-hill:#120f1a;
  --d-kivu:#86aac8;     --k-kivu:#dc9c88;      --n-kivu:#0e1322;
  --d-plain:#72895a;    --k-plain:#6a5048;     --n-plain:#0b090c;
  --d-plain-dk:#506642; --k-plain-dk:#4a3836;  --n-plain-dk:#060507;
  --d-oldflow:#3c3838;  --n-oldflow:#040304;
  --d-nyam:#66707e;     --k-nyam:#5c465a;      --n-nyam:#0c0a10;
  --d-nyam-dk:#4a5462;  --k-nyam-dk:#3e3040;   --n-nyam-dk:#060509;

  /* —— 火山本體：外坡、火山口邊緣、登山步道、植物 —— */
  --d-rim:#5c5552;      --k-rim:#5a403c;       --n-rim:#120b0a;
  --d-rim-dk:#3a3533;   --k-rim-dk:#32242a;    --n-rim-dk:#070404;
  --d-rim-hi:#8c8279;   --k-rim-hi:#a86e56;    --n-rim-hi:#241311;
  --d-scrub:#6c7848;    --k-scrub:#5c5036;     --n-scrub:#0b0b07;
  --d-trail:#9a8a76;    --k-trail:#9a6e58;     --n-trail:#1c1410;
  --d-senecio:#6c7c4a;  --k-senecio:#5e5a3a;   --n-senecio:#0d0f09;
  --d-senecio-dk:#3e4a2c;--n-senecio-dk:#060704;
  --d-skirt:#8a7650;    --k-skirt:#8a6448;     --n-skirt:#1c140c;
  --d-lobelia:#86986a;  --k-lobelia:#7a7458;   --n-lobelia:#10130c;

  /* —— 火山口內壁、階地、硫磺 —— */
  --d-wall-hi:#8a7c72;  --k-wall-hi:#9c6a56;   --n-wall-hi:#1c0b08;
  --d-wall:#5e544e;     --k-wall:#58403a;      --n-wall:#110706;
  --d-wall-dk:#332c29;  --k-wall-dk:#2c1e1e;   --n-wall-dk:#040202;
  --d-strata:#a8806a;   --k-strata:#b0705a;    --n-strata:#3e170c;
  --d-bench:#7a726b;    --k-bench:#6e5450;     --n-bench:#1a0b0a;
  --d-bench-dk:#4a4440; --k-bench-dk:#3e2c2c;  --n-bench-dk:#0c0606;
  --d-sulfur:#d8c46a;   --k-sulfur:#d8a85a;    --n-sulfur:#3a2a10;

  /* —— 熔岩湖：冷卻的熔岩殼（白天銀灰、夜裡全黑）與縫隙 —— */
  --d-crust:#4a4644;    --k-crust:#3a302e;     --n-crust:#100807;
  --d-crust-hi:#8e8884; --k-crust-hi:#7c5a50;  --n-crust-hi:#2c1008;
  --d-seam:#ff8a2a;     --n-seam:#ffb444;

  /* —— 煙柱（二氧化硫與水蒸氣） —— */
  --d-plume:#f2f0ec;    --k-plume:#f0c8b0;     --n-plume:#2c2224;
  --d-plume-dk:#b4b0ac; --k-plume-dk:#9a7a80;  --n-plume-dk:#1e1517;

  /* —— 前景：火山口邊緣的岩石、登山小木屋 —— */
  --d-fore:#4a4442;     --k-fore:#45322e;      --n-fore:#0c0807;
  --d-fore-hi:#7a726b;  --k-fore-hi:#9a6650;   --n-fore-hi:#2c1610;
  --d-fore-dk:#2a2624;  --k-fore-dk:#231816;   --n-fore-dk:#040303;
  --d-lichen:#a4a070;   --k-lichen:#a08a5e;    --n-lichen:#1a180e;
  --d-hut-wood:#8c5c38; --k-hut-wood:#8c4c30;  --n-hut-wood:#1c0e08;
  --d-hut-wood-dk:#5e3a22;--k-hut-wood-dk:#5a2e1e;--n-hut-wood-dk:#0e0604;
  --d-hut-roof:#5e7c6a; --k-hut-roof:#5c5a58;  --n-hut-roof:#10140f;
  --d-hut-roof-hi:#a2bcac;--k-hut-roof-hi:#c49272;--n-hut-roof-hi:#2c1c16;

  /* —— 人物：巡守員、挑夫、登山客 —— */
  --d-skin:#7a4a30;     --k-skin:#8a4a2e;      --n-skin:#2a1610;
  --d-skin2:#e6bc9c;    --k-skin2:#f0a67e;     --n-skin2:#4a2a22;
  --d-camo:#56603a;     --k-camo:#5a5034;      --n-camo:#0f110a;
  --d-camo2:#323c24;    --n-camo2:#070805;
  --d-beret:#2e4a2a;    --n-beret:#0a0f08;
  --d-jacket1:#e0482c;  --k-jacket1:#f05a30;   --n-jacket1:#4c1a10;

  --d-porter:#86704c;   --k-porter:#8a6244;    --n-porter:#16110b;

  /* —— 動物：白頸渡鴉 —— */
  --d-raven:#141416;    --n-raven:#040405;
  --d-raven-w:#f0f0ee;  --k-raven-w:#ffd8c0;   --n-raven-w:#3a2e2c;

  /* —— 不隨日夜變化的顏色（岩漿、燈光） —— */
  --lava-core:#fff2a8; --lava:#ff8a1e; --lava-edge:#c8280a; --lava-dark:#4a0a04;
  --plume-hot:#ff7428; --glow:#ff6a1c;
  --sun:#fff4dc; --moon:#f2efe2; --star:#ffffff;
  --lamp:#ffd890; --window-in:#ffcf7a; --headlamp:#f2f6ff;
  --city:#ffc06a; --city2:#fff0c8; --lantern:#ffb44a;
  --bolt:#eef0ff; --rain:#c8d4e6;
  --grade-cool:#163a5c; --grade-warm:#ff6a2a; --cine-shade:#000000; --cine-light:#fff1d6;

  /* —— 頁面介面（電影院般的深色） —— */
  --page-bg:#0e0c0c; --page-fg:#f0ebe6; --page-muted:#a89c94;
  --ui-surface:#1a1514; --ui-line:#3c322e; --ui-accent:#ff9a4a; --ui-hot:#ffcf6a; --ui-hot2:#e2502a;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:6px;overflow:hidden;background:#000;line-height:0;box-shadow:0 18px 50px rgba(0,0,0,.55)}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:6px;padding:10px 14px}
.panel button{font:700 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:4px;padding:9px 14px;cursor:pointer;letter-spacing:.04em}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:#1a0c04}
.panel button.big{border-color:var(--ui-hot2);color:#fff;background:var(--ui-hot2)}
.panel button.big2{border-color:var(--ui-hot);color:#1a1206;background:var(--ui-hot)}
.panel button:disabled{opacity:.45;cursor:default}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid #ffe4c8;outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(220px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding:0;list-style:none;color:var(--page-muted);font-size:14px;line-height:1.8;display:flex;flex-wrap:wrap;gap:4px 22px}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .bubble path{fill:rgba(20,12,10,.84);stroke:rgba(255,200,160,.55);stroke-width:1}
#scene .bubble text{fill:#fff4ea;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .screen{mix-blend-mode:screen}
#scene .soft{mix-blend-mode:soft-light}
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>
<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。
   想恢復完整版，刪掉這整段 <style id="pure-art"> 即可。
   ========================================================= */
html,body{height:100%;margin:0!important;overflow:hidden}
body{display:flex!important;align-items:center;justify-content:center;padding:0!important}

  border:0!important;border-radius:0!important;box-shadow:none!important}

<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 舞台。圖層由遠到近：
       天空（星空、銀河、月亮、太陽、雲）→ 遠景（基伍湖、戈馬燈火、尼亞穆拉吉拉火山）
       → 火山本體（外坡、登山步道、巨型千里光）→ 火山口（內壁、兩層階地、熔岩湖、噴氣孔）
       → 岩漿照亮的光暈 → 煙柱 → 前景（火山口邊的小木屋、巡守員、挑夫、登山客）
       → 天氣（雲霧、雨、閃電）→ 鏡頭效果（調色、暗角、顆粒、寬銀幕黑邊）
       大部分的物件由下方 JS 產生，這裡只放骨架與漸層。
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" role="img" aria-label="剛果尼拉貢戈火山：從火山口邊緣俯看翻騰的熔岩湖，左下方是戈馬市與基伍湖">
    <defs>
      <!-- 天空 -->
      <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-top)"/><stop offset=".6" style="stop-color:var(--sky-mid)"/><stop offset="1" style="stop-color:var(--sky-low)"/>
      </linearGradient>
      <radialGradient id="sunGlow"><stop offset="0" stop-color="#fff6e0" stop-opacity=".95"/><stop offset=".12" stop-color="#ffe0a8" stop-opacity=".6"/><stop offset=".4" stop-color="#ffb878" stop-opacity=".18"/><stop offset="1" stop-color="#ffb878" stop-opacity="0"/></radialGradient>
      <radialGradient id="moonGlow"><stop offset="0" stop-color="#f0ecff" stop-opacity=".45"/><stop offset="1" stop-color="#f0ecff" stop-opacity="0"/></radialGradient>

<script id="showstop">
/* =========================================================

       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾

           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，

    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop

  const btns = [];

    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);

    const k = isOn(), act = btnFor(k);

            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }

            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);

      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();

      playing: false,
      start(c) {
        if (this.playing) return; this.playing = true; pickAudio = true; userGesture = true;
        if (c && c !== actx) useCtx(c); else ensureAudio();
        if (actx && actx.state !== 'running') actx.resume();
        if (show.on && show.t < 4) playLavaMusic();
      },
      stop() { this.playing = false; pickAudio = false; stopAll(); },
      duck() {}
    };
  }
}
init();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on && show.kind,
  btn: { lava: 'btnLava', night: 'btnNightShow' },
  ff: () => { show.cues = new Proxy({}, { get: () => 1 }); show.t = show.dur - .02; },
  save: () => ({ t: T.t, auto: T.auto, w: wxIdx }),
  stop: () => endShow(),
  restore: s => { if (wxIdx !== s.w) setWeather(s.w); T.t = s.t; T.auto = s.auto; $('btnAuto') && $('btnAuto').setAttribute('aria-pressed', String(T.auto)); applyColors(true); }
});
/* /ShowStop */
})();
</script>
</body>
