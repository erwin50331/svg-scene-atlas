<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>坦尚尼亞草原大遷徙</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-32 坦尚尼亞塞倫蓋蒂草原｜復古旅遊海報風
   地點：坦尚尼亞北部的塞倫蓋蒂國家公園。一望無際的草原、傘形金合歡、
        花崗岩石丘（kopje），北邊有馬拉河，每年牛羚與斑馬大遷徙在這裡渡河。
   動物：大象母子、長頸鹿（馬賽長頸鹿的鋸齒狀斑紋）、非洲水牛與牛椋鳥、
        坐在白蟻丘上的獵豹、趴在金合歡樹枝上的花豹、尾巴豎直跑的疣豬一家、
        牛羚與斑馬、石丘上的蹄兔、紫胸佛法僧、禿鷲。
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   風格重點：老式旅遊海報——大塊平塗色面、天空分成幾道色帶、
            巨大的太陽有一圈圈光環、剪影式的樹與動物、全畫面有印刷顆粒。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），部分另有 --k-名稱（晨昏）。
   JS 會依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）。
   ========================================================= */
:root{
  color-scheme: light;

  /* —— 天空（三道色帶）、太陽、雲 —— */
  --d-sky-top:#6fb4c4;  --k-sky-top:#3e4f8c;  --n-sky-top:#0b1430;
  --d-sky-mid:#a6d4c8;  --k-sky-mid:#e0735a;  --n-sky-mid:#16244a;
  --d-sky-low:#f5e2ae;  --k-sky-low:#f6b24a;  --n-sky-low:#26365e;
  --d-sun:#fff3cc;      --k-sun:#f47c34;      --n-sun:#f47c34;
  --d-cloud:#fbf3e0;    --k-cloud:#f6c4a0;    --n-cloud:#2c3a62;
  --d-overcast:#8e989a; --k-overcast:#8a7280; --n-overcast:#141c30;

  /* —— 遠景：藍色遠丘、花崗岩石丘、遠方平原 —— */
  --d-hill:#9cb6ae;     --k-hill:#9a6f8a;     --n-hill:#1c2846;
  --d-kopje:#bb9d74;    --k-kopje:#b8806a;    --n-kopje:#2a2b40;
  --d-kopje-dk:#8a6d4e; --n-kopje-dk:#1c1c2e;
  --d-kopje-hi:#dcc296; --n-kopje-hi:#3a3b54;
  --d-plain-far:#dcbc7c;--k-plain-far:#d08e5c; --n-plain-far:#262c48;

  /* —— 中景草原、河流與河岸 —— */
  --d-grass:#d9a84c;    --k-grass:#cf8646;    --n-grass:#222a3e;
  --d-grass-dk:#b8873a; --n-grass-dk:#1a2032;
  --d-grass-hi:#ecd07a; --n-grass-hi:#2e364c;
  --d-river:#5b9eaa;    --k-river:#c27a74;    --n-river:#17294a;
  --d-river-hi:#c4e6e0; --k-river-hi:#ffd2a0; --n-river-hi:#4a6690;
  --d-bank:#a8743c;     --n-bank:#262232;
  --d-bank-dk:#7a5228;  --n-bank-dk:#1a1622;

  /* —— 前景草地與土路 —— */
  --d-fore:#a27e30;     --k-fore:#9a6430;     --n-fore:#151a2a;
  --d-fore-dk:#6e561f;  --n-fore-dk:#0e111e;
  --d-track:#c9a066;    --n-track:#232434;

  /* —— 樹 —— */
  --d-acacia:#56702e;   --k-acacia:#4e5a2c;   --n-acacia:#10181c;
  --d-acacia-dk:#3a4e1f;--n-acacia-dk:#0a1014;
  --d-trunk:#5a4028;    --n-trunk:#14111a;
  --d-mound:#b0683a;    --n-mound:#2a2026;

  /* —— 動物 —— */
  --d-ele:#8b8885;      --n-ele:#2c2e3e;      /* 大象 */
  --d-ele-dk:#6b6866;   --n-ele-dk:#20222e;
  --d-gir:#e8b45a;      --n-gir:#4a3e3a;      /* 長頸鹿 */
  --d-gir-sp:#8a4822;   --n-gir-sp:#2a1e1e;
  --d-buf:#2f2927;      --n-buf:#0e0d12;      /* 非洲水牛 */
  --d-wb:#6b6a72;       --n-wb:#24242e;       /* 牛羚 */
  --d-wb-dk:#2e2c32;    --n-wb-dk:#121216;
  --d-zw:#f6f0e2;       --n-zw:#666a80;       /* 斑馬白 */
  --d-zb:#1e1c20;       --n-zb:#0c0c10;       /* 斑馬黑 */
  --d-chee:#e4b462;     --n-chee:#4a3e34;     /* 獵豹 */
  --d-leo:#d99f4c;      --n-leo:#463a30;      /* 花豹 */
  --d-spot:#2a1e16;     --n-spot:#120e0c;
  --d-wart:#8a7262;     --n-wart:#2c2628;     /* 疣豬 */
  --d-wart-dk:#5a463a;  --n-wart-dk:#1c1818;
  --d-hyrax:#8a6a4a;    --n-hyrax:#2a2420;    /* 蹄兔 */
  --d-ivory:#f4ecd6;    --n-ivory:#6a6a7a;

  /* —— 遊獵吉普車、熱氣球 —— */
  --d-jeep:#7f7c4a;     --n-jeep:#2a2c2a;
  --d-jeep-dk:#56552f;  --n-jeep-dk:#1a1c1a;
  --d-canvas:#dccb94;   --n-canvas:#4a4a50;
  --d-tyre:#2a2624;     --n-tyre:#0e0c10;
  --d-skin-1:#f2c8a0;   --n-skin-1:#6a5a60;
  --d-skin-2:#a8714a;   --n-skin-2:#4a3a3a;
  --d-hat:#c8b07a;      --n-hat:#4a4640;
  --d-shirt-1:#5f8a6a;  --n-shirt-1:#283a34;
  --d-shirt-2:#e0d6c0;  --n-shirt-2:#5a5a66;
  --d-dust:#e8c890;     --n-dust:#4a4a5a;

  /* —— 不隨日夜變化的顏色 —— */
  --moon:#f8f0d0; --star:#fff6d8; --milky:#c8d0ff;
  --balloon-1:#e2483a; --balloon-2:#f4c43a; --balloon-3:#2f7fb0; --basket:#8a5a30; --flame:#ffb03a;
  --roller-head:#7ab04a; --roller-breast:#b47ad2; --roller-wing:#2aa8c8; --roller-wing2:#1a5aa8;
  --oxpecker:#7a5a3a; --beak:#e2382a;
  --rain:#d4e4f0; --flash:#f6f6ff; --bolt:#fff8d0;
  --flashbulb:#ffffff;

  /* —— 頁面介面 —— */
  --page-bg:#f3e8cf; --page-fg:#3a2a1a; --page-muted:#7a6650;
  --ui-surface:#fbf4e2; --ui-line:#d8c49a; --ui-accent:#c8642a; --ui-hot:#2f6f7a; --ui-hot2:#b8452a;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border:6px solid var(--ui-surface);outline:2px solid var(--page-fg);border-radius:4px;overflow:hidden;background:#26365e;line-height:0}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ui-surface);
  border:2px solid var(--page-fg);border-radius:4px;padding:10px 14px}
.panel button{font:700 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:2px solid var(--ui-line);
  border-radius:3px;padding:9px 14px;cursor:pointer;letter-spacing:.04em}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:#fff}
.panel button.big{border-color:var(--ui-hot);color:#fff;background:var(--ui-hot)}
.panel button.big2{border-color:var(--ui-hot2);color:#fff;background:var(--ui-hot2)}
.panel button.on{background:#f2b23a!important;border-color:#f2b23a!important;color:var(--page-fg)!important}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid #fff3cc;outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(220px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding:0;list-style:none;color:var(--page-muted);font-size:14px;line-height:1.8;display:flex;flex-wrap:wrap;gap:4px 22px}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .bubble path{fill:#fff8e8;stroke:#3a2a1a;stroke-width:1.5}
#scene .bubble text{fill:#3a2a1a;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
</style>
<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。
   想恢復完整版，刪掉這整段 <style id="pure-art"> 即可。
   ========================================================= */
html,body{height:100%;margin:0!important;overflow:hidden}
body{display:flex!important;align-items:center;justify-content:center;padding:0!important}
body>.wrap{width:100%!important;max-width:min(100vw,calc(100vh * 8 / 3))!important;
  margin:0!important;padding:0!important;gap:0!important;display:block!important}
body>.wrap>:not(.stage){display:none!important}
body>.wrap>.stage{width:100%!important;max-width:100%!important;margin:0!important;
  border:0!important;border-radius:0!important;box-shadow:none!important}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：天空色帶 → 銀河、星星 → 太陽光環、月亮 → 雲 → 禿鷲 → 熱氣球
       → 藍色遠丘 → 花崗岩石丘與蹄兔 → 遠方平原與遷徙隊伍 → 對岸吃草的牛羚斑馬
       → 馬拉河 → 渡河的獸群 → 中景草原（金合歡、長頸鹿、花豹、水牛、獵豹、大象）
       → 疣豬 → 前景草叢與土路 → 遊獵吉普車 → 天氣 → 印刷顆粒
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="復古旅遊海報風格的坦尚尼亞塞倫蓋蒂草原：巨大的太陽掛在分成幾道色帶的天空，遠方有花崗岩石丘和一長列遷徙的牛羚；中間的馬拉河邊，大象母子在喝水，對岸有牛羚和斑馬在吃草；右邊傘形金合歡樹下有長頸鹿在吃葉子、非洲水牛在休息，樹枝上趴著一隻花豹，白蟻丘上坐著獵豹；前景一家疣豬豎著尾巴跑過，土路上有一輛遊獵吉普車">
    <defs>
      <!-- 海報式天空：三道硬邊色帶 -->
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-top)"/><stop offset=".36" style="stop-color:var(--sky-top)"/>
        <stop offset=".36" style="stop-color:var(--sky-mid)"/><stop offset=".68" style="stop-color:var(--sky-mid)"/>
        <stop offset=".68" style="stop-color:var(--sky-low)"/><stop offset="1" style="stop-color:var(--sky-low)"/>
      </linearGradient>
      <radialGradient id="milkyGrad"><stop offset="0" stop-color="#c8d0ff" stop-opacity=".35"/><stop offset="1" stop-color="#c8d0ff" stop-opacity="0"/></radialGradient>
      <radialGradient id="dustGrad"><stop offset="0" style="stop-color:var(--dust)" stop-opacity=".7"/><stop offset="1" style="stop-color:var(--dust)" stop-opacity="0"/></radialGradient>
      <radialGradient id="headGlow"><stop offset="0" stop-color="#fff4c0" stop-opacity=".8"/><stop offset="1" stop-color="#fff4c0" stop-opacity="0"/></radialGradient>
      <!-- 印刷顆粒 -->
      <filter id="grainF" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="11" result="n"/>
        <feColorMatrix in="n" type="matrix" values="0 0 0 0 .2  0 0 0 0 .14  0 0 0 0 .08  0 0 0 -2.2 1.25"/>
      </filter>
      <pattern id="rainPat" width="80" height="110" patternUnits="userSpaceOnUse">
        <g stroke="var(--rain)" stroke-width="1.8" stroke-linecap="round" opacity=".8">
          <path d="M10 6l-5 20M50 30l-5 20M74 66l-5 20M28 80l-5 20M62 2l-5 20M18 46l-5 20"/>
        </g>
      </pattern>
      <!-- 斑馬條紋的裁切形狀（斑馬自己的座標） -->
      <clipPath id="zbClip"><path d="M-24 -24C-26 -38 -14 -42 4 -42C14 -42 18 -40 20 -38L30 -56L36 -58L46 -42L42 -38L32 -48L24 -28C20 -20 -18 -18 -24 -24Z"/></clipPath>
    </defs>

    <rect id="skyHit" class="clickable" x="-50" y="-50" width="1700" height="700" fill="url(#skyGrad)"/>
    <g id="nightSky" class="noHit"></g>
    <g id="sunG" class="clickable" tabindex="0" role="button" aria-label="太陽：點一下換成夜晚"></g>
    <g id="moonG" class="clickable" tabindex="0" role="button" aria-label="月亮：點一下換成白天"></g>
    <g id="clouds"></g>
    <rect id="overcastSky" class="noHit" x="-50" y="-50" width="1700" height="400" style="fill:var(--overcast)" opacity="0"/>
    <g id="boltG" class="noHit"></g>
    <g id="vultures" class="noHit"></g>
    <g id="balloonG"></g>
    <g id="far"></g>
    <g id="migr"></g>
    <g id="farHerd"></g>
    <g id="river"></g>
    <g id="cross"></g>
    <g id="mid"></g>
    <g id="warts"></g>
    <g id="fore"></g>
    <g id="jeepG"></g>
    <g id="air"></g>
    <rect id="hazeVeil" class="noHit" x="0" y="0" width="1600" height="600" style="fill:var(--dust)" opacity="0"/>
    <rect id="wxVeil" class="noHit" x="0" y="0" width="1600" height="600" fill="#3e4658" opacity="0"/>
    <g id="rainG" class="noHit" opacity="0">
      <rect id="rain1" x="-100" y="-220" width="1800" height="900" fill="url(#rainPat)"/>
      <rect id="rain2" x="-100" y="-220" width="1800" height="900" fill="url(#rainPat)" transform="scale(1.35)" opacity=".45"/>
    </g>
    <g id="fx" class="noHit"></g>
    <rect id="flash" class="noHit" x="0" y="0" width="1600" height="600" fill="var(--flash)" opacity="0"/>
    <rect id="grain" class="noHit" x="0" y="0" width="1600" height="600" filter="url(#grainF)" opacity=".22"/>
    <g id="say" class="noHit"></g>
  </svg>
  </figure>

  <!-- =====================================================
       【互動】控制列（畫面中物件自己可以點的動作，這裡不再重複做按鈕）
       ===================================================== -->
  <div class="panel">
    <button id="btnShow" class="big" type="button">🐃 大遷徙渡河</button>
    <button id="btnBalloon" class="big2" type="button">🎈 熱氣球升空</button>
    <button id="btnWeather" type="button">天氣：晴</button>
    <button id="btnSound" type="button" aria-pressed="true">🔊 聲音：開</button>
    <button id="btnDay" type="button">☀ 白天</button>
    <button id="btnDusk" type="button">🌅 草原夕陽</button>
    <button id="btnNight" type="button">☾ 夜晚</button>
    <button id="btnAuto" type="button" aria-pressed="true">自動播放</button>
    <label class="timebox" for="timeRange">
      <span>時間</span>
      <input id="timeRange" type="range" min="0" max="1000" value="400">
      <span class="clock" id="clock">09:36</span>
    </label>
  </div>
  <ul class="hint">
    <li>🐃 渡河：牛羚和斑馬成群衝過馬拉河</li>
    <li>🎈 熱氣球從草原上空慢慢飄過</li>
    <li>🖐️ 每種動物、吉普車、河、石丘都能點</li>
    <li>🌦️ 天氣可切晴、多雲、雷陣雨、乾季沙塵</li>
    <li>🔇 聲音點了才響，可一鍵關閉</li>
  </ul>
</main>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);
      }
      return _conn.call(this, dest, ...a);
    };
  }
  function stopAudio() {
    let longs = [], ctx = null;
    for (const s of srcs) {

      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消

        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 1.1); g.gain.setValueAtTime(0, now + 1.2);
        g.gain.linearRampToValueAtTime(1, now + 1.9);

    }
    srcs.clear();
  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');
    // 凍結色票：把目前的 CSS 變數抄到殘影上，底下換色不影響殘影

    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }
      }
    }

    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });

  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {

        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';

  }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>
/* =========================================================
   SC-32 坦尚尼亞塞倫蓋蒂草原｜程式區
   區塊：①工具與色票
         ②場景（天空、石丘、平原、馬拉河、金合歡、白蟻丘、前景草叢）
         ③角色（大象、長頸鹿、水牛、牛羚、斑馬、獵豹、花豹、疣豬、蹄兔、鳥、吉普車、熱氣球）
         ④動畫（主迴圈、日夜、天氣、大遷徙渡河秀）
         ⑤互動（點擊、滑鼠、聲音、控制列）
   ========================================================= */
(() => {
'use strict';

/* ---------------- ① 工具 ---------------- */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const root = document.documentElement;
const svg = $('scene');
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
let seed = 20261132;        // 固定亂數：每次開啟構圖都一樣
const srand = (a = 0, b = 1) => { seed = (seed * 16807) % 2147483647; return a + (seed / 2147483647) * (b - a); };
const f1 = n => (+n).toFixed(1);
function el(tag, attrs = {}, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function cr(pts, closed) {
  const n = pts.length; if (n < 2) return '';
  let d = `M${f1(pts[0][0])} ${f1(pts[0][1])}`;
  const g = i => closed ? pts[(i + n) % n] : pts[clamp(i, 0, n - 1)];
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    const p0 = g(i - 1), p1 = g(i), p2 = g(i + 1), p3 = g(i + 2);
    d += `C${f1(p1[0] + (p2[0] - p0[0]) / 6)} ${f1(p1[1] + (p2[1] - p0[1]) / 6)} ${f1(p2[0] - (p3[0] - p1[0]) / 6)} ${f1(p2[1] - (p3[1] - p1[1]) / 6)} ${f1(p2[0])} ${f1(p2[1])}`;
  }

}
function clickable(g, label) { g.setAttribute('class', 'clickable'); g.setAttribute('tabindex', 0); g.setAttribute('role', 'button'); g.setAttribute('aria-label', label); return g; }

/* ---------------- ① 色票：讀取、配對、日夜內插 ---------------- */
const css = n => getComputedStyle(root).getPropertyValue(n).trim();
const hex = h => { h = h.replace('#', ''); const n = parseInt(h.slice(0, 6), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255, 1]; };
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgba = c => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${(c[3] ?? 1).toFixed(3)})`;
const PAIRS = {};
(() => {
  const names = [];
  for (const sheet of document.styleSheets) {
    try { for (const r of sheet.cssRules) if (r.selectorText === ':root') for (const p of r.style) if (p.startsWith('--d-')) names.push(p.slice(4)); } catch (e) {}
  }

    const k2 = css('--k-' + k);
    PAIRS[k] = { d: hex(css('--d-' + k)), n: hex(css('--n-' + k)), k: k2 ? hex(k2) : null };
    cls += `#scene .f-${k}{fill:var(--${k})}#scene .s-${k}{stroke:var(--${k});fill:none}`;
  });

})();

/* =========================================================
   ② 場景
   ========================================================= */
/* ---- 天空：銀河、星星、太陽光環、月亮、雲、禿鷲 ---- */
const clouds = [], vultures = [];
function drawSky() {
  const ns = $('nightSky');
  el('ellipse', { cx: 900, cy: 120, rx: 760, ry: 70, fill: 'url(#milkyGrad)', transform: 'rotate(-14 900 120)' }, ns);
  for (let i = 0; i < 160; i++) {
    const x = srand(0, 1600), band = Math.abs((x - 900) * -.25 + 120 - srand(0, 320)) < 60;
    el('circle', { cx: f1(x), cy: f1(srand(0, 320)), r: f1(srand(.5, band ? 1.4 : 1.9)), fill: 'var(--star)', opacity: f1(srand(.4, 1)) }, ns);
  }
  // 海報式的大太陽：一圈圈半透明光環
  const s = $('sunG');
  [150, 118, 90].forEach((r, i) => el('circle', { r, fill: 'var(--sun)', opacity: [.14, .22, .34][i] }, s));
  el('circle', { r: 62, class: 'f-sun' }, s);
  // 月亮
  const m = $('moonG');
  el('circle', { r: 70, fill: 'var(--moon)', opacity: .1 }, m);
  el('path', { d: 'M8 -30A31 31 0 1 0 8 30A24 24 0 1 1 8 -30Z', fill: 'var(--moon)' }, m);
  // 雲：海報式的扁平長條雲
  [[200, 90, 1], [700, 60, .8], [1150, 110, 1.1], [1500, 70, .9], [1800, 100, 1]].forEach(([x, y, k], i) => {
    const g = clickable(el('g', { 'data-cloud': i }, $('clouds')), '雲：點一下下一陣小雨');
    const inner = el('g', { transform: `scale(${k})` }, g);
    el('path', { d: 'M-90 8C-90 -2 -70 -6 -56 -4C-50 -18 -24 -22 -10 -10C0 -24 34 -22 40 -6C60 -8 80 0 84 8Z', class: 'f-cloud' }, inner);
    el('rect', { x: -110, y: 8, width: 210, height: 6, rx: 3, class: 'f-cloud', opacity: .7 }, inner);
    clouds.push({ g, x, y, sp: 4 + i * .6, rain: 0 });

  // 禿鷲：在高空盤旋

}

/* ---- 遠景：藍色遠丘、花崗岩石丘、遠方平原 ---- */
const hyraxes = [];
function drawFar() {
  const g = $('far');
  el('path', { d: 'M-40 336C120 318 260 312 420 322C600 332 760 304 940 314C1100 322 1240 300 1400 310C1500 316 1580 312 1640 318L1640 360L-40 360Z', class: 'f-hill' }, g);

  K.id = 'kopjeG';
  [[1200, 372, 70, 40], [1290, 360, 80, 56], [1380, 372, 64, 38], [1255, 318, 46, 34], [1330, 300, 50, 40], [1300, 262, 34, 28], [1420, 352, 40, 30], [1160, 362, 34, 22]].forEach(([x, y, rx, ry], i) => {
    el('ellipse', { cx: x, cy: y, rx, ry, class: i % 3 === 1 ? 'f-kopje-dk' : 'f-kopje' }, K);
    el('path', { d: `M${x - rx * .6} ${y - ry * .5}Q${x} ${y - ry * 1.05} ${x + rx * .5} ${y - ry * .6}`, fill: 'none', class: 's-kopje-hi', 'stroke-width': 4, 'stroke-linecap': 'round', opacity: .8 }, K);
  });

  el('path', { d: 'M1346 262L1350 222M1350 236L1362 226', class: 's-trunk', 'stroke-width': 3 }, K);
  el('ellipse', { cx: 1356, cy: 220, rx: 22, ry: 8, class: 'f-acacia' }, K);
  // 蹄兔（石頭上的小毛球）
  [[1300, 236], [1262, 286], [1395, 336]].forEach(([x, y]) => {
    const h = el('g', { transform: `translate(${x} ${y})` }, K);
    const body = el('g', {}, h);

  });
  // 遠方平原
  el('path', { d: 'M-40 350C300 344 700 352 1000 346C1300 340 1500 348 1640 344L1640 420L-40 420Z', class: 'f-plain-far' }, g);
  // 遠方的金合歡剪影
  [[90, 352, .5], [520, 350, .4], [880, 349, .55], [1520, 346, .45]].forEach(([x, y, k]) => acacia(g, x, y, k, true));

/* ---- 傘形金合歡：叉開的樹幹、扁平的樹冠 ---- */
function acacia(parent, x, y, k, far) {
  const g = el('g', { transform: `translate(${x} ${y}) scale(${k})` }, parent);
  el('path', { d: 'M-5 0C-4 -40 -2 -80 -30 -120L-24 -122C2 -90 2 -60 2 -40C10 -70 30 -100 60 -124L64 -118C34 -96 14 -60 6 0Z', class: 'f-trunk' }, g);
  el('path', { d: 'M-130 -124C-120 -146 -60 -156 0 -154C70 -156 130 -146 140 -124C100 -116 -90 -114 -130 -124Z', class: far ? 'f-acacia-dk' : 'f-acacia' }, g);

  }

}

/* ---- 對岸吃草的牛羚與斑馬（遠景小隻，靜態低頭吃草） ---- */
const farGrazers = [];

/* ---- 單向車道：同方向、只跟在前一隻後面，不會穿過 ---- */
function stepLane(Q, dt, mv, amp = 22, gapMin = 30) {
  const sorted = Q.list.filter(w => w.active).sort((a, b) => (b.x - a.x) * Q.dir);
  sorted.forEach((w, i) => {
    let v = Q.sp * mv * (w.fast > 0 ? 2.6 : 1);
    if (w.pause > 0) v = 0;
    const ahead = sorted[i - 1];
    if (ahead) { const gap = (ahead.x - w.x) * Q.dir - (ahead.len + w.len) / 2; if (gap < gapMin) v = Math.min(v, 0); else if (gap < gapMin * 2) v *= (gap - gapMin) / gapMin; }
    w.pause = Math.max(0, w.pause - dt); w.fast = Math.max(0, (w.fast || 0) - dt);
    w.x += v * Q.dir * dt;
    if (v > 0) w.ph += dt * v * .2;
    if ((w.x - Q.x1) * Q.dir > 0) { w.active = false; w.W.g.style.display = 'none'; }
    poseQuad(w.W, w.x, Q.y, Q.dir, w.ph, v > 0 ? amp : 0);
    if (Q.fadeIn) w.W.g.setAttribute('opacity', f1(clamp((w.x - Q.x0) * Q.dir / 40 + .02, 0, 1)));
    if (w.W.tail) w.W.tail.setAttribute('transform', `translate(-20 -18) rotate(${v > 0 ? 0 : -60})`);   // 疣豬：跑的時候尾巴豎直，停下來放下
  });
}
function respawn(Q, allowed, p = .01) {
  if (!allowed) return;
  const idle = Q.list.find(w => !w.active); if (!idle) return;
  const clear = !Q.list.some(w => w.active && Math.abs(w.x - Q.x0) < w.len + idle.len + 30);
  if (clear && Math.random() < p) { idle.active = true; idle.x = Q.x0; idle.W.g.style.display = ''; }
}

  dusk = Math.max(Math.exp(-Math.pow((h - 6.4) / .9, 2)), Math.exp(-Math.pow((h - 18.6) / .9, 2)));
  for (const k in PAIRS) {

/* =========================================================
   ④ 表演：大遷徙渡河（約 20 秒）
   牛羚與斑馬從對岸三條路線衝下河、游過來，上了近岸再往左跑出畫面。
   每條路線的動物一隻跟一隻、保持距離，路線彼此平行，不會穿過彼此。
   ========================================================= */
const show = { on: false, t: 0, dur: 20, spawnT: [0, 0, 0] };
const LANES = [140, 290, 440].map((x0, k) => {
  // 路線：遠方平原 → 對岸 → 河中 → 近岸 → 轉向左邊跑出去
  const pts = [[x0 + 40, 372], [x0, 402], [x0 - 26, 430], [x0 - 50, 458], [x0 - 70, 476 + k * 8], [-160, 480 + k * 8]];
  const seg = []; let L = 0;
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push({ a: pts[i - 1], b: pts[i], s0: L, d }); L += d; }
  return { seg, L, list: [] };
});
function lanePos(lane, s) {
  for (const S of lane.seg) if (s <= S.s0 + S.d) { const t = (s - S.s0) / S.d; return [lerp(S.a[0], S.b[0], t), lerp(S.a[1], S.b[1], t), S.b[0] - S.a[0]]; }
  const S = lane.seg[lane.seg.length - 1]; return [S.b[0], S.b[1], -1];
}
function startShow(auto) {
  if (show.on) return;
  if (!auto) { userGesture = true; ensureAudio(); }
  if (night > .4) setTime(16);
  show.on = true; show.t = 0; show.spawnT = [0, .35, .7]; show.fired = {};
  $('btnShow').classList.add('on');
  if (!auto || pickAudio) playCrossing();
}
function showStep(dt, mv) {
  show.t += dt;
  const t = show.t;
  // 前 12 秒持續從三條路線放出動物
  LANES.forEach((lane, k) => {
    show.spawnT[k] -= dt;
    if (t > 1.2 && t < 12.5 && show.spawnT[k] <= 0) {
      const last = lane.list[lane.list.length - 1];
      if (!last || last.s > 64) {
        const A = Math.random() < .3 ? zebra($('cross'), .55) : wildebeest($('cross'), .55);
        lane.list.push({ A, s: 0, ph: rand(0, 6), wet: false });
      }
      show.spawnT[k] = rand(.55, .8);
    }
  });
  if (t > 1 && t < 13 && Math.random() < dt * 6) dustPuff(rand(60, 560), rand(380, 400), 1, 1.6);   // 對岸揚起塵土
  if (t > 16.5) once('trump', () => { eleMom.trumpet = 2; eleCalf.trumpet = 2; });
  if (jeep.state === 'drive' && jeep.x < 1500 && jeep.x > 900) { jeep.state = 'watch'; jeep.wait = 22 - t; }
  if (t > 3 && t < 15 && Math.random() < dt * 1.2) jeepFlash();
  if (t >= show.dur && LANES.every(l => !l.list.length)) { show.on = false; $('btnShow').classList.remove('on'); }
}
const once = (key, fn) => { if (!show.fired[key]) { show.fired[key] = 1; fn(); } };
function stepCrossing(dt, mv) {
  const all = [];
  LANES.forEach(lane => {
    for (let i = 0; i < lane.list.length; i++) {
      const a = lane.list[i], ahead = lane.list[i - 1];
      let v = 92 * (mv || .5);
      if (ahead && ahead.s - a.s < 58) v = Math.min(v, Math.max(0, (ahead.s - a.s - 46) * 4));   // 保持距離
      const [x, y] = lanePos(lane, a.s);
      const inWater = y > 410 && y < 456;
      if (inWater) v *= .55;
      a.s += v * dt; a.ph += dt * (inWater ? 6 : 14);
      const [nx, ny, dx] = lanePos(lane, a.s);
      const sc = lerp(.42, .72, clamp((ny - 372) / 110, 0, 1));
      a.A.s = sc;
      poseQuad(a.A, nx, ny + (inWater ? 10 : 0), dx >= 0 ? 1 : -1, a.ph, inWater ? 10 : 30);
      a.A.g.setAttribute('opacity', f1(clamp(a.s / 30, 0, 1)));
      if (inWater && Math.random() < dt * 8) splash(nx + rand(-10, 10), ny + 4, 3);
      if (!inWater && ny > 456 && Math.random() < dt * 3) dustPuff(nx + 10, ny, 1, .8);
      all.push(a);
    }
    while (lane.list.length && lane.list[0].s >= lane.L) { lane.list[0].A.g.remove(); lane.list.shift(); }
  });
  // 依照前後（y）排序，近的蓋住遠的
  all.sort((p, q) => p.A.g.transform.baseVal[0].matrix.f - q.A.g.transform.baseVal[0].matrix.f).forEach(a => $('cross').appendChild(a.A.g));
}

/* =========================================================
   ⑤ 互動：聲音（Web Audio 即時合成，不使用任何音檔）
   聲音分兩條軌：音樂軌（渡河配樂）與音效軌（點擊音效）。
   同一條軌一次只播一段：新的開始時舊的淡出，不會疊在一起；
   音樂播放時音效自動轉小聲；按「聲音：關」立刻全部停止。
   畫面不會自己發出聲音，所有聲音都要點了才響（吉普車不會自己按喇叭）。

function useCtx(c) {

    } else if (C.state === 'back') {   // 慢慢走回來
      C.dir = -1; C.x -= 60 * dt * (mv || .5); C.ph += dt * 7; C.y = 488;
      if (C.x <= 1124) { C.state = 'climb'; C.t = 0; }
    } else if (C.state === 'climb') {
      C.y = lerp(488, 438, smooth(0, .5, C.t)); C.x = lerp(1124, 1113, smooth(0, .5, C.t)); C.ph += dt * 7;
      if (C.t > .5) C.state = 'sit';
    }
    C.rlegs.forEach((L, i) => L.lg.setAttribute('transform', `translate(${L.x} ${L.y}) rotate(${f1(Math.sin(C.ph + (i < 2 ? 0 : Math.PI)) * (C.state === 'go' ? 45 : 20))})`));
  }
  C.g.setAttribute('transform', `translate(${f1(C.x)} ${f1(C.y)})`);
  C.inner.setAttribute('transform', `scale(${C.state === 'sit' ? .9 : .9 * C.dir} .9)`);
}
function stepLeopard(dt, mv) {
  const L = leo; L.ph += dt; L.yawn = Math.max(0, L.yawn - dt);
  const y = L.yawn > 0 ? Math.sin(Math.min(1, (2 - L.yawn) / 1.6) * Math.PI) : 0;
  L.mouth.setAttribute('ry', f1(.5 + y * 4));
  L.head.setAttribute('transform', `translate(34 -10) rotate(${f1(-y * 25)})`);
  L.tail.setAttribute('d', `M-40 -6C-50 10 ${f1(-46 + Math.sin(L.ph * 1.2) * 6 * (mv || .3))} 30 ${f1(-40 + Math.sin(L.ph * 1.2 + 1) * 10 * (mv || .3))} 40`);
}
function stepRoller(dt, mv) {
  const R = rollerB;
  if (R.fly > 0) {
    R.fly -= dt; const k = 1 - R.fly / 2.2;
    R.x = R.hx + Math.sin(k * Math.PI * 2) * 90; R.y = R.hy - Math.sin(k * Math.PI) * 80;
    R.inner.setAttribute('transform', `scale(${Math.cos(k * Math.PI * 2) > 0 ? 1 : -1} 1) rotate(${f1(k * 720)})`);   // 招牌的翻滾飛行
    R.wing.setAttribute('transform', `scale(1 ${f1(Math.sin(time * 30) * 1.4)})`);
  } else { R.x = R.hx; R.y = R.hy; R.inner.setAttribute('transform', `scale(-1 1)`); R.wing.setAttribute('transform', ''); }
  R.g.setAttribute('transform', `translate(${f1(R.x)} ${f1(R.y)})`);
}
function stepHyrax(dt, mv) {
  hyraxes.forEach(H => { H.up = Math.max(0, H.up - dt); const k = H.up > 0 ? Math.sin(Math.min(1, H.up / 1.5) * Math.PI) : 0; H.body.setAttribute('transform', `translate(0 ${f1(-k * 10)})`); });
}
function stepJeep(dt, mv) {
  const J = jeep;
  if (J.state === 'gone') { J.t += dt; if (J.t > 12 && night < .4) { J.state = 'drive'; J.x = 1820; J.g.style.display = ''; } return; }
  let v = 0;
  if (J.state === 'drive') {
    v = 50 * (mv || .5);
    if (J.x < 1010 && J.x > 990 && !J.stopped) { J.state = 'watch'; J.wait = 8; J.stopped = true; }
  } else if (J.state === 'watch') {
    J.wait -= dt; if (J.wait <= 0 && !show.on) { J.state = 'drive'; }
    if (Math.random() < dt * .3) jeepFlash();
  }
  J.x += v * J.dir * dt; J.rot += v * dt * 4;
  if (J.x < -260) { J.state = 'gone'; J.t = 0; J.stopped = false; J.g.style.display = 'none'; }
  J.g.setAttribute('transform', `translate(${f1(J.x)} ${f1(J.y + (v > 0 ? Math.sin(time * 18) * .8 : 0))})`);
  J.inner.setAttribute('transform', `scale(${J.dir} 1)`);
  J.wheels.forEach(w => w.setAttribute('transform', `rotate(${f1(J.rot)})`));
  J.beam.setAttribute('opacity', f1(smooth(.5, .9, night) * .8));
  J.flashT = Math.max(0, (J.flashT || 0) - dt); J.flash.setAttribute('opacity', f1(clamp(J.flashT / .18, 0, 1) * .95));
}
function stepBalloon(dt, mv) {
  const B = balloon;
  if (!B.on) return;
  B.t += dt * (mv || .6); B.burn = Math.max(0, B.burn - dt);
  B.x = 1520 - B.t * 60; B.y = 300 - Math.min(170, B.t * 14) + Math.sin(B.t * .6) * 6 - B.lift;
  B.lift = Math.max(0, (B.lift || 0) - dt * 4);
  if (Math.random() < dt * .25) B.burn = .8;
  B.flame.setAttribute('opacity', f1(B.burn > 0 ? .6 + Math.random() * .4 : 0));
  B.g.setAttribute('transform', `translate(${f1(B.x)} ${f1(B.y)})`);
  if (B.x < -120) { B.on = false; B.g.style.display = 'none'; $('btnBalloon').classList.remove('on'); }
}

/* ---------------- ⑤ 互動：綁定 ---------------- */
function bindAll() {
  onAct($('sunG'), () => { sunBump = 16; sfx('boing'); setTime(21); });
  onAct($('moonG'), () => { sfx('boing'); setTime(9.6); });
  $('clouds').querySelectorAll('[data-cloud]').forEach(g => onAct(g, () => { clouds[+g.dataset.cloud].rain = 2.4; sfx('drops'); }));
  $('skyHit').addEventListener('click', e => { userGesture = true; ensureAudio(); const p = svgPoint(e); skyClick(p.x, p.y); });
  onAct($('riverHit'), e => { const p = svgPoint(e); splash(p.x, p.y, 12); sfx('splash'); });
  onAct($('kopjeG'), () => { hyraxes.forEach((H, i) => setTimeout(() => H.up = 1.5, i * 200)); sfx('squeak'); });
  onAct(eleMom.g, () => { eleMom.spray = 2; sfx('spray'); });
  onAct(eleCalf.g, () => { eleCalf.trumpet = 1.4; sfx('trumpet'); });
  giraffes.forEach(G => onAct(G.g, () => { G.eat = 3; sfx('munch'); }));
  buffaloes.forEach(B => onAct(B.g, () => { B.snort = .8; B.fly = 2.4; sfx('snort'); }));
  onAct(chee.g, () => { if (chee.state !== 'sit') return; chee.state = 'go'; chee.t = 0; sfx('chirp'); setTimeout(() => sfx('run'), 300); });
  onAct(leo.g, () => { leo.yawn = 2; sfx('yawn'); });
  onAct(rollerB.g, () => { if (rollerB.fly > 0) return; rollerB.fly = 2.2; sfx('roller'); });
  onAct(jeep.g, () => { jeepFlash(); sfx('shutter'); say(jeep.x, jeep.y - 130, pick(['看！長頸鹿！', '拍到了！', '好多牛羚']), 1.4); });
  onAct(balloon.g, () => { balloon.burn = 1.2; balloon.lift = 20; sfx('burner'); });
  wartQ.list.forEach(w => { clickable(w.W.g, '疣豬：點一下全家豎起尾巴加速跑'); onAct(w.W.g, () => { wartQ.list.forEach(o => o.fast = 2.5); sfx('grunt'); }); });
  migQ.list.forEach(w => { clickable(w.W.g, '遷徙的牛羚與斑馬：點一下叫一聲'); onAct(w.W.g, () => sfx(w.W.kind === 'zb' ? 'zebra' : 'honk')); });
  farGrazers.forEach(A => { clickable(A.g, A.kind === 'zb' ? '斑馬：點一下叫一聲' : '牛羚：點一下叫一聲'); onAct(A.g, () => { sfx(A.kind === 'zb' ? 'zebra' : 'honk'); A.ph += 3; }); });
  svg.addEventListener('pointermove', e => { const p = svgPoint(e); mouse.x = p.x; mouse.y = p.y; mouse.in = true; });
  svg.addEventListener('pointerleave', () => { mouse.in = false; });

  $('btnShow').addEventListener('click', () => startShow());
  $('btnBalloon').addEventListener('click', () => { userGesture = true; ensureAudio(); startBalloon(); });
  $('btnWeather').addEventListener('click', () => { userGesture = true; ensureAudio(); setWeather((wxIdx + 1) % WX.length); if (WX[wxIdx][0] === 'dust') sfx('wind'); });
  $('btnSound').addEventListener('click', () => {
    soundOn = !soundOn; userGesture = true; ensureAudio();
    if (master) master.gain.setValueAtTime(soundOn ? .55 : 0, actx.currentTime);
    if (!soundOn) { stopAll(); rainSound(false); try { window.sceneMusic && window.sceneMusic.stop(); } catch (e) {} } else rainSound(WX[wxIdx][0] === 'storm');
    $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  });
  $('btnDay').addEventListener('click', () => setTime(9.6));
  $('btnDusk').addEventListener('click', () => setTime(18.3));
  $('btnNight').addEventListener('click', () => setTime(22));
  $('btnAuto').addEventListener('click', () => { T.auto = !T.auto; $('btnAuto').setAttribute('aria-pressed', String(T.auto)); });
  const tr = $('timeRange');
  tr.addEventListener('input', () => { T.dragging = true; T.t = tr.value / 1000; applyColors(true); });
  tr.addEventListener('change', () => { T.dragging = false; });
  window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
  window.addEventListener('pointerdown', () => document.body.classList.remove('kbd'));
  mq.addEventListener && mq.addEventListener('change', () => { reduced = mq.matches; });
}

/* ---- 熱氣球升空（按鈕或精選輪播） ---- */
function startBalloon(auto) {
  if (balloon.on) return;
  if (night > .4) setTime(6.6);   // 熱氣球都在清晨日出時升空
  balloon.on = true; balloon.t = 0; balloon.lift = 0; balloon.g.style.display = ''; $('btnBalloon').classList.add('on');
  if (!auto) sfx('burner');
}

/* ---------------- 初始化 ---------------- */
function init() {
  drawSky();
  drawFar();
  drawFarHerd();
  drawRiver();
  drawMid();
  drawAnimals();
  drawFore();
  bindAll();
  if (reduced) { T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false'); }
  jeep.x = 1300;
  setWeather(0);
  applyColors(true);
  step(1 / 60);
  requestAnimationFrame(loop);
  // 網站「作者精選」播放區：草原夕陽，大遷徙渡河與熱氣球自動輪播（不算使用者點擊，不會自己出聲）
  const inPicks = (() => { let top = true; try { top = window.top === window; } catch (e) { top = false; } return !!document.getElementById('pure-art') && !top; })();
  if (inPicks) {
    T.auto = false; T.t = 18.3 / 24; applyColors(true);
    setTimeout(() => startBalloon(true), 500);
    setTimeout(() => startShow(true), 1500);
    setInterval(() => { if (!show.on) startShow(true); if (!balloon.on) startBalloon(true); }, 4000);
    // 不另外放背景配樂：網站的「播放配樂」開關直接控制渡河秀自己的音樂
    window.sceneMusic = {
      playing: false,
      start(c) {
        if (this.playing) return; this.playing = true; pickAudio = true;
        if (c && c !== actx) useCtx(c); else ensureAudio();
        if (actx && actx.state !== 'running') actx.resume();
        if (show.on && show.t < 4) playCrossing();
      },
      stop() { this.playing = false; pickAudio = false; stopAll(); },
      duck() {}
    };
  }
}
init();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on,
  btn: 'btnShow',
  save: () => ({ t: T.t, auto: T.auto }),
  stop: () => {
    // 渡河的動物群直接收走
    LANES.forEach(l => { l.list.forEach(it => it.A.g.remove()); l.list.length = 0; });
    show.on = false; $('btnShow').classList.remove('on');
  },
  restore: s => { T.t = s.t; T.auto = s.auto; $('btnAuto') && $('btnAuto').setAttribute('aria-pressed', String(T.auto)); applyColors(true); }
});
/* /ShowStop */
})();
</script>
