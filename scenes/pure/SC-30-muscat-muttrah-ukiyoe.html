<style>
/* =========================================================
   SC-30 馬斯喀特海灣｜浮世繪色塊
   地點：阿曼首都馬斯喀特的穆特拉（Muttrah）海濱步道。
   畫面（由左到右）：里亞姆公園山頭的白色大香爐紀念碑、岩岬上 16 世紀的穆特拉堡、
        山脊上的圓形瞭望塔、沿著海灣排開的白色房子（拱窗、彩色木百葉、屋頂水塔）、
        藍磚圓頂與宣禮塔的拉瓦提亞清真寺、穆特拉市集的海濱入口、
        右邊是波浪屋頂的魚市場與停泊在港內的傳統木造帆船；
        背後是層層疊疊、岩石嶙峋的哈加爾山脈。
   人物：穿白色長袍（dishdasha）戴繡花小帽（kuma）或纏頭巾（massar）的男子、
        腰配彎刀（khanjar）拄手杖的長者、黑袍彩色頭巾的婦女、小孩、觀光客、扛鮪魚的漁夫；
        路邊有賣阿曼咖啡（kahwa）配椰棗的小販、燒乳香的小販。
   交通：白底橘色的阿曼計程車、休旅車、小貨車；玻璃纖維小漁船、觀光木帆船。
   動物：海鷗、岩礁鷺、鴿子、海豚、貓。
   ---------------------------------------------------------
   風格重點（浮世繪色塊）：普魯士藍天空的漸層暈色（ぼかし）、橫向的霞帶、
        粗墨線輪廓、平塗色塊、山頭上深下淺的漸層、海面一道道波紋與浪花爪、
        燈光倒影畫成直條紋、雨畫成細直斜線、整張疊一層和紙紋理。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），部分另有 --k-名稱（晨昏）。
   JS 會依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）。
   ========================================================= */
:root{
  color-scheme: light;

  /* —— 天空、霞帶、雲、太陽 —— */
  --d-sky-top:#1f4f8f;  --k-sky-top:#3a3c7a;  --n-sky-top:#071131;
  --d-sky-mid:#7db1cf;  --k-sky-mid:#d98a7c;  --n-sky-mid:#152858;
  --d-sky-low:#f3e8ca;  --k-sky-low:#f6c27c;  --n-sky-low:#2a3264;
  --d-kasumi:#f2b59c;   --k-kasumi:#f08a6a;   --n-kasumi:#38336c;   /* 粉紅霞帶 */
  --d-kasumi2:#efd590;  --k-kasumi2:#f4b060;  --n-kasumi2:#2b2e5e;  /* 黃土霞帶 */
  --d-cloud:#fbf4e4;    --k-cloud:#f6c8a8;    --n-cloud:#323c66;
  --d-overcast:#98a0aa; --k-overcast:#8a7a86; --n-overcast:#131a30;
  --d-sun:#e5462c;      --k-sun:#e8542c;      --n-sun:#e8542c;      /* 浮世繪的紅太陽 */

  /* —— 哈加爾山脈（遠、中、近三層，山頂顏色較深） —— */
  --d-mtn-far:#8a9cbc;    --k-mtn-far:#a88aa4;    --n-mtn-far:#1e2850;
  --d-mtn-far-top:#3c5486;--k-mtn-far-top:#5a4a7c;--n-mtn-far-top:#111a3a;
  --d-mtn-mid:#c09a6e;    --k-mtn-mid:#c07a5e;    --n-mtn-mid:#2a2844;
  --d-mtn-mid-top:#76583e;--k-mtn-mid-top:#7a4c40;--n-mtn-mid-top:#1a1a32;
  --d-mtn-near:#94704e;   --k-mtn-near:#946048;   --n-mtn-near:#221f36;
  --d-mtn-near-dk:#5e4632;--n-mtn-near-dk:#161422;
  --d-rock:#b08a60;       --k-rock:#b47658;       --n-rock:#2c2a3e;
  --d-rock-dk:#6e5238;    --n-rock-dk:#1a1826;

  /* —— 建築：白牆、堡壘、木百葉、磁磚 —— */
  --d-wall:#f6f1e4;     --k-wall:#f8d4b2;     --n-wall:#3e4464;
  --d-wall-2:#eee0c2;   --k-wall-2:#f2c49c;   --n-wall-2:#373b5a;
  --d-wall-3:#e2e2dc;   --n-wall-3:#353b58;
  --d-wall-sh:#cdbf9e;  --n-wall-sh:#262a44;
  --d-fort:#dcb47c;     --k-fort:#e8a064;     --n-fort:#a07a56;   /* 夜裡有投射燈，所以夜色偏亮 */
  --d-fort-dk:#a8844f;  --k-fort-dk:#b8744a;  --n-fort-dk:#6c4e3c;
  --d-burner:#f8f4ec;   --k-burner:#fbdcc0;   --n-burner:#e6dcc0; /* 大香爐（夜裡打燈） */
  --d-burner-dk:#c8bfae;--n-burner-dk:#a89c84;
  --d-shutter-1:#2b8a8a;--n-shutter-1:#173444;   /* 青綠百葉 */
  --d-shutter-2:#3462a2;--n-shutter-2:#18284a;   /* 藍百葉 */
  --d-shutter-3:#5f8a3a;--n-shutter-3:#1d2a20;   /* 綠百葉 */
  --d-wood:#8c5a30;     --n-wood:#2c1e22;
  --d-wood-dk:#5a381c;  --n-wood-dk:#1a1218;
  --d-hole:#3a3640;     --n-hole:#11121e;        /* 窗洞、門洞 */
  --d-tile:#1e93b4;     --n-tile:#2a7f98;        /* 清真寺土耳其藍磁磚（夜裡打燈） */
  --d-tile-2:#1c4c98;   --n-tile-2:#1a3c70;
  --d-tile-y:#ebc65a;   --n-tile-y:#a89050;
  --d-tank:#e8ecee;     --n-tank:#3a4060;        /* 屋頂水塔 */
  --d-awn-1:#d2503a;    --n-awn-1:#3e1e24;
  --d-awn-2:#2f7a9a;    --n-awn-2:#16283a;
  --d-glassw:#8cc4d4;   --n-glassw:#ffd88a;      /* 魚市場玻璃（夜裡亮燈） */

  /* —— 道路、步道、欄杆、植物 —— */
  --d-road:#8e8b88;     --k-road:#94807a;     --n-road:#23243a;
  --d-road-line:#f4f1e8;--n-road-line:#4c4e64;
  --d-pave:#e6d4ae;     --k-pave:#ecb88e;     --n-pave:#34324c;
  --d-pave-2:#d0b890;   --n-pave-2:#2a2a42;
  --d-rail:#fbf7ee;     --k-rail:#fcdcc0;     --n-rail:#4e5474;
  --d-palm:#3e7c4a;     --n-palm:#15281e;
  --d-palm-dk:#285a34;  --n-palm-dk:#0e1c16;
  --d-trunk:#8c6a44;    --n-trunk:#2a2228;
  --d-post:#f6f4ee;     --n-post:#565c7c;

  /* —— 海 —— */
  --d-sea-top:#86c6c8;  --k-sea-top:#e6a88c;  --n-sea-top:#1e2e5c;
  --d-sea:#2e82aa;      --k-sea:#5a6aa2;      --n-sea:#131f46;
  --d-sea-deep:#1a4c84; --k-sea-deep:#2c3c78; --n-sea-deep:#0a1232;
  --d-foam:#f8faf4;     --k-foam:#fce6d4;     --n-foam:#7c8cb6;
  --d-wave:#16457a;     --n-wave:#08122e;

  /* —— 船 —— */
  --d-hull-w:#f6f6f0;   --k-hull-w:#f8dcc4;   --n-hull-w:#4a5072;   /* 玻璃纖維船身 */
  --d-hull-b:#2a8ab2;   --n-hull-b:#163452;
  --d-hull-r:#c8402e;   --n-hull-r:#4a1e26;
  --d-teak:#a0663a;     --k-teak:#a85c34;     --n-teak:#302228;     /* 柚木船身 */
  --d-teak-dk:#663f1e;  --n-teak-dk:#1c1418;
  --d-sail:#f4e8ce;     --k-sail:#f8c8a0;     --n-sail:#4c4c64;
  --d-canvas:#e8a03c;   --n-canvas:#42301e;
  --d-engine:#34363e;   --n-engine:#121218;

  /* —— 車 —— */
  --d-car-w:#f6f6f4;    --k-car-w:#f8dcc6;    --n-car-w:#4e5476;
  --d-car-o:#ea862a;    --n-car-o:#5a3420;    /* 阿曼計程車的橘色 */
  --d-car-s:#b8bcc6;    --n-car-s:#383c56;
  --d-car-r:#b83a32;    --n-car-r:#401c22;
  --d-car-k:#4a5a6a;    --n-car-k:#1e2434;
  --d-tyre:#2a2a2e;     --n-tyre:#0c0c12;
  --d-glass:#8ab6cc;    --n-glass:#1a2240;

  /* —— 人物衣著 —— */
  --d-skin:#c8936a;     --n-skin:#4a3a40;
  --d-dish:#fcfcf8;     --k-dish:#fde0c8;     --n-dish:#5c6284;   /* 白色長袍 */
  --d-dish-2:#e6d8b8;   --n-dish-2:#4a4858;
  --d-dish-3:#a2b8cc;   --n-dish-3:#2e3a52;
  --d-abaya:#24222c;    --n-abaya:#0e0e16;
  --d-shayla-1:#c84a6c; --n-shayla-1:#3e1c2a;
  --d-shayla-2:#3a7a9c; --n-shayla-2:#16283a;
  --d-shayla-3:#7a4a9a; --n-shayla-3:#26183a;
  --d-kuma:#f8f2e2;     --n-kuma:#5c5c6e;     /* 繡花小帽 */
  --d-kuma-p:#3a6aa2;   --n-kuma-p:#1c2a40;
  --d-massar:#d08a2c;   --n-massar:#3e2c1c;   /* 頭巾 */
  --d-massar-2:#8a3a6a; --n-massar-2:#2e1626;
  --d-tour-1:#e46a4a;   --n-tour-1:#3e2424;
  --d-tour-2:#4a8a5a;   --n-tour-2:#1c2a22;
  --d-pants:#4a5068;    --n-pants:#1a1c28;
  --d-hat:#f0dca8;      --n-hat:#4a4638;
  --d-hair:#2a2220;     --n-hair:#0e0c10;
  --d-silver:#dcc896;   --n-silver:#5a5240;   /* 彎刀 khanjar 的銀飾 */
  --d-copper:#c8783a;   --n-copper:#4a2e20;
  --d-brass:#dcb04a;    --n-brass:#4e4026;
  --d-date:#6e331a;     --n-date:#261410;
  --d-clay:#c26a40;     --n-clay:#3e2420;     /* 陶土香爐 */
  --d-fish:#8ea8bc;     --n-fish:#2a3446;
  --d-fish-y:#e8c040;   --n-fish-y:#4a3e20;   /* 黃鰭鮪魚的黃鰭 */

  /* —— 動物 —— */
  --d-gull:#f6f6f2;     --k-gull:#fce0cc;     --n-gull:#6a7092;
  --d-gull-w:#6a6e7a;   --n-gull-w:#2a2c3c;
  --d-heron:#56606e;    --n-heron:#1e2230;
  --d-dolphin:#6c7e96;  --n-dolphin:#24293e;
  --d-belly:#d8dee6;    --n-belly:#40465e;
  --d-cat:#d89c5c;      --n-cat:#3a3036;
  --d-pigeon:#8a8e9e;   --n-pigeon:#2a2c3c;

  /* —— 墨線（夜裡變成更深的藍黑） —— */
  --d-line:#2b2622;     --n-line:#080a16;

  /* —— 不隨日夜變化的顏色 —— */
  --moon:#f8f0d0; --star:#fff6d8;
  --lamp:#ffd27a; --window:#ffd88a; --smoke:#f4efe6; --steam:#ffffff;
  --flag-r:#d2202c; --flag-g:#14843e; --flag-w:#ffffff;
  --fw-1:#ff5a4a; --fw-2:#ffd25a; --fw-3:#56e08e; --fw-4:#ffffff; --fw-5:#7ac8ff; --fw-6:#ff8ad0;
  --rain:#2c3a52;

  /* —— 頁面介面 —— */
  --page-bg:#f3ecdc; --page-fg:#2c2420; --page-muted:#76685a;
  --ui-surface:#fbf6ea; --ui-line:#dacbab; --ui-accent:#1f4f8f; --ui-hot:#c8402e; --ui-hot2:#1e7e8e;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:6px;overflow:hidden;background:#152858;line-height:0;box-shadow:0 1px 0 #fff inset,0 6px 22px rgba(40,40,80,.2)}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:6px;padding:10px 14px}
.panel button{font:700 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1.5px solid var(--ui-line);
  border-radius:999px;padding:9px 15px;cursor:pointer;letter-spacing:.03em}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:#fff}
.panel button.big{border-color:var(--ui-hot);color:#fff;background:var(--ui-hot)}
.panel button.big2{border-color:var(--ui-hot2);color:#fff;background:var(--ui-hot2)}
.panel button.on{background:#f2b23a!important;border-color:#f2b23a!important;color:var(--page-fg)!important}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid #fff3cc;outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(220px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding:0;list-style:none;color:var(--page-muted);font-size:14px;line-height:1.8;display:flex;flex-wrap:wrap;gap:4px 22px}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .ln{stroke:var(--line);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
#scene .ln2{stroke:var(--line);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
#scene .lnT{stroke:var(--line);stroke-width:1;stroke-linejoin:round;stroke-linecap:round}
#scene .bubble path{fill:#fffaf0;stroke:#2b2622;stroke-width:1.6}
#scene .bubble text{fill:#2b2622;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
@media (prefers-reduced-motion: reduce){ .panel button{transition:none} }
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>
<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。
   想恢復完整版，刪掉這整段 <style id="pure-art"> 即可。
   ========================================================= */
html,body{height:100%;margin:0!important;overflow:hidden}
body{display:flex!important;align-items:center;justify-content:center;padding:0!important}
body>.wrap{width:100%!important;max-width:min(100vw,calc(100vh * 8 / 3))!important;
  margin:0!important;padding:0!important;gap:0!important;display:block!important}
body>.wrap>:not(.stage){display:none!important}
body>.wrap>.stage{width:100%!important;max-width:100%!important;margin:0!important;
  border:0!important;border-radius:0!important;box-shadow:none!important}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);
      }
      return _conn.call(this, dest, ...a);
    };
  }
  function stopAudio() {
    let longs = [], ctx = null;
    for (const s of srcs) {
      const c = s.context, now = c.currentTime, m = s.__ss; ctx = c;
      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }
    if (longs.length && ctx) {
      const g = outs.get(ctx), now = ctx.currentTime;
      if (g) {
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 1.1); g.gain.setValueAtTime(0, now + 1.2);
        g.gain.linearRampToValueAtTime(1, now + 1.9);
      }
      longs.forEach(s => { try { s.stop(now + 1.15); } catch (e) {} srcs.delete(s); });
    }
    srcs.clear();
  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');
    // 凍結色票：把目前的 CSS 變數抄到殘影上，底下換色不影響殘影
    const cs = getComputedStyle(svg);
    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }
      }
    }
    const par = svg.parentElement;
    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });
    added = [];
  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }

            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);

      });

      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();

    const wy = base - 14 - f * 26;
    for (let c = 0; c < cols; c++) {
      const wx = x + 8 + (c + .5) * ((w - 14) / cols);
      if (f === 0 && opt.door && c === Math.floor(cols / 2)) {
        P(g, archD(wx - 5, wx + 5, base - 20, base), 'f-wood-dk ln');
        continue;
      }
      P(g, archD(wx - 4.5, wx + 4.5, wy - 8, wy + 6), 'f-hole lnT');
      P(g, `M${f1(wx - 7.5)} ${f1(wy - 4)}h3v10h-3zM${f1(wx + 4.5)} ${f1(wy - 4)}h3v10h-3z`, sc + ' lnT');
      if (srand() < .55) addWindow($('townLights'), wx, wy - 1, 8, 13);
    }
  }
  // 木陽台（mashrabiya 式的格子窗）
  if (opt.balcony && floors > 1) {
    const bx = x + w * opt.balcony, by = base - 14 - 26;
    P(g, `M${bx - 13} ${by + 9}V${by - 9}H${bx + 13}V${by + 9}Z`, 'f-wood ln');

    P(g, `M${bx - 15} ${by - 9}H${bx + 15}V${by - 12}H${bx - 15}Z`, 'f-wood-dk lnT');
  }
  // 冷氣機（真實的阿曼街景）
  if (opt.ac) P(g, `M${x + w * opt.ac - 6} ${top + 14}h12v8h-12z`, 'f-wall-3 lnT');
  // 一樓店面遮陽棚
  if (opt.awning) {
    const ax = x + 5, aw = w - 10, ay = base - 22;
    let d = `M${ax} ${ay}H${ax + aw}L${ax + aw + 3} ${ay + 7}`;
    for (let xx = ax + aw; xx > ax - 2; xx -= 7) d += `q-3.5 4 -7 0`;
    P(g, d + 'Z', opt.awning + ' ln');
  }
  return g;
}

function playSail() {
  if (!ok()) return;

  const mel = [

  for (let beat = -2; beat < 32; beat++) {
    const bt = start + beat * B;
    const p = (beat + 8) % 4;
    if (p === 0 || p === 2) doum(bt, .3, dest);
    if (p === 1 || p === 3) { tek(bt, .2, dest); if (beat >= 0) clap(bt, .16, dest); }

const mouse = { x: -999, y: -999, lx: -999, ly: -999, t: 0 };

/* ---------------- ④ 動畫：主迴圈 ---------------- */

  for (let i = parts.length - 1; i >= 0; i--) {

function stepHeron(dt, mv) {

    heron.g.setAttribute('transform', `translate(${heron.x} ${heron.y}) scale(-1 1)`);

function stepDhow(dt, mv) {

  dhow.crew.forEach((R, i) => R.arm.setAttribute('transform', dhow.wave > 0 || (show.on && show.kind === 'sail' && show.t < 6) ? `rotate(${f1(-120 + Math.sin(time * 12 + i) * 25)} 0 -29)` : ''));
}
/* ---- 車：同車道保持車距，車頭朝前；兩端淡入淡出 ---- */
function stepCars(dt, mv) {
  roadLanes.forEach(L => {
    L.list.forEach(C => {
      C.honk = Math.max(0, C.honk - dt);
      let sp = C.base;
      // 前方最近的車
      let gap = 1e9, lead = null;
      L.list.forEach(O => { if (O === C) return; const d = (O.x - C.x) * L.dir; if (d > 0 && d < gap) { gap = d; lead = O; } });
      const minGap = (C.L + (lead ? lead.L : 0)) / 2 * L.k + 26;
      if (lead && gap < minGap + 40) sp = Math.min(sp, lead.sp * (gap < minGap ? .6 : 1));
      C.sp = sp;
      C.x += L.dir * sp * dt * mv;
      const ext = 120;
      if (L.dir > 0 && C.x > 1232 + ext) { C.x = 360 - ext - rand(0, 200); }
      if (L.dir < 0 && C.x < 360 - ext) { C.x = 1232 + ext + rand(0, 200); }
      C.g.setAttribute('transform', `translate(${f1(C.x)} ${L.y}) scale(${f1(L.dir * L.k)} ${L.k})`);
      C.body.setAttribute('transform', `translate(0 ${f1(Math.abs(Math.sin(time * 9 + C.x * .05)) * -.6 * mv)})`);

/* ---- 行人：同一排依前後順序前進，前面的人較慢時後面的人跟著放慢，保持距離 ---- */
function stepLanes(dt, mv) {
  lanes.forEach(L => {
    L.list.forEach(w => {
      let gap = 1e9, lead = null;
      L.list.forEach(O => { if (O === w) return; const d = (O.x - w.x) * L.dir; if (d > 0 && d < gap) { gap = d; lead = O; } });
      let sp = w.base * (1 + wx.rain * .35);
      if (lead && gap < 46) sp = Math.min(sp, lead.sp * (gap < 32 ? .5 : 1));
      if (w.wave > 0) { w.wave -= dt; sp = 0; }
      w.sp = sp;
      w.x += L.dir * sp * dt * mv;
      if (L.dir > 0 && w.x > X1) w.x = X0 - rand(10, 120);
      if (L.dir < 0 && w.x < X0) w.x = X1 + rand(10, 120);

      w.body.setAttribute('transform', `translate(0 ${f1(sp > 0 ? bob : 0)})`);
      w.arm.setAttribute('transform', w.wave > 0 ? `rotate(${f1(-130 + Math.sin(time * 14) * 20)} 0 -29)` : `rotate(${f1(s * 16 * (sp > 0 ? 1 : 0))} 0 -29)`);

      w.g.setAttribute('transform', `translate(${f1(w.x)} ${L.y}) scale(${f1(L.dir * k)} ${f1(k)})`);
      w.g.setAttribute('opacity', f1(Math.min(smooth(X0 + 30, X0 + 80, w.x), 1 - smooth(X1 - 70, X1 - 20, w.x))));

/* ---- 船：同一航道保持距離，船頭朝前；表演「帆船出航」時航道上的船暫時離開 ---- */
function stepBoats(dt, mv) {
  const hide = show.on && show.kind === 'sail';
  boatLanes.forEach(L => {
    L.vis += ((hide ? 0 : 1) - L.vis) * Math.min(1, dt * 2);
    L.list.forEach(B => {
      B.boost = Math.max(0, B.boost - dt); B.wave = Math.max(0, (B.wave || 0) - dt);
      let gap = 1e9, lead = null;
      L.list.forEach(O => { if (O === B) return; const d = (O.x - B.x) * L.dir; if (d > 0 && d < gap) { gap = d; lead = O; } });
      let sp = B.base * (B.boost > 0 ? 2.4 : 1);
      const minGap = (B.L + (lead ? lead.L : 0)) / 2 * L.k + 30;
      if (lead && gap < minGap + 60) sp = Math.min(sp, lead.sp * (gap < minGap ? .5 : 1));
      B.sp = sp;
      B.x += L.dir * sp * dt * mv;
      if (L.dir > 0 && B.x > 1600 + 260) B.x = -260 - rand(0, 300);
      if (L.dir < 0 && B.x < -260) B.x = 1600 + 260 + rand(0, 300);
      const bob = Math.sin(time * 1.8 + B.ph) * 1.6 * mv, rot = Math.sin(time * 1.4 + B.ph) * (B.boost > 0 ? 3 : 1.4) * mv - (B.boost > 0 ? 2 : 0);
      B.g.setAttribute('transform', `translate(${f1(B.x)} ${f1(L.y + bob)}) scale(${f1(L.dir * L.k)} ${L.k})`);
      B.b.setAttribute('transform', `rotate(${f1(rot)})`);
      B.wake.setAttribute('opacity', f1(clamp(sp / 60, .3, 1)));
      B.g.setAttribute('opacity', f1(L.vis));
      B.g.style.display = L.vis < .02 ? 'none' : '';
      if (B.flag) flagPaths(B.flag, 14, 9, time * mv + B.ph, 1.8);
      if (B.lights) B.lights.setAttribute('opacity', f1(smooth(.4, .9, night)));
      if (B.man) B.man.arm.setAttribute('transform', `rotate(${f1(-40 + Math.sin(time * 2 + B.ph) * 4 * mv)} 0 -29)`);
    });
  });
}
