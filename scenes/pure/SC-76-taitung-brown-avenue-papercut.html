<style>
/* =========================================================
   SC-76 台東伯朗大道的金色稻浪｜剪紙層疊
   地點：台灣台東縣池上鄉，花東縱谷裡的伯朗大道。
         站在田間十字路口，往北看縱谷的盡頭。
   真實元素：左邊（西）是又高又深的中央山脈，右邊（東）是比較低、比較近的海岸山脈，
            兩座山脈中間夾著平坦的縱谷，筆直的農路一路伸向山腳；
            整片稻田看不到一根電線桿（電線都埋到地下了）；
            路邊一棵枝葉往兩旁攤開的茄苳樹（因為廣告出名的那棵樹，2016 年颱風吹倒後又扶正）；
            一年兩期稻作：二月、八月插秧時是一片映著山影的水田，
            春夏青翠，六七月與十月、十一月稻穗轉金黃、收割機下田；
            冬天休耕時種油菜花當綠肥，再用曳引機翻進土裡；
            白鷺鷥跟在農機後面找蟲吃，田邊有灌溉水圳；
            租單車、四輪協力車的遊客，戴斗笠的農夫，稻草人和麻雀；
            山腳下的花東線火車；每年秋收時在金黃稻田中央搭舞台的「池上秋收稻穗藝術節」音樂會；
            夏天午後常有雷陣雨，夏秋會有颱風。
   風格重點：剪紙層疊——中央山脈三層、海岸山脈兩層、一條條往遠方縮小的稻田紙條、
            一叢叢手剪的稻子，每張紙底下墊一層深色投影紙；越遠越淡越藍；
            全畫面疊一層紙纖維紋理；滑鼠移動時各層紙板產生視差。
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），部分另有 --k-名稱（晨昏）。
   JS 會依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）。
   --sz-稻作期-名稱 是四個稻作季節的田地顏色（插秧水田／青翠／金黃／油菜花），
   JS 依季節混色、再乘上光線色後輸出 --field1、--field2、--blade、--blade2、--ridge。
   ========================================================= */
:root{
  /* 表演氛圍（取代寬銀幕黑邊）：四周暗角與中央微亮的顏色 */
  --cine-shade:#000000; --cine-light:#fff1d6;
  color-scheme: light;

  /* —— 天空、雲、霧 —— */
  --d-sky-top:#4f9ae0;  --k-sky-top:#5a5a9c;  --n-sky-top:#060b1c;
  --d-sky-mid:#8fc6ee;  --k-sky-mid:#e59a8a;  --n-sky-mid:#0f1d3c;
  --d-sky-low:#dff1f4;  --k-sky-low:#ffd08e;  --n-sky-low:#1d2c52;
  --d-cloud:#ffffff;    --k-cloud:#ffdcc0;    --n-cloud:#2e3a5e;
  --d-cloud-dk:#b8c8d8; --k-cloud-dk:#c08a90; --n-cloud-dk:#161f38;
  --d-overcast:#8a96a4; --k-overcast:#7a6c78; --n-overcast:#0c1220;
  --d-mist:#eef3f4;     --k-mist:#f4d8c8;     --n-mist:#26304c;
  /* 光線色：田地的季節色會乘上這個顏色（白天白、黃昏橘、夜晚深藍） */
  --d-light:#ffffff;    --k-light:#ffc890;    --n-light:#2e3c62;

  /* —— 中央山脈（左、西邊，又高又遠）—— */
  --d-cm-far:#a9c2dc;   --k-cm-far:#b49ab4;   --n-cm-far:#151f3c;
  --d-cm-mid:#7c9fc0;   --k-cm-mid:#8c7896;   --n-cm-mid:#101a32;
  --d-cm-near:#4f7a74;  --k-cm-near:#5c5a62;  --n-cm-near:#0b1426;

  --d-cr-far:#8fb0b8;   --k-cr-far:#a08898;   --n-cr-far:#121c34;
  --d-cr-near:#3f6e58;  --k-cr-near:#4e4c4a;  --n-cr-near:#0a1420;
  --d-forest:#2f5e40;   --k-forest:#3e4436;   --n-forest:#08120e;

  --d-curb:#d6d0c2;     --k-curb:#dcb8a0;     --n-curb:#30303e;

  --d-canal-hi:#e4f6fb; --k-canal-hi:#ffe0c0; --n-canal-hi:#5a6e9a;

  --d-sheen:#fff6d8;    --k-sheen:#ffe0a8;    --n-sheen:#4a5a86;

  /* —— 茄苳樹 —— */
  --d-trunk:#6e5440;    --k-trunk:#6a4a3c;    --n-trunk:#141012;
  --d-trunk-dk:#4a3628; --k-trunk-dk:#46302a; --n-trunk-dk:#0a0808;
  --d-leaf1:#3e8a3e;    --k-leaf1:#54723a;    --n-leaf1:#0c1c12;
  --d-leaf2:#2c6e34;    --k-leaf2:#3e5a30;    --n-leaf2:#08140c;
  --d-leaf3:#62a64c;    --k-leaf3:#7e8a44;    --n-leaf3:#122416;
  --d-grass:#5e9c44;    --k-grass:#6e8040;    --n-grass:#0e1a10;

  /* —— 動物 —— */
  --d-egret:#fbfbf6;    --k-egret:#ffe4d0;    --n-egret:#5a6280;
  --d-egret-sh:#d4d8d6; --k-egret-sh:#d8b0a8; --n-egret-sh:#3a4060;
  --d-sparrow:#8a6446;  --k-sparrow:#7e5440;  --n-sparrow:#1a1410;
  --d-bulbul:#6e7a5a;   --n-bulbul:#14180e;

  /* —— 農機、稻草人 —— */
  --d-mach:#e0662a;     --k-mach:#e05a30;     --n-mach:#3a1a10;
  --d-mach2:#2f6fb0;    --k-mach2:#3c5a90;    --n-mach2:#0c1a30;
  --d-mach-lt:#f2f0ea;  --k-mach-lt:#ffdcc6;  --n-mach-lt:#3a3e54;
  --d-tire:#2a2a2c;     --n-tire:#0a0a0c;
  --d-straw:#d8b464;    --k-straw:#d89a5a;    --n-straw:#3a2e18;

  /* —— 人物、單車 —— */
  --d-skin:#ecc29e;     --k-skin:#eca88a;     --n-skin:#3a2c28;
  --d-skin2:#b07a54;    --k-skin2:#a86a4c;    --n-skin2:#24180f;
  --d-hair:#2a2220;     --n-hair:#0c0a0a;
  --d-hair2:#8a8682;    --n-hair2:#26242a;
  --d-pants:#34404e;    --n-pants:#0c0e16;
  --d-pants2:#6a86b0;   --n-pants2:#141c30;
  --d-coat1:#e2483e;    --k-coat1:#e8483a;    --n-coat1:#3e1414;
  --d-coat2:#2e80c8;    --k-coat2:#3c64a0;    --n-coat2:#0e1a32;
  --d-coat3:#f4bc2c;    --k-coat3:#f4a832;    --n-coat3:#4a3612;
  --d-coat4:#36a072;    --k-coat4:#4a8058;    --n-coat4:#0e261a;

  --d-hat:#e2c68a;      --k-hat:#e8b07a;      --n-hat:#3a3020;
  --d-helmet:#f6f6f2;   --n-helmet:#3e4256;

  /* —— 四個稻作季節：田地顏色（field1/field2 是一條條田、blade/blade2 是稻葉、ridge 是田埂）—— */
  --sz-plant-field1:#a8cfe0; --sz-plant-field2:#98c4da; --sz-plant-blade:#8cc85a; --sz-plant-blade2:#6aa848; --sz-plant-ridge:#7aa84c;
  --sz-green-field1:#6cb44a; --sz-green-field2:#5aa43e; --sz-green-blade:#78c050; --sz-green-blade2:#3e8a36; --sz-green-ridge:#4e8a3a;

  --sz-rape-field1:#b8d040;  --sz-rape-field2:#a6c23a;  --sz-rape-blade:#7aa63a;  --sz-rape-blade2:#5a8a2e;  --sz-rape-ridge:#6a8e3a;

  /* —— 不隨日夜變化的顏色（光、燈、亮色）—— */
  --sun:#fff0c8; --moon:#f4f0e0; --star:#ffffff;
  --window-in:#ffcf7a; --lamp:#fff2b8; --firefly:#e8ff8a; --flash:#ffffff;

  /* —— 頁面介面 —— */

  --ui-surface:#ffffff; --ui-line:#ddd6c4; --ui-accent:#3e8a4a; --ui-hot:#e8a82a; --ui-hot2:#d8573a;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:8px;overflow:hidden;background:#8fc6ee;line-height:0;box-shadow:0 10px 32px rgba(60,50,20,.2)}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:8px;padding:10px 14px}
.panel button{font:700 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1.5px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:#fff}
.panel button.big{border-color:var(--ui-hot);color:#2a1c04;background:var(--ui-hot)}
.panel button.big2{border-color:var(--ui-hot2);color:#fff;background:var(--ui-hot2)}
.panel button:disabled{opacity:.45;cursor:default}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px dashed #ffffff;outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(220px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding:0;list-style:none;color:var(--page-muted);font-size:14px;line-height:1.8;display:flex;flex-wrap:wrap;gap:4px 22px}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .shd{fill:#1e2a10;opacity:.22}
#scene .head{fill:var(--grainc,#f2c440);opacity:var(--gold,0)}
#scene .flw{fill:var(--flowerc,#f6dc2a);opacity:var(--rape,0)}
#scene .wat{opacity:var(--wat,0)}
@media (prefers-reduced-motion:reduce){ *{scroll-behavior:auto!important;transition:none!important} }
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });

</script>
<style id="pure-art">

<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 舞台。圖層由遠到近：
       天空（色帶、銀河、星星、月亮、太陽、雲、飛鳥）
       → 中央山脈三層（左）與海岸山脈兩層（右）、山嵐 → 縱谷盡頭的樹林、農舍、花東線火車
       → 稻田：一條條往遠方縮小的田、水田倒影、田埂、稻浪光澤、伯朗大道、一排排稻子
         （中間穿插茄苳樹與遊客、白鷺鷥、農機、稻草人與麻雀、戴斗笠的農夫、大道上的單車）
       → 前景：水圳、東西向農路上的單車與四輪協力車、最近的一排稻子
       → 天氣（雨、閃電）→ 紙纖維紋理、暗角、表演時的上下黑邊
       大部分的物件由下方 JS 產生，這裡只放骨架與漸層、圖樣。
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" role="img" aria-label="台東池上伯朗大道：花東縱谷裡筆直的農路伸向山腳，左邊中央山脈、右邊海岸山脈，路旁一棵茄苳樹，四周是一望無際的稻田、騎單車的遊客與白鷺鷥">
    <defs>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);
      }
      return _conn.call(this, dest, ...a);
    };
  }
  function stopAudio() {
    let longs = [], ctx = null;
    for (const s of srcs) {
      const c = s.context, now = c.currentTime, m = s.__ss; ctx = c;
      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }
    if (longs.length && ctx) {
      const g = outs.get(ctx), now = ctx.currentTime;
      if (g) {
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 1.1); g.gain.setValueAtTime(0, now + 1.2);
        g.gain.linearRampToValueAtTime(1, now + 1.9);
      }
      longs.forEach(s => { try { s.stop(now + 1.15); } catch (e) {} srcs.delete(s); });
    }
    srcs.clear();
  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');
    // 凍結色票：把目前的 CSS 變數抄到殘影上，底下換色不影響殘影
    const cs = getComputedStyle(svg);
    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }
      }
    }
    const par = svg.parentElement;
    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });
    added = [];
  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>
/* ---- 表演氛圍（取代寬銀幕黑邊）：k = 0~1，四周輕微暗角＋中央微亮；fx/fy 可讓亮處偏向表演焦點 ---- */
let cineK = 0, cineW = 0;
function setCine(k, fx, fy) {
  cineK = k = Math.max(0, Math.min(1, k));
  if (k === cineW || (Math.abs(k - cineW) < .004 && k > 0 && k < 1)) return;   // 變化太小就先不重畫
  cineW = k;
  const g = document.getElementById('cineFx'); if (!g) return;
  g.setAttribute('opacity', k.toFixed(3));
  if (fx != null) { const G = document.getElementById('cineLightG'); G.setAttribute('cx', (fx / 1600).toFixed(3)); G.setAttribute('cy', (fy / 600).toFixed(3)); }
}

/* =========================================================
   SC-76 伯朗大道｜程式區
   區塊：①工具與色票（含稻作季節混色）
         ②場景（紙色帶天空、銀河、中央山脈與海岸山脈、縱谷盡頭、稻田、伯朗大道、茄苳樹、水圳、前景農路）
         ③角色（單車、四輪協力車、大道上的單車、遊客、農夫、白鷺鷥、農機、稻草人與麻雀、火車、昆蟲）
         ④動畫（主迴圈、日夜、稻作季節、天氣、金色稻浪秀、稻田音樂會秀）
         ⑤互動（點擊、滑鼠、聲音、控制列）
   ========================================================= */
(() => {
'use strict';

/* ---------------- ① 工具 ---------------- */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const root = document.documentElement;
const svg = $('scene');
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const win = (a, b, c, d, x) => smooth(a, b, x) * (1 - smooth(c, d, x));
let seed = 20261176;        // 固定亂數：每次開啟構圖都一樣
const srand = (a = 0, b = 1) => { seed = (seed * 16807) % 2147483647; return a + (seed / 2147483647) * (b - a); };
const spick = a => a[Math.floor(srand(0, a.length - .001))];
const f1 = n => (+n).toFixed(1);
function el(tag, attrs = {}, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
const P = pts => 'M' + pts.map(p => f1(p[0]) + ' ' + f1(p[1])).join('L') + 'Z';
const poly = (parent, pts, cls, extra = {}) => el('path', Object.assign({ d: P(pts), class: cls }, extra), parent);
/* 剪紙：先墊一張往右下偏移的深色投影紙，再放上彩色紙 */
function cut(parent, d, cls, o = {}) {
  if (o.sh !== 0) el('path', { d, class: 'shd', transform: `translate(${o.sx ?? 1.2} ${o.sh ?? 3})` }, parent);
  return el('path', Object.assign({ d, class: cls }, o.attr || {}), parent);
}
const blobD = arr => arr.map(([cx, cy, r]) => `M${f1(cx - r)} ${f1(cy)}a${f1(r)} ${f1(r)} 0 1 0 ${f1(r * 2)} 0a${f1(r)} ${f1(r)} 0 1 0 ${f1(-r * 2)} 0`).join('');
function clickable(g, label) { g.classList.add('clickable'); g.setAttribute('tabindex', 0); g.setAttribute('role', 'button'); g.setAttribute('aria-label', label); return g; }
/* 山稜線：一串點，加上手剪的小鋸齒 */
function ridgeD(pts, base, jag = 2.2) {
  let d = `M${f1(pts[0][0])} ${base}`;
  pts.forEach(([x, y]) => { d += `L${f1(x)} ${f1(y + srand(-jag, jag))}`; });
  return d + `L${f1(pts[pts.length - 1][0])} ${base}Z`;
}

/* ---------------- ① 色票：讀取、配對、日夜內插、稻作季節混色 ---------------- */
const css = n => getComputedStyle(root).getPropertyValue(n).trim();
const hex = h => { h = h.replace('#', ''); const n = parseInt(h.slice(0, 6), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255, 1]; };
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgba = c => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${(c[3] ?? 1).toFixed(3)})`;
const rgb = c => `rgb(${clamp(Math.round(c[0]), 0, 255)},${clamp(Math.round(c[1]), 0, 255)},${clamp(Math.round(c[2]), 0, 255)})`;
const PAIRS = {}, NOW = {};
/* 稻作季節：插秧水田、青翠稻田、金黃稻穗、油菜花田（冬季休耕） */
const SZN = ['plant', 'green', 'gold', 'rape'], SZL = ['插秧', '青翠', '金黃', '油菜花'];
const SZK = ['field1', 'field2', 'blade', 'blade2', 'ridge'], SZC = {};
(() => {
  const names = [];
  for (const sheet of document.styleSheets) {
    try { for (const r of sheet.cssRules) if (r.selectorText === ':root') for (const p of r.style) if (p.startsWith('--d-')) names.push(p.slice(4)); } catch (e) {}
  }
  let cls = '';
  names.forEach(k => {
    const k2 = css('--k-' + k);
    PAIRS[k] = { d: hex(css('--d-' + k)), n: hex(css('--n-' + k)), k: k2 ? hex(k2) : null };
    cls += `#scene .f-${k}{fill:var(--${k})}#scene .s-${k}{stroke:var(--${k});fill:none}`;
  });
  SZK.forEach(k => { SZC[k] = SZN.map(s => hex(css(`--sz-${s}-${k}`))); cls += `#scene .f-${k}{fill:var(--${k})}#scene .s-${k}{stroke:var(--${k});fill:none}`; });
  const st = document.createElement('style'); st.textContent = cls; document.head.appendChild(st);
})();
const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
let reduced = mq.matches;

/* ---------------- ② 版面常數 ----------------
   HY：縱谷地平線；VX：伯朗大道消失點；CANAL：水圳；XR：東西向農路（前景） */
const HY = 270, VX = 800, ROW_END = 494, CANAL = 498, XR_TOP = 512, XR_BOT = 556;
const LY = {}; ['Lfar', 'Lmid', 'Lfield', 'Lnear'].forEach(k => LY[k] = $(k));
const PX = { Lfar: 3, Lmid: 6, Lfield: 11, Lnear: 22 };
/* 伯朗大道左右路緣：從消失點往下越來越寬 */
const roadK = y => (y - HY) / (600 - HY);
const roadL = y => lerp(VX - 2, 690, roadK(y));
const roadR = y => lerp(VX + 2, 910, roadK(y));
/* 稻田深度比例：0＝地平線、1＝最前排 */
const depth = y => clamp((y - HY) / (ROW_END - HY), 0, 1);

/* 狀態 */
let time = 0, last = performance.now(), colorAcc = 0;
const DAY_SEC = 150;                       // 一整天自動播放幾秒
const T = { t: 10 / 24, auto: true, dragging: false };
let night = 0, dusk = 0, sunUp = 1, moonUp = 0, sunX = 800, sunY = 100, hourNow = 10, lastColor = -1;
/* 稻作季節：SW 是目前四季的比重，SWT 是目標 */
const SW = [0, 1, 0, 0], SWT = [0, 1, 0, 0]; let szIdx = 1, szDirty = true;
const SR = [6.3, 5.2, 5.8, 6.5], SS = [18.0, 18.7, 17.5, 17.4];   // 各季的日出、日落時刻
const szMix = arr => arr.reduce((s, v, i) => s + v * SW[i], 0);

/* =========================================================
   ② 場景
   ========================================================= */

/* ---- 天空：10 條紙色帶、銀河、星星、月亮、太陽 ---- */
const skyBands = [], twinkle = [];
function drawSky() {
  const g = $('skyBands'), n = 10, h = 330 / n;
  for (let i = 0; i < n; i++) {
    const y = -60 + i * h, pts = [];
    for (let x = -60; x <= 1660; x += 80) pts.push([x, y + h + 2 + Math.sin(x * .006 + i) * 5]);
    skyBands.push(el('path', { d: `M-60 -80L1660 -80L1660 ${f1(y + h + 2)}` + pts.reverse().map(p => `L${f1(p[0])} ${f1(p[1])}`).join('') + 'Z' }, g));
  }
  // 銀河：台東光害少，晴朗的夜晚看得到
  const mw = $('milky');
  for (let i = 0; i < 14; i++) { const t = i / 13, x = lerp(-40, 1150, t), y = lerp(250, 10, t); el('ellipse', { cx: f1(x), cy: f1(y), rx: f1(srand(70, 120)), ry: f1(srand(22, 40)), fill: 'url(#milkyG)', opacity: f1(srand(.35, .6)), transform: `rotate(-11 ${f1(x)} ${f1(y)})` }, mw); }
  for (let i = 0; i < 160; i++) {
    const t = srand(0, 1), x = lerp(-40, 1150, t), y = lerp(250, 10, t) + srand(-40, 40) * srand(0, 1);
    el('circle', { cx: f1(x), cy: f1(y), r: f1(srand(.3, .9)), fill: '#fff', opacity: f1(srand(.3, .8)) }, mw);
  }
  const sg = $('stars');
  for (let i = 0; i < 140; i++) {
    const x = srand(-40, 1640), y = Math.pow(srand(0, 1), 1.3) * 230 - 20, r = srand(.7, 1.6);
    const c = el('circle', { cx: f1(x), cy: f1(y), r: f1(r), fill: 'var(--star)', opacity: f1(srand(.35, 1)) }, sg);
    if (i % 5 === 0) twinkle.push({ n: c, o: +c.getAttribute('opacity'), ph: srand(0, 6) });
  }
  const mg = $('moonG');
  clickable(mg, '月亮：點一下切換白天');
  el('circle', { r: 60, fill: 'url(#glowG)', opacity: .35 }, mg);
  el('path', { d: 'M6 -20A21 21 0 1 0 6 20A16 16 0 1 1 6 -20Z', fill: 'var(--moon)' }, mg);
  const su = $('sunG');
  clickable(su, '太陽：點一下切換夜晚');
  el('circle', { r: 130, fill: 'url(#glowG)' }, su);
  el('circle', { r: 48, fill: '#fff4d8', opacity: .16 }, su);
  el('circle', { r: 34, fill: '#fff4d8', opacity: .26 }, su);
  el('circle', { r: 24, fill: 'var(--sun)' }, su);
}

/* ---- 紙雲 ---- */
const clouds = [];
function makeCloud(parent, x, y, s) {
  const g = el('g', {}, parent), b = el('g', { transform: `scale(${s})` }, g);
  const d = blobD([[0, -6, 30], [-38, 4, 22], [40, 2, 25], [-16, -18, 22], [20, -20, 24], [66, 10, 15], [-62, 12, 14]]);
  el('path', { d, class: 'f-cloud-dk', transform: 'translate(3 6)' }, b);
  el('path', { d, class: 'f-cloud' }, b);
  const C = { g, x, y, v: s > 1.2 ? rand(1.5, 2.5) : rand(5, 9) };
  clouds.push(C);
  return C;
}
function drawClouds() {
  const g = $('clouds');
  [[180, 56, .8], [620, 30, 1], [1060, 70, .7], [1420, 40, .9], [-220, 104, .6], [880, 120, .5], [330, 112, 1.5], [1300, 140, 1.3]].forEach(([x, y, s]) => {
    const C = makeCloud(g, x, y, s); clickable(C.g, '雲：點一下飄下一陣小雨');
  });
}

/* ---- 山：左邊中央山脈三層、右邊海岸山脈兩層 ----
   中央山脈稜線高、山頭尖；海岸山脈低矮、圓緩，離縱谷比較近 */
const mistBands = [];
function drawMountains() {
  const far = LY.Lfar, mid = LY.Lmid;
  // 縱谷盡頭的遠山（兩座山脈在北邊慢慢靠攏）
  cut(far, ridgeD([[700, 262], [740, 252], [780, 246], [820, 250], [860, 244], [900, 252], [940, 258], [980, 264]], HY + 4, .8), 'f-cm-far', { sh: 1.5 });
  // 中央山脈：最遠一層（高峰）
  const p1 = [];
  for (let x = -80; x <= 900; x += 16) {
    const k = (x + 80) / 980;
    const y = lerp(96, 250, Math.pow(k, 1.4)) - 26 * Math.abs(Math.sin(x * .011 + 1)) - 12 * Math.abs(Math.sin(x * .029 + 2)) + 10 * Math.sin(x * .004);
    p1.push([x, y]);
  }
  p1.push([980, HY + 2]);
  cut(far, ridgeD(p1, HY + 4), 'f-cm-far', { sh: 2 });
  // 中央山脈：中間一層
  const p2 = [];
  for (let x = -80; x <= 840; x += 14) {
    const k = (x + 80) / 920;
    p2.push([x, lerp(150, 254, Math.pow(k, 1.25)) - 18 * Math.abs(Math.sin(x * .017 + .4)) - 7 * Math.abs(Math.sin(x * .05))]);
  }
  p2.push([920, HY + 2]);
  cut(mid, ridgeD(p2, HY + 4, 1.6), 'f-cm-mid', { sh: 3 });
  // 山嵐：貼著中央山脈山腰的雲帶
  [[-40, 168, 360, 12], [380, 196, 300, 10], [120, 212, 420, 9], [640, 232, 220, 7]].forEach(([x, y, w, h]) => {
    const g = el('g', { class: 'noHit', opacity: 0 }, mid), pts = [];
    for (let i = 0; i <= 18; i++) { const t = i / 18; pts.push([x + t * w, y - Math.sin(t * Math.PI) * h * srand(.7, 1.2)]); }
    for (let i = 18; i >= 0; i--) { const t = i / 18; pts.push([x + t * w, y + Math.sin(t * Math.PI) * h * .5]); }
    poly(g, pts, 'f-mist');
    mistBands.push({ g, x, ph: srand(0, 6) });
  });
  // 中央山脈：最近的山腳（長滿樹林）
  const p3 = [];
  for (let x = -80; x <= 790; x += 10) {
    const k = (x + 80) / 870;
    p3.push([x, lerp(206, 262, Math.pow(k, 1.1)) - 12 * Math.abs(Math.sin(x * .023 + 2.2)) - 4 * Math.abs(Math.sin(x * .09))]);
  }
  p3.push([850, HY + 2]);
  cut(mid, ridgeD(p3, HY + 4, 1.2), 'f-cm-near', { sh: 3 });
  for (let x = -60; x < 760; x += 9) {           // 山腳樹冠的小圓點
    const k = (x + 80) / 870, y = lerp(222, 264, Math.pow(k, 1.1)) + srand(-4, 6);
    if (srand() < .55) el('path', { d: blobD([[x, y, srand(2.5, 5)]]), class: 'f-forest', opacity: .55 }, mid);
  }
  // 海岸山脈：遠層
  const q1 = [[690, HY + 2]];
  for (let x = 760; x <= 1680; x += 16) {
    const k = (x - 760) / 920;
    q1.push([x, lerp(252, 150, Math.pow(k, .8)) - 14 * Math.abs(Math.sin(x * .012 + .8)) - 5 * Math.sin(x * .031)]);
  }
  cut(far, ridgeD(q1, HY + 4, 1.4), 'f-cr-far', { sh: 2 });
  // 海岸山脈：近層（圓緩的山頭）
  const q2 = [];
  for (let x = 880; x <= 1680; x += 12) {
    const k = (x - 880) / 800;
    q2.push([x, lerp(262, 196, Math.pow(k, .7)) - 10 * Math.abs(Math.sin(x * .016 + 1.6)) - 3 * Math.sin(x * .06)]);
  }
  cut(mid, ridgeD(q2, HY + 4, 1), 'f-cr-near', { sh: 3 });
  for (let x = 900; x < 1660; x += 9) {
    const k = (x - 880) / 800, y = lerp(266, 214, Math.pow(k, .7)) + srand(-3, 10);
    if (srand() < .5) el('path', { d: blobD([[x, y, srand(2.5, 5)]]), class: 'f-forest', opacity: .5 }, mid);
  }
  // 海岸山脈上的晨雲
  [[1180, 214, 260, 8], [1420, 196, 240, 9]].forEach(([x, y, w, h]) => {
    const g = el('g', { class: 'noHit', opacity: 0 }, mid), pts = [];
    for (let i = 0; i <= 14; i++) { const t = i / 14; pts.push([x + t * w, y - Math.sin(t * Math.PI) * h * srand(.7, 1.2)]); }
    for (let i = 14; i >= 0; i--) { const t = i / 14; pts.push([x + t * w, y + Math.sin(t * Math.PI) * h * .5]); }
    poly(g, pts, 'f-mist');
    mistBands.push({ g, x, ph: srand(0, 6) });
  });
}

/* ---- 縱谷盡頭：遠方稻田、樹林、農舍、花東線鐵路 ---- */
const houseWins = [];

  // 鐵路路堤（中央山脈山腳）

  // 樹林與防風林

  [[150, 1], [330, .9], [470, 1.1], [610, .8], [990, .9], [1110, 1.1], [1260, .9], [1390, 1], [1530, 1.2]].forEach(([x, s]) => {

/* ---- 花東線火車（山腳下，偶爾一列駛過；點一下聽鐵軌聲） ---- */

/* ---- 稻田 ----
   bands：一條條往遠方縮小的田（剪紙紙條）；water：插秧時的水田倒影與秧苗；
   ridges：往消失點集中的田埂；sheens：風吹過稻田時亮亮的光澤；
   rows：一排排稻叢，每排切成幾段，分段隨風擺動（skewX） */
const rows = [], sheens = [], slots = [];
let waterG, waterSeed, roadG, sheenG;
function drawFields() {
  const L = LY.Lfield;
  // 田：16 條紙條
  const N = 16;
  for (let j = 0; j < N; j++) {
    const y0 = HY + (CANAL + 2 - HY) * Math.pow(j / N, 1.6), y1 = HY + (CANAL + 2 - HY) * Math.pow((j + 1) / N, 1.6);
    const pts = [];
    for (let x = -80; x <= 1680; x += 60) pts.push([x, y0 + srand(-.6, .6)]);
    pts.push([1680, y1 + 2], [-80, y1 + 2]);
    cut(L, P(pts), j % 2 ? 'f-field2' : 'f-field1', { sh: 1 + j * .08, sx: 0 });
    // 遠處的田用細線表現一行行的稻子
    if (y0 < 340) for (let y = y0 + 2; y < y1; y += 2 + j * .3) el('path', { d: `M-80 ${f1(y)}H1680`, class: 's-blade2', 'stroke-width': .5 + j * .05, opacity: .35, 'stroke-dasharray': `${f1(2 + j)} ${f1(1 + j * .4)}` }, L);
  }
  // 插秧水田：倒映山影、天空的水面與一行行秧苗
  waterG = el('g', { class: 'wat noHit', 'clip-path': 'url(#fieldClip)' }, L);
  el('rect', { x: -80, y: HY, width: 1760, height: CANAL - HY + 4, class: 'f-paddy-water' }, waterG);
  el('use', { href: '#mtnAll', transform: `translate(0 ${2 * HY + 2}) scale(1 -1)`, opacity: .26 }, waterG);
  waterSeed = el('g', {}, waterG);
  for (let y = HY + 3; y < CANAL; y += 2 + (y - HY) * .06) {
    const k = depth(y);
    el('path', { d: `M-80 ${f1(y)}H1680`, class: 's-blade', 'stroke-width': f1(.6 + k * 2), 'stroke-dasharray': `${f1(1 + k * 3)} ${f1(2 + k * 10)}`, opacity: .9 }, waterSeed);
  }
  // 田埂：往消失點集中
  [-1300, -560, 80, 1720, 2500].forEach(bx => {
    poly(L, [[VX - .4, HY], [VX + .4, HY], [bx + 6, 600], [bx - 6, 600]], 'f-ridge', { 'clip-path': 'url(#fieldClip)' });
  });
  // 左邊田裡一條橫向田埂（農夫走的那條）

/* =========================================================
   ④ 日夜與光線
   ========================================================= */
function applyColors(force) {
  const key = Math.round(T.t * 1440);
  if (!force && key === lastColor) return;
  lastColor = key;
  const h = hourNow = T.t * 24;
  const sr = szMix(SR), ss = szMix(SS);
  night = clamp(1 - smooth(sr - .8, sr + .6, h) + smooth(ss - .4, ss + 1.1, h), 0, 1);
  dusk = Math.max(Math.exp(-Math.pow((h - sr) / .7, 2)), Math.exp(-Math.pow((h - ss) / .75, 2)));
  for (const k in PAIRS) {
    const Pp = PAIRS[k];
    let c = mix(Pp.d, Pp.n, night);
    if (Pp.k) c = mix(c, Pp.k, dusk * .85);
    NOW[k] = c;
    root.style.setProperty('--' + k, rgba(c));
  }
  // 稻作季節的田地顏色：依季節比重混色，再乘上光線色；陰天再灰一點
  const Lc = NOW.light, dim = 1 - wx.cloud * .18;
  const lit = c => [c[0] * Lc[0] / 255 * dim, c[1] * Lc[1] / 255 * dim, c[2] * Lc[2] / 255 * dim, 1];
  SZK.forEach(k => { const c = [0, 0, 0, 1]; SZC[k].forEach((col, i) => { for (let j = 0; j < 3; j++) c[j] += col[j] * SW[i]; }); root.style.setProperty('--' + k, rgba(lit(c))); });
  root.style.setProperty('--grainc', rgba(lit(hex(css('--grain')))));
  root.style.setProperty('--flowerc', rgba(lit(hex(css('--flower')))));
  placeSunMoon(sr, ss);
  skyBands.forEach((b, i) => {
    const t = i / (skyBands.length - 1);
    const c = t < .55 ? mix(NOW['sky-top'], NOW['sky-mid'], t / .55) : mix(NOW['sky-mid'], NOW['sky-low'], (t - .55) / .45);
    b.setAttribute('fill', rgb(mix(c, NOW.overcast, wx.cloud * .6)));
  });
  $('clock').textContent = clockText();
  if (!T.dragging) $('timeRange').value = Math.round(T.t * 1000);
  lighting();
}
function clockText() { const m = Math.floor(T.t * 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
function placeSunMoon(sr, ss) {
  const h = hourNow;
  // 太陽從右邊（東，海岸山脈）升起，傍晚落到左邊（西，中央山脈）後面
  const p = (h - sr) / (ss - sr);
  sunX = 1480 - p * 1360; sunY = 262 - 236 * Math.sin(Math.PI * clamp(p, 0, 1));
  sunUp = clamp(smooth(-.02, .05, p) * (1 - smooth(.95, 1.02, p)), 0, 1);
  $('sunG').setAttribute('transform', `translate(${f1(sunX)} ${f1(sunY)})`);
  $('sunG').style.display = p > -.06 && p < 1.06 ? '' : 'none';
  $('sunG').setAttribute('opacity', f1(1 - wx.cloud * .9));
  const mp = ((h - (ss + .6) + 24) % 24) / 10.5;
  const mx = 1420 - mp * 1240, my = 250 - 190 * Math.sin(Math.PI * clamp(mp, 0, 1));
  moonUp = mp > 0 && mp < 1 ? Math.sin(Math.PI * mp) : 0;
  $('moonG').setAttribute('transform', `translate(${f1(mx)} ${f1(my)})`);
  $('moonG').style.display = mp > 0 && mp < 1 ? '' : 'none';
  $('moonG').setAttribute('opacity', f1(1 - wx.cloud * .85));
}
let lampLevel = 0;
function lighting() {
  const clear = (1 - wx.cloud * .9) * (1 - wx.mist * .3);
  $('stars').setAttribute('opacity', f1(smooth(.55, 1, night) * clear));
  $('milky').setAttribute('opacity', f1(smooth(.8, 1, night) * clear * (1 - moonUp * .5)));
  lampLevel = Math.max(smooth(.35, .9, night), wx.rain * .5);
  houseWins.forEach((w, i) => w.setAttribute('opacity', f1(lampLevel * (i % 3 === 2 ? .25 : .95))));
  train.wins.forEach(w => w.setAttribute('fill', lampLevel > .4 ? 'var(--window-in)' : '#2a3448'));
}
function setTime(h) { T.t = h / 24; T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false'); applyColors(true); }

  });

  // 稻浪：風、陣風（fronts）、滑鼠吹起的小浪

  mouse.push = Math.max(0, mouse.push - dt * 1.6);
  const W = wx.wind, swayAmp = (2 + W * 7) * mv, lean0 = W * 9 + (wx.ty > .5 ? 10 : 0);

}

/* ---- 花東線火車 ---- */
function updateTrain(dt, adt) {

/* ---- 東西向農路上的單車（同車道會跟車保持距離，不會穿過彼此） ---- */
function updateBikes(dt, adt) {
  const rainy = wx.rain > .3 ? 1 : 0;
  bikes.forEach(B => {
    const laneY = B.lane ? 532 : 550, sc = B.lane ? .78 : .86;
    if (!B.active) {
      B.wait -= dt;
      if (B.wait > 0) return;
      const sx = B.dir > 0 ? -140 : 1740;
      const clear = bikes.every(o => o === B || !o.active || o.lane !== B.lane || Math.abs(o.x - sx) > 160);
      if (!clear || Math.random() > crowdT) { B.wait = rand(1.5, 4); return; }
      B.active = true; B.x = sx; B.v = B.base; B.g.style.display = '';
    }
    // 前車距離
    let gap = 1e9, lead = null;
    bikes.forEach(o => { if (o === B || !o.active || o.lane !== B.lane) return; const d = (o.x - B.x) * B.dir; if (d > 0 && d < gap) { gap = d; lead = o; } });
    let target = B.base * (B.cheer > 0 ? .6 : 1) * (1 + wx.ty * .8);
    const need = (B.len + (lead ? lead.len : 0)) / 2 * sc + 26;
    if (lead && gap < need + 60) target = Math.min(target, lead.v * clamp((gap - need) / 60, 0, 1.1));
    B.v = lerp(B.v, target, Math.min(1, dt * 2));
    B.x += adt * B.v * B.dir;
    B.crank += adt * B.v / 9;
    B.ring = Math.max(0, B.ring - dt); B.cheer = Math.max(0, B.cheer - dt);
    pedal(B);
    const bob = Math.sin(B.crank * 2) * .5 + (B.cheer > 0 ? Math.abs(Math.sin(time * 9)) * -3 : 0) + (B.ring > 0 ? Math.sin(time * 40) * .6 : 0);
    B.g.setAttribute('transform', `translate(${f1(B.x)} ${f1(laneY + bob)}) scale(${f1(B.dir * sc)} ${sc})`);
    B.riders.forEach(R => R.poncho.setAttribute('opacity', rainy));
    B.lamp.setAttribute('opacity', f1(lampLevel));
    if ((B.dir > 0 && B.x > 1760) || (B.dir < 0 && B.x < -160)) { B.active = false; B.g.style.display = 'none'; B.wait = rand(2, 9); }
  });
}
/* ---- 伯朗大道上的單車：往山腳騎去越來越小，或從遠方迎面騎來 ---- */
function updateFarRiders(dt, adt) {
  const rainy = wx.rain > .3 ? 1 : 0;
  farRiders.forEach(R => {
    if (R.out) {
      R.wait -= dt;
      if (R.wait > 0) return;
      if (Math.random() > crowdT) { R.wait = rand(2, 5); return; }
      R.out = false; R.e = R.dir > 0 ? 1 : .06;
    }
    // 同方向的前車：保持距離（用深度比例算）
    let slow = 1;
    farRiders.forEach(o => { if (o === R || o.out || o.dir !== R.dir) return; const ahead = R.dir > 0 ? o.e < R.e : o.e > R.e; if (ahead && Math.abs(o.e - R.e) < .1 * Math.max(o.e, R.e)) slow = Math.min(slow, Math.abs(o.e - R.e) / (.1 * Math.max(o.e, R.e))); });
    const de = R.v * R.e * R.e * adt * slow;
    R.e += R.dir > 0 ? -de : de;
    R.ring = Math.max(0, R.ring - dt);
    if ((R.dir > 0 && R.e < .05) || (R.dir < 0 && R.e > 1)) { R.out = true; R.wait = rand(3, 12); R.g.setAttribute('opacity', 0); return; }
    const y = HY + (XR_TOP - HY) * R.e;

    const s = Math.max(.05, R.e * .78);
    const ph = time * 7 + R.ph;
    R.legA.setAttribute('d', `M-3 -30V${f1(-12 + Math.sin(ph) * 4)}`);
    R.legB.setAttribute('d', `M3 -30V${f1(-12 - Math.sin(ph) * 4)}`);
    R.poncho.setAttribute('opacity', rainy);

    R.g.setAttribute('opacity', f1(op));
    R.g.setAttribute('transform', `translate(${f1(x + Math.sin(ph * .5) * .6 * s)} ${f1(y + (R.ring > 0 ? Math.sin(time * 40) : 0))}) scale(${f1(s)})`);
  });
}
/* ---- 遊客、農夫 ---- */

/* ---- 白鷺鷥 ---- */
function egretPose(E, peck, walkPh) {

function updateEgrets(dt, adt) {
  const fx = +(lastPX.Lfield || 0);
  egrets.forEach((E, i) => {
    if (E.state === 'fly') {
      E.t += dt;
      const k = clamp(E.t / E.dur, 0, 1);
      let x, y;
      if (E.dur > 5) { x = E.fx + Math.sin(k * Math.PI * 2) * 260 * (i % 2 ? 1 : -1); y = E.fy - Math.sin(k * Math.PI) * E.H; E.dir = Math.cos(k * Math.PI * 2) * (i % 2 ? 1 : -1) >= 0 ? 1 : -1; }
      else { x = lerp(E.fx, E.tx, k); y = lerp(E.fy, E.ty, k) - Math.sin(k * Math.PI) * E.H; }
      if (E.follow && E.dur <= 5) x = lerp(E.fx, mach.x - mach.dir * (40 + E.fi * 22), k);
      E.x = x; E.y = y;
      const flap = Math.sin(time * 14);
      E.wing.setAttribute('opacity', 1);
      E.wing.setAttribute('transform', `translate(0 -22) scale(1 ${f1(flap)}) translate(0 22)`);
      E.legs.setAttribute('d', 'M-10 -18L-24 -15M-10 -17L-24 -13');
      E.neck.setAttribute('d', 'M6 -24Q12 -26 14 -26'); E.head.setAttribute('transform', 'translate(16 -26)');
      E.g.setAttribute('transform', `translate(${f1(x + fx)} ${f1(y)}) scale(${f1(E.dir * E.s)} ${f1(E.s)})`);
      if (k >= 1) {
        E.state = 'stand'; E.t = rand(1, 4); E.wing.setAttribute('opacity', 0);
        (E.follow ? E.home : slotFor(E.y)).appendChild(E.g);
        E.s = .3 + depth(E.y) * .6;
      }
      return;
    }
    E.t -= dt; E.peck = Math.max(0, E.peck - dt);
    let walking = false;
    if (E.follow && mach.vis > .5) {
      const tx = mach.x - mach.dir * (40 + E.fi * 22) * mach.s * 1.4, d = tx - E.x;
      if (Math.abs(d) > 6) { E.dir = d > 0 ? 1 : -1; E.x += adt * E.dir * Math.min(Math.abs(d) * 2, 26 + mach.boost * 6); walking = true; }
      if (E.hop > 0) { E.hop -= dt; }
    } else if (E.walkT > 0) {
      E.walkT -= dt; E.x += adt * E.dir * 7 * E.s * 2; walking = true;
    } else if (E.t <= 0) {
      E.t = rand(2, 5);
      if (Math.random() < .5) E.peck = .8; else { E.walkT = rand(1, 2.4); if (Math.random() < .4) E.dir *= -1; if (Math.abs(E.x - E.hx) > 60) E.dir = E.hx > E.x ? 1 : -1; }

    E.g.setAttribute('transform', `translate(${f1(E.x)} ${f1(E.y + hop)}) scale(${f1(E.dir * E.s)} ${f1(E.s)})`);

}

    f.n.setAttribute('opacity', f1(nightFly * (.4 + .6 * Math.max(0, Math.sin(time * 2.4 * f.sp + f.ph)))));
  });
  const dayBug = (1 - smooth(.3, .6, night)) * (1 - wx.rain) * (SW[2] + SW[1] * .4 + SW[3] * .3);
  dragonflies.forEach(D => {
    D.g.setAttribute('opacity', f1(dayBug)); D.g.style.display = dayBug < .03 ? 'none' : '';
    if (dayBug < .03) return;
    D.t -= dt; D.zip = Math.max(0, D.zip - dt);
    if (D.t <= 0) { D.t = rand(1.2, 3.5); D.tx = clamp(D.x + rand(-260, 260), 80, 1520); D.ty = rand(430, 520); }
    const k = Math.min(1, dt * (D.zip > 0 ? 5 : 1.6)) * mv;
    const nx = lerp(D.x, D.tx, k), ny = lerp(D.y, D.ty, k);
    if (Math.abs(nx - D.x) > .05) D.dir = nx > D.x ? 1 : -1;
    D.x = nx; D.y = ny;
    D.w.setAttribute('transform', `scale(1 ${f1(.55 + .45 * Math.abs(Math.sin(time * 40)))})`);
    D.g.setAttribute('transform', `translate(${f1(D.x)} ${f1(D.y + Math.sin(time * 3 + D.tx) * 2)}) scale(${D.dir * .8} .8)`);
  });
}

/* ---------------- 初始化 ---------------- */
let nearHit;
function init() {
  drawSky(); drawClouds(); makeBirds();
  drawMountains(); drawValleyFloor(); makeTrain();
  drawFields();
  // 稻田的點擊範圍（在稻叢與角色下面）
  fieldHit = clickable(el('rect', { x: -80, y: HY + 4, width: 1760, height: CANAL - HY - 4, fill: 'transparent' }), '稻田：點一下吹起稻浪（插秧時起漣漪）');
  LY.Lfield.insertBefore(fieldHit, waterG);
  makeFarRiders(); LY.Lfield.insertBefore(farG, roadG.nextSibling);
  drawTree(); makeTourists(); makeFarmer(); makeMachine(); makeScarecrow(); makeConcert();
  [[170, 372], [420, 456], [500, 404], [300, 484], [1120, 368], [1040, 470]].forEach(([x, y]) => makeEgret(slotFor(y), x, y, .3 + depth(y) * .6, false));
  const mg = mach.g.parentNode;
  for (let i = 0; i < 3; i++) { const E = makeEgret(mg, mach.x - (40 + i * 22), mach.y + 2, .3 + depth(mach.y) * .6, true); E.fi = i; E.home = mg; }
  const near = drawNear(); nearHit = near.hit;
  makeBikes(near.bikeG);
  makeInsects(); makeTreeBirds();
  drawWeather();
  initParts();
  bindAll();
  if (reduced) { T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false'); }
  setWeather(0);
  setSeason(1);
  seasonVars();
  applyColors(true);
  step(1 / 60);
  requestAnimationFrame(loop);
  // 網站「作者精選」播放區（純插畫版放在 iframe 裡）：預設輪播金色稻浪；不會自己出聲。
  const inPicks = (() => { let top = true; try { top = window.top === window; } catch (e) { top = false; } return !!document.getElementById('pure-art') && !top; })();
  if (inPicks) {
    setTimeout(() => startShow('wave', true), 800);
    setInterval(() => { if (!show.on) startShow('wave', true); }, 8000);
    window.sceneMusic = {
      playing: false,
      start(c) {
        if (this.playing) return; this.playing = true; pickAudio = true; userGesture = true;
        if (c && c !== actx) useCtx(c); else ensureAudio();
        if (actx && actx.state !== 'running') actx.resume();
        if (show.on && show.t < 4) playWaveMusic();
      },
      stop() { this.playing = false; pickAudio = false; stopAll(); },
      duck() {}
    };
  }
}
init();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on && show.kind,
  btn: { wave: 'btnWave', concert: 'btnConcert' },
  ff: () => { show.flags = new Proxy({}, { get: () => 1 }); show.t = show.dur - .02; },   // 跳到結尾：稻作季節、天氣會自動恢復
  save: () => ({ t: T.t, auto: T.auto }),
  stop: () => endShow(),
  restore: s => { T.t = s.t; T.auto = s.auto; $('btnAuto') && $('btnAuto').setAttribute('aria-pressed', String(T.auto)); lastColor = -1; applyColors(true); }
});
/* /ShowStop */
})();
</script>
