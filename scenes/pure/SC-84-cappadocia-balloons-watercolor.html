        左邊是整座岩山挖成蜂窩的烏奇薩城堡（Uçhisar，山頂有土耳其國旗），
        遠方是頂著白雪的埃爾吉耶斯死火山（Erciyes），
        中景是粉紅與奶白色條紋的玫瑰谷岩壁、熱氣球升空場、格雷梅小鎮與清真寺叫拜塔，
        前景是一根根頂著玄武岩帽子的精靈煙囪、畫著紅白邊框的鴿舍、白楊樹與葡萄園，
        谷底的土路上有接送氣球的皮卡（拖著藤籃）、越野四輪車隊、騎馬隊、牽引機。
        右下是鋪著地毯和坐墊、掛著馬賽克燈的洞穴旅館露台：穿長裙拍照的遊客、攝影師、
        喝紅茶的情侶、端早餐的服務生、坐在矮牆上的貓；左下是掛滿藍色邪眼的許願樹。
        天空是一層層遠近不同的熱氣球：日出前在地上充氣（夜裡噴火時整顆發亮），
        天亮後陸續升空，隨風飄移，八、九點降落收球。
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   風格重點：水彩感——feTurbulence＋feDisplacementMap 暈染毛邊、邊緣顏料堆積、紙紋顆粒；

   ========================================================= */

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{position:relative;margin:0;border-radius:6px;overflow:hidden;background:#2a2f5a;line-height:0;box-shadow:0 1px 0 #fff inset,0 6px 22px rgba(80,50,30,.18)}
#paper{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;background-size:100% 100%;opacity:.5;will-change:transform}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.stage .lay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;will-change:transform;user-select:none;-webkit-user-select:none}
.stage .lay .clickable{pointer-events:visiblePainted}
#scene{will-change:transform}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:6px;padding:10px 14px}
.panel button{font:700 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1.5px solid var(--ui-line);
  border-radius:999px;padding:9px 15px;cursor:pointer;letter-spacing:.03em}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:#fff}
.panel button.big{border-color:var(--ui-hot);color:#fff;background:var(--ui-hot)}
.panel button.big2{border-color:var(--ui-hot2);color:#fff;background:var(--ui-hot2)}
.panel button.on{background:#f2b23a!important;border-color:#f2b23a!important;color:var(--page-fg)!important}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}

.stage [tabindex]:focus{outline:none}
body.kbd .stage [tabindex]:focus{outline:2px solid #fff3cc;outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(220px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding:0;list-style:none;color:var(--page-muted);font-size:14px;line-height:1.8;display:flex;flex-wrap:wrap;gap:4px 22px}

/* ---------- SVG 內的樣式 ---------- */

.stage .clickable{cursor:pointer}
.stage .noHit{pointer-events:none}
.stage .bubble path{fill:#fffaf2;stroke:#7a5a4a;stroke-width:1.4}

.stage .bubble text{fill:#3a2a24;font:400 18px var(--font-hand);text-anchor:middle;dominant-baseline:central}
@media (prefers-reduced-motion: reduce){ .panel button{transition:none} }
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {

  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];

          if (r.media.mediaText !== t) r.media.mediaText = t;
        }

    }
  }

    var sh = document.styleSheets;

  }

  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";

    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;

<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。

  border:0!important;border-radius:0!important;box-shadow:none!important}

<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：天空 → 星空 → 太陽、月亮 → 雲 → 埃爾吉耶斯山與遠方台地
       → 遠層熱氣球 → 烏奇薩城堡與玫瑰谷岩壁 → 升空場、小鎮 → 中層熱氣球
       → 精靈煙囪谷（鴿舍、白楊、葡萄園）→ 近層熱氣球 → 谷底土路與車隊、騎馬隊

       ===================================================== -->

       aria-label="水彩風格的卡帕多奇亞清晨：幾十顆五顏六色的熱氣球飄在粉紅色的岩谷上空，左邊是蜂窩般的烏奇薩城堡，遠方是雪頂火山，前景是頂著深色岩帽的精靈煙囪和鋪著地毯的洞穴旅館露台。">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">

      <radialGradient id="glowGrad"><stop offset="0" stop-color="#ffcf6a" stop-opacity=".9"/><stop offset=".45" stop-color="#ffb347" stop-opacity=".35"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>

        <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/><stop offset=".35" stop-color="#ffffff" stop-opacity="0"/>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });

           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';

/* ---- 精靈煙囪谷：頂著玄武岩帽子的石柱、鴿舍、圓錐岩屋、白楊樹、葡萄園 ---- */
// 精靈煙囪：底下寬、往上收成細脖子，頂端是一頂深色的玄武岩帽子

  P(g, body, opt.pk ? 'f-tuff-pk' : 'f-tuff');
  P(g, `M${f1(x + nw * .1)} ${f1(top + capH)}C${f1(x + w * .1)} ${f1(by - h * .55)} ${f1(x + w * .3)} ${f1(by - h * .25)} ${f1(x + w / 2)} ${by}L${f1(x + w * .1)} ${by}C${f1(x + w * .05)} ${f1(by - h * .4)} ${f1(x)} ${f1(by - h * .7)} ${f1(x + nw * .1)} ${f1(top + capH)}Z`, 'f-tuff-sh', { opacity: .45 });

  gullies(g, body, [x - w / 2, top + capH * 2, x + w / 2, by - 10], Math.round(h / 12), 's-tuff-sh', [.8, 2]);
  // 帽子：上圓下平的深色岩塊

  P(g, cap, 'f-cap');
  P(g, `M${f1(x - capW * .38)} ${f1(top + capH * .55)}C${f1(x - capW * .3)} ${f1(top + capH * .2)} ${f1(x - capW * .1)} ${f1(top + capH * .1)} ${f1(x + capW * .05)} ${f1(top + capH * .12)}`, 's-cap-hi', { 'stroke-width': f1(Math.max(1.2, capH * .22)), 'stroke-linecap': 'round', opacity: .8 });
  if (opt.door) {   // 挖空的岩屋：拱門與小窗
    P(g, arch(x - w * .08, by - 4, w * .13, w * .2), 'f-hole', { opacity: .85 });

    addLamp($('valleyFx'), x + w * .12, by - h * .42 - w * .04, 11, srand(0, 1), 'win');
    addLamp($('valleyFx'), x - w * .08, by - 4 - w * .1, 12, srand(0, 1), 'win');
  }
  // 雪景：帽子上一層雪
  P($('valleySnow'), `M${f1(x - capW * .5)} ${f1(top + capH * .9)}C${f1(x - capW * .5)} ${f1(top + capH * .2)} ${f1(x - capW * .2)} ${f1(top - capH * .08)} ${f1(x + capW * .05)} ${f1(top - capH * .08)}C${f1(x + capW * .4)} ${f1(top - capH * .08)} ${f1(x + capW * .55)} ${f1(top + capH * .3)} ${f1(x + capW * .5)} ${f1(top + capH * .9)}C${f1(x + capW * .2)} ${f1(top + capH * .55)} ${f1(x - capW * .2)} ${f1(top + capH * .55)} ${f1(x - capW * .5)} ${f1(top + capH * .9)}Z`, '', { fill: '#fff', opacity: .95 });
  const c = { x, top, by, h, w, capW, capH, body, cap };
  chimneys.push(c); return c;
}

/* ---- 水彩邊緣：大片色塊外圍描一圈半透明的深色，像顏料乾掉時堆積在邊緣 ----
   （原本用 SVG 濾鏡即時做，但整片地景套濾鏡會讓動畫掉到個位數幀，所以改成畫的時候一次做好） */
function watercolorize() {
  document.querySelectorAll('.stage .wcG').forEach(g => {
    const far = g.classList.contains('wcFar'), lite = g.classList.contains('wcLite');
    g.querySelectorAll('path, ellipse').forEach(n => {
      const c = n.getAttribute('class') || '';
      if (!c.startsWith('f-') || n.getAttribute('stroke') || +(n.getAttribute('opacity') ?? 1) < .8 || n.closest('[clip-path]')) return;
      let bb; try { bb = n.getBBox(); } catch (e) { return; }
      if (bb.width < (lite ? 6 : 24) && bb.height < (lite ? 6 : 24)) return;
      n.setAttribute('stroke', far ? 'rgba(70,50,90,.14)' : 'rgba(80,40,40,.24)');
      n.setAttribute('stroke-width', far ? 1.6 : bb.width > 200 ? 1.6 : 1.1);
      n.setAttribute('stroke-linejoin', 'round');
      // 第二圈：較寬、很淡的顏料暈邊
      if (!lite && (bb.width > 40 || bb.height > 40)) {
        const e2 = n.cloneNode(false);
        e2.setAttribute('fill', 'none'); e2.removeAttribute('class'); e2.removeAttribute('opacity');
        e2.setAttribute('stroke', far ? 'rgba(70,50,90,.07)' : 'rgba(90,40,50,.08)'); e2.setAttribute('stroke-width', far ? 5 : 4.5);
        n.after(e2);
      }
    });
  });
}

/* ---- 紙張紋理（水彩紙）：一次產生成圖片 ---- */
function paperGrain() {
  try {
    const cv = document.createElement('canvas'); cv.width = 800; cv.height = 300;
    const c = cv.getContext('2d'); const im = c.createImageData(800, 300);
    for (let i = 0; i < im.data.length; i += 4) { const v = 236 + Math.random() * 19; im.data[i] = v; im.data[i + 1] = v - 3; im.data[i + 2] = v - 9; im.data[i + 3] = 255; }
    c.putImageData(im, 0, 0);
    c.globalAlpha = .06; c.strokeStyle = '#7a5a4a';
    for (let i = 0; i < 260; i++) { c.beginPath(); const x = Math.random() * 800, y = Math.random() * 300; c.moveTo(x, y); c.quadraticCurveTo(x + rand(-8, 8), y + rand(-8, 8), x + rand(-16, 16), y + rand(-16, 16)); c.stroke(); }
    // 顏料不均勻的暈染斑塊（大小不一、邊緣柔和）
    for (let i = 0; i < 70; i++) {
      const x = Math.random() * 800, y = Math.random() * 300, r = rand(12, 60);
      const gr = c.createRadialGradient(x, y, 0, x, y, r);
      const dark = Math.random() < .6;
      gr.addColorStop(0, dark ? 'rgba(120,80,70,.10)' : 'rgba(255,255,255,.0)'); gr.addColorStop(.7, dark ? 'rgba(120,80,70,.05)' : 'rgba(110,70,60,.07)'); gr.addColorStop(1, 'rgba(120,80,70,0)');
      c.globalAlpha = 1; c.fillStyle = gr; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
    }
    $('paper').style.backgroundImage = `url(${cv.toDataURL('image/jpeg', .85)})`;
  } catch (e) {}
}

/* =========================================================
   ④ 熱氣球的飛行排程
   每顆氣球都有自己的升空時間 tL 與降落時間：
   升空前 27 分鐘在地上充氣（先躺著用風扇灌冷風，再噴火把球立起來）→ 升空 → 隨風飄 → 降落收球。
   同一層的氣球會互相讓開，不會疊在一起。
   ========================================================= */
let wind = 0, windT = 0;
function resetFlights() {
  balloons.forEach(b => { b.landAt = b.tLand; b.ox = 0; b.px = 0; b.py = 0; b.abortK = 0; b.downT = 0; b.gone = false; b.airborne = flyable() && hour > b.tL && hour < b.tLand; });
}
function stepBalloons(dt, mv) {
  const h = hour, fly = flyable();
  const dark = Math.max(night, dusk * .55);
  balloons.forEach(b => {
    // —— 判斷狀態 ——
    let mode = 'hidden', p = 0;
    const inf = b.tL - .45;
    if (b.band !== 'far' && h >= inf && h < b.tL) { if (fly) { mode = 'inflate'; p = (h - inf) / .45; } }
    else if (h >= b.tL && h < b.landAt) {
      if (b.airborne || (fly && h < b.tL + .25)) { mode = 'fly'; b.airborne = true; }
    } else if (b.band !== 'far' && h >= b.landAt && h < b.landAt + .3 && b.airborne) { mode = 'deflate'; p = (h - b.landAt) / .3; }
    if (mode === 'hidden' && h >= b.landAt + .3) b.airborne = false;
    // 天氣變壞：飛在天上的氣球約 6 秒內降落、3 秒收球（用真實秒數，時間暫停時也會降落）
    if (b.gone) mode = 'hidden';
    else if (mode === 'fly' && !fly) b.abortK = Math.min(1, b.abortK + dt / 6);
    if (mode === 'fly' && b.abortK >= 1) { b.downT += dt; mode = b.band === 'far' ? 'hidden' : 'deflate'; p = Math.min(1, b.downT / 3); if (b.downT > 3) { b.gone = true; mode = 'hidden'; } }
    b.mode = mode;
    if (mode === 'hidden') { b.g.style.display = 'none'; if (b.crew) sa(b.crew.g, 'opacity', 0); return; }
    b.g.style.display = '';
    b.burn = Math.max(0, b.burn - dt);
    b.bump = Math.max(0, b.bump - dt * .3);
    b.waveT = Math.max(0, b.waveT - dt);
    const s = b.s, sign = b.flip ? 1 : -1;

      b.ox = clamp(b.ox, -520, 520);

      y = lerp(b.gy, b.alt + b.py, a) - b.bump * 34 * s + Math.sin(time * .7 + b.bob) * 2.4 * s * a * mv;
      b.lx = x;
      if (mv && Math.random() < dt * (.1 + (rise < 1 ? 1.2 : 0) + (desc > 0 && desc < 1 ? .3 : 0))) b.burn = Math.max(b.burn, rand(.4, 1.1));
    } else {
      x = mode === 'deflate' ? (b.lx ?? b.gx) : b.gx; y = b.gy;
      if (mode === 'inflate') {
        u = smooth(.6, 1, p); f = p < .6 ? lerp(.12, 1, p / .6) : 1;
        if (p > .58 && mv) b.burn = Math.max(b.burn, Math.random() < .5 ? .3 : 0);
      } else {
        u = 1 - smooth(0, .35, p); f = lerp(1, .1, smooth(.3, 1, p));
      }
      rot = sign * 90 * (1 - u);
    }
    b.x = x; b.y = y;
    const lift = (47 * f - 9.5) * (1 - u);
    sa(b.g, 'transform', `translate(${f1(x)} ${f1(y - 9.5 * s * (1 - u))}) scale(${f1(s * (b.flip && mode === 'fly' ? -1 : 1))} ${f1(s)})`);

    sa(b.env, 'transform', u < 1 ? `translate(${f1(-sign * lift)} 0) scale(${f1(f)} 1)` : '');
    // —— 光：夜色、噴火 ——
    const burnK = b.burn > 0 ? (.75 + .25 * Math.sin(time * 40 + b.bob)) : 0;
    sa(b.flame, 'opacity', f1(burnK * (mode === 'fly' || u > .5 ? 1 : .6)));
    sa(b.glow, 'opacity', f1(burnK * (.2 + .8 * dark) * (f > .5 ? 1 : .4)));

        const ty = y - 9.5 * s * (1 - u) - lift * s;

      const A = L[i], B = L[j];

      const mx = (A.s + B.s) * 52, my = (A.s + B.s) * 82;

      }
    }
  });
}

/* ---- 谷底車流 ---- */
function pruneTraffic() {   // 時間跳轉時，移走這個時段不該出現的車
  const m = trafficMix(hour).map(x => x[0]);
  for (let i = traffic.length - 1; i >= 0; i--) if (!m.includes(traffic[i].kind)) { traffic[i].g.remove(); traffic.splice(i, 1); }
}
function stepTraffic(dt, mv) {
  lanesR.forEach((L, li) => {
    L.timer -= dt * mv;
    if (L.timer <= 0) {
      L.timer = rand(4, 9);
      const mixW = trafficMix(hour), tot = mixW.reduce((a, b) => a + b[1], 0);
      const inLane = traffic.filter(v => v.lane === li);
      const entryFree = !inLane.some(v => L.dir > 0 ? v.x < 120 : v.x > 960);
      if (tot > 0 && entryFree && traffic.length < 14) {
        let r = Math.random() * tot, kind = mixW[0][0];
        for (const [k, w] of mixW) { r -= w; if (r <= 0) { kind = k; break; } }
        if (kind === 'atv') spawnGroup(li, 'atv', 3 + Math.floor(rand(0, 2)));
        else if (kind === 'horse') spawnGroup(li, 'horse', 2 + Math.floor(rand(0, 3)));
        else spawnVehicle(li, kind);
      }
    }
  });
  const lightOn = smooth(.25, .7, night + dusk * .3);
  for (let i = traffic.length - 1; i >= 0; i--) {
    const V = traffic[i], L = lanesR[V.lane];
    // 保持距離：前方同車道的車太近就減速
    let sp = V.sp * (V.boost > 0 ? 1.6 : 1), lead = null, gap = 1e9;
    traffic.forEach(o => { if (o !== V && o.lane === V.lane) { const d = (o.x - V.x) * L.dir; if (d > 0 && d < gap) { gap = d; lead = o; } } });
    const need = (V.len * (V.kind === 'pickup' ? .4 : .55) + (lead ? lead.len * (lead.kind === 'pickup' ? .6 : .55) : 0)) * RK + 14;
    if (lead && gap < need + 30) sp = Math.min(sp, lead.cur ?? lead.sp) * clamp((gap - need) / 30, 0, 1);
    V.cur = sp;
    V.boost = Math.max(0, (V.boost || 0) - dt);
    V.x += L.dir * sp * dt * mv;
    const y = roadY(V.x) + L.dy;
    sa(V.g, 'transform', `translate(${f1(V.x)} ${f1(y)}) scale(${f1(RK * L.dir)} ${RK})`);
    V.ph += sp * dt * mv * .09;
    if (V.kind === 'horse') V.legs.forEach((l, k) => sa(l.lg, 'transform', `translate(${l.x} -40) rotate(${f1(Math.sin(V.ph + (k % 2 ? Math.PI : 0) + (k > 1 ? 1.2 : 0)) * 20 * (sp > 1 ? 1 : 0))})`));
    if (V.kind === 'horse' || V.kind === 'atv' || V.kind === 'tractor') sa(V.inner, 'transform', `translate(0 ${f1(-Math.abs(Math.sin(V.ph)) * (V.kind === 'horse' ? 2 : 1) * (sp > 1 ? 1 : 0))})`);
    V.lights.forEach(l => sa(l, 'opacity', f1(lightOn)));
    if (V.taillight) sa(V.taillight, 'opacity', f1(lightOn));
    // 越野車揚起沙塵
    if ((V.dust || V.kind === 'horse') && mv && sp > 10 && Math.random() < dt * (V.dust ? 6 : 2.5) * (1 - wx.rain) * (1 - snowCover * .8))
      particle(V.x - L.dir * 16, y - 4, 'url(#dustGrad)', -L.dir * rand(10, 30), rand(-14, -6), rand(1.2, 2.2), rand(4, 7), { g: -2, grow: 14, op: .55 + dusk * .3, layer: $('dustFx') });
    if ((L.dir > 0 && V.x > 1260) || (L.dir < 0 && V.x < -200)) { V.g.remove(); traffic.splice(i, 1); }
  }
}

/* =========================================================
   ④ 表演：百球升空（約 20 秒）／玫瑰谷夕陽（約 20 秒）
   兩場秀互斥：開始其中一場，另一場會先停下。
   ========================================================= */

  } else {

}
function endShow(silent) {

}
function stepShow(dt) {

    if (t > 13 && !F.d) { F.d = 1; H.poser.twirl = 2.4; [0, .5, 1.1, 1.8].forEach(d => setTimeout(() => flash(1288, 545, 20), d * 1000)); }
    if (t > 15 && !F.e) { F.e = 1; balloons.filter(b => b.mode === 'fly' && b.band === 'near').forEach(b => { b.waveT = 3; b.burn = 1; }); }
  } else {

    if (t > .6 && !F.a) { F.a = 1; spawnGroup(1, 'horse', 5); say(900, 400, '騎馬隊出發，去看玫瑰谷夕陽', 2.4); }
    if (t > 3 && !F.b) { F.b = 1; spawnGroup(0, 'atv', 4); }
    if (t > 9 && !F.c) { F.c = 1; spawnGroup(1, 'horse', 3); }
    if (t > 10 && !F.d) { F.d = 1; say(560, 300, '岩壁被夕陽染成粉紅色', 2.4); }
    if (t > 13 && !F.e) { F.e = 1; H.cp0.cup.setAttribute('transform', 'translate(11 -24)'); H.cp1.cup.setAttribute('transform', 'translate(11 -24)'); flock(300, 240, 7, 1); }
    if (t > 17 && !F.f) { F.f = 1; H.cp0.cup.setAttribute('transform', 'translate(11 -16)'); H.cp1.cup.setAttribute('transform', 'translate(11 -16)'); }
  }

}

/* =========================================================
   ⑤ 互動：聲音（Web Audio 即時合成，不使用任何音檔、沒有人聲）
   聲音分兩條軌：音樂軌（兩場秀的配樂）與音效軌（點擊音效）。
   同一條軌一次只播一段：新的開始時舊的淡出，不會疊在一起；
   音樂播放時音效自動轉小聲；按「聲音：關」立刻全部停止。
   畫面不會自己發出聲音，所有聲音都要點了才響。
   ========================================================= */
let actx = null, master = null, soundOn = true, userGesture = false, noiseBuf = null, rainNode = null, windNode = null;
function ensureAudio() {

    if (!AC) return null;
    useCtx(new AC());
  }

}
function useCtx(c) {

  master.connect(comp); comp.connect(actx.destination);
}
let pickAudio = false;

}

  g.gain.setValueAtTime(kind === 'sfx' && now < musicUntil ? .35 : (kind === 'music' ? .64 : 1) /* 音樂軌 ×0.64（2026-11-24 兩次各調降 20%） */, now);
  busNow[kind] = g;
  if (kind === 'music') { musicUntil = now + len; if (busNow.sfx) busNow.sfx.gain.setTargetAtTime(.35, now, .05); try { window.sceneMusic && window.sceneMusic.duck(len); } catch (e) {} }
  OUT = g; return g;
}
function stopMusic() { const g = busNow.music; if (g && actx) { const now = actx.currentTime; g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now); g.gain.linearRampToValueAtTime(.0001, now + .2); setTimeout(() => g.disconnect(), 300); busNow.music = null; musicUntil = 0; } }

  if (!actx) return;
  ['music', 'sfx'].forEach(k => { const g = busNow[k]; if (g) { const now = actx.currentTime; g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(.0001, now); setTimeout(() => g.disconnect(), 100); busNow[k] = null; } });

}
function envG(t, a, d, v, dest = OUT) { const g = actx.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d); g.connect(dest); return g; }

  s.connect(f); f.connect(envG(t, .004, dur, vol, dest)); s.start(t); s.stop(t + dur + .1); return f;
}
/* 音名 → 頻率 */
const NOTE = (() => { const m = {}, names = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B']; for (let o = 2; o <= 6; o++) names.forEach((n, i) => { m[n + o] = 440 * Math.pow(2, (o * 12 + i - 57) / 12); }); m.Fs4 = m.Gb4; m.Fs5 = m.Gb5; m.Fs3 = m.Gb3; return m; })();
/* 樂器 */
function ney(f, t, dur, v, dest = OUT) {   // 蘆葦笛：很重的氣聲＋柔和的基音，長音慢慢加顫音
  const g = actx.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + .12); g.gain.setValueAtTime(v * .85, t + Math.max(.13, dur - .1)); g.gain.linearRampToValueAtTime(.0001, t + dur + .12); g.connect(dest);
  const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = f * 3; lp.connect(g);
  const o = osc('sine', f, t, dur + .15, lp);
  const h = actx.createGain(); h.gain.value = .22; h.connect(lp); const o2 = osc('triangle', f * 2, t, dur + .15, h);
  if (dur > .45) { const lfo = actx.createOscillator(); lfo.frequency.value = 5; const lg = actx.createGain(); lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(f * .014, t + dur); lfo.connect(lg); lg.connect(o.frequency); lg.connect(o2.frequency); lfo.start(t); lfo.stop(t + dur + .15); }

  osc('triangle', f, t, 1.2, envG(t, .003, 1.1, v, dest));

  for (let i = 0; i < n; i++) {

function bendir(t, v, dest = OUT) { const o = osc('sine', 80, t, .5, envG(t, .004, .45, v, dest)); o.frequency.exponentialRampToValueAtTime(52, t + .3); nz(t, .12, 300, v * .3, 'lowpass', .7, dest); }

/* 百球升空：D 庫爾迪調式（D E♭ F G A B♭ C），蘆葦笛獨奏 → 卡農琴琶音 → 框鼓進來 → 高潮 */
function playBalloon() {
  if (!ok()) return;
  const out = bus('music', 20.5), t0 = actx.currentTime + .05, n = k => NOTE[k];
  pad([n('D3'), n('A3')], t0, 20, .05, out);
  // 0–6 秒：日出前的蘆葦笛
  [['A4', 0, 1.4], ['G4', 1.4, .45], ['A4', 1.85, .4], ['Bb4', 2.25, .7], ['A4', 2.95, 1.1], ['G4', 4.05, .4], ['F4', 4.45, .4], ['Eb4', 4.85, .45], ['D4', 5.3, 1.1]].forEach(([k, t, d]) => ney(n(k), t0 + t, d, .2, out));
  // 6–14 秒：卡農琴琶音（像氣球一顆顆升起）
  const ARP = [['D4', 'F4', 'A4', 'D5'], ['Eb4', 'G4', 'Bb4', 'Eb5'], ['C4', 'F4', 'A4', 'C5'], ['D4', 'G4', 'Bb4', 'D5']];
  for (let bar = 0; bar < 4; bar++) ARP[bar].concat(ARP[bar].slice(1, 3).reverse()).concat([ARP[bar][3], ARP[bar][2]]).forEach((k, i) => kanun(n(k), t0 + 6 + bar * 2 + i * .25, .1, out));
  [['D5', 6.5, .9], ['C5', 7.4, .4], ['Bb4', 7.8, .4], ['A4', 8.2, 1.2], ['Bb4', 9.6, .5], ['C5', 10.1, .5], ['D5', 10.6, .9], ['Eb5', 11.5, .5], ['D5', 12, .5], ['C5', 12.5, .5], ['D5', 13, 1]].forEach(([k, t, d]) => ney(n(k), t0 + t, d, .17, out));
  for (let b = 0; b < 8; b++) bendir(t0 + 6 + b, b % 2 ? .12 : .2, out);
  // 14–18 秒：高潮（太陽出來、滿天氣球）
  const MEL = [['F5', 14, .5], ['Eb5', 14.5, .25], ['D5', 14.75, .25], ['Eb5', 15, .5], ['F5', 15.5, .5], ['G5', 16, .75], ['F5', 16.75, .25], ['Eb5', 17, .5], ['D5', 17.5, 1.4]];
  MEL.forEach(([k, t, d]) => { ney(n(k), t0 + t, d, .2, out); kanun(n(k) / 2, t0 + t, .08, out); });
  for (let b = 0; b < 8; b++) { const t = t0 + 14 + b * .5; if (b % 2 === 0) bendir(t, .22, out); else tek(t, .08, out); }
  [['D4', 'A4', 'D5'], ['Bb3', 'F4', 'D5'], ['C4', 'G4', 'Eb5'], ['D4', 'A4', 'F5']].forEach((ch, i) => ch.forEach((k, j) => kanun(n(k), t0 + 14 + i + j * .03, .09, out)));

  ['D4', 'Eb4', 'F4', 'G4', 'A4', 'Bb4', 'C5', 'D5', 'Eb5', 'F5', 'G5', 'A5', 'D6'].forEach((k, i) => kanun(n(k), t0 + 18.2 + i * .05, .07, out));
  ['D4', 'A4', 'D5', 'F5'].forEach(k => kanun(n(k), t0 + 18.9, .1, out));

  // 服務生來回端早餐
  const W = H.waiter;
  W.g.style.display = hour > 23 || hour < 5.5 ? 'none' : '';
  if (W.pause > 0) W.pause -= dt; else {
    W.x += W.dir * 26 * dt * mv;
    if (W.x > 1600) { W.dir = -1; W.pause = 1.5; } if (W.x < 1340) { W.dir = 1; W.pause = 1.5; }
    W.ph += dt * 8 * mv;
  }
  poseLegs(W, W.ph, W.pause > 0 ? 0 : 20);
  sa(W.g, 'transform', `translate(${f1(W.x)} 598) scale(${W.dir * 1.08} 1.08)`);
  // 貓甩尾巴
  H.cat.t = Math.max(0, H.cat.t - dt);
  sa(H.cat.tail, 'd', `M6 -2C14 -2 ${f1(16 + Math.sin(time * 2.2) * 3 * mv)} -8 ${f1(14 + Math.sin(time * 2.2 + 1) * 5 * mv)} -14`);
  sa(H.cat.head, 'transform', H.cat.t > 0 ? 'rotate(-12 0 -19) translate(0 -1)' : '');
  // 狗
  Lf.dog.t = Math.max(0, Lf.dog.t - dt);
  sa(Lf.dog.tail, 'transform', Lf.dog.t > 0 ? `rotate(${f1(Math.sin(time * 18) * 22)} -16 -6)` : '');
  sa(Lf.dog.head, 'transform', Lf.dog.t > 0 ? 'rotate(-14 14 -4)' : '');
  // 看氣球的人：氣球飛起來時會舉手指
  const anyFly = balloons.some(b => b.mode === 'fly');
  sa(Lf.s0.arm, 'transform', anyFly && Math.sin(time * .4) > .2 ? 'rotate(-120 1 -19)' : '');
  // 早上偶爾一群鴿子從鴿舍飛出來（不出聲）
  pigeonClock -= dt * mv;
  if (pigeonClock < 0) { pigeonClock = rand(25, 45); if (hour > 6.5 && hour < 18 && !storm) flock(pigeonHouse.x, pigeonHouse.y, 5, Math.random() < .5 ? -1 : 1, 'pigeon'); }

  // 補間、粒子、飛鳥
  for (let i = tweens.length - 1; i >= 0; i--) { const tw = tweens[i]; tw.t += dt; const k = clamp(tw.t / tw.dur, 0, 1); tw.fn(k); if (k >= 1) { tweens.splice(i, 1); tw.done && tw.done(); } }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt;
    if (p.life <= 0) { p.n.remove(); parts.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += (p.vx + gust * 30) * dt; p.y += p.vy * dt;
    if (p.y > p.floor) { p.y = p.floor; p.vy *= -.4; p.vx *= .7; }
    const k = p.life / p.max;
    sa(p.n, 'cx', f1(p.x)); sa(p.n, 'cy', f1(p.y)); sa(p.n, 'r', f1(p.r + (1 - k) * p.grow));
    sa(p.n, 'opacity', f1(Math.min(1, k * 2) * p.op));
  }
  // 大風：沙塵一團團吹過
  if (storm > .3 && mv && Math.random() < dt * 5 * storm) particle(1650, rand(300, 560), 'url(#dustGrad)', -rand(160, 260), rand(-10, 10), rand(5, 8), rand(20, 40), { g: 0, grow: 40, op: .4, layer: $('dustFx') });
  for (let i = birds.length - 1; i >= 0; i--) {
    const b = birds[i]; b.t += dt;
    if (b.t > b.life) { b.g.remove(); birds.splice(i, 1); continue; }
    b.x += b.vx * dt; b.y += b.vy * dt; b.vy *= .99;
    sa(b.g, 'transform', `translate(${f1(b.x)} ${f1(b.y)}) scale(${b.vx < 0 ? -b.k : b.k} ${f1(b.k * (.5 + .5 * Math.abs(Math.sin(b.t * 14 + b.ph))))})`);
    sa(b.g, 'opacity', f1(Math.min(1, (b.life - b.t) * 2)));
  }
}

/* ---------------- ⑤ 互動：綁定 ---------------- */
function bindAll() {
  onAct($('sunG'), () => { sunBump = 14; sfx('chime'); if (show.on) endShow(true); setTime(22); });
  onAct($('moonG'), () => { sfx('chime'); if (show.on) endShow(true); setTime(6.4); });
  clouds.forEach(c => onAct(c.g, () => { c.rain = 2.4; sfx(wx.rain > .5 ? 'thunder' : 'drops'); }));
  $('skyHit').addEventListener('click', e => { userGesture = true; ensureAudio(); const p = svgPoint(e); if (p.y < 330) skyClick(p.x, p.y); });
  onAct(erciyesHit, () => { sfx('chime'); say(1300, 96, '埃爾吉耶斯山：近 4000 公尺高的死火山', 2.8); });
  onAct(castleHit, () => { sfx('flag'); flagT += 4; say(200, 60, '烏奇薩城堡：整座岩山挖成的蜂窩城', 2.8); });
  valleyHits.forEach(v => onAct(v.hit, () => { sfx('stone'); say(v.c.x, v.c.top - 30, FACTS[factI++ % FACTS.length], 2.8); }));
  onAct(pigeonHouse.g, () => { flock(pigeonHouse.x, pigeonHouse.y, 10, Math.random() < .5 ? -1 : 1, 'pigeon'); sfx('coo'); say(912, 350, '鴿糞是葡萄園最好的肥料', 2.4); });
  balloons.forEach(b => onAct(b.g, () => {
    b.burn = 1.6; sfx('burner');
    if (b.mode === 'fly') { b.bump = 1; b.waveT = 2.6; if (b.s > .6 && Math.random() < .5) setTimeout(() => say(b.x, b.y - 160 * b.s, pick(['看得到城堡！', '好多氣球喔', '早安，卡帕多奇亞']), 1.8), 300); }
    else if (b.mode === 'inflate') say(b.x, b.y - 60, '噴火把氣球立起來', 1.6);
  }));
  traffic.length; // 車子是動態產生的，點擊事件在 svg 上統一判斷
  $('traffic').addEventListener('click', e => {
    const node = e.target.closest('#traffic > g'); if (!node) return;
    e.stopPropagation(); userGesture = true; ensureAudio();
    const V = traffic.find(v => v.g === node); if (!V) return;
    const y = roadY(V.x) - 50;
    if (V.kind === 'horse') { sfx('neigh'); say(V.x, y, '卡帕多奇亞是「美麗駿馬之地」', 2.6); }
    else if (V.kind === 'atv') { sfx('engine'); V.boost = 1.5; }
    else if (V.kind === 'pickup') { sfx('car'); say(V.x, y, hour < 7 ? '載著籐籃去升空場' : '去追降落的氣球', 2); }
    else if (V.kind === 'tractor') { sfx('chug'); say(V.x, y, '下田照顧葡萄和杏桃', 2); }
    else { sfx('car'); V.boost = 1; }
  });
  $('traffic').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); } });
  onAct(nazar.g, () => { nazar.t = 2.6; sfx('beads'); say(120, 380, '藍色邪眼：替你擋掉壞運氣', 2.4); });
  onAct(H.poser.g, () => { H.poser.twirl = 2; sfx('twirl'); setTimeout(() => { flash(1288, 545, 20); sfx('shutter'); }, 500); });
  [H.up0, H.up1].forEach((u, i) => onAct(u.g, () => { sfx('tap'); say(i ? 1160 : 1306, 360, pick(['你看那顆彩虹氣球！', '城堡就在那邊', '好像在作夢']), 2); }));
  onAct(H.cam.g, () => { sfx('shutter'); flash(1280, 545, 20); });
  onAct(H.couple, () => {
    sfx('clink');
    H.cp0.cup.setAttribute('transform', 'translate(11 -24)'); H.cp1.cup.setAttribute('transform', 'translate(11 -24)');
    setTimeout(() => { H.cp0.cup.setAttribute('transform', 'translate(11 -16)'); H.cp1.cup.setAttribute('transform', 'translate(11 -16)'); }, 1400);
    say(1500, 500, '乾杯！土耳其紅茶', 1.8);
  });
  onAct(H.waiter.g, () => { H.waiter.pause = 2; sfx('clink'); say(H.waiter.x, 520, '紅茶和早餐來囉', 1.8); });
  onAct(H.cat.g, () => { H.cat.t = 1.8; sfx('meow'); });
  lanterns.forEach(L => onAct(L.sw.parentNode, () => { lanterns.forEach((M, i) => setTimeout(() => M.force = 2.4, i * 120)); sfx('beads'); }));
  onAct(Lf.sv, () => { sfx('shutter'); flash(250, 470, 14); say(240, 440, '好多氣球！', 1.6); });
  onAct(Lf.tea.g, () => { sfx('pour'); say(336, 470, '來杯土耳其紅茶', 1.8); });
  onAct(Lf.dog.g, () => { Lf.dog.t = 2; sfx('woof'); });
  svg.parentNode.addEventListener('pointermove', e => { const p = svgPoint(e); mouse.x = p.x; mouse.y = p.y; mouse.on = true; if (Math.hypot(p.x - mouse.lx, p.y - mouse.ly) > 30) { mouse.lx = p.x; mouse.ly = p.y; bloom(p.x, p.y); } });
  svg.parentNode.addEventListener('pointerleave', () => { mouse.on = false; });

  $('btnShow').addEventListener('click', () => { userGesture = true; ensureAudio(); startShow('balloon'); });
  $('btnSunset').addEventListener('click', () => { userGesture = true; ensureAudio(); startShow('sunset'); });
  $('btnWeather').addEventListener('click', () => { userGesture = true; ensureAudio(); setWeather((wxIdx + 1) % WX.length); });
  $('btnSound').addEventListener('click', () => {
    soundOn = !soundOn; userGesture = true; ensureAudio();
    if (master) master.gain.setValueAtTime(soundOn ? .55 : 0, actx.currentTime);
    if (!soundOn) { stopAll(); rainSound(false); windSound(false); try { window.sceneMusic && window.sceneMusic.stop(); } catch (e) {} }
    else { rainSound(WX[wxIdx][0] === 'rain'); windSound(WX[wxIdx][0] === 'wind'); }
    sa($('btnSound'), 'aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  });
  $('btnDawn').addEventListener('click', () => { if (show.on) endShow(true); setTime(6.4); });
  $('btnDay').addEventListener('click', () => { if (show.on) endShow(true); setTime(13); });
  $('btnDusk').addEventListener('click', () => { if (show.on) endShow(true); setTime(18.4); });
  $('btnNight').addEventListener('click', () => { if (show.on) endShow(true); setTime(22); });
  $('btnAuto').addEventListener('click', () => { T.auto = !T.auto; sa($('btnAuto'), 'aria-pressed', String(T.auto)); });
  const tr = $('timeRange');
  tr.addEventListener('input', () => { if (show.on) endShow(true); T.dragging = true; T.t = tr.value / 1000; applyColors(true); resetFlights(); pruneTraffic(); });
  tr.addEventListener('change', () => { T.dragging = false; });
  window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
  window.addEventListener('pointerdown', () => document.body.classList.remove('kbd'));
  mq.addEventListener && mq.addEventListener('change', () => { reduced = mq.matches; });
}

/* ---------------- 初始化 ---------------- */
function init() {
  drawSky();
  drawRays();
  WOB = 2.4; drawFar();
  WOB = 1.6; drawMesa(); drawCastle(); drawField(); drawTown(); drawValley(); drawRoad(); drawLeft();
  WOB = 0; drawLeftLife();
  WOB = 1.2; drawHotel(); WOB = 0;
  watercolorize();
  drawHotelLife();
  drawBalloons();
  drawMist();
  paperGrain();
  bindAll();
  if (reduced) { T.auto = false; sa($('btnAuto'), 'aria-pressed', 'false'); }
  setWeather(0);
  applyColors(true);
  resetFlights();
  // 一開場谷底就有車在跑
  spawnVehicle(0, 'pickup').x = 420; spawnVehicle(1, 'van').x = 760; spawnVehicle(1, 'pickup').x = 180;
  step(1 / 60);
  requestAnimationFrame(loop);
  // 網站「作者精選」播放區：預設輪播「百球升空」（不算使用者點擊，不會自己出聲）
  const inPicks = (() => { let top = true; try { top = window.top === window; } catch (e) { top = false; } return !!document.getElementById('pure-art') && !top; })();
  if (inPicks) {
    setTimeout(() => startShow('balloon', true), 800);
    setInterval(() => { if (!show.on) startShow('balloon', true); }, 4000);
    window.sceneMusic = {
      playing: false,
      start(c) {
        if (this.playing) return; this.playing = true; pickAudio = true;
        if (c && c !== actx) useCtx(c); else ensureAudio();
        if (actx && actx.state !== 'running') actx.resume();
        if (show.on && show.t < 3) playBalloon();
      },
      stop() { this.playing = false; pickAudio = false; stopAll(); },
      duck() {}
    };
  }
}
init();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on && show.kind,
  btn: { balloon: 'btnShow', sunset: 'btnSunset' },
  ff: () => { show.flags = new Proxy({}, { get: () => 1 }); show.t = show.dur - .02; },
  save: () => ({ t: T.t, auto: T.auto, w: wxIdx }),
  stop: () => endShow(true),
  restore: s => { if (wxIdx !== s.w) setWeather(s.w); T.t = s.t; T.auto = s.auto; $('btnAuto') && $('btnAuto').setAttribute('aria-pressed', String(T.auto)); applyColors(true); }
});
/* /ShowStop */
})();
</script>
