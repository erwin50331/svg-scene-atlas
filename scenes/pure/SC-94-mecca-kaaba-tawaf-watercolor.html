<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>麥加天房的萬人繞行</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-94 麥加天房的萬人繞行｜水彩感 watercolor
   地點：沙烏地阿拉伯・麥加，禁寺（Masjid al-Haram）。
        站在禁寺北側擴建區的屋頂平台，越過大理石欄杆往南看：
        正中間是罩著黑色帷幔（kiswa）、腰間一圈金色刺繡帶的卡巴天房，
        左面有離地約兩公尺的金色大門，東角（最左邊的角）鑲著用銀框包住的黑石；
        天房右前方是白色的半圓矮牆（伊斯瑪儀半圓牆 Hijr Ismail），左前方是金色罩子的易卜拉欣立足處；
        四周的白色大理石繞行廣場（mataf）上，朝聖者逆時針繞行天房（從上面看是逆時針，所以靠我們這一側的人往右走）；
        後面是有一排排小圓頂的鄂圖曼迴廊、三層拱廊的擴建大樓與十多座宣禮塔，
        最後面是 601 公尺高的麥加皇家鐘塔，以及周圍的旅館大樓、施工吊車與黑褐色的花崗岩山丘。
   尊重宗教：畫面只有一般朝聖者，沒有任何宗教人物的形象；不放合成人聲（沒有宣禮的人聲），
            天房帷幔上的經文用抽象的金色花紋表示，不寫出文字。
   水彩做法：不用即時濾鏡（太耗效能），改成畫的時候一次做好——
            顏料毛邊（路徑微微抖動）、邊緣顏料堆積（半透明深色描邊）、
            一層層半透明的疊色（glaze）、暈染斑塊，以及一張蓋在最上面的水彩紙紋。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   --d-名稱 = 白天、--n-名稱 = 夜晚、--k-名稱 = 黃昏（--n／--k 可省略，省略時程式自動算出夜色與暮色）。
   JS 依時間混色，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（線色）兩個 class。
   沒有 --d- 前綴的（例如 --lamp）是固定色，不隨日夜改變。
   ========================================================= */
:root{
  color-scheme: light;
  /* —— 天空 —— */
  --d-skyT:#3f8fd6; --k-skyT:#5d5aa8; --n-skyT:#0b1536;
  --d-skyM:#8cc2ea; --k-skyM:#e48a9c; --n-skyM:#1b2752;
  --d-skyB:#eef3ea; --k-skyB:#ffc88a; --n-skyB:#3a3a6a;
  --d-cloud:#ffffff; --k-cloud:#ffdcc4; --n-cloud:#3e4878;
  --d-cloudSh:#c2d4ea; --k-cloudSh:#e8989e; --n-cloudSh:#2a3360;
  /* —— 麥加的黑褐色花崗岩山丘 —— */
  --d-hill:#9a7866; --k-hill:#a66a6c; --n-hill:#272338;
  --d-hillLt:#c49e80; --k-hillLt:#d88c74; --n-hillLt:#35324c;
  --d-hillSh:#6a5050; --k-hillSh:#74485a; --n-hillSh:#1a1828;
  --d-haze:#ece2d4; --k-haze:#ffcaa2; --n-haze:#2e3262;
  /* —— 城市：旅館大樓 —— */
  --d-city:#f0e4ce; --k-city:#f6c8a8; --n-city:#4a4a6c;
  --d-city2:#dccab0; --k-city2:#e0a890; --n-city2:#3c3e5c;
  --d-citySh:#a8948a; --k-citySh:#a6787e; --n-citySh:#272944;
  --d-win:#7d93aa; --k-win:#9a7a8a; --n-win:#1e2444;
  --d-crane:#d8a43c; --n-crane:#3a3a50;
  /* —— 麥加皇家鐘塔 —— */
  --d-tower:#eadcc2; --k-tower:#f8c69c; --n-tower:#6c6884;
  --d-towerSh:#b8a48a; --k-towerSh:#c48a7a; --n-towerSh:#40405c;
  --d-towerDk:#86745f; --k-towerDk:#8a5a5a; --n-towerDk:#2a2a44;
  --d-gold:#d9a63c; --k-gold:#f2a848; --n-gold:#e4b656;
  --d-goldDk:#99681e; --k-goldDk:#a8582a; --n-goldDk:#8e6a2c;
  --d-goldLt:#f6d47c; --k-goldLt:#ffd890; --n-goldLt:#f8de90;
  --d-clock:#f8f6ee; --k-clock:#fff0dc; --n-clock:#f2fff6;
  --d-clockRim:#2f7a52; --n-clockRim:#3ccf80;
  /* —— 禁寺：擴建大樓的拱廊、鄂圖曼迴廊、宣禮塔 —— */
  --d-arc:#f2eadb; --k-arc:#f8d0b0; --n-arc:#a69c96;
  --d-arcSh:#cdbda6; --k-arcSh:#d6a090; --n-arcSh:#6e6674;
  --d-arcDk:#8c7c6c; --k-arcDk:#8a5c5c; --n-arcDk:#e6b866;
  --d-otto:#ece0cc; --k-otto:#f6cbae; --n-otto:#b0a294;
  --d-dome:#aeb2ba; --k-dome:#b49aa4; --n-dome:#525672;
  --d-domeSh:#81869a; --k-domeSh:#8a7286; --n-domeSh:#363a54;
  --d-min:#f4eddf; --k-min:#ffd4b2; --n-min:#d0c4b0;
  --d-minSh:#c6b59c; --k-minSh:#d49a88; --n-minSh:#8a7e7c;
  /* —— 繞行廣場的白色大理石 —— */
  --d-marble:#faf7f1; --k-marble:#fcdcc2; --n-marble:#dddfe8;
  --d-marble2:#ebe5da; --k-marble2:#efc4ac; --n-marble2:#babdd0;
  --d-marbleSh:#c9d2e0; --k-marbleSh:#d6a6aa; --n-marbleSh:#8a91ae;
  /* —— 卡巴天房：黑色帷幔、金色刺繡帶、大門、銀框黑石、大理石底座 —— */
  --d-kaaba:#1f1d26; --k-kaaba:#271b24; --n-kaaba:#16141e;
  --d-kaabaHi:#4c4860; --k-kaabaHi:#5c3c48; --n-kaabaHi:#3a3652;
  --d-kaabaLo:#0e0d14; --n-kaabaLo:#09080e;
  --d-roof:#c2bfb8; --n-roof:#5c5c70;
  --d-skirt:#ede9e1; --n-skirt:#bcbccc;
  --d-silver:#dfe3ea; --n-silver:#c4c8d8;
  /* —— 人物：戒衣（兩塊沒有縫線的白布）、膚色、髮色、女生以白、黑為主 —— */
  --d-ihram:#fdfdfa; --k-ihram:#ffe8d6; --n-ihram:#e8eaf4;
  --d-ihramSh:#bfcbe0; --k-ihramSh:#e0a8a8; --n-ihramSh:#9aa3c4;
  --d-skin1:#f2d0b0; --n-skin1:#c8a896; --d-skin2:#d8a47c; --n-skin2:#ae8670;
  --d-skin3:#a8704a; --n-skin3:#86604a; --d-skin4:#6e4430; --n-skin4:#583a30; --d-skin5:#c08a5e; --n-skin5:#9a7058;
  --d-hair1:#231d1f; --d-hair2:#5c4030; --d-hair3:#cfcac2;
  --d-c1:#25232c; --n-c1:#1c1a24; --d-c2:#f3eee2; --n-c2:#d0d0dc; --d-c3:#2b8f8a; --d-c4:#e2772c; --d-c5:#3b9658;
  --d-c6:#7a48a2; --d-c7:#e486a6; --d-c8:#2c3f7a; --d-c9:#d8a63a; --d-c10:#c8403a; --d-c11:#68a6d8; --d-c12:#cdb690;
  --d-thobe:#fbfaf6; --n-thobe:#dcdeea; --d-shemagh:#c8343a;
  --d-shade:#3a3a5a;
  /* —— 屋頂平台的大理石欄杆、鴿子、滲滲泉水飲水桶 —— */
  --d-para:#f5efe4; --k-para:#f8d4b6; --n-para:#9896b0;
  --d-paraSh:#d4c8b6; --k-paraSh:#d6a898; --n-paraSh:#626080;
  --d-paraDk:#a89880; --k-paraDk:#a07068; --n-paraDk:#444262;
  --d-pig:#9ca2ae; --n-pig:#5a6074; --d-pigDk:#5c6272; --n-pigDk:#363a4c;
  --d-pigNeck:#5a9886; --d-pigNeck2:#9a6aa2; --d-pigFoot:#d8706a;
  --d-cooler:#eef0f2; --n-cooler:#a8aabc; --d-coolerDk:#98a2b0; --n-coolerDk:#5a6078; --d-coolerTap:#3a8ad0;
  --d-chair:#3c7c5a; --d-wheel:#3a3e4a;

  /* —— 固定色：燈光、天體、特效 —— */
  --sun:#ffd166; --sunCore:#fff3c8; --moon:#f7f0d4; --star:#fff6da;
  --lamp:#ffe6a2; --glow:#ffd47a; --green:#3fe08a; --greenDk:#1fa060; --flashW:#f4fff8; --sunlit:#ffc36a;
  --phone:#cfe8ff; --craneLight:#ff4a3a;
  --rainc:#b4c4d8; --wx-cloud:#97a0b2; --wx-rain:#38465e; --wx-dust:#d4aa6a;
  --nightBase:#151b40; --duskBase:#ff9a6a;

  /* —— 頁面介面 —— */
  --page-bg:#f6f3ec; --page-fg:#22283a; --page-muted:#646a78;
  --ui-surface:#ffffff; --ui-line:#dcd8d0; --ui-accent:#b8742a; --ui-accent-2:#2f7a62;
  --cine-shade:#000000; --cine-light:#fff3dc;
  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{position:relative;margin:0;border-radius:14px;overflow:hidden;background:var(--skyB,#eef3ea);line-height:0;box-shadow:0 2px 12px #0000001f}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
/* 水彩紙紋：用一層 HTML 疊在畫面上（比放在 SVG 裡面省效能） */
#paper{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;background-size:100% 100%;opacity:.5}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:12px;padding:10px 14px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--page-fg);border-color:var(--page-fg);color:#fff;font-weight:700}
.panel button.big{border-color:var(--ui-accent);color:#fff;background:var(--ui-accent);font-weight:700}
.panel button.big.alt{border-color:var(--ui-accent-2);background:var(--ui-accent-2)}
.panel button.big.on{background:#f2b632;border-color:#f2b632;color:var(--page-fg)}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid var(--ui-accent);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable,#scene [role="button"]{cursor:pointer}
#scene .bubble rect{fill:#ffffff;stroke:#22283a;stroke-width:1.6}
#scene .bubble text{fill:#22283a;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .bubble .pop{animation:pop var(--dur,1.6s) ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){ #scene .bubble .pop{animation:none} }
</style>
<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。
   想恢復完整版，刪掉這整段 <style id="pure-art"> 即可。
   ========================================================= */
html,body{height:100%;margin:0!important;overflow:hidden}
body{display:flex!important;align-items:center;justify-content:center;padding:0!important}
body>.wrap{width:100%!important;max-width:min(100vw,calc(100vh * 8 / 3))!important;
  margin:0!important;padding:0!important;gap:0!important;display:block!important}
body>.wrap>:not(.stage){display:none!important}
body>.wrap>.stage{width:100%!important;max-width:100%!important;margin:0!important;
  border:0!important;border-radius:0!important;box-shadow:none!important}
</style>
</head>
<body>
<main class="wrap">
  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：天空（漸層、暈染、太陽月亮、星星、雲）
       → 遠景（花崗岩山丘、旅館大樓與吊車、麥加皇家鐘塔）
       → 中景（擴建大樓的三層拱廊與宣禮塔、鄂圖曼迴廊、大理石繞行廣場、
               天房後方的人潮、卡巴天房、半圓牆、天房前方的人潮與易卜拉欣立足處）
       → 近景（屋頂平台的大理石欄杆、欄杆上的鴿子、屋頂上的朝聖者與飲水桶）
       → 鴿群 → 天氣 → 表演氛圍
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="水彩風格的麥加禁寺：正中間是罩著黑色帷幔、腰間有金色刺繡帶的卡巴天房，左面有金色大門；四周白色大理石廣場上，穿白色戒衣和各色長袍的朝聖者一圈圈繞行天房；後面是有小圓頂的鄂圖曼迴廊、三層拱廊和宣禮塔，最後面是高聳的皇家鐘塔與黑褐色的山丘；前景是屋頂平台的大理石欄杆，欄杆上停著鴿子，幾位朝聖者靠在欄杆邊往下看。">
    <defs>
      <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--skyT)"/><stop offset=".55" style="stop-color:var(--skyM)"/><stop offset="1" style="stop-color:var(--skyB)"/>
      </linearGradient>
      <linearGradient id="hazeG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--haze);stop-opacity:0"/><stop offset="1" style="stop-color:var(--haze);stop-opacity:.6"/>
      </linearGradient>
      <radialGradient id="glowG"><stop offset="0" style="stop-color:var(--glow);stop-opacity:.9"/><stop offset="1" style="stop-color:var(--glow);stop-opacity:0"/></radialGradient>
      <radialGradient id="greenG"><stop offset="0" style="stop-color:var(--green);stop-opacity:.95"/><stop offset="1" style="stop-color:var(--green);stop-opacity:0"/></radialGradient>
      <radialGradient id="whiteG"><stop offset="0" style="stop-color:var(--flashW);stop-opacity:.95"/><stop offset="1" style="stop-color:var(--flashW);stop-opacity:0"/></radialGradient>
      <radialGradient id="sunG"><stop offset=".3" style="stop-color:var(--sun);stop-opacity:.6"/><stop offset="1" style="stop-color:var(--sun);stop-opacity:0"/></radialGradient>
      <radialGradient id="moonG"><stop offset=".4" style="stop-color:var(--moon);stop-opacity:.25"/><stop offset="1" style="stop-color:var(--moon);stop-opacity:0"/></radialGradient>
      <!-- 夜裡整個繞行廣場被燈照得發亮 -->
      <radialGradient id="matafLightG" cx=".5" cy=".55" r=".55">
        <stop offset="0" style="stop-color:var(--lamp);stop-opacity:.55"/><stop offset=".6" style="stop-color:var(--lamp);stop-opacity:.22"/><stop offset="1" style="stop-color:var(--lamp);stop-opacity:0"/>
      </radialGradient>
      <!-- 鐘塔的光柱 -->
      <linearGradient id="beamG" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" style="stop-color:var(--flashW);stop-opacity:.5"/><stop offset="1" style="stop-color:var(--flashW);stop-opacity:0"/>
      </linearGradient>
      <!-- 晨光：照在塔頂的暖色 -->
      <linearGradient id="sunlitG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sunlit);stop-opacity:.75"/><stop offset="1" style="stop-color:var(--sunlit);stop-opacity:0"/>
      </linearGradient>
      <radialGradient id="sunlitR"><stop offset="0" style="stop-color:var(--sunlit);stop-opacity:.8"/><stop offset=".6" style="stop-color:var(--sunlit);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--sunlit);stop-opacity:0"/></radialGradient>
      <!-- 水彩暈染斑塊（中心濃、邊緣淡） -->
      <radialGradient id="bloomW"><stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset=".7" stop-color="#ffffff" stop-opacity=".2"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
      <radialGradient id="dustG" cx=".5" cy="1" r="1"><stop offset="0" style="stop-color:var(--wx-dust);stop-opacity:.75"/><stop offset="1" style="stop-color:var(--wx-dust);stop-opacity:.3"/></radialGradient>
      <clipPath id="frameClip"><rect x="0" y="0" width="1600" height="600"/></clipPath>
    </defs>

    <g clip-path="url(#frameClip)">
    <!-- ===== 場景：天空 ===== -->
    <rect x="0" y="0" width="1600" height="600" fill="url(#skyG)"/>
    <g id="skyWash" pointer-events="none"></g>
    <rect id="skyTint" x="0" y="0" width="1600" height="330" opacity="0" pointer-events="none"/>
    <rect id="skyHit" x="0" y="0" width="1600" height="170" fill="transparent" class="clickable" tabindex="0" role="button" aria-label="天空：白天鴿子飛過，夜晚劃過流星"/>
    <g id="stars" pointer-events="none"></g>
    <g id="sun" pointer-events="none"></g>
    <g id="moon" pointer-events="none"></g>
    <g id="clouds" pointer-events="none"></g>
    <g id="overcast" pointer-events="none" opacity="0"></g>
    <g id="birds" pointer-events="none"></g>

    <!-- ===== 場景：遠景（山丘、旅館大樓、施工吊車、皇家鐘塔） ===== -->
    <g id="parFar">
      <g id="hills"></g>
      <g id="city"></g>
      <g id="beams" pointer-events="none" opacity="0"></g>
      <g id="tower"></g>
      <g id="cityLights" pointer-events="none" opacity="0"></g>
      <rect id="farDust" x="-40" y="0" width="1680" height="340" fill="url(#dustG)" opacity="0" pointer-events="none"/>
    </g>

    <!-- ===== 場景：中景（禁寺） ===== -->
    <g id="parMid">
      <g id="floor"></g>
      <g id="arcade"></g>
      <g id="minarets"></g>
      <g id="otto"></g>
      <rect id="midDust" x="-40" y="120" width="1680" height="330" fill="url(#hazeG)" opacity="0" pointer-events="none"/>
      <g id="wet" pointer-events="none" opacity="0"></g>
      <rect id="matafLight" x="160" y="250" width="1280" height="330" fill="url(#matafLightG)" opacity="0" pointer-events="none"/>
      <g id="kShadow" pointer-events="none"></g>
      <g id="flowFar" pointer-events="none"></g>
      <g id="rowsFar" pointer-events="none"></g>
      <g id="crowdFar"></g>
      <g id="kaaba"></g>
      <g id="hijr"></g>
      <g id="flowNear" pointer-events="none"></g>
      <g id="rowsNear" pointer-events="none"></g>
      <g id="crowdNear"></g>
    </g>

    <!-- ===== 場景：近景（屋頂平台） ===== -->
    <g id="parNear">
      <g id="roof"></g>
      <g id="pigeons"></g>
      <g id="roofPeople"></g>
    </g>
    <g id="flock" pointer-events="none"></g>

    <!-- ===== 天氣與氛圍 ===== -->
    <g id="rain" pointer-events="none" opacity="0"></g>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {

      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };

      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {

        g.gain.linearRampToValueAtTime(1, now + 1.9);

    }

  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');

    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }

    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });
    added = [];
  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>
/* ---- 表演氛圍（取代寬銀幕黑邊）：k = 0~1，四周輕微暗角＋中央微亮 ---- */
let cineK = 0, cineW = 0;
function setCine(k, fx, fy) {
  cineK = k = Math.max(0, Math.min(1, k));
  if (k === cineW || (Math.abs(k - cineW) < .004 && k > 0 && k < 1)) return;
  cineW = k;
  const g = document.getElementById('cineFx'); if (!g) return;
  g.setAttribute('opacity', k.toFixed(3));
  if (fx != null) { const G = document.getElementById('cineLightG'); G.setAttribute('cx', (fx / 1600).toFixed(3)); G.setAttribute('cy', (fy / 600).toFixed(3)); }
}

/* =========================================================
   SC-94 麥加天房的萬人繞行｜程式區

/* ---------------- ⑤ 互動：聲音引擎（音樂軌、音效軌分開；同軌的新聲音讓舊的淡出） ---------------- */
let actx = null, master = null, sfxBus = null, musBus = null, noiseBuf = null, soundOn = true, userGesture = false;
let rainGain = null, windGain = null, stepGain = null, musNode = null;
function ensureAudio() {
  if (!actx) {
    const AC = window.__SceneAudioContext || window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
    master = actx.createGain(); master.gain.value = soundOn ? .5 : 0;
    const comp = actx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3;
    master.connect(comp); comp.connect(actx.destination);
    sfxBus = actx.createGain(); sfxBus.connect(master);
    musBus = actx.createGain(); musBus.gain.value = .64; musBus.connect(master);   // 音樂軌預設音量 64%（使用者要求再降 20%）
  }
  if (actx.state === 'suspended' && userGesture) actx.resume();
  return actx;
}
const audioOK = () => actx && actx.state === 'running' && soundOn;
function newTrack() {
  const g = actx.createGain(); g.connect(musBus);
  const old = musNode;
  if (old) { old.gain.setTargetAtTime(0, actx.currentTime, .15); setTimeout(() => { try { old.disconnect(); } catch (e) {} }, 900); }
  musNode = g;
  return g;
}
let OUT = null;
function nbuf() {
  if (!noiseBuf) { noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  return noiseBuf;
}
function gainEnv(t, a, d, v) {
  const g = actx.createGain();
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d);
  g.connect(OUT || sfxBus); return g;
}
function osc(type, f, t, dur, dest) { const o = actx.createOscillator(); o.type = type; o.frequency.value = f; o.connect(dest); o.start(t); o.stop(t + dur + .05); return o; }
function noise(t, dur, freq, vol, type = 'bandpass', q = 1, a = .004) {
  const s = actx.createBufferSource(); s.buffer = nbuf(); s.loop = true;
  const f = actx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  s.connect(f); f.connect(gainEnv(t, a, dur, vol)); s.start(t); s.stop(t + dur + .1); return f;
}
const sfx = fn => { if (!audioOK()) return; OUT = sfxBus; fn(actx.currentTime + .02); OUT = null; };
// 環境聲：雨聲、風聲、人潮的腳步聲（都是濾過的噪音，沒有合成人聲）
function ambient(rain, wind, steps) {
  if (!actx || actx.state !== 'running') return;
  if (!rainGain) {
    const mk = (hpF, lpF) => {
      const s = actx.createBufferSource(); s.buffer = nbuf(); s.loop = true;
      const hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = hpF;
      const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = lpF;
      const g = actx.createGain(); g.gain.value = 0;
      s.connect(hp); hp.connect(lp); lp.connect(g); g.connect(sfxBus); s.start();
      return [g, lp];
    };
    [rainGain] = mk(600, 5000);
    let lp; [windGain, lp] = mk(120, 500);
    const lfo = actx.createOscillator(), lg = actx.createGain(); lfo.frequency.value = .11; lg.gain.value = 200; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
    // 腳步聲：上千雙拖鞋走在大理石上，像遠遠的沙沙聲
    let lp2; [stepGain, lp2] = mk(900, 2600);
    const l2 = actx.createOscillator(), l2g = actx.createGain(); l2.frequency.value = .3; l2g.gain.value = 500; l2.connect(l2g); l2g.connect(lp2.frequency); l2.start();
  }
  const t = actx.currentTime;
  rainGain.gain.setTargetAtTime(rain * .08, t, .3);
  windGain.gain.setTargetAtTime(wind * .05, t, .6);
  stepGain.gain.setTargetAtTime(steps * .022, t, .8);
}
function duckSfx(sec) { if (!actx) return; const t = actx.currentTime; sfxBus.gain.setTargetAtTime(.35, t, .2); sfxBus.gain.setTargetAtTime(1, t + sec, .6); }

/* ---------------- ⑤ 互動：音效 ---------------- */
const hz = n => 440 * Math.pow(2, (n - 69) / 12);
function click(t, v = .07) { noise(t, .03, 2000, v, 'bandpass', 2); }
function shutter(t) { click(t, .08); click(t + .06, .05); }
function glock(t, f, v = .05) { osc('sine', f, t, 1.2, gainEnv(t, .002, 1.1, v)); osc('sine', f * 2, t, .5, gainEnv(t, .002, .45, v * .3)); osc('sine', f * 3, t, .3, gainEnv(t, .002, .25, v * .12)); }
function sweep(type, t, f0, f1_, d, v, lp = 2000) {
  const g = gainEnv(t, .03, d, v); const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; f.connect(g);
  const o = osc(type, f0, t, d, f); o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1_, t + d); return o;
}
// 鴿子咕咕叫（低低的、帶一點顫音）
function coo(t, v = .05) { [0, .42, .7].forEach((d, i) => { const o = sweep('sine', t + d, i === 1 ? 470 : 420, i === 1 ? 360 : 330, i === 1 ? .22 : .32, v * (i === 1 ? .8 : 1), 900); }); }
function flutter(t, n = 10) { for (let i = 0; i < n; i++) noise(t + i * .05 + Math.random() * .02, .05, 900 + Math.random() * 500, .045, 'bandpass', .8); }
function pour(t) { noise(t, .9, 700, .05, 'bandpass', 3, .05); for (let i = 0; i < 6; i++) sweep('sine', t + .1 + i * .13, 500 + Math.random() * 300, 900, .05, .015, 3000); }
function sparkle(t, base = 86) { [0, 4, 7, 12].forEach((n, i) => glock(t + i * .08, hz(base + n), .025)); }
function softBell(t, n, v = .04) { glock(t, hz(n), v); }

/* ---------------- ⑤ 互動：兩首原創配樂（各約 20 秒，旋律每一個音都落在當小節的和弦音上） ----------------
   ① 日落禮拜同心圓：D 小調（和聲小調的 A 大和弦），每小節 1 秒；烏德琴撥分解和弦、蘆葦笛（ney）唱旋律、卡農琴點綴；
      大家開始禮拜時，音樂收成一個很輕的長和弦，禮拜結束、人潮再動起來時旋律才回來。
   ② 晨光鴿群：G 大調 3/4 拍，每小節 1 秒；卡農琴分解和弦、蘆葦笛旋律、手鼓（daf），鴿子振翅跟著第一拍。 */

}

onAct($('hijr'), () => { sfx(t => softBell(t, 77, .025)); say(880, 420, nextLine('hijr', ['伊斯瑪儀半圓牆（Hijr Ismail）', '圍起來的地也算天房的一部分', '所以繞行要從半圓牆外面繞']), 2.2); });

onAct($('floor'), e => { const p = svgPoint(e); sfx(t => softBell(t, 72, .02)); say(clamp(p.x, 200, 1400), clamp(p.y - 30, 360, 520), nextLine('floor', ['繞行廣場鋪著白色大理石', '這種大理石被太陽曬也不太燙腳', '下雨時地面會映出天房的倒影']), 2.2); });
const PIL_LINES = ['我們從印尼來', '從奈及利亞來的朝聖團', '我從土耳其來', '我們全家從巴基斯坦來', '從馬來西亞來', '從埃及來', '第三圈了', '要繞七圈喔', '從黑石那裡開始數', '跟緊我們的團', '第一次來，好感動', '我從孟加拉來'];
hit($('crowdFar'), '天房後方繞行的朝聖者'); hit($('crowdNear'), '天房前方繞行的朝聖者');
hit($('hills'), '花崗岩山丘'); hit($('city'), '旅館大樓');
[$('crowdFar'), $('crowdNear')].forEach(G => onAct(G, e => {
  const p = svgPoint(e);
  let best = null, bd = 1e9;
  crowd.forEach(q => { const d = Math.hypot(q.x - p.x, (q.y - 12 * q.hf) - p.y); if (d < bd) { bd = d; best = q; } });
  if (!best) return;
  best.armT = 1.4; best.arm.style.display = '';
  sfx(t => click(t, .03));
  say(best.x, best.y - 50, nextLine('pil', PIL_LINES), 1.8);
}));
perched.forEach(p => onAct(p.g, () => {
  if (p.fly) return;
  perched.filter(q => !q.fly && Math.abs(q.x0 - p.x0) < 90).forEach((q, i) => startPigeonFly(q, rand(4.5, 6.5) + i * .2));
  sfx(t => { flutter(t, 10); coo(t + .5, .04); });
  say(p.x, 500, nextLine('pig', ['禁寺的鴿子，在這裡沒有人會傷害牠們', '鴿子飛一圈又回來了', '咕咕——']), 2);
}));
onAct(roofP.man, () => { sfx(t => click(t, .03)); say(96, 430, nextLine('man', ['戒衣是兩塊沒有縫線的白布', '繞行時露出右肩', '不分國籍、不分貧富，大家穿得一樣']), 2.4); });
onAct(roofP.phone, () => { roofP.flashT = .3; sfx(shutter); say(210, 430, nextLine('phone', ['從屋頂拍天房，整個廣場都拍進去了', '傳給家人看！', '人好多，像在轉圈的白色漩渦']), 2); });
onAct(roofP.dad, () => { sfx(t => click(t, .03)); say(1290, 430, nextLine('dad', ['我住在麥加，常帶孩子來', '紅白格子頭巾是這裡常見的穿法', '晚上比白天還亮']), 2.2); });
onAct(roofP.kid, () => { roofP.kidT = 1.2; roofP.kidArm.style.display = ''; sfx(t => glock(t, hz(86), .03)); say(1338, 480, nextLine('kid', ['爸爸你看，好多人在轉圈！', '鴿子！', '那個金色的門好亮']), 1.8); });
onAct(roofP.cooler, () => { roofP.waterT = 1.2; sfx(pour); say(1420, 480, nextLine('zam', ['滲滲泉水（Zamzam）：禁寺裡到處都有', '免費喝，冰冰涼涼的', '旁邊是一疊紙杯']), 2.2); });
onAct(roofP.lady, () => { roofP.waterT = 1.2; sfx(pour); say(1468, 470, nextLine('lady', ['我們從印尼來，全團都穿白色', '先喝口泉水再繼續', '幫媽媽也裝一杯']), 2); });
onAct(roofP.wheel, () => { sfx(t => click(t, .03)); say(1500, 470, nextLine('wheel', ['兒子推著媽媽來朝聖', '樓上有給輪椅的繞行道', '不用擠在人潮裡也能繞']), 2.2); });

/* ---------------- ⑤ 互動：控制列 ---------------- */
function syncAuto() { $('btnAuto').setAttribute('aria-pressed', String(T.auto)); $('btnAuto').textContent = T.auto ? '自動播放中' : '自動播放'; }
function goTo(t) { if (reduced) { T.t = t; applyTime(true); renderStill(); } else T.target = t; }
const tap = fn => () => { userGesture = true; ensureAudio(); setTimeout(() => { fn(); if (reduced) settle(2); }, actx && actx.state !== 'running' ? 120 : 0); };
$('btnPray').addEventListener('click', tap(startPray));
$('btnDove').addEventListener('click', tap(startDove));
$('btnWeather').addEventListener('click', () => {
  userGesture = true; ensureAudio();
  wxI = (wxI + 1) % WX_LIST.length;
  $('btnWeather').textContent = '天氣：' + WX_LIST[wxI][1];
  if (reduced) { for (const k in wx) wx[k] = WX_LIST[wxI][0] === k ? 1 : 0; applyWeather(0); renderStill(); }
});
$('btnSound').addEventListener('click', () => {
  soundOn = !soundOn; userGesture = true;
  $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  if (ensureAudio()) {
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.setValueAtTime(soundOn ? .5 : 0, actx.currentTime);
    if (!soundOn && musNode) { try { musNode.disconnect(); } catch (e) {} musNode = null; }
  }
});
// 時段：一顆按鈕輪流切換 清晨 → 白天 → 黃昏 → 夜晚
const SLOTS = [['🌄 時段：清晨', 6.9], ['☀ 時段：白天', 11], ['🌅 時段：黃昏', 17.5], ['☾ 時段：夜晚', 21]];
let slotI = 1;
$('btnTime').addEventListener('click', () => {
  if (show.on) { busy(); return; }
  slotI = (slotI + 1) % SLOTS.length;
  $('btnTime').textContent = SLOTS[slotI][0];
  goTo(SLOTS[slotI][1] / 24);
});
$('btnAuto').addEventListener('click', () => { T.auto = !T.auto; T.target = null; syncAuto(); });
$('timeRange').addEventListener('input', e => {
  T.t = e.target.value / 1000; T.target = null; T.dragging = true; applyTime(true); T.dragging = false;
  if (reduced) renderStill();
});
mq.addEventListener?.('change', e => { reduced = e.matches; if (!reduced) { T.auto = true; syncAuto(); } start(); });

applyTime(true);
applyWeather(0);
applyRows(true);
syncAuto();
settle(.2);
start();

// 作者精選輪播：預設演出「晨光鴿群」；音樂由網站的「聲音」按鈕透過 window.sceneMusic 開關
if (inPicks) {
  const useCtx = c => {
    actx = c;
    master = actx.createGain(); master.gain.value = soundOn ? .5 : 0;
    const comp = actx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3;
    master.connect(comp); comp.connect(actx.destination);
    sfxBus = actx.createGain(); sfxBus.connect(master);
    musBus = actx.createGain(); musBus.gain.value = .64; musBus.connect(master);
    rainGain = windGain = stepGain = null;
  };
  setTimeout(() => startDove(), 800);
  setInterval(() => { if (!show.on) startDove(); }, 4000);
  window.sceneMusic = {
    playing: false,
    start(c) {
      if (this.playing) return; this.playing = true; userGesture = true; soundOn = true;
      if (c && c !== actx) useCtx(c); else ensureAudio();
      if (!actx) return;
      const go = () => { if (show.on === 'dove' && show.t < 3 && audioOK()) { doveTune(actx.currentTime + .05); duckSfx(22); } };
      if (actx.state === 'running') go(); else actx.resume().then(go).catch(() => {});
    },
    stop() { this.playing = false; userGesture = false; if (musNode) { try { musNode.disconnect(); } catch (e) {} musNode = null; } if (master) master.gain.setValueAtTime(0, actx.currentTime); soundOn = false; },
    duck() {}
  };
}
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on || null,
  btn: { pray: 'btnPray', dove: 'btnDove' },
  ff: () => { show.t = show.dur - .02; },   // 快轉到結尾：人潮恢復繞行、鴿群收走、燈光歸零
  save: () => ({ t: T.t, auto: T.auto }),
  stop: () => { endShow(); setCine(0); },
  restore: s => { T.target = null; T.t = s.t; T.auto = s.auto; syncAuto(); applyTime(true); }
});
/* /ShowStop */
})();
</script>
