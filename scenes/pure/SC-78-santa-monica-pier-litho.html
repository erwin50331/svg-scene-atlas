<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聖塔莫妮卡碼頭的夕陽摩天輪</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-78 聖塔莫妮卡碼頭的夕陽摩天輪｜復古石版海報風
   地點：美國加州洛杉磯・聖塔莫妮卡（Santa Monica）。
        站在碼頭南邊的沙灘往北望：碼頭橫跨畫面伸進太平洋，
        上面有遊樂園的太陽能摩天輪、繞著摩天輪跑的雲霄飛車、海盜船，
        靠岸那頭是 1916 年的旋轉木馬館、66 號公路「終點」路牌，
        和坡道頂端的拱門霓虹招牌（Santa Monica Yacht Harbor）。
        右邊是帕利塞德公園的斷崖與高瘦的棕櫚樹，後方是聖塔莫妮卡山脈，
        海上有衝浪手、海豚、鵜鶘，沙灘上有救生員塔、排球網、
        肌肉海灘的吊環，前景是海濱自行車道（The Strand）上的單車與滑板。
   風格重點（1930 年代石版印刷旅遊海報）：
        - 少色套印：只用幾種褪色油墨平塗，不用漸層
        - 套版偏移：墨線版刻意跟色塊錯開 2px，露出米白紙縫
        - 粗墨線輪廓、斜線與網點陰影、天空與海面是硬邊色帶
        - 泛黃紙張、斑駁水漬、折痕、印刷顆粒、不規則的紙邊
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），部分另有 --k-名稱（晨昏）。
   JS 會依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）兩個 class。
   ========================================================= */
:root{
  color-scheme: light;

  /* —— 紙與油墨（不隨日夜變化） —— */
  --paper:#efe0bd;      /* 泛黃海報紙 */
  --ink:#2b2a3d;        /* 墨線版（帶紫的深藍黑） */
  --coral:#e2603f;      /* 珊瑚紅 */
  --red:#c63f30;
  --orange:#ef8f3a;     /* 加州橘 */
  --yellow:#f3c552;     /* 陽光黃 */
  --ochre:#d99a3e;
  --teal:#2f8f93;
  --navy:#26496a;
  --sage:#7e9e6c;
  --pink:#e7a6a0;
  --cream:#f6ead0;
  --brown:#7a4a2e;
  --steel:#6f8796;      /* 雲霄飛車鋼軌 */

  /* —— 天空：四道硬邊色帶（由上而下） —— */
  --d-sky-1:#4fa3c0; --k-sky-1:#3b3f78; --n-sky-1:#121d36;
  --d-sky-2:#7dbdc6; --k-sky-2:#9a4f78; --n-sky-2:#172744;
  --d-sky-3:#aed3c6; --k-sky-3:#e5764f; --n-sky-3:#1d3150;
  --d-sky-4:#ead9a8; --k-sky-4:#f6b660; --n-sky-4:#253a5a;
  --d-cloud:#f6ecd2;  --k-cloud:#f7c39a; --n-cloud:#34446a;
  --d-cloud-sh:#d2c29c; --k-cloud-sh:#c98a7a; --n-cloud-sh:#25334f;
  --d-sunring:#f4e2a2; --k-sunring:#f6a868; --n-sunring:#2b3a5e;

  /* —— 聖塔莫妮卡山脈、帕利塞德斷崖 —— */
  --d-mtn-1:#9fb5a8; --k-mtn-1:#a7799a; --n-mtn-1:#1f2c44;   /* 最遠的山 */
  --d-mtn-2:#7c9a84; --k-mtn-2:#86607e; --n-mtn-2:#1a263a;
  --d-mtn-3:#5f8068; --k-mtn-3:#6a4c68; --n-mtn-3:#152031;
  --d-bluff:#d9b77c; --k-bluff:#e0925e; --n-bluff:#3a3646;   /* 斷崖受光面 */
  --d-bluff-2:#b8945e; --k-bluff-2:#b06e4e; --n-bluff-2:#2c2a38;
  --d-bush:#7a9a5a; --n-bush:#1d2c28;
  --d-city:#e9dcbc; --n-city:#3c3e58;     /* 斷崖上的公寓 */
  --d-city-2:#cdbf9c; --n-city-2:#2e3048;

  /* —— 海：遠海、碼頭下、浪區（由深到淺）、浪花 —— */
  --d-sea-1:#3f8fa6; --k-sea-1:#8a6a8a; --n-sea-1:#142640;
  --d-sea-2:#2f7d96; --k-sea-2:#6a5a80; --n-sea-2:#112138;
  --d-sea-3:#3b9aa2; --k-sea-3:#7a6886; --n-sea-3:#13283e;
  --d-sea-4:#5cb7ae; --k-sea-4:#a87e86; --n-sea-4:#1a3348;
  --d-sea-hi:#e6f0d8; --k-sea-hi:#f8c27e; --n-sea-hi:#6f86ad;
  --d-foam:#f8f2df;   --k-foam:#fbdcbc; --n-foam:#a9b8cc;
  --d-wave:#246f88;   --k-wave:#55506e; --n-wave:#0d1b30;

  /* —— 碼頭 —— */
  --d-deck:#a8774a;  --n-deck:#3a2c2c;      /* 木棧板 */
  --d-deck-2:#87593a; --n-deck-2:#2a2024;
  --d-pile:#6e4a34;  --n-pile:#1f1a1e;      /* 木樁 */
  --d-rail:#f1e4c6;  --n-rail:#5b5a70;
  --d-bldg:#f1e2c0;  --n-bldg:#4c4a62;      /* 奶油色建築 */
  --d-bldg-sh:#d2bd94; --n-bldg-sh:#37364c;
  --d-bldg-2:#8fc0b4; --n-bldg-2:#2e4450;   /* 薄荷綠店鋪 */
  --d-roof:#c8563a;  --n-roof:#4a2a2e;
  --d-win:#3b4a5a;   --n-win:#ffd36a;       /* 會亮燈的窗 */
  --d-wheel:#f2ead6; --n-wheel:#4a4c64;     /* 摩天輪骨架（白天白色） */
  --d-track:#e2603f; --n-track:#5a3a40;     /* 雲霄飛車軌道 */
  --d-truss:#f0e6cf; --n-truss:#3c3c52;

  /* —— 前景：沙灘、自行車道 —— */
  --d-sand:#ecd29a;   --k-sand:#f0b98a; --n-sand:#4a4658;
  --d-sand-2:#dcbc7e; --n-sand-2:#3c3a4c;
  --d-wetsand:#c6a46a; --n-wetsand:#34364a;
  --d-path:#d8cdb4;   --n-path:#3e3e52;     /* 水泥自行車道 */
  --d-path-2:#b9ad94; --n-path-2:#30303f;
  --d-tree:#4f7e4a;   --n-tree:#16262a;     /* 棕櫚葉 */
  --d-tree-2:#6f9a58; --n-tree-2:#1f3230;
  --d-trunk:#8a6a48;  --n-trunk:#2c2626;
  --d-shadow:#2b2a3d2a; --n-shadow:#0000006b;

  /* —— 光源 —— */
  --sun:#f6d98a;
  --moon:#f4e9cc;
  --star:#f4e9cc;
  --lamp:#ffd36a;
  --neon-1:#ff5a7a; --neon-2:#5ee0ff; --neon-3:#ffe066;   /* 招牌霓虹 */

  /* —— 摩天輪 LED（燈光秀用的六種顏色） —— */
  --led-1:#ff5a4e; --led-2:#ffb03a; --led-3:#ffe45e; --led-4:#5fe08a; --led-5:#4ec8ff; --led-6:#b07cff; --led-w:#fff4d8;

  /* —— 天氣 —— */
  --d-rainc:#3e5a74; --n-rainc:#9eb0d4;
  --d-fog:#e6e0cf; --k-fog:#e8c4ae; --n-fog:#3c4660;     /* 六月陰的海霧 */
  --wx-cloud:#8a8a86; --wx-rain:#35455c; --wx-wind:#f0a050;

  /* —— 角色 —— */
  --skin-1:#f0cba4; --skin-2:#d8a074; --skin-3:#a8714b; --skin-4:#6d4932;
  --hair-1:#2a2226; --hair-2:#6b4428; --hair-3:#e0b866; --hair-4:#b9b3a8;
  --cloth-1:#c63f30; --cloth-2:#26496a; --cloth-3:#f3c552; --cloth-4:#2f8f93; --cloth-5:#e7a6a0; --cloth-6:#7e9e6c; --cloth-7:#f6ead0; --cloth-8:#ef8f3a;
  --board-1:#e2603f; --board-2:#f3c552; --board-3:#2f8f93; --board-4:#f6ead0; --board-5:#e7a6a0;
  --car-1:#c63f30; --car-2:#5fb3b0; --car-3:#f3c552; --car-4:#e7a6a0; --car-5:#26496a; --chrome:#e8e4d8; --wood:#a86a3a;
  --pelican:#8a7a68; --dolphin:#6a7f8e; --gull:#f6ead0;

  /* —— 頁面介面 —— */
  --page-bg:#ece2cc; --page-fg:#2b2a3d; --page-muted:#6c6556;
  --ui-surface:#f6efde; --ui-line:#cdbd98; --ui-accent:#c63f30;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-sign:"Futura","Century Gothic","Avenir Next","Trebuchet MS",sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:6px;overflow:hidden;background:var(--paper);line-height:0;box-shadow:0 2px 10px #0000002a}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:10px;padding:10px 14px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
.panel button.big{border-color:var(--red);color:#fff;background:var(--red);font-weight:700}
.panel button.big.alt{border-color:var(--teal);background:var(--teal)}
.panel button.big.on{background:var(--ochre);border-color:var(--ochre);color:var(--ink)}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
/* 畫面內可點物件：滑鼠點不顯示外框，用鍵盤 Tab 時才顯示 */
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid var(--ui-accent);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 內的樣式 ---------- */
#scene .key{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
#scene .key-thin{fill:none;stroke:var(--ink);stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round}
#scene .clickable,#scene [role="button"]{cursor:pointer}
#scene .sign{font-family:var(--font-sign);font-weight:800;text-anchor:middle;dominant-baseline:central;letter-spacing:.04em}
#scene .bubble rect{fill:var(--cream);stroke:var(--ink);stroke-width:2}
#scene .bubble text{fill:var(--ink);font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .bubble .pop{animation:pop var(--dur,1.6s) ease-out forwards}
@keyframes pop{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  #scene .bubble .pop{animation:none}
}
</style>
<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。
   想恢復完整版，刪掉這整段 <style id="pure-art"> 即可。
   ========================================================= */
html,body{height:100%;margin:0!important;overflow:hidden}
body{display:flex!important;align-items:center;justify-content:center;padding:0!important}
body>.wrap{width:100%!important;max-width:min(100vw,calc(100vh * 8 / 3))!important;
  margin:0!important;padding:0!important;gap:0!important;display:block!important}
body>.wrap>:not(.stage){display:none!important}
body>.wrap>.stage{width:100%!important;max-width:100%!important;margin:0!important;
  border:0!important;border-radius:0!important;box-shadow:none!important}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：天空 → 遠海、帆船、山脈、斷崖 → 海霧
       → 碼頭（後段軌道、摩天輪、建築、木樁、雲霄飛車、前段軌道、車與遊客）
       → 浪區（衝浪手、海豚、鵜鶘）→ 沙灘、救生員塔、排球、吊環、自行車道
       → 畫框棕櫚樹 → 天氣 → 紙張質感（水漬、折痕、顆粒、紙邊）
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="復古石版印刷旅遊海報風格的加州聖塔莫妮卡碼頭插畫動畫：木造碼頭橫跨畫面伸進太平洋，碼頭上有大摩天輪、繞著摩天輪的雲霄飛車、海盜船、旋轉木馬館、66 號公路終點路牌與拱門霓虹招牌；右邊是長著高瘦棕櫚樹的斷崖，後方是聖塔莫妮卡山脈；海上有衝浪手、海豚和鵜鶘，沙灘上有救生員塔、排球網、吊環，前景自行車道上有單車和滑板">
    <defs>
      <!-- 網點：陰影與色帶交界 -->
      <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
        <circle cx="3" cy="3" r="1.2" style="fill:var(--ink)" opacity=".35"/>
      </pattern>
      <pattern id="dotsLight" width="6" height="6" patternUnits="userSpaceOnUse">
        <circle cx="3" cy="3" r="1.2" style="fill:var(--cream)" opacity=".6"/>
      </pattern>
      <!-- 斜線陰影：石版畫的手繪排線 -->
      <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="5" style="stroke:var(--ink)" stroke-width="1.3" opacity=".42"/>
      </pattern>
      <pattern id="hatchLight" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
        <line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--ink)" stroke-width="1" opacity=".22"/>
      </pattern>
      <!-- 斷崖的直向侵蝕紋 -->
      <pattern id="gully" width="9" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(6)">
        <line x1="2" y1="0" x2="2" y2="40" style="stroke:var(--ink)" stroke-width="1.1" opacity=".28"/>
      </pattern>
      <!-- 沙灘顆粒 -->
      <pattern id="sandDots" width="11" height="9" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r=".9" style="fill:var(--ink)" opacity=".18"/><circle cx="7.5" cy="6.5" r=".8" style="fill:var(--cream)" opacity=".5"/>
      </pattern>
      <!-- 木棧板的縫 -->
      <pattern id="planks" width="8" height="10" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="10" style="stroke:var(--ink)" stroke-width="1" opacity=".3"/>
      </pattern>
      <!-- 條紋遮雨棚 -->
      <pattern id="awning" width="10" height="10" patternUnits="userSpaceOnUse">
        <rect width="5" height="10" style="fill:var(--cream)"/><rect x="5" width="5" height="10" style="fill:var(--red)"/>
      </pattern>
      <pattern id="awning2" width="10" height="10" patternUnits="userSpaceOnUse">
        <rect width="5" height="10" style="fill:var(--cream)"/><rect x="5" width="5" height="10" style="fill:var(--teal)"/>
      </pattern>
      <!-- 印刷顆粒：由程式用 canvas 產生後填入 href -->
      <pattern id="grainPat" width="240" height="240" patternUnits="userSpaceOnUse">
        <image id="grainImg" width="240" height="240" href=""/>
      </pattern>
      <clipPath id="frameClip"><rect x="0" y="0" width="1600" height="600"/></clipPath>
      <clipPath id="surfClip"><rect x="-60" y="384" width="1720" height="96"/></clipPath>
    </defs>

    <g clip-path="url(#frameClip)">
    <!-- ===== 場景：天空 ===== -->
    <g id="skyBands"></g>
    <rect id="skyHit" x="0" y="0" width="1600" height="150" fill="transparent" class="clickable" tabindex="0" role="button" aria-label="天空：白天飛來一排鵜鶘，夜晚劃過流星"/>
    <g id="stars" pointer-events="none"></g>
    <g id="sun" pointer-events="none"></g>
    <g id="moon" pointer-events="none"></g>
    <g id="clouds" pointer-events="none"></g>
    <g id="overcast" pointer-events="none" opacity="0"></g>
    <g id="plane" pointer-events="none"></g>
    <g id="birds" pointer-events="none"></g>

    <!-- ===== 場景：遠海、帆船、聖塔莫妮卡山脈、帕利塞德斷崖（滑鼠移動有視差） ===== -->
    <g id="parFar">
      <g id="seaFar"></g>
      <g id="sails"></g>
      <g id="mountains"></g>
      <g id="bluff"></g>
      <g id="fogBank" pointer-events="none" opacity="0"></g>
    </g>

    <!-- ===== 場景：碼頭與遊樂園 ===== -->
    <g id="parMid">
      <g id="farRefl" pointer-events="none"></g>
      <g id="trackBack"></g>
      <g id="coasterBack"></g>
      <g id="wheel"></g>
      <g id="rides"></g>
      <g id="pierBldg"></g>
      <g id="pier"></g>
      <g id="trackFront"></g>
      <g id="coasterFront"></g>
      <g id="deckPeopleB"></g>
      <g id="deckCars"></g>
      <g id="deckPeople"></g>
      <g id="pierLights" pointer-events="none"></g>
      <!-- 浪區 -->
      <g id="surfSea"></g>
      <g id="refl" pointer-events="none"></g>
      <g id="ripples" pointer-events="none"></g>
      <g id="crests" pointer-events="none"></g>
      <g id="dolphins"></g>
      <g id="surfers"></g>
      <g id="spray" pointer-events="none"></g>
      <g id="pelicans"></g>
    </g>

    <!-- ===== 場景：前景沙灘與自行車道 ===== -->
    <g id="parNear">
      <g id="beach"></g>
      <g id="swash" pointer-events="none"></g>
      <g id="props"></g>
      <g id="walkers"></g>
      <g id="riders"></g>
      <g id="frame"></g>
    </g>

    <!-- ===== 天氣與氛圍 ===== -->
    <g id="rain" pointer-events="none" opacity="0"></g>
    <g id="sandBlow" pointer-events="none" opacity="0"></g>
    <g id="wxTint" pointer-events="none"></g>
    <g id="notes" pointer-events="none"></g>
    <g id="bubbles" pointer-events="none"></g>
    </g>

    <!-- ===== 海報紙張：水漬、折痕、印刷顆粒、不規則紙邊 ===== -->
    <image id="stainImg" x="0" y="0" width="1600" height="600" preserveAspectRatio="none" href="" opacity=".55" pointer-events="none"/>
    <rect x="0" y="0" width="1600" height="600" fill="url(#grainPat)" pointer-events="none"/>
    <g id="creases" pointer-events="none"></g>
    <path id="paperEdge" fill-rule="evenodd" style="fill:var(--paper)" pointer-events="none"/>
    <path id="paperEdgeLine" class="key-thin" pointer-events="none" opacity=".7"/>
  </svg>
  </figure>

  <!-- ===== 互動：控制列 ===== -->
  <div class="panel">
    <button id="btnWheel" class="big" type="button">🎡 摩天輪燈光秀</button>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });

           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，

   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }

  W.setTimeout = function (fn, ms, ...a) {

    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };

  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);

    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {

  function ghost(svg) {

    if (!ghostCss) {

    const map = {};

    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}

      for (const a of e.attributes) {

        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }

    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {

    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }

    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {

    zone = Math.max(0, zone - 1);

  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);

      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {

        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {

    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;

          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }

            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>

(() => {

// 墨西哥扇葉棕櫚：細長的樹幹、頂端一團扇形葉與下垂的枯葉裙
function fanPalm(g, x, by, h, s = 1, lean = 0, cls = 'f-tree', n = 9) {
  const tg = el('g', { class: 'palm' }, g);
  const tx = x + lean * h * .1, ty = by - h;
  el('path', { d: `M${f1(x - 1.6 * s)} ${by} Q${f1(x + lean * h * .05)} ${f1(by - h * .5)} ${f1(tx - .9 * s)} ${f1(ty)} L${f1(tx + .9 * s)} ${f1(ty)} Q${f1(x + lean * h * .05 + 1.5 * s)} ${f1(by - h * .5)} ${f1(x + 1.6 * s)} ${by} Z`, class: 'f-trunk' }, tg);
  const crown = el('g', { class: 'crown', transform: `translate(${f1(tx)} ${f1(ty)})` }, tg);
  el('path', { d: `M${-4 * s} 0 L${-3 * s} ${7 * s} L${3 * s} ${7 * s} L${4 * s} 0 Z`, class: 'f-trunk' }, crown);
  el('path', { d: `M${-4 * s} 1 L${-3 * s} ${7 * s} L${3 * s} ${7 * s} L${4 * s} 1 Z`, fill: 'url(#hatch)' }, crown);
  // 扇形葉：一片片放射的尖葉，外圈兩片往下垂
  const fr = el('g', { class: 'fronds' }, crown);
  for (let i = 0; i < n; i++) {
    const k = i / (n - 1), a = -Math.PI * (-.08 + 1.16 * k), r = 15 * s * (k < .1 || k > .9 ? .9 : 1);
    const ex = Math.cos(a) * r, ey = Math.sin(a) * r * .78 + (k < .1 || k > .9 ? 4 * s : 0);
    el('path', { d: `M0 0 L${f1(ex - 2.4 * s)} ${f1(ey)} L${f1(ex + 2.4 * s)} ${f1(ey + 1.6 * s)} Z`, class: i % 2 ? cls : cls + '-2' }, fr);
  }
  if (s > 2) el('path', { d: `M${f1(-11 * s)} ${f1(2 * s)} Q0 ${f1(-12 * s)} ${f1(11 * s)} ${f1(2 * s)}`, class: 'key-thin', opacity: .5 }, fr);
  return tg;
}

let trackPath = null;
function catmull(pts) {
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  const n = pts.length;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    d += ` C${f1(p1[0] + (p2[0] - p0[0]) / 6)} ${f1(p1[1] + (p2[1] - p0[1]) / 6)} ${f1(p2[0] - (p3[0] - p1[0]) / 6)} ${f1(p2[1] - (p3[1] - p1[1]) / 6)} ${p2[0]} ${p2[1]}`;
  }
  return d;
}

/* ---------------- ④ 動畫：日夜循環 ----------------

const DAY_SEC = 150;
const T = { t: 17 / 24, auto: true, target: null };
let night = 0, dusk = 0, nOn = 0, lastApplied = -1, sunX = 0;
function clockText() {
  const h = T.t * 24, hh = Math.floor(h) % 24, mm = Math.floor((h - Math.floor(h)) * 60 + 1e-6);
  return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
}
function applyTime(force) {
  if (!force && Math.abs(T.t - lastApplied) < .0003) return;
  lastApplied = T.t;
  const h = T.t * 24;
  night = clamp(1 - smooth(5.6, 7.2, h) + smooth(19, 20.4, h), 0, 1);
  dusk = Math.max(Math.exp(-Math.pow((h - 6.5) / 1, 2)), Math.exp(-Math.pow((h - 19.2) / 1.1, 2)));
  for (const k in PAIRS) {
    const Pp = PAIRS[k];
    let c = mix(Pp.d, Pp.n, night);
    if (Pp.k) c = mix(c, Pp.k, dusk * .85);
    root.style.setProperty('--' + k, rgba(c));
  }
  // 太陽從右邊的山後升起，傍晚落進左邊的太平洋
  const sp = (h - 6) / 13.2, mp = ((h - 19.2 + 24) % 24) / 10.8;
  const sx = 1440 - sp * 1200, sy = HORIZON + 6 - Math.sin(Math.PI * clamp(sp, 0, 1)) * 230;
  $('sun').setAttribute('transform', `translate(${f1(sx)} ${f1(sy)})`);
  $('sun').style.display = sp > -.04 && sp < 1.04 ? '' : 'none';
  const mx = 1440 - mp * 1200;
  $('moon').setAttribute('transform', `translate(${f1(mx)} ${f1(HORIZON - 10 - Math.sin(Math.PI * clamp(mp, 0, 1)) * 200)})`);
  $('moon').style.display = mp > -.05 && mp < 1.05 ? '' : 'none';
  sunX = night > .5 ? mx : sx;
  nOn = smooth(.3, .85, night);
  document.querySelectorAll('#scene .bandDots').forEach(e => e.setAttribute('opacity', f1(.5 - nOn * .35)));
  $('malibuLights').setAttribute('opacity', f1(nOn));
  $('stringLights').setAttribute('opacity', f1(nOn));
  sails.forEach(b => b.el.querySelector('.boatLamp').setAttribute('opacity', f1(nOn)));
  pchCars.forEach(c => c.el.querySelectorAll('.hl,.tl').forEach(e => e.setAttribute('opacity', f1(nOn))));
  lamps.forEach(l => { l.glow.setAttribute('opacity', f1(nOn * .3)); l.bulb.setAttribute('opacity', f1(nOn)); });
  document.querySelectorAll('#scene .trackLed').forEach(e => e.setAttribute('opacity', f1(nOn * .85)));
  document.querySelectorAll('#scene .carLed,#scene .shipLed').forEach(e => e.setAttribute('opacity', f1(nOn)));
  cars.forEach(c => c.el.querySelectorAll('.hl,.tl').forEach(e => e.setAttribute('opacity', f1(.25 + nOn * .75))));
  $('archGlow').setAttribute('opacity', f1(nOn * .35));
  $('clock').textContent = clockText();
  if (!T.dragging) $('timeRange').value = Math.round(T.t * 1000);
}

      p.vx = dx / d * 80; p.vy = dy / d * 80;
      if (d < 4) { p.st = 'perch'; p.dir = p.hx < 280 ? -1 : 1; }
    }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.st !== 'perch' && p.st !== 'sit') { const o = orient(p.vx, p.vy); rot = o.rot; flip = o.flip; if (flapping) pelPose(p, true); p.dir = flip; }
    p.inner.setAttribute('transform', `translate(${f1(p.x)} ${f1(p.y)}) rotate(${f1(wrapRot(rot))}) scale(${f1(flip * p.s)} ${p.s})`);
  });
  for (let i = birds.length - 1; i >= 0; i--) {
    const b = birds[i];
    b.ph += dt; b.x += b.dir * b.sp * dt;
    if (b.kind === 'pel') { b.y += Math.sin(b.ph * 1.2) * .1; pelPose(b, Math.sin(b.ph * .7) > .3); }
    else b.inner.querySelector('.gw').setAttribute('transform', `scale(1 ${f1(.4 + Math.abs(Math.sin(b.ph * 6)) * .8)})`);
    b.el.setAttribute('transform', `translate(${f1(b.x)} ${f1(b.y)}) scale(${f1(b.dir * b.s)} ${b.s})`);
    if (b.x < -300 || b.x > 1900) { b.el.remove(); birds.splice(i, 1); }
  }
}

/* ---------------- ④ 動畫：每一格的更新 ---------------- */
let organT = 0, r66T = 0;
let clock = 0, px = 0, pxCur = 0, planeT = 14, flockT = 18, lastRipple = 0;
const plane = { x: 1800, y: 70, on: false };
function step(dt) {
  clock += dt;
  // —— 時間 ——
  if (T.target !== null) {
    let d = T.target - T.t; if (d > .5) d -= 1; if (d < -.5) d += 1;
    T.t = (T.t + d * Math.min(1, dt * 1.6) + 1) % 1;
    if (Math.abs(d) < .0015) { T.t = T.target; T.target = null; }
  } else if (T.auto && !reduced) T.t = (T.t + dt / DAY_SEC) % 1;
  applyTime();
  applyWeather(dt);
  // —— 天空 ——
  clouds.forEach(c => { c.x += c.sp * dt * (1 + wx.wind * 2); if (c.x > 1720) c.x = -160; c.el.setAttribute('transform', `translate(${f1(c.x)} ${f1(c.y)}) scale(${f1(c.s)})`); });
  stars.forEach(s => s.el.setAttribute('opacity', f1(.55 + .45 * Math.sin(clock * s.sp + s.ph))));
  for (let i = meteors.length - 1; i >= 0; i--) {

    m.el.setAttribute('x2', f1(m.x + k * 220)); m.el.setAttribute('y2', f1(m.y + k * 90)); m.el.setAttribute('opacity', f1(1 - k));

  }
  // 拖布條的小飛機：白天、天氣好時才飛
  planeT -= dt;
  if (!plane.on && planeT <= 0 && night < .4 && wx.rain < .3 && wx.fog < .5) { plane.on = true; plane.x = 1700; plane.y = rand(56, 90); }
  if (plane.on) {
    plane.x -= 52 * dt;

    $('plane').querySelector('.prop').setAttribute('opacity', Math.sin(clock * 60) > 0 ? 1 : .3);
    if (plane.x < -260) { plane.on = false; planeT = rand(40, 60); }
  } else $('plane').setAttribute('transform', 'translate(-400 -100)');
  flockT -= dt;
  if (flockT <= 0) { spawnFlock(night < .5 && Math.random() < .5 ? 'pel' : 'gull'); flockT = rand(22, 34); }
  // —— 遠景 ——
  sails.forEach(b => {
    b.x += b.dir * b.sp * dt;

    b.el.setAttribute('transform', `translate(${f1(b.x)} ${f1(b.y + Math.sin(clock * 1.3 + b.bob) * .8)}) scale(${f1(b.dir * b.s)} ${b.s})`);
  });
  pchCars.forEach(c => {
    c.x += c.dir * c.sp * dt;

    c.el.setAttribute('opacity', c.x < 1240 || c.x > 1620 ? 0 : 1);

  $('farRefl').setAttribute('transform', `translate(${f1(clamp(sunX, 0, 1600))} 0)`);
  $('refl').setAttribute('transform', `translate(${f1(clamp(sunX, 0, 1600))} 0)`);
  // —— 遊樂園 ——
  updateWheel(dt);
  updateCoaster(dt);
  SHIP.boost = Math.max(0, SHIP.boost - dt);
  const shipAmp = .22 + (SHIP.boost > 0 ? Math.min(1, SHIP.boost / 3) * .75 : 0) + (show.on ? .2 : 0);
  SHIP.amp += (shipAmp - SHIP.amp) * Math.min(1, dt * .8);

  $('shipArm').setAttribute('transform', `translate(${SHIP.x} ${SHIP.y}) rotate(${f1(Math.sin(SHIP.ph) * SHIP.amp * 57.3)})`);
  horses.forEach(h => { h.el.setAttribute('transform', `translate(${f1(h.x + Math.sin(clock * (organT > 0 ? 3 : 1.2) + h.ph) * 3)} ${f1(h.y + Math.sin(clock * (organT > 0 ? 6 : 2.4) + h.ph) * 2.5)})`); });
  organT = Math.max(0, organT - dt);
  // 招牌霓虹：夜晚亮、表演時跟著拍子閃
  archFlick = Math.max(0, archFlick - dt);
  let neon = nOn;
  if (archFlick > 0) neon = Math.random() < .75 ? 1 : .2;
  if (show.on) neon = Math.max(neon, .5 + .5 * (1 - (show.t / show.beat) % 1));
  $('archGlow').setAttribute('opacity', f1(neon * .4));
  $('r66Glow').setAttribute('opacity', f1(show.on === 'cruise' ? .5 + .5 * Math.sin(show.t * 6) : r66T > 0 ? r66T : 0));
  r66T = Math.max(0, r66T - dt);
  if (show.on === 'wheel' || nOn > .3) strings.forEach((s, i) => s.setAttribute('opacity', f1(show.on === 'wheel' ? ((i + Math.floor(show.t / show.beat * 2)) % 3 === 0 ? 1 : .3) : .9)));
  // —— 碼頭上的人與車 ——
  updateCars(dt);
  deckPeople.forEach(p => {
    const laneMates = deckPeople.filter(o => o !== p && o.dir === p.dir);
    let v = p.base;
    if (p.stop > 0) { p.stop -= dt; v = 0; }
    if (p.wave > 0) { p.wave -= dt; v = 0; }
    if (show.on === 'wheel' && !p.phone.style.display) v = 0;
    const ahead = laneMates.filter(o => (o.x - p.x) * p.dir > 0 && Math.abs(o.x - p.x) < 16);
    if (ahead.length) v = Math.min(v, Math.min(...ahead.map(o => o.v)) * .9);
    p.v = v;
    p.x += p.dir * v * dt;
    p.ph += v * dt * .5;
    if (p.x < 252 || p.x > 1372) {
      // 走到盡頭就迴轉，換到另一條走道
      p.dir *= -1; p.x = clamp(p.x, 252, 1372);
      const busyLane = deckPeople.some(o => o !== p && o.dir === p.dir && Math.abs(o.x - p.x) < 16);
      if (busyLane) { p.dir *= -1; p.stop = 1; }
      else (p.dir < 0 ? $('deckPeopleB') : $('deckPeople')).appendChild(p.el);
    }
    walkLegs(p, p.ph, v > 1 ? 22 : 0);
    const arm = p.inner.querySelector('.arm');
    arm.setAttribute('transform', p.wave > 0 ? `rotate(${f1(-150 + Math.sin(clock * 9) * 20)} 3.5 -30)` : '');
    p.el.setAttribute('transform', `translate(${f1(p.x)} ${DECK_LANE[p.dir]}) scale(${f1(p.dir * p.s)} ${p.s})`);
  });
  fishers.forEach(f => {
    f.bob += dt;
    if (f.t > 0) {
      f.t -= dt;
      const k = smooth(2.6, .6, f.t);   // 0 → 1：魚被拉上來
      const lineEnd = (WATER - DECK_F) / .44 + 6;
      const fy = lineEnd - k * (lineEnd + 50);
      f.line.setAttribute('d', `M34 -56 L34 ${f1(fy)}`);
      f.fish.setAttribute('transform', `translate(34 ${f1(fy + 8)}) rotate(${f1(Math.sin(clock * 20) * 25)})`);
      f.fish.setAttribute('opacity', 1);
      f.rod.setAttribute('transform', `rotate(${f1(-k * 8)} 4 -24)`);
      if (f.t <= 0) { f.fish.setAttribute('opacity', 0); f.line.setAttribute('d', `M34 -56 L34 ${f1(lineEnd)}`); f.rod.setAttribute('transform', ''); }
    } else f.rod.setAttribute('transform', `rotate(${f1(Math.sin(f.bob * 1.3) * 1.5)} 4 -24)`);
  });
  // —— 浪區 ——
  updateWaves(dt);
  updateSurfers(dt);
  updateDolphins(dt);
  updatePelicans(dt);
  // —— 沙灘 ——
  walkers.forEach(w => {
    let v = w.base;
    if (w.stop > 0) { w.stop -= dt; v = 0; }
    const ahead = walkers.filter(o => o !== w && o.y === w.y && (o.x - w.x) * w.dir > 0 && Math.abs(o.x - w.x) < 30);
    if (ahead.length) v = Math.min(v, Math.min(...ahead.map(o => o.v)) * .95);
    w.v = v; w.x += w.dir * v * dt; w.ph += v * dt * .32;
    if (w.x < -40) w.x = 1640; if (w.x > 1640) w.x = -40;
    walkLegs(w, w.ph, v > 1 ? (w.t === 'jog' ? 34 : 22) : 0);
    w.umb.style.display = wx.rain > .5 && w.t !== 'surfer' && w.t !== 'jog' ? '' : 'none';
    w.el.setAttribute('transform', `translate(${f1(w.x)} ${f1(w.y + (w.t === 'jog' ? -Math.abs(Math.sin(w.ph)) * 2 : 0))}) scale(${f1(w.dir * w.s)} ${w.s})`);
  });
  riders.forEach(r => {
    let v = r.base * (1 - wx.rain * .3);
    const ahead = riders.filter(o => o !== r && o.dir === r.dir && (o.x - r.x) * r.dir > 0 && Math.abs(o.x - r.x) < 46);
    if (ahead.length) v = Math.min(v, Math.min(...ahead.map(o => o.v)) * .95);
    r.v = v; r.x += r.dir * v * dt; r.ph += dt;
    if (r.x < -60) r.x = 1660; if (r.x > 1660) r.x = -60;
    let y = r.y, rot = 0;
    if (r.kind === 'bike') {
      r.spk.setAttribute('transform', `rotate(${f1(r.ph * 400 % 360)} -9 -5)`);
      const a = Math.sin(r.ph * 8); r.leg.setAttribute('d', `M-3 -15 L${f1(a * 2)} ${f1(-9 + a)} L${f1(-2 + a * 2)} -5`);
    } else if (r.kind === 'skate') {
      if (r.jump > 0) {                         // 豚跳＋翻板
        r.jump -= dt; const k = 1 - r.jump / .7;
        y -= Math.sin(Math.PI * k) * 22;
        r.deck.setAttribute('transform', `translate(0 ${f1(-Math.sin(Math.PI * k) * 4)}) scale(1 ${f1(Math.cos(k * Math.PI * 2))})`);
        r.body.setAttribute('transform', 'translate(0 -3)');
      } else {
        r.deck.setAttribute('transform', '');
        const push = (r.ph % 3) < 1;            // 每隔一下用腳蹬地
        r.body.setAttribute('transform', push ? `translate(0 ${f1(Math.sin(r.ph * 6) * 1)})` : '');
      }
    } else {

    }
    r.el.setAttribute('transform', `translate(${f1(r.x)} ${f1(y)}) scale(${r.dir * .92} .92) rotate(${f1(rot)})`);

  // —— 風：棕櫚樹與陽傘 ——

  props.forEach(u => u.top.setAttribute('transform', `translate(${u.tx} ${u.ty}) rotate(${f1(Math.sin(clock * 3 + u.ph) * (1 + wx.wind * 5) - wx.wind * 6)})`));

    d.el.setAttribute('x1', f1(d.x)); d.el.setAttribute('y1', f1(d.y)); d.el.setAttribute('x2', f1(d.x - 3)); d.el.setAttribute('y2', f1(d.y + 16));
  });
  if (wx.wind > .01) sandLines.forEach(s => {

  $('parNear').setAttribute('transform', `translate(${f1(pxCur * 11)} 0)`);
}

/* ---------------- ④ 動畫：沙灘上的救生員、排球、吊環、海鷗 ---------------- */
function updateBeachProps(dt) {
  // 救生員：被點時走出來拿望遠鏡看、吹哨，旗子在焚風裡拉直
  lifeguard.t = Math.max(0, lifeguard.t - dt);
  lifeguard.guardOut.style.display = lifeguard.t > 0 ? '' : 'none';
  lifeguard.guard.style.display = lifeguard.t > 0 ? 'none' : '';
  const fl = 1 + wx.wind * .5, fw = Math.sin(clock * (4 + wx.wind * 8)) * (2 - wx.wind);
  lifeguard.flag.setAttribute('d', `M376 414 L${f1(376 + 16 * fl)} ${f1(418 + fw)} L376 422 Z`);
  // 排球：兩隊來回打，被點時下一球殺球
  const V = volley;
  if (V.pause > 0) V.pause -= dt; else V.t += dt;
  const A = V.players[V.from], B = V.players[V.to];
  const k = Math.min(1, V.t / V.dur);
  const ax = A.x, ay = A.y - 30, bx = B.x, by = B.y - 30;
  const bxNow = ax + (bx - ax) * k, byNow = ay + (by - ay) * k - Math.sin(Math.PI * k) * (V.dur < .8 ? 12 : 58);
  V.ball.setAttribute('cx', f1(bxNow)); V.ball.setAttribute('cy', f1(byNow));
  V.players.forEach((p, i) => {
    const hop = i === V.to && k > .8 ? Math.sin((k - .8) / .2 * Math.PI) * 5 : 0;
    p.el.setAttribute('transform', `translate(${p.x} ${f1(p.y - hop)}) scale(${p.dir * .78} .78)`);
    p.inner.querySelector('.arm').setAttribute('transform', (i === V.to && k > .7) || (i === V.from && k < .15) ? 'rotate(-150 3.5 -30)' : '');
  });
  if (k >= 1) {
    sfx(t => thump(t, V.spike ? .16 : .05));
    if (V.spike) { V.spike = 0; V.pause = 1.4; say(B.x, B.y - 60, pick(['得分！', '漂亮的殺球！']), 1.4); }
    V.from = V.to; V.to = pick(V.to < 2 ? [2, 3] : [0, 1]);
    V.spike = V.spikeNext ? 1 : 0; V.spikeNext = 0;
    V.dur = V.spike ? .55 : rand(1.2, 1.6); V.t = 0;
  }
  // 吊環：選手在一個環上盪，被點時一環一環盪過去
  const RG = rings;
  RG.t += dt;
  if (RG.travel > 0) {
    RG.travel -= dt;
    const seg = RG.t / .7;
    if (seg >= 1) { RG.t = 0; RG.idx += RG.tdir; if (RG.idx >= 4 || RG.idx <= 0) RG.tdir *= -1; sfx(creak); }
    RG.pos = RG.idx + RG.tdir * smooth(0, 1, Math.min(1, RG.t / .7));
  } else RG.pos += (Math.round(RG.pos) - RG.pos) * Math.min(1, dt * 3);
  const gx = RG.rl[0].x + RG.pos * 14, sw = RG.travel > 0 ? Math.sin(RG.t / .7 * Math.PI) * 26 * RG.tdir : Math.sin(clock * 2.1) * 8;
  RG.gym.setAttribute('transform', `translate(${f1(gx)} 479) rotate(${f1(-sw)})`);
  RG.gym.querySelector('.gLegs').setAttribute('d', RG.travel > 0 ? `M-1.5 25 L${f1(-2 + sw * .2)} 36 M1.5 25 L${f1(2 + sw * .2)} 36` : 'M-1.5 25 L-2 36 M1.5 25 L2 36');
  RG.rl.forEach((r, i) => r.el.setAttribute('transform', `translate(${r.x} 446) rotate(${f1(Math.abs(i - RG.pos) < .6 ? -sw : Math.sin(clock * 1.4 + i) * 3)})`));
  $('pushup').querySelector('.pb').setAttribute('transform', `rotate(${f1(Math.max(0, Math.sin(clock * 3)) * -8)} -12 -2)`);
  // 海鷗：在沙灘上啄來啄去，被嚇到就飛起來繞一圈再回來
  gulls.forEach(g => {
    g.ph += dt;
    if (g.fly > 0) {
      g.fly += dt;
      if (g.fly < 4) { g.vy += (-8 - g.vy) * dt; g.x += g.vx * dt; g.y += g.vy * dt; }
      else { const dx = g.hx - g.x, dy = g.hy - g.y, d = Math.hypot(dx, dy); if (d < 3) { g.fly = 0; g.x = g.hx; g.y = g.hy; } else { g.vx = dx / d * 70; g.vy = dy / d * 70; g.x += g.vx * dt; g.y += g.vy * dt; } }
      if (Math.abs(g.vx) > 2) g.dir = Math.sign(g.vx);
      const flapY = Math.sin(g.ph * 14) * .5 + .5;
      g.el.setAttribute('transform', `translate(${f1(g.x)} ${f1(g.y)}) scale(${g.dir} 1)`);
      g.el.querySelector('.gb').setAttribute('transform', `scale(1 ${f1(.6 + flapY * .6)})`);
      g.el.querySelector('.gl').style.display = 'none';
    } else {
      const peck = Math.sin(g.ph * 1.7) > .85;
      g.el.setAttribute('transform', `translate(${f1(g.x)} ${f1(g.y)}) scale(${g.dir} 1)`);
      g.el.querySelector('.gb').setAttribute('transform', peck ? 'rotate(18 6 -5)' : '');
      g.el.querySelector('.gl').style.display = '';
      if (Math.random() < dt * .15) g.dir *= -1;
    }
  });
}

/* ---------------- ⑤ 互動：對話泡泡 ---------------- */
function say(x, y, text, dur = 1.6) {
  const g = el('g', { class: 'bubble' }, $('bubbles'));
  const inner = el('g', { class: 'pop', style: `--dur:${dur}s` }, g);
  const t = el('text', { x: 0, y: 0 }, inner);
  t.textContent = text;
  const w = Math.max(44, (t.getComputedTextLength() || text.length * 15) + 24);
  const r = el('rect', { x: f1(-w / 2), y: -15, width: f1(w), height: 30, rx: 3 });
  inner.insertBefore(r, t);
  x = clamp(x, w / 2 + 26, 1600 - w / 2 - 26); y = clamp(y, 40, 562);
  g.setAttribute('transform', `translate(${f1(x)} ${f1(y)})`);
  setTimeout(() => g.remove(), dur * 1000);
}

/* ---------------- 動畫主迴圈 ---------------- */
let last = 0, rafId = 0;
function loop(now) {
  const dt = clamp((now - last) / 1000, 0, .05); last = now;
  step(dt);
  rafId = requestAnimationFrame(loop);
}
function settle(sec) { for (let s = 0; s < sec; s += .05) step(.05); }
function renderStill() { step(.0001); }
function start() {
  cancelAnimationFrame(rafId);
  if (reduced) { T.auto = false; syncAuto(); applyTime(true); settle(1.5); }
  else { last = performance.now(); rafId = requestAnimationFrame(loop); }
}

function onAct(node, fn) {

  node.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); userGesture = true; ensureAudio(); fn(e); if (reduced) settle(.6); } });
}
function svgPoint(e) {
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
svg.addEventListener('pointerdown', () => { userGesture = true; ensureAudio(); document.body.classList.remove('kbd'); });
window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
// 滑鼠：視差＋海面漣漪
svg.addEventListener('pointermove', e => {
  const p = svgPoint(e);
  px = clamp((800 - p.x) / 800, -1, 1);
  if (p.y > WATER + 4 && p.y < SHORE - 2 && clock - lastRipple > .08 && !reduced) {
    lastRipple = clock;
    ripples.push({ el: el('ellipse', { cx: f1(p.x - pxCur * 6), cy: f1(p.y), rx: 4, ry: 1.4, class: 's-foam', 'stroke-width': 1.4 }, $('ripples')), t: 0 });
  }
});
svg.addEventListener('pointerleave', () => { px = 0; });

// 天空：白天一排鵜鶘飛過，晚上劃過流星
onAct($('skyHit'), () => {
  if (night > .5) { shootingStar(); sfx(t => glock(t, hz(96), .03)); }
  else { spawnFlock(Math.random() < .6 ? 'pel' : 'gull'); sfx(t => gullCall(t)); }
});
// 摩天輪：閃一陣星光、響一串鐘琴
onAct($('wheelHit'), () => {
  if (show.on === 'wheel') return;
  wheelSpark = 3;
  sfx(wheelChime);
  say(WH.x, WH.y - WH.r - 24, pick(['晚上會換各種 LED 燈光', '轉一圈可以看到整片海岸', '坐上去看夕陽最美']), 1.8);
});
// 雲霄飛車：發車
onAct($('coasterHit'), () => {
  if (CO.run && CO.s > 4) { say(980, 220, pick(['正在跑一圈！', '抓緊扶手！']), 1.2); return; }
  CO.run = true; CO.s = 0; CO.v = 0; coSoundCue = 1;
  say(1110, 290, pick(['發車囉！', '要爬坡了⋯⋯']), 1.4);
});
// 海盜船：越盪越高
onAct($('shipHit'), () => {
  SHIP.boost = 9;
  sfx(t => { whoosh(t, .04); whoosh(t + 1.7, .04); whoosh(t + 3.4, .05); });
  say(SHIP.x, SHIP.y - 30, pick(['盪高一點！', '海盜船出航！']), 1.6);
});
// 旋轉木馬館：手搖風琴響起，木馬轉快
onAct($('hipHit'), () => {
  if (show.on) { busy(); return; }
  if (organT > 0) return;
  organT = 6;
  if (audioOK()) { organTune(actx.currentTime + .05); duckMusic(7); }
  say(1284, PIER_Y - 96, pick(['1916 年蓋的旋轉木馬館', '木馬一圈一圈轉']), 2);
});
// 拱門招牌：霓虹閃一閃亮起來
onAct($('arch'), () => {
  archFlick = 3.5;
  sfx(t => buzz(t, 1.2));
  say(RAMP_TOP[0] - 22, RAMP_TOP[1] - 110, pick(['碼頭的老霓虹招牌', '從這裡走下坡就是碼頭']), 1.8);
});
// 66 號公路終點路牌：遊客合照
onAct($('r66'), () => {
  r66T = 1;
  sfx(shutter);
  say(1184, PIER_Y - 86, pick(['66 號公路從芝加哥一路到這裡', '全長約 3,940 公里，終點到了！', '跟終點路牌合照一張']), 2);
});
// 釣客：收線釣起一條魚
fishers.forEach(f => onAct(f.el, () => {
  if (f.t > 0) return;
  f.t = 2.6;
  sfx(reel);
  setTimeout(() => say(f.x, PIER_Y - 40, pick(['釣到一條鯖魚！', '是竹筴魚！', '中魚了！']), 1.6), 1600);
}));
// 鵜鶘：起飛、俯衝入海抓魚
pelicans.forEach(p => onAct(p.el, () => {
  if (p.st !== 'perch') return;
  p.st = 'fly'; p.tx = clamp(p.hx + rand(60, 240), 120, 900); p.vy = -40;
  sfx(flap);
}));
// 衝浪手：等下一道浪
surfers.forEach(s => onAct(s.el, () => {
  if (s.st === 'wait') { s.want = true; say(s.x, s.y - 40, pick(['下一道浪是我的！', '等浪中⋯⋯']), 1.4); }
  else if (s.st === 'ride') say(s.x, s.y - 40, pick(['好浪！', '衝啊！']), 1.2);
  else say(s.x, s.y - 34, '划回去等浪', 1.2);
}));
// 海豚：跳高一點
dolphins.forEach(d => onAct(d.el, () => { pod.jump = 1.4; sfx(dolphinCall); }));
// 自行車道：單車按鈴、滑板豚跳、直排輪打招呼
riders.forEach(r => onAct(r.el, () => {
  if (r.kind === 'bike') { sfx(bikeBell); say(r.x, r.y - 50, pick(['借過借過！', '沿著海邊騎到威尼斯海灘']), 1.4); }
  else if (r.kind === 'skate') { if (r.jump <= 0) { r.jump = .7; sfx(ollie); } }
  else { sfx(t => roll(t, .8)); say(r.x, r.y - 50, pick(['嗨！', '海邊溜冰最舒服']), 1.4); }
}));
// 救生員：出來看海、吹哨
onAct($('tower'), () => {
  lifeguard.t = 5;
  sfx(whistle);
  say(lifeguard.x + 30, lifeguard.y - 40, pick(['游泳別靠近碼頭木樁！', '注意離岸流！']), 2);
});
// 排球：下一球殺球
onAct($('volley'), () => { volley.spikeNext = 1; say(1050, 440, pick(['殺球！', '這裡是沙灘排球的發源地']), 1.6); sfx(t => thump(t, .1)); });
// 吊環：盪過一排吊環
onAct($('rings'), () => {
  rings.travel = 4.2; rings.t = 0;
  say(1290, 420, pick(['肌肉海灘的老吊環', '一環一環盪過去！']), 1.6);
});
// 海鷗：一隻被嚇到，全部飛起來
gulls.forEach(g => g.g.addEventListener('click', e => {
  e.stopPropagation(); userGesture = true; ensureAudio();
  gulls.forEach(o => { if (!o.fly) { o.fly = .001; o.vx = rand(-90, 90); o.vy = rand(-80, -50); } });
  sfx(t => { flap(t); gullCall(t + .3); });
  if (reduced) settle(.3);
}));
// 沙灘行人：停下來說句話
$('walkers').addEventListener('click', e => {
  const pt = svgPoint(e);
  let best = null, bd = 1e9;
  walkers.forEach(w => { const d = Math.abs(w.x + pxCur * 11 - pt.x) + Math.abs(w.y - 20 - pt.y) * .5; if (d < bd) { bd = d; best = w; } });
  if (!best || bd > 34) return;
  e.stopPropagation(); userGesture = true;
  best.stop = 2.2;
  const lines = wx.rain > .5 ? ['冬天難得下雨', '雨停再下水'] : wx.fog > .5 ? ['六月常常這樣陰陰的', '霧中午就會散'] : wx.wind > .5 ? ['焚風好熱好乾！', '沙子吹到臉上了'] :
    best.t === 'surfer' ? ['今天浪不錯！', '要去碼頭旁邊衝浪'] : best.t === 'jog' ? ['每天沿海邊慢跑', '早安！'] : best.t === 'kid' ? ['我想坐摩天輪！', '我看到海豚了！'] :
    best.t === 'dog' ? ['狗狗也愛海邊', '牠想追海鷗'] : ['夕陽好美', '等一下去碼頭吃東西', '來加州度假！'];
  say(best.x + pxCur * 11, best.y - 52 * best.s, pick(lines), 1.8);
  if (reduced) renderStill();
});
// 碼頭遊客
$('deckPeople').addEventListener('click', e => {
  if (e.target.closest('[role="button"]')) return;
  const pt = svgPoint(e);
  const p = deckPeople.find(p => Math.abs(p.x + pxCur * 6 - pt.x) < 10 && pt.y < DECK_F + 2 && pt.y > PIER_Y - 22);
  if (!p) return;
  e.stopPropagation(); userGesture = true;
  p.stop = 2;
  say(p.x + pxCur * 6, PIER_Y - 30, pick(['來玩遊樂園！', '碼頭好熱鬧', '要不要去釣魚？']), 1.6);
});

/* ---------------- ⑤ 互動：控制列 ---------------- */
function syncAuto() { $('btnAuto').setAttribute('aria-pressed', String(T.auto)); $('btnAuto').textContent = T.auto ? '自動播放中' : '自動播放'; }
function goTo(t) { if (reduced) { T.t = t; applyTime(true); renderStill(); } else T.target = t; }
const tap = fn => () => { userGesture = true; ensureAudio(); setTimeout(() => { fn(); if (reduced) settle(2); }, actx && actx.state !== 'running' ? 120 : 0); };
$('btnWheel').addEventListener('click', tap(() => startWheel(false)));
$('btnCruise').addEventListener('click', tap(() => startCruise(false)));
$('btnWeather').addEventListener('click', () => {
  userGesture = true; ensureAudio();
  wxI = (wxI + 1) % WX_LIST.length;
  $('btnWeather').textContent = '天氣：' + WX_LIST[wxI][1];
  if (reduced) { for (const k in wx) wx[k] = WX_LIST[wxI][0] === k ? 1 : 0; applyWeather(0); renderStill(); }
});
$('btnSound').addEventListener('click', () => {
  soundOn = !soundOn; userGesture = true;
  $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  if (ensureAudio()) {
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.setValueAtTime(soundOn ? .5 : 0, actx.currentTime);
    if (!soundOn && musNode) { try { musNode.disconnect(); } catch (e) {} musNode = null; }
  }
  if (!soundOn) { try { window.sceneMusic && window.sceneMusic.stop(); } catch (e) {} }
});
$('btnDay').addEventListener('click', () => goTo(13 / 24));
$('btnNight').addEventListener('click', () => goTo(21 / 24));
$('btnAuto').addEventListener('click', () => { T.auto = !T.auto; T.target = null; syncAuto(); });
$('timeRange').addEventListener('input', e => {
  T.t = e.target.value / 1000; T.target = null; T.dragging = true; applyTime(true); T.dragging = false;
  if (reduced) renderStill();
});
mq.addEventListener?.('change', e => { reduced = e.matches; if (!reduced) { T.auto = true; syncAuto(); } start(); });

// 網站「作者精選」播放區：預設輪播「66 號公路老爺車巡遊」（使用者指定）；夕陽時開場，不會自己出聲，打開配樂後每一輪都配上巡遊音樂
if (inPicks) T.t = 17.6 / 24;
applyTime(true);
applyWeather(0);
syncAuto();
start();
if (inPicks) {
  let idle = 0;
  const ready = () => !show.on && cars.every(c => c.st === 'off');
  setTimeout(() => startCruise(true), 800);
  setInterval(() => { if (ready()) { idle += 1; if (idle >= 3) { idle = 0; startCruise(true); } } else idle = 0; }, 1000);
  window.sceneMusic = {
    playing: false,
    start(c) {
      if (this.playing) return; this.playing = true; pickAudio = true; userGesture = true;
      if (c && c !== actx) useCtx(c); else ensureAudio();
      if (actx && actx.state !== 'running') actx.resume();
      if (show.on === 'cruise' && show.t < 3 && actx) setTimeout(() => { if (audioOK()) cruiseBoogie(actx.currentTime + .05); }, 60);
    },
    stop() {
      this.playing = false; pickAudio = false;
      if (musNode) try { musNode.disconnect(); } catch (e) {} musNode = null;
      [rainGain, windGain].forEach(g => { if (g) g.gain.value = 0; });
    },
    duck() {}
  };
}
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on,
  btn: { wheel: 'btnWheel', cruise: 'btnCruise' },
  ff: () => { show.t = show.dur - .02; },
  save: () => ({ ...T }),
  stop: () => endShow(),
  after: () => { cars.forEach(c => { c.st = 'off'; c.el.style.display = 'none'; }); },   // 老爺車直接收走
  restore: s => { Object.assign(T, s); syncAuto(); applyTime(true); renderStill(); }
});
/* /ShowStop */
})();
</script>
</body>
</html>
