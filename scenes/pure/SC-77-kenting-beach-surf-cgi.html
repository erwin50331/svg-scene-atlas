<style>
/* =========================================================
   SC-77 墾丁・白沙灣、大街夜市、船帆石、鵝鑾鼻燈塔｜CGI 電影質感
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   --d-名稱 = 白天、--n-名稱 = 夜晚、--k-名稱 = 黃昏（可省略）。
   JS 依時間自動混色，輸出成 --名稱，並產生 .f-名稱（填色）、.s-名稱（線色）class。
   沒有 d/n 成對的（例如 --glow）是固定色。
   CGI 質感：柔和漸層打光、物件明暗面、環境光遮蔽陰影、水下光束與光紋、輕微暗角、底片顆粒。

  --d-skin3:#b98060; --n-skin3:#5e4c5c;
  --d-hair1:#2a2228; --n-hair1:#121224;
  --d-hair2:#7a4e30; --n-hair2:#3a2e3c;
  --d-hair3:#e0b048; --n-hair3:#6a5c40;
  --d-c1:#e84a5f; --n-c1:#6e3245;
  --d-c2:#2f80d0; --n-c2:#22396a;
  --d-c3:#ffd23f; --n-c3:#76643e;

  --d-c6:#ff9ec4; --n-c6:#7a5577;
  --d-c7:#ffffff; --n-c7:#80859f;
  --d-c8:#ff8a3d; --n-c8:#74422e;
  --d-c9:#253246; --n-c9:#141a30;
  --d-sh1:#2f4a7a; --n-sh1:#151c34;
  --d-sh2:#e0c89a; --n-sh2:#4c4350;
  --d-sh3:#3fa0a0; --n-sh3:#1d3a44;
  --d-ink:#1e1c24;   --n-ink:#0c0c14;

  /* —— 車、船 —— */
  --d-tire:#26262c;  --n-tire:#101016;
  --d-metal:#b9c2cc; --n-metal:#4c526e;
  --d-glass:#bfe6f5; --n-glass:#2a3a62;

  --neon1:#ff4fa3; --neon2:#3fe8ff; --neon3:#ffd23f; --neon4:#7dff8a;
  --beam:#fff4c2;      /* 燈塔光束 */

  --rainc:#a9bcd4; --flash:#ffffff;
  --spawn1:#ffb3c7; --spawn2:#ffd59a; --spawn3:#fff2f6;   /* 珊瑚產卵的卵束 */
  --para1:#ff4f6e; --para2:#ffd23f; --para3:#3fb7ff;      /* 拖曳傘 */

  /* —— 頁面介面 —— */
  --page-bg:#f4f6f2; --page-fg:#1d2b40; --page-muted:#5d6879;
  --ui-surface:#ffffff; --ui-line:#d8dde6; --ui-accent:#0f8f9a; --ui-accent-2:#e0567a;

}

:root{
  /* —— 表演打光：輕微暗角＋中央微亮 —— */
  --cine-shade:#0b1020; --cine-light:#fff1d6;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:14px;overflow:hidden;background:var(--skyB,#bfe9ff);line-height:0;box-shadow:0 6px 24px rgba(29,43,64,.14)}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:var(--ui-surface);border:1.5px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--page-fg);border-color:var(--page-fg);color:var(--ui-surface);font-weight:700}
.panel button.big{background:var(--ui-accent);border-color:var(--ui-accent);color:#fff;font-weight:700}
.panel button.big.alt{background:var(--ui-accent-2);border-color:var(--ui-accent-2)}
.panel button.big.on{background:var(--page-fg);border-color:var(--page-fg)}
.panel button:focus-visible,.panel input:focus-visible{outline:2px dashed var(--ui-accent);outline-offset:3px}
/* 畫面內可點物件：滑鼠點不顯示外框，用鍵盤 Tab 時才顯示 */
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px dashed var(--ui-accent);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 共用 ---------- */
#scene .clickable,#scene [role="button"]{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .bubble rect,#scene .bubble path{fill:#ffffff;stroke:#1d2b40;stroke-width:1.6}
#scene .bubble text{fill:#1d2b40;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .sign{font:900 12px var(--font-ui);text-anchor:middle;dominant-baseline:central}
@media (prefers-reduced-motion:reduce){ *{scroll-behavior:auto!important;transition:none!important} }
</style>
<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。
   想恢復完整版，刪掉這整段 <style id="pure-art"> 即可。
   ========================================================= */
html,body{height:100%;margin:0!important;overflow:hidden}
body{display:flex!important;align-items:center;justify-content:center;padding:0!important}
body>.wrap{width:100%!important;max-width:min(100vw,calc(100vh * 8 / 3))!important;
  margin:0!important;padding:0!important;gap:0!important;display:block!important}
body>.wrap>:not(.stage){display:none!important}
body>.wrap>.stage{width:100%!important;max-width:100%!important;margin:0!important;
  border:0!important;border-radius:0!important;box-shadow:none!important}
</style>
</head>
<body>

  <figure class="stage">

<script id="showstop">
/* =========================================================

   用法：放在場景主程式 <script> 之前；主程式最後呼叫

       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理

           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，

    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop

function stepWalkers(dt, mv) {
  LANES.forEach((L, li) => {
    const list = walkers.filter(w => w.lane === li).sort((a, b) => (b.x - a.x) * L.dir);   // 排在最前面的先算
    list.forEach((w, i) => {
      if (w.hidden > 0) {   // 走下沙灘或走出畫面，過一會兒從另一頭出現
        w.hidden -= dt;
        const start = L.dir > 0 ? -30 : 486;
        const busyStart = list.some(o => o !== w && !o.hidden && Math.abs(o.x - start) < 60);
        if (w.hidden <= 0 && !busyStart) { w.x = start; w.p.g.style.visibility = ''; } else if (w.hidden <= 0) w.hidden = .5;
        return;
      }
      let v = w.v0 * (1 + wx.rain * .4);
      if (w.stop > 0) { w.stop -= dt; v = 0; }
      const ahead = list.slice(0, i).filter(o => !o.hidden && (o.x - w.x) * L.dir > 0).pop();
      if (ahead) { const gap = (ahead.x - w.x) * L.dir - (ahead.len + w.len) / 2; if (gap < 14) v = Math.min(v, ahead.v * .9); if (gap < 6) v = 0; }
      w.v = v;
      w.x += v * L.dir * dt * mv;
      w.ph += v * dt * .22 * mv;
      walkLegs(w.p, w.ph, v > 0 ? (w.kind === 'jog' ? 34 : 24) : 0);
      if (w.dog) { const a = Math.floor(w.ph * 1.2) % 2 === 0; w.dog.a.setAttribute('visibility', a ? 'visible' : 'hidden'); w.dog.b.setAttribute('visibility', a ? 'hidden' : 'visible'); }

      if (cheer) arms(w.p, 160 + Math.sin(show.t * 8 + w.x) * 15, -160 - Math.sin(show.t * 8 + w.x) * 15);
      else if (w.kind !== 'board') arms(w.p, Math.sin(w.ph) * 18 * (v > 0), -Math.sin(w.ph) * 18 * (v > 0));
      w.p.g.setAttribute('transform', `translate(${f1(w.x)} ${L.y + (w.kind === 'jog' ? -Math.abs(Math.sin(w.ph)) * 2 : 0)})`);
      if ((L.dir > 0 && w.x > 486) || (L.dir < 0 && w.x < -30)) { w.hidden = rand(1, 4); w.p.g.style.visibility = 'hidden'; }
    });
  });
}

function stepSurf(dt, mv, tt) {
  const calm = 1 - wx.typh;
  // 浪：從右邊（外海）往左邊沙灘推進，越近越靠前
  for (let i = swells.length - 1; i >= 0; i--) {

    S.x -= S.v * dt * mv;
    S.y = lerp(400, 440, smooth(1340, 640, S.x));
    S.g.setAttribute('transform', `translate(${f1(S.x)} ${f1(S.y)})`);
    S.g.setAttribute('opacity', f1(clamp((S.x - 600) / 60, 0, 1) * clamp((1360 - S.x) / 40, 0, 1)));

  }
  surfers.forEach(U => {
    if (U.state === 'sit') {
      U.dir = -1;
      U.y = 412 + Math.sin(tt * 1.6 + U.slot) * 1.5;
      // 浪經過時起乘（每道浪只載一個人）

      if (S && calm > .5 && Math.random() < (show.on === 'surf' ? .9 : .5)) { S.rider = U; U.swell = S; U.state = 'ride'; }
    } else if (U.state === 'ride') {

      if (!S || !swells.includes(S) || U.wipe) { U.state = 'paddle'; U.dir = 1; U.wipe = 0; if (S) S.rider = null; U.swell = null; }
      else { U.x = S.x + 22 * (S.big > 1.2 ? 1.5 : 1); U.y = S.y - 12 * (S.big > 1.2 ? 1.5 : 1); U.dir = -1; }

      if (U.x >= U.slot) { U.x = U.slot; U.state = 'sit'; }
    }
    surferPose(U, tt);
    U.g.setAttribute('transform', `translate(${f1(U.x)} ${f1(U.y)})`);
    vis(U.g, calm * dayish());
  });
}

/* —— 音樂一：南灣衝浪浪潮（原創，E 小調 8-bit 衝浪搖滾，每分鐘 160 拍 12 小節約 19 秒；方波顫音主旋律、三角波低音、雜訊鼓） —— */

      const len = bar === 11 ? 16 : 4;

    });
  });

}

/* —— 音樂二：珊瑚產卵之夜（原創，D 大調音樂盒，每分鐘 72 拍 6 小節約 20 秒；鐘琴琶音、柔和合成墊、氣泡聲） —— */

function coralMusic(t0) {

/* ---------------- ④ 動畫：日夜 ---------------- */
const T = { t: .458, auto: true, target: null, hold: false, dragging: false };
let night = 0, dusk = 0, nOn = 0, market = 0, cocoOpen = 1, lastApplied = -1;
const SUN = { x: 0, y: 0, low: 0 };
const SKY_KEYS = ['skyT', 'skyB', 'cloud', 'cloudSh'];
function clockText() {
  const h = T.t * 24, hh = Math.floor(h) % 24, mm = Math.floor((h - Math.floor(h)) * 60 + 1e-6);
  return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
}
function applyTime(force) {
  if (!force && Math.abs(T.t - lastApplied) < .0003) return;
  lastApplied = T.t;
  const h = T.t * 24;
  // 墾丁：大約 6 點日出、18 點多日落（太陽落進西邊的海裡）
  night = clamp(1 - smooth(5.5, 6.5, h) + smooth(18.1, 19, h), 0, 1);
  dusk = Math.max(Math.exp(-Math.pow((h - 6.0) / .7, 2)) * .7, Math.exp(-Math.pow((h - 18.1) / .8, 2)));
  for (const k in PAIRS) {
    if (SKY_KEYS.includes(k)) continue;
    const Pp = PAIRS[k];
    let c = mix(Pp.d, Pp.n, night);
    if (Pp.k) c = mix(c, Pp.k, dusk * .8);
    root.style.setProperty('--' + k, rgba(c));
  }
  const sp = (h - 5.9) / 12.4, mp = ((h - 18.6 + 24) % 24) / 11.4;
  const sx = 80 + sp * 1240, sy = HZ - Math.sin(Math.PI * clamp(sp, -.1, 1.1)) * 250;
  SUN.x = sx; SUN.y = sy; SUN.low = clamp(1 - Math.sin(Math.PI * clamp(sp, 0, 1)) * 2.2, 0, 1) * (sp > .5 ? 1 : .4);
  $('sun').setAttribute('transform', `translate(${snap(sx)} ${snap(sy)})`);
  $('sun').style.display = sp > -.06 && sp < 1.06 ? '' : 'none';
  $('moon').setAttribute('transform', `translate(${snap(420 + mp * 900)} ${snap(HZ - 20 - Math.sin(Math.PI * clamp(mp, 0, 1)) * 230)})`);
  $('moon').style.display = mp > -.05 && mp < 1.05 ? '' : 'none';
  nOn = smooth(.3, .85, night);
  market = h >= 16 ? smooth(16.8, 17.6, h) : h < 2 ? 1 - smooth(1, 1.6, h) : 0;
  cocoOpen = h >= 9 || h < 1.6 ? 1 : 0;
  $('clock').textContent = clockText();
  if (!T.dragging) $('timeRange').value = Math.round(T.t * 1000);
  winLights.forEach(w => w.el.setAttribute('opacity', nOn > w.th ? .9 : 0));
  stars.forEach(s => s.base = nOn);
  stalls.forEach(S => {
    const open = S.T.allDay ? Math.max(cocoOpen, market) : market;
    S.isOpen = open > .5;
    S.open.setAttribute('opacity', f1(open)); S.vend.setAttribute('opacity', f1(open)); S.tarp.setAttribute('opacity', f1(1 - open));
    S.vend.style.visibility = open < .05 ? 'hidden' : '';

  });

}
const grey = () => clamp(wx.cloud * .45 + wx.rain * .7, 0, .85);
function updateSky() {
  const gr = grey();
  SKY_KEYS.forEach(k => {
    const Pp = PAIRS[k];
    let c = mix(Pp.d, Pp.n, night);
    if (Pp.k) c = mix(c, Pp.k, dusk * .85 * (1 - gr * .7));

  const bl = $('bloom');
  bl.setAttribute('cx', f1(SUN.x)); bl.setAttribute('cy', f1(SUN.y));

/* ---------------- ④ 動畫：閃光、飄起的小圖、海面漣漪、炭烤的煙 ---------------- */

  for (let i = flashes.length - 1; i >= 0; i--) {
    const f = flashes[i]; f.t += dt;
    const k = f.t / f.life;
    f.el.setAttribute('opacity', f1(clamp((1 - k) * (f.rect ? .45 : f.fly ? 2 : 1), 0, 1)));
    if (f.fly) f.el.setAttribute('transform', `translate(${f1(f.fly.x)} ${f1(f.fly.y - k * 40)})`);
    if (k >= 1) { if (f.rect) f.el.setAttribute('opacity', 0); else f.el.remove(); flashes.splice(i, 1); }

function showStep(dt) {

    if (S.t > 5 && S.t < 17 && mvG) {
      const rate = S.t < 7 ? 10 : 34;

        const g = el('g', {}, $('spawn'));

function stepSpawn(dt, mv, tt) {
  for (let i = spawnBits.length - 1; i >= 0; i--) {
    const b = spawnBits[i]; b.t += dt;

    else { b.x += 6 * dt * mv; }

    b.el.setAttribute('opacity', f1(fade * (show.on === 'coral' ? 1 : clamp(1 - (b.t - 6) / 3, 0, 1))));
    if (b.t > 16 || (!show.on && b.t > 9)) { b.el.remove(); spawnBits.splice(i, 1); }

  } else if (T.auto && !T.hold && !T.dragging) T.t = (T.t + dt / DAY_SEC) % 1;

  wx.rain += ((want === 'storm' ? 1 : want === 'typh' ? .9 : 0) - wx.rain) * k;
  wx.wind += ((want === 'storm' ? .4 : want === 'gale' || want === 'typh' ? 1 : 0) - wx.wind) * k;

/* ---------------- ⑤ 互動：點擊、滑鼠 ---------------- */
function svgPoint(e) { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
svg.addEventListener('pointerdown', () => { userGesture = true; ensureAudio(); document.body.classList.remove('kbd'); });
window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
const seaAt = (x, y) => y > HZ + 6 && y < WL - 4 && x > 600 && x < CLIFF_X && !(x > 1128 && x < 1284 && y > 324);
const uwAt = (x, y) => y > WL + 8 && x > 1050 && x < 1360 && y < seabed(x) - 8;
svg.addEventListener('pointermove', e => {
  const p = svgPoint(e);
  const d = Math.hypot(p.x - mouse.lx, p.y - mouse.ly);
  mouse.x = p.x; mouse.y = p.y; mouse.in = true; mouse.dx = (p.x - 800) / 800 * -10;
  if (reduced || d < 20) return;
  mouse.lx = p.x; mouse.ly = p.y;
  if (seaAt(p.x, p.y)) ripple(p.x, p.y);
  else if (uwAt(p.x, p.y) && Math.random() < .5) bubble(p.x, p.y);
});
svg.addEventListener('pointerleave', () => { mouse.dx = 0; mouse.in = false; });
svg.addEventListener('click', e => {
  userGesture = true; ensureAudio();
  const p = svgPoint(e);
  if (seaAt(p.x, p.y)) { splashAt(p.x, p.y, .8); sfx(t => splash(t, .5)); return; }
  if (uwAt(p.x, p.y)) { for (let k = 0; k < 6; k++) bubble(p.x + rand(-6, 6), p.y); sfx(t => bubbleSnd(t)); return; }
  if (p.y < 260) {
    if (night > .5 && wx.rain < .5) { meteor(p.x - 100); say(p.x, p.y + 30, '流星！許個願吧', 1.4); sfx(t => twinkle(t)); }
    else { hawkFlock(p.x < 800 ? -30 : 1630, clamp(p.y, 50, 200)); say(p.x, clamp(p.y + 40, 80, 240), '灰面鵟鷹：每年秋天過境恆春半島', 2.2); sfx(t => hawkCry(t)); }
  }
  if (reduced) step(.05);
});
onAct($('sun'), () => { T.auto = false; syncAuto(); goTo(20.5 / 24); });
onAct($('moon'), () => { T.auto = false; syncAuto(); goTo(11 / 24); });
const factsLH = ['鵝鑾鼻燈塔：1883 年建成', '被稱為「東亞之光」', '圍牆上有槍眼，是少見的武裝燈塔', '白色塔身，高約 21 公尺', '位在台灣南端的鵝鑾鼻'];
let fiL = 0;
onAct(lhG, () => { lhFlash = 1.5; say(LH.x - 60, 60, factsLH[fiL++ % factsLH.length], 2.6); sfx(t => chime(t)); });
const factsRock = ['船帆石：遠看像一艘揚帆的船', '也有人說像美國前總統尼克森的側臉', '是一塊巨大的珊瑚礁岩'];
let fiR = 0;
onAct(rockG, () => { say(1206, 290, factsRock[fiR++ % factsRock.length], 2.6); sfx(t => chime(t)); splashAt(1250, 446, .6); });
const factsMt = ['大尖山：墾丁的地標，海拔 318 公尺', '山形尖尖的，像一座金字塔', '山腳下是牧場，常看到牛在吃草'];
let fiM = 0;
onAct(mtG, () => { say(300, 96, factsMt[fiM++ % factsMt.length], 2.6); sfx(t => fiM % 3 === 0 ? moo(t) : chime(t)); });
onAct(anemG, () => { clowns.forEach(c => c.hide = 2.5); say(1072, 520, pick(['小丑魚躲進海葵裡了', '海葵保護小丑魚，小丑魚幫海葵清潔']), 2.2); sfx(t => bubbleSnd(t)); });
stalls.forEach(S => onAct(S.g, () => {
  if (!S.isOpen) { say(S.x + 38, S.B - 110, '夜市傍晚才開喔', 1.6); sfx(t => hello(t)); return; }
  S.busy = 1.6;
  const k = S.T.key;
  if (k === 'balloon') {
    const bx = S.x + 12 + Math.floor(rand(0, 6)) * 11, by = S.B - 68 + Math.floor(rand(0, 3)) * 12;
    const bal = el('circle', { cx: bx, cy: by, r: 5, class: 'f-board' }, S.open);
    setTimeout(() => bal.remove(), 2500);
    splashAt(bx, by, .3);
    say(S.x + 38, S.B - 110, pick(['射中了！', '三發中兩發，換一隻小熊']), 1.6); sfx(t => pop(t));
  } else {
    floater(S.x + 38, S.B - 90, FOOD[k], 1.6);
    say(S.x + 38, S.B - 116, { squid: '烤魷魚，刷上醬汁！', corn: '炭烤玉米，香噴噴', coco: '現剖椰子水，好清涼', sausage: '烤香腸配一瓣蒜頭' }[k], 1.8);
    sfx(t => k === 'coco' ? knock(t) : sizzle(t));
  }
}));
onAct(shopSurf, () => { say(150, 330, pick(['衝浪店：可以租板、上衝浪課', '南灣浪小，適合初學', '冬天東北季風時，佳樂水的浪最大']), 2.4); sfx(t => chime(t)); });
onAct(shopIce, () => { floater(244, 400, FOOD.mango, 1.6); say(244, 320, pick(['芒果冰！夏天的芒果最甜', '加一球冰淇淋']), 2); sfx(t => chime(t)); });
onAct(shopRent, () => {
  if (laneClear('F', 340)) { const V = addVehicle('scooter', 'F', 340); V.v0 = 60; say(336, 330, '租一台機車，去鵝鑾鼻兜風！', 2); sfx(t => engine(t)); }
  else say(336, 330, '騎機車要戴安全帽喔', 1.8);
});
onAct(shopBar, () => { for (let i = 0; i < 4; i++) setTimeout(() => floater(430 + rand(-30, 30), 360, FOOD.note, 1.4), i * 250); say(430, 320, pick(['海邊酒吧：晚上有樂團', '來一首海灘音樂！']), 2); sfx(t => barRiff(t)); });
onAct(hostelG, () => { say(52, 300, pick(['民宿：白牆藍窗，很有海島味', '早上起床就能看到大尖山']), 2.2); sfx(t => chime(t)); });
onAct(signG, () => { say(516, 420, pick(['往白沙灣：沙子是白色的貝殼砂', '白沙灣是看夕陽的好地方']), 2.2); sfx(t => hello(t)); });
onAct(castleG, () => {
  castle.lvl = castle.lvl >= 3 ? 1 : castle.lvl + 1; drawCastle();
  say(660, 470, castle.lvl === 3 ? '沙堡完成！插上旗子' : castle.lvl === 1 ? '重新蓋一座更大的' : '再堆高一點', 1.8);
  sfx(t => castle.lvl === 3 ? chime(t) : noise(t, .2, 1200, .08, 'bandpass', 1, .01));
});

/* ---------------- ⑤ 互動：控制列 ---------------- */
function syncAuto() { $('btnAuto').setAttribute('aria-pressed', String(T.auto)); $('btnAuto').textContent = T.auto ? '自動播放中' : '自動播放'; }
function goTo(t) { if (reduced) { T.t = t; applyTime(true); step(.05); } else T.target = t; }
const tap = fn => () => { userGesture = true; ensureAudio(); setTimeout(() => { fn(); if (reduced) step(.05); }, actx && actx.state !== 'running' ? 120 : 0); };
$('btnSurf').addEventListener('click', tap(() => startSurf(false)));
$('btnCoral').addEventListener('click', tap(() => startCoral(false)));
$('btnWeather').addEventListener('click', () => {
  userGesture = true; ensureAudio();
  wxI = (wxI + 1) % WX_LIST.length;
  if (show.on && wxI >= 2) wxI = 0;   // 表演時跳過雷雨、落山風、颱風
  $('btnWeather').textContent = '天氣：' + WX_LIST[wxI][1];
  const w = WX_LIST[wxI][0];
  if (w === 'storm') boltT = 1.2;
  if (w === 'gale') say(400, 250, '落山風：秋冬從山上往海邊吹的強風', 2.4);
  if (w === 'typh') say(800, 250, '颱風來了！衝浪客和水上摩托車都上岸了', 2.4);
  if (reduced) step(.05);
});
$('btnSound').addEventListener('click', () => {
  soundOn = !soundOn; userGesture = true;
  $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  if (ensureAudio()) {
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.setValueAtTime(soundOn ? .5 : 0, actx.currentTime);
    if (!soundOn) { [musNode, sfxNode].forEach(n => { if (n) try { n.disconnect(); } catch (e) {} }); musNode = sfxNode = null; }
  }
  if (!soundOn) { try { window.sceneMusic && window.sceneMusic.stop(); } catch (e) {} }
});
$('btnDay').addEventListener('click', () => { T.auto = false; syncAuto(); goTo(11 / 24); });
$('btnNight').addEventListener('click', () => { T.auto = false; syncAuto(); goTo(20.5 / 24); });
$('btnAuto').addEventListener('click', () => { T.auto = !T.auto; T.target = null; syncAuto(); });
$('timeRange').addEventListener('input', e => {
  T.t = e.target.value / 1000; T.target = null; T.dragging = true; applyTime(true); T.dragging = false;
  if (reduced) step(.05);
});
function start() {
  cancelAnimationFrame(rafId);
  if (reduced) { T.auto = false; syncAuto(); applyTime(true); step(.05); }
  else { last = performance.now(); rafId = requestAnimationFrame(loop); }
}
mq.addEventListener?.('change', e => { reduced = e.matches; if (!reduced) { T.auto = true; syncAuto(); } start(); });

applyTime(true);
syncAuto();
step(.016);
start();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on,
  btn: { surf: 'btnSurf', coral: 'btnCoral' },
  ff: () => { show.wow = true; show.swT.forEach(s => s.done = true); show.t = show.dur - .02; },   // 跳到結尾收尾
  save: () => ({ T: { ...T }, w: wxI }),
  stop: () => endShow(),
  restore: s => {
    Object.assign(T, s.T); T.hold = false; syncAuto();
    if (wxI !== s.w) { wxI = s.w; $('btnWeather').textContent = '天氣：' + WX_LIST[wxI][1]; }
    applyTime(true);
  }
});
/* /ShowStop */
})();
</script>
</body>
</html>
