<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>法羅群島海崖村</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
/* =========================================================
   SC-18 法羅群島｜剪紙層疊風格
   【色票 token】所有顏色集中在這裡。
   - 場景色成對出現：--名稱-day / --名稱-night，
     JS 依「日夜比例」自動混色，輸出成 --名稱 給 SVG 使用，
     並自動產生 .f-名稱（填色）與 .s-名稱（描邊）class。
   - 「常亮光源」不參與混色（窗燈、燈塔、極光、彩虹）。
   換色時只需改這個區塊。
   ========================================================= */
:root{
  color-scheme:dark;

  /* ---- 頁面外框 ---- */
  --page-bg:#121820;
  --page-panel:#1c2430;
  --page-fg:#ebe7dc;
  --page-dim:#a0a39f;
  --page-line:#2f3a4a;
  --page-accent:#7fd6a8;
  --font-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;

  /* ---- 天空、雲 ---- */
  --sky-top-day:#9cc3d6;      --sky-top-night:#070d26;
  --sky-bot-day:#e6e6da;      --sky-bot-night:#1d2a52;
  --cloud-day:#f7f6f0;        --cloud-night:#38436c;
  --cloud-dk-day:#d6dbdf;     --cloud-dk-night:#283158;

  /* ---- 遠島、大山 ---- */
  --isle-far-day:#b8cacd;     --isle-far-night:#1c2645;
  --isle-mid-day:#93afb0;     --isle-mid-night:#18213d;
  --isle-line-day:#cad8d6;    --isle-line-night:#26304f;
  --mtn-day:#6f9273;          --mtn-night:#15233a;
  --mtn-rock-day:#5a6c66;     --mtn-rock-night:#111b2f;
  --mtn-line-day:#89a688;     --mtn-line-night:#1d2c44;

  /* ---- 海（由遠到近四層） ---- */
  --sea-far-day:#82abb9;      --sea-far-night:#15213f;
  --sea-mid-day:#5f90a3;      --sea-mid-night:#111c38;
  --sea-near-day:#487b91;     --sea-near-night:#0d1730;
  --sea-front-day:#35657c;    --sea-front-night:#091126;
  --foam-day:#f2f6f4;         --foam-night:#8592bd;

  /* ---- 海崖、海蝕柱、瀑布 ---- */
  --rock-a-day:#50564f;       --rock-a-night:#1b1f30;
  --rock-b-day:#656b62;       --rock-b-night:#242839;
  --rock-c-day:#3e433f;       --rock-c-night:#13162a;
  --cave-day:#23272a;         --cave-night:#06070e;
  --grass-top-day:#7fae5e;    --grass-top-night:#1f3a35;
  --grass-dk-day:#5d8e4a;     --grass-dk-night:#172c2b;
  --grass-lt-day:#a3c874;     --grass-lt-night:#2b4a40;
  --stream-day:#bfe0ea;       --stream-night:#5a6f9e;
  --fall-day:#f7fbfb;         --fall-night:#a3b0d6;

  /* ---- 前景草坡 ---- */
  --front-grass-day:#6c9f4f;  --front-grass-night:#18302c;
  --front-grass-dk-day:#4f7d3b; --front-grass-dk-night:#10221f;
  --stone-day:#9a988e;        --stone-night:#33354a;
  --stone-dk-day:#77756d;     --stone-dk-night:#23253a;

  /* ---- 村莊建築 ---- */
  --wall-tar-day:#2f3236;     --wall-tar-night:#121420;
  --wall-red-day:#b5432f;     --wall-red-night:#4a2027;
  --wall-white-day:#efe9dc;   --wall-white-night:#4d5170;
  --wall-ochre-day:#d9a441;   --wall-ochre-night:#5e4b2e;
  --trim-day:#f6f2e8;         --trim-night:#6d7091;
  --roof-turf-day:#6f9c4c;    --roof-turf-night:#1e352d;
  --roof-turf-lt-day:#95be65; --roof-turf-lt-night:#284437;
  --win-day:#3c4b57;          --win-night:#151b2e;
  --door-day:#5b3a2a;         --door-night:#1d1520;
  --road-day:#8a8b84;         --road-night:#2a2c3d;
  --quay-day:#aba79c;         --quay-night:#34364b;
  --quay-dk-day:#7c786f;      --quay-dk-night:#24253a;
  --wood-day:#8a6a4a;         --wood-night:#2e2532;

  /* ---- 交通工具 ---- */
  --hull-white-day:#f4f2ec;   --hull-white-night:#6a6b88;
  --hull-blue-day:#24476b;    --hull-blue-night:#121c38;
  --hull-red-day:#c2412f;     --hull-red-night:#4a1e26;
  --cabin-day:#e3e8ea;        --cabin-night:#4b5172;
  --boat-yellow-day:#e2b33c;  --boat-yellow-night:#5d4b2c;
  --car-day:#2b86c5;          --car-night:#1c2f4a;
  --heli-day:#d8d4c8;         --heli-night:#4a4c66;

  /* ---- 人物、動物 ---- */
  --ink-day:#2a2a2e;          --ink-night:#04050c;
  --skin-day:#e9c4a0;         --skin-night:#8b7373;
  --hair-day:#3b2e28;         --hair-night:#110e16;
  --coat1-day:#d4533c;        --coat1-night:#6a2f35;
  --coat2-day:#3a6c93;        --coat2-night:#1e3352;
  --coat3-day:#e5b742;        --coat3-night:#776236;
  --coat4-day:#5d7f52;        --coat4-night:#22342c;
  --coat5-day:#8a5aa0;        --coat5-night:#34284a;
  --pants-day:#383d48;        --pants-night:#14151f;
  --wool-day:#f4f0e6;         --wool-night:#8d8fa8;
  --wool-brown-day:#8d6a4c;   --wool-brown-night:#33283a;
  --wool-dark-day:#4a4440;    --wool-dark-night:#1c1a26;
  --sheep-face-day:#2e2a28;   --sheep-face-night:#0b0a12;
  --dog-day:#2c2826;          --dog-night:#0a0910;
  --dog-white-day:#f2efe6;    --dog-white-night:#868aa5;
  --puffin-day:#26272c;       --puffin-night:#07080f;
  --puffin-face-day:#f5f2ea;  --puffin-face-night:#9196b5;
  --beak-day:#ef7a2e;         --beak-night:#7a3c22;
  --gull-day:#ffffff;         --gull-night:#9aa0c4;

  /* ---- 天氣 ---- */
  --fog-day:#eef0ee;          --fog-night:#5f6893;
  --fog-dk-day:#d9dee0;       --fog-dk-night:#4a5380;
  --storm-day:#5b6670;        --storm-night:#10152a;
  --rainc-day:#e3ecf1;        --rainc-night:#7d8cbc;

  /* ---- 常亮光源（不隨日夜混色） ---- */
  --win-on:#ffd27a;     /* 窗內暖光 */
  --lamp:#ffe6a8;       /* 路燈、車燈 */
  --beacon:#fff1b8;     /* 燈塔 */
  --nav-red:#ff4a4a;    /* 左舷紅燈 */
  --nav-green:#49f0a0;  /* 右舷綠燈 */
  --sun:#ffd98a;
  --moon:#f4f0dc;
  --star:#fff8e0;
  --dusk:#ff9a62;       /* 黃昏、清晨的地平線暖光 */
  --aurora1:#5cf2b0;    /* 極光：綠 */
  --aurora2:#46c8e8;    /* 極光：青 */
  --aurora3:#b98cf0;    /* 極光：紫 */
  --rb1:#e85a4f; --rb2:#f29a3b; --rb3:#f2d24b; --rb4:#6cc46a; --rb5:#4f9ed8; --rb6:#8a6bc9; /* 彩虹 */
}

/* ===== 頁面版面 ===== */
html,body{margin:0;background:var(--page-bg);color:var(--page-fg)}
body{font-family:var(--font-body);line-height:1.6}
.wrap{max-width:1680px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
h1{font-family:var(--font-display);font-weight:900;font-size:clamp(1.4rem,2.6vw,2rem);margin:0;letter-spacing:.04em;text-wrap:balance}
h1 small{font-size:.55em;font-weight:700;color:var(--page-accent);letter-spacing:.12em;margin-right:.6em}
.meta{color:var(--page-dim);font-size:.9rem;margin:0}
.stage{position:relative;border-radius:6px;overflow:hidden;background:#000;
  box-shadow:0 0 0 1px var(--page-line),0 18px 40px -18px #000}
.stage svg{display:block;width:100%;height:auto;max-width:100%;touch-action:manipulation}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.controls button{font:500 .95rem/1 var(--font-body);color:var(--page-fg);background:var(--page-panel);
  border:1px solid var(--page-line);border-radius:3px;padding:10px 16px;cursor:pointer;
  box-shadow:0 3px 0 -1px #0007;transition:transform .12s,background .2s}
.controls button:hover{background:#28313f}
.controls button:active{transform:translateY(2px)}
.controls button:focus-visible{outline:2px solid var(--page-accent);outline-offset:2px}
.controls button[aria-pressed="true"]{border-color:var(--page-accent);color:#fff}
.clock{margin-left:auto;font-family:var(--font-display);font-size:1rem;color:var(--page-dim);font-variant-numeric:tabular-nums}
.hint{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px 20px;color:var(--page-dim);font-size:.88rem}
.hint b{color:var(--page-fg);font-weight:500;margin-right:.4em}

/* ===== SVG 內樣式 ===== */
#cut feDropShadow{flood-color:var(--ink);flood-opacity:.5}
#cutSoft feDropShadow{flood-color:var(--ink);flood-opacity:.36}
.lit{fill:var(--win-on);opacity:0;transition:opacity .35s}
.lit.on{opacity:var(--lit,.2)}
.win,.sheep,#puffins,#ferry,#church,#car,#fallHit,#sky,.seaHit,#fishBoat,#lighthouse{cursor:pointer}
.bubble text{font-family:var(--font-display);font-weight:900;font-size:21px;fill:var(--ink)}
.ring{fill:none;stroke:var(--foam);stroke-width:3}
.star{fill:var(--star)}
.twinkle{animation:tw 3s ease-in-out infinite}
.twinkle:nth-child(3n){animation-delay:-1s}.twinkle:nth-child(3n+1){animation-delay:-2s}
@keyframes tw{50%{opacity:.25}}
.umb{opacity:0;transition:opacity .6s}
.raining .umb{opacity:1}
@media (prefers-reduced-motion: reduce){
  .twinkle{animation:none}
  .lit,.umb{transition:none}
}
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>
<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。
   想恢復完整版，刪掉這整段 <style id="pure-art"> 即可。
   ========================================================= */
html,body{height:100%;margin:0!important;overflow:hidden}
body{display:flex!important;align-items:center;justify-content:center;padding:0!important}
body>.wrap{width:100%!important;max-width:min(100vw,calc(100vh * 8 / 3))!important;
  margin:0!important;padding:0!important;gap:0!important;display:block!important}
body>.wrap>:not(.stage){display:none!important}
body>.wrap>.stage{width:100%!important;max-width:100%!important;margin:0!important;
  border:0!important;border-radius:0!important;box-shadow:none!important}
</style>
</head>
<body>
<main class="wrap">
  <div class="stage">
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="法羅群島海崖村的剪紙動畫場景">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--sky-top)"/>
        <stop offset=".62" stop-color="var(--sky-bot)"/>
      </linearGradient>
      <linearGradient id="duskGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset=".2" stop-color="var(--dusk)" stop-opacity="0"/>
        <stop offset=".55" stop-color="var(--dusk)" stop-opacity=".75"/>
        <stop offset=".62" stop-color="var(--dusk)" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="sunGlow"><stop offset="0" stop-color="var(--sun)" stop-opacity=".55"/><stop offset="1" stop-color="var(--sun)" stop-opacity="0"/></radialGradient>
      <radialGradient id="moonGlow"><stop offset="0" stop-color="var(--moon)" stop-opacity=".35"/><stop offset="1" stop-color="var(--moon)" stop-opacity="0"/></radialGradient>
      <radialGradient id="glowGrad"><stop offset="0" stop-color="var(--lamp)" stop-opacity=".7"/><stop offset="1" stop-color="var(--lamp)" stop-opacity="0"/></radialGradient>
      <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="var(--beacon)" stop-opacity=".75"/><stop offset="1" stop-color="var(--beacon)" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="headGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="var(--lamp)" stop-opacity=".6"/><stop offset="1" stop-color="var(--lamp)" stop-opacity="0"/>
      </linearGradient>
      <!-- 極光三色：上淡下濃 -->
      <linearGradient id="aur1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--aurora3)" stop-opacity="0"/><stop offset=".55" stop-color="var(--aurora1)" stop-opacity=".55"/><stop offset="1" stop-color="var(--aurora1)" stop-opacity="0"/></linearGradient>
      <linearGradient id="aur2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--aurora2)" stop-opacity="0"/><stop offset=".6" stop-color="var(--aurora2)" stop-opacity=".45"/><stop offset="1" stop-color="var(--aurora1)" stop-opacity="0"/></linearGradient>
      <radialGradient id="vignette" cx=".5" cy=".5" r=".75">
        <stop offset=".62" stop-color="#000" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity=".4"/>
      </radialGradient>
      <mask id="moonMask"><circle r="25" fill="#fff"/><circle cx="10" cy="-6" r="21" fill="#000"/></mask>
      <!-- 海崖輪廓、遠島輪廓（JS 填入 d），用來裁切岩層條紋 -->
      <clipPath id="cliffClip"><path id="cliffClipPath"/></clipPath>
      <clipPath id="mtnClip"><path id="mtnClipPath"/></clipPath>
      <clipPath id="isleClip"><path id="isleClipPath"/></clipPath>
      <!-- 剪紙投影：每層紙板底下的影子 -->
      <filter id="cut" x="-5%" y="-15%" width="110%" height="135%">
        <feDropShadow dx="0" dy="5" stdDeviation="4"/>
      </filter>
      <filter id="cutSoft" x="-20%" y="-20%" width="140%" height="150%">
        <feDropShadow dx="0" dy="2.5" stdDeviation="2"/>
      </filter>
      <!-- 紙張纖維紋理 -->
      <filter id="paper" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="18"/>
        <feColorMatrix values="0 0 0 0 .5  0 0 0 0 .46  0 0 0 0 .4  0 0 0 .9 0"/>
      </filter>
    </defs>

    <!-- ================= 【場景】天空 ================= -->
    <!-- 點天空放出一隻海鷗 -->
    <rect id="sky" width="1600" height="600" fill="url(#skyGrad)"/>
    <rect id="duskGlow" width="1600" height="600" fill="url(#duskGrad)" opacity="0" pointer-events="none"/>
    <g id="stars" class="nightOnly" pointer-events="none"></g>
    <!-- 【動畫】極光（JS 每幀重畫波形） -->
    <g id="aurora" opacity="0" pointer-events="none">
      <path id="aurA" fill="url(#aur1)"/>
      <path id="aurB" fill="url(#aur2)"/>
      <path id="aurC" fill="url(#aur1)" opacity=".6"/>
    </g>
    <g id="sun" pointer-events="none"><circle r="90" fill="url(#sunGlow)"/><circle r="32" fill="var(--sun)"/></g>
    <g id="moon" pointer-events="none"><circle r="70" fill="url(#moonGlow)"/><circle r="24" fill="var(--moon)" mask="url(#moonMask)"/></g>
    <!-- 彩虹（陣雨過後的白天出現） -->
    <g id="rainbow" opacity="0" fill="none" stroke-width="7" pointer-events="none">
      <path d="M720,340 A330,300 0 0 1 1380,340" stroke="var(--rb1)"/>
      <path d="M727,340 A323,293 0 0 1 1373,340" stroke="var(--rb2)"/>
      <path d="M734,340 A316,286 0 0 1 1366,340" stroke="var(--rb3)"/>
      <path d="M741,340 A309,279 0 0 1 1359,340" stroke="var(--rb4)"/>
      <path d="M748,340 A302,272 0 0 1 1352,340" stroke="var(--rb5)"/>
      <path d="M755,340 A295,265 0 0 1 1345,340" stroke="var(--rb6)"/>
    </g>
    <!-- 【動畫】紙雲（JS 生成，隨風飄） -->
    <g id="clouds" pointer-events="none"></g>

<script>
(() => {
"use strict";
/* =========================================================
   基本工具
   ========================================================= */
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const svg = $("scene");
const root = document.documentElement;
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
// 固定亂數種子：每次載入的山形、草叢長一樣
function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const R = rng(18181818);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const f1 = v => v.toFixed(1);
// 依控制點做線性內插，用來查「某個 x 的地面高度」
function lineAt(pts, x) {
  if (x <= pts[0][0]) return pts[0][1];
  for (let i = 0; i < pts.length - 1; i++) {
    const [ax, ay] = pts[i], [bx, by] = pts[i + 1];
    if (x <= bx) return ay + (by - ay) * (x - ax) / (bx - ax);
  }
  return pts[pts.length - 1][1];
}
// 剪刀邊：沿控制點產生帶小鋸齒的稜線
function edge(pts, jitter, step = 20) {
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const [ax, ay] = pts[i], [bx, by] = pts[i + 1];
    const n = Math.max(1, Math.round(Math.abs(bx - ax) / step));
    for (let s = 0; s < n; s++) {
      const k = s / n;
      out.push([ax + (bx - ax) * k, ay + (by - ay) * k + (s ? (R() - .5) * jitter : 0)]);
    }
  }
  out.push(pts[pts.length - 1]);

let gust = 0, gustTimer = 0;
function sheepBaa(S) {

  if (reduced) S.hop = 0;
}
function scarePuffins() {

  }

}
$("fallHit").addEventListener("click", e => {

function ringAt(x, y) {

}
let bellT = 0;

let carHonk = 0;
$("lighthouse").addEventListener("click", e => {

});
let beaconBoost = 0;
$("fishBoat").addEventListener("click", e => {

  for (let i = 0; i < 3; i++) spawnGull(1300 + rand(-60, 60), 480, rand(-1, 1) > 0 ? 1 : -1);
});
let boatToss = 0;
$("ferry").addEventListener("click", e => {

  hornT = 1.6;
  bubble(ferry.x + 110 + layerShift(.55), 330, "嘟——");
  if (ferry.state === "dock") ferry.tm = 99;
});
let hornT = 0;
// 點天空：放出一隻海鷗

document.querySelectorAll(".seaHit").forEach(s => s.addEventListener("click", e => {

  ripple(pt.x, pt.y, pt.y > 500 ? 1.3 : pt.y > 440 ? 1 : .6);

function toSvg(e) {
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}

/* =========================================================
   【動畫】海鷗（盤旋＋點天空放出的）
   ========================================================= */
const gulls = [];
function makeGull(x, y, s) {
  const g = el("g", { transform: `translate(${x},${y})` }, $("gulls"));
  const w = el("path", { class: "s-gull", "stroke-width": 2.6 / s, fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
  return { g, w, s };
}
function drawGull(G, flap) {
  const f = Math.sin(flap);
  G.w.setAttribute("d", `M-12,${f1(f * 6)} Q-6,${f1(-4 - f * 4)} 0,0 Q6,${f1(-4 - f * 4)} 12,${f1(f * 6)}`);
  G.g.setAttribute("transform", `translate(${f1(G.x)},${f1(G.y)}) scale(${G.s})`);
}
[[300, 120, 110, .8], [900, 180, 160, .6], [1200, 90, 120, .7], [520, 260, 80, .55]].forEach(([cx, cy, r, s], i) => {
  const G = makeGull(cx, cy, s);
  Object.assign(G, { cx, cy, r, a: i * 1.7, sp: .25 + i * .05, flap: i, x: cx, y: cy, circle: true });
  gulls.push(G);
});
function spawnGull(x, y, dir) {
  const G = makeGull(x, y, .8);
  Object.assign(G, { x, y, vx: dir * rand(90, 140), vy: rand(-40, -15), flap: 0, life: 0, circle: false });
  gulls.push(G);
}

/* =========================================================
   【角色】渡輪狀態機：駛入 → 靠岸 → 掉頭 → 駛離 → 消失 → 再駛入
   ========================================================= */
const DOCK_X = 620; // 靠岸時船尾 x（船頭剛好碰到防波堤）
const ferry = { x: 120, state: "in", tm: 0, flip: 1, sp: 0, bob: 0 };
const car = { s: 0, dir: 1, px: 0, py: 0, wait: 0, len: 0 };
car.len = $("roadPath").getTotalLength();

/* =========================================================
   主迴圈
   ========================================================= */
let wind = .3, windTarget = .3, pointerIn = false, parX = 0, parTarget = 0;
let last = performance.now(), t = 0, mixTimer = 0, heliX = 1900, heliWait = 6;
const layers = [...svg.querySelectorAll("[data-depth]")].map(g => ({ g, d: +g.dataset.depth }));
const smokePuffs = [], plume = [], mist = [];
// 瀑布腳下的水霧
for (let i = 0; i < 5; i++) mist.push(el("ellipse", { cx: 606, cy: 410, rx: 10, ry: 6, class: "f-fall", opacity: .5 }, $("fallMist")));

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;

  // --- 日夜 ---
  if (tween) {
    tween.t += dt / (reduced ? .001 : 1.6);
    const k = Math.min(1, tween.t), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    phase = tween.from + (tween.to - tween.from) * e;
    if (k >= 1) { tween = null; phase %= 1; }
  } else if (auto && !reduced) phase = (phase + dt / CYCLE) % 1;
  const night = nightOf(phase);
  mixTimer -= dt;
  if (mixTimer <= 0 || tween) { applyNight(night); mixTimer = .12; $("clock").textContent = clockLabel(phase); }

  // 太陽、月亮
  const rising = (phase % 1) < .5;
  const sunY = 80 + night * 320, sunX = rising ? 1000 + night * 140 : 760 - night * 100;
  $("sun").setAttribute("transform", `translate(${f1(sunX)},${f1(sunY)})`);
  $("sun").setAttribute("opacity", (1 - rainAmt * .75 - fogVeil).toFixed(2));
  $("moon").setAttribute("transform", `translate(420,${f1(420 - night * 330)})`);

  // --- 天氣（自動循環開啟時，天氣也會自己變） ---
  if (auto && !reduced) { weatherTimer -= dt; if (weatherTimer <= 0) setWeather([0, 1, 2, 3].filter(w => w !== weather)[Math.floor(Math.random() * 3)]); }
  const k2 = reduced ? 1 : Math.min(1, dt * .8);
  rainAmt += ((weather === 3 ? 1 : 0) - rainAmt) * k2;
  fogVeil += ([0, .12, .32, .1][weather] - fogVeil) * k2;
  $("fogVeil").setAttribute("opacity", fogVeil.toFixed(3));
  $("rainVeil").setAttribute("opacity", (rainAmt * .3).toFixed(3));
  $("rain").setAttribute("opacity", rainAmt.toFixed(3));
  const clear = weather === 0 ? 1 : weather === 1 ? .45 : weather === 3 ? .15 : .08;
  const nOn = clamp(night * 1.5 - .45, 0, 1);
  $("aurora").setAttribute("opacity", (nOn * clear).toFixed(3));
  $("stars").style.opacity = (nOn * (.3 + .7 * clear)).toFixed(3);
  if (rainbow > 0) { rainbow -= dt / 14; }
  $("rainbow").setAttribute("opacity", (clamp(rainbow * 2.5, 0, 1) * .55 * (1 - night) * (1 - rainAmt)).toFixed(3));

  // --- 風與視差：滑鼠控制，沒滑鼠時自己變 ---
  if (windMode === 1) windTarget = .06 + Math.sin(t * .5) * .04;
  else if (windMode === 2) windTarget = 1 + Math.sin(t * .8) * .12 + Math.sin(t * 2.3) * .08;
  else if (!pointerIn) { windTarget = .35 + Math.sin(t * .21) * .45 + Math.sin(t * .67) * .15; parTarget = 0; }
  gustTimer = Math.max(0, gustTimer - dt);
  wind += (windTarget - wind) * Math.min(1, dt * 1.5);
  parX += (parTarget - parX) * Math.min(1, dt * (reduced ? 20 : 3));
  for (const L of layers) L.g.setAttribute("transform", `translate(${f1(-parX * L.d * 14)},0)`);
  // 瀑布水量：點擊後暴漲幾秒；下雨時也稍微變大
  const gustTarget = Math.max(gustTimer > 0 ? 1 : 0, rainAmt * .35);
  gust += (gustTarget - gust) * (reduced ? 1 : Math.min(1, dt * 2.2));
  const level = Math.round(clamp(Math.abs(wind) * 6, 0, 9)) + 1;
  if (mixTimer === .12) $("windLabel").textContent = `${wind >= 0 ? "西風" : "東風"} ${level} 級`;

  if (!reduced) {
    // 海浪
    for (const W of WAVES) {
      W.off = (W.off + W.sp * dt * (.6 + Math.abs(wind))) % W.per;
      W.el.setAttribute("transform", `translate(${f1(W.off)},${f1(Math.sin(t * .9 + W.top) * 1.5)})`);
    }
    // 雲
    for (const C of clouds) {
      C.x += C.sp * dt * (.3 + wind * 1.2);
      if (C.x > 1850) C.x = -250; if (C.x < -260) C.x = 1840;
      C.g.setAttribute("transform", `translate(${f1(C.x)},${f1(C.y)})`);
    }
    $("capCloud").setAttribute("transform", `translate(${f1(Math.sin(t * .2) * 14 + wind * 10)},${f1(Math.sin(t * .3) * 3)})`);
    // 霧
    for (const F of fogs) {
      F.x += F.sp * dt * (.3 + wind * 1.3);
      if (F.x > 1600 + F.w) F.x = -F.w; if (F.x < -F.w - 10) F.x = 1600 + F.w;
      F.op += (fogTarget(F) - F.op) * Math.min(1, dt * .6);
      F.g.setAttribute("transform", `translate(${f1(F.x)},${f1(F.y + Math.sin(t * .4 + F.w) * 4)})`);
      F.g.setAttribute("opacity", F.op.toFixed(3));
    }
    // 極光
    if (+$("aurora").getAttribute("opacity") > .01) drawAurora(t);
    // 雨
    if (rainAmt > .02) {
      const sl = wind * 120;
      for (const D of drops) {
        D.y += D.v * dt; D.x += sl * dt * (D.v / 600);
        if (D.y > 610) { D.y = -20; D.x = Math.random() * 1700 - 50; if (Math.random() < .08 && rainAmt > .5) ripple(820 + Math.random() * 780, 470 + Math.random() * 120, .4); }
        if (D.x > 1660) D.x -= 1720; if (D.x < -60) D.x += 1720;
        D.e.setAttribute("x1", f1(D.x)); D.e.setAttribute("y1", f1(D.y));
        D.e.setAttribute("x2", f1(D.x + sl * D.l / 600)); D.e.setAttribute("y2", f1(D.y + D.l));
      }
    }
    // 草叢擺動、晾衣隨風
    for (const T of tufts) T.g.setAttribute("transform", `skewX(${f1(wind * -18 + Math.sin(t * 2.2 + T.ph) * 5)})`);
    document.querySelectorAll("[data-cloth]").forEach((c, i) => c.setAttribute("transform", `skewX(${f1(-wind * 22 + Math.sin(t * 4 + i) * 6)})`));
  }

  // --- 瀑布 ---
  drawWaterfall(dt);

  if (!reduced) {
    // --- 煙囪炊煙 ---
    for (const S of smokers) {
      S.t -= dt;
      if (S.t <= 0) {
        S.t = .7 + Math.random() * .6;
        smokePuffs.push({ e: el("circle", { cx: S.x, cy: S.y, r: 3, class: "f-cloud", opacity: .8 }, $("smoke")), x: S.x, y: S.y, life: 0 });
      }
    }
    for (let i = smokePuffs.length - 1; i >= 0; i--) {
      const P = smokePuffs[i]; P.life += dt;
      P.x += (wind * 26 + 3) * dt; P.y -= 12 * dt;
      P.e.setAttribute("cx", f1(P.x)); P.e.setAttribute("cy", f1(P.y));
      P.e.setAttribute("r", f1(3 + P.life * 4)); P.e.setAttribute("opacity", Math.max(0, .7 - P.life * .25).toFixed(2));
      if (P.life > 2.8) { P.e.remove(); smokePuffs.splice(i, 1); }
    }

    // --- 渡輪 ---
    updateFerry(dt);
    // --- 汽車 ---
    updateCar(dt);
    // --- 人與動物 ---
    for (const H of hikers) {
      H.x += H.sp * dt * (1 - rainAmt * .3); H.ph += dt * 6;
      if (H.x > 820) H.x = -40;
      const y = knollY(H.x) + 44 + H.off;
      H.p.g.setAttribute("transform", `translate(${f1(H.x + H.off * 4)},${f1(y)}) scale(1.15)`);
      walkLegs(H.p, H.ph);
    }
    {
      const C = cliffHiker;
      C.x += C.sp * dt * C.dir; C.ph += dt * 5;
      if (C.x > 400) { C.x = 400; C.dir = -1; } if (C.x < 20) { C.x = 20; C.dir = 1; }
      C.p.g.setAttribute("transform", `translate(${f1(C.x)},${f1(cliffY(C.x) + 8)}) scale(${C.dir * .55},.55)`);
      walkLegs(C.p, C.ph);
    }
    for (const Q of quayPeople) {
      Q.x += Q.sp * dt * Q.dir; Q.ph += dt * 6;
      if (Q.x > Q.max) { Q.x = Q.max; Q.dir = -1; } if (Q.x < Q.min) { Q.x = Q.min; Q.dir = 1; }
      Q.p.g.setAttribute("transform", `translate(${f1(Q.x)},441) scale(${Q.dir * Q.s},${Q.s})`);
      walkLegs(Q.p, Q.ph);
    }
    updateSheep(dt);
    updateDog(dt);
    updatePuffins(dt);
    updateGulls(dt);
    // 漁船擺盪
    boatToss = Math.max(0, boatToss - dt * .6);
    const bob = Math.sin(t * 1.3) * (2 + Math.abs(wind) * 2) + Math.sin(t * 9) * boatToss * 3;
    $("fishBoat").setAttribute("transform", `translate(1300,${f1(574 + bob)}) rotate(${f1(Math.sin(t * 1.1) * 1.6 + boatToss * Math.sin(t * 7) * 3)})`);
    $("farBoat").setAttribute("transform", `translate(${f1(980 + Math.sin(t * .05) * 120)},${f1(352 + Math.sin(t * 1.4) * 1.2)})`);
    // 釣線晃動
    $("fishLine").setAttribute("d", `M-34,-40 Q${f1(-38 + wind * 6 + Math.sin(t * 1.5) * 2)},0 -40,30`);
    // 直升機
    heliWait -= dt;
    if (heliWait <= 0) {
      heliX -= 90 * dt;
      $("heli").setAttribute("transform", `translate(${f1(heliX)},${f1(150 + Math.sin(t * 1.2) * 4)}) scale(-1,1)`);
      $("rotor").setAttribute("transform", `scale(${f1(Math.cos(t * 40))},1)`);
      $("heliBlink").setAttribute("opacity", (Math.sin(t * 6) > .6 ? nOn + .2 : 0).toFixed(2));
      if (heliX < -100) { heliX = 1750; heliWait = 40 + Math.random() * 20; }
    } else $("heli").setAttribute("transform", "translate(-200,-200)");
  }
  // 教堂鐘擺
  bellT = Math.max(0, bellT - dt);
  $("bell").setAttribute("transform", `rotate(${f1(Math.sin(t * 9) * 22 * Math.min(1, bellT) * (reduced ? 0 : 1))} 1336 343)`);
  // 燈塔：夜裡掃光，點擊時連閃
  beaconBoost = Math.max(0, beaconBoost - dt);
  const flash = (Math.sin(t * (beaconBoost > 0 ? 9 : 1.8)) + 1) / 2;
  const bOn = Math.max(nOn * (.3 + .7 * Math.pow(flash, 3)), beaconBoost > 0 ? Math.pow(flash, 2) : 0);
  $("beaconLamp").setAttribute("opacity", (.15 + .85 * bOn).toFixed(3));
  $("beam").setAttribute("opacity", (bOn * (.5 + fogVeil)).toFixed(3));
  hornT = Math.max(0, hornT - dt);
  carHonk = Math.max(0, carHonk - dt);

  requestAnimationFrame(frame);
}

/* ---------- 極光 ---------- */
function drawAurora(t) {
  const band = (id, base, h, k, sp) => {
    let top = "", bot = [];
    for (let i = 0; i <= 40; i++) {
      const x = -20 + i * 41;
      const y = base + Math.sin(x * .006 + t * sp + k) * 26 + Math.sin(x * .017 - t * sp * 1.7) * 10;
      const hh = h + Math.sin(x * .011 + t * sp * 1.3 + k) * 26;
      top += (i ? "L" : "M") + f1(x) + "," + f1(y - hh) + " ";
      bot.push(f1(x) + "," + f1(y));
    }
    $(id).setAttribute("d", top + bot.reverse().map(p => "L" + p).join(" ") + " Z");
  };
  band("aurA", 170, 90, 0, .25);
  band("aurB", 140, 70, 2, .18);
  band("aurC", 200, 60, 4, .3);
}

/* ---------- 瀑布：依風微彎；gust（水量 0~1）越大水柱越粗、流越快、水霧越大 ---------- */
let fallOff = 0;
function drawWaterfall(dt) {
  const x0 = 606, y0 = 228, L = 186;
  const bend = wind * 10;
  const ex = x0 + bend, ey = y0 + L;
  ["fallA", "fallB", "fallC"].forEach((id, i) => {
    const e = $(id), dx = [0, -2, 3][i] * (1 + gust);
    e.setAttribute("d", `M${f1(x0 + dx)},${y0} Q${f1(x0 + dx + bend * .2)},${f1(y0 + L * .55)} ${f1(ex + dx * 1.4)},${f1(ey)}`);
    e.setAttribute("stroke-width", f1([9, 4, 2.5][i] * (1 + gust * .9)));
    if (!reduced) e.setAttribute("stroke-dashoffset", f1(-fallOff * (1 + i * .3)));
  });
  if (!reduced) fallOff += dt * 160 * (1 + gust * .8);
  // 腳下水霧：水量越大越濃、越高
  mist.forEach((m, i) => {
    const k = (t * .8 + i / 5) % 1;
    m.setAttribute("cx", f1(606 + Math.sin(i * 2) * (10 + gust * 14) + k * wind * 20));
    m.setAttribute("cy", f1(412 - k * (22 + gust * 40)));
    m.setAttribute("rx", f1((8 + k * 16) * (1 + gust * .9))); m.setAttribute("ry", f1((5 + k * 8) * (1 + gust * .7)));
    m.setAttribute("opacity", ((1 - k) * (.55 + gust * .3)).toFixed(2));
  });
  // 白天水霧裡的小彩虹
  $("mistBow").setAttribute("opacity", (gust * .6 * (1 - nightOf(phase)) * (1 - fogVeil * 2)).toFixed(2));
  // 濺起的水花：從落點往兩側拋出再落回海面
  if (!reduced && gust > .05) {
    const n = Math.floor(gust * 3 + Math.random());
    for (let i = 0; i < n; i++) {
      const e = el("circle", { r: f1(1.5 + Math.random() * 3), class: "f-fall", opacity: .85 }, $("plume"));
      plume.push({ e, x: ex + rand(-6, 6), y: ey, vx: rand(-60, 60), vy: rand(-90, -40), life: 0 });
    }
  }
  for (let i = plume.length - 1; i >= 0; i--) {
    const P = plume[i]; P.life += dt;
    P.x += P.vx * dt; P.y += P.vy * dt; P.vy += 160 * dt;
    P.e.setAttribute("cx", f1(P.x)); P.e.setAttribute("cy", f1(P.y));
    P.e.setAttribute("opacity", Math.max(0, .85 - P.life * .9).toFixed(2));
    if (P.life > .9 || P.y > 420) { P.e.remove(); plume.splice(i, 1); }
  }
}

/* ---------- 渡輪 ---------- */
function updateFerry(dt) {
  const F = ferry;
  F.tm += dt;
  if (F.state === "in") {
    const dist = DOCK_X - F.x;
    F.sp = Math.min(46, 12 + dist * .25);
    F.x += F.sp * dt;
    if (dist < 1) { F.x = DOCK_X; F.state = "dock"; F.tm = 0; }
  } else if (F.state === "dock") {
    if (F.tm > 10) { F.state = "turn"; F.tm = 0; hornT = 1.4; bubble(F.x + 110 + layerShift(.55), 330, "嘟——"); }
  } else if (F.state === "turn") {
    F.flip = Math.cos(Math.min(1, F.tm / 2.4) * Math.PI);
    F.x -= 6 * dt;
    if (F.tm >= 2.4) { F.flip = -1; F.state = "out"; F.tm = 0; F.sp = 6; }
  } else if (F.state === "out") {
    F.sp = Math.min(48, F.sp + dt * 10);
    F.x -= F.sp * dt;
    if (F.x < -300) { F.state = "gone"; F.tm = 0; }
  } else if (F.state === "gone") {
    if (F.tm > 6) { F.state = "in"; F.flip = 1; F.x = -280; }
  }
  F.bob = Math.sin(t * 1.2) * 1.6;
  const sx = F.flip;
  $("ferry").setAttribute("transform", `translate(${f1(F.x + 111)},${f1(441 + F.bob)}) scale(${sx.toFixed(3)},1) translate(-111,0) rotate(${f1(Math.sin(t * .9) * .6)} 111 0)`);
  // 煙：鳴笛時冒大煙
  const sm = $("ferrySmoke");
  const funX = F.x + 111 + (97 - 111) * sx, funY = 441 - 84;
  if (Math.random() < (hornT > 0 ? .7 : .12) && F.state !== "gone") {
    const e = el("circle", { cx: funX, cy: funY, r: 4, class: "f-cloud-dk", opacity: .8 }, sm);
    smokePuffs.push({ e, x: funX, y: funY, life: hornT > 0 ? -.6 : .4 });
  }
  // 航跡

    ripple(wx + layerShift(.55), 450, .5);
  }

/* ---------- 汽車：沿公路來回，在碼頭端停一下 ---------- */
function updateCar(dt) {
  const C = car;
  if (C.wait > 0) C.wait -= dt;
  else {
    C.s += C.dir * dt * 42 * (carHonk > 0 ? 1.6 : 1);
    if (C.s > C.len) { C.s = C.len; C.dir = -1; C.wait = 3; }
    if (C.s < 0) { C.s = 0; C.dir = 1; C.wait = 5; }
  }
  const p = $("roadPath").getPointAtLength(C.s);
  const q = $("roadPath").getPointAtLength(clamp(C.s + 2, 0, C.len));
  const p2 = $("roadPath").getPointAtLength(clamp(C.s - 2, 0, C.len));
  const ang = Math.atan2(q.y - p2.y, q.x - p2.x) * 180 / Math.PI;
  C.px = p.x; C.py = p.y;
  $("car").setAttribute("transform", `translate(${f1(p.x)},${f1(p.y + 1)}) rotate(${f1(ang)}) scale(${C.dir * 1.6},1.6)`);
}

/* ---------- 綿羊：低頭吃草、被點時蹦跳 ---------- */
function updateSheep(dt) {
  if (herdT > 0) {
    herdT -= dt;
    // 牧羊犬先繞到羊群右後方，再一路往左趕
    if (dog.herding === 1 && Math.abs(dog.target - dog.x) < 3) { dog.herding = 2; dog.target = 360; dog.wait = 6; }
    if (herdT <= 0) { dog.herding = 0; if (reduced) for (const S of sheep) if (S.front) S.x = S.hx; }
  }
  for (const S of sheep) {
    if (S.front && !reduced) {
      const goal = herdT > 0 && dog.herding === 2 ? S.gx : S.hx;
      const dx = goal - S.x;
      if (Math.abs(dx) > 1) {
        S.x += Math.sign(dx) * Math.min(Math.abs(dx), (herdT > 0 ? 55 : 22) * dt);
        S.dir = dx > 0 ? 1 : -1;
        S.graze = 0;
      } else if (herdT <= 0) S.dir = S.hdir;
      S.y = knollY(S.x) + S.yoff;
    }
    S.graze += dt;
    const down = (Math.sin(S.graze * .6) > .2) ? 1 : 0;
    S.head.setAttribute("transform", `rotate(${down * 26} 12 -15)`);
    let hy = 0;
    if (S.hop > 0) { S.hop = Math.max(0, S.hop - dt * 1.4); hy = -Math.abs(Math.sin(S.hop * Math.PI * 3)) * 10; }
    S.g.setAttribute("transform", `translate(${f1(S.x)},${f1(S.y + hy)}) scale(${S.dir * S.s},${S.s})`);
  }
}
/* ---------- 牧羊犬：在羊群間跑來跑去 ---------- */
function updateDog(dt) {
  const D = dog;
  const dx = D.target - D.x;
  if (Math.abs(dx) < 2) {
    D.wait -= dt;
    if (D.wait <= 0) { D.target = 60 + Math.random() * 600; D.wait = 2 + Math.random() * 4; }
    D.legs.forEach(l => l.setAttribute("transform", ""));
    D.tail.setAttribute("transform", `rotate(${f1(Math.sin(t * 10) * 12)} -12 -12)`);
  } else {
    D.dir = dx > 0 ? 1 : -1;
    D.x += D.dir * Math.min(Math.abs(dx), 110 * dt);
    D.ph += dt * 18;
    D.legs.forEach((l, i) => l.setAttribute("transform", `rotate(${f1(Math.sin(D.ph + (i % 2) * Math.PI) * 30)} ${[-8, -4, 7, 11][i]} -8)`));
  }
  const y = knollY(D.x) + 58;
  D.g.setAttribute("transform", `translate(${f1(D.x)},${f1(y + (Math.abs(dx) > 2 ? -Math.abs(Math.sin(D.ph)) * 2 : 0))}) scale(${D.dir * 1.1},1.1)`);
}
/* ---------- 海鸚 ---------- */
function updatePuffins(dt) {
  for (const P of puffins) {
    P.tm += dt;
    if (P.state === "home") {
      // 偶爾點頭
      const nod = Math.sin(t * 1.5 + P.ph) > .95 ? 2 : 0;
      P.b.setAttribute("transform", `translate(${P.hx},${P.hy + nod * .5})`);
    } else if (P.state === "fly") {
      P.x += P.vx * dt; P.y += P.vy * dt; P.vy += 12 * dt;
      const f = Math.sin(t * 30 + P.i) * .8;
      P.wing.setAttribute("transform", `scale(1,${f1(f)})`); P.wing2.setAttribute("transform", `scale(1,${f1(f)})`);
      P.b.setAttribute("transform", `translate(${f1(P.x)},${f1(P.y)}) rotate(15)`);
      P.b.setAttribute("opacity", Math.max(0, 1 - P.tm / 3.5).toFixed(2));
      if (P.tm > 3.5) { P.state = "away"; P.tm = 0; }
    } else if (P.state === "away") {
      if (P.tm > 9 + P.i * .6) {
        P.state = "back"; P.tm = 0; P.x = P.hx + 220; P.y = P.hy - 90;
        P.wing.setAttribute("opacity", 1); P.wing2.setAttribute("opacity", 1);
      }
    } else if (P.state === "back") {
      const k = Math.min(1, P.tm / 2.5);
      const x = P.hx + 220 * (1 - k), y = P.hy - 90 * (1 - k) - Math.sin(k * Math.PI) * 30;
      const f = Math.sin(t * 30 + P.i) * .8;
      P.wing.setAttribute("transform", `scale(1,${f1(f)})`); P.wing2.setAttribute("transform", `scale(1,${f1(f)})`);
      P.b.setAttribute("transform", `translate(${f1(x)},${f1(y)})`);
      P.b.setAttribute("opacity", Math.min(1, k * 3).toFixed(2));

/* ---------- 海鷗 ---------- */

  for (let i = gulls.length - 1; i >= 0; i--) {

      G.x = G.cx + Math.cos(G.a) * G.r + wind * 30; G.y = G.cy + Math.sin(G.a) * G.r * .35;

    }
    drawGull(G, G.flap);
  }
}

/* =========================================================
   【互動】滑鼠：視差＋風向；控制鈕
   ========================================================= */
svg.addEventListener("pointermove", e => {
  const r = svg.getBoundingClientRect();
  const k = (e.clientX - r.left) / r.width;
  pointerIn = true;
  parTarget = (k - .5) * 2;
  if (windMode === 0) windTarget = (k - .5) * 2.4;  // 滑鼠在左邊 = 東風（向左吹），右邊 = 西風
});
svg.addEventListener("pointerleave", () => { pointerIn = false; });

$("btnDayNight").addEventListener("click", () => {
  const n = nightOf(phase);
  const to = n > .5 ? Math.ceil(phase) : Math.floor(phase) + .5; // 往下一個「正午」或「深夜」
  tween = { from: phase, to: to <= phase ? to + 1 : to, t: 0 };
});
$("btnAuto").addEventListener("click", () => {
  auto = !auto;
  $("btnAuto").setAttribute("aria-pressed", auto);
  $("btnAuto").textContent = "自動循環：" + (auto ? "開" : "關");
});
$("btnWeather").addEventListener("click", () => setWeather((weather + 1) % 4));
// 【互動】風勢：自動（滑鼠決定）→ 微風 → 強風
const WIND_NAMES = ["自動", "微風", "強風"];
let windMode = 0;
$("btnWind").addEventListener("click", () => {
  windMode = (windMode + 1) % 3;
  $("btnWind").textContent = "風勢：" + WIND_NAMES[windMode];
  if (reduced) wind = windMode === 1 ? .06 : windMode === 2 ? 1 : .3;
});
// 【互動】牧羊犬趕羊：前景羊群往左邊圍籬聚攏，約 10 秒後散回原處
let herdT = 0;
$("btnHerd").addEventListener("click", () => {
  herdT = 10;
  dog.target = 720; dog.wait = 0; dog.herding = 1;
  bubble(dog.x + layerShift(1), knollY(dog.x) + 20, "汪汪！");
  for (const S of sheep) if (S.front) { S.hop = 1; if (reduced) { S.x = S.gx; S.hop = 0; } }
});

// 減少動態：停住船、霧、人、浪，只保留切換與點擊回饋
function applyReduced() {
  reduced = RM_QUERY.matches;
  if (reduced) { auto = false; $("btnAuto").setAttribute("aria-pressed", "false"); $("btnAuto").textContent = "自動循環：關"; }
}
RM_QUERY.addEventListener && RM_QUERY.addEventListener("change", applyReduced);
applyReduced();

/* =========================================================
   初始化
   ========================================================= */
setWeather(1);
weatherTimer = 26;
for (const F of fogs) F.op = fogTarget(F);
fogVeil = .12;
applyNight(nightOf(phase), true);
drawAurora(0);
for (const W of WAVES) W.el.setAttribute("transform", `translate(${f1(W.off)},0)`);
for (const F of fogs) { F.g.setAttribute("transform", `translate(${f1(F.x)},${f1(F.y)})`); F.g.setAttribute("opacity", F.op); }
for (const C of clouds) C.g.setAttribute("transform", `translate(${f1(C.x)},${f1(C.y)})`);
hikers.forEach(H => { H.p.g.setAttribute("transform", `translate(${f1(H.x)},${f1(knollY(H.x) + 44)}) scale(1.15)`); walkLegs(H.p, 0); });
quayPeople.forEach(Q => Q.p.g.setAttribute("transform", `translate(${f1(Q.x)},441) scale(${Q.dir * Q.s},${Q.s})`));
cliffHiker.p.g.setAttribute("transform", `translate(100,${f1(cliffY(100) + 8)}) scale(.55)`);
gulls.forEach(G => drawGull(G, 0));
$("fishBoat").setAttribute("transform", "translate(1300,574)");
$("farBoat").setAttribute("transform", "translate(980,352)");
$("heli").setAttribute("transform", "translate(-200,-200)");
updateSheep(0); updateDog(0); updateCar(0); updateFerry(0); updatePuffins(0);
requestAnimationFrame(frame);
})();
</script>
<script id="scene-bgm">

  };
  const btn = document.getElementById("btnMusic");
  if (btn) btn.addEventListener("click", () => window.sceneMusic.toggle());
  setBtn();
  // 純插畫版沒有按鈕：單獨打開時，點一下畫面就開始播（嵌在別的網頁裡時交給外層控制）
  let top = true; try { top = window.top === window; } catch (e) { top = false; }
  if (document.getElementById("pure-art") && top) {
    const go = () => { start(); document.removeEventListener("pointerdown", go); document.removeEventListener("keydown", go); };
    document.addEventListener("pointerdown", go); document.addEventListener("keydown", go);
  }
})();
</script>
</body>
</html>
