<title>黃石公園的老忠實噴發</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-60 黃石公園的老忠實噴發｜水彩感
   地點：美國懷俄明州黃石國家公園，火洞河（Firehole River）沿岸的間歇泉盆地。
   畫面：把上間歇泉盆地的「老忠實間歇泉」與中途間歇泉盆地的「大稜鏡溫泉」
        合成一幅明信片式的寬景（兩地實際相距約 13 公里）。
        左後方是 1904 年落成的原木大旅館「老忠實旅館」（陡峭的木瓦屋頂、老虎窗、屋頂平台與旗桿），
        中間是老忠實的矽華噴泉丘，前面半圈木棧道與長椅坐滿等噴發的遊客；
        右邊是大稜鏡溫泉：深藍泉心、外圈綠黃橘的嗜熱菌色帶、往外輻射的橘紅菌毯流痕，
        泉面升起被染成藍綠色的蒸氣；後方小山丘上是大稜鏡觀景台。
        火洞河從中間流過，河邊草地上有野牛群吃草、對岸旅館前有麋鹿（北美馬鹿），
        左前方有咕嘟冒泡的泥漿池與噴氣孔、被熱水燙死的白色枯樹（ghost trees），
        後方森林是一根根細長的扭葉松（lodgepole pine），森林邊的公路上有車子、
        露營車和黃石的黃色老巴士，偶爾有野牛走上公路造成「野牛塞車」。
        前景是貫穿畫面的木棧道，遊客、小朋友、攝影師來來去去，木樁上停著渡鴉。
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   風格重點：水彩感——feTurbulence＋feDisplacementMap 做出暈染毛邊與邊緣顏料堆積，
            紙張顆粒、透明疊色；遠景更淡更糊；蒸氣用柔邊漸層一團團疊出來。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），部分另有 --k-名稱（晨昏）。
   JS 會依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）。
   ========================================================= */
:root{
  color-scheme: light;

  /* —— 天空、太陽、雲、蒸氣 —— */
  --d-sky-top:#5e9ad0;  --k-sky-top:#6c6aa8;  --n-sky-top:#091330;
  --d-sky-mid:#9ccae6;  --k-sky-mid:#e8a08a;  --n-sky-mid:#142248;
  --d-sky-low:#e4eef0;  --k-sky-low:#fbcf92;  --n-sky-low:#24345c;
  --d-sun:#fff4d6;      --k-sun:#ffa04e;      --n-sun:#ffa04e;
  --d-cloud:#fbf8f2;    --k-cloud:#f8c6aa;    --n-cloud:#2a3456;
  --d-overcast:#98a2ac; --k-overcast:#86788a; --n-overcast:#111a2e;
  --d-steam:#ffffff;    --k-steam:#ffe2cc;    --n-steam:#8a96b8;
  --d-steam-t:#9adcd8;  --k-steam-t:#e8c0a8;  --n-steam-t:#4c6a8a;   /* 大稜鏡上方被泉色染到的蒸氣 */

  /* —— 遠山、丘陵、森林（扭葉松） —— */
  --d-range-far:#a6b8d6; --k-range-far:#b496b4; --n-range-far:#1a2444;
  --d-range-mid:#7f9cb0; --k-range-mid:#8a7698; --n-range-mid:#15203a;
  --d-ridge-a:#8aa6a6;   --k-ridge-a:#9a8a98;   --n-ridge-a:#172430;   /* 遠方松林山稜（帶藍的霧色） */
  --d-ridge-b:#5e8a7c;   --k-ridge-b:#6e7464;   --n-ridge-b:#11201f;   /* 近一點的松林山稜 */
  --d-snowcap:#f6f8fc;   --k-snowcap:#ffd6c2;   --n-snowcap:#4a587a;
  --d-forest:#3e6e4e;    --k-forest:#4e5a42;    --n-forest:#0d1c1a;
  --d-forest-dk:#2a5038; --k-forest-dk:#3a4232; --n-forest-dk:#081412;
  --d-forest-hi:#6e9a5c; --k-forest-hi:#9a8a50; --n-forest-hi:#18291f;
  --d-forest-far:#6a8e84; --k-forest-far:#7c7276; --n-forest-far:#142226;
  --d-trunk:#8a6a4e;     --n-trunk:#1e1a1a;
  --d-snag:#e8e2d6;      --k-snag:#f4d2b8;      --n-snag:#4c4e5c;     /* 枯白樹幹 */

  /* —— 地面：草地、矽華、道路 —— */
  --d-meadow:#a8b866;    --k-meadow:#c2a456;    --n-meadow:#1c2a20;
  --d-meadow-dk:#7e9a4e; --k-meadow-dk:#9a8244; --n-meadow-dk:#132018;
  --d-meadow-hi:#d0c87a; --k-meadow-hi:#e6bc6a; --n-meadow-hi:#25332a;
  --d-sinter:#e6e0d2;    --k-sinter:#f2cdb0;    --n-sinter:#3a3e4c;   /* 矽華（灰白色的泉華地） */
  --d-sinter-dk:#bdb3a0; --k-sinter-dk:#d0a48a; --n-sinter-dk:#2a2c38;
  --d-road:#8e8c8a;      --k-road:#9a8278;      --n-road:#22242e;
  --d-roadline:#e8c64a;  --n-roadline:#4a4230;

  /* —— 老忠實旅館 —— */
  --d-log:#8a6440;       --k-log:#9a6440;       --n-log:#241c1c;
  --d-log-dk:#5a3e28;    --n-log-dk:#150f10;
  --d-roof:#6a5446;      --k-roof:#7a5246;      --n-roof:#1c1820;
  --d-roof-dk:#4a3a32;   --n-roof-dk:#110e14;
  --d-flagred:#c43a36;   --n-flagred:#3a1a1e;
  --d-flagblue:#2e4a8a;  --n-flagblue:#141c34;

  /* —— 河水、溫泉 —— */
  --d-river:#7eaabc;     --k-river:#d4a088;     --n-river:#1a2a40;
  --d-river-hi:#d6ecf2;  --k-river-hi:#ffd8b8;  --n-river-hi:#4a5a7a;
  --d-gp-blue:#1a6ab8;   --k-gp-blue:#2a5a9a;   --n-gp-blue:#0e2242;   /* 大稜鏡：泉心深藍 */
  --d-gp-teal:#5ab8c8;   --k-gp-teal:#6aa6a8;   --n-gp-teal:#1a3a48;
  --d-gp-green:#8ec46a;  --k-gp-green:#a8b05a;  --n-gp-green:#1e3424;
  --d-gp-yellow:#eacb4a; --k-gp-yellow:#f2b84a; --n-gp-yellow:#3e3622;
  --d-gp-orange:#e2782a; --k-gp-orange:#ea6a2a; --n-gp-orange:#3e2418;
  --d-gp-rust:#b44a24;   --k-gp-rust:#b8402a;   --n-gp-rust:#2c1614;
  --d-mud:#9a8c7c;       --n-mud:#2a2828;       /* 泥漿池 */
  --d-mud-hi:#c8bca8;    --n-mud-hi:#3a3838;

  /* —— 木棧道 —— */
  --d-board:#b08a5e;     --k-board:#c08860;     --n-board:#2c2624;
  --d-board-dk:#7a5c3c;  --n-board-dk:#1a1616;
  --d-board-hi:#d4b484;  --n-board-hi:#3a3230;

  /* —— 動物 —— */
  --d-bison:#5a3c26;     --k-bison:#6a3e26;     --n-bison:#1c1414;    /* 野牛身體 */
  --d-bison-dk:#33231a;  --n-bison-dk:#100c0c;  /* 前半身的長毛 */
  --d-calf:#c4783a;      --k-calf:#d0703a;      --n-calf:#3a2018;     /* 紅色的小野牛（red dog） */
  --d-horn:#d8d0c0;      --n-horn:#3a3a40;
  --d-elk:#b8885a;       --k-elk:#c4804e;       --n-elk:#2e2420;      /* 麋鹿身體 */
  --d-elk-dk:#5e3e26;    --n-elk-dk:#18120f;    /* 麋鹿脖子的深色鬃毛 */
  --d-elk-rump:#ecd8b0;  --n-elk-rump:#4a4440;  /* 屁股的淺色斑 */
  --d-antler:#dccaa4;    --n-antler:#4a443c;
  --d-raven:#22222c;     --n-raven:#0c0c12;

  /* —— 人物衣著 —— */
  --d-skin:#c8906e;      --n-skin:#3e3036;
  --d-skin2:#ecc4a2;     --n-skin2:#4a3c40;
  --d-skin3:#8a5a3e;     --n-skin3:#2c2226;
  --d-hair:#3a2a22;      --n-hair:#141014;
  --d-cloth-1:#d0463a;   --n-cloth-1:#461c22;   /* 紅 */
  --d-cloth-2:#2f6aa8;   --n-cloth-2:#18284a;   /* 藍 */
  --d-cloth-3:#e8b23a;   --n-cloth-3:#4a3a20;   /* 黃 */
  --d-cloth-4:#3e8a6a;   --n-cloth-4:#162e26;   /* 綠 */
  --d-cloth-5:#f2eee2;   --n-cloth-5:#4a4a58;   /* 白 */
  --d-cloth-6:#8a5aa8;   --n-cloth-6:#2c2040;   /* 紫 */
  --d-pants:#4a4e5e;     --n-pants:#16181e;
  --d-pack:#d8743a;      --n-pack:#3e2620;
  --d-ranger:#a8a49a;    --n-ranger:#33333a;    /* 國家公園管理員：灰襯衫 */
  --d-ranger-g:#4a5e3a;  --n-ranger-g:#151d14;  /* 綠長褲 */
  --d-ranger-hat:#b89a64; --n-ranger-hat:#3a3226; /* 寬邊巡山員帽 */

  /* —— 車輛 —— */
  --d-bus:#eab634;       --k-bus:#f0a83a;       --n-bus:#3e3420;      /* 黃石的黃色老巴士 */
  --d-bus-top:#3a3430;   --n-bus-top:#141214;
  --d-car-1:#c8423a;     --n-car-1:#3a1a1e;
  --d-car-2:#e8eaec;     --n-car-2:#3e4250;
  --d-car-3:#3a6a9a;     --n-car-3:#16243a;
  --d-car-4:#5a6a4a;     --n-car-4:#1a2018;
  --d-rv:#f2eee4;        --n-rv:#454852;
  --d-tire:#26262a;      --n-tire:#0c0c10;

  /* —— 不隨日夜變化的顏色 —— */
  --moon:#f8f0d0; --star:#fff6d8;
  --lamp:#ffd27a; --window:#ffd88a; --water:#e8f6ff; --rain:#d8e6f2; --snowflake:#ffffff; --ink:#3a3428;
  --headlight:#fff6d0; --taillight:#ff4a3a; --flash:#ffffff;

  /* —— 頁面介面 —— */
  --page-bg:#eef1ea; --page-fg:#2c3430; --page-muted:#62706a;
  --ui-surface:#f8faf4; --ui-line:#cdd6c4; --ui-accent:#3e7a6a; --ui-hot:#d0702a; --ui-hot2:#6a4a2e;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:6px;overflow:hidden;background:#24345c;line-height:0;box-shadow:0 1px 0 #fff inset,0 6px 22px rgba(30,60,50,.18)}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:6px;padding:10px 14px}
.panel button{font:700 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1.5px solid var(--ui-line);
  border-radius:999px;padding:9px 15px;cursor:pointer;letter-spacing:.03em}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:#fff}
.panel button.big{border-color:var(--ui-hot);color:#fff;background:var(--ui-hot)}
.panel button.big2{border-color:var(--ui-hot2);color:#fff;background:var(--ui-hot2)}
.panel button.on{background:#f2b23a!important;border-color:#f2b23a!important;color:var(--page-fg)!important}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid #fff3cc;outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(220px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding:0;list-style:none;color:var(--page-muted);font-size:14px;line-height:1.8;display:flex;flex-wrap:wrap;gap:4px 22px}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .bubble path{fill:#fffaf0;stroke:#4a6a5a;stroke-width:1.4}
#scene .bubble text{fill:#2e3c34;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
@media (prefers-reduced-motion: reduce){ .panel button{transition:none} }
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>
<style id="pure-art">
/* =========================================================
   純插畫版：只顯示場景畫面，隱藏控制列與說明文字。
   想恢復完整版，刪掉這整段 <style id="pure-art"> 即可。
   ========================================================= */
html,body{height:100%;margin:0!important;overflow:hidden}
body{display:flex!important;align-items:center;justify-content:center;padding:0!important}
body>.wrap{width:100%!important;max-width:min(100vw,calc(100vh * 8 / 3))!important;
  margin:0!important;padding:0!important;gap:0!important;display:block!important}
body>.wrap>:not(.stage){display:none!important}
body>.wrap>.stage{width:100%!important;max-width:100%!important;margin:0!important;
  border:0!important;border-radius:0!important;box-shadow:none!important}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：天空 → 星空 → 太陽、月亮 → 雲 → 遠山 → 觀景台小丘 → 扭葉松林 → 老忠實旅館
       → 公路與車輛 → 間歇泉盆地地面 → 積雪 → 火洞河 → 大稜鏡溫泉 → 老忠實噴泉丘
       → 野牛群 → 麋鹿 → 噴發水柱 → 蒸氣 → 噴泉前的半圈木棧道與等候的遊客
       → 泥漿池、噴氣孔、枯樹 → 渡河的野牛群 → 前景木棧道與行人 → 特效 → 雨、雪 → 紙紋
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="水彩風格的黃石公園：老忠實間歇泉噴出高高的水柱，右邊是藍綠黃橘一圈圈的大稜鏡溫泉冒著彩色蒸氣，野牛在火洞河邊吃草，遊客在木棧道上看噴發，後方是原木大旅館與扭葉松林。">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-top)"/>
        <stop offset=".6" style="stop-color:var(--sky-mid)"/>
        <stop offset="1" style="stop-color:var(--sky-low)"/>
      </linearGradient>
      <radialGradient id="glowGrad"><stop offset="0" stop-color="#ffcf6a" stop-opacity=".9"/><stop offset=".45" stop-color="#ffb347" stop-opacity=".35"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {

    };
  }

  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {

    const g = keep ? fn : wrapFn(fn, epoch);

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;

    const names = new Set();

    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });

    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);

      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);

    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {

    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}

  const btns = [];

    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {

    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();

function blocked(b, list, look) {

function stepBisons(dt, mv) {

      let sp = w.photo > 0 || w.pause > 0 || w.wave > 0 ? 0 : w.sp;

/* ---- 蒸氣：大稜鏡、老忠實、噴氣孔、泥漿池、河邊的熱水流出口一直冒煙；
        天冷（清晨、夜晚、下雪）蒸氣更濃，風把蒸氣往右吹，滑鼠靠近會把蒸氣吹開 ---- */
const steam = [];
function puff(x, y, o = {}) {
  if (steam.length > 160) return;
  const e = el('ellipse', { fill: o.t ? 'url(#steamT)' : 'url(#steamW)' }, o.front ? $('steamF') : o.far ? $('steamFar') : $('steamG'));
  steam.push({ e, x, y, vx: o.vx ?? 0, vy: o.vy ?? -16, r: o.r ?? 12, grow: o.grow ?? 40, life: o.life ?? 6, max: o.life ?? 6, op: o.op ?? .5, sq: o.sq ?? .7 });
}
let wind = 10, cold = 1;
const mouse = { x: -999, y: -999, lx: 0, ly: 0, on: false };
function stepSteam(dt, mv) {
  const morning = smooth(4.5, 6.5, hour) * (1 - smooth(9, 11.5, hour)), noon = smooth(11, 13, hour) * (1 - smooth(15, 17, hour));
  cold = 1 + snowK * 1.6 + night * .5 + morning * .9 - noon * .35 + wx.rain * .3;
  wind = 12 + wx.storm * 26 + snowK * 10 + Math.sin(time * .2) * 5;
  if (mv) {
    // 大稜鏡：整片泉面冒蒸氣，有一半被泉色染成藍綠色
    if (Math.random() < dt * 4.2 * cold * gpBoost) {

      puff(GP.x + Math.cos(a) * GP.rx * r, GP.y + Math.sin(a) * GP.ry * r, { t: Math.random() < .5, r: rand(24, 36), grow: rand(100, 140), life: rand(8, 11), vy: rand(-22, -12), op: .5 });
    }
    DIST_STEAM.forEach(d => { if (Math.random() < dt * .9 * cold) puff(d.x + rand(-4, 4), d.y, { far: 1, r: 4, grow: rand(30, 46), life: rand(6, 8), vy: rand(-14, -9), op: .5, sq: .9 }); });
    if (Math.random() < dt * 1.4 * cold && ofc.H < 5) puff(OF.x + rand(-4, 4), OF.y, { r: 5, grow: 34, life: 4.5, vy: -20, op: .6 });
    FUM.forEach(f => { if (Math.random() < dt * .6 * cold) puff(f.x, f.y, { r: 3, grow: 22, life: 3.6, vy: -16, op: .5 }); });
    if (Math.random() < dt * .35 * cold) puff(MUD.x + rand(-20, 20), MUD.y, { r: 5, grow: 24, life: 3.5, vy: -12, op: .4, front: 1 });
    if (Math.random() < dt * .8 * cold) { const y = rand(470, 560); puff(riverX(y) + rand(-6, 6), y, { r: 6, grow: 34, life: 4.5, vy: -10, op: .35 }); }
    // 噴發時：水柱頂端與四周湧出大量蒸氣
    if (ofc.H > 30) {
      const k = ofc.H / 300;
      if (Math.random() < dt * 15 * k) puff(OF.x + jetLean(1) + rand(-30, 30), OF.y - ofc.H + rand(-10, 50), { r: rand(14, 24), grow: rand(70, 120), life: rand(6, 9), vy: rand(-26, -10), vx: rand(-14, 16), op: .6, sq: rand(.8, 1) });
      if (Math.random() < dt * 10 * k) { const q = rand(.15, .9); puff(OF.x + jetLean(q) + rand(-14, 14), OF.y - ofc.H * q, { r: rand(10, 18), grow: rand(50, 90), life: rand(5, 7), vy: rand(-16, -8), op: .5, sq: rand(.75, .95) }); }
    }

    const k = 1 - p.life / p.max;

/* ---- 老忠實的噴發週期：前奏（水花一陣陣冒出）→ 衝高 → 全力噴發 → 慢慢變矮 → 只剩蒸氣 ---- */
const ofc = { phase: 'idle', t: 0, next: 14, H: 0, Hmax: 270, big: false, pulse: 0 };

  jetHi.setAttribute('d', cr(C.map(([x, y], i) => [x - 2, y])) + 'L' + C.slice().reverse().map(([x, y], i) => f1(x + 1.5 + (1 - i / n) * 2) + ' ' + f1(y)).join('L') + 'Z');

function startEruption(big) {

}
function stepOF(dt, mv) {
  ofc.t += dt * (mv || 1);
  const t = ofc.t;
  if (ofc.phase === 'idle') {
    ofc.H = Math.max(0, ofc.H - dt * 40) + ofc.pulse;
    ofc.pulse = Math.max(0, ofc.pulse - dt * 60);

  } else if (ofc.phase === 'pre') {
    ofc.H = 14 + 46 * Math.max(0, Math.sin(t * 4.4)) * smooth(0, 2, t);
    if (t > 3) { ofc.phase = 'rise'; ofc.t = 0; ofc.h0 = ofc.H; }
  } else if (ofc.phase === 'rise') {
    ofc.H = lerp(ofc.h0, ofc.Hmax, smooth(0, 2.4, t));

  } else if (ofc.phase === 'full') {
    ofc.H = ofc.Hmax * (.93 + .07 * Math.sin(time * 6.3));

  } else if (ofc.phase === 'fall') {

/* =========================================================
   ④ 表演：老忠實大噴發（約 20 秒）／野牛群渡河（約 20 秒）
   兩場秀互斥：開始其中一場，另一場會先停下。
   ========================================================= */
const show = { on: false, kind: '', t: 0, dur: 20, flags: {} };
const S = { cheer: 0, bow: 0 };
function startShow(kind) {
  if (show.on) endShow(true);

  show.dur = kind === 'erupt' ? 20.5 : 20;
  T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false');
  $(kind === 'erupt' ? 'btnShow' : 'btnHerd').classList.add('on');
  if (kind === 'erupt') { T.t = 16.4 / 24; ofc.phase = 'idle'; ofc.H = 0; }
  else { T.t = 7.2 / 24; spawnHerd(); }
  applyColors(true);
  if (kind === 'erupt') playErupt(); else playHerd();
}
function endShow(silent) {
  show.on = false; S.cheer = 0;
  $('btnShow').classList.remove('on'); $('btnHerd').classList.remove('on');
  if (silent && actx) stopMusic();
}
function stepShow(dt) {
  show.t += dt;
  const t = show.t, k = clamp(t / show.dur, 0, 1);
  if (show.kind === 'erupt') {
    T.t = lerp(16.4, 17.1, k) / 24;
    if (t > .4 && !show.flags.a) { show.flags.a = 1; say(360, 380, '預測噴發時間快到了！', 2.2); ranger.talk = 2; }
    if (t > 2.5 && !show.flags.b) { show.flags.b = 1; startEruption(true); }
    S.cheer = t > 8 && t < 17 ? 1 : 0;
    S.bow = smooth(8.5, 10, t) * (1 - smooth(14.5, 17, t));
    if (t > 10 && !show.flags.c) { show.flags.c = 1; say(700, 120, '水柱高達 40 多公尺！', 2.4); }
    if (t > 16.5 && !show.flags.d) { show.flags.d = 1; say(500, 380, '太壯觀了！', 1.8); }
  } else {
    T.t = lerp(7.2, 8.4, k) / 24;
    if (t > 2.4 && !show.flags.a) { show.flags.a = 1; say(360, 380, '野牛群來了，請保持 23 公尺以上', 2.6); ranger.talk = 2.6; }
    if (t > 8 && !show.flags.b) { show.flags.b = 1; alert = 7; }
    const lead = herd.length ? Math.max(...herd.map(h => h.x)) : 0;
    if (lead > riverX(530) - 10 && !show.flags.c) { show.flags.c = 1; say(riverX(530), 440, '涉水渡過火洞河！', 2.2); }
    if (t > 12 && !show.flags.d) { show.flags.d = 1; const b = bisons[1]; b.snort = 1.2; b.want = -14; b.look = 3; }
  }
  if (show.t >= show.dur) endShow(false);
}

  el('circle', { cx: 8, cy: -1.6, r: 2.2, fill: '#f8f6ee' }, g);
  P(g, 'M-6 5L-11 8L-5 3Z', '', { fill: '#f8f6ee' });
  eagle = { g, w, a: 0 };
}
function stepEagle(dt, mv) {
  eagle.a += dt * .22 * mv;
  const x = 820 + Math.cos(eagle.a) * 340, y = 150 + Math.sin(eagle.a) * 34;
  const dir = -Math.sin(eagle.a) >= 0 ? 1 : -1;
  eagle.g.setAttribute('transform', `translate(${f1(x)} ${f1(y)}) scale(${f1(dir * .9)} .9)`);
  eagle.w.setAttribute('transform', `scale(1 ${f1(1 + Math.sin(time * 1.3) * .12)})`);
  eagle.g.setAttribute('opacity', f1((1 - night) * (1 - wx.rain * .8) * (1 - wx.snow * .5)));
}
let blooms = 0;
function bloom(x, y) {   // 滑鼠移動時，水彩顏料在紙上暈開又淡去
  if (reduced || blooms > 22) return;
  blooms++;
  const c = el('circle', { cx: f1(x), cy: f1(y), r: 4, fill: pick(['#3e8a6a', '#1a6ab8', '#e2782a', '#eacb4a', '#5a3c26']), opacity: .16, filter: 'url(#blur3)', style: 'mix-blend-mode:multiply' }, $('bloomG'));
  tween(1.6, k => { c.setAttribute('r', f1(4 + k * 16)); c.setAttribute('opacity', f1(.16 * (1 - k))); }, () => { c.remove(); blooms--; });
}

/* ---------------- ④ 動畫：主迴圈 ---------------- */
let last = performance.now(), colorAcc = 0;
function loop(now) { const dt = Math.min(.1, (now - last) / 1000); last = now; step(dt); requestAnimationFrame(loop); }
function step(dt) {
  time += dt;
  const mv = reduced ? 0 : 1;
  if (show.on) stepShow(dt);
  else if (T.auto && !T.dragging && !reduced) T.t = (T.t + dt / DAY_SEC) % 1;
  colorAcc += dt; if (colorAcc > .12 || show.on) { colorAcc = 0; applyColors(); }
  sunBump = Math.max(0, sunBump - dt * 30);
  alert = Math.max(0, alert - dt);
  gpBoost = Math.max(1, gpBoost - dt * .8);

  // 天氣漸變
  const r = reduced ? 1 : Math.min(1, dt * .5);
  for (const k in wx) wx[k] += (wxT[k] - wx[k]) * r;
  snowK = wx.snow;
  snowAcc += (wx.snow - snowAcc) * (reduced ? 1 : Math.min(1, dt * .12));
  const rain = wx.rain, cloud = wx.cloud;
  $('overcastSky').setAttribute('opacity', f1(cloud * .5));
  $('wxVeil').setAttribute('opacity', f1((cloud * .07 + rain * .1 + wx.snow * .04) * (1 - night * .6)));
  $('rainG').setAttribute('opacity', f1(rain * .85));
  $('snowG').setAttribute('opacity', f1(wx.snow));
  if (rain > .01 && mv) { $('rain1').setAttribute('y', f1(-240 + (time * 620) % 120)); $('rain1').setAttribute('x', f1(-200 - (time * 170) % 160)); $('rain2').setAttribute('y', f1(-240 + (time * 420) % 120)); }
  if (wx.snow > .01 && mv) { $('snow1').setAttribute('y', f1(-240 + (time * 50) % 180)); $('snow1').setAttribute('x', f1(-200 + Math.sin(time * .7) * 30 + (time * 14) % 180)); $('snow2').setAttribute('y', f1(-240 + (time * 34) % 180)); $('snow2').setAttribute('x', f1(-200 + (time * 8) % 180)); }
  $('snowTop').setAttribute('opacity', f1(snowAcc));
  $('snowFar').setAttribute('opacity', f1(snowAcc));
  $('snowGround').setAttribute('opacity', f1(snowAcc));
  ponchos.forEach(p => p.setAttribute('opacity', f1(smooth(.3, .7, rain))));
  beanies.forEach(p => p.setAttribute('opacity', f1(smooth(.3, .7, wx.snow))));
  // 閃電（雷陣雨時）
  let flash = 0;
  if (wx.storm > .6 && mv) { boltT -= dt; if (boltT <= 0) { boltT = rand(6, 14); tween(.5, k => $('flashR').setAttribute('opacity', f1((k < .2 ? 1 : k < .35 ? .2 : k < .5 ? .8 : 1 - k) * .35))); if (actx && soundOn && userGesture) setTimeout(() => sfx('thunder'), 600); } }

  // 雲
  clouds.forEach(c => {
    c.x += c.sp * (1 + rain) * dt * mv; if (c.x > 1800) c.x = -200;
    const vis = clamp(c.show + cloud, 0, 1);
    c.g.setAttribute('transform', `translate(${f1(c.x)} ${f1(c.y)}) scale(${f1(c.k)})`);
    c.g.setAttribute('opacity', f1(vis * (.9 - night * .3)));
    c.g.style.display = vis < .03 ? 'none' : '';
    if (c.rain > 0) { c.rain -= dt; if (Math.random() < .6) particle(c.x + rand(-c.w * .4, c.w * .4) * c.k, c.y + 16, 'var(--rain)', rand(-4, 4), 160, .9, 1.3, { g: 60, op: .8 }); }
  });

  if (!(show.on && show.kind === 'erupt')) S.bow = Math.max(0, S.bow - dt * .3);
  stepOF(dt, mv);
  stepSteam(dt, mv);
  bowG.setAttribute('opacity', f1(S.bow * (1 - night) * (1 - cloud * .6)));

  // 大稜鏡的泉面反光
  gpShimmer.forEach(s => s.e.setAttribute('opacity', f1((.12 + .14 * Math.sin(time * .8 + s.ph)) * (1 - night * .6))));
  // 河面的反光：順著河往前流
  riverGlints.forEach(g => {
    g.k = (g.k + g.sp * dt * mv) % 1; const y = lerp(404, 600, g.k);
    g.e.setAttribute('transform', `translate(${f1(riverX(y))} ${f1(y)})`);
    g.e.setAttribute('opacity', f1((1 - night * .7) * .7 * Math.sin(g.k * Math.PI)));
  });
  // 泥漿池：一顆顆泡泡鼓起來、啵一聲破掉
  mudBubbles.forEach(b => {
    b.t += dt * mv; const k = b.t / b.dur;
    if (k >= 1) { b.t = 0; b.dur = rand(1.2, 2.4); b.x = MUD.x + rand(-30, 30); b.y = MUD.y + rand(-5, 4); b.big = Math.max(0, b.big - 1); }
    const r = (b.big ? 9 : 4) * smooth(0, .8, k);
    b.b.setAttribute('cx', f1(b.x)); b.b.setAttribute('cy', f1(b.y - r * .3)); b.b.setAttribute('rx', f1(r)); b.b.setAttribute('ry', f1(r * .6)); b.b.setAttribute('opacity', k < .82 ? .85 : 0);
    const rk = clamp((k - .82) / .18, 0, 1);
    b.ring.setAttribute('cx', f1(b.x)); b.ring.setAttribute('cy', f1(b.y)); b.ring.setAttribute('rx', f1(r + rk * 8)); b.ring.setAttribute('ry', f1((r + rk * 8) * .3)); b.ring.setAttribute('opacity', f1(rk > 0 ? 1 - rk : 0));
  });

  // 動物、車、人
  stepBisons(dt, mv);
  stepHerd(dt, mv);
  stepElks(dt, mv);
  stepRavens(dt, mv);
  stepEagle(dt, mv);
  stepCars(dt, mv);
  stepLanes(dt, mv);
  ranger.talk = Math.max(0, ranger.talk - dt); ranger.wave = Math.max(0, ranger.wave - dt);
  ranger.arm.setAttribute('transform', ranger.talk > 0 ? `rotate(${f1(-100 + Math.sin(time * 6) * 14)} 1 -32)` : '');
  // 噴泉前的遊客：夜裡大多回旅館了
  const crowdA = show.on && show.kind === 'erupt' ? 1 : 1 - smooth(.55, .95, night) * .85;
  $('arcG').lastChild && crowd.forEach(c => c.g.setAttribute('opacity', f1(crowdA)));

  // 星星閃爍、狼、觀景台的遊客
  if (night > .3) stars.forEach(s => s.c.setAttribute('opacity', f1(.5 + .5 * Math.sin(time * s.sp + s.ph))));
  wolf.t = Math.max(0, wolf.t - dt);
  wolf.setAttribute('opacity', f1(smooth(.5, .9, night)));
  wolf.head.setAttribute('transform', wolf.t > 0 ? 'rotate(-38 18 -18)' : '');
  overlook.t = Math.max(0, (overlook.t || 0) - dt);
  overlook.people.forEach((a, i) => a.setAttribute('d', overlook.t > 0 && Math.sin(time * 12 + i * 2) > 0 ? 'M0 -5L1.6 -8' : 'M0 -5L1.6 -3'));
  overlook.setAttribute('opacity', f1(1 - smooth(.5, .9, night)));
  // 燈火
  lamps.forEach(L => {
    L.force = Math.max(0, L.force - dt);
    const autoOn = hour >= 18.4 + L.th || hour < 5.9 - L.th * .6 || wx.storm > .7 || snowAcc > .7;
    L.lv += ((autoOn || L.force > 0 ? 1 : 0) - L.lv) * Math.min(1, dt * (reduced ? 20 : 2.5));
    L.g.setAttribute('opacity', f1(L.lv * (.9 + .1 * Math.sin(time * 5 + L.ph) * mv)));
  });
  // 旅館屋頂的旗子
  inn.flags.forEach(fl => {
    fl.ph += dt * (4 + wind * .1 + (inn.flap || 0) * 6) * mv;
    const w = 16, h = 10, a = 1.6 + (inn.flap ? 1.4 : 0);
    let d = `M${fl.x} ${fl.y}`;
    for (let i = 1; i <= 4; i++) d += `L${f1(fl.x + w * i / 4)} ${f1(fl.y + Math.sin(fl.ph + i) * a * i / 4)}`;
    d += `L${f1(fl.x + w)} ${f1(fl.y + h + Math.sin(fl.ph + 4) * a)}`;
    for (let i = 3; i >= 0; i--) d += `L${f1(fl.x + w * i / 4)} ${f1(fl.y + h + Math.sin(fl.ph + i) * a * i / 4)}`;
    fl.f.setAttribute('d', d + 'Z');
  });
  inn.flap = Math.max(0, (inn.flap || 0) - dt);

  // 補間、粒子、飛鳥
  for (let i = tweens.length - 1; i >= 0; i--) { const tw = tweens[i]; tw.t += dt; const k = clamp(tw.t / tw.dur, 0, 1); tw.fn(k); if (k >= 1) { tweens.splice(i, 1); tw.done && tw.done(); } }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt;
    if (p.life <= 0) { p.n.remove(); parts.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.y > p.floor) { p.y = p.floor; p.vy *= -.3; p.vx *= .6; }
    const k = p.life / p.max;
    p.n.setAttribute('cx', f1(p.x)); p.n.setAttribute('cy', f1(p.y)); p.n.setAttribute('r', f1(p.r + (1 - k) * p.grow));
    p.n.setAttribute('opacity', f1(Math.min(1, k * 2) * p.op));
  }
  for (let i = birds.length - 1; i >= 0; i--) {
    const b = birds[i]; b.t += dt;
    if (b.t > b.life) { b.g.remove(); birds.splice(i, 1); continue; }
    b.x += b.vx * dt; b.y += b.vy * dt; b.vy *= .99;
    b.g.setAttribute('transform', `translate(${f1(b.x)} ${f1(b.y)}) scale(${b.vx < 0 ? -1 : 1} ${f1(.5 + .5 * Math.abs(Math.sin(b.t * 14 + b.ph)))})`);
    b.g.setAttribute('opacity', f1(Math.min(1, (b.life - b.t) * 2)));
  }
}

/* ---------------- ⑤ 互動：綁定 ---------------- */
const RANGER_TIPS = ['請待在木棧道上，地底是滾燙的熱水', '野牛、麋鹿：至少保持 23 公尺', '熊和狼：至少保持 91 公尺', '老忠實大約每 60～110 分鐘噴一次'];
let tipI = 0;
function bindAll() {
  onAct($('sunG'), () => { sunBump = 14; sfx('chime'); if (show.on) endShow(true); setTime(21.5); });
  onAct($('moonG'), () => { sfx('chime'); if (show.on) endShow(true); setTime(10); });
  clouds.forEach(c => onAct(c.g, () => { c.rain = 2.4; sfx(wx.storm > .5 ? 'thunder' : 'drops'); }));
  $('skyHit').addEventListener('click', e => { userGesture = true; ensureAudio(); const p = svgPoint(e); if (p.y < 300) skyClick(p.x, p.y); });
  onAct($('hillG'), () => {
    if (night > .5) { wolf.t = 3.2; sfx('howl'); say(1500, 210, '遠方傳來狼嚎', 2); }
    else { overlook.t = 2.4; sfx('tap'); say(1450, 234, '從觀景台俯瞰大稜鏡', 2); }
  });
  onAct(inn.g, () => {
    inn.lamps.forEach((L, i) => setTimeout(() => { L.force = 6; }, i * 40)); inn.flap = 3; sfx('bell');
    say(190, 196, '老忠實旅館：1904 年的原木大旅館', 2.6);
  });
  roadLanes.forEach(L => L.list.forEach(v => onAct(v.g, () => {
    v.stop = 2.6; sfx('putt');
    say(v.x, L.y - 60, v.kind === 'bus' ? '黃色老巴士：敞篷帆布頂' : roadBison.active ? '野牛塞車，慢慢等' : '停下來看野牛', 2);
  })));
  onAct(roadBison.g, () => { roadBison.snort = 1; sfx('snort'); say(roadBison.x, 330, '野牛走在公路正中間', 2); });
  onAct($('gpG'), () => {
    gpBoost = 4; sfx('hiss'); setTimeout(() => sfx('chime'), 150);
    tween(3.2, k => gpGlow.setAttribute('opacity', f1(Math.sin(Math.PI * k) * .45)));
    for (let i = 0; i < 6; i++) puff(GP.x + rand(-160, 160), GP.y + rand(-20, 20), { t: true, r: 20, grow: 90, life: 7, vy: -26, op: .5 });
    say(1215, 352, '大稜鏡：直徑約 100 公尺，色彩來自嗜熱菌', 3);
  });
  onAct($('ofG'), () => {
    if (ofc.phase !== 'idle') { sfx('roar'); say(OF.x, 300, '正在噴發！', 1.4); return; }
    ofc.pulse = 60; sfx('splash');
    for (let i = 0; i < 12; i++) particle(OF.x + rand(-4, 4), OF.y - 10, 'var(--water)', rand(-40, 40), rand(-160, -90), 1.2, rand(1.2, 2.2), { g: 260, floor: OF.y + 4 });
    say(OF.x, 360, ofc.next < 20 ? '快要噴發了…' : '噴口冒出一陣水花', 1.8);
  });
  onAct(mudG, () => {
    mudBubbles.forEach(b => { b.big = 2; b.t = 0; });
    sfx('bloop');
    for (let i = 0; i < 10; i++) particle(MUD.x + rand(-20, 20), MUD.y - 2, 'var(--mud-hi)', rand(-40, 40), rand(-110, -60), 1, rand(1.5, 3), { g: 300, floor: MUD.y + 2 });
    say(MUD.x, 470, '泥漿池咕嘟咕嘟冒泡', 1.8);
  });
  bisons.forEach(b => onAct(b.g, () => bisonClick(b)));
  elks.forEach(e => onAct(e.g, () => {
    if (e.bull) { e.bugle = 2.8; e.state = 'graze'; e.t = 4; sfx('bugle'); say(e.x, e.y - 120 * e.s - 20, '公麋鹿的嚎叫聲', 2); }
    else { e.t = 3; e.state = 'graze'; alert = 2; sfx('tap'); say(e.x, e.y - 90 * e.s - 20, '母麋鹿抬頭張望', 1.6); }
  }));
  ravens.forEach(r => onAct(r.g, () => { sfx('caw'); ravenFly(r); }));
  lanes.forEach(L => L.list.forEach(w => onAct(w.g, () => {
    if (w.kind === 'kid') { w.wave = 1.8; sfx('tap'); say(w.x, L.y - 70, pick(['我看到野牛了！', '好大的蒸氣！', '哇，好臭的硫磺味']), 1.8); return; }
    w.photo = 1.6; sfx('shutter');
    if (w.kind !== 'photo') { const fl = el('circle', { cx: w.x + L.dir * 12 * L.s, cy: L.y - 38 * L.s, r: 4, fill: '#fff' }, $('fx')); tween(.35, k => { fl.setAttribute('r', f1(4 + k * 14)); fl.setAttribute('opacity', f1(1 - k)); }, () => fl.remove()); }
    else say(w.x, L.y - 76, '等噴發的那一刻', 1.6);
  })));
  onAct(ranger.g, () => { ranger.talk = 2.4; sfx('whistle'); say(370, 380, RANGER_TIPS[tipI++ % RANGER_TIPS.length], 2.6); });
  svg.addEventListener('pointermove', e => { const p = svgPoint(e); mouse.x = p.x; mouse.y = p.y; mouse.on = true; if (Math.hypot(p.x - mouse.lx, p.y - mouse.ly) > 30) { mouse.lx = p.x; mouse.ly = p.y; bloom(p.x, p.y); } });
  svg.addEventListener('pointerleave', () => { mouse.on = false; });

  $('btnShow').addEventListener('click', () => { userGesture = true; ensureAudio(); startShow('erupt'); });
  $('btnHerd').addEventListener('click', () => { userGesture = true; ensureAudio(); startShow('herd'); });
  $('btnWeather').addEventListener('click', () => { userGesture = true; ensureAudio(); setWeather((wxIdx + 1) % WX.length); });
  $('btnSound').addEventListener('click', () => {
    soundOn = !soundOn; userGesture = true; ensureAudio();
    if (master) master.gain.setValueAtTime(soundOn ? .55 : 0, actx.currentTime);
    if (!soundOn) { stopAll(); rainSound(false); try { window.sceneMusic && window.sceneMusic.stop(); } catch (e) {} } else rainSound(WX[wxIdx][0] === 'storm');
    $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  });
  $('btnDay').addEventListener('click', () => { if (show.on) endShow(true); setTime(10); });
  $('btnDusk').addEventListener('click', () => { if (show.on) endShow(true); setTime(18.3); });
  $('btnNight').addEventListener('click', () => { if (show.on) endShow(true); setTime(22); });
  $('btnAuto').addEventListener('click', () => { T.auto = !T.auto; $('btnAuto').setAttribute('aria-pressed', String(T.auto)); });
  const tr = $('timeRange');
  tr.addEventListener('input', () => { if (show.on) endShow(true); T.dragging = true; T.t = tr.value / 1000; applyColors(true); });
  tr.addEventListener('change', () => { T.dragging = false; });
  window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
  window.addEventListener('pointerdown', () => document.body.classList.remove('kbd'));
  mq.addEventListener && mq.addEventListener('change', () => { reduced = mq.matches; });
}

/* ---------------- 紙張紋理（水彩紙）：一次產生成圖片 ---------------- */
function paperGrain() {
  try {
    const cv = document.createElement('canvas'); cv.width = 800; cv.height = 300;
    const c = cv.getContext('2d'); const im = c.createImageData(800, 300);
    for (let i = 0; i < im.data.length; i += 4) { const v = 236 + Math.random() * 19; im.data[i] = v; im.data[i + 1] = v - 2; im.data[i + 2] = v - 8; im.data[i + 3] = 255; }
    c.putImageData(im, 0, 0);
    c.globalAlpha = .06; c.strokeStyle = '#4a6a5a';
    for (let i = 0; i < 260; i++) { c.beginPath(); const x = Math.random() * 800, y = Math.random() * 300; c.moveTo(x, y); c.quadraticCurveTo(x + rand(-8, 8), y + rand(-8, 8), x + rand(-16, 16), y + rand(-16, 16)); c.stroke(); }
    c.globalAlpha = .05; c.fillStyle = '#6a7a5a';
    for (let i = 0; i < 40; i++) { c.beginPath(); c.arc(Math.random() * 800, Math.random() * 300, rand(10, 40), 0, 7); c.fill(); }
    $('paper').setAttribute('href', cv.toDataURL('image/jpeg', .85));
  } catch (e) {}
}

/* ---------------- 初始化 ---------------- */
function init() {
  drawSky();
  drawFar();
  drawHill();
  drawForest();
  drawInn();
  drawRoad();
  drawCars();
  drawBasin();
  drawRiver();
  drawGP();
  drawOF();
  drawBisons();
  drawElks();
  drawJet();
  drawArc();
  drawRanger();
  drawForeL();
  drawBoard();
  drawWalkers();
  drawRavens();
  drawEagle();
  paperGrain();
  bindAll();
  if (reduced) { T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false'); }
  setWeather(0);
  applyColors(true);
  // 先讓蒸氣冒一陣子，開場畫面就有蒸氣
  for (let i = 0; i < 90; i++) step(1 / 10);
  time = 0;
  requestAnimationFrame(loop);
}
init();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on && show.kind,
  btn: { erupt: 'btnShow', herd: 'btnHerd' },
  save: () => ({ t: T.t, auto: T.auto }),
  stop: () => {
    const k = show.kind;
    endShow(true);
    if (k === 'erupt') { ofc.phase = 'idle'; ofc.H = 0; }      // 噴泉直接回到平靜
    else { herd.forEach(h => h.g.remove()); herd.length = 0; } // 野牛群收走
  },
  restore: s => { T.t = s.t; T.auto = s.auto; $('btnAuto') && $('btnAuto').setAttribute('aria-pressed', String(T.auto)); applyColors(true); }
});
/* /ShowStop */
})();
