<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高雄駁二的大港橋開合秀</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-72 高雄・駁二大義與大港橋｜扁平插畫 flat illustration
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   --d-名稱 = 白天、--n-名稱 = 夜晚、--k-名稱 = 黃昏（可省略）。
   JS 依時間自動混色，輸出成 --名稱，並產生 .f-名稱（填色）、.s-名稱（線色）兩種 class。
   沒有 d/n 成對的（例如 --glow）是固定色。
   ========================================================= */
:root{
  /* —— 天空 —— */
  --d-skyT:#47a9ea;  --n-skyT:#0b1533;  --k-skyT:#5d5fae;
  --d-skyB:#c6ecf8;  --n-skyB:#283063;  --k-skyB:#ffa46e;
  --d-cloud:#ffffff; --n-cloud:#353d6c; --k-cloud:#ffd3b2;
  --d-cloudSh:#dbe9f3; --n-cloudSh:#2b3260; --k-cloudSh:#f2a487;

  /* —— 遠方城市、85 大樓 —— */
  --d-cityFar:#aecbdc; --n-cityFar:#1c2550; --k-cityFar:#c09ea8;
  --d-bldA:#93b6cd;  --n-bldA:#1f2a56;  --k-bldA:#c69c9c;
  --d-bldB:#bfd6e4;  --n-bldB:#27345f;  --k-bldB:#ddb3a8;
  --d-bldC:#7499b5;  --n-bldC:#19234a;  --k-bldC:#a88290;
  --d-bldLn:#5f86a3; --n-bldLn:#121a3a;
  --d-winD:#7fa6c2;  --n-winD:#1a2448;
  --d-t85:#3f8fa6;   --n-t85:#16304a;  --k-t85:#8a7c96;   /* 85 大樓的藍綠玻璃 */
  --d-t85Lt:#6cb8cb; --n-t85Lt:#1f4060; --k-t85Lt:#c39aa0;
  --d-t85Dk:#2a6a82; --n-t85Dk:#0f2238;

  /* —— 港灣、船渠的水 —— */
  --d-sea:#2a9cc0;   --n-sea:#0b1a3c;  --k-sea:#46629a;
  --d-seaLt:#7fd6ec; --n-seaLt:#28427c; --k-seaLt:#ffbc8c;
  --d-seaDk:#17708f; --n-seaDk:#08112a; --k-seaDk:#2d4479;

  /* —— 對岸：流行音樂中心、棧貳庫、港埠旅運中心 —— */
  --d-white:#f6f7f4; --n-white:#5f6688; --k-white:#ffdcc6;
  --d-whiteSh:#d5dde4; --n-whiteSh:#41486c; --k-whiteSh:#e8b49e;
  --d-silver:#dfe6ec; --n-silver:#4f587e; --k-silver:#f3c8b2;
  --d-silverDk:#a9b8c6; --n-silverDk:#323a5f;
  --d-glass:#8ccbe2; --n-glass:#28427a;
  --d-pier:#d6cfc0;  --n-pier:#3a3a58;  --k-pier:#e8c3a6;
  --d-pierDk:#a9a291; --n-pierDk:#26263e;
  --d-roofG:#8d98a4; --n-roofG:#2c3150;

  /* —— 駁二倉庫 —— */
  --d-ware:#cfcac0;  --n-ware:#3e3d55;  --k-ware:#e7bea2;
  --d-wareSh:#aea89c; --n-wareSh:#2c2b42;
  --d-roofR:#a8553c; --n-roofR:#3c2230;
  --d-door:#7b8794;  --n-door:#262a40;
  --d-mur1:#2f7fc6;  --n-mur1:#1e3360;
  --d-mur2:#f3b632;  --n-mur2:#5e4c2a;
  --d-mur3:#e5574a;  --n-mur3:#5a2433;
  --d-mur4:#4fb58a;  --n-mur4:#1f4a3c;
  --d-mur5:#f6efe0;  --n-mur5:#6b6c8a;

  /* —— 大港橋 —— */
  --d-bridge:#fbfbf8; --n-bridge:#7a7fa0; --k-bridge:#ffe2cc;
  --d-bridgeSh:#c9d2da; --n-bridgeSh:#4a5070; --k-bridgeSh:#e9b9a2;
  --d-cable:#9aa7b4; --n-cable:#4c5374;

  /* —— 碼頭、輕軌 —— */
  --d-quay:#e7dfcf;  --n-quay:#47465f;  --k-quay:#f2cfb2;
  --d-quayLn:#d0c4ad; --n-quayLn:#383850;
  --d-grass:#6dbb52; --n-grass:#1c3a33;
  --d-grassDk:#4c9a3f; --n-grassDk:#132a26;
  --d-rail:#6d7a86;  --n-rail:#2a2f45;
  --d-post:#3d4a58;  --n-post:#1c2134;
  --d-tram:#f7f8f6;  --n-tram:#8a8faa;  --k-tram:#ffe4cf;
  --d-tramSh:#d5dbe0; --n-tramSh:#5a6080;
  --d-tramWin:#2d3a4c; --n-tramWin:#1a2034;
  --d-tramAc:#1fa4a0; --n-tramAc:#165a5e;
  --d-canopy:#f4f6f8; --n-canopy:#5a6286;
  --d-palm:#3e9a4c;  --n-palm:#13362c;
  --d-palmLt:#66bb5a; --n-palmLt:#1b4434;
  --d-trunk:#9b7b58; --n-trunk:#3a3036;
  --d-tree:#3b8f4a;  --n-tree:#11302a;

  /* —— 船 —— */
  --d-hullR:#b4452f; --n-hullR:#4a2430;
  --d-hullN:#2c3e64; --n-hullN:#141c34;
  --d-hullW:#f4efe3; --n-hullW:#6b6c8a;
  --d-cA:#d9483b; --n-cA:#4c2230;
  --d-cB:#2f7fc6; --n-cB:#1b2e58;
  --d-cC:#f0b43a; --n-cC:#5c4a2c;
  --d-cD:#3aa56e; --n-cD:#1c4434;
  --d-cE:#8a6ab8; --n-cE:#3a2e5c;
  --d-sailC:#ffffff; --n-sailC:#8f94b4; --k-sailC:#ffe3cf;
  --d-wood:#7a5236;  --n-wood:#2e2329;
  --d-tyre:#2a2a2e;  --n-tyre:#111118;

  /* —— 小販、街頭藝人 —— */
  --d-cart:#f4f0e6;  --n-cart:#6d6e8c;
  --d-cartB:#2f8fd0; --n-cartB:#1d3a60;
  --d-umb1:#e63b3b; --n-umb1:#5a2030;
  --d-umb2:#f5f2ea; --n-umb2:#6b6c84;
  --d-guitar:#c9823e; --n-guitar:#4c3528;
  --d-dog:#d9a35e;   --n-dog:#5a4636;

  /* —— 人物 —— */
  --d-skin1:#f3d4b7; --n-skin1:#9a8c9e;
  --d-skin2:#ddb08a; --n-skin2:#7d6a7c;
  --d-skin3:#b98565; --n-skin3:#5e4c5c;
  --d-hair1:#231d22; --n-hair1:#121224;
  --d-hair2:#6e4a30; --n-hair2:#3a2e3c;
  --d-hair3:#c9c4bb; --n-hair3:#6f6f86;
  --d-coat1:#e2574c; --n-coat1:#6e3245;
  --d-coat2:#3f7fc6; --n-coat2:#2a3f6e;
  --d-coat3:#f0bf45; --n-coat3:#76643e;
  --d-coat4:#3fb08a; --n-coat4:#235050;
  --d-coat5:#9b6cba; --n-coat5:#4d3a6a;
  --d-coat6:#f5a7b8; --n-coat6:#7a5577;
  --d-coat7:#2f3b52; --n-coat7:#1d2440;
  --d-coat8:#f7f3ea; --n-coat8:#7d829c;
  --d-coat9:#ff8a3d; --n-coat9:#74422e;
  --d-pants1:#33384f; --n-pants1:#151a30;
  --d-pants2:#b79f7d; --n-pants2:#4c4350;
  --d-pants3:#5b7fa8; --n-pants3:#2a3a5c;
  --d-black:#24222a; --n-black:#101018;
  --d-bike:#e9653b;  --n-bike:#5a2e2c;

  /* —— 固定色（燈光、天體、特效、表演） —— */
  --glow:#ffd98a;      /* 窗光 */
  --lamp:#ffe7a8;      /* 路燈 */
  --led1:#ff5fa8; --led2:#7d6bff; --led3:#3fe0ff; --led4:#5dffa0; --led5:#ffd23f; --led6:#ff7a3d;   /* 音樂中心、85 大樓的 LED */
  --bridgeN:#9fd8ff;   /* 大港橋夜間打燈 */
  --fw1:#ff4f6e; --fw2:#ffd35a; --fw3:#5ee6ff; --fw4:#b98cff; --fw5:#ffffff;
  --sun:#ffd166; --sunCore:#fff1c2; --moon:#f7f0d4; --star:#fff6da;
  --rainc:#9fb2c8; --flash:#ffffff;

  /* —— 頁面介面 —— */
  --page-bg:#f4f6f2; --page-fg:#1d2b40; --page-muted:#5d6879;
  --ui-surface:#ffffff; --ui-line:#d8dde6; --ui-accent:#0f8f9a; --ui-accent-2:#d6305a;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:14px;overflow:hidden;background:var(--skyB,#c6ecf8);line-height:0;box-shadow:0 6px 24px rgba(29,43,64,.14)}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:var(--ui-surface);border:1.5px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--page-fg);border-color:var(--page-fg);color:var(--ui-surface);font-weight:700}
.panel button.big{background:var(--ui-accent);border-color:var(--ui-accent);color:#fff;font-weight:700}
.panel button.big.alt{background:var(--ui-accent-2);border-color:var(--ui-accent-2)}
.panel button.big.on{background:var(--page-fg);border-color:var(--page-fg)}
.panel button:focus-visible,.panel input:focus-visible{outline:2px dashed var(--ui-accent);outline-offset:3px}
/* 畫面內可點物件：滑鼠點不顯示外框，用鍵盤 Tab 時才顯示 */
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px dashed var(--ui-accent);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 共用 ---------- */
#scene .clickable,#scene [role="button"]{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .bubble rect,#scene .bubble path{fill:#ffffff;stroke:#1d2b40;stroke-width:1.6}
#scene .bubble text{fill:#1d2b40;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .sign{font:700 9px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .count{font:900 120px "Arial Rounded MT Bold","Varela Round",var(--font-ui);text-anchor:middle;dominant-baseline:central}
@media (prefers-reduced-motion:reduce){ *{scroll-behavior:auto!important;transition:none!important} }
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>
</head>
<body>
<main class="wrap">
  <figure class="stage">
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="高雄駁二大義：前景是有綠草軌道的環狀輕軌和碼頭步道，白色的大港橋從碼頭跨過船渠，對岸是流行音樂中心、棧貳庫、港埠旅運中心，遠方是 85 大樓">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--skyT)"/><stop offset=".62" stop-color="var(--skyB)"/>
      </linearGradient>
      <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--seaLt)"/><stop offset=".08" stop-color="var(--sea)"/><stop offset="1" stop-color="var(--seaDk)"/>
      </linearGradient>
      <radialGradient id="sunGlow"><stop offset="0" stop-color="var(--sun)" stop-opacity=".6"/><stop offset="1" stop-color="var(--sun)" stop-opacity="0"/></radialGradient>
      <radialGradient id="warmGlow"><stop offset="0" stop-color="var(--glow)" stop-opacity=".8"/><stop offset="1" stop-color="var(--glow)" stop-opacity="0"/></radialGradient>
      <radialGradient id="lampGlow"><stop offset="0" stop-color="var(--lamp)" stop-opacity=".75"/><stop offset="1" stop-color="var(--lamp)" stop-opacity="0"/></radialGradient>
      <!-- 大樓窗戶：白天的玻璃格、夜晚亮燈 -->
      <pattern id="winDay" width="8" height="9" patternUnits="userSpaceOnUse"><rect x="1.5" y="2" width="5" height="4" fill="var(--winD)"/></pattern>
      <pattern id="winNight" width="8" height="9" patternUnits="userSpaceOnUse"><rect x="1.5" y="2" width="5" height="4" fill="var(--glow)"/></pattern>
      <pattern id="winNight2" width="16" height="18" patternUnits="userSpaceOnUse"><rect x="1.5" y="2" width="5" height="4" fill="var(--glow)"/><rect x="9.5" y="11" width="5" height="4" fill="var(--glow)"/></pattern>
      <!-- 85 大樓的直向玻璃分隔 -->
      <pattern id="t85Line" width="7" height="6" patternUnits="userSpaceOnUse"><rect x="5.6" width="1.2" height="6" fill="var(--t85Dk)" opacity=".55"/><rect y="4.8" width="7" height=".8" fill="var(--t85Dk)" opacity=".3"/></pattern>
      <!-- 流行音樂中心的六角形外牆 -->
      <pattern id="hexWall" width="12" height="10.4" patternUnits="userSpaceOnUse"><path d="M3 0 L9 0 L12 5.2 L9 10.4 L3 10.4 L0 5.2Z" fill="none" stroke="var(--whiteSh)" stroke-width="1.1"/></pattern>
      <pattern id="hexLed" width="12" height="10.4" patternUnits="userSpaceOnUse"><path d="M3 0 L9 0 L12 5.2 L9 10.4 L3 10.4 L0 5.2Z" fill="none" stroke="#fff" stroke-width="1.3"/></pattern>
      <!-- 浪板屋頂 -->
      <pattern id="corr" width="5" height="8" patternUnits="userSpaceOnUse"><rect width="2" height="8" fill="#000" opacity=".12"/></pattern>
      <clipPath id="clipCanal"><rect x="0" y="406" width="1600" height="100"/></clipPath>
      <clipPath id="clipHarb"><rect x="0" y="352" width="1600" height="34"/></clipPath>
    </defs>

    <!-- ===== 場景：天空 ===== -->
    <rect x="0" y="0" width="1600" height="600" fill="url(#skyGrad)"/>
    <g id="stars" class="noHit"></g>
    <g id="sun" role="button" tabindex="0" aria-label="太陽" class="clickable"></g>
    <g id="moon" role="button" tabindex="0" aria-label="月亮" class="clickable"></g>
    <g id="clouds" class="noHit"></g>
    <g id="bolt" class="noHit"></g>
    <g id="sky" class="noHit"></g>
    <g id="fireworks" class="noHit"></g>

    <!-- ===== 場景：遠方城市與 85 大樓 ===== -->
    <g id="far"></g>
    <g id="t85"></g>

    <!-- ===== 場景：高雄港（大船航道） ===== -->
    <rect id="harbRect" x="0" y="352" width="1600" height="56" fill="url(#seaGrad)"/>
    <g id="harbFx" class="noHit" clip-path="url(#clipHarb)"></g>
    <g id="ships"></g>
    <g id="barges" class="noHit"></g>

    <!-- ===== 場景：對岸碼頭（流行音樂中心、棧貳庫、港埠旅運中心） ===== -->
    <g id="pier"></g>

    <!-- ===== 場景：第三船渠 ===== -->
    <rect id="canalRect" x="0" y="406" width="1600" height="110" fill="url(#seaGrad)"/>
    <g id="canalFx" class="noHit"></g>
    <g id="refl" class="noHit" clip-path="url(#clipCanal)"></g>
    <g id="ripples" class="noHit"></g>
    <g id="boats"></g>
    <g id="sailG"></g>

    <!-- ===== 場景：大港橋 ===== -->
    <g id="bridge"></g>

    <!-- ===== 場景：駁二倉庫、碼頭、輕軌 ===== -->
    <g id="ware"></g>
    <g id="quay"></g>
    <g id="trainB"></g>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);
      }
      return _conn.call(this, dest, ...a);
    };
  }
  function stopAudio() {
    let longs = [], ctx = null;
    for (const s of srcs) {
      const c = s.context, now = c.currentTime, m = s.__ss; ctx = c;
      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }
    if (longs.length && ctx) {
      const g = outs.get(ctx), now = ctx.currentTime;
      if (g) {
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 1.1); g.gain.setValueAtTime(0, now + 1.2);
        g.gain.linearRampToValueAtTime(1, now + 1.9);
      }
      longs.forEach(s => { try { s.stop(now + 1.15); } catch (e) {} srcs.delete(s); });
    }
    srcs.clear();
  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');
    // 凍結色票：把目前的 CSS 變數抄到殘影上，底下換色不影響殘影
    const cs = getComputedStyle(svg);
    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }
      }
    }
    const par = svg.parentElement;
    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });
    added = [];
  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>
/* =========================================================
   SC-72 高雄駁二的大港橋開合秀｜程式區
   區塊：①工具與色票 ②場景（天空、城市、85 大樓、高雄港、對岸碼頭、船渠、大港橋、駁二倉庫、碼頭與輕軌）
         ③角色（行人、單車、遛狗、街頭藝人、冰淇淋車、輕軌列車、貨櫃輪、拖船、遊港船、帆船、鳥、飛機）
         ④動畫（日夜、天氣、漣漪、兩場表演）
         ⑤互動（點擊、滑鼠、聲音、控制列）
   ========================================================= */
(() => {
'use strict';

/* ---------------- ① 工具與色票 ---------------- */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const root = document.documentElement;
const svg = $('scene');
const DAY_SEC = 160;            // 自動播放時一天幾秒
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
let seed = 20261172;            // 固定亂數：每次開啟構圖一樣
const srand = (a = 0, b = 1) => { seed = (seed * 16807) % 2147483647; return a + (seed / 2147483647) * (b - a); };
const f1 = n => (+n).toFixed(1);
function el(tag, attrs = {}, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function frag(parent, html) { parent.insertAdjacentHTML('beforeend', html); return parent.lastElementChild; }

// 讀取色票、依日夜內插混色
const css = n => getComputedStyle(root).getPropertyValue(n).trim();
const hex = h => {
  h = h.replace('#', '');
  if (h.length === 3) h = [...h].map(c => c + c).join('');
  const n = parseInt(h.slice(0, 6), 16);
  return [n >> 16 & 255, n >> 8 & 255, n & 255, 1];
};

const PAIRS = {};
(() => {
  const names = [];
  for (const sheet of document.styleSheets) {

  }

  });

const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
let reduced = mq.matches;

const CITY = 352;               // 遠方城市的地平線（港灣對岸）
const HARB = 384;               // 港灣大船的吃水線
const PIER = 406;               // 對岸碼頭邊（船渠的遠岸）
const QUAY = 506;               // 我們這一側的碼頭邊
const TRK_B = 534, TRK_F = 556; // 輕軌兩條軌道（列車底部）
const LANES_Y = [580, 590, 600];// 步道：往左走、單車道、往右走

const winLights = [];           // {el, th} 大樓窗戶
const nightEls = [];            // {el, k} 夜裡淡入
const reflBars = [];            // 倒影色條

/* ---------------- ② 場景：天空（星星、太陽、月亮、雲） ---------------- */
const stars = [], clouds = [];

// 把橋面上的點（沿橋長 u、橋寬 v）依旋轉角度投影到畫面
function brPt(u, v, elev) {

const P = pts => pts.map(q => `${f1(q[0])} ${f1(q[1])}`).join(' L');

  brMast = frag(brG, `<g><path d="M${BR.px - 6} ${QUAY - 6} C${BR.px - 10} ${QUAY - 90} ${BR.px - 4} ${QUAY - 160} ${BR.px + 14} ${QUAY - 214} L${BR.px + 18} ${QUAY - 212} C${BR.px + 4} ${QUAY - 160} ${BR.px + 2} ${QUAY - 90} ${BR.px + 6} ${QUAY - 6}Z" class="f-bridge"/>
    <path d="M${BR.px + 1} ${QUAY - 8} C${BR.px} ${QUAY - 90} ${BR.px + 4} ${QUAY - 160} ${BR.px + 17} ${QUAY - 212} L${BR.px + 18} ${QUAY - 212} C${BR.px + 4} ${QUAY - 160} ${BR.px + 2} ${QUAY - 90} ${BR.px + 6} ${QUAY - 6}Z" class="f-bridgeSh"/></g>`);

const MAST_TOP = () => [BR.px + 16, QUAY - 212];
function updateBridge() {

/* ---------------- ③ 角色：環狀輕軌列車（白色低底盤、五節車廂，沒有架空電線；兩條軌道各走一個方向，靠站停車） ---------------- */
const trains = [];
function tramSVG(g, len) {
  // 面向右邊，原點在車尾底部；長 len、高 50
  const n = 5, seg = len / n;
  let body = '', wins = '', doors = '';
  for (let i = 0; i < n; i++) {
    const x0 = i * seg + 2, x1 = (i + 1) * seg - 2;
    wins += `<rect x="${f1(x0 + 6)}" y="-42" width="${f1(seg - 16)}" height="18" rx="3"/>`;
    doors += `<rect x="${f1(x0 + seg / 2 - 7)}" y="-40" width="14" height="36" rx="2"/>`;
  }
  frag(g, `<g>
    <path d="M0 -4 L0 -46 Q0 -50 6 -50 L${len - 30} -50 Q${len - 6} -50 ${len} -30 L${len} -4 Z" class="f-tram"/>
    <rect x="0" y="-12" width="${len}" height="8" class="f-tramSh"/>
    <g class="f-tramWin">${wins}</g>
    <path d="M${len - 26} -46 Q${len - 6} -44 ${len - 2} -28 L${len - 26} -28Z" class="f-tramWin"/>
    <g class="f-tramSh">${doors}</g>
    <rect x="0" y="-22" width="${len}" height="4" class="f-tramAc"/>
    <path d="M${len - 26} -18 L${len} -18 L${len} -14 L${len - 26} -14Z" class="f-tramAc"/>
    <path d="${Array.from({ length: n - 1 }, (_, i) => `M${f1((i + 1) * seg)} -50 L${f1((i + 1) * seg)} -4`).join(' ')}" stroke="#000" stroke-opacity=".18" stroke-width="2"/>
    <rect x="${len * .3}" y="-54" width="34" height="4" rx="1.5" class="f-tramSh"/><rect x="${len * .7}" y="-54" width="34" height="4" rx="1.5" class="f-tramSh"/>
    <rect x="0" y="-4" width="${len}" height="4" rx="2" class="f-post"/>
  </g>`);
  // 車窗裡的乘客剪影
  let heads = '';
  for (let x = 10; x < len - 30; x += 17) if (srand() < .6) heads += `<circle cx="${x}" cy="-30" r="4"/><rect x="${x - 5}" y="-27" width="10" height="4" rx="2"/>`;
  frag(g, `<g fill="#55657a" opacity=".85">${heads}</g>`);
  const lt = frag(g, `<g opacity="0"><g fill="var(--glow)" opacity=".75">${wins}</g><circle cx="${len - 3}" cy="-12" r="2.6" fill="#fff"/></g>`);
  const hl = frag(g, `<path d="M${len} -12 L${len + 110} -22 L${len + 110} 2Z" fill="var(--lamp)" opacity="0"/>`);
  return { lt, hl };
}
function addTrain(o) {
  const wrap = el('g', { class: 'clickable', role: 'button', tabindex: 0, 'aria-label': '環狀輕軌列車' }, $(o.g));
  const body = el('g', {}, wrap);
  const parts = tramSVG(body, o.len);
  const t = Object.assign({ wrap, body, parts, v: 0, state: 'run', wait: 0, bell: 0 }, o);
  onAct(wrap, () => { say(t.x, t.y - 80, pick(['高雄環狀輕軌：繞市區一圈', '沒有架空電線，靠站時充電', '軌道上鋪著綠色草皮', '下一站：真愛碼頭']), 2.2); sfx(tt => tramBell(tt)); });
  trains.push(t);
}
function stepTrains(dt, mv) {
  for (const t of trains) {
    // 車頭位置：dir>0 車頭在右；車站停車點讓列車中心對準月台
    const Ls = t.len * t.s, center = t.x - t.dir * Ls / 2;   // t.x 是車頭位置
    if (t.state === 'run') {
      const toStop = (STATION_X - center) * t.dir;
      let vWant = t.vmax;
      if (!t.served && toStop > 0 && toStop < 160) vWant = Math.max(6, t.vmax * toStop / 160);
      if (!t.served && toStop <= 0 && toStop > -20) { t.state = 'stop'; t.wait = 7; t.served = true; vWant = 0; }
      t.v += (vWant - t.v) * Math.min(1, dt * 2);
      if (t.state === 'stop') t.v = 0;
      t.x += t.dir * t.v * dt * mv;
      // 出畫面後在畫外等一陣子再進站（班距）
      const off = t.dir > 0 ? t.x - Ls > 1640 : t.x + Ls < -40;
      if (off) { t.state = 'away'; t.wait = rand(10, 18); }
    } else if (t.state === 'stop') {
      t.wait -= dt;
      if (t.wait < 0) { t.state = 'run'; t.v = 0; }
    } else if (t.state === 'away') {
      t.wait -= dt;
      if (t.wait < 0) { t.state = 'run'; t.served = false; t.x = t.dir > 0 ? -10 : 1610; t.v = t.vmax; }
    }
    // dir>0：原點是車尾，往右開；dir<0：鏡像後車頭朝左
    const x0 = t.dir > 0 ? t.x - Ls : t.x + Ls;
    t.wrap.setAttribute('transform', `translate(${f1(x0)} ${t.y}) scale(${t.dir * t.s} ${t.s})`);
    t.wrap.style.display = t.state === 'away' ? 'none' : '';
    t.parts.lt.setAttribute('opacity', f1(Math.max(nOn, wx.rain * .6)));
    t.parts.hl.setAttribute('opacity', f1(nOn * .35));
  }
}

function stepVessels(list, dt, mv, tt, W0, gapK) {
  for (const b of list) {
    b.boost = Math.max(0, b.boost - dt * .5);
    let v = b.v0 * (1 + b.boost) * (1 + wx.wind * .3);
    for (const o of list) {
      if (o === b || o.y !== b.y) continue;
      const d = (o.x - b.x) * b.dir, gap = (b.len + o.len) / 2 + 40;
      if (d > 0 && d < gap + 30) v = Math.min(v, d < gap ? 0 : o.v);
    }
    // 大港橋開合秀時，船渠的遊港船停在橋外等帆船先過
    if (b.canal && show.on === 'bridge') { const nx = b.x + b.dir * 60 * b.s; if ((nx > 900 && nx < 1300) && !(b.x > 900 && b.x < 1300)) v = 0; }
    b.v = v;
    b.x += b.dir * v * dt * mv;
    const W = 1600 + W0;
    if (b.dir > 0 && b.x > W) b.x = -W0;
    if (b.dir < 0 && b.x < -W0) b.x = W;
    const amp = 1 + wx.wind * 3;
    const bob = Math.sin(tt * 1.6 + b.bob) * (b.big ? .4 : 1) * amp * mv;
    const tilt = Math.sin(tt * 1.3 + b.bob) * (b.big ? .2 : 1) * amp * mv;
    b.g.setAttribute('transform', `translate(${f1(b.x)} ${f1(b.y + bob)}) scale(${b.dir * b.s} ${b.s})`);
    b.body.setAttribute('transform', `rotate(${f1(tilt)})`);
    b.wake.setAttribute('opacity', f1(clamp(v / b.v0, 0, 1) * (1 - nOn * .5) * .8));
    b.lt.setAttribute('opacity', f1(nOn));
  }
}

/* ---------------- ③ 角色：天空的鳥群（海鷗）、降落中的飛機、流星 ---------------- */
const birds = [], planes = [], meteors = [];
function addBird(x, y, vx) {
  const g = el('g', {}, $('sky'));
  const wing = el('path', { stroke: 'var(--bridgeSh)', 'stroke-width': 2, fill: 'none', 'stroke-linecap': 'round', d: 'M-7 0 Q-3.5 -4 0 0 Q3.5 -4 7 0' }, g);
  birds.push({ g, wing, x, y, vx, ph: rand(0, 6), t: 0 });
}
function birdFlock(x, y) { const d = x < 800 ? 1 : -1; for (let i = 0; i < 6; i++) addBird(x - d * i * 18 + rand(-6, 6), y + Math.abs(i - 2.5) * 10 + rand(-4, 4), d * rand(70, 90)); }
function addPlane() {
  // 往小港機場降落：從左上往右下慢慢下降，機頭朝前進方向
  const g = el('g', {}, $('sky'));
  frag(g, `<g><path d="M-16 0 L14 -1 Q18 0 14 1 L-16 1Z" fill="#e8ecf2"/><path d="M-2 0 L-8 -7 L-5 -7 L4 0Z M-2 1 L-8 7 L-5 7 L4 1Z M-14 0 L-18 -5 L-16 -5 L-11 0Z" fill="#c2cad6"/></g>`);
  const blink = frag(g, `<circle cx="-2" cy="-6" r="1.6" fill="#ff4b4b" opacity="0"/>`);
  planes.push({ g, blink, x: -40, y: rand(40, 70), vx: 52, vy: 6 });
}
function meteor(x) {
  const g = el('g', {}, $('sky'));
  el('line', { x1: 0, y1: 0, x2: -60, y2: -24, stroke: '#fff', 'stroke-width': 2, 'stroke-linecap': 'round' }, g);
  meteors.push({ g, x, y: rand(30, 110), t: 0 });
}
function stepSkyFx(dt, mv) {
  for (let i = birds.length - 1; i >= 0; i--) {
    const b = birds[i]; b.t += dt; b.x += b.vx * dt * mv; b.y += Math.sin(b.t * 2 + b.ph) * 6 * dt;
    b.ph += dt * 12 * mv;
    b.wing.setAttribute('d', `M-7 ${f1(Math.sin(b.ph) * 3)} Q-3.5 -4 0 0 Q3.5 -4 7 ${f1(Math.sin(b.ph) * 3)}`);
    b.wing.setAttribute('stroke', night > .5 ? '#c8cde0' : '#4a5468');
    b.g.setAttribute('transform', `translate(${f1(b.x)} ${f1(b.y)})`);
    if (b.x < -60 || b.x > 1660) { b.g.remove(); birds.splice(i, 1); }
  }
  for (let i = planes.length - 1; i >= 0; i--) {
    const p = planes[i]; p.x += p.vx * dt * mv; p.y += p.vy * dt * mv;
    p.g.setAttribute('transform', `translate(${f1(p.x)} ${f1(p.y)}) rotate(${f1(Math.atan2(p.vy, p.vx) * 180 / Math.PI)})`);
    p.blink.setAttribute('opacity', f1(nOn * (Math.sin(performance.now() / 160) > .6 ? 1 : 0)));
    if (p.x > 1660) { p.g.remove(); planes.splice(i, 1); }
  }
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i]; m.t += dt;
    m.g.setAttribute('transform', `translate(${f1(m.x + m.t * 360)} ${f1(m.y + m.t * 144)})`);
    m.g.setAttribute('opacity', f1(clamp(1 - m.t / .9, 0, 1)));
    if (m.t > .9) { m.g.remove(); meteors.splice(i, 1); }
  }
}

/* ---------------- ④ 動畫：日夜 ---------------- */
const T = { t: .438, auto: true, target: null, hold: false, dragging: false };

function clockText() {
  const h = T.t * 24, hh = Math.floor(h) % 24, mm = Math.floor((h - Math.floor(h)) * 60 + 1e-6);
  return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
}
function applyTime(force) {
  if (!force && Math.abs(T.t - lastApplied) < .0003) return;
  lastApplied = T.t;
  const h = T.t * 24;
  // 高雄：一年平均大約 6 點日出、18 點日落
  night = clamp(1 - smooth(5.5, 6.5, h) + smooth(17.9, 18.9, h), 0, 1);
  dusk = Math.max(Math.exp(-Math.pow((h - 6.0) / .7, 2)) * .7, Math.exp(-Math.pow((h - 18.0) / .8, 2)));
  for (const k in PAIRS) {
    if (k === 'skyT' || k === 'skyB' || k === 'cloud' || k === 'cloudSh') continue;
    const Pp = PAIRS[k];
    let c = mix(Pp.d, Pp.n, night);
    if (Pp.k) c = mix(c, Pp.k, dusk * .8);
    root.style.setProperty('--' + k, rgba(c));
  }
  // 面向東南的港灣：太陽從左邊升起，越過頭頂，傍晚落到右邊 85 大樓後方
  const sp = (h - 5.9) / 12.3, mp = ((h - 18.6 + 24) % 24) / 11.4;
  const sx = 120 + sp * 1300, sy = CITY - Math.sin(Math.PI * clamp(sp, -.1, 1.1)) * 300;
  $('sun').setAttribute('transform', `translate(${f1(sx)} ${f1(sy)})`);
  $('sun').style.display = sp > -.06 && sp < 1.06 ? '' : 'none';
  $('moon').setAttribute('transform', `translate(${f1(160 + mp * 1250)} ${f1(CITY - Math.sin(Math.PI * clamp(mp, 0, 1)) * 280)})`);
  $('moon').style.display = mp > -.05 && mp < 1.05 ? '' : 'none';
  nOn = smooth(.3, .85, night);
  $('clock').textContent = clockText();
  if (!T.dragging) $('timeRange').value = Math.round(T.t * 1000);
  winLights.forEach(w => w.el.setAttribute('opacity', f1(nOn > w.th ? .9 : 0)));
  stars.forEach(s => s.base = nOn);
}
const grey = () => clamp(wx.cloud * .45 + wx.rain * .7, 0, .85);
function updateSky() {
  const gr = grey();
  ['skyT', 'skyB', 'cloud', 'cloudSh'].forEach(k => {
    const Pp = PAIRS[k];
    let c = mix(Pp.d, Pp.n, night);
    if (Pp.k) c = mix(c, Pp.k, dusk * .85 * (1 - gr * .7));
    const g = mix([150, 162, 176, 1], [36, 42, 62, 1], night);
    const gc = k.startsWith('cloud') ? mix(k === 'cloud' ? [214, 220, 228, 1] : [150, 160, 176, 1], [62, 70, 98, 1], night) : g;
    c = mix(c, gc, gr * (k.startsWith('cloud') ? .75 : 1));
    root.style.setProperty('--' + k, rgba(c));
  });
  $('sun').setAttribute('opacity', f1(clamp(1 - gr * .85, .1, 1)));
}

  clouds.forEach(c => {
    c.x += c.sp * (1 + wx.wind * 6) * dt * mv;

}

onAct(musicG, () => { musicMode++; say(560, 200, pick(['流行音樂中心：外牆是一格一格的六角形', '晚上六角形格子會亮起彩色燈光', '常常有演唱會和音樂祭']), 2.4); sfx(t => strum(t, [55, 62, 67, 71, 74])); });
onAct(ctG, () => { say(1070, 140, pick(['港埠旅運中心：像銀白色的船身加一根高聳的煙囪', '地上 15 層，大型郵輪在這裡靠岸', '旁邊就是輕軌旅運中心站']), 2.6); sfx(t => chime(t)); });
onAct(kw2G, () => { say(790, 330, pick(['棧貳庫：百年老倉庫改建的文創空間', '以前是存放香蕉和糖的港口倉庫']), 2.4); sfx(t => hello(t)); });
onAct(wareG, () => { say(150, 330, pick(['駁二：港邊的舊倉庫變成藝術特區', '倉庫外牆畫滿了大型壁畫', '倉庫裡常常有展覽和市集']), 2.4); sfx(t => chime(t)); });
onAct(buskG, () => { buskT = 3.6; say(320, TRK_F - 80, pick(['謝謝大家！再來一首', '歡迎投錢支持街頭藝人']), 2); sfx(t => guitarRiff(t)); });
onAct(iceG, () => { ice.cut = 1.4; floater(ice.x + 18, ice.y - 50, '<rect x="-6" y="-5" width="12" height="9" rx="4" fill="#fff6e0"/><circle cx="-2" cy="-6" r="3.4" fill="#f7d6a0"/><circle cx="3" cy="-7" r="3.4" fill="#f4b6c8"/><path d="M-5 -2 l3 -2 M3 -1 l2 -3" stroke="#4aa64a" stroke-width="1.4"/>', 1.4); say(ice.x + 20, ice.y - 120, pick(['花生捲冰淇淋！刨花生糖粉加兩球冰淇淋', '要加香菜嗎？', '潤餅皮包起來，一捲剛剛好']), 2.2); sfx(t => scrape(t)); });
selfie.forEach(p => onAct(p.g, () => { if (selfieT > 0) return; selfieT = 1.2; photoFlash(1266, QUAY - 26); say(1270, QUAY - 80, pick(['跟大港橋合照！', '一、二、三，笑一個！']), 1.8); sfx(t => shutter(t)); }));

/* ---------------- ⑤ 互動：控制列 ---------------- */
function syncAuto() { $('btnAuto').setAttribute('aria-pressed', String(T.auto)); $('btnAuto').textContent = T.auto ? '自動播放中' : '自動播放'; }
function goTo(t) { if (reduced) { T.t = t; applyTime(true); step(.05); } else T.target = t; }
const tap = fn => () => { userGesture = true; ensureAudio(); setTimeout(() => { fn(); if (reduced) step(.05); }, actx && actx.state !== 'running' ? 120 : 0); };
$('btnBridge').addEventListener('click', tap(() => startBridge(false)));
$('btnNY').addEventListener('click', tap(() => startNY(false)));
$('btnWeather').addEventListener('click', () => {
  userGesture = true; ensureAudio();
  wxI = (wxI + 1) % WX_LIST.length;
  if (show.on && wxI >= 2) wxI = 0;   // 表演時跳過雷雨、颱風
  $('btnWeather').textContent = '天氣：' + WX_LIST[wxI][1];
  if (WX_LIST[wxI][0] === 'storm') boltT = 1.2;
  if (WX_LIST[wxI][0] === 'typh') say(800, 250, '颱風來了！風雨很大，船都放慢了', 2.2);
  if (reduced) step(.05);
});
$('btnSound').addEventListener('click', () => {
  soundOn = !soundOn; userGesture = true;
  $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  if (ensureAudio()) {
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.setValueAtTime(soundOn ? .5 : 0, actx.currentTime);
    if (!soundOn) { [musNode, sfxNode].forEach(n => { if (n) try { n.disconnect(); } catch (e) {} }); musNode = sfxNode = null; }
  }
  if (!soundOn) { try { window.sceneMusic && window.sceneMusic.stop(); } catch (e) {} }
});
$('btnDay').addEventListener('click', () => { T.auto = false; syncAuto(); goTo(10.5 / 24); });
$('btnNight').addEventListener('click', () => { T.auto = false; syncAuto(); goTo(20.5 / 24); });
$('btnAuto').addEventListener('click', () => { T.auto = !T.auto; T.target = null; syncAuto(); });
$('timeRange').addEventListener('input', e => {
  T.t = e.target.value / 1000; T.target = null; T.dragging = true; applyTime(true); T.dragging = false;
  if (reduced) step(.05);
});
function start() {
  cancelAnimationFrame(rafId);
  if (reduced) { T.auto = false; syncAuto(); applyTime(true); step(.05); }
  else { last = performance.now(); rafId = requestAnimationFrame(loop); }
}
mq.addEventListener?.('change', e => { reduced = e.matches; if (!reduced) { T.auto = true; syncAuto(); } start(); });

applyTime(true);
syncAuto();
step(.016);
start();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on,
  btn: { bridge: 'btnBridge', ny: 'btnNY' },
  ff: () => { show.wow = true; show.booms.forEach(b => b.done = true); show.t = show.dur - .02; },   // 剩下的煙火不放，直接收尾
  save: () => ({ T: { ...T }, w: wxI }),
  stop: () => endShow(),
  restore: s => {
    Object.assign(T, s.T); T.hold = false; syncAuto();
    if (wxI !== s.w) { wxI = s.w; $('btnWeather').textContent = '天氣：' + WX_LIST[wxI][1]; }
    applyTime(true);
  }
});
/* /ShowStop */
})();
</script>
