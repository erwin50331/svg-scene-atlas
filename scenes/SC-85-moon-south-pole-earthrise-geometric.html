<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月球南極的地球升起</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-85 月球南極的地球升起｜極簡幾何風
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   風格重點：只用圓、膠囊、矩形、三角形與多邊形，平塗色塊不描邊；
            山與石頭切成「亮面／暗面」兩塊，亮面跟著太陽方向對調。
   科學設定（盡量寫實）：
   - 地點是月球南極的環形山邊緣。從南極看，地球一直貼在地平線附近，
     隨「天平動」慢慢上下晃，所以會看到地球從環形山邊緣升起又落下。
   - 太陽也一直很低，貼著地平線繞圈，影子永遠拉得很長；太陽會躲到山後面，那就是「月夜」。
   - 沒有大氣：白天天空也是黑的、遠山不會變朦朧、星星不會閃爍；
     塵土照拋物線落下，不會飄成一團煙；流星體不會燒成流星，直接撞上月面閃光。
   - 地相和月相相反：太陽在地球旁邊時是細細的「地牙」，太陽在背後時是滿地球。
   - 月球的一天（朔望月）約 29.5 個地球日；畫面中一圈約 150 秒。
   - 地球畫得比實際大（實際視直徑約 2 度），方便看清楚。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（月晝）／--n-名稱（月夜，地球照亮的藍灰色），
   部分另有 --k-名稱（地球日食時的紅銅色）。JS 會依光線內插，輸出成 --名稱，
   並自動產生 .f-名稱（填色）、.s-名稱（描邊）兩個 class。
   ========================================================= */
:root{
  /* —— 天空：沒有大氣，白天也是黑的 —— */
  --d-sky-top:#020309;  --n-sky-top:#020309;
  --d-sky-low:#0b0d16;  --n-sky-low:#080b17;  --k-sky-low:#1a0a07;

  /* —— 遠山（亮面／暗面）與環形山邊緣 —— */
  --d-mt-lit:#dcd7cd;   --n-mt-lit:#5d6884;   --k-mt-lit:#a5523a;
  --d-mt-shade:#5c5752; --n-mt-shade:#262c3d; --k-mt-shade:#3c1b14;
  --d-rim:#b9b3a8;      --n-rim:#47516b;      --k-rim:#7f3d2c;
  --d-rim-top:#e6e1d7;  --n-rim-top:#66718e;  --k-rim-top:#b45a40;

  /* —— 月面（月壤） —— */
  --d-gr-far:#aea89e;   --n-gr-far:#3f4860;   --k-gr-far:#6b3326;
  --d-gr-mid:#bfb9ae;   --n-gr-mid:#48526a;   --k-gr-mid:#783a2b;
  --d-gr-near:#ccc6bb;  --n-gr-near:#515c76;  --k-gr-near:#84402f;
  --d-gr-dot:#a19b90;   --n-gr-dot:#3a4357;   --k-gr-dot:#5c2b20;
  --d-crater-in:#948e84; --n-crater-in:#343c50; --k-crater-in:#52261b;
  --d-crater-lip:#e0dbd1; --n-crater-lip:#6a7591; --k-crater-lip:#a6543b;
  --d-rock-lit:#d3cec4; --n-rock-lit:#5f6a86;  --k-rock-lit:#9c4c36;
  --d-rock-shade:#6e6963; --n-rock-shade:#2c3344; --k-rock-shade:#431f17;
  --d-track:#8e887e;    --n-track:#30384a;    --k-track:#4e2419;
  --d-pad:#8d8a86;      --n-pad:#363d50;      --k-pad:#5a2b20;   /* 月壤燒結的降落場 */

  /* —— 基地：居住艙、溫室、太陽能塔、天線、登月艙 —— */
  --d-hull:#f4eee3;     --n-hull:#6f7895;     --k-hull:#bb6a4e;
  --d-hull-sh:#cdc4b4;  --n-hull-sh:#454d68;  --k-hull-sh:#80402f;
  --d-berm:#a29c91;     --n-berm:#3c4459;     --k-berm:#653024;  /* 蓋在居住艙上的月壤沙包 */
  --d-foil:#f2b23a;     --n-foil:#7d6c46;     --k-foil:#b66a2a;  /* 金色隔熱箔 */
  --d-foil-sh:#c4861b;  --n-foil-sh:#54472c;  --k-foil-sh:#7d4318;
  --d-metal:#9ba4b4;    --n-metal:#3d465b;    --k-metal:#6e3a2e;
  --d-metal-dk:#5b6375; --n-metal-dk:#252b3b; --k-metal-dk:#3b1d16;
  --d-panel:#2d50a6;    --n-panel:#16214b;    --k-panel:#3b2438;
  --d-panel-ln:#7095e3; --n-panel-ln:#27356f; --k-panel-ln:#6a3b4a;
  --d-panel-back:#a8aeb9; --n-panel-back:#394055; --k-panel-back:#6b3a2f;
  --d-glass:#27385f;    --n-glass:#141c33;

  /* —— 太空衣 —— */
  --d-suit:#f8f5ef;     --n-suit:#818aa6;     --k-suit:#c8765a;
  --d-suit-sh:#cdc8be;  --n-suit-sh:#565e78;  --k-suit-sh:#8c4735;
  --d-pack:#e4dfd5;     --n-pack:#646d88;     --k-pack:#a65e47;
  --d-boot:#6c717f;     --n-boot:#2a2f3f;     --k-boot:#44211a;
  --d-glove:#e0dbd1;    --n-glove:#6b7490;    --k-glove:#a65b44;
  --d-visor:#f0b43c;    --n-visor:#8a7034;    --k-visor:#d0702e;  /* 鍍金面罩 */

  /* —— 不隨光線變化的顏色 —— */
  --coral:#ff7a5c; --mustard:#f5b83d; --teal:#2bb3a3; --indigo:#5266e0; --lilac:#b48cff;
  --win:#ffd98a; --win-glow:#ffcf73; --beacon:#ff3b30; --ok:#3ddc84; --led:#ff74d4;
  --sun:#ffffff; --plume:#bfe2ff; --flash:#fffbe8; --laser:#6dff8e;
  --earth-ocean:#2c6cc4; --earth-deep:#1d4f9c; --earth-land:#5ea96b; --earth-desert:#d8b26a;
  --earth-ice:#f3f7fc; --earth-cloud:#ffffff; --earth-night:#06091a; --city:#ffd27a;
  --atmo:#8fd2ff; --aurora:#5dff9c; --aurora2:#ff6b8a; --ring:#ff6a3a;
  --say-bg:#ffffff; --say-fg:#1c2033; --radio:#2bb3a3;

  /* —— 頁面介面（淺色） —— */
  --page-bg:#f3f2ee; --page-fg:#23252e; --page-muted:#666a76;
  --ui-surface:#ffffff; --ui-line:#d9d7d0; --ui-accent:#3b4cc0; --ui-accent-2:#e2583c;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:14px;overflow:hidden;background:#05060b;line-height:0;box-shadow:0 6px 24px rgba(20,20,40,.18)}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:var(--ui-surface);border:1.5px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--page-fg);border-color:var(--page-fg);color:var(--ui-surface);font-weight:700}
.panel button.big{background:var(--ui-accent-2);border-color:var(--ui-accent-2);color:#fff;font-weight:700}
.panel button.big.alt{background:var(--ui-accent);border-color:var(--ui-accent)}
.panel button.big.on{background:var(--page-fg);border-color:var(--page-fg)}
.panel button:disabled{opacity:.5;cursor:default}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
/* 畫面內可點物件：滑鼠點不顯示外框，用鍵盤 Tab 時才顯示 */
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid var(--ui-accent);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 var(--font-ui);color:var(--page-fg);min-width:6.4em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .say text{fill:var(--say-fg);font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .count text{fill:#fff;font:900 54px var(--font-ui);text-anchor:middle;dominant-baseline:central}
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：黑色天空 → 星星與銀河 → 太陽 → 軌道站 → 地球
       → 遠山（馬拉珀特山一帶）→ 環形山邊緣 → 月塵輝光
       → 月面（遠、中、近三層）→ 永久陰影坑與探冰機器人 → 車轍腳印 → 影子
       → 基地（太陽能塔、居住艙、溫室、登月艙、天線）
       → 角色（太空人、月球車、小機器人、科學儀器，依遠近排序）
       → 特效（塵土、撞擊閃光、對話）→ 太陽風暴粒子 → 閃光
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="極簡幾何風格的月球南極：黑色天空掛滿星星，藍色的地球貼著環形山邊緣升起，太陽低低地照著，影子拉得很長；左邊是蓋著月壤沙包的居住艙、高高的太陽能塔和發著粉紫光的溫室，中間停著登月艙和指向地球的天線，前景有穿白色太空衣的太空人在低重力下跳著走、採集岩石，一輛月球車停在旁邊，右邊是永遠照不到太陽的漆黑陰影坑">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-top)"/>
        <stop offset="1" style="stop-color:var(--sky-low)"/>
      </linearGradient>
      <radialGradient id="glare">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".75"/>
        <stop offset=".12" stop-color="#fff8e6" stop-opacity=".35"/>
        <stop offset=".45" stop-color="#fff2d6" stop-opacity=".08"/>
        <stop offset="1" stop-color="#fff2d6" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="earthShade" cx=".38" cy=".35" r=".75">
        <stop offset="0" style="stop-color:var(--earth-ocean)"/>
        <stop offset="1" style="stop-color:var(--earth-deep)"/>
      </radialGradient>
      <radialGradient id="ringGlow">
        <stop offset=".78" stop-color="#ff6a3a" stop-opacity="0"/>
        <stop offset=".86" stop-color="#ff7a3a" stop-opacity=".9"/>
        <stop offset=".9" stop-color="#ffb060" stop-opacity=".6"/>
        <stop offset="1" stop-color="#ff6a3a" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="plumeGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
        <stop offset=".25" style="stop-color:var(--plume)" stop-opacity=".55"/>
        <stop offset="1" style="stop-color:var(--plume)" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fff4c8" stop-opacity=".75"/>
        <stop offset="1" stop-color="#fff4c8" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="floodGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffe9b0" stop-opacity=".5"/>
        <stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="glowGrad" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#fff3d8" stop-opacity=".55"/>
        <stop offset="1" stop-color="#fff3d8" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="glowRad">
        <stop offset="0" stop-color="#fff3d8" stop-opacity=".6"/>
        <stop offset=".5" stop-color="#fff3d8" stop-opacity=".18"/>
        <stop offset="1" stop-color="#fff3d8" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="ledGrad">
        <stop offset="0" style="stop-color:var(--led)" stop-opacity=".8"/>
        <stop offset="1" style="stop-color:var(--led)" stop-opacity="0"/>
      </radialGradient>
      <clipPath id="earthClip"><circle r="58"/></clipPath>
      <clipPath id="earthDarkClip"><path id="earthDarkClipPath"/></clipPath>
      <clipPath id="pitClip"><ellipse cx="1310" cy="361" rx="240" ry="27"/></clipPath>
      <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    </defs>

    <!-- ===== 【場景】天空：星星、銀河、太陽、軌道站 ===== -->
    <rect id="sky" class="clickable" x="0" y="0" width="1600" height="600" fill="url(#skyGrad)"/>
    <g id="milky" class="noHit"></g>
    <g id="stars" class="noHit"></g>
    <g id="sun" class="clickable" tabindex="0" role="button" aria-label="太陽：切換到月夜"></g>
    <g id="orbiter" class="noHit"></g>

    <!-- ===== 【場景】地球（自轉、地相、城市燈、極光、日食紅環） ===== -->
    <g id="earth" class="clickable" tabindex="0" role="button" aria-label="地球：太空人拍下地球的照片"></g>

    <!-- ===== 【場景】遠山、環形山邊緣、月塵輝光 ===== -->
    <g id="mtFar" class="noHit"></g>
    <g id="rim" class="noHit"></g>
    <g id="dustGlow" class="noHit" opacity="0"></g>

    <!-- ===== 【場景】月面：三層地面、隕石坑、石頭、永久陰影坑 ===== -->
    <g id="ground"></g>
    <g id="pit" class="clickable" tabindex="0" role="button" aria-label="永久陰影坑：探冰機器人尋找水冰"></g>
    <g id="tracks" class="noHit"></g>
    <g id="shadows" class="noHit"></g>

    <!-- ===== 【場景】基地 ===== -->
    <g id="floods" class="noHit"></g>
    <g id="towers" class="clickable" tabindex="0" role="button" aria-label="太陽能塔：顯示發電量"></g>
    <g id="habitat" class="clickable" tabindex="0" role="button" aria-label="居住艙：氣閘艙開門"></g>
    <g id="greenhouse" class="clickable" tabindex="0" role="button" aria-label="月面溫室：蔬菜長大"></g>
    <g id="lander" class="clickable" tabindex="0" role="button" aria-label="登月艙：排放蒸氣、閃燈"></g>
    <g id="dish" class="clickable" tabindex="0" role="button" aria-label="天線：傳訊息回地球"></g>
    <g id="fxBack" class="noHit"></g>

    <!-- ===== 【角色】太空人、月球車、小機器人、科學儀器（依遠近排序） ===== -->
    <g id="actors"></g>

    <!-- ===== 【動畫】塵土、撞擊閃光、對話泡泡、太陽風暴、閃光 ===== -->
    <g id="fx" class="noHit"></g>
    <g id="storm" class="noHit" opacity="0"></g>
    <rect id="flash" class="noHit" x="0" y="0" width="1600" height="600" fill="var(--flash)" opacity="0"/>
    <g id="says" class="noHit"></g>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {

  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;

      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };

    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {

      if (!m || !m.show) continue;

  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';

    }
    const cl = svg.cloneNode(true);

    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }

  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;

    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }

      requestAnimationFrame(wait);

  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}

    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();

            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();

<script>
/* =========================================================
   SC-85 月球南極的地球升起｜程式區
   區塊：①工具與色票
         ②場景（星空、太陽、地球、遠山、環形山邊緣、月面、陰影坑、基地）
         ③角色（太空人、月球車、小機器人、探冰機器人、科學儀器、軌道站）
         ④動畫（月球日與光線、地球、影子、太空天氣、登月艙升空、地球日食、主迴圈）
         ⑤互動（點擊、滑鼠、聲音、控制列）

(() => {
'use strict';

/* ---------------- ① 工具與色票 ---------------- */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const root = document.documentElement;
const svg = $('scene');

const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const RAD = Math.PI / 180;

  const mw = $('milky');

const CITY = [[2, 49], [-0, 51], [13, 52], [9, 45], [-4, 40], [37, 56], [30, 50], [21, 52], [31, 30], [3, 6], [28, -26], [51, 25], [55, 25], [46, 24],

function project(lon, lat) {
  const l = (lon - E.rot) * RAD, p = lat * RAD;
  const cz = Math.cos(p) * Math.cos(l);
  return { x: E.r * Math.cos(p) * Math.sin(l), y: -E.r * Math.sin(p), z: cz, cl: Math.cos(l), cp: Math.cos(p) };
}
function updateEarthSurface() {
  LAND.forEach(L => {
    const P = project(L[0], L[1]);
    if (P.z < -.05) { L.el.setAttribute('opacity', 0); return; }
    const rx = E.r * L[2] / 2 * RAD * Math.max(.08, P.cl), ry = E.r * L[3] / 2 * RAD * Math.max(.2, P.cp);
    L.el.setAttribute('cx', f1(P.x)); L.el.setAttribute('cy', f1(P.y)); L.el.setAttribute('rx', f1(rx)); L.el.setAttribute('ry', f1(ry));
    L.el.setAttribute('opacity', f1(smooth(-.05, .2, P.z)));
  });
  CLOUD.forEach(c => {
    const P = project(c.lon + c.off, c.lat);
    if (P.z < 0) { c.el.setAttribute('opacity', 0); return; }
    const w = E.r * c.w * RAD * Math.max(.08, P.cl), h = E.r * c.h * RAD;
    c.el.setAttribute('x', f1(P.x - w / 2)); c.el.setAttribute('y', f1(P.y - h / 2)); c.el.setAttribute('width', f1(w)); c.el.setAttribute('height', f1(h)); c.el.setAttribute('rx', f1(h / 2));
    c.el.setAttribute('opacity', f1(.85 * smooth(0, .25, P.z)));
  });
  CITY.forEach(c => {
    const P = project(c[0], c[1]);
    c.el.setAttribute('cx', f1(P.x)); c.el.setAttribute('cy', f1(P.y));
    c.el.setAttribute('opacity', P.z > .05 ? f1(.95 * (1 - E.occ * .1)) : 0);
  });
}
/* 地相：k＝亮面比例（0 新地球、1 滿地球），th＝亮面朝向的角度 */
function updateEarthPhase() {
  const r = E.r, xt = r * (1 - 2 * E.k);         // 晨昏線在赤道上的位置
  let d;
  if (E.k > .995) d = 'M0,0';
  else {
    const sweep2 = xt > 0 ? 0 : 1;
    d = `M0,${-r - 1}A${r + 1},${r + 1} 0 0 0 0,${r + 1}A${f1(Math.abs(xt) + .01)},${r + 1} 0 0 ${sweep2} 0,${-r - 1}Z`;
  }
  const tr = `rotate(${f1(E.th / RAD)})`;
  darkPath.setAttribute('d', d); darkPath.setAttribute('transform', tr);
  darkClipPath.setAttribute('d', d); darkClipPath.setAttribute('transform', tr);
  darkPath.setAttribute('opacity', f1(.9 - E.occ * .05));
}

/* 低重力的走法：太空衣很硬，大家用「袋鼠跳」往前蹦，每一步都在空中飄一下才落地 */
function lopePose(a, extra = {}) {
  const s = Math.sin(a.ph);
  astroPose(a, Object.assign({ la: -24 * s - 6, lb: 24 * s - 6, aa: -16 + 10 * s, ab: -10 - 10 * s, bob: 0, lean: 9 }, extra));
}
function idlePose(a, t, extra = {}) {
  astroPose(a, Object.assign({ la: -3, lb: 3, aa: -6 + Math.sin(t * 1.3 + a.x) * 2, ab: 4, bob: Math.sin(t * 1.6 + a.x) * .4, lean: 0 }, extra));
}
// 往目標點袋鼠跳；回傳是否抵達
function hopTo(a, tx, ty, speed, dt) {
  const dx = tx - a.x, dy = ty - a.y, d = Math.hypot(dx, dy * 1.4);
  if (d < 3 && a.air < .5) { a.air = 0; a.vy = 0; return true; }
  if (Math.abs(dx) > 2) a.dir = dx > 0 ? 1 : -1;
  // 每一步：離地跳起，月球重力慢慢拉回來
  if (a.air <= 0 && a.vy <= 0) { a.vy = 46; a.air = .01; footprint(a); }
  a.vy -= GM * dt * 1.0; a.air = Math.max(0, a.air + a.vy * dt);
  if (a.air <= 0) a.vy = 0;
  const v = speed * a.s;
  const m = Math.min(1, v * dt / Math.max(d, .01));
  a.x += dx * m; a.y += dy * m;
  a.ph = (a.air > 0) ? Math.PI / 2 * clamp(a.vy / 46, -1, 1) : 0;
  lopePose(a, { lean: 10 });
  return false;
}

/* ---------------- ④ 動畫：月球日與光線 ----------------
   T.t：0～1 是一個朔望月（約 29.5 地球日）。
   太陽方位角 az：t=0.5 時太陽在地球的方向（新地球），t=0 時在背後（滿地球）。
   太陽高度只有幾度：南極的太陽貼著地平線繞圈，低於山脊就是月夜。 */
const T = { t: .30, auto: true, len: 150, dragging: false, ff: null };
const LIGHT = { dl: 1, tw: 0, az: 72, e: 1.6, sx: 0, sy: 0, side: 1, shx: -1, shy: 0, len: 2 };
let lastKey = '';
const isNight = () => LIGHT.dl < .4;
function sunNormal(t) {
  let az = 180 - 360 * t; az = ((az + 180) % 360 + 360) % 360 - 180;
  const e = .6 + 2.2 * Math.cos(2 * Math.PI * (t - .5));

}
function earthPos(t) {

}
function applyTime(force) {

  E.x = P.x; E.y = P.y;
  let sx = S.x, sy = S.y, az = S.az, e = S.e;
  // 地球日食：太陽沿著直線慢慢滑到地球正後方
  if (show.kind === 'eclipse' && show.u != null) {
    const u = show.u, b = smooth(0, .28, u) * (1 - smooth(.72, 1, u));
    sx = lerp(S.x, E.x + (1 - 2 * u) * 100, b); sy = lerp(S.y, E.y, b);
    e = Math.max(e, 2);
  }
  LIGHT.sx = sx; LIGHT.sy = sy; LIGHT.az = az; LIGHT.e = e;
  // 被地球遮住多少（0 沒遮、1 全遮）
  const dE = Math.hypot(sx - E.x, sy - E.y);
  E.occ = 1 - smooth(E.r - 11, E.r + 11, dE);
  let dl = smooth(-.4, .5, e) * (1 - E.occ * .88);
  const tw = E.occ;
  LIGHT.dl = dl; LIGHT.tw = tw;
  LIGHT.side = Math.sin(az * RAD) >= 0 ? 1 : -1;
  // 影子方向：背著太陽。太陽很低，影子很長
  LIGHT.shx = -Math.sin(az * RAD); LIGHT.shy = Math.cos(az * RAD) * .18;
  LIGHT.len = clamp(1.3 / Math.tan(Math.max(.5, e) * RAD) * .06, 1.3, 2.6);
  const key = `${dl.toFixed(3)}|${tw.toFixed(3)}|${LIGHT.side}`;
  if (force || key !== lastKey) {
    lastKey = key;
    let s = '';
    for (const k in PAIRS) {
      const p = PAIRS[k];
      let c = mix(p.n, p.d, dl);
      if (p.k) c = mix(c, p.k, tw * .9);
      s += `--${k}:${rgba(c)};`;
    }
    // 亮面跟著太陽：太陽在右邊時，山的右側面是亮的
    const L = LIGHT.side > 0 ? 'shade' : 'lit', R = LIGHT.side > 0 ? 'lit' : 'shade';
    s += `--facetL:var(--mt-${L});--facetR:var(--mt-${R});--rockL:var(--rock-${L});--rockR:var(--rock-${R});`;
    root.setAttribute('style', s);

  $('sun').setAttribute('opacity', f1(vis));
  sunGlare.setAttribute('opacity', f1(1 - E.occ));
  sunFlare.setAttribute('opacity', f1(.45 * (1 - E.occ)));
  // 地相：太陽和地球在天上的夾角 ε → 亮面比例 k＝(1－cos ε)/2
  const eps = Math.acos(clamp(Math.cos(az * RAD) * Math.cos((e - 3) * RAD), -1, 1));
  E.k = (1 - Math.cos(eps)) / 2;
  if (E.occ > 0) E.k = Math.min(E.k, .02 * (1 - E.occ));
  E.th = Math.atan2((sy - E.y) / 260, Math.sin(az * RAD));
  $('earth').setAttribute('transform', `translate(${f1(E.x)},${f1(E.y)})`);
  ringEl.setAttribute('opacity', f1(smooth(.55, 1, E.occ)));
  // 鑽石環：剛好要全遮（或剛要露出來）時，地球邊緣亮一下
  const dm = smooth(.35, .8, E.occ) * (1 - smooth(.85, .99, E.occ));
  if (dm > .01) {
    const ang = Math.atan2(sy - E.y, sx - E.x);
    diamond.setAttribute('transform', `translate(${f1(Math.cos(ang) * E.r)},${f1(Math.sin(ang) * E.r)})`);
  }
  diamond.setAttribute('opacity', f1(dm));
  atmoEl.setAttribute('opacity', f1(.55 * (1 - E.occ)));
  earthHalo.setAttribute('opacity', f1(.12 * (1 - E.occ)));
  updateEarthPhase();
  // 星星：白天被強光蓋過，月夜或日食時滿天星
  $('stars').setAttribute('opacity', f1(.3 + .7 * (1 - dl)));
  $('milky').setAttribute('opacity', f1(.15 + .85 * (1 - dl)));
  // 時鐘：第幾天
  const day = Math.floor(t * 29.5) + 1;
  $('clock').textContent = `${dl > .35 ? '月晝' : '月夜'}・第 ${day} 天`;
  if (!T.dragging) $('timeRange').value = Math.round(t * 1000);
}
// 光線改變時才需要更新的東西：影子、隕石坑內的陰影、太陽能板轉向、燈
function updateStatic() {
  const L = LIGHT;
  craters.forEach(c => { c.sh.setAttribute('cx', f1(c.x + L.side * c.r * .42)); c.sh.setAttribute('opacity', f1(.38 * L.dl)); });

  const ca = Math.cos(L.az * RAD), w = Math.max(.14, Math.abs(ca));

    p.g.setAttribute('transform', `translate(${t.x},0) scale(${f1(w)},1)`);

/* 影子：從物體腳下往太陽的反方向拉長的四邊形 */
const staticShadows = [];

/* ---------------- ④ 動畫：太空天氣（平靜、流星體、太陽風暴、月塵輝光） ---------------- */
const WX = { list: [['calm', '平靜'], ['meteor', '流星體'], ['storm', '太陽風暴'], ['glow', '月塵輝光']], idx: 0, storm: 0, glow: 0, meteorT: 2, motes: [], streaks: [], alarmT: 0 };

function setWeather(i) {

  const k = WX.list[i][0];

/* 登月艙升空：倒數 → 點火升空（引擎噴焰很淡，月塵被吹成一片片直線往外噴）

function updateLaunch(dt) {

  for (let n = 5; n >= 1; n--) if (show.step === 7 - n && s > 3 + (5 - n) * 1) { show.step++; countdown(n); }

/* 登月艙升空配樂（約 21 秒，原創）：倒數時心跳般的低音脈動，點火後銅管般的主旋律 */

  duckMusic(24);
  const o = bus('music', 22), t0 = actx.currentTime + .05, b = .5;   // 每分鐘 120 拍

  for (let i = 0; i < 16; i++) { const t = t0 + .3 + i * b; synth(t, HZ(i % 4 === 3 ? 'G2' : 'C2'), .3, .07, o, 'sawtooth', 500); }

  for (let i = 0; i < 5; i++) beep(t0 + 3 + i, 1000, .12, .1, o);
  // 8 秒：點火的大和弦＋定音鼓
  const T8 = t0 + 8;
  timp(T8, 65, .5, o); timp(T8 + .25, 65, .3, o);
  const prog = [['C3', 'E3', 'G3', 'C4'], ['D3', 'F#3', 'A3', 'D4'], ['E3', 'G3', 'B3', 'E4'], ['A2', 'E3', 'A3', 'C4'], ['F2', 'C3', 'F3', 'A3'], ['G2', 'D3', 'G3', 'B3'], ['C3', 'G3', 'C4', 'E4']];

  tr.addEventListener('change', () => { T.dragging = false; });
  window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
  window.addEventListener('pointerdown', () => document.body.classList.remove('kbd'));
  mq.addEventListener && mq.addEventListener('change', e => { reduced = e.matches; if (reduced) { T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false'); } });
}
// 無線電訊號：一個小光點沿直線飛過去（光速，月地單程約 1.3 秒）
const pulses = [];
function pulse(x0, y0, x1, y1, dur, then) {
  const g = el('g', {}, $('fx'));
  for (let i = 0; i < 3; i++) el('circle', { r: 3 - i * .7, fill: V('mustard'), opacity: 1 - i * .3 }, g);
  pulses.push({ g, x0, y0, x1, y1, dur, t: 0, then });
}
function laser() {
  SCI.laser = 0;
}
const SHAKE = { t: 0 };
function updatePulses(dt) {
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i]; p.t += dt;
    const k = clamp(p.t / p.dur, 0, 1);
    [...p.g.children].forEach((c, j) => { const kk = clamp(k - j * .04, 0, 1); c.setAttribute('cx', f1(lerp(p.x0, p.x1, kk))); c.setAttribute('cy', f1(lerp(p.y0, p.y1, kk))); });
    if (k >= 1) { p.g.remove(); pulses.splice(i, 1); p.then && p.then(); }
  }
  radioBusy = Math.max(0, radioBusy - dt);
  E.ping = Math.max(0, E.ping - dt * 1.5);
  atmoEl.setAttribute('stroke-width', f1(2.5 + E.ping * 4));
  // 雷射測距：地球上的天文台發射 → 1.25 秒後反射器亮 → 再 1.25 秒回到地球
  if (SCI.laser != null) {
    SCI.laser += dt; const s = SCI.laser;
    SCI.reflFlash.setAttribute('opacity', f1(s > 1.2 && s < 1.6 ? .9 : 0));
    E.ping = Math.max(E.ping, (s < .25 || (s > 2.45 && s < 2.8)) ? .8 : 0);
    if (s > 3) SCI.laser = null;
  }
}

/* ---------------- ④ 動畫：主迴圈 ---------------- */
let clockT = 0, sortT = 0, earthT = 0;
const sortList = [];
function step(dt) {
  clockT += dt;
  const t = clockT, mv = reduced ? 0 : 1;
  // 時間
  if (T.ff) {
    T.ff.t += dt;
    const k = smooth(0, 1, T.ff.t / T.ff.dur);
    T.t = T.ff.from + T.ff.dist * k;
    if (T.ff.t >= T.ff.dur) { const fn = T.ff.then; T.ff = null; fn && fn(); }
  } else if (T.auto && !show.kind && !reduced && !T.dragging) T.t = (T.t + dt / T.len) % 1;
  updateEclipse(dt);
  applyTime(false);
  // 地球自轉（為了看得出來，放慢成約 40 秒一圈）
  E.rot = (E.rot + dt * 9 * mv) % 360;
  CLOUD.forEach(c => c.off = ((c.off || 0) + dt * c.sp * mv));
  earthT -= dt;
  if (earthT < 0) { earthT = .08; updateEarthSurface(); }
  updateWeather(dt);
  updateFx(dt);
  updatePulses(dt);
  // 天線一直對準地球
  DISH.g.setAttribute('transform', `translate(${DISH.x},${DISH.y}) rotate(${f1(Math.atan2(E.y - DISH.y, E.x - DISH.x) / RAD)})`);
  updateLaunch(dt);
  updateLander(dt, t);
  updateHab(dt);
  updateGH(dt, t);
  updateTowers(t);
  updateSeismo(dt, t);
  updatePit(dt, t);
  if (mv) updateOrbiter(dt, t);
  updateRover(dt, t);
  updateBot(dt, t);
  updateA(A, dt, t); updateB(B, dt, t); updateC(C, dt, t); updateD(D, dt, t); updatePh(Ph, dt, t);
  // 夜裡太空人打開頭燈
  const lampOn = isNight() || E.occ > .6 ? 1 : 0;
  astros.forEach(a => { placeAstro(a); a.lamp.setAttribute('opacity', lampOn); a.shadow.x = a.x; a.shadow.y = a.y; a.shadow.h = a.shown ? 66 * a.s : 0; a.shadow.w = 20 * a.s; drawShadow(a.shadow); });
  // 月震：畫面輕輕搖
  if (SHAKE.t > 0) { SHAKE.t -= dt; const k = SHAKE.t; svg.style.transform = `translate(${f1(Math.sin(t * 60) * k * 1.6)}px,${f1(Math.cos(t * 47) * k)}px)`; if (SHAKE.t <= 0) svg.style.transform = ''; }
  // 依照遠近排序（每 0.3 秒一次），近的蓋住遠的
  sortT -= dt;
  if (sortT < 0) { sortT = .3; sortList.slice().sort((a, b) => a.y - b.y).forEach(a => $('actors').appendChild(a.g)); }
}
let last = 0;
function loop(ts) {
  const dt = Math.min(.1, (ts - last) / 1000 || 0);
  if (dt >= 1 / 45 || !last) { last = ts; step(dt); }
  requestAnimationFrame(loop);
}

/* ---------------- 初始化 ---------------- */
function init() {
  drawSky();
  drawSun();
  makeOrbiter();
  drawEarth();
  drawMountains();
  drawGround();
  drawPit();
  drawFloods();
  drawTower(70, 420, 200);
  drawTower(612, 424, 186);
  drawHabitat();
  drawGreenhouse();
  drawLander();
  drawDish();
  LANDER.flare = el('ellipse', { cx: 760, cy: 430, rx: 80, ry: 7, fill: V('plume'), opacity: 0 }, $('fxBack'));
  // 靜態物體的影子
  const sh = $('shadows');
  [[70, 420, 22, 200], [612, 424, 22, 186], [291, 418, 250, 70], [520, 418, 70, 36], [908, 422, 24, 80]].forEach(([x, y, w, h]) => staticShadows.push(makeShadow(x, y, w, h, sh)));
  rocks.filter(r => r.h > 8).forEach(r => staticShadows.push(makeShadow(r.x, r.y, r.w * .8, r.h, sh)));
  LANDER.shadow = makeShadow(760, 432, 64, 160, sh);
  // 科學儀器
  const refl = makeReflector($('actors')); SCI.rx = 1300; SCI.ry = 506; refl.setAttribute('transform', 'translate(1300,506)');
  const seis = makeSeismo($('actors')); SCI.sx = 1410; SCI.sy = 516; seis.setAttribute('transform', 'translate(1410,516)');
  sortList.push({ g: refl, y: 506 }, { g: seis, y: 516 });
  // 月球車、小機器人
  makeRover($('actors')); ROVER.shadow = makeShadow(ROVER.x, ROVER.y, 100, 40, sh); sortList.push(ROVER);
  makeBot($('actors')); BOT.shadow = makeShadow(BOT.x, BOT.y, 30, 40, sh); sortList.push(BOT);
  // 太空人：指揮官（珊瑚）、地質學家（青綠）、物理示範（芥末黃）、跳跳隊員（靛藍）、攝影師（紫）
  A = addAstro({ x: 520, y: 440, stripe: 'coral', name: 'A' });
  B = addAstro({ x: 260, y: 548, stripe: 'teal', tool: 'tongs', name: 'B' });
  C = addAstro({ x: 640, y: 566, stripe: 'mustard', name: 'C' });
  D = addAstro({ x: 1200, y: 572, stripe: 'indigo', name: 'D' });
  Ph = addAstro({ x: 990, y: 446, stripe: 'lilac', tool: 'camera', name: 'Ph' });
  Ph.dir = 1;
  astros.forEach(a => sortList.push(a));
  bindAll();
  if (reduced) { T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false'); }
  buildWeather();
  setWeather(0);
  applyTime(true);
  updateEarthSurface();
  step(1 / 30);
  requestAnimationFrame(loop);
  // 網站「作者精選」播放區：預設輪播「地球日食」（使用者指定）；不會自己出聲，打開配樂後每一輪都配上音樂
  if (inPicks) {
    let idle = 0;
    const next = () => {
      if (show.kind || T.ff) return;
      const from = T.t % 1;
      // 時間倒回日食前（太陽慢慢退回地球右邊），再開演
      T.auto = false;
      T.ff = { from, dist: .47 - from, t: 0, dur: 3, then: () => startEclipse() };
    };
    setTimeout(() => startEclipse(), 800);
    setInterval(() => { if (!show.kind && !T.ff) { idle += 1; if (idle >= 4) { idle = 0; next(); } } else idle = 0; }, 1000);
    window.sceneMusic = {
      playing: false,
      start(c) {
        if (this.playing) return; this.playing = true; pickAudio = true; userGesture = true;
        if (c && c !== actx) useCtx(c); else ensureAudio();
        if (actx && actx.state !== 'running') actx.resume();
        if (show.kind === 'eclipse' && show.s >= 0 && show.s < 3) playEclipseMusic();
      },
      stop() { this.playing = false; pickAudio = false; stopAll(); },
      duck() {}
    };
  }
}
init();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.kind,
  btn: { launch: 'btnLaunch', eclipse: 'btnEclipse' },
  save: () => ({ t: T.t, auto: T.auto, w: WX.idx }),
  stop: () => {
    const k = show.kind;
    T.ff = null;
    endShow();
    if (k === 'launch') {
      // 登月艙回到地面、組員回到艙外
      Object.assign(LANDER, { thrust: 0, alt: 0, tilt: 0, dx: 0, squash: 0 });
      A.shown = 1; A.x = 742; A.y = 440; A.mode = 'wave'; A.t = 1.2;
    }
  },
  restore: s => { if (WX.idx !== s.w) setWeather(s.w); T.t = s.t; T.auto = s.auto; $('btnAuto').setAttribute('aria-pressed', String(T.auto)); applyTime(true); }
});
/* /ShowStop */
})();
</script>
