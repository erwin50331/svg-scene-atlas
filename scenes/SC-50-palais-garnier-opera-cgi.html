<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>巴黎歌劇院</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-50 巴黎歌劇院（加尼葉宮）內部｜CGI 電影質感
   地點：法國巴黎第九區，加尼葉宮（Palais Garnier，1875 年落成）。
   兩個空間，用鏡頭橫移切換：
   ① 大階梯（Grand Escalier）：白色大理石的中央階梯往上到平台，平台上的觀眾廳入口兩側是兩尊女像柱，
      從平台再分成左右兩道側梯通往一樓迴廊；欄杆是紅色古大理石欄柱配綠色大理石扶手；
      階梯底部兩側是手舉一束燈的青銅女像燈台；上方是一層層彩色大理石雙柱拱廊與陽台，
      天頂是伊西多爾・皮爾斯（Isidore Pils）的天頂畫，金色邊框與吊燈。
   ② 觀眾廳（Salle de spectacle）：紅色與金色的馬蹄形觀眾廳，五層包廂，
      1964 年夏卡爾（Marc Chagall）畫的天頂——五大色區（藍、綠、白、紅、黃）
      各畫兩位作曲家的作品，內圈四位，畫裡藏著艾菲爾鐵塔、凱旋門與歌劇院本身；
      天頂中央垂下約 7 噸重的青銅水晶大吊燈；舞台口上方的「ANNO 1669」
      （路易十四創立皇家音樂學院的年份）；畫出來的紅色大幕（金色流蘇是畫上去的錯視畫）；
      第 5 號包廂（傳說留給歌劇院幽靈的包廂，門口有名牌）；樂池、指揮、紅絲絨座椅。
   日夜循環（室內版）：深夜只剩舞台上的「幽靈燈」與夜間巡守員的手電筒；
      早上清潔人員打掃；白天是參觀的遊客與導覽；傍晚觀眾盛裝入場；晚上演出；散場後熄燈。
   風格重點：CGI 電影質感——吊燈的體積光與光暈、橫向變形光斑、空氣中飄浮的微塵、
      青橙電影調色、暗角、底片顆粒；表演時上下出現寬銀幕黑邊、鏡頭緩緩推近。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票：--d-名稱（白天參觀，燈全開、偏中性）／--n-名稱（深夜熄燈），
   部分另有 --k-名稱（晚場演出，暖金色）。JS 會依時間內插，輸出成 --名稱，
   並自動產生 .f-名稱（填色）、.s-名稱（描邊）兩種 class。
   ========================================================= */
:root{
  color-scheme: dark;

  /* —— 大階梯：牆面、大理石、彩色大理石、鍍金、青銅 —— */
  --d-wall:#d9c4a0;     --k-wall:#e2b878;     --n-wall:#1e1a24;
  --d-wall-dk:#b49c78;  --k-wall-dk:#b88a52;  --n-wall-dk:#14111a;
  --d-deep:#4a3a30;     --k-deep:#5a3a22;     --n-deep:#07060a;
  --d-deep-lt:#7a6048;  --k-deep-lt:#94643a;  --n-deep-lt:#100d14;
  --d-marble:#efe8dc;   --k-marble:#f8dcae;   --n-marble:#3a3846;
  --d-marble-hi:#fffaf0;--k-marble-hi:#fff0cc;--n-marble-hi:#545264;
  --d-marble-dk:#c8bca8;--k-marble-dk:#d2a874;--n-marble-dk:#262430;
  --d-marble-sh:#8e8272;--k-marble-sh:#8a6446;--n-marble-sh:#121018;
  --d-onyx-r:#9e3a30;   --k-onyx-r:#ac4228;   --n-onyx-r:#26100f;   /* 紅色古大理石 */
  --d-onyx-rd:#6a2420;  --k-onyx-rd:#702a18;  --n-onyx-rd:#14080a;
  --d-onyx-g:#6e9478;   --k-onyx-g:#8e965e;   --n-onyx-g:#141c18;   /* 綠色大理石 */
  --d-onyx-gd:#3e5a48;  --k-onyx-gd:#4e5432;  --n-onyx-gd:#0a0f0c;
  --d-gilt:#c9a048;     --k-gilt:#f0bc4e;     --n-gilt:#3e321c;
  --d-gilt-hi:#f6dc8e;  --k-gilt-hi:#ffe49a;  --n-gilt-hi:#62522e;
  --d-gilt-dk:#806226;  --k-gilt-dk:#946620;  --n-gilt-dk:#1e180e;
  --d-bronze:#6a5434;   --k-bronze:#7a5a30;   --n-bronze:#1a140e;
  --d-bronze-hi:#d2b47a;--k-bronze-hi:#f0c070;--n-bronze-hi:#3e3220;
  --d-door:#3a2418;     --k-door:#4a2a16;     --n-door:#0a0608;
  --d-floor-a:#d8cdb8;  --k-floor-a:#e0b886;  --n-floor-a:#24222c;
  --d-floor-b:#8a5a46;  --k-floor-b:#8e4e30;  --n-floor-b:#140e10;
  --d-fresco:#8eaccb;   --k-fresco:#c6a07a;   --n-fresco:#161c2c;   /* 皮爾斯天頂畫的天空 */
  --d-fresco-lt:#e8e2d2;--k-fresco-lt:#f2d2a2;--n-fresco-lt:#2a2c3a;
  --d-fresco-fig:#c88c6c;--k-fresco-fig:#d08a58;--n-fresco-fig:#2a1e22;
  --d-fresco-fig2:#6a7aa4;--k-fresco-fig2:#8a6a72;--n-fresco-fig2:#181a2a;

  /* —— 觀眾廳：紅絲絨、大幕、座椅、舞台 —— */
  --d-velvet:#9e1e26;   --k-velvet:#b42426;   --n-velvet:#1e0608;
  --d-velvet-dk:#5a0e14;--k-velvet-dk:#661010;--n-velvet-dk:#0c0204;
  --d-velvet-hi:#d24a4a;--k-velvet-hi:#e6584a;--n-velvet-hi:#3a0e12;
  --d-curtain:#a81a24;  --k-curtain:#b81e22;  --n-curtain:#220608;
  --d-curtain-dk:#5e0a12;--k-curtain-dk:#68100e;--n-curtain-dk:#0e0204;
  --d-curtain-hi:#e24a48;--k-curtain-hi:#f25e46;--n-curtain-hi:#40100e;
  --d-hall:#3a1418;     --k-hall:#4a1a14;     --n-hall:#08040a;   /* 包廂內部 */
  --d-pit:#1c1416;      --n-pit:#060406;
  --d-stage:#5a5a66;    --n-stage:#16161c;
  --d-stage-sky:#2c4a7a;--n-stage-sky:#0e1426;   /* 舞台佈景：月夜湖畔 */
  --d-stage-sky2:#7aa0c8;--n-stage-sky2:#1e2a40;
  --d-stage-tree:#1e3440;--n-stage-tree:#0a1218;
  --d-wing:#16141a;     --n-wing:#06050a;

  /* —— 夏卡爾天頂：五大色區＋內圈 —— */
  --d-cg-blue:#2a5cb4;  --k-cg-blue:#3a5ca8;  --n-cg-blue:#0c1630;
  --d-cg-green:#3e9a58; --k-cg-green:#5a9a48; --n-cg-green:#0c2214;
  --d-cg-white:#f2ece0; --k-cg-white:#f6dcb2; --n-cg-white:#2a2a30;
  --d-cg-red:#d23c2c;   --k-cg-red:#e04a28;   --n-cg-red:#300c0a;
  --d-cg-yellow:#f0c83a;--k-cg-yellow:#f8c43a;--n-cg-yellow:#3a2e0e;
  --d-cg-inner:#e8a8b4; --k-cg-inner:#f0a888; --n-cg-inner:#2e1a20;
  --d-cg-inner2:#7ab8d8;--k-cg-inner2:#90b0b0;--n-cg-inner2:#122630;
  --d-cg-ink:#2a2440;   --n-cg-ink:#08060c;

  /* —— 人物 —— */
  --d-skin-1:#f0c8a8;   --n-skin-1:#4a3a3c;
  --d-skin-2:#c08a64;   --n-skin-2:#3a2c2c;
  --d-skin-3:#7a5238;   --n-skin-3:#241a1c;
  --d-hair:#3a2a20;     --n-hair:#100c0e;
  --d-hair-2:#c89a5a;   --n-hair-2:#2a2218;
  --d-c1:#c8463c; --n-c1:#3a1a1e;   /* 紅 */
  --d-c2:#2f5f8a; --n-c2:#141c2e;   /* 藍 */
  --d-c3:#e6d6b0; --n-c3:#3a3632;   /* 米 */
  --d-c4:#4a7a5a; --n-c4:#18241e;   /* 綠 */
  --d-c5:#e2a23a; --n-c5:#3a2e18;   /* 芥末黃 */
  --d-c6:#6a4a8a; --n-c6:#20182a;   /* 紫 */
  --d-c7:#f2eee6; --n-c7:#4a4a54;   /* 白 */
  --d-c8:#3a3a46; --n-c8:#101014;   /* 深灰 */
  --d-black:#1a181e;    --n-black:#08070a;   /* 西裝、帶位員制服 */
  --d-white:#f6f4ee;    --n-white:#5a5a64;
  --d-gown-1:#a3162a;   --k-gown-1:#b81a22;   --n-gown-1:#2a0810;   /* 晚禮服 */
  --d-gown-2:#1a6a5a;   --k-gown-2:#2a7050;   --n-gown-2:#081a16;
  --d-gown-3:#1e2a6a;   --k-gown-3:#2a2e66;   --n-gown-3:#0a0c22;
  --d-gown-4:#e8d2a2;   --k-gown-4:#f6d290;   --n-gown-4:#3a3226;
  --d-gown-5:#5a2a6e;   --k-gown-5:#6a2a5a;   --n-gown-5:#180a20;
  --d-staff:#4a5a6a;    --n-staff:#141a20;   /* 清潔人員制服 */
  --d-tutu:#f8f6f2;     --n-tutu:#8890a8;    /* 芭蕾舞衣 */
  --d-tights:#f0dcd0;   --n-tights:#7a7488;
  /* 共和衛隊（Garde républicaine）禮服：黑上衣、紅肩章、白馬褲、黑長靴、馬鬃頭盔 */
  --d-gr-tunic:#16161c; --n-gr-tunic:#060608;
  --d-gr-red:#c22a2a;   --n-gr-red:#3a0c0c;
  --d-gr-white:#f4f2ea; --n-gr-white:#4e4e56;
  --d-gr-helm:#c8ccd2;  --k-gr-helm:#f0d8a8;  --n-gr-helm:#3a3c42;
  --d-gr-brass:#d8b050; --n-gr-brass:#4a3a18;

  /* —— 不隨時間變化的顏色（光、燈、特效） —— */
  --lamp:#ffe0a0; --lamp-hot:#fff6dc; --crystal:#ffffff; --spark:#fff4d8;
  --ray:#ffd9a0; --flare:#8fd0ff; --flare-warm:#ffb070;
  --spot:#fff2d6; --spot-blue:#9ec4ff; --ghost:#fff0c8; --torch:#f6fbff;
  --flash:#ffffff; --exit:#3ad07a; --plaque:#e8c060;
  --grade-cool:#0d5a70; --grade-warm:#ff8838; --cine-shade:#000000; --cine-light:#fff1d6;

  /* —— 頁面介面（劇院般的深色） —— */
  --page-bg:#100c0e; --page-fg:#efe4d6; --page-muted:#a8988a;
  --ui-surface:#1c1416; --ui-line:#43303a; --ui-accent:#d8a04a; --ui-hot:#e8d2a2; --ui-hot2:#b8263a;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:6px;overflow:hidden;background:#000;line-height:0;box-shadow:0 18px 50px rgba(0,0,0,.55)}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:6px;padding:10px 14px}
.panel button{font:700 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:4px;padding:9px 14px;cursor:pointer;letter-spacing:.04em}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:#16120c}
.panel button.big{border-color:var(--ui-hot);color:#16120c;background:var(--ui-hot)}
.panel button.big2{border-color:var(--ui-hot2);color:#fff;background:var(--ui-hot2)}
.panel button.on{background:#f2b23a!important;border-color:#f2b23a!important;color:#16120c!important}
.panel button:disabled{opacity:.45;cursor:default}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
.panel .sep{width:1px;height:26px;background:var(--ui-line)}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid #fff3cc;outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(220px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding:0;list-style:none;color:var(--page-muted);font-size:14px;line-height:1.8;display:flex;flex-wrap:wrap;gap:4px 22px}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .bubble path{fill:rgba(20,14,16,.84);stroke:rgba(255,226,170,.6);stroke-width:1}
#scene .bubble text{fill:#fff4e0;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .screen{mix-blend-mode:screen}
#scene .soft{mix-blend-mode:soft-light}
#scene .carve{font:700 13px Georgia,"Times New Roman",serif;letter-spacing:3px;text-anchor:middle}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       #world 是「攝影機」：推近、拉遠；#rig 負責在兩個空間之間橫移。
       #roomA 大階梯（由後往前：天頂畫 → 上層拱廊陽台 → 一樓迴廊與入口女像柱 → 側梯、平台
              → 中央階梯與人群 → 前景的青銅燈台、柱子）
       #roomB 觀眾廳（由後往前：舞台與佈景、舞者、大幕 → 夏卡爾天頂、包廂、舞台口 → 大吊燈
              → 樂池與指揮 → 觀眾席 → 熄燈遮罩）
       最上面是鏡頭效果：光暈、調色、暗角、顆粒、寬銀幕黑邊。
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="CGI 電影質感的巴黎歌劇院內部：白色大理石大階梯分成左右兩道側梯，兩側是彩色大理石雙柱拱廊與陽台，階梯底部有手舉一束燈的青銅女像燈台；鏡頭也能橫移到紅金色的馬蹄形觀眾廳，夏卡爾的彩色天頂中央垂下水晶大吊燈，舞台口上方寫著 ANNO 1669，畫出來的紅色大幕前是樂池與紅絲絨座椅">
    <defs>
      <!-- 燈光 -->
      <radialGradient id="lampG"><stop offset="0" stop-color="#fff3d0" stop-opacity=".95"/><stop offset=".18" stop-color="#ffd890" stop-opacity=".55"/><stop offset=".5" stop-color="#ffb860" stop-opacity=".16"/><stop offset="1" stop-color="#ffb860" stop-opacity="0"/></radialGradient>
      <radialGradient id="bigGlowG"><stop offset="0" stop-color="#ffe6b0" stop-opacity=".6"/><stop offset=".35" stop-color="#ffc878" stop-opacity=".22"/><stop offset="1" stop-color="#ffb060" stop-opacity="0"/></radialGradient>
      <radialGradient id="bulbG"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#fff0c0"/><stop offset="1" stop-color="#ffc870" stop-opacity="0"/></radialGradient>
      <radialGradient id="torchG"><stop offset="0" stop-color="#f6fbff" stop-opacity=".55"/><stop offset=".5" stop-color="#e8f2ff" stop-opacity=".18"/><stop offset="1" stop-color="#e8f2ff" stop-opacity="0"/></radialGradient>
      <radialGradient id="ghostG"><stop offset="0" stop-color="#fff6d8" stop-opacity=".75"/><stop offset=".3" stop-color="#ffe2a8" stop-opacity=".25"/><stop offset="1" stop-color="#ffd890" stop-opacity="0"/></radialGradient>
      <radialGradient id="spotG"><stop offset="0" stop-color="#fff6e0" stop-opacity=".55"/><stop offset=".7" stop-color="#fff0d0" stop-opacity=".25"/><stop offset="1" stop-color="#fff0d0" stop-opacity="0"/></radialGradient>
      <radialGradient id="doorLightG"><stop offset="0" stop-color="#ffe2a0" stop-opacity="1"/><stop offset=".6" stop-color="#ffb860" stop-opacity=".8"/><stop offset="1" stop-color="#c87830" stop-opacity=".6"/></radialGradient>
      <radialGradient id="shadowGrad"><stop offset="0" stop-color="#000" stop-opacity=".42"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
      <radialGradient id="flareGhost"><stop offset="0" stop-color="#8fd0ff" stop-opacity=".04"/><stop offset=".8" stop-color="#8fd0ff" stop-opacity=".2"/><stop offset="1" stop-color="#8fd0ff" stop-opacity="0"/></radialGradient>
      <radialGradient id="flareWarm"><stop offset="0" stop-color="#ffb070" stop-opacity=".28"/><stop offset="1" stop-color="#ffb070" stop-opacity="0"/></radialGradient>
      <linearGradient id="streakG" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#ffb060" stop-opacity="0"/><stop offset=".5" stop-color="#fff0d0" stop-opacity=".85"/><stop offset="1" stop-color="#ffb060" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="beamG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe2b0" stop-opacity=".34"/><stop offset="1" stop-color="#ffe2b0" stop-opacity="0"/></linearGradient>
      <linearGradient id="spotBeamG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6e0" stop-opacity=".02"/><stop offset="1" stop-color="#fff6e0" stop-opacity=".22"/></linearGradient>
      <linearGradient id="stageWashG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7aa8ff" stop-opacity="0"/><stop offset="1" stop-color="#9ec4ff" stop-opacity=".35"/></linearGradient>
      <!-- 材質 -->
      <linearGradient id="cylG" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset=".3" stop-color="#fff" stop-opacity=".28"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/>
      </linearGradient>
      <linearGradient id="giltG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--gilt-hi)"/><stop offset=".45" style="stop-color:var(--gilt)"/><stop offset="1" style="stop-color:var(--gilt-dk)"/>
      </linearGradient>
      <linearGradient id="giltH" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" style="stop-color:var(--gilt-dk)"/><stop offset=".35" style="stop-color:var(--gilt-hi)"/><stop offset=".6" style="stop-color:var(--gilt)"/><stop offset="1" style="stop-color:var(--gilt-dk)"/>
      </linearGradient>
      <linearGradient id="marbleG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--marble-dk)"/><stop offset=".6" style="stop-color:var(--marble)"/><stop offset="1" style="stop-color:var(--marble-hi)"/>
      </linearGradient>
      <linearGradient id="frescoG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--fresco)"/><stop offset="1" style="stop-color:var(--fresco-lt)"/>
      </linearGradient>

<script id="showstop">

       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾

/* ---- 馬蹄形的五層包廂（左右兩側），每間都有紅絲絨與小燈 ---- */
const TIER = { yA: [148, 200, 252, 304, 356, 410], yB: [-120, 10, 128, 246, 364, 482] };
const tierY = (k, s) => lerp(TIER.yA[k], TIER.yB[k], Math.pow(s, 1.15));
const tierX = (s, side) => { const x = 382 - 404 * s; return side < 0 ? x : 1600 - x; };
const tierH = s => lerp(9, 24, s);
const boxes = [];   // 每間包廂：{side,k,s0,s1,heads:[]}
function drawTiers(side) {
  const g = el('g', {}, RB.back);
  const N = 7;
  for (let k = 1; k <= 5; k++) {
    // 包廂內部（暗紅色）
    const top = [], bot = [];
    for (let i = 0; i <= 20; i++) { const s = i / 20; top.push([tierX(s, side), tierY(k - 1, s) + tierH(s)]); bot.push([tierX(s, side), tierY(k, s)]); }
    el('path', { d: poly(top.concat(bot.reverse())), class: 'f-hall' }, g);
    // 隔間、燈、包廂裡的人
    for (let j = 0; j < N; j++) {
      const s0 = j / N, s1 = (j + 1) / N, sc = (s0 + s1) / 2;
      const bx = tierX(sc, side), by = tierY(k, sc), h = tierY(k, sc) - tierY(k - 1, sc) - tierH(sc);
      el('rect', { x: f1(bx - 404 / N / 2 * .7), y: f1(by - h * .95), width: f1(404 / N * .7), height: f1(h * .4), class: 'f-velvet-dk', opacity: .7 }, g);
      glow(g, bx, by - h * .7, lerp(14, 34, sc), { s: .55 });
      const B1 = { side, k, sc, x: bx, y: by, h, heads: [], hg: el('g', {}, g) };
      boxes.push(B1);
      const xs = tierX(s0, side);
      el('path', { d: `M${f1(xs)} ${f1(tierY(k - 1, s0) + tierH(s0))}V${f1(tierY(k, s0))}`, class: 's-gilt', 'stroke-width': f1(lerp(1.4, 4, s0)) }, g);
    }
    // 包廂前緣：鍍金欄板＋紅絲絨扶手
    const fr = [], fb = [];
    for (let i = 0; i <= 20; i++) { const s = i / 20; fr.push([tierX(s, side), tierY(k, s)]); fb.push([tierX(s, side), tierY(k, s) + tierH(s)]); }
    el('path', { d: poly(fr.concat(fb.slice().reverse())), fill: 'url(#giltG)' }, g);
    const vel = [];
    for (let i = 0; i <= 20; i++) { const s = i / 20; vel.push([tierX(s, side), tierY(k, s) + tierH(s) * .28]); }
    el('path', { d: poly(fr.concat(vel.slice().reverse())), class: 'f-velvet' }, g);
    let d = '';
    for (let i = 1; i < 28; i++) { const s = i / 28, x = tierX(s, side), y = tierY(k, s) + tierH(s) * .65; d += `M${f1(x)} ${f1(y)}m-${f1(tierH(s) * .14)} 0a${f1(tierH(s) * .14)} ${f1(tierH(s) * .14)} 0 1 0 ${f1(tierH(s) * .28)} 0a${f1(tierH(s) * .14)} ${f1(tierH(s) * .14)} 0 1 0 -${f1(tierH(s) * .28)} 0`; }
    el('path', { d, class: 'f-gilt-dk', opacity: .7 }, g);
    // 欄板上的小燈球（隔間處）
    for (let j = 1; j < N; j++) { const s = j / N; const x = tierX(s, side), y = tierY(k, s) - tierH(s) * .3; el('circle', { cx: f1(x), cy: f1(y), r: f1(lerp(1.6, 3.4, s)), fill: 'url(#bulbG)' }, g); glow(g, x, y, lerp(8, 20, s), { s: .9 }); }
  }
  // 第 5 號包廂的名牌（左側一樓包廂，傳說留給歌劇院幽靈）
  if (side < 0) {
    const B5 = boxes.find(b => b.side < 0 && b.k === 4 && Math.abs(b.sc - 1.5 / 7) < .01);
    B5.five = true;
    const px = B5.x, py = B5.y + tierH(B5.sc) * .5;
    const pl = el('g', {}, g);
    el('rect', { x: f1(px - 7), y: f1(py - 3.5), width: 14, height: 7, rx: 1.5, class: 'f-velvet-dk' }, pl);
    el('text', { x: f1(px), y: f1(py + 2.6), 'font-size': 7, 'font-weight': 700, 'text-anchor': 'middle', fill: 'var(--plaque)', 'font-family': 'Georgia,serif' }, pl).textContent = '5';
    B5.plaque = pl;
  }
  const hit = el('path', { d: side < 0 ? 'M-30 -140L384 140L384 480L-30 600Z' : 'M1630 -140L1216 140L1216 480L1630 600Z', fill: 'transparent' }, g);
  clickable(hit, side < 0 ? '左側包廂：點一下包廂裡的人拿起望遠鏡' : '右側包廂：點一下包廂裡的人拿起望遠鏡');
  return hit;
}

  const up = makeLane({ g: flightSlot, view: 'back', flow: 'up', n: 5, speed: 30, gap: .2, pos: u => { const y = flightY(u), t = (FL.yb - y) / (FL.yb - FL.yt); return [lerp(722, 768, t), y + 12 * (1 - t), lerp(1.04, .6, t)]; } });
  const down = makeLane({ g: flightSlot, view: 'front', flow: 'down', prepend: 1, n: 4, speed: 30, gap: .22, pos: u => { const y = flightY(1 - u), t = (FL.yb - y) / (FL.yb - FL.yt); return [lerp(880, 834, t), y + 12 * (1 - t), lerp(1.04, .6, t)]; } });
  makeLane({ g: landSlot.back, p0: [548, 343, .55], p1: [1052, 343, .55], n: 3, speed: 26, gap: .2 });
  makeLane({ g: landSlot.front, p0: [1052, 350, .57], p1: [548, 350, .57], n: 3, speed: 26, gap: .2 });
  makeLane({ g: flightSlots.L, flow: 'up', p0: [560, 344, .56], p1: [306, 252, .46], n: 4, speed: 24, gap: .2 });
  makeLane({ g: flightSlots.R, flow: 'down', p0: [1294, 252, .46], p1: [1040, 344, .56], n: 4, speed: 24, gap: .2 });
  makeLane({ g: galSlots.L, p0: [-40, 258, .44], p1: [312, 258, .44], n: 3, speed: 24, gap: .25 });
  makeLane({ g: galSlots.R, p0: [1640, 258, .44], p1: [1288, 258, .44], n: 3, speed: 24, gap: .25 });
  makeLane({ g: RA.groundSlot, p0: [-70, 598, 1.1], p1: [1670, 598, 1.1], n: 2, speed: 40, gap: .3 });
  // 下行的人從遠處（上方）出現，要畫在較近的人後面
  const _dress = dress;
  dress = function (Q, S) { _dress(Q, S); if (S.P && Q.prepend) Q.g.insertBefore(S.P.g, Q.g.firstChild); };
  // 陽台倚欄的人
  upperSlots.forEach((U, i) => {
    if (srand() < .35) return;
    const n = srand() < .4 ? 2 : 1;
    for (let j = 0; j < n; j++) makeStatic(U.g, { room: 0, view: 'front', s: .3, dir: 1, x: U.x + (j - (n - 1) / 2) * 24 + srand(-6, 6), y: U.y, kinds: { day: pick(['tour', 'photo', 'tour']), arrive: pick(['gown', 'tux']), perf: srand() < .4 ? pick(['gown', 'tux']) : null, leave: pick(['gown', 'tux']), clean: null, night: null } });
  });
  // 地面層：拍照的人、導覽團（晚上換成舉杯的賓客）、帶位員、清潔人員
  const gs = RA.groundSlot;
  makeStatic(gs, { room: 0, view: 'side', s: 1.08, dir: 1, x: 236, y: 600, kinds: { day: 'photo', arrive: 'photo', perf: null, leave: null } });
  makeStatic(gs, { room: 0, view: 'side', s: 1.1, dir: -1, x: 1372, y: 602, toast: 1, kinds: { day: 'guide', arrive: 'tux', perf: 'tux', leave: 'tux' } });
  makeStatic(gs, { room: 0, view: 'side', s: 1.04, dir: 1, x: 1290, y: 596, toast: 1, kinds: { day: 'tour', arrive: 'gown', perf: 'gown', leave: 'gown' } });
  makeStatic(gs, { room: 0, view: 'side', s: .98, dir: 1, x: 1250, y: 590, kinds: { day: 'kid', arrive: null, perf: null, leave: null } });
  makeStatic(landSlot.front, { room: 0, view: 'front', s: .56, dir: 1, x: 712, y: 352, kinds: { arrive: 'usher', perf: 'usher', leave: 'usher' } });
  makeStatic(landSlot.front, { room: 0, view: 'front', s: .56, dir: 1, x: 888, y: 352, kinds: { arrive: 'usher', perf: 'usher', leave: 'usher', clean: 'clean' } });
  makeStatic(flightSlot, { room: 0, view: 'side', s: 1.02, dir: 1, x: 560, y: 572, kinds: { clean: 'clean' } });
  // 觀眾廳：導覽、清潔人員、帶位員
  makeStatic(RB.front, { room: 1, view: 'front', s: .78, dir: 1, x: 1118, y: 532, kinds: { day: 'guide', clean: 'clean', arrive: 'usher', leave: 'usher' } });
  makeStatic(RB.front, { room: 1, view: 'front', s: .74, dir: 1, x: 482, y: 530, kinds: { day: 'photo', arrive: 'usher' } });
  statics.forEach(S => { if (S.room === 1) clickable(S.g, '人物：點一下'); });
  // 巡守員
  watchman = person(landSlot.front, { kind: 'watch', view: 'side', s: .57, dir: 1, x: 640, y: 349 });
  watchman.op = 0; watchman.g.setAttribute('opacity', 0);
  // 共和衛隊（開幕晚會才出現）
  RA.guardG = el('g', {}, flightSlot.parentNode);
  flightSlot.parentNode.insertBefore(RA.guardG, RA.flightRails);
  [.04, .2, .36, .52, .68, .84].forEach((v, k) => {
    const y = flightY(v), t = (FL.yb - y) / (FL.yb - FL.yt), s = lerp(1.04, .62, t);
    guard(RA.guardG, flightX(y, -1) + 62 * s, y + 6 * (1 - t), s, 1).k = k;
    guard(RA.guardG, flightX(y, 1) - 62 * s, y + 6 * (1 - t), s, -1).k = k;
  });
  trumpeter(landSlot.front, 598, 352, .58, 1); trumpeter(landSlot.front, 1002, 352, .58, -1);
  // 芭蕾舞者：女主角、男舞者、八位群舞
  dancer(RB.dancers, 800, 444, .54);
  dancer(RB.dancers, 920, 441, .56, { male: 1, dir: -1 });
  [540, 588, 636, 684].forEach((x, i) => dancer(RB.dancers, x, 422 + (i % 2) * 6, .44, { dir: 1 }));
  [916, 964, 1012, 1060].forEach((x, i) => dancer(RB.dancers, x, 422 + ((i + 1) % 2) * 6, .44, { dir: -1 }));
  dancers.forEach(D => { D.home = D.x; D.dir0 = D.dir; });
  // 女主角不能和群舞重疊：群舞排在後排
  RB.dancers.appendChild(dancers[1].g); RB.dancers.appendChild(dancers[0].g);
  restPose();
  // 其他裝飾燈泡：跟著燈光總亮度變化
  const managed = new Set([...chandA.flatMap(C => C.bulbs), ...torch.flatMap(T1 => T1.bulbs), ...chandB.bulbs, ghostLight.bulb]);
  svg.querySelectorAll('[fill="url(#bulbG)"]').forEach(n => { if (!managed.has(n)) miscBulbs.push({ n, rb: !!n.closest('#roomB') }); });
  drawFlares();
  bindAll();
  if (reduced) { T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false'); }
  $('roomB').style.display = 'none';
  applyColors(true);
  lanes.forEach(Q => Q.list.forEach(S => dress(Q, S)));
  lighting();
  step(1 / 60);
  requestAnimationFrame(loop);
  // 網站「作者精選」播放區（純插畫版放在 iframe 裡）：預設播放芭蕾開演，結束後重複輪播；不會自己出聲
  const inPicks = (() => { let top = true; try { top = window.top === window; } catch (e) { top = false; } return !!document.getElementById('pure-art') && !top; })();
  if (inPicks) {
    setTimeout(() => startShow('ballet', true), 800);
    setInterval(() => { if (!show.on) startShow('ballet', true); }, 3000);
    window.sceneMusic = {
      playing: false,
      start(c) { if (this.playing) return; this.playing = true; pickAudio = true; userGesture = true; if (c && c !== actx) useCtx(c); else ensureAudio(); if (actx && actx.state !== 'running') actx.resume(); if (show.on && show.t < 3) playBallet(); },
      stop() { this.playing = false; pickAudio = false; stopAll(); },
      duck() {}
    };
  }
}
init();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on && show.kind,
  btn: { gala: 'btnGala', ballet: 'btnBallet' },
  ff: () => { show.flags = new Proxy({}, { get: () => 1 }); show.t = 999; },   // 跳到結尾：燈亮、幕降、衛兵退場
  save: () => ({ t: T.t, auto: T.auto, room }),
  stop: () => endShow(),
  restore: s => {
    goRoom(s.room);   // 鏡頭平移回原本的廳
    T.t = s.t; T.auto = s.auto; $('btnAuto').setAttribute('aria-pressed', String(T.auto)); applyColors(true);
  }
});
/* /ShowStop */
})();
</script>
