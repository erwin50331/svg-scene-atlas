<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>杜拜帆船飯店旁的滑水道樂園</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-90 杜拜帆船飯店旁的滑水道樂園｜黏土定格動畫風
   地點：阿聯酋杜拜，朱美拉海灘（Jumeirah Beach）。
         背景是波斯灣、左邊海上的朱美拉棕櫚島（Palm Jumeirah：樹幹、葉片、新月形防波堤，從高處斜看），
         以及人工島上的帆船飯店（Burj Al Arab：白色風帆外牆、外骨架桁架、
         頂端桅杆、海側的圓形直升機坪、陸側懸挑的高空餐廳，弧形私人橋連到岸邊），
         右邊是波浪造型的朱美拉海灘飯店，左邊遠方是杜拜碼頭一帶的高樓天際線。
         海平面刻意拉高，像從滑水道高塔上往海面看，才看得出棕櫚島的形狀。
         水上樂園「沙丘堡」為原創設計（阿拉伯城堡造型、風塔、棕櫚樹），不使用任何樂園品牌或商標。
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   風格重點：所有物件像手捏黏土——圓潤邊緣、左上打光的高光、右下厚度陰影、
            整片指紋紋理；太陽、月亮、雲朵用細線吊著；動畫一律「逐格」更新（每秒 12 格）。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），部分另有 --k-名稱（晨昏）。
   JS 會依時間內插輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）class。
   ========================================================= */
:root{
  color-scheme: light;

  /* —— 天空（黏土背板）：沙漠海岸的亮藍天、金橘色夕陽 —— */
  --d-sky-top:#4fa6e6;  --k-sky-top:#5a5aa8;  --n-sky-top:#0e1438;
  --d-sky-mid:#8fd0f4;  --k-sky-mid:#f49a6a;  --n-sky-mid:#1c2458;
  --d-sky-low:#f6ecd2;  --k-sky-low:#ffc66a;  --n-sky-low:#3a3468;
  --d-cloud:#fffaf0;    --k-cloud:#ffd8b8;    --n-cloud:#3a3c6c;
  --d-cloud-sh:#dfe2ea; --n-cloud-sh:#282a52;
  --d-thread:#8a8f99;   --n-thread:#5a5878;    /* 吊太陽、雲朵的細線 */

  /* —— 波斯灣與遠景 —— */
  --d-sea-far:#3ab8c8;  --k-sea-far:#c88a8a;  --n-sea-far:#14284a;
  --d-sea-near:#58d0d0; --k-sea-near:#e8a87a; --n-sea-near:#1a3458;
  --d-sea-hi:#e8fbff;   --n-sea-hi:#6a7aa8;
  --d-skyline:#b8c4d0;  --k-skyline:#b88a9a;  --n-skyline:#262a4c;   /* 遠方海岸高樓 */
  --d-skyline-2:#a2b0c0; --n-skyline-2:#20243f;
  --d-beach:#f2dcac;    --n-beach:#4a4458;

  /* —— 帆船飯店與朱美拉海灘飯店 —— */
  --d-burj-sail:#fbfaf4; --k-burj-sail:#ffe2c8; --n-burj-sail:#8a8eb0;
  --d-burj-sail-sh:#dfe0de; --n-burj-sail-sh:#6a6c90;
  --d-burj-frame:#c8ccd2; --n-burj-frame:#4a4e70;
  --d-burj-glass:#5a88a8; --n-burj-glass:#1e2a48;
  --d-island:#d8c49a;   --n-island:#3e3a50;
  --d-jbh-glass:#4aa0d0; --n-jbh-glass:#1c3054;
  --d-jbh-white:#f4f4ee; --n-jbh-white:#6a6e90;

  /* —— 水上樂園：沙丘堡（阿拉伯城堡造型） —— */
  --d-fort:#e8c48a;     --k-fort:#f0a878;     --n-fort:#5a4a5a;
  --d-fort-sh:#c89c62;  --n-fort-sh:#3e3446;
  --d-fort-hi:#f8e2b4;  --n-fort-hi:#6e5e6a;
  --d-wood:#a8683a;     --n-wood:#3e2a2a;
  --d-wood-2:#c88a4e;   --n-wood-2:#4a3430;
  --d-rail:#2ab0a8;     --n-rail:#1a4a50;
  --d-slide-a:#f6c230;  --n-slide-a:#7a6430;   /* 黃：高空垂直滑道 */
  --d-slide-b:#2f8ae0;  --n-slide-b:#1e3a6a;   /* 藍：螺旋滑道 */
  --d-slide-c:#ee4a5a;  --n-slide-c:#6a2434;   /* 紅：家庭泳圈滑道 */
  --d-slide-d:#5ac85a;  --n-slide-d:#24502e;   /* 綠：兒童小滑梯 */
  --d-slide-in:#ffffff55; --n-slide-in:#ffffff22;
  --d-pool:#3cc8e0;     --n-pool:#16708e;      /* 池水 */
  --d-pool-2:#28aed0;   --n-pool-2:#0f5a7a;
  --d-pool-deep:#1e8ec0; --n-pool-deep:#0c4466;
  --d-pool-edge:#f4f0e6; --n-pool-edge:#6a6a82;
  --d-foam:#ffffff;     --n-foam:#b8e8f2;
  --d-tile:#e8dcc6;     --n-tile:#4a4658;      /* 泳池邊的地磚 */
  --d-tile-2:#ddcfb6;   --n-tile-2:#423e50;
  --d-sand:#f0d8a4;     --n-sand:#5a5060;
  --d-palm-trunk:#a8845a; --n-palm-trunk:#3a3038;
  --d-palm-frond:#4a9a44; --n-palm-frond:#1a3228;
  --d-palm-frond-2:#6ab854; --n-palm-frond-2:#22402e;
  --d-grass:#7ac05a;    --n-grass:#24402e;
  --d-umb-1:#f6efe0;    --n-umb-1:#6a6878;
  --d-umb-2:#2aa8a0;    --n-umb-2:#1a4a52;
  --d-umb-3:#f28a3a;    --n-umb-3:#6a3a2a;
  --d-lounger:#f6f2e8;  --n-lounger:#6a6a7a;
  --d-towel-1:#ff6a8a;  --n-towel-1:#6a2a3e;
  --d-towel-2:#ffd23a;  --n-towel-2:#6a5a2a;
  --d-towel-3:#4ab8e8;  --n-towel-3:#1e4a6a;
  --d-shadow:#3a280f38; --n-shadow:#00000066;  /* 角色腳下的影子 */

  /* —— 不隨日夜變化的顏色 —— */
  --sun:#ffc93c;  --sun-hi:#fff0a8;  --moon:#f4efd8;  --star:#fff6d6;
  --lamp:#ffcf6a; --poolglow:#5af0ff; --led-1:#ff4aa8; --led-2:#4ad8ff; --led-3:#ffe24a; --led-4:#7aff6a;
  --burj-1:#ffffff; --burj-2:#4a8aff; --burj-3:#c04aff; --burj-4:#ff4a8a; --burj-5:#3ae0c8; --burj-6:#ffb03a;
  --clay-shade:#2a1408;  --veil:#0a0e30; --haze:#f0d0a0; --sandstorm:#d8a860;
  --cine-shade:#000000; --cine-light:#fff1d6;   /* 表演氛圍：暗角與中央微亮 */
  --rainc:#b8d0ea; --dust:#d8b07a; --water:#bff4ff; --water-dk:#7ad8f0;
  --gull:#fbfaf6; --gull-wing:#a8b0b8; --dhow:#a8703e; --dhow-sail:#fbf4e4;
  --fw-1:#ffd23a; --fw-2:#ff5aa8; --fw-3:#5ae8ff; --fw-4:#ffffff;

  /* —— 角色 —— */
  --skin-1:#f2cba6; --skin-2:#d8a476; --skin-3:#b07a52; --skin-4:#7a4e32;
  --hair-1:#1e181c; --hair-2:#5a3a22; --hair-3:#e8c870; --hair-4:#c8c0b8; --hair-5:#a8442a;
  --suit-1:#ff4a6a; --suit-2:#2f6dba; --suit-3:#ffc23a; --suit-4:#2ab89a; --suit-5:#a85ae0;
  --suit-6:#ff8ac0; --suit-7:#ff7a2a; --suit-8:#3ad0e8; --suit-9:#7ad84a; --suit-10:#1e2a48;
  --tube-1:#ff5a5a; --tube-2:#ffd23a; --tube-3:#3aa8ff; --tube-4:#5ae07a; --tube-5:#ff8ad8;
  --guard:#e8283a; --guard-2:#ffd23a;

  /* —— 頁面介面 —— */
  --page-bg:#f6eedf; --page-fg:#24202a; --page-muted:#76685e;
  --ui-surface:#fff9ef; --ui-line:#e6d4b8; --ui-accent:#0f8ab0;
  --ui-hot-2:#d8566a;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border:1px solid var(--ui-line);border-radius:14px;overflow:hidden;background:#1c2030;line-height:0;box-shadow:0 2px 12px #0000002a}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:12px;padding:10px 14px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--page-fg);border-color:var(--page-fg);color:var(--ui-surface);font-weight:700}
.panel button.big{border-color:var(--ui-accent);color:#fff;background:var(--ui-accent);font-weight:700}
.panel button.big.alt{border-color:var(--ui-hot-2);background:var(--ui-hot-2)}
.panel button.big.on{background:var(--led-3);border-color:var(--led-3);color:var(--page-fg)}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
/* 畫面內可點物件：滑鼠點不顯示外框，用鍵盤 Tab 時才顯示 */
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid var(--ui-accent);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable,#scene [role="button"]{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .bubble text{fill:#24202a;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，由後往前：
       天空（吊線太陽、月亮、雲、海鷗）→ 波斯灣、遠方天際線 → 帆船、棕櫚島 → 帆船飯店、朱美拉海灘飯店、單桅帆船
       → 樂園後牆（城堡牆、風塔、棕櫚樹）→ 滑水道高塔與三條滑水道 → 兒童戲水城堡（大水桶）
       → 落水池、造浪池 → 池畔（躺椅、陽傘、小吃亭、救生員塔、行人）→ 前景棕櫚葉
       → 特效 → 雨／沙塵 → 夜色 → 燈光 → 表演氛圍 → 指紋紋理 → 對話泡泡
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="黏土定格動畫風格的杜拜水上樂園：背景是拉高的藍綠色波斯灣，海中央是棕櫚樹形狀的人工島，外圍有新月形防波堤，另一座人工島立著白色風帆造型的帆船飯店，旁邊是波浪造型的海灘飯店，左邊遠方是海岸高樓；樂園是沙色的阿拉伯城堡造型，中間一座高塔垂下黃色垂直滑道、藍色螺旋滑道和紅色泳圈滑道，左邊是有大水桶的兒童戲水城堡，右邊是造浪池，池畔有躺椅、陽傘、小吃亭、救生員塔和棕櫚樹，許多穿泳衣的黏土小人在排隊、滑水、游泳和散步">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-top)"/>
        <stop offset=".55" style="stop-color:var(--sky-mid)"/>
        <stop offset="1" style="stop-color:var(--sky-low)"/>
      </linearGradient>
      <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sea-far)"/>
        <stop offset="1" style="stop-color:var(--sea-near)"/>
      </linearGradient>
      <linearGradient id="poolGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--pool-deep)"/>
        <stop offset="1" style="stop-color:var(--pool)"/>
      </linearGradient>
      <!-- 黏土質感：左上打光的高光＋右下厚度陰影 -->
      <filter id="clay" x="-6%" y="-6%" width="112%" height="112%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
        <feSpecularLighting in="b" surfaceScale="4" specularConstant=".9" specularExponent="26" lighting-color="#fff4e2" result="spec">
          <feDistantLight azimuth="225" elevation="40"/>
        </feSpecularLighting>
        <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
        <feOffset in="b" dx="-3.5" dy="-4.5" result="off"/>
        <feComposite in="SourceAlpha" in2="off" operator="arithmetic" k2="1" k3="-1" result="rim"/>
        <feFlood style="flood-color:var(--clay-shade)" flood-opacity=".45"/>
        <feComposite in2="rim" operator="in" result="shade"/>
        <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/><feMergeNode in="specIn"/></feMerge>
      </filter>
      <filter id="clayS" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="b"/>
        <feSpecularLighting in="b" surfaceScale="2.4" specularConstant=".85" specularExponent="24" lighting-color="#fff6e8" result="spec">
          <feDistantLight azimuth="225" elevation="42"/>
        </feSpecularLighting>
        <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
        <feOffset in="b" dx="-1.5" dy="-2" result="off"/>
        <feComposite in="SourceAlpha" in2="off" operator="arithmetic" k2="1" k3="-1" result="rim"/>
        <feFlood style="flood-color:var(--clay-shade)" flood-opacity=".42"/>
        <feComposite in2="rim" operator="in" result="shade"/>
        <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/><feMergeNode in="specIn"/></feMerge>
      </filter>
      <!-- 小光暈（只套在小物件上，避免大圖層模糊掉幀） -->
      <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="3" result="g"/>
        <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <radialGradient id="glowGrad"><stop offset="0" style="stop-color:var(--lamp)" stop-opacity=".85"/><stop offset="1" style="stop-color:var(--lamp)" stop-opacity="0"/></radialGradient>
      <radialGradient id="poolGlowGrad"><stop offset="0" style="stop-color:var(--poolglow)" stop-opacity=".75"/><stop offset="1" style="stop-color:var(--poolglow)" stop-opacity="0"/></radialGradient>
      <radialGradient id="sunGlow"><stop offset="0" style="stop-color:var(--sun-hi)" stop-opacity=".7"/><stop offset="1" style="stop-color:var(--sun)" stop-opacity="0"/></radialGradient>
      <radialGradient id="burjGlowGrad"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      <!-- 泳池邊地磚 -->
      <pattern id="tilePat" width="44" height="22" patternUnits="userSpaceOnUse">
        <rect width="44" height="22" class="f-tile"/>
        <rect x="1" y="1" width="20" height="9" rx="2.5" class="f-tile-2"/><rect x="23" y="12" width="20" height="9" rx="2.5" class="f-tile-2"/>
      </pattern>
      <!-- 城堡牆：細細的沙粒 -->
      <pattern id="sandPat" width="30" height="20" patternUnits="userSpaceOnUse">
        <circle cx="6" cy="5" r="1.2" fill="#8a5a2a" opacity=".16"/><circle cx="20" cy="13" r="1.4" fill="#8a5a2a" opacity=".12"/>
        <circle cx="26" cy="4" r=".9" fill="#fff" opacity=".2"/><circle cx="12" cy="16" r="1" fill="#fff" opacity=".16"/>
      </pattern>
      <!-- 指紋紋理：由程式用 canvas 畫好再填進來 -->
      <pattern id="thumbPat" width="420" height="420" patternUnits="userSpaceOnUse">
        <image id="thumbImg" width="420" height="420" href=""/>
      </pattern>
    </defs>

    <!-- 天空背板 -->
    <g id="skyLayer">
      <rect x="0" y="0" width="1600" height="330" fill="url(#skyGrad)"/>
      <rect id="skyGrey" x="0" y="0" width="1600" height="330" fill="#8a909e" opacity="0"/>
      <rect id="skyHaze" x="0" y="0" width="1600" height="330" style="fill:var(--haze)" opacity="0"/>
      <g id="stars"></g>
      <g id="sun" class="clickable" tabindex="0" role="button" aria-label="吊在線上的黏土太陽：點一下切換成夜晚"></g>
      <g id="moon" class="clickable" tabindex="0" role="button" aria-label="吊在線上的黏土月亮：點一下切換成白天"></g>
      <g id="clouds"></g>
    </g>
    <rect id="skyHit" x="0" y="0" width="1600" height="120" fill="transparent" class="clickable"/>
    <g id="fireworks" class="noHit"></g>

    <!-- 波斯灣、遠方天際線、帆船飯店、海灘飯店（滑鼠移動有視差） -->
    <g id="farPx">
      <g id="sea"></g>
      <g id="boats"></g>
      <g id="palmIsland"></g>
      <g id="burj" class="clickable" tabindex="0" role="button" aria-label="帆船飯店：點一下換外牆燈光"></g>
      <g id="jbh" class="clickable" tabindex="0" role="button" aria-label="波浪造型的海灘飯店"></g>
      <g id="heliLayer"></g>
    </g>
    <rect id="hazeVeil" class="noHit" x="0" y="150" width="1600" height="230" style="fill:var(--haze)" opacity="0"/>
    <g id="flyers"></g>
    <!-- 樂園後牆、棕櫚樹 -->
    <g id="parkBack"></g>
    <!-- 滑水道高塔與滑水道 -->
    <g id="slidesBack"></g>
    <g id="tower"></g>
    <g id="towerActors"></g>
    <g id="slides"></g>
    <g id="riders"></g>
    <!-- 兒童戲水城堡 -->
    <g id="play"></g>
    <g id="playActors"></g>
    <!-- 落水池、造浪池 -->
    <g id="pools"></g>
    <g id="swimmers"></g>
    <g id="poolFront"></g>
    <!-- 池畔 -->
    <g id="deck"></g>
    <g id="props"></g>
    <g id="frontActors"></g>
    <g id="foreground"></g>
    <!-- 特效：水花、泡泡、水柱 -->
    <g id="fx" class="noHit"></g>
    <g id="rain" class="noHit" opacity="0"></g>
    <g id="dust" class="noHit" opacity="0"></g>
    <rect id="stormVeil" class="noHit" x="0" y="0" width="1600" height="600" style="fill:var(--sandstorm)" opacity="0"/>
    <!-- 夜色 -->
    <rect id="veil" class="noHit" x="0" y="0" width="1600" height="600" style="fill:var(--veil)" opacity="0"/>
    <!-- 燈光：窗、池底燈、街燈、帆船飯店外牆燈、滑道 LED（不被夜色壓暗） -->
    <g id="lights" class="noHit"></g>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);
      }
      return _conn.call(this, dest, ...a);
    };
  }
  function stopAudio() {
    let longs = [], ctx = null;
    for (const s of srcs) {
      const c = s.context, now = c.currentTime, m = s.__ss; ctx = c;
      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }

      const g = outs.get(ctx), now = ctx.currentTime;
      if (g) {
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 1.1); g.gain.setValueAtTime(0, now + 1.2);
        g.gain.linearRampToValueAtTime(1, now + 1.9);

      longs.forEach(s => { try { s.stop(now + 1.15); } catch (e) {} srcs.delete(s); });
    }
    srcs.clear();
  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');
    // 凍結色票：把目前的 CSS 變數抄到殘影上，底下換色不影響殘影
    const cs = getComputedStyle(svg);
    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }
      }
    }
    const par = svg.parentElement;
    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });
    added = [];
  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>
/* ---- 表演氛圍（取代寬銀幕黑邊）：k = 0~1，四周輕微暗角＋中央微亮；fx/fy 可讓亮處偏向表演焦點 ---- */
let cineK = 0, cineW = 0;
function setCine(k, fx, fy) {
  cineK = k = Math.max(0, Math.min(1, k));
  if (k === cineW || (Math.abs(k - cineW) < .004 && k > 0 && k < 1)) return;   // 變化太小就先不重畫
  cineW = k;
  const g = document.getElementById('cineFx'); if (!g) return;
  g.setAttribute('opacity', k.toFixed(3));
  if (fx != null) { const G = document.getElementById('cineLightG'); G.setAttribute('cx', (fx / 1600).toFixed(3)); G.setAttribute('cy', (fy / 600).toFixed(3)); }
}

/* =========================================================
   SC-90 杜拜帆船飯店旁的滑水道樂園｜程式區
   區塊：①工具與色票
         ②場景（天空、波斯灣、天際線、帆船飯店、海灘飯店、樂園後牆、滑水道高塔、三條滑水道、
                兒童戲水城堡與大水桶、落水池、造浪池、池畔、前景）
         ③角色（爬樓梯排隊的人、滑水的人、泳池裡的人、戲水小朋友、池畔行人、救生員、小吃亭老闆、
                海上帆船與水上摩托車、海鷗、直升機）
         ④動畫（日夜、天氣、水流、造浪池大浪、夜光滑水派對）
         ⑤互動（點擊、滑鼠、聲音、控制列）
   ========================================================= */
(() => {
'use strict';

/* ---------------- ① 工具與色票 ---------------- */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const root = document.documentElement;
const svg = $('scene');
const FPS = 12;                 // 定格動畫：每秒 12 格
const DAY_SEC = 150;            // 自動播放時一天幾秒
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
let seed = 20261124;            // 固定亂數：每次開啟構圖一樣
const srand = (a = 0, b = 1) => { seed = (seed * 16807) % 2147483647; return a + (seed / 2147483647) * (b - a); };
const spick = a => a[Math.floor(srand(0, a.length - .001))];
const f1 = n => (+n).toFixed(1);
function el(tag, attrs = {}, parent) {

function frag(parent, html) { parent.insertAdjacentHTML('beforeend', html); return parent.lastElementChild; }
const clay = (parent, attrs = {}, f = 'clay') => el('g', Object.assign({ filter: `url(#${f})` }, attrs), parent);

// 讀取色票、依日夜內插混色
const css = n => getComputedStyle(root).getPropertyValue(n).trim();
const hex = h => {

};
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgba = c => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${(c[3] ?? 1).toFixed(3)})`;
const PAIRS = {};
(() => {

// 指紋紋理（canvas 畫好再當成 pattern）
function makeThumbprints() {
  try {
    const S = 420, c = document.createElement('canvas'); c.width = c.height = S;
    const x = c.getContext('2d');
    const stamp = (cx, cy, rot, sc) => {
      x.save(); x.translate(cx, cy); x.rotate(rot); x.scale(sc, sc * .78);
      for (let k = 0; k < 9; k++) {
        const r = 4 + k * 2.6, a0 = Math.random() * 6.28, a1 = a0 + 2.4 + Math.random() * 2.6;
        x.beginPath(); x.arc(0, 0, r, a0, a1); x.strokeStyle = 'rgba(60,36,20,.10)'; x.lineWidth = 1.1; x.stroke();
        x.beginPath(); x.arc(.8, .8, r, a0, a1); x.strokeStyle = 'rgba(255,248,236,.09)'; x.lineWidth = 1; x.stroke();
      }
      x.restore();
    };
    for (let i = 0; i < 34; i++) {
      const px = Math.random() * S, py = Math.random() * S, r = Math.random() * 6.28, s = .7 + Math.random() * .9;
      [[0, 0], [S, 0], [-S, 0], [0, S], [0, -S]].forEach(([ox, oy]) => stamp(px + ox, py + oy, r, s));
    }
    const img = x.getImageData(0, 0, S, S), d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const r = Math.random();
      if (r < .035) { d[i] = 50; d[i + 1] = 30; d[i + 2] = 20; d[i + 3] = Math.max(d[i + 3], 22); }
      else if (r < .06) { d[i] = 255; d[i + 1] = 248; d[i + 2] = 236; d[i + 3] = Math.max(d[i + 3], 20); }
    }
    x.putImageData(img, 0, 0);
    $('thumbImg').setAttribute('href', c.toDataURL('image/png'));
  } catch (e) {}
}

    for (let e = 0; e < 8; e++) bass(t0 + (b0 + e * .5) * B, hz(RT[k] + (e % 2 ? 12 : 0)), .45 * B, .13, D);
    // 烏德琴：反拍撥和弦音

  });
  const MEL = [[74, 1], [77, 1], [81, 2],
               [82, 1], [77, 1], [74, 2],
               [79, 1], [76, 1], [72, 1], [76, 1],
               [77, 1], [74, 1], [69, 2],
               [81, 1], [86, 1], [81, 1], [77, 1],
               [82, 1.5], [77, .5], [74, 1], [77, 1],
               [79, 1], [84, 1], [88, 2],
               [86, 2], [81, 1], [77, 1]];
  seq(t0, B, 8, MEL, (t, f, d) => { lead(t, f, d, .07, D); glock(t, f * 2, .012, D); });
  // 收尾（第 40–44 拍）：Dm 大和弦＋煙火
  crash(t0 + 40 * B, .1, D); kick(t0 + 40 * B, .26, D);
  [38, 50, 62, 65, 69, 74].forEach(n => pad(t0 + 40 * B, hz(n), 3.6 * B, .028, D));
  [74, 77, 81, 86].forEach((n, i) => glock(t0 + (40 + i * .25) * B, hz(n), .06, D));

}

/* ---------------- ④ 動畫：日夜 ---------------- */
const T = { t: 11 / 24, auto: true, target: null, dragging: false };
let night = 0, dusk = 0, nOn = 0, lastApplied = -1;
function clockText() {
  const h = T.t * 24, hh = Math.floor(h) % 24, mm = Math.floor((h - Math.floor(h)) * 60 + 1e-6);
  return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
}
function applyTime(force) {
  if (!force && Math.abs(T.t - lastApplied) < .0003) return;
  lastApplied = T.t;
  const h = T.t * 24;
  night = clamp(1 - smooth(5.4, 7, h) + smooth(18.2, 19.6, h), 0, 1);
  dusk = Math.max(Math.exp(-Math.pow((h - 6.3) / 1, 2)), Math.exp(-Math.pow((h - 18.7) / 1, 2)));
  for (const k in PAIRS) {

  $('sun').style.display = sp > -.05 && sp < 1.05 ? '' : 'none';
  $('moon').setAttribute('transform', `translate(${f1(140 + mp * 1320)} ${f1(250 - Math.sin(Math.PI * clamp(mp, 0, 1)) * 175)})`);
  $('moon').style.display = mp > -.05 && mp < 1.05 ? '' : 'none';
  nOn = smooth(.35, .9, night);

}

/* ---------------- ④ 動畫：逐格主迴圈 ----------------
   requestAnimationFrame 照常跑，但畫面只在每 1/12 秒「拍一格」，做出定格動畫的頓感。 */
const mouse = { x: 800, y: 300, in: false, dx: 0, t: 0 };
let frame = 0, last = performance.now(), acc = 0, rafId = 0, jbhSpark = 0;
function loop(now) {
  const real = Math.min(.25, (now - last) / 1000); last = now; acc += real;
  if (acc >= 1 / FPS) { const dt = Math.min(acc, .25); acc = 0; step(dt); }
  rafId = requestAnimationFrame(loop);
}
function step(dt) {
  frame++;
  const mv = reduced ? 0 : 1;
  // 時間
  if (show.on) showStep(dt); else if (cineK > 0) setCine(cineK - dt * .6);
  if (T.target != null) {
    let d = T.target - T.t; if (d > .5) d -= 1; if (d < -.5) d += 1;
    if (Math.abs(d) < .004) { T.t = T.target; T.target = null; } else T.t = (T.t + Math.sign(d) * Math.min(Math.abs(d), dt * .12) + 1) % 1;
  } else if (T.auto && !T.dragging && !show.on) T.t = (T.t + dt / DAY_SEC) % 1;
  applyTime();
  // 天氣
  const key = WX_LIST[wxI][0];
  ['haze', 'storm', 'rain'].forEach(k => { const tg = key === k ? 1 : 0; wx[k] += (tg - wx[k]) * Math.min(1, dt * 1.1); if (Math.abs(tg - wx[k]) < .003) wx[k] = tg; });
  const grey = wx.rain;
  $('skyGrey').setAttribute('opacity', f1(grey * .5 * (1 - night * .6)));
  $('skyHaze').setAttribute('opacity', f1((wx.haze * .4 + wx.storm * .5) * (1 - night * .6)));
  $('hazeVeil').setAttribute('opacity', f1(wx.haze * .5 + wx.storm * .45));
  $('stormVeil').setAttribute('opacity', f1(wx.storm * .26 * (1 - night * .5)));
  $('sun').setAttribute('opacity', f1(1 - Math.max(grey * .7, wx.storm * .6, wx.haze * .3)));
  $('stars').setAttribute('opacity', f1(smooth(.6, 1, night) * (1 - Math.max(grey, wx.storm, wx.haze * .6) * .9)));
  if (mv) stars.forEach((s, i) => { if ((frame + i) % 6 === 0) s.el.setAttribute('opacity', f1(.5 + .5 * Math.sin(frame * .3 + s.ph))); });
  $('rain').setAttribute('opacity', f1(wx.rain));
  if (wx.rain > .02) {
    rainDrops.forEach(r => {
      r.y += r.sp * dt; r.x -= r.sp * .12 * dt;
      if (r.y > 600) { r.y = rand(-40, 0); r.x = rand(-100, 1700); }
      r.el.setAttribute('x1', f1(r.x)); r.el.setAttribute('y1', f1(r.y)); r.el.setAttribute('x2', f1(r.x - 3)); r.el.setAttribute('y2', f1(r.y + 16));

  }

    if (d.x < -40) { d.x = 1640; d.y = rand(40, 590); }
    d.el.setAttribute('transform', `translate(${f1(d.x)} ${f1(d.y)})`);
  });
  ambience();
  // 吊線雲朵晃動
  clouds.forEach(c => {
    c.sw *= .92;
    const a = mv * (Math.sin(frame / FPS * .8 + c.ph) * 1.5 + Math.sin(frame / FPS * 7) * c.sw * 10);
    c.x += mv * c.sp * dt * (1 + wx.storm * 4); if (c.x > 1700) c.x = -100;

  });
  // 海面閃光、視差
  if (mv) seaGlints.forEach((g, i) => { if ((frame + i) % 3 === 0) g.el.setAttribute('opacity', f1(.25 + .5 * Math.max(0, Math.sin(frame * .25 + g.ph)) * (1 - night * .6))); });
  $('farPx').setAttribute('transform', `translate(${f1(-mouse.dx * .5)} 0)`);
  // 風：棕櫚樹、旗子、陽傘
  gust = Math.max(0, gust - dt * .5);
  wind = .25 + wx.storm * 1.6 + wx.rain * .4 + gust;
  palms.forEach(p => {
    p.shake = Math.max(0, p.shake - dt * .8);
    const a = mv * (Math.sin(frame * .35 + p.ph) * (1.5 + wind * 4) * (p.big ? .5 : 1) + Math.sin(frame * 1.4) * p.shake * 12) - wx.storm * (p.big ? 5 : 10);
    p.crown.setAttribute('transform', `rotate(${f1(a)} ${p.x} ${p.y})`);
  });
  flags.forEach(f => f.el.setAttribute('transform', `translate(${f.x} ${f.y}) scale(${f1(1 - (mv ? Math.abs(Math.sin(frame * (.5 + wind * .4) + f.ph)) * .15 : 0))} 1) skewY(${f1(mv * Math.sin(frame * .6 + f.ph) * 4 * wind)})`));
  umbrellas.forEach(u => { u.sp = Math.max(0, u.sp - dt); const a = mv * (Math.sin(frame * .5) * wx.storm * 3 + Math.sin(frame * 1.6) * u.sp * 10); u.top.setAttribute('transform', `rotate(${f1(a)} ${u.x} ${u.y})`); });
  // 水：造浪池、滑道水流、大水桶、水槍
  stepWaves(dt);
  stepBucket(dt);
  stepCannons(dt);
  // 角色
  stepClimbers(dt); stepRiders(dt); stepPoolSwimmers(dt); stepSwimmers(dt); stepKids(dt); stepWalkers(dt); stepStatics(dt); stepFloaters(dt);
  sortList(walkers.concat(kids.filter(k => k.role === 'parent')), $('frontActors'));
  { const k = (Math.sin(frame / FPS * .25) + 1) / 2; monoTrain.setAttribute('transform', `translate(${f1(PALM.cx + 2 + k * 3)} ${f1(lerp(242, 330, k))})`); }
  stepBoats(dt); stepFlyers(dt); stepHeli(dt);
  stepFx(dt);
  // 燈光：夜色、窗、街燈、池底燈、帆船飯店外牆燈、滑道 LED
  $('veil').setAttribute('opacity', f1(clamp(night * .34 + grey * .08, 0, .6)));
  const lightOn = clamp(Math.max(nOn, grey * .3), 0, 1);
  winGlows.forEach(w => w.el.setAttribute('opacity', f1(lightOn * w.k)));
  lampGlows.forEach((l, i) => l.setAttribute('opacity', f1(lightOn * (i % 2 ? 1 : .85) * (mv && Math.random() < .02 ? .7 : 1))));
  const party = show.on === 'party';
  poolGlows.forEach(p => p.setAttribute('opacity', f1(nOn * (party ? .6 + .4 * Math.sin(frame * 1.2) : .75))));
  // 帆船飯店：夜裡外牆慢慢換顏色；派對時跟著節拍
  burjTimer += dt;
  if (burjTimer > 9 && !party) { burjTimer = 0; burjI = (burjI + 1) % BURJ_COLS.length; }
  burjFacade.setAttribute('fill', party && burjShowCol ? burjShowCol : BURJ_COLS[burjI]);
  burjFacade.setAttribute('opacity', f1(nOn * (party ? .25 + burjPulse * .4 : .4)));
  burjTopLight.setAttribute('opacity', f1(nOn * (frame % 12 < 6 ? 1 : .3)));
  // 滑道 LED：平常夜裡微亮；派對時一圈圈追逐並換色
  if (mv) ledChase += party ? 1 : .2;
  const pc = ['var(--led-1)', 'var(--led-2)', 'var(--led-3)', 'var(--led-4)'];
  SL.leds.forEach((l, i) => {
    let o = nOn * .35;
    if (party) { o = (Math.floor(l.i - ledChase) % 4 === 0) ? 1 : .35; if (frame % 6 === 0) l.el.setAttribute('fill', pc[(Math.floor(show.t / (4 * BEAT)) + (l.k === 'B' ? 1 : l.k === 'C' ? 2 : 0)) % 4]); }
    l.el.setAttribute('opacity', f1(o));
  });
  if (jbhSpark > 0) { jbhSpark -= dt; if (frame % 2) sparkle(rand(1440, 1590), rand(200, 340)); }
  // 對話泡泡
  bubbles.forEach(b => { b.t -= dt; if (b.t <= 0) b.g.remove(); else b.g.setAttribute('opacity', f1(Math.min(1, b.t / .3))); });
  for (let i = bubbles.length - 1; i >= 0; i--) if (bubbles[i].t <= 0) bubbles.splice(i, 1);
}

/* ---------------- ⑤ 互動：對話泡泡 ---------------- */
const bubbles = [];
function say(x, y, text, dur = 1.6) {
  const g = el('g', { class: 'bubble' }, $('bubbles'));
  const w = Math.min(560, [...text].reduce((s, ch) => s + (ch.charCodeAt(0) > 255 ? 15 : 8.4), 0) + 30);
  x = clamp(x, w / 2 + 16, 1600 - w / 2 - 16); y = clamp(y, 30, 560);
  const b = clay(g, {}, 'clayS');
  el('rect', { x: -w / 2, y: -18, width: w, height: 36, rx: 18, fill: '#fffaf0' }, b);
  el('path', { d: 'M-8 16 L0 28 L8 16Z', fill: '#fffaf0' }, b);
  const t = el('text', { x: 0, y: 0 }, g); t.textContent = text;
  g.setAttribute('transform', `translate(${f1(x)} ${f1(y)})`);
  bubbles.push({ g, t: reduced ? dur + 1 : dur });
  if (reduced) setTimeout(() => g.remove(), (dur + 1) * 1000);
}

  node.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); userGesture = true; ensureAudio(); fn(e); if (reduced) step(1 / FPS); } });
}

/* ---------------- ⑤ 互動：點擊 ---------------- */
function svgPoint(e) { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
svg.addEventListener('pointerdown', () => { userGesture = true; ensureAudio(); document.body.classList.remove('kbd'); });
window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
let lastRip = 0;
svg.addEventListener('pointermove', e => {
  const p = svgPoint(e);
  mouse.x = p.x; mouse.y = p.y; mouse.in = true; mouse.dx = (p.x - 800) / 800 * 12; mouse.t = performance.now();
  // 滑過水面留下漣漪
  if (performance.now() - lastRip > 120) {
    const inWave = p.y > WP.y0 + 4 && p.y < WP.y1 && (() => { const [a, b] = wpEdge(p.y); return p.x > a && p.x < b; })();
    const inSplash = p.x > 304 && p.x < 798 && p.y > 412 && p.y < 452;
    if (inWave || inSplash) { ripple(p.x, p.y); lastRip = performance.now(); }
  }
});
svg.addEventListener('pointerleave', () => { mouse.in = false; });

});

onAct(kiosk, () => { vendor.hop = 1; vendor.wave = 1; sfx(t => chime(t)); say(1314, 360, pick(['冰淇淋一支，粉紅莓果口味！', '卡拉克奶茶來囉，香料加很多', '天氣熱，來杯冰飲吧']), 1.8); });

onAct(tubeRack, () => { sfx(t => tok(t, 600)); say(689, 380, pick(['泳圈自由拿，滑完記得放回來', '紅黃藍綠粉，你要哪個顏色？']), 1.6); });
$('skyHit').addEventListener('click', e => {
  userGesture = true; ensureAudio();
  if (night > .5) seaplane();
  else if (Math.random() < .6) { gulls(4, e && svgPoint(e).x > 800 ? 1700 : -40); sfx(t => gullCry(t)); }

/* ---------------- ⑤ 互動：控制列 ---------------- */
function syncAuto() { $('btnAuto').setAttribute('aria-pressed', String(T.auto)); $('btnAuto').textContent = T.auto ? '自動播放中' : '自動播放'; }
function goTo(t) { if (reduced) { T.t = t; applyTime(true); step(1 / FPS); } else T.target = t; }
const tap = fn => () => { userGesture = true; ensureAudio(); setTimeout(() => { fn(); if (reduced) step(1 / FPS); }, actx && actx.state !== 'running' ? 120 : 0); };
$('btnWave').addEventListener('click', tap(() => startWave(false)));
$('btnParty').addEventListener('click', tap(() => startParty(false)));
$('btnWeather').addEventListener('click', () => {
  userGesture = true; ensureAudio();
  wxI = (wxI + 1) % WX_LIST.length;
  $('btnWeather').textContent = '天氣：' + WX_LIST[wxI][1];
  if (reduced) { ['haze', 'storm', 'rain'].forEach(k => { wx[k] = WX_LIST[wxI][0] === k ? 1 : 0; }); step(1 / FPS); }
});
$('btnSound').addEventListener('click', () => {
  soundOn = !soundOn; userGesture = true;
  $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  if (ensureAudio()) {
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.setValueAtTime(soundOn ? .5 : 0, actx.currentTime);
    if (!soundOn) { [musNode, sfxNode].forEach(n => { if (n) try { n.disconnect(); } catch (e) {} }); musNode = sfxNode = null; }
  }
  if (!soundOn) { try { window.sceneMusic && window.sceneMusic.stop(); } catch (e) {} }
});
$('btnDay').addEventListener('click', () => { T.auto = false; syncAuto(); goTo(11 / 24); });
$('btnNight').addEventListener('click', () => { T.auto = false; syncAuto(); goTo(21 / 24); });
$('btnAuto').addEventListener('click', () => { T.auto = !T.auto; T.target = null; syncAuto(); });
$('timeRange').addEventListener('input', e => {
  T.t = e.target.value / 1000; T.target = null; T.dragging = true; applyTime(true); T.dragging = false;
  if (reduced) step(1 / FPS);
});
function start() {
  cancelAnimationFrame(rafId);
  if (reduced) { T.auto = false; syncAuto(); applyTime(true); for (let i = 0; i < 12; i++) step(1 / FPS); }
  else { last = performance.now(); rafId = requestAnimationFrame(loop); }
}
mq.addEventListener?.('change', e => { reduced = e.matches; if (!reduced) { T.auto = true; syncAuto(); } start(); });

if (inPicks) {
  // 網站「作者精選」播放區：預設輪播「造浪池大浪」；不會自己出聲，打開配樂後每一輪都配上表演音樂
  let idle = 0;
  setTimeout(() => startWave(true), 800);
  setInterval(() => { if (!show.on) { idle += 1; if (idle >= 4) { idle = 0; startWave(true); } } else idle = 0; }, 1000);
  window.sceneMusic = {
    playing: false,
    start(c) {
      if (this.playing) return; this.playing = true; pickAudio = true; userGesture = true;
      if (c && c !== actx) useCtx(c); else ensureAudio();
      if (actx && actx.state !== 'running') actx.resume();
      if (show.on === 'wave' && show.t < 3 && actx) setTimeout(() => { if (audioOK()) waveMusic(actx.currentTime + .05); }, 60);
    },
    stop() {
      this.playing = false; pickAudio = false;
      [musNode, sfxNode].forEach(n => { if (n) try { n.disconnect(); } catch (e) {} }); musNode = sfxNode = null;
      [rainGain, windGain, poolGain, crowdGain].forEach(g => { if (g) g.gain.value = 0; });
    },
    duck() {}
  };
}
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on,
  btn: { wave: 'btnWave', party: 'btnParty' },
  ff: () => { show.cues = new Proxy({}, { get: () => 1 }); show.t = show.dur - .02; },   // 跳過剩下的橋段，直接收尾
  save: () => ({ ...T }),
  stop: () => endShow(),
  restore: s => { Object.assign(T, s); syncAuto(); applyTime(true); }
});
