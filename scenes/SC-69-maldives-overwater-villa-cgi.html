<html lang="zh-Hant">
<head>

<title>馬爾地夫水上屋的碧藍潟湖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-69 馬爾地夫水上屋的碧藍潟湖｜CGI 電影質感
   地點：印度洋・馬爾地夫環礁裡的一座度假島與它的潟湖。
   視角：電影常用的「半水上、半水下」分割鏡頭——
         鏡頭剛好貼在水面，上半部看到潟湖、度假島與水上屋，下半部看到透明海水裡的珊瑚礁。
         上半部：遠方是深藍色的外海，環礁的礁緣有一條白浪線；礁內是碧綠到淺藍的潟湖；
                 左邊是長滿椰子樹的度假島（白沙灘、茅草屋頂的海灘餐廳、遮陽傘）；
                 一條木棧道從島上彎彎地伸進潟湖，兩旁是一棟棟茅草屋頂、高腳柱的水上屋；
                 右後方是水上飛機的浮動碼頭；右前方是一棟最靠近鏡頭的水上屋陽台。
         下半部：淺藍透明的海水、水面的光紋、斜斜照下來的光束；
                 白沙海底、珊瑚礁丘（桌形軸孔珊瑚、腦紋珊瑚、柳珊瑚、鹿角珊瑚、海葵）。
   真實元素：馬爾地夫的水上屋（茅草屋頂、木棧道、陽台上的梯子可以直接下海）；
         多尼船（dhoni，船頭高高翹起的傳統木船）；雙水獺型的雙引擎浮筒水上飛機（只在白天飛）；
         透明獨木舟、立式划槳；浮潛客（面鏡、呼吸管、蛙鞋）；
         魚：烏尾鮗（藍色帶黃條紋的成群小魚）、馬爾地夫海葵魚（橘色、頭後一條白帶）、
         蝴蝶魚、角蝶魚（鐮魚）、鸚哥魚（會把珊瑚咬碎排出白沙）；
         花紋鷹鰩（背上白點、長尾巴）、沙地上的魟魚、黑鰭礁鯊、綠蠵龜、沙地上的花園鰻；
         夜晚水上屋的水下燈會引來黑鰭礁鯊、魟魚，有時還有鬼蝠魟；
         黃昏出海看飛旋海豚（會在空中旋轉）；傍晚從島上飛出的狐蝠；棧道上的蒼鷺；
         夜光海（海裡的發光浮游生物被浪打到時發出藍光）。
   風格重點：CGI 動畫電影的寬銀幕畫面——水面分割線上有彎曲的水膜與反光，
            水下有晃動的光紋與體積光束、越深越藍的空氣（水）透視；
            青橙調色、暗角、底片顆粒；滑鼠移動帶動多層視差；表演時上下出現寬銀幕黑邊、鏡頭緩緩推近。
   效能：不對大圖層做模糊；光暈一律用放射漸層。
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），部分另有 --k-名稱（晨昏）。
   JS 會依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）。
   ========================================================= */

  /* —— 天空、雲 —— */
  --d-sky-top:#2a7fd6;  --k-sky-top:#3b3f86;  --n-sky-top:#02060f;

  --d-uw-top:#46d6d8;   --k-uw-top:#4a9aa8;   --n-uw-top:#06283a;

  --d-clown:#ff7a1a;    --k-clown:#d0601a;    --n-clown:#2a1206;

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:6px;overflow:hidden;background:#000;line-height:0;box-shadow:0 18px 50px rgba(0,0,0,.55)}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:6px;padding:10px 14px}
.panel button{font:700 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:4px;padding:9px 14px;cursor:pointer;letter-spacing:.04em}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:#04161a}
.panel button.big{border-color:var(--ui-hot);color:#1a0c04;background:var(--ui-hot)}
.panel button.big2{border-color:var(--ui-hot2);color:#fff;background:var(--ui-hot2)}
.panel button:disabled{opacity:.45;cursor:default}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid #d8fbff;outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(220px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding:0;list-style:none;color:var(--page-muted);font-size:14px;line-height:1.8;display:flex;flex-wrap:wrap;gap:4px 22px}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .bubble path{fill:rgba(6,22,30,.84);stroke:rgba(170,240,255,.55);stroke-width:1}
#scene .bubble text{fill:#effcff;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .screen{mix-blend-mode:screen}
#scene .soft{mix-blend-mode:soft-light}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 舞台。圖層由遠到近：
       天空（星空、銀河、月亮、太陽、積雲、陣雨雲、軍艦鳥）→ 外海、礁緣白浪、遠方小島、潟湖水面
       → 度假島（沙灘、椰子樹、海灘餐廳、狐蝠）→ 水上飛機與浮動碼頭
       → 木棧道與水上屋（蒼鷺、散步的人）→ 潟湖上的船（多尼船、海豚、透明獨木舟、立式划槳）
       → 水下（光束、光紋、白沙、珊瑚礁丘、魚群、魟魚、鯊魚、海龜、花園鰻、浮潛客、水面分割線）
       → 前景：最近的一棟水上屋（陽台、梯子、高腳柱、水下燈）、左下角的珊瑚
       → 天氣（雨、閃電）→ 鏡頭效果（調色、暗角、顆粒、寬銀幕黑邊）
       大部分的物件由下方 JS 產生，這裡只放骨架與漸層。
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" role="img" aria-label="馬爾地夫：鏡頭貼著水面，上半部是碧藍潟湖、椰子樹度假島與茅草屋頂的水上屋，下半部是透明海水裡的珊瑚礁、魚群和魟魚">
    <defs>
      <!-- 天空 -->
      <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-top)"/><stop offset=".6" style="stop-color:var(--sky-mid)"/><stop offset="1" style="stop-color:var(--sky-low)"/>
      </linearGradient>
      <radialGradient id="sunGlow"><stop offset="0" stop-color="#fff6e0" stop-opacity=".95"/><stop offset=".12" stop-color="#ffe0a8" stop-opacity=".6"/><stop offset=".4" stop-color="#ffb070" stop-opacity=".2"/><stop offset="1" stop-color="#ffb070" stop-opacity="0"/></radialGradient>
      <radialGradient id="sunWash" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffb060" stop-opacity=".6"/><stop offset=".5" stop-color="#ff8a60" stop-opacity=".2"/><stop offset="1" stop-color="#ff8a60" stop-opacity="0"/></radialGradient>

<script id="showstop">
/* =========================================================

       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾

})();

/* 角度都從「正下方」算起，往 +x（面向的方向）轉為正；t 是軀幹前傾的角度（0＝站直、90＝趴平、-90＝仰躺） */

let lightK = 0, sunVis = 0, moonX = 0, moonY = 0, moonUp = 0, bioK = 0;
function applyColors(force) {
  const key = Math.round(T.t * 1440);
  if (!force && key === lastColor) return;
  lastColor = key;
  const h = hourNow = T.t * 24;
  night = clamp(1 - smooth(5.5, 6.5, h) + smooth(18.35, 19.3, h), 0, 1);
  dusk = Math.max(Math.exp(-Math.pow((h - 6.15) / .55, 2)), Math.exp(-Math.pow((h - 18.2) / .7, 2)));
  for (const k in PAIRS) {
    const Pp = PAIRS[k];
    let c = mix(Pp.d, Pp.n, night);
    if (Pp.k) c = mix(c, Pp.k, dusk * .85 * (1 - wx.cloud * .45));
    root.style.setProperty('--' + k, rgba(c));
  }
  placeSunMoon();
  $('clock').textContent = clockText();
  if (!T.dragging) $('timeRange').value = Math.round(T.t * 1000);
  lighting();
}
function clockText() { const m = Math.floor(T.t * 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
function placeSunMoon() {
  const h = hourNow;
  // 太陽從左邊升起、劃過天空，傍晚落進右前方的海平線
  const q = (h - SUNRISE) / (SUNSET - SUNRISE);
  sunX = lerp(150, 1080, q); sunY = HZ + 6 - Math.sin(clamp(q, 0, 1) * Math.PI) * 420;
  sunUp = q > -.02 && q < 1.02 ? 1 : 0;
  $('sunG').setAttribute('transform', `translate(${f1(sunX)} ${f1(sunY)})`);
  $('sunG').style.display = sunUp ? '' : 'none';
  $('sunG').setAttribute('opacity', f2(1 - wx.cloud * .85));
  $('sunWashE').setAttribute('cx', f1(sunX)); $('sunWashE').setAttribute('cy', f1(sunY + 10));
  // 月亮：入夜後從左邊升起，往右走
  const mp = ((h - 18.9 + 24) % 24) / 11;
  moonX = lerp(160, 1460, mp); moonY = HZ - Math.sin(clamp(mp, 0, 1) * Math.PI) * 290;
  moonUp = mp > 0 && mp < 1 ? 1 : 0;
  $('moonG').setAttribute('transform', `translate(${f1(moonX)} ${f1(moonY)})`);
  $('moonG').style.display = moonUp ? '' : 'none';
  $('moonG').setAttribute('opacity', f2(1 - wx.cloud * .85));
}
function lighting() {

}

let waveA = 1;
