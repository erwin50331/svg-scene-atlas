<!doctype html>

<head>
<meta charset="utf-8">

<title>SC-15 洛磯山雪鎮</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* =========================================================
   SC-15 洛磯山雪鎮｜像素風格（加拿大）
   【色票 token】所有顏色集中在這裡。
   - 場景色成對出現：--名稱-day / --名稱-night，
     JS 會自動找出所有成對色，依「日夜比例」混色後輸出 --名稱，
     並產生 .f-名稱（填色）class 給 SVG 使用。
   - 「常亮光源」不參與混色（窗光、路燈、車燈、極光、營火、彩燈）。
   換色時只需改這個區塊。
   像素格：P = 4px（JS 開頭可改），所有物件都對齊格線。
   ========================================================= */
:root{
  color-scheme:dark;

  /* ---- 頁面外框 ---- */
  --page-bg:#10162a;
  --page-panel:#1c2540;
  --page-fg:#eef2fa;
  --page-dim:#a3abc4;
  --page-line:#34416e;
  --page-accent:#7ef0b8;
  --font-display:"DotGothic16","Noto Sans TC",monospace;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;

  /* ---- 天空、雲 ---- */
  --sky-top-day:#5ea9e8;    --sky-top-night:#050920;
  --sky-bot-day:#d9f0ff;    --sky-bot-night:#1b2a5e;
  --cloud-day:#f6f9ff;      --cloud-night:#2a3466;
  --cloud-sh-day:#c9d8ec;   --cloud-sh-night:#1d2550;

  /* ---- 洛磯山（遠山、中景山、滑雪山） ---- */
  --rock1-day:#6c7ea8;      --rock1-night:#18203f;
  --rock1-hi-day:#8ea0c8;   --rock1-hi-night:#232c56;
  --snow1-day:#f4f8ff;      --snow1-night:#8392c4;
  --snow1-sh-day:#c2d2ec;   --snow1-sh-night:#55629a;
  --rock2-day:#55688e;      --rock2-night:#131a38;
  --rock2-hi-day:#7488ae;   --rock2-hi-night:#1d2550;
  --snow2-day:#eaf2ff;      --snow2-night:#7685b6;
  --snow2-sh-day:#b6c6e2;   --snow2-sh-night:#4a568c;
  --hill-day:#eef5ff;       --hill-night:#7584b4;
  --hill-sh-day:#bfd1ea;    --hill-sh-night:#4b5788;

  /* ---- 松樹 ---- */
  --pine1-day:#1e4c3d;      --pine1-night:#07141d;
  --pine2-day:#2f6b4f;      --pine2-night:#0d2028;
  --pine-snow-day:#f4f8ff;  --pine-snow-night:#7e8ec0;
  --trunk-day:#5a3b26;      --trunk-night:#1e1419;

  /* ---- 地面雪、湖冰、道路 ---- */
  --snow-day:#f7fbff;       --snow-night:#8b99c8;
  --snow-sh-day:#d2def0;    --snow-sh-night:#5d699c;
  --snow-dk-day:#a9bad8;    --snow-dk-night:#414c7c;
  --ice-day:#a8dcf0;        --ice-night:#2c4c84;
  --ice-hi-day:#e2f6ff;     --ice-hi-night:#5a7ab4;
  --ice-dk-day:#7cbad6;     --ice-dk-night:#203c6c;
  --road-day:#8d95a8;       --road-night:#252a45;
  --road-dk-day:#717a8e;    --road-dk-night:#1a1e36;
  --road-hi-day:#c3cad8;    --road-hi-night:#3d4466;
  --line-day:#e8c44a;       --line-night:#5c5230;

  /* ---- 建築 ---- */
  --log-day:#9a6034;        --log-night:#392321;
  --log-dk-day:#6c3e20;     --log-dk-night:#25161a;
  --log-end-day:#d49b5f;    --log-end-night:#59392c;
  --wall2-day:#3f6f8f;      --wall2-night:#15253b;
  --wall2-dk-day:#2f566f;   --wall2-dk-night:#0e192b;
  --wall3-day:#ece0c4;      --wall3-night:#575270;
  --wall3-dk-day:#cbb998;   --wall3-dk-night:#433f5a;
  --timber-day:#6a3f2a;     --timber-night:#23151b;
  --wall4-day:#c85a4a;      --wall4-night:#481f2e;
  --wall4-dk-day:#9e4234;   --wall4-dk-night:#35151e;
  --roof-day:#46506a;       --roof-night:#15192d;
  --roof-dk-day:#30384e;    --roof-dk-night:#0d1021;
  --roof-red-day:#9a3030;   --roof-red-night:#2f1019;
  --trim-day:#f4ead6;       --trim-night:#6c6686;
  --glass-day:#8fc3dc;      --glass-night:#1b274f;
  --door-day:#7a4a2a;       --door-night:#29191c;
  --stone-day:#9b9ba8;      --stone-night:#35374f;
  --stone-dk-day:#74747f;   --stone-dk-night:#23253a;
  --metal-day:#9aa3ad;      --metal-night:#343a54;
  --metal-dk-day:#5d6470;   --metal-dk-night:#1d2136;
  --concrete-day:#c6c8ce;   --concrete-night:#3d3f58;
  --concrete-dk-day:#9a9ca5;--concrete-dk-night:#2b2d44;
  --awning-r-day:#d8433b;   --awning-r-night:#581c24;
  --awning-w-day:#f6f0e4;   --awning-w-night:#69657f;
  --sign-bg-day:#3a2a20;    --sign-bg-night:#191115;
  --sign-fg-day:#f6e6c0;    --sign-fg-night:#c9b27a;
  --mailbox-day:#d6352f;    --mailbox-night:#55161c;
  --bench-day:#8a5a34;      --bench-night:#32222e;
  --bread-day:#d9a05a;      --bread-night:#5c4230;
  --flag-r-day:#e0342c;     --flag-r-night:#6a1c22;
  --flag-w-day:#ffffff;     --flag-w-night:#8a8aa6;
  --xing-day:#f2c53d;       --xing-night:#6a5a26;

  /* ---- 人物、動物 ---- */
  --skin-day:#f2c49b;       --skin-night:#8e7378;
  --skin2-day:#b07a52;      --skin2-night:#5a4048;
  --hair-day:#3b2a25;       --hair-night:#130e18;
  --ink-day:#222034;        --ink-night:#05050f;
  --coat1-day:#d9443a;      --coat1-night:#591e2a;
  --coat2-day:#2f9a8a;      --coat2-night:#143c40;
  --coat3-day:#f2b73a;      --coat3-night:#6a5022;
  --coat4-day:#7a58b8;      --coat4-night:#2e2350;
  --coat5-day:#2b4a8a;      --coat5-night:#101c3c;
  --coat6-day:#3f8a4a;      --coat6-night:#16331e;
  --hat1-day:#f2f2f2;       --hat1-night:#7a7a94;
  --hat2-day:#e0623a;       --hat2-night:#5a2a2a;
  --hat3-day:#4ab0e0;       --hat3-night:#1a405a;
  --pants-day:#3a4260;      --pants-night:#111427;
  --boots-day:#5a3a2a;      --boots-night:#1a1117;
  --mitt-day:#f0d040;       --mitt-night:#6a5a2a;
  --dog-day:#c48a4a;        --dog-night:#4a3030;
  --elk-day:#8a5a36;        --elk-night:#32201c;
  --elk-dk-day:#583820;     --elk-dk-night:#1f140f;
  --elk-lt-day:#d0a878;     --elk-lt-night:#4a3a30;
  --antler-day:#e6d3a8;     --antler-night:#6a6050;
  --goose-day:#4a4440;      --goose-night:#16141c;
  --goose-lt-day:#d8d0c4;   --goose-lt-night:#5a5868;

  /* ---- 交通工具 ---- */
  --car1-day:#c8323a;       --car1-night:#4a1820;
  --car2-day:#2f5fa8;       --car2-night:#142448;
  --car3-day:#e6e6ec;       --car3-night:#565a74;
  --bus-day:#3a8a6a;        --bus-night:#163a30;
  --bus-band-day:#f2efe2;   --bus-band-night:#5a5a70;
  --plow-day:#f08a24;       --plow-night:#5a3214;
  --blade-day:#f2c53d;      --blade-night:#6a5a26;
  --tire-day:#22242e;       --tire-night:#07080f;
  --cabin-day:#d8433b;      --cabin-night:#5a1c24;
  --ski1-day:#e0342c;       --ski1-night:#5a1c22;
  --ski2-day:#3a9ae0;       --ski2-night:#163a5a;
  --ski3-day:#f2d24a;       --ski3-night:#6a5a26;
  --smoke-day:#eef2f8;      --smoke-night:#6a7398;

  /* ---- 常亮光源（不隨日夜混色） ---- */
  --win-on:#ffd27a;      /* 窗光 */
  --lamp:#ffe08a;        /* 路燈 */
  --headlight:#fff6c8;   /* 車頭燈 */
  --beam:#fff2b0;        /* 車燈光束 */
  --tail:#ff3b3b;        /* 車尾燈 */
  --beacon:#ffae00;      /* 剷雪車警示燈 */
  --fire1:#ff5a1a; --fire2:#ffb83a; --fire3:#fff1a8; /* 營火 */
  --aur1:#46f5a0; --aur2:#c4ffe2; --aur3:#c064ff;    /* 極光 */
  --bulb1:#ff5a5a; --bulb2:#ffd24a; --bulb3:#5ad1ff; --bulb4:#7cff7a; /* 彩燈 */
  --star:#ffffff;
  --dusk:#ff9a6a;        /* 晨昏地平線 */
  --sun:#fff3b0;  --sun-rim:#ffcf55;
  --moon:#f2f0dc; --moon-sh:#c9c6b0;
  --carrot:#ff8a1a;      /* 雪人鼻子 */
}

/* ===== 頁面版面 ===== */
html,body{margin:0;background:var(--page-bg);color:var(--page-fg)}
body{font-family:var(--font-body);line-height:1.6}
.wrap{max-width:1680px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(1.4rem,2.6vw,2rem);margin:0;letter-spacing:.06em;text-wrap:balance}
h1 small{font-size:.6em;color:var(--page-accent);letter-spacing:.12em;margin-right:.6em}
.meta{color:var(--page-dim);font-size:.9rem;margin:0}
.stage{position:relative;overflow:hidden;background:#000;
  box-shadow:0 0 0 4px var(--page-line),0 0 0 8px #0a0e1c,0 18px 40px -18px #000}
.stage svg{display:block;width:100%;height:auto;max-width:100%;touch-action:manipulation;image-rendering:pixelated}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
/* 像素按鈕：用階梯狀陰影做出 8-bit 邊框 */
.controls button{font:1rem/1 var(--font-display);color:var(--page-fg);background:var(--page-panel);
  border:0;padding:12px 16px;cursor:pointer;
  box-shadow:0 -4px 0 0 var(--page-line),0 4px 0 0 var(--page-line),-4px 0 0 0 var(--page-line),4px 0 0 0 var(--page-line),0 8px 0 0 #080b16;
  margin:4px;transition:transform .08s}
.controls button:hover{background:#26315a}
.controls button:active{transform:translateY(4px);box-shadow:0 -4px 0 0 var(--page-line),0 4px 0 0 var(--page-line),-4px 0 0 0 var(--page-line),4px 0 0 0 var(--page-line)}
.controls button:focus-visible{outline:4px solid var(--page-accent);outline-offset:6px}
.controls button[aria-pressed="true"]{color:var(--page-accent)}
.clock{margin-left:auto;font-family:var(--font-display);font-size:1.05rem;color:var(--page-dim);font-variant-numeric:tabular-nums}
.hint{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px 20px;color:var(--page-dim);font-size:.88rem}
.hint b{color:var(--page-fg);font-weight:500;margin-right:.4em}

/* ===== SVG 內樣式 ===== */
.px-txt{font-family:var(--font-display);fill:var(--sign-fg)}
.c-win{fill:var(--win-on)} .c-lamp{fill:var(--lamp)} .c-head{fill:var(--headlight)} .c-beam{fill:var(--beam)}
.c-tail{fill:var(--tail)} .c-beacon{fill:var(--beacon)}
.c-fire1{fill:var(--fire1)} .c-fire2{fill:var(--fire2)} .c-fire3{fill:var(--fire3)}
.c-aur1{fill:var(--aur1)} .c-aur2{fill:var(--aur2)} .c-aur3{fill:var(--aur3)}
.c-bulb1{fill:var(--bulb1)} .c-bulb2{fill:var(--bulb2)} .c-bulb3{fill:var(--bulb3)} .c-bulb4{fill:var(--bulb4)}
.c-star{fill:var(--star)} .c-dusk{fill:var(--dusk)}
.c-sun{fill:var(--sun)} .c-sunrim{fill:var(--sun-rim)} .c-moon{fill:var(--moon)} .c-moonsh{fill:var(--moon-sh)}
.c-carrot{fill:var(--carrot)}
.lit{fill:var(--win-on);opacity:0}
.lit.on{opacity:var(--lit,.1)}
[data-act]{cursor:pointer}
.deco{pointer-events:none}
.bubble{pointer-events:none}
.bubble rect.bg{fill:#fffdf3} .bubble rect.bd{fill:#222034}
.bubble text{font-family:var(--font-display);font-size:18px;fill:#222034}

/* ===== 減少動態 ===== */
@media (prefers-reduced-motion: reduce){
  .controls button{transition:none}
}
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>
</head>
<body>
<main class="wrap">

  <div class="stage">
  <!-- =====================================================
       【場景】SVG 主舞台 viewBox 1600×600
       圖層由後到前：天空 → 晨昏 → 星星 → 極光 → 日月 → 雲 → 遠山
       → 中景山 → 滑雪山（纜車、滑雪客） → 雁群 → 松林 → 冰湖與溜冰者
       → 營火 → 建築 → 人行道道具 → 後排行人 → 煙 → 道路與車輛
       → 剷雪噴雪 → 前景雪堤 → 腳印 → 雪人 → 前排行人與麋鹿
       → 前景松樹、路燈 → 飄雪 → 對話泡泡
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" shape-rendering="crispEdges" role="img" aria-label="加拿大洛磯山腳下的雪景小鎮，有木屋咖啡店、旅館、麵包店、纜車與結冰湖面，行人、車輛與麋鹿往來，可切換白天與夜晚，夜晚有極光">
    <defs></defs>

    <!-- 天空（色帶 + 抖色，JS 生成） -->
    <g id="sky" class="deco"></g>
    <g id="dusk" class="deco"></g>
    <g id="stars" class="deco"></g>
    <!-- 【動畫】極光 -->
    <g id="aurora" class="deco"></g>
    <g id="sun" class="deco"></g>
    <g id="moon" class="deco"></g>
    <g id="clouds" class="deco"></g>

    <!-- 遠山、中景山（JS 生成） -->
    <g id="mtnFar" class="deco"></g>
    <g id="mtnMid" class="deco"></g>
    <!-- 滑雪山、纜車、滑雪客 -->
    <g id="skiHill" class="deco"></g>
    <g id="skiers" class="deco"></g>
    <g id="cable" class="deco"></g>
    <g id="gondolas"></g>

    <!-- 【動畫】雁群、流星 -->
    <g id="birds" class="deco"></g>

    <!-- 山腳松林 -->
    <g id="forest" class="deco"></g>

    <!-- 冰湖（點湖面：打冰球）與溜冰者 -->
    <g id="lake"></g>
    <g id="skaters"></g>
    <g id="firepit"></g>

    <!-- 【場景】建築：木屋咖啡、登山用品店、旅館、麵包店、纜車站 -->
    <g id="buildings"></g>
    <g id="backProps"></g>
    <!-- 【角色】後排人行道行人 -->
    <g id="backPeople"></g>
    <!-- 【動畫】煙囪煙、呼氣、排氣 -->
    <g id="smoke" class="deco"></g>

    <!-- 道路與車輛 -->
    <g id="road" class="deco"></g>
    <g id="farLane"></g>
    <g id="nearLane"></g>
    <g id="spray" class="deco"></g>

    <!-- 前景雪堤、腳印 -->
    <g id="frontBank" class="deco"></g>
    <g id="prints" class="deco"></g>
    <g id="frontProps"></g>
    <!-- 【角色】前排行人、麋鹿 -->
    <g id="elkLayer"></g>
    <g id="frontPeople"></g>
    <g id="frontTrees"></g>

    <!-- 【動畫】飄雪、松樹抖落的雪、泡泡 -->
    <g id="snowfall" class="deco"></g>
    <g id="chunks" class="deco"></g>

function profile(points, step, noise, seed) {

    const l = rect(-6, 12, 12, 8, "lit on", cg);
    gondolas.push({ g: cg, u: i / 3 });
  }
})();
function updateGondolas(dt, moving) {
  for (const G of gondolas) {
    if (moving) G.u = (G.u + dt * .025) % 2;
    let x, y;
    if (G.u < 1) { x = lerp(CABLE_A[0], CABLE_B[0], G.u); y = lerp(CABLE_A[1], CABLE_B[1], G.u); }
    else { const k = 2 - G.u; x = lerp(CABLE_A[0], CABLE_B[0], k) + CABLE_OFF[0]; y = lerp(CABLE_A[1], CABLE_B[1], k) + CABLE_OFF[1]; }
    G.g.setAttribute("transform", `translate(${snap(x)},${snap(y)})`);
  }
}
const skiers = [];
(function buildSkiers() {
  for (let i = 0; i < 4; i++) {
    const g = el("g", {}, $("skiers"));
    rect(0, -12, P, P, "skin", g); rect(-P, -8, P * 2, 8, COATS[i], g); rect(-P * 2, 0, P * 4, P, "ink", g);
    skiers.push({ g, s: i / 4, sp: rand(.05, .08), ph: rand(0, 6) });
  }
})();
function updateSkiers(dt, moving) {
  for (const S of skiers) {
    if (moving) { S.s += S.sp * dt; if (S.s > 1) { S.s = 0; S.sp = rand(.05, .08); } }
    const x = 1500 - 170 * S.s + 26 * Math.sin(S.s * Math.PI * 7 + S.ph), y = 180 + 250 * S.s;
    S.g.setAttribute("transform", `translate(${snap(x)},${snap(y)})`);
    S.g.setAttribute("opacity", S.s > .94 ? 0 : 1);
  }
}

/* =========================================================
   【動畫】雁群、流星、對話泡泡
   ========================================================= */
const flocks = [], meteors = [];
const GOOSE_A = ["k...d...", ".ddddddl", "....d..."], GOOSE_B = ["....d...", "kddddddl", "...d...."];
function spawnFlock(y) {
  const g = el("g", {}, $("birds"));
  const birds = [];
  for (let i = 0; i < 7; i++) {
    const row = Math.ceil(i / 2), side = i % 2 ? -1 : 1;
    const bg = el("g", { transform: `translate(${-row * 28},${i === 0 ? 0 : side * row * 14})` }, g);
    const a = sprite(GOOSE_A, { k: "ink", d: "goose", l: "goose-lt" }, bg, 0, 0), b = sprite(GOOSE_B, { k: "ink", d: "goose", l: "goose-lt" }, bg, 0, 0);
    b.setAttribute("visibility", "hidden");
    birds.push({ a, b, ph: i * .3 });
  }
  flocks.push({ g, birds, x: -40, y: clamp(y, 40, 260), t: 0 });
}
function updateFlocks(dt) {
  for (let i = flocks.length - 1; i >= 0; i--) {
    const F = flocks[i]; F.t += dt; F.x += 110 * dt;
    F.g.setAttribute("transform", `translate(${snap(F.x)},${snap(F.y + Math.sin(F.t) * 6)})`);
    F.birds.forEach(B => { const up = Math.sin(F.t * 9 + B.ph) > 0; B.a.setAttribute("visibility", up ? "visible" : "hidden"); B.b.setAttribute("visibility", up ? "hidden" : "visible"); });
    if (F.x > 1800) { F.g.remove(); flocks.splice(i, 1); }
  }
}
function shootingStar(x, y) {
  const g = el("g", {}, $("birds"));
  for (let i = 0; i < 9; i++) rect(-i * P * 2, -i * P, P * 2, P, "c-star", g).setAttribute("opacity", (1 - i / 9).toFixed(2));
  meteors.push({ g, x: x ?? rand(300, 1300), y: y ?? rand(20, 140), t: 0 });
}
function updateMeteors(dt) {
  for (let i = meteors.length - 1; i >= 0; i--) {
    const M = meteors[i]; M.t += dt; M.x += 520 * dt; M.y += 260 * dt;
    M.g.setAttribute("transform", `translate(${snap(M.x)},${snap(M.y)})`);
    M.g.setAttribute("opacity", Math.max(0, 1 - M.t / .9).toFixed(2));
    if (M.t > .9) { M.g.remove(); meteors.splice(i, 1); }
  }
}
const bubbles = [];
function bubble(x, y, text) {
  const g = el("g", { class: "bubble" }, $("fx"));
  const tw = [...text].reduce((s, c) => s + (c.charCodeAt(0) > 255 ? 18 : 10), 0);
  const w = snap(tw + 24), h = 32;
  const bx = clamp(snap(x - w / 2), 8, 1592 - w), by = clamp(snap(y - h - 16), 8, 560);
  el("rect", { x: bx - P, y: by, width: w + P * 2, height: h, class: "bd" }, g);
  el("rect", { x: bx, y: by - P, width: w, height: h + P * 2, class: "bd" }, g);
  el("rect", { x: bx, y: by, width: w, height: h, class: "bg" }, g);
  const tx = clamp(snap(x), bx + 8, bx + w - 12);
  el("rect", { x: tx, y: by + h + P, width: P * 2, height: P, class: "bd" }, g);
  el("rect", { x: tx, y: by + h, width: P * 2, height: P, class: "bg" }, g);
  const t = el("text", { x: bx + w / 2, y: by + 22, "text-anchor": "middle" }, g); t.textContent = text;
  bubbles.push({ g, t: 0 });
}
function updateBubbles(dt) {
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const B = bubbles[i]; B.t += dt;
    if (B.t > 2.4) { B.g.remove(); bubbles.splice(i, 1); }
  }
}

/* =========================================================
   【動畫】日夜循環
   phase：0 = 正午、0.25 = 黃昏、0.5 = 午夜、0.75 = 清晨
   ========================================================= */
const RM_QUERY = matchMedia("(prefers-reduced-motion: reduce)");
let reduced = RM_QUERY.matches;
let phase = 0.92;            // 初始：上午十點
let auto = !reduced;
let tween = null;
const CYCLE = 100;           // 自動循環一圈秒數
const nightOf = p => clamp(.5 - .9 * Math.cos(p * Math.PI * 2), 0, 1);
function clockText(p) {
  const mins = Math.floor(((12 + p * 24) % 24) * 60), h = Math.floor(mins / 60), m = mins % 60;
  const name = h < 5 ? "深夜" : h < 7 ? "清晨" : h < 11 ? "上午" : h < 13 ? "中午" : h < 17 ? "下午" : h < 19 ? "黃昏" : h < 23 ? "夜晚" : "深夜";
  return { h, m, s: `${String(h).padStart(2, "0")}:${String(Math.floor(m / 5) * 5).padStart(2, "0")} ${name}` };
}
let lastClockKey = "";
function updateSky(p, n) {
  const a = p * Math.PI * 2, c = Math.cos(a);
  const sx = 800 + 700 * Math.sin(a), sy = 420 - 330 * c;
  const mx = 800 - 700 * Math.sin(a), my = 420 + 330 * c;
  $("sun").setAttribute("transform", `translate(${snap(sx)},${snap(sy)})`);
  $("moon").setAttribute("transform", `translate(${snap(mx)},${snap(my)})`);
  $("dusk").setAttribute("opacity", clamp(1 - Math.abs(c) / .45, 0, 1).toFixed(3));
  const ck = clockText(p), key = ck.h + ":" + Math.floor(ck.m / 5);
  if (key !== lastClockKey) {
    lastClockKey = key; $("clock").textContent = ck.s;
    clockHands.innerHTML = "";
    const cx = 884, cy = 184, ha = ((ck.h % 12) + ck.m / 60) / 12 * Math.PI * 2, ma = ck.m / 60 * Math.PI * 2;
    pixLine(cx, cy, cx + Math.sin(ma) * 11, cy - Math.cos(ma) * 11, "ink", clockHands);
    pixLine(cx, cy, cx + Math.sin(ha) * 7, cy - Math.cos(ha) * 7, "timber", clockHands);
    thermo.textContent = (n > .5 ? "-18" : n > .2 ? "-12" : "-8") + "°";
  }
  document.querySelectorAll(".nightOnly").forEach(e => e.setAttribute("opacity", (n * (+e.dataset.o || .14)).toFixed(3)));
}

/* =========================================================
   主迴圈
   ========================================================= */
let wind = .2, windTarget = .2, pointerIn = false;
let last = performance.now(), t = 0, vehT = 2, walkT = 2, smokeT = 0, plowT = 45;

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;

  // --- 日夜 ---
  if (tween) {
    tween.t += dt / (reduced ? .001 : 1.8);
    const k = Math.min(1, tween.t), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    phase = tween.from + (tween.to - tween.from) * e;
    if (k >= 1) { tween = null; phase %= 1; }
  } else if (auto && !reduced) phase = (phase + dt / CYCLE) % 1;
  const n = nightOf(phase);
  applyNight(n);
  updateSky(phase, n);
  auroraBoost = Math.max(0, auroraBoost - dt * .25);
  updateAurora(reduced ? 0 : t, n);

  // --- 風：滑鼠控制，沒滑鼠時自己飄 ---
  if (!pointerIn) windTarget = .2 + Math.sin(t * .2) * .5;
  wind += (windTarget - wind) * Math.min(1, dt * 2.5);

  // --- 燈光（含閃爍）、彩燈、營火 ---
  for (const L of lamps) {
    if (L.flick && !reduced) { if (Math.random() < dt * .4) L.f = .15; L.f += (1 - L.f) * dt * (L.f < .5 && Math.random() < .5 ? 1 : 6); }
    const on = L.on ? L.f : 0;
    L.glow.setAttribute("opacity", (n * on).toFixed(3));
    L.bulb.setAttribute("class", L.on && L.f > .5 ? "c-lamp" : "f-metal");
  }
  for (const b of bulbs) b.el.setAttribute("opacity", reduced ? (.5 + .5 * n).toFixed(2) : ((.35 + .65 * n) * (.55 + .45 * Math.sin(t * 2.4 + b.ph))).toFixed(2));
  fire.glow.setAttribute("opacity", (.3 + .7 * n).toFixed(2));
  if (!reduced) {
    fire.flames.forEach((f, i) => { const h = snap(6 + 10 * Math.abs(Math.sin(t * 7 + i * 1.7))); f.setAttribute("y", 448 - h); f.setAttribute("height", h); });
  }
  for (const s of stars) if (!reduced) s.s.setAttribute("opacity", (s.base * (.65 + .35 * Math.sin(t * 2 + s.ph))).toFixed(2));
  for (const s of sparkles) s.s.setAttribute("opacity", reduced ? 0 : ((1 - n) * Math.max(0, Math.sin(t * 1.6 + s.ph * 3))).toFixed(2));

  // --- 國旗飄動 ---
  flagCols.forEach((c, i) => c.setAttribute("transform", `translate(0,${reduced ? 0 : snap(Math.sin(t * 5 - i * .7) * (2 + Math.abs(wind) * 3) * (i / 12))})`));

  if (!reduced) {
    // 雲
    for (const c of clouds) {
      c.x += (c.sp * 6 + wind * 12) * dt;
      if (c.x > 1700) c.x = -c.w - 20; if (c.x < -c.w - 40) c.x = 1690;
      c.g.setAttribute("transform", `translate(${snap(c.x)},${c.y})`);
    }
    // 煙囪
    smokeT -= dt;
    if (smokeT <= 0) { smokeT = .3; for (const C of chimneys) if (Math.random() < C.rate * .6) puff(C.x + rand(-2, 2), C.y, 8, 4, 4, -18, .55); }
    // 車
    vehT -= dt;
    if (vehT <= 0) { vehT = rand(3, 7); spawnVehicle(); }
    plowT -= dt;
    if (plowT <= 0) { plowT = rand(70, 110); pendingPlow = 1; }
    updateVehicles(dt, n, t);
    // 行人
    walkT -= dt;
    if (walkT <= 0) {
      walkT = rand(2.5, 5);
      const front = Math.random() < .55, dir = Math.random() < .5 ? 1 : -1;
      if (walkers.filter(w => w.front === front).length < (front ? 5 : 6)) addWalker(front ? "front" : "back", dir > 0 ? -40 : 1640, dir);
    }
    updateWalkers(dt);
    updateElk(dt);
    updateSnow(dt, t);
    updatePuffs(dt);
    updateBits(dt);
    updateFlocks(dt);
    updateMeteors(dt);
    for (const p of prints) if (p.life > 0) { p.life -= dt; p.el.setAttribute("opacity", Math.max(0, p.life / 12).toFixed(2)); }
    // 松樹搖晃
    for (const T of frontPines) if (T.shake > 0) { T.shake -= dt; T.crown.setAttribute("transform", `translate(${T.shake > 0 ? snap(Math.sin(T.shake * 40) * 4) : 0},0)`); }
    // 冰球
    if (puck.t >= 0) {
      puck.t += dt * 1.1;
      const k = Math.min(1, puck.t);
      puck.x = lerp(puck.sx, puck.tx, k); puck.y = lerp(puck.sy, puck.ty, k);
      if (k >= 1) { puck.t = -1; bubble(netX + 40, 370, "進球！"); setTimeout(() => { puck.x = 92; puck.y = 444; }, 900); }
    }
  }
  puck.el.setAttribute("x", snap(puck.x)); puck.el.setAttribute("y", snap(puck.y) - P);
  updateSkaters(dt, !reduced);
  updateGondolas(dt, !reduced);
  updateSkiers(dt, !reduced);
  updateBubbles(dt);
  requestAnimationFrame(frame);
}

/* =========================================================
   【互動】滑鼠、點擊、按鈕
   ========================================================= */
function svgPoint(evt) {
  const p = svg.createSVGPoint(); p.x = evt.clientX; p.y = evt.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
svg.addEventListener("pointermove", e => { pointerIn = true; windTarget = (svgPoint(e).x / 1600 - .5) * 2.4; });
svg.addEventListener("pointerleave", () => { pointerIn = false; });
function callPlow() {
  if (vehicles.some(V => V.kind === "plow")) { bubble(800, 440, "剷雪車已經在路上了"); return; }
  if (reduced) { const V = spawnVehicle("plow"); if (V) { V.x = 700; drawVehicle(V); } return; }
  pendingPlow = 1;
  bubble(160, 470, "剷雪車出動！");
}
const ACT = {
  win: g => g._lit.classList.toggle("on"),
  lamp: g => { g._obj.on = !g._obj.on; },
  pine: (g, p) => {
    const T = g._obj; T.shake = .6;
    if (!reduced) for (let i = 0; i < 26; i++) chunk(T.x + rand(-T.w / 2, T.w / 2), rand(T.top, T.bottom - 10), T.bottom + rand(-6, 10));
  },
  snowman: (g, p) => {
    const s = snowman.stage >= 4 ? 1 : snowman.stage + 1;
    setSnowman(s);
    bubble(344, 520, ["重新堆一個！", "滾一顆大雪球", "再疊上頭", "戴上毛帽和圍巾，完成！"][s - 1]);
  },
  snowkid: () => bubble(344, 540, snowman.stage >= 4 ? "我的雪人帥不帥？" : "幫我堆雪人～"),
  lake: (g, p) => {
    if (puck.t >= 0) return;
    if (reduced) { bubble(netX + 30, 420, "進球！"); return; }
    puck.sx = puck.x; puck.sy = puck.y; puck.tx = netX; puck.ty = 438; puck.t = 0;
    bubble(hockeyKid.x + 40, 430, "看我射門！");
  },
  hockey: () => ACT.lake(),
  skater: g => { const S = g._obj; S.spin = 1; bubble(S.x, S.y - 56, pick(["轉圈圈～", "看我的！", "冰好滑！"])); },
  cafe: () => {
    cafeDoor._door.setAttribute("class", "f-trim");
    setTimeout(() => cafeDoor._door.setAttribute("class", "f-door"), 1400);
    if (!reduced) for (let i = 0; i < 4; i++) puff(482 + rand(-6, 6), 396, 4, 1.4, 0, -20, .7);
    bubble(482, 384, pick(["熱可可來囉！", "楓糖拿鐵好了～", "歡迎光臨！"]));
  },
  veh: (g, p) => {
    const V = g._obj;
    bubble(p.x, V.lane.y - 72, V.kind === "plow" ? "剷雪中，請慢行！" : V.kind === "bus" ? "下一站：纜車站" : "叭叭！");
  },
  gondola: (g, p) => bubble(p.x, p.y, pick(["好高喔！", "看得到冰河！", "山頂見～"])),
  elk: (g, p) => { if (elk) { elk.stop = 3; bubble(elk.x, elk.y - 50, pick(["呦——", "（嚼嚼）", "這是我的地盤"])); } },
  walker: (g, p) => { const W = g._obj; if (W) { W.stop = 1.5; bubble(W.x, W.y - W.f.h, pick(SAY)); } }
};
svg.addEventListener("click", e => {
  const p = svgPoint(e);
  const a = e.target.closest("[data-act]");
  if (a && ACT[a.dataset.act]) { ACT[a.dataset.act](a, p); return; }
  if (p.y < 260) {      // 點天空
    if (nightOf(phase) > .5) { auroraBoost = 1.6; shootingStar(p.x - 120, p.y - 60); }
    else spawnFlock(p.y);
  }
});

$("btnDayNight").addEventListener("click", () => {
  const n = nightOf(phase);
  const base = Math.floor(phase);
  let to = n > .5 ? base + 1 : base + .5;
  if (to <= phase) to += 1;
  tween = { from: phase, to, t: 0 };
});
$("btnAuto").addEventListener("click", () => {
  auto = !auto;
  $("btnAuto").setAttribute("aria-pressed", auto);
  $("btnAuto").textContent = "自動循環：" + (auto ? "開" : "關");
});
$("btnPlow").addEventListener("click", callPlow);
$("btnSnow").addEventListener("click", () => {
  snowLevel = (snowLevel + 1) % SNOW_LEVELS.length;
  $("btnSnow").textContent = "雪量：" + SNOW_LEVELS[snowLevel].name;
  if (reduced) updateSnow(0, 0);
});

// 減少動態：停住自動循環、人車靜止、雪花停在空中
function applyReduced() {
  reduced = RM_QUERY.matches;
  if (reduced) {
    auto = false; $("btnAuto").setAttribute("aria-pressed", "false"); $("btnAuto").textContent = "自動循環：關";
    updateSnow(0, 0);
  }
}
RM_QUERY.addEventListener && RM_QUERY.addEventListener("change", applyReduced);

/* =========================================================
   初始化
   ========================================================= */
setSnowman(4);
addWalker("front", 560, 1, { kind: "adult", extra: { skis: "ski2" } });
addWalker("front", 1080, -1, { kind: "adult", extra: { dog: true } });
addWalker("back", 700, 1, { kind: "adult" });
addWalker("back", 1150, -1, { kind: "kid" });
addWalker("back", 420, -1, { kind: "adult" });
spawnElk(1180);
const v1 = makeVehicle("suv", "near"); v1.x = 420; drawVehicle(v1);
const v2 = makeVehicle("bus", "far"); v2.x = 1100; drawVehicle(v2);
applyNight(nightOf(phase), true);
clouds.forEach(c => c.g.setAttribute("transform", `translate(${c.x},${c.y})`));
updateSnow(0, 0);
applyReduced();
requestAnimationFrame(frame);
})();
</script>
