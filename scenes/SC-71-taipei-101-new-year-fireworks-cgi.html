/* =========================================================
   SC-71 台北 101 的跨年煙火夜｜CGI 電影質感
   地點：台北市信義區。站在象山步道的「六巨石」觀景點往西北看，
         台北 101 就在眼前，腳下是信義區的大馬路與天橋，遠方是大屯山、七星山。
   真實元素：
     台北 101：508 公尺；底座往上收的基座、八節（每節八層樓）像竹節也像花開的「斗」狀結構、
               每節轉角的如意裝飾、基座上方的大古錢、頂端的觀景台與尖塔；
               87–92 樓之間懸著 660 公噸的金色風阻尼球；
               夜間依星期幾換燈色（一紅、二橙、三黃、四綠、五藍、六靛、日紫）；
               跨年時外牆 LED 倒數，煙火從每一節的側面往外噴、從頂端炸開。
     象山：步道石階、扶手、六顆巨石、木平台；相思樹、筆筒樹、姑婆芋；
           赤腹松鼠、台灣藍鵲（紅嘴、長尾巴）、大冠鷲（盤旋時叫聲像「忽溜～」）、在草地上「定格」的黑冠麻鷺。
     信義區街景：連接百貨大樓的空橋（天橋）、行道樹台灣欒樹（11 月開黃花、結粉紅色蒴果）、
           會走路的小綠人號誌（剩下秒數少時會跑起來）、機車待轉區、黃色計程車、公車、
           騎機車的人（下雨時穿上彩色雨衣）、外送員、捷運「台北101／世貿站」出口、
           公共自行車站、晚上放著〈給愛麗絲〉的黃色垃圾車與白色資源回收車、往松山機場降落的飛機。
   風格重點：CGI 動畫電影的寬銀幕畫面——101 的玻璃反射天空、受光面與背光面分明；
            空氣透視（越遠越藍）、放射狀光暈、青橙調色、暗角、底片顆粒；
            滑鼠移動帶動多層視差；表演時上下出現寬銀幕黑邊、鏡頭緩緩推近。
   效能：不對大圖層做模糊；光暈一律用放射漸層；煙火用固定數量的粒子重複使用。
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），部分另有 --k-名稱（晨昏）。
   JS 會依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）。
   ========================================================= */

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:6px;overflow:hidden;background:#000;line-height:0;box-shadow:0 18px 50px rgba(0,0,0,.55)}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:6px;padding:10px 14px}
.panel button{font:700 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:4px;padding:9px 14px;cursor:pointer;letter-spacing:.04em}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:#04161c}
.panel button.big{border-color:var(--ui-hot2);color:#fff;background:var(--ui-hot2)}
.panel button.big2{border-color:var(--ui-hot);color:#1a1206;background:var(--ui-hot)}
.panel button:disabled{opacity:.45;cursor:default}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid #dff4ff;outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(220px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding:0;list-style:none;color:var(--page-muted);font-size:14px;line-height:1.8;display:flex;flex-wrap:wrap;gap:4px 22px}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .bubble path{fill:rgba(255,253,246,.94);stroke:rgba(40,30,20,.35);stroke-width:1}
#scene .bubble text{fill:#2a1e14;font:22px var(--font-hand);text-anchor:middle;dominant-baseline:central}
#scene .hand{font-family:var(--font-hand)}
#scene .sign{font:700 9px var(--font-ui)}

<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>

<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 舞台。圖層由遠到近：
       天空（星星、月亮、太陽、雲、積雨雲、飛機、大冠鷲）→ 大屯山與七星山 → 遠方市區
       → 信義區大樓群、台北 101（含阻尼球剖面、夜間燈色、LED 倒數）→ 煙火與煙霧
       → 街道（遠側人行道、行道樹、空橋、馬路、車流、號誌、近側人行道、捷運出口、自行車站）
       → 象山前景（山坡、六巨石、木平台、遊客、相思樹、筆筒樹、姑婆芋、松鼠、藍鵲、黑冠麻鷺）
       → 天氣（雨、霧、雲遮頂）→ 鏡頭效果（調色、暗角、顆粒、寬銀幕黑邊）
       大部分的物件由下方 JS 產生，這裡只放骨架與漸層。
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" role="img" aria-label="從台北象山的巨石往西北看，台北 101 矗立在信義區的大樓與車流之間，遠方是大屯山">

      <radialGradient id="sunGlow"><stop offset="0" stop-color="#fff6e0" stop-opacity=".95"/><stop offset=".12" stop-color="#ffe0a8" stop-opacity=".6"/><stop offset=".4" stop-color="#ffb070" stop-opacity=".2"/><stop offset="1" stop-color="#ffb070" stop-opacity="0"/></radialGradient>
      <radialGradient id="sunWash"><stop offset="0" stop-color="#ffb060" stop-opacity=".55"/><stop offset=".5" stop-color="#ff8a50" stop-opacity=".18"/><stop offset="1" stop-color="#ff8a50" stop-opacity="0"/></radialGradient>

<script id="showstop">

})();

  if (T.auto && !show.on && !T.dragging) { T.t = (T.t + dt / DAY_SEC) % 1; }
  applyColors(false);
  update101(dt);
  updateSignal(dt);
  updateTraffic(adt);
  updateWalkers(adt);
  updateCrossers(adt);
  updateTossers(adt);
  updateAnimals(adt);
  updateWind(adt);
  updateFireworks(dt);
  // 雲飄動
  clouds.forEach(c => { c.x += c.v * adt * (1 + wx.wind * 3); if (c.x > 1760) c.x = -160; c.g.setAttribute('transform', `translate(${f1(c.x)} ${f1(c.y)}) scale(${f2(c.z)})`); c.g.setAttribute('opacity', f2(.55 + wx.cloud * .45)); });
  // 星星閃爍
  if (night > .5) stars.forEach(s => s.n.setAttribute('opacity', f2(s.b * (.6 + .4 * Math.sin(time * 2 + s.ph)))));
  // 跨年人潮
  if (crowd.fade > 0) { crowd.fade -= dt; if (crowd.fade <= 0) crowd.k = 0; }
  const ck = show.on && show.kind === 'ny' ? crowd.k : crowd.fade > 0 ? crowd.fade / 6 : 0;
  crowd.g.setAttribute('opacity', f2(ck)); if (!show.on && crowd.fade <= 0) crowd.k = 0;
  if (ck > 0) crowd.heads.forEach(H => { const up = H.up && show.t > 1 + H.ph * .3; H.arm.setAttribute('opacity', up ? 1 : 0); H.h.setAttribute('transform', `translate(${f1(H.x)} ${f1(H.y - (show.t > 11 && show.on ? Math.max(0, Math.sin(time * 9 + H.ph)) * 3 : 0))}) scale(${f2(H.s)})`); });
  // 偶爾有人騎腳踏車經過
  riderT -= adt; if (riderT <= 0 && wx.rain < .3 && crowd.k === 0 && !(crowd.fade > 0)) { riderT = rand(14, 26); spawnRider(Math.random() < .5 ? 590 : 1690, 0).dir = 0; const R = riders[riders.length - 1]; R.dir = R.x < 1000 ? 1 : -1; R.fl.setAttribute('transform', `scale(${R.dir * .74} .74)`); }
  // 滑鼠滑過行道樹，樹葉沙沙晃動
  luans.forEach(L => { const [sx, sy] = screenOf(L.x, L.y - 30, 'Lstreet'); if (Math.abs(mouse.x - sx) < 20 && Math.abs(mouse.y - sy) < 26 && L.k <= 0) L.k = .6; });
  updateLens();
  $('clock').textContent = show.on && show.kind === 'ny' ? clockText(true) : clockText();
}

/* ---- 太陽光束（傍晚太陽低低地照過來時最明顯） ---- */
const rays = [];
function drawLens() { const rg = $('raysG'); for (let i = 0; i < 8; i++) { const n = el('path', { d: '', fill: 'url(#rayG)' }, rg); rays.push({ n, w: srand(10, 24), l: srand(700, 1100), ph: srand(0, 6) }); } }
function updateLens() {
  const vis = sunUp * (1 - wx.cloud * .95) * smooth(-40, 200, sunY);
  if (vis < .01) { $('raysG').setAttribute('opacity', 0); return; }
  rays.forEach((r, i) => {
    const a = (-14 + i * 6) * Math.PI / 180, w = r.w * (.8 + .2 * Math.sin(time * .3 + r.ph)), L = r.l;
    r.n.setAttribute('d', `M${f1(sunX)} ${f1(sunY)}L${f1(sunX + Math.cos(a) * L - Math.sin(a) * w)} ${f1(sunY + Math.sin(a) * L + Math.cos(a) * w)}L${f1(sunX + Math.cos(a) * L + Math.sin(a) * w)} ${f1(sunY + Math.sin(a) * L - Math.cos(a) * w)}Z`);
  });
  $('raysG').setAttribute('opacity', f2(vis * (.08 + dusk * .3)));
}

/* ---------------- 初始化 ---------------- */
function init() {
  drawSky(); drawClouds(); drawCb();
  drawMountains();
  drawCity();
  drawTowers();
  draw101();
  drawStreet();
  drawSidewalkThings();
  drawHill();
  drawPlants();
  drawHillPeople();
  drawWalkers();
  drawBridgeFolk();
  drawAnimals();
  drawCrowd();
  crowd.k = 0;
  drawWeather();
  drawFireworks();
  drawYear();
  drawLens();
  // 一開始路上就有車
  [[0, 'moto', 700], [0, 'moto', 1300], [1, 'car', 1100], [1, 'taxi', 1500], [2, 'car', 700], [2, 'taxi', 1250], [3, 'moto', 760], [3, 'moto', 1180], [3, 'moto', 1500]].forEach(([li, ty, x]) => spawnVehicle(li, ty, x));
  bindAll();
  if (reduced) { T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false'); }
  setWeather(0);
  applyColors(true);
  step(1 / 60);
  requestAnimationFrame(loop);
}
init();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on && show.kind,
  btn: { ny: 'btnNY', storm: 'btnStorm' },
  ff: () => { show.cues = new Proxy({}, { get: () => 1 }); show.t = show.dur - .02; },
  save: () => ({ t: T.t, auto: T.auto, w: wxIdx }),
  stop: () => endShow(),
  restore: s => {
    if (wxIdx !== s.w) { setWeather(s.w); Object.assign(wx, wxT); }
    rainbowT = 0;   // 不出現收尾彩虹
    T.t = s.t; T.auto = s.auto; $('btnAuto') && $('btnAuto').setAttribute('aria-pressed', String(T.auto)); applyColors(true);
  }
});
/* /ShowStop */
})();
</script>
