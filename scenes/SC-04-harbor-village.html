<title>SC-04 海港漁村</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* =========================================================
   SC-04 海港漁村｜扁平插畫風格
   【色票 token】所有顏色集中在這裡。
   - 場景色成對出現：--名稱-day / --名稱-night，
     JS 會依「日夜比例」自動混色，輸出成 --名稱 給 SVG 使用，
     並自動產生 .f-名稱（填色）與 .s-名稱（描邊）兩種 class。
   - 「常亮光源」不參與混色（燈、信號燈、集魚燈、燈塔光束）。
   換色時只需改這個區塊。
   版面概念：米白紙框，中央一幅寬版扁平插畫，下方圓角膠囊按鈕。
   ========================================================= */
:root{
  color-scheme:light;

  /* ---- 頁面外框（單一淺色主題） ---- */
  --page-bg:#f3ede1;
  --page-panel:#fffaf0;
  --page-fg:#23303b;
  --page-dim:#69737a;
  --page-line:#ddd3c1;
  --page-accent:#e2553f;
  --font-display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;

  /* ---- 天空、遠山、岬角 ---- */
  --sky-top-day:#79c3e6;    --sky-top-night:#0c1838;
  --sky-bot-day:#d4f0f4;    --sky-bot-night:#2a4170;
  --cloud-day:#ffffff;      --cloud-night:#34497a;
  --cloud-sh-day:#e1eff4;   --cloud-sh-night:#26385f;
  --mtn-far-day:#a9d2db;    --mtn-far-night:#1c3157;
  --mtn-day:#86bba8;        --mtn-night:#172e48;
  --head-day:#74a682;       --head-night:#163040;
  --cliff-day:#c9a27a;      --cliff-night:#2c3450;

  /* ---- 海 ---- */
  --sea-top-day:#62bdd5;    --sea-top-night:#173262;
  --sea-bot-day:#2c84ad;    --sea-bot-night:#0a1a3a;
  --wave-day:#e6f8fb;       --wave-night:#4b6ba3;
  --foam-day:#ffffff;       --foam-night:#8ea6d2;

  /* ---- 山坡聚落 ---- */
  --land-day:#d2bd93;       --land-night:#2f3253;
  --grass-day:#8dc277;      --grass-night:#1f3b3b;
  --tree-day:#5f9e6a;       --tree-night:#183232;
  --stone-day:#bfb7a5;      --stone-night:#3a3d5c;
  --house-a-day:#f6e5c6;    --house-a-night:#3e3c60;
  --house-b-day:#f3b9a2;    --house-b-night:#4b3758;
  --house-c-day:#bcdcd3;    --house-c-night:#2c4662;
  --house-d-day:#f7d77e;    --house-d-night:#4e4654;
  --house-e-day:#cdcbea;    --house-e-night:#373862;
  --roof-a-day:#d9574a;     --roof-a-night:#5b2b3f;
  --roof-b-day:#3f80a7;     --roof-b-night:#1f3557;
  --roof-c-day:#5e9575;     --roof-c-night:#22403f;
  --roof-d-day:#9a6a4e;     --roof-d-night:#3b2e40;
  --shade-day:#2a4459;      --shade-night:#060b1c;
  --win-off-day:#8fbccd;    --win-off-night:#1f2e52;
  --trim-day:#ffffff;       --trim-night:#6a7398;
  --temple-day:#e04a3a;     --temple-night:#6e2a3a;
  --gold-day:#f2b632;       --gold-night:#8a6f3d;

  /* ---- 碼頭、木棧、物件 ---- */
  --concrete-day:#dcd6c8;   --concrete-night:#3b4163;
  --concrete-dk-day:#aea898;--concrete-dk-night:#262b4a;
  --road-day:#a3abaf;       --road-night:#2d3452;
  --wood-day:#ad7b52;       --wood-night:#3f3447;
  --wood-dk-day:#7c5538;    --wood-dk-night:#2b2435;
  --metal-day:#8f9ba4;      --metal-night:#3d4667;
  --rope-day:#dab878;       --rope-night:#6c5d56;
  --net-day:#5f8d6b;        --net-night:#2a3e43;
  --float-day:#ff8a2a;      --float-night:#8a4a35;
  --crate-day:#3b8fd0;      --crate-night:#22416a;
  --foam-box-day:#f4f6f7;   --foam-box-night:#6a7397;
  --tire-day:#2e3338;       --tire-night:#0d1020;
  --fish-day:#a3bccb;       --fish-night:#4d5b7a;
  --ice-day:#e6f6fb;        --ice-night:#6b80a9;
  --sign-bg-day:#fffaf0;    --sign-bg-night:#ddd4c4;
  --sign-txt-day:#26333f;   --sign-txt-night:#1e2733;
  --plant-day:#4f9a5c;      --plant-night:#1d3934;
  --pot-day:#c8643f;        --pot-night:#4e3040;

  /* ---- 船 ---- */
  --hull-a-day:#e9533f;     --hull-a-night:#6f2f3e;
  --hull-b-day:#2f70b3;     --hull-b-night:#1d3867;
  --hull-c-day:#f3f2ea;     --hull-c-night:#5a6181;
  --hull-d-day:#2a9d8f;     --hull-d-night:#1c4f58;
  --cabin-day:#fbf7ee;      --cabin-night:#646b8c;
  --flag-a-day:#ff5b4a;     --flag-a-night:#8c3a44;
  --flag-b-day:#ffd23f;     --flag-b-night:#8f7a3d;

  /* ---- 人物與動物 ---- */
  --skin-day:#f2c49c;       --skin-night:#a0807c;
  --skin2-day:#b98058;      --skin2-night:#6e5258;
  --hair-day:#3a2a22;       --hair-night:#15111b;
  --hair2-day:#d9d4cc;      --hair2-night:#7d7a8c;
  --cloth1-day:#2f70a8;     --cloth1-night:#1d355b;
  --cloth2-day:#f2b134;     --cloth2-night:#7d6541;
  --cloth3-day:#e2584c;     --cloth3-night:#6b2f3d;
  --cloth4-day:#4f9a6e;     --cloth4-night:#234740;
  --cloth5-day:#8b70c0;     --cloth5-night:#3f3868;
  --cloth6-day:#f4efe4;     --cloth6-night:#6c6f8d;
  --pants-day:#3c4a5a;      --pants-night:#161c2c;
  --boot-day:#f6c431;       --boot-night:#8b7541;
  --gull-day:#ffffff;       --gull-night:#c7d1e8;
  --gull-wing-day:#9aa8b2;  --gull-wing-night:#58637f;
  --whale-day:#3d6f9a;      --whale-night:#5a86b8;
  --whale-belly-day:#e6edf1;--whale-belly-night:#c2d0e6;
  --cat-day:#f0a24a;        --cat-night:#7a5a48;
  --ink-day:#22303c;        --ink-night:#050913;

  /* ---- 常亮光源（不隨日夜混色） ---- */
  --sun:#ffe27a;
  --moon:#f6f1d8;
  --star:#ffffff;
  --dusk:#ff8a63;          /* 晨昏的橘紅天光 */
  --dusk2:#ffcf8a;
  --win-on:#ffd27a;        /* 窗內暖光 */
  --lamp:#fff0b8;          /* 碼頭路燈 */
  --lantern:#ff5a3c;       /* 食堂紅燈籠 */
  --beacon-red:#ff3d3d;    /* 防波堤紅燈 */
  --beacon-green:#38f28a;  /* 棧橋綠燈 */
  --squid:#fff6c8;         /* 集魚燈 */
  --beam:#fff6c8;          /* 燈塔光束 */
  --headlight:#fff3c4;
  --tail:#ff3b3b;

  /* ---- 特效（常亮，不隨日夜混色） ---- */
  --fw1:#ff6b6b;  --fw2:#ffd166;  --fw3:#6ee7ff;  --fw4:#c792ff;  --fw5:#7dffb0;   /* 煙火 */
  --rb1:#ff5e5e;  --rb2:#ffa24c;  --rb3:#ffe066;  --rb4:#6fdc8c;  --rb5:#5bb4ff;  --rb6:#9b7bff;   /* 彩虹 */
}

/* ===== 頁面版面 ===== */
html,body{background:var(--page-bg);color:var(--page-fg)}
body{font-family:var(--font-body);line-height:1.6}
.wrap{max-width:1680px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
h1{font-family:var(--font-display);font-weight:900;font-size:clamp(1.4rem,2.6vw,2rem);margin:0;letter-spacing:.04em;text-wrap:balance}
h1 small{font-size:.55em;font-weight:700;color:var(--page-accent);letter-spacing:.12em;margin-right:.6em}
.meta{color:var(--page-dim);font-size:.9rem;margin:0}
.stage{position:relative;border-radius:18px;overflow:hidden;background:#000;
  box-shadow:0 0 0 1px var(--page-line),0 18px 36px -22px #3a2c1a80}
.stage svg{display:block;width:100%;height:auto;max-width:100%;touch-action:manipulation}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.controls button{font:500 .95rem/1 var(--font-body);color:var(--page-fg);background:var(--page-panel);
  border:1px solid var(--page-line);border-radius:999px;padding:11px 18px;cursor:pointer;
  transition:transform .12s,background .2s,border-color .2s}
.controls button:hover{background:#fff}
.controls button:active{transform:translateY(1px)}
.controls button:focus-visible{outline:2px solid var(--page-accent);outline-offset:2px}
.controls button[aria-pressed="true"]{border-color:var(--page-accent);color:var(--page-accent)}
.controls button:disabled{opacity:.5;cursor:default}
.clock{margin-left:auto;font-weight:700;font-size:1rem;color:var(--page-dim);font-variant-numeric:tabular-nums}
.hint{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 20px;color:var(--page-dim);font-size:.88rem}
.hint b{color:var(--page-fg);font-weight:700;margin-right:.4em}

/* ===== SVG 內樣式 ===== */
.lit{fill:var(--win-on);opacity:0;transition:opacity .35s}
.lit.on{opacity:var(--lit,.2)}
.win,.walker,.vehicle,.gull,.lamppost,.boat,#cat,#angler,#lighthouse,#oldman{cursor:pointer}
.signtxt{fill:var(--sign-txt);font-family:var(--font-display);font-weight:900}
.bubble text{font-family:var(--font-display);font-weight:700;font-size:20px;fill:var(--ink)}
/* 食堂蒸氣 */
.steam{fill:none;stroke:var(--foam);stroke-width:4;stroke-linecap:round;opacity:0;animation:steam 3.6s ease-in infinite}
.steam:nth-child(2){animation-delay:1.2s}.steam:nth-child(3){animation-delay:2.4s}
@keyframes steam{0%{opacity:0;transform:translateY(0)}30%{opacity:.6}100%{opacity:0;transform:translateY(-40px)}}

/* ===== 減少動態：關閉 CSS 動畫（JS 端另行停住浪、人、車、船） ===== */
@media (prefers-reduced-motion: reduce){
  .steam{animation:none;opacity:.4}
  .lit{transition:none}
  .controls button{transition:none}
}
</style>

<main class="wrap">

  <div class="stage">
  <!-- =====================================================
       【場景】SVG 主舞台 viewBox 1600×600
       圖層由後到前：天空 → 星星 → 日月 → 雲 → 遠山 → 海 → 倒影 → 集魚船
       → 岬角燈塔 → 防波堤 → 港內船 → 山坡聚落 → 碼頭 → 店面 → 小物件
       → 行人 → 車輛 → 前景水面與小船 → 海鷗 → 對話泡泡
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img" aria-label="山坡上的海港漁村，碼頭邊有魚市、食堂與行人，港內漁船隨浪起伏，可切換白天與夜晚">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-top)"/>
        <stop offset="1" style="stop-color:var(--sky-bot)"/>
      </linearGradient>
      <linearGradient id="duskGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--dusk);stop-opacity:0"/>
        <stop offset=".65" style="stop-color:var(--dusk);stop-opacity:.55"/>
        <stop offset="1" style="stop-color:var(--dusk2);stop-opacity:.9"/>
      </linearGradient>
      <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sea-top)"/>
        <stop offset="1" style="stop-color:var(--sea-bot)"/>
      </linearGradient>
      <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" style="stop-color:var(--beam);stop-opacity:.42"/>
        <stop offset="1" style="stop-color:var(--beam);stop-opacity:0"/>
      </linearGradient>
      <linearGradient id="coneGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--lamp);stop-opacity:.5"/>
        <stop offset="1" style="stop-color:var(--lamp);stop-opacity:0"/>
      </linearGradient>
      <linearGradient id="streakGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--lamp);stop-opacity:.55"/>
        <stop offset="1" style="stop-color:var(--lamp);stop-opacity:0"/>
      </linearGradient>
      <radialGradient id="glowGrad">
        <stop offset="0" style="stop-color:var(--lamp);stop-opacity:.85"/>
        <stop offset="1" style="stop-color:var(--lamp);stop-opacity:0"/>
      </radialGradient>
      <radialGradient id="redGlow">
        <stop offset="0" style="stop-color:var(--beacon-red);stop-opacity:.8"/>
        <stop offset="1" style="stop-color:var(--beacon-red);stop-opacity:0"/>
      </radialGradient>
      <radialGradient id="greenGlow">
        <stop offset="0" style="stop-color:var(--beacon-green);stop-opacity:.8"/>
        <stop offset="1" style="stop-color:var(--beacon-green);stop-opacity:0"/>
      </radialGradient>
      <radialGradient id="lanternGlow">
        <stop offset="0" style="stop-color:var(--lantern);stop-opacity:.6"/>
        <stop offset="1" style="stop-color:var(--lantern);stop-opacity:0"/>
      </radialGradient>
      <radialGradient id="sunGlow">
        <stop offset=".3" style="stop-color:var(--sun);stop-opacity:.55"/>
        <stop offset="1" style="stop-color:var(--sun);stop-opacity:0"/>
      </radialGradient>
      <radialGradient id="moonGlow">
        <stop offset=".3" style="stop-color:var(--moon);stop-opacity:.35"/>
        <stop offset="1" style="stop-color:var(--moon);stop-opacity:0"/>
      </radialGradient>
      <!-- 船的共用剪裁：吃水線以下藏進海裡 -->
      <clipPath id="aboveWater"><rect x="-400" y="-400" width="800" height="400"/></clipPath>
    </defs>

    <!-- 天空與晨昏光 -->
    <rect width="1600" height="600" fill="url(#skyGrad)"/>
    <rect id="duskSky" width="1600" height="340" fill="url(#duskGrad)" opacity="0"/>
    <!-- 星星（JS 生成） -->
    <g id="stars"></g>
    <!-- 【特效】流星雨 -->
    <g id="fxStars"></g>
    <!-- 太陽與月亮（JS 依時間移動） -->
    <g id="sun"><circle r="70" fill="url(#sunGlow)"/><circle r="30" fill="var(--sun)"/></g>
    <g id="moon"><circle r="60" fill="url(#moonGlow)"/><circle r="22" fill="var(--moon)"/><circle cx="9" cy="-6" r="20" class="f-sky-top" opacity=".92"/></g>
    <!-- 雲（JS 生成） -->
    <g id="clouds"></g>
    <!-- 【特效】彩虹（在遠山後面） -->
    <g id="fxBow" opacity="0"></g>

    <!-- 遠山 -->
    <path class="f-mtn-far" d="M0,250 L90,205 L170,228 L260,170 L360,215 L450,190 L560,240 L700,250 L820,300 L900,335 L0,335 Z"/>
    <path class="f-mtn" d="M0,270 L70,240 L150,262 L230,222 L330,262 L430,246 L520,282 L640,300 L760,335 L0,335 Z"/>

    <!-- 【特效】煙火（從海平線後升起） -->
    <g id="fxSky"></g>

    <!-- 海面 -->
    <rect y="330" width="1600" height="270" fill="url(#seaGrad)"/>
    <rect id="duskSea" y="330" width="1600" height="120" fill="var(--dusk)" opacity="0"/>
    <!-- 日月倒影（JS 生成） -->
    <g id="shine"></g>
    <!-- 遠方集魚船（JS 生成） -->
    <g id="farBoats"></g>
    <!-- 海浪紋（JS 生成） -->
    <g id="waves"></g>
    <!-- 【特效】煙火海面倒影、飛魚 -->
    <g id="fxSea"></g>

    <!-- 岬角與燈塔 -->
    <g id="headland">
      <path class="f-cliff" d="M1250,352 C1290,320 1320,262 1380,240 L1600,226 L1600,380 L1250,380 Z"/>
      <path class="f-head" d="M1300,300 C1330,268 1360,248 1400,238 L1600,224 L1600,262 C1520,262 1450,268 1380,282 C1350,290 1320,300 1300,300 Z"/>
      <!-- 岬角上的小樹與步道 -->
      <g class="f-tree">
        <circle cx="1560" cy="214" r="15"/><circle cx="1578" cy="210" r="12"/><circle cx="1420" cy="232" r="10"/>
      </g>
      <path class="s-stone" fill="none" stroke-width="3" stroke-dasharray="6 5" d="M1330,296 C1380,272 1420,262 1460,252"/>
      <!-- 燈塔守護人小屋 -->
      <rect x="1512" y="200" width="44" height="30" class="f-house-a"/>
      <path d="M1508,202 L1534,184 L1560,202 Z" class="f-roof-a"/>
      <rect x="1520" y="210" width="10" height="10" class="f-win-off"/>
      <rect x="1520" y="210" width="10" height="10" class="lit on"/>
    </g>
    <!-- 燈塔光束（夜晚掃過海面） -->
    <g id="beam" transform="translate(1478,138)" opacity="0">
      <path id="beamL" d="M0,-4 L-820,-44 L-820,44 L0,4 Z" fill="url(#beamGrad)" transform="scale(1,1)"/>
      <path id="beamR" d="M0,-4 L-820,-44 L-820,44 L0,4 Z" fill="url(#beamGrad)" transform="scale(-1,1)"/>
    </g>
    <!-- 燈塔（可點擊：開關光束） -->
    <g id="lighthouse">
      <path d="M1464,230 L1470,150 L1486,150 L1492,230 Z" class="f-hull-c"/>
      <path d="M1468,190 L1488,190 L1490,212 L1466,212 Z" class="f-hull-a"/>
      <path d="M1470,160 L1486,160 L1487,174 L1469,174 Z" class="f-hull-a"/>
      <rect x="1466" y="146" width="24" height="5" class="f-ink"/>
      <rect x="1469" y="131" width="18" height="15" class="f-win-off"/>
      <rect id="lhLamp" x="1469" y="131" width="18" height="15" fill="var(--beam)" opacity=".3"/>
      <path d="M1466,131 L1478,120 L1490,131 Z" class="f-hull-a"/>
      <rect x="1474" y="218" width="8" height="12" class="f-wood-dk"/>
      <circle id="lhGlow" cx="1478" cy="138" r="42" fill="url(#glowGrad)" opacity="0"/>
    </g>

    <!-- 防波堤與紅色信號燈 -->
    <g id="breakwater">
      <rect x="1080" y="374" width="240" height="16" class="f-concrete"/>
      <rect x="1080" y="388" width="240" height="6" class="f-concrete-dk"/>
      <g id="tetrapods" class="f-concrete-dk"></g>
      <!-- 紅燈塔柱 -->
      <rect x="1086" y="336" width="16" height="40" class="f-hull-c"/>
      <rect x="1086" y="344" width="16" height="8" fill="var(--beacon-red)"/>
      <rect x="1086" y="360" width="16" height="8" fill="var(--beacon-red)"/>
      <rect x="1084" y="330" width="20" height="6" class="f-ink"/>
      <circle id="redLamp" cx="1094" cy="326" r="5" fill="var(--beacon-red)"/>
      <circle id="redGlowC" cx="1094" cy="326" r="26" fill="url(#redGlow)" opacity="0"/>
    </g>

    <!-- 港內漁船（JS 生成，可點擊） -->
    <g id="harborBoats"></g>

    <!-- =================== 山坡聚落 =================== -->
    <path id="hill" class="f-land" d="M0,160 C120,140 260,158 380,190 C520,226 640,282 760,340 C820,370 870,410 900,442 L0,442 Z"/>
    <path class="f-grass" d="M0,160 C120,140 260,158 380,190 C520,226 640,282 760,340 L740,352 C620,300 500,246 380,214 C250,180 120,168 0,176 Z"/>
    <!-- 山坡樹叢 -->
    <g class="f-tree">
      <circle cx="30" cy="168" r="22"/><circle cx="62" cy="160" r="18"/><circle cx="350" cy="196" r="16"/>
      <circle cx="560" cy="246" r="18"/><circle cx="590" cy="256" r="14"/><circle cx="700" cy="306" r="16"/>
    </g>
    <!-- 擋土牆 -->
    <g id="walls"></g>
    <!-- 階梯步道 -->
    <g id="stairs"></g>
    <!-- 山坡房屋（JS 生成） -->
    <g id="houses"></g>
    <!-- 電線桿與電線 -->
    <g id="wires" fill="none"></g>
    <!-- 晾衣與旗幟等會擺動的小物（JS 生成） -->
    <g id="swingers"></g>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);

      return _conn.call(this, dest, ...a);
    };
  }
  function stopAudio() {
    let longs = [], ctx = null;
    for (const s of srcs) {
      const c = s.context, now = c.currentTime, m = s.__ss; ctx = c;
      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }
    if (longs.length && ctx) {
      const g = outs.get(ctx), now = ctx.currentTime;
      if (g) {
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 1.1); g.gain.setValueAtTime(0, now + 1.2);
        g.gain.linearRampToValueAtTime(1, now + 1.9);

      longs.forEach(s => { try { s.stop(now + 1.15); } catch (e) {} srcs.delete(s); });
    }
    srcs.clear();
  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');
    // 凍結色票：把目前的 CSS 變數抄到殘影上，底下換色不影響殘影
    const cs = getComputedStyle(svg);
    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }
      }
    }
    const par = svg.parentElement;
    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });
    added = [];
  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }

<script>

  if (sd >= 0) { const [x, y] = arc(sd); sunG.setAttribute("transform", `translate(${f1(x)},${f1(y)})`); sunG.style.display = ""; src = { x, y, c: "var(--sun)" }; }
  else sunG.style.display = "none";
  if (md >= 0) { const [x, y] = arc(md); moonG.setAttribute("transform", `translate(${f1(x)},${f1(y)})`); moonG.style.display = ""; src = { x, y, c: "var(--moon)" }; }
  else moonG.style.display = "none";
  return src;
}

/* =========================================================
   主迴圈
   ========================================================= */
let wind = .3, windTarget = .3, pointerIn = false;
let last = performance.now(), t = 0, mixTimer = 0;
let beamOn = true, beamAng = 0, lhFlash = 0;
let sailState = "moored", sailT = 0, awayT = 0, sailCooldown = 30;
let anglerState = 0, anglerT = 0, nextBite = 6;
let smokeTimer = 0;

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;

  // --- 日夜 ---
  if (tween) {
    tween.t += dt / (reduced ? .001 : 2.2);
    const k = Math.min(1, tween.t), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    phase = tween.from + (tween.to - tween.from) * e;
    if (k >= 1) { tween = null; phase %= 1; }
  } else if (auto && !reduced) phase = (phase + dt / CYCLE) % 1;
  const night = nightOf(phase), dusk = duskOf(phase);
  mixTimer -= dt;
  const src = placeSunMoon(phase);
  if (mixTimer <= 0 || tween) {
    applyNight(night); mixTimer = .12;
    $("clock").textContent = clockLabel(phase);
    $("duskSky").setAttribute("opacity", Math.min(1, dusk * 1.1).toFixed(2));
    $("duskSea").setAttribute("opacity", (dusk * .35).toFixed(2));
  }

  // --- 風：滑鼠控制，沒滑鼠時自己飄 ---
  if (!pointerIn) windTarget = .3 + Math.sin(t * .25) * .4;
  wind += (windTarget - wind) * Math.min(1, dt * 2.5);
  const M = reduced ? 0 : 1;   // 減少動態時，位移類動畫全部乘 0

  // 星星閃爍
  for (const s of stars) s.e.setAttribute("opacity", (night * (.55 + .45 * Math.sin(t * s.sp * M + s.ph))).toFixed(2));

  // 日月倒影
  for (const b of shineBars) {
    if (!src || src.y > 335) { b.e.setAttribute("opacity", 0); continue; }
    const w = b.w * (.7 + .3 * Math.sin(t * 2 * M + b.ph));
    b.e.setAttribute("x", f1(src.x - w / 2 + Math.sin(t * M + b.ph) * 6));
    b.e.setAttribute("width", f1(w));
    b.e.setAttribute("fill", src.c);
    b.e.setAttribute("opacity", ((.25 + .5 * Math.sin(t * 3 * M + b.ph) ** 2) * clamp((330 - src.y) / 80, 0, 1)).toFixed(2));
  }

  if (!reduced) {
    // 雲
    for (const c of clouds) {
      c.x += (c.sp + wind * 22) * dt;
      if (c.x > 1720) c.x = -130; if (c.x < -130) c.x = 1720;
      c.g.setAttribute("transform", `translate(${f1(c.x)},${c.y})`);
    }
    // 浪
    for (const w of waves) {
      w.x += (w.sp + wind * 6) * dt;
      if (w.x > 1660) w.x = -70;
      w.e.setAttribute("transform", `translate(${f1(w.x + Math.sin(t * .8 + w.ph) * w.amp)},${f1(w.y + Math.sin(t * 1.3 + w.ph) * 1.2)})`);
    }
    // 遠方集魚船與渡輪
    for (const b of farBoats) {
      b.x += b.sp * dt; if (b.x > 1680) b.x = -60; if (b.x < -60) b.x = 1680;
      b.g.setAttribute("transform", `translate(${f1(b.x)},${f1(b.y + Math.sin(t * 1.2 + b.x) * .6)}) scale(${b.s})`);
    }
    ferry.x += ferry.dir * ferry.sp * dt;
    if (ferry.x < -80) ferry.x = 1720;
    ferry.g.setAttribute("transform", `translate(${f1(ferry.x)},${f1(ferry.y + Math.sin(t * 1.5) * .8)}) scale(${ferry.dir * -ferry.s},${ferry.s})`);
    ferry.sx = ferry.x - 19 * ferry.s * ferry.dir * -1; ferry.sy = ferry.y - 50 * ferry.s;

    // 晾衣與布簾
    for (const s of swingers) {
      if (s.type === "laundry") for (const it of s.items) {
        const a = wind * s.amp + Math.sin(t * 2.6 + it.ph) * 5;
        it.e.setAttribute("transform", `translate(${f1(it.x)},${f1(it.y)}) rotate(${f1(-a)}) skewX(${f1(-a * .5)})`);
      } else s.e.setAttribute("transform", `skewX(${f1(-wind * 6 - Math.sin(t * 2) * 1.5)})`);
    }
    // 燈籠：彈簧擺
    for (const L of lanterns) {
      const target = -wind * 10 + Math.sin(t * 1.7 + L.ph) * 3;
      L.v += ((target - L.a) * 30 - L.v * 2.2) * dt;
      L.a += L.v * dt;
      L.g.setAttribute("transform", `rotate(${f1(L.a)})`);
    }
    // 海鷗
    for (const G of gulls) {
      if (G.flee > 0) {   // 受驚：往上飛出畫面，之後回來
        G.flee -= dt;
        G.x += G.dir * 260 * dt; G.y -= 120 * dt; G.flap += dt * 22;
        if (G.flee <= 0) { G.cy = 80 + Math.random() * 160; G.ang = Math.random() * 6.28; }
      } else {
        G.ang += G.sp * dt;
        const nx = G.cx + Math.cos(G.ang) * G.r * 2.2 + wind * 40, ny = G.cy + Math.sin(G.ang) * G.r * .5;
        const tx = G.x === 0 && G.y === 0 ? nx : G.x + (nx - G.x) * Math.min(1, dt * 1.2);
        const ty = G.x === 0 && G.y === 0 ? ny : G.y + (ny - G.y) * Math.min(1, dt * 1.2);
        if (Math.abs(tx - G.x) > .05) G.dir = tx > G.x ? 1 : -1;
        G.x = tx; G.y = ty; G.flap += dt * (Math.sin(G.ang * 3) > .3 ? 2 : 9);   // 偶爾滑翔
      }
      const fl = Math.sin(G.flap);
      G.wL.setAttribute("transform", `scale(1,${f1(fl)})`);
      G.wR.setAttribute("transform", `scale(1,${f1(fl)})`);
      G.g.setAttribute("transform", `translate(${f1(G.x)},${f1(G.y)}) scale(${f1(G.dir * G.s)},${f1(G.s)})`);
    }
    // 行人
    for (const W of walkers) {
      if (W.hop > 0) W.hop = Math.max(0, W.hop - dt * 2.4);
      if (W.pause > 0) W.pause -= dt;
      else {
        W.x += W.dir * W.sp * dt;
        W.ph += dt * W.sp / 6.5;
        if (W.dir > 0 && W.x > 870) W.dir = -1;      // 碼頭盡頭轉身
        if (W.dir < 0 && W.x < -60) W.dir = 1;       // 左邊畫面外轉身
      }
      drawWalker(W);
    }
    // 車
    if (!veh) { vehWait -= dt; if (vehWait <= 0) spawnVehicle(); }
    else {
      if (veh.state === "wait") { veh.wait -= dt; if (veh.wait <= 0) veh.state = "go"; }
      else {
        const boost = veh.honk > 0 ? 1.5 : 1;
        veh.x += veh.dir * veh.sp * boost * dt; veh.spin += veh.dir * veh.sp * dt * .25;
        if (veh.state === "in" && veh.x >= veh.stopAt) { veh.state = "wait"; veh.wait = 2.5; if (veh.kind !== "scooter") bubble(veh.x, veh.y - 76, "卸貨囉～"); }
        if (veh.state === "go" && veh.dir > 0 && veh.x > 830) { veh.dir = -1; veh.y = 508; }   // 迴轉
        if (veh.dir < 0 && veh.x < -100) { veh.g.remove(); veh = null; vehWait = rand(2, 6); }
      }
      if (veh) { veh.honk = Math.max(0, veh.honk - dt); drawVehicle(veh); veh.hl.style.opacity = night.toFixed(2); }
    }
    // 貓
    cat.t += dt;
    if (cat.state === "go") { cat.x -= 70 * dt; if (cat.x < 230) { cat.state = "back"; cat.fish.setAttribute("opacity", 1); bubble(cat.x, cat.y - 40, "喵！得手"); } }
    else if (cat.state === "back") { cat.x += 60 * dt; if (cat.x >= 300) { cat.x = 300; cat.state = "sit"; setTimeout(() => cat.fish.setAttribute("opacity", 0), 2500); } }
    const hopC = cat.state === "sit" ? 0 : Math.abs(Math.sin(cat.t * 12)) * 5;
    $("cat").setAttribute("transform", `translate(${f1(cat.x)},${f1(cat.y - hopC)}) scale(${cat.state === "go" ? -1 : 1},1)`);
    cat.tail.setAttribute("transform", `rotate(${f1(Math.sin(t * (cat.state === "sit" ? 1.4 : 10)) * 10)} -9 -2)`);

    // 港內船：隨浪搖擺
    for (const B of harborBoats) {
      if (B.sailer) updateSailer(B, dt, night);
      B.rock = Math.max(0, B.rock - dt * .6);
      const ang = Math.sin(t * 1.1 + B.ph) * 2 + Math.sin(t * 9) * B.rock * 6;
      const bob = Math.sin(t * 1.4 + B.ph) * 2;
      B.g.setAttribute("transform", `translate(${f1(B.x)},${f1(B.y + bob)}) scale(${f1((B.flip ? -1 : 1) * B.s)},${f1(B.s)})`);
      B.inner.setAttribute("transform", `rotate(${f1(ang)})`);
      // 旗子隨風
      const fw = clamp(.4 + Math.abs(wind), .3, 1.4) * (B.flip ? -1 : 1) * Math.sign(wind || 1);
      const fx = B.mx, fy = -78, wv = Math.sin(t * 6 + B.ph) * 3;
      B.flag.setAttribute("d", `M${fx},${fy} Q${f1(fx + 10 * fw)},${f1(fy + 2 + wv)} ${f1(fx + 22 * fw)},${f1(fy + 4)} L${f1(fx + 22 * fw)},${f1(fy + 12)} Q${f1(fx + 10 * fw)},${f1(fy + 10 - wv)} ${fx},${fy + 12} Z`);
    }
    for (const B of frontBoats) {
      B.rock = Math.max(0, B.rock - dt * .6);
      const ang = Math.sin(t * 1.3 + B.ph) * (B.buoy ? 6 : 2.5) + Math.sin(t * 9) * B.rock * 6;
      B.g.setAttribute("transform", `translate(${B.x},${f1(B.y + Math.sin(t * 1.6 + B.ph) * 2.5)}) scale(${B.dir},1) rotate(${f1(ang)})`);
    }
    // 釣客：魚咬鉤 → 收竿 → 放回
    updateAngler(dt);

    // 炊煙
    smokeTimer -= dt;
    if (smokeTimer <= 0) {
      smokeTimer = .35;
      const s = pick(smokeSources);
      if (s === ferry) { if (ferry.x > -40 && ferry.x < 1640) puff(ferry.sx, ferry.sy, .6); }
      else puff(s[0], s[1], s[1] < 230 ? .7 : 1);
      if (sailState === "leaving" || sailState === "returning") { const B = harborBoats[2]; puff(B.x - 40 * B.s, B.y - 60 * B.s, B.s); }
    }
    for (const p of puffs) {
      if (p.life <= 0) continue;
      p.life -= dt * .45;
      p.x += (wind * 26 + p.vx) * dt; p.y -= 16 * dt;
      p.e.setAttribute("cx", f1(p.x)); p.e.setAttribute("cy", f1(p.y));
      p.e.setAttribute("r", f1((3 + (1 - p.life) * 10) * p.size));
      p.e.setAttribute("opacity", (Math.min(1, p.life * 2) * .5).toFixed(2));
    }
  }

  // --- 燈光（減少動態時也會依日夜改變亮度，但不閃爍、不旋轉） ---
  // 燈塔：光束左右掃（以水平縮放模擬旋轉）
  if (!reduced) beamAng += dt * 1.1;
  lhFlash = Math.max(0, lhFlash - dt);
  const bOn = beamOn ? 1 : 0;
  const cosA = reduced ? 1 : Math.cos(beamAng);
  $("beamL").setAttribute("transform", `scale(${f1(Math.max(0, cosA))},1)`);
  $("beamR").setAttribute("transform", `scale(${f1(-Math.max(0, -cosA))},1)`);
  $("beam").setAttribute("opacity", (night * bOn).toFixed(2));
  const facing = reduced ? .6 : Math.pow(1 - Math.abs(cosA), 6);   // 光正對觀眾時最亮
  $("lhGlow").setAttribute("opacity", (bOn * night * (.35 + facing * .65) + lhFlash).toFixed(2));
  $("lhLamp").setAttribute("opacity", (bOn ? .4 + .6 * night : .1).toFixed(2));
  // 港口信號燈：紅燈 4 秒一閃、綠燈錯開
  const redOn = reduced ? 1 : ((t % 4) < 1 ? 1 : .25), greenOn = reduced ? 1 : (((t + 2) % 3) < .8 ? 1 : .25);
  $("redLamp").setAttribute("opacity", (redOn * (.5 + .5 * night)).toFixed(2));
  $("redGlowC").setAttribute("opacity", (redOn * night).toFixed(2));
  $("greenLamp").setAttribute("opacity", (greenOn * (.5 + .5 * night)).toFixed(2));
  $("greenGlowC").setAttribute("opacity", (greenOn * night).toFixed(2));
  // 碼頭路燈（中間那盞偶爾接觸不良）
  for (const L of lamps) {
    if (!reduced && L.flaky && Math.random() < dt * .3) L.flick = rand(.3, .8);
    L.flick = Math.max(0, L.flick - dt);
    const fl = L.flick > 0 && Math.sin(t * 50) > 0 ? .15 : 1;
    const v = L.on ? night * fl : 0;
    L.light.querySelectorAll(".cone").forEach(e => e.setAttribute("opacity", v.toFixed(2)));
    L.light.lastChild.setAttribute("opacity", L.on ? (.5 + .5 * night * fl).toFixed(2) : ".25");
    L.streak.setAttribute("opacity", (v * .8).toFixed(2));
  }

  // 特效
  updateFx(dt);

  // 漣漪
  for (const r of ripplePool) {
    if (r.life <= 0) continue;
    r.life -= dt * (reduced ? 3 : .9);
    const k = 1 - r.life;
    r.e.setAttribute("cx", f1(r.x)); r.e.setAttribute("cy", f1(r.y));
    r.e.setAttribute("rx", f1(4 + k * 40 * r.big)); r.e.setAttribute("ry", f1(1 + k * 8 * r.big));
    r.e.setAttribute("opacity", Math.max(0, r.life * .8).toFixed(2));
  }

  requestAnimationFrame(frame);
}

// 出港的紅色漁船：沿著路徑駛出港口、縮小消失，一陣子後再駛回來
const SAIL_PATH = [[1270, 478, .95], [1150, 440, .78], [1040, 404, .58], [930, 366, .4], [820, 344, .26]];
function pathAt(k) {
  const n = SAIL_PATH.length - 1, i = Math.min(n - 1, Math.floor(k * n)), u = k * n - i;
  const a = SAIL_PATH[i], b = SAIL_PATH[i + 1];
  return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u];
}
function setSailBtn() {
  const b = $("btnSail");
  b.textContent = sailState === "moored" ? "漁船出港" : sailState === "away" ? "呼叫漁船回港" : sailState === "leaving" ? "出港中…" : "回港中…";
  b.disabled = sailState === "leaving" || sailState === "returning";
}
function startSail() {
  if (sailState === "moored") { sailState = "leaving"; sailT = 0; bubble(1270, 380, "嘟——出港囉！"); }
  else if (sailState === "away") { sailState = "returning"; sailT = 1; }
  setSailBtn();
}
function updateSailer(B, dt) {
  const g = B.g;
  if (sailState === "moored") {
    if (auto) { sailCooldown -= dt; if (sailCooldown <= 0) { sailCooldown = 50; startSail(); } }
    return;
  }
  if (sailState === "leaving") { sailT += dt / 16; if (sailT >= 1) { sailT = 1; sailState = "away"; awayT = 14; setSailBtn(); } }
  else if (sailState === "away") { awayT -= dt; if (awayT <= 0 && auto) { sailState = "returning"; setSailBtn(); } }
  else if (sailState === "returning") { sailT -= dt / 16; if (sailT <= 0) { sailT = 0; sailState = "moored"; setSailBtn(); bubble(1270, 380, "平安回港！"); } }
  const [x, y, s] = pathAt(sailT);
  B.x = x; B.y = y; B.s = s;
  B.flip = sailState === "returning" ? false : true;  // 出港時船頭朝左，回港時朝右
  g.style.opacity = sailState === "away" ? 0 : (sailT > .85 ? (1 - sailT) / .15 : 1).toFixed(2);
}
function updateAngler(dt) {
  const rod = $("rod"), bob = $("bobber"), line = $("fishLine"), fish = $("caught");
  anglerT += dt;
  if (anglerState === 0) {             // 等魚
    nextBite -= dt;
    const dip = nextBite < 1.2 ? Math.abs(Math.sin(anglerT * 14)) * 4 : Math.sin(anglerT * 1.5);
    bob.setAttribute("cy", f1(42 + dip));
    if (nextBite <= 0) { anglerState = 1; anglerT = 0; }
  } else if (anglerState === 1) {      // 收竿
    const k = Math.min(1, anglerT / .7);
    rod.setAttribute("transform", `rotate(${f1(-k * 28)} 2 -22)`);
    line.setAttribute("d", `M62,-62 L${f1(66 - k * 30)},${f1(40 - k * 70)}`);
    bob.setAttribute("cx", f1(66 - k * 30)); bob.setAttribute("cy", f1(42 - k * 70));
    fish.setAttribute("opacity", k > .4 ? 1 : 0);
    fish.setAttribute("transform", `translate(${f1(30 + (1 - k) * 30)},${f1(-30 - k * 0)}) rotate(${f1(Math.sin(anglerT * 20) * 25)})`);
    if (k >= 1 && anglerT > 2.2) { anglerState = 2; anglerT = 0; bubble(1010, 380, pick(["釣到了！", "今晚加菜！", "好大一尾！"])); }
  } else {                             // 放回、再拋竿
    const k = Math.min(1, anglerT / 1);
    rod.setAttribute("transform", `rotate(${f1(-28 * (1 - k))} 2 -22)`);
    line.setAttribute("d", `M62,-62 L${f1(36 + k * 30)},${f1(-30 + k * 70)}`);
    bob.setAttribute("cx", f1(36 + k * 30)); bob.setAttribute("cy", f1(-28 + k * 70));
    fish.setAttribute("opacity", 0);
    if (k >= 1) { anglerState = 0; anglerT = 0; nextBite = rand(8, 16); ripple(1076, 494, .8); }
  }
}

/* =========================================================
   【互動】
   ========================================================= */
function svgPoint(evt) {
  const p = svg.createSVGPoint(); p.x = evt.clientX; p.y = evt.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
// 風向：滑鼠在畫面左右位置
svg.addEventListener("pointermove", e => { pointerIn = true; windTarget = (svgPoint(e).x / 1600 - .5) * 2.2; });
svg.addEventListener("pointerleave", () => { pointerIn = false; });
// 點窗戶開關燈
$("houses").parentNode.addEventListener("click", e => {
  const w = e.target.closest(".win"); if (!w) return;
  e.stopPropagation();
  w.querySelector(".lit").classList.toggle("on");
});
// 點海鷗：嚇飛
gulls.forEach(G => G.g.addEventListener("click", e => {
  e.stopPropagation();
  if (G.flee > 0) return;
  G.flee = 3.5; G.dir = G.x < 800 ? -1 : 1;
  bubble(G.x, G.y - 10, "嘎！");
}));
// 點港內船：鳴笛搖晃（紅色漁船停泊時會直接出港）
harborBoats.forEach(B => B.g.addEventListener("click", e => {
  e.stopPropagation();
  B.rock = 1;
  if (B.sailer && sailState === "moored") { startSail(); return; }
  bubble(B.x, B.y - 90 * B.s, "嘟——！");
  ripple(B.x, B.y + 6, 1.4);
}));
frontBoats.forEach(B => B.g.addEventListener("click", e => { e.stopPropagation(); B.rock = 1; ripple(B.x, B.y + 6, 1.2); }));
// 點燈塔：開關光束
$("lighthouse").addEventListener("click", e => {
  e.stopPropagation();
  beamOn = !beamOn; lhFlash = beamOn ? .6 : 0;
  bubble(1478, 100, beamOn ? "燈塔點亮" : "燈塔休息");
});
// 點路燈：正常的會閃一下；再點一次熄滅／點亮
lamps.forEach(L => L.g.addEventListener("click", e => {
  e.stopPropagation();
  if (L.on && L.flick <= 0) L.flick = .6; else { L.on = !L.on; L.flick = 0; }
}));
// 點釣客：立刻有魚上鉤
$("angler").addEventListener("click", e => { e.stopPropagation(); if (anglerState === 0) nextBite = Math.min(nextBite, 1.1); });
// 點貓：去偷魚
$("cat").addEventListener("click", e => { e.stopPropagation(); if (cat.state === "sit") { cat.state = "go"; bubble(cat.x, cat.y - 40, "喵～"); } });
// 點阿伯
$("oldman").addEventListener("click", e => { e.stopPropagation(); bubble(700, 390, pick(["今天風浪不大", "少年仔，吃飽沒？", "以前這港口更熱鬧喔"])); });
// 點海面：漣漪
svg.addEventListener("click", e => {
  const p = svgPoint(e);
  const onWater = (p.y > 520) || (p.y > 336 && p.x > 900 && !(p.x > 1250 && p.y < 380));
  if (onWater) { ripple(p.x, p.y, 1.6); setTimeout(() => ripple(p.x, p.y, 1), 180); }
});

// 控制鈕
$("btnDayNight").addEventListener("click", () => {
  const n = nightOf(phase);
  const to = n > .5 ? Math.floor(phase - .25) + 1.25 : Math.floor(phase - .75) + 1.75; // 往下一個「正午」或「午夜」
  tween = { from: phase, to: to <= phase ? to + 1 : to, t: 0 };
});
$("btnAuto").addEventListener("click", () => {
  auto = !auto;
  $("btnAuto").setAttribute("aria-pressed", auto);
  $("btnAuto").textContent = "自動循環：" + (auto ? "開" : "關");
});
$("btnSail").addEventListener("click", startSail);

/* =========================================================
   【特效】按鈕依序施放：煙火大會 → 鯨魚躍出 → 流星雨 → 彩虹飛魚
   自動循環開啟時，每隔一段時間也會隨機來一個。
   新增特效：在 FX 陣列加一筆 { name, start }，start() 回傳持續秒數。
   ========================================================= */
const fxL = { sky: $("fxSky"), stars: $("fxStars"), bow: $("fxBow"), sea: $("fxSea"), front: $("fxFront") };
const FW_COLORS = ["var(--fw1)", "var(--fw2)", "var(--fw3)", "var(--fw4)", "var(--fw5)"];
const fxParts = [];     // 粒子：{e, x, y, vx, vy, g, life, max, kind}
const fxJobs = [];      // 排程動作：{at, run}
let fxT = 0, fxBusy = 0, fxIdx = 0, fxAutoT = 40;

// 把時間推到正午（.25）或午夜（.75），回傳需要等待的秒數
function goToTime(target) {
  const need = target > .5 ? nightOf(phase) < .7 : nightOf(phase) > .3;
  if (!need) return 0;
  let to = Math.floor(phase - target) + 1 + target;
  if (to <= phase) to += 1;
  tween = { from: phase, to, t: 0 };
  return reduced ? 0 : 2.3;
}
function later(sec, run) { fxJobs.push({ at: fxT + sec, run }); }
function addPart(o) {
  const p = Object.assign({ vx: 0, vy: 0, g: 0, drag: 0, life: 1, kind: "dot" }, o);
  p.max = p.life;
  if (reduced) { p.x += p.vx * .45; p.y += p.vy * .45 + p.g * .1; } // 減少動態：直接擺在半途、不再移動
  fxParts.push(p);
  return p;
}

// ---- 煙火大會 ----
function burst(x, y, color) {
  // 外圈 + 內圈兩種顏色
  const inner = pick(FW_COLORS.filter(c => c !== color));
  [[54, rand(110, 150), color, 3], [26, rand(50, 70), inner, 2.4]].forEach(([n, sp, c, w]) => {
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2 + rand(-.05, .05), v = sp * rand(.8, 1.05);
      const e = el("line", { stroke: c, "stroke-width": w, "stroke-linecap": "round" }, fxL.sky);
      addPart({ e, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 46, drag: 1.1, life: rand(1.4, 1.9), kind: "streak" });
    }
  });
  // 中心閃光、海面倒影、天空微亮
  addPart({ e: el("circle", { cx: x, cy: y, r: 40, fill: color, opacity: .2 }, fxL.sky), x, y, life: .35, kind: "flash", r: 40 });
  addPart({ e: el("ellipse", { cx: x, cy: 345, rx: 110, ry: 8, fill: color, opacity: .3 }, fxL.sea), x, y: 352, life: 1.2, kind: "glow" });
  if (Math.random() < .5) addPart({ e: el("rect", { x: x - 3, y: 360, width: 6, height: 140, fill: color, opacity: .3 }, fxL.sea), x, y: 360, life: 1, kind: "glow" });
}
function fireworks() {
  const wait = goToTime(.75);   // 煙火要在夜裡放
  const shots = 11;
  for (let i = 0; i < shots; i++) {
    const at = wait + (reduced ? 0 : i * .6 + (i > 7 ? .5 : 0));
    later(at, () => {
      const x = rand(640, 1360), peak = rand(70, 210), color = pick(FW_COLORS);
      if (reduced) { burst(x, peak, color); return; }
      const head = el("circle", { r: 3, fill: "var(--fw2)" }, fxL.sky);
      const tail = el("line", { stroke: "var(--fw2)", "stroke-width": 2, "stroke-linecap": "round", opacity: .6 }, fxL.sky);
      addPart({ e: head, tail, x, y: 335, vx: rand(-12, 12), vy: -(335 - peak) / .9, life: .9, kind: "rocket", color });
    });
  }
  later(wait + (reduced ? 0 : 1.2), () => bubble(walkers[3].x, walkers[3].y - 70, "哇～煙火！"));
  return wait + (reduced ? 3 : 9);
}

// ---- 鯨魚躍出 ----
let whale = null;
function buildWhale() {
  const g = el("g", { opacity: 0 }, fxL.front);
  el("path", { d: "M-88,0 L-122,-24 L-110,0 L-122,24 Z", class: "f-whale" }, g);
  el("path", { d: "M-92,0 C-60,-40 40,-46 82,-14 C94,-6 94,8 82,13 C40,30 -40,24 -92,0 Z", class: "f-whale" }, g);
  el("path", { d: "M-46,12 C-8,25 42,24 80,12 C62,22 2,30 -46,12 Z", class: "f-whale-belly" }, g);
  for (let k = 0; k < 4; k++) el("path", { d: `M${10 + k * 14},${19 - k * .5} q12,-1 20,-4`, class: "s-whale", "stroke-width": 1.5, fill: "none" }, g);
  el("path", { d: "M8,10 L-2,40 L24,12 Z", class: "f-whale" }, g);
  el("circle", { cx: 58, cy: -4, r: 2.6, class: "f-ink" }, g);
  el("path", { d: "M-20,-30 l12,-10 l4,9 z", class: "f-whale" }, g);
  return g;
}
function splash(x, y, n, big) {
  for (let i = 0; i < n; i++) {
    const e = el("circle", { r: rand(2, 5) * big, class: "f-foam" }, fxL.front);
    addPart({ e, x: x + rand(-30, 30) * big, y, vx: rand(-70, 70) * big, vy: -rand(90, 220) * big, g: 420, life: rand(.7, 1.1) });
  }
  ripple(x, y, 2 * big); later(.2, () => ripple(x, y, 1.3 * big));
}
function whaleBreach() {
  if (!whale) whale = buildWhale();
  const W = { g: whale, t: reduced ? .55 : -.45, x0: 1170, x1: 1450, base: 640, h: 235, splashIn: false, splashOut: false };
  // 先噴氣
  for (let i = 0; i < 14; i++) later(reduced ? 0 : i * .05, () => {
    const e = el("circle", { r: rand(2, 4), class: "f-foam" }, fxL.front);
    addPart({ e, x: 1200 + rand(-4, 4), y: 586, vx: rand(-25, 25), vy: -rand(150, 210), g: 260, life: 1 });
  });
  fxWhale = W;
  later(reduced ? 0 : 1.2, () => bubble(1010, 380, "哇！是鯨魚！"));
  return reduced ? 3 : 5;
}
let fxWhale = null;
function updateWhale(dt) {
  const W = fxWhale; if (!W) return;
  if (!reduced) W.t += dt / 2.2;
  const u = clamp(W.t, 0, 1);
  if (W.t < 0) { W.g.setAttribute("opacity", 0); return; }
  if (!W.splashIn && !reduced) { W.splashIn = true; splash(W.x0 + 20, 590, 18, 1); }
  const x = W.x0 + (W.x1 - W.x0) * u, y = W.base - Math.sin(u * Math.PI) * W.h, rot = -58 + u * 116;
  W.g.setAttribute("opacity", 1);
  W.g.setAttribute("transform", `translate(${f1(x)},${f1(y)}) rotate(${f1(rot)})`);
  if (u >= .9 && !W.splashOut && !reduced) { W.splashOut = true; splash(W.x1 - 10, 590, 34, 1.5); }
  if (W.t >= 1.15 || (reduced && fxBusy <= 0)) { W.g.setAttribute("opacity", 0); fxWhale = null; }
}

// ---- 流星雨 ----
function meteorShower() {
  const wait = goToTime(.75);
  const n = reduced ? 10 : 26;
  for (let i = 0; i < n; i++) later(wait + (reduced ? 0 : rand(0, 5.5)), () => {
    const x = rand(300, 1700), y = rand(-20, 160), sp = rand(420, 620);
    const g = el("g", {}, fxL.stars);
    const tail = el("line", { stroke: "var(--star)", "stroke-width": 1.6, "stroke-linecap": "round", opacity: .45 }, g);
    const head = el("circle", { r: 2, fill: "var(--star)" }, g);
    addPart({ e: g, head, tail, x, y, vx: -sp * .88, vy: sp * .47, life: rand(.6, 1), kind: "meteor" });
  });
  later(wait + (reduced ? 0 : 1.5), () => bubble(cat.x, cat.y - 40, "喵…許個願"));
  return wait + (reduced ? 3 : 7);
}

// ---- 彩虹飛魚 ----
let bow = null, bowT = -1, bowDur = 0;
function rainbowFish() {
  const wait = goToTime(.25);
  if (!bow) {
    bow = el("g", { fill: "none" }, fxL.bow);
    for (let i = 0; i < 6; i++) {
      const r = 470 - i * 13;
      el("path", { d: `M${1020 - r},342 A${r},${r} 0 0 1 ${1020 + r},342`, stroke: `var(--rb${i + 1})`, "stroke-width": 13.5 }, bow);
    }
  }
  bowT = -wait; bowDur = 9;
  for (let i = 0; i < 9; i++) later(wait + (reduced ? 0 : 1 + i * .55 + rand(0, .3)), () => {
    const x0 = rand(880, 1300), y0 = rand(410, 590), dir = Math.random() < .5 ? -1 : 1;
    const g = el("g", {}, fxL.sea);
    el("path", { d: "M-9,0 Q0,-5 9,0 Q0,5 -9,0 Z M-9,0 l-6,-4 l0,8 z", class: "f-fish" }, g);
    el("path", { d: "M-2,-1 L-12,-11 L4,-2 Z", class: "f-wave" }, g);
    addPart({ e: g, x: x0, y: y0, x0, y0, dir, life: 1.1, kind: "flyfish" });
    ripple(x0, y0, .7);
  });
  later(wait + (reduced ? 0 : 1.2), () => bubble(700, 390, "雨過天晴，出彩虹囉"));
  return wait + (reduced ? 4 : 9.5);
}

const FX = [
  { name: "煙火大會", start: fireworks },
  { name: "鯨魚躍出", start: whaleBreach },
  { name: "流星雨", start: meteorShower },
  { name: "彩虹飛魚", start: rainbowFish },
];
function setFxBtn() {
  const b = $("btnFx");
  b.textContent = fxBusy > 0 ? "特效施放中…" : `特效：${FX[fxIdx].name}`;
  b.disabled = fxBusy > 0;
}
function playFx(i) {
  if (fxBusy > 0) return;
  fxBusy = FX[i].start();
  setFxBtn();
}

function updateFx(dt) {
  fxT += dt;
  for (let i = fxJobs.length - 1; i >= 0; i--) if (fxT >= fxJobs[i].at) { const j = fxJobs[i]; fxJobs.splice(i, 1); j.run(); }
  if (fxBusy > 0) { fxBusy -= dt; if (fxBusy <= 0) { fxBusy = 0; setFxBtn(); } }
  else if (auto && !reduced) { fxAutoT -= dt; if (fxAutoT <= 0) { fxAutoT = rand(40, 60); playFx(Math.floor(Math.random() * FX.length)); } }

  for (let i = fxParts.length - 1; i >= 0; i--) {
    const p = fxParts[i];
    p.life -= dt;
    const k = clamp(p.life / p.max, 0, 1);
    if (p.life <= 0) {
      if (p.kind === "rocket") { p.tail.remove(); burst(p.x, p.y, p.color); }
      p.e.remove(); fxParts.splice(i, 1); continue;
    }
    if (!reduced) {
      p.vy += p.g * dt;
      if (p.drag) { p.vx *= Math.exp(-p.drag * dt); p.vy *= Math.exp(-p.drag * dt); }
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    switch (p.kind) {
      case "streak":
        p.e.setAttribute("x1", f1(p.x)); p.e.setAttribute("y1", f1(p.y));
        p.e.setAttribute("x2", f1(p.x - p.vx * .07)); p.e.setAttribute("y2", f1(p.y - p.vy * .07));
        p.e.setAttribute("opacity", (k < .3 ? k / .3 * (Math.random() < .3 ? .4 : 1) : 1).toFixed(2));
        break;
      case "rocket":
        p.e.setAttribute("cx", f1(p.x)); p.e.setAttribute("cy", f1(p.y));
        p.tail.setAttribute("x1", f1(p.x)); p.tail.setAttribute("y1", f1(p.y));
        p.tail.setAttribute("x2", f1(p.x - p.vx * .12)); p.tail.setAttribute("y2", f1(p.y - p.vy * .12));
        break;
      case "flash":
        p.e.setAttribute("r", f1(p.r * (1.6 - k * .6))); p.e.setAttribute("opacity", (k * .18).toFixed(2));
        break;
      case "glow":
        p.e.setAttribute("opacity", (k * .3).toFixed(2));
        break;
      case "meteor":
        p.head.setAttribute("cx", f1(p.x)); p.head.setAttribute("cy", f1(p.y));
        p.tail.setAttribute("x1", f1(p.x)); p.tail.setAttribute("y1", f1(p.y));
        p.tail.setAttribute("x2", f1(p.x - p.vx * .25)); p.tail.setAttribute("y2", f1(p.y - p.vy * .25));
        p.e.setAttribute("opacity", Math.min(1, k * 2.5).toFixed(2));
        break;
      case "flyfish": {
        const u = reduced ? .5 : 1 - k;
        const x = p.x0 + p.dir * 140 * u, y = p.y0 - Math.sin(u * Math.PI) * 46;
        p.e.setAttribute("transform", `translate(${f1(x)},${f1(y)}) scale(${p.dir},1) rotate(${f1((u - .5) * 50)})`);
        if (p.life - dt <= 0 && !reduced) ripple(x, p.y0, .7);
        break;
      }
      default:
        p.e.setAttribute("cx", f1(p.x)); p.e.setAttribute("cy", f1(p.y));
        p.e.setAttribute("opacity", Math.min(1, k * 1.6).toFixed(2));
    }
  }
  updateWhale(dt);
  // 彩虹淡入淡出
  if (bowT > -50) {
    bowT += dt;
    const op = bowT < 0 ? 0 : reduced ? (bowT < bowDur ? .55 : 0) : Math.min(1, bowT / 1.5) * clamp((bowDur - bowT) / 1.5, 0, 1) * .55;
    fxL.bow.setAttribute("opacity", op.toFixed(2));
    if (bowT > bowDur) bowT = -99;
  }
}
$("btnFx").addEventListener("click", () => { const i = fxIdx; fxIdx = (fxIdx + 1) % FX.length; playFx(i); });

// 減少動態：停住浪、人、車、船，只保留手動切換
function applyReduced() {
  reduced = RM_QUERY.matches;
  if (reduced) { auto = false; $("btnAuto").setAttribute("aria-pressed", "false"); $("btnAuto").textContent = "自動循環：關"; }
}
RM_QUERY.addEventListener && RM_QUERY.addEventListener("change", applyReduced);
applyReduced();

/* =========================================================
   初始化
   ========================================================= */
// 行人名單：[類型索引, 起始 x, 方向]
[[0, 120, 1], [1, 520, -1], [2, 300, 1], [3, 760, -1], [4, 40, 1], [5, 620, 1]].forEach(([i, x, d]) => buildWalker(WALKER_TYPES[i], x, d));
applyNight(nightOf(phase), true);
clouds.forEach(c => c.g.setAttribute("transform", `translate(${c.x},${c.y})`));
waves.forEach(w => w.e.setAttribute("transform", `translate(${f1(w.x)},${f1(w.y)})`));
farBoats.forEach(b => b.g.setAttribute("transform", `translate(${b.x},${b.y}) scale(${b.s})`));
ferry.x = 1180; ferry.g.setAttribute("transform", `translate(${ferry.x},${ferry.y}) scale(${ferry.s},${ferry.s})`);
for (const s of swingers) if (s.type === "laundry") for (const it of s.items) it.e.setAttribute("transform", `translate(${f1(it.x)},${f1(it.y)})`);
// 減少動態時的靜態擺位
walkers.forEach(drawWalker);
gulls.forEach(G => { G.x = G.cx + Math.cos(G.ang) * G.r; G.y = G.cy; G.g.setAttribute("transform", `translate(${f1(G.x)},${f1(G.y)}) scale(${f1(G.s)})`); });
harborBoats.forEach(B => { B.g.setAttribute("transform", `translate(${B.x},${B.y}) scale(${(B.flip ? -1 : 1) * B.s},${B.s})`); B.flag.setAttribute("d", `M${B.mx},-78 l20,4 l0,8 l-20,4 Z`); });
frontBoats.forEach(B => B.g.setAttribute("transform", `translate(${B.x},${B.y}) scale(${B.dir},1)`));
$("cat").setAttribute("transform", `translate(${cat.x},${cat.y})`);
if (reduced) { spawnVehicle(); veh.x = 420; drawVehicle(veh); }
setSailBtn();
setFxBtn();
requestAnimationFrame(frame);
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => fxBusy > 0,
  btn: 'btnFx',
  save: () => ({ phase }),
  stop: () => {
    fxJobs.length = 0;
    fxParts.forEach(p => { p.e.remove(); if (p.tail) p.tail.remove(); }); fxParts.length = 0;
    if (fxWhale) { fxWhale.g.setAttribute('opacity', 0); fxWhale = null; }
    tween = null; fxBusy = 0; setFxBtn();
  },
  restore: s => { phase = s.phase; }
});
/* /ShowStop */
})();
</script>
