<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>巴拿馬運河船閘</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-51 巴拿馬運河船閘｜藍晒圖風格
   地點：巴拿馬運河大西洋端的加通船閘（Gatun Locks）。
   用工程「縱剖面圖」看三階船閘：左邊是加勒比海（海平面），
   右邊是海拔約 26 公尺的加通湖，中間三座閘室一階一階往上。
        海 → 閘門0 → 第一閘室 → 閘門1 → 第二閘室 → 閘門2 → 第三閘室 → 閘門3 → 加通湖
   剖面看得到：人字閘門、閘室水位、地底的大涵洞與閥門、閘牆上牽船的電動機車（騾子）、
   控制室、觀景台；上方小框是「平面圖」，看得到人字閘門的 V 字開合。
   風格重點（藍晒圖 blueprint）：
        - 普魯士藍晒圖紙、白色細線、斑駁褪色與格線
        - 工程製圖語彙：剖面斜線、隱藏線（虛線）、中心線、水位符號 ▽、尺寸標註、
          比例尺、指北針、雙線圖框
        - 縱向比例放大（運河縱剖面圖的慣例），讓水位差看得清楚
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），部分另有 --k-名稱（晨昏）。
   JS 會依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）兩個 class。
   ========================================================= */
:root{
  color-scheme: light;

  /* —— 晒圖紙與線條（隨日夜變化） —— */
  --d-paper:#1f5c9f;   --k-paper:#36508e;   --n-paper:#0b1a37;    /* 晒圖紙底色 */
  --d-face:#2a6aad;    --k-face:#435c98;    --n-face:#0f2346;     /* 受光面 */
  --d-face-sh:#1a4f8b; --k-face-sh:#2f4479; --n-face-sh:#09162e;  /* 背光面 */
  --d-line:#f1f6ff;    --k-line:#fbe9dc;    --n-line:#79acdf;     /* 白色墨線 */
  --d-water:#5d9ee0;   --k-water:#6a7fc0;   --n-water:#1a3c70;    /* 水的剖面 */
  --d-win:#184a85;     --n-win:#ffd27a;                           /* 會亮燈的窗 */
  --d-glow:#1f5c9f00;  --k-glow:#ff9a6a;    --n-glow:#0b1a3700;   /* 晨昏地平線的暖光 */

  /* —— 光源與表演用色（不隨日夜變化） —— */
  --sun:#fff1c4;
  --moon:#eaf2ff;
  --lamp:#ffc764;      /* 鈉燈 */
  --lamp-core:#fff3d2;
  --red-light:#ff4b4b; /* 起重機航空障礙燈、船的左舷燈 */
  --green-light:#5dff9a;
  --flow:#9fe9ff;      /* 涵洞裡的水流 */
  --flow-down:#ffd08a; /* 放水時的水流 */
  --cable:#ffe9a8;     /* 騾子的鋼纜 */
  --flash:#ffffff;     /* 相機閃光、閃電 */
  --steam:#ffffff;

  /* —— 天氣 —— */
  --fog:#dbe8f7;
  --rain:#d6e6ff;
  --wx-dark:#05112a;

  /* —— 頁面介面 —— */
  --page-bg:#e8eef6; --page-fg:#14325c; --page-muted:#5b6f8c;
  --ui-surface:#f6f9fd; --ui-line:#c2d0e3; --ui-accent:#1f5c9f;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  /* 圖上的尺寸數字用手寫感字體 */
  --font-hand:"Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS","Comic Neue",cursive;
  --non:0;   /* 夜晚程度（JS 更新） */
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:6px;overflow:hidden;background:var(--paper);line-height:0;box-shadow:0 2px 10px #0000002a}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:10px;padding:10px 14px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--page-fg);border-color:var(--page-fg);color:#fff;font-weight:700}
.panel button.big{border-color:var(--ui-accent);color:#fff;background:var(--ui-accent);font-weight:700}
.panel button.big.on{background:#f2a33a;border-color:#f2a33a;color:#14325c}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
/* 畫面內可點物件：滑鼠點不顯示外框，用鍵盤 Tab 時才顯示 */
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid #ffd27a;outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 內的樣式（製圖線條） ---------- */
#scene .ln{fill:none;stroke:var(--line);stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}
#scene .lnT{fill:none;stroke:var(--line);stroke-width:.75;opacity:.78;stroke-linejoin:round;stroke-linecap:round}
#scene .lnB{fill:none;stroke:var(--line);stroke-width:2.1;stroke-linejoin:round;stroke-linecap:round}
#scene .cons{fill:none;stroke:var(--line);stroke-width:.55;opacity:.38}
#scene .ctr{fill:none;stroke:var(--line);stroke-width:.6;opacity:.5;stroke-dasharray:14 3 2 3}
#scene .dsh{fill:none;stroke:var(--line);stroke-width:.9;opacity:.75;stroke-dasharray:4 3}
#scene .hid{fill:none;stroke:var(--line);stroke-width:.9;opacity:.6;stroke-dasharray:6 4}
#scene .fc{fill:var(--face)}
#scene .fcS{fill:var(--face-sh)}
#scene .fp{fill:var(--paper)}
#scene .fl{fill:var(--line)}
#scene .hand{font-family:var(--font-hand);fill:var(--line);font-size:12px}
#scene .mono{font:600 10px ui-monospace,Menlo,Consolas,monospace;fill:var(--line)}
#scene .win{fill:var(--win)}
#scene .hot{cursor:pointer}
#scene .puff{fill:var(--steam);fill-opacity:.1;stroke:var(--line);stroke-width:.7;stroke-dasharray:3 2.5}
#scene .night{opacity:var(--non)}
#scene .wat{fill:var(--water);fill-opacity:.62}
#scene .flowp{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:10 9}
#scene .bubble rect,#scene .tag rect{fill:var(--paper);stroke:var(--line);stroke-width:1.4}
#scene .bubble text{fill:var(--line);font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .tag text{fill:var(--line);font:700 13px var(--font-ui);dominant-baseline:central}
#scene .bubble .pop{animation:pop var(--dur,1.6s) ease-out forwards}
@keyframes pop{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  #scene .bubble .pop{animation:none}
}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：晒圖紙 → 天空（星、日月、雲）→ 平面圖小框 → 軍艦鳥
       → 遠山雨林 → 遠方海灣（港口起重機、錨地的船）與加通湖（小島、帆船）
       → 湖岸雨林（木棉巨樹、吼猴、巨嘴鳥、樹懶、長鼻浣熊、鱷魚）
       → 閘牆立面（背後那面牆）→ 開著的閘門 → 路燈、控制室、觀景台
       → 軌道與騾子、鋼纜 → 船 → 水（剖面）→ 關著的閘門（剖面）
       → 地底剖面（涵洞、閥門、水流）→ 標註 → 夜燈 → 天氣 → 滑鼠標註 → 對話框 → 圖框
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="藍晒圖風格的巴拿馬運河加通船閘縱剖面圖動畫：左邊是加勒比海，右邊是高出海面約 26 公尺的加通湖，中間三座閘室像樓梯一樣一階一階往上，人字閘門、地底的大涵洞與閥門、閘牆上牽船的電動機車都畫得清清楚楚；船進閘後閘門關上，湖水經涵洞流進閘室，水位上升把船抬高，再進下一階；背景有港口起重機、雨林與木棉巨樹，樹上有吼猴、巨嘴鳥和樹懶，觀景台上的遊客在看船">
    <defs id="defs">
      <pattern id="gridMin" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M20 0H0V20" style="fill:none;stroke:var(--line)" stroke-width=".5" opacity=".08"/>
      </pattern>
      <pattern id="gridMaj" width="100" height="100" patternUnits="userSpaceOnUse">
        <path d="M100 0H0V100" style="fill:none;stroke:var(--line)" stroke-width=".8" opacity=".12"/>
      </pattern>
      <!-- 45 度剖面斜線 -->
      <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="6" style="stroke:var(--line)" stroke-width=".8" opacity=".42"/>
      </pattern>
      <pattern id="hatchD" width="3.5" height="3.5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="3.5" style="stroke:var(--line)" stroke-width=".8" opacity=".7"/>
      </pattern>
      <!-- 混凝土剖面：斜線＋小點（骨材） -->
      <pattern id="concrete" width="14" height="14" patternUnits="userSpaceOnUse">
        <path d="M0 14L14 0" style="stroke:var(--line)" stroke-width=".7" opacity=".38"/>
        <circle cx="4" cy="4" r=".8" style="fill:var(--line)" opacity=".45"/>
        <circle cx="10" cy="9" r=".6" style="fill:var(--line)" opacity=".4"/>
        <path d="M8 2l1.4 1.4-1.6.4z" style="fill:var(--line)" opacity=".35"/>
      </pattern>
      <!-- 土層：短斜線點陣 -->
      <pattern id="soil" width="18" height="12" patternUnits="userSpaceOnUse">
        <path d="M2 4l4-3M11 10l4-3" style="stroke:var(--line)" stroke-width=".6" opacity=".3"/>
        <circle cx="13" cy="3" r=".7" style="fill:var(--line)" opacity=".3"/>
      </pattern>
      <!-- 水：水平短線 -->
      <pattern id="liq" width="16" height="7" patternUnits="userSpaceOnUse">
        <line x1="0" y1="3" x2="9" y2="3" style="stroke:var(--line)" stroke-width=".7" opacity=".32"/>
      </pattern>
      <radialGradient id="gLamp"><stop offset="0" stop-color="var(--lamp)" stop-opacity=".95"/><stop offset=".35" stop-color="var(--lamp)" stop-opacity=".35"/><stop offset="1" stop-color="var(--lamp)" stop-opacity="0"/></radialGradient>
      <radialGradient id="gRed"><stop offset="0" stop-color="var(--red-light)" stop-opacity="1"/><stop offset=".3" stop-color="var(--red-light)" stop-opacity=".4"/><stop offset="1" stop-color="var(--red-light)" stop-opacity="0"/></radialGradient>
      <radialGradient id="gGreen"><stop offset="0" stop-color="var(--green-light)" stop-opacity="1"/><stop offset=".3" stop-color="var(--green-light)" stop-opacity=".4"/><stop offset="1" stop-color="var(--green-light)" stop-opacity="0"/></radialGradient>
      <radialGradient id="gSun"><stop offset="0" stop-color="var(--sun)" stop-opacity=".5"/><stop offset="1" stop-color="var(--sun)" stop-opacity="0"/></radialGradient>
      <radialGradient id="gFlash"><stop offset="0" stop-color="var(--flash)" stop-opacity="1"/><stop offset="1" stop-color="var(--flash)" stop-opacity="0"/></radialGradient>
      <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></radialGradient>
      <linearGradient id="duskG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--glow)" stop-opacity="0"/><stop offset="1" stop-color="var(--glow)" stop-opacity=".75"/></linearGradient>
      <linearGradient id="fogG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--fog)" stop-opacity="0"/><stop offset=".5" stop-color="var(--fog)" stop-opacity=".6"/><stop offset="1" stop-color="var(--fog)" stop-opacity="0"/></linearGradient>
      <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--lamp)" stop-opacity=".4"/><stop offset="1" stop-color="var(--lamp)" stop-opacity="0"/></linearGradient>
    </defs>

    <!-- 晒圖紙：底色、斑駁、格線 -->
    <rect x="0" y="0" width="1600" height="600" class="f-paper"/>
    <image id="mottle" x="0" y="0" width="1600" height="600" preserveAspectRatio="none" href="" opacity=".55" pointer-events="none"/>
    <rect x="0" y="0" width="1600" height="600" fill="url(#gridMin)" pointer-events="none"/>
    <rect x="0" y="0" width="1600" height="600" fill="url(#gridMaj)" pointer-events="none"/>
    <rect id="dusk" x="0" y="100" width="1600" height="300" fill="url(#duskG)" opacity="0" pointer-events="none"/>

    <!-- 天空 -->
    <g id="skyPar">
      <g id="stars" class="night"></g>
      <g id="sun"></g>
      <g id="moon"></g>
      <g id="clouds"></g>
      <g id="wxClouds" opacity="0"></g>
      <g id="bolt"></g>
    </g>
    <rect id="skyHit" x="0" y="0" width="1600" height="215" fill="transparent" role="button" tabindex="0" aria-label="天空：白天點了有軍艦鳥飛過，夜晚有流星"/>
    <g id="plan"></g>
    <g id="birds"></g>
    <!-- 遠景 -->
    <g id="hills"></g>
    <g id="farBay"></g>
    <g id="farLake"></g>
    <g id="farBoats"></g>
    <g id="shore"></g>
    <!-- 船閘：背後的閘牆立面 -->
    <g id="backWall"></g>
    <g id="gateBack"></g>
    <g id="poles"></g>
    <g id="build"></g>
    <g id="track"></g>
    <g id="mules"></g>
    <g id="cables" pointer-events="none"></g>
    <g id="pelicans"></g>
    <g id="plumes" pointer-events="none"></g>
    <g id="ship"></g>
    <!-- 水與剖面 -->
    <g id="water" pointer-events="none"></g>
    <g id="gateCut"></g>
    <g id="earth"></g>
    <g id="culvert"></g>
    <g id="dims"></g>
    <g id="lampGlow" class="night" pointer-events="none"></g>
    <g id="aviation" pointer-events="none"></g>
    <!-- 天氣 -->
    <g id="weather" pointer-events="none">
      <rect id="wxDark" x="0" y="0" width="1600" height="600" style="fill:var(--wx-dark)" opacity="0"/>
      <g id="fog" opacity="0"></g>
      <g id="rain" opacity="0"></g>
      <rect id="wxFlash" x="0" y="0" width="1600" height="600" style="fill:var(--flash)" opacity="0"/>
    </g>
    <!-- 滑鼠：標註框與十字準星 -->
    <g id="hover" pointer-events="none"></g>
    <g id="cross" pointer-events="none" opacity="0"></g>
    <g id="bubbles" pointer-events="none"></g>
    <rect x="0" y="0" width="1600" height="600" fill="url(#vig)" pointer-events="none"/>
    <!-- 圖框（雙線） -->
    <g pointer-events="none">
      <rect x="7" y="7" width="1586" height="586" class="ln" opacity=".55"/>
      <rect x="12" y="12" width="1576" height="576" class="lnT" opacity=".4"/>
      <path id="frameTicks" class="lnT" opacity=".5"/>
    </g>
  </svg>
  </figure>

  <!-- ===== 互動：控制列 ===== -->
  <div class="panel">
    <button id="btnUp" class="big" type="button">⬆ 上行過閘</button>
    <button id="btnDown" class="big" type="button">⬇ 下行過閘</button>
    <button id="btnWeather" type="button">天氣：晴</button>
    <button id="btnSound" type="button" aria-pressed="true">🔊 聲音：開</button>
    <button id="btnDay" type="button">☀ 白天</button>
    <button id="btnNight" type="button">☾ 夜晚</button>
    <button id="btnAuto" type="button" aria-pressed="true">自動播放</button>
    <label class="timebox" for="timeRange">
      <span>時間</span>
      <input id="timeRange" type="range" min="0" max="1000" value="417">
      <span class="clock" id="clock">10:00</span>
    </label>
  </div>
  <ul class="hint">
    <li><b>上行過閘</b>：船從加勒比海一階一階升到加通湖。</li>
    <li><b>下行過閘</b>：船從加通湖一階一階降回海面。</li>
    <li><b>點閘門</b>：兩邊水位一樣才打得開。</li>
    <li><b>點一點</b>：船、騾子、控制室、遊客、動物；滑鼠移到設備上看尺寸。</li>
    <li><b>天氣</b>：晴、多雲、雷雨、霧輪流切換。</li>
  </ul>
</main>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {

    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);

  W.setInterval = function (fn, ms, ...a) {

  };

    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}

      const e = all[i];

    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {

  const btns = [];

    if (!kind) return null;

    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }

    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';

      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它

    init(c) {

            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };

      });

      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();

<script>

   比例（縱向放大的縱剖面圖）：

}

function newTrack(kind) {

    if (old) { old.gain.setTargetAtTime(0, actx.currentTime, .15); setTimeout(() => { try { old.disconnect(); } catch (e) {} }, 900); }

const sfx = fn => { if (quiet || !audioOK()) return; OUT = sfxBus; fn(actx.currentTime + .02); OUT = null; };

// 水流進閘室：低沉的翻滾聲

/* 「上行過閘」配樂（原創，約 20 秒）：巴拿馬鄉間音樂的感覺——手風琴旋律＋鼓與拍手，
   每升一階就整首往上移調（C → D → E），最後停在明亮的 G 大調和弦 */
function accordion(t, f, dur, vol = .05) {

  const lfo = actx.createOscillator(); lfo.frequency.value = 5.5; const lg = actx.createGain(); lg.gain.value = f * .006; lfo.connect(lg);

function upMusic(t) {
  OUT = newTrack('mus');

  // 旋律（度數：1=主音），每段 12 拍、3 段各上移一個全音
  const MEL = [[5, 1], [5, .5], [6, .5], [5, 1], [3, 1], [4, 1], [5, .5], [4, .5], [3, 1], [2, 1], [1, .5], [2, .5], [3, 1], [5, 1], [8, 2]];

/* 「下行過閘」配樂（原創，約 20 秒）：三拍子的吉他撥弦（像巴拿馬的帕西約舞曲），

const DAY_SEC = 160;
const T = { t: 10 / 24, auto: true, target: null };
let night = 0, dusk = 0, nOn = 0, lastApplied = -1;
function clockText() {
  const h = T.t * 24, hh = Math.floor(h) % 24, mm = Math.floor((h - Math.floor(h)) * 60 + 1e-6);
  return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;

function applyTime(force) {
  if (!force && Math.abs(T.t - lastApplied) < .0003) return;
  lastApplied = T.t;

  // 巴拿馬靠近赤道：約 6:20 日出、18:20 日落
  night = clamp(1 - smooth(5.6, 7.2, h) + smooth(17.8, 19.3, h), 0, 1);
  dusk = Math.max(Math.exp(-Math.pow((h - 6.4) / .9, 2)), Math.exp(-Math.pow((h - 18.5) / .9, 2)));
  for (const k in PAIRS) {
    const Pp = PAIRS[k];
    let c = mix(Pp.d, Pp.n, night);
    if (Pp.k) c = mix(c, Pp.k, dusk * .8);
    root.style.setProperty('--' + k, rgba(c));

  $('moon').style.display = mp > -.06 && mp < 1.06 ? '' : 'none';
  $('mottle').setAttribute('opacity', f1(.55 - nOn * .3));

}

/* ---------------- ④ 動畫：表演秀 ----------------
   上行過閘：船從加勒比海開進第一閘室 → 關門 → 湖水經涵洞靠重力流進閘室、水位上升把船抬高 8.5 m

   下行過閘：反過來，船從加通湖開進第三閘室 → 關門 → 打開閥門把水放到下游、船跟著下降……回到海面 */

  const S = [];

    const a = up ? LOW[k] : HIGH[k], b = up ? HIGH[k] : LOW[k];
    add(2.2, () => {
      show.flow = { k, up };
      if (up) for (let j = k + 1; j < 4; j++) valveT[j] = 1; else for (let j = 0; j <= k; j++) valveT[j] = 1;
      sfx(t => gush(t, 2.3, .12));
      const step = up ? k + 1 : 3 - k;
      const msg = up ? ['第一階：升高 8.5 m', '第二階：再升 8.5 m', '第三階：升到湖面 +26 m！'][k] : ['第三階：降到海面', '第二階：再降 8.5 m', '第一階：下降 8.5 m'][k];
      narr(CX[k], HIGH[k] - 150, msg, 2.2);
      if (step === 1) setTimeout(() => narr(CX[k], FLOOR[k] + 50, up ? '湖水經涵洞流進閘室，不用抽水機' : '閘室的水排到下游，最後流進大海', 2.4), 900);
    }, p => { lvl[k] = lerp(a, b, easeIO(p)); }, () => { show.flow = null; valveT.fill(0); });

      newShip(1, type); ship.x = -320; ship.y = SEA; gateT.fill(0);
      show.l0 = lvl.slice();
    }, p => {
      ship.x = lerp(-320, 140, 1 - Math.pow(1 - p, 2));
      for (let k = 0; k < 3; k++) lvl[k] = lerp(show.l0[k], LOW[k], easeIO(p));
    });

      ship.x = lerp(CX[2], 1940, p * p * .5 + p * .5);

function startShow(dir, user, type) {

/* ---------------- 動畫主迴圈 ---------------- */
let last = 0, rafId = 0;
function loop(now) {
  const dt = clamp((now - last) / 1000, 0, .05); last = now;
  step(dt);
  rafId = requestAnimationFrame(loop);
}
function settle(sec) { for (let s = 0; s < sec; s += .05) step(.05); }
function renderStill() { step(.0001); }
function start() {
  cancelAnimationFrame(rafId);
  if (reduced) { T.auto = false; syncAuto(); applyTime(true); settle(2); }
  else { last = performance.now(); rafId = requestAnimationFrame(loop); }
}

  path(g, `M${GX[0]} ${y}H${GX[1]}M${GX[0]} ${y - 5}V${y + 5}M${GX[1]} ${y - 5}V${y + 5}M${GX[0] + 6} ${y - 3}L${GX[0]} ${y}L${GX[0] + 6} ${y + 3}M${GX[1] - 6} ${y - 3}L${GX[1]} ${y}L${GX[1] - 6} ${y + 3}`, 'lnT');
  el('rect', { x: CX[0] - 26, y: y - 9, width: 52, height: 16, class: 'fp', opacity: .85 }, g);
  txt(g, CX[0], y + 4, '320 m', 'hand', { 'text-anchor': 'middle', 'font-size': 12 });
  // 比例尺、指北針、縱向比例註記
  const sb = el('g', { transform: 'translate(1380 556)' }, g);
  el('rect', { x: -10, y: -22, width: 200, height: 34, class: 'fp', opacity: .85 }, sb);
  for (let i = 0; i < 4; i++) el('rect', { x: i * 26, y: -4, width: 26, height: 5, class: i % 2 ? 'fp' : 'fl' }, sb);
  el('rect', { x: 0, y: -4, width: 104, height: 5, class: 'lnT' }, sb);
  txt(sb, 0, -9, '0', 'hand', { 'font-size': 10 }); txt(sb, 96, -9, '100 m', 'hand', { 'font-size': 10 });
  txt(sb, 0, 10, '縱向比例放大約 5 倍', 'hand', { 'font-size': 10, opacity: .85 });
  const na = el('g', { transform: 'translate(1555 548)' }, g);
  el('circle', { r: 12, class: 'lnT' }, na);
  path(na, 'M0 -14L4 0L0 -3L-4 0Z', 'fl'); path(na, 'M0 14L4 0L0 3L-4 0Z', 'ln');
  txt(na, -3.5, -17, 'N', 'mono');
})();

/* ---------------- ⑤ 互動：點擊 ---------------- */
function onAct(node, fn) {
  node.addEventListener('click', e => { e.stopPropagation(); userGesture = true; ensureAudio(); fn(e); if (reduced) settle(.6); });
  node.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); userGesture = true; ensureAudio(); fn(e); if (reduced) settle(.6); } });
}
function svgPoint(e) {
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
svg.addEventListener('pointerdown', () => { userGesture = true; ensureAudio(); document.body.classList.remove('kbd'); });
window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });

// 滑鼠：十字準星＋座標（距離、海拔）、移到設備上標出名稱與尺寸、遠山視差
const cross = $('cross');
const chH = el('line', { x1: 0, x2: 1600, class: 'dsh', opacity: .35 }, cross);
const chV = el('line', { y1: 0, y2: 600, class: 'dsh', opacity: .35 }, cross);
const chC = el('circle', { r: 6, class: 'ln' }, cross);
const chT = el('text', { class: 'mono' }, cross);
svg.addEventListener('pointermove', e => {
  const p = svgPoint(e);
  px = clamp((p.x - 800) / 800, -1, 1);
  if (e.pointerType === 'mouse') {
    cross.setAttribute('opacity', 1);
    chH.setAttribute('y1', f1(p.y)); chH.setAttribute('y2', f1(p.y));
    chV.setAttribute('x1', f1(p.x)); chV.setAttribute('x2', f1(p.x));
    chC.setAttribute('cx', f1(p.x)); chC.setAttribute('cy', f1(p.y));
    const e2 = elev(p.y);
    chT.textContent = `X ${((p.x - GX[0]) * 320 / 310).toFixed(0)} m  海拔 ${e2 >= 0 ? '+' : ''}${e2.toFixed(1)} m`;
    chT.setAttribute('x', f1(Math.min(p.x + 10, 1430))); chT.setAttribute('y', f1(Math.max(p.y - 10, 24)));
  }
  const h = e.target.closest ? e.target.closest('.hot') : null;
  if (h !== hoverEl) { hoverEl = h; drawHover(h); }
});
svg.addEventListener('pointerleave', () => { px = 0; cross.setAttribute('opacity', 0); hoverEl = null; drawHover(null); });

// 天空：白天軍艦鳥飛過，夜晚流星
onAct($('skyHit'), e => {
  const p = e.type === 'click' ? svgPoint(e) : { x: 800, y: 120 };
  if (night < .5) {
    const dir = p.x < 800 ? 1 : -1;
    for (let i = 0; i < 3; i++) spawnBird(p.x - dir * i * 30, clamp(p.y, 50, 200) + rand(-15, 15), dir * rand(80, 110));
    sfx(whoosh);
  } else {
    const g = el('path', { class: 'ln', style: 'stroke:var(--lamp-core)' }, $('birds'));
    let k = 0; const x0 = p.x, y0 = clamp(p.y, 30, 200);
    const iv = setInterval(() => { k += .06; g.setAttribute('d', `M${f1(x0 - k * 180)} ${f1(y0 + k * 70)}l${f1(36 * (1 - k))} ${f1(-14 * (1 - k))}`); g.setAttribute('opacity', f1(1 - k)); if (k >= 1) { clearInterval(iv); g.remove(); } }, 30);
    sfx(whoosh);
    say(x0, y0 + 40, '流星！許個願吧', 1.6);
  }
});
$('sun').setAttribute('class', 'hot'); $('moon').setAttribute('class', 'hot');
onAct($('sun'), () => goTo(21 / 24));
onAct($('moon'), () => goTo(10 / 24));
// 閘門：兩邊水位一樣才打得開（表演中由控制室操作）
GATES.forEach((G, k) => onAct(G.g, () => {
  if (show.on) { say(G.x, G.top - 30, '控制室正在操作閘門', 1.6); return; }
  const a = k === 0 ? SEA : lvl[k - 1], b = k === 3 ? LAKE : lvl[k];
  if (Math.abs(a - b) > 1) {
    G.wig = 1; sfx(t => { clank(t); bell(t + .15, 120, .08, .5); });
    say(G.x, G.top - 30, `兩邊水位差 ${(Math.abs(a - b) / PXM).toFixed(1)} m，水壓太大打不開！`, 2.2);
    return;
  }
  gateT[k] = gateT[k] > .5 ? 0 : 1;
  sfx(t => gateMotor(t, .6));
  say(G.x, G.top - 30, gateT[k] ? '人字閘門打開了' : '閘門關上，兩扇門在中間頂成 V 字', 1.8);
}));
// 閥門
VALVES.forEach((V, k) => onAct(V.g, () => {
  if (show.on) { say(V.x, V.y - 50, '閥門正在調節水流', 1.4); return; }
  valveT[k] = 1; setTimeout(() => { valveT[k] = 0; }, 1400);
  sfx(t => { gateMotor(t, .4); noise(t + .4, .8, 400, .06, 'lowpass', .7, .1); });
  say(V.x, V.y - 50, '閥門往上升，涵洞的水就能流過', 1.8);
}));
onAct(document.querySelector('[data-name="大涵洞"]'), () => {
  sfx(t => noise(t, 1.2, 260, .08, 'lowpass', .7, .2));
  say(800, 520, pick(['涵洞直徑約 5.5 m，大到火車都開得進去', '水從加通湖靠重力往下流，不用抽水機']), 2.4);
});
// 閘室：看水位
document.querySelectorAll('#backWall .hot').forEach(h => onAct(h, () => {
  const k = +h.dataset.k;
  sfx(t => splash(t, .05));
  say(CX[k], lvl[k] - 30, `${['第一', '第二', '第三'][k]}閘室水位：海拔 +${elev(lvl[k]).toFixed(1)} m`, 2);
}));
// 騾子
mules.forEach(m => onAct(m.g, () => {
  m.bump = 4; sfx(muleSnd);
  say(m.x, m.y - 40, pick(['騾子：用鋼纜讓船保持在閘室正中間', '爬坡時用齒軌，才不會滑下去', '大船靠自己的動力前進，騾子負責拉穩']), 2.2);
}));
onAct(document.querySelector('[data-name="騾子軌道"]'), () => { sfx(click); say(760, 280, '閘牆頂上的軌道，閘門那裡是陡坡', 1.8); });
// 船（點了才鳴笛）
function shipClick() {
  if (ship.honk > 0) return;
  ship.honk = 2.5;
  sfx(t => shipHorn(t, ship.type === 'cruise' ? 110 : 82, 1.6, .18));
  say(ship.x, ship.y - 130, pick(ship.type === 'cruise' ? ['郵輪的乘客都跑到甲板上看', '嘟——！穿越運河是郵輪航程的亮點'] :
    ship.type === 'car' ? ['滿載汽車，要去太平洋另一邊', '嘟——！汽車運輸船過閘中'] :
    ['嘟——！貨櫃船過閘中', '走運河可以省下繞南美洲的上萬公里', '船上的領港員負責指揮過運河']), 2.2);
}
// 控制室
onAct(BLD.ctrl, () => {
  BLD.flick = 1.2;
  sfx(t => { click(t); click(t + .12); bell(t + .25, 1320, .04, .4); });
  say(1000, 190, pick(['控制室：閘門和閥門都從這裡操作', '運河 1914 年通航，一年到頭日夜不停', '下一艘，準備進閘！']), 2.2);
});
// 觀景台、遊客
onAct(document.querySelector('[data-name="遊客觀景台"]'), () => { BLD.visitors.forEach(v => v.cheer = 1.2); sfx(t => applause(t, 1.2)); say(1135, 180, '大家揮揮手！', 1.6); });
BLD.visitors.forEach((v, i) => onAct(v.g, () => {
  v.cheer = 1.4;
  if (v.o.cam) { camFlash(v); sfx(shutter); }
  else sfx(t => bell(t, 1800, .04, .3));
  say(v.x, BLD.oy - 50, pick(show.on ? ['哇，船被抬起來了！', '閘門好大！', '騾子好可愛'] : ['等下一艘船來', '水位差好多', '你看那邊有鵜鶘', '湖那邊有猴子在叫']), 1.8);
}));
onAct(document.querySelector('[data-name="刨冰攤（raspao）"]'), () => { sfx(scrape); say(BLD.ox + 20, BLD.oy - 52, pick(['來一杯刨冰！淋上紅色糖漿', '加煉乳更好吃', '天氣熱，吃冰最消暑']), 1.8); });
// 動物
ANIM.monkeys.forEach(m => onAct(m.g, () => { ANIM.monkeys.forEach(o => o.howl = 1.8); sfx(howl); say(1520, 96, '吼猴在大叫！好幾公里外都聽得到', 2); }));
onAct(ANIM.toucan.g, () => {
  const tc = ANIM.toucan;
  if (tc.fly > 0) return;
  tc.from = [tc.x, tc.y]; tc.to = tc.x > 1540 ? [1500, 126] : [1576, 132]; tc.fly = 1.4; tc.hop = .5;
  sfx(toucanCall);
});
onAct(ANIM.sloth.g, () => { sfx(t => bell(t, 300, .03, 1.2)); say(1474, 170, pick(['慢……慢……來……', '樹懶一週只下樹一次']), 2); });
onAct(ANIM.coati.g, () => { const c = ANIM.coati; c.stop = 1.6; sfx(t => { for (let i = 0; i < 3; i++) bell(t + i * .1, 2600 + i * 200, .03, .15); }); say(c.x, 250, pick(['長鼻浣熊：請不要餵我喔', '尾巴豎起來保持平衡']), 1.8); });
onAct(ANIM.croc.g, () => { if (ANIM.croc.swim > 0) return; ANIM.croc.swim = 3; sfx(t => splash(t, .07)); say(1540, 250, '鱷魚滑進湖裡了', 1.6); });
onAct(ANIM.tree, () => { sfx(t => noise(t, 1, 3000, .04, 'bandpass', .6, .3)); say(1520, 96, '木棉巨樹：雨林裡最高的樹之一', 2); });
// 鵜鶘：俯衝抓魚
pelicans.forEach(p => onAct(p.g, () => {
  if (p.st !== 'perch') return;
  p.st = 'dive'; p.t = 0; sfx(whoosh);
}));
// 遠方的小船
FARB.forEach(b => onAct(b.g, () => {
  sfx(b.type === 'pilot' ? toot : t => bell(t, 900, .04, .6));
  say(b.x, b.y - 30, b.type === 'pilot' ? '領港船：載領港員上大船' : b.type === 'sail' ? '帆船也能過運河，常常幾艘綁在一起過閘' : '遊湖船：去看島上的猴子', 2);
}));
onAct(document.querySelector('[data-name="科隆港貨櫃碼頭"]'), () => { sfx(clank); say(60, 300, '運河兩端都有大型貨櫃港', 1.8); });
onAct($('plan'), () => { sfx(click); say(300, 140, '平面圖：人字閘門關起來像一個 V 字', 2); });

/* ---------------- ⑤ 互動：控制列 ---------------- */
function syncAuto() { $('btnAuto').setAttribute('aria-pressed', String(T.auto)); $('btnAuto').textContent = T.auto ? '自動播放中' : '自動播放'; }
function goTo(t) { if (reduced) { T.t = t; applyTime(true); renderStill(); } else T.target = t; }
const tap = fn => () => { userGesture = true; ensureAudio(); setTimeout(() => { fn(); if (reduced) settle(24); }, actx && actx.state !== 'running' ? 120 : 0); };
$('btnUp').addEventListener('click', tap(() => startShow(1, true)));
$('btnDown').addEventListener('click', tap(() => startShow(-1, true)));
$('btnWeather').addEventListener('click', () => {
  userGesture = true; ensureAudio();
  wxI = (wxI + 1) % WX_LIST.length;
  $('btnWeather').textContent = '天氣：' + WX_LIST[wxI][1];
  if (reduced) { applyWeather(0); renderStill(); }
});
$('btnSound').addEventListener('click', () => {
  soundOn = !soundOn; userGesture = true;
  $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  if (ensureAudio()) {
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.setValueAtTime(soundOn ? .5 : 0, actx.currentTime);
    if (!soundOn && musNode) { try { musNode.disconnect(); } catch (e) {} musNode = null; }
  }
});
$('btnDay').addEventListener('click', () => goTo(10 / 24));
$('btnNight').addEventListener('click', () => goTo(21 / 24));
$('btnAuto').addEventListener('click', () => { T.auto = !T.auto; T.target = null; syncAuto(); });
$('timeRange').addEventListener('input', e => {
  T.t = e.target.value / 1000; T.target = null; T.dragging = true; applyTime(true); T.dragging = false;
  if (reduced) renderStill();
});
mq.addEventListener?.('change', e => { reduced = e.matches; if (!reduced) { T.auto = true; syncAuto(); } start(); });

applyTime(true);
applyWeather(0);
syncAuto();
// 開場：一艘貨櫃船已經在第二閘室裡往上升（畫面一打開就有船）
(() => {
  quiet = true;
  startShow(1, false, 'box');
  for (let s = 0; s < 12.2; s += .05) step(.05);
  quiet = false;
})();
start();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.user && show.on,   // 背景自動過閘的船不算表演
  btn: { up: 'btnUp', down: 'btnDown' },
  save: () => ({ ...T }),
  stop: () => {
    // 作品內建的快轉：把剩下的過閘步驟一口氣跑完（靜音），閘門、水位回到正常
    quiet = true; let n = 0; while (show.on && n++ < 800) stepShow(.05); quiet = false;
    if (show.on) endShow();
  },
  restore: s => { Object.assign(T, s); syncAuto(); applyTime(true); renderStill(); }
});
/* /ShowStop */
})();
</script>
</body>
</html>
