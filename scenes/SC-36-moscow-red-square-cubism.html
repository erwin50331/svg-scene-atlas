<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>莫斯科紅場的冬夜</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-36 莫斯科紅場｜立體派（俄國立體未來主義）
   地點：俄羅斯莫斯科紅場的南端。聖瓦西里大教堂（九座教堂、一座鐘樓、
        各有花紋的洋蔥頂）、克里姆林宮紅牆與救世主塔（塔上大鐘整點報時）、
        沙皇塔、元老院塔與後方綠色圓頂、國家百貨公司 GUM 的長立面、
        教堂前的米寧與波扎爾斯基紀念碑、圓形石台「斷頭台」（Lobnoye Mesto）、
        後方遠處的科捷利尼切斯卡亞堤岸大樓（史達林七姐妹之一）。
        冬天紅場會架起溜冰場、新年樹與木屋市集。
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   風格重點：立體派——所有物件被拆成一塊塊幾何切面，每一片明暗不同；
            天空也是三角切面；洋蔥頂用格狀切面拼出螺旋、鋸齒花紋；
            人物同時呈現側臉與正面眼睛（多視角）；
            煙火用俄國「輻射主義」的放射直線表現；滑鼠位置就是光源，
            切面的明暗會跟著光源轉動。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），部分另有 --k-名稱（晨昏）。
   JS 會依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）。
   ========================================================= */
:root{
  color-scheme: light;

  /* —— 天空切面（三段）、雲、陰天 —— */
  --d-sky-top:#5f8fbf;  --k-sky-top:#4a4f92;  --n-sky-top:#0c1430;
  --d-sky-mid:#9dbfd8;  --k-sky-mid:#c8708a;  --n-sky-mid:#18224a;
  --d-sky-low:#e2dccb;  --k-sky-low:#f2a862;  --n-sky-low:#2a3260;
  --d-cloud:#f4f0e6;    --k-cloud:#f2c0a4;    --n-cloud:#353f62;
  --d-cloud-dk:#c9cfd8; --k-cloud-dk:#b88a98; --n-cloud-dk:#252c48;
  --d-overcast:#9aa0aa; --k-overcast:#86788a; --n-overcast:#161b2a;
  --d-sun:#f6d468;      --k-sun:#f08a3a;      --n-sun:#f08a3a;
  --d-sun-dk:#e8a83a;   --k-sun-dk:#d0582a;   --n-sun-dk:#d0582a;

  /* —— 切面光影：亮面與暗面（夜裡像投射燈的暖光） —— */
  --d-lit:#fff8e4;      --n-lit:#ffcf8a;
  --d-shade:#1a1236;    --n-shade:#04030c;
  --d-ink:#1e1a26;      --n-ink:#07060e;

  /* —— 立體派的半透明大切面（穿過整個畫面的色塊） —— */
  --d-shard-a:#c8963a;  --n-shard-a:#5a4a2a;
  --d-shard-b:#2a7a80;  --n-shard-b:#1a3a5a;
  --d-shard-c:#c8606a;  --n-shard-c:#5a2a4a;
  --d-shard-d:#34304a;  --n-shard-d:#0a0a1a;

  /* —— 遠景城市、史達林式大樓 —— */
  --d-far:#b4b6c4;      --k-far:#a48ea6;      --n-far:#262c48;
  --d-far-dk:#8e92a6;   --n-far-dk:#1a1f36;
  --d-far-win:#d6d8e2;  --n-far-win:#e8c070;

  /* —— 聖瓦西里大教堂（夜裡有投射燈，所以夜色不會太暗） —— */
  --d-brick:#b8452f;    --k-brick:#c8543a;    --n-brick:#8a3a30;
  --d-brick-dk:#8e2e22; --n-brick-dk:#5e2422;
  --d-white:#efe6d2;    --k-white:#f4d2b2;    --n-white:#b8a890;
  --d-win:#2a2236;      --n-win:#f0b858;
  --d-dome-g:#2f8a5a;   --n-dome-g:#1e5a40;
  --d-dome-y:#e8b830;   --n-dome-y:#a88028;
  --d-dome-b:#3a68b4;   --n-dome-b:#243e74;
  --d-dome-r:#c83a32;   --n-dome-r:#8a2a28;
  --d-dome-w:#f4eee0;   --n-dome-w:#a49c94;
  --d-gold:#e2b23e;     --n-gold:#d09a38;
  --d-roof-g:#3a7a5c;   --n-roof-g:#1e4a3a;

  /* —— 克里姆林宮：紅牆、塔、元老院（黃色）與綠色圓頂、藍雲杉 —— */
  --d-kr:#b03a2e;       --k-kr:#c04a36;       --n-kr:#7a2e2a;
  --d-kr-dk:#7e2620;    --n-kr-dk:#4a1a1c;
  --d-senate:#e2c068;   --n-senate:#8a7444;
  --d-clock:#1e2e5a;    --n-clock:#22346a;
  --d-clock-2:#2a3e72;  --n-clock-2:#2e4482;
  --d-spruce:#3a6a6a;   --n-spruce:#14282c;
  --d-spruce-dk:#28504e;--n-spruce-dk:#0c1a1e;

  /* —— 國家百貨公司 GUM —— */
  --d-gum:#dcd0bc;      --k-gum:#e6c0a4;      --n-gum:#5e5866;
  --d-gum-dk:#b8aa94;   --n-gum-dk:#46424e;
  --d-gum-win:#6e88a8;  --n-gum-win:#f2c46a;
  --d-gum-door:#3a3440; --n-gum-door:#f0b050;

  /* —— 地面：石板、雪、銅像、石台 —— */
  --d-cobble:#8c8a92;   --k-cobble:#8a7a86;   --n-cobble:#2c2c3c;
  --d-cobble-2:#74727c; --n-cobble-2:#22222e;
  --d-snow:#f4f6fa;     --k-snow:#f6dccc;     --n-snow:#8c94b2;
  --d-snow-dk:#cdd6e6;  --n-snow-dk:#5c6484;
  --d-bronze:#4e5e4c;   --n-bronze:#2a342e;
  --d-bronze-hi:#7a8a70;--n-bronze-hi:#4a5a4a;
  --d-granite:#9a7a72;  --n-granite:#4a3c40;
  --d-stone:#cfc6b8;    --n-stone:#6a6470;
  --d-ice:#cfe6f0;      --n-ice:#4a6a92;
  --d-ice-2:#e8f4f8;    --n-ice-2:#5c80aa;
  --d-board:#f2efe6;    --n-board:#7a7a8c;

  /* —— 市集木屋、冰淇淋車、掃雪車 —— */
  --d-wood:#a8703a;     --n-wood:#4a3226;
  --d-wood-dk:#7a4a26;  --n-wood-dk:#30201a;
  --d-brass:#d8a23a;    --n-brass:#8a6a30;
  --d-sushki:#d89a4a;   --n-sushki:#7a5a3a;
  --d-cart:#f2f0ea;     --n-cart:#8a8a9a;
  --d-cart-2:#3a6ab8;   --n-cart-2:#22386a;
  --d-plow:#e07a2a;     --n-plow:#7a4420;
  --d-tyre:#26222a;     --n-tyre:#0c0a10;

  /* —— 行人：皮膚、大衣、毛帽 —— */
  --d-skin:#ecbc98;     --n-skin:#8a6a62;
  --d-skin-dk:#c68c6a;  --n-skin-dk:#5a4048;
  --d-coat-a:#b83a2e;   --n-coat-a:#5a2428;
  --d-coat-b:#2e4a7a;   --n-coat-b:#1a2440;
  --d-coat-c:#c89a3a;   --n-coat-c:#5e4a2a;
  --d-coat-d:#3a6a4a;   --n-coat-d:#1e3428;
  --d-coat-e:#7a3a6a;   --n-coat-e:#3a1e36;
  --d-coat-f:#5a5a64;   --n-coat-f:#2a2a34;
  --d-fur:#8a6a4a;      --n-fur:#3e3028;
  --d-pants:#2a2830;    --n-pants:#121118;
  --d-pigeon:#8a8a9a;   --n-pigeon:#3a3a4a;
  --d-crow:#2a2a30;     --n-crow:#0e0e14;

  /* —— 不隨日夜變化的顏色 —— */
  --ruby:#e0283a; --ruby-dk:#9a1424; --ruby-glow:#ff5a5a;
  --bulb:#ffe08a; --bulb-2:#ff9a5a; --orn-1:#e83a3a; --orn-2:#3a8ae8; --orn-3:#f2c43a; --orn-4:#f2f2f2;
  --fw-1:#ffd25a; --fw-2:#ff5a6a; --fw-3:#6ad2ff; --fw-4:#b88aff; --fw-5:#7aff9a;
  --moon:#f6efd2; --star:#fff6d8; --rain:#d4e0ee; --flake:#ffffff;
  --scarf:#d84a3a; --umbrella:#d8362e; --umbrella-2:#f4eee4;

  /* —— 頁面介面 —— */
  --page-bg:#efe8dc; --page-fg:#24202c; --page-muted:#6e6676;
  --ui-surface:#faf6ee; --ui-line:#d4c8b6; --ui-accent:#b8452f; --ui-hot:#1e2e5a; --ui-hot2:#2f8a5a;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border:6px solid var(--ui-surface);outline:2px solid var(--page-fg);border-radius:4px;overflow:hidden;background:#18224a;line-height:0}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ui-surface);
  border:2px solid var(--page-fg);border-radius:4px;padding:10px 14px}
.panel button{font:700 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:2px solid var(--ui-line);
  border-radius:3px;padding:9px 14px;cursor:pointer;letter-spacing:.04em}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:#fff}
.panel button.big{border-color:var(--ui-hot);color:#fff;background:var(--ui-hot)}
.panel button.big2{border-color:var(--ui-hot2);color:#fff;background:var(--ui-hot2)}
.panel button.on{background:#f2b23a!important;border-color:#f2b23a!important;color:var(--page-fg)!important}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid #ffe08a;outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(220px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding:0;list-style:none;color:var(--page-muted);font-size:14px;line-height:1.8;display:flex;flex-wrap:wrap;gap:4px 22px}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .noHit,#scene .sh{pointer-events:none}
#scene .bubble path{fill:#fffaf0;stroke:#1e1a26;stroke-width:1.5}
#scene .bubble text{fill:#1e1a26;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：天空切面 → 星星 → 太陽、月亮 → 陰天罩 → 雲 → 煙火
       → 遠方城市與史達林式大樓 → 元老院與綠圓頂 → 克里姆林宮紅牆、雲杉、救世主塔
       → 聖瓦西里大教堂 → GUM 百貨 → 石板廣場與積雪 → 掃雪車
       → 紀念碑、圓形石台 → 溜冰場與新年樹 → 導覽團 → 市集木屋 → 冰淇淋車
       → 鴿子 → 前景兩條人行道 → 天氣（雪、雨） → 畫布紋理
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="立體派風格的莫斯科紅場：畫面被切成許多幾何切面，中間是有九個彩色洋蔥頂的聖瓦西里大教堂，右邊是克里姆林宮紅牆和頂著紅星、掛著大鐘的救世主塔，左邊是國家百貨公司 GUM 的長立面與市集木屋；廣場上有溜冰場和新年樹、紀念碑、圓形石台、鴿子、掃雪車，以及戴毛帽散步的行人">
    <defs>
      <radialGradient id="glowGrad"><stop offset="0" stop-color="#ffe6a0" stop-opacity=".9"/><stop offset="1" stop-color="#ffe6a0" stop-opacity="0"/></radialGradient>
      <radialGradient id="rubyGlow"><stop offset="0" stop-color="#ff5a5a" stop-opacity=".85"/><stop offset="1" stop-color="#ff5a5a" stop-opacity="0"/></radialGradient>
      <radialGradient id="steamGrad"><stop offset="0" stop-color="#ffffff" stop-opacity=".8"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
      <!-- 畫布紋理：粗麻布顆粒＋斜向筆觸 -->
      <filter id="canvasF" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".9 .35" numOctaves="2" seed="36" result="n"/>
        <feColorMatrix in="n" type="matrix" values="0 0 0 0 .14  0 0 0 0 .1  0 0 0 0 .08  0 0 0 -2.1 1.2"/>
      </filter>
      <filter id="blurF" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
      <pattern id="rainPat" width="70" height="100" patternUnits="userSpaceOnUse">
        <g stroke="var(--rain)" stroke-width="1.6" stroke-linecap="round" opacity=".8">
          <path d="M10 6l-4 18M44 30l-4 18M64 62l-4 18M24 76l-4 18M56 2l-4 18M16 44l-4 18"/>
        </g>
      </pattern>
    </defs>

    <g id="skyG" class="clickable"></g>
    <g id="starsG" class="noHit"></g>
    <g id="sunG" class="clickable" tabindex="0" role="button" aria-label="太陽：點一下換成夜晚"></g>
    <g id="moonG" class="clickable" tabindex="0" role="button" aria-label="月亮：點一下換成白天"></g>
    <rect id="overcast" class="noHit" x="-20" y="-20" width="1640" height="480" style="fill:var(--overcast)" opacity="0"/>
    <g id="cloudsG"></g>
    <g id="fwG" class="noHit"></g>
    <g id="farG"></g>
    <g id="senateG"></g>
    <g id="wallG"></g>
    <g id="spasG"></g>
    <g id="basilG"></g>
    <g id="gumG"></g>
    <g id="shardG" class="noHit"></g>
    <g id="groundG"></g>
    <g id="plowG"></g>
    <g id="monuG"></g>
    <g id="lobG"></g>
    <g id="rinkG"></g>
    <g id="tourG"></g>
    <g id="kioskG"></g>
    <g id="cartG"></g>
    <g id="pigeonG"></g>
    <g id="laneA"></g>
    <g id="laneB"></g>
    <g id="airG" class="noHit"></g>
    <rect id="wxVeil" class="noHit" x="0" y="0" width="1600" height="600" fill="#3a4258" opacity="0"/>
    <g id="snowG" class="noHit" opacity="0"></g>
    <g id="rainG" class="noHit" opacity="0">
      <rect id="rain1" x="-100" y="-220" width="1800" height="900" fill="url(#rainPat)"/>
      <rect id="rain2" x="-100" y="-220" width="1800" height="900" fill="url(#rainPat)" transform="scale(1.3)" opacity=".45"/>
    </g>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;

  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */

  const zt = new Map();                  // id → { iv, keep }

  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;

  W.setTimeout = function (fn, ms, ...a) {

    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);

    zt.set(id, { iv: false, keep }); return id;

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */

  if (SN) {

    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {

  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {

      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';

    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });

    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {

        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);

    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);

    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {

    zone = Math.max(0, zone - 1);

  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;

    const k = isOn(), act = btnFor(k);

      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }

        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';

    init(c) {
      cfg = c;

        const b = document.getElementById(id); if (!b) return;

          }

            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }

            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();

<script>
/* =========================================================
   SC-36 莫斯科紅場｜程式區
   區塊：①工具、色票、立體派切面
         ②場景（天空、遠景、克里姆林宮、救世主塔、聖瓦西里、GUM、廣場）
         ③角色（行人、溜冰的人、導覽團、攤販、鴿子、烏鴉、掃雪車）
         ④動畫（主迴圈、日夜、天氣、報時煙火秀、溜冰圓舞曲）
         ⑤互動（點擊、滑鼠光源、聲音、控制列）
   ========================================================= */
(() => {
'use strict';

/* ---------------- ① 工具 ---------------- */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const root = document.documentElement;
const svg = $('scene');
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

let seed = 20261136;        // 固定亂數：每次開啟構圖都一樣

const f1 = n => (+n).toFixed(1);
const P = pts => pts.map(p => f1(p[0]) + ',' + f1(p[1])).join(' ');
function el(tag, attrs = {}, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);

  c[0] += srand(-.16, .16) * w; c[1] += srand(-.16, .16) * h;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    shade(parent, [c, a, b], m[0] - c[0], m[1] - c[1], o.k);
  }
  return base;
}
// 「稜柱」：八角形塔身只看得到三面（左側、正面、右側）
function prism(parent, cx, yTop, yBot, w, col, o = {}) {
  const x0 = cx - w / 2, x1 = cx - w / 4, x2 = cx + w / 4, x3 = cx + w / 2, tilt = o.tilt ?? 3;
  facet(parent, [[x0, yTop + tilt], [x1, yTop], [x1, yBot], [x0, yBot]], o.side || col, { split: false, nx: -1, ny: 0, k: .22 });

  (o.bands || []).forEach(y => el('rect', { x: f1(x0), y: f1(y), width: f1(w), height: 3, class: 'f-white noHit' }, parent));

    const n = o.win, ww = (x2 - x1) / (n * 2 + 1);

      el('polygon', { points: P([[wx, yy + wh], [wx, yy + 4], [wx + ww / 2, yy], [wx + ww, yy + 4], [wx + ww, yy + wh]]), class: 'f-win noHit', stroke: 'var(--white)', 'stroke-width': 1 }, parent);

}
// 「帳篷頂」：尖錐形屋頂，三個面，每面分成幾段交錯的顏色
function tent(parent, cx, by, w, ty, colA, colB, bands = 5) {
  const faces = [[[cx - w / 2, by], [cx - w / 6, by]], [[cx - w / 6, by], [cx + w / 6, by]], [[cx + w / 6, by], [cx + w / 2, by]]];
  faces.forEach((f, fi) => {
    for (let j = 0; j < bands; j++) {
      const t0 = j / bands, t1 = (j + 1) / bands;
      const L = (p, t) => [lerp(p[0], cx, t), lerp(p[1], ty, t)];
      const pts = [L(f[0], t0), L(f[1], t0), L(f[1], t1), L(f[0], t1)];

}
// 「可可什尼克」：俄式尖拱山牆，一排排疊在塔身頂上
function kok(parent, x0, x1, y, h, n) {
  const w = (x1 - x0) / n;
  for (let i = 0; i < n; i++) {
    const x = x0 + i * w;
    facet(parent, [[x, y], [x + w / 2, y - h], [x + w, y]], 'white', { split: false, nx: 0, ny: -1, k: .12, sw: .8 });
    el('polygon', { points: P([[x + w * .25, y], [x + w / 2, y - h * .55], [x + w * .75, y]]), class: 'f-brick noHit' }, parent);
  }
}
/* 洋蔥頂：把球形切成「經線 × 緯線」的格子，每一格是一個切面，

const ONION = [[0, .78], [.12, .97], [.28, 1], [.44, .9], [.6, .66], [.74, .42], [.87, .2], [1, 0]];

const PAT = {
  spiral: (i, j, o) => ((i + j + o) % 4 + 4) % 4 < 2,
  zigzag: (i, j, o) => (i + (j + o) % 2) % 2 === 0,
  diamond: (i, j, o) => (i + j + o) % 3 === 0,

const domes = [];
function dome(parent, cx, by, R, H, pat, A, B, label, prof = ONION, N = 10) {
  const g = el('g', {}, parent);
  const D = { g, cells: [], pat, A, B, off: 0, spin: 0, cx, top: by - H };
  for (let j = 0; j < prof.length - 1; j++) {
    const [t0, w0] = prof[j], [t1, w1] = prof[j + 1];

      D.cells.push({ e, i, j });

  el('circle', { cx, cy: f1(by - H - 3), r: f1(Math.max(2.5, R * .12)), class: 'f-gold noHit', stroke: 'var(--ink)', 'stroke-width': .6 }, g);

  el('path', { d: `M${cx} ${f1(ct)}V${f1(ct - R * .5 - 6)}M${f1(cx - R * .16 - 2)} ${f1(ct - R * .32 - 3)}H${f1(cx + R * .16 + 2)}`, class: 's-gold noHit', 'stroke-width': 1.6 }, g);

/* ---- 國家百貨公司 GUM：沿著廣場東側的長立面（透視往遠方縮小） ---- */
const gum = { bulbs: [], mode: 1, boost: 0, chase: 0 };
const gx = s => 360 * s, gTop = s => 176 + 160 * s, gBot = s => 480 - 36 * s;
const gp = (s, v) => [gx(s), lerp(gTop(s), gBot(s), v)];
function drawGum() {
  const g = $('gumG');
  const B = [0, .3, .55, .78, 1], F = [0, .08, .38, .66, 1];
  for (let b = 0; b < 4; b++) for (let f = 0; f < 4; f++) {
    const s0 = B[b], s1 = B[b + 1], v0 = F[f], v1 = F[f + 1];
    facet(g, [gp(s0, v0), gp(s1, v0), gp(s1, v1), gp(s0, v1)], f === 0 ? 'gum-dk' : (b + f) % 2 ? 'gum' : 'gum-dk', { k: .14, so: .45 });
    if (f === 0) continue;
    if (f === 3) {   // 一樓大拱門
      const sa = lerp(s0, s1, .22), sb = lerp(s0, s1, .78);
      const pts = [gp(sa, 1), gp(sa, .82), gp((sa + sb) / 2, .7), gp(sb, .82), gp(sb, 1)];
      facet(g, pts, 'gum-door', { split: false, k: .05 });
      pts.slice(1, 4).forEach((p, i) => { const q = i < 2 ? pts[i + 2] : null; });
      for (let k = 0; k <= 6; k++) { const t = k / 6; const p = t < .5 ? [lerp(pts[1][0], pts[2][0], t * 2), lerp(pts[1][1], pts[2][1], t * 2)] : [lerp(pts[2][0], pts[3][0], t * 2 - 1), lerp(pts[2][1], pts[3][1], t * 2 - 1)]; gum.bulbs.push(el('circle', { cx: f1(p[0]), cy: f1(p[1] - 3), r: 1.7, fill: 'var(--bulb)', opacity: 0, class: 'noHit' }, g)); }
      continue;
    }
    for (const t of [.2, .6]) {   // 二、三樓的尖拱窗
      const sa = lerp(s0, s1, t), sb = lerp(s0, s1, t + .2);
      facet(g, [gp(sa, lerp(v0, v1, .88)), gp(sa, lerp(v0, v1, .3)), gp((sa + sb) / 2, lerp(v0, v1, .14)), gp(sb, lerp(v0, v1, .3)), gp(sb, lerp(v0, v1, .88))], 'gum-win', { split: false, ny: -1, k: .08, sw: .8 });
    }
  }
  // 屋頂線上的小塔（越遠越小）
  [0.02, .3, .55, .78, .98].forEach((s, i) => {
    const big = i === 1 ? 1.4 : 1, h = (48 - 26 * s) * big, w = (26 - 14 * s) * big, x = gx(s), y = gTop(s);
    facet(g, [[x - w / 2, y + 30], [x - w / 2, y - h * .35], [x + w / 2, y - h * .35 + 2], [x + w / 2, y + 30]], 'gum', { split: false, nx: 1, k: .2 });
    tent(g, x, y - h * .35, w * 1.05, y - h, 'roof-g', 'gum-dk', 3);
    el('circle', { cx: f1(x), cy: f1(y - h - 2), r: f1(2 + big), class: 'f-gold' }, g);
    for (let k = 0; k < 5; k++) gum.bulbs.push(el('circle', { cx: f1(lerp(x - w * .55, x, k / 5)), cy: f1(lerp(y - h * .35, y - h, k / 5)), r: 1.6, fill: 'var(--bulb)', opacity: 0, class: 'noHit' }, g));
  });
  for (let k = 0; k <= 46; k++) { const s = k / 46; gum.bulbs.push(el('circle', { cx: f1(gx(s)), cy: f1(gTop(s) - 2), r: f1(2.2 - s), fill: 'var(--bulb)', opacity: 0, class: 'noHit' }, g)); }
  clickable(g, '國家百貨公司 GUM：點一下切換立面燈飾');
}

function stepLanes(dt, mv) {
  for (const lane of lanes) {
    const d = lane.dir, L = lane.list;
    L.sort((a, b) => (b.x - a.x) * d);
    for (let i = 0; i < L.length; i++) {
      const W = L[i], A = i > 0 ? L[i - 1] : null;
      let want = W.wave > 0 ? 0 : W.v * (W.dash > 0 ? 2.2 : 1);
      if (A) { const gap = (A.x - W.x) * d - (A.len + W.len) / 2; if (gap < 30) want = Math.min(want, A.cur * (gap < 14 ? .3 : .9)); if (gap < 6) want = 0; }
      W.cur = lerp(W.cur, want * mv, Math.min(1, dt * 3));
      W.x += d * W.cur * dt;
      W.wave = Math.max(0, W.wave - dt); W.dash = Math.max(0, (W.dash || 0) - dt);
      W.ph += W.cur * dt * .2;
      const sw = Math.sin(W.ph) * 24 * clamp(W.cur / 25, 0, 1);
      W.legs[0].setAttribute('transform', `rotate(${f1(sw)} 0 -24)`); W.legs[1].setAttribute('transform', `rotate(${f1(-sw)} 0 -24)`);
      W.arm.setAttribute('transform', W.wave > 0 ? `rotate(${f1(-150 + Math.sin(time * 14) * 18)} 1 -50)` : `rotate(${f1(-sw * .7)} 1 -50)`);
      const bob = Math.abs(Math.sin(W.ph)) * 1.5 * clamp(W.cur / 25, 0, 1);
      W.g.setAttribute('transform', `translate(${f1(W.x)} ${f1(lane.y - bob)}) scale(${d} 1)`);
    }
    // 走出畫面的人，從另一邊排到隊伍最後面
    for (const W of L) {
      if ((d > 0 && W.x > 1720) || (d < 0 && W.x < -120)) {
        const lastX = d > 0 ? Math.min(...L.map(o => o.x)) : Math.max(...L.map(o => o.x));
        W.x = d > 0 ? Math.min(-80, lastX - rand(90, 200)) : Math.max(1680, lastX + rand(90, 200));
        W.v = rand(28, 36);
      }
    }
  }
}

  onAct(tree.g, () => { tree.mode = (tree.mode + 1) % 3; sfx('jingle'); });
  skaters.forEach(S => onAct(S.g, () => { S.spin = 1; sfx('swish'); }));
  onAct(tour.g, () => { tour.flash = 1; sfx('shutter'); const fl = el('rect', { x: 1240, y: 420, width: 180, height: 100, fill: '#fff', opacity: .8 }, $('fx')); tween(.3, k => fl.setAttribute('opacity', f1(.8 * (1 - k))), () => fl.remove()); say(1300, 400, pick(['這是救世主塔！', '大家看鏡頭！', '洋蔥頂好漂亮']), 1.6); });
  kiosks.forEach(K => onAct(K.g, () => {
    K.act = 1.2;
    if (K.kind === 'sushki') { sfx('crunch'); say(K.cx, 410, '圈餅一串！', 1.4); }
    else if (K.kind === 'tea') { sfx('pour'); steamPuff(K.cx - 18, 466, 8); say(K.cx, 410, '熱茶來囉', 1.4); }
    else { sfx('sizzle'); say(K.cx, 410, '翻薄餅！', 1.4); }
  }));
  onAct(cart.g, () => { cart.act = 1.6; sfx('ding'); say(1200, 420, '冬天也吃冰淇淋！', 1.6); });
  onAct($('pigeonG'), () => { pigeons.forEach((B, i) => setTimeout(() => B.fly = 2.8, i * 60)); sfx('flutter'); });
  onAct(plow.g, () => { plow.spin = 2.5; sfx('brush'); });
  lanes.forEach(L => L.list.forEach(W => onAct(W.g, () => {
    if (W.sled) { W.dash = 1.6; sfx('whoosh'); say(W.x, 470, '衝啊！', 1.2); }
    else { W.wave = 1.6; sfx('step'); say(W.x, 470, pick(['你好！', '好冷喔', '雪好美', 'Привет!']), 1.3); }
  })));
  svg.addEventListener('pointermove', e => { const p = svgPoint(e); mouse.x = p.x; mouse.y = p.y; mouse.in = true; shadeDirty = true; });
  svg.addEventListener('pointerleave', () => { mouse.in = false; shadeDirty = true; });

  $('btnShow').addEventListener('click', () => { userGesture = true; ensureAudio(); if (show.on === 'midnight') endShow(true); else startShow('midnight'); });
  $('btnWaltz').addEventListener('click', () => { userGesture = true; ensureAudio(); if (show.on === 'waltz') endShow(true); else startShow('waltz'); });
  $('btnWeather').addEventListener('click', () => { userGesture = true; ensureAudio(); setWeather((wxIdx + 1) % WX.length); });
  $('btnSound').addEventListener('click', () => {
    soundOn = !soundOn; userGesture = true; ensureAudio();
    if (master) master.gain.setValueAtTime(soundOn ? .55 : 0, actx.currentTime);
    if (!soundOn) { stopAll(); rainSound(false); try { window.sceneMusic && window.sceneMusic.stop(); } catch (e) {} } else rainSound(WX[wxIdx][0] === 'rain');
    $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  });
  $('btnDay').addEventListener('click', () => setTime(12));
  $('btnDusk').addEventListener('click', () => setTime(17.1));
  $('btnNight').addEventListener('click', () => setTime(21));
  $('btnAuto').addEventListener('click', () => { T.auto = !T.auto; $('btnAuto').setAttribute('aria-pressed', String(T.auto)); });
  const tr = $('timeRange');
  tr.addEventListener('input', () => { T.dragging = true; T.t = tr.value / 1000; applyColors(true); });
  tr.addEventListener('change', () => { T.dragging = false; });
  window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
  window.addEventListener('pointerdown', () => document.body.classList.remove('kbd'));
  mq.addEventListener && mq.addEventListener('change', () => { reduced = mq.matches; });
}

/* ---------------- 初始化 ---------------- */
function init() {
  drawSky();
  drawClouds();
  drawFar();
  drawSenate();
  drawWall();
  drawSpasskaya();
  drawBasil();
  drawGum();
  drawShards();
  drawGround();
  drawPlow();
  drawMonument();
  drawLobnoye();
  drawRink();
  drawTour();
  drawKiosks();
  drawCart();
  drawPigeons();
  // 前景行人：每條道上的人一開始就排好間距
  [[0, 0], [1, 1], [2, 2], [3, 3], [4, 4]].forEach(([k], i) => makeWalker(lanes[0], LOOKS[k], 1500 - i * 330));
  [[5], [6], [7], [8]].forEach(([k], i) => makeWalker(lanes[1], LOOKS[k], 100 + i * 360));
  makeWalker(lanes[1], { coat: 'coat-d', hat: 'ushanka', scarf: 1 }, 1550, true);
  makeSnow();
  bindAll();
  if (reduced) { T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false'); }
  setWeather(0);
  applyColors(true);
  step(1 / 60);
  requestAnimationFrame(loop);
  // 網站「作者精選」播放區：冬夜，溜冰圓舞曲自動輪播（不算使用者點擊，不會自己出聲）
  const inPicks = (() => { let top = true; try { top = window.top === window; } catch (e) { top = false; } return !!document.getElementById('pure-art') && !top; })();
  if (inPicks) {
    setTime(19);
    setTimeout(() => startShow('waltz', true), 1000);
    setInterval(() => { if (!show.on) startShow('waltz', true); }, 3000);
    // 不另外放背景配樂：網站的「播放配樂」開關直接控制圓舞曲自己的音樂（從頭開始，跟畫面同步）
    window.sceneMusic = {
      playing: false,
      start(c) { if (this.playing) return; this.playing = true; pickAudio = true; if (c && c !== actx) useCtx(c); else ensureAudio(); if (actx && actx.state !== 'running') actx.resume(); startShow('waltz', true); },
      stop() { this.playing = false; pickAudio = false; stopAll(); },
      duck() {}
    };
  }
}
init();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on,
  btn: { midnight: 'btnShow', waltz: 'btnWaltz' },
  save: () => ({ t: T.t, auto: T.auto, w: wxIdx }),
  stop: () => endShow(true),
  restore: s => { if (wxIdx !== s.w) setWeather(s.w); T.t = s.t; T.auto = s.auto; $('btnAuto') && $('btnAuto').setAttribute('aria-pressed', String(T.auto)); applyColors(true); }
});
/* /ShowStop */
})();
</script>
</body>
</html>
