<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SC-14 凡爾賽天鵝湖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
/* =========================================================
   SC-14 凡爾賽天鵝湖｜浮世繪色塊風格
   【色票 token】所有顏色集中在這裡。
   - 場景色成對出現：--名稱-day / --名稱-night，
     JS 依「日夜比例」自動混色後輸出 --名稱 給 SVG 使用，
     並自動產生 .f-名稱（填色）、.s-名稱（描邊）兩種 class。
   - 「常亮色」不參與混色（窗光、路燈、煙火、太陽月亮、題簽）。
   換色時只需改這個區塊。
   風格重點：普魯士藍天空漸層（ぼかし）、橫向霞帶、粗墨線輪廓、平塗色塊、
            湖面青海波紋、條紋倒影、和紙紋理。
   ========================================================= */
:root{
  color-scheme:dark;

  /* ---- 頁面外框（單一深色主題） ---- */
  --page-bg:#16181f;
  --page-panel:#21232c;
  --page-fg:#f1e7d3;
  --page-dim:#a9a395;
  --page-line:#343747;
  --page-accent:#e3b23c;
  --font-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;

  /* ---- 天空、霞、雲、遠丘 ---- */
  --sky-top-day:#22508c;   --sky-top-night:#07112c;
  --sky-mid-day:#80b3cd;   --sky-mid-night:#16295a;
  --sky-bot-day:#f4e6c4;   --sky-bot-night:#2d3467;
  --kasumi-day:#f2b89c;    --kasumi-night:#3d356f;
  --kasumi2-day:#ecd28c;   --kasumi2-night:#2f3262;
  --cloud-day:#fbf3df;     --cloud-night:#37406e;
  --hill-day:#93b3c0;      --hill-night:#212e58;

  /* ---- 森林與草地 ---- */
  --forest-day:#3f6e55;    --forest-night:#11252b;
  --forest2-day:#5d8c63;   --forest2-night:#1a3333;
  --forest3-day:#2a5242;   --forest3-night:#0b1a1e;
  --lawn-day:#7da560;      --lawn-night:#1f3a31;
  --lawn2-day:#5e8b4f;     --lawn2-night:#172f28;
  --embroid-day:#2f5a3e;   --embroid-night:#0d2120;   /* 刺繡花壇的黃楊線 */
  --hedge-day:#3d7250;     --hedge-night:#10272a;
  --hedge-lt-day:#6b9b62;  --hedge-lt-night:#1c3a33;
  --flower1-day:#d6493a;   --flower1-night:#5a2533;
  --flower2-day:#f0c24a;   --flower2-night:#6a5a36;
  --flower3-day:#c37ab8;   --flower3-night:#4a2f50;

  /* ---- 宮殿與石造 ---- */
  --palace-day:#efdfbd;    --palace-night:#47426a;   /* 石灰岩立面 */
  --palace2-day:#d9c49a;   --palace2-night:#37335a;  /* 立面陰影 */
  --slate-day:#3c4d66;     --slate-night:#121931;    /* 石板瓦屋頂 */
  --slate-lt-day:#62778f;  --slate-lt-night:#232b4b;
  --gilt-day:#e3b23c;      --gilt-night:#8a7240;     /* 鍍金飾邊 */
  --glass-day:#6f8aa6;     --glass-night:#232c4c;    /* 未點燈的窗 */
  --stone-day:#ddcca8;     --stone-night:#3a3859;
  --stone2-day:#bba886;    --stone2-night:#2b2a47;
  --stone-ln-day:#8e7d5f;  --stone-ln-night:#1b1a31;
  --gravel-day:#e5d4ae;    --gravel-night:#3c3a5a;
  --gravel-dot-day:#b7a47f;--gravel-dot-night:#26253f;
  --statue-day:#eee6d4;    --statue-night:#62608a;

  /* ---- 湖水 ---- */
  --lake-top-day:#5d93b8;  --lake-top-night:#14245a;
  --lake-bot-day:#2a5c8e;  --lake-bot-night:#0a1538;
  --wave-day:#d3e6ec;      --wave-night:#3c5290;
  --spray-day:#f4fbff;     --spray-night:#b9c8f0;    /* 噴泉水花 */

  /* ---- 柑橘箱、長椅 ---- */
  --caisse-day:#2f6458;    --caisse-night:#11302c;
  --iron-day:#3a3c48;      --iron-night:#14141f;
  --orange-day:#ee8a2a;    --orange-night:#7a4a2e;
  --leaf-day:#2f5c3f;      --leaf-night:#0f2420;
  --leaf2-day:#4f8550;     --leaf2-night:#18352d;
  --trunk-day:#5a3a28;     --trunk-night:#1b131e;

  /* ---- 天鵝、鴨、鴿 ---- */
  --swan-day:#fdf8ec;      --swan-night:#c3c1dd;
  --swan-sh-day:#d9d1c0;   --swan-sh-night:#8583a9;
  --beak-day:#e8692c;      --beak-night:#93503d;
  --cygnet-day:#a79f93;    --cygnet-night:#58556e;
  --duck-day:#7a6447;      --duck-night:#2d2534;
  --duckhead-day:#2f6c4f;  --duckhead-night:#142a26;
  --pigeon-day:#8d93a3;    --pigeon-night:#3f4260;

  /* ---- 人物、小火車、小船 ---- */
  --skin-day:#f1cfac;      --skin-night:#9b8280;
  --hair-day:#1f1a1c;      --hair-night:#0c0a12;
  --hair2-day:#9a5a2e;     --hair2-night:#3d2624;
  --cloth1-day:#2d4c7c;    --cloth1-night:#17254a;  /* 藍 */
  --cloth2-day:#b3463a;    --cloth2-night:#52252e;  /* 朱 */
  --cloth3-day:#d9a447;    --cloth3-night:#695336;  /* 黃土 */
  --cloth4-day:#4e7b5d;    --cloth4-night:#1e3a33;  /* 松葉 */
  --cloth5-day:#7b5b8c;    --cloth5-night:#35294a;  /* 紫 */
  --cloth6-day:#e8dcc0;    --cloth6-night:#57536f;  /* 生成 */
  --umb1-day:#d6533a;      --umb1-night:#8c3436;
  --umb2-day:#2f5f92;      --umb2-night:#1d3863;
  --umb3-day:#e6b43e;      --umb3-night:#8a7038;
  --umb4-day:#e7a0b4;      --umb4-night:#77485a;
  --train-a-day:#2e6a5a;   --train-a-night:#13312d;
  --train-b-day:#f2e5c4;   --train-b-night:#57536f;
  --train-c-day:#c8372a;   --train-c-night:#4e1c27;
  --boat-day:#a3542e;      --boat-night:#3d2129;
  --boat-in-day:#d9a35c;   --boat-in-night:#5a4632;
  --sumi-day:#211b26;      --sumi-night:#06050e;   /* 墨線 */

  /* ---- 常亮色（不隨日夜混色） ---- */
  --win-on:#ffcf73;     /* 宮殿窗光 */
  --lamp:#ffe1a0;       /* 路燈 */
  --sun:#e2472e;        /* 浮世繪紅日 */
  --moon:#fff1c2;
  --star:#fff6d8;
  --dusk:#ff8a4c;       /* 夕燒 */
  --fw1:#ffd36b;        /* 煙火：金 */
  --fw2:#ff6b4a;        /* 煙火：朱 */
  --fw3:#8fe3ff;        /* 煙火：水 */
  --fw4:#f7a8ff;        /* 煙火：桃 */
  --bread:#e9c27a;      /* 麵包屑 */
  --paper:#f3e4b8;      /* 題簽底色 */
  --seal:#c8372a;       /* 印章朱 */
}

/* ===== 頁面版面 ===== */
html,body{margin:0;background:var(--page-bg);color:var(--page-fg)}
body{font-family:var(--font-body);line-height:1.6}
.wrap{max-width:1680px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
h1{font-family:var(--font-display);font-weight:900;font-size:clamp(1.4rem,2.6vw,2rem);margin:0;letter-spacing:.04em;text-wrap:balance}
h1 small{font-size:.55em;font-weight:700;color:var(--page-accent);letter-spacing:.12em;margin-right:.6em}
.meta{color:var(--page-dim);font-size:.9rem;margin:0}
.stage{position:relative;border-radius:6px;overflow:hidden;background:#000;
  box-shadow:0 0 0 1px var(--page-line),0 18px 40px -18px #000}
.stage svg{display:block;width:100%;height:auto;max-width:100%;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.controls button{font:500 .95rem/1 var(--font-body);color:var(--page-fg);background:var(--page-panel);
  border:1px solid var(--page-line);border-radius:3px;padding:10px 16px;cursor:pointer;
  box-shadow:0 3px 0 -1px #0007;transition:transform .12s,background .2s}
.controls button:hover{background:#2c2f3b}
.controls button:active{transform:translateY(2px)}
.controls button:focus-visible{outline:2px solid var(--page-accent);outline-offset:2px}
.controls button[aria-pressed="true"]{border-color:var(--page-accent);color:#fff}
.clock{margin-left:auto;font-family:var(--font-display);font-size:1rem;color:var(--page-dim);font-variant-numeric:tabular-nums}
.hint{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px 20px;color:var(--page-dim);font-size:.88rem}
.hint b{color:var(--page-fg);font-weight:500;margin-right:.4em}

/* ===== SVG 內樣式 ===== */
.ink{stroke:var(--sumi);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.ink-thin{stroke:var(--sumi);stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}
.serif{font-family:var(--font-display);font-weight:900}
.lit{fill:var(--win-on);opacity:0;transition:opacity .4s}
.lit.on{opacity:var(--lit,.2)}
.walker,.swan,#train,#boat,#fountain,#palace,#orangeTree,#statue,.lamp,#lakeHit,.duck{cursor:pointer}
.bubble text{font-family:var(--font-display);font-weight:900;font-size:17px;fill:#211b26}
.bubble{animation:pop 1.9s ease-out forwards;pointer-events:none}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}12%{opacity:1;transform:translateY(0)}75%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}

/* ===== 減少動態：關閉 CSS 動畫（JS 端另行停住行人、天鵝、小火車） ===== */
@media (prefers-reduced-motion: reduce){
  .bubble{animation:none}
  .lit{transition:none}
  .controls button{transition:none}
}
</style>
</head>
<body>
<main class="wrap">

  <div class="stage">
  <!-- =====================================================
       【場景】SVG 主舞台 viewBox 1600×600
       圖層由後到前：天空 → 日月星 → 煙火、鳥 → 雲與霞 → 遠丘 → 森林
       → 宮殿 → 宮前花壇 → 湖面（倒影、波紋） → 噴泉島 → 小船、天鵝、鴨
       → 湖邊欄杆 → 草地與步道 → 圓錐修剪樹、路燈 → 後側行人 → 小火車
       → 前側行人 → 前景（柑橘樹、雕像、長椅、矮籬） → 對話泡泡 → 題簽 → 和紙紋
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img" aria-label="浮世繪風格的宮殿花園，大湖上有天鵝與噴泉，步道上有遊客與遊園小火車，可切換白天與夜晚">
    <defs>
      <!-- 天空ぼかし：上深下淺 -->
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-top)"/>
        <stop offset=".2" style="stop-color:var(--sky-top)"/>
        <stop offset=".5" style="stop-color:var(--sky-mid)"/>
        <stop offset=".85" style="stop-color:var(--sky-bot)"/>
      </linearGradient>
      <linearGradient id="duskGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset=".2" style="stop-color:var(--dusk);stop-opacity:0"/>
        <stop offset="1" style="stop-color:var(--dusk);stop-opacity:1"/>
      </linearGradient>
      <!-- 湖水：遠淺近深 -->
      <linearGradient id="lakeGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--lake-top)"/>
        <stop offset="1" style="stop-color:var(--lake-bot)"/>
      </linearGradient>
      <radialGradient id="glowGrad">
        <stop offset="0" style="stop-color:var(--lamp);stop-opacity:.85"/>
        <stop offset="1" style="stop-color:var(--lamp);stop-opacity:0"/>
      </radialGradient>
      <radialGradient id="moonGlow">
        <stop offset=".4" style="stop-color:var(--moon);stop-opacity:.35"/>
        <stop offset="1" style="stop-color:var(--moon);stop-opacity:0"/>
      </radialGradient>
      <radialGradient id="vignette" cx=".5" cy=".5" r=".75">
        <stop offset=".62" stop-color="#000" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity=".35"/>
      </radialGradient>

      <!-- 圖樣：石板瓦、青海波、碎石、欄杆、條紋倒影遮罩、火車篷 -->
      <pattern id="slateTiles" width="8" height="7" patternUnits="userSpaceOnUse">
        <rect width="8" height="7" class="f-slate"/>
        <path d="M0,6.5 H8 M4,0 V3.5" class="s-slate-lt" stroke-width="1" fill="none"/>
      </pattern>
      <pattern id="seigaiha" width="28" height="14" patternUnits="userSpaceOnUse">
        <g fill="none" class="s-wave" stroke-width="1.1">
          <path d="M0,14 a14,14 0 0 1 28,0 M5,14 a9,9 0 0 1 18,0 M10,14 a4,4 0 0 1 8,0"/>
          <path d="M-14,7 a14,14 0 0 1 28,0 M14,7 a14,14 0 0 1 28,0"/>
        </g>
      </pattern>
      <pattern id="gravelPat" width="46" height="18" patternUnits="userSpaceOnUse">
        <rect width="46" height="18" class="f-gravel"/>
        <g class="f-gravel-dot">
          <circle cx="5" cy="4" r="1.2"/><circle cx="21" cy="11" r="1"/><circle cx="34" cy="5" r="1.3"/>
          <circle cx="12" cy="15" r=".9"/><circle cx="41" cy="14" r="1.1"/><circle cx="28" cy="2" r=".8"/>
        </g>
      </pattern>
      <pattern id="baluster" width="14" height="18" patternUnits="userSpaceOnUse">
        <path d="M3,0 H11 Q8,4 9,7 Q12,10 9,13 L10,18 H4 L5,13 Q2,10 5,7 Q6,4 3,0 Z" class="f-stone ink-thin"/>
      </pattern>
      <pattern id="stripeMask" width="10" height="5" patternUnits="userSpaceOnUse">
        <rect width="10" height="3" fill="#fff"/>
      </pattern>
      <mask id="reflectMask" x="0" y="296" width="1600" height="150" maskUnits="userSpaceOnUse">
        <rect x="0" y="296" width="1600" height="150" fill="url(#stripeMask)"/>
      </mask>
      <pattern id="canopy" width="16" height="10" patternUnits="userSpaceOnUse">
        <rect width="16" height="10" class="f-train-b"/>
        <rect width="8" height="10" class="f-train-c"/>
      </pattern>
      <pattern id="caissePat" width="12" height="12" patternUnits="userSpaceOnUse">
        <rect width="12" height="12" class="f-caisse"/>
        <path d="M0,.5 H12" class="s-iron" stroke-width="1" opacity=".5"/>
      </pattern>

      <!-- 和紙纖維紋理 -->
      <filter id="washi" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".85 .35" numOctaves="2" seed="14"/>
        <feColorMatrix values="0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .3  0 0 0 .55 -.18"/>
      </filter>
      <clipPath id="clipStage"><rect width="1600" height="600"/></clipPath>
      <clipPath id="clipLake"><rect x="0" y="298" width="1600" height="140"/></clipPath>
    </defs>

    <g clip-path="url(#clipStage)">
    <!-- ================= 【場景】天空 ================= -->
    <rect width="1600" height="320" fill="url(#skyGrad)"/>
    <rect id="dusk" width="1600" height="320" fill="url(#duskGrad)" opacity="0"/>
    <g id="stars" opacity="0"></g>
    <!-- 浮世繪紅日 -->
    <g id="sun"><circle r="36" style="fill:var(--sun)"/></g>
    <!-- 月亮（含月暈） -->
    <g id="moon">
      <circle r="64" fill="url(#moonGlow)"/>
      <circle r="24" style="fill:var(--moon)"/>
      <circle cx="-7" cy="-5" r="4" style="fill:#e9d8a6" opacity=".6"/>
      <circle cx="6" cy="7" r="3" style="fill:#e9d8a6" opacity=".5"/>
    </g>
    <!-- 【動畫】煙火與鳥群（點天空產生） -->
    <!-- 雲、霞帶 -->
    <g id="clouds"></g>
    <g id="kasumi"></g>
    <g id="fireworks"></g>
    <g id="birds" class="ink" fill="none" stroke-width="2"></g>

    <!-- ================= 【場景】遠丘、森林 ================= -->
    <path d="M0,252 Q120,232 260,240 T540,236 T840,242 T1120,232 T1400,240 T1600,236 V300 H0 Z" class="f-hill"/>
    <g id="forest"></g>

    <!-- ================= 【場景】宮殿（點擊：燈光秀） ================= -->
    <g id="palace">
      <g id="palaceBody"></g>
      <g id="palaceWins"></g>
      <g id="palaceFlag"></g>
    </g>
    <!-- 宮前台地與刺繡花壇 -->
    <g id="terrace"></g>
    <g id="farWalkers"></g>
    <!-- 夜間：宮殿與台地的燈光 -->
    <g id="palaceGlow" class="nightOnly" opacity="0" pointer-events="none"></g>

    <!-- ================= 【場景】大湖 ================= -->
    <rect x="0" y="298" width="1600" height="142" fill="url(#lakeGrad)"/>
    <rect x="0" y="298" width="1600" height="142" fill="url(#seigaiha)" opacity=".28"/>
    <!-- 倒影：森林與宮殿上下翻轉、加上橫向條紋遮罩 -->
    <g clip-path="url(#clipLake)" pointer-events="none">
      <g id="reflection" mask="url(#reflectMask)" opacity=".26">
        <use href="#forest" transform="translate(0,598) scale(1,-1)"/>
        <use href="#palace" transform="translate(0,598) scale(1,-1)"/>
      </g>
      <g id="sunStreak"></g>
      <g id="lampStreak" class="nightOnly" opacity="0"></g>
    </g>
    <!-- 遠岸石砌 -->
    <rect x="0" y="295" width="1600" height="6" class="f-stone2 ink-thin"/>
    <!-- 點湖面：撒麵包屑引天鵝過來（透明感應區） -->
    <rect id="lakeHit" x="0" y="302" width="1600" height="130" fill="transparent"/>
    <!-- 【動畫】湖面波紋 -->
    <g id="ripples" pointer-events="none"></g>
    <g id="rings" pointer-events="none" fill="none"></g>
    <g id="crumbs" pointer-events="none"></g>

    <!-- ================= 【場景】噴泉島（點擊：噴高） ================= -->
    <g id="fountain">
      <g id="rainbow" opacity="0" pointer-events="none"></g>
      <g id="fountainBase"></g>
      <g id="jets" pointer-events="none"></g>
      <g id="drops" pointer-events="none"></g>
      <g id="notes" pointer-events="none"></g>
    </g>

    <!-- ================= 【角色】小船、天鵝、鴨 ================= -->
    <g id="boat"></g>
    <g id="swans"></g>

    <!-- ================= 【場景】近岸欄杆、草地、步道 ================= -->
    <g id="balustrade"></g>
    <rect x="0" y="458" width="1600" height="16" class="f-lawn"/>
    <path d="M0,458 H1600" class="ink-thin" fill="none"/>
    <rect x="0" y="474" width="1600" height="126" fill="url(#gravelPat)"/>
    <path d="M0,474 H1600" class="s-stone-ln" stroke-width="1.6"/>
    <g id="topiary"></g>
    <g id="lamps"></g>
    <g id="lampGlow" class="nightOnly" opacity="0" pointer-events="none"></g>

    <!-- ================= 【角色】行人、小火車 ================= -->
    <g id="walkersBack"></g>
    <g id="trainLayer"></g>
    <g id="walkersFront"></g>

    <!-- ================= 【場景】前景 ================= -->
    <g id="hedgeFore"></g>
    <g id="bench"></g>
    <g id="statue"></g>
    <g id="orangeTree"></g>
    <g id="oranges" pointer-events="none"></g>

    <!-- 對話泡泡 -->
    <g id="bubbles"></g>


    <!-- 和紙紋理與暗角 -->
    <rect width="1600" height="600" filter="url(#washi)" opacity=".5" pointer-events="none"/>
    <rect width="1600" height="600" fill="url(#vignette)" pointer-events="none"/>
    </g>
  </svg>
  </div>

  <!-- 【互動】控制列 -->
  <div class="controls">
    <button id="btnDayNight" type="button">切換日夜</button>
    <button id="btnAuto" type="button" aria-pressed="true">自動循環：開</button>
    <button id="btnShow" type="button" aria-pressed="false">噴泉秀：待機</button>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {

    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {

    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {

      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }

      if (g) {
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);

  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');

    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }

    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });

  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>
(() => {
"use strict";
/* =========================================================
   基本工具
   ========================================================= */
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const svg = $("scene");
const root = document.documentElement;
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
// 固定亂數種子，讓每次載入的背景長一樣
function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const R = rng(20261121);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const RM_QUERY = window.matchMedia("(prefers-reduced-motion: reduce)");
let reduced = RM_QUERY.matches;

/* =========================================================
   【色票】日夜混色引擎
   讀取 --名稱-day / --名稱-night，依 night(0~1) 混色寫回 --名稱。
   ========================================================= */
const MIX = ["sky-top","sky-mid","sky-bot","kasumi","kasumi2","cloud","hill",
  "forest","forest2","forest3","lawn","lawn2","embroid","hedge","hedge-lt","flower1","flower2","flower3",
  "palace","palace2","slate","slate-lt","gilt","glass","stone","stone2","stone-ln","gravel","gravel-dot","statue",
  "lake-top","lake-bot","wave","spray",
  "caisse","iron","orange","leaf","leaf2","trunk",
  "swan","swan-sh","beak","cygnet","duck","duckhead","pigeon",
  "skin","hair","hair2","cloth1","cloth2","cloth3","cloth4","cloth5","cloth6","umb1","umb2","umb3","umb4",
  "train-a","train-b","train-c","boat","boat-in","sumi"];
(function injectClasses() {
  const css = MIX.map(n => `.f-${n}{fill:var(--${n})}.s-${n}{stroke:var(--${n})}`).join("");
  const st = document.createElement("style"); st.textContent = css; document.head.appendChild(st);
})();
const cs = getComputedStyle(root);
const hex = s => { s = s.trim().replace("#",""); if (s.length === 3) s = s.split("").map(c => c + c).join(""); const n = parseInt(s,16); return [n>>16&255, n>>8&255, n&255]; };
const PAIRS = MIX.map(n => [n, hex(cs.getPropertyValue(`--${n}-day`)), hex(cs.getPropertyValue(`--${n}-night`))]);
let lastApplied = -1;
function applyNight(nt, force) {
  if (!force && Math.abs(nt - lastApplied) < 0.004) return;
  lastApplied = nt;
  for (const [n, a, b] of PAIRS) {
    const c = a.map((v, i) => Math.round(v + (b[i] - v) * nt));
    root.style.setProperty(`--${n}`, `rgb(${c[0]},${c[1]},${c[2]})`);
  }
  root.style.setProperty("--lit", (0.12 + 0.88 * nt).toFixed(3));
  document.querySelectorAll(".nightOnly").forEach(e => e.style.opacity = Math.max(0, nt * 1.4 - .4).toFixed(3));
  $("stars").style.opacity = Math.max(0, nt * 1.5 - .5).toFixed(3);
  const tw = Math.max(0, 1 - Math.abs(nt - .45) * 3.4);
  $("dusk").setAttribute("opacity", (tw * .55).toFixed(3));
}

/* =========================================================
   【場景】星星、雲、霞
   ========================================================= */
(function buildStars() {
  const g = $("stars");
  for (let i = 0; i < 90; i++) {
    const r = R() < .15 ? 1.8 : .9 + R() * .6;
    el("circle", { cx: R() * 1600, cy: R() * 230, r, style: "fill:var(--star)", opacity: .5 + R() * .5 }, g);
  }
})();
const clouds = [];
(function buildClouds() {
  // 浮世繪捲雲：一排圓弧堆成扁長雲，加墨線
  const g = $("clouds");
  [[180,84,1],[640,52,.8],[1060,96,1.1],[1400,62,.7]].forEach(([x, y, s]) => {
    const c = el("g", {}, g);
    const w = 220 * s, n = 6, step = w / n;
    let d = `M${-w/2},0 `;
    for (let i = 0; i < n; i++) d += `a${step/2},${(step/2)*.8} 0 0 1 ${step},0 `;
    d += `Q${w/2+20},10 ${w/2-10},14 H${-w/2+14} Q${-w/2-18},10 ${-w/2},0 Z`;
    el("path", { d, class: "f-cloud ink-thin" }, c);
    el("path", { d: `M${-w/2+20},6 H${w/2-30}`, class: "s-kasumi", "stroke-width": 2, fill: "none", opacity: .6 }, c);
    clouds.push({ g: c, x, y, sp: 4 + R() * 5 });
  });
})();
const kasumis = [];
(function buildKasumi() {
  // 霞帶：圓頭長條、帶階梯缺口，浮世繪最具代表性的元素
  const g = $("kasumi");
  [[60,150,480,"f-kasumi"],[820,176,420,"f-kasumi2"],[1220,138,360,"f-kasumi"],[-260,214,560,"f-kasumi2"],[1000,222,520,"f-kasumi"]].forEach(([x, y, w, cls]) => {
    const h = 16;
    const d = `M0,${h/2} a${h/2},${h/2} 0 0 1 ${h/2},-${h/2} H${w*.45} v-6 H${w*.75} v6 H${w-h/2} a${h/2},${h/2} 0 0 1 0,${h} H${w*.3} v5 H${h/2} a${h/2},${h/2} 0 0 1 -${h/2},-${h/2} Z`;
    const p = el("path", { d, class: cls, opacity: .85 }, g);
    kasumis.push({ e: p, x, y, w, sp: 3 + R() * 4 });
  });

  if (show > 0) {
    if (!reduced && Math.random() < dt * 2.5) note();
    showFw -= dt;
    if (night > .55 && showFw <= 0) { firework(rand(200, 1400), rand(60, 180)); showFw = reduced ? 1.4 : rand(.4, .9); }
    if (show <= 0) setShow(false);
  }
  for (let i = notes.length - 1; i >= 0; i--) {
    const n = notes[i]; n.life -= dt; n.y -= 36 * dt; n.x += (n.vx + wind * 10) * dt;
    n.e.setAttribute("transform", `translate(${n.x.toFixed(1)},${n.y.toFixed(1)})`);
    n.e.setAttribute("opacity", Math.min(1, n.life).toFixed(2));
    if (n.life <= 0) { n.e.remove(); notes.splice(i, 1); }
  }

  if (!reduced) {
    // ---- 雲與霞 ----
    for (const c of clouds) { c.x += (c.sp + wind * 14) * dt; if (c.x > 1760) c.x = -160; if (c.x < -160) c.x = 1760; c.g.setAttribute("transform", `translate(${c.x.toFixed(1)},${c.y})`); }
    for (const k of kasumis) { k.x += (k.sp * .6 + wind * 8) * dt; if (k.x > 1640) k.x = -k.w - 20; if (k.x < -k.w - 40) k.x = 1620; k.e.setAttribute("transform", `translate(${k.x.toFixed(1)},${k.y})`); }
    // ---- 旗、圓錐樹、柑橘樹隨風擺 ----
    $("flagCloth").setAttribute("d", `M870,147 Q${881 + wind * 2},${148 + Math.sin(t * 4) * 2} ${892 + wind * 4},${152 + Math.sin(t * 5) * 2.5} L870,158 Z`);
    cones.forEach((c, i) => c.setAttribute("transform", `translate(${[40, 200, 470, 610, 900, 1040, 1330, 1590][i]},472) rotate(${(wind * .8 + Math.sin(t * 1.2 + i) * .4).toFixed(2)} 0 -10)`));
    orangeShake = Math.max(0, orangeShake - dt * 1.5);
    $("crown").setAttribute("transform", `rotate(${(wind * 1.2 + Math.sin(t * 1.1) * .6 + Math.sin(t * 24) * orangeShake * 3).toFixed(2)} 92 440)`);
    // ---- 湖面波紋 ----
    for (const r of ripples) {
      r.x += (r.sp + wind * 12) * dt * ((r.y - 290) / 140);
      if (r.x > 1660) r.x = -60; if (r.x < -60) r.x = 1660;
      r.e.setAttribute("transform", `translate(${r.x.toFixed(1)},${r.y.toFixed(1)})`);
      r.e.setAttribute("opacity", (.35 + .45 * Math.sin(t * 1.4 + r.ph)).toFixed(2));
    }
    // ---- 遠方小人 ----
    for (const p of farPeople) { p.x += p.sp * dt; if (p.x > 1620) p.x = -20; if (p.x < -20) p.x = 1620; p.g.setAttribute("transform", `translate(${p.x.toFixed(1)},${p.y})`); }
    // ---- 小船：左側湖面來回划 ----
    boat.ph += dt * 2;
    boat.x += boat.dir * 16 * dt;
    if (boat.x > 640) boat.dir = -1; if (boat.x < 120) boat.dir = 1;
  }
  boat.wave = Math.max(0, boat.wave - dt);
  drawBoat();

  // ---- 天鵝 ----
  updateSwans(dt);
  sortTimer -= dt; if (sortTimer <= 0) { sortSwans(); sortTimer = .8; }

  // ---- 行人 ----
  for (const W of walkers) {
    W.hop = Math.max(0, W.hop - dt * 2.2);
    if (!reduced) {
      W.ph += dt * (W.sp / 6);
      W.x += W.dir * W.sp * dt;
      if (W.x > 1680) { W.x = -80; } if (W.x < -80) { W.x = 1680; }
    }
    drawWalker(W);
  }

  // ---- 小火車：駛入、中央停站 4 秒、駛離，繞回左側 ----
  train.honk = Math.max(0, train.honk - dt);
  if (!reduced) {
    if (train.state === "run") {
      const nearStop = !train.stopped && train.x > TRAIN_STOP - 120 && train.x < TRAIN_STOP;
      const target = nearStop ? Math.max(6, (TRAIN_STOP - train.x) * .45) : 46;
      train.sp += (target - train.sp) * Math.min(1, dt * 1.5);
      train.x += train.sp * dt;
      if (!train.stopped && train.x >= TRAIN_STOP - 2) { train.state = "stop"; train.wait = 4; train.stopped = true; }
      if (train.x > 1900) { train.x = -380; train.stopped = false; }
    } else {
      train.wait -= dt;
      if (train.wait <= 0) { train.state = "run"; train.sp = 4; }
    }
    // 煙圈
    if (train.state === "run" && Math.random() < dt * 2.2) {
      puffs.push({ e: el("circle", { r: 4, class: "f-cloud ink-thin", opacity: .9 }, train.puffs), x: 22, y: -64, life: 1.6 });
    }
  }
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i]; p.life -= dt; p.y -= 16 * dt; p.x -= (10 + train.sp * .6 - wind * 10) * dt;
    p.e.setAttribute("cx", p.x.toFixed(1)); p.e.setAttribute("cy", p.y.toFixed(1));
    p.e.setAttribute("r", (4 + (1.6 - p.life) * 6).toFixed(1)); p.e.setAttribute("opacity", Math.max(0, p.life / 1.8).toFixed(2));
    if (p.life <= 0) { p.e.remove(); puffs.splice(i, 1); }
  }
  drawTrain();

  // ---- 路燈：夜間微微閃爍；點擊可熄滅／點亮 ----
  for (const L of lamps) {
    L.flick = Math.max(0, L.flick - dt);
    let on = L.off ? 0 : Math.max(.25, night);
    if (!reduced && !L.off) on *= .9 + Math.sin(t * 13 + L.x) * .05 + (Math.random() < .01 ? -.3 : 0);
    if (L.flick > 0) on *= Math.random() < .5 ? .2 : 1;
    L.glass.setAttribute("opacity", on.toFixed(2));
    L.halo.setAttribute("opacity", L.off ? 0 : (on * (L.flick > 0 ? .5 : 1)).toFixed(2));
  }

  // ---- 宮殿窗光：平時依「基本」設定；燈光秀時由中央向兩側逐一點亮 ----
  if (palaceShow >= 0) palaceShow += dt;
  palaceWins.forEach(w => {
    let on = w.base && night > .35;
    if (palaceShow >= 0) on = Math.abs(w.x - 800) < palaceShow * 260 && palaceShow < 6 + Math.abs(w.x - 800) / 260 ? (Math.floor((palaceShow * 4 + w.x / 14)) % 3 !== 0 || palaceShow > 2.6) : on;
    w.e.classList.toggle("on", on);
  });
  if (palaceShow > 9) palaceShow = -1;

  // ---- 柑橘落果 ----
  for (let i = fallen.length - 1; i >= 0; i--) {
    const f = fallen[i];
    f.vy += 600 * dt; f.y += f.vy * dt; f.x += f.vx * dt;
    if (f.y > 586) { f.y = 586; f.vy *= -.35; f.vx *= .7; f.rest = (f.rest || 0) + dt; }
    f.e.setAttribute("cx", f.x.toFixed(1)); f.e.setAttribute("cy", f.y.toFixed(1));
    f.life -= dt; if (f.life < 1) f.e.setAttribute("opacity", Math.max(0, f.life).toFixed(2));
    if (f.life <= 0) { f.e.remove(); fallen.splice(i, 1); }
  }

  // ---- 鴿子：停在雕像頭上；被驚擾時飛一圈再回來 ----
  if (pigeon.state === "fly") {
    pigeon.t += dt;
    const k = pigeon.t / 5;
    pigeon.x = pigeon.hx - Math.sin(k * Math.PI * 2) * 260;
    pigeon.y = pigeon.hy - Math.sin(k * Math.PI) * 150;
    pigeon.wing.setAttribute("d", Math.sin(pigeon.t * 26) > 0 ? "M-4,-2 Q2,-20 8,-14 Q6,-6 6,-2" : "M-4,-2 Q2,10 8,6 Q6,0 6,-2");
    if (k >= 1) { pigeon.state = "perch"; pigeon.x = pigeon.hx; pigeon.y = pigeon.hy; pigeon.wing.setAttribute("d", "M-4,-2 Q2,-8 6,-2"); }
  }
  const pdir = pigeon.state === "fly" ? (Math.cos(pigeon.t / 5 * Math.PI * 2) > 0 ? -1 : 1) : -1;
  const peck = pigeon.state === "perch" && !reduced ? Math.max(0, Math.sin(t * 1.7)) * 2 : 0;
  pigeon.g.setAttribute("transform", `translate(${pigeon.x.toFixed(1)},${(pigeon.y + peck).toFixed(1)}) scale(${pdir * .9},.9)`);

  // ---- 讀書人：偶爾翻頁 ----
  if (!reduced) $("book").setAttribute("transform", Math.sin(t * .45) > .97 ? "translate(2,-2) rotate(-6 10 -18)" : "");

  // ---- 漣漪、麵包屑浮動 ----
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i]; r.life -= dt * .7; r.r += dt * 40 * r.big;
    r.e.setAttribute("rx", r.r.toFixed(1)); r.e.setAttribute("ry", (r.r * .28).toFixed(1));
    r.e.setAttribute("opacity", Math.max(0, r.life).toFixed(2));
    if (r.life <= 0) { r.e.remove(); rings.splice(i, 1); }
  }
  if (!reduced) for (const c of crumbs) if (c.alive) { c.x += wind * 3 * dt; c.e.setAttribute("cx", c.x.toFixed(1)); c.e.setAttribute("cy", (c.y + Math.sin(t * 2 + c.x) * .6).toFixed(1)); }

  // ---- 鳥群 ----
  for (let i = birds.length - 1; i >= 0; i--) {
    const b = birds[i];
    b.x += (90 + wind * 30) * dt; b.ph += dt * 9; b.life -= dt;
    const flap = Math.sin(b.ph);
    b.e.setAttribute("d", `M-7,${(flap * 3).toFixed(1)} Q-3,-4 0,0 Q3,-4 7,${(flap * 3).toFixed(1)}`);
    b.e.setAttribute("transform", `translate(${b.x.toFixed(1)},${(b.y + Math.sin(b.ph * .2) * 4).toFixed(1)})`);
    if (b.life <= 0 || b.x > 1700) { b.e.remove(); birds.splice(i, 1); }
  }

  // ---- 煙火 ----
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    if (s.type === "rise") {
      s.y -= 380 * dt; s.x += wind * 20 * dt;
      s.e.setAttribute("cx", s.x.toFixed(1)); s.e.setAttribute("cy", s.y.toFixed(1));
      if (s.y <= s.ty) { s.e.remove(); sparks.splice(i, 1); burst(s.x, s.y, s.c, s.big); }
      continue;
    }
    s.life -= dt;
    if (s.type === "spark") {
      s.vx *= 1 - dt * 1.6; s.vy = s.vy * (1 - dt * 1.6) + 40 * dt;
      const nx = s.x + s.vx * dt, ny = s.y + s.vy * dt;
      s.e.setAttribute("x1", s.x.toFixed(1)); s.e.setAttribute("y1", s.y.toFixed(1));
      s.e.setAttribute("x2", (nx + s.vx * .06).toFixed(1)); s.e.setAttribute("y2", (ny + s.vy * .06).toFixed(1));
      s.x = nx; s.y = ny;
    } else s.e.setAttribute("r", (5 + (1 - s.life / s.max) * 9).toFixed(1));
    s.e.setAttribute("opacity", Math.max(0, s.life / s.max).toFixed(2));
    if (s.life <= 0) { s.e.remove(); sparks.splice(i, 1); }
  }

  requestAnimationFrame(frame);
}

/* =========================================================
   【互動】
   ========================================================= */
function svgPoint(evt) {
  const p = svg.createSVGPoint(); p.x = evt.clientX; p.y = evt.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
// 風向：滑鼠在畫面左右位置
svg.addEventListener("pointermove", e => { pointerIn = true; windTarget = (svgPoint(e).x / 1600 - .5) * 2.4; });
svg.addEventListener("pointerleave", () => { pointerIn = false; });

// 點湖面：撒麵包屑
$("lakeHit").addEventListener("click", e => {
  const p = svgPoint(e);
  if (!outsideIsland(p.x, p.y)) return;
  throwCrumbs(p.x, p.y);
});
// 點天鵝／鴨：展翅、叫聲、漣漪
$("swans").addEventListener("click", e => {
  const g = e.target.closest(".swan,.duck"); if (!g) return;
  e.stopPropagation();
  const S = swans.find(s => s.g === g); if (!S) return;
  S.flap = 1.6; S.peck = 0;
  ring(S.x, S.y + 2, true);
  const txt = S.kind === "swan" ? pick(["呱——！", "別靠太近喔", "優雅是天生的"]) : S.kind === "cygnet" ? pick(["啾啾！", "媽媽等我～"]) : pick(["嘎嘎！", "呱呱呱"]);
  bubble(S.x, S.y - (S.kind === "swan" ? 70 : 40), txt);
  if (S.kind !== "swan") { S.vx += S.dir * -30; }
  if (reduced) drawSwan(S);
});
// 點噴泉：水柱衝高
$("fountain").addEventListener("click", e => {
  e.stopPropagation();
  jetBoost = 1;
  ring(FX - 60, FY + 14, true); ring(FX + 70, FY + 16, true);
  bubble(FX, FY - 190, pick(["嘩——！", "水花好涼", "太陽球閃閃發亮"]));
});
// 點宮殿：燈光秀
$("palace").addEventListener("click", e => {
  e.stopPropagation();
  palaceShow = 0;
  bubble(800, 150, nightOf(phase) > .5 ? "鏡廳舞會開始！" : "宮殿導覽出發～");
});
// 點小火車：鳴笛、乘客揮手；停站中就提早發車
$("trainLayer").addEventListener("click", e => {
  e.stopPropagation();
  train.honk = 1.6;
  bubble(clamp(train.x - 20, 60, 1540), TRAIN_Y - 96, pick(["嘟嘟——！", "下一站：大運河", "請坐穩喔～"]));
  if (train.state === "stop") train.wait = Math.min(train.wait, .6);
  if (!reduced) for (let i = 0; i < 3; i++) puffs.push({ e: el("circle", { r: 4, class: "f-cloud ink-thin" }, train.puffs), x: 22 + i * 4, y: -64 - i * 6, life: 1.8 });
});
// 點小船：揮手、槳濺水花
$("boat").addEventListener("click", e => {
  e.stopPropagation();
  boat.wave = 1.5;
  ring(boat.x + boat.dir * 20, boat.y + 8, true);
  bubble(boat.x, boat.y - 70, pick(["Bonjour～", "天鵝在那邊！", "划累了…"]));
});
// 點行人：跳一下打招呼
["walkersBack", "walkersFront"].forEach(id => $(id).addEventListener("click", e => {
  const g = e.target.closest(".walker"); if (!g) return;
  e.stopPropagation();
  const W = walkers.find(w => w.g === g); if (!W) return;
  W.hop = 1;
  const top = W.type === "lady" ? 130 : W.type === "kid" ? 145 : 100;
  bubble(W.x, W.y - top * W.s - 10, W.type === "gardener" ? "花剛種好喔" : W.type === "dog" ? "汪！" : pick(GREET));
}));
// 點柑橘樹：搖晃、掉果子
$("orangeTree").addEventListener("click", e => {
  e.stopPropagation();
  orangeShake = 1;
  bubble(100, 286, pick(["柑橘飄香～", "沙沙沙", "小心頭上！"]));
  if (reduced) return;
  for (let i = 0; i < 3; i++) {
    const src = pick(fruitOnTree);
    fallen.push({ e: el("circle", { r: 5.5, class: "f-orange ink-thin" }, $("oranges")), x: src.x, y: src.y, vx: rand(-40, 60), vy: rand(-80, -20), life: 5 });
  }
});
// 點雕像：鴿子飛起繞一圈
$("statue").addEventListener("click", e => {
  e.stopPropagation();
  if (pigeon.state === "perch") {
    if (reduced) { bubble(1450, 320, "咕咕！"); return; }
    pigeon.state = "fly"; pigeon.t = 0;
    bubble(1450, 320, "咕咕！");
  }
});
// 點路燈：閃一下；連點兩次就熄燈／點亮
$("lamps").addEventListener("click", e => {
  const g = e.target.closest(".lamp"); if (!g) return;
  e.stopPropagation();
  const L = lamps.find(l => l.g === g);
  const nowT = performance.now();
  if (L.lastClick && nowT - L.lastClick < 450) { L.off = !L.off; bubble(L.x, 330, L.off ? "熄燈" : "點燈"); }
  else L.flick = .5;
  L.lastClick = nowT;
});
// 點天空：白天鳥群、夜晚煙火
svg.addEventListener("click", e => {
  const p = svgPoint(e);
  if (p.y > 240 || e.target.closest("#palace")) return;
  if (p.x > 1500 && p.y < 230) return;
  if (nightOf(phase) > .5) firework(p.x, Math.max(50, p.y));
  else flock(p.x, p.y);
});

// 控制鈕
$("btnDayNight").addEventListener("click", () => {
  const n = nightOf(phase);
  const to = n > .5 ? Math.ceil(phase + .0001) + .04 : Math.floor(phase) + .5; // 往下一個「上午」或「深夜」
  if (reduced) { phase = to % 1; applyNight(nightOf(phase), true); $("clock").textContent = clockLabel(phase); return; }
  tween = { from: phase, to: to <= phase ? to + 1 : to, t: 0 };
});
$("btnAuto").addEventListener("click", () => {
  auto = !auto;
  $("btnAuto").setAttribute("aria-pressed", auto);
  $("btnAuto").textContent = "自動循環：" + (auto ? "開" : "關");
});
function setShow(on) {
  show = on ? 12 : 0;
  showFw = 0;
  $("btnShow").setAttribute("aria-pressed", on);
  $("btnShow").textContent = "噴泉秀：" + (on ? "演出中" : "待機");
  if (on) { jetBoost = 1; palaceShow = nightOf(phase) > .5 ? 0 : palaceShow; bubble(FX, FY - 200, nightOf(phase) > .5 ? "夜之噴泉秀！" : "噴泉秀開始！"); }
  $("clock").textContent = clockLabel(phase);
}
$("btnShow").addEventListener("click", () => setShow(show <= 0));

// 減少動態：停住行人、天鵝、小火車與雲，只保留切換與點擊回饋
function applyReduced() {
  reduced = RM_QUERY.matches;
  if (reduced) { auto = false; $("btnAuto").setAttribute("aria-pressed", "false"); $("btnAuto").textContent = "自動循環：關"; }
}
RM_QUERY.addEventListener && RM_QUERY.addEventListener("change", applyReduced);
applyReduced();

/* =========================================================
   初始化
   ========================================================= */
spawnWalkers();
applyNight(nightOf(phase), true);
clouds.forEach(c => c.g.setAttribute("transform", `translate(${c.x},${c.y})`));
kasumis.forEach(k => k.e.setAttribute("transform", `translate(${k.x},${k.y})`));
ripples.forEach(r => r.e.setAttribute("transform", `translate(${r.x.toFixed(1)},${r.y.toFixed(1)})`));
farPeople.forEach(p => p.g.setAttribute("transform", `translate(${p.x.toFixed(1)},${p.y})`));
walkers.forEach(drawWalker);
train.x = reduced ? TRAIN_STOP : 260; train.sp = 44;
if (reduced) { train.state = "stop"; train.stopped = true; train.wait = 1e9; }
drawTrain();
swans.forEach(drawSwan);
sortSwans();
requestAnimationFrame(frame);
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show > 0,
  btn: 'btnShow',
  stop: () => { setShow(false); palaceShow = -1; jetBoost = 0; }
});
/* /ShowStop */
})();
</script>
</body>
</html>
