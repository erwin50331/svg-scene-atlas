<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>煉油石化廠</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-41 煉油石化廠｜藍晒圖風格
   地點：原創的臨海煉油石化工業區（不使用任何企業名稱或標誌）。
   以工程立面圖（正視圖）的方式畫出整座廠區，由左到右：
        燃燒塔（鐵塔支撐）→ 浮頂原油槽 → 液化石油氣球形槽 →
        常壓蒸餾工場（加熱爐、常壓蒸餾塔、側線汽提塔、減壓蒸餾塔、氣冷器）→
        流體化媒裂工場（再生器、反應器、鋼構架、煙囪）→
        乙烯裂解爐 → 冷卻水塔、控制室、消防隊 → 卸油碼頭與油輪
   風格重點（藍晒圖 blueprint）：
        - 普魯士藍的晒圖紙，白色細線，紙面有斑駁的褪色與格線
        - 工程製圖語彙：角落延伸的構圖線、中心線（長短鏈線）、
          45 度剖面斜線、尺寸線與標註、比例尺、指北針、雙線圖框
        - 夜晚：紙色轉成深夜藍，線條變暗，廠區的燈火一盞盞亮起（工場夜景）
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），部分另有 --k-名稱（晨昏）。
   JS 會依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）兩個 class。
   ========================================================= */
:root{
  color-scheme: light;

  /* —— 晒圖紙與線條（隨日夜變化） —— */
  --d-paper:#1f5c9f;   --k-paper:#36508e;   --n-paper:#0b1a37;    /* 晒圖紙底色 */
  --d-face:#2a6aad;    --k-face:#435c98;    --n-face:#0f2346;     /* 設備受光面 */
  --d-face-sh:#1a4f8b; --k-face-sh:#2f4479; --n-face-sh:#09162e;  /* 設備背光面 */
  --d-line:#f1f6ff;    --k-line:#fbe9dc;    --n-line:#79acdf;     /* 白色墨線 */
  --d-road:#1c5594;    --n-road:#0a1731;                          /* 道路 */
  --d-sea:#1b5291;     --k-sea:#3a4b85;     --n-sea:#081631;      /* 海面 */
  --d-win:#184a85;     --n-win:#ffd27a;                           /* 會亮燈的窗 */
  --d-peep:#174681;    --n-peep:#ff8a3d;                          /* 加熱爐看火孔 */
  --d-glow:#1f5c9f00;  --k-glow:#ff9a6a;    --n-glow:#0b1a3700;   /* 晨昏地平線的暖光 */
  --d-hat:#fff3c4;     --n-hat:#c9d9ef;                           /* 安全帽 */

  /* —— 光源與表演用色（不隨日夜變化） —— */
  --sun:#fff1c4;
  --moon:#eaf2ff;
  --lamp:#ffc764;      /* 鈉燈 */
  --lamp-core:#fff3d2;
  --flare:#ff9a3c;     /* 燃燒塔火焰 */
  --flare-core:#fff1b8;
  --red-light:#ff4b4b; /* 航空障礙燈 */
  --steam:#ffffff;     /* 蒸汽 */
  --water:#bfe8ff;     /* 消防水柱 */
  --beacon:#ff5a4a;    /* 消防車警示燈 */
  --crude:#ffcf75;     /* 原油流向 */
  --p1:#8fe3ff;        /* 塔頂氣體、液化石油氣 */
  --p2:#b8f08f;        /* 石油腦（汽油原料） */
  --p3:#ffe46b;        /* 煤油 */
  --p4:#ffad55;        /* 柴油 */
  --p5:#ff7559;        /* 常壓渣油 */

  /* —— 天氣 —— */
  --fog:#dbe8f7;
  --rain:#d6e6ff;
  --wx-dark:#05112a;

  /* —— 頁面介面 —— */
  --page-bg:#e8eef6; --page-fg:#14325c; --page-muted:#5b6f8c;
  --ui-surface:#f6f9fd; --ui-line:#c2d0e3; --ui-accent:#1f5c9f;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  /* 圖上的尺寸數字用手寫感字體 */
  --font-hand:"Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS","Comic Neue",cursive;
  --non:0;   /* 夜晚程度（JS 更新），車燈等用 */
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:6px;overflow:hidden;background:var(--paper);line-height:0;box-shadow:0 2px 10px #0000002a}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:10px;padding:10px 14px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--page-fg);border-color:var(--page-fg);color:#fff;font-weight:700}
.panel button.big{border-color:var(--ui-accent);color:#fff;background:var(--ui-accent);font-weight:700}
.panel button.big.on{background:#f2a33a;border-color:#f2a33a;color:#14325c}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
/* 畫面內可點物件：滑鼠點不顯示外框，用鍵盤 Tab 時才顯示 */
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid #ffd27a;outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 內的樣式（製圖線條） ---------- */
#scene .ln{fill:none;stroke:var(--line);stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}
#scene .lnT{fill:none;stroke:var(--line);stroke-width:.75;opacity:.78;stroke-linejoin:round;stroke-linecap:round}
#scene .lnB{fill:none;stroke:var(--line);stroke-width:2.1;stroke-linejoin:round;stroke-linecap:round}
#scene .cons{fill:none;stroke:var(--line);stroke-width:.55;opacity:.38}           /* 構圖延伸線 */
#scene .ctr{fill:none;stroke:var(--line);stroke-width:.6;opacity:.5;stroke-dasharray:14 3 2 3} /* 中心線 */
#scene .dsh{fill:none;stroke:var(--line);stroke-width:.9;opacity:.75;stroke-dasharray:4 3}
#scene .fc{fill:var(--face)}
#scene .fcS{fill:var(--face-sh)}
#scene .fp{fill:var(--paper)}
#scene .hit{fill:transparent;stroke:none}
#scene .hand{font-family:var(--font-hand);fill:var(--line);font-size:12px}
#scene .mono{font:600 10px ui-monospace,Menlo,Consolas,monospace;fill:var(--line)}
#scene .win{fill:var(--win)}
#scene .peep{fill:var(--peep)}
#scene .hat{fill:var(--hat)}
#scene .hot{cursor:pointer}
#scene .puff{fill:var(--steam);fill-opacity:.1;stroke:var(--line);stroke-width:.7;stroke-dasharray:3 2.5}
#scene .night{opacity:var(--non)}
#scene .flow{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
#scene .bubble rect,#scene .tag rect,#scene .call rect{fill:var(--paper);stroke:var(--line);stroke-width:1.4}
#scene .bubble text,#scene .call text{fill:var(--line);font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .tag text{fill:var(--line);font:700 13px var(--font-ui);dominant-baseline:central}
#scene .bubble .pop{animation:pop var(--dur,1.6s) ease-out forwards}
#scene .call{animation:fadeIn .5s ease-out both}
@keyframes pop{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  #scene .bubble .pop,#scene .call{animation:none}
}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：晒圖紙 → 天空（星、日月、雲）→ 遠山與海 → 管架
       → 各工場設備 → 油輪與拖船 → 碼頭 → 蒸汽 → 夜間燈火
       → 表演圖層 → 步道（人、腳踏車）→ 道路與車輛 → 前景圍籬
       → 天氣 → 滑鼠標註 → 對話框 → 圖框
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="藍晒圖風格的臨海煉油石化廠立面圖動畫：普魯士藍晒圖紙上用白線畫出燃燒塔、浮頂油槽、球形儲槽、加熱爐、高聳的常壓與減壓蒸餾塔、流體化媒裂工場的鋼構架、乙烯裂解爐、冷卻水塔、控制室與消防隊，右邊碼頭停著油輪；步道上有戴安全帽的工人和腳踏車，道路上槽車往來；夜晚廠區燈火通明，燃燒塔的火焰照亮夜空">
    <defs id="defs">
      <!-- 晒圖格線 -->
      <pattern id="gridMin" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M20 0H0V20" style="fill:none;stroke:var(--line)" stroke-width=".5" opacity=".08"/>
      </pattern>
      <pattern id="gridMaj" width="100" height="100" patternUnits="userSpaceOnUse">
        <path d="M100 0H0V100" style="fill:none;stroke:var(--line)" stroke-width=".8" opacity=".12"/>
      </pattern>
      <!-- 45 度剖面斜線（背光面、剖面） -->
      <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="6" style="stroke:var(--line)" stroke-width=".8" opacity=".42"/>
      </pattern>
      <pattern id="hatchD" width="3.5" height="3.5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="3.5" style="stroke:var(--line)" stroke-width=".8" opacity=".7"/>
      </pattern>
      <!-- 液面（水平細線） -->
      <pattern id="liq" width="8" height="4" patternUnits="userSpaceOnUse">
        <line x1="0" y1="2" x2="5" y2="2" style="stroke:var(--crude)" stroke-width="1" opacity=".9"/>
      </pattern>
      <!-- 圍籬鐵絲網 -->
      <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse">
        <path d="M0 0L8 8M8 0L0 8" style="stroke:var(--line)" stroke-width=".5" opacity=".35"/>
      </pattern>
      <!-- 光暈 -->
      <radialGradient id="gLamp"><stop offset="0" stop-color="var(--lamp)" stop-opacity=".95"/><stop offset=".35" stop-color="var(--lamp)" stop-opacity=".35"/><stop offset="1" stop-color="var(--lamp)" stop-opacity="0"/></radialGradient>
      <radialGradient id="gFlare"><stop offset="0" stop-color="var(--flare-core)" stop-opacity=".9"/><stop offset=".3" stop-color="var(--flare)" stop-opacity=".45"/><stop offset="1" stop-color="var(--flare)" stop-opacity="0"/></radialGradient>
      <radialGradient id="gRed"><stop offset="0" stop-color="var(--red-light)" stop-opacity="1"/><stop offset=".3" stop-color="var(--red-light)" stop-opacity=".4"/><stop offset="1" stop-color="var(--red-light)" stop-opacity="0"/></radialGradient>
      <radialGradient id="gPeep"><stop offset="0" stop-color="var(--flare)" stop-opacity=".8"/><stop offset="1" stop-color="var(--flare)" stop-opacity="0"/></radialGradient>
      <radialGradient id="gBeacon"><stop offset="0" stop-color="var(--beacon)" stop-opacity="1"/><stop offset="1" stop-color="var(--beacon)" stop-opacity="0"/></radialGradient>
      <radialGradient id="gSun"><stop offset="0" stop-color="var(--sun)" stop-opacity=".5"/><stop offset="1" stop-color="var(--sun)" stop-opacity="0"/></radialGradient>
      <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></radialGradient>
      <linearGradient id="duskG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--glow)" stop-opacity="0"/><stop offset="1" stop-color="var(--glow)" stop-opacity=".75"/></linearGradient>
      <linearGradient id="fogG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--fog)" stop-opacity="0"/><stop offset=".5" stop-color="var(--fog)" stop-opacity=".6"/><stop offset="1" stop-color="var(--fog)" stop-opacity="0"/></linearGradient>
      <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--lamp)" stop-opacity=".45"/><stop offset="1" stop-color="var(--lamp)" stop-opacity="0"/></linearGradient>
      <linearGradient id="hlG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--lamp-core)" stop-opacity=".55"/><stop offset="1" stop-color="var(--lamp-core)" stop-opacity="0"/></linearGradient>
      <!-- 蒸餾塔剖面：塔頂冷、塔底熱 -->
      <linearGradient id="cutG" gradientUnits="userSpaceOnUse" x1="0" y1="150" x2="0" y2="430">
        <stop offset="0" stop-color="var(--p1)"/><stop offset=".22" stop-color="var(--p2)"/><stop offset=".45" stop-color="var(--p3)"/>
        <stop offset=".68" stop-color="var(--p4)"/><stop offset="1" stop-color="var(--p5)"/>
      </linearGradient>
    </defs>

    <!-- 晒圖紙：底色、斑駁、格線 -->
    <rect x="0" y="0" width="1600" height="600" class="f-paper"/>
    <image id="mottle" x="0" y="0" width="1600" height="600" preserveAspectRatio="none" href="" opacity=".55" pointer-events="none"/>
    <rect x="0" y="0" width="1600" height="600" fill="url(#gridMin)" pointer-events="none"/>
    <rect x="0" y="0" width="1600" height="600" fill="url(#gridMaj)" pointer-events="none"/>
    <rect id="dusk" x="0" y="120" width="1600" height="335" fill="url(#duskG)" opacity="0" pointer-events="none"/>

    <!-- 天空 -->
    <g id="skyPar">
      <g id="stars" class="night"></g>
      <g id="sun"></g>
      <g id="moon"></g>
      <g id="clouds"></g>
      <g id="wxClouds" opacity="0"></g>
    </g>
    <rect id="skyHit" x="0" y="0" width="1600" height="330" fill="transparent" role="button" tabindex="0" aria-label="天空：白天點了有海鷗飛過，夜晚有流星"/>
    <g id="gulls"></g>
    <g id="flareGlow"></g>
    <!-- 遠山與海 -->
    <g id="hills"></g>
    <g id="sea"></g>
    <g id="dims"></g>
    <!-- 廠區 -->
    <g id="rack"></g>
    <g id="units"></g>
    <g id="ship"></g>
    <g id="tugs"></g>
    <g id="wharf"></g>
    <g id="plumes"></g>
    <g id="lampGlow" class="night" pointer-events="none"></g>
    <g id="aviation" pointer-events="none"></g>
    <g id="show"></g>
    <!-- 步道、道路 -->
    <g id="ground"></g>
    <g id="walkers"></g>
    <g id="road"></g>
    <g id="laneBack"></g>
    <g id="loadRack"></g>
    <g id="laneFront"></g>
    <g id="spray" pointer-events="none"></g>
    <g id="fore"></g>
    <!-- 天氣 -->
    <g id="weather" pointer-events="none">
      <rect id="wxDark" x="0" y="0" width="1600" height="600" style="fill:var(--wx-dark)" opacity="0"/>
      <g id="fog" opacity="0"></g>
      <g id="rain" opacity="0"></g>
    </g>
    <!-- 滑鼠：標註框與十字準星 -->
    <g id="hover" pointer-events="none"></g>
    <g id="cross" pointer-events="none" opacity="0"></g>
    <g id="labels" pointer-events="none"></g>
    <g id="bubbles" pointer-events="none"></g>
    <rect x="0" y="0" width="1600" height="600" fill="url(#vig)" pointer-events="none"/>
    <!-- 圖框（雙線） -->
    <g pointer-events="none">
      <rect x="7" y="7" width="1586" height="586" class="ln" opacity=".55"/>
      <rect x="12" y="12" width="1576" height="576" class="lnT" opacity=".4"/>
      <path id="frameTicks" class="lnT" opacity=".5"/>
    </g>
  </svg>
  </figure>

  <!-- ===== 互動：控制列 ===== -->
  <div class="panel">
    <button id="btnDistill" class="big" type="button">🔥 開爐蒸餾</button>
    <button id="btnTanker" class="big" type="button">🚢 油輪靠港</button>
    <button id="btnWeather" type="button">天氣：晴</button>
    <button id="btnSound" type="button" aria-pressed="true">🔊 聲音：開</button>
    <button id="btnDay" type="button">☀ 白天</button>
    <button id="btnNight" type="button">☾ 夜晚</button>
    <button id="btnAuto" type="button" aria-pressed="true">自動播放</button>
    <label class="timebox" for="timeRange">
      <span>時間</span>
      <input id="timeRange" type="range" min="0" max="1000" value="417">
      <span class="clock" id="clock">10:00</span>
    </label>
  </div>
  <ul class="hint">
    <li><b>開爐蒸餾</b>：剖開蒸餾塔，看原油分成五種產品。</li>
    <li><b>油輪靠港</b>：拖船護送油輪靠岸，卸油進油槽。</li>
    <li><b>點一點</b>：燃燒塔、油槽、冷卻水塔、消防隊、車、工人、船。</li>
    <li><b>滑鼠</b>：移到設備上，標出名稱與尺寸。</li>
    <li><b>天氣</b>：晴、陰、霧、雨輪流切換。</li>
  </ul>
</main>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;

    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);

    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);

    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}

      const e = all[i];
      for (const a of e.attributes) {

  let added = [];

  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {

    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop

  const btns = [];

    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);

      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它

            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }

    },

})();

<script>
/* =========================================================
   SC-41 煉油石化廠｜程式區
   區塊：①工具與色票 ②場景（晒圖紙、天空、遠山、海、管架、各工場、碼頭、道路、前景）
         ③角色（工人、腳踏車、槽車、消防車、油輪、拖船、海鷗）
         ④動畫（日夜、天氣、燃燒塔、蒸汽、表演秀：開爐蒸餾／油輪靠港）
         ⑤互動（點擊、滑鼠標註、聲音、控制列）
   比例：廠區立面圖約 1 公尺 = 5 px（燃燒塔 78 m、蒸餾塔 60 m、球形槽直徑 14 m）；
        前景的人與車為了看得清楚，畫得比比例尺大一些。

(() => {
'use strict';

/* ---------------- ① 工具與色票 ---------------- */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const root = document.documentElement;
const svg = $('scene');
const defs = $('defs');

const HZ = 338;          // 海平線
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
let seed = 20261124;     // 固定亂數：每次打開構圖一樣
const srand = (a = 0, b = 1) => { seed = (seed * 16807) % 2147483647; return a + (seed / 2147483647) * (b - a); };

const aviation = [];       // 航空障礙燈
const lamp = (x, y, k = 1) => lamps.push([x, y, k]);
const avl = (x, y) => aviation.push([x, y]);
function cons(g, x, y, w, h, e = 6) {
  let d = '';
  [[x, y], [x + w, y], [x, y + h], [x + w, y + h]].forEach(([a, b]) => { d += `M${f1(a - e)} ${f1(b)}H${f1(a + e)}M${f1(a)} ${f1(b - e)}V${f1(b + e)}`; });

  path(g, d, 'lnT');
  if (o.lamp !== false) { lamp(x1 + 2, y - 10); lamp(x2 - 2, y - 10); }
}
function ladder(g, x, y1, y2, cage = true) {
  let d = `M${f1(x - 2.5)} ${y1}V${y2}M${f1(x + 2.5)} ${y1}V${y2}`;
  for (let y = y1 + 3; y < y2; y += 4) d += `M${f1(x - 2.5)} ${y}H${f1(x + 2.5)}`;
  path(g, d, 'lnT');
  if (cage) { let c = ''; for (let y = y1 + 10; y < y2 - 14; y += 7) c += `M${f1(x - 4.5)} ${y}A4.5 2 0 0 0 ${f1(x + 4.5)} ${y}`; path(g, c, 'lnT'); }
}
// 可點的設備：data-name 給滑鼠標註用，data-size 是實際尺寸
function hot(g, name, size, label) {
  g.setAttribute('data-name', name);
  if (size) g.setAttribute('data-size', size);
  g.setAttribute('tabindex', '0'); g.setAttribute('role', 'button');
  g.setAttribute('aria-label', label || name);
  g.classList.add('hot');

/* ---------------- ② 場景：天空（星星、太陽、月亮、雲） ---------------- */
const clouds = [];
function cloudPath(w, h) {
  // 由右往左，沿著上緣畫一顆顆圓弧
  const n = Math.max(3, Math.round(w / 28));
  let pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, x = w - t * w;
    const y = i === 0 || i === n ? 0 : -h * (.45 + .55 * Math.sin(Math.PI * t)) * srand(.75, 1);
    pts.push([x, y]);
  }
  let d = `M0 0H${f1(w)}`;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
    const r = Math.hypot(x1 - x0, y1 - y0) * .56;
    d += `A${f1(r)} ${f1(r)} 0 0 0 ${f1(x1)} ${f1(y1)}`;
  }
  return d + 'Z';
}

  // 星星：製圖的小十字

  }
  path(st, d, 'lnT').setAttribute('id', 'starPath');
  // 太陽：圓規畫的圓＋中心十字＋刻度

  el('circle', { r: 32, class: 'dsh' }, sun);
  path(sun, 'M-46 0H46M0 -46V46', 'cons');
  let r = '';
  for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2; r += `M${f1(Math.cos(a) * 37)} ${f1(Math.sin(a) * 37)}L${f1(Math.cos(a) * (i % 2 ? 42 : 47))} ${f1(Math.sin(a) * (i % 2 ? 42 : 47))}`; }
  path(sun, r, 'lnT');
  // 月亮：圓＋斜線陰影的弦月
  const moon = $('moon');

  el('circle', { r: 17, class: 'ln' }, moon);
  path(moon, 'M-26 0H26M0 -26V26', 'cons');
  // 雲：外框＋淡淡的填色，帶一條中線
  [[180, 92, 140], [520, 60, 110], [900, 120, 170], [1250, 76, 120], [1480, 150, 90]].forEach(([x, y, w]) => {
    const g = el('g', {}, $('clouds'));

    path(g, `M${f1(w * .12)} -4H${f1(w * .88)}`, 'dsh');
    clouds.push({ g, x, y, w, v: srand(4, 9) });
  });
  // 陰天、雨天多出來的厚雲
  [[100, 70, 260], [460, 110, 300], [820, 60, 280], [1180, 100, 300], [1500, 70, 240]].forEach(([x, y, w]) => {

const T = { t: 10 / 24, auto: true, target: null };
let night = 0, dusk = 0, nOn = 0, lastApplied = -1, clock = 0;
function clockText() {
  const h = T.t * 24, hh = Math.floor(h) % 24, mm = Math.floor((h - Math.floor(h)) * 60 + 1e-6);
  return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
}
function applyTime(force) {
  if (!force && Math.abs(T.t - lastApplied) < .0003) return;
  lastApplied = T.t;
  const h = T.t * 24;
  night = clamp(1 - smooth(5.3, 7.2, h) + smooth(17.6, 19.4, h), 0, 1);
  dusk = Math.max(Math.exp(-Math.pow((h - 6.3) / .9, 2)), Math.exp(-Math.pow((h - 18.5) / .9, 2)));
  for (const k in PAIRS) {
    const Pp = PAIRS[k];
    let c = mix(Pp.d, Pp.n, night);
    if (Pp.k) c = mix(c, Pp.k, dusk * .8);
    root.style.setProperty('--' + k, rgba(c));
  }
  nOn = smooth(.3, .85, night);
  root.style.setProperty('--non', nOn.toFixed(3));
  $('dusk').setAttribute('opacity', f1(dusk));
  const sp = (h - 6) / 12.6, mp = ((h - 18.6 + 24) % 24) / 11.4;
  $('sun').setAttribute('transform', `translate(${f1(1460 - sp * 1180)} ${f1(310 - Math.sin(Math.PI * clamp(sp, 0, 1)) * 235)})`);
  $('sun').style.display = sp > -.06 && sp < 1.06 ? '' : 'none';
  $('moon').setAttribute('transform', `translate(${f1(1460 - mp * 1180)} ${f1(300 - Math.sin(Math.PI * clamp(mp, 0, 1)) * 215)})`);
  $('moon').style.display = mp > -.06 && mp < 1.06 ? '' : 'none';
  $('mottle').setAttribute('opacity', f1(.55 - nOn * .3));
  $('clock').textContent = clockText();
  if (!T.dragging) $('timeRange').value = Math.round(T.t * 1000);
}

const DRILL = { on: false, phase: '', t: 0, v: null };

function stepDrill(dt) {
  if (!DRILL.on) return;
  DRILL.t += dt;
  const L = LANES.back;
  if (DRILL.phase === 'door') {
    FIRE.door = Math.min(1, FIRE.door + dt * 1.2);
    if (FIRE.door >= 1) {
      const blocked = L.list.some(v => Math.abs(v.x - 1286) < 110);
      if (!blocked) {
        DRILL.v = addVeh('back', 'fire', 1286); DRILL.v.vmax = 60; DRILL.v.fade = 0; DRILL.v.drill = 'out';
        DRILL.phase = 'run';
      }
    }
  } else if (DRILL.phase === 'run') {
    const v = DRILL.v;
    v.fade = Math.min(1, v.fade + dt * 2);
    if (FIRE.door > 0 && v.x < 1180) FIRE.door = Math.max(0, FIRE.door - dt);
    if (v.drill === 'out' && v.x <= 330) { v.drill = 'spray'; v.stop = 6.5; v.sprayT = 0; sfx(t => spraySnd(t, 6)); }
    if (v.drill === 'spray') { v.sprayT += dt; if (v.stop <= 0) v.drill = 'leave'; }
    if (v.drill === 'back' && v.x <= 1290) { v.stop = 9; v.drill = 'park'; DRILL.phase = 'park'; DRILL.t = 0; }
  } else if (DRILL.phase === 'park') {
    const v = DRILL.v;
    FIRE.door = Math.min(1, FIRE.door + dt * 1.5);
    if (FIRE.door >= 1) v.fade = Math.max(0, v.fade - dt * 1.6);
    if (v.fade <= 0) {
      L.list.splice(L.list.indexOf(v), 1); v.g.remove(); DRILL.v = null; DRILL.phase = 'close';
    }
  } else if (DRILL.phase === 'close') {
    FIRE.door = Math.max(0, FIRE.door - dt);
    if (FIRE.door <= 0) DRILL.on = false;
  }
}

/* ---------------- ④ 動畫：每一格的更新 ---------------- */
let wind = .6, gust = 0, flareBoost = 0, px = 0, pxCur = 0, sprayDrops = [];
function step(dt) {
  clock += dt;
  // —— 時間推進 ——
  if (T.target != null) {
    let d = T.target - T.t; if (d > .5) d -= 1; if (d < -.5) d += 1;
    const s = Math.sign(d) * Math.min(Math.abs(d), dt * .22 + .0005);
    T.t = (T.t + s + 1) % 1;
    if (Math.abs(d) < .001) { T.t = T.target; T.target = null; }
  } else if (T.auto) T.t = (T.t + dt / DAY_SEC) % 1;
  applyTime();
  applyWeather(dt);
  gust *= Math.pow(.4, dt);
  wind = .55 + .3 * Math.sin(clock * .11) + .12 * Math.sin(clock * .67) + gust + wx.rain * .3;

  // —— 雲 ——
  clouds.forEach(c => {
    c.x += c.v * dt * (.6 + wind);
    if (c.x > 1700) c.x = -c.w - 60;
    c.g.setAttribute('transform', `translate(${f1(c.x)} ${f1(c.y)})`);

/* ---------------- ⑤ 互動：滑鼠標註（名稱＋尺寸，像在圖上量測） ---------------- */

function bboxOf(n) {

  const pts = [[b.x, b.y], [b.x + b.width, b.y], [b.x, b.y + b.height], [b.x + b.width, b.y + b.height]].map(([x, y]) => [m.a * x + m.c * y + m.e, m.b * x + m.d * y + m.f]);

  return { x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys) };
}
function drawHover(n) {
  const g = $('hover');
  g.innerHTML = '';
  if (!n || n.getAttribute('opacity') === '0') return;
  const b = bboxOf(n), pad = 4;
  const x = b.x - pad, y = b.y - pad, w = b.w + pad * 2, h = b.h + pad * 2;
  el('rect', { x: f1(x), y: f1(y), width: f1(w), height: f1(h), style: 'fill:none;stroke:var(--lamp)', 'stroke-width': 1.2, 'stroke-dasharray': '5 4' }, g);
  let c = '';
  [[x, y, 1, 1], [x + w, y, -1, 1], [x, y + h, 1, -1], [x + w, y + h, -1, -1]].forEach(([a, bb, sx, sy]) => { c += `M${f1(a)} ${f1(bb + sy * 9)}V${f1(bb)}H${f1(a + sx * 9)}`; });
  el('path', { d: c, style: 'fill:none;stroke:var(--lamp)', 'stroke-width': 2.4 }, g);
  const name = n.getAttribute('data-name'), size = n.getAttribute('data-size');
  const tg = el('g', { class: 'tag' }, g);
  const t = el('text', { x: 0, y: 0 }, tg);
  t.textContent = size ? `${name}｜${size}` : name;
  const tw = (t.getComputedTextLength() || t.textContent.length * 13) + 18;
  const tx = clamp(x + w / 2 - tw / 2, 18, 1582 - tw), ty = y - 22 < 22 ? y + h + 20 : y - 18;
  t.setAttribute('x', f1(tx + 9)); t.setAttribute('y', f1(ty));
  tg.insertBefore(el('rect', { x: f1(tx), y: f1(ty - 12), width: f1(tw), height: 24, rx: 2, style: 'stroke:var(--lamp)' }), t);
}

/* ---------------- 動畫主迴圈 ---------------- */

}
function settle(sec) { for (let s = 0; s < sec; s += .05) step(.05); }

  cancelAnimationFrame(rafId);
  if (reduced) { T.auto = false; syncAuto(); applyTime(true); settle(2); }
  else { last = performance.now(); rafId = requestAnimationFrame(loop); }
}

/* ---------------- 開始：依序畫出場景、角色 ---------------- */
makePaper();
drawSky();
drawHills();
drawRack();
drawFlare();
drawTanks();
sphere(405, 392, 34);
sphere(483, 392, 34);
drawCDU();
drawFCC();
drawCrackers();
drawUtilities();
drawShip();
drawWharf();
drawPerched();
drawGround();
drawPeople();
drawVehicles();
drawWeather();
buildLamps();
buildShowParts();
// 尺寸標註（立面圖比例：1 m = 5 px）
dimV(18, 60, GY, '78 m', 52, 30);
dimV(678, 151, GY, '60 m', 690, 690);
dimH(346, 449, 517, 'Ø14 m');
dimV(104, 372, 446, '15 m', 110, 110);

/* ---------------- ⑤ 互動：點擊 ---------------- */
function onAct(node, fn) {
  node.addEventListener('click', e => { e.stopPropagation(); userGesture = true; ensureAudio(); fn(e); if (reduced) settle(.6); });
  node.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); userGesture = true; ensureAudio(); fn(e); if (reduced) settle(.6); } });
}
function svgPoint(e) {
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
svg.addEventListener('pointerdown', () => { userGesture = true; ensureAudio(); document.body.classList.remove('kbd'); });
window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });

// 滑鼠：十字準星＋座標、移到設備上標出名稱與尺寸、遠景視差
const cross = $('cross');
const chH = el('line', { x1: 0, x2: 1600, class: 'dsh', opacity: .35 }, cross);
const chV = el('line', { y1: 0, y2: 600, class: 'dsh', opacity: .35 }, cross);
el('circle', { r: 6, class: 'ln' }, cross).id = 'chC';
const chT = el('text', { class: 'mono' }, cross);
svg.addEventListener('pointermove', e => {
  const p = svgPoint(e);
  px = clamp((p.x - 800) / 800, -1, 1);
  if (e.pointerType === 'mouse') {
    cross.setAttribute('opacity', 1);
    chH.setAttribute('y1', f1(p.y)); chH.setAttribute('y2', f1(p.y));
    chV.setAttribute('x1', f1(p.x)); chV.setAttribute('x2', f1(p.x));
    $('chC').setAttribute('cx', f1(p.x)); $('chC').setAttribute('cy', f1(p.y));
    // 座標換成公尺（以地面線為 0）
    chT.textContent = `X ${((p.x - 30) / 5).toFixed(0)} m  H ${((GY - p.y) / 5).toFixed(0)} m`;
    chT.setAttribute('x', f1(Math.min(p.x + 10, 1480))); chT.setAttribute('y', f1(Math.max(p.y - 10, 24)));
  }
  const h = e.target.closest ? e.target.closest('.hot') : null;
  if (h !== hoverEl) { hoverEl = h; drawHover(h); }
});
svg.addEventListener('pointerleave', () => { px = 0; cross.setAttribute('opacity', 0); hoverEl = null; drawHover(null); });

// 天空：白天海鷗飛過，夜晚流星
onAct($('skyHit'), e => {
  const p = e.type === 'click' ? svgPoint(e) : { x: 800, y: 120 };
  if (night < .5) {
    for (let i = 0; i < 4; i++) spawnGull(p.x + (p.x < 800 ? -1 : 1) * i * 24, clamp(p.y, 50, 260) + rand(-18, 18), (p.x < 800 ? 1 : -1) * rand(70, 100));
    sfx(gullCry);
  } else {
    const g = el('path', { class: 'ln', style: 'stroke:var(--lamp-core)' }, $('gulls'));
    let k = 0; const x0 = p.x, y0 = clamp(p.y, 30, 240);
    const iv = setInterval(() => { k += .06; g.setAttribute('d', `M${f1(x0 - k * 180)} ${f1(y0 + k * 70)}l${f1(36 * (1 - k))} ${f1(-14 * (1 - k))}`); g.setAttribute('opacity', f1(1 - k)); if (k >= 1) { clearInterval(iv); g.remove(); } }, 30);
    sfx(whoosh);
    say(x0, y0 + 40, '流星！許個願吧', 1.6);
  }
});
// 太陽、月亮：切換日夜
$('sun').setAttribute('class', 'hot'); $('moon').setAttribute('class', 'hot');
onAct($('sun'), () => goTo(21 / 24));
onAct($('moon'), () => goTo(10 / 24));
// 燃燒塔
onAct(FLARE.g, () => {
  flareBoost = 1;
  sfx(t => roar(t, 2.6, .24));
  say(120, 150, pick(['燃燒塔把無法回收的廢氣安全燒掉', '火焰變大是在排放多餘的氣體', '平常只留一小簇長明火']), 2.2);
});
// 加熱爐
onAct(HEATER.g, () => {
  HEATER.boost = 1;
  sfx(t => roar(t, 1.4, .12));
  say(630, 300, pick(['爐火變旺了！', '原油在爐管裡加熱到約 350°C']), 1.8);
});
// 常壓蒸餾塔、側線汽提塔、減壓塔
onAct(document.querySelector('[data-name="常壓蒸餾塔"]'), () => {
  for (let i = 0; i < 4; i++) setTimeout(() => puff(COL.cx + 8, 146, 3, 18, 2.5, 1, -30), i * 120);
  sfx(t => hiss(t, 1.3, .07));
  say(COL.cx, 110, pick(['常壓蒸餾塔：依沸點把原油分開', '越往上溫度越低，越輕的油越往上跑', '塔裡有幾十層塔盤']), 2.2);
});
onAct(document.querySelector('[data-name="側線汽提塔"]'), () => { sfx(t => hiss(t, .6, .05)); say(738, 270, '用蒸汽把側線產品裡的輕油趕出來', 2); });
onAct(document.querySelector('[data-name="減壓蒸餾塔"]'), () => {
  sfx(t => hiss(t, .9, .06));
  say(800, 180, pick(['減壓蒸餾塔：降低壓力，重油在較低溫度就能沸騰', '中間比較粗，因為低壓下油氣體積很大']), 2.4);
});
onAct(FANBANK.g, () => { fans.filter(f => !f.ct).forEach(f => { f.boost = 1; }); sfx(whir); say(744, 380, '氣冷器：用風扇把塔頂油氣冷卻', 1.8); });
// 流體化媒裂、裂解爐
onAct(FCC.g, () => {
  for (let i = 0; i < 5; i++) setTimeout(() => puff(1012 + rand(-3, 3), 148, 4, 26, 4, 1, -24), i * 140);
  sfx(t => noise(t, 1.2, 300, .07, 'lowpass', .7, .2));
  say(915, 120, pick(['流體化媒裂：觸媒像流體一樣循環', '把重油裂解成汽油和液化石油氣', '再生器把觸媒上的焦炭燒掉，重複使用']), 2.4);
});
onAct(CRACK.g, () => {
  CRACK.boost = 1;
  sfx(t => roar(t, 1.2, .1));
  say(1095, 170, pick(['乙烯裂解爐：爐溫 800°C 以上', '石油腦在這裡裂解成乙烯、丙烯', '乙烯是做塑膠的原料']), 2.2);
});
// 冷卻水塔
onAct(CT.g, () => {
  CT.boost = 1;
  sfx(t => { whir(t); noise(t, 2.2, 2400, .05, 'bandpass', .5, .4); });
  say(1247, 330, pick(['風扇加速，水蒸氣冒得更多了', '白煙其實是水蒸氣，不是廢氣']), 2);
});
// 控制室
onAct(CTRL.g, () => {
  CTRL.flick = 1.2;
  sfx(t => { click(t); click(t + .12); bell(t + .25, 1320, .04, .4); });
  say(1200, 400, pick(['控制室 24 小時監控每一座工場', '各單位注意，運轉正常', '防爆牆很厚，平常不開窗']), 2.2);
});
// 消防隊：出動演練
onAct(FIRE.g, startDrill);
// 浮頂油槽：看剖面
tanks.forEach(tk => onAct(tk.g, () => {
  tk.showT = 5;
  sfx(clank);
  say(tk.x + tk.w / 2, tk.top - 26, pick(['浮頂會跟著油面上下浮動', '浮頂貼著油面，減少油氣揮發', '這是原油槽，裡面還有 ' + Math.round(tk.level * 100) + '%']), 2.2);
}));
// 球形槽
document.querySelectorAll('[data-name="球形儲槽"]').forEach(s => onAct(s, () => {
  sfx(t => bell(t, 520, .06, 1.4));
  say(+s.getBBox().x + 40, 330, pick(['液化石油氣加壓成液體，存在球形槽', '球形最能平均承受壓力', '直徑約 14 公尺']), 2.2);
}));
// 裝車台
onAct(LOAD.g, () => { LOAD.armT = 3; sfx(clank); say(LOAD.x, 430, '槽車在這裡裝液化石油氣', 1.8); });
// 裝卸臂
ARMS.forEach(a => onAct(a.g, () => { sfx(clank); say(a.x, 360, SHIP.docked ? '裝卸臂接著船，正在卸原油' : '裝卸臂收起來了', 1.8); }));
// 油輪、拖船
onAct(SHIP.g, () => {
  if (SHIP.honk > 0) return;
  SHIP.honk = 2.5;
  sfx(t => shipHorn(t, 82, 1.8, .18));
  say(SHIP.x + 120, 300, pick(['油輪卸油中，一艘要卸一整天', '嘟——！', '船上的原油來自遠方的油田']), 2);
});
tugs.forEach(g => onAct(g.g, () => { sfx(toot); say(g.x + 18, 400, pick(['嘟嘟！拖船報到', '大船靠岸要靠我們推']), 1.6); }));
// 海鷗
perched.forEach(p => onAct(p.g, () => {
  p.away = 9; spawnGull(p.x, p.y - 4, rand(-90, -60) * (p.x > 1500 ? 1 : -1)); gulls[gulls.length - 1].vy = -30;
  sfx(gullCry);
}));
// 工人、腳踏車
walkers.forEach(w => onAct(w.g, () => {
  if (w.type === 'bike') { sfx(bikeBell); say(w.x, 418, pick(['叮鈴！借過一下', '廠區很大，騎腳踏車比較快']), 1.6); return; }
  w.stop = 2.2;
  const lines = wx.rain > .5 ? ['下雨也要巡檢，穿好雨衣', '雨天地面滑，小心走'] : wx.fog > .5 ? ['霧好濃，燃燒塔都看不清楚', '起霧了，車子開慢一點'] :
    night > .6 ? ['夜班辛苦了！', '晚上的廠區像一座燈城', '交班時間快到了'] :
    w.tool === 'det' ? ['氣體偵測器數值正常', '巡檢中，一切安全'] : w.tool === 'clip' ? ['抄錶紀錄：壓力、溫度都正常', '巡檢單填好了'] : w.tool === 'wrench' ? ['這個閥門要保養了', '維修完成！'] :
    ['安全第一！', '記得戴好安全帽', '今天風往海那邊吹'];
  say(w.x, 418, pick(lines), 1.8);
}));
// 爬梯巡檢員
onAct(CLIMB.g, () => { CLIMB.wait = 2; say(COL.cx - 60, CLIMB.y - 40, pick(['爬上去檢查儀表', '上面風好大！', '安全帶扣好了']), 1.8); });
// 車輛：按喇叭（只有點擊時才會響）
function vehClick(v) {
  if (v.type === 'fire') { sfx(t => siren(t, 1.3)); say(v.x, 460, '消防演練中！', 1.4); return; }
  sfx(airHorn);
  say(v.x, 460, v.type === 'bus' ? pick(['交通車：載同仁上下班', '下一站，控制室']) : v.type === 'pickup' ? pick(['維修班出動', '去換個閥門']) : v.type === 'lpg' ? pick(['滿載液化石油氣', '慢慢開，安全第一']) : pick(['載著柴油出廠', '油罐車，限速行駛']), 1.6);
}
Object.values(LANES).forEach(L => L.list.forEach(v => onAct(v.g, () => vehClick(v))));
// 消防車是之後才加進車道的，用事件代理處理
$('laneBack').addEventListener('click', e => {
  const g = e.target.closest('.hot');
  if (DRILL.v && g === DRILL.v.g) { e.stopPropagation(); vehClick(DRILL.v); }
});

/* ---------------- ⑤ 互動：控制列 ---------------- */
function syncAuto() { $('btnAuto').setAttribute('aria-pressed', String(T.auto)); $('btnAuto').textContent = T.auto ? '自動播放中' : '自動播放'; }
function goTo(t) { if (reduced) { T.t = t; applyTime(true); renderStill(); } else T.target = t; }
const tap = fn => () => { userGesture = true; ensureAudio(); setTimeout(() => { fn(); if (reduced) settle(21); }, actx && actx.state !== 'running' ? 120 : 0); };
$('btnDistill').addEventListener('click', tap(() => startDistill(false)));
$('btnTanker').addEventListener('click', tap(() => startTanker(false)));
$('btnWeather').addEventListener('click', () => {
  userGesture = true; ensureAudio();
  wxI = (wxI + 1) % WX_LIST.length;
  $('btnWeather').textContent = '天氣：' + WX_LIST[wxI][1];
  if (reduced) { applyWeather(0); renderStill(); }
});
$('btnSound').addEventListener('click', () => {
  soundOn = !soundOn; userGesture = true;
  $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  if (ensureAudio()) {
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.setValueAtTime(soundOn ? .5 : 0, actx.currentTime);
    if (!soundOn && musNode) { try { musNode.disconnect(); } catch (e) {} musNode = null; }
  }
});
$('btnDay').addEventListener('click', () => goTo(10 / 24));
$('btnNight').addEventListener('click', () => goTo(21 / 24));
$('btnAuto').addEventListener('click', () => { T.auto = !T.auto; T.target = null; syncAuto(); });
$('timeRange').addEventListener('input', e => {
  T.t = e.target.value / 1000; T.target = null; T.dragging = true; applyTime(true); T.dragging = false;
  if (reduced) renderStill();
});
mq.addEventListener?.('change', e => { reduced = e.matches; if (!reduced) { T.auto = true; syncAuto(); } start(); });

applyTime(true);
applyWeather(0);
syncAuto();
settle(3);      // 先讓蒸汽、車輛跑一下，開場畫面就有生氣
start();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on,
  btn: { distill: 'btnDistill', tanker: 'btnTanker' },
  ff: () => { show.steps = new Proxy({}, { get: () => 1 }); show.t = show.dur - .02; },
  save: () => ({ ...T }),
  stop: () => endShow(),
  restore: s => { Object.assign(T, s); syncAuto(); applyTime(true); renderStill(); }
});
/* /ShowStop */
})();
