<style>
/* =========================================================
   SC-96 慕尼黑啤酒節的開桶日｜扁平插畫 flat illustration
   地點：德國慕尼黑・特蕾莎草坪（Theresienwiese，當地人叫「Wiesn」）。
        左邊山坡上是名人堂（Ruhmeshalle）的多立克柱廊，前面站著高舉橡葉花環、
        身旁趴著獅子的巴伐利亞女神像（Bavaria，青銅，約 18 公尺）；
        中間是木造立面的大啤酒帳篷（原創名稱「Hopfenkrone 啤酒花皇冠」），
        右邊是摩天輪、旋轉鞦韆，草坪東邊的聖保羅教堂尖塔與遠方聖母教堂的雙塔圓頂。
        前景是主街：薑餅心攤、烤雞與鹼水麵包攤，穿皮短褲與 Dirndl 洋裝的遊客。
   帳篷、啤酒廠、攤位名稱都是原創，沒有真實品牌。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   --d-名稱 = 白天、--n-名稱 = 夜晚、--k-名稱 = 黃昏（--n／--k 可省略，省略時程式自動算出夜色與暮色）。
   JS 依時間混色，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（線色）兩個 class。
   沒有 --d- 前綴的（例如 --lamp）是固定色，不隨日夜改變。
   ========================================================= */
:root{
  color-scheme: light;
  /* —— 天空 —— */
  --d-skyT:#4fb0ec; --k-skyT:#5f5fb0; --n-skyT:#0a1433;
  --d-skyB:#c9ecfa; --k-skyB:#ffad7a; --n-skyB:#25305f;
  --d-cloud:#ffffff; --k-cloud:#ffd7bd; --n-cloud:#343d6a;
  --d-cloudSh:#d9e9f4; --k-cloudSh:#f0a98e; --n-cloudSh:#283058;
  /* —— 焚風天才看得到的阿爾卑斯山 —— */
  --d-alps:#9fb7d3; --k-alps:#b08aa8; --n-alps:#1d2650;
  --d-alpsSh:#86a0c2; --n-alpsSh:#172046;
  --d-alpsSnow:#f4f8fc; --k-alpsSnow:#ffd4c0; --n-alpsSnow:#5a6690;
  /* —— 遠方市區、聖母教堂 —— */
  --d-cityFar:#b7d0e2; --k-cityFar:#c6a2ae; --n-cityFar:#1c2550;
  --d-cityFar2:#a3c1d8; --n-cityFar2:#18204a;

  --d-check1:#d94a3e; --d-check2:#3a78c8;

  --d-keg:#b0773e; --d-kegBand:#4a4a52;

  --d-beer:#f4b82a; --d-foam:#ffffff; --d-glass:#e8f4fa;
  --d-shadow:#0000001f; --n-shadow:#0000003a;

  /* —— 固定色：燈光、天體、特效 —— */
  --sun:#ffd166; --sunCore:#fff2c4; --moon:#f7f0d4; --star:#fff6da;
  --lamp:#ffe08a; --lampW:#fff6d8; --glow:#ffcf6a;

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:14px;overflow:hidden;background:var(--skyB,#c9ecfa);line-height:0;box-shadow:0 2px 12px #0000001f}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:12px;padding:10px 14px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--page-fg);border-color:var(--page-fg);color:#fff;font-weight:700}
.panel button.big{border-color:var(--ui-accent);color:#fff;background:var(--ui-accent);font-weight:700}
.panel button.big.alt{border-color:var(--ui-accent-2);background:var(--ui-accent-2)}
.panel button.big.on{background:#f2b632;border-color:#f2b632;color:var(--page-fg)}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid var(--ui-accent);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable,#scene [role="button"]{cursor:pointer}
#scene .sign{font-family:var(--font-sign);font-weight:800;text-anchor:middle;dominant-baseline:central;letter-spacing:.06em}
#scene .hand{font-family:var(--font-hand);text-anchor:middle;dominant-baseline:central}
#scene .bubble rect{fill:#ffffff;stroke:#1e2a3e;stroke-width:1.6}
#scene .bubble text{fill:#1e2a3e;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .bubble .pop{animation:pop var(--dur,1.6s) ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){ #scene .bubble .pop{animation:none} }
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫

       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原

       after:   () => { ... },                  // （選用）最後再補的清理

           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，

  let added = [];

    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }

    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop

    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}

  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);

  }
  function sync() {
    const k = isOn(), act = btnFor(k);

      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);

    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();

/* ---------------- ⑤ 互動：聲音引擎（音樂軌、音效軌分開；同軌的新聲音讓舊的淡出） ---------------- */
let actx = null, master = null, sfxBus = null, musBus = null, noiseBuf = null, soundOn = true, userGesture = false;
let rainGain = null, crowdGain = null, musNode = null;
function ensureAudio() {
  if (!actx) {
    const AC = window.__SceneAudioContext || window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
    master = actx.createGain(); master.gain.value = soundOn ? .5 : 0;
    const comp = actx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3;
    master.connect(comp); comp.connect(actx.destination);
    sfxBus = actx.createGain(); sfxBus.connect(master);
    musBus = actx.createGain(); musBus.gain.value = .64; /* 音樂軌音量 ×0.64（2026-11-24 兩次各調降 20%） */ musBus.connect(master);
  }
  if (actx.state === 'suspended' && userGesture) actx.resume();
  return actx;
}
const audioOK = () => actx && actx.state === 'running' && soundOn;
function newTrack() {
  const g = actx.createGain(); g.connect(musBus);
  const old = musNode;
  if (old) { old.gain.setTargetAtTime(0, actx.currentTime, .15); setTimeout(() => { try { old.disconnect(); } catch (e) {} }, 900); }
  musNode = g;
  return g;
}
let OUT = null;
function nbuf() {
  if (!noiseBuf) { noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  return noiseBuf;
}
function gainEnv(t, a, d, v) {
  const g = actx.createGain();
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d);
  g.connect(OUT || sfxBus); return g;
}
function osc(type, f, t, dur, dest) { const o = actx.createOscillator(); o.type = type; o.frequency.value = f; o.connect(dest); o.start(t); o.stop(t + dur + .05); return o; }
function noise(t, dur, freq, vol, type = 'bandpass', q = 1, a = .004) {
  const s = actx.createBufferSource(); s.buffer = nbuf(); s.loop = true;
  const f = actx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  s.connect(f); f.connect(gainEnv(t, a, dur, vol)); s.start(t); s.stop(t + dur + .1); return f;
}
const sfx = fn => { if (!audioOK()) return; OUT = sfxBus; fn(actx.currentTime + .02); OUT = null; };
// 環境聲：遠遠的人聲嗡嗡（濾過的噪音，不是合成人聲）、雨聲
function ambient(rain, crowd) {
  if (!actx || actx.state !== 'running') return;
  if (!rainGain) {
    const mk = (hpF, lpF) => {
      const s = actx.createBufferSource(); s.buffer = nbuf(); s.loop = true;
      const hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = hpF;
      const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = lpF;
      const g = actx.createGain(); g.gain.value = 0;
      s.connect(hp); hp.connect(lp); lp.connect(g); g.connect(sfxBus); s.start();
      return [g, lp];
    };
    [rainGain] = mk(600, 5000);
    let lp; [crowdGain, lp] = mk(250, 900);
    const lfo = actx.createOscillator(), lg = actx.createGain(); lfo.frequency.value = .23; lg.gain.value = 180; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  }
  rainGain.gain.setTargetAtTime(rain * .08, actx.currentTime, .3);

/* ---------------- ④ 動畫：日夜循環 ----------------

const DAY_SEC = 150;
const T = { t: 11 / 24, auto: true, target: null };
let night = 0, dusk = 0, nOn = 0, lastApplied = -1;
function clockText() {
  const h = T.t * 24, hh = Math.floor(h) % 24, mm = Math.floor((h - Math.floor(h)) * 60 + 1e-6);
  return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
}
function applyTime(force) {
  if (!force && Math.abs(T.t - lastApplied) < .0003) return;
  lastApplied = T.t;
  const h = T.t * 24;
  night = clamp(1 - smooth(5.6, 7.2, h) + smooth(18.6, 20.2, h), 0, 1);
  dusk = Math.max(Math.exp(-Math.pow((h - 6.6) / 1, 2)), Math.exp(-Math.pow((h - 19) / 1.1, 2)));
  for (const k in PAIRS) {
    const Pp = PAIRS[k];
    let c = mix(Pp.d, Pp.n, night);
    c = mix(c, Pp.k, dusk * .8);
    root.style.setProperty('--' + k, rgba(c));
  }
  // 太陽：早上從東邊（右）升起，傍晚落到西邊女神像的後面（左）
  const sp = (h - 6.6) / 12.4, mp = ((h - 19.2 + 24) % 24) / 11;
  const sx = 1500 - sp * 1380, sy = 330 - Math.sin(Math.PI * clamp(sp, 0, 1)) * 270;
  $('sun').setAttribute('transform', `translate(${f1(sx)} ${f1(sy)})`);
  $('sun').style.display = sp > -.04 && sp < 1.04 ? '' : 'none';
  const mx = 1500 - mp * 1380, my = 320 - Math.sin(Math.PI * clamp(mp, 0, 1)) * 250;
  $('moon').setAttribute('transform', `translate(${f1(mx)} ${f1(my)})`);
  $('moon').style.display = mp > -.05 && mp < 1.05 ? '' : 'none';
  nOn = smooth(.3, .85, night);
  ['tentLights', 'boothLights', 'stallLLights', 'stallRLights', 'churchLights'].forEach(id => $(id).setAttribute('opacity', f1(nOn)));
  wheelLights.setAttribute('opacity', f1(Math.max(nOn, show.on === 'spark' ? 1 : 0)));
  swingLights.setAttribute('opacity', f1(nOn));
  $('clock').textContent = clockText();
  if (!T.dragging) $('timeRange').value = Math.round(T.t * 1000);
}

  for (let i = 0; i < 160; i++) {

  const key = WX_LIST[wxI][0];
  for (const k in wx) { const tg = key === k ? 1 : 0; const nv = wx[k] + (tg - wx[k]) * Math.min(1, dt * 1.1); wx[k] = Math.abs(tg - nv) < .002 ? tg : nv; }

});

onAct($('frauenHit'), () => { sfx(t => churchBell(t)); say(988, 170, nextLine('frau', ['聖母教堂：慕尼黑的雙塔圓頂', '銅綠色的圓頂是城市的招牌', '在市中心，離草坪有一段路']), 2.2); });
onAct($('wheelHit'), () => { WH.boost = 4; sfx(t => whoosh(t, .04)); say(WH.cx, 44, nextLine('wheel', ['摩天輪約 50 公尺高', '最高點可以看到整個啤酒節', '天氣好還看得到阿爾卑斯山']), 2); });
onAct($('swing'), () => { SW.boost = 5; sfx(t => { whoosh(t, .04); whoosh(t + .5, .03); }); say(SW.cx, 112, pick(['轉快一點！', '飛起來了！', '鏈條鞦韆越轉越外面']), 1.6); });
onAct($('tentHit'), () => {

  sfx(t => { cheer(t, 1.4, .05); clink(t + .4); clink(t + .5, .04); clink(t + .62, .035); });
  say(660, 236, nextLine('tent', ['Prost！乾杯！', '大帳篷裡可以坐好幾千人', '啤酒用一公升的大杯子（Maß）裝', '裡面有樂隊整天演奏']), 2);
});
onAct($('shootHit'), () => { shootT = 1.4; sfx(pops); say(966, 326, pick(['砰！中了！', '贏一朵紙玫瑰！']), 1.4); });
onAct($('almondHit'), () => { almondT = 2; sfx(t => sizzle(t, 1)); say(1076, 326, pick(['糖炒杏仁，香噴噴！', '用紙袋裝，邊走邊吃']), 1.6); });
onAct($('fishHit'), () => { for (let i = 0; i < 6; i++) { const c = el('circle', { r: 4, style: 'fill:var(--smoke)' }, $('boellerSmoke')); puffs.push({ el: c, x: 1186 + rand(-30, 30), y: 384, vx: rand(-4, 8), vy: rand(-26, -14), r: 5, t: 0, life: 3, soft: 1 }); } sfx(t => sizzle(t, 1.4)); say(1186, 326, pick(['烤魚串：插在炭火邊慢慢烤', '鯖魚最受歡迎！']), 1.8); });
onAct($('ovenHit'), () => { ovenBoost = 3; sfx(t => sizzle(t, 1.6)); say(1480, 360, nextLine('hendl', ['烤半隻雞（Hendl）', '配一個鹼水麵包剛剛好', '外皮烤得脆脆的']), 1.8); });
onAct($('brezHit'), () => { sfx(t => thump(t, .06)); say(1560, 360, pick(['鹼水麵包（Brezn）比臉還大！', '表面撒了粗鹽']), 1.8); });
onAct($('crowd'), () => { prostT = [1.2, 1.2, 1.2]; sfx(t => { clink(t); clink(t + .07, .04); clink(t + .16, .035); cheer(t + .1, 1, .04); }); say(320, 370, pick(['Prost！', '乾杯！再來一杯！', 'Oans, zwoa, g\'suffa！']), 1.6); });
onAct($('buntHit'), () => { buntGust = 3; sfx(rustle); });
onAct(waitress.el, () => { sfx(t => { clink(t); clink(t + .1, .04); }); say(waitress.x, 360, nextLine('waitress', ['十杯一公升啤酒，一次端！', 'Servus！要幾杯？', '讓一讓，啤酒來囉！']), 1.8); });
onAct(paradeG, () => { sfx(t => clop(t, 6)); say(parade.x - 120, 380, nextLine('parade', ['釀酒廠的馬車載著一桶桶啤酒', '馬鬃上綁著彩帶和花', '開幕日老闆們坐馬車進場']), 2); });
hearts.forEach(h => onAct(h.el, () => { h.sw = 1; sfx(t => glock(t, hz(pick([77, 81, 84])), .035)); say(h.x + 60, h.y - 50, h.tip, 2); }));
// 啤酒花園的客人：點一下碰杯
$('garden').addEventListener('click', e => {
  if (e.target.closest('[role="button"]')) return;
  const p = svgPoint(e);
  let best = null, bd = 1e9;
  sitters.forEach(s => { const d = Math.abs(s.x + pxCur * 16 - p.x) + Math.abs(s.y - 20 - p.y); if (d < bd) { bd = d; best = s; } });
  if (!best || bd > 40) return;
  e.stopPropagation(); userGesture = true; ensureAudio();
  sitters.forEach(s => { if (Math.abs(s.x - best.x) < 70) s.prost = 1.4; });
  sfx(t => { clink(t); clink(t + .08, .04); clink(t + .15, .03); });
  say(best.x, 370, pick(['Prost！', 'Ein Prosit！乾杯！', '再來一杯！']), 1.5);
});
// 街上的遊客：停下來說句話
['lane0', 'lane1', 'lane2', 'lane3'].forEach(id => $(id).addEventListener('click', e => {
  const p = svgPoint(e);
  let best = null, bd = 1e9;
  walkers.forEach(w => { const d = Math.abs(w.x + pxCur * 16 - p.x) + Math.abs(w.y - 25 * w.s - p.y) * .6; if (d < bd) { bd = d; best = w; } });
  if (!best || bd > 40) return;
  e.stopPropagation(); userGesture = true; ensureAudio();
  best.stop = 2.2;
  const lines = wx.rain > .5 ? ['下雨也要來喝一杯', '快躲進帳篷！'] : wx.foehn > .5 ? ['焚風天！看得到阿爾卑斯山', '今天天氣好暖'] : best.dog ? ['我的臘腸狗也穿上節慶背帶了', '牠最愛聞烤雞的味道'] : best.man ? ['Servus！', '這條皮短褲是爺爺傳下來的', '帽子上的毛刷是羚羊毛', '先去搶帳篷的位子！'] : ['Servus！', '圍裙蝴蝶結綁在左邊＝單身喔', '這件 Dirndl 是我媽媽的', '我們要去坐摩天輪！'];
  if (best.dog) sfx(bark); else sfx(t => click(t, .04));
  say(best.x + pxCur * 16, best.y - 72 * best.s, pick(lines), 1.8);
  if (reduced) renderStill();
}));

/* ---------------- ⑤ 互動：控制列 ---------------- */
function syncAuto() { $('btnAuto').setAttribute('aria-pressed', String(T.auto)); $('btnAuto').textContent = T.auto ? '自動播放中' : '自動播放'; }
function goTo(t) { if (reduced) { T.t = t; applyTime(true); renderStill(); } else T.target = t; }
const tap = fn => () => { userGesture = true; ensureAudio(); setTimeout(() => { fn(); if (reduced) settle(2); }, actx && actx.state !== 'running' ? 120 : 0); };
$('btnTap').addEventListener('click', tap(startTap));
$('btnSpark').addEventListener('click', tap(startSpark));
$('btnWeather').addEventListener('click', () => {
  userGesture = true; ensureAudio();
  wxI = (wxI + 1) % WX_LIST.length;
  $('btnWeather').textContent = '天氣：' + WX_LIST[wxI][1];
  if (reduced) { for (const k in wx) wx[k] = WX_LIST[wxI][0] === k ? 1 : 0; applyWeather(0); renderStill(); }
});
$('btnSound').addEventListener('click', () => {
  soundOn = !soundOn; userGesture = true;
  $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  if (ensureAudio()) {
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.setValueAtTime(soundOn ? .5 : 0, actx.currentTime);
    if (!soundOn && musNode) { try { musNode.disconnect(); } catch (e) {} musNode = null; }
  }
});
$('btnDay').addEventListener('click', () => goTo(13 / 24));
$('btnNight').addEventListener('click', () => goTo(21.5 / 24));
$('btnAuto').addEventListener('click', () => { T.auto = !T.auto; T.target = null; syncAuto(); });
$('timeRange').addEventListener('input', e => {
  T.t = e.target.value / 1000; T.target = null; T.dragging = true; applyTime(true); T.dragging = false;
  if (reduced) renderStill();
});
mq.addEventListener?.('change', e => { reduced = e.matches; if (!reduced) { T.auto = true; syncAuto(); } start(); });

applyTime(true);
applyWeather(0);
syncAuto();
settle(.2);
start();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on,
  btn: { tap: 'btnTap', spark: 'btnSpark' },
  save: () => ({ ...T }),
  stop: () => {
    if (!reduced) { show.t = show.dur - .01; updateShow(.02); }   // 快轉到結尾
    if (show.on) endShow();
  },
  restore: s => { Object.assign(T, s); syncAuto(); applyTime(true); renderStill(); }
});
/* /ShowStop */
})();
</script>
