<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>夏威夷海灘的日落草裙舞</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-53 夏威夷海灘的日落草裙舞｜復古石版海報風
   地點：美國夏威夷州歐胡島・檀香山威基基海灘（Waikīkī）。
        從庫希歐海灘（Kūhiō Beach）的草裙舞丘往東望：
        右邊是鑽石頭山（Lēʻahi）的火山口稜線與山腳的燈塔，
        左邊遠方是雲霧繚繞的庫勞山脈（Koʻolau，常掛彩虹），
        對岸一排旅館與椰子樹，海灣上有衝浪手、外伸槳獨木舟（waʻa）、
        帆船雙體船，遠方海上偶爾有郵輪與座頭鯨。
        前景是草裙舞丘、火把、衝浪之父的銅像、衝浪板架、救生員塔與海灘遊客。
   風格重點（1930 年代石版印刷旅遊海報）：
        - 少色套印：只用幾種褪色油墨平塗，不用漸層
        - 套版偏移：墨線版刻意跟色塊錯開 2px，露出米白紙縫
        - 粗墨線輪廓、斜線與網點陰影、天空與海面是硬邊色帶
        - 泛黃紙張、斑駁水漬、折痕、印刷顆粒、不規則的紙邊
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），部分另有 --k-名稱（晨昏）。
   JS 會依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）兩個 class。
   ========================================================= */
:root{
  color-scheme: light;

  /* —— 紙與油墨（不隨日夜變化） —— */
  --paper:#f0e2c0;      /* 泛黃海報紙 */
  --paper-dk:#d8c398;
  --stain:#b98a4a;      /* 水漬 */
  --ink:#1f3340;        /* 墨線版（深藍黑） */
  --coral:#e0664a;      /* 珊瑚紅 */
  --red:#c8402e;        /* 扶桑花紅 */
  --pink:#e8a2a0;       /* 粉紅旅館 */
  --yellow:#f2c14e;     /* 陽光黃 */
  --ochre:#d99a3e;      /* 赭黃 */
  --turq:#3fa7a3;       /* 土耳其藍 */
  --navy:#24486a;
  --leaf:#4f8a4a;       /* 葉綠 */
  --cream:#f4e9cc;
  --bronze:#4d3d2e;     /* 銅像 */
  --bronze-hi:#7a6248;

  /* —— 天空：四道硬邊色帶（由上而下） —— */
  --d-sky-1:#5fb3c2; --k-sky-1:#3f4f86; --n-sky-1:#142238;
  --d-sky-2:#86c6c4; --k-sky-2:#b8607a; --n-sky-2:#1a2b48;
  --d-sky-3:#b3d6c0; --k-sky-3:#ec8a5a; --n-sky-3:#213656;
  --d-sky-4:#e6dcae; --k-sky-4:#f4c070; --n-sky-4:#2a4064;
  --d-cloud:#f4ead0;  --k-cloud:#f6c29a; --n-cloud:#34466c;
  --d-cloud-sh:#cdbf9c; --n-cloud-sh:#26344f;
  --d-sunring:#f4e2a2; --k-sunring:#f7b26e; --n-sunring:#2b3a5e;

  /* —— 庫勞山脈（遠山）與鑽石頭山 —— */
  --d-kool-1:#8db596; --k-kool-1:#a07a8a; --n-kool-1:#1d3138;
  --d-kool-2:#5b9466; --k-kool-2:#7a6a74; --n-kool-2:#16282c;
  --d-kool-sh:#3f7050; --n-kool-sh:#102026;
  --d-kool-cap:#eef0e0; --k-kool-cap:#f3c8a6; --n-kool-cap:#3b4a66;
  --d-dh:#b89c5c;   --k-dh:#c77e52; --n-dh:#3a3a46;     /* 鑽石頭山受光面 */
  --d-dh-2:#9a8650; --k-dh-2:#a4644a; --n-dh-2:#2e2f3a;  /* 背光面 */
  --d-dh-hi:#d6bd7c; --k-dh-hi:#eea064; --n-dh-hi:#4a4654; /* 稜線受光 */
  --d-dh-green:#7f9a5a; --n-dh-green:#263330;          /* 山腳樹叢 */

  /* —— 海：遠海、海灣（由深到淺）、浪花 —— */
  --d-sea-1:#3f93a6; --k-sea-1:#7a6a8e; --n-sea-1:#142640;
  --d-sea-2:#2f8299; --k-sea-2:#5e5d82; --n-sea-2:#112138;
  --d-sea-3:#3aa0a6; --k-sea-3:#6c6a8a; --n-sea-3:#13283e;
  --d-sea-4:#62c4b4; --k-sea-4:#a07f8e; --n-sea-4:#1a3348;   /* 淺灘土耳其藍 */
  --d-sea-hi:#e4f0dc; --k-sea-hi:#f6c890; --n-sea-hi:#6f86ad;
  --d-foam:#f8f2df;   --k-foam:#fbe0c0; --n-foam:#a9b8cc;
  --d-wave:#25758d;   --k-wave:#4f4f74; --n-wave:#0d1b30;     /* 浪壁 */

  /* —— 對岸：旅館、高樓、樹 —— */
  --d-farshore:#e8cf96; --n-farshore:#4a4a58;
  --d-hpink:#e6a19a;  --n-hpink:#5b4250;      /* 粉紅旅館 */
  --d-hpink-sh:#c57d7a; --n-hpink-sh:#3f2e3c;
  --d-hwhite:#f1e6cc; --n-hwhite:#555872;     /* 白色殖民式旅館 */
  --d-hwhite-sh:#cdbf9e; --n-hwhite-sh:#3e4058;
  --d-tower:#d4cbae;  --n-tower:#2e3652;      /* 後方高樓 */
  --d-tower-2:#b7c0a8; --n-tower-2:#283048;
  --d-roof-t:#c8573a; --n-roof-t:#4a2a2e;     /* 陶瓦屋頂 */
  --d-win:#3b4a5a;    --n-win:#ffd36a;        /* 會亮燈的窗 */
  --d-winoff:#3b4a5a; --n-winoff:#283044;
  --d-tree:#4f8a4a;   --n-tree:#1a2e2a;
  --d-tree-2:#73a65c; --n-tree-2:#223a30;
  --d-tree-dk:#33613e; --n-tree-dk:#10201c;
  --d-trunk:#7a5a3a;  --n-trunk:#2c2424;

  /* —— 前景：沙灘、草裙舞丘 —— */
  --d-sand:#ecd39a;   --k-sand:#f0b98a; --n-sand:#4a4658;
  --d-sand-2:#dcbd7e; --n-sand-2:#3c3a4c;
  --d-wetsand:#c9a96e; --n-wetsand:#34364a;
  --d-grass:#6a9e4e;  --n-grass:#1f3428;
  --d-grass-2:#88b45e; --n-grass-2:#284032;
  --d-rock:#4f4a46;   --n-rock:#1e1e26;
  --d-shadow:#1f33402a; --n-shadow:#0000006b;

  /* —— 光源 —— */
  --sun:#f6d98a;
  --moon:#f4e9cc;
  --star:#f4e9cc;
  --lamp:#ffd36a;
  --flame:#f08a3a; --flame-2:#ffd86a;

  /* —— 彩虹（只用海報油墨色） —— */
  --bow-1:#c8402e; --bow-2:#e98a3e; --bow-3:#f2c14e; --bow-4:#6fa35c; --bow-5:#3fa7a3; --bow-6:#5a5a9a;

  /* —— 煙火 —— */
  --fw-1:#e0664a; --fw-2:#f2c95a; --fw-3:#8fd0c4; --fw-4:#f4e9cc; --fw-5:#e8a2a0;

  /* —— 天氣 —— */
  --d-rainc:#3e5a74; --n-rainc:#9eb0d4;
  --wx-cloud:#7d8a8a; --wx-rain:#35455c; --wx-bow:#f4e0a8;

  /* —— 角色 —— */
  --skin-1:#f0cba4; --skin-2:#d8a074; --skin-3:#a8714b; --skin-4:#6d4932;
  --hair-1:#2a2226; --hair-2:#6b4428; --hair-3:#d8ae62; --hair-4:#b9b3a8;
  --cloth-1:#c8402e; --cloth-2:#24486a; --cloth-3:#f2c14e; --cloth-4:#3fa7a3; --cloth-5:#e8a2a0; --cloth-6:#4f8a4a; --cloth-7:#f4e9cc;
  --board-1:#e0664a; --board-2:#f2c14e; --board-3:#3fa7a3; --board-4:#f4e9cc; --board-5:#e8a2a0;
  --ti:#5f9a4a;       /* 草裙舞的朱蕉葉裙 */
  --lei:#f2c14e; --lei-2:#e8a2a0;
  --hull:#7a3b2a;     /* 獨木舟船身 */

  /* —— 頁面介面 —— */
  --page-bg:#ece3cf; --page-fg:#1f3340; --page-muted:#6c6556;
  --ui-surface:#f6efde; --ui-line:#cdbd98; --ui-accent:#c8402e;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:6px;overflow:hidden;background:var(--paper);line-height:0;box-shadow:0 2px 10px #0000002a}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:10px;padding:10px 14px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
.panel button.big{border-color:var(--red);color:#fff;background:var(--red);font-weight:700}
.panel button.big.alt{border-color:var(--navy);background:var(--navy)}
.panel button.big.on{background:var(--ochre);border-color:var(--ochre);color:var(--ink)}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
/* 畫面內可點物件：滑鼠點不顯示外框，用鍵盤 Tab 時才顯示 */
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid var(--ui-accent);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 內的樣式 ---------- */
/* 墨線版：粗墨線，和色塊錯開一點（套版偏移） */
#scene .key{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
#scene .key-thin{fill:none;stroke:var(--ink);stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round}
#scene .clickable,#scene [role="button"]{cursor:pointer}
#scene .bubble rect{fill:var(--cream);stroke:var(--ink);stroke-width:2}
#scene .bubble text{fill:var(--ink);font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .bubble .pop{animation:pop var(--dur,1.6s) ease-out forwards}
@keyframes pop{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  #scene .bubble .pop{animation:none}
}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：天空 → 彩虹 → 遠海、庫勞山脈、鑽石頭山、燈塔、郵輪、鯨魚
       → 對岸旅館與樹 → 海灣（船、衝浪手、浪、海龜）
       → 前景沙灘、草裙舞丘、火把、銅像、遊客 → 畫框椰子樹
       → 天氣 → 紙張質感（水漬、折痕、顆粒、紙邊）
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="復古石版印刷旅遊海報風格的夏威夷威基基海灘插畫動畫：右邊是鑽石頭山的火山口稜線與山腳的白色燈塔，左邊遠方是雲霧繚繞的綠色庫勞山脈，對岸有粉紅色與白色的老旅館和一排椰子樹；海灣上衝浪手乘浪、外伸槳獨木舟划過、帆船雙體船航行，遠海有郵輪與座頭鯨；前景是草裙舞丘、火把、衝浪之父銅像、衝浪板架、救生員塔、陽傘與海灘遊客，兩側有椰子樹框住畫面">
    <defs>
      <!-- 網點：陰影與色帶交界 -->
      <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
        <circle cx="3" cy="3" r="1.2" style="fill:var(--ink)" opacity=".35"/>
      </pattern>
      <pattern id="dotsLight" width="6" height="6" patternUnits="userSpaceOnUse">
        <circle cx="3" cy="3" r="1.2" style="fill:var(--cream)" opacity=".6"/>
      </pattern>
      <!-- 斜線陰影：石版畫的手繪排線 -->
      <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="5" style="stroke:var(--ink)" stroke-width="1.3" opacity=".42"/>
      </pattern>
      <pattern id="hatchLight" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
        <line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--ink)" stroke-width="1" opacity=".22"/>
      </pattern>
      <!-- 鑽石頭山的直向侵蝕溝 -->
      <pattern id="gully" width="9" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
        <line x1="2" y1="0" x2="2" y2="40" style="stroke:var(--ink)" stroke-width="1.1" opacity=".3"/>
      </pattern>
      <!-- 沙灘顆粒 -->
      <pattern id="sandDots" width="11" height="9" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r=".9" style="fill:var(--ink)" opacity=".18"/><circle cx="7.5" cy="6.5" r=".8" style="fill:var(--cream)" opacity=".5"/>
      </pattern>
      <!-- 熔岩石牆 -->
      <pattern id="lava" width="26" height="12" patternUnits="userSpaceOnUse">
        <path d="M0 .5H26M.5 0V6M13.5 6V12M0 6.5H26" style="stroke:var(--cream)" stroke-width="1" opacity=".25" fill="none"/>
      </pattern>
      <!-- 阿囉哈襯衫的花紋 -->
      <pattern id="aloha" width="8" height="8" patternUnits="userSpaceOnUse">
        <circle cx="2.5" cy="2.5" r="1.6" style="fill:var(--cream)" opacity=".8"/><circle cx="6.5" cy="6.5" r="1.1" style="fill:var(--yellow)" opacity=".9"/>
      </pattern>
      <!-- 印刷顆粒與紙張水漬：由程式用 canvas 產生後填入 href -->
      <pattern id="grainPat" width="240" height="240" patternUnits="userSpaceOnUse">
        <image id="grainImg" width="240" height="240" href=""/>
      </pattern>
      <clipPath id="frameClip"><rect x="0" y="0" width="1600" height="600"/></clipPath>
      <clipPath id="bayClip"><rect x="-60" y="336" width="1720" height="170"/></clipPath>
    </defs>

    <g clip-path="url(#frameClip)">
    <!-- ===== 場景：天空 ===== -->
    <g id="skyBands"></g>
    <rect id="skyHit" x="0" y="0" width="1600" height="190" fill="transparent" class="clickable" tabindex="0" role="button" aria-label="天空：白天飛來白燕鷗，夜晚放一發煙火"/>
    <g id="stars" pointer-events="none"></g>
    <g id="sun" pointer-events="none"></g>
    <g id="moon" pointer-events="none"></g>
    <g id="rainbow" pointer-events="none" opacity="0"></g>
    <g id="clouds" pointer-events="none"></g>
    <g id="overcast" pointer-events="none" opacity="0"></g>
    <g id="plane" pointer-events="none"></g>
    <g id="fireworks" pointer-events="none"></g>
    <g id="birds" pointer-events="none"></g>

    <!-- ===== 場景：遠海、庫勞山脈、鑽石頭山（滑鼠移動有視差） ===== -->
    <g id="parFar">
      <g id="seaFar"></g>
      <g id="farRefl" pointer-events="none"></g>
      <g id="liner"></g>
      <g id="koolau"></g>
      <g id="koolauCap" pointer-events="none"></g>
      <g id="diamond"></g>
      <g id="lighthouse"></g>
      <g id="beam" pointer-events="none"></g>
      <g id="whale"></g>
    </g>

    <!-- ===== 場景：對岸旅館、海灣（船、衝浪、浪、海龜） ===== -->
    <g id="parMid">
      <g id="towers"></g>
      <g id="hotels"></g>
      <g id="farTrees"></g>
      <g id="bay"></g>
      <g id="bayWaves" pointer-events="none"></g>
      <g id="refl" pointer-events="none"></g>
      <g id="ripples" pointer-events="none"></g>
      <g id="boats"></g>
      <g id="crests" pointer-events="none"></g>
      <g id="surfers"></g>
      <g id="spray" pointer-events="none"></g>
      <g id="turtle"></g>
    </g>

    <!-- ===== 場景：前景沙灘與草裙舞丘 ===== -->
    <g id="parNear">
      <g id="beach"></g>
      <g id="swash" pointer-events="none"></g>
      <g id="mound"></g>
      <g id="props"></g>
      <g id="walkers"></g>
      <g id="smoke" pointer-events="none"></g>
      <g id="frame"></g>
    </g>

    <!-- ===== 天氣與氛圍 ===== -->
    <g id="rain" pointer-events="none" opacity="0"></g>
    <g id="wxTint" pointer-events="none"></g>
    <g id="notes" pointer-events="none"></g>
    <g id="bubbles" pointer-events="none"></g>
    </g>

    <!-- ===== 海報紙張：水漬、折痕、印刷顆粒、不規則紙邊 ===== -->
    <image id="stainImg" x="0" y="0" width="1600" height="600" preserveAspectRatio="none" href="" opacity=".55" pointer-events="none"/>
    <rect x="0" y="0" width="1600" height="600" fill="url(#grainPat)" pointer-events="none"/>
    <g id="creases" pointer-events="none"></g>
    <path id="paperEdge" fill-rule="evenodd" style="fill:var(--paper)" pointer-events="none"/>
    <path id="paperEdgeLine" class="key-thin" pointer-events="none" opacity=".7"/>
  </svg>
  </figure>

  <!-- ===== 互動：控制列 ===== -->
  <div class="panel">
    <button id="btnHula" class="big" type="button">🌺 日落草裙舞</button>
    <button id="btnSurf" class="big alt" type="button">🏄 大浪衝浪</button>
    <button id="btnWeather" type="button">天氣：晴</button>
    <button id="btnSound" type="button" aria-pressed="true">🔊 聲音：開</button>
    <button id="btnDay" type="button">☀ 白天</button>
    <button id="btnNight" type="button">☾ 夜晚</button>
    <button id="btnAuto" type="button" aria-pressed="true">自動播放</button>
    <label class="timebox" for="timeRange">
      <span>時間</span>
      <input id="timeRange" type="range" min="0" max="1000" value="620">
      <span class="clock" id="clock">15:00</span>
    </label>
  </div>
  <ul class="hint">
    <li><b>日落草裙舞</b>：吹響海螺、點起火把，樂手上場，舞者跳得更起勁。</li>
    <li><b>大浪衝浪</b>：大浪湧進，衝浪手和獨木舟一起乘浪。</li>
    <li><b>點一點</b>：草裙舞者、扶桑花、衝浪手、獨木舟、海龜、鯨魚、銅像、火把、行人。</li>

<script id="showstop">
/* =========================================================

   用法：放在場景主程式 <script> 之前；主程式最後呼叫

       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾

       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理

           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，

   ========================================================= */

  'use strict';
  const W = window;

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */

    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);

    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}

    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop

  const btns = [];

      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它

      });

      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();

<script>
/* =========================================================
   SC-53 威基基海灘｜程式區
   區塊：①工具與色票 ②場景（天空、遠山、鑽石頭山、旅館、海灣、沙灘、草裙舞丘、紙張）

         ④動畫（日夜、天氣、草裙舞、大浪、浪潮、煙火、環境）

(() => {

const bigFronds = [];

  P(g, `M${x - 13} ${by} Q${mx - 8} ${(by + ty) / 2} ${tx - 6} ${ty} L${tx + 6} ${ty} Q${mx + 8} ${(by + ty) / 2} ${x + 13} ${by} Z`, 'f-trunk');

    const w = 13 - t * 7;
    el('path', { d: `M${f1(px - w)} ${f1(py)} Q${f1(px)} ${f1(py + 3)} ${f1(px + w)} ${f1(py)}`, class: 'key-thin', opacity: .55 }, g);
  }
  el('path', { d: `M${x + 3} ${by} Q${mx + 8} ${(by + ty) / 2} ${tx + 4} ${ty} L${tx + 6} ${ty} Q${mx + 8} ${(by + ty) / 2} ${x + 13} ${by} Z`, fill: 'url(#hatch)' }, g);
  el('path', { d: `M${x - 13} ${by} Q${mx - 8} ${(by + ty) / 2} ${tx - 6} ${ty} M${tx + 6} ${ty} Q${mx + 8} ${(by + ty) / 2} ${x + 13} ${by}`, class: 'key', transform: REG }, g);
  // 葉冠：大片的羽狀葉，每片葉子分開擺動
  const angs = flip ? [190, 160, 130, 215, 245, 100, 60, 20, 280] : [-10, 20, 50, -35, -65, 80, 120, 160, 260];
  angs.forEach((a, i) => {
    const fg = el('g', { transform: `translate(${tx} ${ty})` }, g);
    const inner = el('g', {}, fg);
    const L = 120 + (i % 3) * 22, r = a * Math.PI / 180;
    const ex = Math.cos(r) * L, ey = Math.sin(r) * L * .55 + L * .5;
    const mx2 = Math.cos(r) * L * .55, my2 = Math.sin(r) * L * .6 - 22;
    // 葉軸
    let d = `M0 0 Q${f1(mx2)} ${f1(my2)} ${f1(ex)} ${f1(ey)}`;
    // 葉片：沿著葉軸畫一排細長的小葉
    let leaf = '';
    for (let k = 1; k < 12; k++) {
      const t = k / 12, px = 2 * (1 - t) * t * mx2 + t * t * ex, py = 2 * (1 - t) * t * my2 + t * t * ey;
      const nx = 2 * (1 - t) * mx2 + 2 * t * (ex - mx2), ny = 2 * (1 - t) * my2 + 2 * t * (ey - my2);
      const len = Math.hypot(nx, ny) || 1, ux = nx / len, uy = ny / len;
      const ll = 26 * (1 - t * .6);
      leaf += `M${f1(px)} ${f1(py)} L${f1(px + (ux * .5 - uy) * ll)} ${f1(py + (uy * .5 + ux) * ll + 6)} L${f1(px + ux * 8)} ${f1(py + uy * 8)} Z `;
      leaf += `M${f1(px)} ${f1(py)} L${f1(px + (ux * .5 + uy) * ll)} ${f1(py + (uy * .5 - ux) * ll + 6)} L${f1(px + ux * 8)} ${f1(py + uy * 8)} Z `;
    }
    el('path', { d: leaf, class: i % 2 ? 'f-tree' : 'f-tree-dk' }, inner);
    el('path', { d: leaf, class: 'key-thin', transform: REG, opacity: .6 }, inner);
    el('path', { d, class: 's-trunk', 'stroke-width': 3 }, inner);
    bigFronds.push({ el: inner, ph: i * .9 + (flip ? 2 : 0), amp: 2 + (i % 3) });
  });

  frag(g, `<g transform="translate(${tx} ${ty + 8})">${[[-8, 0], [6, 2], [-1, 8], [10, -6], [-12, 8]].map(([a, b]) => `<circle cx="${a}" cy="${b}" r="7" style="fill:var(--ochre)"/><circle cx="${a}" cy="${b}" r="7" class="key-thin" transform="translate(1 1)"/>`).join('')}</g>`);

/* 大浪衝浪音樂：D 大調、每分鐘 132 拍的輕快原創曲（約 20 秒）

function surfMusic(t) {
  OUT = newTrack('mus');

    else { strum(bt, ch, .05); bass(bt, b, beat * 3, .08); }
    // 大鼓：每小節頭重擊，二、四拍邊擊
    const o = osc('sine', 90, bt, .4, gainEnv(bt, .003, .35, m < 10 ? .2 : .26)); o.frequency.exponentialRampToValueAtTime(44, bt + .3);
    if (m < 10) { noise(bt + beat, .05, 2400, .05, 'bandpass', 1.5); noise(bt + 3 * beat, .05, 2400, .05, 'bandpass', 1.5); }
  });

    74, 1, 78, 1, 81, 2, 78, 2, 74, 2, 71, 1, 74, 1, 79, 1, 78, 1, 76, 2, 73, 2, 74, 4];
  let s = 0, prev = 62;
  for (let i = 0; i < mel.length; i += 2) { steel(t + s * beat, hz(prev), hz(mel[i]), mel[i + 1] * beat * .92, .045); prev = mel[i]; s += mel[i + 1]; }

}

/* ---------------- ④ 動畫：日夜循環 ----------------
   T.t：一天中的時間（0–1，0 = 午夜）。自動播放時一天約 150 秒 */
const DAY_SEC = 150;
const T = { t: 15 / 24, auto: true, target: null };
let night = 0, dusk = 0, nOn = 0, lastApplied = -1, sunX = 0;
function clockText() {
  const h = T.t * 24, hh = Math.floor(h) % 24, mm = Math.floor((h - Math.floor(h)) * 60 + 1e-6);
  return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
}
function applyTime(force) {
  if (!force && Math.abs(T.t - lastApplied) < .0003) return;
  lastApplied = T.t;
  const h = T.t * 24;
  night = clamp(1 - smooth(5.6, 7.2, h) + smooth(18.2, 19.8, h), 0, 1);
  dusk = Math.max(Math.exp(-Math.pow((h - 6.5) / 1, 2)), Math.exp(-Math.pow((h - 18.9) / 1, 2)));
  for (const k in PAIRS) {
    const Pp = PAIRS[k];
    let c = mix(Pp.d, Pp.n, night);
    if (Pp.k) c = mix(c, Pp.k, dusk * .85);
    root.style.setProperty('--' + k, rgba(c));
  }
  // 太陽從鑽石頭山那邊升起，往左邊落下
  const sp = (h - 6) / 12.9, mp = ((h - 18.9 + 24) % 24) / 11.1;
  const sx = 1460 - sp * 1200, sy = 236 - Math.sin(Math.PI * clamp(sp, 0, 1)) * 176;
  $('sun').setAttribute('transform', `translate(${f1(sx)} ${f1(sy)})`);
  $('sun').style.display = sp > -.05 && sp < 1.05 ? '' : 'none';
  const mx = 1460 - mp * 1200;
  $('moon').setAttribute('transform', `translate(${f1(mx)} ${f1(236 - Math.sin(Math.PI * clamp(mp, 0, 1)) * 160)})`);
  $('moon').style.display = mp > -.05 && mp < 1.05 ? '' : 'none';
  sunX = night > .5 ? mx : sx;
  $('sunRefl').setAttribute('transform', `translate(${f1(clamp(sunX, 0, 1600))} 0)`);
  nOn = smooth(.35, .9, night);
  document.querySelectorAll('#scene .bandDots').forEach(e => e.setAttribute('opacity', f1(.5 - nOn * .35)));
  boats.forEach(b => b.el.querySelectorAll('.boatLamp').forEach(e => e.setAttribute('opacity', f1(nOn))));
  $('liner').querySelector('.linerLights').setAttribute('opacity', f1(nOn));
  $('clock').textContent = clockText();
  if (!T.dragging) $('timeRange').value = Math.round(T.t * 1000);
}

let last = 0, rafId = 0;
function loop(now) {
  const dt = clamp((now - last) / 1000, 0, .05); last = now;
  step(dt);
  rafId = requestAnimationFrame(loop);
}
function settle(sec) { for (let s = 0; s < sec; s += .05) step(.05); }
function renderStill() { step(.0001); }
function start() {
  cancelAnimationFrame(rafId);
  if (reduced) { T.auto = false; syncAuto(); applyTime(true); settle(1.5); }
  else { last = performance.now(); rafId = requestAnimationFrame(loop); }
}

onAct(boats[1].el, () => {
  boats[1].boost = 3; sfx(t => { bell(t, 880, .16, 1.6); bell(t + .5, 880, .12, 1.6); });
  say(boats[1].x, 268, pick(['雙體船直接從沙灘出海', '要不要搭日落遊船？']), 1.8);
});
// 衝浪手：等浪時會說話，乘浪時點一下就翻板
surfers.forEach(s => onAct(s.el, () => {
  if (s.op < .5) return;
  if (s.st === 'ride') {
    s.st = 'fall'; s.fall = 1.2; spray(s.x, s.y - 6, 10, 1); sfx(t => splash(t, .12));
    say(s.x, s.y - 50, pick(['哇——翻板了！', '噗通！']), 1.4);
  } else if (s.st === 'wait') { sfx(t => splash(t, .05)); say(s.x, s.y - 44, pick(['等下一道浪！', '浪快來了', 'Shaka!']), 1.6); }
  else say(s.x, s.y - 40, '划回去再來一次', 1.4);
}));
// 綠蠵龜：浮上來換氣
onAct($('turtle'), () => {
  if (turtle.up <= 0) { turtle.up = 4.5; turtle.next = rand(12, 20); }
  sfx(breath);
  say(turtle.x, 420, pick(['綠蠵龜（honu）是受保護動物', '看海龜要保持 3 公尺距離喔', '牠浮上來換氣了']), 2);
});
// 草裙舞者：轉一圈、說一句
dancers.forEach((d, i) => onAct(d.el, () => {
  d.spin = 1.2; sfx(chime);
  say(d.x, 404, pick(['Aloha!', '手的動作在說海浪的故事', '草裙是用朱蕉葉做的', '一起來跳草裙舞吧！', '頭上戴的是花冠（haku lei）']), 2);
}));
// 扶桑花：點一下花朵晃動
flowerBushes.forEach((b, i) => onAct(b, () => {
  flowers.forEach(f => { if (b.contains(f.el)) f.pop = 1; });
  sfx(chime);
  say(i === 1 ? 1500 : i === 2 ? 550 : 120, i === 2 ? 470 : 510, pick(['夏威夷的州花是黃色扶桑花', '扶桑花常戴在耳邊', '花朵早上開、傍晚就謝了']), 2);
}));
// 火把：單獨點燃或熄滅
torches.forEach(tc => onAct(tc.g, () => { tc.manual = !(tc.lit > .5); sfx(tc.manual ? whoosh : click); }));
// 銅像：掛上花環
onAct(statue.g, () => {
  if (statue.extra < 4) {
    const k = statue.extra++;
    for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2; el('circle', { cx: f1(601 + Math.cos(a) * (8 + k * 1.5)), cy: f1(458 + k * 3 + Math.sin(a) * 4), r: 1.8, style: `fill:var(--${['lei', 'lei-2', 'red', 'cream'][k]})` }, statue.leis); }
  }
  sfx(chime);
  say(601, 392, pick(['現代衝浪之父，也是奧運游泳金牌', '大家常幫銅像掛上花環', 'Aloha!']), 2.2);
});
// 衝浪板架
onAct(rack.g, () => { rack.jiggle = 1.2; sfx(click); say(720, 440, pick(['衝浪板寄放架', '長板最適合威基基的浪']), 1.8); });
// 救生員：吹哨子、揮旗
onAct(lifeguard.g, () => {
  lifeguard.whistle = 1.5; sfx(whistle);
  say(1062, 410, pick(['請在救生員看得到的地方游泳', '紅旗表示有危險，黃旗要小心', '今天浪不錯，注意安全！']), 2);
});
// 陽傘：被風吹起來又落回去；日光浴的人說話
umbrellas.forEach((u, i) => onAct(u.g, () => {
  if (u.hop > 0) return;
  u.hop = 1.6; sfx(whoosh);
  say(u.x, 456, pick(['哎呀，風好大！', '曬太陽好舒服', '要擦對珊瑚礁友善的防曬乳']), 1.8);
}));
// 沙堡：小孩繼續堆高
onAct(castle.g, () => {
  castle.dig = 1.2; sfx(t => noise(t, .3, 700, .05, 'lowpass', .7, .02));
  if (castle.lvl < 2) {
    castle.lvl++;
    const y = 512 - castle.lvl * 10;
    P(castle.tw, `M${954 + castle.lvl * 2} ${y + 10} V${y + 2} H${958 + castle.lvl * 2} V${y - 2} H${966 - castle.lvl * 2} V${y + 2} H${970 - castle.lvl * 2} V${y + 10} Z`, 'f-sand-2', 'key-thin');
    if (castle.lvl === 2) { castle.flag.setAttribute('opacity', 1); castle.flag.setAttribute('transform', 'translate(0 -18)'); }
  }
  say(980, 470, castle.lvl >= 2 ? '我的沙堡完成了！' : pick(['再堆高一點！', '要做一座城堡']), 1.6);
});
// 街頭樂手
onAct(busker, () => {
  if (buskT > 0) return;
  if (show.on) { busy(); return; }
  buskT = 4;
  if (audioOK()) { buskerTune(actx.currentTime + .05); duckMusic(5); }
  say(1336, 486, pick(['來一首烏克麗麗小曲', 'Mahalo!（謝謝！）', '烏克麗麗是夏威夷的國民樂器']), 2);
});
// 八哥：一隻被點，三隻一起飛起
$('props').addEventListener('click', e => {
  const m = mynas.find(m => m.el.contains(e.target));
  if (!m) return;
  e.stopPropagation(); userGesture = true; ensureAudio();
  mynas.forEach(b => { if (!b.fly) { b.fly = .001; b.vx = rand(-90, 90); b.vy = rand(-100, -60); } });
  sfx(t => { flap(t); mynaCall(t + .3); });
  if (reduced) settle(.3);
});
// 行人：停下來說句話
$('walkers').addEventListener('click', e => {
  const pt = svgPoint(e);
  let best = null, bd = 1e9;
  walkers.forEach(w => { const d = Math.abs(w.x + pxCur * 4 - pt.x) + Math.abs(w.y - 24 - pt.y) * .5; if (d < bd) { bd = d; best = w; } });
  if (!best || bd > 40) return;
  e.stopPropagation(); userGesture = true;
  best.stop = 2.2;
  const lines = wx.rain > .5 ? ['陣雨一下就停了', '下雨也照樣下水！', '等一下會出彩虹喔'] : wx.bow > .5 ? ['快看，彩虹！', '雙彩虹耶！'] :
    best.type === 'surfer' ? ['今天浪不錯！', '要去下水囉'] : best.type === 'aloha' ? ['Aloha!', '這件阿囉哈襯衫是新買的'] : best.type === 'aunty' ? ['要不要學草裙舞？', 'E komo mai!（歡迎！）'] :
    best.type === 'kid' ? ['我看到海龜了！', '我要去玩趴板！'] : best.type === 'photo' ? ['鑽石頭山好好拍！', '來張合照吧'] : best.type === 'lei' ? ['這串花環是緬梔花做的', 'Aloha!'] : ['Mahalo!（謝謝！）', '海水好溫暖', 'Aloha!'];
  say(best.x + pxCur * 4, best.y - 70 * best.s, pick(lines), 1.8);
  if (reduced) renderStill();
});
// 鑽石頭山上的遊客揮手（隨時間收起）
setInterval(() => {
  if (hikeT > 0) { hikeT -= .1; hikers.querySelectorAll('.hkArm').forEach((a, i) => a.setAttribute('d', Math.sin(Date.now() / 120 + i) > 0 ? 'M1 -5 L3 -9' : 'M1 -5 L4 -7')); if (hikeT <= 0) hikers.setAttribute('opacity', 0); }
}, 100);

/* ---------------- ⑤ 互動：控制列 ---------------- */
function syncAuto() { $('btnAuto').setAttribute('aria-pressed', String(T.auto)); $('btnAuto').textContent = T.auto ? '自動播放中' : '自動播放'; }
function goTo(t) { if (reduced) { T.t = t; applyTime(true); renderStill(); } else T.target = t; }
const tap = fn => () => { userGesture = true; ensureAudio(); setTimeout(() => { fn(); if (reduced) settle(2); }, actx && actx.state !== 'running' ? 120 : 0); };
$('btnHula').addEventListener('click', tap(() => startHula(false)));
$('btnSurf').addEventListener('click', tap(() => startSurf(false)));
$('btnWeather').addEventListener('click', () => {
  userGesture = true; ensureAudio();
  wxI = (wxI + 1) % WX_LIST.length;
  $('btnWeather').textContent = '天氣：' + WX_LIST[wxI][1];
  if (reduced) { for (const k in wx) wx[k] = WX_LIST[wxI][0] === k ? 1 : 0; applyWeather(0); renderStill(); }
});
$('btnSound').addEventListener('click', () => {
  soundOn = !soundOn; userGesture = true;
  $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  if (ensureAudio()) {
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.setValueAtTime(soundOn ? .5 : 0, actx.currentTime);
    if (!soundOn && musNode) { try { musNode.disconnect(); } catch (e) {} musNode = null; }
  }
  if (!soundOn) { try { window.sceneMusic && window.sceneMusic.stop(); } catch (e) {} }
});
$('btnDay').addEventListener('click', () => goTo(11 / 24));
$('btnNight').addEventListener('click', () => goTo(21 / 24));
$('btnAuto').addEventListener('click', () => { T.auto = !T.auto; T.target = null; syncAuto(); });
$('timeRange').addEventListener('input', e => {
  T.t = e.target.value / 1000; T.target = null; T.dragging = true; applyTime(true); T.dragging = false;
  if (reduced) renderStill();
});
mq.addEventListener?.('change', e => { reduced = e.matches; if (!reduced) { T.auto = true; syncAuto(); } start(); });

applyTime(true);
applyWeather(0);
syncAuto();
start();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on,
  btn: { hula: 'btnHula', surf: 'btnSurf' },
  ff: () => { show.t = show.dur - .02; },
  save: () => ({ ...T }),
  stop: () => endShow(),
  restore: s => { Object.assign(T, s); syncAuto(); applyTime(true); renderStill(); }
});
/* /ShowStop */
})();
</script>
</body>
</html>
