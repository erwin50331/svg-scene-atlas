<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>哥本哈根的聖誕燈籠夜</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-29 哥本哈根的聖誕燈籠夜（丹麥・哥本哈根）｜紙雕立體光影風
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   風格重點：整個畫面像一座多層紙板疊成的立體紙雕——
            每一層紙板都有投影（投影方向跟著太陽走），
            窗戶是用刀片割空的洞，夜裡由後方的燈光透出來；
            全畫面疊一層紙纖維紋理，滑鼠移動時各層紙板產生遠近視差。
            裝飾借用丹麥傳統的紅白編織紙心（julehjerter）。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），
   部分另有 --k-名稱（晨昏）。JS 會依時間內插，輸出成 --名稱，
   並自動產生 .f-名稱（填色）、.s-名稱（描邊）兩個 class。
   ========================================================= */
:root{
  color-scheme: dark;

  /* —— 天空（最後面那張紙） —— */
  --d-sky-top:#9cc3df;  --k-sky-top:#6a6fa8;  --n-sky-top:#0f1636;
  --d-sky-mid:#c4dcea;  --k-sky-mid:#e0909a;  --n-sky-mid:#1b2550;
  --d-sky-low:#f1ebdc;  --k-sky-low:#f7bd7e;  --n-sky-low:#2e3766;
  --d-cloud:#fbf8f1;    --k-cloud:#ffdcc6;    --n-cloud:#3a4370;
  --d-overcast:#b9bfc6; --n-overcast:#262c48;

  /* —— 遠方城市剪影（銅綠尖塔、屋頂） —— */
  --d-far-1:#b8c8cf;    --k-far-1:#b28aa0;    --n-far-1:#232c52;
  --d-far-2:#9fb4bd;    --k-far-2:#9a7590;    --n-far-2:#1c2446;
  --d-copper:#86b8a4;   --n-copper:#2c4a50;   /* 銅綠尖頂 */

  /* —— 新港北岸的彩色運河屋 —— */
  --d-h1:#f0bd4c;  --n-h1:#7a5a3a;   /* 鮮黃 */
  --d-h2:#d2563e;  --n-h2:#6a2c2e;   /* 磚紅 */
  --d-h3:#ea8a3c;  --n-h3:#7a4632;   /* 橘 */
  --d-h4:#8fb9cf;  --n-h4:#38506a;   /* 淡藍 */
  --d-h5:#f1e3bf;  --n-h5:#6c6470;   /* 奶油 */
  --d-h6:#ab3f35;  --n-h6:#552428;   /* 鏽紅 */
  --d-h7:#dfa545;  --n-h7:#6e5232;   /* 芥末黃 */
  --d-h8:#e7a08e;  --n-h8:#6a4450;   /* 鮭粉 */
  --d-h9:#3f6287;  --n-h9:#1f2c4a;   /* 深藍 */
  --d-trim:#fbf6ea;     --n-trim:#a49a9a;     /* 白色窗框與簷口 */
  --d-roof:#5e3f39;     --n-roof:#24182a;     /* 深色瓦頂 */
  --d-win:#3d4660;      --n-win:#ffc768;      /* 窗洞後面的燈箱：夜晚亮暖光 */
  --d-win-off:#3d4660;  --n-win-off:#252438;  /* 關燈的窗 */
  --d-awning-1:#b8343a; --n-awning-1:#5a2028; /* 餐廳遮雨棚 */
  --d-awning-2:#2f5a4a; --n-awning-2:#1a2e2c;
  --d-awning-3:#f3ead4; --n-awning-3:#7a7078;

  /* —— 碼頭與運河 —— */
  --d-quay-far:#c8b89c; --n-quay-far:#3e3a4a;   /* 北岸石板路 */
  --d-quay-edge:#8e8478; --n-quay-edge:#2a2836; /* 花崗岩岸邊 */
  --d-cobble:#bfae92;   --n-cobble:#3a3646;
  --d-cobble-2:#a99a80; --n-cobble-2:#2e2b3a;
  --d-water-1:#6f9cb4;  --k-water-1:#a57a90; --n-water-1:#1a2648;
  --d-water-2:#5b879f;  --k-water-2:#8a6680; --n-water-2:#142040;
  --d-water-3:#4a748c;  --n-water-3:#0f1934;
  --d-water-4:#3c6178;  --n-water-4:#0b142a;
  --d-water-hi:#d8ecf4; --n-water-hi:#3a4a78;   /* 波紋亮邊 */
  --d-reflect:#fff2c400; --n-reflect:#ffc768;   /* 水面上的燈光倒影 */

  /* —— 停泊的老木船 —— */
  --d-hull-1:#25303a;   --n-hull-1:#10141c;
  --d-hull-2:#7a3226;   --n-hull-2:#3a1a18;
  --d-hull-3:#2f5a46;   --n-hull-3:#14261e;
  --d-rail:#e9dcc0;     --n-rail:#6c6468;
  --d-mast:#8a6440;     --n-mast:#3a2a22;
  --d-sail:#efe4cc;     --n-sail:#5c5660;     /* 收起來的帆 */
  --d-rope:#5a4a3c;     --n-rope:#3a3240;

  /* —— 聖誕市集木屋 —— */
  --d-hut:#a8744a;      --n-hut:#4a3028;
  --d-hut-dk:#7e5232;   --n-hut-dk:#2e1c18;
  --d-hut-in:#5a3c2a;   --n-hut-in:#ffb45a;    /* 攤位裡面：夜晚亮燈 */
  --d-garland:#3f6e45;  --n-garland:#1e3a2a;   /* 松枝花環 */
  --d-garland-hi:#5a8f58; --n-garland-hi:#2c4e34;
  --d-sign:#f3ead4;     --n-sign:#d8c8a4;

  /* —— 其他會隨日夜變化的 —— */
  --d-glow:#fff2c400;   --n-glow:#ffd27acc;    /* 路燈光暈 */
  --d-shadow:#2a1a10;   --n-shadow:#05060e;    /* 紙板投影的顏色 */
  --d-lamp-post:#2e3438; --n-lamp-post:#121420;
  --d-snow:#ffffff;     --n-snow:#c8cce4;

  /* —— 不隨日夜變化的顏色 —— */
  --sun:#ffcf5a; --sun-hi:#fff2c0; --moon:#f6f0d8; --star:#fff6d6;
  --bulb-1:#ffe7a0; --bulb-2:#ffd06a; --bulb-3:#ff9a6a;   /* 聖誕燈泡 */
  --lantern:#ffb84a; --lantern-hi:#fff0b0;                /* 獨木舟燈籠 */
  --heart-red:#c8283a; --heart-white:#fbf6ea;             /* 編織紙心 */
  --flag-red:#c8102e; --flag-white:#ffffff;               /* 丹麥國旗（船尾旗） */
  --gloegg:#7a1a2a; --pot:#2a2a30; --cup:#f3ead4;
  --aeble:#d8984a; --aeble-dk:#a8682a; --sugar:#ffffff; --jam:#b8283a;
  --nisse-red:#c8283a;
  --paper-white:#fbf8f1;
  --ink:#2a2230;
  --rain:#b8d0e8;
  --boat:#f3f0e8; --boat-stripe:#2f5a8a; --boat-glass:#9fc4d8;
  --kayak-1:#e8b23a; --kayak-2:#c8283a; --kayak-3:#2f7a9a; --kayak-4:#f3ead4;
  --bike-1:#2a3a4a; --bike-2:#c8283a; --bike-3:#2f6a4a; --cargo:#d8b080;

  /* —— 角色 —— */
  --skin-1:#f6d6b8; --skin-2:#e4b08a; --skin-3:#b07a52; --skin-4:#7a5038;
  --hair-1:#2a2024; --hair-2:#7a4a2a; --hair-3:#e8c26a; --hair-4:#cfc8c0; --hair-5:#b8502e;
  --coat-1:#2a3448; --coat-2:#7a2a32; --coat-3:#c8a272; --coat-4:#3f6a5a; --coat-5:#e8dcc4;
  --coat-6:#4a4a58; --coat-7:#c8583a; --coat-8:#2f5a8a; --coat-9:#8a5a8a;
  --knit-1:#c8283a; --knit-2:#f3ead4; --knit-3:#2f5a8a; --knit-4:#e8b23a; --knit-5:#3f7a5a;
  --pants-1:#22263a; --pants-2:#4a3e36; --pants-3:#3a4a6a;
  --pram:#2a3040; --dog:#b8885a;

  /* —— 頁面介面 —— */
  --page-bg:#151a2c; --page-fg:#f6efe0; --page-muted:#b0aab8;
  --ui-surface:#1f2540; --ui-line:#3a4266; --ui-accent:#ffc768; --ui-hot:#c8283a;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border:1px solid var(--ui-line);border-radius:14px;overflow:hidden;background:var(--page-bg);line-height:0}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:14px;padding:10px 14px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--page-bg);font-weight:700}
.panel button.big{border-color:var(--ui-hot);color:#fff;background:var(--ui-hot);font-weight:700}
.panel button.big.on{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--page-bg)}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
/* 畫面內可點物件：滑鼠點不顯示外框，用鍵盤 Tab 時才顯示 */
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid var(--ui-accent);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .bubble rect{fill:var(--paper-white);stroke:var(--ink);stroke-width:1.5}
#scene .bubble text{fill:var(--ink);font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .shadowCopy, #scene .shadowCopy *{fill:var(--shadow)!important;stroke:var(--shadow)!important;pointer-events:none}
#scene .sign text{font:800 11px var(--font-ui);letter-spacing:.06em;text-anchor:middle;dominant-baseline:central}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       紙板圖層由後往前（每層都有投影，滑鼠移動時有視差）：
       天空 → 太陽月亮雲 → 遠方城市剪影 → 北岸運河屋＋市集木屋＋紀念錨
       → 停泊的老木船 → 運河（遊船、獨木舟）→ 南岸碼頭（行人、單車、攤位）
       → 最前景的松枝花環與編織紙心 → 天氣 → 紙纖維紋理
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="紙雕立體光影風格的哥本哈根新港聖誕節：運河北岸是一整排黃、紅、橘、藍色的十七世紀運河屋，窗裡亮著紙星燈；岸邊是掛滿松枝花環的聖誕市集木屋與紀念錨；運河裡停著桅杆掛滿聖誕燈的老木船，玻璃頂遊船緩緩駛過；近岸有熱紅酒和蘋果球攤、戴毛帽的行人、推嬰兒車的家長和騎單車、載貨單車的人；畫面上方垂掛著紅白編織紙心">
    <defs>
      <!-- 天空漸層 -->
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-top)"/>
        <stop offset=".6" style="stop-color:var(--sky-mid)"/>
        <stop offset="1" style="stop-color:var(--sky-low)"/>
      </linearGradient>
      <!-- 紙板投影：dx、dy 由程式依太陽位置更新（光影會隨時間移動） -->
      <filter id="pshL" x="-4%" y="-6%" width="110%" height="116%" color-interpolation-filters="sRGB">
        <feDropShadow class="psd" data-k="1.4" dx="4" dy="5" stdDeviation="3.2" style="flood-color:var(--shadow)" flood-opacity=".42"/>
      </filter>
      <filter id="pshM" x="-6%" y="-8%" width="114%" height="120%" color-interpolation-filters="sRGB">
        <feDropShadow class="psd" data-k="1" dx="3" dy="4" stdDeviation="2.4" style="flood-color:var(--shadow)" flood-opacity=".4"/>
      </filter>
      <filter id="pshS" x="-10%" y="-10%" width="125%" height="130%" color-interpolation-filters="sRGB">
        <feDropShadow class="psd" data-k=".6" dx="2" dy="2.5" stdDeviation="1.4" style="flood-color:var(--shadow)" flood-opacity=".38"/>
      </filter>
      <!-- 燈光柔光 -->
      <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
      <radialGradient id="glowGrad"><stop offset="0" style="stop-color:var(--bulb-2)" stop-opacity=".9"/><stop offset="1" style="stop-color:var(--bulb-2)" stop-opacity="0"/></radialGradient>
      <radialGradient id="lanternGlow"><stop offset="0" style="stop-color:var(--lantern-hi)" stop-opacity=".95"/><stop offset=".4" style="stop-color:var(--lantern)" stop-opacity=".5"/><stop offset="1" style="stop-color:var(--lantern)" stop-opacity="0"/></radialGradient>
      <radialGradient id="sunGlow"><stop offset="0" style="stop-color:var(--sun-hi)" stop-opacity=".7"/><stop offset="1" style="stop-color:var(--sun)" stop-opacity="0"/></radialGradient>
      <!-- 南岸石板路 -->
      <pattern id="cobbles" width="30" height="14" patternUnits="userSpaceOnUse">
        <rect width="30" height="14" class="f-cobble"/>
        <rect x="1" y="1" width="13" height="5.5" rx="2" class="f-cobble-2"/>
        <rect x="16" y="1" width="13" height="5.5" rx="2" class="f-cobble-2"/>
        <rect x="-6" y="8" width="13" height="5.5" rx="2" class="f-cobble-2"/>
        <rect x="9" y="8" width="13" height="5.5" rx="2" class="f-cobble-2"/>
        <rect x="24" y="8" width="13" height="5.5" rx="2" class="f-cobble-2"/>
      </pattern>
      <!-- 紙纖維紋理：由程式用 canvas 畫好再填進來 -->
      <pattern id="paperPat" width="300" height="300" patternUnits="userSpaceOnUse">
        <image id="paperImg" width="300" height="300" href=""/>
      </pattern>
      <!-- 丹麥編織紙心（julehjerte）：紅白兩片紙條交織成棋盤格 -->
      <clipPath id="heartSq"><rect x="0" y="0" width="20" height="20"/></clipPath>
      <g id="heartShape">
        <g transform="rotate(45) translate(-10 -10)">
          <path d="M0 0 L0 20 A10 10 0 0 1 0 0Z" transform="translate(0 0)" style="fill:var(--heart-red)"/>
          <path d="M0 0 L20 0 A10 10 0 0 0 0 0Z" style="fill:var(--heart-white)"/>
          <g clip-path="url(#heartSq)">
            <rect x="0" y="0" width="20" height="20" style="fill:var(--heart-white)"/>
            <path d="M0 0h5v5h-5zM10 0h5v5h-5zM5 5h5v5h-5zM15 5h5v5h-5zM0 10h5v5h-5zM10 10h5v5h-5zM5 15h5v5h-5zM15 15h5v5h-5z" style="fill:var(--heart-red)"/>
          </g>
          <path d="M0 0 L20 0 L20 20 L0 20 Z" fill="none" stroke="#7a1420" stroke-width=".6" opacity=".5"/>
        </g>
      </g>
    </defs>

    <!-- 天空 -->
    <g id="skyLayer">
      <rect x="0" y="0" width="1600" height="440" fill="url(#skyGrad)"/>
      <rect id="skyGrey" x="0" y="0" width="1600" height="440" class="f-overcast" opacity="0"/>
      <g id="stars"></g>
      <g id="sunMoon">
        <g id="sun" class="clickable" tabindex="0" role="button" aria-label="紙剪的冬日太陽：點一下切換成夜晚"></g>
        <g id="moon" class="clickable" tabindex="0" role="button" aria-label="紙剪的月亮：點一下切換成白天"></g>
      </g>
      <g id="clouds"></g>
      <g id="birds" class="noHit"></g>
    </g>
    <rect id="skyHit" x="0" y="0" width="1600" height="170" fill="transparent" class="clickable"/>

    <!-- 視差圖層 P1：遠方城市剪影 -->
    <g id="P1"><g id="farCity" data-shadow="1"></g><g id="fogFar" class="noHit"></g></g>

    <!-- 視差圖層 P2：北岸運河屋、市集木屋、紀念錨、遠岸行人 -->
    <g id="P2">
      <g id="winGlowBack" class="noHit"></g>
      <g id="houses" data-shadow="1"></g>
      <g id="houseCaps" class="noHit" opacity="0"></g>
      <g id="winHalo" class="noHit"></g>
      <g id="farQuay" data-shadow="1"></g>
      <g id="farLanes"></g>
      <g id="farStalls" data-shadow="1"></g>
    </g>

    <!-- 視差圖層 P3：運河、停泊木船、遊船與獨木舟 -->
    <g id="P3">
      <g id="water"></g>
      <g id="reflects" class="noHit"></g>
      <g id="ships" data-shadow="1"></g>
      <g id="shipLights" class="noHit"></g>
      <g id="kayakLane"></g>
      <g id="boatLane"></g>
      <g id="ripples" class="noHit"></g>
      <rect id="waterHit" x="-30" y="456" width="1660" height="62" fill="transparent"/>
    </g>

    <!-- 視差圖層 P4：南岸碼頭、路燈、行人、單車、攤位 -->
    <g id="P4">
      <g id="nearQuay" data-shadow="1"></g>
      <g id="quayLights" class="noHit"></g>
      <g id="nearLanes"></g>
      <g id="nearStalls" data-shadow="1"></g>
      <g id="lampGlows" class="noHit"></g>
      <g id="steam" class="noHit"></g>
    </g>

    <!-- 視差圖層 P5：最前景的松枝花環與編織紙心 -->
    <g id="P5"><g id="frame" data-shadow="1"></g><g id="frameBulbs" class="noHit"></g><g id="frameHearts"></g></g>

    <!-- 特效與天氣 -->
    <g id="fx" class="noHit"></g>
    <g id="weather" class="noHit">
      <g id="fogNear"></g>
      <g id="rainG"></g>
      <g id="snowG"></g>
    </g>
    <rect id="nightVeil" class="noHit" x="0" y="0" width="1600" height="600" fill="#070a20" opacity="0"/>
    <rect id="wxVeil" class="noHit" x="0" y="0" width="1600" height="600" fill="#7a808c" opacity="0"/>
    <rect class="noHit" x="0" y="0" width="1600" height="600" fill="url(#paperPat)" opacity=".55" style="mix-blend-mode:multiply"/>
    <g id="bubbles" class="noHit"></g>
  </svg>
  </figure>

  <!-- =====================================================
       【互動】控制列
       ===================================================== -->
  <div class="panel">
    <button id="btnShow" class="big" type="button">🛶 聖露西亞燈籠獨木舟</button>
    <button id="btnLights" type="button" aria-pressed="true">✨ 桅杆聖誕燈</button>
    <button id="btnBoat" type="button">🚤 運河遊船</button>
    <button id="btnGloegg" type="button">🍷 熱紅酒</button>
    <button id="btnAeble" type="button">🟤 蘋果球</button>
    <button id="btnHearts" type="button">❤ 編織紙心</button>
    <button id="btnWeather" type="button">天氣：雪</button>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);
      }
      return _conn.call(this, dest, ...a);
    };
  }
  function stopAudio() {
    let longs = [], ctx = null;
    for (const s of srcs) {
      const c = s.context, now = c.currentTime, m = s.__ss; ctx = c;
      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }
    if (longs.length && ctx) {
      const g = outs.get(ctx), now = ctx.currentTime;
      if (g) {
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 1.1); g.gain.setValueAtTime(0, now + 1.2);
        g.gain.linearRampToValueAtTime(1, now + 1.9);
      }
      longs.forEach(s => { try { s.stop(now + 1.15); } catch (e) {} srcs.delete(s); });
    }
    srcs.clear();
  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');
    // 凍結色票：把目前的 CSS 變數抄到殘影上，底下換色不影響殘影
    const cs = getComputedStyle(svg);
    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }
      }
    }
    const par = svg.parentElement;
    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });
    added = [];
  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>
/* =========================================================
   SC-29 哥本哈根的聖誕燈籠夜｜程式區
   區塊：①工具與色票 ②場景（天空、遠方城市、運河屋、市集、木船、碼頭、前景花環）
         ③角色（行人、單車、遊船、獨木舟、海鷗）
         ④動畫（日夜、光影、天氣、桅杆燈、燈籠獨木舟秀）⑤互動（點擊、滑鼠、聲音、控制列）
   ========================================================= */
(() => {
'use strict';

/* ---------------- ① 工具與色票 ---------------- */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const root = document.documentElement;
const svg = $('scene');
const B = 404;          // 北岸運河屋的地基線
const WL = 452;         // 停泊木船的吃水線
const BOAT_Y = 502;     // 遊船航道（往右，在前）
const KAYAK_Y = 476;    // 獨木舟航道（往右，在後；遊行時不會被岸上的人擋住）
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
let seed = 20261129;    // 固定亂數：每次開啟構圖一樣
const srand = (a = 0, b = 1) => { seed = (seed * 16807) % 2147483647; return a + (seed / 2147483647) * (b - a); };
const spick = a => a[Math.floor(srand(0, a.length - .001))];
const f1 = n => (+n).toFixed(1);
const F = v => `style="fill:var(--${v})"`;
function el(tag, attrs = {}, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
// 只在數值改變時才寫入屬性，減少重繪
function sa(n, k, v) { v = String(v); const c = n.__a || (n.__a = {}); if (c[k] !== v) { c[k] = v; n.setAttribute(k, v); } }
function frag(parent, html, attrs = {}) { const g = el('g', attrs, parent); g.innerHTML = html; return g; }

// 讀取色票、內插混色
const css = n => getComputedStyle(root).getPropertyValue(n).trim();
const hex = h => {
  h = h.replace('#', '');
  if (h.length === 3) h = [...h].map(c => c + c).join('');
  const n = parseInt(h.slice(0, 6), 16);
  return [n >> 16 & 255, n >> 8 & 255, n & 255, h.length === 8 ? parseInt(h.slice(6), 16) / 255 : 1];
};
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgba = c => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${(c[3] ?? 1).toFixed(3)})`;
// 成對色票：自動找出所有 --d-xxx，配對 --n-xxx（與選用的 --k-xxx）
const PAIRS = {};
(() => {
  const names = [];
  for (const sheet of document.styleSheets) {
    try { for (const r of sheet.cssRules) if (r.selectorText === ':root') for (const p of r.style) if (p.startsWith('--d-')) names.push(p.slice(4)); } catch (e) {}
  }
  let cls = '';
  names.forEach(k => {
    const k2 = css('--k-' + k);
    PAIRS[k] = { d: hex(css('--d-' + k)), n: hex(css('--n-' + k)), k: k2 ? hex(k2) : null };
    cls += `#scene .f-${k}{fill:var(--${k})}#scene .s-${k}{stroke:var(--${k});fill:none}`;
  });
  const st = document.createElement('style'); st.textContent = cls; document.head.appendChild(st);
})();

/* 動態偏好 */
const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
let reduced = mq.matches;

/* 紙纖維紋理：canvas 畫出細顆粒與長短纖維，做成重複貼圖 */
function makePaper() {
  const c = document.createElement('canvas'); c.width = c.height = 300;
  const x = c.getContext('2d');
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, 300, 300);
  const img = x.getImageData(0, 0, 300, 300), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const v = 255 - Math.random() * 26; d[i] = v; d[i + 1] = v - 2; d[i + 2] = v - 6; }
  x.putImageData(img, 0, 0);
  x.lineCap = 'round';
  for (let i = 0; i < 260; i++) {
    const px = Math.random() * 300, py = Math.random() * 300, a = Math.random() * Math.PI, l = 4 + Math.random() * 16;
    x.strokeStyle = `rgba(120,100,80,${(.05 + Math.random() * .1).toFixed(2)})`; x.lineWidth = .6 + Math.random() * .6;
    x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo(px + Math.cos(a) * l * .5 + 2, py + Math.sin(a) * l * .5 - 2, px + Math.cos(a) * l, py + Math.sin(a) * l); x.stroke();
  }

}

/* ---------------- ② 場景：天空 ---------------- */
const stars = [], clouds = [];
function drawSky() {
  for (let i = 0; i < 70; i++) {
    const x = srand(0, 1600), y = srand(10, 330), r = srand(1.6, 3.4);
    const p = el('path', { d: starPath(x, y, r, r * .4, 4), style: 'fill:var(--star)' }, $('stars'));

function starPath(cx, cy, R, r, n) {

    // 船尾的丹麥國旗

    const flagHTML = `<g class="flag" transform="translate(${-h - 8} -56)"><path class="flagP" d="M0 0 L-22 0 L-22 14 L0 14Z" ${F('flag-red')}/><path d="M-7 0 V14 M0 7 H-22" stroke="var(--flag-white)" stroke-width="2.6"/></g>`;
    // 繩索（桅頂到船首、船尾、兩桅之間）
    const ropes = [];
    mastX.forEach((mx, i) => { ropes.push([mx, mastTop[i], bow[0], bow[1]]); ropes.push([mx, mastTop[i], -h + 4, -30]); });
    if (mastX.length === 2) ropes.push([mastX[0], mastTop[0], mastX[1], mastTop[1]]);
    ropes.forEach(r => html += `<path d="M${f1(r[0])} ${f1(r[1])} L${f1(r[2])} ${f1(r[3])}" class="s-rope" stroke-width="1.1"/>`);
    g.innerHTML = html;
    // 燈串（放在不加濾鏡的圖層，夜裡才看得清楚）
    const lg = el('g', { transform: `translate(${s.x} ${WL}) scale(${s.dir} 1)`, opacity: 1 }, $('shipLights'));
    frag(lg, flagHTML);
    const bulbs = [];
    ropes.forEach(r => {
      const len = Math.hypot(r[2] - r[0], r[3] - r[1]), n = Math.floor(len / 11);
      for (let k = 1; k < n; k++) {
        const t = k / n, bx = r[0] + (r[2] - r[0]) * t, by = r[1] + (r[3] - r[1]) * t + Math.sin(t * Math.PI) * 4;
        bulbs.push({ el: el('circle', { cx: f1(bx), cy: f1(by), r: 2.3, style: `fill:var(--${['bulb-1', 'bulb-2', 'bulb-1', 'bulb-3'][k % 4]})` }, lg), t: 1 - (by - mastTop[0]) / -mastTop[0], ph: Math.random() * 6 });
      }
    });
    const glowG = el('g', { opacity: 0 }, lg);
    mastX.forEach((mx, i) => el('circle', { cx: f1(mx), cy: f1(mastTop[i] * .55), r: 70, fill: 'url(#glowGrad)', opacity: .35 }, glowG));
    const S = { g, lg, glowG, bulbs, level: 1, flash: 0, x: s.x, flag: lg.querySelector('.flagP'), mastTop };
    ships.push(S);
    onAct(g, () => { sfx('shipbell'); S.flash = 2.4; say(s.x, WL + mastTop[0] - 20, pick(['叮——噹！船鐘響了', '這艘老船已經一百多歲了', '冬天的老船靜靜停在港裡']), 1.8); });
  });
}

const waves = [];

  rows.forEach(([y, c, sp, amp], i) => {

    for (let x = -120; x <= 1760; x += 40) d += `Q${x + 10} ${y - amp} ${x + 20} ${y} T${x + 40} ${y}`;

}

const hearts = [];
function drawFrame() {
  const fr = $('frame');
  const garland = (x0, y0, x1, y1, sag) => {
    const pts = []; const n = 22;
    for (let i = 0; i <= n; i++) { const t = i / n; pts.push([x0 + (x1 - x0) * t, y0 + (y1 - y0) * t + Math.sin(t * Math.PI) * sag]); }
    let h = '';
    pts.forEach(([x, y], i) => { h += `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="13" ry="8" transform="rotate(${f1(srand(-25, 25))} ${f1(x)} ${f1(y)})" class="${i % 2 ? 'f-garland-hi' : 'f-garland'}"/>`; });
    frag(fr, h);
    let hb = '';
    pts.forEach(([x, y], i) => { if (i % 2) hb += `<circle class="frameBulb" cx="${f1(x)}" cy="${f1(y + 5)}" r="2.6" ${F(['bulb-1', 'bulb-3', 'bulb-2'][i % 3])}/>`; });
    frag($('frameBulbs'), hb);
    return pts;
  };
  const L = garland(-20, -6, 400, -6, 40), R = garland(1200, -6, 1620, -6, 40);
  [[L, [5, 10, 15]], [R, [6, 11, 16]]].forEach(([pts, idx]) => idx.forEach((k, j) => {

    el('path', { d: `M0 0 L0 ${len}`, stroke: 'var(--heart-red)', 'stroke-width': 1.2 }, g);
    const inner = el('g', {}, g);
    el('use', { href: '#heartShape', transform: `translate(0 ${len + 14}) scale(1.25)` }, inner);
    const H = { g, inner, x, y, len, ph: srand(0, 6), spin: 0 };
    hearts.push(H);
    onAct(g, () => { H.spin = 1; sfx('paper'); });
  }));
}

// 每條道依序更新：找前方最近的人，距離不夠就減速跟隨
function stepLanes(dt) {
  const watching = show.on && show.phase === 'parade';
  LANES.forEach(L => {
    const A = L.actors;
    A.forEach(a => {
      let gap = 1e9, ahead = null;
      A.forEach(b => { if (b === a) return; const d = (b.x - a.x) * L.dir; if (d > 0 && d < gap) { gap = d; ahead = b; } });
      const safe = (a.len + (ahead ? ahead.len : 0)) * .5 * L.s + 14 * L.s;
      let want = a.base * L.s;
      if (a.kind === 'walk' && (watching && L.s >= 1 || a.pause > 0)) want = 0;
      if (a.pause > 0) a.pause -= dt;
      if (ahead && gap < safe + 40 * L.s) want = Math.min(want, ahead.v * clamp((gap - safe) / (40 * L.s), 0, 1));
      a.v += (want - a.v) * Math.min(1, dt * 3);
      a.x += a.v * L.dir * dt;
      // 走出畫面就從另一端回來（排在隊伍最後面，不會重疊）
      if (L.dir > 0 && a.x > 1700) { const minX = Math.min(...A.map(b => b.x)); a.x = Math.min(-80, minX - safe - 30); }
      if (L.dir < 0 && a.x < -100) { const maxX = Math.max(...A.map(b => b.x)); a.x = Math.max(1680, maxX + safe + 30); }
      // 偶爾停在攤位前看看
      if (a.kind === 'walk' && L.s === 1 && a.pause <= 0 && Math.random() < dt * .02) a.pause = rand(1.5, 4);
      // 動作
      a.ph += a.v * dt * .14 / L.s;
      if (a.kind === 'walk') {
        const sw = Math.sin(a.ph) * 24 * clamp(a.v / (20 * L.s), 0, 1);
        a.legs.forEach((lg, i) => lg.setAttribute('transform', `rotate(${f1(i % 2 ? -sw : sw)} ${i % 2 ? 2.5 : -2.5} -22)`));
        const wave = (a.wave > 0 || (watching && L.s >= 1));
        if (a.wave > 0) a.wave -= dt;
        a.arms.forEach((ar, i) => ar.setAttribute('transform', wave && i === 0 ? `rotate(${f1(-150 + Math.sin(performance.now() / 120) * 18)} 1 -45)` : `rotate(${f1(-sw * .6)} 1 -45)`));
        const showUmb = wx.rain > .5 ? 1 : 0;
        a.umb.forEach(u => u.setAttribute('opacity', showUmb));
        const bob = Math.abs(Math.sin(a.ph)) * 1.4 * clamp(a.v / (20 * L.s), 0, 1);
        a.g.setAttribute('transform', `translate(${f1(a.x)} ${f1(L.y - bob * L.s)}) scale(${L.dir * L.s} ${L.s})`);
      } else {
        a.wh.forEach(w => { const c = w.querySelector('circle'); w.setAttribute('transform', `rotate(${f1(a.ph * 40 % 360)} ${c.getAttribute('cx')} -10)`); });
        a.ped[0].setAttribute('transform', `rotate(${f1(Math.sin(a.ph) * 22)} 0 -10)`);
        a.ped[1].setAttribute('transform', `rotate(${f1(-Math.sin(a.ph) * 22)} 0 -10)`);
        a.g.setAttribute('transform', `translate(${f1(a.x)} ${L.y}) scale(${L.dir} 1)`);
      }
    });
  });
}

/* ---------------- ④ 動畫：日夜循環 ----------------
   T.t：一天中的時間（0–1，0 = 午夜）。自動播放時一天約 180 秒。
   依十二月的哥本哈根：約 8:40 日出、15:40 日落，太陽只在南方低空走一小段弧線。 */
const DAY_SEC = 180;
const T = { t: 12 / 24, auto: true };

function clockText() {
  const h = T.t * 24, hh = Math.floor(h) % 24, mm = Math.floor((h - Math.floor(h)) * 60 + 1e-6);

}
function applyTime(force) {
  if (!force && Math.abs(T.t - lastApplied) < .0012) return;

  dusk = Math.max(Math.exp(-Math.pow((h - 8.6) / .9, 2)), Math.exp(-Math.pow((h - 15.8) / .9, 2)));
  for (const k in PAIRS) {
    const P = PAIRS[k];

}

    T.t = (show.fromT + (show.toT - show.fromT) * k) % 1;
    if (k >= 1) {

    ships.forEach((s, i) => { if (s.cascade === 99) s.cascade = 0, s.level = 0, s.climb = -0.8 - i * .9; });
    houses.forEach((H, i) => { if (!H.on && t > 1.5 + i * .9) toggleHouse(H, true); });

  sa($('rainG'), 'opacity', f1(wx.rain)); sa($('snowG'), 'opacity', f1(wx.snow));
  if (wx.rain > .05) drops.forEach(d => { d.y += d.v * dt * (mv || .3); d.x -= 50 * dt; if (d.y > 600) { d.y = rand(-60, 0); d.x = rand(0, 1660); } sa(d.el, 'transform', `translate(${f1(d.x)} ${f1(d.y)})`); });
  if (wx.snow > .05) flakes.forEach(f => { f.y += f.v * dt * (mv || .3); f.x += Math.sin(now + f.ph) * 12 * dt * mv; f.rot += dt * 30; if (f.y > 600) { f.y = rand(-40, 0); f.x = rand(0, 1600); } sa(f.el, 'transform', `translate(${f1(f.x)} ${f1(f.y)}) rotate(${f1(f.rot)})`); });
  // 海鷗、流星
  birds.forEach((b, i) => { b.t += dt; b.x += b.vx * dt; sa(b.el, 'transform', `translate(${f1(b.x)} ${f1(b.y + Math.sin(b.t * 3) * 6)})`); sa(b.el.firstChild, 'd', (frame + i * 7) % 24 < 12 ? 'M-11 0 Q-5 -7 0 0 Q5 -7 11 0' : 'M-11 -3 Q-5 3 0 0 Q5 3 11 -3'); });
  for (let i = birds.length - 1; i >= 0; i--) if (birds[i].x > 1700) { birds[i].el.remove(); birds.splice(i, 1); }
  // 編織紙心：隨風輕擺，被點到就轉一圈
  hearts.forEach(H => {
    if (H.spin > 0) H.spin = Math.max(0, H.spin - dt * .8);
    const sw = mv * Math.sin(now * 1.2 + H.ph) * 4;
    sa(H.g, 'transform', `translate(${f1(H.x)} ${f1(H.y)}) rotate(${f1(sw)})`);
    const sx = H.spin > 0 ? Math.cos((1 - H.spin) * Math.PI * 4) : 1;
    sa(H.inner, 'transform', `translate(0 ${H.len + 14}) scale(${f1(sx)} 1) translate(0 ${-(H.len + 14)})`);
  });
  // 蒸氣
  steams.forEach(s => {
    s.t = (s.t + dt * (s.j === 0 && potLevel > 0 ? 1.8 : 1)) % 2.4;
    const k = s.t / 2.4;
    sa(s.el, 'cx', f1(s.x + Math.sin(k * 6 + s.j) * 8 * mv));
    sa(s.el, 'cy', f1(s.y - k * 50));
    sa(s.el, 'r', f1(4 + k * 9));
    sa(s.el, 'opacity', f1((1 - k) * .45 * (mv ? 1 : .6)));
  });
  if (potLevel > 0) potLevel -= dt;
  // 蘋果球翻面
  if (aebleSpin > 0) {
    aebleSpin -= dt;
    aebleBalls.forEach((b, i) => { const a = clamp((1.6 - aebleSpin) * 4 - i * .4, 0, 1) * 180; b.querySelector('.abTop').setAttribute('transform', `rotate(${f1(a)})`); });
  }
  // 補間
  for (let i = tweens.length - 1; i >= 0; i--) {
    const w = tweens[i]; w.t += dt; const k = Math.min(1, w.t / w.dur);
    w.fn(k, dt); if (k >= 1) { tweens.splice(i, 1); w.done && w.done(); }
  }
  // 飄起來的紙心與紙星
  for (let i = notes.length - 1; i >= 0; i--) {
    const n = notes[i]; n.t += dt; n.x += n.vx * dt; n.y += n.vy * dt;
    sa(n.g, 'transform', `translate(${f1(n.x)} ${f1(n.y)}) rotate(${f1(Math.sin(n.t * 2) * 20 * n.rot)})`);
    sa(n.g, 'opacity', f1(clamp(4 - n.t, 0, 1)));
    if (n.t > 4) { n.g.remove(); notes.splice(i, 1); }
  }
  stepLanes(dt * (mv || 1) * (mv ? 1 : 0));
  stepBoats(dt * (mv ? 1 : 0));
  stepKayaks(dt * (mv ? 1 : 1));
}

function skyClick(x, y) {
  if (night > .5) {
    sfx('shoot');
    const l = el('path', { d: '', stroke: '#fff6d6', 'stroke-width': 3, 'stroke-linecap': 'round', fill: 'none' }, $('fx'));
    tween(.9, k => { const hx = x + k * 260, hy = y + k * 90; l.setAttribute('d', `M${f1(hx - 70)} ${f1(hy - 24)}L${f1(hx)} ${f1(hy)}`); l.setAttribute('opacity', f1(1 - k)); }, () => l.remove());
  } else { sfx('gull'); gullFlock(y); }
}

/* ---------------- ⑤ 互動：綁定 ---------------- */
function bindAll() {
  onAct($('sun'), () => { sfx('swish'); setTime(17.5); });
  onAct($('moon'), () => { sfx('swish'); setTime(12); });
  $('clouds').querySelectorAll('[data-cloud]').forEach(g => onAct(g, () => { clouds[+g.dataset.cloud].boost = 160; sfx('swish'); }));
  $('skyHit').addEventListener('click', e => { userGesture = true; ensureAudio(); const p = svgPoint(e); skyClick(p.x, p.y); });
  $('waterHit').addEventListener('click', e => { userGesture = true; ensureAudio(); const p = svgPoint(e); ripple(p.x, p.y, true); ripple(p.x, p.y, false); sfx('splash'); });
  svg.addEventListener('pointermove', e => {
    const p = svgPoint(e); mouse.x = p.x; mouse.y = p.y; mouse.in = true;
    // 滑鼠劃過運河留下漣漪
    if (p.y > 456 && p.y < 516 && performance.now() - lastRipple > 120) { lastRipple = performance.now(); ripple(p.x + mouse.px * 6, p.y, false); }
  });
  svg.addEventListener('pointerleave', () => { mouse.in = false; });

  $('btnShow').addEventListener('click', () => { userGesture = true; ensureAudio(); startShow(); });
  $('btnLights').addEventListener('click', () => { userGesture = true; ensureAudio(); if (!show.on) setLights(!lightsOn); });
  $('btnBoat').addEventListener('click', () => { userGesture = true; ensureAudio(); sendBoat(); });
  $('btnGloegg').addEventListener('click', () => { userGesture = true; ensureAudio(); serveGloegg(); });
  $('btnAeble').addEventListener('click', () => { userGesture = true; ensureAudio(); flipAeble(); });
  $('btnHearts').addEventListener('click', () => { userGesture = true; ensureAudio(); hearts.forEach((H, i) => setTimeout(() => H.spin = 1, i * 120)); sfx('paper'); });
  $('btnWeather').addEventListener('click', () => { userGesture = true; ensureAudio(); setWeather((wxIdx + 1) % WX.length); });
  $('btnSound').addEventListener('click', () => {
    soundOn = !soundOn; userGesture = true; ensureAudio();
    if (master) master.gain.setValueAtTime(soundOn ? .45 : 0, actx.currentTime);
    if (!soundOn) { stopAll(); rainSound(false); } else rainSound(WX[wxIdx][0] === 'rain');
    $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  });
  $('btnDay').addEventListener('click', () => setTime(12));
  $('btnNight').addEventListener('click', () => setTime(18.5));
  $('btnAuto').addEventListener('click', () => { T.auto = !T.auto; $('btnAuto').setAttribute('aria-pressed', String(T.auto)); });
  const tr = $('timeRange');
  tr.addEventListener('input', () => { if (show.on) return; T.dragging = true; T.t = tr.value / 1000; applyTime(true); });
  tr.addEventListener('change', () => { T.dragging = false; });
  window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
  window.addEventListener('pointerdown', () => document.body.classList.remove('kbd'));
  mq.addEventListener && mq.addEventListener('change', () => { reduced = mq.matches; });
}
function setTime(h) {
  if (show.on) return;
  T.t = h / 24; T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false'); applyTime(true);
}

/* ---------------- 初始化 ---------------- */
function init() {
  makePaper();
  drawSky();
  drawFarCity();
  drawHouses();
  drawFarQuay();
  drawShips();
  drawWater();
  drawNearQuay();
  drawNearStalls();
  drawFrame();
  bakeShadows();
  buildSteam();
  buildWeather();
  // 行人與單車：每條道依序排好，間距足夠
  [[0, 5], [1, 8], [2, 8], [3, 9], [4, 9]].forEach(([li, n]) => { for (let i = 0; i < n; i++) addWalker(li, -60 + (i + srand(.1, .5)) * 1720 / n); });
  addBoat(420);
  bindAll();
  setWeather(0);
  applyTime(true);
  step(1 / 60);
  requestAnimationFrame(loop);
}
init();
// 圖鑑網站「作者精選」播放區（純插畫版嵌在網頁裡）：燈籠獨木舟遊行預設開著，結束後自動再來一輪
const inPicks = (() => { let top = true; try { top = window.top === window; } catch (e) { top = false; } return !!document.getElementById('pure-art') && !top; })();
if (inPicks) { show.loop = true; setTimeout(startShow, 1200); }
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on,
  btn: 'btnShow',
  save: () => ({ t: T.t, auto: T.auto, lights: lightsOn }),
  stop: () => {
    kayaks.forEach(k => k.g.remove()); kayaks.length = 0;   // 燈籠獨木舟收走
    endShow();
  },
  restore: s => { T.t = s.t; T.auto = s.auto; if (lightsOn !== s.lights) setLights(s.lights); applyTime(true); }
});
/* /ShowStop */
})();
</script>
