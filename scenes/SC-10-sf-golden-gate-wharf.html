<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================

   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {

  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";

  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {

      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }

  };

  window.addEventListener("storage", function (e) {

/* ===== 頁面版面 ===== */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-body);line-height:1.6}
.wrap{max-width:1680px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:16px}
.stage{position:relative;border-radius:18px;overflow:hidden;background:#000;
  box-shadow:0 0 0 1px var(--page-line),0 18px 36px -22px #3a2c1a80}
.stage svg{display:block;width:100%;height:auto;max-width:100%;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.controls button{font:500 .95rem/1 var(--font-body);color:var(--page-fg);background:var(--page-panel);
  border:1px solid var(--page-line);border-radius:999px;padding:11px 18px;cursor:pointer;
  transition:transform .12s,background .2s,border-color .2s}
.controls button:hover{background:#fff}
.controls button:active{transform:translateY(1px)}
.controls button:focus-visible{outline:2px solid var(--page-accent);outline-offset:2px}
.controls button[aria-pressed="true"]{border-color:var(--page-accent);color:var(--page-accent)}
.clock{margin-left:auto;font-weight:700;font-size:1rem;color:var(--page-dim);font-variant-numeric:tabular-nums}
.hint{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px 20px;color:var(--page-dim);font-size:.88rem}
.hint b{color:var(--page-fg);font-weight:700;margin-right:.4em}

/* ===== SVG 內樣式 ===== */
.lit{fill:var(--win-on);opacity:0;transition:opacity .35s}
.lit.on{opacity:var(--lit,.2)}
.win,.walker,.cablecar,.gull,.lamppost,.sailboat,.sealion,.lcar,
#bridgeHit,#wheelSign,#stall,#lombard,#ferry,#factory,#waiter{cursor:pointer}
.svgtxt{font-family:var(--font-display);font-weight:900}
.bubble text{font-family:var(--font-display);font-weight:700;font-size:20px;fill:var(--ink)}
/* 攤位蒸氣 */
.steam{fill:none;stroke:var(--fog);stroke-width:4;stroke-linecap:round;opacity:0;animation:steam 3.4s ease-in infinite}
.steam.d2{animation-delay:1.1s}.steam.d3{animation-delay:2.2s}
@keyframes steam{0%{opacity:0;transform:translateY(0)}30%{opacity:.7}100%{opacity:0;transform:translateY(-34px)}}
/* 軌道溝槽裡的地下纜繩（一直在跑） */
.cable{stroke:var(--rail);stroke-width:1.6;stroke-dasharray:3 9;fill:none;animation:cable .9s linear infinite;opacity:.55}
.cable.rev{animation-direction:reverse}
@keyframes cable{to{stroke-dashoffset:-12}}

/* ===== 減少動態 ===== */
@media (prefers-reduced-motion: reduce){
  .steam{animation:none;opacity:.45}
  .cable{animation:none}
  .lit{transition:none}
  .controls button{transition:none}
}
</style>

<main class="wrap">
  <div class="stage">
  <!-- =====================================================
       【場景】SVG 主舞台 viewBox 1600×600
       構圖：左側低處是海灣與漁人碼頭，陡坡街道一路往右上爬到山脊，
       右下方是從山脊彎彎曲曲往下的九曲花街。
       圖層由後到前：天空 → 日月 → 雲 → 天際線與電報山 → 對岸山 → 後層霧
       → 海灣 → 大橋 → 小島 → 前層霧 → 帆船、渡輪 → 碼頭（海獅、招牌、蟹攤）
       → 坡下紅磚工廠 → 山脊排屋 → 遠側行人 → 陡坡街道與叮噹車 → 近側人行道與行人
       → 坡下彩色排屋 → 九曲花街 → 街燈 → 花瓣、海鷗、泡泡
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img" aria-label="舊金山陡坡街道的扁平插畫：叮噹車爬上山脊，左下是種滿繡球花的九曲花街，右側遠方是金門大橋與海灣碼頭，可切換白天與夜晚">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">

      <linearGradient id="duskGrad" x1="0" y1="0" x2="0" y2="1">

      </linearGradient>
      <linearGradient id="bayGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--bay-top)"/>
        <stop offset="1" style="stop-color:var(--bay-bot)"/>
      </linearGradient>
      <radialGradient id="lampGlow">
        <stop offset="0" style="stop-color:var(--lamp);stop-opacity:.8"/>
        <stop offset="1" style="stop-color:var(--lamp);stop-opacity:0"/>
      </radialGradient>
      <radialGradient id="deckGlow">
        <stop offset="0" style="stop-color:var(--deck-light);stop-opacity:.7"/>
        <stop offset="1" style="stop-color:var(--deck-light);stop-opacity:0"/>
      </radialGradient>
      <radialGradient id="redGlow">
        <stop offset="0" style="stop-color:var(--aviation);stop-opacity:.85"/>
        <stop offset="1" style="stop-color:var(--aviation);stop-opacity:0"/>
      </radialGradient>
      <radialGradient id="beaconGlow">
        <stop offset="0" style="stop-color:var(--beacon);stop-opacity:.9"/>
        <stop offset="1" style="stop-color:var(--beacon);stop-opacity:0"/>
      </radialGradient>
      <radialGradient id="headGlow">
        <stop offset="0" style="stop-color:var(--headlight);stop-opacity:.75"/>
        <stop offset="1" style="stop-color:var(--headlight);stop-opacity:0"/>
      </radialGradient>
      <radialGradient id="bulbGlow">
        <stop offset="0" style="stop-color:var(--bulb);stop-opacity:.8"/>
        <stop offset="1" style="stop-color:var(--bulb);stop-opacity:0"/>
      </radialGradient>
      <radialGradient id="sunGlow">
        <stop offset=".3" style="stop-color:var(--sun);stop-opacity:.55"/>
        <stop offset="1" style="stop-color:var(--sun);stop-opacity:0"/>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {

    return function () {
      if (ep !== epoch) return;          // 已被停止

    };

  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {

    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */

  if (SN) {
    const _start = SN.start, _stop = SN.stop;

      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };

    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */

  function ghost(svg) {

    if (!ghostCss) {

      const st = document.createElement('style');

    const cl = svg.cloneNode(true);

    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);

    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;

      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });

  }

  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;

    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {

    try { if (cfg.cine) cfg.cine(); } catch (e) {}

  const btns = [];

    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);

/* =========================================================
   【動畫】日夜循環
   phase：0 = 清晨六點、0.25 = 正午、0.5 = 傍晚六點、0.75 = 午夜
   ========================================================= */
const RM_QUERY = matchMedia("(prefers-reduced-motion: reduce)");
let reduced = RM_QUERY.matches;
let phase = 0.42;
let auto = !reduced;
let tween = null;
const CYCLE = 90;
const nightOf = p => 1 - smooth(-.22, .22, Math.sin(p * Math.PI * 2));
const duskOf = p => Math.max(0, 1 - Math.abs(Math.sin(p * Math.PI * 2)) / .32);
function clockLabel(p) {
  const h = (6 + p * 24) % 24, hh = Math.floor(h), mm = Math.floor((h - hh) * 60 / 10) * 10;
  const name = h < 5 ? "深夜" : h < 7 ? "清晨" : h < 11 ? "上午" : h < 14 ? "正午" : h < 17 ? "午後" : h < 19 ? "黃昏" : h < 23 ? "夜晚" : "深夜";
  return `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}・${name}`;
}
function placeSunMoon(p) {
  const pp = ((p % 1) + 1) % 1;
  const sd = pp < .5 ? pp / .5 : -1, md = pp >= .5 ? (pp - .5) / .5 : -1;
  const arc = k => [1480 - k * 1240, 250 - Math.sin(k * Math.PI) * 215];
  const sunG = $("sun"), moonG = $("moon");
  let src = null;
  if (sd >= 0) { const [x, y] = arc(sd); sunG.setAttribute("transform", `translate(${f1(x)},${f1(y)})`); sunG.style.display = ""; src = { x, y, c: "var(--sun)" }; }
  else sunG.style.display = "none";
  if (md >= 0) { const [x, y] = arc(md); moonG.setAttribute("transform", `translate(${f1(x)},${f1(y)})`); moonG.style.display = ""; src = { x, y, c: "var(--moon)" }; }
  else moonG.style.display = "none";
  return src;
}
let fogForce = false, fogLevel = .25, fogPulse = 0;
function fogTargetOf(p) {
  const pp = ((p % 1) + 1) % 1;
  const morning = Math.max(0, 1 - Math.abs(pp - .04) / .12);
  const evening = Math.max(0, 1 - Math.abs(pp - .58) / .1);
  return Math.max(.08, morning * .75, evening * .55);
}

/* =========================================================
   【互動】花街慶典（表演時刻）
   約 16 秒：花圃輪流盛開、花瓣雨、敞篷花車列隊彎下來、
   觀光客歡呼、叮噹車搖鈴、夜裡串燈變彩虹。每天傍晚 17:30 自動上演一次。
   ========================================================= */
const show = { on: false, t: 0, spawnT: 0, spawned: 0 };
const SHOW_LEN = 16, AUTO_SHOW_PHASE = .48;
function startShow() {

  $("btnShow").setAttribute("aria-pressed", "true");

/* =========================================================
   主迴圈
   ========================================================= */
let wind = .3, windTarget = .3, pointerIn = false;
let last = performance.now(), t = 0, mixTimer = 0;
let beaconFlash = 0, avFlash = 0, lcarTimer = 2;

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
  const M = reduced ? 0 : 1;

  // --- 日夜 ---

    if (k >= 1) { tween = null; phase %= 1; }
  } else if (auto && !reduced) phase = (phase + dt / CYCLE * (show.on ? .3 : 1)) % 1;
  if (auto && !tween && prevPhase < AUTO_SHOW_PHASE && phase >= AUTO_SHOW_PHASE) startShow();
  const night = nightOf(phase), dusk = duskOf(phase);
  mixTimer -= dt;
  const src = placeSunMoon(phase);
  if (mixTimer <= 0 || tween) {
    applyNight(night); mixTimer = .12;
    $("clock").textContent = clockLabel(phase);
    $("duskSky").setAttribute("opacity", Math.min(1, dusk * 1.1).toFixed(2));
    $("duskSea").setAttribute("opacity", (dusk * .3).toFixed(2));
    // 鐘樓指針
    const hrs = (6 + phase * 24) % 12;
    factory.hh.setAttribute("transform", `rotate(${f1(hrs * 30)} 723 292)`);
    factory.mh.setAttribute("transform", `rotate(${f1((hrs % 1) * 360)} 723 292)`);
    factory.clockGlow.setAttribute("opacity", (night * .8).toFixed(2));
  }

  // --- 風 ---
  if (!pointerIn) windTarget = .3 + Math.sin(t * .25) * .4;
  wind += (windTarget - wind) * Math.min(1, dt * 2.5);

  for (const s of stars) s.e.setAttribute("opacity", (night * (.55 + .45 * Math.sin(t * s.sp * M + s.ph))).toFixed(2));
  for (const b of shineBars) {
    if (!src || src.y > 242 || src.x > 900) { b.e.setAttribute("opacity", 0); continue; }
    const w = b.w * (.7 + .3 * Math.sin(t * 2 + b.ph));
    b.e.setAttribute("x", f1(src.x - w / 2 + Math.sin(t + b.ph) * 5));
    b.e.setAttribute("width", f1(w));
    b.e.setAttribute("fill", src.c);
    b.e.setAttribute("opacity", ((.25 + .5 * Math.sin(t * 3 + b.ph) ** 2) * clamp((238 - src.y) / 70, 0, 1) * (1 - fogLevel * .6)).toFixed(2));

  $("beaconGlowC").setAttribute("opacity", bk.toFixed(2));

  fogPulse = Math.max(0, fogPulse - dt * .4);
  $("fogBack").setAttribute("opacity", (fogLevel * .9).toFixed(2));

  waiter.op += (waiter.target - waiter.op) * Math.min(1, dt * 3);
  waiter.g.setAttribute("opacity", waiter.op.toFixed(2));

  // 漣漪、煙、花瓣
  for (const r of ripplePool) {
    if (r.life <= 0) { if (r.e.getAttribute("opacity") !== "0") r.e.setAttribute("opacity", 0); continue; }
    r.life -= dt * .9;
    const k = 1 - r.life, rx = (5 + k * 30) * r.big;
    r.e.setAttribute("cx", f1(r.x)); r.e.setAttribute("cy", f1(r.y));
    r.e.setAttribute("rx", f1(rx)); r.e.setAttribute("ry", f1(rx * .28));
    r.e.setAttribute("opacity", Math.max(0, r.life * .85).toFixed(2));
  }
  for (const p of puffs) {
    if (p.life <= 0) continue;
    p.life -= dt * .55;
    p.x += (p.vx + wind * 10) * dt; p.y -= p.rise * dt;
    p.e.setAttribute("cx", f1(p.x)); p.e.setAttribute("cy", f1(p.y));
    p.e.setAttribute("r", f1((3 + (1 - p.life) * 10) * p.size));
    p.e.setAttribute("opacity", Math.max(0, p.life * .6).toFixed(2));
  }
  for (const p of petals) {
    if (p.life <= 0) continue;
    p.life -= dt * .3;
    p.vy = Math.min(60, p.vy + 30 * dt); p.vx += (wind * 20 - p.vx) * dt * .5;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    p.e.setAttribute("transform", `translate(${f1(p.x)},${f1(p.y)}) rotate(${f1(p.rot)}) scale(1,${f1(Math.cos(p.rot / 30))})`);
    p.e.setAttribute("opacity", Math.min(1, p.life * 2).toFixed(2));
    if (p.y > 610) p.life = 0;
    if (p.life <= 0) p.e.setAttribute("opacity", 0);
  }
  requestAnimationFrame(frame);
}

function updateSeaLion(S, dt) {
  S.bark = Math.max(0, S.bark - dt);
  const headA = Math.sin(t * .8 + S.ph) * 6 - S.bark * 30 * Math.abs(Math.sin(S.bark * 10));
  let x = S.x0, y = S.y0, rot = 0, op = 1;
  if (S.state === "jump") {
    S.t += dt;
    const k = Math.min(1, S.t / 1.1);
    x = S.x0 + S.flip * 26 * k; y = S.y0 - Math.sin(k * Math.PI) * 30 + k * 12;
    rot = S.flip * (-30 + 110 * k);
    if (k >= 1) { S.state = "swim"; S.t = 0; ripple(x, 466, 1.6); }
  } else if (S.state === "swim") {
    S.t += dt; op = 0;
    if (S.t > 4.5) { S.state = "climb"; S.t = 0; }
  } else if (S.state === "climb") {
    S.t += dt; op = Math.min(1, S.t / .6); y = S.y0 + (1 - op) * 8;
    if (S.t > .6) S.state = "lie";
  }
  S.head.setAttribute("transform", `translate(14,-9) rotate(${f1(headA)})`);
  S.g.setAttribute("transform", `translate(${f1(x)},${f1(y)}) rotate(${f1(rot)})`);
  S.g.setAttribute("opacity", op.toFixed(2));
}
// 叮噹車：爬坡變慢、下坡收煞；在站牌停靠 → 發車；開出畫面後從另一端回來
function updateCar(C, dt) {
  C.ring = Math.max(0, C.ring - dt);
  C.bounce = Math.max(0, C.bounce - dt);
  const climb = -slopeAt(C.x) * C.dir;          // >0 代表正在爬坡
  let target = C.max * (climb > .05 ? .6 : climb < -.05 ? .75 : 1);
  if (C.state === "stop") {
    target = 0; C.timer -= dt;
    if (C.dir > 0 && C.timer < 2.4) waiter.target = 0;
    if (C.timer <= 0) { C.state = "run"; ringBell(C, false); }
  } else if (!C.served) {
    const dist = (C.stopX - C.x) * C.dir;
    if (dist >= 0 && dist < 110) {
      target = Math.min(target, C.max * Math.max(.06, dist / 110));
      if (dist < 2) { C.state = "stop"; C.timer = 4; C.served = true; C.sp = 0; }
    }
  }
  C.sp += (target - C.sp) * Math.min(1, dt * 1.6);
  C.x += C.dir * C.sp * dt;
  if (C.dir > 0 && C.x > 1820) { C.x = -220; C.served = false; waiter.target = 1; }
  if (C.dir < 0 && C.x < -220) { C.x = 1820; C.served = false; }
  drawCar(C);
}
function ringBell(C, talk) {
  C.ring = 1; C.bounce = .4;
  if (talk !== false) bubble(C.x, carY(C, C.x) - 110, "叮噹！叮噹！");
}

}

sailboats.forEach(B => B.g.addEventListener("click", e => { stop(e); if (B.turn > 0) return; B.dir *= -1; B.turn = .8; ripple(B.x, B.y + 6, 1.2); }));
$("ferry").addEventListener("click", e => { stop(e); ferry.rock = 1; bubble(ferry.x, ferry.y - 34, "嗚嗚——開往小島"); });
gulls.forEach(G => G.g.addEventListener("click", e => {

$("stall").addEventListener("click", e => {

});
$("waiter").addEventListener("click", e => { stop(e); bubble(1290, nearBottom(1290) - 64, "叮噹車快來了嗎？"); });
walkers.forEach(W => W.g.addEventListener("click", e => { stop(e); W.pause = 1.8; bubble(W.x, W.y - 66 * W.s, pick(TALK)); }));
spectators.forEach(S => S.g.addEventListener("click", e => { stop(e); S.cheer = 1.2; bubble(S.x, S.y - 58, pick(["哇～好美！", "喀嚓！", "繡球花開了！"])); }));
lamps.forEach(L => L.g.addEventListener("click", e => { stop(e); if (L.on && L.flick <= 0) L.flick = .6; else { L.on = !L.on; L.flick = 0; } }));
svg.addEventListener("click", e => {

$("btnDayNight").addEventListener("click", () => {
