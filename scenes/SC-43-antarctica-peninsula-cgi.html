<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>南極</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-43 南極｜CGI 電影質感
   地點：南極半島西岸的海峽（以洛克羅伊港 Port Lockroy 一帶的景色為藍本）。
   季節：三月（南半球夏末）——座頭鯨最多、巴布亞企鵝的小企鵝正在換毛，
         而且夜晚已經夠暗，看得到南極光與南十字星。
   真實元素：直接從海面拔起、覆滿冰雪的尖峰；冰河流進海裡形成的冰壁（會崩落）；
            平頂的桌狀冰山與被海浪雕出拱門的深藍色老冰山、海面的碎冰；
            探險郵輪（耐冰船艏、橘色救生艇、後甲板吊放橡皮艇的吊臂）；
            載遊客巡遊冰山的灰色橡皮艇（Zodiac 式充氣艇，駕駛站在船尾操作舷外機）、海上獨木舟；
            黑色木屋配紅色窗框的歷史小屋（洛克羅伊港的南極郵局，遊客會在這裡寄明信片）；
            巴布亞企鵝（橘紅色嘴、眼睛上方白色斑紋、橘色腳）用小石頭築巢，
            小企鵝灰色絨毛，企鵝在雪地踩出「企鵝高速公路」、在海裡「海豚式跳水」；
            被企鵝排泄物染成粉褐色的岩石；在浮冰上休息的豹斑海豹、躺在岸邊的威德爾海豹；
            座頭鯨（噴氣、拱背、舉起黑白花紋的尾鰭，還會用「泡泡網」合作捕食磷蝦）；
            虎鯨家族（雄鯨的背鰭又高又直）；褐賊鷗、雪鸌；
            遊客穿紅色防寒外套、和企鵝保持距離，探險隊員插的紅色路線標竿；
            夜空的南十字星（加上指極星）、煤袋星雲、大小麥哲倫雲、南極光。
   風格重點：像 CGI 動畫電影的一格寬銀幕畫面——立體受光（山的受光面會跟著太陽方向換邊）、
            冰的次表面透光（越深越藍）、水面倒影、太陽光束、空氣透視、
            青橙色電影調色、鏡頭光暈、暗角、底片顆粒；滑鼠移動帶動多層視差；
            表演時上下出現寬銀幕黑邊，鏡頭緩緩推近。
   效能：不對整個大圖層做模糊；只有前景的小冰塊單獨套模糊。
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），部分另有 --k-名稱（晨昏）。
   JS 會依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）。
   ========================================================= */
:root{
  color-scheme: dark;

  /* —— 天空、雲 —— */
  --d-sky-top:#3f78b8;  --k-sky-top:#2d3a72;  --n-sky-top:#03060f;
  --d-sky-mid:#8cbbe0;  --k-sky-mid:#c9839a;  --n-sky-mid:#0a1830;
  --d-sky-low:#e4eef4;  --k-sky-low:#ffc38a;  --n-sky-low:#16284a;
  --d-haze:#dfeaf2;     --k-haze:#f4c4a0;     --n-haze:#16243e;
  --d-cloud:#ffffff;    --k-cloud:#ffd6b4;    --n-cloud:#283452;
  --d-cloud-dk:#a4b4c6; --k-cloud-dk:#8a6a80; --n-cloud-dk:#10182c;
  --d-overcast:#9aa6b2; --k-overcast:#7a6e78; --n-overcast:#0c1220;

  /* —— 雪山（受光面／背光面會跟著太陽方向互換）、岩壁 —— */
  --d-snow-lit:#ffffff; --k-snow-lit:#ffdcbc; --n-snow-lit:#56668a;
  --d-snow-shade:#86a4c8;--k-snow-shade:#8a80ac;--n-snow-shade:#222c4a;
  --d-rock:#3c3c44;     --k-rock:#3c3038;     --n-rock:#0e1018;
  --d-rock-dk:#22242a;  --n-rock-dk:#07080c;

  /* —— 冰河與冰山（越深越藍） —— */
  --d-glacier:#eef6fb;  --k-glacier:#f6dcd0;  --n-glacier:#46567a;
  --d-glacier-dk:#86b2d4;--k-glacier-dk:#8a8cb4;--n-glacier-dk:#1c2846;
  --d-ice-hi:#f6fcff;   --k-ice-hi:#fff0e0;   --n-ice-hi:#6a7ca2;
  --d-ice-blue:#7cc6ec; --k-ice-blue:#7cb0d8; --n-ice-blue:#1e3a64;
  --d-ice-deep:#1c78c0; --k-ice-deep:#2a5ca0; --n-ice-deep:#0a1c40;

  /* —— 海水 —— */
  --d-sea-top:#b4d2e6;  --k-sea-top:#e8b49a;  --n-sea-top:#18284a;
  --d-sea-mid:#3a6c8e;  --k-sea-mid:#4a5a7a;  --n-sea-mid:#0a1628;
  --d-sea-deep:#10303f; --k-sea-deep:#1e2440; --n-sea-deep:#03080f;
  --d-foam:#ffffff;     --k-foam:#ffe8d4;     --n-foam:#62728e;

  /* —— 小島：雪坡、岩石、企鵝聚落（岩石被排泄物染成粉褐色） —— */
  --d-isl-snow:#f6fafd; --k-isl-snow:#ffe2c8; --n-isl-snow:#4e5c7e;
  --d-isl-shade:#a8c0d8;--k-isl-shade:#9a8cb0;--n-isl-shade:#1e2844;
  --d-isl-rock:#4a4446; --k-isl-rock:#4a3a3c; --n-isl-rock:#121216;
  --d-isl-rock-dk:#2a2628;--n-isl-rock-dk:#08080a;
  --d-guano:#b88c7e;    --k-guano:#c08070;    --n-guano:#2e2426;
  --d-pebble:#8a8480;   --n-pebble:#222226;

  /* —— 歷史小屋（黑色木屋＋紅色窗框） —— */
  --d-hut:#1f1f22;      --n-hut:#08080a;
  --d-hut-hi:#3c3c42;   --k-hut-hi:#4a383a;   --n-hut-hi:#121214;
  --d-hut-red:#b8282a;  --k-hut-red:#c83a2a;  --n-hut-red:#3a1010;

  /* —— 探險郵輪、橡皮艇、獨木舟 —— */
  --d-ship-hull:#1e2c44;--k-ship-hull:#262a44;--n-ship-hull:#080c16;
  --d-ship-white:#f2f4f6;--k-ship-white:#ffe0c8;--n-ship-white:#3a4256;
  --d-ship-shade:#b4bec8;--k-ship-shade:#b89aa0;--n-ship-shade:#20263a;
  --d-lifeboat:#f08a24; --k-lifeboat:#f8902a; --n-lifeboat:#4a2a10;
  --d-zodiac:#50545c;   --k-zodiac:#50464c;   --n-zodiac:#16181e;
  --d-zodiac-dk:#2a2c32;--n-zodiac-dk:#08090c;
  --d-kayak:#f2c230;    --n-kayak:#4a3c14;
  --d-kayak2:#e0522a;   --n-kayak2:#401a10;

  /* —— 人物（紅色防寒外套） —— */
  --d-parka:#d42e2e;    --k-parka:#e4402e;    --n-parka:#4a1414;
  --d-parka2:#f2b630;   --n-parka2:#4a3a14;
  --d-guide:#2f4a3a;    --n-guide:#101a14;
  --d-pants:#22242a;    --n-pants:#08080a;
  --d-skin:#f0c8a8;     --k-skin:#f0b48a;     --n-skin:#4a3c40;
  --d-beanie:#2f5f8a;   --n-beanie:#121e2e;

  /* —— 動物 —— */
  --d-pg-black:#1c1e26; --k-pg-black:#221c24; --n-pg-black:#06070a;
  --d-pg-white:#f8f8f4; --k-pg-white:#ffe6d0; --n-pg-white:#56607a;
  --d-pg-white-sh:#c2cad6;--k-pg-white-sh:#c8a8a8;--n-pg-white-sh:#2c3246;
  --d-chick:#8c8e96;    --k-chick:#8a7c80;    --n-chick:#2a2c32;
  --d-seal-leo:#6e7680; --k-seal-leo:#6e6670; --n-seal-leo:#1c2028;
  --d-seal-leo-lt:#c4ccd4;--k-seal-leo-lt:#d0b8b4;--n-seal-leo-lt:#3a4050;
  --d-seal-wed:#4a5464; --k-seal-wed:#4a4a5a; --n-seal-wed:#12161e;
  --d-whale:#262a32;    --k-whale:#2a2630;    --n-whale:#08090e;
  --d-whale-lt:#e8ecf0; --k-whale-lt:#f0d8cc; --n-whale-lt:#4a5060;
  --d-orca:#101216;     --n-orca:#040506;
  --d-orca-w:#f4f6f8;   --k-orca-w:#ffe8d8;   --n-orca-w:#4e566a;
  --d-skua:#6a5444;     --k-skua:#6e5040;     --n-skua:#1e1814;

  /* —— 不隨日夜變化的顏色（光、燈、極光） —— */
  --sun:#fff4dc; --moon:#f0f0e6; --star:#ffffff;
  --aurora-g:#5affa8; --aurora-p:#ff6fb8;
  --lamp:#ffd890; --window-in:#ffcf7a; --flash:#ffffff;
  --bill:#f0662a; --feet:#f08a3a; --mouth:#d87a80;
  --grade-cool:#0c5a78; --grade-warm:#ff8a3a; --cine-shade:#000000; --cine-light:#fff1d6;

  /* —— 頁面介面（電影院般的深色） —— */
  --page-bg:#0d1014; --page-fg:#e8eef2; --page-muted:#98a4ae;
  --ui-surface:#171b21; --ui-line:#343c46; --ui-accent:#7cc6ec; --ui-hot:#ffd08a; --ui-hot2:#3aa0d8;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:6px;overflow:hidden;background:#000;line-height:0;box-shadow:0 18px 50px rgba(0,0,0,.55)}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:6px;padding:10px 14px}
.panel button{font:700 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:4px;padding:9px 14px;cursor:pointer;letter-spacing:.04em}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:#0c1620}
.panel button.big{border-color:var(--ui-hot);color:#16120c;background:var(--ui-hot)}
.panel button.big2{border-color:var(--ui-hot2);color:#fff;background:var(--ui-hot2)}
.panel button:disabled{opacity:.45;cursor:default}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid #dff4ff;outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(220px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding:0;list-style:none;color:var(--page-muted);font-size:14px;line-height:1.8;display:flex;flex-wrap:wrap;gap:4px 22px}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .bubble path{fill:rgba(14,20,28,.82);stroke:rgba(220,240,255,.6);stroke-width:1}
#scene .bubble text{fill:#f0f8ff;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .screen{mix-blend-mode:screen}
#scene .soft{mix-blend-mode:soft-light}
#scene .f-facel{fill:var(--face-l)}
#scene .f-facer{fill:var(--face-r)}
#scene .f-facel2{fill:var(--face-l2)}
#scene .f-facer2{fill:var(--face-r2)}
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 舞台。圖層由遠到近：
       天空（星空、南極光、太陽月亮、雲）→ 海面底色 → 遠山 → 冰河與近山
       → 海面波光 → 桌狀冰山 → 探險郵輪 → 海上（鯨魚、拱門冰山、獨木舟、浮冰、橡皮艇）
       → 企鵝小島 → 前景浮冰 → 天氣（霧、雪）→ 鏡頭效果（光暈、調色、暗角、顆粒、寬銀幕黑邊）
       大部分的物件由下方 JS 產生，這裡只放骨架與濾鏡、漸層。
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" role="img" aria-label="南極半島的海峽：冰河、冰山、探險郵輪、企鵝、海豹與座頭鯨">
    <defs>
      <!-- 天空與海 -->
      <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-top)"/><stop offset=".55" style="stop-color:var(--sky-mid)"/><stop offset="1" style="stop-color:var(--sky-low)"/>
      </linearGradient>
      <linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sea-top)"/><stop offset=".22" style="stop-color:var(--sea-mid)"/><stop offset="1" style="stop-color:var(--sea-deep)"/>
      </linearGradient>
      <radialGradient id="sunGlow"><stop offset="0" stop-color="#fff6e0" stop-opacity=".95"/><stop offset=".12" stop-color="#ffe2b0" stop-opacity=".6"/><stop offset=".4" stop-color="#ffc890" stop-opacity=".18"/><stop offset="1" stop-color="#ffc890" stop-opacity="0"/></radialGradient>
      <radialGradient id="moonGlow"><stop offset="0" stop-color="#e8f0ff" stop-opacity=".5"/><stop offset="1" stop-color="#e8f0ff" stop-opacity="0"/></radialGradient>
      <radialGradient id="starGlow"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#cfe0ff" stop-opacity="0"/></radialGradient>
      <radialGradient id="fuzzG"><stop offset="0" stop-color="#dfe8ff" stop-opacity=".45"/><stop offset="1" stop-color="#dfe8ff" stop-opacity="0"/></radialGradient>
      <radialGradient id="darkG"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
      <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--cloud)"/><stop offset="1" style="stop-color:var(--cloud-dk)"/></linearGradient>
      <linearGradient id="hazeG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--haze)" stop-opacity="0"/><stop offset="1" style="stop-color:var(--haze)" stop-opacity="1"/></linearGradient>
      <!-- 南極光：一條條垂直光帶（底部綠、頂端粉紅） -->
      <linearGradient id="auroraStrip" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--aurora-p)" stop-opacity="0"/>
        <stop offset=".35" style="stop-color:var(--aurora-p)" stop-opacity=".28"/>
        <stop offset=".7" style="stop-color:var(--aurora-g)" stop-opacity=".55"/>
        <stop offset=".93" style="stop-color:var(--aurora-g)" stop-opacity=".95"/>
        <stop offset="1" style="stop-color:var(--aurora-g)" stop-opacity="0"/>

<script id="showstop">
/* =========================================================

       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾

           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，

    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>
/* ---- 表演氛圍（取代寬銀幕黑邊）：k = 0~1，四周輕微暗角＋中央微亮；fx/fy 可讓亮處偏向表演焦點 ---- */

/* =========================================================
   SC-43 南極｜程式區
   區塊：①工具與色票
         ②場景（星空、南極光、雲、遠山、冰河冰壁、海面與倒影、冰山、小島、歷史小屋、前景浮冰）

(() => {

/* 倒影：把某個群組上下翻轉（以水線 wl 為軸），再用漸層遮罩讓它越往下越淡 */

/* ---------------- ① 色票：讀取、配對、日夜內插 ---------------- */

const LY = {}; ['Lsky', 'Lfar', 'Lmid', 'Lberg1', 'Lship', 'Lsea', 'Lisland', 'Lfore'].forEach(k => LY[k] = $(k));
const PX = { Lfar: 3, Lmid: 6, Lberg1: 9, Lship: 11, Lsea: 16, Lisland: 24, Lfore: 40 };

/* =========================================================

function mountain(g, px, py, bl, br, base, o = {}) {

  const right = [[px, py], ...ridgeLine([px, py], [br, base], 12, amp), [br, base]];
  const mid = [[px, py], ...jag([px, py], [cx, base], 9, amp * .8), [cx, base]];

}

/* ---- 遠山：南極半島的群峰，越遠越淡（空氣透視） ---- */
function drawFar() {

  const whaleG = el('g', {}, LY.Lsea);
  ambWhales = [makeHumpback(whaleG, 414, .9), makeHumpback(whaleG, 428, .75)];
  ambWhales[0].x = 450; ambWhales[0].t = -3; ambWhales[1].x = 700; ambWhales[1].t = -16;
  drawShowWhales(whaleG);
  drawOrcas(el('g', {}, LY.Lsea));
  drawBerg2(LY.Lsea);
  drawNewBerg(LY.Lsea);
  const kg = el('g', {}, LY.Lsea);
  makeKayak(kg, 880, 434, 'f-kayak'); makeKayak(kg, 960, 434, 'f-kayak2');
  drawLeopardFloe(LY.Lsea);
  const swimG = el('g', { class: 'noHit' }, LY.Lsea);
  for (let i = 0; i < 6; i++) { const s = makeSwimmer(swimG); s.on = false; swimPool.push(s); }
  const zg = el('g', {}, LY.Lsea);
  makeZodiac(zg, 474, 400, 980, 560, 1);
  makeZodiac(zg, 512, 300, 980, 900, -1);
  seaFx = el('g', { class: 'noHit' }, LY.Lsea);
  drawIsland();
  drawColony();
  drawWeddell(LY.Lisland);
  drawTourists(LY.Lisland);
  // 鳥：兩隻褐賊鷗在聚落上空盤旋，一群雪鸌在冰山附近飛
  const bg = el('g', {}, LY.Lisland);
  [[1230, 380, 120, 30, .5], [1300, 340, 160, 24, .38]].forEach(([cx, cy, rx, ry, v]) => Object.assign(makeBird(bg, 'skua'), { cx, cy, rx, ry, v }));
  const pg = el('g', { class: 'noHit' }, LY.Lberg1);
  for (let i = 0; i < 5; i++) { const B = makeBird(pg, 'petrel'); Object.assign(B, { home: [760 + i * 14, 250 + i * 6], hx: 760, hy: 250, rx: 70 + i * 10, ry: 16, v: .9 + i * .05, cx: 760, cy: 250 }); }
  drawFore();
  foreFx = el('g', { class: 'noHit' }, LY.Lfore);
  drawWeather();
  drawLens();
  bindAll();
  if (reduced) { T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false'); }
  setWeather(0);
  applyColors(true);
  step(1 / 60);
  requestAnimationFrame(loop);
  // 網站「作者精選」播放區（純插畫版放在 iframe 裡）：使用者指定預設為夜晚（南極光）＋輪播座頭鯨躍身秀；
  // 不會自己出聲，訪客按下播放區開聲音後，每一輪的秀都會配上音樂。
  const inPicks = (() => { let top = true; try { top = window.top === window; } catch (e) { top = false; } return !!document.getElementById('pure-art') && !top; })();
  if (inPicks) {
    setTime(22.5);
    setTimeout(() => startShow('whale', !pickAudio), 800);
    setInterval(() => { if (!show.on) startShow('whale', !pickAudio); }, 6000);
    window.sceneMusic = {
      playing: false,
      start(c) {
        if (this.playing) return; this.playing = true; pickAudio = true; userGesture = true;
        if (c && c !== actx) useCtx(c); else ensureAudio();
        if (actx && actx.state !== 'running') actx.resume();
        if (show.on && show.t < 4) playWhaleMusic();
      },
      stop() { this.playing = false; pickAudio = false; stopAll(); },
      duck() {}
    };
  }
}
init();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on && show.kind,
  btn: { whale: 'btnWhale', calve: 'btnCalve' },
  ff: () => { show.cues = new Proxy({}, { get: () => 1 }); show.t = show.dur - .02; },
  save: () => ({ t: T.t, auto: T.auto, w: wxIdx }),
  stop: () => endShow(),
  restore: s => { if (wxIdx !== s.w) setWeather(s.w); T.t = s.t; T.auto = s.auto; $('btnAuto') && $('btnAuto').setAttribute('aria-pressed', String(T.auto)); applyColors(true); }
});
/* /ShowStop */
})();
</script>
</body>
</html>
