<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SC-05 山間小站</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
/* =========================================================
   SC-05 山間小站｜像素風格
   【色票 token】所有顏色集中在這裡。
   - 場景色成對出現：--名稱-day / --名稱-night，
     JS 會自動找出所有成對色，依「日夜比例」混色後輸出 --名稱，
     並產生 .f-名稱（填色）class 給 SVG 使用。
   - 「常亮光源」不參與混色（窗光、燈、車燈、號誌、螢火蟲）。
   換色時只需改這個區塊。
   像素格：P = 4px（JS 開頭可改），所有物件都對齊格線。
   ========================================================= */
:root{
  color-scheme:dark;

  /* ---- 頁面外框 ---- */
  --page-bg:#141a2e;
  --page-panel:#1f2742;
  --page-fg:#f1ead8;
  --page-dim:#a7a9bd;
  --page-line:#36406a;
  --page-accent:#f2a93b;
  --font-display:"DotGothic16","Noto Sans TC",monospace;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;

  /* ---- 天空、雲、遠山 ---- */
  --sky-top-day:#4f9be8;   --sky-top-night:#0b1030;
  --sky-bot-day:#c4e8ff;   --sky-bot-night:#2b3070;
  --cloud-day:#ffffff;     --cloud-night:#39407a;
  --cloud-sh-day:#cfe0f4;  --cloud-sh-night:#272d62;
  --mtn1-day:#7d93c9;      --mtn1-night:#1c2350;
  --mtn1-hi-day:#a5b7e2;   --mtn1-hi-night:#2a3266;
  --snow-day:#f4f8ff;      --snow-night:#8e9ccc;
  --mtn2-day:#5c7cab;      --mtn2-night:#17204a;
  --mtn2-hi-day:#83a1cc;   --mtn2-hi-night:#222c5c;
  --hill-day:#4d8a55;      --hill-night:#122833;
  --pine1-day:#2c6442;     --pine1-night:#0a1b24;
  --pine2-day:#3f8551;     --pine2-night:#11292f;

  /* ---- 地面、岩石、水 ---- */
  --grass-day:#74b24f;     --grass-night:#1c3a33;
  --grass-dk-day:#5a9640;  --grass-dk-night:#142c29;
  --grass-hi-day:#9fd162;  --grass-hi-night:#24463a;
  --dirt-day:#b0835a;      --dirt-night:#3a2a36;
  --dirt-dk-day:#8e6542;   --dirt-dk-night:#2a1f2a;
  --rock-day:#8a8a98;      --rock-night:#2c2d45;
  --rock-dk-day:#5f6070;   --rock-dk-night:#1b1c31;
  --rock-hi-day:#b3b3bf;   --rock-hi-night:#3c3d5c;
  --water-day:#3f8ed8;     --water-night:#1a2f6a;
  --water-hi-day:#9fd6ff;  --water-hi-night:#4a68b8;
  --foam-day:#f4fbff;      --foam-night:#94a6da;

  /* ---- 建築 ---- */
  --wall-day:#c98f55;      --wall-night:#4a3346;
  --wall-dk-day:#a26c3c;   --wall-dk-night:#352438;
  --wall-lt-day:#e6b77a;   --wall-lt-night:#5c4256;
  --roof-day:#4a5f8a;      --roof-night:#1b2240;
  --roof-dk-day:#34456a;   --roof-dk-night:#111630;
  --roof-hi-day:#6c86b5;   --roof-hi-night:#2a335c;
  --trim-day:#f3e7c9;      --trim-night:#6a6386;
  --wood-day:#8a5a34;      --wood-night:#33232f;
  --glass-day:#8fc6dc;     --glass-night:#1e2a4f;
  --bench-day:#b56d3b;     --bench-night:#3c2631;
  --metal-day:#9aa3ad;     --metal-night:#343a52;
  --vend-day:#d84b4b;      --vend-night:#4c1d2b;
  --mailbox-day:#dc3b3b;   --mailbox-night:#5a1a22;
  --poster1-day:#6ab0e8;   --poster1-night:#22385a;
  --poster2-day:#f5d76e;   --poster2-night:#5a5030;
  --noren-day:#3c5aa0;     --noren-night:#182040;
  --parasol-day:#d9383a;   --parasol-night:#5a1a24;

  /* ---- 月台、鐵道、橋、道路 ---- */
  --plat-day:#c9c3b6;      --plat-night:#3c3a54;
  --plat-dk-day:#a39d90;   --plat-dk-night:#2b2a40;
  --plat-edge-day:#f0ece2; --plat-edge-night:#504e6c;
  --tactile-day:#f2c53d;   --tactile-night:#7d6e36;
  --rail-day:#8b8e99;      --rail-night:#3a3d58;
  --rail-hi-day:#d4d7de;   --rail-hi-night:#5b5f80;
  --sleeper-day:#6b4b33;   --sleeper-night:#2a1f2b;
  --ballast-day:#9a948a;   --ballast-night:#2f2e42;
  --ballast-dk-day:#7a746b; --ballast-dk-night:#222134;
  --steel-day:#c8483a;     --steel-night:#4c2030;
  --steel-dk-day:#8f3329;  --steel-dk-night:#331722;
  --concrete-day:#bcb8ae;  --concrete-night:#3a394f;
  --concrete-dk-day:#8f8b82; --concrete-dk-night:#2a293d;
  --road-day:#5d5f6b;      --road-night:#1d1e30;
  --road-line-day:#f3f0e6; --road-line-night:#6e6c88;
  --curb-day:#aaa69d;      --curb-night:#34334a;

  /* ---- 人物、動物 ---- */
  --skin-day:#f2c49b;      --skin-night:#8f7378;
  --hair-day:#3b2a25;      --hair-night:#140f19;
  --gray-day:#dcd8d0;      --gray-night:#6b6880;
  --ink-day:#222034;       --ink-night:#05050f;
  --coat1-day:#e0623a;     --coat1-night:#6a2f3a;
  --coat2-day:#5fb3a3;     --coat2-night:#22434a;
  --coat3-day:#f0a6c0;     --coat3-night:#5a3a50;
  --pack-day:#3d6b8f;      --pack-night:#1b2c45;
  --hat1-day:#f2c53d;      --hat1-night:#7a6a35;
  --pants1-day:#3f4a6b;    --pants1-night:#161a30;
  --shoe-day:#5a3a2a;      --shoe-night:#1b1218;
  --apron-day:#8fb87a;     --apron-night:#2f4a40;
  --skirt-day:#7a5a8f;     --skirt-night:#2f2443;
  --basket-day:#c9a05a;    --basket-night:#4a3a30;
  --uniform-day:#2f3f6b;   --uniform-night:#121833;
  --bag-day:#a0522d;       --bag-night:#3a2028;
  --navy-day:#233466;      --navy-night:#0c1230;
  --gold-day:#f0c040;      --gold-night:#7a6230;
  --dog-day:#c48a4a;       --dog-night:#4a3030;
  --cat-day:#f0a050;       --cat-night:#5a3a30;

  /* ---- 交通工具 ---- */
  --train-body-day:#f3ecd9;  --train-body-night:#5c5a76;
  --train-stripe-day:#d9483b; --train-stripe-night:#5a2232;
  --train-skirt-day:#4b6a8f;  --train-skirt-night:#1a2440;
  --train-roof-day:#9aa0aa;   --train-roof-night:#33364f;
  --train-dark-day:#2c2f3d;   --train-dark-night:#0b0c18;
  --bus-body-day:#6fc0b0;     --bus-body-night:#23484a;
  --bus-band-day:#f2efe2;     --bus-band-night:#5a5a70;
  --truck-day:#e9e5d8;        --truck-night:#4f4e66;
  --cabbage-day:#8fcf5a;      --cabbage-night:#2a4a2a;
  --smoke-day:#eef0f2;        --smoke-night:#5a5f80;
  --smoke-dk-day:#8a8d96;     --smoke-dk-night:#2e3048;

  /* ---- 植物 ---- */
  --maple1-day:#e0452f;    --maple1-night:#5a1f2a;
  --maple2-day:#f08a2f;    --maple2-night:#6a3a26;
  --maple3-day:#f5c542;    --maple3-night:#6a5a2a;
  --maple-dk-day:#ae2f27;  --maple-dk-night:#3f1520;
  --trunk-day:#6b4630;     --trunk-night:#24181f;
  --flower1-day:#ff7aa8;   --flower1-night:#6a3050;
  --flower2-day:#fff2a0;   --flower2-night:#6a6440;
  --flower3-day:#b48cff;   --flower3-night:#3f3570;

  /* ---- 常亮光源（不隨日夜混色） ---- */
  --win-on:#ffd76a;      /* 窗內暖光 */
  --lamp:#fff1b8;        /* 路燈、月台燈 */
  --headlight:#fffbe0;   /* 車頭燈 */
  --tail:#ff3b3b;        /* 車尾燈 */
  --sig-red:#ff4848;     /* 號誌紅 */
  --sig-green:#4dff88;   /* 號誌綠 */
  --sig-off:#2a2a36;     /* 號誌熄燈 */
  --firefly:#e8ff7a;     /* 螢火蟲 */
  --star:#ffffff;        /* 星星 */
  --dusk:#ff9a55;        /* 晨昏地平線 */
  --sun:#fff3b0;  --sun-rim:#ffcf55;
  --moon:#f2f0dc; --moon-sh:#c9c6b0;
  --lantern:#ff5a3c;     /* 茶屋紅燈籠 */
  --vend-panel:#dff4ff;  /* 販賣機面板 */
}

/* ===== 頁面版面 ===== */
html,body{margin:0;background:var(--page-bg);color:var(--page-fg)}
body{font-family:var(--font-body);line-height:1.6}
.wrap{max-width:1680px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(1.4rem,2.6vw,2rem);margin:0;letter-spacing:.06em;text-wrap:balance}
h1 small{font-size:.6em;color:var(--page-accent);letter-spacing:.12em;margin-right:.6em}
.meta{color:var(--page-dim);font-size:.9rem;margin:0}
.stage{position:relative;overflow:hidden;background:#000;
  box-shadow:0 0 0 4px var(--page-line),0 0 0 8px #0c1020,0 18px 40px -18px #000}
.stage svg{display:block;width:100%;height:auto;max-width:100%;touch-action:manipulation;image-rendering:pixelated}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
/* 像素按鈕：用階梯狀陰影做出 8-bit 邊框 */
.controls button{font:1rem/1 var(--font-display);color:var(--page-fg);background:var(--page-panel);
  border:0;padding:12px 16px;cursor:pointer;
  box-shadow:0 -4px 0 0 var(--page-line),0 4px 0 0 var(--page-line),-4px 0 0 0 var(--page-line),4px 0 0 0 var(--page-line),0 8px 0 0 #0a0d18;
  margin:4px;transition:transform .08s}
.controls button:hover{background:#2a3456}
.controls button:active{transform:translateY(4px);box-shadow:0 -4px 0 0 var(--page-line),0 4px 0 0 var(--page-line),-4px 0 0 0 var(--page-line),4px 0 0 0 var(--page-line)}
.controls button:focus-visible{outline:4px solid var(--page-accent);outline-offset:6px}
.controls button[aria-pressed="true"]{color:var(--page-accent)}
.clock{margin-left:auto;font-family:var(--font-display);font-size:1.05rem;color:var(--page-dim);font-variant-numeric:tabular-nums}
.hint{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px 20px;color:var(--page-dim);font-size:.88rem}
.hint b{color:var(--page-fg);font-weight:500;margin-right:.4em}

/* ===== SVG 內樣式 ===== */
.px-txt{font-family:var(--font-display);fill:var(--ink)}
.c-win{fill:var(--win-on)} .c-lamp{fill:var(--lamp)} .c-head{fill:var(--headlight)}
.c-tail{fill:var(--tail)} .c-red{fill:var(--sig-red)} .c-green{fill:var(--sig-green)} .c-off{fill:var(--sig-off)}
.c-fly{fill:var(--firefly)} .c-star{fill:var(--star)} .c-dusk{fill:var(--dusk)}
.c-sun{fill:var(--sun)} .c-sunrim{fill:var(--sun-rim)} .c-moon{fill:var(--moon)} .c-moonsh{fill:var(--moon-sh)}
.c-lantern{fill:var(--lantern)} .c-vendp{fill:var(--vend-panel)}
.lit{fill:var(--win-on);opacity:0}
.lit.on{opacity:var(--lit,.1)}
[data-act]{cursor:pointer}
.deco{pointer-events:none}
.bubble rect.bg{fill:#fffdf3} .bubble rect.bd{fill:#222034}
.bubble text{font-family:var(--font-display);font-size:18px;fill:#222034}

/* ===== 減少動態 ===== */
@media (prefers-reduced-motion: reduce){
  .controls button{transition:none}
}
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>
</head>
<body>
<main class="wrap">

  <div class="stage">
  <!-- =====================================================
       【場景】SVG 主舞台 viewBox 1600×600
       圖層由後到前：天空 → 星星 → 日月 → 雲 → 遠山 → 近山與松林 → 峽谷
       → 瀑布 → 河 → 鳥 → 車站建築 → 月台 → 月台行人 → 鐵道與鐵橋
       → 火車 → 隧道岩壁 → 石牆 → 道路與車輛 → 圍籬步道 → 步道行人
       → 前景樹與路燈 → 落葉、螢火蟲 → 對話泡泡
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" shape-rendering="crispEdges" role="img" aria-label="秋天山間的小火車站，柴油列車從隧道駛出靠站，旅客上下車，後方有瀑布與紅色鐵橋，可切換白天與夜晚">
    <defs>
      <clipPath id="fallClip"><rect x="1424" y="244" width="36" height="336"/></clipPath>
      <clipPath id="riverClip"><rect x="1272" y="572" width="328" height="28"/></clipPath>
    </defs>

    <!-- 天空（色帶 + 抖色，JS 生成） -->
    <g id="sky" class="deco"></g>
    <g id="dusk" class="deco"></g>
    <g id="stars" class="deco"></g>
    <g id="sunMoon" class="deco"><g id="sun"></g><g id="moon"></g></g>
    <g id="clouds" class="deco"></g>

    <!-- 遠山、近山、松林（JS 生成） -->
    <g id="mtn1" class="deco"></g>
    <g id="mtn2" class="deco"></g>
    <g id="hill"></g>

    <!-- 峽谷背景、瀑布、河流 -->
    <g id="gorge" class="deco"></g>
    <g id="fall" class="deco"><g id="fallStreaks" clip-path="url(#fallClip)"></g></g>
    <g id="river" class="deco"><g id="riverStreaks" clip-path="url(#riverClip)"></g><g id="foam"></g></g>

    <!-- 【動畫】飛鳥 -->
    <g id="birds" class="deco"></g>

    <!-- 車站一帶的地面、後方樹木 -->
    <g id="backGround" class="deco"></g>
    <g id="backTrees"></g>

    <!-- 【場景】建築：車站、雨棚、茶屋、號誌 -->
    <g id="station"></g>
    <g id="smokeBack" class="deco"></g>
    <g id="glowBack" class="deco"></g>

    <!-- 月台 -->
    <g id="platform"></g>
    <!-- 【角色】月台行人與站長 -->
    <g id="platPeople"></g>

    <!-- 鐵道、鐵橋 -->
    <g id="track" class="deco"></g>
    <g id="smokeTrain" class="deco"></g>
    <!-- 【角色】柴油列車 -->
    <g id="train" data-act="train"></g>

    <!-- 隧道岩壁（蓋在火車前面） -->
    <g id="cliff" class="deco"></g>
    <g id="wall" class="deco"></g>

    <!-- 道路、路橋、車輛 -->
    <g id="road" class="deco"></g>
    <g id="laneBack"></g>
    <g id="laneFront"></g>

    <!-- 前景：圍籬、步道、草地 -->
    <g id="fore"></g>
    <g id="pathPeople"></g>
    <g id="foreTop"></g>
    <g id="glowFront" class="deco"></g>

    <!-- 【動畫】落葉、螢火蟲、流星 -->
    <g id="leaves" class="deco"></g>
    <g id="flies" class="deco"></g>
    <g id="fx" class="deco"></g>
  </svg>
  </div>

  <!-- 【互動】控制列 -->
  <div class="controls">
    <button id="btnDayNight" type="button">切換日夜</button>
    <button id="btnAuto" type="button" aria-pressed="true">自動循環：開</button>
    <button id="btnTrain" type="button">叫火車</button>

/* =========================================================

   ========================================================= */
const train = { x: -40, v: 0, state: "away", timer: 4, stopT: 0, doorK: 0, flags: {} };
function doorWorldX(d) { return train.x - TRAIN_LEN + d.x; }
function startArrival() {
  train.state = "arriving"; train.x = 120; train.v = 220; train.flags = {};
  // 1～2 位旅客從站房走出來候車
  const n = 1 + Math.floor(Math.random() * 2);
  for (let i = 0; i < n; i++)
    addPlat(pick(["adult", "student", "hiker"]), pick(COLORS), STATION_DOOR, { role: "toWait", target: snap(rand(620, 1040)), speed: 40 });
}
function updateTrain(dt) {
  const T = train;
  if (T.state === "away") { T.timer -= dt; if (T.timer <= 0) startArrival(); }
  else if (T.state === "arriving") {
    const d = STOP_X - T.x;
    T.v = Math.min(220, Math.sqrt(2 * 70 * Math.max(d, 0)) + 6);
    T.x += T.v * dt;
    if (T.x >= STOP_X) { T.x = STOP_X; T.v = 0; T.state = "stopped"; T.stopT = 0; }
  } else if (T.state === "stopped") {
    T.stopT += dt;
    if (T.stopT > 1 && !T.flags.open) {
      T.flags.open = true;
      // 下車：從車門走向站房
      const n = 1 + Math.floor(Math.random() * 2);
      for (let i = 0; i < n; i++) {
        const d = pick(doors);
        addPlat(pick(["adult", "hiker", "grandma", "student"]), pick(COLORS), doorWorldX(d), { role: "leave", target: STATION_DOOR, speed: 36, dir: -1 });
      }
      // 上車：候車的人走向最近的車門
      for (const W of plat) if (W.role === "wait" || W.role === "toWait") {
        let best = doors[0]; for (const d of doors) if (Math.abs(doorWorldX(d) - W.x) < Math.abs(doorWorldX(best) - W.x)) best = d;
        W.role = "board"; W.target = doorWorldX(best);
      }
    }
    if (T.stopT > 6 && !T.flags.flag) { T.flags.flag = true; masterWave(); }
    if (T.stopT > 8.2) { T.state = "departing"; T.v = 0; bubble(STOP_X - 40, 320, "噗噗——"); }
  } else if (T.state === "departing") {
    T.v = Math.min(240, T.v + 50 * dt);
    T.x += T.v * dt;
    if (T.x - TRAIN_LEN > 1640) { T.state = "away"; T.timer = rand(12, 18); T.x = -40; }
  }
  // 車門開關（等上下車的人都走完才關門）
  const busy = plat.some(W => W.role === "board" || (W.role === "leave" && Math.abs(W.x - STATION_DOOR) > 0 && W.x > STOP_X - TRAIN_LEN - 40 && W.dist < 30));
  const want = T.state === "stopped" && T.stopT > 1 && (T.stopT < 6 || busy) ? 1 : 0;
  if (want && T.stopT > 6) T.stopT = 6; // 還有人上車就多等一下
  T.doorK = clamp(T.doorK + (want ? 1 : -1) * dt * 2.5, 0, 1);
  const k = snap(T.doorK * 12);
  for (const d of doors) { d.L.setAttribute("transform", `translate(${-k},0)`); d.R.setAttribute("transform", `translate(${k},0)`); }
  // 車輪轉動畫格
  T.dist = (T.dist || 0) + T.v * dt;
  const f = Math.floor(T.dist / 8) % 2;
  trainWheels[0].forEach(e => e.style.display = f ? "none" : ""); trainWheels[1].forEach(e => e.style.display = f ? "" : "none");
  trainG.setAttribute("transform", `translate(${snap(T.x - TRAIN_LEN)},0)`);
  trainG.style.visibility = T.state === "away" ? "hidden" : "visible";
  // 號誌：列車在站區時紅燈
  const red = T.state === "arriving" || T.state === "stopped" || (T.state === "departing" && T.x - TRAIN_LEN < 1240);
  signalRed.setAttribute("class", red ? "c-red" : "c-off");
  signalGreen.setAttribute("class", red ? "c-off" : "c-green");
}

  const mins = Math.floor(((12 + p * 24) % 24) * 60), h = Math.floor(mins / 60), m = mins % 60;
  const name = h < 5 ? "深夜" : h < 7 ? "清晨" : h < 11 ? "上午" : h < 13 ? "中午" : h < 17 ? "下午" : h < 19 ? "黃昏" : h < 23 ? "夜晚" : "深夜";
  return { h, m, s: `${String(h).padStart(2, "0")}:${String(Math.floor(m / 5) * 5).padStart(2, "0")} ${name}` };
}

  // 時鐘指針與時間文字

  if (key !== lastClockKey) {

    clockHands.innerHTML = "";
    const cx = 440, cy = 190, ha = ((ck.h % 12) + ck.m / 60) / 12 * Math.PI * 2, ma = ck.m / 60 * Math.PI * 2;

/* =========================================================
   主迴圈
   ========================================================= */
let wind = .3, windTarget = .3, pointerIn = false;
let last = performance.now(), t = 0, chimneyT = 0, exhaustT = 0, leafT = 0, vehT = 3, flockT = 8, meteorT = 10;

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;

  } else if (auto && !reduced) phase = (phase + dt / CYCLE) % 1;
  const n = nightOf(phase);
  applyNight(n);

  // --- 風：滑鼠控制，沒滑鼠時自己飄 ---
  if (!pointerIn) windTarget = .3 + Math.sin(t * .25) * .4;
  wind += (windTarget - wind) * Math.min(1, dt * 2.5);

  // --- 燈光（含閃爍） ---
  for (const L of lamps) {
    if (L.flick && !reduced) { if (Math.random() < dt * .5) L.f = .15; L.f += (1 - L.f) * dt * (L.f < .5 && Math.random() < .5 ? 1 : 6); }
    const on = L.on ? L.f : 0;
    L.glow.setAttribute("opacity", (n * on).toFixed(3));
    L.bulb.setAttribute("class", L.on && L.f > .5 ? "c-lamp" : "f-metal");
  }

  if (!reduced) {
    // 雲
    for (const c of clouds) {
      c.x += (c.sp * 8 + wind * 14) * dt;
      if (c.x > 1700) c.x = -c.w - 20; if (c.x < -c.w - 40) c.x = 1690;
      c.g.setAttribute("transform", `translate(${snap(c.x)},${c.y})`);
    }
    // 星星閃爍
    for (let i = 0; i < 2; i++) { const s = pick(stars); s.setAttribute("opacity", (.3 + Math.random() * .7).toFixed(2)); }
    // 瀑布與河流
    for (const s of fallStreaks) { s.y += s.sp * dt; if (s.y > 580) s.y = 244 - s.len; s.el.setAttribute("y", snap(s.y)); }
    for (const s of riverStreaks) { s.x += 36 * dt; if (s.x > 1600) s.x = 1272 - s.len; s.el.setAttribute("x", snap(s.x)); }
    if (Math.floor(t * 8) !== Math.floor((t - dt) * 8))
      foamCells.forEach(f => { f.setAttribute("x", snap(rand(1408, 1472))); f.setAttribute("y", snap(rand(562, 584))); });
    // 草叢、門簾隨風
    tuftTips.setAttribute("transform", `translate(${Math.round(wind * 1.2) * P},0)`);
    norenTips.forEach((tp, i) => tp.setAttribute("transform", `translate(${Math.round(wind * 1.5 + Math.sin(t * 3 + i) * .4) * P},0)`));
    // 貓尾巴
    catTail.style.display = Math.floor(t * 1.5) % 3 === 0 ? "none" : "";
    // 煙囪的煙
    chimneyT -= dt; if (chimneyT <= 0) { chimneyT = .4; puff(1048, 286, "smoke", P * 2, -18, 3.2, $("smokeBack")); }
    // 列車
    updateTrain(dt);
    exhaustT -= dt;
    if (train.state !== "away" && exhaustT <= 0) {
      exhaustT = train.state === "departing" ? .12 : train.state === "stopped" ? .5 : .2;
      const ex = train.x - TRAIN_LEN + CAR + 8 + 45;
      if (ex > 160) puff(ex, 310, train.state === "departing" ? "smoke-dk" : "smoke", P * 2, -26, 1.8, $("smokeTrain"));
    }
    // 人
    updatePlat(dt);
    if (master.wave > 0) {
      master.wave -= dt;
      flag.setAttribute("transform", `translate(0,${Math.floor(t * 6) % 2 ? -P * 2 : -P * 4})`);
      if (master.wave <= 0) flag.style.display = "none";
    }
    if (!plat.some(W => W.role === "wander")) addPlat("student", { U: "uniform" }, 300, { role: "wander", target: 600 });
    for (const W of walkers) {
      if (W.look > 0) { W.look -= dt; W.moving = false; if (W.look <= 0) W.dir = -1; }
      else {
        W.moving = true; W.x += W.dir * W.speed * dt; W.dist += W.speed * dt;
        if (W.dir > 0 && W.x > 1236) { W.look = 2.6; if (Math.random() < .5) bubble(W.x, 540, "好壯觀！"); }
        if (W.dir < 0 && W.x < -40) W.dir = 1;
      }
      drawPerson(W);
      if (W.dog) {
        const dx = snap(W.x + W.dir * 34);
        dog.g.setAttribute("transform", W.dir > 0 ? `translate(${dx - 16},572)` : `translate(${dx + 16},572) scale(-1,1)`);
        const f = W.moving ? Math.floor(W.dist / 7) % 2 : 0;
        dog.frames[0].style.display = f ? "none" : ""; dog.frames[1].style.display = f ? "" : "none";
        leash.setAttribute("x1", snap(W.x) + W.dir * 12); leash.setAttribute("y1", 560);
        leash.setAttribute("x2", dx + W.dir * 4); leash.setAttribute("y2", 578);
      }
    }
    // 車輛
    vehT -= dt; if (vehT <= 0) { vehT = rand(5, 11); spawnVehicle(); }
    for (let i = vehicles.length - 1; i >= 0; i--) {
      const v = vehicles[i]; v.x += v.dir * v.speed * dt; v.dist += v.speed * dt; v.bump -= dt;
      if (v.x < -400 || v.x > 2000) { v.g.remove(); vehicles.splice(i, 1); continue; }
      drawVehicle(v);
    }
    updatePuffs(dt);
    // 落葉：楓樹本身會落，強風時落更多
    leafT -= dt;
    if (leafT <= 0) { leafT = .5 / (1 + Math.abs(wind)); const m = pick(maples); leaf(m.cx + rand(-m.r, m.r), m.cy + rand(-m.r * .5, m.r * .4), m.ground + rand(-4, 10)); }
    updateLeaves(dt);
    for (const m of maples) if (m.shake > 0) { m.shake -= dt; m.crown.setAttribute("transform", `translate(${Math.floor(t * 20) % 2 ? P : -P},0)`); if (m.shake <= 0) m.crown.removeAttribute("transform"); }
    // 飛鳥、流星
    flockT -= dt; if (flockT <= 0) { flockT = rand(18, 34); if (n < .4) spawnFlock(); }
    meteorT -= dt; if (meteorT <= 0) { meteorT = rand(8, 16); if (n > .75) shootingStar(); }
    updateFlocks(dt); updateMeteors(dt);
  }
  // 螢火蟲（夜間）
  flies.forEach(F => {
    const k = reduced ? 0 : t;
    F.el.setAttribute("x", snap(F.x0 + Math.sin(k * F.sp + F.ph) * 24));
    F.el.setAttribute("y", snap(F.y0 + Math.cos(k * F.sp * 1.3 + F.ph) * 12));
    F.el.setAttribute("opacity", (clamp(n * 1.5 - .5, 0, 1) * (reduced ? .8 : .5 + .5 * Math.sin(t * 3 + F.ph * 3))).toFixed(2));
  });
  updateBubbles(dt);
  requestAnimationFrame(frame);
}

/* =========================================================
   【互動】
   ========================================================= */
function svgPoint(evt) {
  const p = svg.createSVGPoint(); p.x = evt.clientX; p.y = evt.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
svg.addEventListener("pointermove", e => { pointerIn = true; windTarget = (svgPoint(e).x / 1600 - .5) * 2.4; });
svg.addEventListener("pointerleave", () => { pointerIn = false; });
function callTrain() {
  if (train.state === "away") { train.timer = 0; if (reduced) { startArrival(); train.state = "stopped"; train.x = STOP_X; train.stopT = 0; } }
  else if (train.state === "stopped") bubble(STOP_X - 200, 320, "列車已經到站囉");
  else bubble(STOP_X - 200, 320, "列車行駛中");
}
const ACT = {
  train: (g, p) => bubble(p.x, 320, "叭——！"),
  master: () => { masterWave(); if (train.state === "stopped" && train.stopT < 6) train.stopT = 6; },
  signal: () => callTrain(),
  win: g => g._lit.classList.toggle("on"),
  lamp: g => { g._obj.on = !g._obj.on; },
  maple: (g, p) => { const m = g._obj; m.shake = .6; for (let i = 0; i < 14; i++) leaf(m.cx + rand(-m.r, m.r), m.cy + rand(-m.r * .6, m.r * .4), m.ground + rand(-4, 10)); },
  cat: () => bubble(336, 236, "喵～"),
  dog: (g, p) => bubble(p.x, 556, "汪！"),
  veh: (g, p) => { const v = g._obj; v.bump = .25; bubble(p.x, v.y - 70, v.kind === "bike" ? "鈴鈴！" : "叭叭！"); },
  walker: (g, p) => { const W = g._obj; if (W) bubble(p.x, W.y - 56, W.role === "wait" ? "等車中…" : pick(SAY)); }
};
svg.addEventListener("click", e => {
  const p = svgPoint(e);
  const a = e.target.closest("[data-act]");
  if (a && ACT[a.dataset.act]) { ACT[a.dataset.act](a, p); return; }
  if (p.y < 260) { // 點天空
    if (nightOf(phase) > .5) shootingStar(p.x - 120, p.y - 60);
    else { spawnFlock(p.x); }
  }
});

// 控制鈕
$("btnDayNight").addEventListener("click", () => {
  const n = nightOf(phase);
  const base = Math.floor(phase);
  let to = n > .5 ? base + 1 : base + .5;      // 夜→下一個正午；日→下一個午夜
  if (to <= phase) to += 1;
  tween = { from: phase, to, t: 0 };
});
$("btnAuto").addEventListener("click", () => {
  auto = !auto;
  $("btnAuto").setAttribute("aria-pressed", auto);
  $("btnAuto").textContent = "自動循環：" + (auto ? "開" : "關");
});
$("btnTrain").addEventListener("click", callTrain);

// 減少動態：停住自動循環，列車停在站內，人物靜止
function applyReduced() {
  reduced = RM_QUERY.matches;
  if (reduced) {
    auto = false; $("btnAuto").setAttribute("aria-pressed", "false"); $("btnAuto").textContent = "自動循環：關";
    train.state = "stopped"; train.x = STOP_X; train.stopT = 0; train.flags = { open: true, flag: true };
    updateTrain(0); train.state = "stopped";
  }
}
RM_QUERY.addEventListener && RM_QUERY.addEventListener("change", applyReduced);

/* =========================================================
   初始化
   ========================================================= */
addPlat("student", {}, 340, { role: "wander", target: 560 });
addPlat("grandma", {}, 940, { role: "wander", idle: 4 });
addWalker("grandma", { A: "coat3" }, 160, 1, 16);
const dw = addWalker("adult", { C: "coat2" }, 720, -1, 26, { dog: true });
$("pathPeople").appendChild(leash); $("pathPeople").appendChild(dog.g);
addWalker("hiker", {}, 1000, 1, 30);
spawnVehicle(); vehicles[0].x = vehicles[0].dir > 0 ? 300 : 1200;
applyNight(nightOf(phase), true);
clouds.forEach(c => c.g.setAttribute("transform", `translate(${c.x},${c.y})`));
updateTrain(0);
for (let i = 0; i < 12; i++) { const m = pick(maples); leaf(m.cx + rand(-m.r, m.r), m.cy + rand(0, m.ground - m.cy), m.ground); }
applyReduced();
if (reduced) { updateTrain(0); vehicles.forEach(drawVehicle); }
requestAnimationFrame(frame);
})();
</script>
