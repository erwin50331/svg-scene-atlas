/* =========================================================
   SC-52 蒸汽火車頭剖面｜藍晒圖風格
   主題：一台原創的 2-6-2 型蒸汽機車（車頭朝右、往右行駛）＋煤水車的側面剖面圖，
        停在小車站的月台邊。不使用任何鐵路公司名稱、車號或標誌。
   剖開的地方：火箱（爐火、爐排、磚拱、灰盤）、鍋爐（水、上百根煙管、過熱管）、
        汽包與調節閥、煙室（噴汽管、過熱器集管）、汽缸與汽門（活塞來回跑）、
        司機室（司機、司爐、壓力錶、水位計）、煤水車（煤堆與水櫃）。
   風格重點（藍晒圖 blueprint）：
        普魯士藍晒圖紙、白色墨線、45 度剖面斜線、中心線、尺寸線、比例尺；
        零件名稱用可愛的手寫字（內嵌「芫荽」字型子集）。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），部分另有 --k-名稱（晨昏）。
   JS 依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）。
   ========================================================= */
:root{
  color-scheme: light;

  /* —— 晒圖紙與線條（隨日夜變化） —— */
  --d-paper:#1f5c9f;   --k-paper:#36508e;   --n-paper:#0b1a37;    /* 晒圖紙底色 */
  --d-face:#2a6aad;    --k-face:#435c98;    --n-face:#0f2346;     /* 機件受光面 */
  --d-face-sh:#1a4f8b; --k-face-sh:#2f4479; --n-face-sh:#09162e;  /* 機件背光面 */
  --d-cut:#16467f;     --k-cut:#2a3d70;     --n-cut:#071329;      /* 剖開後的內部 */
  --d-line:#f1f6ff;    --k-line:#fbe9dc;    --n-line:#7fb1e2;     /* 白色墨線 */
  --d-water:#9fe0ff;   --n-water:#4f9fd6;                         /* 鍋爐與水櫃裡的水 */
  --d-win:#184a85;     --n-win:#ffd27a;                           /* 會亮燈的窗 */
  --d-glow:#1f5c9f00;  --k-glow:#ff9a6a;    --n-glow:#0b1a3700;   /* 晨昏地平線的暖光 */

  /* —— 光源、火與蒸汽（不隨日夜變化） —— */
  --sun:#fff1c4;
  --moon:#eaf2ff;
  --lamp:#ffc764;       /* 燈光 */
  --lamp-core:#fff3d2;
  --fire:#ff8a3d;       /* 爐火 */
  --fire-core:#ffe08a;
  --ember:#ff6a2a;      /* 火星 */
  --steam:#ffffff;      /* 飽和蒸汽 */
  --steam-hot:#ffb46b;  /* 過熱蒸汽 */
  --exhaust:#cfe0f6;    /* 廢汽 */
  --hotgas:#ff7a4a;     /* 爐火的熱氣 */
  --feed:#8fe3ff;       /* 給水 */
  --sand:#ffe08a;       /* 撒沙 */
  --signal:#ff5a4a;     /* 號誌燈 */
  --balloon:#ff8fb1;    /* 小女孩的氣球 */

  /* —— 天氣 —— */
  --fog:#dbe8f7;
  --rain:#d6e6ff;
  --snow:#ffffff;
  --wx-dark:#05112a;

  /* —— 頁面介面 —— */
  --page-bg:#e8eef6; --page-fg:#14325c; --page-muted:#5b6f8c;
  --ui-surface:#f6f9fd; --ui-line:#c2d0e3; --ui-accent:#1f5c9f;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  /* 圖上的零件名稱、尺寸：可愛手寫字（芫荽子集，沒載入時退回系統手寫體） */
  --font-hand:"IansuiSub","Iansui","Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS",cursive;
  --non:0;   /* 夜晚程度（JS 更新） */
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:6px;overflow:hidden;background:var(--paper);line-height:0;box-shadow:0 2px 10px #0000002a}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:10px;padding:10px 14px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--page-fg);border-color:var(--page-fg);color:#fff;font-weight:700}
.panel button.big{border-color:var(--ui-accent);color:#fff;background:var(--ui-accent);font-weight:700}
.panel button.big.on{background:#f2a33a;border-color:#f2a33a;color:#14325c}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid #ffd27a;outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 內的樣式（製圖線條） ---------- */
#scene .ln{fill:none;stroke:var(--line);stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}
#scene .lnT{fill:none;stroke:var(--line);stroke-width:.75;opacity:.8;stroke-linejoin:round;stroke-linecap:round}
#scene .lnB{fill:none;stroke:var(--line);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
#scene .cons{fill:none;stroke:var(--line);stroke-width:.55;opacity:.38}
#scene .ctr{fill:none;stroke:var(--line);stroke-width:.6;opacity:.55;stroke-dasharray:14 3 2 3}
#scene .dsh{fill:none;stroke:var(--line);stroke-width:.9;opacity:.75;stroke-dasharray:4 3}
#scene .fc{fill:var(--face)}
#scene .fcS{fill:var(--face-sh)}
#scene .fp{fill:var(--paper)}
#scene .fcut{fill:var(--cut)}
#scene .fl{fill:var(--line)}
#scene .hand{font-family:var(--font-hand);fill:var(--line);font-size:16px}
#scene .lbl text{font-family:var(--font-hand);fill:var(--line);font-size:17px;dominant-baseline:central}
#scene .lbl rect{fill:var(--paper);opacity:.82}
#scene .mono{font:600 10px ui-monospace,Menlo,Consolas,monospace;fill:var(--line)}
#scene .hot{cursor:pointer}
#scene .puff{fill:var(--steam);fill-opacity:.12;stroke:var(--line);stroke-width:.7;stroke-dasharray:3 2.5}
#scene .smoke{fill:var(--face-sh);fill-opacity:.35;stroke:var(--line);stroke-width:.7;stroke-dasharray:2 2.5}
#scene .night{opacity:var(--non)}
#scene .flow{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
#scene .bubble rect,#scene .tag rect{fill:var(--paper);stroke:var(--line);stroke-width:1.4}
#scene .bubble text{fill:var(--line);font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .tag text{fill:var(--line);font:700 13px var(--font-ui);dominant-baseline:central}
#scene .call rect{fill:var(--paper);stroke:var(--lamp);stroke-width:1.6}
#scene .call text{fill:var(--line);font:19px var(--font-hand);text-anchor:middle;dominant-baseline:central}
#scene .bubble .pop{animation:pop var(--dur,1.6s) ease-out forwards}
#scene .call{animation:fadeIn .5s ease-out both}
@keyframes pop{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  #scene .bubble .pop,#scene .call{animation:none}
}
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>

<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：晒圖紙 → 天空 → 遠山 → 田野 → 電線桿 → 車站後方（水鶴、燈柱、號誌）
       → 軌道 → 煤水車 → 機車（剖面）→ 蒸汽與煙 → 夜間燈光 → 表演流線
       → 月台與乘客（前景）→ 手寫標註與尺寸 → 速度錶 → 天氣 → 滑鼠標註 → 對話框 → 圖框
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="藍晒圖風格的蒸汽火車頭剖面圖動畫：普魯士藍晒圖紙上用白線畫出一台車頭朝右的蒸汽機車與煤水車，剖開火箱、鍋爐、煙管、過熱管、汽包、煙室、汽缸與活塞，每個零件都有手寫標註；司機與司爐在司機室裡，月台上有站長、旅客和小狗；點火車會冒出蒸汽、車輪與連桿轉動，開往下一站">
    <defs id="defs">
      <!-- 晒圖格線 -->
      <pattern id="gridMin" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M20 0H0V20" style="fill:none;stroke:var(--line)" stroke-width=".5" opacity=".08"/>
      </pattern>
      <pattern id="gridMaj" width="100" height="100" patternUnits="userSpaceOnUse">
        <path d="M100 0H0V100" style="fill:none;stroke:var(--line)" stroke-width=".8" opacity=".12"/>
      </pattern>
      <!-- 45 度剖面斜線 -->
      <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="6" style="stroke:var(--line)" stroke-width=".8" opacity=".42"/>
      </pattern>
      <pattern id="hatchD" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="3.2" style="stroke:var(--line)" stroke-width=".8" opacity=".75"/>
      </pattern>
      <!-- 水（水平細線） -->
      <pattern id="liq" width="10" height="5" patternUnits="userSpaceOnUse">
        <line x1="0" y1="2.5" x2="6" y2="2.5" style="stroke:var(--water)" stroke-width=".9" opacity=".75"/>
      </pattern>
      <!-- 月台的磚牆 -->
      <pattern id="brick" width="24" height="12" patternUnits="userSpaceOnUse">
        <path d="M0 0H24M0 6H24M6 0V6M18 6V12" style="fill:none;stroke:var(--line)" stroke-width=".6" opacity=".35"/>
      </pattern>
      <!-- 道碴 -->
      <pattern id="ballast" width="9" height="6" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.1" style="fill:none;stroke:var(--line)" stroke-width=".5" opacity=".5"/>
        <circle cx="6.5" cy="4.5" r="1" style="fill:none;stroke:var(--line)" stroke-width=".5" opacity=".45"/>
      </pattern>
      <!-- 煤塊 -->
      <pattern id="coalP" width="14" height="10" patternUnits="userSpaceOnUse">
        <path d="M1 6L4 2L8 3L9 7L5 9Z M9 2L13 1L13 5L10 5Z" style="fill:var(--face-sh);stroke:var(--line)" stroke-width=".6" opacity=".85"/>
      </pattern>
      <!-- 光暈 -->
      <radialGradient id="gLamp"><stop offset="0" stop-color="var(--lamp)" stop-opacity=".95"/><stop offset=".35" stop-color="var(--lamp)" stop-opacity=".35"/><stop offset="1" stop-color="var(--lamp)" stop-opacity="0"/></radialGradient>
      <radialGradient id="gFire"><stop offset="0" stop-color="var(--fire-core)" stop-opacity=".9"/><stop offset=".35" stop-color="var(--fire)" stop-opacity=".5"/><stop offset="1" stop-color="var(--fire)" stop-opacity="0"/></radialGradient>
      <radialGradient id="gRed"><stop offset="0" stop-color="var(--signal)" stop-opacity="1"/><stop offset=".3" stop-color="var(--signal)" stop-opacity=".4"/><stop offset="1" stop-color="var(--signal)" stop-opacity="0"/></radialGradient>
      <radialGradient id="gSun"><stop offset="0" stop-color="var(--sun)" stop-opacity=".5"/><stop offset="1" stop-color="var(--sun)" stop-opacity="0"/></radialGradient>
      <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></radialGradient>
      <linearGradient id="duskG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--glow)" stop-opacity="0"/><stop offset="1" stop-color="var(--glow)" stop-opacity=".75"/></linearGradient>
      <linearGradient id="fogG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--fog)" stop-opacity="0"/><stop offset=".5" stop-color="var(--fog)" stop-opacity=".6"/><stop offset="1" stop-color="var(--fog)" stop-opacity="0"/></linearGradient>
      <linearGradient id="beamG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--lamp-core)" stop-opacity=".6"/><stop offset="1" stop-color="var(--lamp-core)" stop-opacity="0"/></linearGradient>
    </defs>

    <!-- 晒圖紙：底色、斑駁、格線 -->
    <rect x="0" y="0" width="1600" height="600" class="f-paper"/>
    <image id="mottle" x="0" y="0" width="1600" height="600" preserveAspectRatio="none" href="" opacity=".55" pointer-events="none"/>
    <rect x="0" y="0" width="1600" height="600" fill="url(#gridMin)" pointer-events="none"/>
    <rect x="0" y="0" width="1600" height="600" fill="url(#gridMaj)" pointer-events="none"/>
    <rect id="dusk" x="0" y="160" width="1600" height="300" fill="url(#duskG)" opacity="0" pointer-events="none"/>

    <!-- 天空 -->
    <g id="stars" class="night"></g>
    <g id="sun"></g>
    <g id="moon"></g>
    <g id="clouds"></g>
    <g id="wxClouds" opacity="0"></g>
    <rect id="skyHit" x="0" y="0" width="1600" height="200" fill="transparent" role="button" tabindex="0" aria-label="天空：白天點了有鳥飛過，夜晚有流星"/>
    <g id="birds"></g>
    <!-- 遠景（會跟著火車行駛往後退） -->
    <g id="far" opacity=".7"></g>
    <g id="mid" opacity=".6"></g>
    <g id="poles"></g>
    <g id="behind"></g>
    <!-- 軌道與火車 -->
    <g id="track"></g>
    <g id="tender"></g>
    <g id="loco"></g>
    <g id="plumes" pointer-events="none"></g>
    <g id="glow" pointer-events="none"></g>
    <g id="show" pointer-events="none"></g>
    <!-- 前景：月台、橋、路邊 -->
    <g id="fore"></g>
    <!-- 手寫標註、尺寸、儀表 -->
    <g id="labels" pointer-events="none"></g>
    <g id="dims" pointer-events="none"></g>
    <g id="gauge"></g>
    <!-- 天氣 -->
    <g id="weather" pointer-events="none">
      <rect id="wxDark" x="0" y="0" width="1600" height="600" style="fill:var(--wx-dark)" opacity="0"/>
      <g id="fog" opacity="0"></g>
      <g id="rain" opacity="0"></g>
      <g id="snow" opacity="0"></g>
    </g>
    <!-- 滑鼠、表演標示、對話框 -->
    <g id="spot" pointer-events="none"></g>
    <g id="hover" pointer-events="none"></g>
    <g id="cross" pointer-events="none" opacity="0"></g>
    <g id="calls" pointer-events="none"></g>
    <g id="bubbles" pointer-events="none"></g>
    <rect x="0" y="0" width="1600" height="600" fill="url(#vig)" pointer-events="none"/>
    <!-- 圖框（雙線） -->
    <g pointer-events="none">
      <rect x="7" y="7" width="1586" height="586" class="ln" opacity=".55"/>
      <rect x="12" y="12" width="1576" height="576" class="lnT" opacity=".4"/>
      <path id="frameTicks" class="lnT" opacity=".5"/>
    </g>
  </svg>
  </figure>

  <!-- ===== 互動：控制列 ===== -->
  <div class="panel">
    <button id="btnExpress" class="big" type="button">🚂 全速前進</button>
    <button id="btnTour" class="big" type="button">🔍 剖面解說</button>
    <button id="btnWeather" type="button">天氣：晴</button>
    <button id="btnSound" type="button" aria-pressed="true">🔊 聲音：開</button>
    <button id="btnDay" type="button">☀ 白天</button>
    <button id="btnNight" type="button">☾ 夜晚</button>
    <button id="btnAuto" type="button" aria-pressed="true">自動播放</button>
    <label class="timebox" for="timeRange">
      <span>時間</span>
      <input id="timeRange" type="range" min="0" max="1000" value="417">
      <span class="clock" id="clock">10:00</span>

  </div>
  <ul class="hint">
    <li><b>點火車</b>：冒蒸汽、車輪轉起來，開往下一站。</li>
    <li><b>全速前進／剖面解說</b>：兩場配樂表演，看蒸汽怎麼推動車輪。</li>
    <li><b>點一點</b>：火箱、汽笛、安全閥、沙箱、頭燈、水鶴、月台上的人。</li>
    <li><b>滑鼠</b>：移到零件上，標出名稱與尺寸。</li>
    <li><b>天氣</b>：晴、陰、雨、雪、霧輪流切換。</li>
  </ul>
</main>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）

const clouds = [];
function cloudPath(w, h) {
  const n = Math.max(3, Math.round(w / 28));
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, x = w - t * w;
    const y = i === 0 || i === n ? 0 : -h * (.45 + .55 * Math.sin(Math.PI * t)) * srand(.75, 1);
    pts.push([x, y]);
  }
  let d = `M0 0H${f1(w)}`;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
    const r = Math.hypot(x1 - x0, y1 - y0) * .56;
    d += `A${f1(r)} ${f1(r)} 0 0 0 ${f1(x1)} ${f1(y1)}`;
  }
  return d + 'Z';
}

const DAY_SEC = 160;

let night = 0, dusk = 0, nOn = 0, lastApplied = -1, clock = 0;
function clockText() {
  const h = T.t * 24, hh = Math.floor(h) % 24, mm = Math.floor((h - Math.floor(h)) * 60 + 1e-6);
  return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
}
function applyTime(force) {
  if (!force && Math.abs(T.t - lastApplied) < .0003) return;
  lastApplied = T.t;
  const h = T.t * 24;
  night = clamp(1 - smooth(5.3, 7.2, h) + smooth(17.6, 19.4, h), 0, 1);
  dusk = Math.max(Math.exp(-Math.pow((h - 6.3) / .9, 2)), Math.exp(-Math.pow((h - 18.5) / .9, 2)));
  for (const k in PAIRS) {
    const Pp = PAIRS[k];
    let c = mix(Pp.d, Pp.n, night);
    if (Pp.k) c = mix(c, Pp.k, dusk * .8);
    root.style.setProperty('--' + k, rgba(c));
  }
  nOn = smooth(.3, .85, night);
  root.style.setProperty('--non', nOn.toFixed(3));
  $('dusk').setAttribute('opacity', f1(dusk));
  const sp = (h - 6) / 12.6, mp = ((h - 18.6 + 24) % 24) / 11.4;
  $('sun').setAttribute('transform', `translate(${f1(1460 - sp * 1300)} ${f1(250 - Math.sin(Math.PI * clamp(sp, 0, 1)) * 200)})`);
  $('sun').style.display = sp > -.06 && sp < 1.06 ? '' : 'none';
  $('moon').setAttribute('transform', `translate(${f1(1460 - mp * 1300)} ${f1(240 - Math.sin(Math.PI * clamp(mp, 0, 1)) * 190)})`);
  $('moon').style.display = mp > -.06 && mp < 1.06 ? '' : 'none';
  $('mottle').setAttribute('opacity', f1(.55 - nOn * .3));
  $('clock').textContent = clockText();
  if (!T.dragging) $('timeRange').value = Math.round(T.t * 1000);
  // 月台時鐘
  const hr = (h % 12) / 12 * Math.PI * 2 - Math.PI / 2, mn = (h % 1) * Math.PI * 2 - Math.PI / 2;
  PLAT.hh.setAttribute('d', `M330 398l${f1(Math.cos(hr) * 6)} ${f1(Math.sin(hr) * 6)}`);
  PLAT.mm.setAttribute('d', `M330 398l${f1(Math.cos(mn) * 9)} ${f1(Math.sin(mn) * 9)}`);
}

/* ---------------- ④ 動畫：行駛（加速、等速、減速） ----------------
   D：累積行駛距離（px）、v：速度（px/秒）。

const M = { D: 0, v: 0, run: null, reg: 0, regT: 0, lastBeat: 0, prevD: 0 };
function startRun(dist, dur, ta, tb, onEnd) {

function stepRun(dt) {
  const R = M.run;

  R.t += dt;
  const { t, dur, ta, tb, vmax } = R;
  let v;
  if (t < ta) v = vmax * (1 - Math.cos(Math.PI * t / ta)) / 2;

/* ---------------- ④ 動畫：連桿機構 ----------------

   x = Px + √(主連桿² − (Py − XY)²)；活塞跟著十字頭在汽缸裡來回；

  const pins = DRV.map(x => [x + CR * Math.cos(th), DY + CR * Math.sin(th)]);
  const [p1, p2, p3] = pins;
  // 連結桿
  const cd = `M${f1(p1[0] - 6)} ${f1(p1[1] - 4)}H${f1(p3[0] + 6)}V${f1(p3[1] + 4)}H${f1(p1[0] - 6)}Z`;
  B.cplF.setAttribute('d', cd); B.cpl.setAttribute('d', cd);
  pins.forEach((p, i) => { B.pins[i].setAttribute('cx', f1(p[0])); B.pins[i].setAttribute('cy', f1(p[1])); B.pinsL[i].setAttribute('cx', f1(p[0])); B.pinsL[i].setAttribute('cy', f1(p[1])); });
  // 十字頭、主連桿
  const X = p2[0] + Math.sqrt(ML * ML - Math.pow(p2[1] - XY, 2));
  const ux = (X - p2[0]) / ML, uy = (XY - p2[1]) / ML, nx = -uy, ny = ux;
  const md = `M${f1(p2[0] + nx * 5)} ${f1(p2[1] + ny * 5)}L${f1(X + nx * 3.5)} ${f1(XY + ny * 3.5)}L${f1(X - nx * 3.5)} ${f1(XY - ny * 3.5)}L${f1(p2[0] - nx * 5)} ${f1(p2[1] - ny * 5)}Z`;

  // 活塞

  // 汽缸裡的蒸汽：活塞往前跑時，後面那一格有蒸汽（反過來也一樣）

  B.stA.setAttribute('opacity', f1(dir > 0 ? steamOn : 0)); B.stB.setAttribute('opacity', f1(dir < 0 ? steamOn : 0));

  B.valveRod.setAttribute('d', `M${f1(xv - 60)} 387H${f1(xv + 13)}`);
  const ret = [p2[0] + 12 * Math.cos(th - Math.PI / 2), p2[1] + 12 * Math.sin(th - Math.PI / 2)];
  const psi = .32 * Math.sin(th);

  B.ecc.setAttribute('d', `M${f1(ret[0])} ${f1(ret[1])}L${f1(foot[0])} ${f1(foot[1])}`);
  B.link.setAttribute('d', `M${f1(top[0])} ${f1(top[1])}L${f1(foot[0])} ${f1(foot[1])}`);
  B.radius.setAttribute('d', `M${f1(1150 - 4 * Math.sin(psi))} ${f1(388 - 4 * Math.cos(psi))}L${f1(xv - 60)} 387`);
  B.comb.setAttribute('d', `M${f1(xv - 60)} 384L${f1(X + 4)} ${XY + 8}`);
  return th;
}

/* ---------------- ④ 動畫：表演秀 ----------------

/* ---------------- 聲音（Web Audio，原創音效與配樂） ----------------
   分「音樂軌」與「音效軌」：音樂響時音效轉小聲；「聲音關」立即全停。
   火車只有在你點汽笛時才會鳴笛。 */
function ensureAudio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
    master = actx.createGain(); master.gain.value = soundOn ? .5 : 0;
    const comp = actx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3;
    master.connect(comp); comp.connect(actx.destination);
    sfxBus = actx.createGain(); sfxBus.connect(master);
    musBus = actx.createGain(); musBus.gain.value = .64; /* 音樂軌音量 ×0.64（2026-11-24 兩次各調降 20%） */ musBus.connect(master);
  }

}
const audioOK = () => actx && actx.state === 'running' && soundOn;
function newTrack(kind) {
  const bus = kind === 'mus' ? musBus : sfxBus;
  const g = actx.createGain(); g.connect(bus);
  if (kind === 'mus') {
    const old = musNode;
    if (old) { old.gain.setTargetAtTime(0, actx.currentTime, .15); setTimeout(() => { try { old.disconnect(); } catch (e) {} }, 900); }

let OUT = null;
function nbuf() {

  return noiseBuf;
}

}

  s.connect(f); f.connect(gainEnv(t, a, dur, vol)); s.start(t, Math.random()); s.stop(t + a + dur + .1); return f;

/* 「全速前進」配樂（原創，約 20 秒）：G 大調、每分鐘 140 拍的火車節奏，

function expressMusic(t) {

function stepPeople(dt) {
  const base = wx => 20 + mod(wx - M.D + 700, P) - 700;
  people.forEach(f => {
    f.ph += dt;
    f.wave = Math.max(0, f.wave - dt);
    const sx = base(f.wx) + f.off;
    f.x = sx;
    f.a1 = .2 + Math.sin(f.ph * .9) * .04; f.a2 = -.12; f.bend = Math.sin(f.ph * .5) * .02; f.leg = 0;
    if (f.kind === 'master') { f.acc = nOn > .5 ? 'lantern' : 'flag'; if (M.run || f.wave > 0) { f.a1 = 2.6 + Math.sin(f.ph * 6) * .2; } }
    if (f.kind === 'oiler') { f.a1 = .6 + Math.abs(Math.sin(f.ph * 2.2)) * .6; f.bend = .25; if (Math.floor(f.ph * 2.2 / Math.PI) !== f.lastTap) { f.lastTap = Math.floor(f.ph * 2.2 / Math.PI); if (M.v < 1 && f.wave <= 0 && Math.random() < .25 && audioOK() && f.x > 0 && f.x < 1600) sfx(t => bell(t, 1250, .015, .3)); } }
    if (f.kind === 'fan') { f.a1 = (M.run || f.wave > 0) ? 2.4 : .3; f.a2 = (M.run || f.wave > 0) ? 2.2 : -.1; }
    if (f.kind === 'girl') { f.a1 = 2.2 + Math.sin(f.ph * 1.5) * .1; if (M.run || f.wave > 0) f.a2 = 2.6 + Math.sin(f.ph * 9) * .4; if (f.balloon) { f.bal.setAttribute('cx', f1(f.balloon[0])); f.bal.setAttribute('cy', f1(f.balloon[1])); } }
    if (f.kind === 'mom') { f.a2 = .05; if (M.run || f.wave > 0) f.a1 = 2.5 + Math.sin(f.ph * 7) * .3; }
    if (f.kind === 'porter') { f.a1 = .4; if (CRANE.fill > 0) { f.a1 = 2.4; f.a2 = 2.3; } }
    if (f.kind === 'pack' && M.v < 1) {

      f.off += f.walk * 26 * dt;

      f.face = f.walk; f.leg = Math.sin(f.ph * 7) * .35; f.a1 = Math.sin(f.ph * 7) * .3; f.a2 = -Math.sin(f.ph * 7) * .3;
    }
  });
  if (dog) {

    else d.run = Math.max(0, d.run - dt * 2);
    const sx = 20 + mod(d.wx - M.D + 700, P) - 700 + d.off;
    const sw = d.run ? Math.sin(d.ph * 16) * 5 : 0;
    d.legs.setAttribute('d', `M-9 -12L${f1(-9 + sw)} 0M-4 -12L${f1(-4 - sw)} 0M8 -12L${f1(8 - sw)} 0M13 -12L${f1(13 + sw)} 0`);
    const wag = Math.sin(d.ph * (d.bark > 0 || d.run ? 18 : 6)) * 5;
    d.tail.setAttribute('d', `M-13 -18Q-20 -24 ${f1(-16 + wag * .4)} ${f1(-29 + Math.abs(wag) * .3)}`);
    d.g.setAttribute('transform', `translate(${f1(sx)} ${520 - (d.bark > 0 ? Math.abs(Math.sin(d.ph * 12)) * 4 : 0)}) scale(${d.face} 1)`);
  }

  const ms = people.find(p => p.kind === 'master');
  if (ms && ms.pts && ms.acc === 'lantern') { GL.lantern.setAttribute('cx', f1(ms.x + ms.face * ms.pts.h1[0])); GL.lantern.setAttribute('cy', f1(ms.y + ms.pts.h1[1] + 11)); GL.lantern.setAttribute('opacity', f1(nOn)); }
  else GL.lantern.setAttribute('opacity', 0);
}

let hoverEl = null;
function bboxOf(n) {
  const b = n.getBBox(), m = svg.getScreenCTM().inverse().multiply(n.getScreenCTM());

  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  return { x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys) };
}
function drawHover(n) {

let last = 0, rafId = 0;
function loop(now) {
  const dt = clamp((now - last) / 1000, 0, .05); last = now;
  step(dt);
  rafId = requestAnimationFrame(loop);
}
function settle(sec) { for (let s = 0; s < sec; s += .05) step(.05); }
function renderStill() { step(.0001); }
function start() {
  cancelAnimationFrame(rafId);
  if (reduced) { T.auto = false; syncAuto(); applyTime(true); settle(2); }
  else { last = performance.now(); rafId = requestAnimationFrame(loop); }
}

function bindPeople() {
  people.forEach(f => onAct(f.g, () => {
    f.wave = 2;
    const sx = f.x;
    const L = {
      master: night > .6 ? ['提燈巡月台', '晚班列車注意安全'] : ['嗶——發車！', '各位旅客請退到黃線後'],
      oiler: ['叮叮！車輪聲音清脆，沒有裂痕', '軸箱的油也加好了'],
      fan: ['喀嚓！這張拍得好', '蒸汽火車最好看的是連桿'],
      girl: ['好大的火車！', '噗噗噗～', '火車會噴雲耶！'],
      mom: ['要去外婆家囉', '行李拿好喔'],
      pack: ['下一站要去山上', '搭蒸汽火車旅行好浪漫'],
      porter: ['水鶴準備好了', '要加水嗎？點水鶴就好']
    }[f.kind];
    say(sx, 400, pick(L), 1.8);
    if (f.kind === 'master') { sfx(peep); if (!M.run && !show.on) setTimeout(() => depart('master'), 900); }
    if (f.kind === 'fan') sfx(shutter);
    if (f.kind === 'oiler') sfx(t => { bell(t, 1250, .05, .4); bell(t + .25, 1250, .05, .4); });
  }));
  if (dog) onAct(dog.g, () => { dog.bark = 1.2; sfx(bark); say(20 + mod(dog.wx - M.D + 700, P) - 700 + dog.off, 450, pick(['汪！汪！', '汪～（搖尾巴）']), 1.4); });
}

/* ---------------- ⑤ 互動：控制列 ---------------- */
function syncAuto() { $('btnAuto').setAttribute('aria-pressed', String(T.auto)); $('btnAuto').textContent = T.auto ? '自動播放中' : '自動播放'; }
function goTo(t) { if (reduced) { T.t = t; applyTime(true); renderStill(); } else T.target = t; }
const tap = fn => () => { userGesture = true; ensureAudio(); setTimeout(() => { fn(); if (reduced) settle(22); }, actx && actx.state !== 'running' ? 120 : 0); };
$('btnExpress').addEventListener('click', tap(startExpress));
$('btnTour').addEventListener('click', tap(startTour));
$('btnWeather').addEventListener('click', () => {
  userGesture = true; ensureAudio();
  wxI = (wxI + 1) % WX_LIST.length;
  $('btnWeather').textContent = '天氣：' + WX_LIST[wxI][1];
  if (reduced) { applyWeather(0); renderStill(); }
});
$('btnSound').addEventListener('click', () => {
  soundOn = !soundOn; userGesture = true;
  $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  if (ensureAudio()) {
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.setValueAtTime(soundOn ? .5 : 0, actx.currentTime);
    if (!soundOn && musNode) { try { musNode.disconnect(); } catch (e) {} musNode = null; }
  }
});
$('btnDay').addEventListener('click', () => goTo(10 / 24));
$('btnNight').addEventListener('click', () => goTo(21 / 24));
$('btnAuto').addEventListener('click', () => { T.auto = !T.auto; T.target = null; syncAuto(); });
$('timeRange').addEventListener('input', e => {
  T.t = e.target.value / 1000; T.target = null; T.dragging = true; applyTime(true); T.dragging = false;
  if (reduced) renderStill();
});
mq.addEventListener?.('change', e => { reduced = e.matches; if (!reduced) { T.auto = true; syncAuto(); } start(); });

applyTime(true);
applyWeather(0);
syncAuto();
settle(2);
start();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on,
  btn: { express: 'btnExpress', tour: 'btnTour' },
  ff: () => { show.fired = new Proxy({}, { get: () => 1 }); show.t = show.dur + .1; if (M.run) M.run.t = M.run.dur; },   // 火車直接到站、表演收尾
  save: () => ({ ...T }),
  stop: () => { M.run = null; endShow(); },
  restore: s => { Object.assign(T, s); syncAuto(); applyTime(true); renderStill(); }
});
/* /ShowStop */
})();
</script>
