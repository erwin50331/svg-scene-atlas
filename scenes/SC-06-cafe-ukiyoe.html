<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SC-06 坂上咖啡</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
/* =========================================================
   SC-06 坂上咖啡｜浮世繪色塊風格
   【色票 token】所有顏色集中在這裡。
   - 場景色成對出現：--名稱-day / --名稱-night，
     JS 會依「日夜比例」自動混色，輸出成 --名稱 給 SVG 使用，
     並自動產生 .f-名稱（填色）、.s-名稱（描邊）兩種 class。
   - 「常亮色」不參與混色（燈光、店內、題簽、太陽月亮）。
   換色時只需改這個區塊。
   風格重點：普魯士藍天空漸層（ぼかし）、橫向霞帶、粗墨線輪廓、平塗色塊、和紙紋理。
   ========================================================= */
:root{
  color-scheme:dark;

  /* ---- 頁面外框（單一深色主題） ---- */
  --page-bg:#18171f;
  --page-panel:#22202b;
  --page-fg:#f1e7d3;
  --page-dim:#aaa294;
  --page-line:#363244;
  --page-accent:#e0563b;
  --font-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;

  /* ---- 天空、霞、遠山 ---- */
  --sky-top-day:#24508a;   --sky-top-night:#08122e;
  --sky-mid-day:#7fb0c8;   --sky-mid-night:#16295a;
  --sky-bot-day:#f2e3c0;   --sky-bot-night:#2c3367;
  --kasumi-day:#f1b79c;    --kasumi-night:#3e3570;
  --kasumi2-day:#ead08a;   --kasumi2-night:#2f3263;
  --cloud-day:#fbf3df;     --cloud-night:#38406f;
  --mtn-day:#6f95ad;       --mtn-night:#1a2650;
  --mtn2-day:#8fb0be;      --mtn2-night:#222f5a;
  --snow-day:#f7f0e1;      --snow-night:#8790bb;
  --hill-day:#5d8a72;      --hill-night:#152a38;
  --pine-day:#2c5843;      --pine-night:#0d201e;

  /* ---- 建築 ---- */
  --back-wall-day:#dcc9a2; --back-wall-night:#322f55;
  --back-roof-day:#4c5d72; --back-roof-night:#141a33;
  --wall-day:#f0e2c3;      --wall-night:#4a4468;   /* 白灰泥牆 */
  --wall2-day:#c26b48;     --wall2-night:#4a2b3c;  /* 紅殼格子色 */
  --wood-day:#6a4330;      --wood-night:#251924;
  --wood-lt-day:#a36d44;   --wood-lt-night:#3b2a32;
  --roof-day:#3a4c64;      --roof-night:#121830;
  --roof-lt-day:#62778f;   --roof-lt-night:#232b4b;
  --awn-a-day:#22447a;     --awn-a-night:#121f45;  /* 藍染 */
  --awn-b-day:#f3e7ca;     --awn-b-night:#5b5577;
  --noren-day:#9e2e29;     --noren-night:#4c1c27;
  --glass-day:#a9cdd3;     --glass-night:#20365a;
  --win-off-day:#e9dcbc;   --win-off-night:#2c2b4c; /* 障子未點燈 */
  --brick-day:#9b4a35;     --brick-night:#3d2130;

  /* ---- 街道 ---- */
  --road-day:#b9a888;      --road-night:#28273f;
  --stone-day:#d6c8aa;     --stone-night:#393859;
  --stone-ln-day:#978768;  --stone-ln-night:#1c1b31;
  --walk-day:#e0d3b5;      --walk-night:#3e3c5e;
  --rail-day:#5d5b5a;      --rail-night:#1b1c30;
  --metal-day:#4b5560;     --metal-night:#1c2033;

  /* ---- 楓樹與植物 ---- */
  --maple-day:#d7432a;     --maple-night:#6c2333;
  --maple2-day:#ee8a2c;    --maple2-night:#773832;
  --maple3-day:#a92c2a;    --maple3-night:#4d1b29;
  --gold-day:#e7b53c;      --gold-night:#6e5a34;
  --trunk-day:#4a3125;     --trunk-night:#18111d;
  --green-day:#5e8a58;     --green-night:#1d3833;

  /* ---- 人物、動物、車輛 ---- */
  --skin-day:#f1cfac;      --skin-night:#9b8280;
  --hair-day:#1f1a1c;      --hair-night:#0c0a12;
  --cloth1-day:#2d4c7c;    --cloth1-night:#17254a;  /* 藍 */
  --cloth2-day:#b3463a;    --cloth2-night:#52252e;  /* 朱 */
  --cloth3-day:#d9a447;    --cloth3-night:#695336;  /* 黃土 */
  --cloth4-day:#4e7b5d;    --cloth4-night:#1e3a33;  /* 松葉 */
  --cloth5-day:#7b5b8c;    --cloth5-night:#35294a;  /* 紫 */
  --cloth6-day:#e8dcc0;    --cloth6-night:#57536f;  /* 生成 */
  --umb1-day:#d6533a;      --umb1-night:#8c3436;
  --umb2-day:#2f5f92;      --umb2-night:#1d3863;
  --umb3-day:#e6b43e;      --umb3-night:#8a7038;
  --umb4-day:#4f8f74;      --umb4-night:#24493f;
  --cat-day:#f6eedc;       --cat-night:#8e8aa8;
  --tram-a-day:#2e6a5a;    --tram-a-night:#14322e;
  --tram-b-day:#efdfbb;    --tram-b-night:#56516d;
  --sumi-day:#211b26;      --sumi-night:#06050e;   /* 墨線 */
  --smoke-day:#f6efe2;     --smoke-night:#5c5f86;
  --rain-day:#3e5a7a;      --rain-night:#a9b6e8;

  /* ---- 常亮色（不隨日夜混色） ---- */
  --win-on:#ffcf73;     /* 窗內暖光 */
  --lamp:#ffe1a0;       /* 街燈 */
  --lantern:#e8553a;    /* 提燈 */
  --sun:#e2472e;        /* 浮世繪紅日 */
  --moon:#fff1c2;       /* 月 */
  --star:#fff6d8;
  --dusk:#ff8a4c;       /* 夕燒 */
  --spark:#9fe6ff;      /* 電車集電弓火花 */
  --in-wall:#c9935c;    /* 店內牆 */
  --in-wall2:#a8703f;
  --in-wood:#5d3a26;    /* 吧台 */
  --in-cream:#f6ead0;
  --cup:#fbf6ea;        /* 杯子 */
  --coffee:#5a3320;
  --paper:#f3e4b8;      /* 題簽底色 */
  --seal:#c8372a;       /* 印章朱 */
}

/* ===== 頁面版面 ===== */
html,body{margin:0;background:var(--page-bg);color:var(--page-fg)}
body{font-family:var(--font-body);line-height:1.6}
.wrap{max-width:1680px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
h1{font-family:var(--font-display);font-weight:900;font-size:clamp(1.4rem,2.6vw,2rem);margin:0;letter-spacing:.04em;text-wrap:balance}
h1 small{font-size:.55em;font-weight:700;color:var(--page-accent);letter-spacing:.12em;margin-right:.6em}
.meta{color:var(--page-dim);font-size:.9rem;margin:0}
.stage{position:relative;border-radius:6px;overflow:hidden;background:#000;
  box-shadow:0 0 0 1px var(--page-line),0 18px 40px -18px #000}
.stage svg{display:block;width:100%;height:auto;max-width:100%;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.controls button{font:500 .95rem/1 var(--font-body);color:var(--page-fg);background:var(--page-panel);
  border:1px solid var(--page-line);border-radius:3px;padding:10px 16px;cursor:pointer;
  box-shadow:0 3px 0 -1px #0007;transition:transform .12s,background .2s}
.controls button:hover{background:#2d2a39}
.controls button:active{transform:translateY(2px)}
.controls button:focus-visible{outline:2px solid var(--page-accent);outline-offset:2px}
.controls button[aria-pressed="true"]{border-color:var(--page-accent);color:#fff}
.clock{margin-left:auto;font-family:var(--font-display);font-size:1rem;color:var(--page-dim);font-variant-numeric:tabular-nums}
.hint{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px 20px;color:var(--page-dim);font-size:.88rem}
.hint b{color:var(--page-fg);font-weight:500;margin-right:.4em}

/* ===== SVG 內樣式 ===== */
.ink{stroke:var(--sumi);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.ink-thin{stroke:var(--sumi);stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}
.serif{font-family:var(--font-display);font-weight:900}
.lit{fill:var(--win-on);opacity:0;transition:opacity .35s}
.lit.on{opacity:var(--lit,.2)}
.win2,.walker,.vehicle,#tram,#cat,#maple,#counterWin,.cupHit,#lantern{cursor:pointer}
.bubble text{font-family:var(--font-display);font-weight:900;font-size:17px;fill:var(--sumi-day)}
.bubble{animation:pop 1.8s ease-out forwards;pointer-events:none}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}12%{opacity:1;transform:translateY(0)}75%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.steam path{fill:none;stroke:var(--smoke);stroke-width:2.2;stroke-linecap:round;opacity:0;animation:steam 3.2s ease-out infinite}
.steam path:nth-child(2){animation-delay:1.05s}.steam path:nth-child(3){animation-delay:2.1s}
@keyframes steam{0%{opacity:0;transform:translateY(0)}30%{opacity:.8}100%{opacity:0;transform:translateY(-22px)}}

/* ===== 減少動態：關閉 CSS 動畫（JS 端另行停住行人、車、落葉） ===== */
@media (prefers-reduced-motion: reduce){
  .steam path{animation:none;opacity:.5}
  .bubble{animation:none}
  .lit{transition:none}
  .controls button{transition:none}
}
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>
</head>
<body>
<main class="wrap">

  <div class="stage">
  <!-- =====================================================
       【場景】SVG 主舞台 viewBox 1600×600
       圖層由後到前：天空 → 日月星 → 雲與霞 → 遠山 → 丘陵松林 → 後排町屋
       → 左側店家 → 咖啡店 → 楓樹 → 電車站 → 電線 → 街道 → 光暈
       → 後側行人 → 電車 → 腳踏車 → 前側行人 → 落葉 → 雨 → 前景楓枝 → 題簽 → 和紙紋
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img" aria-label="浮世繪風格的坡道咖啡店，楓樹落葉、路面電車與行人，可切換白天與夜晚">
    <defs>
      <!-- 天空ぼかし：上深下淺 -->
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-top)"/>
        <stop offset=".22" style="stop-color:var(--sky-top)"/>
        <stop offset=".5" style="stop-color:var(--sky-mid)"/>
        <stop offset=".78" style="stop-color:var(--sky-bot)"/>
      </linearGradient>
      <linearGradient id="duskGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset=".25" style="stop-color:var(--dusk);stop-opacity:0"/>
        <stop offset="1" style="stop-color:var(--dusk);stop-opacity:1"/>
      </linearGradient>
      <radialGradient id="glowGrad">
        <stop offset="0" style="stop-color:var(--lamp);stop-opacity:.85"/>
        <stop offset="1" style="stop-color:var(--lamp);stop-opacity:0"/>
      </radialGradient>
      <radialGradient id="redGlow">
        <stop offset="0" style="stop-color:var(--lantern);stop-opacity:.6"/>
        <stop offset="1" style="stop-color:var(--lantern);stop-opacity:0"/>
      </radialGradient>
      <radialGradient id="moonGlow">
        <stop offset=".4" style="stop-color:var(--moon);stop-opacity:.35"/>
        <stop offset="1" style="stop-color:var(--moon);stop-opacity:0"/>
      </radialGradient>
      <radialGradient id="vignette" cx=".5" cy=".5" r=".75">
        <stop offset=".62" stop-color="#000" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity=".35"/>
      </radialGradient>

      <!-- 圖樣：屋瓦、藍白條紋遮陽、石板、格子、青海波 -->
      <pattern id="tiles" width="11" height="12" patternUnits="userSpaceOnUse">
        <rect width="11" height="12" class="f-roof"/>
        <line x1="1" y1="0" x2="1" y2="12" class="s-roof-lt" stroke-width="3"/>
      </pattern>
      <pattern id="backTiles" width="9" height="10" patternUnits="userSpaceOnUse">
        <rect width="9" height="10" class="f-back-roof"/>
        <line x1="1" y1="0" x2="1" y2="10" class="s-roof" stroke-width="2"/>
      </pattern>
      <pattern id="stripe" width="32" height="30" patternUnits="userSpaceOnUse">
        <rect width="32" height="30" class="f-awn-b"/>
        <rect width="16" height="30" class="f-awn-a"/>
      </pattern>
      <pattern id="cobble" width="44" height="16" patternUnits="userSpaceOnUse">
        <rect width="44" height="16" class="f-road"/>
        <path d="M0,.5 H44 M14,0 V8 M36,8 V16 M0,8.5 H44" class="s-stone-ln" stroke-width="1.4" fill="none"/>
      </pattern>
      <pattern id="paving" width="60" height="20" patternUnits="userSpaceOnUse">
        <rect width="60" height="20" class="f-walk"/>
        <path d="M0,.5 H60 M30,0 V10 M0,10.5 H60 M10,10 V20" class="s-stone-ln" stroke-width="1.2" fill="none" opacity=".7"/>
      </pattern>
      <pattern id="koshi" width="8" height="10" patternUnits="userSpaceOnUse">
        <rect width="8" height="10" class="f-wood"/>
        <rect x="1.5" width="3" height="10" class="f-wood-lt"/>
      </pattern>
      <pattern id="seigaiha" width="24" height="12" patternUnits="userSpaceOnUse">
        <rect width="24" height="12" class="f-awn-a"/>
        <g fill="none" class="s-awn-b" stroke-width="1.2">
          <path d="M0,12 a12,12 0 0 1 24,0 M4,12 a8,8 0 0 1 16,0 M8,12 a4,4 0 0 1 8,0"/>
          <path d="M-12,6 a12,12 0 0 1 24,0 M12,6 a12,12 0 0 1 24,0"/>
        </g>
      </pattern>
      <pattern id="shoji" width="20" height="18" patternUnits="userSpaceOnUse">
        <path d="M0,.5 H20 M.5,0 V18" class="s-wood" stroke-width="1.4" fill="none"/>
      </pattern>

      <!-- 和紙纖維紋理 -->
      <filter id="washi" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".85 .35" numOctaves="2" seed="6"/>
        <feColorMatrix values="0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .3  0 0 0 .55 -.18"/>
      </filter>
      <!-- 店內窗戶裁切 -->
      <clipPath id="clipWinL"><rect x="562" y="342" width="196" height="88"/></clipPath>
      <clipPath id="clipWinR"><rect x="872" y="342" width="156" height="88"/></clipPath>
      <clipPath id="clipRoof"><polygon points="520,202 1070,202 1010,142 580,142"/></clipPath>
      <clipPath id="clipStage"><rect width="1600" height="600"/></clipPath>
      <!-- 楓葉形狀（落葉與樹冠點綴共用） -->
      <path id="leafShape" d="M0,-9 L2,-4 L7,-6 L5,-1 L9,1 L4,2 L5,7 L1,4 L0,9 L-1,4 L-5,7 L-4,2 L-9,1 L-5,-1 L-7,-6 L-2,-4 Z"/>
    </defs>

    <g clip-path="url(#clipStage)">
    <!-- 天空 -->
    <rect width="1600" height="600" fill="url(#skyGrad)"/>
    <rect id="dusk" width="1600" height="360" fill="url(#duskGrad)" opacity="0"/>
    <g id="stars"></g>

    <!-- 太陽與月亮（JS 依時間移動） -->
    <g id="sun"><circle r="38" style="fill:var(--sun)"/></g>
    <g id="moon">
      <circle r="80" fill="url(#moonGlow)"/>
      <circle r="32" style="fill:var(--moon)" class="ink-thin"/>
      <circle cx="-9" cy="-6" r="6" style="fill:var(--moon)" opacity=".6" stroke="#d9c88f" stroke-width="1"/>
      <circle cx="10" cy="9" r="4" style="fill:var(--moon)" stroke="#d9c88f" stroke-width="1"/>
    </g>
    <g id="shooting"></g>

    <!-- 雲（浮世繪捲雲，JS 生成） -->
    <g id="clouds"></g>

    <!-- 遠山：中央偏右一座雪頂高峰 -->

<script>

"use strict";
/* =========================================================

const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const svg = $("scene");
const root = document.documentElement;
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
// 固定亂數種子，讓每次載入的背景長一樣
function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const R = rng(20261106);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const RM_QUERY = window.matchMedia("(prefers-reduced-motion: reduce)");
let reduced = RM_QUERY.matches;

/* =========================================================
   【色票】日夜混色引擎
   讀取 --名稱-day / --名稱-night，依 night(0~1) 混色寫回 --名稱。
   ========================================================= */
const MIX = ["sky-top","sky-mid","sky-bot","kasumi","kasumi2","cloud","mtn","mtn2","snow","hill","pine",
  "back-wall","back-roof","wall","wall2","wood","wood-lt","roof","roof-lt","awn-a","awn-b","noren","glass","win-off","brick",
  "road","stone","stone-ln","walk","rail","metal",
  "maple","maple2","maple3","gold","trunk","green",
  "skin","hair","cloth1","cloth2","cloth3","cloth4","cloth5","cloth6","umb1","umb2","umb3","umb4","cat",
  "tram-a","tram-b","sumi","smoke","rain"];
(function injectClasses() {
  const css = MIX.map(n => `.f-${n}{fill:var(--${n})}.s-${n}{stroke:var(--${n})}`).join("");
  const st = document.createElement("style"); st.textContent = css; document.head.appendChild(st);
})();
const cs = getComputedStyle(root);
const hex = s => { s = s.trim().replace("#",""); if (s.length === 3) s = s.split("").map(c => c + c).join(""); const n = parseInt(s,16); return [n>>16&255, n>>8&255, n&255]; };
const PAIRS = MIX.map(n => [n, hex(cs.getPropertyValue(`--${n}-day`)), hex(cs.getPropertyValue(`--${n}-night`))]);
let lastApplied = -1;
function applyNight(nt, force) {
  if (!force && Math.abs(nt - lastApplied) < 0.004) return;
  lastApplied = nt;
  for (const [n, a, b] of PAIRS) {
    const c = a.map((v, i) => Math.round(v + (b[i] - v) * nt));
    root.style.setProperty(`--${n}`, `rgb(${c[0]},${c[1]},${c[2]})`);
  }
  root.style.setProperty("--lit", (0.12 + 0.88 * nt).toFixed(3));
  document.querySelectorAll(".nightOnly").forEach(e => e.style.opacity = nt.toFixed(3));
  document.querySelectorAll(".glassDay").forEach(e => e.style.opacity = (0.55 * (1 - nt)).toFixed(3));
  $("stars").style.opacity = Math.max(0, nt * 1.5 - .5).toFixed(3);
  $("backLights").style.opacity = Math.max(0, nt * 1.4 - .4).toFixed(3);
  const tw = Math.max(0, 1 - Math.abs(nt - .45) * 3.4);
  $("dusk").setAttribute("opacity", (tw * .55).toFixed(3));
}

/* =========================================================
   【場景】星星、雲、霞、松林、後排町屋
   ========================================================= */
(function buildStars() {
  const g = $("stars");
  for (let i = 0; i < 80; i++) {
    const r = R() < .15 ? 1.8 : .9 + R() * .6;
    el("circle", { cx: R() * 1600, cy: R() * 250, r, style: "fill:var(--star)", opacity: .5 + R() * .5 }, g);
  }
})();
const clouds = [];
(function buildClouds() {
  // 浮世繪捲雲：一排圓弧堆成扁長雲，加墨線
  const g = $("clouds");
  [[160,92,1],[620,58,.8],[1040,104,1.1],[1380,70,.75]].forEach(([x, y, s]) => {
    const c = el("g", {}, g);
    const w = 220 * s;
    let d = `M${-w/2},0 `;
    const n = 6;
    for (let i = 0; i < n; i++) { const step = w / n; d += `a${step/2},${(step/2)*.8} 0 0 1 ${step},0 `; }
    d += `Q${w/2+20},10 ${w/2-10},14 H${-w/2+14} Q${-w/2-18},10 ${-w/2},0 Z`;
    el("path", { d, class: "f-cloud ink-thin" }, c);
    el("path", { d: `M${-w/2+20},6 H${w/2-30}`, class: "s-kasumi", "stroke-width": 2, fill: "none", opacity: .6 }, c);
    clouds.push({ g: c, x, y, sp: 4 + R() * 5 });
  });
})();
const kasumis = [];
(function buildKasumi() {
  // 霞帶：圓頭長條、帶階梯缺口，是浮世繪最具代表性的元素
  const g = $("kasumi");
  [[100,232,520,"f-kasumi"],[760,254,440,"f-kasumi2"],[1180,224,380,"f-kasumi"],[-200,282,600,"f-kasumi2"],[980,292,520,"f-kasumi"]].forEach(([x, y, w, cls]) => {
    const h = 18;
    const d = `M0,${h/2} a${h/2},${h/2} 0 0 1 ${h/2},-${h/2} H${w*.45} v-6 H${w*.75} v6 H${w-h/2} a${h/2},${h/2} 0 0 1 0,${h} H${w*.3} v5 H${h/2} a${h/2},${h/2} 0 0 1 -${h/2},-${h/2} Z`;
    const p = el("path", { d, class: cls, opacity: .88 }, g);
    kasumis.push({ e: p, x, y, w, sp: 3 + R() * 4 });
  });
})();
function pine(g, x, y, s) {
  // 浮世繪松：細幹＋三層扁平樹冠
  el("path", { d: `M${x},${y} q${-3*s},${-14*s} ${2*s},${-30*s}`, class: "s-trunk", "stroke-width": 3 * s, fill: "none" }, g);
  [[0,-30,16],[-8,-22,12],[9,-18,11]].forEach(([dx, dy, w]) =>
    el("ellipse", { cx: x + dx * s, cy: y + dy * s, rx: w * s, ry: 4.5 * s, class: "f-pine ink-thin" }, g));
}
(function buildPines() {
  const g = $("pines");
  [[60,318,1],[96,314,.8],[300,306,1.1],[340,304,.7],[690,300,.9],[1120,308,1],[1160,302,.8],[1450,298,1.2],[1500,302,.8],[1560,298,1]].forEach(([x, y, s]) => pine(g, x, y, s));
})();
(function buildBackRow() {
  const g = $("backRow"), L = $("backLights");
  let x = -10;
  while (x < 1610) {
    const w = 80 + R() * 70, top = 250 + R() * 60;
    el("rect", { x, y: top, width: w, height: 440 - top, class: "f-back-wall ink-thin" }, g);
    const rh = 16 + R() * 10;
    el("polygon", { points: `${x-6},${top+2} ${x+w+6},${top+2} ${x+w-8},${top-rh} ${x+8},${top-rh}`, fill: "url(#backTiles)", class: "ink-thin" }, g);

    for (let yy = top + 16; yy < 420; yy += 30)
      for (let xx = x + 12; xx < x + w - 18; xx += 26) {
        el("rect", { x: xx, y: yy, width: 12, height: 14, class: "f-win-off ink-thin" }, g);
        if (R() < .45) el("rect", { x: xx, y: yy, width: 12, height: 14, fill: "var(--win-on)" }, L);
      }
    x += w + 2;
  }
})();
(function buildFlowers() {
  // 花店門口的花桶

/* =========================================================
   【動畫】主迴圈：時間、日夜、風
   phase：0 = 正午、0.25 = 黃昏、0.5 = 深夜、0.75 = 清晨
   ========================================================= */
const CYCLE = 80;            // 一整天的秒數
let phase = 0.2;             // 初始：下午偏黃昏
let auto = true, tween = null;
let wind = 0, windTarget = 0, pointerIn = false;
let raining = false;
const nightOf = p => .5 - .5 * Math.cos(p * Math.PI * 2);
function clockLabel(p) {
  const h = (12 + p * 24) % 24, hh = Math.floor(h), mm = Math.floor((h - hh) * 60 / 10) * 10;
  const name = hh < 5 ? "深夜" : hh < 8 ? "清晨" : hh < 11 ? "上午" : hh < 13 ? "正午" : hh < 16 ? "午後" : hh < 19 ? "黃昏" : hh < 23 ? "夜晚" : "深夜";
  const open = hh >= 7 && hh < 21 ? "營業中" : "打烊";
  return `${name}　${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}　｜　${open}${raining ? "　｜　驟雨" : ""}`;
}
let last = performance.now(), mixTimer = 0, t = 0;
let shake = 0, catWag = 0, pourT = 0, sipT = 0, lanternKick = 0, lampFlick = 0, sparkT = 0, leafAcc = 0, foreAcc = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;

  // 時間推進
  if (tween) {
    tween.t = Math.min(1, tween.t + dt / 1.6);
    const e = tween.t < .5 ? 2 * tween.t * tween.t : 1 - Math.pow(-2 * tween.t + 2, 2) / 2;
    phase = (tween.from + (tween.to - tween.from) * e) % 1;
    if (tween.t >= 1) tween = null;
  } else if (auto && !reduced) phase = (phase + dt / CYCLE) % 1;
  const night = nightOf(phase);
  mixTimer -= dt;
  if (mixTimer <= 0 || tween) { applyNight(night); mixTimer = .12; $("clock").textContent = clockLabel(phase); }

  // 太陽、月亮
  const a = phase * Math.PI * 2;
  $("sun").setAttribute("transform", `translate(${(800 + 640 * Math.sin(a)).toFixed(1)},${(380 - 320 * Math.cos(a)).toFixed(1)})`);
  $("moon").setAttribute("transform", `translate(${(800 - 640 * Math.sin(a)).toFixed(1)},${(380 + 320 * Math.cos(a)).toFixed(1)})`);

  // 風：滑鼠位置決定方向，沒有滑鼠時自然起伏
  const baseWind = pointerIn ? windTarget : Math.sin(t * .23) * .6 + Math.sin(t * .71) * .25;
  wind += (baseWind - wind) * Math.min(1, dt * 1.5);
  if (reduced) wind = 0;

  if (!reduced) {
    // 雲與霞
    for (const c of clouds) { c.x += (c.sp + wind * 14) * dt; if (c.x > 1760) c.x = -160; if (c.x < -160) c.x = 1760; c.g.setAttribute("transform", `translate(${c.x.toFixed(1)},${c.y})`); }
    for (const k of kasumis) { k.x += (k.sp * .6 + wind * 8) * dt; if (k.x > 1640) k.x = -k.w - 20; if (k.x < -k.w - 40) k.x = 1620; k.e.setAttribute("transform", `translate(${k.x.toFixed(1)},${k.y})`); }

    // 楓樹、前景楓枝、暖簾、提燈擺動
    shake = Math.max(0, shake - dt * 1.4);
    const sway = wind * 1.4 + Math.sin(t * 1.3) * .5 + Math.sin(t * 22) * shake * 3;
    $("canopy").setAttribute("transform", `rotate(${sway.toFixed(2)} 1196 470)`);
    $("foreBranch").setAttribute("transform", `rotate(${(wind * 1.6 + Math.sin(t * 1.1) * .8).toFixed(2)} 0 0)`);
    $("norenCloth").setAttribute("transform", `skewX(${(-wind * 9 + Math.sin(t * 2.3) * 2).toFixed(1)}) translate(${(wind * 40 * .1).toFixed(1)},0)`);
    $("norenCloth").style.transformOrigin = "820px 332px";
    $("norenBook").setAttribute("transform", `skewX(${(-wind * 7 + Math.sin(t * 2) * 1.5).toFixed(1)})`);
    $("norenBook").style.transformOrigin = "381px 332px";
    lanternKick = Math.max(0, lanternKick - dt * 2);
    $("lanternBody").setAttribute("transform", `rotate(${(-wind * 8 + Math.sin(t * 1.8) * 2 + Math.sin(t * 7) * lanternKick * 22).toFixed(1)})`);

    // 落葉生成：風越大掉越多
    leafAcc += dt * (0.8 + Math.abs(wind) * 2.4);
    while (leafAcc > 1) { leafAcc -= 1; dropLeaf(false); }
    foreAcc += dt * .25;
    if (foreAcc > 1) { foreAcc = 0; dropLeaf(true); }
  }
  // 落葉運動
  for (const L of leaves) {
    if (!L.on) continue;
    if (!L.ground) {
      L.sw += dt * 2.6;
      L.x += (wind * 70 + Math.sin(L.sw) * 26) * dt;
      L.y += L.vy * dt * (raining ? 1.8 : 1);
      L.rot += L.vr * dt;
      if (L.y >= L.gy) { L.ground = true; L.y = L.gy; }
    } else {
      L.life -= dt / 6;
      L.x += wind * 6 * dt;
      if (L.life <= 0) { L.on = false; L.e.setAttribute("opacity", 0); continue; }
      L.e.setAttribute("opacity", Math.min(1, L.life * 3).toFixed(2));
    }
    const flat = L.ground ? .45 : Math.abs(Math.cos(L.sw)) * .6 + .4;
    L.e.setAttribute("transform", `translate(${L.x.toFixed(1)},${L.y.toFixed(1)}) rotate(${L.rot.toFixed(0)}) scale(${L.s},${(L.s * flat).toFixed(2)})`);
  }

  // 煙囪的煙（營業時間才烘豆）
  const h = (12 + phase * 24) % 24, open = h >= 7 && h < 21;
  for (const s of smoke) {
    if (!reduced) s.life += dt / 5;
    if (s.life >= 1) { s.life -= 1; }
    const k = s.life;
    const x = 962 + k * (40 + wind * 140) + Math.sin(k * 8 + t) * 4, y = 90 - k * 110;
    s.e.setAttribute("cx", x.toFixed(1)); s.e.setAttribute("cy", y.toFixed(1));
    s.e.setAttribute("r", (6 + k * 20).toFixed(1));
    s.e.setAttribute("opacity", (open ? (1 - k) * .8 : 0).toFixed(2));
  }

  // 行人
  for (const W of walkers) {
    if (!reduced) {
      W.x += W.dir * W.sp * dt;
      W.ph += dt * W.sp / (W.front ? 9 : 6) * (W.type === "runner" ? 1.2 : 1);
      if (W.dir > 0 && W.x > 1680) W.x = -80;
      if (W.dir < 0 && W.x < -80) W.x = 1680;
    }
    if (W.hop > 0) W.hop = Math.max(0, W.hop - dt * 2.5);
    drawWalker(W);
  }

  // 路面電車
  if (!reduced) {
    if (tram.state === "run") {
      const dist = TRAM_STOP - tram.x;
      const target = tram.stopped ? 150 : dist > 0 ? Math.min(150, Math.max(14, dist * .9)) : 150;
      tram.sp += (target - tram.sp) * Math.min(1, dt * 1.6);
      tram.x += tram.sp * dt;
      if (!tram.stopped && Math.abs(dist) < 2) { tram.state = "stop"; tram.wait = 4; tram.sp = 0; tram.stopped = true; }
      if (tram.x > 1700) { tram.state = "idle"; tram.idle = rand(6, 11); }
    } else if (tram.state === "stop") {
      tram.wait -= dt;
      if (tram.wait <= 0) { tram.state = "run"; bubble(tram.x + 260, 372, "叮叮！"); }
    } else if (tram.state === "idle") {
      tram.idle -= dt;
      if (tram.idle <= 0) { tram.state = "run"; tram.x = -340; tram.sp = 150; tram.stopped = false; }
    }
    wheelSpin += tram.sp * dt * 6;
    // 集電桿火花（夜裡偶爾閃一下）
    if (tram.sp > 40 && Math.random() < dt * .8) sparkT = .25;
  }
  sparkT = Math.max(0, sparkT - dt);
  tram.spark.setAttribute("opacity", sparkT > 0 && Math.sin(t * 70) > 0 ? (.4 + night * .6).toFixed(2) : 0);
  tram.bell = Math.max(0, tram.bell - dt);
  tram.beam.style.opacity = (night * .35).toFixed(2);
  drawTram();

  // 腳踏車、三輪貨車
  if (!reduced) {
    vehWait -= dt;
    if (vehWait <= 0 && vehicles.length < 2) { spawnVehicle(); vehWait = rand(3, 7); }
    for (let i = vehicles.length - 1; i >= 0; i--) {
      const V = vehicles[i];
      V.x += V.dir * V.sp * dt; V.spin += V.sp * dt * 5; V.ph += V.sp * dt / 12;
      drawVehicle(V);
      if (V.x < -120 || V.x > 1720) { V.g.remove(); vehicles.splice(i, 1); }
    }
  }

  // 咖啡師拉花、客人喝咖啡、貓尾巴
  pourT = Math.max(0, pourT - dt);
  $("baristaArm").setAttribute("transform", pourT > 0 ? `rotate(${(-18 + Math.sin(t * 9) * 8).toFixed(1)} 8 -26)` : "");
  sipT += dt;
  const sip = Math.max(0, Math.sin(sipT * .9) - .6) * 2.5;
  $("sipArm").setAttribute("transform", `rotate(${(-sip * 26).toFixed(1)} 6 -22)`);
  catWag = Math.max(0, catWag - dt);
  const tailA = Math.sin(t * (catWag > 0 ? 12 : 1.4)) * (catWag > 0 ? 22 : 7);
  $("catTail").setAttribute("transform", `rotate(${tailA.toFixed(1)} 12 -4)`);
  $("catTail2").setAttribute("transform", `rotate(${tailA.toFixed(1)} 12 -4)`);
  // 貓偶爾眨眼
  $("catEyes").setAttribute("transform", (t % 4.3) < .15 ? "translate(0,-22) scale(1,.2) translate(0,22)" : "");

  // 街燈與提燈的燈光閃爍
  if (!reduced && Math.random() < dt * .2) lampFlick = rand(.2, .45);
  lampFlick = Math.max(0, lampFlick - dt);
  const flick = lampFlick > 0 && Math.sin(t * 45) > 0 ? .35 : 1;
  const glows = document.querySelectorAll(".lampGlow");
  glows[1].style.opacity = (night * flick).toFixed(2);
  glows[0].style.opacity = night.toFixed(2);

  // 雨
  if (raining) {
    for (const d of rain) {
      if (!reduced) { d.y += d.sp * dt; d.x += (-0.32 - wind * .25) * d.sp * dt; if (d.y > 600) { d.y = -60; d.x = Math.random() * 1750; } if (d.x < -60) d.x += 1750; }
      drawRainDrop(d);
    }
  }

  // 鳥群
  for (let i = birds.length - 1; i >= 0; i--) {

    const flap = Math.sin(b.ph);
    b.e.setAttribute("d", `M-7,${(flap * 3).toFixed(1)} Q-3,-4 0,0 Q3,-4 7,${(flap * 3).toFixed(1)}`);
    b.e.setAttribute("transform", `translate(${b.x.toFixed(1)},${(b.y + Math.sin(b.ph * .2) * 4).toFixed(1)})`);
    if (b.life <= 0 || b.x > 1700) { b.e.remove(); birds.splice(i, 1); }
  }

}

}
$("btnRain").addEventListener("click", () => setRain(!raining));

// 減少動態：停住行人、車與落葉，只保留切換
function applyReduced() {
  reduced = RM_QUERY.matches;
  if (reduced) { auto = false; $("btnAuto").setAttribute("aria-pressed", "false"); $("btnAuto").textContent = "自動循環：關"; }
}
RM_QUERY.addEventListener && RM_QUERY.addEventListener("change", applyReduced);
applyReduced();

/* =========================================================
   初始化
   ========================================================= */
spawnWalkers();
applyNight(nightOf(phase), true);
clouds.forEach(c => c.g.setAttribute("transform", `translate(${c.x},${c.y})`));
kasumis.forEach(k => k.e.setAttribute("transform", `translate(${k.x},${k.y})`));
walkers.forEach(drawWalker);
tram.x = reduced ? TRAM_STOP : 300; tram.sp = 150; if (reduced) { tram.state = "stop"; tram.stopped = true; tram.wait = 1e9; }
drawTram();
spawnVehicle(); vehicles[0].x = 820; drawVehicle(vehicles[0]);
for (let i = 0; i < 10; i++) { dropLeaf(i % 4 === 0); const L = leaves[i]; L.y = rand(L.y, L.gy - 5); }
requestAnimationFrame(frame);
})();
</script>
</body>
