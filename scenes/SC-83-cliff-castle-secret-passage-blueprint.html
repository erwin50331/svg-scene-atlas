/* =========================================================
   SC-83 懸崖古堡的密道尋寶｜藍晒圖風格
   主題：一座原創的中世紀石造古堡（不是任何真實城堡），蓋在海邊懸崖上，
        用「縱剖面圖」把整座城堡從左到右切開：
        護城河與吊橋 → 門樓（城門閘、絞盤室、地牢）→ 中庭（鐵匠鋪、水井、地下蓄水池）
        → 主堡（大廳、藏書室、臥室、螺旋梯塔、地下酒窖）→ 城牆（廚房、倉庫、巡邏道、地下墓室）
        → 瞭望塔（烽火台、機關通道）→ 懸崖裡的寶藏室與通往海蝕洞的出口。
        藏書室的書架後面藏著一條密道（圖上用虛線「暗線」表示），一路通到寶藏室。
   風格重點（藍晒圖 blueprint）：
        普魯士藍晒圖紙、白色墨線、45 度剖面斜線、中心線、尺寸線、比例尺、指北針、圖例；
        房間名稱與標註用可愛的手寫字（內嵌「芫荽」字型子集）。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），部分另有 --k-名稱（晨昏）。
   JS 依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）。
   ========================================================= */
:root{
  color-scheme: light;

  /* —— 晒圖紙與線條（隨日夜變化） —— */
  --d-paper:#1f5c9f;   --k-paper:#36508e;   --n-paper:#0b1a37;    /* 晒圖紙底色 */
  --d-face:#2a6aad;    --k-face:#435c98;    --n-face:#0f2346;     /* 牆面、物件受光面 */
  --d-face-sh:#1a4f8b; --k-face-sh:#2f4479; --n-face-sh:#09162e;  /* 背光面、土層 */
  --d-cut:#16467f;     --k-cut:#2a3d70;     --n-cut:#071329;      /* 剖開後的房間內部 */
  --d-line:#f1f6ff;    --k-line:#fbe9dc;    --n-line:#7fb1e2;     /* 白色墨線 */
  --d-water:#9fe0ff;   --n-water:#4f9fd6;                         /* 護城河、蓄水池、海 */
  --d-win:#184a85;     --n-win:#ffd27a;                           /* 會亮燈的窗 */
  --d-glow:#1f5c9f00;  --k-glow:#ff9a6a;    --n-glow:#0b1a3700;   /* 晨昏地平線的暖光 */

  /* —— 光源與點綴色（不隨日夜變化） —— */
  --sun:#fff1c4;
  --moon:#eaf2ff;
  --lamp:#ffc764;       /* 燈光、提燈、量測框 */
  --lamp-core:#fff3d2;
  --torch:#ff9a3d;      /* 火把 */
  --fire:#ff8a3d;       /* 壁爐、鍛爐、烽火 */
  --fire-core:#ffe08a;
  --ember:#ff6a2a;      /* 火星 */
  --gold:#ffd75a;       /* 寶藏 */
  --gem:#ff8fb8;        /* 寶石 */
  --ghost:#d6f1ff;      /* 墓室的幽靈 */
  --route:#ffd27a;      /* 探險路線（表演時畫出來） */
  --banner:#ff7a6a;     /* 開城時垂下的旗幟 */
  --smoke:#cfe0f6;      /* 煙 */

  /* —— 天氣 —— */
  --fog:#dbe8f7;
  --rain:#d6e6ff;
  --snow:#ffffff;
  --bolt:#fff7c8;       /* 閃電 */
  --wx-dark:#05112a;

  /* —— 頁面介面 —— */
  --page-bg:#e8eef6; --page-fg:#14325c; --page-muted:#5b6f8c;
  --ui-surface:#f6f9fd; --ui-line:#c2d0e3; --ui-accent:#1f5c9f;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  /* 圖上的房間名稱、標註：可愛手寫字（芫荽子集，沒載入時退回系統手寫體） */
  --font-hand:"IansuiSub","Iansui","Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS",cursive;
  --non:0;   /* 夜晚程度（JS 更新） */
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:6px;overflow:hidden;background:var(--paper);line-height:0;box-shadow:0 2px 10px #0000002a}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:10px;padding:10px 14px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--page-fg);border-color:var(--page-fg);color:#fff;font-weight:700}
.panel button.big{border-color:var(--ui-accent);color:#fff;background:var(--ui-accent);font-weight:700}
.panel button.big.on{background:#f2a33a;border-color:#f2a33a;color:#14325c}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid #ffd27a;outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 內的樣式（製圖線條） ---------- */
#scene .ln{fill:none;stroke:var(--line);stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}
#scene .lnT{fill:none;stroke:var(--line);stroke-width:.75;opacity:.8;stroke-linejoin:round;stroke-linecap:round}
#scene .lnB{fill:none;stroke:var(--line);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
#scene .cons{fill:none;stroke:var(--line);stroke-width:.55;opacity:.38}
#scene .ctr{fill:none;stroke:var(--line);stroke-width:.6;opacity:.55;stroke-dasharray:14 3 2 3}
#scene .dsh{fill:none;stroke:var(--line);stroke-width:.9;opacity:.75;stroke-dasharray:4 3}
#scene .hid{fill:none;stroke:var(--line);stroke-width:1.1;opacity:.85;stroke-dasharray:6 4}
#scene .chain{fill:none;stroke:var(--line);stroke-width:2.2;stroke-dasharray:3 1.6}
#scene .fc{fill:var(--face)}
#scene .fcS{fill:var(--face-sh)}
#scene .fp{fill:var(--paper)}
#scene .fcut{fill:var(--cut)}
#scene .fl{fill:var(--line)}
#scene .hand{font-family:var(--font-hand);fill:var(--line);font-size:16px}
#scene .lbl text{font-family:var(--font-hand);fill:var(--line);font-size:17px;dominant-baseline:central}
#scene .lbl rect{fill:var(--paper);opacity:.82}
#scene .room text{font-family:var(--font-hand);fill:var(--line);font-size:14px;dominant-baseline:central;opacity:.92}
#scene .room rect{fill:none;stroke:var(--line);stroke-width:.7;opacity:.6}
#scene .mono{font:600 10px ui-monospace,Menlo,Consolas,monospace;fill:var(--line)}
#scene .hot{cursor:pointer}
#scene .puff{fill:var(--smoke);fill-opacity:.12;stroke:var(--line);stroke-width:.7;stroke-dasharray:3 2.5}
#scene .smoke{fill:var(--face-sh);fill-opacity:.35;stroke:var(--line);stroke-width:.7;stroke-dasharray:2 2.5}
#scene .night{opacity:var(--non)}
#scene .flow{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
#scene .bubble rect,#scene .tag rect{fill:var(--paper);stroke:var(--line);stroke-width:1.4}
#scene .bubble text{fill:var(--line);font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
#scene .tag text{fill:var(--line);font:700 13px var(--font-ui);dominant-baseline:central}
#scene .call rect{fill:var(--paper);stroke:var(--lamp);stroke-width:1.6}
#scene .call text{fill:var(--line);font:19px var(--font-hand);text-anchor:middle;dominant-baseline:central}
#scene .bubble .pop{animation:pop var(--dur,1.6s) ease-out forwards}
#scene .call{animation:fadeIn .5s ease-out both}
@keyframes pop{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  #scene .bubble .pop,#scene .call{animation:none}
}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：晒圖紙 → 天空 → 遠景（山丘、村莊、海）→ 土層剖面
       → 城堡（門樓、中庭、主堡、城牆、瞭望塔、懸崖、地下室）→ 機關（吊橋、城門閘、書架、巨石、石門、寶箱）

  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="藍晒圖風格的古堡剖面圖動畫：普魯士藍晒圖紙上用白線畫出一座海邊懸崖上的原創石造古堡，從左到右剖開護城河與吊橋、門樓的城門閘與絞盤、地牢、中庭的鐵匠鋪與水井、主堡的大廳、藏書室、臥室與螺旋梯、地下酒窖、城牆裡的廚房與地下墓室、瞭望塔與烽火台，以及藏在懸崖裡的機關通道、寶藏室與海蝕洞。藏書室書架後的密道用虛線表示，三位探險家和一隻小狗正準備出發尋寶。">
    <defs id="defs">

      <pattern id="gridMaj" width="100" height="100" patternUnits="userSpaceOnUse">

      <!-- 45 度剖面斜線 -->

        <line x1="0" y1="0" x2="0" y2="6" style="stroke:var(--line)" stroke-width=".8" opacity=".42"/>
      </pattern>
      <pattern id="hatchD" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">

      <radialGradient id="gGhost"><stop offset="0" stop-color="var(--ghost)" stop-opacity=".7"/><stop offset="1" stop-color="var(--ghost)" stop-opacity="0"/></radialGradient>
      <radialGradient id="gSun"><stop offset="0" stop-color="var(--sun)" stop-opacity=".5"/><stop offset="1" stop-color="var(--sun)" stop-opacity="0"/></radialGradient>

      <linearGradient id="duskG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--glow)" stop-opacity="0"/><stop offset="1" stop-color="var(--glow)" stop-opacity=".75"/></linearGradient>

    </defs>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);
      }
      return _conn.call(this, dest, ...a);
    };
  }
  function stopAudio() {
    let longs = [], ctx = null;
    for (const s of srcs) {
      const c = s.context, now = c.currentTime, m = s.__ss; ctx = c;
      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }
    if (longs.length && ctx) {
      const g = outs.get(ctx), now = ctx.currentTime;
      if (g) {
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 1.1); g.gain.setValueAtTime(0, now + 1.2);
        g.gain.linearRampToValueAtTime(1, now + 1.9);
      }
      longs.forEach(s => { try { s.stop(now + 1.15); } catch (e) {} srcs.delete(s); });
    }
    srcs.clear();
  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');
    // 凍結色票：把目前的 CSS 變數抄到殘影上，底下換色不影響殘影
    const cs = getComputedStyle(svg);
    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }
      }
    }
    const par = svg.parentElement;
    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;

  const btns = [];

/* ---------------- ⑤ 動畫：日夜循環 ---------------- */
const DAY_SEC = 160;
const T = { t: 11.5 / 24, auto: true, target: null };
let lastApplied = -1;
function clockText() {
  const h = T.t * 24, hh = Math.floor(h) % 24, mm = Math.floor((h - Math.floor(h)) * 60 + 1e-6);
  return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
}
function applyTime(force) {
  if (!force && Math.abs(T.t - lastApplied) < .0003) return;
  lastApplied = T.t;
  const h = T.t * 24;
  night = clamp(1 - smooth(5.3, 7.2, h) + smooth(17.6, 19.4, h), 0, 1);
  dusk = Math.max(Math.exp(-Math.pow((h - 6.3) / .9, 2)), Math.exp(-Math.pow((h - 18.5) / .9, 2)));
  for (const k in PAIRS) {
    const Pp = PAIRS[k];
    let c = mix(Pp.d, Pp.n, night);
    if (Pp.k) c = mix(c, Pp.k, dusk * .8);
    root.style.setProperty('--' + k, rgba(c));
  }
  nOn = smooth(.3, .85, night);
  root.style.setProperty('--non', nOn.toFixed(3));
  $('dusk').setAttribute('opacity', f1(dusk));
  const sp = (h - 6) / 12.6, mp = ((h - 18.6 + 24) % 24) / 11.4;
  $('sun').setAttribute('transform', `translate(${f1(1560 - sp * 1500)} ${f1(215 - Math.sin(Math.PI * clamp(sp, 0, 1)) * 185)})`);
  $('sun').style.display = sp > -.06 && sp < 1.06 ? '' : 'none';
  $('moon').setAttribute('transform', `translate(${f1(1560 - mp * 1500)} ${f1(215 - Math.sin(Math.PI * clamp(mp, 0, 1)) * 185)})`);
  $('moon').style.display = mp > -.06 && mp < 1.06 ? '' : 'none';
  $('mottle').setAttribute('opacity', f1(.55 - nOn * .3));
  $('clock').textContent = clockText();
  if (!T.dragging) $('timeRange').value = Math.round(T.t * 1000);
  // 晚上九點收起吊橋、放下城門閘；早上六點半再打開（表演中、或剛手動操作過就不動）
  const closed = h >= 21 || h < 6.5;
  if (closed !== MECH.nightShut) {
    const first = MECH.nightShut === undefined;
    MECH.nightShut = closed;
    if (!show.on) {
      MECH.brT = closed ? 1 : 0; MECH.portT = closed ? 0 : 1; MECH.noisy = 0;
      if (first) { MECH.br = MECH.brT; MECH.port = MECH.portT; }
    }
  }
}

const WX_LIST = [['sun', '晴'], ['cloud', '陰'], ['rain', '雨'], ['storm', '雷雨'], ['snow', '雪'], ['fog', '霧']];
let wxI = 0;
const wx = { cloud: 0, rain: 0, storm: 0, snow: 0, fog: 0 };
const drops = [], flakes = [], fogBands = [];
const LIGHT = { t: rand(3, 6), flash: 0, bolt: 0 };
function drawWeather() {

  for (let i = 0; i < 110; i++) flakes.push({ el: el('circle', { r: rand(1.2, 2.8), style: 'fill:var(--snow)', opacity: rand(.5, .95) }, $('snow')), x: rand(0, 1600), y: rand(0, 600), v: rand(30, 70), p: rand(0, 6) });

function applyWeather(dt) {
  const tg = WX_LIST[wxI][0];
  for (const k in wx) wx[k] += ((tg === k ? 1 : 0) - wx[k]) * Math.min(1, dt * 1.2);
  if (!dt) for (const k in wx) wx[k] = tg === k ? 1 : 0;
  const wet = Math.max(wx.rain, wx.storm);
  const cov = Math.max(wx.cloud, wet, wx.snow);
  $('wxClouds').setAttribute('opacity', f1(cov));
  $('wxDark').setAttribute('opacity', f1(.18 * Math.max(wx.cloud, wx.rain) + .3 * wx.storm + .08 * wx.fog + .06 * wx.snow));
  $('fog').setAttribute('opacity', f1(wx.fog));
  $('rain').setAttribute('opacity', f1(wet));

  const dim = 1 - .75 * Math.max(cov, wx.fog);

}

/* ---------------- ⑥ 聲音（Web Audio，原創音效與配樂） ----------------
   分「音樂軌」與「音效軌」：同一軌的新聲音會淡出舊的，音樂響時音效轉小聲；
   「聲音關」立即全停。所有聲音都要點了才會響（下雨、雷聲是選了天氣之後才有）。 */
function ensureAudio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
    master = actx.createGain(); master.gain.value = soundOn ? .5 : 0;

         拉下拉桿升起石門，在寶藏室打開寶箱（約 21 秒）
   gate：吊橋開城——號手站上門樓吹號，城門先關上再隆重打開：

const show = { on: '', t: 0, dur: 0, fired: {} };

function spotOn(node) {

function busy() { say(800, 200, '表演進行中，等一下喔！', 1.4); }
function syncShowBtns() {

const once = (k, t, fn) => { if (show.t >= t && !show.fired[k]) { show.fired[k] = 1; fn(); } };

// —— 探險路線：從藏書室經過密道到寶藏室 ——
const ROUTE = [[848, 300], [700, 300], [686, 300], [681, 326], [691, 352], [681, 378], [691, 404], [681, 430], [691, 456], [681, 482], [686, 524],
  [1000, 524], [1176, 524], [1197, 502], [1218, 524], [1300, 524], [1306, 530], [1312, 536], [1360, 536]];
const RS = [0];
for (let i = 1; i < ROUTE.length; i++) RS.push(RS[i - 1] + Math.hypot(ROUTE[i][0] - ROUTE[i - 1][0], ROUTE[i][1] - ROUTE[i - 1][1]));
function routeAt(s) {
  s = clamp(s, 0, RS[RS.length - 1]);
  let i = 1; while (i < RS.length - 1 && RS[i] < s) i++;

  const a = ROUTE[i - 1], b = ROUTE[i];

}
// 在平地段上，找到 x 對應的路程
function sAtX(x, from = 10) { for (let i = from; i < ROUTE.length; i++) if (ROUTE[i][0] >= x) { const a = ROUTE[i - 1], b = ROUTE[i]; return RS[i - 1] + (RS[i] - RS[i - 1]) * clamp((x - a[0]) / ((b[0] - a[0]) || 1), 0, 1); } return RS[RS.length - 1]; }
const TEAM0 = [78, 56, 36, 18];               // 四個成員一開始在路線上的位置（領隊、女孩、男孩、小狗）
const HUNT = { s: 78, keys: null, reset: 0, routeEl: null, cheer: 0 };
function huntKeys() {
  return [[0, 78], [2.2, 78], [6.4, RS[10]], [9.0, sAtX(1070)], [9.9, sAtX(1070)], [11.0, sAtX(1250)], [11.6, sAtX(1280)], [13.8, sAtX(1280)], [15.0, sAtX(1326, 15)]];
}
function leaderS(t) {
  const K = HUNT.keys;
  if (t <= K[0][0]) return K[0][1];
  for (let i = 1; i < K.length; i++) if (t <= K[i][0]) { const k = (t - K[i - 1][0]) / (K[i][0] - K[i - 1][0]); return lerp(K[i - 1][1], K[i][1], k); }
  return K[K.length - 1][1];
}
function placeTeam(dt) {
  const off = [0, 22, 42, 60];
  A.team.forEach((m, i) => {
    const s = Math.max(TEAM0[i], HUNT.s - off[i]);
    const p = routeAt(s);
    const moved = Math.hypot(p.x - m.x, p.y - m.y);
    if (Math.abs(p.dx) > .5 && moved > .05) m.face = Math.sign(p.x - m.x) || m.face;
    m.x = p.x; m.y = p.y;
    const spd = moved / Math.max(dt, 1e-3);
    if (m === A.dog) { m.run = spd > 8 ? 1 : 0; m.ph += dt; }
    else if (spd > 8) walkPose(m, Math.min(spd, 200) * dt * 4);
    else { m.leg *= .8; m.a1 += (.25 - m.a1) * Math.min(1, dt * 4); m.a2 += (-.1 - m.a2) * Math.min(1, dt * 4); m.bend *= .9; }

}
function teamIdle() {

  L.bend = .06 + Math.sin(clock * .7) * .02; L.a1 = 1.1 + Math.sin(clock * .9) * .05; L.a2 = .2; L.leg = 0;
  G.bend = .1; G.a1 = 1.25; G.a2 = 1.05; G.leg = 0;

function resetHunt(instant) {

}
function boulderHome() { Object.assign(BOULDER, { x: 1140, y: 464, rot: 0, vx: 0, vy: 0, st: 'rest', t: 0 }); MECH.plate = 0; }
function dropBoulder() {

function stepHunt(dt) {

  placeTeam(dt);
  // 抽書、書架滑開
  once('h0', .2, () => { callout(...C0[0]); spotOn(C.shelf); });
  if (st > .3 && st < 1.4) { A.leader.face = -1; A.leader.a1 = lerp(A.leader.a1, 2.2, dt * 6); A.leader.bend = .1; }
  once('book', 1.0, () => { MECH.shelfT = 1; sfx(t => { creak(t, .6); grind(t + .2, 1.1, .06); }); });
  once('h1', 2.6, () => { clearCalls(); callout(...C0[1]); });

  if (st > 9.0 && st < 9.6) A.team.forEach(m => { m.hop = Math.sin((st - 9) / .6 * Math.PI) * 6; if (m !== A.dog) { m.a1 = 2.6; m.a2 = 2.4; } });

    for (let i = 1; i < p.seg; i++) d += `L${ROUTE[i][0]} ${ROUTE[i][1]}`;

// —— 開城隊伍 ——
const PROC = [];
function mkRider(H, o) { const f = mkFig($('actors'), Object.assign({ h: 28, leg: .75, a1: .3, a2: .6 }, o)); f.horse = H; return f; }
function startGate() {

  // 隊伍在畫面左邊外面排好
  const g = $('actors');
  const k = mkHorse(g, { x: -40, cloth: true });

  const s2 = mkHorse(g, { x: -110, cloth: true });

function stepGate(dt) {
  const st = show.t, C0 = HW.gate;
  once('g0', .1, () => { callout(...C0[0]); A.her1.hidden = false; A.her2.hidden = false; MECH.brT = 1; MECH.portT = 0; MECH.noisy = 0; MECH.fast = 1; });
  // 號手吹號：手臂舉起，配合號角節奏
  [A.her1, A.her2].forEach((h, i) => { h.a1 = st < 3 || (st > 8 && st < 10) || st > 18 ? 1.6 + Math.sin(clock * 3 + i) * .05 : .3; h.a2 = .2; h.bend = -.05; });
  once('ban', 1, () => { BAN.forEach(b => { b.on = 1; }); });
  once('g1', 3, () => { clearCalls(); callout(...C0[1]); MECH.brT = 0; MECH.noisy = 1; MECH.fast = 0; });
  once('g2', 7.9, () => { clearCalls(); callout(...C0[2]); spotOn(C.port); MECH.portT = 1; sfx(t => grind(t, 1.4, .06)); });
  once('g3', 10.2, () => { clearCalls(); callout(...C0[3]); });
  once('g4', 13.5, () => { clearCalls(); callout(...C0[4]); });

      let v = 62 * dt;

    PROC.length = 0;
    show.on = ''; syncShowBtns(); clearCalls();
    A.her1.hidden = true; A.her2.hidden = true;
    BAN.forEach(b => { b.on = 0; });

/* ---------------- 動畫主迴圈 ---------------- */
let last = 0, rafId = 0;
function loop(now) {
  const dt = clamp((now - last) / 1000, 0, .05); last = now;
  step(dt);
  rafId = requestAnimationFrame(loop);
}
function settle(sec) { for (let s = 0; s < sec; s += .05) step(.05); }
function renderStill() { step(.0001); }
function start() {
  cancelAnimationFrame(rafId);
  if (reduced) { T.auto = false; syncAuto(); applyTime(true); settle(2); }
  else { last = performance.now(); rafId = requestAnimationFrame(loop); }
}

onAct(C.dungeon, () => { A.rats.slice(0, 2).forEach(r => { r.v = (r.x < (r.min + r.max) / 2 ? 1 : -1) * 70; r.t = 1.2; }); sfx(squeak); say(400, 440, '吱吱！老鼠跑掉了', 1.4); });
onAct(C.plate, () => {

onAct(C.boulder, () => {

const toggleGate = () => {
  if (show.on) return busy();

};
onAct(C.lever, toggleGate); onAct(C.gate, toggleGate);
onAct(C.chest, () => {
  if (show.on) return busy();

  if (MECH.chestT > .5) { sfx(t => { creak(t, .5); coins(t + .3, 12); sparkleSnd(t + .5); }); for (let i = 0; i < 14; i++) spark(1352 + rand(-12, 12), 516, { c: '--gold', vy: rand(-110, -60), g: 120, life: rand(.6, 1.1) }); say(1352, 450, pick(['金幣、寶石和一頂小王冠！', '閃閃發亮！']), 1.8); }
  else { sfx(t => thud(t, .1)); }
});
[C.goldL, C.goldR].forEach(g => onAct(g, () => { sfx(t => coins(t, 10)); const b = bboxOf(g); for (let i = 0; i < 8; i++) spark(b.x + b.w / 2 + rand(-8, 8), b.y + 4, { c: '--gold', vy: rand(-80, -40), g: 160, life: .7 }); }));
C.coffins.forEach(c => onAct(c.g, () => { c.t = 3; sfx(t => grind(t, .8, .06)); say(c.x + 20, 470, pick(['空的……只有灰塵', '裡面有一張紙條：寶藏在更深處']), 1.8); }));
onAct(A.ghost.g, () => { A.ghost.boo = 2; sfx(woo); say(A.ghost.x, 446, pick(['嗚～我是守護寶藏的老管家', '別怕，我只是愛熱鬧', '寶藏要分給大家喔～']), 2); });
// —— 中庭、主堡、廚房 ——
onAct(C.well, () => { if (C.bucketT > 400 || C.bucketY > 360) return; C.bucketT = 528; sfx(t => creak(t, 1.2)); say(602, 300, '打水囉！井深 9 公尺', 1.6); });
const doSmith = () => { C.smithBoost = 3; say(530, 300, pick(['叮！叮！打一把新的馬蹄鐵', '把鐵燒紅再敲']), 1.6); };
onAct(C.smithy, doSmith); onAct(A.smith.g, doSmith);
onAct(C.fire, () => { C.fireBoost = 1; sfx(t => crackle(t, 12)); for (let i = 0; i < 8; i++) spark(737, 362, { vy: rand(-60, -20), life: .6 }); say(737, 300, '添一根柴，火更旺了', 1.4); });
onAct(C.hearth, () => { C.pot.boil = 3; sfx(bubbles); say(1030, 330, pick(['燉菜好香', '咕嘟咕嘟']), 1.4); });
onAct(C.oven, () => { sfx(t => { crackle(t, 6); bell(t + .4, hz('E6'), .03, .6); }); C.breads.setAttribute('opacity', .3); setTimeout(() => C.breads.setAttribute('opacity', 1), 400); say(1134, 330, '剛出爐的麵包！', 1.6); });
onAct(C.table, () => { sfx(t => { bell(t, 2400, .04, .5); bell(t + .05, 2900, .03, .5); }); say(850, 330, '乾杯！', 1.2); });
onAct(C.chand, () => { C.chandV += .8; sfx(t => bell(t, 1800, .02, .6)); });
onAct(C.globe, () => { C.globeV = 8; sfx(whoosh); say(872, 250, '世界好大，寶藏在哪裡呢？', 1.6); });
onAct(C.desk, () => { sfx(t => noise(t, .3, 3000, .03, 'bandpass', 1)); say(824, 256, '藏寶圖：書架、密道、寶藏 ✕', 2); });
onAct(C.bed, () => say(890, 176, nightNow() ? '呼……呼……' : '城主晚上十點就寢', 1.6));
onAct(C.barrel, () => { C.dripT = 1.5; C.dripN = -1; say(900, 410, '這是去年秋天釀的葡萄酒', 1.6); });
onAct(C.bell, () => { C.bellV += 4; sfx(bellRing); say(1226, 130, '噹——噹——', 1.6); });
onAct(C.beaconG, () => { C.beaconForce = 12; sfx(t => { whoosh(t); crackle(t + .2, 10); }); say(1226, 100, '點燃烽火：遠方的城堡看得到', 1.8); });
TORCH.forEach(t => onAct(t.g, () => { t.on = !t.on; sfx(t.on ? (tt => { whoosh(tt); crackle(tt, 4); }) : (tt => noise(tt, .3, 900, .04, 'bandpass', 1, .01))); }));
TREES.forEach(tr => onAct(tr.g.parentNode, () => { for (let i = 0; i < 3; i++) spawnBird(tr.x + i * 10, 380 - tr.h + 10, rand(70, 100) * (Math.random() < .5 ? -1 : 1)); gust = .6; sfx(tweet); }));
onAct(FAR.mill, () => { FAR.spinBoost = 1; sfx(whoosh); say(136, 290, '村子的風車在磨麵粉', 1.4); });
onAct(SEA.boat, () => { sfx(gullCry); say(SEA.bx, 430, '帆船出海囉', 1.4); });
onAct(C.rowboat, () => { sfx(waves); say(1480, 520, '從海蝕洞划船，就能逃到海上', 1.8); });
onAct(C.cave, () => { sfx(waves); say(1460, 500, '海浪拍進洞裡', 1.4); });
onAct(MOAT.g, () => {
  const f = pick(A.fish);
  const x0 = f.x, g = critter($('actors'), 'M-6 0Q0 -4 5 0Q0 4 -6 0ZM-6 0L-9 -3V3Z', { x: x0, y: 402, face: f.face });
  let k = 0; const iv = setInterval(() => { k += .05; g.x = x0 + f.face * k * 26; g.y = 402 - Math.sin(k * Math.PI) * 26; g.rot = -f.face * (1 - 2 * k) * 50; placeC(g); if (k >= 1) { clearInterval(iv); g.g.remove(); sfx(splash); } }, 30);
});
A.ducks.forEach(d => onAct(d.g, () => { d.v *= -1; sfx(quack); say(d.x, 380, '呱呱！', 1.2); }));
A.hens.forEach(h => onAct(h.g, () => { h.v = (Math.random() < .5 ? -1 : 1) * 50; h.flap = .6; sfx(cluck); say(h.x, 350, '咕咕咕！', 1.2); }));
onAct(A.cat.g, () => { sfx(meow); say(778, 350, pick(['喵～', '呼嚕呼嚕']), 1.4); });
onAct(A.owl.g, () => { A.owl.awake = 1; sfx(hoot); say(1260, 120, '咕咕——', 1.4); });
A.rats.forEach(r => { if (r.g.classList.contains('hot')) onAct(r.g, () => { r.v = -r.face * 70; r.t = 1.2; sfx(squeak); }); });
// —— 人物 ——
const talk = (f, lines, dy = -44) => () => { say(f.x, f.y + dy, pick(typeof lines === 'function' ? lines() : lines), 1.8); };
onAct(A.leader.g, () => { if (show.on === 'hunt') return; talk(A.leader, ['地圖說：紅色的書是鑰匙', '帶好提燈，我們出發！', '小心踏板機關'])(); });
onAct(A.girl.g, talk(A.girl, ['藏寶圖上畫了一個 ✕', '書架後面好像有風吹出來', '跟緊喔！']));
onAct(A.boy.g, talk(A.boy, ['我帶了繩子，可以盪過陷阱', '肚子餓了……', '寶藏裡會有劍嗎？']));
onAct(A.dog.g, () => { A.dog.bark = 1.2; sfx(bark); say(A.dog.x, A.dog.y - 30, pick(['汪！汪！', '汪～（搖尾巴）']), 1.4); });
onAct(A.gateGuard.g, talk(A.gateGuard, () => night > .55 ? ['晚上城門關了，明早再來', '我在守夜'] : ['請出示通行證', '歡迎來到城堡']));
onAct(A.patrol.g, talk(A.patrol, ['巡邏中，一切正常', '城牆上風好大']));
onAct(A.lookout.g, () => { A.lookout.horn = 1.6; sfx(hornSnd); say(A.lookout.x, 30, pick(['嘟——海上有船！', '嘟——一切平安']), 1.6); });
onAct(A.kid.g, talk(A.kid, ['我要抓到那隻雞！', '鐵匠叔叔好厲害']));
onAct(A.minstrel.g, () => { A.minstrel.boost = 2.2; sfx(lute); say(930, 330, '♪ 為城主彈一首曲子', 1.6); });
onAct(A.servant.g, talk(A.servant, ['晚餐是烤雞和燉菜', '小心燙']));
onAct(A.lord.g, talk(A.lord, ['我年輕時也找過那個寶藏……', '書架上的書不要亂抽喔', '這座城堡蓋了快五百年']));
onAct(A.cook.g, talk(A.cook, ['再攪一下就好', '誰偷吃了麵包？']));
// —— 只顯示名稱的大構件，點了說一句小知識 ——
const fact = (n, x, y, s) => onAct(n, () => say(x, y, s, 2));
fact(C.keep, 800, 100, '主堡：城堡最堅固的地方');
fact(C.turret, 980, 110, '螺旋梯順時針往上，方便右手持劍防守');
fact(C.tower, 1226, 120, '瞭望塔看得到 20 公里外的海面');
fact(C.shaft, 686, 420, '牆裡的密道，只有城主知道');
fact(C.tunnel, 850, 470, '密道直通海邊，戰時可以逃出城');
fact(C.crypt, 1062, 446, '地下墓室：歷代城主長眠的地方');
fact(C.pit, 1197, 470, '陷阱坑：底下有尖刺，千萬別掉下去');

/* ---------------- ⑦ 互動：控制列 ---------------- */
function nightNow() { const h = T.t * 24; return h >= 21.5 || h < 6.5; }
function syncAuto() { $('btnAuto').setAttribute('aria-pressed', String(T.auto)); $('btnAuto').textContent = T.auto ? '自動播放中' : '自動播放'; }
function goTo(t) { if (reduced) { T.t = t; applyTime(true); renderStill(); } else T.target = t; }
const tap = fn => () => { userGesture = true; ensureAudio(); setTimeout(() => { fn(); if (reduced) settle(30); }, actx && actx.state !== 'running' ? 120 : 0); };
$('btnHunt').addEventListener('click', tap(startHunt));
$('btnGate').addEventListener('click', tap(startGate));
$('btnWeather').addEventListener('click', () => {
  userGesture = true; ensureAudio();
  wxI = (wxI + 1) % WX_LIST.length;
  $('btnWeather').textContent = '天氣：' + WX_LIST[wxI][1];
  if (WX_LIST[wxI][0] === 'storm') LIGHT.t = 1.2;
  if (reduced) { applyWeather(0); renderStill(); }
});
$('btnSound').addEventListener('click', () => {
  soundOn = !soundOn; userGesture = true;
  $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  if (ensureAudio()) {
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.setValueAtTime(soundOn ? .5 : 0, actx.currentTime);
    if (!soundOn && musNode) { try { musNode.disconnect(); } catch (e) {} musNode = null; }
  }
});
$('btnDay').addEventListener('click', () => goTo(11.5 / 24));
$('btnNight').addEventListener('click', () => goTo(21.3 / 24));
$('btnAuto').addEventListener('click', () => { T.auto = !T.auto; T.target = null; syncAuto(); });
$('timeRange').addEventListener('input', e => {
  T.t = e.target.value / 1000; T.target = null; T.dragging = true; applyTime(true); T.dragging = false;
  if (reduced) renderStill();
});
mq.addEventListener?.('change', e => { reduced = e.matches; if (!reduced) { T.auto = true; syncAuto(); } start(); });

applyTime(true);
applyWeather(0);
resetHunt(true);
syncAuto();
settle(2);
start();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on,
  btn: { hunt: 'btnHunt', gate: 'btnGate' },
  ff: () => { show.fired = new Proxy({}, { get: () => 1 }); show.t = show.on === 'gate' ? 34.5 : show.dur + .05; },   // 直接跳到收尾：隊伍收走、尋寶重置
  save: () => ({ ...T }),
  stop: () => { show.on = ''; syncShowBtns(); clearCalls(); },
  restore: s => { Object.assign(T, s); syncAuto(); applyTime(true); renderStill(); }
});
/* /ShowStop */
})();
</script>
