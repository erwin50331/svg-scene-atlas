<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>淡水河口的淡江大橋夕照</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-75 淡水河口的淡江大橋夕照｜印象派（短筆觸色點、破碎倒影、夕陽金光）
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   視角：站在淡水金色水岸的河堤步道上往西看出海口：
         左邊是對岸的觀音山與八里，中間是橫跨河口的淡江大橋（單塔不對稱斜張橋），
         夕陽就落在大橋後面的台灣海峽；右邊是漁人碼頭的情人塔與情人橋、
         山坡上的紅毛城、淡水禮拜堂鐘樓與老街；前景是榕樹、渡船頭與河岸步道。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   寫成 --d-名稱（白天），可另加 --k-名稱（夕陽／晨昏）與 --n-名稱（夜晚）。
   沒寫 --n- 的顏色，夜晚會自動混入 --night-tint 變暗變藍。
   JS 會依時間內插輸出 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）。
   ========================================================= */
:root{
  color-scheme: dark;
  --night-tint:#151a3a;

  /* —— 天空（底色漸層＋三種筆觸色）：淡水的夕陽是橘紅、粉紫與金色 —— */
  --d-sky-top:#7fb2e0;  --k-sky-top:#5a5aa0;  --n-sky-top:#0a1030;
  --d-sky-bot:#e9eef0;  --k-sky-bot:#ffb064;  --n-sky-bot:#25305e;
  --d-sky-a:#a6cbe8;    --k-sky-a:#ff9a5a;    --n-sky-a:#18224e;
  --d-sky-b:#e2ecf2;    --k-sky-b:#ffcf7a;    --n-sky-b:#283266;
  --d-sky-c:#c2d4ea;    --k-sky-c:#e0709a;    --n-sky-c:#32306c;
  --d-cloud:#fbfaf6;    --k-cloud:#ffc49a;    --n-cloud:#3a3e6c;
  --d-cloud-sh:#c2c8d6; --k-cloud-sh:#c06a8a;   --n-cloud-sh:#222652;
  --d-rcloud:#8a92a4;   --k-rcloud:#7a5a78;   --n-rcloud:#1a1e3e;   /* 雨雲 */
  --d-overcast:#98a0ae; --n-overcast:#10132a;

  /* —— 觀音山與八里 —— */
  --d-mt:#5f8a78;       --k-mt:#6a4a78;       --n-mt:#101c30;
  --d-mt-2:#7ea48a;     --k-mt-2:#8a5a82;     --n-mt-2:#172640;
  --d-mt-hi:#b3caa6;    --k-mt-hi:#e08a7a;    --n-mt-hi:#24345a;
  --d-mt-sh:#46685e;    --k-mt-sh:#4a3a66;    --n-mt-sh:#0a1222;
  --d-bali:#c9c2b4;     --k-bali:#d88e7a;     --n-bali:#1c2244;
  --d-bali-2:#9aa4a6;   --k-bali-2:#9a6a7a;   --n-bali-2:#141a38;

  /* —— 淡江大橋（白色混凝土橋塔、白色橋面、鋼索） —— */
  --d-pylon:#f2f0ea;    --k-pylon:#ffcfa0;    --n-pylon:#5a6290;
  --d-pylon-sh:#b8bcc8; --k-pylon-sh:#b0708a;   --n-pylon-sh:#262c56;
  --d-deck:#eeece6;     --k-deck:#ffc392;     --n-deck:#4a5284;
  --d-deck-sh:#8c94a4;  --k-deck-sh:#7a5070;  --n-deck-sh:#161c40;
  --d-cable:#e6e8ee;    --k-cable:#ffd8a8;    --n-cable:#3a4274;

  /* —— 漁人碼頭、淡水山坡、紅毛城、禮拜堂、老街 —— */
  --d-hill:#6f9a68;     --k-hill:#7a5a62;     --n-hill:#0e1c26;
  --d-hill-2:#94b67c;   --k-hill-2:#a86a62;   --n-hill-2:#172a34;
  --d-hill-hi:#c4d69a;  --k-hill-hi:#f0a070;  --n-hill-hi:#22364a;
  --d-fort:#c0463a;     --k-fort:#e0603e;     --n-fort:#3a1c2a;   /* 紅毛城 */
  --d-fort-sh:#8a2e2a;  --k-fort-sh:#8a3a3a;  --n-fort-sh:#200e1a;
  --d-brick:#b4563e;    --k-brick:#d8704a;    --n-brick:#2e1a28;
  --d-white:#f4f0e6;    --k-white:#ffd2a8;    --n-white:#3e4270;
  --d-roof:#6a5a56;     --k-roof:#6a4652;     --n-roof:#141428;
  --d-shop-1:#e8d6b4;   --k-shop-1:#ffc292;
  --d-shop-2:#d9a88a;   --k-shop-2:#e8946e;
  --d-shop-3:#c8d0cc;   --k-shop-3:#e8a8a0;
  --d-shop-4:#e6c070;   --k-shop-4:#ffb060;
  --d-shop-dark:#3a3034; --n-shop-dark:#20141a;
  --d-tower:#e8ecf0;    --k-tower:#ffd0a8;    --n-tower:#4a5282;   /* 情人塔 */
  --d-cabin:#5e86a8;    --n-cabin:#ffd98a;
  --d-wharf:#9a7a5a;    --k-wharf:#a86a52;

  /* —— 淡水河水面 —— */
  --d-water-top:#a9c4d0; --k-water-top:#ffae6a; --n-water-top:#1a2250;
  --d-water-bot:#4d7484; --k-water-bot:#5a4070; --n-water-bot:#070b24;
  --d-water-a:#bcd2da;  --k-water-a:#ffb874;  --n-water-a:#222e66;
  --d-water-b:#3f6474;  --k-water-b:#6a3a6a;  --n-water-b:#060a20;
  --d-water-c:#8aaeba;  --k-water-c:#e8708a;  --n-water-c:#2e3878;
  --d-water-hi:#ffffff; --k-water-hi:#fff0b0; --n-water-hi:#9aa8e4;
  --d-glint:#ffffff;    --k-glint:#ffd070;    --n-glint:#c8d0ff;
  --d-mud:#8a8270;      --k-mud:#8a5a5a;      --n-mud:#181828;   /* 退潮的泥灘 */

  /* —— 船 —— */
  --d-ferry:#f6f6f0;    --k-ferry:#ffd8b4;    --n-ferry:#6a7098;
  --d-ferry-blue:#2a6ab0; --d-ferry-dark:#20283a;
  --d-ferry-win:#3a4a5e; --n-ferry-win:#ffd98a;
  --d-tour:#f2f2ec;     --d-tour-blue:#1f8ac0;
  --d-fish-hull:#2f8a6a; --d-fish-hull-2:#e8e2d0; --d-fish-red:#d04030;
  --d-flag-1:#e84040;   --d-flag-2:#f2c230;   --d-flag-3:#2a8ad0;

  /* —— 河岸步道 —— */
  --d-pave:#b88a6e;     --k-pave:#c27a62;     --n-pave:#2a2234;
  --d-pave-2:#9a7058;   --d-pave-3:#d6b49a;
  --d-wet:#dfe6ee;      --k-wet:#ffc8a0;      --n-wet:#8a90c8;
  --d-rail:#4a5258;     --d-post:#2c3438;
  --d-pier:#8a6e56;     --d-pier-2:#5a4636;
  --d-trunk:#6a5a48;    --k-trunk:#5a4048;    --n-trunk:#141420;
  --d-leaf-1:#3f6e3e;   --k-leaf-1:#4a4a3a;   --n-leaf-1:#0c1a1a;
  --d-leaf-2:#5f8f48;   --k-leaf-2:#7a6a3e;   --n-leaf-2:#13261e;
  --d-leaf-3:#9ab868;   --k-leaf-3:#e0a050;   --n-leaf-3:#1e3428;
  --d-bench:#7a5a3e;
  --d-cart:#f4efe4;     --d-cart-2:#e05a5a;   --d-cone:#d8a05a;   --d-cream:#fff6e8;
  --d-guitar:#b8743a;   --d-case:#2a2228;
  --d-egret:#fbfbf6;    --k-egret:#ffe0c4;    --n-egret:#8a90b8;
  --d-egret-leg:#2a2a2a; --d-egret-bill:#e0b020;
  --d-cat:#e8a050;      --d-cat-2:#f4efe4;
  --d-bike:#2a3a4a;     --d-bike-2:#d04a3a;

  /* —— 人物（台灣河岸散步的人：短袖、帽子、下雨撐傘） —— */
  --d-skin-1:#f4d4b0; --d-skin-2:#e0b088; --d-skin-3:#c08a62; --d-skin-4:#8a5a3e;
  --d-hair-1:#1e1a1e; --d-hair-2:#4a3226; --d-hair-3:#8a5a36; --d-hair-4:#c8c4bc;
  --d-coat-1:#f2c230; --d-coat-2:#2f8f96; --d-coat-3:#d8463a; --d-coat-4:#2a3a6a;
  --d-coat-5:#5a8a4a; --d-coat-6:#f4f0e6; --d-coat-7:#e87a9a; --d-coat-8:#8a5aaa;
  --d-pants-1:#2c3550; --d-pants-2:#1c1a22; --d-pants-3:#8a7a5a; --d-pants-4:#5a6a8a;
  --d-umb-1:#d8384a;  --d-umb-2:#2c5aa8;  --d-umb-3:#2a2a30;  --d-umb-4:#f2b83a;  --d-umb-5:#3aa89a;

  /* —— 遶境（神轎、七爺八爺、鑼鼓、頭旗） —— */
  --d-palan:#c8262a;    --d-gold:#e8b840;     --d-gold-2:#b8862a;
  --d-qiye:#f4f2ec;     --d-qiye-robe:#2a2a34; --d-baye:#1e1e24;
  --d-robe-red:#c83a2e; --d-drum:#b8402e;     --d-drum-skin:#f0e2c0;
  --d-banner:#e84a2a;   --d-banner-2:#f2d24a; --d-incense:#c8a46a;

  /* —— 光源（不隨日夜變化） —— */
  --sun:#fff2c8;
  --sun-low:#ff7a3a;
  --moon:#fff6dc;
  --star:#ffffff;
  --lamp:#ffd27a;
  --win-on:#ffcf7a;
  --bridge-light:#fff4d8;
  --bridge-blue:#7ad0ff;
  --firecracker:#ff3a2a;
  --spark:#ffe26a;
  --smoke:#d8d4cc;
  --bolt:#ffffff;
  --d-fog:#e6e8ec;      --k-fog:#f2c4a8;      --n-fog:#363c62;
  --d-rain:#e2e8f2;     --n-rain:#8a96ca;

  /* —— 頁面介面 —— */
  --page-bg:#14141c; --page-fg:#f4efe6; --page-muted:#b0aab8;
  --ui-surface:#1e1c28; --ui-line:#3a3648; --ui-accent:#f6a03c; --ui-accent-2:#e86a6a;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-hand:'IansuiSub',"Noto Sans TC","PingFang TC",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border:1px solid var(--ui-line);border-radius:10px;overflow:hidden;background:var(--n-sky-top);line-height:0}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:10px;padding:10px 14px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--page-bg);font-weight:700}
.panel button.big{border-color:var(--ui-accent);color:var(--ui-accent);font-weight:700}
.panel button.big2{border-color:var(--ui-accent-2);color:var(--ui-accent-2);font-weight:700}
.panel button.on{background:var(--ui-accent);color:var(--page-bg)}
.panel button.big2.on{background:var(--ui-accent-2)}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent-2);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid var(--ui-accent-2);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding:0;list-style:none;color:var(--page-muted);font-size:14px;line-height:1.8;display:flex;flex-wrap:wrap;gap:4px 22px}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable,#scene [role="button"]{cursor:pointer}
#scene .deco,#scene #reflect,#scene #reflect *{pointer-events:none}
#scene .bubble path{fill:#fffaf0;stroke:#4a4a5a;stroke-width:1.4}
#scene .bubble text{fill:#1e2230;font:20px var(--font-hand);text-anchor:middle;dominant-baseline:central}
#scene .hand{font-family:var(--font-hand);text-anchor:middle;dominant-baseline:central}
/* 下雨才出現的雨傘：透明度由 JS 寫進 --rain-op */
#scene .rainwear,.rainwear{opacity:var(--rain-op,0)}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後到前：天空 → 太陽、晚霞 → 雲 → 觀音山與八里 → 河面、倒影、金光
       → 淡江大橋 → 漁人碼頭與淡水山坡（紅毛城、禮拜堂、老街）
       → 遠／中／近三條航道的船 → 泥灘白鷺鷥 → 渡船頭 → 河岸步道與人物 → 榕樹
       → 天氣 → 特效 → 對話泡泡
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice" role="img"
       aria-label="淡水河口的印象派風景動畫：從淡水河岸往西看，左邊是對岸綿延的觀音山與八里，中間一座白色單塔斜張橋淡江大橋橫跨出海口，夕陽就落在大橋後面的海面，河面上一道金色光帶；右邊是漁人碼頭的情人塔與情人橋、山坡上的紅色紅毛城、淡水禮拜堂的鐘樓與老街；河上有開往八里的渡輪、藍色公路遊船與漁船，泥灘上站著白鷺鷥；前景是大榕樹、渡船頭與河岸步道，有散步的人、騎腳踏車的人、街頭藝人、釣魚的阿伯、霜淇淋攤和一隻橘貓；整幅畫用短筆觸畫成">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-top)"/>
        <stop offset="1" style="stop-color:var(--sky-bot)"/>
      </linearGradient>
      <linearGradient id="waterGrad" gradientUnits="userSpaceOnUse" x1="0" y1="350" x2="0" y2="525">
        <stop offset="0" style="stop-color:var(--water-top)"/>
        <stop offset="1" style="stop-color:var(--water-bot)"/>
      </linearGradient>
      <linearGradient id="hazeGrad" gradientUnits="userSpaceOnUse" x1="0" y1="230" x2="0" y2="360">
        <stop offset="0" style="stop-color:var(--fog);stop-opacity:0"/>
        <stop offset="1" style="stop-color:var(--fog);stop-opacity:.75"/>
      </linearGradient>
      <linearGradient id="fogGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--fog);stop-opacity:0"/>
        <stop offset=".5" style="stop-color:var(--fog);stop-opacity:.9"/>
        <stop offset="1" style="stop-color:var(--fog);stop-opacity:0"/>
      </linearGradient>
      <radialGradient id="glowGrad">
        <stop offset="0" style="stop-color:var(--lamp);stop-opacity:.9"/>
        <stop offset="1" style="stop-color:var(--lamp);stop-opacity:0"/>
      </radialGradient>
      <radialGradient id="sunGlow">
        <stop offset="0" style="stop-color:var(--sun);stop-opacity:.8"/>
        <stop offset="1" style="stop-color:var(--sun);stop-opacity:0"/>
      </radialGradient>
      <radialGradient id="duskGlow">
        <stop offset="0" style="stop-color:var(--sun-low);stop-opacity:.75"/>
        <stop offset=".45" style="stop-color:var(--sun-low);stop-opacity:.3"/>
        <stop offset="1" style="stop-color:var(--sun-low);stop-opacity:0"/>
      </radialGradient>
      <radialGradient id="bridgeGlow">
        <stop offset="0" style="stop-color:var(--bridge-light);stop-opacity:.8"/>
        <stop offset="1" style="stop-color:var(--bridge-light);stop-opacity:0"/>
      </radialGradient>
      <!-- 雨絲（用圖樣平鋪，JS 移動位置） -->
      <pattern id="rainPat" width="70" height="120" patternUnits="userSpaceOnUse">
        <path d="M12 0l-5 20M44 46l-5 20M28 92l-5 20M60 70l-4 16" style="stroke:var(--rain)" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>
      </pattern>
      <!-- 印象派筆觸邊緣：只套在小面積的遠景（濾鏡很耗效能） -->
      <filter id="paint" x="-2%" y="-10%" width="104%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <linearGradient id="reflFade" gradientUnits="userSpaceOnUse" x1="0" y1="350" x2="0" y2="520">
        <stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".55" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <mask id="reflMask" maskUnits="userSpaceOnUse" x="0" y="350" width="1600" height="175"><rect x="0" y="350" width="1600" height="175" fill="url(#reflFade)"/></mask>
      <clipPath id="waterClip"><rect x="0" y="350" width="1600" height="174"/></clipPath>
      <clipPath id="skyClip"><rect x="0" y="0" width="1600" height="351"/></clipPath>
    </defs>

    <!-- ===== 場景：天空、太陽、晚霞、雲 ===== -->
    <rect x="0" y="0" width="1600" height="600" fill="url(#skyGrad)"/>
    <g id="stars" class="deco"></g>
    <g id="skyDabs" class="deco"></g>
    <ellipse id="duskG" class="deco" cx="760" cy="350" rx="620" ry="230" fill="url(#duskGlow)" opacity="0"/>
    <g clip-path="url(#skyClip)">
      <g id="sunG" class="clickable" tabindex="0" role="button" aria-label="太陽：切換成夜晚"><circle r="90" fill="url(#sunGlow)"/><circle id="sunDisc" r="22" style="fill:var(--sun)"/></g>
    </g>
    <g id="moonG" class="clickable" tabindex="0" role="button" aria-label="月亮：切換成白天"><circle r="16" style="fill:var(--moon)"/><circle cx="7" cy="-4" r="14" style="fill:var(--sky-top)" opacity=".9"/></g>
    <rect id="skyHit" class="clickable" x="0" y="0" width="1600" height="200" fill="transparent" tabindex="0" role="button" aria-label="天空：白天飛來一群白鷺鷥，夜晚劃過流星"/>
    <g id="clouds" class="deco"></g>
    <rect id="overRect" class="f-overcast deco" x="0" y="0" width="1600" height="360" opacity="0"/>
    <g id="bolt" class="deco"></g>

    <!-- ===== 場景：觀音山、八里 ===== -->
    <g id="mountain"></g>
    <g id="bali"></g>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);
      }
      return _conn.call(this, dest, ...a);
    };
  }
  function stopAudio() {
    let longs = [], ctx = null;
    for (const s of srcs) {
      const c = s.context, now = c.currentTime, m = s.__ss; ctx = c;
      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }
    if (longs.length && ctx) {
      const g = outs.get(ctx), now = ctx.currentTime;
      if (g) {
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 1.1); g.gain.setValueAtTime(0, now + 1.2);
        g.gain.linearRampToValueAtTime(1, now + 1.9);
      }
      longs.forEach(s => { try { s.stop(now + 1.15); } catch (e) {} srcs.delete(s); });
    }
    srcs.clear();
  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');
    // 凍結色票：把目前的 CSS 變數抄到殘影上，底下換色不影響殘影
    const cs = getComputedStyle(svg);
    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }
      }
    }
    const par = svg.parentElement;
    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });
    added = [];
  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>
/* =========================================================
   SC-75 淡水河口的淡江大橋夕照｜程式區
   區塊：①工具與色票
         ②場景（天空、觀音山與八里、河面與倒影、淡江大橋、
               漁人碼頭、紅毛城、禮拜堂、老街、渡船頭、河岸步道、榕樹）
         ③角色（散步的人、騎腳踏車的人、街頭藝人、釣魚阿伯、看夕陽的情侶、
               霜淇淋攤、橘貓、白鷺鷥、渡輪、藍色公路遊船、漁船、遶境隊伍）
         ④動畫（主迴圈、日夜、天氣、兩場秀）
         ⑤互動（點擊、滑鼠、聲音、控制列）
   ========================================================= */
(() => {
'use strict';

/* ---------------- ① 工具 ---------------- */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const root = document.documentElement;
const svg = $('scene');
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
let seed = 20261175;   // 固定亂數：每次開啟構圖都一樣
const srand = (a = 0, b = 1) => { seed = (seed * 16807) % 2147483647; return a + (seed / 2147483647) * (b - a); };
const spick = a => a[Math.floor(srand(0, a.length - 1e-9))];
const f1 = n => (Math.round(n * 10) / 10).toString();
function el(tag, attrs = {}, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
const P = (parent, d, cls, a = {}) => el('path', Object.assign({ d, class: cls }, a), parent);
const R = (parent, x, y, w, h, cls, a = {}) => el('rect', Object.assign({ x: f1(x), y: f1(y), width: f1(w), height: f1(h), class: cls }, a), parent);
const C = (parent, cx, cy, r, cls, a = {}) => el('circle', Object.assign({ cx: f1(cx), cy: f1(cy), r: f1(r), class: cls }, a), parent);
const poly = pts => 'M' + pts.map(p => f1(p[0]) + ' ' + f1(p[1])).join('L') + 'Z';
const T_ = (parent, x, y, s, size, cls, a = {}) => { const t = el('text', Object.assign({ x, y, class: 'hand ' + cls, 'font-size': size }, a), parent); t.textContent = s; return t; };
function clickable(g, label) {
  g.setAttribute('class', ((g.getAttribute('class') || '') + ' clickable').trim());

/* ---------- 印象派筆觸工具 ----------
   strokes()：把很多短筆觸合併成一條 path（效能好）
   dabs()：在取樣範圍內隨機撒筆觸，依材質分組上色 */
function strokes(parent, cls, segs, w, op) {
  if (!segs.length) return null;
  let d = '';
  for (const s of segs) d += `M${f1(s[0])} ${f1(s[1])}l${f1(s[2])} ${f1(s[3])}`;

}
function wpick(list) {
  let sum = 0; for (const m of list) sum += m[1];
  let r = srand(0, sum);
  for (const m of list) { r -= m[1]; if (r <= 0) return m[0]; }

}
function dabs(parent, n, sample, mats, len, ang, w, op) {
  const b = {};
  for (let i = 0; i < n; i++) {
    const p = sample(); if (!p) continue;
    const m = wpick(mats);
    const L = typeof len === 'function' ? len(p) : srand(len[0], len[1]);
    const a = (typeof ang === 'function' ? ang(p) : srand(ang[0], ang[1])) * Math.PI / 180;
    (b[m] = b[m] || []).push([p[0] - Math.cos(a) * L / 2, p[1] - Math.sin(a) * L / 2, Math.cos(a) * L, Math.sin(a) * L]);
  }
  const out = [];
  for (const m in b) out.push(strokes(parent, m, b[m], w, op));
  return out;
}

/* =========================================================
   ④ 動畫：日夜、天氣、小工具
   ========================================================= */
const DAY_SEC = 150;   // 自動播放時，一天＝150 秒
const T = { t: (16 * 60 + 40) / 1440, auto: true, dragging: false };
let night = 0, dusk = 0, hour = 16.6, lastColor = -1;
function applyColors(force) {
  const key = Math.round(T.t * 1440);
  if (!force && key === lastColor) return;
  lastColor = key;
  const h = T.t * 24; hour = h;
  night = clamp(1 - smooth(5.2, 6.6, h) + smooth(18.35, 19.7, h), 0, 1);
  // 淡水在城市西邊、面向出海口，傍晚的晚霞特別濃；清晨在背後，只淡淡一點
  dusk = Math.max(Math.exp(-Math.pow((h - 6.0) / .8, 2)) * .5, Math.exp(-Math.pow((h - 18.1) / 1.0, 2)));
  const dk = dusk * (1 - wx.cloud * .55);
  for (const k in PAIRS) {
    const Pp = PAIRS[k];
    let c = mix(Pp.d, Pp.n, night);
    if (Pp.k) c = mix(c, Pp.k, dk * .9);
    root.style.setProperty('--' + k, rgba(c));
  }
  $('clock').textContent = clockText();
  if (!T.dragging) $('timeRange').value = Math.round(T.t * 1000);
  placeSunMoon();
}
function clockText() { const m = Math.floor(T.t * 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
let sunX = 760, sunY = 0, sunUp = 0;
function placeSunMoon() {
  // 面向西方：早上太陽在背後看不到；中午後從右上方出現，傍晚落進大橋旁的海面
  const h = T.t * 24;
  const k = (h - 11) / 7.3;
  sunX = 1150 - clamp(k, 0, 1.05) * 330; sunY = 40 + Math.pow(clamp(k, 0, 1.08), 2) * 312;
  sunUp = k > 0 && k < 1.08 ? 1 : 0;
  $('sunG').setAttribute('transform', `translate(${f1(sunX)} ${f1(sunY)})`);
  $('sunG').style.display = sunUp ? '' : 'none';
  $('sunDisc').style.fill = `color-mix(in srgb, var(--sun-low) ${Math.round(smooth(.7, 1, k) * 85)}%, var(--sun))`;
  // 月亮：入夜後從右邊升起，往左上方移動
  const mk = ((h - 19 + 24) % 24) / 10;
  $('moonG').setAttribute('transform', `translate(${f1(1450 - mk * 1100)} ${f1(300 - Math.sin(Math.PI * mk) * 240)})`);
  $('moonG').style.display = mk > 0 && mk < 1 ? '' : 'none';
}

  else if (fe.state === 'turn') { const k = clamp(fe.t / 2.4, 0, 1); fe.sx = Math.cos(Math.PI * k); if (k >= 1) { fe.sx = -1; fe.dir = -1; fe.state = 'out'; fe.sp = 0; } }
  else if (fe.state === 'out') { fe.sp = Math.min(44, fe.sp + dt * 14); fe.x -= fe.sp * dt * mv * (fe.boost > 0 ? 1.8 : 1); if (fe.x < -160) { fe.state = 'away'; fe.wait = 7; } }
  else if (fe.state === 'away') { fe.wait -= dt; if (fe.wait <= 0) { fe.state = 'in'; fe.dir = 1; fe.sx = 1; fe.sp = 44; } }
  else if (fe.state === 'in') { const dist = DOCK - fe.x; fe.sp = clamp(dist * .5, 6, 44); fe.x += fe.sp * dt * Math.max(mv, 1); if (dist < 1) { fe.x = DOCK; fe.state = 'dock'; fe.wait = 6; } }
  fe.boost = Math.max(0, (fe.boost || 0) - dt);
  fe.g.setAttribute('transform', `translate(${f1(fe.x)} ${f1(fe.y + Math.sin(time * 1.6) * .7 * mv)}) rotate(${f1(Math.sin(time * 1.2) * (.4 + wind * .5) * mv)})`);
  fe.inner.setAttribute('transform', `scale(${f1(fe.sx * fe.s)} ${fe.s})`);
  if (mv && fe.sp > 5 && Math.random() < dt * 14) particle(fe.x - fe.sx * 56 + rand(-5, 5), fe.y + 6, 'var(--water-hi)', -fe.sx * rand(10, 30), rand(-10, -2), 1, rand(1.2, 2.2), { g: 10, op: .6 });

  // 泥灘上的白鷺鷥：低頭啄食；被點的飛到對岸繞一圈再回來
  egrets.forEach(e => {
    if (e.mode === 'sit') {
      e.peck -= dt;
      const pk = e.peck < 0 && e.peck > -.5 ? 1 : 0;
      if (e.peck < -.5) e.peck = rand(2, 6);
      e.neck.setAttribute('d', pk ? 'M4 -9Q10 -10 10 -4Q10 2 13 4' : 'M4 -9Q9 -14 5 -18Q2 -22 7 -24');
      e.sit.lastChild.setAttribute('transform', pk ? 'translate(6 27) rotate(70 7 -24)' : '');
      e.g.setAttribute('transform', `translate(${e.hx} ${e.hy}) scale(${f1(e.dir * e.k)} ${e.k})`);
      return;
    }
    e.t += dt * Math.max(mv, 1);
    const D = 9, k = clamp(e.t / D, 0, 1);
    const x = e.hx - 420 * Math.sin(Math.PI * k), y = e.hy - 150 * Math.sin(Math.PI * k) - 40 * Math.sin(2 * Math.PI * k);
    const vx = -Math.cos(Math.PI * k);
    e.g.setAttribute('transform', `translate(${f1(x)} ${f1(y)}) scale(${f1((vx >= 0 ? 1 : -1) * e.k)} ${e.k})`);
    e.wing.setAttribute('transform', `scale(1 ${f1(.3 + .7 * Math.abs(Math.sin(time * 5)))})`);
    if (k >= 1) { e.mode = 'sit'; e.sit.setAttribute('opacity', 1); e.fly.setAttribute('opacity', 0); }
  });
  // 歸巢的鷺鷥群
  for (let i = flock.length - 1; i >= 0; i--) {
    const f = flock[i];
    f.x += f.vx * dt * Math.max(mv, 1);
    f.e.g.setAttribute('transform', `translate(${f1(f.x)} ${f1(f.y + Math.sin(time * .8 + f.ph) * 5)}) scale(${-f.k} ${f.k})`);
    f.e.wing.setAttribute('transform', `scale(1 ${f1(.3 + .7 * Math.abs(Math.sin(time * 4 + f.ph)))})`);
    if (f.x < -80) { f.e.g.remove(); flock.splice(i, 1); }
  }

  // 補間、粒子
  for (let i = tweens.length - 1; i >= 0; i--) { const tw = tweens[i]; tw.t += dt; const k = clamp(tw.t / tw.dur, 0, 1); tw.fn(k); if (k >= 1) { tweens.splice(i, 1); tw.done && tw.done(); } }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt;
    if (p.life <= 0) { p.n.remove(); parts.splice(i, 1); continue; }
    if (p.drag) { const d = Math.exp(-p.drag * dt); p.vx *= d; p.vy *= d; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.y > p.floor) { p.y = p.floor; p.vy *= -.3; p.vx *= .6; }
    const k = p.life / p.max;
    p.n.setAttribute('cx', f1(p.x)); p.n.setAttribute('cy', f1(p.y)); p.n.setAttribute('r', f1(p.r + (1 - k) * p.grow));
    p.n.setAttribute('opacity', f1(Math.min(1, k * 2) * p.op));
  }
}

/* ---- 霧氣帶 ---- */
const fogBands = [];
function drawFog() {
  [[220, 120, .8], [290, 110, .95], [360, 110, .7], [440, 100, .5]].forEach(([y, h, o]) => fogBands.push(el('rect', { x: -120, y, width: 1840, height: h, fill: 'url(#fogGrad)', opacity: o }, $('fog'))));
}

/* ---------------- ⑤ 互動：綁定 ---------------- */
function bindAll() {
  svg.addEventListener('click', () => { userGesture = true; ensureAudio(); });
  onAct($('sunG'), () => { sfx('chime'); if (show.on) endShow(true); setTime(21); });
  onAct($('moonG'), () => { sfx('chime'); if (show.on) endShow(true); setTime(14); });
  $('skyHit').addEventListener('click', e => { userGesture = true; ensureAudio(); const p = svgPoint(e); skyClick(p.x, p.y); });
  $('skyHit').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); userGesture = true; ensureAudio(); skyClick(800, 150); } });
  onAct($('mountain'), () => { sfx('chime'); say(300, 90, '觀音山：山形像一尊仰臥的觀音', 2.6); });
  onAct($('waterHit'), e => {
    const p = e.clientX ? svgPoint(e) : { x: 800, y: 470 };
    ripple(p.x, p.y, 1); setTimeout(() => ripple(p.x, p.y, .7), 220); sfx('plop');
  });
  onAct(bridge.g, () => {
    bridge.force = 6; bridge.pulse = 0; bridge.mode = (bridge.mode + 1) % 3; bridge.modeDirty = true; sfx('ding');
    say(PX + 40, 60, pick(['淡江大橋：單塔斜張橋，塔高 211 公尺', '主跨 450 公尺，只靠一座橋塔撐起', '2026 年通車，連接淡水和八里']), 2.6);
  });
  onAct(town.fort, () => { sfx('drum'); say(1350, 200, '紅毛城：1644 年荷蘭人蓋的石造城堡', 2.6); });
  onAct(town.church, () => { town.ring = 3.2; sfx('bell'); say(1500, 180, '淡水禮拜堂的鐘聲', 2); });
  onAct(town.tower, () => { town.cab.ty = 250; town.cab.hold = 0; sfx('chime'); say(1224, 200, '情人塔的旋轉觀景艙升上去囉', 2.2); });
  onAct(town.lover, () => { town.loverT = 6; sfx('ding'); say(1264, 280, '情人橋：2003 年情人節啟用', 2.2); });
  town.signs.forEach(s => onAct(s.g, () => { s.steam = 2.5; sfx('sizzle'); say(s.x, 290, s.info, 2.6); }));
  onAct(folk.bench.g, () => { folk.bench.t = 2; sfx('hello'); say(352, 470, night > .5 ? '月亮出來了' : dusk > .4 ? '夕陽好漂亮' : '等一下來看夕陽', 1.8); });
  onAct(folk.fisher.g, () => {
    if (folk.fisher.t > 0) return;
    folk.fisher.t = 1.6; sfx('reel');
    setTimeout(() => { const f = el('g', {}, $('fx')); P(f, 'M-6 0Q0 -4 6 0Q0 3 -6 0ZM6 0l4 -3v6z', 'f-water-hi'); tween(1, k => f.setAttribute('transform', `translate(${f1(660 - k * 10)} ${f1(500 - Math.sin(Math.PI * k) * 40 - k * 20)}) rotate(${f1(Math.sin(k * 20) * 30)})`), () => f.remove()); ripple(660, 500, .8); say(606, 440, pick(['釣到一尾小魚！', '又跑掉了……', '今天魚很多']), 1.8); }, 700);
  });
  onAct(folk.busker.g, () => { folk.busker.solo = 2.6; sfx('riff'); });
  onAct(folk.ice.g, () => {
    folk.ice.t = 1.6; sfx('pop'); say(1262, 440, '長長的霜淇淋，一支有 20 幾公分', 2.4);
    const c = el('g', {}, $('fx')); P(c, 'M-3 0L-5 -10H5L3 0Z', 'f-cone'); P(c, 'M-4 -10Q-5 -26 0 -34Q5 -26 4 -10Z', 'f-cream');
    tween(1.6, k => { c.setAttribute('transform', `translate(1250 ${f1(520 - Math.sin(Math.PI * Math.min(k * 2, 1)) * 12)})`); c.setAttribute('opacity', f1(k > .8 ? (1 - k) * 5 : 1)); }, () => c.remove());
  });
  onAct(folk.cat.g, () => { folk.cat.t = 1; sfx('meow'); say(1406, 460, '喵～', 1.2); });
  egrets.forEach(e => onAct(e.g, () => { egretFly(e); sfx('egret'); }));
  onAct(boats.ferry.g, () => {
    const fe = boats.ferry; sfx('horn');
    if (fe.state === 'dock') fe.wait = 0; else fe.boost = 3;
    say(fe.x, fe.y - 60, '淡水往八里的渡輪，坐船約十分鐘', 2.4);
  });
  onAct(boats.tour.g, () => { boats.tour.boost = 3; sfx('splash'); say(boats.tour.x, boats.tour.y - 50, '藍色公路：開往漁人碼頭', 2); });
  onAct(boats.fish.g, () => { boats.fish.boost = 4; sfx('engine'); say(boats.fish.x, boats.fish.y - 40, '漁船出海囉', 1.6); });
  walkers.forEach(w => onAct(w.g, () => {
    if (w.kind === 'dog') { sfx('woof'); say(w.x, w.lane.y - 56, '汪！', 1); }
    else if (w.kind === 'phone') { sfx('shutter'); w.snapT = 1; flash(w.x + w.lane.dir * 4, w.lane.y - 34); }
    else { sfx('hello'); w.wave = 1.6; say(w.x, w.lane.y - 76, pick(['你好！', '來淡水散步', '要吃阿給嗎？']), 1.4); }
  }));
  bikes.forEach(b => onAct(b.g, () => { sfx('bike'); say(b.x, b.y - 60, '叮叮！借過喔', 1.2); }));
  onAct($('parade'), () => { if (parade) firecracker(parade.x - 70, 596); });
  svg.addEventListener('pointermove', onMove);

  $('btnShow').addEventListener('click', () => { userGesture = true; ensureAudio(); startShow('sunset'); });
  $('btnParade').addEventListener('click', () => { userGesture = true; ensureAudio(); startShow('parade'); });
  $('btnWeather').addEventListener('click', () => { userGesture = true; ensureAudio(); restoreAt = -1; restoreWx = -1; setWeather((wxIdx + 1) % WX.length); });
  $('btnSound').addEventListener('click', () => {
    soundOn = !soundOn; userGesture = true; ensureAudio();
    if (master) master.gain.setValueAtTime(soundOn ? .55 : 0, actx.currentTime);
    if (!soundOn) { stopAll(); try { window.sceneMusic && window.sceneMusic.stop(); } catch (e) {} }
    rainSound();
    $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  });
  $('btnDay').addEventListener('click', () => { if (show.on) endShow(true); setTime(14); });
  $('btnDusk').addEventListener('click', () => { if (show.on) endShow(true); setTime(17.9); });
  $('btnNight').addEventListener('click', () => { if (show.on) endShow(true); setTime(21); });
  $('btnAuto').addEventListener('click', () => { T.auto = !T.auto; $('btnAuto').setAttribute('aria-pressed', String(T.auto)); });
  const tr = $('timeRange');
  tr.addEventListener('input', () => { if (show.on) endShow(true); T.dragging = true; T.t = tr.value / 1000; applyColors(true); });
  tr.addEventListener('change', () => { T.dragging = false; });
  window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
  window.addEventListener('pointerdown', () => document.body.classList.remove('kbd'));
  mq.addEventListener && mq.addEventListener('change', () => { reduced = mq.matches; });
}

/* ---------------- 初始化 ---------------- */
function init() {
  drawSky();
  drawMountain();
  drawBali();
  drawWater();
  drawBridge();
  drawTown();
  drawMud();
  drawEgrets();
  drawBoats();
  drawPier();
  drawWalk();
  drawFolk();
  drawWalkers();
  drawTree();
  drawFog();
  bindAll();
  if (reduced) { T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false'); }
  setWeather(0);
  Object.assign(wx, WX[0][2]);
  bridge.pulse = -1;
  applyColors(true);
  step(1 / 60);
  requestAnimationFrame(loop);
  // 網站「作者精選」播放區：預設輪播「大橋夕照」（使用者指定）；不會自己出聲，打開配樂後每一輪都配上圓舞曲
  if (inPicks) {
    let idle = 0;
    setTimeout(() => startShow('sunset'), 800);
    setInterval(() => { if (!show.on) { idle += 1; if (idle >= 3) { idle = 0; startShow('sunset'); } } else idle = 0; }, 1000);
    window.sceneMusic = {
      playing: false,
      start(c) {
        if (this.playing) return; this.playing = true; pickAudio = true; userGesture = true;
        if (c && c !== actx) useCtx(c); else ensureAudio();
        if (actx && actx.state !== 'running') actx.resume();
        if (show.on && show.kind === 'sunset' && show.t < 3) setTimeout(() => playSunsetSong(), 60);
      },
      stop() { this.playing = false; pickAudio = false; stopAll(); if (rainAmb) rainAmb.g.gain.value = .0001, rainAmb.v = 0; },
      duck() {}
    };
  }
}
init();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on && show.kind,
  btn: { sunset: 'btnShow', parade: 'btnParade' },
  save: () => ({ t: T.t, auto: T.auto }),
  stop: () => endShow(true),   // 作品內建的「中斷」：停音樂、收遊行、天氣很快恢復
  restore: s => { T.t = s.t; T.auto = s.auto; $('btnAuto') && $('btnAuto').setAttribute('aria-pressed', String(T.auto)); applyColors(true); }
});
/* /ShowStop */
})();
</script>
