   地點：英國倫敦・泰晤士河上的塔橋（Tower Bridge，1894 年啟用）。
   視角：站在塔橋下游（東邊）的河面上，往上游（西邊）看整座橋的「立面＋剖面圖」：
        左邊是南岸（後方有碎片大廈、貝爾法斯特號），右邊是北岸（後方有倫敦塔、金融城）。
        南岸引橋 → 南岸橋塔 → 吊橋側跨 → 南主塔（剖開看樓梯與電梯）→ 兩片開啟橋葉 → 北主塔 → 側跨 → 北岸橋塔
        橋墩剖開，看得到開啟橋葉後端的「平衡錘」在橋墩艙室裡上下擺動，
        還有耳軸（轉軸）、小齒輪與扇形齒條；南岸引橋底下是維多利亞時代的蒸汽引擎房與蓄壓器。
        泰晤士河是感潮河段，水位跟著潮汐漲落（潮差約 7 m），橋下淨空也跟著變。
   風格重點（藍晒圖 blueprint）：
        普魯士藍晒圖紙、白色墨線、45 度剖面斜線、中心線、隱藏線、尺寸線、比例尺、指北針、
        左上角的平面圖小框；名稱與標註用可愛手寫字（內嵌「芫荽」字型子集）。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   成對的色票寫成 --d-名稱（白天）／--n-名稱（夜晚），部分另有 --k-名稱（晨昏）。
   JS 會依時間內插，輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）兩個 class。
   ========================================================= */
:root{
  color-scheme: light;

  /* —— 晒圖紙與線條（隨日夜變化） —— */
  --d-paper:#1f5c9f;   --k-paper:#3a4f8c;   --n-paper:#0b1a37;    /* 晒圖紙底色 */
  --d-face:#2a6aad;    --k-face:#465b96;    --n-face:#0f2346;     /* 受光面 */
  --d-face-sh:#1a4f8b; --k-face-sh:#30437a; --n-face-sh:#09162e;  /* 背光面、土層 */
  --d-cut:#16467f;     --k-cut:#2a3d70;     --n-cut:#071329;      /* 剖開後的艙室內部 */
  --d-line:#f1f6ff;    --k-line:#fde9dc;    --n-line:#7fb1e2;     /* 白色墨線 */
  --d-far:#b9d3f2;     --k-far:#d9c3c8;     --n-far:#4d7bb0;      /* 遠景（城市天際線）的淡線 */
  --d-water:#5d9ee0;   --k-water:#6a7fc0;   --n-water:#183a6c;    /* 河水剖面 */
  --d-win:#184a85;     --n-win:#ffd27a;                           /* 會亮燈的窗 */
  --d-glow:#1f5c9f00;  --k-glow:#ff9a6a;    --n-glow:#0b1a3700;   /* 晨昏地平線的暖光 */

  /* —— 光源與點綴色（不隨日夜變化） —— */
  --sun:#fff1c4;
  --moon:#eaf2ff;
  --lamp:#ffc764;       /* 路燈、量測框 */
  --lamp-core:#fff3d2;
  --flood:#fff0c8;      /* 夜間投射燈 */
  --red-light:#ff4b4b;  /* 交通號誌紅燈、航空障礙燈、船的左舷燈 */
  --green-light:#5dff9a;/* 綠燈、右舷燈 */
  --amber:#ffb43a;      /* 黃燈 */
  --oil:#9fe9ff;        /* 液壓管線裡的高壓水流 */
  --steam:#ffffff;      /* 蒸氣 */
  --sail:#fff6e2;       /* 帆 */
  --flash:#ffffff;      /* 相機閃光、閃電 */
  /* 點燈秀的燈光色 */
  --show-a:#ffd27a; --show-b:#7fe3ff; --show-c:#ff8fb8; --show-d:#b9ff8a;

  /* —— 天氣 —— */
  --fog:#dbe8f7;
  --rain:#d6e6ff;
  --snow:#ffffff;
  --wx-dark:#05112a;

  /* —— 頁面介面 —— */
  --page-bg:#e8eef6; --page-fg:#14325c; --page-muted:#5b6f8c;
  --ui-surface:#f6f9fd; --ui-line:#c2d0e3; --ui-accent:#1f5c9f;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  /* 圖上的名稱、標註、對話框：可愛手寫字（芫荽子集，沒載入時退回系統手寫體） */
  --font-hand:"IansuiSub","Iansui","Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS",cursive;
  --non:0;   /* 夜晚程度（JS 更新） */
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border-radius:6px;overflow:hidden;background:var(--paper);line-height:0;box-shadow:0 2px 10px #0000002a}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:10px;padding:10px 14px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--page-fg);border-color:var(--page-fg);color:#fff;font-weight:700}
.panel button.big{border-color:var(--ui-accent);color:#fff;background:var(--ui-accent);font-weight:700}
.panel button.big.on{background:#f2a33a;border-color:#f2a33a;color:#14325c}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
/* 畫面內可點物件：滑鼠點不顯示外框，用鍵盤 Tab 時才顯示 */
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid #ffd27a;outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 內的樣式（製圖線條） ---------- */
#scene .ln{fill:none;stroke:var(--line);stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}
#scene .lnT{fill:none;stroke:var(--line);stroke-width:.75;opacity:.8;stroke-linejoin:round;stroke-linecap:round}
#scene .lnB{fill:none;stroke:var(--line);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
#scene .far{fill:none;stroke:var(--far);stroke-width:.8;stroke-linejoin:round;stroke-linecap:round}
#scene .farF{fill:var(--paper);stroke:var(--far);stroke-width:.8;stroke-linejoin:round}
#scene .cons{fill:none;stroke:var(--line);stroke-width:.55;opacity:.38}
#scene .ctr{fill:none;stroke:var(--line);stroke-width:.6;opacity:.55;stroke-dasharray:14 3 2 3}
#scene .dsh{fill:none;stroke:var(--line);stroke-width:.9;opacity:.75;stroke-dasharray:4 3}
#scene .hid{fill:none;stroke:var(--line);stroke-width:.9;opacity:.65;stroke-dasharray:6 4}
#scene .chain{fill:none;stroke:var(--line);stroke-width:2.4;stroke-linecap:round}
#scene .fc{fill:var(--face)}
#scene .fcS{fill:var(--face-sh)}
#scene .fp{fill:var(--paper)}
#scene .fcut{fill:var(--cut)}
#scene .fl{fill:var(--line)}
#scene .win{fill:var(--win)}
#scene .hand{font-family:var(--font-hand);fill:var(--line);font-size:15px}
#scene .lbl text{font-family:var(--font-hand);fill:var(--line);font-size:15px;dominant-baseline:central}
#scene .lbl rect{fill:var(--paper);opacity:.8}
#scene .mono{font:600 10px ui-monospace,Menlo,Consolas,monospace;fill:var(--line)}
#scene .hot{cursor:pointer}
#scene .puff{fill:var(--steam);fill-opacity:.1;stroke:var(--line);stroke-width:.7;stroke-dasharray:3 2.5}
#scene .night{opacity:var(--non)}
#scene .wat{fill:var(--water);fill-opacity:.55}
#scene .bubble rect,#scene .tag rect{fill:var(--paper);stroke:var(--line);stroke-width:1.4}
#scene .bubble text{fill:var(--line);font:17px var(--font-hand);text-anchor:middle;dominant-baseline:central}
#scene .tag text{fill:var(--line);font:15px var(--font-hand);dominant-baseline:central}
#scene .bubble .pop{animation:pop var(--dur,1.6s) ease-out forwards}
@keyframes pop{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  #scene .bubble .pop{animation:none}
}
</style>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       圖層由後往前：晒圖紙 → 天空（星、日月、雲）→ 平面圖小框 → 鳥與飛機
       → 遠景（碎片大廈、金融城、倫敦塔、貝爾法斯特號）→ 橋後方的船
       → 兩岸地面與引擎房 → 河床與河水（剖面）→ 橋墩（剖面、平衡錘艙）
       → 懸吊鏈與側跨 → 主塔與高層步道 → 開啟橋葉 → 路上的車與行人
       → 橋前方的船 → 標註 → 夜燈 → 點燈秀 → 天氣 → 滑鼠標註 → 對話框 → 圖框
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="藍晒圖風格的倫敦塔橋立面與剖面圖動畫：站在泰晤士河下游往上游看，兩座哥德式主塔之間是可以往上掀開的兩片橋葉，上方有高層步道相連，兩側是懸吊鏈拉著的側跨；橋墩剖開看得到橋葉後端的平衡錘、耳軸與齒輪，南岸地底是維多利亞時代的蒸汽引擎房與蓄壓器；路上有紅色雙層巴士、黑色計程車、單車和行人，河上有通勤快船與拖船；按下開橋，交通欄杆放下，兩片橋葉升起，一艘三桅高桅帆船從橋下駛過；遠方有碎片大廈、金融城的大樓、倫敦塔和停泊的貝爾法斯特號">
    <defs id="defs">
      <pattern id="gridMin" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M20 0H0V20" style="fill:none;stroke:var(--line)" stroke-width=".5" opacity=".08"/>
      </pattern>
      <pattern id="gridMaj" width="100" height="100" patternUnits="userSpaceOnUse">
        <path d="M100 0H0V100" style="fill:none;stroke:var(--line)" stroke-width=".8" opacity=".12"/>
      </pattern>
      <!-- 45 度剖面斜線 -->
      <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="6" style="stroke:var(--line)" stroke-width=".8" opacity=".42"/>
      </pattern>
      <pattern id="hatchD" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
        <line x1="0" y1="0" x2="0" y2="3" style="stroke:var(--line)" stroke-width=".8" opacity=".7"/>
      </pattern>
      <!-- 石材：一層層錯縫的砌石 -->
      <pattern id="stone" width="16" height="8" patternUnits="userSpaceOnUse">
        <path d="M0 8H16M4 0V8M12 0V4" style="fill:none;stroke:var(--line)" stroke-width=".5" opacity=".22"/>
      </pattern>
      <!-- 混凝土剖面：斜線＋小點（骨材） -->
      <pattern id="concrete" width="14" height="14" patternUnits="userSpaceOnUse">
        <path d="M0 14L14 0" style="stroke:var(--line)" stroke-width=".7" opacity=".38"/>
        <circle cx="4" cy="4" r=".8" style="fill:var(--line)" opacity=".45"/>
        <circle cx="10" cy="9" r=".6" style="fill:var(--line)" opacity=".4"/>
      </pattern>
      <!-- 土層（倫敦黏土）：短斜線點陣 -->
      <pattern id="soil" width="18" height="12" patternUnits="userSpaceOnUse">
        <path d="M2 4l4-3M11 10l4-3" style="stroke:var(--line)" stroke-width=".6" opacity=".3"/>
        <circle cx="13" cy="3" r=".7" style="fill:var(--line)" opacity=".3"/>
      </pattern>
      <!-- 河床的砂礫 -->
      <pattern id="gravel" width="12" height="8" patternUnits="userSpaceOnUse">
        <circle cx="3" cy="3" r="1.1" style="fill:none;stroke:var(--line)" stroke-width=".5" opacity=".4"/>
        <circle cx="9" cy="6" r=".8" style="fill:var(--line)" opacity=".35"/>
      </pattern>
      <!-- 水：水平短線 -->
      <pattern id="liq" width="16" height="7" patternUnits="userSpaceOnUse">
        <line x1="0" y1="3" x2="9" y2="3" style="stroke:var(--line)" stroke-width=".7" opacity=".32"/>
      </pattern>
      <radialGradient id="gLamp"><stop offset="0" stop-color="var(--lamp)" stop-opacity=".95"/><stop offset=".35" stop-color="var(--lamp)" stop-opacity=".35"/><stop offset="1" stop-color="var(--lamp)" stop-opacity="0"/></radialGradient>
      <radialGradient id="gFlood"><stop offset="0" stop-color="var(--flood)" stop-opacity=".42"/><stop offset=".6" stop-color="var(--flood)" stop-opacity=".12"/><stop offset="1" stop-color="var(--flood)" stop-opacity="0"/></radialGradient>
      <radialGradient id="gRed"><stop offset="0" stop-color="var(--red-light)" stop-opacity="1"/><stop offset=".3" stop-color="var(--red-light)" stop-opacity=".4"/><stop offset="1" stop-color="var(--red-light)" stop-opacity="0"/></radialGradient>
      <radialGradient id="gGreen"><stop offset="0" stop-color="var(--green-light)" stop-opacity="1"/><stop offset=".3" stop-color="var(--green-light)" stop-opacity=".4"/><stop offset="1" stop-color="var(--green-light)" stop-opacity="0"/></radialGradient>
      <radialGradient id="gAmber"><stop offset="0" stop-color="var(--amber)" stop-opacity="1"/><stop offset=".3" stop-color="var(--amber)" stop-opacity=".4"/><stop offset="1" stop-color="var(--amber)" stop-opacity="0"/></radialGradient>
      <radialGradient id="gSun"><stop offset="0" stop-color="var(--sun)" stop-opacity=".5"/><stop offset="1" stop-color="var(--sun)" stop-opacity="0"/></radialGradient>
      <radialGradient id="gFlash"><stop offset="0" stop-color="var(--flash)" stop-opacity="1"/><stop offset="1" stop-color="var(--flash)" stop-opacity="0"/></radialGradient>
      <radialGradient id="gFire"><stop offset="0" stop-color="var(--amber)" stop-opacity=".9"/><stop offset="1" stop-color="var(--amber)" stop-opacity="0"/></radialGradient>
      <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></radialGradient>
      <linearGradient id="duskG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--glow)" stop-opacity="0"/><stop offset="1" stop-color="var(--glow)" stop-opacity=".75"/></linearGradient>
      <linearGradient id="fogG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--fog)" stop-opacity="0"/><stop offset=".5" stop-color="var(--fog)" stop-opacity=".6"/><stop offset="1" stop-color="var(--fog)" stop-opacity="0"/></linearGradient>
      <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--lamp)" stop-opacity=".4"/><stop offset="1" stop-color="var(--lamp)" stop-opacity="0"/></linearGradient>
      <linearGradient id="beamUp" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="var(--flood)" stop-opacity=".38"/><stop offset="1" stop-color="var(--flood)" stop-opacity="0"/></linearGradient>
    </defs>

    <!-- 晒圖紙：底色、斑駁、格線 -->
    <rect x="0" y="0" width="1600" height="600" class="f-paper"/>
    <image id="mottle" x="0" y="0" width="1600" height="600" preserveAspectRatio="none" href="" opacity=".55" pointer-events="none"/>
    <rect x="0" y="0" width="1600" height="600" fill="url(#gridMin)" pointer-events="none"/>
    <rect x="0" y="0" width="1600" height="600" fill="url(#gridMaj)" pointer-events="none"/>
    <rect id="dusk" x="0" y="120" width="1600" height="310" fill="url(#duskG)" opacity="0" pointer-events="none"/>

    <!-- 天空 -->
    <g id="skyPar">
      <g id="stars" class="night"></g>
      <g id="sun"></g>
      <g id="moon"></g>
      <g id="clouds"></g>
      <g id="wxClouds" opacity="0"></g>
    </g>
    <rect id="skyHit" x="0" y="0" width="1600" height="200" fill="transparent" role="button" tabindex="0" aria-label="天空：白天點了有海鷗飛過，夜晚有飛機的燈劃過"/>
    <g id="plan"></g>
    <g id="birds"></g>
    <!-- 遠景（上游方向，比較淡） -->
    <g id="far"></g>
    <g id="farLights" class="night" pointer-events="none"></g>
    <g id="belfast"></g>
    <g id="boatsBack"></g>
    <!-- 兩岸與地底 -->
    <g id="land"></g>
    <g id="engine"></g>
    <g id="bed"></g>
    <g id="water" pointer-events="none"></g>
    <g id="shore"></g>
    <g id="piers"></g>
    <g id="pipes" pointer-events="none"></g>
    <!-- 橋 -->
    <g id="spans"></g>
    <g id="towers"></g>
    <g id="walk"></g>
    <g id="leaves"></g>
    <g id="gates"></g>
    <g id="trafficFar"></g>
    <g id="trafficNear"></g>
    <g id="peds"></g>
    <g id="fore"></g>
    <g id="plumes" pointer-events="none"></g>
    <!-- 標註 -->
    <g id="dims" pointer-events="none"></g>
    <g id="labels" pointer-events="none"></g>
    <g id="boatsFront"></g>
    <g id="lampGlow" class="night" pointer-events="none"></g>
    <g id="sigLights" pointer-events="none"></g>
    <g id="lightShow" pointer-events="none" opacity="0"></g>
    <g id="fireworks" pointer-events="none"></g>
    <!-- 天氣 -->
    <g id="weather" pointer-events="none">
      <rect id="wxDark" x="0" y="0" width="1600" height="600" style="fill:var(--wx-dark)" opacity="0"/>
      <g id="fog" opacity="0"></g>
      <g id="rain" opacity="0"></g>
      <g id="snow" opacity="0"></g>
    </g>
    <!-- 滑鼠：標註框與十字準星 -->
    <g id="hover" pointer-events="none"></g>
    <g id="cross" pointer-events="none" opacity="0"></g>
    <g id="bubbles" pointer-events="none"></g>
    <rect x="0" y="0" width="1600" height="600" fill="url(#vig)" pointer-events="none"/>
    <!-- 圖框（雙線） -->
    <g pointer-events="none">
      <rect x="7" y="7" width="1586" height="586" class="ln" opacity=".55"/>
      <rect x="12" y="12" width="1576" height="576" class="lnT" opacity=".4"/>
      <path id="frameTicks" class="lnT" opacity=".5"/>
    </g>
  </svg>
  </figure>

  <!-- ===== 互動：控制列 ===== -->
  <div class="panel">
    <button id="btnOpen" class="big" type="button">⛵ 開橋迎帆船</button>
    <button id="btnLight" class="big" type="button">✨ 塔橋點燈秀</button>
    <button id="btnWeather" type="button">天氣：晴</button>
    <button id="btnSound" type="button" aria-pressed="true">🔊 聲音：開</button>
    <button id="btnDay" type="button">☀ 白天</button>
    <button id="btnNight" type="button">☾ 夜晚</button>
    <button id="btnAuto" type="button" aria-pressed="true">自動播放</button>
    <label class="timebox" for="timeRange">
      <span>時間</span>
      <input id="timeRange" type="range" min="0" max="1000" value="438">
      <span class="clock" id="clock">10:30</span>
    </label>
  </div>
  <ul class="hint">
    <li><b>開橋迎帆船</b>：攔下車流，兩片橋葉升起，三桅帆船從橋下駛過。</li>
    <li><b>塔橋點燈秀</b>：入夜後橋身線條一段段亮起，最後放煙火。</li>
    <li><b>點一點</b>：橋葉、平衡錘、引擎房、電梯、車、行人、船、鳥。</li>
    <li><b>滑鼠</b>：移到結構上看名稱與尺寸；河水會隨潮汐漲落。</li>
    <li><b>天氣</b>：晴、多雲、細雨、濃霧、下雪輪流切換。</li>
  </ul>
</main>
<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾

    const y = i === 0 || i === n ? 0 : -h * (.45 + .55 * Math.sin(Math.PI * t)) * srand(.75, 1);
    pts.push([x, y]);

function updateEngine(dt) {
  ENG.run = Math.max(0, ENG.run - dt);
  const on = ENG.run > 0 || Math.abs(bridge.va) > .5;
  const sp = on ? 5 : 0;
  ENG.fly += sp * dt * (reduced ? 0 : 1);
  ENG.wheel.setAttribute('transform', `translate(${ENG.cx} ${ENG.cy}) rotate(${f1(ENG.fly * 57.3)})`);
  const cxp = ENG.cx + Math.cos(ENG.fly) * 14, cyp = ENG.cy + Math.sin(ENG.fly) * 14;
  ENG.rod.setAttribute('d', `M${f1(ENG.cx - 40 + Math.cos(ENG.fly) * 6)} ${ENG.cy}L${f1(cxp)} ${f1(cyp)}`);
  // 蓄壓器：開橋時放出水壓（重物下降），平常引擎慢慢把它頂回去
  if (Math.abs(bridge.va) > .5) ENG.accT = .15; else if (ENG.run > 0) ENG.accT = 1;
  ENG.acc += clamp(ENG.accT - ENG.acc, -dt * .25, dt * .1);
  if (ENG.acc >= .99 && ENG.accT === 1) ENG.accT = .8;
  const wy = lerp(500, 446, ENG.acc);
  ENG.wt.setAttribute('transform', `translate(${ENG.ax} ${f1(wy)})`);
  ENG.ram.setAttribute('y', f1(wy)); ENG.ram.setAttribute('height', f1(Math.max(1, 500 - wy + 20)));
  ENG.ramL.setAttribute('y', f1(wy)); ENG.ramL.setAttribute('height', f1(Math.max(1, 500 - wy + 20)));
  const fire = on ? .9 : .35;
  ENG.fire0.setAttribute('opacity', f1(fire * (.85 + Math.random() * .15)));
  ENG.fire1.setAttribute('opacity', f1(fire * (.85 + Math.random() * .15)));
  ENG.flow.setAttribute('opacity', Math.abs(bridge.va) > .5 ? .95 : 0);
  ENG.flow.setAttribute('stroke-dashoffset', f1(-(performance.now() / 1000 * 40) % 13));
  if (on && Math.random() < dt * 3 && !reduced) puff(140 + rand(-4, 4), DECK - 2, 3, 12, 2.4, .9, -16);
}

/* ---------------- ⑤ 互動：滑鼠標註（名稱＋尺寸） ---------------- */
function bboxOf(n) {
  const b = n.getBBox(), m = svg.getScreenCTM().inverse().multiply(n.getScreenCTM());
  const pts = [[b.x, b.y], [b.x + b.width, b.y], [b.x, b.y + b.height], [b.x + b.width, b.y + b.height]].map(([x, y]) => [m.a * x + m.c * y + m.e, m.b * x + m.d * y + m.f]);
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  return { x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys) };
}
function drawHover(n) {
  const g = $('hover');

  const b = bboxOf(n), pad = 4;
  const x = b.x - pad, y = b.y - pad, w = b.w + pad * 2, h = b.h + pad * 2;
  el('rect', { x: f1(x), y: f1(y), width: f1(w), height: f1(h), style: 'fill:none;stroke:var(--lamp)', 'stroke-width': 1.2, 'stroke-dasharray': '5 4' }, g);
  let c = '';
  [[x, y, 1, 1], [x + w, y, -1, 1], [x, y + h, 1, -1], [x + w, y + h, -1, -1]].forEach(([a, bb, sx, sy]) => { c += `M${f1(a)} ${f1(bb + sy * 9)}V${f1(bb)}H${f1(a + sx * 9)}`; });
  el('path', { d: c, style: 'fill:none;stroke:var(--lamp)', 'stroke-width': 2.4 }, g);
  const name = n.getAttribute('data-name'), size = n.getAttribute('data-size');
  const tg = el('g', { class: 'tag' }, g);

  t.textContent = size ? `${name}｜${size}` : name;
  const tw = (t.getComputedTextLength() || t.textContent.length * 14) + 18;
  const tx = clamp(x + w / 2 - tw / 2, 18, 1582 - tw), ty = y - 22 < 22 ? y + h + 20 : y - 18;

let hoverEl = null, hoverT = 0;
function step(dt) {
  if (T.target != null) {
    let d = T.target - T.t; if (d > .5) d -= 1; if (d < -.5) d += 1;
    if (Math.abs(d) < .002) { T.t = T.target; T.target = null; } else T.t = (T.t + Math.sign(d) * Math.min(Math.abs(d), dt * .25) + 1) % 1;
  } else if (T.auto) T.t = (T.t + dt / DAY_SEC) % 1;
  applyTime();
  applyWeather(dt);
  stepWeather(dt);
  const now = performance.now() / 1000;
  clouds.forEach(c => { c.x += c.v * dt; if (c.x > 1700) c.x = -c.w - 60; c.g.setAttribute('transform', `translate(${f1(c.x)} ${c.y})`); });
  updateWater(now);
  stepShow(dt);
  stepBridge(dt);
  updateGates(dt);
  updateEngine(dt);
  stepCars(dt);
  stepPeds(dt);
  stepVisitors(dt);
  stepBoats(dt);
  stepBirds(dt);
  stepShoreLife(dt);
  stepPuffs(dt);
  stepFireworks(dt);
  updateDims();
  // 旗子飄
  TOWER.flags.forEach(F => { const ph = now * 3 + F.p; F.el.setAttribute('d', `M${F.x} ${F.y}Q${F.x + 6} ${f1(F.y - 1 + Math.sin(ph) * 2)} ${F.x + 13} ${f1(F.y + Math.sin(ph + 1) * 2)}V${f1(F.y + 8 + Math.sin(ph + 1) * 2)}Q${F.x + 6} ${f1(F.y + 7 + Math.sin(ph) * 2)} ${F.x} ${F.y + 8}Z`); });
  // 電梯
  TOWER.liftY += clamp(TOWER.liftT - TOWER.liftY, -30 * dt, 30 * dt);
  if (TOWER.car) TOWER.car.setAttribute('transform', `translate(0 ${f1(TOWER.liftY)})`);
  if (Math.abs(TOWER.liftT - TOWER.liftY) < .5 && Math.random() < dt * .08) TOWER.liftT = TOWER.liftT > 300 ? 252 : DECK - 2;
  // 航空障礙燈閃爍
  const blink = (Math.floor(now * 1.2) % 2) ? 1 : .25;
  aviation.glow.setAttribute('opacity', f1(blink * (.3 + .7 * nOn)));
  aviation.core.setAttribute('opacity', f1(.4 + .6 * blink));
  // 步道遊客的閃光燈
  if (show.on === 'open' && SHIP.s > .9 && SHIP.s < 1.2 && Math.random() < dt * 5) { const v = pick(VIS); camFlash(v.x, WALK.y1 - 8); }
  if (hoverEl && (hoverT -= dt) < 0) { hoverT = .2; drawHover(hoverEl); }
}

}
let last = 0, rafId = 0;
function loop(now) {
  const dt = clamp((now - last) / 1000, 0, .05); last = now;
  step(dt);
  rafId = requestAnimationFrame(loop);
}
function settle(sec) { for (let s = 0; s < sec; s += .05) step(.05); }

}

onAct(document.querySelector('[data-name="高層步道"]'), () => { sfx(click); VIS.forEach(v => { v.P.arms.setAttribute('d', 'M-4 -16.5L-6 -10.5M4 -16.5L7 -24'); setTimeout(() => v.P.arms.setAttribute('d', 'M-4 -16.5L-6 -10.5M4 -16.5L6 -10.5'), 1500); }); say(800, 205, '步道上的遊客在揮手！', 1.6); });
onAct(WK.glass, () => { sfx(t => { noise(t, .2, 900, .06); }); say(800, 205, '玻璃地板：往下看 42 公尺！', 1.8); });
document.querySelectorAll('[data-name="交通欄杆與號誌"]').forEach(h => onAct(h, () => { sfx(click); say(+h.getBBox().x, DECK - 60, '開橋前會亮紅燈、放下欄杆', 1.8); }));
onAct(GATE.cabin, () => { sfx(t => bell(t, 1250, .07, .6)); GATE.opArm.setAttribute('d', 'M2 -3L5 -9'); setTimeout(() => GATE.opArm.setAttribute('d', 'M2 -3L5 -5'), 1200); say(TW[0][0] - 21, DECK - 50, '橋務員：船要過時就開橋，一年約 800 次', 2.2); });
onAct(WATER.gauge, () => { sfx(t => splash(t, .05)); say(WALL[1] - 30, W - 24, `現在潮位 ${((LW - W) / SV).toFixed(1)} m（以低潮為 0）`, 2); });

$('btnOpen').addEventListener('click', tap(() => startShow('open', true)));
$('btnLight').addEventListener('click', tap(() => startShow('light', true)));
$('btnWeather').addEventListener('click', () => {
  userGesture = true; ensureAudio();
  wxI = (wxI + 1) % WX_LIST.length;
  $('btnWeather').textContent = '天氣：' + WX_LIST[wxI][1];
  if (reduced) { applyWeather(0); renderStill(); }
});
$('btnSound').addEventListener('click', () => {
  soundOn = !soundOn; userGesture = true;
  $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  if (ensureAudio()) {
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.setValueAtTime(soundOn ? .5 : 0, actx.currentTime);
    if (!soundOn && musNode) { try { musNode.disconnect(); } catch (e) {} musNode = null; }
  }
});
$('btnDay').addEventListener('click', () => goTo(10.5 / 24));
$('btnNight').addEventListener('click', () => goTo(21.5 / 24));
$('btnAuto').addEventListener('click', () => { T.auto = !T.auto; T.target = null; syncAuto(); });
$('timeRange').addEventListener('input', e => {
  T.t = e.target.value / 1000; T.target = null; T.dragging = true; applyTime(true); T.dragging = false;
  if (reduced) renderStill();
});
// 滑鼠：十字準星＋座標、移到結構上標出名稱與尺寸
const cross = $('cross');
const chH = el('line', { x1: 0, x2: 1600, class: 'dsh', opacity: .35 }, cross);
const chV = el('line', { y1: 0, y2: 600, class: 'dsh', opacity: .35 }, cross);
el('circle', { r: 6, class: 'ln' }, cross);
const chC = cross.lastChild;
const chT = el('text', { class: 'mono' }, cross);
function svgPoint(e) { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
svg.addEventListener('pointerdown', () => { userGesture = true; ensureAudio(); document.body.classList.remove('kbd'); });
window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
svg.addEventListener('pointermove', e => {
  const p = svgPoint(e);
  if (e.pointerType === 'mouse') {
    cross.setAttribute('opacity', 1);
    chH.setAttribute('y1', f1(p.y)); chH.setAttribute('y2', f1(p.y));
    chV.setAttribute('x1', f1(p.x)); chV.setAttribute('x2', f1(p.x));
    chC.setAttribute('cx', f1(p.x)); chC.setAttribute('cy', f1(p.y));
    const m = (p.x - WALL[0]) * 244 / (ST[1][1] - ST[0][0]), e2 = elevM(p.y);
    chT.textContent = `距南岸 ${m.toFixed(0)} m  高 ${e2 >= 0 ? '+' : ''}${e2.toFixed(1)} m`;
    chT.setAttribute('x', f1(Math.min(p.x + 10, 1420))); chT.setAttribute('y', f1(Math.max(p.y - 10, 24)));
  }
  const h = e.target.closest && e.target.closest('#scene .hot');
  if (h !== hoverEl) { hoverEl = h; hoverT = 0; drawHover(h); }
});
svg.addEventListener('pointerleave', () => { cross.setAttribute('opacity', 0); hoverEl = null; drawHover(null); });
mq.addEventListener?.('change', e => { reduced = e.matches; if (!reduced) { T.auto = true; syncAuto(); } start(); });

applyTime(true);
applyWeather(0);
syncAuto();
// 開場：先讓路上有車、有人，河上有一艘船
(() => {
  quiet = true;
  for (let i = 0; i < 5; i++) spawnPed(rand(60, 1540));
  spawnBoat('clipper', 1); BOATS[0].s = .45;
  for (let s = 0; s < 14; s += .05) step(.05);
  quiet = false;
})();
start();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on,
  btn: { open: 'btnOpen', light: 'btnLight' },
  save: () => ({ ...T }),
  stop: () => {
    if (show.on === 'open') {
      // 帆船收走、橋葉放平、柵欄打開
      hideShip(); bridge.aT = 0; bridge.a = 0; bridge.va = 0;
      GATE.state = 'green'; GATE.down = 0; GATE.downT = 0;
    } else $('lightShow').setAttribute('opacity', 0);
    endShow();
  },
  restore: s => { Object.assign(T, s); syncAuto(); applyTime(true); renderStill(); }
});
/* /ShowStop */
})();
</script>
</body>
</html>
