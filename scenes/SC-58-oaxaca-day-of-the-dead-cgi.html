<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>瓦哈卡亡靈節的萬壽菊遊行</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-58 瓦哈卡亡靈節的萬壽菊遊行｜CGI 電影質感
   地點：墨西哥瓦哈卡（Oaxaca）老城的馬塞多尼奧・阿爾卡拉步行街（Andador Macedonio Alcalá），
         街道盡頭是聖多明哥教堂（Templo de Santo Domingo de Guzmán）。
   構圖：真正的一點透視——攝影機站在步行街上、與眼睛同高，兩側彩色老屋一路往遠方收斂，
         剪紙旗一串串橫跨街道（越遠越小），教堂立在街底的廣場上，遠方是瓦哈卡谷地四周的山。
   光影：午後的太陽在教堂右上方——逆光讓剪紙旗發亮；右側房子的影子斜斜鋪在街上，
         左側牆面被陽光擦亮；人物有逆光輪廓光與長長的影子。夜晚由牆上鐵燈籠、窗燈、
         燈泡串、燭火照亮。另有體積光、鏡頭光暈、空氣透視、景深、電影調色、暗角、底片顆粒。
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   --d-名稱（白天）／--n-名稱（夜晚，沒寫就由程式自動算出藍調夜色）／--k-名稱（晨昏，可省略）。
   JS 依時間內插輸出成 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）class。
   牆面的「受光面／背光面」也由程式從同一個顏色算出（-lit、-sh）。
   ========================================================= */
:root{
  color-scheme: light;

  /* —— 天空 —— */
  --d-sky-top:#3f86cc;  --k-sky-top:#4a4a9a;  --n-sky-top:#0a0c26;
  --d-sky-mid:#8cc0e6;  --k-sky-mid:#d8869a;  --n-sky-mid:#1a1a44;
  --d-sky-low:#f4dcb4;  --k-sky-low:#ffa05a;  --n-sky-low:#4a2a5a;
  --d-cloud:#fff8ee;    --k-cloud:#ffcfb0;    --n-cloud:#34345e;
  --d-cloud-sh:#c8d0de; --k-cloud-sh:#b07a8a; --n-cloud-sh:#1e1e40;
  --d-overcast:#a8b0bc; --n-overcast:#1e2036;
  --d-mtn-far:#9ab0c8;  --k-mtn-far:#a07a98;  --n-mtn-far:#1c1e40;   /* 瓦哈卡谷地四周的山 */
  --d-mtn-near:#7e9a9a; --k-mtn-near:#8a6a7a; --n-mtn-near:#161a34;
  --d-haze:#dfe6ec;     --k-haze:#f4c0a0;     --n-haze:#1e2046;      /* 空氣透視：越遠越淡、越偏天色 */

  /* —— 主角：聖多明哥教堂（淡綠黃色的 cantera 石材） —— */
  --d-stone:#d6c99a;    --k-stone:#f0b878;    --n-stone:#3a3448;
  --d-stone-sh:#a8a07e; --k-stone-sh:#b07a64; --n-stone-sh:#262236;
  --d-stone-dk:#4e4636; --n-stone-dk:#120e1a;     /* 拱洞、門洞 */
  --d-dome:#cdb48a;     --k-dome:#e8a070;     --n-dome:#2e2838;
  --d-tile:#e8d26a;     --n-tile:#3a3436;         /* 鐘樓圓頂的黃綠瓷磚 */
  --d-plaza:#c4b896;    --k-plaza:#d8a07a;    --n-plaza:#2a2638;
  --d-agave:#6e9a8a;    --n-agave:#18262a;
  --d-church-door:#5a3a24; --n-church-door:#1a0e0e;

  /* —— 街屋（瓦哈卡老城的彩色厚牆老屋）：程式會再算出受光面 -lit 與背光面 -sh —— */
  --d-b-ochre:#d99a3c;  --d-b-indigo:#3c5aa0; --d-b-pink:#d8467e; --d-b-terra:#c4583a;
  --d-b-cream:#eadcc0;  --d-b-turq:#3ea29a;   --d-b-yellow:#e8bc3e; --d-b-red:#b8343a;
  --d-b-green:#6a9a5a;  --d-b-blue:#4a86c0;   --d-b-rose:#e0848a;   --d-b-lilac:#8a6ab0;
  --d-cantera:#9aa486;  --n-cantera:#24262e;      /* 門窗的綠色石框 */
  --d-trim:#f4ead6;     --n-trim:#3a3646;         /* 白色線腳、窗台 */
  --d-wood:#6a3e22;     --n-wood:#1c1210;         /* 木門 */
  --d-wood-hi:#8a5630;  --n-wood-hi:#2a1a14;
  --d-iron:#22202a;     --n-iron:#0a0810;         /* 鐵窗花、陽台欄杆、燈籠 */
  --d-glass:#3a4256;    --n-glass:#121424;        /* 白天的窗：暗色玻璃 */
  --d-reveal:#00000040; --n-reveal:#00000070;     /* 厚牆的窗洞側面 */
  --d-bougain:#d0207a;  --n-bougain:#3a1030;      /* 九重葛 */
  --d-leaf:#4a7a3a;     --n-leaf:#121e1a;

  /* —— 地面：綠灰色 cantera 石板步行街 —— */
  --d-pave:#a8a690;     --k-pave:#b88a74;     --n-pave:#24243a;
  --d-pave-far:#c6bea0; --k-pave-far:#e0a880; --n-pave-far:#2c2a44;
  --d-joint:#5a584a;    --n-joint:#0c0c18;
  --d-sunlit:#ffd08a66; --k-sunlit:#ff9a5a80; --n-sunlit:#ffd08a00;   /* 地上的陽光 */
  --d-shade:#24305a30;  --n-shade:#00000000;                          /* 地上的陰影（夜裡沒有） */
  --d-rim:#ffe6b0e6;    --k-rim:#ffb070f0;    --n-rim:#ffd09000;      /* 人物的逆光輪廓光 */
  --d-castsh:#1a2040a0; --n-castsh:#00000000;                         /* 人物的長影子 */

  /* —— 角色（白天的顏色；夜色由程式自動算出） —— */
  --d-skin-1:#e8b890; --d-skin-2:#c8906a; --d-skin-3:#a06c48; --d-skin-4:#7a4e34;
  --d-hair-1:#1a1418; --d-hair-2:#3e2618; --d-hair-3:#b8b0a8;
  --d-c-1:#c8323a; --d-c-2:#2f5d9a; --d-c-3:#e8a83a; --d-c-4:#3f8a6a; --d-c-5:#7a4aa0;
  --d-c-6:#e06a8a; --d-c-7:#34343e; --d-c-8:#efe8da; --d-c-9:#2a9a96; --d-c-10:#d8642a;
  --d-p-1:#2a2e40; --d-p-2:#4e4236; --d-p-3:#34507a;
  --d-shoe:#1e1a1a;
  --d-face:#f4f0e6;     /* 骷髏彩妝的白臉 */
  --d-socket:#1a1420;   /* 黑眼窩 */
  --d-robe:#1e1c26; --d-bone:#ece6d4; --d-devil:#b8202c; --d-devil-dk:#5a0e18;
  --d-brass:#e0b040; --d-brass-dk:#8a6418;
  --d-banner:#5a2a7a;   /* 遊行隊伍的紫色旗幟 */
  --d-xolo:#3e3236; --d-xolo-hi:#6a5a5e;           /* 墨西哥無毛犬 */
  --d-zanate:#16141e;                               /* 大尾擬八哥 */
  --d-cart:#7a4a2a; --d-cart-dk:#4a2a16;
  --d-cloth:#f6f0e2;  --d-cloth-2:#7a2a8a;          /* 祭壇白桌巾、紫色桌布 */
  --d-cane:#7aa04a;   --d-cane-dk:#4e7030;          /* 祭壇拱門的甘蔗 */
  --d-mari:#f08a10;   --d-mari-2:#ffb420; --d-mari-dk:#b85a08;   /* 萬壽菊 cempasúchil */
  --d-cresta:#a8143e; --d-cresta-2:#d83066;                      /* 雞冠花 */
  --d-pan:#d48a3a;    --d-pan-dk:#9a5a1e;                        /* 亡靈麵包 */
  --d-skull:#f6f2e8;  --d-orange:#f08c1c; --d-banana:#ecc840; --d-apple:#c8303a;
  --d-photo:#d8c6a0;  --d-photo-dk:#7a6248;                      /* 祭壇上的老照片（只畫剪影） */
  --d-clay:#a8542e;   --d-clay-dk:#6a3018;                       /* 陶香爐、陶杯 */
  --d-sand-1:#f0e2c0; --d-sand-2:#e07a1a; --d-sand-3:#6a2a8a; --d-sand-4:#2a8a5a; --d-sand-5:#c8282e; --d-sand-6:#1e1a22;   /* 彩沙地毯 */
  --d-pp-1:#e8287e; --d-pp-2:#f88a12; --d-pp-3:#8a3ac8; --d-pp-4:#2ab06e; --d-pp-5:#ffd23a; --d-pp-6:#2a90e0; --d-pp-7:#ee3a3a;  /* 剪紙旗 */
  --d-string:#5a5050; --n-string:#141018;

  /* —— 不隨日夜變化的顏色（光源） —— */
  --sun:#fff2c8; --moon:#f2eedc; --star:#fff6d6;
  --lamp:#ffc66a; --lamp-hi:#fff0c0; --win-lit:#ffbe62; --win-lit-2:#ffd890;
  --flame:#ffb02e; --flame-hi:#fff4b8; --bulb:#ffe09a;
  --marmota-glow:#ffd8a0; --soul:#ffb43a; --monarch:#f07a10; --monarch-dk:#1a120e;
  --rainc:#c4d4e8; --copal:#ece6dc;
  --cine-shade:#140a18; --cine-light:#ffe0b0;
  --grade-cool:#1e5a8a; --grade-warm:#ffb060;

  /* —— 頁面介面 —— */
  --page-bg:#f6ecdc; --page-fg:#2a1e2a; --page-muted:#7a6a62;
  --ui-surface:#fff8ec; --ui-line:#e2cfb4; --ui-accent:#d8401e;
  --ui-hot:#e0287a; --ui-hot-2:#7a3ab8; --ui-on:#ffb420;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border:1px solid var(--ui-line);border-radius:14px;overflow:hidden;background:#141020;line-height:0;box-shadow:0 2px 12px #0000002a}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:12px;padding:10px 14px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--page-fg);border-color:var(--page-fg);color:var(--ui-surface);font-weight:700}
.panel button.big{border-color:var(--ui-accent);color:#fff;background:var(--ui-accent);font-weight:700}
.panel button.big.alt{border-color:var(--ui-hot-2);background:var(--ui-hot-2)}
.panel button.big.on{background:var(--ui-on);border-color:var(--ui-on);color:var(--page-fg)}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid var(--ui-accent);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding-left:1.2em;color:var(--page-muted);font-size:14px;line-height:1.75}
.hint b{color:var(--page-fg)}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable,#scene [role="button"]{cursor:pointer}
#scene .noHit{pointer-events:none}
#scene .screen{mix-blend-mode:screen}
#scene .bubble text{fill:#2a1e2a;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>

<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600。所有建築、地面、剪紙旗都用「一點透視」由 3D 座標投影出來：
       攝影機高 1.7 公尺、焦距 1000、地平線在 y=318。
       圖層由後往前：天空 → 遠山 → 教堂與廣場 → 遠處街屋 → 十字路口裡的人 → 近處街屋
       → 地面光影 → 剪紙旗 → 街上的人（依遠近排序）→ 前景（花車、祭壇）→ 燈光 → 鏡頭效果
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="瓦哈卡老城的步行街，兩旁是彩色老屋，剪紙旗橫跨街道，街底是聖多明哥教堂；右前方有一座萬壽菊亡靈祭壇。">
    <defs>
      <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-top)"/><stop offset=".5" style="stop-color:var(--sky-mid)"/><stop offset="1" style="stop-color:var(--sky-low)"/>
      </linearGradient>
      <radialGradient id="sunGlow"><stop offset="0" stop-color="#fff6dc" stop-opacity="1"/><stop offset=".12" stop-color="#fff0c8" stop-opacity=".9"/><stop offset=".35" stop-color="#ffc878" stop-opacity=".35"/><stop offset="1" stop-color="#ff9a50" stop-opacity="0"/></radialGradient>
      <radialGradient id="moonGlow"><stop offset="0" stop-color="#f2eedc" stop-opacity=".5"/><stop offset="1" stop-color="#f2eedc" stop-opacity="0"/></radialGradient>
      <radialGradient id="cloudG" cx=".5" cy=".42" r=".55"><stop offset="0" style="stop-color:var(--cloud)"/><stop offset=".6" style="stop-color:var(--cloud)" stop-opacity=".85"/><stop offset="1" style="stop-color:var(--cloud-sh)" stop-opacity="0"/></radialGradient>
      <radialGradient id="rayG" cx="0" cy="0" r="1100" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffe6b8" stop-opacity=".6"/><stop offset=".35" stop-color="#ffd6a0" stop-opacity=".2"/><stop offset="1" stop-color="#ffd6a0" stop-opacity="0"/></radialGradient>
      <radialGradient id="ghostG"><stop offset="0" stop-color="#8fd0ff" stop-opacity=".05"/><stop offset=".8" stop-color="#8fd0ff" stop-opacity=".2"/><stop offset="1" stop-color="#8fd0ff" stop-opacity="0"/></radialGradient>
      <radialGradient id="ghostW"><stop offset="0" stop-color="#ffb070" stop-opacity=".28"/><stop offset="1" stop-color="#ffb070" stop-opacity="0"/></radialGradient>
      <linearGradient id="streakG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb870" stop-opacity="0"/><stop offset=".5" stop-color="#fff0d0" stop-opacity=".9"/><stop offset="1" stop-color="#ffb870" stop-opacity="0"/></linearGradient>
      <radialGradient id="vigG" cx=".5" cy=".5" r=".72"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".66"/></radialGradient>
      <linearGradient id="gradeG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--grade-cool)"/><stop offset=".55" stop-color="#808080"/><stop offset="1" style="stop-color:var(--grade-warm)"/></linearGradient>
      <radialGradient id="lampG"><stop offset="0" stop-color="#fff0c0" stop-opacity=".95"/><stop offset=".25" stop-color="#ffc66a" stop-opacity=".5"/><stop offset="1" stop-color="#ff9a3a" stop-opacity="0"/></radialGradient>

<script id="showstop">
/* =========================================================

       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾

       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）

           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，

const flags = [], bulbs = [], perched = [];

function flagD(w, h, kind, detail) {

/* ---------------- ⑤ 互動：兩首原創表演配樂 ----------------

/* ---------------- ④ 動畫：日夜 ---------------- */
const T = { t: 16.5 / 24, auto: true, target: null, dragging: false };

// 天空看得到的範圍（兩側屋頂線之間）

  if (x > 650 && x < 950) return x > 676 && x < 924 ? (Math.abs(x - 800) > 66 ? 40 : 128) : 230;
  const s = x < 800 ? -1 : 1, list = s < 0 ? LEFT : RIGHT;
  let Z = WX * F / Math.abs(x - 800);
  let h = hOf(list, Z);
  if (!h) { if (Z > CROSS[0] && Z < CROSS[1]) { Z = CROSS[1]; h = hOf(list, CROSS[1] + .1); } else return 230; }
  return HY - (h - CAMH) * F / Z;
}
function applyTime(force) {
  if (!force && Math.abs(T.t - lastApplied) < .0018) return;
  lastApplied = T.t;

  night = clamp(1 - smooth(5.6, 7.2, h) + smooth(18.4, 20, h), 0, 1);
  dusk = Math.max(Math.exp(-Math.pow((h - 6.6) / 1, 2)), Math.exp(-Math.pow((h - 18.6) / 1.1, 2)));

    const Pp = PAIRS[k];
    let c = mix(Pp.d, Pp.n, night);
    if (Pp.k) c = mix(c, Pp.k, dusk * .8 * (1 - night * .6));

  sunY = 340 - Math.sin(Math.PI * clamp(sp, 0, 1)) * 300;

   vigil ：燭光守夜——教堂敲鐘、天色暗下來，牆邊的杯蠟燭由遠而近一盞盞點亮，教堂打上暖光，
           柯巴脂香煙裊裊，亡靈化成光點從街底飄回祭壇，帝王蝶也飛來（約 21 秒） */
const show = { on: '', t: 0, dur: 0 };
let vigilDim = 0;
function startParade(auto) {
  if (show.on) { busy(); return; }
  ensureAudio();
  Object.assign(show, { on: 'parade', t: 0, dur: 26 });
  startParadeMembers();
  $('btnParade').classList.add('on');
  if (!auto && audioOK()) { paradeMusic(actx.currentTime + .05); duckSfx(22); duckMusic(22); }
  say(800, 250, pick(['遊行來囉！', '¡Ya viene la comparsa!（遊行隊伍來了！）']), 1.8);
}
function startVigil(auto) {
  if (show.on) { busy(); return; }
  ensureAudio();
  Object.assign(show, { on: 'vigil', t: 0, dur: 22 });
  $('btnVigil').classList.add('on');
  streetCandles.forEach(c => { c.at = 1.8 + clamp((62 - c.z) / 53, 0, 1) * 9 + srand(0, .6); });
  bells.forEach((b, i) => { b.v = 40 + i * 8; });
  candlesLit = true;
  for (let i = 0; i < 5; i++) addMonarch(rand(-40, 1640), rand(80, 200), [1280 + rand(-80, 80), 260 + rand(-40, 40)]).temp = true;
  if (!auto && audioOK()) { vigilMusic(actx.currentTime + .05); duckSfx(21); duckMusic(21); }
  say(800, 120, pick(['鐘響了，點起蠟燭守夜吧', '萬壽菊的香氣會帶亡靈回家']), 2.2);
}
function endShow() {
  $('btnParade').classList.remove('on'); $('btnVigil').classList.remove('on');
  if (show.on === 'vigil') for (let i = monarchs.length - 1; i >= 0; i--) if (monarchs[i].temp) { monarchs[i].hx = rand(-100, 1700); monarchs[i].hy = -80; monarchs[i].leaving = true; }
  show.on = '';
}
function busy() { say(800, 160, '表演進行中，等一下喔！', 1.4); }
function showStep(dt) {
  show.t += dt;
  if (show.on === 'parade') {
    if (show.t > 1.5 && show.t < 22 && Math.random() < dt * 9) petal(rand(200, 1400), rand(-10, 60), rand(-20, 20), rand(10, 40));
    if (!parade.on && show.t > 8) show.t = Math.max(show.t, show.dur);
  } else if (show.on === 'vigil') {
    if (show.t > 3 && show.t < 18) { copalT = Math.max(copalT, .5); if (Math.random() < dt * 2.2) spawnSoul(); }
    if (show.t > 6 && show.t < 18 && Math.random() < dt * 4) petal(rand(1150, 1520), rand(120, 200), rand(-20, 20), 0);
  }
  if (show.t >= show.dur) endShow();
}

/* ---------------- ④ 動畫：逐格主迴圈 ---------------- */
const mouse = { x: 800, y: 300, in: false };
let frame = 0, last = performance.now(), acc = 0, rafId = 0, copalT = 0;
function loop(now) {
  const real = Math.min(.25, (now - last) / 1000); last = now; acc += real;
  if (acc >= 1 / FPS) { const dt = Math.min(acc, .25); acc = 0; step(dt); }
  rafId = requestAnimationFrame(loop);
}
function step(dt) {
  frame++; time += dt;
  const mv = reduced ? 0 : 1;
  if (show.on) showStep(dt);
  if (T.target != null) {
    let d = T.target - T.t; if (d > .5) d -= 1; if (d < -.5) d += 1;
    if (Math.abs(d) < .004) { T.t = T.target; T.target = null; } else T.t = (T.t + Math.sign(d) * Math.min(Math.abs(d), dt * .12) + 1) % 1;
  } else if (T.auto && !T.dragging) T.t = (T.t + dt / DAY_SEC) % 1;
  applyTime();
  // 天氣
  const key = WX_LIST[wxI][0];
  for (const k in wx) { const tg = key === k ? 1 : 0; wx[k] += (tg - wx[k]) * Math.min(1, dt * 1.1); if (Math.abs(tg - wx[k]) < .003) wx[k] = tg; }
  const grey = Math.max(wx.cloud * .8, wx.rain);
  sunK = (1 - night) * (1 - grey * .85) * smooth(.02, .25, Math.sin(Math.PI * clamp((T.t * 24 - 6.2) / 12.8, 0, 1)));
  setA($('overcastSky'), 'opacity', f1(grey * .6 * (1 - night * .5)));
  setA($('sunG'), 'opacity', f1(1 - grey * .8));
  setA($('stars'), 'opacity', f1(smooth(.6, 1, night) * (1 - grey * .9)));
  if (mv && frame % 3 === 0) stars.forEach((s, i) => { if ((frame + i) % 5 === 0) s.el.setAttribute('opacity', f1(.5 + .5 * Math.sin(time * 3 + s.ph))); });
  setA($("rainG"), "opacity", f1(wx.rain * .55));
  if (wx.rain > .02 && mv) { const o = (time * 700) % 120; $('rain1').setAttribute('transform', `translate(${f1(-o * .15)} ${f1(o)})`); $('rain2').setAttribute('transform', `scale(1.4) translate(${f1(-o * .1)} ${f1((time * 520) % 120)})`); }
  setA($('wetSheen'), 'opacity', f1(wx.rain * .9));
  rainSound(soundOn ? wx.rain : 0);
  clouds.forEach(c => { if (mv) { c.x += c.sp * dt * (1 + grey); if (c.x > 1800) c.x = -200; } setA(c.el, 'transform', `translate(${f1(c.x)} ${f1(c.y + grey * 30)}) scale(${f1(1 + grey * .4)})`); });
  // 地上的陽光與陰影
  setA(sunGround, 'opacity', f1(sunK)); setA(shadeGround, 'opacity', f1(Math.max(sunK, .25 * (1 - night))));
  // 攝影機
  stepCamera(dt, mv);
  // 剪紙旗飄動（風、陣風、滑鼠靠近）
  gust = Math.max(0, gust - dt * .45);
  const wind = .3 + wx.rain * .4 + gust * 1.8;
  if (mv) flags.forEach((f, i) => {
    if ((i + frame) % 2) return;
    const near = mouse.in && Math.abs(mouse.y - f.y) < 60 && Math.abs(mouse.x - f.x) < 70 ? 1 : 0;
    const a = Math.sin(time * 3.2 + f.ph) * (5 + wind * 16 + near * 16) * f.amp, sy = 1 - Math.abs(Math.sin(time * 2.4 + f.ph)) * (.08 + wind * .25);
    f.n.setAttribute('transform', `translate(${f1(f.x)} ${f1(f.y)}) rotate(${f1(a * .5)}) scale(1 ${sy.toFixed(3)}) skewX(${f1(a)})`);
  });
  // 教堂的鐘
  bells.forEach(b => { b.v += (-b.a * 30 - b.v * 1.1) * dt; b.a += b.v * dt; setA(b.inner, 'transform', `rotate(${f1(clamp(b.a, -70, 70))} 0 0)`); b.g.setAttribute('transform', `translate(${f1(b.x + cam.mx * 4)} ${f1(b.y)})`); });
  if (show.on === 'vigil' && show.t < 4) bells.forEach(b => { if (Math.abs(b.a) < 6 && Math.abs(b.v) < 20) b.v += 34; });
  // 夜色、燈光
  const vigilTarget = show.on === 'vigil' ? (show.t < show.dur - 2.5 ? 1 : 0) : 0;
  vigilDim += (vigilTarget - vigilDim) * Math.min(1, dt * .8);
  setA($('veil'), 'opacity', f1(clamp(vigilDim * .62 * (1 - night * .5), 0, .8)));
  setA($('veil2'), 'opacity', f1(clamp(vigilDim * .3 * (1 - night * .5) + grey * .08, 0, .6)));
  lightOn = clamp(Math.max(nOn, vigilDim * 1.2, grey * .35 * smooth(.2, .5, night + .3)), 0, 1);
  litGroups.forEach(g => setA(g, 'opacity', f1(lightOn)));
  setA(bulbG, 'opacity', f1(Math.max(lightOn, show.on === 'parade' ? .6 : 0)));
  if (frame % 2 === 0) bulbs.forEach((b, i) => setA(b.e, 'opacity', f1(.65 + .35 * Math.sin(time * 2 + b.ph))));
  setA(churchFlood, 'opacity', f1(clamp(Math.max(nOn, vigilDim * smooth(2, 7, show.t)), 0, 1)));
  setA(altarGlow, 'opacity', f1(candlesLit ? clamp(Math.max(nOn, vigilDim) * .9 + .1, 0, 1) : 0));
  altarFlames.forEach(fl => { fl.a += ((candlesLit ? 1 : 0) - fl.a) * Math.min(1, dt * 8); flick(fl, fl.a); });
  const fk = frame % 3;
  streetCandles.forEach((c, i) => {
    const on = (show.on === 'vigil' && show.t > c.at && show.t < show.dur - 1.5) || (night > .7 && c.night);
    c.fl.a += ((on ? 1 : 0) - c.fl.a) * Math.min(1, dt * 5);
    if (c.fl.a < .01 && !on) c.fl.a = 0;
    flick(c.fl, c.fl.a, c.z < 30 && i % 3 === fk);
  });
  tapeteCandles.forEach((c, i) => { c.fl.a += (((night > .55 || vigilDim > .3) ? 1 : 0) - c.fl.a) * Math.min(1, dt * 4); flick(c.fl, c.fl.a, i % 2 === frame % 2); });
  // 角色
  resolveYield();
  stepWalkers(dt); stepWatchers(dt); stepParade(dt); stepDog(dt);
  if (frame % 2 === 0) sortActors();
  stepZanates(dt); stepSkyBirds(dt); stepMonarchs(dt);
  for (let i = monarchs.length - 1; i >= 0; i--) if (monarchs[i].leaving && monarchs[i].y < -40) { monarchs[i].g.remove(); monarchs.splice(i, 1); }
  // 香煙、花瓣、亡靈光點
  if (copalT > 0) copalT -= dt;
  const [cbx, cby, cbs] = copalBurner.pos;
  if (Math.random() < dt * (copalT > 0 ? 7 : 1.4)) puff(cbx + rand(-4, 4), cby, cbs, copalT > 0);
  stepSmoke(dt); stepPetals(dt); stepSouls(dt);
  if (night > .75 && !show.on && Math.random() < dt * .25) spawnSoul();
  stepSparks(dt);
  bubbles.forEach(b => { b.t -= dt; if (b.t <= 0) b.g.remove(); else b.g.setAttribute('opacity', f1(Math.min(1, b.t / .3))); });
  for (let i = bubbles.length - 1; i >= 0; i--) if (bubbles[i].t <= 0) bubbles.splice(i, 1);
  stepLens(dt);
}
function flick(fl, a, move = true) {
  setA(fl.g, 'display', a < .01 ? 'none' : 'inline');
  if (a < .01) return;
  setA(fl.g, 'opacity', f1(a));
  if (a > .02 && move) fl.g.setAttribute('transform', `translate(${f1(fl.x)} ${f1(fl.y)}) scale(${f1(.88 + Math.random() * .24)} ${f1(.9 + Math.random() * .25)})`);
}

/* ---------------- ⑤ 互動：天空的煙火 cohete（夜晚點天空） ---------------- */
const sparks = [];
function cohete(x) {
  const g = el('g', {}, $('fireworks'));
  el('circle', { r: 2.6, fill: '#ffe39a' }, g);
  sparks.push({ rocket: true, g, x, y: 300, vy: -300, life: rand(.7, .95) });
}
function stepSparks(dt) {
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    if (s.rocket) {
      s.y += s.vy * dt; s.life -= dt;
      s.g.setAttribute('transform', `translate(${f1(s.x)} ${f1(s.y)})`);
      if (s.life <= 0) {
        s.g.remove(); sparks.splice(i, 1);
        const cols = ['#ff5aa0', '#ffd23a', '#ff9a2a', '#6ae0a0', '#7ab8ff', '#ffffff'], c = pick(cols);
        for (let k = 0; k < 26; k++) {
          const a = k / 26 * Math.PI * 2, sp = rand(70, 120);
          const e = el('circle', { r: 2.4, fill: Math.random() < .3 ? '#fff4c8' : c }, $('fireworks'));
          sparks.push({ e, x: s.x, y: s.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1.5 });
        }
      }
      continue;
    }
    s.life -= dt; s.vy += 50 * dt; s.vx *= .985; s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.life <= 0) { s.e.remove(); sparks.splice(i, 1); continue; }
    s.e.setAttribute('cx', f1(s.x)); s.e.setAttribute('cy', f1(s.y)); s.e.setAttribute('opacity', f1(Math.min(1, s.life)));
  }
}

/* ---------------- ⑤ 互動：對話泡泡 ---------------- */
const bubbles = [];
function say(x, y, text, dur = 1.6) {
  const g = el('g', { class: 'bubble' }, $('bubbles'));
  const w = Math.min(560, text.length * 15 + 30);
  x = clamp(x, w / 2 + 16, 1600 - w / 2 - 16); y = clamp(y, 30, 560);
  el('rect', { x: -w / 2, y: -18, width: w, height: 36, rx: 18, fill: '#fffaf0', opacity: .96 }, g);
  el('path', { d: 'M-8 17 L0 28 L8 17Z', fill: '#fffaf0', opacity: .96 }, g);
  const t = el('text', { x: 0, y: 0 }, g); t.textContent = text;
  g.setAttribute('transform', `translate(${f1(x)} ${f1(y)})`);
  bubbles.push({ g, t: reduced ? dur + 1 : dur });
  if (reduced) setTimeout(() => g.remove(), (dur + 1) * 1000);
}
function sayAt(A, text) { const [x, y] = prj(A.X, 2.1, A.Z); say(x, y - 24, text, 1.8); }

/* ---------------- 開始：依序畫出場景、角色 ---------------- */
function onAct(node, fn) {
  node.addEventListener('click', e => { e.stopPropagation(); userGesture = true; ensureAudio(); fn(e); if (reduced) step(1 / FPS); });
  node.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); userGesture = true; ensureAudio(); fn(e); if (reduced) step(1 / FPS); } });
}
drawSky();
drawMountains();
drawChurch();
drawStreet();
drawGround();
drawForeground();
drawTapete();
drawPapel();
drawCart();
drawAltar();
drawCornerPots();
drawLights();
drawLens();
buildWatchers();
buildDog();
actors.push(Object.assign(dog, { id: actorId++, static: true, r: .4, op: 1, layer: 'm' }));
buildParade();
buildZanates();
[[1260, 300], [1380, 250], [300, 330]].forEach(h => addMonarch(h[0], h[1], h));
const startRoutes = ['plazaL', 'crossR', 'plazaDoorR', 'thruLR', 'doorL', 'plazaR', 'crossL', 'thruRL', 'plazaDoorL', 'doorR', 'plazaL', 'crossR'];
startRoutes.forEach((r, i) => addWalker(i, r, srand(.08, .85)));

/* ---------------- ⑤ 互動：點擊 ---------------- */
function svgPoint(e) { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
svg.addEventListener('pointerdown', () => { userGesture = true; ensureAudio(); document.body.classList.remove('kbd'); });
window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
svg.addEventListener('pointermove', e => { const p = svgPoint(e); mouse.x = p.x; mouse.y = p.y; mouse.in = true; });
svg.addEventListener('pointerleave', () => { mouse.in = false; });
onAct($('church'), () => { bells.forEach((b, i) => { b.v += 70 + i * 12; }); sfx(t => { bell(t, 196); bell(t + .7, 165, .12); bell(t + 1.4, 196, .1); }); say(800, 70, pick(['噹——噹——', '聖多明哥教堂的鐘聲']), 1.6); });
onAct($('Lpapel'), () => { gust = 1; scareZanates(); sfx(t => { paperRustle(t); grackle(t + .3); }); });
onAct($('altar'), () => {
  candlesLit = !candlesLit;
  sfx(t => candlesLit ? match(t) : blowOut(t));
  say(1320, 150, candlesLit ? '點亮蠟燭，替亡靈照亮回家的路' : '蠟燭吹熄了', 1.6);
});
onAct(copalBurner, () => { copalT = 3; sfx(t => copalPuff(t)); });
onAct(cartG, () => {
  const [x, y] = prj(-6.2, 1.4, 9.9);
  for (let k = 0; k < 24; k++) petal(x + rand(-80, 80), y + rand(-20, 10), rand(-60, 60), rand(-140, -60));
  vendor.wave = 1.6; sayAt(vendor, vendor.say); sfx(t => whoosh(t));
});
onAct(dog.g, () => { dog.hop = 1; dog.wait = Math.max(dog.wait, 1.2); sfx(t => bark(t)); });
onAct($('sunG'), () => { T.auto = false; syncAuto(); goTo(21 / 24); });
onAct($('moonG'), () => { T.auto = false; syncAuto(); goTo(16.5 / 24); });
$('skyHit').addEventListener('click', e => {
  userGesture = true; ensureAudio();
  const p = svgPoint(e);
  if (night > .5) { cohete(p.x); sfx(t => rocket(t)); }
  else { skyFlock(); sfx(t => grackle(t)); }
});

/* ---------------- ⑤ 互動：控制列 ---------------- */
function syncAuto() { $('btnAuto').setAttribute('aria-pressed', String(T.auto)); $('btnAuto').textContent = T.auto ? '自動播放中' : '自動播放'; }
function goTo(t) { if (reduced) { T.t = t; applyTime(true); step(1 / FPS); } else T.target = t; }
const tap = fn => () => { userGesture = true; ensureAudio(); setTimeout(() => { fn(); if (reduced) step(1 / FPS); }, actx && actx.state !== 'running' ? 120 : 0); };
$('btnParade').addEventListener('click', tap(() => startParade(false)));
$('btnVigil').addEventListener('click', tap(() => startVigil(false)));
$('btnWeather').addEventListener('click', () => {
  userGesture = true; ensureAudio();
  wxI = (wxI + 1) % WX_LIST.length;
  $('btnWeather').textContent = '天氣：' + WX_LIST[wxI][1];
  if (reduced) { for (const k in wx) wx[k] = WX_LIST[wxI][0] === k ? 1 : 0; step(1 / FPS); }
});
$('btnSound').addEventListener('click', () => {
  soundOn = !soundOn; userGesture = true;
  $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  if (ensureAudio()) {
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.setValueAtTime(soundOn ? .5 : 0, actx.currentTime);
    if (!soundOn) { [musNode, sfxNode].forEach(n => { if (n) try { n.disconnect(); } catch (e) {} }); musNode = sfxNode = null; }
  }
  if (!soundOn) { try { window.sceneMusic && window.sceneMusic.stop(); } catch (e) {} }
});
$('btnDay').addEventListener('click', () => { T.auto = false; syncAuto(); goTo(16.5 / 24); });
$('btnNight').addEventListener('click', () => { T.auto = false; syncAuto(); goTo(21 / 24); });
$('btnAuto').addEventListener('click', () => { T.auto = !T.auto; T.target = null; syncAuto(); });
$('timeRange').addEventListener('input', e => {
  T.t = e.target.value / 1000; T.target = null; T.dragging = true; applyTime(true); T.dragging = false;
  if (reduced) step(1 / FPS);
});
function start() {
  cancelAnimationFrame(rafId);
  if (reduced) { T.auto = false; syncAuto(); applyTime(true); for (let i = 0; i < 12; i++) step(1 / FPS); }
  else { last = performance.now(); rafId = requestAnimationFrame(loop); }
}
mq.addEventListener?.('change', e => { reduced = e.matches; if (!reduced) { T.auto = true; syncAuto(); } start(); });

applyTime(true);
syncAuto();
step(1 / FPS);
start();

// 作者精選輪播：在網站精選區（pure 版、內嵌框）裡自動演出燭光守夜；音樂由網站的「聲音」按鈕透過 window.sceneMusic 開關
const inPicks = (() => { let top = true; try { top = window.top === window; } catch (e) { top = false; } return !!document.getElementById('pure-art') && !top; })();
if (inPicks) {
  let pickAudio = false;
  const useCtx = c => {
    actx = c;
    master = actx.createGain(); master.gain.value = soundOn ? .5 : 0;
    const comp = actx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3;
    master.connect(comp); comp.connect(actx.destination);
    sfxBus = actx.createGain(); sfxBus.connect(master);
    musBus = actx.createGain(); musBus.gain.value = .64; /* 音樂軌音量 ×0.64（2026-11-24 兩次各調降 20%） */ musBus.connect(master);
  };
  setTimeout(() => startVigil(true), 800);
  setInterval(() => { if (!show.on) { startVigil(true); if (pickAudio && audioOK()) { vigilMusic(actx.currentTime + .05); duckSfx(21); duckMusic(21); } } }, 4000);
  window.sceneMusic = {
    playing: false,
    start(c) {
      if (this.playing) return; this.playing = true; pickAudio = true; userGesture = true; soundOn = true;
      if (c && c !== actx) useCtx(c); else ensureAudio();
      if (actx && actx.state !== 'running') actx.resume();
      const go = () => { if (show.on === 'vigil' && show.t < 3 && audioOK()) { vigilMusic(actx.currentTime + .05); duckSfx(21); duckMusic(21); } };
      if (actx.state === 'running') go(); else actx.resume().then(go).catch(() => {});
    },
    stop() { this.playing = false; pickAudio = false; [musNode, sfxNode].forEach(n => { if (n) try { n.disconnect(); } catch (e) {} }); musNode = sfxNode = null; },
    duck() {}
  };
}
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on,
  btn: { parade: 'btnParade', vigil: 'btnVigil' },
  ff: () => { show.t = show.dur - .02; },
  save: () => ({ T: { ...T }, lit: candlesLit }),
  stop: () => endShow(),
  after: () => { parade.on = false; parade.members.forEach(A => { A.g.style.display = 'none'; A.done = true; }); },   // 遊行隊伍直接收走
  restore: s => { Object.assign(T, s.T); candlesLit = s.lit; syncAuto(); applyTime(true); }
});
/* /ShowStop */
})();
</script>
