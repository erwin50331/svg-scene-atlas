<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小孩堤防風車</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =========================================================
   SC-46 荷蘭小孩堤防風車｜印象派（短筆觸色點、破碎倒影）
   版面：單一寬版 SVG 舞台（1600×600）＋下方控制列
   ---------------------------------------------------------
   【色票 token】所有顏色集中在這裡，改這裡就能換色。
   寫成 --d-名稱（白天），可另加 --k-名稱（晨昏）與 --n-名稱（夜晚）。
   沒寫 --n- 的顏色，夜晚會自動混入 --night-tint 變暗變藍。
   JS 會依時間內插輸出 --名稱，並自動產生 .f-名稱（填色）、.s-名稱（描邊）。
   ========================================================= */
:root{
  color-scheme: dark;
  --night-tint:#141a3c;   /* 自動夜色：沒寫 --n- 的顏色會混入這個色 */

  /* —— 天空（荷蘭的大天空：底色漸層＋三種筆觸色） —— */
  --d-sky-top:#7eabdc;  --k-sky-top:#6c5ea4;  --n-sky-top:#0a1134;
  --d-sky-bot:#e9eef0;  --k-sky-bot:#ffb27a;  --n-sky-bot:#25305e;
  --d-sky-a:#a2c5e8;    --k-sky-a:#e8a888;    --n-sky-a:#17225a;
  --d-sky-b:#c6dbef;    --k-sky-b:#e2a0b0;    --n-sky-b:#283270;
  --d-sky-c:#b6bce4;    --k-sky-c:#9a7ec6;    --n-sky-c:#33296a;
  --d-cloud:#fffdf6;    --k-cloud:#ffd2a8;    --n-cloud:#394074;
  --d-cloud-sh:#b6bfd8; --k-cloud-sh:#b07aa6; --n-cloud-sh:#202454;
  --d-overcast:#8f98aa; --n-overcast:#12162e;   /* 陰雨天的罩色 */

  /* —— 遠景（地平線的樹林、農舍、教堂尖塔） —— */
  --d-far:#9fb6b0;      --k-far:#c99aa2;      --n-far:#202a50;
  --d-far-tree:#5f7f6e; --k-far-tree:#7a5a74; --n-far-tree:#141c3c;
  --d-haze:#dfe8ea;     --k-haze:#ffc6a0;     --n-haze:#222c58;

  /* —— 低地圩田（草地、堤岸、溝渠） —— */
  --d-grass:#7eab50;    --k-grass:#a69a52;    --n-grass:#16243a;
  --d-grass-2:#a9c95c;  --k-grass-2:#d8a86a;  --n-grass-2:#1e3044;
  --d-grass-3:#55873e;  --k-grass-3:#6e6a4a;  --n-grass-3:#0f1a30;
  --d-grass-hi:#dde88c; --k-grass-hi:#ffc884; --n-grass-hi:#2e4060;
  --d-grass-sh:#5a6a9a; --k-grass-sh:#6a4a7a; --n-grass-sh:#0a1026;   /* 紫藍色陰影筆觸（印象派招牌） */
  --d-path:#c8bca6;     --k-path:#e0b494;     --n-path:#2a3050;      /* 風車之間的步道 */
  --d-bike:#b4594a;     --k-bike:#c8664e;     --n-bike:#2c2440;      /* 前景的紅色自行車道 */
  --d-bike-2:#cf7c62;   --k-bike-2:#e8946a;   --n-bike-2:#3a3050;
  --d-reed:#a3a256;     --k-reed:#c8a060;     --n-reed:#1c2638;      /* 蘆葦 */
  --d-reed-2:#cdb874;   --k-reed-2:#f0b878;   --n-reed-2:#283048;
  --d-reed-tip:#7a5838;                                              /* 蘆葦穗 */

  /* —— 運河水面 —— */
  --d-water-top:#a9c6dc; --k-water-top:#e6a8a4; --n-water-top:#1a2456;
  --d-water-bot:#4d7c98; --k-water-bot:#5c5090; --n-water-bot:#070c2a;
  --d-water-a:#c2d9ea;  --k-water-a:#f8b488;  --n-water-a:#26306c;
  --d-water-b:#3b6782;  --k-water-b:#4c3e7e;  --n-water-b:#060a22;
  --d-water-c:#bcd3e2;  --k-water-c:#f094a8;  --n-water-c:#3a4086;
  --d-water-hi:#ffffff; --k-water-hi:#ffe0a8; --n-water-hi:#96a6e6;
  --d-ice:#e4eef4;      --k-ice:#f8d4c8;      --n-ice:#3a4678;       /* 結冰的運河 */
  --d-ice-2:#b4cadc;    --k-ice-2:#c9a0b4;    --n-ice-2:#28325e;
  --d-snow:#f7f9fb;     --k-snow:#ffe4d0;     --n-snow:#56608a;

  /* —— 風車：圓形磚造風車（Nederwaard）與八角形茅草風車（Overwaard） —— */
  --d-brick:#7c3c2e;    --k-brick:#8c3c34;    --n-brick:#1e1630;
  --d-brick-2:#9c5036;  --k-brick-2:#b0583e;  --n-brick-2:#2a1c38;
  --d-brick-hi:#d08a62; --k-brick-hi:#f09a6a; --n-brick-hi:#3c2c4c;
  --d-brick-sh:#4a2c44; --k-brick-sh:#4a2448; --n-brick-sh:#0e0a1e;
  --d-thatch:#7f7058;   --k-thatch:#8a6a5a;   --n-thatch:#1e1e34;    /* 蘆葦茅草 */
  --d-thatch-2:#9e8c6a; --k-thatch-2:#b4886a; --n-thatch-2:#2a2a42;
  --d-thatch-hi:#cbb68c; --k-thatch-hi:#f0c08c; --n-thatch-hi:#3c3c58;
  --d-thatch-sh:#4c4458; --k-thatch-sh:#4a3654; --n-thatch-sh:#0e0e20;
  --d-stock:#3e3432;    --n-stock:#0c0c18;     /* 風車翼的主桿與尾桿 */
  --d-lattice:#d6c8ac;  --k-lattice:#e8b894;  --n-lattice:#3a3c5c;   /* 翼格 */
  --d-cloth:#ebe0c8;    --k-cloth:#f8d2ac;    --n-cloth:#4a4c70;     /* 翼上的帆布 */
  --d-cap-wood:#2e2a2e; --n-cap-wood:#0a0a14;
  --d-trim:#f4f1e8;     --n-trim:#4a4e70;      /* 白色窗框 */
  --d-door:#2f6a4c;     --n-door:#0e1e24;      /* 綠色門 */
  --d-win:#283040;      --n-win:#0a0c1c;
  --d-wheel:#5a4436;    --n-wheel:#140f1c;     /* 排水輪與輪房 */
  --d-flag-r:#ae1c28;   --d-flag-w:#f6f6f2;   --d-flag-b:#21468b;   /* 荷蘭國旗 */

  /* —— 動物 —— */
  --d-cow-w:#f4f1ea;    --d-cow-b:#22222a;    --d-cow-nose:#e2a898;  /* 黑白花乳牛 */
  --d-heron:#a2aab2;    --d-heron-dk:#3a3e48; --d-heron-bill:#e0b040; /* 蒼鷺 */
  --d-swan:#fbfaf4;     --d-swan-sh:#c8ccd8;  --d-bill:#e8742a;     /* 疣鼻天鵝 */
  --d-cygnet:#a8a49c;
  --d-mallard:#1f6a3e;  --d-duck:#b0a28e;     --d-duck-f:#8c6a48;   /* 綠頭鴨 */
  --d-coot:#1d1d24;     --d-coot-w:#f4f4f0;   /* 白骨頂（黑水雞） */
  --d-goose:#6a645a;    --d-goose-w:#e8e4dc;  /* 灰雁 */
  --d-gull:#f4f4f2;     --d-dog:#c8904e;

  /* —— 船 —— */
  --d-boat:#f2f2ec;     --n-boat:#5a5e7c;     /* 電動導覽船 */
  --d-boat-trim:#2a4e72;
  --d-canopy:#e6e0d0;   --n-canopy:#3a3e5c;
  --d-canoe:#d8562e;    --d-paddle:#e8d6a8;

  /* —— 角色（服裝、自行車） —— */
  --d-skin-1:#f4d0aa; --d-skin-2:#dba57c; --d-skin-3:#a8744e; --d-skin-4:#6e4a34;
  --d-hair-1:#2a2026; --d-hair-2:#6a4228; --d-hair-3:#d8b06a; --d-hair-4:#d8d4cc;
  --d-shirt-1:#e2584c; --d-shirt-2:#3a86c8; --d-shirt-3:#f2c24e; --d-shirt-4:#3fa88a;
  --d-shirt-5:#9b6bd6; --d-shirt-6:#f08aa8; --d-shirt-7:#f4f0e6; --d-shirt-8:#2c3a5a;
  --d-orange:#f07a22;   /* 荷蘭橘 */
  --d-pants-1:#2c3550; --d-pants-2:#1c1a22; --d-pants-3:#c8b894;
  --d-miller:#2f4f86;   --d-cap:#1e2230;      /* 磨坊主的藍色工作服與帽子 */
  --d-frame-1:#1c1c22; --d-frame-2:#2e5a8a; --d-frame-3:#8a2a2a; --d-frame-4:#e8e2d4;   /* 自行車車架 */
  --d-tire:#1a1a1e;     --d-box:#7a5a3a;      /* 載貨單車的木箱 */
  --d-poncho-1:#f2c230; --d-poncho-2:#3a9ad8; --d-poncho-3:#e05a8a;   /* 騎車用雨衣 */
  --d-umb-1:#c8384a;    --d-umb-2:#2c4a8a;    --d-umb-3:#2a2a30;   --d-umb-4:#e8b83a;
  --d-scarf:#c83a3a;    --d-hat:#2a4a8a;
  --d-stall:#c83a36;    --d-stall-w:#f6f2e8;  --d-pot:#5a5a62;     /* 冰上點心攤 */
  --d-bench:#6a4a34;    --d-tripod:#2a2a30;

  /* —— 光源（不隨日夜變化） —— */
  --sun:#fff0c4;
  --sun-low:#ff9a52;
  --moon:#fff6dc;
  --star:#ffffff;
  --lamp:#ffd27a;
  --flood:#ffe2a8;      /* 點燈週的投射燈 */
  --win-on:#ffcf7a;
  --d-fog:#eef1f2;      --k-fog:#f6d0bc;      --n-fog:#3a4066;
  --d-rain:#e2e8f2;     --n-rain:#8a96ca;
  --d-wind:#ffffff;

  /* —— 頁面介面 —— */
  --page-bg:#121722; --page-fg:#f2efe8; --page-muted:#aab0bf;
  --ui-surface:#1b2130; --ui-line:#33405a; --ui-accent:#f2a43c; --ui-accent-2:#ffd36a;

  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}

/* ---------- 頁面版面 ---------- */
html,body{background:var(--page-bg);color:var(--page-fg);margin:0}
body{font-family:var(--font-ui)}
.wrap{max-width:1600px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.stage{margin:0;border:1px solid var(--ui-line);border-radius:10px;overflow:hidden;background:var(--n-sky-top);line-height:0}
#scene{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:var(--ui-surface);
  border:1px solid var(--ui-line);border-radius:10px;padding:10px 14px}
.panel button{font:500 14px/1 var(--font-ui);color:var(--page-fg);background:transparent;border:1px solid var(--ui-line);
  border-radius:999px;padding:9px 14px;cursor:pointer}
.panel button:hover{border-color:var(--ui-accent)}
.panel button[aria-pressed="true"]{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--page-bg);font-weight:700}
.panel button.big{border-color:var(--ui-accent);color:var(--ui-accent);font-weight:700}
.panel button.big2{border-color:var(--ui-accent-2);color:var(--ui-accent-2);font-weight:700}
.panel button.on{background:var(--ui-accent);color:var(--page-bg)}
.panel button.big2.on{background:var(--ui-accent-2)}
.panel button:focus-visible,.panel input:focus-visible{outline:2px solid var(--ui-accent-2);outline-offset:3px}
/* 畫面內可點物件：滑鼠點不顯示外框，用鍵盤 Tab 時才顯示 */
#scene [tabindex]:focus{outline:none}
body.kbd #scene [tabindex]:focus{outline:2px solid var(--ui-accent-2);outline-offset:3px}
.timebox{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px;color:var(--page-muted)}
.timebox input{width:min(240px,40vw);accent-color:var(--ui-accent)}
.clock{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--page-fg);min-width:3.2em}
.hint{margin:0;padding:0;list-style:none;color:var(--page-muted);font-size:14px;line-height:1.8;display:flex;flex-wrap:wrap;gap:4px 22px}

/* ---------- SVG 內的樣式 ---------- */
#scene .clickable,#scene [role="button"]{cursor:pointer}
#scene .deco,#scene #reflect,#scene #reflect *{pointer-events:none}
#scene .bubble path{fill:#fffaf0;stroke:#5a4a5a;stroke-width:1.4}
#scene .bubble text{fill:#2a1e2c;font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:central}
/* 天氣附屬物件：雪蓋、雨傘、雨衣的透明度由 JS 寫進 --snow-op、--rain-op */
#scene .snowcap,.snowcap{opacity:var(--snow-op,0)}
#scene .rainwear,.rainwear{opacity:var(--rain-op,0)}
#scene .drywear{opacity:calc(1 - var(--rain-op,0))}
</style>
<script id="site-motion">document.documentElement.setAttribute("data-scene-motion","");
/* =========================================================
   網站的「減少動態」開關（site-motion）
   - 只存在這個網站的 localStorage（atlas-motion = reduce / full），不改瀏覽器或系統設定。
   - 沒按過開關時完全照系統的「減少動態效果」設定。
   - 做法：讓 matchMedia("(prefers-reduced-motion…)") 與 CSS 的
     @media (prefers-reduced-motion…) 改聽網站設定，作品本身的程式不用改。
   - 下載的 HTML 檔會移除這段，單獨打開也照系統設定。
   ========================================================= */
(function () {
  var KEY = "atlas-motion";
  var RE = /\(\s*prefers-reduced-motion\s*(?::\s*(reduce|no-preference)\s*)?\)/gi;
  var YES = "(min-width:0px)", NO = "(max-width:0px) and (min-width:1px)";
  var realMM = window.matchMedia ? window.matchMedia.bind(window) : null;
  var sys = realMM ? realMM("(prefers-reduced-motion: reduce)") : { matches: false };

  function read() { try { var v = localStorage.getItem(KEY); return v === "reduce" || v === "full" ? v : null; } catch (e) { return null; } }
  var pref = read();
  function reduced() { return pref ? pref === "reduce" : !!sys.matches; }

  /* JS 端：matchMedia 改聽網站設定 */
  var fakes = [];
  if (realMM) window.matchMedia = function (q) {
    var s = String(q);
    if (!/prefers-reduced-motion/i.test(s)) return realMM(q);
    var calc = function () {
      if (!pref) return realMM(s).matches;
      return realMM(s.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; })).matches;
    };
    var ls = [], mq = {
      media: s, onchange: null,
      get matches() { return calc(); },
      addEventListener: function (t, f) { if (t === "change" && f) ls.push(f); },
      removeEventListener: function (t, f) { ls = ls.filter(function (x) { return x !== f; }); },
      addListener: function (f) { if (f) ls.push(f); },
      removeListener: function (f) { ls = ls.filter(function (x) { return x !== f; }); },
      dispatchEvent: function () { return false; },
      _fire: function () { var e = { matches: calc(), media: s }; ls.forEach(function (f) { try { f.call(mq, e); } catch (x) {} }); if (mq.onchange) try { mq.onchange(e); } catch (x) {} }
    };
    fakes.push(mq);
    return mq;
  };

  /* CSS 端：把 @media (prefers-reduced-motion…) 換成恆真／恆假條件 */
  function walk(rules) {
    for (var i = 0; rules && i < rules.length; i++) {
      var r = rules[i];
      if (r.media && r.cssRules) {
        if (r._rmOrig === undefined) r._rmOrig = /prefers-reduced-motion/i.test(r.media.mediaText) ? r.media.mediaText : null;
        if (r._rmOrig) {
          var t = pref ? r._rmOrig.replace(RE, function (m, v) { return (v && v.toLowerCase() === "no-preference") === !reduced() ? YES : NO; }) : r._rmOrig;
          if (r.media.mediaText !== t) r.media.mediaText = t;
        }
      }
      if (r.cssRules) walk(r.cssRules);
    }
  }
  function applyCss() {
    var sh = document.styleSheets;
    for (var i = 0; i < sh.length; i++) { try { walk(sh[i].cssRules); } catch (e) { /* 跨網域字型樣式表讀不到，略過 */ } }
  }
  applyCss();
  document.addEventListener("DOMContentLoaded", applyCss);
  window.addEventListener("load", applyCss);

  function changed() {
    applyCss();
    document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
    fakes.forEach(function (m) { m._fire(); });
  }
  document.documentElement.dataset.motion = reduced() ? "reduce" : "full";
  if (sys.addEventListener) sys.addEventListener("change", function () { if (!pref) changed(); });

  /* 網站主頁用：讀取／切換 */
  window.atlasMotion = {
    reduced: reduced,
    set: function (v) { pref = v === "reduce" || v === "full" ? v : null; try { pref ? localStorage.setItem(KEY, pref) : localStorage.removeItem(KEY); } catch (e) {} changed(); }
  };

  /* 作品頁：網站那邊切換後，作品重新載入套用（作品多半只在開場讀一次設定） */
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    var before = reduced(); pref = read();
    if (reduced() !== before && document.documentElement.hasAttribute("data-scene-motion")) location.reload();
    else changed();
  });
})();
</script>
</head>
<body>
<main class="wrap">

  <figure class="stage">
  <!-- =====================================================
       【場景】SVG 主畫布 1600×600，寬度自動縮放
       一點透視：兩排風車沿著兩條運河往遠方消失點（880,345）退去
       圖層由後到前：天空 → 地平線遠景 → 圩田草地與步道 → 乳牛
       → 運河水面、倒影、結冰 → 風車（由遠到近）→ 主運河上的船與水鳥
       → 前景堤岸、自行車道、行人 → 天氣 → 對話泡泡
       ===================================================== -->
  <svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice" role="img"
       aria-label="荷蘭小孩堤防風車群的印象派風景動畫：兩排古老風車沿著兩條長長的運河往遠方延伸，左邊是磚造圓形風車，右邊是蘆葦茅草覆蓋的八角形風車，帆布翼慢慢轉動；中間的圩田上有黑白花乳牛與步道，前景運河上有電動導覽船、獨木舟、天鵝與野鴨，堤岸的紅色自行車道上騎著單車的人來來往往，蘆葦叢裡站著一隻蒼鷺；天空與水面都由短筆觸畫成">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-top)"/>
        <stop offset="1" style="stop-color:var(--sky-bot)"/>
      </linearGradient>
      <linearGradient id="waterGrad" gradientUnits="userSpaceOnUse" x1="0" y1="345" x2="0" y2="548">
        <stop offset="0" style="stop-color:var(--water-top)"/>
        <stop offset="1" style="stop-color:var(--water-bot)"/>
      </linearGradient>
      <linearGradient id="iceGrad" gradientUnits="userSpaceOnUse" x1="0" y1="345" x2="0" y2="548">
        <stop offset="0" style="stop-color:var(--ice)"/>
        <stop offset="1" style="stop-color:var(--ice-2)"/>
      </linearGradient>
      <linearGradient id="hazeGrad" gradientUnits="userSpaceOnUse" x1="0" y1="330" x2="0" y2="420">
        <stop offset="0" style="stop-color:var(--haze);stop-opacity:.85"/>
        <stop offset="1" style="stop-color:var(--haze);stop-opacity:0"/>
      </linearGradient>
      <linearGradient id="fogGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--fog);stop-opacity:0"/>
        <stop offset=".5" style="stop-color:var(--fog);stop-opacity:.92"/>
        <stop offset="1" style="stop-color:var(--fog);stop-opacity:0"/>
      </linearGradient>
      <radialGradient id="glowGrad">
        <stop offset="0" style="stop-color:var(--lamp);stop-opacity:.9"/>
        <stop offset="1" style="stop-color:var(--lamp);stop-opacity:0"/>
      </radialGradient>
      <radialGradient id="floodGrad">
        <stop offset="0" style="stop-color:var(--flood);stop-opacity:.75"/>

<script id="showstop">
/* =========================================================
   ShowStop｜表演「再按一下優雅停止」共用模組（2026-11-24）
   用法：放在場景主程式 <script> 之前；主程式最後呼叫
     ShowStop.init({
       on:      () => show.on,                  // 表演中回傳真值（多種表演時回傳種類）
       ff:      () => { show.t = show.dur - .02; },  // （選用）快轉到結尾，讓場景下一幀自己收尾
       btn:     'btnShow' 或 { fire: 'btnFire', stars: 'btnStars' },
       save:    () => ({ ... }),                // 表演開始前記下使用者設定（日夜、天氣…）
       restore: s => { ... },                   // 停止時還原
       stop:    () => { endShow(); ... },       // 立刻結束表演、清掉秀中物件（有 ff 時：快轉後仍未結束才呼叫）
       after:   () => { ... },                  // （選用）最後再補的清理
     });
   停止時：畫面凍結成一張「殘影」疊在上面 1.8 秒淡出（底下已回到原狀），
           還沒響的表演音符取消、正在響的長音淡出，表演排程的計時器取消，
           #cineFx 燈光歸零。播放中按鈕顯示「■ 停止」。
   ========================================================= */
(function () {
  'use strict';
  const W = window;
  const FADE = 1.8;                      // 殘影淡出秒數
  let cfg = null, saved = null, epoch = 0, zone = 0, quiet = null;
  const reducedQ = W.matchMedia ? W.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const isOn = () => { try { return cfg ? cfg.on() : false; } catch (e) { return false; } };

  /* ---------- ① 計時器：記下「表演開始時排程」的 setTimeout / setInterval ---------- */
  const _st = W.setTimeout, _ct = W.clearTimeout, _si = W.setInterval, _ci = W.clearInterval;
  const zt = new Map();                  // id → { iv, keep }
  // 音訊收尾、泡泡移除這類「善後」計時器保留，其餘（放煙火、下一段劇情）停止時取消
  const KEEP = /\.remove\(\)|disconnect|duck|level\(|\.gain\b|removeChild|classList\.remove/;
  function wrapFn(fn, ep) {
    if (typeof fn !== 'function') return fn;
    return function () {
      if (ep !== epoch) return;          // 已被停止
      zone++; try { return fn.apply(this, arguments); } finally { zone--; }
    };
  }
  // 表演進行中排程的「台詞」（say／bubble／narr）也算表演的，停止時一起取消
  const LINE = /\b(say|bubble|narr)\(/;
  W.setTimeout = function (fn, ms, ...a) {
    if (!zone && !(cfg && typeof fn === 'function' && ms > 0 && LINE.test(String(fn)) && isOn())) return _st(fn, ms, ...a);
    let id; const keep = typeof fn === 'function' && KEEP.test(String(fn)) && String(fn).length < 400;
    const g = keep ? fn : wrapFn(fn, epoch);
    id = _st(function () { zt.delete(id); return g.apply(this, arguments); }, ms, ...a);
    zt.set(id, { iv: false, keep }); return id;
  };
  W.clearTimeout = function (id) { zt.delete(id); return _ct(id); };
  W.setInterval = function (fn, ms, ...a) {
    if (!zone) return _si(fn, ms, ...a);
    const id = _si(wrapFn(fn, epoch), ms, ...a); zt.set(id, { iv: true, keep: false }); return id;
  };
  W.clearInterval = function (id) { zt.delete(id); return _ci(id); };

  /* ---------- ② 聲音：記下表演期間排程的音符；停止時取消未響的、淡掉長音 ---------- */
  const srcs = new Set(); const outs = new WeakMap();
  const SN = W.AudioScheduledSourceNode && W.AudioScheduledSourceNode.prototype;
  if (SN) {
    const _start = SN.start, _stop = SN.stop;
    SN.start = function (when, ...a) {
      const c = this.context, now = c.currentTime;
      if (quiet) quiet.push(this);       // 停止過程中（快轉到結尾）冒出的聲音，稍後直接靜音
      this.__ss = { at: Math.max(now, when || 0), end: Infinity, show: !!(zone || isOn()) };
      if (this.__ss.show) { srcs.add(this); this.addEventListener('ended', () => srcs.delete(this)); }
      return _start.call(this, when, ...a);
    };
    SN.stop = function (when, ...a) {
      if (this.__ss) this.__ss.end = Math.max(this.context.currentTime, when || 0);
      return _stop.call(this, when, ...a);
    };
  }
  const AN = W.AudioNode && W.AudioNode.prototype;
  if (AN) {   // 所有接到喇叭的線都先經過一顆總音量，停止時可以短暫壓低長音
    const _conn = AN.connect;
    AN.connect = function (dest, ...a) {
      if (dest && dest === this.context.destination && !this.__ssOut) {
        let g = outs.get(this.context);
        if (!g) { g = this.context.createGain(); g.__ssOut = true; _conn.call(g, this.context.destination); outs.set(this.context, g); }
        return _conn.call(this, g, ...a);
      }
      return _conn.call(this, dest, ...a);
    };
  }
  function stopAudio() {
    let longs = [], ctx = null;
    for (const s of srcs) {
      const c = s.context, now = c.currentTime, m = s.__ss; ctx = c;
      if (!m || !m.show) continue;
      if (m.at > now + .02) { try { s.stop(); } catch (e) {} srcs.delete(s); }      // 還沒響：直接取消
      else if (isFinite(m.end) && m.end > now + 1.2) longs.push(s);                                     // 長音：淡掉再停
    }
    if (longs.length && ctx) {
      const g = outs.get(ctx), now = ctx.currentTime;
      if (g) {
        g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now);
        g.gain.linearRampToValueAtTime(0, now + 1.1); g.gain.setValueAtTime(0, now + 1.2);
        g.gain.linearRampToValueAtTime(1, now + 1.9);
      }
      longs.forEach(s => { try { s.stop(now + 1.15); } catch (e) {} srcs.delete(s); });
    }
    srcs.clear();
  }

  /* ---------- ③ 殘影：把目前畫面凍結複製一份疊上去再淡出 ---------- */
  let ghostCss = false;
  function ghost(svg) {
    if (!svg || reducedQ.matches) return;
    if (!ghostCss) {
      ghostCss = true;
      const st = document.createElement('style');
      st.textContent = '.ss-ghost,.ss-ghost *{animation-play-state:paused!important;pointer-events:none!important}.ss-ghost{position:absolute!important;margin:0!important;will-change:opacity;transition:opacity ' + FADE + 's cubic-bezier(.4,0,.2,1)}';
      document.head.appendChild(st);
    }
    const cl = svg.cloneNode(true);
    cl.classList.add('ss-ghost'); cl.removeAttribute('tabindex'); cl.setAttribute('aria-hidden', 'true');
    // 凍結色票：把目前的 CSS 變數抄到殘影上，底下換色不影響殘影
    const cs = getComputedStyle(svg);
    const names = new Set();
    for (let i = 0; i < cs.length; i++) if (cs[i].startsWith('--')) names.add(cs[i]);
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.style) for (const p of r.style) if (p.startsWith('--')) names.add(p); } catch (e) {}
    for (const p of document.documentElement.style) if (p.startsWith('--')) names.add(p);
    names.forEach(p => { const v = cs.getPropertyValue(p); if (v) cl.style.setProperty(p, v); });
    // 漸層、濾鏡等定義改名，殘影只用自己那份（凍結）
    const map = {};
    cl.querySelectorAll('[id]').forEach(e => { const n = e.id + '__ss'; map[e.id] = n; e.id = n; });
    cl.id = svg.id; delete map[svg.id];
    const fix = v => v.replace(/url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m);
    const all = cl.querySelectorAll('*'), orig = svg.querySelectorAll('*');
    let needCs = false;
    try { for (const sh of document.styleSheets) for (const r of sh.cssRules) if (r.cssText.includes('url(#') || r.cssText.includes('url("#')) { needCs = true; break; } } catch (e) {}
    for (let i = 0; i < all.length; i++) {
      const e = all[i];
      for (const a of e.attributes) {
        if (a.value.includes('url(')) e.setAttribute(a.name, fix(a.value));
        else if ((a.name === 'href' || a.name === 'xlink:href') && a.value[0] === '#' && map[a.value.slice(1)]) e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
      }
      if (needCs && orig[i]) {
        const o = getComputedStyle(orig[i]);
        for (const p of ['fill', 'stroke', 'filter', 'clip-path', 'mask']) { const v = o.getPropertyValue(p); if (v && v.includes('url(')) e.style.setProperty(p, fix(v.replace(/url\("?[^#")]*#/g, 'url(#').replace(/"\)/g, ')'))); }
      }
    }
    const par = svg.parentElement;
    if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
    const r = svg.getBoundingClientRect(), pr = par.getBoundingClientRect();
    Object.assign(cl.style, { left: (r.left - pr.left + par.scrollLeft - par.clientLeft) + 'px', top: (r.top - pr.top + par.scrollTop - par.clientTop) + 'px', width: r.width + 'px', height: r.height + 'px', opacity: 1 });
    svg.after(cl);
    try { cl.pauseAnimations && cl.pauseAnimations(); } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { cl.style.opacity = 0; }));
    _st(() => cl.remove(), FADE * 1000 + 300);
  }

  /* ---------- ④ 秀中冒出的說話泡泡：停止時一起收掉 ---------- */
  let added = [];
  const mo = W.MutationObserver ? new MutationObserver(ms => { if (!isOn()) return; for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n); }) : null;
  const BUB = /bubble|say|speech|talk|tip/i;
  function clearBubbles() {
    if (mo) for (const m of mo.takeRecords()) for (const n of m.addedNodes) if (n.nodeType === 1) added.push(n);
    added.forEach(n => {
      if (!n.isConnected || n.closest('.ss-ghost')) return;
      const p = n.parentElement;
      if (BUB.test(n.getAttribute('class') || '') || (p && BUB.test((p.id || '') + ' ' + (p.getAttribute('class') || '')))) n.remove();
    });
    added = [];
  }

  /* ---------- ⑤ 停止 ---------- */
  let stopping = false;
  function cancel() {
    if (stopping) return; stopping = true;
    const svg = cfg.svg ? document.querySelector(cfg.svg) : (document.getElementById('scene') || document.querySelector('svg'));
    try { ghost(svg); } catch (e) {}
    epoch++;
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { stopAudio(); } catch (e) {}
    quiet = [];
    zone++;   // 收尾過程中（快轉那幾幀、stop、restore）排出的計時器，例如散場後的鳴笛、煙火，最後一起取消
    // ff：把表演時間快轉到結尾，讓場景自己的收尾邏輯跑完一幀（殘影蓋著看不到），再補 stop
    if (cfg.ff) {
      try { cfg.ff(); } catch (e) { console.warn('ShowStop ff', e); }
      let n = 0; const wait = () => { if (isOn() && n++ < 8) requestAnimationFrame(wait); else finish(); };
      requestAnimationFrame(wait);
    } else finish();
  }
  function finish() {
    try { if (isOn() || !cfg.ff) cfg.stop && cfg.stop(); } catch (e) { console.warn('ShowStop stop', e); }
    try { if (typeof W.setCine === 'function') W.setCine(0); } catch (e) {}
    try { if (cfg.cine) cfg.cine(); } catch (e) {}
    if (saved && cfg.restore) { try { cfg.restore(saved); } catch (e) { console.warn('ShowStop restore', e); } }
    saved = null;
    clearBubbles();
    (quiet || []).forEach(s => { try { s.stop(); } catch (e) {} }); quiet = null;
    zone = Math.max(0, zone - 1);
    for (const [id, z] of zt) if (!z.keep) { z.iv ? _ci(id) : _ct(id); zt.delete(id); }
    try { cfg.after && cfg.after(); } catch (e) {}
    // 背景配樂（scene-bgm）表演時被壓小聲：停止後很快恢復
    try { if (W.sceneMusic && W.sceneMusic.playing) W.sceneMusic.duck(.3); } catch (e) {}
    stopping = false;
    sync();
  }

  /* ---------- ⑥ 按鈕：開始時記下設定；表演中再按＝停止；文字顯示「■ 停止」 ---------- */
  const btns = [];
  function btnFor(kind) {
    if (!kind) return null;
    if (typeof cfg.btn === 'string') return document.getElementById(cfg.btn);
    const id = cfg.btn[kind] || cfg.btn['*']; return id ? document.getElementById(id) : null;
  }
  function sync() {
    const k = isOn(), act = btnFor(k);
    btns.forEach(b => {
      const st = b === act, txt = cfg.label || '■ 停止';
      if (st && b.disabled) b.disabled = false;   // 有些作品表演中會把按鈕停用，這裡讓它能按「停止」
      // 作品自己改了按鈕文字（例如收場時換成下一個特效名稱）就記下來，結束時還原成它
      if (b.classList.contains('ss-stop') && b.textContent !== txt) { b.__ssLabel = b.innerHTML; if (st) b.textContent = txt; }
      if (st && !b.classList.contains('ss-stop')) {
        b.__ssLabel = b.innerHTML; b.classList.add('ss-stop');
        b.textContent = cfg.label || '■ 停止'; b.title = '再按一下停止表演';
      } else if (!st && b.classList.contains('ss-stop')) {
        b.classList.remove('ss-stop'); b.innerHTML = b.__ssLabel; b.removeAttribute('title');
      }
    });
  }
  function loop() { sync(); requestAnimationFrame(loop); }

  W.ShowStop = {
    init(c) {
      cfg = c;
      const ids = typeof c.btn === 'string' ? [c.btn] : Object.values(c.btn);
      [...new Set(ids)].forEach(id => {
        const b = document.getElementById(id); if (!b) return;
        b.__ssLabel = b.innerHTML; btns.push(b);
        b.addEventListener('click', e => {
          const k = isOn();
          if (k && btnFor(k) === b) {
            e.stopImmediatePropagation(); e.preventDefault();
            if (e.isTrusted || c.allowSynthetic) cancel();
            return;
          }
          if (!k) {
            if (c.save) { try { saved = c.save(); } catch (er) { saved = null; } }
            epoch++; zone++; added = [];
            // 這次點擊同步排出的計時器都算表演的（點擊處理完就關掉）
            let done = false; const off = () => { if (!done) { done = true; zone = Math.max(0, zone - 1); W.removeEventListener('click', off); } };
            W.addEventListener('click', off); _st(off, 0);
          }
        }, true);
      });
      if (mo) { const s = c.svg ? document.querySelector(c.svg) : (document.getElementById('scene') || document.querySelector('svg')); if (s) mo.observe(s, { childList: true, subtree: true }); }
      requestAnimationFrame(loop);
    },
    cancel: () => { if (isOn()) cancel(); },
    get saved() { return saved; }
  };
})();
</script>
<script>
/* =========================================================
   SC-46 荷蘭小孩堤防風車｜程式區
   區塊：①工具與色票
         ②場景（天空、地平線、圩田與步道、運河與倒影、結冰、風車、堤岸）
         ③角色（磨坊主、乳牛、蒼鷺、天鵝、野鴨、白骨頂、導覽船、獨木舟、
               騎單車的人、散步的人、溜冰的人、雁群）
         ④動畫（主迴圈、日夜、天氣、風、兩場秀）
         ⑤互動（點擊、滑鼠吹風、聲音、控制列）

(() => {
'use strict';

/* ---------------- ① 工具 ---------------- */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const root = document.documentElement;
const svg = $('scene');
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

const srand = (a = 0, b = 1) => { seed = (seed * 16807) % 2147483647; return a + (seed / 2147483647) * (b - a); };
const spick = a => a[Math.floor(srand(0, a.length - 1e-9))];
const f1 = n => (Math.round(n * 10) / 10).toString();
function el(tag, attrs = {}, parent) {

/* ---------- 印象派筆觸工具 ----------
   strokes()：把很多短筆觸合併成一條 path（效能好）
   dabs()：在取樣範圍內隨機撒筆觸，依材質分組上色 */
function strokes(parent, cls, segs, w, op) {
  if (!segs.length) return null;
  let d = '';

}
function wpick(list) {
  let sum = 0; for (const m of list) sum += m[1];

  for (const m of list) { r -= m[1]; if (r <= 0) return m[0]; }

// 梯形取樣：y0（上）到 y1（下），半寬 hw0 → hw1，cx 中心

/* ---------------- ① 色票：讀取、配對、日夜內插 ---------------- */
const css = n => getComputedStyle(root).getPropertyValue(n).trim();

/* ---------- 構圖幾何（改這裡可調整透視） ----------
   一點透視：消失點 VP，主運河對岸 BANK、近岸 NEAR。

/* =========================================================

/* ---- 天空：星星、筆觸、雲 ---- */
const stars = [], clouds = [];
function drawSky() {
  for (let k = 0; k < 3; k++) {
    const g = el('g', {}, $('stars'));
    for (let i = 0; i < 26; i++) el('circle', { cx: f1(srand(0, 1600)), cy: f1(srand(0, 300)), r: f1(srand(.6, 1.6)), style: 'fill:var(--star)' }, g);

  dabs($('skyDabs'), 620, skyP, [['sky-a', 3], ['sky-b', 2], ['sky-c', 1.3]], [16, 34], p => srand(-16, -2) * (1 - p[1] / 520), 7, .42);

/* ---- 地平線：遠方的樹林、農舍、教堂尖塔 ---- */

  const mats = [['grass-2', 2], ['grass-3', 1.4], ['grass-hi', .5], ['grass-sh', .12], ['grass', 1.6]];

/* ---- 運河水面、筆觸、倒影、結冰 ---- */
const shimmer = [];

/* ---- 風車 ----
   圓形磚造風車（左排，Nederwaard）與八角形茅草風車（右排，Overwaard）
   都是「落地式」風車：翼尖幾乎掃到地面，磨坊主站在地上就能收放帆布。
   每座風車：尾桿與絞盤（把風帽轉向迎風）、側邊的排水輪、門窗、茅草風帽、四片翼。
   翼從正面看是「逆時針」轉。 */
const mills = [];

function makeSails(g, hx, hy, R) {
  const outer = el('g', { transform: `translate(${hx} ${hy}) scale(.84 1)` }, g);
  const rot = el('g', {}, outer);
  const W = R * .19, r0 = R * .2;
  const cloths = [];
  for (let k = 0; k < 4; k++) {
    const a = el('g', { transform: `rotate(${k * 90})` }, rot);
    // 帆布：用 scale 控制張開多少（從主桿往外展開）
    const cg = el('g', { transform: 'translate(2.5 0)' }, a);
    const c = el('rect', { x: 0, y: -R, width: f1(W), height: f1(R - r0), class: 'f-cloth' }, cg);
    el('rect', { x: f1(W * .72), y: -R, width: f1(W * .28), height: f1(R - r0), class: 'f-lattice', opacity: .35 }, cg);
    cloths.push(cg);
    // 翼格（木格子）
    let d = `M2.5 ${-R}H${f1(2.5 + W)}V${f1(-r0)}H2.5`;
    for (let yy = -R + 12; yy < -r0; yy += 12) d += `M2.5 ${f1(yy)}H${f1(2.5 + W)}`;
    d += `M${f1(2.5 + W / 2)} ${-R}V${f1(-r0)}`;
    P(a, d, 's-lattice', { 'stroke-width': 1.7 });
    // 前緣板與主桿
    el('rect', { x: -6.5, y: -R, width: 4, height: f1(R - r0 - 4), class: 'f-lattice', opacity: .9 }, a);
    el('rect', { x: -2.4, y: -R - 6, width: 4.8, height: R + 6, class: 'f-stock' }, a);
  }
  el('circle', { r: 7.5, class: 'f-cap-wood' }, rot);
  el('circle', { r: 2.5, class: 'f-lattice' }, rot);
  return { rot, cloths };
}
function drawMill(kind, x, y, s, row, i) {
  const id = 'mill' + mills.length;
  const g = el('g', { id, transform: `translate(${f1(x)} ${f1(y)}) scale(${s.toFixed(3)})` }, $('mills'));
  const round = kind === 'round';
  // 點燈週的投射燈光暈（預設看不見）
  const glow = el('g', { opacity: 0 }, g);
  el('ellipse', { cx: 0, cy: -120, rx: 130, ry: 175, fill: 'url(#floodGrad)' }, glow);
  el('ellipse', { cx: 0, cy: -2, rx: 90, ry: 14, fill: 'url(#floodGrad)' }, glow);
  const hy = round ? -198 : -188, R = round ? 166 : 160;
  // 尾桿（往後斜插到地面）與絞盤
  P(g, `M14 ${hy + 10}L76 -4M20 ${hy + 46}L60 -30M76 -4L60 -30`, 's-stock', { 'stroke-width': 4.2, 'stroke-linecap': 'round' });
  const kr = el('g', { transform: 'translate(74 -12)' }, g);
  el('circle', { r: 9, class: 's-stock', 'stroke-width': 2 }, kr);
  P(kr, 'M-9 0H9M0 -9V9M-6 -6L6 6M-6 6L6 -6', 's-stock', { 'stroke-width': 1.2 });
  // 排水輪：把低處圩田的水舀進較高的運河

function svgPoint(e) { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; const m = svg.getScreenCTM(); return m ? p.matrixTransform(m.inverse()) : { x: 0, y: 0 }; }
function skyClick(x, y) {

const mouse = { x: -999, y: -999, lx: 0, ly: 0, lt: 0, on: false, v: 0, lastRip: 0 };
function onMove(e) {

  if (v > 250) {

/* ---------------- ④ 動畫：主迴圈 ---------------- */
let last = performance.now(), colorAcc = 0, lastSnow = -1, lastRain = -1;

  if (canoe.x > 1750 && canoe.dir > 0) canoe.dir = -1; else if (canoe.x < -150 && canoe.dir < 0) canoe.dir = 1;
  canoe.ph += dt * (canoe.sprint > 0 ? 9 : 3.2) * mv;
  canoe.pads.forEach((p, i) => p.setAttribute('transform', `translate(${i ? 10 : -10} -9) rotate(${f1(Math.sin(canoe.ph + i * .6) * 32)})`));
  canoe.g.setAttribute('transform', `translate(${f1(canoe.x)} ${f1(canoe.y)})`);
  canoe.inner.setAttribute('transform', `scale(${canoe.dir * canoe.s} ${canoe.s})`);

  // 溜冰的人（同一條冰道速度相同，不會撞在一起）
  skaters.forEach(s => {
    s.x = wrap(s.x + s.dir * s.sp * dt * mv * (ice > .5 ? 1 : 0));
    s.ph += dt * 3.4 * mv;
    s.spin = Math.max(0, (s.spin || 0) - dt);
    const fx = s.spin > 0 ? Math.cos(s.spin * Math.PI * 2) : 1;
    skatePose(s.p, s.ph);
    s.g.setAttribute('transform', `translate(${f1(s.x)} ${s.y}) scale(${f1(s.dir * s.s * fx)} ${s.s})`);
    s.g.setAttribute('opacity', f1(ice));
    s.g.style.display = ice < .03 ? 'none' : '';
  });
  stall.g.setAttribute('opacity', f1(ice)); stall.g.style.display = ice < .03 ? 'none' : '';
  if (ice > .5 && mv && Math.random() < dt * 4) particle(1250 + rand(-6, -3), 476, 'var(--fog)', rand(-4, 4), rand(-22, -14), 1.6, 2, { g: -2, grow: 5, op: .6 });

  // 自行車道
  riderLanes.forEach(L => L.list.forEach(r => {
    r.x = wrap(r.x + L.dir * L.sp * dt * mv);
    r.ph += L.sp / 11 * dt * mv;
    pedal(r.r, r.ph);
    const s = L.s * r.k;
    r.g.setAttribute('transform', `translate(${f1(r.x)} ${L.y + (S.cheer && r.k < 1 ? 0 : 0)}) scale(${f1(L.dir * s * 100) / 100} ${f1(s * 100) / 100})`);
  }));
  walkers.list.forEach(w => {
    w.x = wrap(w.x + walkers.dir * walkers.sp * dt * mv);
    w.ph += dt * 5 * mv;
    w.ps.forEach((p, i) => walkPose(p, w.ph + i * 1.3, 4.5));
    if (w.ps.dogLegs) w.ps.dogLegs.setAttribute('transform', `skewX(${f1(Math.sin(w.ph * 2) * 18)})`);
    w.wave = Math.max(0, (w.wave || 0) - dt);
    if (w.wave > 0) w.ps[0].arm.setAttribute('transform', `translate(1 -36) rotate(${f1(-150 + Math.sin(time * 12) * 20)})`);
    w.g.setAttribute('transform', `translate(${f1(w.x)} ${walkers.y}) scale(${f1(walkers.dir * walkers.s * 100) / 100} ${walkers.s})`);
  });

  // 前景的人
  miller.wave = Math.max(0, miller.wave - dt);
  miller.p.arm.setAttribute('transform', `translate(1 -36) rotate(${miller.wave > 0 || S.cheer ? f1(-150 + Math.sin(time * 10) * 20) : 0})`);
  family.throwT = Math.max(0, family.throwT - dt);
  family.kid.arm.setAttribute('transform', `translate(1 -36) rotate(${f1(family.throwT > 0 ? -160 * Math.sin(Math.PI * clamp(family.throwT / .6, 0, 1)) : S.cheer ? -150 + Math.sin(time * 10) * 20 : 0)})`);
  photog.flash = Math.max(0, photog.flash - dt);
  bench.wave = Math.max(0, bench.wave - dt);
  bench.arms.forEach((a, i) => a.setAttribute('transform', bench.wave > 0 || S.cheer ? `rotate(${f1(-130 + Math.sin(time * 9 + i) * 18)} ${i ? 14 : -6} -28)` : ''));

  // 蒼鷺
  stepHeron(dt, mv);

  // 雁群
  for (let i = birds.length - 1; i >= 0; i--) {
    const b = birds[i]; b.t += dt;
    b.x += b.vx * dt * mv; b.y += b.vy * dt * mv;
    if (b.t > b.life || b.x < -200 || b.x > 1800) { b.g.remove(); birds.splice(i, 1); continue; }
    b.g.setAttribute('transform', `translate(${f1(b.x)} ${f1(b.y)}) scale(${f1((b.vx < 0 ? -1 : 1) * b.k)} ${b.k})`);
    b.wing.setAttribute('transform', `scale(1 ${f1(Math.sin(time * 7 + b.ph) * mv || .6)})`);
  }

  // 補間、粒子
  for (let i = tweens.length - 1; i >= 0; i--) { const tw = tweens[i]; tw.t += dt; const k = clamp(tw.t / tw.dur, 0, 1); tw.fn(k); if (k >= 1) { tweens.splice(i, 1); tw.done && tw.done(); } }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt;
    if (p.life <= 0) { p.n.remove(); parts.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.y > p.floor) { p.y = p.floor; p.vy *= -.3; p.vx *= .6; }
    const k = p.life / p.max;
    p.n.setAttribute('cx', f1(p.x)); p.n.setAttribute('cy', f1(p.y)); p.n.setAttribute('r', f1(p.r + (1 - k) * p.grow));
    p.n.setAttribute('opacity', f1(Math.min(1, k * 2) * p.op));
  }
}
function stepHeron(dt, mv) {
  const h = heron;
  if (h.mode === 'stand') {
    h.strike = Math.max(0, h.strike - dt);
    if (mv && h.strike <= 0 && Math.random() < dt * .08) h.strike = 1.2;
    const a = h.strike > 0 ? Math.sin(Math.PI * h.strike / 1.2) * 60 : 0;
    h.neck.setAttribute('transform', `translate(12 -40) rotate(${f1(-a)})`);
    h.g.setAttribute('transform', `translate(${h.x} ${h.y})`);
    return;
  }
  h.t += dt * Math.max(mv, 1);
  const D = 7, k = clamp(h.t / D, 0, 1), ang = Math.PI * k;
  const x = h.x - 340 * Math.sin(ang), y = h.y - 24 - 150 * Math.sin(ang) + (k > .9 ? (k - .9) * 240 : 0);
  const dx = -340 * Math.cos(ang);
  h.fly.setAttribute('transform', `translate(${f1(x - h.x)} ${f1(y - h.y)}) scale(${dx < 0 ? 1 : -1} 1) rotate(${f1(Math.cos(ang) * -8)})`);
  h.wing.setAttribute('transform', `translate(0 -3) scale(1 ${f1(Math.sin(time * 11))}) translate(0 3)`);
  h.g.setAttribute('transform', `translate(${h.x} ${h.y})`);
  if (k >= 1) { h.mode = 'stand'; h.stand.setAttribute('opacity', 1); h.fly.setAttribute('opacity', 0); }
}

/* ---- 霧氣帶 ---- */
const fogBands = [];
function drawFog() {
  [[300, 110, .95], [372, 120, .8], [440, 120, .6], [520, 100, .45]].forEach(([y, h, o]) => fogBands.push(el('rect', { x: -120, y, width: 1840, height: h, fill: 'url(#fogGrad)', opacity: o }, $('fog'))));
}

/* ---------------- ⑤ 互動：綁定 ---------------- */
function bindAll() {
  onAct($('sunG'), () => { sfx('chime'); if (show.on) endShow(true); setTime(22); });
  onAct($('moonG'), () => { sfx('chime'); if (show.on) endShow(true); setTime(11); });
  $('skyHit').addEventListener('click', e => { userGesture = true; ensureAudio(); const p = svgPoint(e); skyClick(p.x, p.y); });
  $('skyHit').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); userGesture = true; ensureAudio(); skyClick(800, 150); } });
  onAct($('waterHit'), e => {
    const p = e.clientX ? svgPoint(e) : { x: 800, y: 520 };
    if (wx.ice > .5) { sfx('scrape'); for (let i = 0; i < 8; i++) particle(p.x, p.y, 'var(--snow)', rand(-40, 40), rand(-50, -10), .8, 1.6, { g: 120 }); return; }
    ripple(p.x, p.y, 1); setTimeout(() => ripple(p.x, p.y, .7), 220); sfx('plop');
  });
  mills.forEach(m => { clickable(m.g, (m.kind === 'round' ? '磚造圓形風車' : '茅草八角形風車') + '：張開帆布轉起來，或收帆煞車'); onAct(m.g, () => millClick(m)); });
  onAct(miller.g, () => { miller.wave = 2; sfx('hello'); say(206, 390, pick(['我就住在這座風車裡', '排水輪把圩田的水舀進運河', '看風向，轉動風帽']), 2.2); });
  cows.forEach(c => onAct(c.g, () => { c.up = 2.2; sfx('moo'); }));
  const [dk, sw, ct] = waterBirds;
  onAct(dk.g, () => { sfx('quack'); dk.kids.forEach((k, i) => setTimeout(() => { k.dive = 1.6; }, i * 180)); });
  onAct(sw.g, () => { sfx('flap'); sw.kids.forEach(k => { if (!k.cyg) k.flap = 2.2; }); });
  onAct(ct.g, () => { sfx('splash'); ct.rush = 1.6; });
  onAct(boat.g, () => { sfx('ding'); boat.wave = 2.6; say(boat.x, boat.y - 70, '大家好！', 1.4); });
  onAct(canoe.g, () => { sfx('splash'); canoe.sprint = 2.2; });
  onAct(stall.g, () => { sfx('ding'); say(1250, 420, '熱巧克力，暖暖身子', 2); for (let i = 0; i < 6; i++) particle(1238 + rand(-4, 4), 476, 'var(--fog)', rand(-6, 6), rand(-30, -18), 1.6, 2.4, { g: -3, grow: 6, op: .7 }); });
  skaters.forEach(s => onAct(clickable(s.g, '溜冰的人：轉一圈'), () => { s.spin = 1; sfx('scrape'); }));
  riderLanes.forEach(L => L.list.forEach(r => onAct(r.g, () => { sfx('bell'); say(r.x, L.y - 76, '叮鈴叮鈴！', 1.2); })));
  walkers.list.forEach(w => onAct(w.g, () => {
    if (w.kind === 'pair') { sfx('woof'); say(w.x - 40, walkers.y - 40, '汪！', 1); }
    else if (w.kind === 'cam') { sfx('shutter'); w.wave = 1.4; const f = el('circle', { cx: w.x - 6, cy: walkers.y - 40, r: 4, fill: '#fff' }, $('fx')); tween(.35, k => { f.setAttribute('r', f1(4 + k * 14)); f.setAttribute('opacity', f1(1 - k)); }, () => f.remove()); }
    else { sfx('hello'); w.wave = 1.6; say(w.x, walkers.y - 76, 'Hallo!', 1.4); }
  }));
  onAct(family.g, () => {
    family.throwT = .6; sfx('plop');
    for (let i = 0; i < 6; i++) particle(452, 520, 'var(--d-path)', rand(-60, -10), rand(-90, -40), 1, 1.8, { g: 260, floor: 535 + rand(-10, 10) });
    sw.lure = 5; sw.lureX = 470; say(470, 470, '天鵝游過來了！', 1.8);
  });
  onAct(photog.g, () => {
    sfx('shutter'); photog.flash = .4;
    const f = el('circle', { cx: 893, cy: 532, r: 4, fill: '#fff' }, $('fx'));
    tween(.35, k => { f.setAttribute('r', f1(4 + k * 18)); f.setAttribute('opacity', f1(1 - k)); }, () => f.remove());
  });
  onAct(bench.g, () => { bench.wave = 2; sfx('hello'); say(1190, 474, 'Mooi, hè?（好美吧）', 2); });
  onAct(heron.g, () => {
    if (heron.mode !== 'stand') return;
    sfx('croak'); setTimeout(() => sfx('flap'), 300);
    heron.mode = 'fly'; heron.t = 0; heron.stand.setAttribute('opacity', 0); heron.fly.setAttribute('opacity', 1);
  });
  svg.addEventListener('pointermove', onMove);
  svg.addEventListener('pointerleave', () => { mouse.on = false; });

  $('btnShow').addEventListener('click', () => { userGesture = true; ensureAudio(); startShow('mill'); });
  $('btnLights').addEventListener('click', () => { userGesture = true; ensureAudio(); startShow('lights'); });
  $('btnWeather').addEventListener('click', () => { userGesture = true; ensureAudio(); setWeather((wxIdx + 1) % WX.length); });
  $('btnSound').addEventListener('click', () => {
    soundOn = !soundOn; userGesture = true; ensureAudio();
    if (master) master.gain.setValueAtTime(soundOn ? .55 : 0, actx.currentTime);
    if (!soundOn) { stopAll(); ambient('rain', false); ambient('wind', false); try { window.sceneMusic && window.sceneMusic.stop(); } catch (e) {} }
    else { ambient('rain', WX[wxIdx][0] === 'rain'); ambient('wind', WX[wxIdx][0] === 'wind'); }
    $('btnSound').setAttribute('aria-pressed', String(soundOn)); $('btnSound').textContent = soundOn ? '🔊 聲音：開' : '🔇 聲音：關';
  });
  $('btnDay').addEventListener('click', () => { if (show.on) endShow(true); setTime(11); });
  $('btnDusk').addEventListener('click', () => { if (show.on) endShow(true); setTime(18.8); });
  $('btnNight').addEventListener('click', () => { if (show.on) endShow(true); setTime(22); });
  $('btnAuto').addEventListener('click', () => { T.auto = !T.auto; $('btnAuto').setAttribute('aria-pressed', String(T.auto)); });
  const tr = $('timeRange');
  tr.addEventListener('input', () => { if (show.on) endShow(true); T.dragging = true; T.t = tr.value / 1000; applyColors(true); });
  tr.addEventListener('change', () => { T.dragging = false; });
  window.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
  window.addEventListener('pointerdown', () => document.body.classList.remove('kbd'));
  mq.addEventListener && mq.addEventListener('change', () => { reduced = mq.matches; });
}

/* ---------------- 初始化 ---------------- */
function init() {
  drawSky();
  drawFar();
  drawLand();
  drawPathFolk();
  drawCows();
  drawWater();
  drawMills();
  drawMiller();
  drawCanal();
  drawNear();
  drawNearPeople();
  drawRiders();
  drawFog();
  // 點燈用的暖色：白天色票再混一點投射燈的暖黃
  const fl = hex(css('--flood'));
  LITK.forEach(k => { LITC[k] = mix(mix(PAIRS[k].d, PAIRS[k].n, .25), fl, .32); });
  waterBirds.forEach(b => { b.init = b.dir; });
  bindAll();
  if (reduced) { T.auto = false; $('btnAuto').setAttribute('aria-pressed', 'false'); }
  setWeather(0);
  applyColors(true);
  step(1 / 60);
  requestAnimationFrame(loop);
}
init();
/* ShowStop：再按一下優雅停止表演（共用模組在上方 <script id="showstop">） */
ShowStop.init({
  on: () => show.on && show.kind,
  btn: { mill: 'btnShow', lights: 'btnLights' },
  save: () => ({ t: T.t, auto: T.auto, w: wxIdx }),
  stop: () => { endShow(true); lightsOffAt = -1; },
  restore: s => { if (wxIdx !== s.w) setWeather(s.w); T.t = s.t; T.auto = s.auto; $('btnAuto') && $('btnAuto').setAttribute('aria-pressed', String(T.auto)); applyColors(true); }
});
/* /ShowStop */
})();
</script>
